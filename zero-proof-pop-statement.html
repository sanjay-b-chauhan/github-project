<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>POP · fluid morph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Google Sans Flex';src:local('Google Sans Flex'),local('GoogleSansFlex'),local('Google Sans');font-weight:1 1000;font-display:swap}
:root{
  --font:'Google Sans Flex','Inter',-apple-system,system-ui,sans-serif;
  --green:#49ba61; --bad:#e5533d;
  --r-card:30px; --r-tile:24px; --pill:999px;
  /* shell pad 20px so options/content sit clearly INSIDE the container (not edge
     to edge); text gets a touch more inset for hierarchy; larger gaps for air */
  --pad-card:20px; --pad-tight:13px; --pad-content:6px; --gap:22px;
  /* motion */
  --ease-out:cubic-bezier(.22,1,.36,1);
  --ease:cubic-bezier(.625,.05,0,1);
  /* subtle spring with damping (CSS linear() = real spring feel, no lib) */
  --spring:linear(0,0.006,0.025 2.8%,0.101 6.1%,0.539 18.9%,0.721 25.3%,0.849,0.937 34.6%,0.968,0.991,1.006 43%,1.014,1.017 48%,1.017,1.013,1.006 58%,0.995 63%,0.991,0.988,0.99 77%,1.001 85%,1.004,1.002 97%,1);
  --app:#ececec; --app-2:#f6f6f6; --app-ink:#1c1c1c; --app-ink2:#8c8c8c; --app-line:#dedede;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--app);color:var(--app-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.012em;overflow:hidden}

.app{position:relative;height:100dvh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:16px;padding:22px 30px;z-index:5}
.back{width:52px;height:52px;border-radius:50%;background:var(--app-2);border:1px solid var(--app-line);display:grid;place-items:center;cursor:pointer;flex:none}
.back svg{width:20px;height:20px;color:var(--app-ink)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--app-ink2);font-weight:500}
.htitle{font-size:18px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.spacer{flex:1}
.level{display:flex;align-items:center;gap:10px}
.level .ring{width:50px;height:50px;position:relative;display:grid;place-items:center}
.level .ring svg{position:absolute;inset:0;width:100%;height:100%}
.level .ring .star{width:22px;height:22px;color:#1c1c1c}
.level .lbl small{display:block;font-size:11px;letter-spacing:.14em;color:var(--app-ink2);font-weight:600}
.level .lbl b{font-size:18px;font-weight:700;letter-spacing:-.02em}

.stage{position:relative;flex:1;margin:0 30px 20px;border-radius:28px;overflow:hidden;border:1px solid var(--app-line);isolation:isolate;background:#0e0e0e}
.video{position:absolute;inset:0;background:linear-gradient(135deg,#232323,#101010 62%),radial-gradient(60% 60% at 30% 20%,rgba(255,255,255,.05),transparent 70%);
  opacity:0;transform:scale(1.05);transition:opacity .9s var(--ease-out),transform 1.1s var(--ease-out),filter .5s var(--ease-out)}
.stage.ready .video{opacity:1;transform:none}
.video .fakeui{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.12);font-size:clamp(28px,5vw,58px);font-weight:700;letter-spacing:-.03em}
.video.dim{filter:blur(7px) brightness(.7)}
.scrim{position:absolute;inset:0;background:rgba(10,9,8,0);pointer-events:none;transition:background .45s var(--ease-out);z-index:2}
.scrim.on{background:rgba(10,9,8,.5)}

.rail{position:absolute;left:26px;right:26px;bottom:22px;height:26px;display:flex;align-items:center;z-index:3;
  opacity:0;transform:translateY(16px);transition:opacity .7s .35s var(--ease-out),transform .7s .35s var(--ease-out)}
.stage.ready .rail{opacity:1;transform:none}
.rail .line{position:absolute;left:9px;right:9px;height:3px;border-radius:3px;background:rgba(255,255,255,.16)}
.rail .fill{position:absolute;left:9px;height:3px;border-radius:3px;background:rgba(255,255,255,.6);width:0;transition:width .6s var(--ease)}
.rail .mk{position:absolute;top:50%;transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50%;
  background:#3a352f;border:2px solid rgba(255,255,255,.35);cursor:pointer;transition:transform .3s var(--spring),background .3s,border-color .3s;z-index:1}
.rail .mk:hover{transform:translate(-50%,-50%) scale(1.15)}
.rail .mk.done{background:var(--green);border-color:var(--green)}
.rail .mk.active{background:#fff;border-color:#fff}
.rail .mk.hot{transform:translate(-50%,-50%) scale(0);opacity:.001} /* hidden while its POP is open (POP is the grown circle) */
.rail .play{position:absolute;top:50%;transform:translate(-50%,-50%);width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(0,0,0,.25);z-index:2;left:0;transition:left .55s var(--ease)}

/* ---------------- the POP (grows from the marker circle) ---------------- */
.poplayer{position:absolute;inset:0;z-index:4;pointer-events:none}
.pop{position:absolute;width:340px;pointer-events:auto;
  background:var(--pop-surface);border:1px solid var(--pop-line);box-shadow:var(--pop-shadow);
  padding:var(--pad-card);display:flex;flex-direction:column;align-items:center;gap:var(--gap);text-align:center;
  will-change:transform,border-radius;
  /* seed = a small circle sitting on the marker */
  opacity:0;border-radius:50%;transform:scale(.11)}
.pop.wide{width:480px}
.pop.show{opacity:1;border-radius:var(--r-card);transform:scale(1);
  transition:transform .85s var(--spring),border-radius .62s var(--ease-out),opacity .24s var(--ease-out)}
.pop.closing{opacity:0;border-radius:50%;transform:scale(.11);
  transition:transform .5s var(--ease),border-radius .5s var(--ease),opacity .34s .12s var(--ease-out)}
.pop.shake{animation:shake .52s var(--ease)}
@keyframes shake{10%,90%{transform:translateX(-2px) scale(1)}20%,80%{transform:translateX(4px) scale(1)}30%,50%,70%{transform:translateX(-7px) scale(1)}40%,60%{transform:translateX(7px) scale(1)}}
/* no green outline — a soft scale celebrate instead */
.pop.win{animation:winpop .6s var(--spring)}
@keyframes winpop{0%{transform:scale(1)}34%{transform:scale(1.022)}100%{transform:scale(1)}}

/* the content blurs in from high blur to zero as the card lands */
.pop .body{display:flex;flex-direction:column;align-items:center;gap:var(--gap);width:100%;padding-top:var(--pad-content);
  filter:blur(18px);opacity:0;transform:scale(.96)}
.pop.show .body{filter:blur(0);opacity:1;transform:none;
  transition:filter .62s .16s var(--ease-out),opacity .46s .16s var(--ease-out),transform .62s .16s var(--spring)}

/* green ripple celebration — soft green blurs rise from bottom to top, clipped to the card */
.pop .fx{position:absolute;inset:0;border-radius:inherit;overflow:hidden;z-index:0;pointer-events:none}
.pop .body{position:relative;z-index:1}
.gblob{position:absolute;left:50%;bottom:-30%;width:80%;height:72%;border-radius:50%;
  background:radial-gradient(circle,rgba(73,186,97,.62),rgba(73,186,97,0) 68%);filter:blur(24px);
  transform:translate(-50%,30%) scale(.55);opacity:0;will-change:transform,opacity}
.gblob.go{animation:greenrise 1.05s var(--ease-out) forwards}
@keyframes greenrise{0%{transform:translate(-50%,38%) scale(.55);opacity:0}
  22%{opacity:.95}56%{opacity:.75}100%{transform:translate(-50%,-108%) scale(1.35);opacity:0}}

/* POP themes (neutral) */
.pop[data-pop="dark"]{--pop-bg:#242424;--pop-ink:#f4f4f4;--pop-ink2:rgba(244,244,244,.5);--pop-line:rgba(255,255,255,.09);
  /* container + primary button are tactile (gradient + top/bottom highlights + shadow);
     answer options (MCQ / multi / drag-drop) stay outline-only, transparent + hairline */
  --pop-surface:linear-gradient(180deg,#2d2d2d,#1e1e1e);
  --pop-shadow:inset 0 1.5px 0 rgba(255,255,255,.10),inset 0 -1px 0 rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.4),0 42px 92px -28px rgba(0,0,0,.78);
  --btn-bg:transparent;--btn-surface:transparent;--btn-ink:#f4f4f4;--btn-line:rgba(255,255,255,.17);--btn-shadow:none;
  --pri-bg:#ededed;--pri-surface:linear-gradient(180deg,#fcfcfc,#e2e2e2);--pri-ink:#1e1e1e;
  --pri-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -2px 3px rgba(0,0,0,.12),0 5px 14px rgba(0,0,0,.44);
  --field:rgba(255,255,255,.07);color:var(--pop-ink)}
.pop[data-pop="light"]{--pop-bg:#f3f3f3;--pop-ink:#1e1e1e;--pop-ink2:rgba(30,30,30,.5);--pop-line:rgba(0,0,0,.06);
  /* container + primary button are tactile; answer options stay outline-only */
  --pop-surface:linear-gradient(180deg,#f7f7f8,#f0f0f1);
  --pop-shadow:inset 0 1px 0 rgba(255,255,255,1),0 1px 3px rgba(0,0,0,.05),0 40px 90px -30px rgba(0,0,0,.34);
  --btn-bg:transparent;--btn-surface:transparent;--btn-ink:#1e1e1e;--btn-line:rgba(0,0,0,.15);--btn-shadow:none;
  --pri-bg:#1a1a1a;--pri-surface:linear-gradient(180deg,#2c2c2e,#101011);--pri-ink:#f3f3f3;
  --pri-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 1px 2px rgba(0,0,0,.22),0 7px 18px -4px rgba(0,0,0,.38);
  --field:rgba(0,0,0,.04);color:var(--pop-ink)}

.visual{width:54px;height:54px;border-radius:50%;overflow:hidden;flex:none;display:grid;place-items:center;background:radial-gradient(120% 120% at 30% 20%,#6d6d6d,#383838);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.3),inset 0 -3px 6px rgba(0,0,0,.38),0 6px 14px rgba(0,0,0,.3)}
.visual svg{width:31px;height:31px;color:rgba(255,255,255,.92)}
.q{font-size:19px;font-weight:600;line-height:1.25;letter-spacing:-.03em;max-width:20ch;padding-inline:var(--pad-content)}
.hint{font-size:13px;color:var(--pop-ink2);margin-top:-8px;padding-inline:var(--pad-content)}
/* no-icon POPs (the majority): the question is the hero — give it more top air and size */
.body.noicon{padding-top:12px}
.body.noicon .q{font-size:22px;line-height:1.24;max-width:18ch}

.row{display:flex;gap:12px;width:100%}
.stack{display:flex;flex-direction:column;gap:10px;width:100%}
.btn{font-family:var(--font);font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--btn-ink);
  background:var(--btn-surface);border:1px solid var(--btn-line);border-radius:var(--r-tile);box-shadow:var(--btn-shadow);
  padding:var(--pad-tight) 16px;min-height:48px;cursor:pointer;transition:transform .16s var(--ease-out),box-shadow .16s var(--ease-out),filter .16s,background .16s,border-color .16s,color .16s;
  display:flex;align-items:center;gap:9px;justify-content:center}
.row .btn{flex:1;border-radius:var(--pill)}
.stack .btn{justify-content:flex-start;text-align:left}
.btn:not(.primary):hover{background:var(--field)}
.btn.primary:hover{transform:translateY(-1px);filter:brightness(1.08)}
.btn:active{transform:translateY(1px) scale(.996)}
.btn.primary{background:var(--pri-surface);color:var(--pri-ink);border-color:transparent;box-shadow:var(--pri-shadow)}
.btn .tick{width:18px;height:18px;border-radius:50%;border:1.5px solid currentColor;opacity:.35;flex:none;display:grid;place-items:center}
.btn .tick svg{width:11px;height:11px;opacity:0;transform:scale(.4);transition:.18s var(--spring)}
.btn.sel{border-color:var(--pop-ink)}
.btn.sel .tick{opacity:1;background:var(--pop-ink);color:var(--pop-bg);border-color:var(--pop-ink)}
.btn.sel .tick svg{opacity:1;transform:scale(1)}
/* subtle, premium result states: a low-opacity tint + a coloured outline, not a loud solid fill */
.btn.correct{background:color-mix(in srgb,var(--green) 16%,transparent)!important;color:var(--green)!important;border-color:color-mix(in srgb,var(--green) 55%,transparent)!important}
.btn.correct .tick{opacity:1;background:transparent;color:var(--green);border-color:var(--green)}
.btn.correct .tick svg{opacity:1;transform:scale(1)}
.btn.wrong{background:color-mix(in srgb,var(--bad) 16%,transparent)!important;color:var(--bad)!important;border-color:color-mix(in srgb,var(--bad) 46%,transparent)!important}
/* CTA / primary buttons stay FILLED in their result state — a filled button never gets an outline */
.btn.primary.correct{background:var(--green)!important;color:#fff!important;border-color:transparent!important}
.btn.primary.wrong{background:var(--bad)!important;color:#fff!important;border-color:transparent!important}
.btn.locked{pointer-events:none}
.confirm{width:100%;border-radius:var(--pill)}

.slider-wrap{width:100%}
.readout{font-size:36px;font-weight:700;letter-spacing:-.03em;text-align:center;font-variant-numeric:tabular-nums}
.readout small{font-size:19px;color:var(--pop-ink2)}
.slider{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;margin:14px 0 6px;background:var(--field);outline:none}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--pop-ink);cursor:pointer;border:4px solid var(--pop-bg);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--pop-ink2);font-variant-numeric:tabular-nums}

.cloze{font-size:18px;font-weight:600;line-height:1.75;letter-spacing:-.02em}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:96px;height:38px;margin:0 3px;padding:0 10px;vertical-align:middle;border-bottom:2px solid var(--pop-ink);color:var(--pop-ink);font-size:16px;cursor:pointer;border-radius:7px 7px 0 0;transition:.16s}
.slot.empty{color:var(--pop-ink2);border-bottom-color:var(--pop-line)}
.slot.filled{background:var(--field)}
.slot.correct{border-bottom-color:var(--green);color:var(--green);background:color-mix(in srgb,var(--green) 12%,transparent)}
.slot.wrong{border-bottom-color:var(--bad);color:var(--bad)}
.bank{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.word{font-family:var(--font);background:var(--btn-surface);border:1px solid var(--btn-line);border-radius:var(--pill);padding:10px 16px;color:var(--pop-ink);font-size:14px;font-weight:600;cursor:pointer;transition:transform .16s var(--ease-out),background .16s,border-color .16s}
.word:hover{background:var(--field)}
.word:active{transform:translateY(1px)}

/* ---- rank: drag to reorder ---- */
.ranklist{display:flex;flex-direction:column;gap:10px;width:100%}
.rankrow{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:12px 16px;border-radius:var(--r-tile);
  border:1px solid var(--btn-line);color:var(--btn-ink);background:var(--btn-surface);font-size:15px;font-weight:600;cursor:grab;text-align:left;white-space:nowrap;
  transition:background .16s,border-color .16s,box-shadow .16s var(--ease-out)}
.rankrow .rgrip{display:grid;color:var(--pop-ink2);flex:none}
.rankrow .rgrip svg{width:18px;height:18px}
.rankrow .rnum{margin-left:auto;font-size:12px;color:var(--pop-ink2);font-variant-numeric:tabular-nums}
.rankrow.dragging{opacity:.92;cursor:grabbing;background:var(--field);box-shadow:0 12px 28px -10px rgba(0,0,0,.55)}
.rankrow.done{background:color-mix(in srgb,var(--green) 15%,transparent);border-color:color-mix(in srgb,var(--green) 52%,transparent);color:var(--green)}

/* ---- sort: drag into buckets ---- */
.sortchips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;width:100%;min-height:22px}
.buckets{display:flex;gap:12px;width:100%}
.bucket{flex:1;min-height:104px;border-radius:var(--r-tile);border:1px dashed var(--btn-line);padding:12px;display:flex;flex-direction:column;gap:8px;align-items:center;transition:border-color .16s,background .16s}
.bucket.over{border-color:var(--pop-ink);background:var(--field)}
.bhead{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--pop-ink2)}
.chip{font-family:var(--font);background:var(--btn-surface);border:1px solid var(--btn-line);border-radius:var(--pill);padding:9px 15px;font-size:14px;font-weight:600;color:var(--pop-ink);cursor:grab;white-space:nowrap}
.chip.dragging{opacity:.6}
.chip.ok{border-color:color-mix(in srgb,var(--green) 52%,transparent);color:var(--green);background:color-mix(in srgb,var(--green) 14%,transparent)}
.chip.no{border-color:color-mix(in srgb,var(--bad) 46%,transparent);color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}

/* ---- match: tap to connect pairs, with a drawn link line ---- */
.matchwrap{display:flex;gap:44px;width:100%;position:relative}
.mlines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible}
.matchcol{flex:1;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
.mitem{min-height:46px;padding:11px 16px;border-radius:var(--r-tile);border:1px solid var(--btn-line);color:var(--btn-ink);background:var(--btn-surface);font-size:14px;font-weight:600;cursor:pointer;text-align:center;white-space:nowrap;transition:border-color .16s,color .16s,background .16s,box-shadow .16s}
.mitem.sel{border-color:var(--pop-ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--pop-ink) 12%,transparent)}
.mitem.linked{border-color:var(--lc,var(--pop-ink))}
.mitem.rok{border-color:color-mix(in srgb,var(--green) 50%,transparent);color:var(--green);background:color-mix(in srgb,var(--green) 12%,transparent)}
.mitem.wrongflash{border-color:color-mix(in srgb,var(--bad) 52%,transparent);color:var(--bad)}
.word.used{opacity:.35;pointer-events:none}

.celebrate{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;color:var(--green)}
.check{width:22px;height:22px;border-radius:50%;background:var(--green);display:grid;place-items:center}
.check svg{width:13px;height:13px;color:#fff}
.check svg path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .5s .05s var(--ease-out) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pop .tries{position:absolute;top:-14px;left:50%;opacity:0;transform:translateX(-50%) translateY(-6px);
  background:var(--pop-bg);border:1px solid var(--pop-line);border-radius:var(--pill);padding:7px 16px;
  font-size:12.5px;font-weight:600;color:var(--pop-ink2);white-space:nowrap;z-index:4;
  box-shadow:0 12px 26px -12px rgba(0,0,0,.5);transition:opacity .32s var(--ease-out),transform .48s var(--spring)}
.pop .tries.in{opacity:1;transform:translateX(-50%) translateY(0)}
/* success: pill turns into the reward; miss: a soft acknowledgement — never appended at the bottom */
.pop .tries.xp{color:var(--green);font-weight:700;border-color:color-mix(in srgb,var(--green) 42%,transparent);background:color-mix(in srgb,var(--green) 14%,var(--pop-bg))}
.pop .tries.miss{color:var(--pop-ink2)}
/* inner green glow rising from the bottom edge = the correct signal (no bottom content) */
.pop .fx.glow{animation:innerglow 1.25s var(--ease-out)}
@keyframes innerglow{0%{box-shadow:inset 0 -14px 34px -20px rgba(73,186,97,0)}
  30%{box-shadow:inset 0 -70px 82px -30px rgba(73,186,97,.92)}
  100%{box-shadow:inset 0 -78px 100px -30px rgba(73,186,97,0)}}

.controls{position:absolute;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:20}
.ctl{font-size:13px;font-weight:600;background:var(--app-2);border:1px solid var(--app-line);border-radius:var(--pill);padding:10px 16px;color:var(--app-ink);cursor:pointer;display:flex;align-items:center;gap:7px}
.ctl:hover{border-color:#c9c2b6}
.ctl svg{width:15px;height:15px}
.ctl.on{background:#1c1c1c;color:#fff;border-color:#1c1c1c}
.ctl.next{background:#1c1c1c;color:#fff;border-color:#1c1c1c;padding-right:14px}
.debug{position:fixed;top:96px;left:30px;z-index:40;background:#1c1c1c;color:#f4f4f4;border-radius:16px;padding:14px;width:206px;box-shadow:0 22px 54px -16px rgba(0,0,0,.55)}
.debug .dhead{font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8c8c8c;font-size:11px;margin-bottom:10px}
.debug .drow{display:flex;gap:6px;margin-bottom:6px}
.debug button{flex:1;font-family:var(--font);font-size:12px;font-weight:600;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:11px;padding:9px 6px;color:#f4f4f4;cursor:pointer;transition:background .15s}
.debug button:hover{background:rgba(255,255,255,.17)}
.debug .dinfo{margin-top:9px;color:#8c8c8c;font-size:11px;font-variant-numeric:tabular-nums}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:20}

/* ---------------- gallery (all POPs × dark/light) ---------------- */
.gallery{position:fixed;inset:0;z-index:50;background:#0c0c0c;display:none;flex-direction:column}
.gallery.open{display:flex}
.galbar{display:flex;align-items:center;gap:12px;padding:20px 26px;border-bottom:1px solid rgba(255,255,255,.08);flex:none}
.galtitle{color:#f4f4f4;font-weight:700;font-size:16px;letter-spacing:-.02em}
.galtitle small{display:block;font-weight:500;font-size:12px;color:#8c8c8c;letter-spacing:0}
.galsp{flex:1}
.galgrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:26px;padding:30px}
.gcell{display:flex;flex-direction:column;align-items:center;gap:12px}
.gcap{color:#8c8c8c;font-size:12px;letter-spacing:.02em;text-transform:uppercase;font-weight:600}
/* gallery POPs are static, fully-shown, non-interactive previews */
.gcell .pop.gpop{position:relative!important;inset:auto!important;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;
  width:100%!important;max-width:360px;transform:none!important;opacity:1!important;border-radius:var(--r-card)!important;
  transition:none!important;animation:none!important;pointer-events:none}
.gcell .pop.gpop .body{filter:none!important;opacity:1!important;transform:none!important;transition:none!important}
.gcell .pop.gpop.wide{max-width:480px}
.gcell .pop.gpop .tries{display:none}

@media(prefers-reduced-motion:reduce){.pop,.pop.show,.pop .body,.pop.show .body,.video,.rail{transition:none!important;animation:none!important;filter:none!important;transform:none!important;opacity:1!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <div class="back" aria-label="Back"><svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div><div class="eyebrow">Kickoff</div><div class="htitle">Create a 1-page brief.</div></div>
    <div class="spacer"></div>
    <div class="level">
      <div class="ring">
        <svg viewBox="0 0 50 50" fill="none"><circle cx="25" cy="25" r="22" stroke="rgba(0,0,0,.1)" stroke-width="3"/><path d="M25 3a22 22 0 0 1 16 37" stroke="#1c1c1c" stroke-width="3" stroke-linecap="round"/></svg>
        <svg class="star" viewBox="0 0 24 24" fill="none"><path d="M12 2l2.4 6.3L21 9.8l-5 4.2 1.6 6.6L12 17l-5.6 3.6L8 14 3 9.8l6.6-1.5L12 2z" fill="#1c1c1c"/></svg>
      </div>
      <div class="lbl"><small>LEVEL</small><b>02</b></div>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="video" id="video"><div class="fakeui">concept playing…</div></div>
    <div class="scrim" id="scrim"></div>
    <div class="poplayer" id="poplayer"></div>
    <div class="rail" id="rail"><div class="line"></div><div class="fill" id="fill"></div><div class="play" id="play"></div></div>
  </div>

  <div class="controls">
    <button class="ctl" id="themeBtn"></button>
    <button class="ctl on" id="soundBtn"></button>
    <button class="ctl next" id="nextBtn">Next <svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="ctl" id="replayBtn"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12a8 8 0 1 1 2.3 5.6M4 12V7m0 5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Restart</button>
    <button class="ctl" id="galleryBtn">See all</button>
    <button class="ctl" id="debugBtn">Debug</button>
  </div>

  <div class="debug" id="debug" hidden>
    <div class="dhead">Debug</div>
    <div class="drow"><button data-a="correct">✓ Correct</button><button data-a="wrong">✗ Wrong</button></div>
    <div class="drow"><button data-a="green">Green FX</button><button data-a="theme">Theme</button></div>
    <div class="drow"><button data-a="prev">‹ Prev</button><button data-a="next">Next ›</button></div>
    <div class="drow"><button data-a="replay">Replay entrance</button></div>
    <div class="dinfo" id="dinfo"></div>
  </div>
</div>
<canvas class="confetti" id="confetti"></canvas>

<div class="gallery" id="gallery">
  <div class="galbar">
    <div class="galtitle">POP gallery<small>every type, in dark and light</small></div>
    <div class="galsp"></div>
    <button class="ctl" id="galCloseBtn">Close</button>
  </div>
  <div class="galgrid" id="galGrid"></div>
</div>

<script>
const $=(s,e=document)=>e.querySelector(s), $$=(s,e=document)=>[...e.querySelectorAll(s)];
const ICON={
  check:'<svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  person:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-4 0-7 2-7 5v1h14v-1c0-3-3-5-7-5z"/></svg>',
  target:'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3.2" fill="currentColor"/></svg>',
  bolt:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4.5 13.5H11l-1 8.5L19.5 10H13V2z"/></svg>',
  scale:'<svg viewBox="0 0 24 24" fill="none"><path d="M4 18h16M7 18V9m5 9V5m5 13v-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  pen:'<svg viewBox="0 0 24 24" fill="none"><path d="M4 20l4-1L20 7l-3-3L5 16l-1 4z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>',
  sunmoon:'<svg viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>',
  vol:'<svg viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 9a3 3 0 0 1 0 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
  mute:'<svg viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M17 10l4 4m0-4l-4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
  grip:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>'
};

/* sound */
let AC=null, sound=true;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function beep(fr,dur,type='sine',vol=.12){if(!sound)return;const c=ac();if(!c)return;if(c.state==='suspended')c.resume();
  fr.forEach((f,i)=>{const t=c.currentTime+i*.09;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(c.destination);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.start(t);o.stop(t+dur+.02);});}
const sndOpen=()=>beep([523.25],.14,'sine',.05);
const sndRight=()=>{beep([659.25,783.99,1046.5],.5,'sine',.13);beep([1318.5],.4,'triangle',.05);};
const sndWrong=()=>beep([196,155.56],.22,'square',.09);

/* confetti */
const cv=$('#confetti'),cxx=cv.getContext('2d');let parts=[],raf=0;
function resize(){cv.width=innerWidth;cv.height=innerHeight;}resize();addEventListener('resize',resize);
function confetti(x,y){const cols=['#49ba61','#7fd39a','#fff','#c9c2b6','#3aa855'];
  for(let i=0;i<80;i++){const a=Math.random()*Math.PI*2,sp=5+Math.random()*8;parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-5,g:.26,life:1,rot:Math.random()*6,vr:(Math.random()-.5)*.5,w:5+Math.random()*6,h:7+Math.random()*7,c:cols[i%cols.length]});}
  if(!raf)tick();}
function tick(){cxx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.rot+=p.vr;p.life-=.012;cxx.save();cxx.globalAlpha=Math.max(0,p.life);cxx.translate(p.x,p.y);cxx.rotate(p.rot);cxx.fillStyle=p.c;cxx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cxx.restore();});
  if(parts.length)raf=requestAnimationFrame(tick);else{raf=0;cxx.clearRect(0,0,cv.width,cv.height);}}

/* content — a few different POP types to step through */
const TYPES=[
 {type:'binary',visual:'person',q:'Are we clear who this is for?',xp:40,opts:[{t:'Not yet'},{t:'Yes',ok:1,primary:1}]},
 {type:'single',q:'What are we really solving for here?',xp:60,opts:[{t:'Costs we already carry',ok:1},{t:'More revenue this quarter'},{t:'Fewer people on the team'},{t:'A bigger market to sell into'}]},
 {type:'multi',q:'Pick the efficiency moves that fit.',xp:70,opts:[{t:'Automate a repeated step',ok:1},{t:'Open new stores'},{t:'Cut the obvious waste',ok:1},{t:'Hire more staff'},{t:'Reuse what we already built',ok:1}]},
 {type:'single',q:'Which number goes in the deck?',xp:50,opts:[{t:'One exact figure'},{t:'A directional range',ok:1},{t:'A best-and-worst case'},{t:'No number yet'}]},
 {type:'slider',visual:'scale',q:'12 of 40 hours freed. What share?',xp:60,target:30,tol:5},
 {type:'cloze',q:'Fill the gap.',xp:70,text:['Same','output','for less','cost'],slots:['output','cost'],bank:['revenue','output','effort','cost']},
 {type:'single',q:'Where does the biggest win come from?',xp:60,opts:[{t:'Doing less, better',ok:1},{t:'Doing more, faster'}]},
 {type:'multi',q:'What belongs in the one-pager?',xp:80,opts:[{t:'The problem',ok:1},{t:'Your salary'},{t:'The recommendation',ok:1},{t:'A rough timeline',ok:1}]},
 {type:'rank',q:'Order the steps, first to last.',xp:90,items:['Understand the problem','Explore the options','Recommend one','Present it']},
 {type:'sort',q:'Keep it or cut it?',xp:90,cats:['Keep','Cut'],items:[{t:'The recommendation',cat:0},{t:'Your salary',cat:1},{t:'The key metric',cat:0},{t:'Every raw number',cat:1}]},
 {type:'match',q:'Match each term to its pair.',xp:90,pairs:[{l:'Revenue',r:'Money in'},{l:'Cost',r:'Money out'},{l:'Margin',r:"What's left"}]},
];

/* rail markers (one per type) */
const rail=$('#rail'); let MARKS=[];
function layoutMarks(){ rail.querySelectorAll('.mk').forEach(m=>m.remove());
  MARKS = TYPES.map((_,i)=> 0.14 + i*(0.72/(TYPES.length-1)) );
  MARKS.forEach((f,i)=>{const m=document.createElement('div');m.className='mk';m.style.left=`calc(9px + ${f} * (100% - 18px))`;m.dataset.i=i;m.onclick=()=>jump(i);rail.appendChild(m);});
}
const marks=()=>$$('.mk',rail);
function setPlayhead(f){ $('#play').style.left=`calc(${f} * 100%)`; $('#fill').style.width=`calc(${f} * (100% - 18px))`; }

let idx=-1, popTheme='dark', busy=false;
function markerCenter(i){const m=marks()[i],s=$('#stage').getBoundingClientRect(),r=m.getBoundingClientRect();return {x:r.left+r.width/2-s.left,y:r.top+r.height/2-s.top};}

function buildBody(pop,t){
  const body=document.createElement('div'); body.className='body'+(t.visual?'':' noicon');
  const vis = t.visual ? `<div class="visual">${ICON[t.visual]||ICON.person}</div>` : '';
  body.innerHTML = vis+(t.q?`<div class="q">${t.q}</div>`:'');
  pop.appendChild(body);
  builders[t.type](body,pop,t);
}

/* grow the POP out of the marker circle */
function openPop(i){
  idx=i; const t=TYPES[i];
  const layer=$('#poplayer'); layer.innerHTML='';
  const pop=document.createElement('div'); pop.className='pop'; pop.dataset.pop=popTheme; pop._tries=0;
  if(['rank','sort','match'].includes(t.type))pop.classList.add('wide');   // wider so labels never wrap
  const fx=document.createElement('div'); fx.className='fx'; pop.appendChild(fx);
  buildBody(pop,t); layer.appendChild(pop);
  const c=markerCenter(i), s=$('#stage').getBoundingClientRect();
  const w=pop.offsetWidth, left=Math.max(16,Math.min(c.x-w/2, s.width-w-16));
  const GAP=46; // sit the POP a little higher above the marker
  pop.style.left=left+'px'; pop.style.bottom=(s.height-c.y+GAP)+'px';
  pop.style.transformOrigin=`${c.x-left}px calc(100% + ${GAP}px)`; // grow from the marker point
  marks()[i].classList.add('active','hot');   // hide the marker; the POP is now the grown circle
  $('#video').classList.add('dim'); $('#scrim').classList.add('on');
  void pop.offsetWidth;
  pop.classList.add('show'); sndOpen();
}
/* shrink back into the marker (damped morph), then continue */
function closePop(good, cb){
  const pop=$('.pop'); const cur=idx;
  if(pop){ pop.classList.remove('show'); pop.classList.add('closing'); }
  marks()[cur].classList.remove('active','hot'); if(good) marks()[cur].classList.add('done');
  setTimeout(()=>{ if(pop)pop.remove();
    if(!$('.pop')){ $('#video').classList.remove('dim'); $('#scrim').classList.remove('on'); }
    cb&&cb();
  },380);
}

function next(){ if(busy)return; busy=true;
  const n=(idx+1)%TYPES.length;
  closePop(false, ()=>{ setPlayhead(MARKS[n]); setTimeout(()=>{ openPop(n); busy=false; },520); });
}
function jump(i){ if(busy||i===idx)return; busy=true;
  closePop(false, ()=>{ setPlayhead(MARKS[i]); setTimeout(()=>{ openPop(i); busy=false; },420); });
}

/* ---------------- type builders ---------------- */
const builders={};
function el(t,c){const e=document.createElement(t);e.className=c;return e;}
function btn(txt,primary){const b=document.createElement('button');b.className='btn'+(primary?' primary':'');if(txt)b.textContent=txt;return b;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
/* the row a dragged item should be inserted before, based on pointer Y */
function afterRow(list,y){const rows=[...list.querySelectorAll('.rankrow:not(.dragging)')];
  return rows.reduce((closest,row)=>{const box=row.getBoundingClientRect();const off=y-box.top-box.height/2;
    return (off<0&&off>closest.offset)?{offset:off,el:row}:closest;},{offset:-Infinity,el:null}).el;}
function shake(pop){sndWrong();pop.classList.remove('shake');void pop.offsetWidth;pop.classList.add('shake');}
/* top pill — the ONLY status surface. Becomes "One more try" / "Nice try" /
   "+NN XP"; it sits above the card so nothing is ever appended at the bottom. */
function pill(pop,txt,cls){let t=$('.tries',pop);if(!t){t=el('div','tries');pop.appendChild(t);}t.className='tries'+(cls?' '+cls:'');t.textContent=txt;void t.offsetWidth;t.classList.add('in');return t;}
function hidePill(pop){const t=$('.tries',pop);if(t){t.classList.remove('in');setTimeout(()=>{t.parentNode&&t.remove();},420);}}
/* correct signal: an inner green glow rising from the bottom edge of the card */
function greenRise(pop){ const fx=$('.fx',pop); if(!fx)return; fx.classList.remove('glow'); void fx.offsetWidth; fx.classList.add('glow'); setTimeout(()=>fx.classList.remove('glow'),1300); }
function win(pop){ sndRight(); pop.classList.add('win'); greenRise(pop);
  const xp=(TYPES[idx]&&TYPES[idx].xp)||70;
  const praise=['Excellent','Amazing','Really good','Nailed it','Sharp'][Math.floor(Math.random()*5)];
  pill(pop,'+'+xp+' XP · '+praise,'xp'); setTimeout(()=>hidePill(pop),1550);   // reward + praise flashes up top, then leaves
  const r=pop.getBoundingClientRect(); confetti(r.left+r.width/2,r.top+r.height*.55);
  setTimeout(()=>{ if(!busy){busy=true; const n=(idx+1)%TYPES.length; closePop(true,()=>{setPlayhead(MARKS[n]);setTimeout(()=>{openPop(n);busy=false;},520);});} },1750);
}
function wrongTurn(pop,onReveal){ pop._tries++; shake(pop); if(pop._tries>=2){ pill(pop,'Nice try','miss'); setTimeout(onReveal,150); } else { pill(pop,'One more try'); } }

builders.binary=(body,pop,t)=>{const row=el('div','row');t.opts.forEach(o=>{const b=btn(o.t,o.primary);b.dataset.ok=o.ok?1:0;b.onclick=()=>instant(pop,b,!!o.ok);row.appendChild(b);});body.appendChild(row);};
builders.single=(body,pop,t)=>{const st=el('div','stack');t.opts.forEach(o=>{const b=btn(o.t,o.primary);b.dataset.ok=o.ok?1:0;b.onclick=()=>instant(pop,b,!!o.ok);st.appendChild(b);});body.appendChild(st);};
function instant(pop,button,ok){const all=$$('.btn',pop);
  if(ok){all.forEach(b=>b.classList.add('locked'));button.classList.add('correct');win(pop);}
  else{button.classList.add('wrong');wrongTurn(pop,()=>{all.forEach(b=>{b.classList.add('locked');if(b.dataset.ok==='1')b.classList.add('correct');});});if(pop._tries<2)setTimeout(()=>button.classList.remove('wrong'),480);}}

builders.multi=(body,pop,t)=>{body.insertAdjacentHTML('beforeend','<div class="hint">Select all that apply</div>');
  const st=el('div','stack');t.opts.forEach(o=>{const b=btn('',false);b.innerHTML=`<span class="tick">${ICON.check}</span><span>${o.t}</span>`;b.dataset.ok=o.ok?1:0;b.onclick=()=>{b.classList.toggle('sel');c.disabled=!$$('.btn.sel',pop).length;};st.appendChild(b);});body.appendChild(st);
  const c=btn('Check',true);c.classList.add('confirm');c.disabled=true;
  c.onclick=()=>{const bs=$$('.stack .btn',pop);const ok=bs.every(b=>(b.dataset.ok==='1')===b.classList.contains('sel'));
    if(ok){bs.forEach(b=>{b.classList.add('locked');if(b.dataset.ok==='1')b.classList.add('correct');});c.remove();win(pop);}
    else{wrongTurn(pop,()=>{bs.forEach(b=>{b.classList.add('locked');b.classList.remove('sel');if(b.dataset.ok==='1')b.classList.add('correct');});c.remove();});if(pop._tries<2){bs.forEach(b=>b.classList.remove('sel'));c.disabled=true;}}};
  body.appendChild(c);};

builders.slider=(body,pop,t)=>{const w=el('div','slider-wrap');
  w.innerHTML=`<div class="readout"><span class="v">50</span><small>%</small></div><input type="range" class="slider" min="0" max="100" value="50"><div class="ticks"><span>0</span><span>50</span><span>100</span></div>`;
  body.appendChild(w);const sl=$('.slider',w),v=$('.v',w);sl.oninput=()=>v.textContent=sl.value;
  const c=btn('Lock it in',true);c.classList.add('confirm');
  c.onclick=()=>{const val=+sl.value,ok=Math.abs(val-t.target)<=t.tol;sl.disabled=true;if(ok){c.remove();win(pop);}else{wrongTurn(pop,()=>{v.textContent=t.target;c.remove();});}};
  body.appendChild(c);};

builders.cloze=(body,pop,t)=>{ $('.q',body)?.remove();
  const cl=el('div','cloze');cl.innerHTML=`${t.text[0]} <span class="slot empty" data-ok="${t.slots[0]}">____</span> ${t.text[2]} <span class="slot empty" data-ok="${t.slots[1]}">____</span>.`;body.appendChild(cl);
  const bank=el('div','bank');t.bank.forEach(wd=>{const b=el('div','word');b.textContent=wd;b.onclick=()=>{const slot=$$('.slot',pop).find(s=>!s.dataset.val);if(!slot)return;slot.dataset.val=wd;slot.textContent=wd;slot.classList.remove('empty');slot.classList.add('filled');b.classList.add('used');c.disabled=$$('.slot',pop).some(s=>!s.dataset.val);};bank.appendChild(b);});body.appendChild(bank);
  $$('.slot',cl).forEach(s=>s.onclick=()=>{if(!s.dataset.val)return;const w=$$('.word',bank).find(x=>x.textContent===s.dataset.val);if(w)w.classList.remove('used');s.dataset.val='';s.textContent='____';s.classList.add('empty');s.classList.remove('filled');c.disabled=true;});
  const c=btn('Check',true);c.classList.add('confirm');c.disabled=true;
  c.onclick=()=>{const ss=$$('.slot',pop);let ok=true;ss.forEach(s=>{const good=s.dataset.val===s.dataset.ok;s.classList.add(good?'correct':'wrong');if(!good)ok=false;});
    if(ok){c.remove();win(pop);}else{wrongTurn(pop,()=>{ss.forEach(s=>{if(s.dataset.val!==s.dataset.ok){s.textContent=s.dataset.ok;s.classList.remove('wrong');s.classList.add('correct');}});c.remove();});if(pop._tries<2)setTimeout(()=>ss.forEach(s=>s.classList.remove('wrong')),480);}};
  body.appendChild(c);};

/* rank — drag rows into the correct order (items are authored in correct order) */
builders.rank=(body,pop,t)=>{
  body.insertAdjacentHTML('beforeend','<div class="hint">Drag into the right order</div>');
  const list=el('div','ranklist');
  shuffle(t.items.map((txt,i)=>({txt,i}))).forEach(it=>{const row=el('div','rankrow');row.draggable=true;row.dataset.i=it.i;
    row.innerHTML=`<span class="rgrip">${ICON.grip}</span><span>${it.txt}</span>`;list.appendChild(row);});
  let drag=null;
  list.addEventListener('dragstart',e=>{drag=e.target.closest('.rankrow');if(drag)setTimeout(()=>drag.classList.add('dragging'),0);});
  list.addEventListener('dragend',()=>{if(drag){drag.classList.remove('dragging');drag=null;}});
  list.addEventListener('dragover',e=>{e.preventDefault();if(!drag)return;const a=afterRow(list,e.clientY);if(a==null)list.appendChild(drag);else list.insertBefore(drag,a);});
  body.appendChild(list);
  const c=btn('Check',true);c.classList.add('confirm');
  c.onclick=()=>{const ok=$$('.rankrow',list).every((r,idx)=>+r.dataset.i===idx);
    if(ok){$$('.rankrow',list).forEach(r=>{r.classList.add('done');r.draggable=false;});c.remove();win(pop);}
    else{wrongTurn(pop,()=>{$$('.rankrow',list).sort((a,b)=>a.dataset.i-b.dataset.i).forEach(r=>{list.appendChild(r);r.classList.add('done');r.draggable=false;});c.remove();});}};
  body.appendChild(c);};

/* sort — drag each chip into the correct bucket (chip.cat = bucket index) */
builders.sort=(body,pop,t)=>{
  body.insertAdjacentHTML('beforeend','<div class="hint">Drag each into a group</div>');
  const chips=el('div','sortchips');
  shuffle(t.items.map((it,i)=>({...it,i}))).forEach(it=>{const ch=el('div','chip');ch.draggable=true;ch.textContent=it.t;ch.dataset.cat='-1';ch.dataset.ok=String(it.cat);chips.appendChild(ch);});
  body.appendChild(chips);
  const bwrap=el('div','buckets');
  t.cats.forEach((name,bi)=>{const b=el('div','bucket');b.dataset.b=String(bi);b.innerHTML=`<div class="bhead">${name}</div>`;bwrap.appendChild(b);});
  body.appendChild(bwrap);
  let drag=null;
  function readyCheck(){c.disabled=$$('.chip',pop).some(ch=>ch.dataset.cat==='-1');}
  pop.addEventListener('dragstart',e=>{const ch=e.target.closest&&e.target.closest('.chip');if(ch){drag=ch;ch.classList.add('dragging');}});
  pop.addEventListener('dragend',()=>{if(drag){drag.classList.remove('dragging');drag=null;}});
  const drop=(zone,cat)=>{zone.addEventListener('dragover',e=>{e.preventDefault();if(zone.classList.contains('bucket'))zone.classList.add('over');});
    zone.addEventListener('dragleave',()=>zone.classList.remove('over'));
    zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('over');if(!drag)return;zone.appendChild(drag);drag.dataset.cat=cat;readyCheck();});};
  $$('.bucket',bwrap).forEach(b=>drop(b,b.dataset.b)); drop(chips,'-1');
  const c=btn('Check',true);c.classList.add('confirm');c.disabled=true;
  c.onclick=()=>{const all=$$('.chip',pop);const ok=all.every(ch=>ch.dataset.cat===ch.dataset.ok);
    if(ok){all.forEach(ch=>ch.classList.add('ok'));c.remove();win(pop);}
    else{wrongTurn(pop,()=>{all.forEach(ch=>ch.classList.add(ch.dataset.cat===ch.dataset.ok?'ok':'no'));c.remove();});}};
  body.appendChild(c);};

/* match — tap a left item then its pair on the right; draws a coloured link line per pair */
builders.match=(body,pop,t)=>{
  body.insertAdjacentHTML('beforeend','<div class="hint">Tap one on each side to connect</div>');
  const wrap=el('div','matchwrap');
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'); svg.setAttribute('class','mlines'); wrap.appendChild(svg);
  const L=el('div','matchcol'),R=el('div','matchcol');
  t.pairs.forEach((p,i)=>{const m=el('div','mitem');m.textContent=p.l;m.dataset.i=String(i);m.dataset.side='l';L.appendChild(m);});
  shuffle(t.pairs.map((p,i)=>({t:p.r,i}))).forEach(it=>{const m=el('div','mitem');m.textContent=it.t;m.dataset.i=String(it.i);m.dataset.side='r';R.appendChild(m);});
  wrap.appendChild(L);wrap.appendChild(R);body.appendChild(wrap);
  const COLORS=['#e0a45e','#69aee0','#c78ae0','#6ac48c','#e08585']; const SVGNS='http://www.w3.org/2000/svg';
  let selL=null; const pairs=[];
  /* offset-based position (layout px, matches the svg's coord space) — unaffected
     by the card's scale transform, so lines stay correct even mid-morph */
  function anchor(m){let x=0,y=0,e=m;while(e&&e!==wrap){x+=e.offsetLeft;y+=e.offsetTop;e=e.offsetParent;}return {x,y,w:m.offsetWidth,h:m.offsetHeight};}
  function redraw(){ svg.innerHTML='';
    pairs.forEach(p=>{ const a=anchor(p.l),b=anchor(p.r);
      const x1=a.x+a.w,y1=a.y+a.h/2,x2=b.x,y2=b.y+b.h/2,mx=(x1+x2)/2;
      const path=document.createElementNS(SVGNS,'path');
      path.setAttribute('d',`M${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`);
      path.setAttribute('stroke',p.c);path.setAttribute('stroke-width','2.5');path.setAttribute('fill','none');path.setAttribute('stroke-linecap','round');
      svg.appendChild(path);
      [[x1,y1],[x2,y2]].forEach(pt=>{const d=document.createElementNS(SVGNS,'circle');d.setAttribute('cx',pt[0]);d.setAttribute('cy',pt[1]);d.setAttribute('r','4');d.setAttribute('fill',p.c);svg.appendChild(d);});
    });
  }
  function link(a,b,col){a.classList.remove('sel');a.classList.add('linked');b.classList.add('linked');a.style.setProperty('--lc',col);b.style.setProperty('--lc',col);b.dataset.with=a.dataset.i;pairs.push({l:a,r:b,c:col});}
  function reset(){pairs.length=0;selL=null;$$('.mitem',wrap).forEach(m=>{m.classList.remove('linked','sel','wrongflash','rok');m.style.removeProperty('--lc');delete m.dataset.with;});svg.innerHTML='';}
  $$('.mitem',wrap).forEach(m=>m.onclick=()=>{
    if(m.classList.contains('linked'))return;
    if(m.dataset.side==='l'){$$('.mitem[data-side="l"]',wrap).forEach(x=>x.classList.remove('sel'));m.classList.add('sel');selL=m;}
    else if(selL){link(selL,m,COLORS[pairs.length%COLORS.length]);selL=null;redraw();
      c.disabled=$$('.mitem[data-side="r"]',wrap).some(x=>!x.classList.contains('linked'));}});
  const c=btn('Check',true);c.classList.add('confirm');c.disabled=true;
  c.onclick=()=>{const rs=$$('.mitem[data-side="r"]',wrap);const ok=rs.every(r=>r.dataset.with===r.dataset.i);
    if(ok){$$('.mitem',wrap).forEach(m=>m.classList.add('rok'));c.remove();win(pop);}
    else{ wrongTurn(pop,()=>{ reset();
        t.pairs.forEach((_,i)=>{const a=$(`.mitem[data-side="l"][data-i="${i}"]`,wrap),b=$(`.mitem[data-side="r"][data-i="${i}"]`,wrap);link(a,b,'#6ac48c');a.classList.add('rok');b.classList.add('rok');});
        redraw();c.remove();});
      if(pop._tries<2){reset();c.disabled=true;} }};
  body.appendChild(c);};

/* controls */
function paintTheme(){$('#themeBtn').innerHTML=`${ICON.sunmoon}<span>${popTheme==='dark'?'Dark POP':'Light POP'}</span>`;const p=$('.pop');if(p)p.dataset.pop=popTheme;}
$('#themeBtn').onclick=()=>{popTheme=popTheme==='dark'?'light':'dark';paintTheme();};
$('#soundBtn').onclick=()=>{sound=!sound;$('#soundBtn').classList.toggle('on',sound);$('#soundBtn').innerHTML=`${sound?ICON.vol:ICON.mute}<span>${sound?'Sound on':'Muted'}</span>`;};
$('#nextBtn').onclick=()=>next();
$('#replayBtn').onclick=()=>start();
paintTheme();$('#soundBtn').innerHTML=`${ICON.vol}<span>Sound on</span>`;

/* debug panel */
const debugEl=$('#debug');
function updateDInfo(){const e=$('#dinfo');if(e)e.textContent=`Type ${idx+1}/${TYPES.length} · ${TYPES[idx]?TYPES[idx].type:'-'} · ${popTheme} POP`;}
$('#debugBtn').onclick=()=>{debugEl.hidden=!debugEl.hidden;$('#debugBtn').classList.toggle('on',!debugEl.hidden);updateDInfo();};
debugEl.onclick=(e)=>{const a=e.target&&e.target.dataset&&e.target.dataset.a;if(!a)return;const pop=$('.pop');
  if(a==='correct'&&pop&&!pop.classList.contains('win'))win(pop);
  else if(a==='wrong'&&pop){shake(pop);pill(pop,'One more try');}
  else if(a==='green'&&pop)greenRise(pop);
  else if(a==='next')next();
  else if(a==='prev')jump((idx-1+TYPES.length)%TYPES.length);
  else if(a==='theme'){popTheme=popTheme==='dark'?'light':'dark';paintTheme();}
  else if(a==='replay')start();
  updateDInfo();
};

/* gallery — render every POP type in dark + light as static, non-interactive previews */
function buildGallery(){
  const grid=$('#galGrid'); grid.innerHTML='';
  ['dark','light'].forEach(theme=>{
    TYPES.forEach(t=>{
      const cell=el('div','gcell');
      const pop=document.createElement('div'); pop.className='pop gpop show'; pop.dataset.pop=theme; pop._tries=0;
      if(['rank','sort','match'].includes(t.type))pop.classList.add('wide');
      const fx=document.createElement('div'); fx.className='fx'; pop.appendChild(fx);
      buildBody(pop,t);
      const cap=el('div','gcap'); cap.textContent=t.type+' · '+theme;
      cell.appendChild(pop); cell.appendChild(cap); grid.appendChild(cell);
    });
  });
}
$('#galleryBtn').onclick=()=>{ buildGallery(); $('#gallery').classList.add('open'); };
$('#galCloseBtn').onclick=()=>{ $('#gallery').classList.remove('open'); $('#galGrid').innerHTML=''; };

/* boot: timeline + video slide in slowly, then playhead → marker → POP grows */
function start(){ busy=true; idx=-1;
  $('.pop')&&$('.pop').remove(); $('#video').classList.remove('dim'); $('#scrim').classList.remove('on');
  $('#stage').classList.remove('ready'); layoutMarks(); setPlayhead(0.02);
  void $('#stage').offsetWidth;
  setTimeout(()=>$('#stage').classList.add('ready'),80);      // video + timeline ease in
  setTimeout(()=>setPlayhead(MARKS[0]),1050);                 // playhead travels to first mark
  setTimeout(()=>{ openPop(0); busy=false; },1650);           // circle grows into the POP
}
start();
</script>
