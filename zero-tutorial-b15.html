/* ch/08-portfolio.css */
/* 8 · portfolio (b14). Two layers.
   .pf-sl: the designer's Slate 9 page (zero-portfolio/v37 css/base.css + css/slate9.css), rule for rule, at its own size:
   one canvas pixel is one CSS pixel of the page, so on a laptop it shows at about the 0.8 the page itself uses.
   Every class is the source's name with a p9- prefix and every rule is scoped under .ch-portfolio .pf-sl.
   Left out: the intro reel, the project popup, the one column layouts (the window is always 1600 wide, so the
   viewport media queries must not reach in), the page load rise, and the screens no visible project uses.
   .pf-fx: b11's project done moment on the app's 1920 canvas, scaled to the picture, unchanged. */
.ch-portfolio{background:rgb(246,245,243);color:#1F1D1E;font-family:var(--f-sans);letter-spacing:0}
.ch-portfolio *,.ch-portfolio *::before,.ch-portfolio *::after{box-sizing:border-box}

/* ---------- the page's own ground and tokens (slate9.css body, html; base.css body) ---------- */
.ch-portfolio .pf-sl{position:absolute;z-index:0;left:0;top:0;width:1600px;height:840px;overflow:hidden;background:#1a1a1c;
  --sans:"Google Sans Flex","Inter Tight",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"PP Supply Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --i:20,22,27;--ink:rgb(var(--i));--ink-2:rgba(var(--i),.7);--ink-3:rgba(var(--i),.45);--ink-4:rgba(var(--i),.3);--ln:rgba(var(--i),.06);--ln-2:rgba(var(--i),.12);--wash:rgba(var(--i),.03);--rule:rgba(var(--i),.1);
  --green:#00a656;--ease:cubic-bezier(.32,.72,0,1);--w:255,255,255;--night:#1a1a1c;
  color:var(--ink);font:400 14px/1.5 var(--sans);letter-spacing:-.32px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.ch-portfolio .pf-sl .p9-app{position:relative;min-height:840px}
/* the page ships its own Google Sans Flex (GoogleSansFlex-wght-ROND.woff2), an instance at the 18 optical size.
   The tour's Google Fonts copy sizes optically, which sets small text about 6% wider; this holds every size at 18,
   the page's own widths. Important because each "font:" shorthand in the source resets it. The case study tile
   keeps the tour's own setting, as b11 drew it. */
.ch-portfolio .pf-sl,.ch-portfolio .pf-sl *{font-optical-sizing:none!important}
.ch-portfolio .pf-sl .pf-front *{font-optical-sizing:auto!important}
.ch-portfolio .pf-sl *{box-sizing:border-box}

.ch-portfolio .pf-sl .p9-lg{display:inline-block;width:1em;height:1em;flex:none;vertical-align:middle}
.ch-portfolio .pf-sl .p9-lg-m{-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.ch-portfolio .pf-sl img.p9-lg{object-fit:contain;border-radius:22%}

/* ---------- b14 additions, in the page's own terms ---------- */
/* the Airbnb deck's numbers wear Airbnb's colour, as the Canva deck's wear Canva's */
.ch-portfolio .pf-sl .p9-mt .p9-mt-in .pf-ab .p9-rules div b{color:#FF5A5F}
.ch-portfolio .pf-sl .pf-hid{display:none!important}
/* the rank pill steps up with a small lift as each new badge arrives */
.ch-portfolio .pf-sl .pf-lv.pf-bump{animation:pf9-bump .35s var(--zt-ease)}
@keyframes pf9-bump{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}

/* the featured slot: the case study tile lands on it, then turns over into the recording.
   pf-flat: the turn is done and the recording stands on its own, with no 3D layer left on it */
.ch-portfolio .pf-sl .pf-fslot{position:relative;width:100%;aspect-ratio:96/60;perspective:1100px}
.ch-portfolio .pf-sl .pf-flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s var(--zt-ease)}
.ch-portfolio .pf-sl .pf-face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.ch-portfolio .pf-sl .pf-back{transform:rotateY(180deg)}
.ch-portfolio .pf-sl .pf-front .pf-tile{position:absolute;left:0;top:0;width:386.4px;height:241.5px;transform:scale(.833333);transform-origin:0 0}
.ch-portfolio.pf-flip-on .pf-sl .pf-flip{transform:rotateY(180deg)}
.ch-portfolio.pf-flat .pf-sl .pf-flip,.ch-portfolio.pf-flat .pf-sl .pf-back{transform:none;transition:none}
.ch-portfolio.pf-flat .pf-sl .pf-front{display:none}

/* the list: each project lands on top and pushes the others down. The source's 26px gap becomes each row's own
   space below it, so a row can open from nothing */
.ch-portfolio .pf-sl .p9-sz-cards{gap:0}
.ch-portfolio .pf-sl .pf-rw{height:0;overflow:hidden;transition:height .42s var(--zt-ease),padding .42s var(--zt-ease)}
.ch-portfolio .pf-sl .pf-rw.pf-on{padding-bottom:26px}
.ch-portfolio .pf-sl .pf-rw.pf-on:last-child{padding-bottom:0}
.ch-portfolio .pf-sl .pf-rw>.p9-sz-card{transform:translateY(22px);transition:transform .45s var(--zt-ease)}
.ch-portfolio .pf-sl .pf-rw.pf-on>.p9-sz-card{transform:none}

/* ---------- b11's project done moment (unchanged) on the app's 1920 canvas ----------
   pf-inst: nothing moves. pf-hoo-on: the veil is up. pf-hoo-in: the tile is there. pf-hoo-done: the tick, the words,
   the paper. pf-hoo-go: the veil lifts and the tile flies to the featured slot (b14: taking the slot's shape on the way).
   pf-hoo-gone: the slot's own copy has taken over. */
.ch-portfolio .pf-fx{position:absolute;z-index:1;left:0;top:0;width:1920px;height:1008px;transform:scale(.833333);transform-origin:0 0;font-size:16px;line-height:1.5;color:#1F1D1E;pointer-events:none}
.ch-portfolio .pf-fx svg,.ch-portfolio .pf-tile svg{display:block}
.ch-portfolio.pf-inst *{transition:none!important}
@media (prefers-reduced-motion:reduce){
  .ch-portfolio *{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}
}
/* the case study tile (PortfolioProjectCardV2): the company's colour as a frame (150deg, 22% to 40%), a white panel inside it */
.ch-portfolio .pf-tile{flex:none;position:relative;width:288px;height:216px;border-radius:16px;overflow:hidden;background:linear-gradient(150deg,#FF5A5F38,#FF5A5F66);font-size:16px;line-height:1.5;letter-spacing:0;color:#1F1D1E;font-family:var(--f-sans)}

.ch-portfolio .pf-hoo{position:absolute;left:0;top:0;width:1920px;height:1008px;pointer-events:none}
.ch-portfolio .pf-hoo-v{position:absolute;left:0;top:0;width:100%;height:100%;background:rgb(246,245,243);opacity:1;transition:opacity .45s var(--zt-ease)}
.ch-portfolio .pf-hoo-t{position:absolute;left:816px;top:300px;width:288px;height:216px;opacity:0;transform:scale(1.62);
  transition:transform .5s var(--zt-ease),opacity .3s var(--zt-ease)}

.ch-portfolio .pf-hoo-k svg{width:20px;height:20px;display:block}

.ch-portfolio .pf-hoo-h{position:absolute;left:0;right:0;top:640px;margin:0;text-align:center;font:400 44px/1 var(--f-serif);letter-spacing:-.03em;color:#1F1D1E;opacity:0;transform:translateY(12px);
  transition:opacity .35s var(--zt-ease),transform .45s var(--zt-ease)}
.ch-portfolio.pf-hoo-done .pf-hoo-h{opacity:1;transform:none}
.ch-portfolio .pf-hoo-b{position:absolute;left:960px;top:408px;width:0;height:0}

.ch-portfolio .pf-hoo-b .pf-p2{background:#1F1D1E}

@keyframes pf-hoo-pop{
  0%{transform:translate(0,0) rotate(0deg) scale(.3);opacity:0}
  9%{opacity:1}
  56%{transform:translate(calc(var(--x)*.92),calc(var(--y)*.96)) rotate(calc(var(--r)*.7)) scale(1);opacity:1}
  100%{transform:translate(var(--x),calc(var(--y) + 74px)) rotate(var(--r)) scale(.9);opacity:0}}
/* into its place: the veil lifts, the words and the tick go, the tile takes the slot's place and shape, and the slot's
   own copy waits unseen until it arrives */
.ch-portfolio.pf-hoo-on .pf-front{visibility:hidden}
.ch-portfolio.pf-hoo-go .pf-hoo-v{opacity:0}

      stopRide();

    var lg = function (k, c) { return '<span class="jb-lg' + (c ? ' ' + c : '') + '"><img src="' + api.asset('img/jb-logo-' + k + '.png') + '" alt="" draggable="false"></span>'; };
    function row(r) {
      return '<tr data-k="' + r.k + '"><td><div class="jb-r"><span class="jb-esel">' + ic('check') + '</span>' + lg(r.k, 'jb-sm') +
        '<div class="jb-grow"><p class="jb-ti">' + r.title.replace('&', '&amp;') + '</p><p class="jb-m jb-mil"><span class="jb-mi">' + ic('building-2') + r.co + '</span></p></div></div></td>' +
        '<td class="jb-loc"><span class="jb-clip">' + r.loc + '</span><span class="jb-m">Hybrid</span></td>' +
        '<td class="jb-fit"><span class="jb-pill">' + ic('thumbs-up') + '<span>Good fit</span></span></td>' +
        '<td class="jb-n">' + r.pay + '</td><td class="jb-n">' + r.days + '</td>' +
        '<td class="jb-acts"><button type="button" class="jb-ap">Apply</button></td>' +
        '<td class="jb-lk"><button type="button" class="jb-like" aria-label="Like">' + ic('heart') + '</button></td></tr>';
    }
    root.innerHTML =
      '<div class="jb-sheet">' +
        '<header class="jb-top"><div class="jb-top-l">' + LOGO +
          '<div class="jb-seg" role="group"><button type="button">Learn</button><button type="button" class="jb-on">Jobs</button></div>' +
          '<span class="jb-zt"><span class="jb-ztop">' + orbHTML('morph', true) + lg('ramp') + '<span class="jb-clip"><span class="jb-zt-i">Applying to Ramp</span><span class="jb-zt-m"></span></span></span>' +
            '<span class="jb-ztc"><span class="jb-f10 jb-dk">' + ic('x') + '</span><span class="jb-f10 jb-sq jb-dk">' + ic('circle-stop') + '</span></span></span></div>' +
          '<nav class="jb-tabs"><button type="button" data-p="you">For you</button><button type="button" class="jb-on" data-p="jobs">Jobs</button><button type="button" data-p="inbox">Inbox<span class="jb-dot"></span></button></nav>' +
          '<div class="jb-top-r"><button type="button" class="jb-snd" aria-label="Sound on">' + ic('volume-2') + '</button>' +
            '<button type="button" class="jb-lvb"><span class="jb-lvt">' + ic('award') + '<b>Rank ' + LV_TO + '</b><span class="jb-lvt-b"><i style="width:' + LV_BAR + '%"></i></span></span></button>' +
            '<button type="button" class="jb-who"><span class="jb-who-i">' + name + '</span><span class="jb-av"><img src="' + photo + '" alt="" draggable="false"></span></button></div>' +
        '</header>' +
        /* Jobs: the table of the roles that opened */
        '<div class="jb-pg jb-pg-jobs"><div class="jb-ex"><div class="jb-egw">' +
          '<div class="jb-tb"><div class="jb-tbseg" role="group"><button type="button" class="jb-on">All</button><button type="button">Liked</button><button type="button" class="jb-tb-ap">Applied</button><button type="button">Connected</button><button type="button">Archived</button></div>' +
            '<span class="jb-grow"></span><button type="button" class="jb-ib" aria-label="Search and filter">' + ic('search') + ic('list-filter') + '</button><span><button type="button" class="jb-ib" aria-label="Sort">' + ic('arrow-up-down') + '</button></span></div>' +
          '<table class="jb-eg"><thead><tr><th><span class="jb-sa"><span class="jb-esel">' + ic('check') + '</span><span>Role</span></span></th><th>Location</th>' +
            '<th><span class="jb-es jb-on">What we think' + ic('arrow-down') + '</span></th><th><span class="jb-es">' + ic('banknote', 'jb-lead') + 'Pay' + ic('arrow-up-down') + '</span></th>' +
            '<th><span class="jb-es">' + ic('clock', 'jb-lead') + 'Posted' + ic('arrow-up-down') + '</span></th><th>Action</th><th></th></tr></thead>' +
          '<tbody>' + ROLES.map(row).join('') + '</tbody></table></div></div></div>' +
        /* For you: Zero's line and the one to-do */
        '<div class="jb-pg jb-pg-you"><div class="jb-f2">' +
          '<header class="jb-hd"><span class="jb-z"><span class="jb-orb" role="img" aria-label="Zero"><span class="jb-orb-b"></span><svg class="jb-orb-e" viewBox="0 0 100 100" aria-hidden="true"><g class="jb-orb-eg"><path d="M38 33V48" stroke-width="15"/><path d="M62 33V48" stroke-width="15"/></g></svg></span></span>' +
            '<p class="jb-say"><b>' + RAMP.mgr + ' at Ramp</b> wants to meet you. Can you help me with this one?</p></header>' +
          '<section class="jb-tds"><div class="jb-th"><h2 class="jb-k2">To-dos</h2></div>' +
            '<article class="jb-box"><h3 class="jb-bt"><span class="jb-fc"><span class="jb-av"><img src="' + api.asset('img/jb-face-omar.webp') + '" alt="" draggable="false"></span><span class="jb-fl">' + lg('ramp') + '</span></span>' +
              '<span>' + RAMP.mgr + ' at Ramp wants to meet you</span><span class="jb-due">' + ic('timer') + '2 days left</span></h3>' +
              '<div class="jb-bf"><button type="button" class="jb-lt">' + ic('bookmark') + 'Later</button><span class="jb-grow"></span><button type="button" class="jb-xb">Reply myself</button><button type="button" class="jb-xb">Not interested</button>' +
              '<button type="button" class="jb-kb">' + ic('check') + 'Accept</button></div></article></section>' +
          '<section class="jb-actv"><button type="button" class="jb-ah"><span class="jb-k2">Activity</span><span class="jb-ahc">1 today</span>' + ic('chevron-down') + '</button></section>' +
        '</div></div>' +
        '<i class="jb-tipat" aria-hidden="true"></i><div class="jb-tst"><span class="jb-tsti">' + ic('sparkle') + '</span><span class="jb-clip">Applied to Ramp. ' + RAMP.mgrFull + ' has your work</span></div>' +
      '</div>';
    function q(s) { return root.querySelector(s); }
    var rampRow = q('tr[data-k="ramp"]');
    return root._jb = {
      tabs: [].slice.call(root.querySelectorAll('.jb-tabs button')), jobs: q('.jb-pg-jobs'), you: q('.jb-pg-you'),
      ramp: rampRow, apply: rampRow.querySelector('.jb-ap'), zt: q('.jb-zt'), ztm: q('.jb-zt-m'), tbAp: q('.jb-tb-ap'), toast: q('.jb-tst'),
      say: q('.jb-say'), tds: q('.jb-tds'), accept: q('.jb-kb'), tipAt: q('.jb-tipat')
    };
  }

  /* the portal's face, Inter, from a local file so it works offline inside the app */
  function loadFont(api) {
    try {
      /* (fonts.check() says true for a family it has never heard of, so look for the face itself) */
      var has = false; if (document.fonts && document.fonts.forEach) document.fonts.forEach(function (f) { if (f.family.replace(/["']/g, '') === 'JB Inter') has = true; });
      if (document.fonts && !has && window.FontFace) {
        var ff = new FontFace('JB Inter', 'url(' + api.asset('fonts/jb-inter-latin.woff2') + ')', { weight: '100 900', style: 'normal' });
        ff.load().then(function (f) { document.fonts.add(f); }).catch(function () {});
      }
    } catch (e) {}
  }

  ZT.chapter({
    id: 'jobs', order: 8.5, steps: ['jobs'], window: true, tone: 'light', bg: '#F3F3F5',

    mount: function (root, api) {
      loadFont(api);
      if (!api.windowed) root.classList.add('jb-full');
      build(root, api);
      ['img/jb-badge-7.webp', 'img/jb-badge-8.webp'].concat(ROLES.map(function (r) { return 'img/jb-logo-' + r.k + '.png'; })).forEach(function (p) { var im = new Image(); im.src = api.asset(p); });
    },

    run: async function (api) {
      var root = api.root, S = root._jb || build(root, api), did = {}, H = api.windowed ? 786 : 840;
      var X = celebration(root, api, H);
      api.onExit(function () { X.kill(); });
      function on(text, re, key) { if (did[key] || !re.test(text || '')) return false; did[key] = 1; return true; }
      /* when, inside a line, a phrase is spoken (ms from the start of the line) */
      function at(id, phrase) {
        var p = api.plan(id), low = phrase.toLowerCase();
        for (var i = 0; i < p.segs.length; i++) {
          var t = p.segs[i].text, k = t.toLowerCase().indexOf(low);
          if (k < 0) continue;
          var end = i + 1 < p.segs.length ? p.segs[i + 1].t : p.dur;
          return (p.segs[i].t + (end - p.segs[i].t) * (k / t.length)) * 1000;
        }
        return 0;
      }
      function page(k) {
        S.tabs.forEach(function (b) { b.classList.toggle('jb-on', b.dataset.p === k); });
        [S.jobs, S.you].forEach(function (p) { p.classList.remove('jb-on'); });
        var pg = k === 'jobs' ? S.jobs : S.you; void pg.offsetWidth; pg.classList.add('jb-on');
      }

      api.guide.home({ role: 'Founder of Zero' });

      /* ---------- H1 · the portal's own level up: Rank 8, then the roles that opened ---------- */
      X.open('lu'); api.sfx('whoosh');
      await api.wait(150);
      var rolesAt = 0;
      await api.say('H1', { onSeg: function (i, text) {
        if (on(text, /more roles/i, 'roles')) api.later(Math.max(150, at('H1', 'the more roles') - at('H1', 'The more projects') - 250), function () { rolesAt = performance.now(); X.step('roles'); });
      } });
      if (!did.roles) { rolesAt = performance.now(); X.step('roles'); }
      /* the logos have landed (about a second) before the sky wipes away onto the table */
      await api.wait(Math.max(0, Math.round((rolesAt || performance.now()) + 1100 - performance.now())));
      X.close();
      await api.wait(250);
      page('jobs');

      /* ---------- H2 · we apply with you. The learner clicks Apply on the Ramp row ---------- */
      /* Zero applies the moment Apply is pressed: the row works, the pill in the top bar says each step, then it is sent */
      var applied = false, onApply = null, askOpen = false, sentP = null, applyRing = null;
      function applyNow() {
        var row = S.ramp, cells = row.children, fit = cells[2].innerHTML;
        function phase(t, rt) { S.ztm.innerHTML = ' · ' + t; var sh = cells[2].querySelector('.jb-shim'); if (sh) sh.textContent = rt || t; }
        cells[0].querySelector('.jb-esel').outerHTML = '<span class="jb-esel jb-esel-run">' + orbHTML('orbits') + '</span>';
        cells[2].innerHTML = '<span class="jb-rrun">' + orbHTML('orbits') + '<span class="jb-shim"></span></span>';
        cells[5].innerHTML = '<span class="jb-act"><span class="jb-sp jb-run"><span class="jb-spin"></span>Applying</span><span class="jb-f10">' + ic('x') + '</span></span>';
        phase('Tailoring your portfolio for Ramp');
        S.zt.classList.add('jb-on'); orbsIn(root);
        return new Promise(function (res) {
          api.later(420, function () { phase('Building a resume ' + RAMP.ats + ' can read'); });
          api.later(840, function () { phase('Writing your note to ' + RAMP.mgr); });
          api.later(1260, function () { phase('Sending <b>in 1s</b>', 'Sending through ' + RAMP.ats + ' in 1s'); });
          api.later(1680, function () {
            S.ztm.innerHTML = ' · Sent';
            cells[0].querySelector('.jb-esel').outerHTML = '<span class="jb-esel jb-esel-off"></span>';
            cells[2].innerHTML = fit;
            cells[5].innerHTML = '<span class="jb-sp">Applied</span>';
            cells[6].innerHTML = '';
            S.tbAp.innerHTML = 'Applied<span class="jb-tbn">1</span>';
            S.toast.classList.add('jb-on'); api.sfx('good');
          });
          api.later(1980, function () { S.zt.classList.remove('jb-on'); res(); });     // the portal drops the pill once it is sent
        });
      }
      S.apply.addEventListener('click', function () {
        if (applied || !askOpen) return;
        applied = true; api.cursor.hide(); api.sfx('tick'); if (applyRing) { applyRing.clear(); applyRing = null; } sentP = applyNow();
        if (onApply) onApply();
      });
      await api.say('H2', { onSeg: function (i, text) { if (on(text, /go ahead/i, 'ask')) askOpen = true; } });
      askOpen = true;
      api.cursor.hide();
      /* the tip sits in the empty middle of the table's top bar, above the Action column, pointing down at Ramp's Apply,
         so it covers no button and no words. It hangs off a still point there (zero size, so the engine draws no ring
         round it), and Apply gets its own pulsing ring */
      if (!applied) applyRing = api.ring(S.apply, { pulse: true, pad: 5, radius: 12 });
      await api.turn({ badge: 'Try this', text: 'Click <b>Apply</b> on Ramp', tip: 'Click <b>Apply</b>', target: S.tipAt, pad: 0,
        until: function (done) { if (applied) api.later(150, done); else onApply = function () { api.later(150, done); }; },
        autoDelay: 500, auto: function () { return api.click(S.apply, { ms: 520 }); } });
      api.clearRings(); api.cursor.hide();
      await sentP;

      /* ---------- H3 · companies write back, you interview, you get hired ---------- */
      var accepted = false;
      function accept() {
        if (accepted) return; accepted = true;
        S.accept.classList.add('jb-down'); api.sfx('tick');
        api.later(160, function () {
          /* the portal's own state when nothing is left: To-do is done */
          var box = S.tds.querySelector('.jb-box');
          box.innerHTML = '<span class="jb-ok">' + ic('check') + '</span><p class="jb-dt">To-do is done</p><button type="button" class="jb-kb jb-k36">' + ic('map') + 'Back to map</button>';
          box.classList.add('jb-fin'); box.style.animation = 'none'; void box.offsetWidth; box.style.animation = '';
          S.say.innerHTML = 'Your call with <b>Ramp</b> is booked. Nothing needs you right now.';
          S.say.classList.remove('jb-swap'); void S.say.offsetWidth; S.say.classList.add('jb-swap');
        });
      }
      S.accept.addEventListener('click', accept);
      var hired = false;
      function hire() { if (hired) return; hired = true; api.cursor.hide(); X.open('hire'); api.sfx('whoosh'); }
      var tIv = at('H3', 'you interview'), tHi = at('H3', 'you get hired');
      await api.say('H3', { onSeg: function (i, text) {
        if (!on(text, /write back/i, 'h3')) return;
        page('you'); root.classList.add('jb-mail'); api.sfx('pop');
        api.later(Math.max(250, tIv - 760), function () { api.click(S.accept, { ms: 460 }).then(function () { accept(); }); });
        api.later(Math.max(1400, tHi - 450), hire);
      } });
      if (!did.h3) { page('you'); root.classList.add('jb-mail'); }
      accept(); hire();
      await api.wait(250);

      /* ---------- E1 · so that's how Zero works (the offer's words rise as he says it) ---------- */
      await api.say('E1');
      await api.wait(600);
    }
  });
})();

</script>
