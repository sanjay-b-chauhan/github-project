.ch-world.wd-go .wd-veil{opacity:1}
.ch-world.wd-go .wd-card{opacity:0;visibility:hidden;transform:scale(.96);pointer-events:none;
  transition:opacity .32s var(--zt-ease),transform .5s var(--zt-ease),visibility 0s linear .35s;transition-delay:0s,0s,.35s}
.ch-world.wd-go .wd-lead path{opacity:0}
.ch-world.wd-go .wd-mark{opacity:0}
.ch-world .wd-end{position:absolute;left:0;top:0;width:100%;height:760px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  opacity:0;visibility:hidden;transform:translateY(12px);filter:blur(8px);
  transition:opacity .5s var(--zt-ease),transform .65s var(--zt-ease),filter .5s var(--zt-ease),visibility 0s linear .5s}
.ch-world.wd-over .wd-end{opacity:1;visibility:visible;transform:none;filter:none;transition-delay:0s}
.ch-world .wd-end-wm{color:#F4F4F3;display:block}
.ch-world .wd-end-wm svg{height:22px;width:auto;display:block}
.ch-world .wd-end h2{margin:26px 0 0;font:400 44px/1.1 var(--f-serif);letter-spacing:-.02em;color:#f6f5f2;max-width:640px;text-wrap:balance}
.ch-world .wd-end p{margin:16px 0 0;font:400 16px/1.5 var(--f-sans);color:rgba(242,241,238,.6);max-width:440px;text-wrap:balance}
.ch-world .wd-replay{appearance:none;border:0;cursor:pointer;margin-top:34px;height:50px;padding:0 22px;border-radius:16px;
  font:500 15px/1 var(--f-sans);letter-spacing:-.012em;color:#F4F4F3;background:linear-gradient(#303236,#1A1B1E);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -3px 0 rgba(0,0,0,.5),0 0 0 1px #0a0a0b,0 14px 24px -14px rgba(0,0,0,.6);transition:transform .2s cubic-bezier(.2,.8,.3,1)}
.ch-world .wd-replay:hover{transform:translateY(-2px)}
.ch-world .wd-replay:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* resting behind the pop-up: nothing loops under the engine's blur */
.ch-world.wd-rest .wd-stop-go,.ch-world.wd-rest .wd-stop-go::before,.ch-world.wd-rest .wd-stop-go::after,.ch-world.wd-rest .wd-pin::before{animation:none}

@media (prefers-reduced-motion:reduce){
  .ch-world.wd-flash .wd-stop-go,.ch-world.wd-flash .wd-stop-go::before,.ch-world.wd-flash .wd-stop-go::after,.ch-world.wd-zoom .wd-pin::before{animation:none}
  .ch-world.wd-drift .wd-cam{transform:translate(-236px,-192px);transition:none}
}
/* b14: the app's own skill points star, in the meter and beside each role's number. A role that is not near yet shows it grey */
.ch-world .wd-m-num .wd-xp{width:18px;height:18px;display:block;flex:none;align-self:center;object-fit:contain;margin-right:-1px}
.ch-world .wd-r-at .wd-xp{width:13px;height:13px;display:block;object-fit:contain;filter:grayscale(1) brightness(1.3);opacity:.55;transition:filter .4s,opacity .4s}
.ch-world.wd-on-link .wd-role.wd-next .wd-r-at .wd-xp,.ch-world .wd-role.wd-open .wd-r-at .wd-xp{filter:none;opacity:1}

/* ch/03-kickoff.css */
/* 3 · kickoff, inside the pop-up (b15). The canvas is the app window: 1600 x 786 is on screen.
   The landing: the kickoff's white card on the blurred ground, grown to carry the project's brief (b14).
   The meeting: no top bar, so the grid is 30 from every edge. The deck fills the left column (1.8fr), the manager's video and
   Notes share the right one (0.8fr), 30 between the columns. Text with no font class inherits Google Sans Flex, as in the app. */
.ch-kickoff{background:#1B1815;color:#000;letter-spacing:0;
  --ko-sys:var(--f-sans);font-family:var(--ko-sys);
  --ko-apple:cubic-bezier(.22,1,.36,1)}
.ch-kickoff.ko-reveal{background:#F2F0ED}
.ch-kickoff .ko-app{position:absolute;left:0;top:0;width:1600px;height:786px;overflow:hidden}
.ch-kickoff svg{display:block}

/* ================= the landing (KickoffMeeting/index.tsx, LandingBackdrop, JoinCtaButton) ================= */
.ch-kickoff .ko-landing{position:absolute;left:0;top:0;width:1600px;height:786px;z-index:40;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .25s ease-out}
.ch-kickoff.ko-l-on .ko-landing{opacity:1}
/* the ground: the scenario's picture, blurred 42px and scaled past the frame, under a warm wash */
.ch-kickoff .ko-l-bd{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;background:#1B1815}
.ch-kickoff .ko-l-bd img{position:absolute;left:0;top:0;width:100%;height:100%;display:block;object-fit:cover;transform:scale(1.1);filter:blur(42px);user-select:none;-webkit-user-drag:none}
.ch-kickoff .ko-l-bd i{position:absolute;left:0;top:0;width:100%;height:100%;background:radial-gradient(120% 90% at 50% 30%,rgba(27,24,21,.32),rgba(15,13,11,.72) 100%)}
.ch-kickoff .ko-l-back{position:absolute;left:24px;top:24px;z-index:20;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.1);
  border:1px solid transparent;box-shadow:0 2px 8px rgba(0,0,0,.04);display:flex;align-items:center;justify-content:center;color:#fff}
.ch-kickoff .ko-l-back svg{width:24px;height:24px}
.ch-kickoff .ko-l-card{position:relative;z-index:10;width:760px;border-radius:32px;background:#fff;padding:64px 64px 92px;box-shadow:0 40px 100px -24px rgba(0,0,0,.5);
  opacity:0;transform:translateY(10px) scale(.96);transition:opacity .5s var(--ko-apple),transform .5s var(--ko-apple)}
.ch-kickoff.ko-l-on .ko-l-card{opacity:1;transform:none}
.ch-kickoff .ko-l-in{display:flex;flex-direction:column;align-items:center;transition:opacity .13s ease-out}
/* each line rises 14px, 80ms after the one above (landingRise) */
.ch-kickoff .ko-rise{opacity:0;transform:translateY(14px);transition:opacity .5s var(--ko-apple) var(--d,0s),transform .5s var(--ko-apple) var(--d,0s)}
.ch-kickoff.ko-l-on .ko-rise{opacity:1;transform:none}
/* b14: the card carries the project's brief, so its head is set tighter than the bare card's (24 between the eyebrow and the
   title, 48 between groups): the eyebrow, the company over its title, then the brief's meta line under them */
.ch-kickoff .ko-l-head{display:flex;flex-direction:column;align-items:center}
.ch-kickoff .ko-l-eye{margin:0;font:400 13px/18.2px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:rgba(31,29,30,.45)}
.ch-kickoff .ko-l-h{margin:0;font:400 40px/1.18 var(--f-serif);letter-spacing:-.01em;color:#2A2118;text-align:center;white-space:nowrap}
.ch-kickoff .ko-l-ttl{margin-top:22px;display:flex;flex-direction:column;align-items:center}
.ch-kickoff .ko-l-pair{display:flex;flex-direction:column;align-items:center;gap:10px}
.ch-kickoff .ko-l-co{margin:0;display:flex;align-items:center;gap:7px;font:500 15px/18.2px var(--ko-sys);color:#2A2118}
.ch-kickoff .ko-l-co img{display:block;width:17px;height:17px}
/* the brief's meta: the app's Clock and Gauge at 14, the duration in the mono it is set in, the level in the sans */
.ch-kickoff .ko-l-meta{margin-top:18px;display:flex;align-items:center;gap:18px}
.ch-kickoff .ko-l-meta span{display:flex;align-items:center;gap:6px;font:500 13px/1 var(--ko-sys);color:rgba(31,29,30,.55)}
.ch-kickoff .ko-l-meta span.ko-l-dur{font:400 13px/1 var(--f-mono)}
.ch-kickoff .ko-l-meta svg{width:14px;height:14px;color:rgba(31,29,30,.38)}
/* the description is the card's one paragraph, under its title like a lede */
.ch-kickoff .ko-l-desc{margin:22px 0 0;max-width:520px;font:400 14px/1.6 var(--ko-sys);color:rgba(31,29,30,.6);text-align:center;text-wrap:balance}
/* tools, skills, the manager: a quiet label column and its things, one line each. The block is as wide as its longest line and
   sits on the card's centre line; each line is as wide as its words, so a ring round it hugs them */
.ch-kickoff .ko-l-facts{margin:36px 0 0;display:flex;flex-direction:column;align-items:flex-start;gap:16px}
.ch-kickoff .ko-l-row{display:flex;align-items:center;min-height:30px}
.ch-kickoff .ko-l-row dt{flex:none;width:104px;font:400 13px/1.25 var(--ko-sys);color:rgba(31,29,30,.45)}
.ch-kickoff .ko-l-row dd{margin:0;display:flex;align-items:center;gap:7px}
/* the dock card's own chip (Chips.tsx), drawn on white: the time pill's ink tints, 13px, 6 by 11, the tool's real logo at 16 */
.ch-kickoff .ko-l-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;background:rgba(31,29,30,.035);box-shadow:inset 0 0 0 1px rgba(31,29,30,.09);
  font:400 13px/1.25 var(--ko-sys);color:rgba(31,29,30,.78);white-space:nowrap}
.ch-kickoff .ko-l-tool{padding-left:7px}
.ch-kickoff .ko-l-chip img{flex:none;display:block;width:16px;height:16px;border-radius:4px;object-fit:contain}
/* the manager: the card's own avatar (the faint concentric ring, the warm inner light), at the line's size */
.ch-kickoff .ko-l-who dd{gap:10px}
.ch-kickoff .ko-l-av{position:relative;flex:none;width:28px;height:28px}
.ch-kickoff .ko-l-av img{display:block;width:28px;height:28px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px rgba(0,0,0,.05)}
.ch-kickoff .ko-l-av i{position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 5px rgba(232,228,223,.6),0 0 1px 2px rgba(232,228,223,.5);pointer-events:none}
.ch-kickoff .ko-l-who b{font:500 14px/1.25 var(--ko-sys);color:#2A2118}
.ch-kickoff .ko-l-cta{margin-top:48px;display:flex;flex-direction:column;align-items:center;gap:16px}
.ch-kickoff .ko-l-time{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(31,29,30,.05);box-shadow:inset 0 0 0 1px rgba(31,29,30,.1);
  font:400 13px/19.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:rgba(31,29,30,.5)}
.ch-kickoff .ko-l-time svg{width:16px;height:16px;color:rgba(31,29,30,.55)}
.ch-kickoff .ko-l-time b{font-weight:400;color:rgba(31,29,30,.8)}
.ch-kickoff .ko-l-btn{position:relative;display:flex;align-items:center;justify-content:center}
/* the one place the app lets green glow: a breathing light behind the commit button */
.ch-kickoff .ko-glow{position:absolute;left:-12px;top:-12px;right:-12px;bottom:-12px;border-radius:9999px;pointer-events:none;filter:blur(16px);
  background:radial-gradient(closest-side,rgba(126,215,145,.55),rgba(126,215,145,.18) 62%,rgba(126,215,145,0) 100%);animation:ko-glow 2.8s var(--ko-apple) infinite}
@keyframes ko-glow{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.18);opacity:.9}}
/* the app's ink pill. b15: the learner presses it, so it is a real button: it lifts on hover, sets down on the press, and shows
   a ring on keyboard focus. 92 of air under it on the card leave room for the white key below it */
.ch-kickoff .ko-join{appearance:none;border:0;margin:0;position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:19px 48px;border-radius:999px;background:#1F1D1E;
  box-shadow:0 10px 28px -8px rgba(31,29,30,.5),0 3px 8px -3px rgba(31,29,30,.35);cursor:pointer;transition:transform .16s ease-out,background-color .16s ease-out}
.ch-kickoff .ko-join i{position:absolute;left:0;top:0;width:100%;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0))}
.ch-kickoff .ko-join span{position:relative;z-index:1;font:500 16px/1 var(--ko-sys);letter-spacing:-.01em;color:#fff}
.ch-kickoff .ko-join:hover{background:#2E2B2C;transform:translateY(-1px)}
.ch-kickoff .ko-join:active,.ch-kickoff .ko-join.ko-down{transform:scale(.95)}
.ch-kickoff .ko-join:focus-visible{outline:2px solid rgba(31,29,30,.55);outline-offset:3px}

/* until Navid starts on the project the card waits in its arriving state, its lines and its back key with it.
   On his first sentence they come in with the entrance they always had. */
.ch-kickoff.ko-brief .ko-l-card{opacity:0;transform:translateY(10px) scale(.96)}
.ch-kickoff.ko-brief .ko-rise{opacity:0;transform:translateY(14px)}
.ch-kickoff .ko-l-back{transition:opacity .25s ease-out}
.ch-kickoff.ko-brief .ko-l-back{opacity:0}

/* Join: the words leave in 130ms and the card grows 3.2 times on the app's spring, quicker here (500ms). At 220ms the landing
   gives way (300ms) to the meeting that is already drawn under it */
.ch-kickoff.ko-joining .ko-l-back{display:none}
.ch-kickoff.ko-joining .ko-l-in{opacity:0}
.ch-kickoff.ko-joining .ko-l-card{transform:scale(3.2);
  transition:transform .5s linear(0,.108,.299,.48,.626,.736,.815,.872,.911,.938,.958,.971,.98,.986,.99,.993,.995,.997,.998,.999,1) .02s}
.ch-kickoff.ko-reveal .ko-landing{opacity:0;pointer-events:none;transition:opacity .3s var(--ko-apple)}
.ch-kickoff.ko-met .ko-landing{visibility:hidden}
/* Navid flies into his tile in 450ms (the tour's seat change is 760ms), so he is in it as the meeting comes up */
#zt-root:has(.ch-kickoff.ko-joining:not(.ko-met)) .zt-guide{transition-duration:.45s}

/* ================= the meeting (b15). No top bar, so the grid stands 30 from every edge of the window:
   the deck fills the left column (1045.38 x 726 at 30, 30), the manager's video is a 16:9 tile at the top of the right column
   (464.62 x 261.35 at 1105.38, 30) and Notes sit under it, 16 below (464.62 x 448.65). One radius, 24, for all three ================= */
.ch-kickoff .ko-meet{position:absolute;left:0;top:0;width:1600px;height:786px;background:#F2F0ED}

/* ---- the deck: the manager shares his screen ---- */
.ch-kickoff .ko-player{position:absolute;left:30px;top:30px;width:1045.38px;height:726px;border-radius:24px;overflow:hidden;background:#222;
  box-shadow:0 1px 3px 0 rgba(0,0,0,.1),0 1px 2px -1px rgba(0,0,0,.1)}
/* the deck. The template's own tokens for this scenario: ground #222, ink #fff, label #B3B3B3, tile #333, brand #FF385C, at the
   deck's own sizes, weights and tracking (-.04em / -.05em). b15: set in the tour's own sans, so the chapter asks for no font.
   The stage is the template's 1280 wide reference, as tall as the column now that the top bar is gone */
.ch-kickoff .ko-stage{position:absolute;left:0;top:0;width:1280px;height:888.93px;transform:scale(.816703);transform-origin:0 0;overflow:hidden;background:#222;color:#fff;
  font-family:var(--f-sans);--q:6.68px;--qw:10.4538px;--qh:6.68px}
.ch-kickoff .ko-panel{position:absolute;left:0;top:0;width:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:clamp(40px,calc(7*var(--q)),84px);gap:clamp(14px,calc(2.4*var(--q)),30px);overflow:hidden;opacity:0;transition:opacity .22s cubic-bezier(.215,.61,.355,1)}
.ch-kickoff .ko-panel.ko-act{opacity:1;transition:opacity .38s cubic-bezier(.215,.61,.355,1)}
.ch-kickoff .ko-panel>*{max-width:100%;overflow-wrap:anywhere}
.ch-kickoff .ko-panel.ko-hero{background:linear-gradient(135deg,#FF385C 0%,#BF2A45 100%)}
/* the brand's mark, top left of every slide */
.ch-kickoff .ko-wm{position:absolute;top:clamp(26px,calc(5*var(--q)),48px);left:clamp(30px,calc(5*var(--q)),58px);display:inline-flex;align-items:center;gap:7px;height:clamp(30px,calc(4.5*var(--q)),56px);line-height:1;white-space:nowrap}
.ch-kickoff .ko-wm img{display:block;height:100%;width:auto;filter:brightness(0) invert(1)}
.ch-kickoff .ko-wm b{font:800 21px/1 var(--f-sans);letter-spacing:-.04em;color:#fff}
.ch-kickoff .ko-hero .ko-wm{height:clamp(38px,calc(5.5*var(--q)),68px)}
.ch-kickoff .ko-hero .ko-wm b{font-size:27px}
/* lines rise 22px, 85ms apart. A number lands from 1.22 with a little overshoot. (the deck's setPanel) */
.ch-kickoff .ko-u{opacity:0;transform:translateY(22px);transition:opacity 0s .22s,transform 0s .22s}
.ch-kickoff .ko-num.ko-u{transform:translateY(14px) scale(1.22)}
.ch-kickoff .ko-act .ko-u{opacity:1;transform:none;transition:opacity .58s cubic-bezier(.165,.84,.44,1) calc(.06s + var(--i,0)*.085s),transform .58s cubic-bezier(.165,.84,.44,1) calc(.06s + var(--i,0)*.085s)}
.ch-kickoff .ko-act .ko-num.ko-u{transition:opacity .68s cubic-bezier(.34,1.5,.64,1) .1s,transform .68s cubic-bezier(.34,1.5,.64,1) .1s}
.ch-kickoff .ko-st{font-weight:800;font-size:clamp(30px,min(calc(6.4*var(--qw)),calc(11.4*var(--qh))),88px);letter-spacing:-.04em;line-height:1.06;max-width:min(1120px,94%);color:#fff}
.ch-kickoff .ko-st.ko-st-s{font-size:clamp(20px,calc(4*var(--q)),40px)}
.ch-kickoff .ko-num{font-weight:800;font-size:clamp(56px,min(calc(15.6*var(--qw)),calc(27.8*var(--qh))),230px);letter-spacing:-.05em;line-height:.84;font-variant-numeric:tabular-nums;color:#fff}
.ch-kickoff .ko-cover{max-width:min(1140px,94%);display:flex;flex-direction:column;align-items:center;gap:clamp(14px,calc(2.6*var(--q)),28px)}
.ch-kickoff .ko-big{font-weight:800;font-size:clamp(40px,min(calc(9*var(--qw)),calc(16*var(--qh))),128px);letter-spacing:-.035em;line-height:.96;color:#fff}
.ch-kickoff .ko-sub{font-size:clamp(16px,calc(4*var(--q)),34px);font-weight:600;color:rgba(255,255,255,.85)}
.ch-kickoff .ko-flow{display:flex;align-items:center;gap:clamp(18px,calc(4.5*var(--q)),48px);flex-wrap:wrap;justify-content:center}
.ch-kickoff .ko-fnum{font-weight:800;font-size:clamp(44px,min(calc(11.7*var(--qw)),calc(20.8*var(--qh))),170px);letter-spacing:-.04em;line-height:.85;font-variant-numeric:tabular-nums}
.ch-kickoff .ko-fnum.ko-good{color:#FF385C}
.ch-kickoff .ko-fop{display:flex;flex-direction:column;align-items:center;gap:.3em;font-size:16px}
.ch-kickoff .ko-pill{background:#333;border:1px solid rgba(255,255,255,.15);color:#fff;font-weight:800;font-size:clamp(13px,calc(2.4*var(--q)),23px);padding:.35em .9em;border-radius:999px}
.ch-kickoff .ko-ar{font-size:clamp(22px,calc(5*var(--q)),46px);color:#B3B3B3;line-height:1.2}
/* the idle progress strip: one bar per chapter of the meeting, flush with the bottom of the deck (PlayerBar) */
.ch-kickoff .ko-strip{position:absolute;z-index:2;left:45px;right:45px;bottom:0;height:6px;display:flex;align-items:center;gap:3px;pointer-events:none}
.ch-kickoff .ko-strip i{position:relative;height:6px;min-width:0;border-radius:52px;overflow:hidden;background:rgba(255,255,255,.25)}
.ch-kickoff .ko-strip b{position:absolute;left:0;top:0;height:100%;width:0;border-radius:52px;background:#fff}
.ch-kickoff .ko-strip i:first-child b{width:100%}
.ch-kickoff.ko-reveal .ko-strip i:nth-child(2) b{width:62%;transition:width 40s linear}

/* ---- the manager's video, beside his slides. The guide takes the seat; until he lands it is the video's dark ground ---- */
.ch-kickoff .ko-slot{position:absolute;left:1105.38px;top:30px;width:464.62px;height:261.35px;border-radius:24px;background:#2B2B2B}
.ch-kickoff.ko-live .ko-slot{background:transparent}

/* ---- Notes (b15): no coloured header. A heading, a hairline under it inside the panel's padding, then tight bullets ---- */
.ch-kickoff .ko-notes{position:absolute;left:1105.38px;top:307.35px;width:464.62px;height:448.65px;box-sizing:border-box;padding:22px 24px 12px;border-radius:24px;background:#fff;
  box-shadow:0 1px 3px 0 rgba(0,0,0,.06);display:flex;flex-direction:column;overflow:hidden}
.ch-kickoff .ko-n-ttl{flex:none;margin:0;padding-bottom:12px;border-bottom:1px solid rgba(31,29,30,.08);font:600 15px/20px var(--ko-sys);letter-spacing:-.01em;color:#2A2118}
.ch-kickoff .ko-n-body{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:12px;overflow-y:auto;scrollbar-width:none}
.ch-kickoff .ko-n-body::-webkit-scrollbar{display:none}
.ch-kickoff .ko-list{flex:none;display:flex;flex-direction:column;gap:2px}
.ch-kickoff .ko-fill{flex:1;min-height:40px;cursor:text}
/* one note: a 16 wide point, 10 of air, the line. Lines are 22 high, so three notes sit in 70 */
.ch-kickoff .ko-row{position:relative;display:flex;align-items:flex-start;gap:10px;animation:ko-in .26s var(--ko-apple) both}
@keyframes ko-in{from{transform:translateY(4px)}}
.ch-kickoff .ko-pt{position:relative;flex:none;width:16px;height:22px;display:flex;align-items:center;justify-content:center}
.ch-kickoff .ko-dot{display:block;width:6px;height:6px;border-radius:50%;background:#1F1D1E}
.ch-kickoff .ko-tx{flex:1;min-width:0}
.ch-kickoff .ko-ta{appearance:none;display:block;width:100%;height:22px;min-height:22px;max-height:154px;margin:0;padding:0;border:0;outline:0;resize:none;overflow-y:auto;background:transparent;border-radius:0;
  font:400 14px/22px var(--ko-sys);letter-spacing:0;color:#2A2118;caret-color:currentColor;scrollbar-width:none}
.ch-kickoff .ko-ta::placeholder{color:rgba(31,29,30,.4);opacity:1}
.ch-kickoff .ko-p{margin:0;min-height:22px;font:400 14px/22px var(--ko-sys);color:#2A2118;cursor:default;overflow-wrap:anywhere}
/* a note that carries the brief: its point becomes the green tick, drawn (GradedPointCircle) */
.ch-kickoff .ko-ok{width:18px;height:18px;animation:ko-pop .3s cubic-bezier(.34,1.56,.64,1) both}
.ch-kickoff .ko-ok-t{stroke-dasharray:20;animation:ko-draw .35s ease-out backwards}
@keyframes ko-pop{from{transform:scale(.35)}}
@keyframes ko-draw{from{stroke-dashoffset:20}}
/* a point the notes missed: the black star, its words decoded letter by letter (DecryptedText) */
.ch-kickoff .ko-miss{width:13px;height:13px}
.ch-kickoff .ko-ch{display:inline-block;opacity:0;color:#49BA61;filter:blur(.6px);transition:opacity .12s ease-out,color .12s ease-out,filter .12s ease-out}
.ch-kickoff .ko-ch.ko-in{opacity:1}
.ch-kickoff .ko-ch.ko-done{color:#1F1D1E;filter:none}

/* the tour's white key under the notes, set in two lines for the note turn only (the chapter adds .ko-tip2 while the turn is
   open): what to do over how, so the key stays inside the notes panel. It follows the notes down as each line comes in */
#zt-root:has(.ch-kickoff) .zt-tip.ko-tip2{height:auto;flex-direction:column;align-items:flex-start;gap:6px;padding:11px 12px 12px;font-size:13px;
  transition:opacity .28s var(--zt-ease),transform .5s var(--zt-ease),top .22s var(--zt-ease)}
#zt-root:has(.ch-kickoff) .zt-tip.ko-tip2>b{padding-right:0;margin-right:0;box-shadow:none;font-size:13px;line-height:1.15}
#zt-root:has(.ch-kickoff) .zt-tip.ko-tip2>span{line-height:1.15}
/* while the note turn is open the captions stand aside for its pill (his voice still says "Take your first note."), and once the
   learner has acted (joined, or handed the notes in) the pill steps aside quickly so his next line comes in clean */
#zt-root:has(.ch-kickoff.ko-asking) .zt-cc{opacity:0}
#zt-root:has(.ch-kickoff.ko-pilloff) .zt-turn{opacity:0;transition:opacity .15s ease-out}

/* ch/04-pou.css */
/* 4 · the conversation with your manager. b15 is b4's screen again, the one Navid picked: the white understanding pill
   with four segments, his voice notes in one centred thread, one "Try saying this" card, one mic. No meeting notes.
   Dark tokens from the app. Drawn inside the pop-up at 90%, so the sentence to read is set large.
   Added in b15: the rank chip, the mic's X and send key, and the learner's words landing as they are said. */
.ch-pou{background:#1E1E1E;color:#f2f1ee;font-family:var(--f-sans);letter-spacing:-.01em;
  --pu-card:#262626;--pu-soft:#282828;--pu-bubble:#333333;--pu-line:rgba(255,255,255,.075);--pu-line2:rgba(255,255,255,.04);
  --pu-tx:#f2f1ee;--pu-tx2:#a5a29b;--pu-tx3:#6d6a63;--pu-tx4:#4a4844;--pu-ok:#3fb968}

/* ---------- the understanding pill: white, three checks, the brain greens when full ---------- */
.ch-pou .pu-top{position:absolute;left:0;right:0;top:26px;display:flex;justify-content:center}
.ch-pou .pu-pill{display:inline-flex;align-items:center;gap:12px;height:40px;padding:0 13px 0 17px;border-radius:999px;background:#fff;color:#1f1d1e;white-space:nowrap;
  box-shadow:0 16px 30px -8px rgba(0,0,0,.42),0 3px 10px rgba(0,0,0,.22)}
.ch-pou .pu-pill-l{font:600 13.5px/1 var(--f-sans);letter-spacing:-.01em}
.ch-pou .pu-meter{display:inline-flex;gap:5px}
.ch-pou .pu-meter i{width:26px;height:6px;border-radius:99px;background:rgba(31,29,30,.13);
  transition:background .5s var(--zt-ease),transform .45s cubic-bezier(.34,1.56,.64,1)}
.ch-pou .pu-meter i.pu-on{background:linear-gradient(90deg,#49ba61,#aff4be)}
.ch-pou .pu-meter i.pu-pop{transform:scaleY(1.7)}
.ch-pou .pu-brain{display:block;width:21px;height:21px;color:#9a9896;transition:color .48s var(--zt-ease)}
.ch-pou .pu-pill.pu-full .pu-brain{color:#49ba61}
.ch-pou .pu-pill.pu-full{animation:pou-full .9s var(--zt-ease) 1}
@keyframes pou-full{0%{transform:scale(1)}38%{transform:scale(1.045)}100%{transform:scale(1)}}

/* ---------- the thread: one 600px column, voice notes only ---------- */
.ch-pou .pu-thread{position:absolute;left:500px;top:84px;width:600px;height:452px;padding:0 28px;display:flex;flex-direction:column;gap:20px;
  overflow-y:auto;scrollbar-width:none}
.ch-pou .pu-thread::-webkit-scrollbar{display:none}
.ch-pou .pu-thread>*{flex:0 0 auto}
.ch-pou.pu-told .pu-thread{height:516px}
.ch-pou .pu-who{display:flex;align-items:baseline;gap:8px;height:16px;margin:0 0 -10px 51px;white-space:nowrap;
  opacity:0;transform:translateY(4px);transition:opacity .4s var(--zt-ease),transform .5s var(--zt-ease)}
.ch-pou.pu-seated .pu-who{opacity:1;transform:none}
.ch-pou .pu-who b{font:600 13px/16px var(--f-sans);color:var(--pu-tx)}
.ch-pou .pu-who span{font:400 12.5px/16px var(--f-sans);color:var(--pu-tx3)}

.ch-pou .pu-note{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.ch-pou .pu-note.pu-me{align-items:flex-end;transition:opacity .3s var(--zt-ease)}
.ch-pou .pu-note.pu-me.pu-miss{opacity:.5}
.ch-pou .pu-row{display:flex;align-items:center;gap:11px}
/* Navid's seat. The slot never animates, so the engine can always measure it. */
.ch-pou .pu-avw{position:relative;width:40px;height:40px;flex:0 0 40px}
.ch-pou .pu-slot{position:absolute;inset:0;border-radius:50%;background:var(--pu-card);box-shadow:inset 0 0 0 1px var(--pu-line)}
.ch-pou .pu-slot::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none}
.ch-pou.pu-seated .pu-slot::after{animation:pou-land .8s var(--zt-ease) 1}
@keyframes pou-land{from{box-shadow:0 0 0 0 rgba(73,186,97,.6)}to{box-shadow:0 0 0 13px rgba(73,186,97,0)}}

.ch-pou .pu-card,.ch-pou .pu-tr{opacity:0;transform:translateY(8px);filter:blur(10px);
  transition:opacity .5s var(--zt-ease),transform .6s var(--zt-ease),filter .5s var(--zt-ease)}
.ch-pou .pu-note.pu-on .pu-card,.ch-pou .pu-note.pu-on .pu-tr{opacity:1;transform:none;filter:none}
.ch-pou .pu-card{display:flex;align-items:center;gap:13px;height:54px;padding:0 16px 0 7px;border-radius:26px;background:var(--pu-soft);box-shadow:inset 0 0 0 1px var(--pu-line2)}
.ch-pou .pu-me .pu-card{background:var(--pu-bubble);box-shadow:none}
.ch-pou.pu-seated .pu-note:first-of-type .pu-card{animation:pou-wake .55s var(--zt-ease) 1}
@keyframes pou-wake{40%{transform:scale(1.035)}100%{transform:none}}
.ch-pou .pu-play{width:40px;height:40px;flex:0 0 40px;border-radius:99px;background:var(--pu-card);box-shadow:inset 0 0 0 1px var(--pu-line);display:grid;place-items:center;color:var(--pu-tx)}
.ch-pou .pu-play svg{display:block;width:16px;height:16px}
.ch-pou .pu-play .pu-i-pause{display:none}
.ch-pou .pu-note.pu-playing .pu-play .pu-i-play{display:none}
.ch-pou .pu-note.pu-playing .pu-play .pu-i-pause{display:block}
.ch-pou .pu-wave{display:flex;align-items:center;gap:2.5px;height:26px}
.ch-pou .pu-wave i{width:2.5px;border-radius:9px;background:var(--pu-tx4);flex:0 0 auto;transition:background .12s linear}
.ch-pou .pu-wave i.pu-lit{background:var(--pu-tx)}
.ch-pou .pu-me .pu-wave i{background:rgba(255,255,255,.2);transition:background .3s linear,height .14s linear}
.ch-pou .pu-me .pu-wave i.pu-lit{background:rgba(255,255,255,.38)}
.ch-pou .pu-me.pu-rec .pu-wave i.pu-lit{background:var(--pu-tx)}
.ch-pou .pu-note.pu-playing .pu-wave i{animation:pou-wave 1s ease-in-out infinite alternate}
@keyframes pou-wave{from{transform:scaleY(.42)}to{transform:scaleY(1)}}
.ch-pou .pu-dur{flex:0 0 auto;min-width:27px;font:400 11px/1 var(--f-mono);color:var(--pu-tx3);font-variant-numeric:tabular-nums}
/* while the learner is recording, the play button is a record light */
.ch-pou .pu-me.pu-rec .pu-play svg{display:none}
.ch-pou .pu-me.pu-rec .pu-play::after{content:"";width:10px;height:10px;border-radius:50%;background:#ff6a4d;animation:pou-blink 1s ease-in-out infinite alternate}
@keyframes pou-blink{from{opacity:.35}to{opacity:1}}

/* the transcript: real voice-note chrome, closed until asked for */
.ch-pou .pu-tr{appearance:none;border:0;background:none;display:inline-flex;align-items:center;gap:6px;margin-left:51px;padding:2px 4px;border-radius:6px;cursor:pointer;
  font:700 10px/12px var(--f-mono);letter-spacing:1.5px;text-transform:uppercase;color:var(--pu-tx3)}
.ch-pou .pu-tr:hover{color:var(--pu-tx2)}
.ch-pou .pu-tr svg{width:13px;height:13px;transition:transform .24s var(--zt-ease)}
.ch-pou .pu-note.pu-open .pu-tr svg{transform:rotate(180deg)}
.ch-pou .pu-trb{display:none;margin-left:55px;max-width:440px;font:400 13px/1.6 var(--f-sans);color:var(--pu-tx2)}
.ch-pou .pu-note.pu-open .pu-trb{display:block;animation:pou-in .4s var(--zt-ease) 1}
@keyframes pou-in{from{opacity:0;transform:translateY(6px);filter:blur(6px)}}

/* the learner's own words, live, under their note. Two lines, newest kept in view. */
.ch-pou .pu-said{display:none;flex-direction:column;justify-content:flex-end;max-width:470px;max-height:63px;overflow:hidden;padding:0 4px;text-align:right;
  font:400 13.5px/21px var(--f-sans);color:var(--pu-tx2)}
.ch-pou .pu-me.pu-has .pu-said{display:flex}
.ch-pou .pu-said .pu-k,.ch-pou .pu-bubble b{font-weight:600;color:var(--pu-tx)}
.ch-pou .pu-bubble{display:none;max-width:82%;padding:10px 15px;border-radius:20px;background:var(--pu-bubble);font:400 14px/1.5 var(--f-sans);color:var(--pu-tx2);overflow-wrap:break-word}
.ch-pou .pu-me.pu-typed .pu-row,.ch-pou .pu-me.pu-typed .pu-said{display:none}
.ch-pou .pu-me.pu-typed .pu-bubble{display:block;animation:pou-in .45s var(--zt-ease) 1}

/* ---------- what to say, and the one mic ---------- */
.ch-pou .pu-bottom{position:absolute;left:380px;top:476px;width:840px;height:280px}
/* "Try saying this": the sentence, big enough to read aloud. Its four facts light as they are heard.
   Anchored by its bottom edge, so a longer sentence grows upward and never pushes the mic. */
.ch-pou .pu-try{position:absolute;left:0;right:0;bottom:164px;padding:16px 26px 19px;border-radius:24px;background:var(--pu-card);box-shadow:inset 0 0 0 1px var(--pu-line);
  opacity:0;transform:translateY(12px);filter:blur(8px);pointer-events:none;
  transition:opacity .45s var(--zt-ease),transform .6s var(--zt-ease),filter .45s var(--zt-ease)}
.ch-pou.pu-ask .pu-try{opacity:1;transform:none;filter:none}
.ch-pou.pu-told .pu-try{opacity:0;transform:translateY(8px) scale(.985);filter:blur(8px);transition-duration:.3s,.4s,.3s}
.ch-pou .pu-try-l{display:inline-block;height:26px;padding:0 11px;border-radius:999px;background:#f4f3f1;color:#161616;font:600 13px/26px var(--f-sans);letter-spacing:-.005em}
.ch-pou .pu-try-t{margin:9px 0 0;font:500 24px/34px var(--f-sans);letter-spacing:-.015em;color:var(--pu-tx);text-wrap:balance}
.ch-pou .pu-f{display:inline-block;padding:0 7px;margin:0 -4px;border-radius:9px;background:rgba(255,255,255,.085);
  transition:background .35s var(--zt-ease),box-shadow .35s var(--zt-ease),color .35s var(--zt-ease)}
.ch-pou .pu-f.pu-hit{background:rgba(63,185,104,.24);box-shadow:inset 0 0 0 1px rgba(63,185,104,.55);color:#fff;animation:pou-ping .5s var(--zt-ease) 1}
@keyframes pou-ping{40%{transform:scale(1.06)}100%{transform:none}}
.ch-pou.pu-recap .pu-said .pu-k{animation:pou-said .9s var(--zt-ease) 1}
@keyframes pou-said{35%{color:#6fd189}100%{color:var(--pu-tx)}}

/* every mic state gets one short line, right above the mic */
.ch-pou .pu-line{position:absolute;left:0;right:0;top:132px;height:20px;text-align:center;white-space:nowrap;font:400 13.5px/20px var(--f-sans);color:var(--pu-tx2);
  opacity:0;transform:translateY(4px);transition:opacity .24s var(--zt-ease),transform .36s var(--zt-ease)}
.ch-pou .pu-line.pu-show{opacity:1;transform:none}
.ch-pou .pu-line b{font-weight:600;color:var(--pu-tx)}

.ch-pou .pu-ctl{position:absolute;left:0;right:0;top:158px;height:58px;display:flex;justify-content:center}
.ch-pou .pu-mic{appearance:none;border:0;margin:0;padding:0;position:relative;display:inline-flex;align-items:center;height:58px;min-width:58px;border-radius:999px;cursor:pointer;
  background:var(--pu-card);color:var(--pu-tx);box-shadow:inset 0 0 0 1px var(--pu-line),0 1px 3px rgba(0,0,0,.4);touch-action:none;-webkit-user-select:none;user-select:none;
  opacity:.38;filter:grayscale(1);pointer-events:none;
  transition:opacity .4s var(--zt-ease),filter .4s var(--zt-ease),background .3s var(--zt-ease),color .3s var(--zt-ease),box-shadow .3s var(--zt-ease),padding .45s var(--zt-ease),transform .3s var(--zt-ease)}
.ch-pou.pu-ready .pu-mic{opacity:1;filter:none;pointer-events:auto}
.ch-pou.pu-ready .pu-mic:hover{background:#2d2d2d}
.ch-pou .pu-mic-ic{width:58px;height:58px;flex:0 0 58px;display:grid;place-items:center}
.ch-pou .pu-mic-ic>*{grid-area:1/1}
.ch-pou .pu-mic-d{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;transition:background .3s var(--zt-ease),color .3s var(--zt-ease),transform .14s var(--zt-ease)}
.ch-pou .pu-mic-d svg{display:block;width:23px;height:23px}
.ch-pou .pu-mic-d .pu-i-tick,.ch-pou .pu-mic-d .pu-i-up,.ch-pou .pu-spin{display:none}
.ch-pou .pu-spin{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.16);border-top-color:var(--pu-tx);animation:pou-spin .8s linear infinite}
@keyframes pou-spin{to{transform:rotate(360deg)}}
.ch-pou .pu-live{display:flex;align-items:center;gap:2.5px;height:24px;width:0;overflow:hidden;opacity:0;transition:width .45s var(--zt-ease),opacity .3s var(--zt-ease)}
.ch-pou .pu-live i{width:2.5px;height:3px;border-radius:9px;background:var(--pu-tx);flex:0 0 auto;transition:height .07s linear}
.ch-pou .pu-time{width:0;overflow:hidden;opacity:0;text-align:right;font:400 11px/1 var(--f-mono);color:var(--pu-tx2);font-variant-numeric:tabular-nums;
  transition:width .45s var(--zt-ease),opacity .3s var(--zt-ease),margin .45s var(--zt-ease)}
/* listening: the mic opens into a live bar */
.ch-pou[data-mic="listening"] .pu-mic{padding-right:12px;background:#2c2c2c;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),0 1px 3px rgba(0,0,0,.4)}
.ch-pou[data-mic="listening"] .pu-mic-d{background:#fff;color:#0d0d0d}
.ch-pou[data-mic="listening"] .pu-live{width:128px;opacity:1}
.ch-pou[data-mic="listening"] .pu-time{width:30px;margin-left:12px;opacity:1}
/* checking: a short wait */
.ch-pou[data-mic="checking"] .pu-mic{pointer-events:none}
.ch-pou[data-mic="checking"] .pu-i-mic{display:none}
.ch-pou[data-mic="checking"] .pu-spin{display:block}
/* no mic: it steps back, the field takes over */
.ch-pou[data-mic="denied"] .pu-mic{opacity:.38;filter:grayscale(1)}
/* passed */
.ch-pou.pu-passed .pu-mic{background:var(--pu-ok);color:#06210f;box-shadow:none;pointer-events:none;opacity:1;filter:none;animation:pou-wake .55s var(--zt-ease) 1}
.ch-pou.pu-passed .pu-mic-d .pu-i-mic,.ch-pou.pu-passed .pu-spin{display:none}
.ch-pou.pu-passed .pu-mic-d .pu-i-tick{display:block}
.ch-pou.pu-passed .pu-mic-d{background:none;color:inherit}

/* the product's own label under the mic */
.ch-pou .pu-hint{position:absolute;left:0;right:0;top:226px;text-align:center;font:700 10px/12px var(--f-mono);letter-spacing:1.6px;text-transform:uppercase;color:var(--pu-tx3);
  opacity:.45;transition:opacity .3s var(--zt-ease),color .3s var(--zt-ease)}
.ch-pou .pu-hint b{font-weight:700;color:var(--pu-tx2)}
.ch-pou.pu-ready .pu-hint{opacity:1}
.ch-pou[data-mic="listening"] .pu-hint,.ch-pou[data-mic="checking"] .pu-hint{opacity:0}
.ch-pou.pu-passed .pu-hint{opacity:1;color:#6fd189}
.ch-pou .pu-alt{appearance:none;border:0;background:none;position:absolute;left:50%;top:244px;transform:translateX(-50%);padding:5px 9px;border-radius:8px;cursor:pointer;white-space:nowrap;
  font:500 12.5px/16px var(--f-sans);letter-spacing:-.01em;color:var(--pu-tx3);opacity:.45;pointer-events:none;transition:opacity .3s var(--zt-ease),color .2s}
.ch-pou.pu-ready .pu-alt{opacity:1;pointer-events:auto}
.ch-pou .pu-alt:hover{color:var(--pu-tx)}
.ch-pou[data-mic="listening"] .pu-alt,.ch-pou[data-mic="checking"] .pu-alt{opacity:0;pointer-events:none}

/* the typed way through: the app's answer box */
.ch-pou .pu-field{position:absolute;left:148px;right:148px;top:224px;height:46px;display:none;align-items:center;gap:8px;padding:0 6px 0 18px;border-radius:26px;
  background:var(--pu-card);box-shadow:inset 0 0 0 1px var(--pu-line);transition:box-shadow .2s}
.ch-pou .pu-field:focus-within{box-shadow:inset 0 0 0 1px rgba(255,255,255,.24)}
.ch-pou.pu-typing .pu-field{display:flex;animation:pou-in .4s var(--zt-ease) 1}
.ch-pou.pu-typing .pu-hint,.ch-pou.pu-typing .pu-alt{display:none}
.ch-pou .pu-in{flex:1;min-width:0;height:34px;border:0;outline:0;background:none;color:var(--pu-tx);font:400 14px/1 var(--f-sans);letter-spacing:-.01em}
.ch-pou .pu-in::placeholder{color:var(--pu-tx3)}
.ch-pou .pu-send{appearance:none;border:0;padding:0;width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:#fff;color:#0d0d0d;display:grid;place-items:center;cursor:pointer;
  transition:opacity .2s,transform .24s var(--zt-ease)}
.ch-pou .pu-send svg{display:block;width:17px;height:17px}
.ch-pou .pu-send:disabled{opacity:.3;cursor:default}
.ch-pou .pu-send:not(:disabled):hover{transform:scale(1.06)}
.ch-pou.pu-passed .pu-alt,.ch-pou.pu-passed .pu-field,.ch-pou.pu-passed .pu-line{display:none}
.ch-pou.pu-passed .pu-hint{display:block}

/* ---------- b15: the rank chip, top right, as the app's HUD draws it: drawn at 50 high and zoomed to 33 ---------- */
.ch-pou .pu-lvl-w{position:absolute;right:32px;top:29.5px}
.ch-pou .pu-lvl{zoom:.66;display:flex;align-items:center;padding:10px 20px;border:2px solid rgba(255,255,255,.1);border-radius:30px;
  background:rgba(0,0,0,.2);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);opacity:0;transform:scale(.6);transform-origin:100% 50%}
.ch-pou.pu-lvl-on .pu-lvl{opacity:1;transform:none;transition:opacity .25s ease-out,transform .6s cubic-bezier(.34,1.56,.64,1)}
.ch-pou .pu-lvl-in{position:relative;display:flex;align-items:center;gap:8px}
.ch-pou .pu-lvl-in img{display:block;flex:none;width:25.4px;height:26px;object-fit:cover}
.ch-pou .pu-lvl-in p{margin:0;font:400 22px/16px var(--f-mono);letter-spacing:-1.1px;white-space:nowrap;color:#fff;font-feature-settings:'lnum' 1,'tnum' 1;text-box-trim:trim-both;text-box-edge:cap alphabetic}
.ch-pou .pu-lvl-b{position:absolute;inset:0;z-index:1;pointer-events:none}
.ch-pou .pu-lvl-b b{position:absolute;left:50%;top:0;white-space:nowrap;font:500 15px/1 var(--f-mono);font-variant-numeric:tabular-nums;color:#FFD764;text-shadow:0 2px 10px rgba(0,0,0,.55);
  animation:pou-earn 1.25s cubic-bezier(.22,.61,.36,1) both}
.ch-pou .pu-lvl-b i{position:absolute;left:50%;top:50%;width:5px;height:5px;border-radius:50%;background:#FFD764}
@keyframes pou-earn{0%{opacity:0;transform:translate(-50%,4px) scale(.9)}33%,66%{opacity:1}100%{opacity:0;transform:translate(-50%,-36px) scale(1)}}

/* ---------- b15: the open mic. Its X throws the take away; after a click its dot is the send key ---------- */
.ch-pou .pu-mic:focus{outline:0}
.ch-pou .pu-mic:focus-visible{box-shadow:inset 0 0 0 1px var(--pu-line),0 0 0 2px rgba(255,255,255,.4)}
.ch-pou .pu-x{appearance:none;border:0;margin:0;padding:0;display:grid;place-items:center;flex:0 0 auto;width:0;height:34px;border-radius:50%;overflow:hidden;opacity:0;
  background:rgba(255,255,255,.07);color:var(--pu-tx2);cursor:pointer;pointer-events:none;
  transition:width .45s var(--zt-ease),margin .45s var(--zt-ease),opacity .3s var(--zt-ease),background .2s,color .2s,transform .12s var(--zt-ease)}
.ch-pou .pu-x svg{display:block;flex:none;width:15px;height:15px}
.ch-pou[data-mic="listening"] .pu-x{width:34px;margin-left:14px;opacity:1;pointer-events:auto}
.ch-pou[data-mic="listening"] .pu-x:hover{background:rgba(255,255,255,.14);color:var(--pu-tx)}
.ch-pou[data-mic="listening"] .pu-x:active{transform:scale(.9)}
.ch-pou.pu-latched[data-mic="listening"] .pu-mic-d .pu-i-mic{display:none}
.ch-pou.pu-latched[data-mic="listening"] .pu-mic-d .pu-i-up{display:block}
.ch-pou[data-mic="listening"] .pu-mic:active:not(:has(.pu-x:active)) .pu-mic-d,.ch-pou.pu-press .pu-mic-d{transform:scale(.88)}

/* ---------- b15: the learner's words land one at a time where the next one goes; a thrown away take sinks out ---------- */
.ch-pou .pu-said-t{margin:0}
.ch-pou .pu-w{display:inline-block;opacity:0;transform:translateY(4px);filter:blur(3px);
  transition:opacity .18s ease,transform .3s var(--zt-ease),filter .3s var(--zt-ease)}
.ch-pou .pu-w.pu-on{opacity:1;transform:none;filter:none}
.ch-pou .pu-caret{position:relative;display:inline-block;width:0;height:1.3em;vertical-align:-.3em}
.ch-pou .pu-caret::before{content:"";position:absolute;left:2px;top:0;bottom:0;width:1.5px;border-radius:1px;background:var(--pu-tx2);animation:pou-caret 1.06s steps(1,end) infinite}
@keyframes pou-caret{50%{opacity:0}}
.ch-pou .pu-note.pu-me.pu-gone{opacity:0;transform:translateY(5px);filter:blur(4px);transition:opacity .2s ease,transform .24s var(--zt-ease),filter .24s var(--zt-ease)}

/* the white key steps aside while the mic is open and once the learner's own note is in the thread (it would sit on it),
   and a ring that moves (card to send key and back) goes at once */
#zt-root:has(.ch-pou[data-mic="listening"],.ch-pou[data-mic="checking"],.ch-pou.pu-typing,.ch-pou .pu-note.pu-me) #zt-tip{opacity:0;transform:translateY(4px);pointer-events:none}
#zt-root:has(.ch-pou[data-mic]:not([data-mic="passed"])) #zt-ink g.zt-gone{display:none}

@media (prefers-reduced-motion:reduce){
  .ch-pou .pu-note.pu-playing .pu-wave i,.ch-pou .pu-spin,.ch-pou .pu-me.pu-rec .pu-play::after,.ch-pou .pu-caret::before{animation:none}
}

/* ch/05-workspace.css */
/* 5 · workspace and feedback. A rebuild of the real Stage workspace, read from zero-core-ui
   (origin/dev, 2026-10-12): StageDetailsPage's workspaceHeader / workspaceRail / workspaceChat /
   workspaceComposer scoped sheets and the in-thread feedback card (.fbunit + the score band).
   b15: Navid is the only coach, so the coach's pill and panel are gone, and so are the tools.
   The canvas is the app's own window, 1600 x 772, with the app's CSS pixels 1:1. The surface is
   dark (#1E1E1E) in Do mode. Learn mode ("I'm stuck") is the one light surface (#FEFEFE): it is a
   second copy of the frame, revealed by the app's bottom-centre ripple.
   Mono labels are PP Supply Mono (the app registers it as 'Supply Mono' at one weight, so the
   sheets' font-weight 700 is the browser's own bold of the regular face, here as there). */
.ch-workspace{background:#1E1E1E;color:#f2f1ee;font-family:var(--f-sans)}

/* ---------- tokens (the scoped sheets' own values) ---------- */
.ch-workspace .ws-app{
  --w-bg:#1e1e1e;--w-card:#262626;--w-panel:#242424;--w-bubble:#333333;--w-soft:#282828;--w-hover:rgba(255,255,255,.06);
  --w-line:rgba(255,255,255,.075);--w-line2:rgba(255,255,255,.04);
  --w-tx:#f2f1ee;--w-tx2:#a5a29b;--w-tx3:#6d6a63;--w-tx4:#4a4844;
  --w-acc:#ffffff;--w-accsoft:rgba(255,255,255,.08);--w-onacc:#0d0d0d;--w-shadow:0 1px 3px rgba(0,0,0,.4);
  --w-ease:cubic-bezier(.625,.05,0,1);--w-tq:.24s;--w-tm:.48s;--w-ts:.6s;
  --w-mono:var(--f-mono);
  position:absolute;z-index:1;left:0;top:0;width:1600px;height:772px;display:flex;flex-direction:column;overflow:hidden;
  background:var(--w-bg);color:var(--w-tx);font-family:var(--f-sans);font-size:14px;line-height:1.55;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
.ch-workspace .ws-app[data-theme="light"]{
  --w-bg:#fefefe;--w-card:#ffffff;--w-panel:#fafafa;--w-bubble:#f2f2f3;--w-soft:#f6f6f7;--w-hover:#f0f0f1;
  --w-line:rgba(13,13,13,.055);--w-line2:rgba(13,13,13,.03);
  --w-tx:#111113;--w-tx2:#63636a;--w-tx3:#9a9aa0;--w-tx4:#c4c4ca;
  --w-acc:#111113;--w-accsoft:rgba(13,13,13,.05);--w-onacc:#ffffff;--w-shadow:0 1px 3px rgba(0,0,0,.05)}
.ch-workspace .ws-app *{box-sizing:border-box;margin:0;padding:0}
.ch-workspace .ws-app button{font-family:inherit;color:inherit;background:none;border:none;letter-spacing:inherit}
.ch-workspace .ws-app svg{display:block}
.ch-workspace .ws-lbl{font-family:var(--w-mono);font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--w-tx2)}

/* ---------- top bar: back, spacer, the rank pill ---------- */
.ch-workspace .ws-topbar{flex:0 0 auto;height:52px;display:flex;align-items:center;gap:9px;padding:0 16px;background:var(--w-bg);position:relative;z-index:20}
.ch-workspace .ws-spacer{flex:1}
.ch-workspace .ws-back{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--w-tx2);animation:ws-slidelr .5s var(--w-ease) both}
.ch-workspace .ws-back svg{width:20px;height:20px}
/* the HUD rank pill, drawn for a 50px design height and zoomed to the bar's 33 */
.ch-workspace .ws-xp{flex:0 0 auto;zoom:.66;display:flex;flex-direction:column;align-items:flex-start;padding:10px 20px;border-radius:30px;
  background:rgba(0,0,0,.2);border:2px solid rgba(255,255,255,.1);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.ch-workspace .ws-xp>span{display:flex;align-items:center;gap:8px;width:100%}
.ch-workspace .ws-xp img{display:block;width:25.4px;height:26px;object-fit:cover}
.ch-workspace .ws-xp i{font-style:normal;font-family:var(--f-mono);font-weight:400;font-size:22px;letter-spacing:-1.1px;line-height:16px;color:#fff;white-space:nowrap;
  text-box-trim:trim-both;text-box-edge:cap alphabetic;font-feature-settings:'lnum' 1,'tnum' 1}

/* a seat. The engine draws Navid over the empty slot. The initial is the app's own fallback for a missing portrait */
.ch-workspace .ws-seat b{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;background:var(--w-soft);color:var(--w-tx2);font-size:13px;font-weight:600;line-height:1}
.ch-workspace .ws-slot{position:absolute;inset:0;border-radius:50%;display:block}

/* ---------- the row: rail | gutter | chat ---------- */
.ch-workspace .ws-work{flex:1 1 auto;display:flex;min-height:0;width:100%}
.ch-workspace .ws-gutter{flex:0 0 5px}

/* ---------- rail ---------- */
.ch-workspace .ws-rail{flex:0 0 312px;min-width:272px;max-width:460px;background:var(--w-bg);display:flex;flex-direction:column;overflow:hidden}
.ch-workspace .ws-rail-top{padding:0 20px}
.ch-workspace .ws-brand{height:54px;display:flex;align-items:center;gap:11px}
.ch-workspace .ws-logo{flex:0 0 auto;width:38px;height:38px;border-radius:99px;background:var(--w-card);border:1px solid var(--w-line);display:grid;place-items:center;overflow:hidden}
.ch-workspace .ws-logo img{display:block;width:100%;height:100%;object-fit:contain;padding:6px}
.ch-workspace .ws-brand-t{font-size:14.5px;font-weight:600;line-height:1.28;letter-spacing:-.01em;color:var(--w-tx)}
.ch-workspace .ws-rail-body{flex:1;overflow:hidden;padding:16px 16px 20px;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 18px,#000 calc(100% - 22px),transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 18px,#000 calc(100% - 22px),transparent 100%)}
.ch-workspace .ws-active{position:relative;border:1px solid var(--w-line);border-radius:16px;padding:16px 16px 8px;margin-bottom:20px}
.ch-workspace .ws-active-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
.ch-workspace .ws-active-h div{flex:1;font-size:19px;font-weight:700;line-height:1.24;letter-spacing:-.02em}
.ch-workspace .ws-timer{margin-bottom:16px}
.ch-workspace .ws-timer-row{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.ch-workspace .ws-timer-row svg{width:14px;height:14px;color:var(--w-tx3)}
.ch-workspace .ws-timer-row span{font-family:var(--w-mono);font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--w-tx2)}
.ch-workspace .ws-timer-row b{margin-left:auto;font-family:var(--w-mono);font-size:13px;color:var(--w-tx);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.5px}
.ch-workspace .ws-timer-track{height:3px;border-radius:99px;background:var(--w-hover);overflow:hidden}
.ch-workspace .ws-timer-track i{display:block;height:100%;background:var(--w-acc);border-radius:99px;transition:width 1s linear}
.ch-workspace .ws-morph{border-top:1px solid var(--w-line);margin-top:16px;padding-top:18px}
.ch-workspace .ws-morph>.ws-lbl{display:block;margin-bottom:8px}
.ch-workspace .ws-req{margin:0 -8px 2px;border-radius:10px}
.ch-workspace .ws-req-h{display:flex;align-items:flex-start;gap:10px;padding:10px 10px}
.ch-workspace .ws-rt{flex:1;font-size:13.5px;font-weight:600;line-height:1.4;letter-spacing:-.01em;color:var(--w-tx)}
.ch-workspace .ws-req-h .ws-chev{color:var(--w-tx3);flex:0 0 auto;margin-top:1px}
.ch-workspace .ws-req-h .ws-chev svg{width:18px;height:18px}
.ch-workspace .ws-req.ws-open .ws-chev{transform:rotate(180deg)}
.ch-workspace .ws-req-body{display:grid;grid-template-rows:0fr}
.ch-workspace .ws-req.ws-open .ws-req-body{grid-template-rows:1fr}
.ch-workspace .ws-req-body>div{overflow:hidden}
.ch-workspace .ws-req-body ul{list-style:none;padding:2px 10px 12px 10px;display:flex;flex-direction:column;gap:9px}
.ch-workspace .ws-req-body li{position:relative;padding-left:16px;font-size:13px;line-height:1.5;color:var(--w-tx2)}
.ch-workspace .ws-req-body li::before{content:"";position:absolute;left:3px;top:8px;width:4px;height:4px;border-radius:99px;background:var(--w-tx4)}
/* Learn mode's follow-along board */
.ch-workspace .ws-walkpill{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px 8px 8px;margin-bottom:18px;border:1px solid var(--w-line);border-radius:99px;background:var(--w-card);text-align:left}
.ch-workspace .ws-wp-play{width:30px;height:30px;border-radius:99px;background:var(--w-acc);color:var(--w-onacc);display:grid;place-items:center;flex:0 0 auto}
.ch-workspace .ws-wp-play svg{width:13px;height:13px;margin-left:2px}
.ch-workspace .ws-wp-t{font-size:12.5px;color:var(--w-tx2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-workspace .ws-wp-t b{color:var(--w-tx);font-weight:600}
.ch-workspace .ws-morph>.ws-lbl.ws-follow{margin:16px 0 10px}
.ch-workspace .ws-csteps{padding:2px 2px 4px}
.ch-workspace .ws-cstep{display:flex;align-items:flex-start;gap:13px;padding:8px 0;position:relative}
.ch-workspace .ws-cstep::before{content:"";position:absolute;left:10px;top:-9px;height:20px;width:2px;background:var(--w-line)}
.ch-workspace .ws-cstep:first-child::before{display:none}
.ch-workspace .ws-cring{width:22px;height:22px;border-radius:99px;border:2px solid var(--w-line);background:var(--w-bg);display:grid;place-items:center;flex:0 0 auto;position:relative;z-index:1}
.ch-workspace .ws-cring i{width:8px;height:8px;border-radius:99px;background:transparent}
.ch-workspace .ws-cstep.ws-cur .ws-cring{border-color:#2e9e5b}
.ch-workspace .ws-cstep.ws-cur .ws-cring i{background:#2e9e5b}
.ch-workspace .ws-ct{flex:1;font-size:13px;line-height:1.4;color:var(--w-tx3);padding-top:2px}
.ch-workspace .ws-cstep.ws-cur .ws-ct{color:var(--w-tx);font-weight:600}
/* a marker that has been ticked: the app's own done ring and label, and the tick is drawn in it */
.ch-workspace .ws-cring svg{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;color:#fff}
.ch-workspace .ws-cring svg path{stroke-dasharray:17;stroke-dashoffset:17}
.ch-workspace .ws-cstep.ws-done .ws-cring{border-color:#2e9e5b;background:#2e9e5b;transition:background .3s var(--w-ease),border-color .3s var(--w-ease)}
.ch-workspace .ws-cstep.ws-done .ws-cring svg path{stroke-dashoffset:0;transition:stroke-dashoffset .34s var(--w-ease) .08s}
.ch-workspace .ws-cstep.ws-done .ws-ct{color:var(--w-tx3)}
/* the shelves: Project Resources, then Task Resources */
.ch-workspace .ws-tres-wrap{border-top:1px solid var(--w-line);margin-top:16px;padding-top:2px}
.ch-workspace .ws-tres-wrap>.ws-lbl{display:block;margin:16px 0 6px}
.ch-workspace .ws-tres-list{display:flex;flex-direction:column;gap:1px;padding-bottom:8px}
.ch-workspace .ws-tres{display:flex;align-items:center;gap:9px;padding:7px 4px;border-radius:9px}
.ch-workspace .ws-ti{width:18px;height:18px;display:grid;place-items:center;flex:0 0 auto;color:var(--w-tx3)}
.ch-workspace .ws-ti svg{width:16px;height:16px}
.ch-workspace .ws-tn{flex:1;min-width:0;font-size:12.5px;font-weight:500;color:var(--w-tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* the upcoming stages. The app's group label is "Workflows" */
.ch-workspace .ws-group{margin-bottom:4px}
.ch-workspace .ws-group-h{display:flex;align-items:center;gap:9px;padding:12px 2px;color:var(--w-tx3)}
.ch-workspace .ws-group-h .ws-chev{transform:rotate(180deg)}
.ch-workspace .ws-group-h .ws-chev svg{width:16px;height:16px}
.ch-workspace .ws-group-h .ws-lbl{flex:1;color:inherit}
.ch-workspace .ws-cnt{font-size:11px;font-weight:700;color:var(--w-tx3)}
.ch-workspace .ws-gstep{display:flex;align-items:flex-start;gap:12px;padding:10px 2px;color:var(--w-tx3)}
.ch-workspace .ws-gstep .ws-ic{width:18px;height:18px;flex:0 0 auto;margin-top:1px;color:var(--w-tx4)}
.ch-workspace .ws-gstep .ws-st{flex:1;font-size:13px;line-height:1.35}
/* a completed stage: its tick in the accent, its title a step brighter. The newest one slides in */
.ch-workspace .ws-gstep.ws-done{border-radius:9px;margin:0 -4px;padding-left:6px;padding-right:6px}
.ch-workspace .ws-gstep.ws-done .ws-ic{color:var(--w-acc)}
.ch-workspace .ws-gstep.ws-done .ws-st{color:var(--w-tx2)}
.ch-workspace .ws-gstep.ws-slide-in{animation:ws-stepIn .6s cubic-bezier(.62,.01,.14,1) both}
/* the stage that has just become the current one: the card unlocks, then its parts come in */
.ch-workspace .ws-active.ws-just-active{animation:ws-activeReveal .9s cubic-bezier(.5,0,.15,1) both,ws-unlockGlow 1.25s ease .2s both}
.ch-workspace .ws-active.ws-just-active>*{animation:ws-innerReveal .66s cubic-bezier(.5,0,.15,1) both}
.ch-workspace .ws-active.ws-just-active>.ws-active-h{animation-delay:.2s}
.ch-workspace .ws-active.ws-just-active>.ws-timer{animation-delay:.3s}
.ch-workspace .ws-active.ws-just-active>.ws-morph{animation-delay:.38s}
.ch-workspace .ws-active.ws-just-active>.ws-shelves{animation-delay:.5s}
/* "Stage complete", over the card of the stage that passed: the medallion, its orbiting sparks, the bar that fills */
.ch-workspace .ws-rx{position:absolute;inset:0;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;padding:16px;opacity:0;transform:scale(.94);
  transition:opacity .42s var(--w-ease),transform .6s cubic-bezier(.34,1.56,.64,1);z-index:6;
  background:linear-gradient(160deg,rgba(163,230,53,.22),rgba(34,197,94,.2) 55%,rgba(20,184,166,.16)),var(--w-bg);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.ch-workspace .ws-rx.ws-show{opacity:1;transform:none}
.ch-workspace .ws-rx-wrap{position:relative;width:58px;height:58px}
.ch-workspace .ws-rx-burst{width:58px;height:58px;border-radius:99px;background:linear-gradient(140deg,#4ade80,#a3e635 55%,#facc15);display:grid;place-items:center;color:#0e2a12;box-shadow:0 10px 34px rgba(74,222,128,.5),0 0 0 8px rgba(163,230,53,.12);animation:ws-rxspin .9s var(--w-ease) both}
.ch-workspace .ws-rx-burst svg{width:29px;height:29px}
.ch-workspace .ws-rx-ring{position:absolute;inset:0;pointer-events:none}
.ch-workspace .ws-rx-ring i{position:absolute;left:50%;top:50%;width:var(--os,5px);height:var(--os,5px);margin:calc(var(--os,5px)/-2);border-radius:99px;background:var(--oc,#a3e635);box-shadow:0 0 9px var(--oc,#a3e635);opacity:0;animation:ws-orbit 2.6s linear infinite var(--od,0s),ws-orbin .5s ease .25s forwards}
.ch-workspace .ws-rx-sub{font-size:12.5px;color:var(--w-tx2);margin-top:6px}
.ch-workspace .ws-rx-bar{width:74%;height:6px;border-radius:99px;background:var(--w-line);overflow:hidden;margin-top:9px}
.ch-workspace .ws-rx-bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4ade80,#a3e635 60%,#facc15);border-radius:99px;animation:ws-rxfill 1.5s cubic-bezier(.62,.01,.14,1) .3s forwards}
/* first paint: the app's own staggered rise */
.ch-workspace .ws-rev{animation:ws-rise .6s var(--w-ease) both;animation-delay:var(--d,0ms)}

/* ---------- chat column ---------- */
.ch-workspace .ws-center{position:relative;flex:1 1 auto;min-width:300px;display:flex;flex-direction:column;background:var(--w-bg);overflow:hidden}
.ch-workspace .ws-ctop{flex:0 0 auto;padding:0 24px}
.ch-workspace .ws-ctr2{height:54px;display:flex;align-items:center}
.ch-workspace .ws-peer{width:min(600px,100%);margin:0 auto;padding:0 28px;display:flex;align-items:center;gap:11px;min-width:0}
.ch-workspace .ws-peer-id{display:inline-flex;align-items:center;gap:11px;border-radius:22px}
.ch-workspace .ws-pava{position:relative;width:36px;height:36px;border-radius:99px;overflow:hidden;flex:0 0 auto;border:1px solid var(--w-line)}
.ch-workspace .ws-pname{font-size:14px;font-weight:600;line-height:1.2;color:var(--w-tx)}
.ch-workspace .ws-psub{font-size:11.5px;line-height:1.5;color:var(--w-tx3);margin-top:2px}
.ch-workspace .ws-thread{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding:4px 0 8px;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 18px,#000 calc(100% - 22px),transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 18px,#000 calc(100% - 22px),transparent 100%)}
.ch-workspace .ws-thread::-webkit-scrollbar{display:none}
.ch-workspace .ws-msgs{max-width:600px;margin:0 auto;padding:48px 28px 104px;display:flex;flex-direction:column;gap:36px;pointer-events:none}
.ch-workspace .ws-msgs>.ws-new{animation:ws-rise var(--w-tm) var(--w-ease) both}
/* the stage divider: one mono label in a hairline */
.ch-workspace .ws-stagediv{align-self:stretch;display:flex;align-items:center;gap:14px;margin:6px 0}
.ch-workspace .ws-sd-line{flex:1;height:1px;background:var(--w-line)}
.ch-workspace .ws-sd-txt{font-family:var(--w-mono);font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--w-tx3);white-space:nowrap}
/* text bubbles: a uniform 20px radius on both sides */
.ch-workspace .ws-mgr{align-self:flex-start;max-width:86%;color:var(--w-tx)}
.ch-workspace .ws-mgr.ws-cont{margin-top:-26px}
/* Learn mode's one line waits for the light before it is said */
.ch-workspace .ws-mgr.ws-hold{opacity:0}
.ch-workspace .ws-mbubble{width:fit-content;max-width:100%;background:var(--w-soft);border:1px solid var(--w-line2);border-radius:20px;padding:10px 15px;font-size:14px;line-height:1.5;overflow-wrap:break-word}
.ch-workspace .ws-mbubble b{font-weight:600}
.ch-workspace .ws-user{align-self:flex-end;width:fit-content;max-width:82%;background:var(--w-bubble);color:var(--w-tx);padding:10px 15px;border-radius:20px;font-size:14px;line-height:1.5;overflow-wrap:break-word;white-space:pre-wrap}
.ch-workspace .ws-typing{align-self:flex-start;display:flex;align-items:center;gap:6px;padding:8px 2px}
.ch-workspace .ws-msgs>.ws-typing.ws-new{animation:ws-rise var(--w-tq) var(--w-ease) both}
.ch-workspace .ws-typing i{width:7px;height:7px;border-radius:99px;background:var(--w-tx3);animation:ws-tbob 1.2s infinite}
.ch-workspace .ws-typing i:nth-child(2){animation-delay:.16s}
.ch-workspace .ws-typing i:nth-child(3){animation-delay:.32s}
/* the sent-file card: a 112px page band over the name and a mono meta line */
.ch-workspace .ws-subm{align-self:flex-end;max-width:min(300px,100%);color:var(--w-tx)}
.ch-workspace .ws-subm-att{position:relative;display:block;max-width:200px;border:1px solid var(--w-line);border-radius:14px;background:var(--w-card);overflow:hidden}
.ch-workspace .ws-sth{display:block;height:112px;overflow:hidden;position:relative}
.ch-workspace .ws-sth svg{width:100%;height:100%}
.ch-workspace .ws-subm-m{padding:9px 13px 11px;min-width:0}
.ch-workspace .ws-subm-t{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-workspace .ws-subm-s{font-family:var(--w-mono);font-size:9.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--w-tx3);margin-top:2px}
.ch-workspace .ws-subm-cap{text-align:right;font-family:var(--w-mono);font-size:9.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--w-tx3);margin-top:6px}
.ch-workspace .ws-subm.ws-analyzing .ws-subm-att{box-shadow:0 0 0 1.5px rgba(63,185,104,.45)}
.ch-workspace .ws-subm.ws-analyzing .ws-subm-att::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 32%,rgba(63,185,104,.22) 50%,transparent 68%);background-size:220% 100%;animation:ws-submScan 1.5s var(--w-ease) infinite}
/* the review trail: shimmering step lines that fold into an overlapping-chip receipt */
.ch-workspace .ws-synth{align-self:flex-start;max-width:92%;margin:2px 0;padding:0 3px;position:relative}
.ch-workspace .ws-sy-list{display:flex;flex-direction:column}
.ch-workspace .ws-sy-list.ws-collapse{overflow:hidden;transition:height .55s cubic-bezier(.65,0,.35,1) .2s,opacity .55s cubic-bezier(.65,0,.35,1) .2s}
.ch-workspace .ws-sy-line{display:flex;align-items:center;gap:10px;padding:5px 0;opacity:0;min-width:0}
.ch-workspace .ws-sy-line.ws-in{animation:ws-syIn .55s var(--w-ease) forwards}
.ch-workspace .ws-sy-ic,.ch-workspace .ws-sy-chip,.ch-workspace .ws-sy-fly{flex:0 0 auto;width:23px;height:23px;border-radius:99px;background:var(--w-bubble);border:1px solid var(--w-line);display:grid;place-items:center;color:var(--w-tx2);box-shadow:0 0 0 2px var(--w-bg)}
.ch-workspace .ws-sy-ic svg,.ch-workspace .ws-sy-chip svg,.ch-workspace .ws-sy-fly svg{width:12px;height:12px}
.ch-workspace .ws-sy-line.ws-live .ws-sy-ic{animation:ws-syPulse 1.5s var(--w-ease) infinite}
.ch-workspace .ws-sy-t{font-size:13px;line-height:1.4;color:var(--w-tx3);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ch-workspace .ws-sy-line.ws-live .ws-sy-t{background:linear-gradient(100deg,var(--w-tx3) 0%,var(--w-tx3) 40%,var(--w-tx) 50%,var(--w-tx3) 60%,var(--w-tx3) 100%);background-size:230% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:ws-txshine 1.7s cubic-bezier(.4,0,.2,1) infinite}
.ch-workspace .ws-sy-line.ws-done .ws-sy-ic{color:var(--w-tx3)}
.ch-workspace .ws-synth.ws-folding .ws-sy-t{opacity:0;filter:blur(6px);transform:translateX(-6px);transition:opacity .32s ease-in,filter .32s ease-in,transform .32s ease-in}
.ch-workspace .ws-synth.ws-folding .ws-sy-ic{opacity:0}
.ch-workspace .ws-sy-fly{position:absolute;z-index:6;pointer-events:none;margin:0;transition:transform .6s cubic-bezier(.65,0,.35,1) var(--fd,.22s),opacity .2s ease-out .8s}
.ch-workspace .ws-sy-done{display:flex;align-items:center;gap:9px;padding:5px 0;opacity:0;filter:blur(6px);transition:opacity .38s var(--w-ease),filter .38s var(--w-ease)}
.ch-workspace .ws-sy-done .ws-sy-lbl,.ch-workspace .ws-sy-done .ws-sy-chev{opacity:0;transition:opacity .35s var(--w-ease) .3s}
.ch-workspace .ws-synth.ws-folded .ws-sy-done{opacity:1;filter:blur(0)}
.ch-workspace .ws-synth.ws-folded .ws-sy-done .ws-sy-lbl,.ch-workspace .ws-synth.ws-folded .ws-sy-done .ws-sy-chev{opacity:1}
.ch-workspace .ws-sy-chips{display:flex}
.ch-workspace .ws-sy-chip{position:relative}
.ch-workspace .ws-sy-chip+.ws-sy-chip{margin-left:-7px}
.ch-workspace .ws-sy-chip:nth-child(1){z-index:4}
.ch-workspace .ws-sy-chip:nth-child(2){z-index:3}
.ch-workspace .ws-sy-chip:nth-child(3){z-index:2}
.ch-workspace .ws-sy-chip:nth-child(4){z-index:1}
.ch-workspace .ws-sy-lbl{font-size:13px;font-weight:500;color:var(--w-tx2);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-workspace .ws-sy-chev{display:grid;place-items:center;color:var(--w-tx4)}
.ch-workspace .ws-sy-chev svg{width:14px;height:14px}
/* the feedback card: it lands in the thread. A Final Evaluation carries the score band, the manager's
   summary and its findings under a category heading */
.ch-workspace .ws-fbunit{align-self:stretch;margin:10px 0;padding:6px 18px 14px;border:1px solid var(--w-line);border-radius:16px;background:var(--w-card);box-shadow:var(--w-shadow);color:var(--w-tx)}
.ch-workspace .ws-msgs>.ws-fbunit.ws-new.ws-shim{animation:ws-rise var(--w-tm) var(--w-ease) both,ws-cardGlow 1.25s var(--w-ease) .1s}
.ch-workspace .ws-fbc-head{display:flex;align-items:center;gap:8px;padding:12px 0 8px;font-family:var(--w-mono);font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--w-tx2)}
.ch-workspace .ws-sb{--ws-sbc:#e7b90a}
.ch-workspace .ws-sb[data-band="BELOW"]{--ws-sbc:#ff6a4d}
.ch-workspace .ws-sb[data-band="EXCEEDS"]{--ws-sbc:#4ade80}
.ch-workspace .ws-sb[data-band="EXCEPTIONAL"]{--ws-sbc:#3fb968}
.ch-workspace .ws-sb-label{width:fit-content;font-size:13px;font-weight:700;letter-spacing:-.01em;line-height:1.2;color:var(--w-tx);margin:0 0 8px}
.ch-workspace .ws-sb-track{display:flex;gap:5px}
.ch-workspace .ws-sb-track i{flex:1;height:3px;border-radius:99px;background:rgba(255,255,255,.14);display:block}
.ch-workspace .ws-sb-track i.ws-on{background:var(--ws-sbc)}
.ch-workspace .ws-sb-grades{display:flex;gap:5px;margin-top:6px}
.ch-workspace .ws-sb-grades span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9px;font-weight:600;letter-spacing:.02em;line-height:1.2;color:var(--w-tx3)}
.ch-workspace .ws-sb-grades span.ws-on{color:var(--ws-sbc);font-weight:700}
.ch-workspace .ws-fec-summary{font-size:13.5px;line-height:1.55;letter-spacing:-.006em;color:var(--w-tx2);margin:12px 0 2px;overflow-wrap:break-word}
.ch-workspace .ws-fec-head{display:flex;align-items:baseline;gap:8px;padding:10px 0 2px;font-family:var(--w-mono);font-size:9.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--w-tx2)}
.ch-workspace .ws-fec-head span+span{font-weight:600;letter-spacing:.9px;color:var(--w-tx3)}
.ch-workspace .ws-fb2-row{display:flex;gap:13px;padding:15px 11px;margin:0 -9px;border-radius:14px;position:relative}
.ch-workspace .ws-fb2-rb{flex:1;min-width:0}
.ch-workspace .ws-fb2-rt{font-size:14.5px;font-weight:600;color:var(--w-tx);line-height:1.28;margin-bottom:6px;letter-spacing:-.01em}
.ch-workspace .ws-fb2-foot{display:flex;align-items:center;gap:9px;margin-top:11px;min-height:24px}
.ch-workspace .ws-prio{display:inline-block;font-family:var(--w-mono);font-size:8.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;padding:3px 8px;border-radius:6px}
.ch-workspace .ws-prio[data-p="high"]{color:#ff6a4d;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px #ff6a4d}
.ch-workspace .ws-prio[data-p="medium"]{color:#e7b90a;background:rgba(255,255,255,.06)}
.ch-workspace .ws-prio[data-p="low"]{color:#6d6a63;background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.075)}
/* "Tell me more" is there, as in the app, and shows on a hover of its row. The thread takes no pointer here */
.ch-workspace .ws-ask{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--w-tx2);background:var(--w-card);border:1px solid var(--w-line);padding:4px 11px 4px 9px;border-radius:99px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.18);opacity:0;transform:translateX(-5px)}
.ch-workspace .ws-ask svg{width:13px;height:13px}
.ch-workspace .ws-fb2-more{margin-left:auto;color:var(--w-tx4);flex:0 0 auto;display:grid;place-items:center}
.ch-workspace .ws-fb2-more svg{width:16px;height:16px}

/* ---------- composer ---------- */
.ch-workspace .ws-composer{flex:0 0 auto;padding:16px 24px 24px;position:relative}
.ch-workspace .ws-composer-in{max-width:600px;margin:0 auto;display:flex;align-items:flex-end;gap:11px;position:relative}
.ch-workspace .ws-pill{flex:1;min-width:0;min-height:91px;display:flex;flex-direction:column;position:relative;background:var(--w-soft);border:1px solid var(--w-line);border-radius:24px}
.ch-workspace .ws-att-row{display:none;flex-wrap:nowrap;gap:9px;padding:10px 10px 2px}
.ch-workspace .ws-pill.ws-has-att .ws-att-row{display:flex}
.ch-workspace .ws-att-big{position:relative;flex:0 0 auto;width:152px;border:1px solid var(--w-line);border-radius:12px;overflow:hidden;background:var(--w-card);animation:ws-rise var(--w-tm) var(--w-ease) both}
.ch-workspace .ws-atb-th{display:block;height:96px;overflow:hidden;position:relative}
.ch-workspace .ws-atb-th svg{width:100%;height:100%}
.ch-workspace .ws-atb-m{padding:7px 10px 8px}
.ch-workspace .ws-atb-n{display:block;font-size:11.5px;font-weight:600;color:var(--w-tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-workspace .ws-atb-s{display:block;font-family:var(--w-mono);font-size:8.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--w-tx3);margin-top:2px}
.ch-workspace .ws-ax{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:99px;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;z-index:2}
.ch-workspace .ws-ax svg{width:11px;height:11px}
.ch-workspace .ws-ta{width:100%;min-height:24px;color:var(--w-tx);font-size:15px;line-height:1.5;padding:13px 18px 4px;white-space:pre-wrap;word-break:break-word;pointer-events:none}
.ch-workspace .ws-ta:empty::before{content:attr(data-ph);color:var(--w-tx3)}
.ch-workspace .ws-pill-ctrl{display:flex;align-items:center;gap:4px;padding:4px 8px 8px;margin-top:auto}
.ch-workspace .ws-ctrl-spacer{flex:1}
.ch-workspace .ws-plus,.ch-workspace .ws-cam,.ch-workspace .ws-mic,.ch-workspace .ws-send{width:38px;height:38px;border-radius:99px;display:grid;place-items:center;flex:0 0 auto;color:var(--w-tx2);pointer-events:none;
  transition:background var(--w-tq) var(--w-ease),transform var(--w-tq) var(--w-ease),color var(--w-tq) var(--w-ease),opacity var(--w-tq) var(--w-ease)}
.ch-workspace .ws-plus svg,.ch-workspace .ws-cam svg,.ch-workspace .ws-mic svg,.ch-workspace .ws-send svg{width:20px;height:20px}
/* send: the app's white disc. It stands in for the mic the moment there is something to send */
.ch-workspace .ws-pill-ctrl .ws-send{background:#fff;color:#111;display:none;box-shadow:0 2px 10px rgba(0,0,0,.16)}
.ch-workspace .ws-pill.ws-active-send .ws-mic{display:none}
.ch-workspace .ws-pill.ws-active-send .ws-send{display:grid}
.ch-workspace .ws-pill.ws-has-att .ws-send{pointer-events:auto;cursor:pointer}
.ch-workspace .ws-pill.ws-has-att .ws-send:hover{transform:scale(1.06)}
/* the Do / Learn toggle. With easy_hard_mode on (the default) it is a pill, not a slider */
.ch-workspace .ws-stuck{display:inline-flex;align-items:center;height:32px;padding:0 16px;border-radius:99px;font-size:12.5px;font-weight:600;letter-spacing:-.005em;color:var(--w-tx);background:var(--w-bubble);box-shadow:inset 0 0 0 1px var(--w-line);white-space:nowrap;pointer-events:none}
.ch-workspace .ws-stuck.ws-on{color:var(--w-onacc);background:var(--w-acc);box-shadow:none}
/* the manager is working: the composer's buttons read as unavailable and the toggle stands down */
.ch-workspace .ws-composer.ws-busy .ws-plus,.ch-workspace .ws-composer.ws-busy .ws-cam,.ch-workspace .ws-composer.ws-busy .ws-mic,.ch-workspace .ws-composer.ws-busy .ws-send{opacity:.35;filter:grayscale(1)}
.ch-workspace .ws-composer.ws-busy .ws-stuck{display:none}
.ch-workspace .ws-composer.ws-busy .ws-ta:empty::before{content:""}
/* Learn mode's quick replies, above its composer */
.ch-workspace .ws-replies{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;min-height:38px;margin:0 auto 10px;max-width:600px}
.ch-workspace .ws-reply{display:inline-flex;align-items:center;font-size:13.5px;font-weight:500;line-height:1.5;letter-spacing:-.011em;color:#1a1917;background:#fff;border:1px solid rgba(26,25,23,.11);padding:10px 17px;border-radius:99px;box-shadow:0 1px 2px rgba(26,25,23,.04)}

/* ---------- Learn mode: the light copy of the frame, revealed from the bottom centre ---------- */
/* the shadow carries the light page colour down past the window's own height, as the app's page background does */
.ch-workspace .ws-app.ws-learn{z-index:3;pointer-events:none;box-shadow:0 68px 0 var(--w-bg);clip-path:circle(0% at 50% 100%);transition:clip-path .85s cubic-bezier(.62,0,.2,1)}
.ch-workspace.ws-guided .ws-app.ws-learn{clip-path:circle(150% at 50% 100%)}

/* ---------- motion ---------- */
/* laid out in one go: nothing enters while the screen is being built */
.ch-workspace.ws-instant *,.ch-workspace.ws-instant *::before,.ch-workspace.ws-instant *::after{animation:none!important;transition:none!important}
/* entered half way: the frame is simply there */
.ch-workspace.ws-noent .ws-rev,.ch-workspace.ws-noent .ws-back{animation:none}
@keyframes ws-rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes ws-stepIn{from{opacity:0;filter:blur(7px);transform:translateY(-12px)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes ws-activeReveal{0%{opacity:0;filter:blur(24px);transform:translateY(22px) scale(.93)}45%{opacity:1}62%{filter:blur(5px)}100%{opacity:1;filter:blur(0);transform:none}}
@keyframes ws-unlockGlow{0%{box-shadow:0 0 0 0 rgba(163,230,53,0)}32%{box-shadow:0 0 0 2px rgba(163,230,53,.4),0 0 34px rgba(74,222,128,.34)}100%{box-shadow:0 0 0 0 rgba(163,230,53,0)}}
@keyframes ws-innerReveal{from{opacity:0;filter:blur(10px);transform:translateY(11px)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes ws-rxspin{0%{transform:rotate(-50deg) scale(.4);opacity:0}70%{transform:rotate(6deg) scale(1.09)}100%{transform:none;opacity:1}}
@keyframes ws-orbit{from{transform:rotate(0deg) translateX(var(--or,44px))}to{transform:rotate(360deg) translateX(var(--or,44px))}}
@keyframes ws-orbin{to{opacity:.95}}
@keyframes ws-rxfill{to{width:100%}}
@keyframes ws-slidelr{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
@keyframes ws-tbob{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
@keyframes ws-submScan{0%{background-position:170% 0}100%{background-position:-170% 0}}
@keyframes ws-txshine{0%{background-position:130% 0}100%{background-position:-30% 0}}
@keyframes ws-syIn{0%{opacity:0;filter:blur(6px);transform:translateY(4px)}100%{opacity:1;filter:blur(0);transform:none}}
@keyframes ws-syPulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.1);opacity:1}}
@keyframes ws-cardGlow{0%{box-shadow:0 0 0 0 rgba(74,222,128,0)}34%{box-shadow:0 0 36px -4px rgba(74,222,128,.5)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
@media (prefers-reduced-motion:reduce){
  .ch-workspace .ws-rev,.ch-workspace .ws-back,.ch-workspace .ws-msgs>.ws-new,.ch-workspace .ws-att-big{animation:none}
  .ch-workspace .ws-gstep.ws-slide-in,.ch-workspace .ws-active.ws-just-active,.ch-workspace .ws-active.ws-just-active>*,.ch-workspace .ws-rx-burst,.ch-workspace .ws-rx-ring i{animation:none}
  .ch-workspace .ws-rx-bar>i{animation:none;width:100%}
  .ch-workspace .ws-sy-line.ws-in{animation:none;opacity:1}
  .ch-workspace .ws-app.ws-learn{transition-duration:.01s}
  .ch-workspace .ws-subm.ws-analyzing .ws-subm-att::after{animation:none;background:rgba(63,185,104,.10)}
}

/* ch/07-present.css */
/* 7 · presentation. The app's presentation room, value for value from origin/dev:
   StageWorkspacePresentation/styles/presentationRoom.css, presentationPresenting.css, presentationMeetPanel.css,
   presentationQa.css, roomCaptionsToggle.css and PresentationMode/styles/presentationLiveRoom.css,
   presentationPresentingLive.css, presentingRoomFloor.css.
   The room is a 1600 x 786 window. Where the app writes vw, vh or a clamp, the number here is that rule
   resolved for this window and the rule is quoted beside it. The room's own states snap, as they do in the app. */
.ch-present{background:#202124;color:#f2f1ee;font:400 14px/1.55 var(--f-sans);letter-spacing:-.01em}
.ch-present *,.ch-present *::before,.ch-present *::after{box-sizing:border-box}
.ch-present .pr-room{position:absolute;left:0;top:0;width:1600px;height:786px;overflow:hidden;background:#202124}
/* paneled and presenting: the room drops to the app's own grey (.zwp-rm background: var(--bg)) */
.ch-present.pr-s-share,.ch-present.pr-s-share .pr-room{background:#1e1e1e}
.ch-present svg{display:block}

/* which pieces each state shows */
.ch-present .pr-v{position:absolute;inset:0;display:none}
.ch-present.pr-s-greet .pr-v-greet,.ch-present.pr-s-share .pr-v-share,.ch-present.pr-s-qa .pr-v-qa{display:block}
.ch-present:not(.pr-s-greet) .pr-if-greet,.ch-present:not(.pr-s-share) .pr-if-share,.ch-present:not(.pr-s-qa) .pr-if-qa,
.ch-present.pr-s-greet .pr-if-run,.ch-present.pr-s-share .pr-if-door{display:none}

/* ---------- the top strip (.zwp-gm-topbar) ---------- */
.ch-present .pr-topbar{position:absolute;top:16px;left:16px;right:16px;height:64px;background:#242528;border-radius:14px;padding:0 12px 0 16px;
  display:flex;align-items:center;justify-content:space-between;z-index:60}
.ch-present .pr-tl{display:flex;align-items:center;gap:14px;min-width:0}
.ch-present .pr-title{font-size:14px;font-weight:500;color:#e8eaed;white-space:nowrap}
.ch-present .pr-stitle{font-size:13px;color:rgba(255,255,255,.55);white-space:nowrap}
/* the contract clock: mono numerals, the timer icon, always */
.ch-present .pr-ck{font-family:var(--f-mono);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:#e8eaed;background:#3c4043;border-radius:10px;padding:9px 12px;
  display:inline-flex;align-items:center;gap:6px}
.ch-present .pr-ck svg{width:14px;height:14px}
.ch-present .pr-ck b{font-weight:700}
.ch-present .pr-acts{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.ch-present .pr-act{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:rgba(255,255,255,.72);background:rgba(255,255,255,.08)}
.ch-present .pr-act.pr-on{background:#8ab4f8;color:#202124}
.ch-present .pr-act svg,.ch-present .pr-leave svg{width:20px;height:20px}
.ch-present .pr-leave{width:44px;height:44px;border-radius:12px;background:#ea4335;color:#fff;display:grid;place-items:center}

/* ---------- the stage and the tiles (.zwp-rm-stage, .zwp-mgrid.zwp-is-big, .zwp-mtile) ---------- */
.ch-present .pr-stage{position:absolute;display:grid;place-items:center;align-content:center}
.ch-present .pr-grid{display:flex;gap:26px;justify-content:center;align-items:center;width:100%}
.ch-present .pr-tile{position:relative;flex:0 0 auto;border-radius:12px;background:#3c4043;display:grid;place-items:center;overflow:hidden}
.ch-present .pr-tile.pr-speaking{outline:3px solid #8ab4f8;outline-offset:-3px}

.ch-present .pr-capband{position:absolute;left:0;right:0;bottom:92px;height:159.52px;padding:0 282px;display:flex;flex-direction:row;justify-content:center;align-items:center;gap:14px;text-align:left;
