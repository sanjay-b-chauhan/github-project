/* ch/04-pou.css */
/* 4 · understanding (b8). The app's light kickoff chat, with two things on it and the camera close:
   the thread with the manager on the left, the learner's own note on the right.
   The skin is the app's (origin/dev: KickoffMeeting/Chat, TrainingShared/Chat: VoiceModuleStatic, HoldToTalk,
   ReadonlyNotesPanel, the learner's voice card): warm paper, white voice notes, the cream notes header.
   Every component is drawn about 1.4 times the app's size, as a whole (padding, radius, icon and type together).
   The grid: 56 outer margin on a 1600 by 786 picture, 40 between the two things. The note card runs the full height.
   The thread is three equal rows (88 high, 36 apart) set on the picture's middle, and its first row and the note
   share one line. Nothing sits alone in a corner. Nothing is smaller than 17px. */
.ch-pou{background:#F2F0ED;color:#2A2118;font-family:var(--f-sans);letter-spacing:0;-webkit-font-smoothing:antialiased}
.ch-pou .pu-app{position:absolute;left:0;top:0;width:1600px;height:786px;background:#F2F0ED}
.ch-pou button{margin:0;font-family:inherit}

/* ---------- the thread: three fixed rows, and hold to talk in the row under the last message ---------- */
.ch-pou .pu-thread{position:absolute;left:56px;top:208px;width:948px;height:336px}
.ch-pou .pu-list{display:flex;flex-direction:column;gap:36px}
.ch-pou .pu-row{flex:none;height:88px}

/* the manager's voice note (VoiceModuleStatic): his seat, then one white pill that is a loader first and a note after */
.ch-pou .pu-npc{display:flex;align-items:center;gap:16px}
/* a new row from him: the bubble rises in, the seat only fades (it must not move while he flies to it) */
.ch-pou .pu-npc.pu-bloom .pu-imsg{animation:pou-in .55s var(--zt-ease) both}
.ch-pou .pu-npc.pu-bloom .pu-av{animation:pou-fade .4s var(--zt-ease) both}
@keyframes pou-in{from{opacity:0;transform:translateY(14px) scale(.96)}}
@keyframes pou-fade{from{opacity:0}}
.ch-pou .pu-av{position:relative;flex:0 0 56px;width:56px;height:56px}
/* his seat. It never animates and never moves, so the engine can always measure it. */
.ch-pou .pu-slot{position:absolute;inset:0;border-radius:50%;background:rgba(42,33,24,.1)}
.ch-pou .pu-av img{position:absolute;inset:0;display:block;width:100%;height:100%;border-radius:50%;object-fit:cover}
.ch-pou .pu-imsg{position:relative;display:flex;flex:none}
.ch-pou .pu-tails{position:absolute;inset:0;pointer-events:none;transform-origin:8% 90%;opacity:0;transform:scale(.4);
  transition:transform .45s var(--zt-ease),opacity .3s var(--zt-ease)}
.ch-pou .pu-tail{position:absolute;border-radius:50%;background:#fff}
.ch-pou .pu-tail-1{width:20px;height:20px;left:-4px;bottom:-2px}
.ch-pou .pu-tail-2{width:10px;height:10px;left:-12px;bottom:-9px}
.ch-pou .pu-pill{position:relative;display:flex;flex:none;align-items:center;overflow:hidden;width:358px;height:88px;padding:0 14px;border-radius:999px;background:#fff;
  transition:width .6s var(--zt-ease),height .6s var(--zt-ease)}
.ch-pou .pu-note{display:flex;flex:none;align-items:center;gap:11px;transition:opacity .4s var(--zt-ease) .16s,filter .4s var(--zt-ease) .16s}
.ch-pou .pu-loader{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;filter:blur(6px);
  transition:opacity .3s var(--zt-ease),filter .3s var(--zt-ease)}
.ch-pou .pu-dots{display:flex;align-items:center;gap:6px}
.ch-pou .pu-dots i{width:8px;height:8px;border-radius:50%;background:rgba(42,33,24,.4)}
/* loading: the app's "recording a voice note" bubble, 84 by 53, two tail circles, three dots */
.ch-pou .pu-npc.pu-loading .pu-pill{width:84px;height:53px}
.ch-pou .pu-npc.pu-loading .pu-note{opacity:0;filter:blur(8px);transition:none}
.ch-pou .pu-npc.pu-loading .pu-loader{opacity:1;filter:none;transition:none}
.ch-pou .pu-npc.pu-loading .pu-tails{opacity:1;transform:none;transition:none}
.ch-pou .pu-npc.pu-loading .pu-dots i{animation:pou-dot 1.25s ease-in-out infinite}
.ch-pou .pu-npc.pu-loading .pu-dots i:nth-child(2){animation-delay:.16s}
.ch-pou .pu-npc.pu-loading .pu-dots i:nth-child(3){animation-delay:.32s}
@keyframes pou-dot{0%,58%,100%{transform:translateY(0);opacity:.4}29%{transform:translateY(-4px);opacity:.9}}

.ch-pou .pu-pp{position:relative;display:flex;flex:none;align-items:center;justify-content:center;width:59px;height:59px;border-radius:50%;background:rgba(42,33,24,.1);color:#747474}
.ch-pou .pu-pp svg{display:block;width:38px;height:38px}
.ch-pou .pu-pp .pu-i-pause{display:none}
.ch-pou .pu-playing .pu-pp .pu-i-play{display:none}
.ch-pou .pu-playing .pu-pp .pu-i-pause{display:block}
.ch-pou .pu-wave{display:flex;flex:none;align-items:center;gap:5.35px;height:40px}
.ch-pou .pu-wave i{flex:none;width:4.4px;border-radius:999px;background:rgba(42,33,24,.4);transition:background-color .15s linear}
.ch-pou .pu-wave i.pu-played{background:#2A2118}
.ch-pou .pu-time{display:block;flex:none;width:78px;text-align:center;font:500 17px/1 var(--f-sans);letter-spacing:-.2px;font-variant-numeric:tabular-nums;color:rgba(0,0,0,.6)}
.ch-pou .pu-clk{position:absolute;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none}

/* ---------- the learner's own voice card (VoiceAnimationRive's pill): grey, on the right ---------- */
.ch-pou .pu-me{display:flex;align-items:center;justify-content:flex-end;transform-origin:100% 50%}
.ch-pou .pu-me.pu-fly{animation:pou-in .6s var(--zt-ease) both}
.ch-pou .pu-mpill{display:flex;flex:none;align-items:center;gap:14px;width:360px;height:88px;padding:0 26px 0 16px;border-radius:999px;background:#EAE8E6;
  box-shadow:inset 0 1px 0 #fff,0 0 0 1px #DFDDDA}
.ch-pou .pu-mbtn{display:flex;flex:none;align-items:center;justify-content:center;width:58px;height:58px;border-radius:50%;background:#DBD7D4;color:#747474}
.ch-pou .pu-mbtn svg{display:block;width:35px;height:35px;transform:translateX(1px)}
.ch-pou .pu-mwave{display:flex;flex:1 1 0;min-width:0;align-items:center;gap:6px;height:44px}
.ch-pou .pu-mwave i{flex:none;width:4.2px;border-radius:999px;background:#A5A19E}
.ch-pou .pu-mtime{flex:none;font:400 18px/1 var(--f-sans);font-variant-numeric:tabular-nums;color:rgba(0,0,0,.6)}
/* a typed answer is a text turn in the same grey pill, one line of it: the thread stays calm and short */
.ch-pou .pu-tbub{display:flex;align-items:center;max-width:420px;height:88px;padding:0 34px;border-radius:999px;background:#EAE8E6;box-shadow:inset 0 1px 0 #fff,0 0 0 1px #DFDDDA}
.ch-pou .pu-tbub p{min-width:0;margin:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font:400 18px/1.45 var(--f-sans);letter-spacing:-.1px;color:#2A2118}

/* ---------- hold to talk (HoldToTalk), large, in the row under the thread: the place the learner's own card
   will take. One line of words under it. ---------- */
.ch-pou .pu-dock{position:absolute;left:0;right:0;top:124px;display:flex;flex-direction:column;align-items:center;gap:18px;
  transition:opacity .5s var(--zt-ease),transform .6s var(--zt-ease),filter .5s var(--zt-ease),top .6s var(--zt-ease)}
.ch-pou .pu-thread[data-rows="2"] .pu-dock{top:248px}
.ch-pou .pu-dock.pu-out{opacity:0;transform:translateY(18px);filter:blur(8px);pointer-events:none}
.ch-pou .pu-ctl{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:88px}
.ch-pou .pu-rec{appearance:none;position:relative;display:flex;flex:none;align-items:center;justify-content:center;overflow:hidden;width:148px;height:88px;padding:0;border:0;border-radius:44px;
  background:rgba(255,255,255,.62);box-shadow:inset 0 1px 0 #fff,0 22px 40px -16px rgba(0,0,0,.2),0 6px 14px -4px rgba(0,0,0,.07);color:#1F1D1E;cursor:pointer;
  touch-action:none;-webkit-user-select:none;user-select:none;pointer-events:none;transition:width .6s var(--zt-ease)}
.ch-pou.pu-ready .pu-rec{pointer-events:auto}
.ch-pou .pu-rec-mic{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity .3s var(--zt-ease),filter .3s var(--zt-ease),transform .15s var(--zt-ease)}
.ch-pou .pu-rec-mic svg{display:block;width:30px;height:30px}
.ch-pou.pu-ready .pu-dock[data-state="idle"] .pu-rec:active .pu-rec-mic{transform:scale(.94)}
/* recording: the pill opens and the learner's own voice draws in it. No clock, no cancel: letting go sends. */
.ch-pou .pu-rec-wave{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:5px;opacity:0;filter:blur(8px);pointer-events:none;
  transition:opacity .3s var(--zt-ease),filter .3s var(--zt-ease)}
.ch-pou .pu-rec-wave i{flex:none;width:4.5px;height:6px;min-height:6px;border-radius:999px;background:#1F1D1E}
.ch-pou .pu-dock[data-state="rec"] .pu-rec{width:520px}
.ch-pou .pu-dock[data-state="rec"] .pu-rec-mic{opacity:0;filter:blur(8px)}
.ch-pou .pu-dock[data-state="rec"] .pu-rec-wave{opacity:1;filter:none;transition-delay:.18s}
/* the one line: what to do now. Sentence case, 18px. */
.ch-pou .pu-lab{height:24px;margin:0;font:400 18px/24px var(--f-sans);letter-spacing:-.1px;text-align:center;white-space:nowrap;color:rgba(42,33,24,.64)}
.ch-pou .pu-lab b{font-weight:600;color:#2A2118}
.ch-pou .pu-lab.pu-swap{animation:pou-lab .45s var(--zt-ease) both}
@keyframes pou-lab{from{opacity:0;transform:translateY(4px)}}
.ch-pou .pu-lab em{display:inline-flex;gap:1px;font-style:normal}
.ch-pou .pu-lab em i{font-style:normal;animation:pou-recdot .9s ease-in-out infinite}
.ch-pou .pu-lab em i:nth-child(2){animation-delay:.3s}
.ch-pou .pu-lab em i:nth-child(3){animation-delay:.6s}
@keyframes pou-recdot{0%,100%{opacity:.25}50%{opacity:1}}
.ch-pou .pu-alt{appearance:none;padding:0;border:0;background:none;cursor:pointer;font:500 18px/24px var(--f-sans);letter-spacing:-.1px;color:#2A2118;text-decoration:underline;text-underline-offset:3px}
.ch-pou .pu-alt:hover{opacity:.7}
/* the typed way through, only when a take needs it or the mic cannot be reached. It takes the mic's own place. */
.ch-pou .pu-field{display:none;flex:none;align-items:center;gap:10px;width:540px;height:72px;padding:0 10px 0 28px;border-radius:999px;background:#fff;box-shadow:0 2px 12px rgba(31,29,30,.07)}
.ch-pou.pu-typing .pu-field{display:flex;animation:pou-in .45s var(--zt-ease) both}
.ch-pou.pu-typing .pu-rec{display:none}
.ch-pou .pu-in{flex:1 1 0;min-width:0;height:48px;padding:0;border:0;outline:0;background:none;font:400 18px/1 var(--f-sans);color:#2A2118}
.ch-pou .pu-in::placeholder{color:rgba(42,33,24,.45)}
.ch-pou .pu-send{appearance:none;display:flex;flex:none;align-items:center;justify-content:center;width:52px;height:52px;padding:0;border:0;border-radius:50%;background:#1F1D1E;cursor:pointer;transition:opacity .2s}
.ch-pou .pu-send img{display:block;width:20px;height:22px;object-fit:contain}
.ch-pou .pu-send:disabled{opacity:.3;cursor:default}

/* ---------- the learner's own note (ReadonlyNotesPanel): white card, cream header, the note at 18px ---------- */
.ch-pou .pu-notes{position:absolute;left:1044px;top:56px;width:500px;height:674px;display:flex;flex-direction:column;overflow:hidden;border-radius:40px;background:#fff}
.ch-pou .pu-n-head{display:flex;flex:none;align-items:center;gap:14px;height:66px;padding:0 40px;background:#FCF2D3}
.ch-pou .pu-n-head svg{display:block;flex:none;width:26px;height:26px}
.ch-pou .pu-n-head span{font:500 18px/1 var(--f-sans);letter-spacing:-.1px;color:#423200}
/* the note stands on the thread's first line (208 to 296), so his voice note and the learner's note read as a pair.
   The room over it is where the tour's "Try saying this" key stands, clear of the header. */
.ch-pou .pu-n-body{flex:1 1 0;min-height:0;padding:86px 40px 40px}
.ch-pou .pu-n-items{display:flex;flex-direction:column;justify-content:center;gap:14px;min-height:88px}
.ch-pou .pu-n-item{display:flex;align-items:flex-start;gap:14px}
.ch-pou .pu-n-item>i{flex:none;width:8px;height:8px;margin-top:11px;border-radius:50%;background:#1F1D1E}
.ch-pou .pu-n-item>span{font:400 18px/30px var(--f-sans);letter-spacing:-.1px;color:#2A2118;text-wrap:pretty}
/* a number that has been heard is run over with the notes' own yellow */
.ch-pou .pu-f{border-radius:5px;background:rgba(255,228,143,0);box-shadow:0 0 0 3px rgba(255,228,143,0);transition:background-color .45s var(--zt-ease),box-shadow .45s var(--zt-ease)}
.ch-pou .pu-f.pu-hit{background:#FFE48F;box-shadow:0 0 0 3px #FFE48F}

@media (prefers-reduced-motion:reduce){
  .ch-pou .pu-dots i,.ch-pou .pu-lab em i{animation:none}
  .ch-pou .pu-me.pu-fly,.ch-pou .pu-npc.pu-bloom,.ch-pou.pu-typing .pu-field{animation-duration:.2s}
}

/* ch/05-workspace.css */
/* 5 · workspace, feedback, coach (b8). The skin is the real Stage workspace's, read from zero-core-ui
   (the dark Do surface, Learn mode's light one, their tokens, the bubbles, the composer, the score band,
   the coach's pill). Most of its content is gone, and what is left is drawn about 1.3 times the app's
   size, so the smallest words here are 16px on the 1600 x 840 canvas.
   The grid: a 40px outer margin and a 24px gap. Two panels share the top edge (40) and the bottom
   edge (746): the task, 400 wide, and the chat, which takes the rest. At the coach step the task
   leaves on the left, the chat moves to the left margin, and the coach's pill opens into a 496 panel
   on the right, on the same two edges. Guided mode ("I'm stuck") is a second, light copy of the frame,
   revealed by the app's ripple, here from the pill that was pressed. */
.ch-workspace{background:#1E1E1E;color:#f2f1ee;font-family:var(--f-sans)}

/* ---------- tokens (the app's own values) ---------- */
.ch-workspace .ws-app{
  --w-bg:#1e1e1e;--w-card:#262626;--w-bubble:#333333;--w-soft:#282828;
  --w-line:rgba(255,255,255,.075);--w-line2:rgba(255,255,255,.04);--w-ring:rgba(255,255,255,.26);--w-idle:rgba(255,255,255,.08);
  --w-tx:#f2f1ee;--w-tx2:#a5a29b;--w-tx3:#6d6a63;
  --w-acc:#ffffff;--w-onacc:#0d0d0d;--w-shadow:0 1px 3px rgba(0,0,0,.4);
  --w-ok:#3fb968;
  --w-ease:var(--zt-ease);--w-move:.76s;
  position:absolute;z-index:1;inset:0;overflow:hidden;
  background:var(--w-bg);color:var(--w-tx);font-family:var(--f-sans);font-size:18px;line-height:1.5;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
.ch-workspace .ws-app[data-theme="light"]{
  --w-bg:#fefefe;--w-card:#ffffff;--w-bubble:#f2f2f3;--w-soft:#f6f6f7;
  --w-line:rgba(13,13,13,.055);--w-line2:rgba(13,13,13,.03);--w-ring:rgba(13,13,13,.2);--w-idle:rgba(13,13,13,.06);
  --w-tx:#111113;--w-tx2:#63636a;--w-tx3:#9a9aa0;
  --w-acc:#111113;--w-onacc:#ffffff;--w-shadow:0 1px 3px rgba(0,0,0,.05)}
.ch-workspace .ws-app *{box-sizing:border-box;margin:0;padding:0}
.ch-workspace .ws-app button{font-family:inherit;color:inherit;background:none;border:none;letter-spacing:inherit}
.ch-workspace .ws-app svg{display:block}

/* ---------- the task: the project, the stage, three things to deliver ---------- */
.ch-workspace .ws-task{position:absolute;left:40px;top:40px;width:400px;height:706px;padding:28px 32px 32px;border-radius:22px;box-shadow:inset 0 0 0 1.5px var(--w-line);
  transition:transform var(--w-move) var(--w-ease),opacity .5s var(--w-ease)}
.ch-workspace .ws-brand{display:flex;align-items:center;gap:14px;height:48px}
.ch-workspace .ws-logo{flex:0 0 48px;width:48px;height:48px;border-radius:99px;background:var(--w-card);box-shadow:inset 0 0 0 1px var(--w-line);display:grid;place-items:center;overflow:hidden}
.ch-workspace .ws-logo img{display:block;width:100%;height:100%;object-fit:contain;padding:9px}
.ch-workspace .ws-brand-t{font-size:16px;font-weight:500;line-height:1.3;color:var(--w-tx2)}
.ch-workspace .ws-title{margin-top:40px;font-size:26px;font-weight:700;line-height:1.22;letter-spacing:-.02em;color:var(--w-tx)}
.ch-workspace .ws-rows{margin-top:20px;display:flex;flex-direction:column}
.ch-workspace .ws-row{position:relative;display:flex;align-items:center;gap:16px;padding:16px 0}
.ch-workspace .ws-rt{flex:1;min-width:0;font-size:19px;font-weight:600;line-height:1.3;color:var(--w-tx)}
/* a circle that can be ticked. Green is the tick and nothing else, and the tick is drawn */
.ch-workspace .ws-dot{flex:0 0 28px;width:28px;height:28px;border-radius:99px;box-shadow:inset 0 0 0 2px var(--w-ring);display:grid;place-items:center;
  transition:background .3s var(--w-ease),box-shadow .3s var(--w-ease)}
.ch-workspace .ws-dot svg{width:18px;height:18px}
.ch-workspace .ws-dot path{fill:none;stroke:#fff;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .4s var(--w-ease) .1s}
.ch-workspace .ws-done .ws-dot{background:var(--w-ok);box-shadow:inset 0 0 0 2px var(--w-ok)}
.ch-workspace .ws-done .ws-dot path{stroke-dashoffset:0}
/* guided mode's three steps: the same rows, joined, because they come one after another */
.ch-workspace .ws-steps .ws-row+.ws-row::before{content:"";position:absolute;left:13px;top:-11px;width:2px;height:22px;border-radius:2px;background:var(--w-ring)}

/* ---------- the chat: the manager, what is being said, the composer ---------- */
.ch-workspace .ws-chat{position:absolute;left:464px;top:40px;width:1096px;height:706px;border-radius:22px;box-shadow:inset 0 0 0 1.5px var(--w-line);
  transition:left var(--w-move) var(--w-ease),width var(--w-move) var(--w-ease)}
.ch-workspace .ws-col{position:relative;width:780px;height:100%;margin:0 auto;padding:28px 0;display:flex;flex-direction:column;transition:opacity .6s var(--w-ease)}
.ch-workspace .ws-peer{flex:0 0 48px;display:flex;align-items:center;gap:14px}
/* a seat. The engine draws Navid over the empty slot */
.ch-workspace .ws-seat{position:relative;flex:0 0 48px;width:48px;height:48px;border-radius:50%;background:var(--w-soft);box-shadow:inset 0 0 0 1px var(--w-line)}
.ch-workspace .ws-slot{position:absolute;inset:0;border-radius:50%;display:block}
.ch-workspace .ws-pname{font-size:19px;font-weight:600;line-height:1.2;color:var(--w-tx)}
.ch-workspace .ws-psub{font-size:16px;line-height:1.25;color:var(--w-tx2);margin-top:3px}
.ch-workspace .ws-thread{position:relative;flex:1;min-height:0;margin-top:8px;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 22px);mask-image:linear-gradient(180deg,transparent 0,#000 22px)}
.ch-workspace .ws-msgs{position:relative;display:flex;flex-direction:column;gap:36px;padding-top:32px;pointer-events:none}
.ch-workspace .ws-msgs>.ws-new{animation:ws-rise .5s var(--w-ease) backwards}
.ch-workspace .ws-msgs>.ws-in{animation:ws-scroll .56s var(--w-ease) backwards}
.ch-workspace .ws-msgs>.ws-out{position:absolute;transition:transform .56s var(--w-ease),opacity .4s var(--w-ease)}
/* text bubbles: a uniform radius on both sides */
.ch-workspace .ws-mgr{align-self:flex-start;width:fit-content;max-width:86%;background:var(--w-soft);box-shadow:inset 0 0 0 1px var(--w-line2);border-radius:27px;padding:13px 21px;font-size:18px;line-height:1.5;color:var(--w-tx);overflow-wrap:break-word;
  transition:opacity .45s var(--w-ease),transform .5s var(--w-ease)}
.ch-workspace .ws-mgr.ws-wait{opacity:0;transform:translateY(10px)}
.ch-workspace .ws-user{align-self:flex-end;width:fit-content;max-width:82%;background:var(--w-bubble);border-radius:27px;padding:13px 21px;font-size:18px;line-height:1.5;color:var(--w-tx);overflow-wrap:break-word;white-space:pre-wrap}
.ch-workspace .ws-typing{align-self:flex-start;display:flex;align-items:center;gap:8px;height:54px;padding:0 6px}
.ch-workspace .ws-typing i{width:9px;height:9px;border-radius:99px;background:var(--w-tx3);animation:ws-tbob 1.2s infinite}
.ch-workspace .ws-typing i:nth-child(2){animation-delay:.16s}
.ch-workspace .ws-typing i:nth-child(3){animation-delay:.32s}
/* a file: one chip, its page and its name. The same chip in the composer and, once sent, in the thread */
.ch-workspace .ws-file{display:flex;align-items:center;gap:16px;width:fit-content;height:96px;padding:10px 26px 10px 10px;border-radius:21px;background:var(--w-card);box-shadow:inset 0 0 0 1px var(--w-line),var(--w-shadow);color:var(--w-tx);
  transition:opacity .18s var(--w-ease)}
.ch-workspace .ws-file.ws-gone{opacity:0}
.ch-workspace .ws-fth{flex:0 0 76px;width:76px;height:76px;border-radius:12px;overflow:hidden}
.ch-workspace .ws-fth svg{width:100%;height:100%}
.ch-workspace .ws-fn{font-size:18px;font-weight:600;line-height:1.3;white-space:nowrap}
.ch-workspace .ws-msgs>.ws-file{align-self:flex-end}
/* he is reading it: one line */
.ch-workspace .ws-reading{align-self:flex-start;display:flex;align-items:center;gap:13px;height:40px}
.ch-workspace .ws-rd-ic{flex:0 0 34px;width:34px;height:34px;border-radius:99px;background:var(--w-bubble);box-shadow:inset 0 0 0 1px var(--w-line);display:grid;place-items:center;color:var(--w-tx2);animation:ws-breathe 1.5s var(--w-ease) infinite}
.ch-workspace .ws-rd-ic svg{width:18px;height:18px}
.ch-workspace .ws-rd-t{font-size:18px;line-height:1.3;white-space:nowrap;
  background:linear-gradient(100deg,var(--w-tx2) 0%,var(--w-tx2) 40%,var(--w-tx) 50%,var(--w-tx2) 60%,var(--w-tx2) 100%);background-size:230% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--w-tx2);animation:ws-txshine 1.7s cubic-bezier(.4,0,.2,1) infinite}
/* the feedback card: the four-step band and the one thing to fix */
.ch-workspace .ws-fb{align-self:stretch;padding:26px 28px 26px;border-radius:21px;background:var(--w-card);box-shadow:inset 0 0 0 1px var(--w-line),var(--w-shadow);color:var(--w-tx);--ws-sbc:#e7b90a}
.ch-workspace .ws-fb[data-band="EXCEEDS"]{--ws-sbc:#4ade80}
.ch-workspace .ws-fb-label{width:fit-content;font-size:24px;font-weight:700;line-height:1.2;letter-spacing:-.018em}
.ch-workspace .ws-fb-label.ws-swap{animation:ws-rise .45s var(--w-ease) backwards}
.ch-workspace .ws-fb-track{display:flex;gap:7px;margin-top:16px}
.ch-workspace .ws-fb-track i{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.14);display:block;transition:background .5s var(--w-ease)}
.ch-workspace .ws-fb-track i.ws-on{background:var(--ws-sbc)}
.ch-workspace .ws-fb-line{display:flex;align-items:center;gap:14px;margin-top:24px}
.ch-workspace .ws-fb-lt{font-size:18px;font-weight:600;line-height:1.3}

/* ---------- composer ---------- */
.ch-workspace .ws-composer{flex:0 0 auto;margin-top:16px}
.ch-workspace .ws-pill{min-height:124px;display:flex;flex-direction:column;background:var(--w-soft);box-shadow:inset 0 0 0 1px var(--w-line);border-radius:32px}
/* an attachment opens its own row above the words */
.ch-workspace .ws-att{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--w-ease)}
.ch-workspace .ws-pill.ws-has-att .ws-att{grid-template-rows:1fr}
.ch-workspace .ws-att-in{min-height:0;overflow:hidden}
.ch-workspace .ws-att-in .ws-file{margin:14px 14px 0;background:var(--w-bg)}
.ch-workspace .ws-ta{width:100%;min-height:54px;padding:19px 28px 5px;font-size:20px;line-height:1.5;color:var(--w-tx);white-space:pre-wrap;word-break:break-word;pointer-events:none;
  transition:min-height .5s var(--w-ease),padding .5s var(--w-ease)}
/* with a file attached and nothing typed, the file is the message: the empty line closes up */
.ch-workspace .ws-pill.ws-has-att .ws-ta:empty{min-height:14px;padding-top:0;padding-bottom:0}
.ch-workspace .ws-ta:empty::before{content:attr(data-ph);color:var(--w-tx3);transition:opacity .3s var(--w-ease)}
.ch-workspace .ws-ta:not(:empty)::after{content:"";display:inline-block;width:2px;height:1.05em;margin-left:2px;vertical-align:-.16em;border-radius:2px;background:var(--w-tx);animation:ws-caret 1s steps(1) infinite}
.ch-workspace .ws-ctrl{display:flex;align-items:center;padding:4px 16px 16px;margin-top:auto;min-height:70px}
.ch-workspace .ws-sp{flex:1}
/* the Do / Learn toggle. With easy_hard_mode on (the default) it is a pill, not a slider */
.ch-workspace .ws-stuck{display:inline-flex;align-items:center;height:46px;padding:0 22px;border-radius:99px;font-size:18px;font-weight:600;letter-spacing:-.005em;line-height:1;color:var(--w-tx);background:var(--w-bubble);box-shadow:inset 0 0 0 1px var(--w-line);white-space:nowrap;pointer-events:none;transition:opacity .3s var(--w-ease)}
.ch-workspace .ws-stuck.ws-on{color:var(--w-onacc);background:var(--w-acc);box-shadow:none}
/* send: the app's white disc, once there is something to send */
.ch-workspace .ws-send{flex:0 0 50px;width:50px;height:50px;border-radius:99px;display:grid;place-items:center;background:var(--w-idle);color:var(--w-tx3);pointer-events:none;
  transition:background .24s var(--w-ease),color .24s var(--w-ease),transform .24s var(--w-ease),box-shadow .24s var(--w-ease)}
.ch-workspace .ws-send svg{width:26px;height:26px}
.ch-workspace .ws-pill.ws-armed .ws-send{background:#fff;color:#111;box-shadow:0 2px 10px rgba(0,0,0,.16)}
.ch-workspace .ws-pill.ws-has-att .ws-send{pointer-events:auto;cursor:pointer}
.ch-workspace .ws-pill.ws-has-att .ws-send:hover{transform:scale(1.06)}
/* with a file attached the file is the message. And while the manager has the work, the composer says nothing */
/* they leave at once and come back gently */
.ch-workspace .ws-pill.ws-has-att .ws-ta:empty::before,.ch-workspace .ws-composer.ws-quiet .ws-ta:empty::before{opacity:0;transition:none}
.ch-workspace .ws-composer.ws-quiet .ws-stuck{opacity:0;transition:none}
.ch-workspace .ws-pill{transition:opacity .4s var(--w-ease)}
.ch-workspace .ws-composer.ws-quiet .ws-pill:not(.ws-has-att){opacity:.5}

/* ---------- guided mode: the light copy of the frame, revealed from the pill that was pressed ---------- */
.ch-workspace .ws-app.ws-learn{z-index:3;pointer-events:none;clip-path:circle(0px at var(--rx,696px) var(--ry,684px));transition:clip-path .85s cubic-bezier(.62,0,.2,1)}
.ch-workspace.ws-guided .ws-app.ws-learn{clip-path:circle(1320px at var(--rx,696px) var(--ry,684px))}

/* ---------- the coach. Closed it is a pill in the top right corner: an eye on the work, and a seat.
   Opened, the same box is the coach's panel, and the seat has not moved ---------- */
.ch-workspace .ws-coachbox{position:absolute;z-index:5;right:62px;top:62px;width:108px;height:60px;border-radius:30px;overflow:hidden;background:#292929;box-shadow:inset 0 1px 3px rgba(0,0,0,.5),inset 0 0 0 1.5px rgba(255,255,255,.06);
  opacity:0;visibility:hidden;
  transition:opacity .4s var(--w-ease),visibility 0s linear .4s,right var(--w-move) var(--w-ease),top var(--w-move) var(--w-ease),width var(--w-move) var(--w-ease),height var(--w-move) var(--w-ease),border-radius var(--w-move) var(--w-ease),background .5s var(--w-ease),box-shadow .5s var(--w-ease)}
.ch-workspace.ws-coach .ws-coachbox{opacity:1;visibility:visible;
  transition:opacity .4s var(--w-ease),visibility 0s,right var(--w-move) var(--w-ease),top var(--w-move) var(--w-ease),width var(--w-move) var(--w-ease),height var(--w-move) var(--w-ease),border-radius var(--w-move) var(--w-ease),background .5s var(--w-ease),box-shadow .5s var(--w-ease)}
.ch-workspace.ws-coach-open .ws-coachbox{right:40px;top:40px;width:496px;height:706px;border-radius:22px;background:var(--w-bg);box-shadow:inset 0 0 0 0 rgba(0,0,0,0),inset 0 0 0 1.5px var(--w-line)}
.ch-workspace .ws-cseat{position:absolute;right:6px;top:6px;transition:right var(--w-move) var(--w-ease),top var(--w-move) var(--w-ease)}
.ch-workspace.ws-coach-open .ws-cseat{right:28px;top:28px}
.ch-workspace .ws-eye{position:absolute;left:10px;top:10px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#343434;color:#f2f1ee;box-shadow:inset 0 0 8px rgba(255,255,255,.28);transition:opacity .3s var(--w-ease)}
.ch-workspace .ws-eye svg{width:22px;height:22px}
.ch-workspace.ws-coach-open .ws-eye{opacity:0}
.ch-workspace .ws-ctitle{position:absolute;left:32px;top:28px;height:48px;display:flex;align-items:center;font-size:26px;font-weight:700;line-height:1;letter-spacing:-.02em;white-space:nowrap;
  opacity:0;transform:translateY(8px);transition:opacity .2s var(--w-ease),transform .2s var(--w-ease)}
.ch-workspace.ws-coach-open .ws-ctitle{opacity:1;transform:none;transition:opacity .45s var(--w-ease) .36s,transform .55s var(--w-ease) .36s}
.ch-workspace .ws-notes{position:absolute;left:32px;top:116px;width:432px;display:flex;flex-direction:column;gap:20px}
.ch-workspace .ws-notes p{font-size:18px;line-height:1.5;color:var(--w-tx);white-space:nowrap;opacity:0;transform:translateY(10px);transition:opacity .45s var(--w-ease),transform .55s var(--w-ease)}
.ch-workspace .ws-notes p.ws-on{opacity:1;transform:none}
/* the picture moves along: the task leaves, the chat takes the left margin */
.ch-workspace.ws-coach-open .ws-app:not(.ws-learn) .ws-task{transform:translateX(-464px);opacity:0}
.ch-workspace.ws-coach-open .ws-app:not(.ws-learn) .ws-chat{left:40px;width:1000px}

.ch-workspace.ws-coach-open .ws-app:not(.ws-learn) .ws-col{opacity:.42}

/* ---------- motion ---------- */
/* first paint: the two panels rise, one after the other */
.ch-workspace .ws-rev{animation:ws-rise .6s var(--w-ease) backwards}
.ch-workspace .ws-chat.ws-rev{animation-delay:90ms}
/* laid out in one go: nothing enters while the screen is being built */
.ch-workspace.ws-instant *,.ch-workspace.ws-instant *::before,.ch-workspace.ws-instant *::after{animation:none!important;transition:none!important}
/* entered half way: the frame is simply there */
.ch-workspace.ws-noent .ws-rev{animation:none}

@keyframes ws-scroll{from{opacity:0;transform:translateY(var(--from,40px))}}

}

/* ch/07-present.css */
/* 7 · presentation (b8). One dark room on a strict grid. Canvas 1600 x 840, the player shows the top 786.
   Outer margin 56, every gap 24.
     slide      56, 56     1056 x 594 (16:9)
     tiles      1136, 56   408 x 182, three of them, 24 apart: the column ends at 650 with the slide
     controls   56, 674    56 high, on the slide's left edge
     caption    ends 1112  56 high, on the slide's right edge, level with the controls
   The skin is the app's presentation room (StageWorkspacePresentation/styles/presentation*.css on origin/dev):
   room #202124, tile #3c4043, the 96px face disc, the name bottom left, the white pills, the outline pill,
   the #8ab4f8 speaking ring, the slide's paper #f5f3ee and ink #1a1a1a. Type and pills are scaled up as a whole. */
.ch-present{background:#202124;color:#fff;font:400 18px/1.3 var(--f-sans);letter-spacing:-.01em}
.ch-present *,.ch-present *::before,.ch-present *::after{box-sizing:border-box}
.ch-present svg,.ch-present img{display:block}
.ch-present .pr-room{position:absolute;left:0;top:0;width:1600px;height:840px;background:#202124}

/* ---------- the shared slide and its controls: one group, so they arrive as one move ---------- */
.ch-present .pr-share{position:absolute;left:56px;top:56px;width:1056px;height:674px;
  opacity:0;transform:translateY(16px);transition:opacity .65s var(--zt-ease),transform .65s var(--zt-ease)}
.ch-present.pr-on .pr-share{opacity:1;transform:none}

/* the slide (.zwp-deck): paper, ink, the deck's own face */
.ch-present .pr-slide{position:absolute;left:0;top:0;width:1056px;height:594px;border-radius:20px;overflow:hidden;background:#f5f3ee;color:#1a1a1a}
.ch-present .pr-sl-top{position:absolute;left:56px;right:56px;top:56px;height:44px;display:flex;align-items:center;justify-content:center;gap:16px}
.ch-present .pr-sl-mark{width:40px;height:40px;flex:0 0 40px}
.ch-present .pr-sl-t{font:500 36px/44px var(--f-sans);letter-spacing:-.02em;white-space:nowrap}
.ch-present .pr-sl-fig{position:absolute;left:56px;right:56px;bottom:56px;display:flex;flex-direction:column;align-items:center}
/* the number's ink sits 9px right of its box (the last glyph's tracking, the 4's side bearing): moved back onto the slide's axis */
.ch-present .pr-sl-n{position:relative;left:-9px;font:600 240px/200px var(--f-sans);letter-spacing:-.05em;font-variant-numeric:tabular-nums;white-space:nowrap}
.ch-present .pr-sl-l{margin-top:20px;font:400 30px/38px var(--f-sans);letter-spacing:-.015em;color:#333;white-space:nowrap}

/* the controls (.zwp-gmc, .zwp-gm-done): pills on the canvas, no box */
.ch-present .pr-ctl{position:absolute;left:0;top:618px;height:56px;display:flex;align-items:center;gap:12px}
.ch-present .pr-gmc{width:66px;height:56px;flex:0 0 66px;border-radius:999px;display:grid;place-items:center;background:#fff;color:#202124}
.ch-present .pr-gmc svg{width:24px;height:24px}
.ch-present .pr-done{height:56px;padding:0 28px;display:inline-flex;align-items:center;border-radius:999px;border:1px solid rgba(255,255,255,.32);
  font:600 18px/1 var(--f-sans);letter-spacing:-.01em;color:#e8eaed;white-space:nowrap}

/* ---------- the team: three equal tiles (.zwp-mtile) ---------- */
.ch-present .pr-tiles{position:absolute;left:1136px;top:56px;width:408px;height:594px;display:flex;flex-direction:column;gap:24px}
.ch-present .pr-tile{position:relative;flex:0 0 182px;width:408px;height:182px;border-radius:20px;background:#3c4043}
/* the speaking ring: a line inside the tile's own edge, so nothing grows */
.ch-present .pr-tile::after{content:'';position:absolute;inset:0;border-radius:inherit;border:4px solid #8ab4f8;opacity:0;pointer-events:none;transition:opacity .45s var(--zt-ease)}
.ch-present .pr-tile.pr-speaking::after{opacity:1}
.ch-present .pr-face{position:absolute;left:156px;top:43px;width:96px;height:96px;border-radius:50%;overflow:hidden;background:#2b2b2b}
/* Avery's picture is a half length portrait (640 x 578): set at .3 so her head fills the disc as Navid's does */
.ch-present .pr-face img{position:absolute;left:-51px;top:-4px;width:192px;height:173.4px;max-width:none}
/* Navid's seat is empty: the guide takes its box and its round corner */
.ch-present .pr-seat{background:none}
/* your own seat: the app's initial disc */
.ch-present .pr-me{background:#6f7f9c;display:grid;place-items:center}
.ch-present .pr-me b{font:600 34px/1 var(--f-sans);letter-spacing:.01em;color:#fff}
.ch-present .pr-nm{position:absolute;left:20px;bottom:16px;font:600 18px/22px var(--f-sans);letter-spacing:-.01em;color:#fff;white-space:nowrap}

/* ---------- the caption (.zwp-rm-cap): who asks, then the words, large ---------- */
.ch-present .pr-cap{position:absolute;right:488px;top:674px;height:56px;display:flex;align-items:center;gap:16px;white-space:nowrap;
  font:400 32px/56px var(--f-sans);letter-spacing:-.02em;color:#fff;
  opacity:0;transform:translateY(10px);transition:opacity .5s var(--zt-ease),transform .5s var(--zt-ease);pointer-events:none}
.ch-present .pr-cap b{font-weight:400;color:rgba(255,255,255,.55)}
.ch-present.pr-asked .pr-cap{opacity:1;transform:none}

@media (prefers-reduced-motion:reduce){
  .ch-present .pr-share,.ch-present .pr-cap,.ch-present .pr-tile::after{transition:none}
}

/* ch/08-portfolio.css */
/* 8 · project done, portfolio, sent to companies, hired. One dark page in the tour's own language (the first
   run's): a few made objects, large, one new thing per sentence. Every state is a class on the root:
   pf-hero, pf-done, pf-sheeted, pf-compact, pf-rowsin, pf-linesin, pf-ask, pf-applied, pf-hired. */
.ch-portfolio{background:#0E0E10;color:#F4F4F3;font-family:var(--f-sans);letter-spacing:-.01em;overflow:hidden}
.ch-portfolio.pf-still *{transition:none!important;animation:none!important}

/* ---------- the portfolio: a sheet that holds the project tiles ---------- */
.ch-portfolio .pf-sheet{position:absolute;z-index:2;left:163px;top:208px;width:1274px;height:344px;border-radius:34px;background:rgba(23,23,26,0);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0),0 0 0 1px rgba(255,255,255,0),0 40px 70px -40px rgba(0,0,0,0);
  transition:left .85s var(--zt-ease),top .85s var(--zt-ease),width .85s var(--zt-ease),height .85s var(--zt-ease),background .5s var(--zt-ease),box-shadow .5s var(--zt-ease),opacity .45s var(--zt-ease)}
.ch-portfolio.pf-sheeted .pf-sheet{background:#17171A;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px rgba(255,255,255,.06),0 40px 70px -40px rgba(0,0,0,.9)}
.ch-portfolio.pf-compact .pf-sheet{left:150px;top:210px;width:400px;height:340px}

.ch-portfolio .pf-who{position:absolute;left:44px;top:40px;display:flex;align-items:center;gap:14px;opacity:0;
  transition:opacity .45s var(--zt-ease),left .85s var(--zt-ease),top .85s var(--zt-ease)}
.ch-portfolio.pf-sheeted .pf-who{opacity:1;transition-delay:.25s,0s,0s}
.ch-portfolio.pf-compact .pf-who{left:28px;top:24px}
.ch-portfolio .pf-av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:500 22px/1 var(--f-sans);color:#F4F4F3;
  background:linear-gradient(#34343A,#232327);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 0 1px #08080A}

.ch-portfolio .pf-id b{font:500 22px/1 var(--f-sans);letter-spacing:-.015em}
.ch-portfolio .pf-id em{font:400 16px/1 var(--f-sans);font-style:normal;color:#A6A6AC}

/* the places the next projects will take */
.ch-portfolio .pf-slot{position:absolute;top:126px;left:calc(44px + var(--i)*302.4px);width:278.4px;height:174px;border-radius:16px;border:1.5px dashed rgba(255,255,255,.13);box-sizing:border-box;opacity:0;
  transition:opacity .4s var(--zt-ease)}

.ch-portfolio.pf-compact .pf-slot{opacity:0;transition-delay:0s;transition-duration:.15s}

/* a project. Drawn at the size it has when it stands alone, and scaled down into the sheet, so it is never soft */
.ch-portfolio .pf-tile{position:absolute;left:0;top:0;width:480px;height:300px;border-radius:28px;overflow:hidden;transform-origin:0 0;opacity:0;
  transform:translate(calc(44px + var(--i)*302.4px),152px) scale(.58);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.22),inset 0 0 0 2px rgba(255,255,255,.06),0 0 0 2px rgba(0,0,0,.45),0 50px 70px -40px rgba(0,0,0,.9);

.ch-portfolio .pf-t-doordash{--i:1;--c:1;--r:0;background:linear-gradient(155deg,#F6F0E7,#E7DDCE);color:#1A1513}

.ch-portfolio .pf-t-spotify{--i:3;--c:1;--r:1;background:linear-gradient(155deg,#E4EAEF,#CED7DE);color:#14181B}
.ch-portfolio.pf-hero .pf-t-airbnb{opacity:1;transform:translate(397px,-18px) scale(1)}

.ch-portfolio .pf-logo{position:absolute;left:30px;top:30px;width:68px;height:68px;border-radius:20px;background:#fff;display:grid;place-items:center;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.07),0 0 0 2px rgba(0,0,0,.14),0 14px 22px -14px rgba(0,0,0,.5)}
.ch-portfolio .pf-logo img{width:38px;height:38px;display:block}
.ch-portfolio .pf-title{position:absolute;left:30px;right:30px;bottom:28px;font:400 36px/1.08 var(--f-serif);letter-spacing:-.028em;text-wrap:balance;
  transition:opacity .35s var(--zt-ease)}
.ch-portfolio.pf-compact .pf-title{opacity:0}
/* the tick: the only green on the page, and only on something finished */
.ch-portfolio .pf-tick{position:absolute;right:30px;top:30px;width:52px;height:52px;border-radius:50%;background:#1FA95C;color:#fff;display:grid;place-items:center;

.ch-portfolio.pf-done .pf-t-airbnb .pf-tick path,.ch-portfolio.pf-sheeted .pf-tile.pf-in .pf-tick path{stroke-dashoffset:0}
.ch-portfolio.pf-sheeted .pf-tile.pf-in:not(.pf-t-airbnb) .pf-tick{transition-delay:.4s}
.ch-portfolio.pf-sheeted .pf-tile.pf-in:not(.pf-t-airbnb) .pf-tick path{transition-delay:.6s}

.ch-portfolio .pf-done-h{position:absolute;left:0;right:0;top:530px;margin:0;text-align:center;font:400 38px/1 var(--f-serif);letter-spacing:-.03em;opacity:0;transform:translateY(12px);

.ch-portfolio.pf-done .pf-done-h{opacity:1;transform:none}
.ch-portfolio.pf-sheeted .pf-done-h{opacity:0;transform:translateY(-10px);transition-duration:.25s}

/* ---------- a small celebration: paper from behind the thing, once ---------- */
.ch-portfolio .pf-burst{position:absolute;z-index:0;left:800px;top:340px;width:0;height:0;pointer-events:none}

/* ---------- out to the companies: a dotted line to each, and the portfolio travels along it ---------- */
.ch-portfolio .pf-lines{position:absolute;z-index:1;left:0;top:0;width:1600px;height:840px;transition:opacity .45s var(--zt-ease)}
.ch-portfolio .pf-dots{fill:none;stroke:rgba(244,244,243,.46);stroke-width:4;stroke-linecap:round;stroke-dasharray:.01 12}

.ch-portfolio.pf-linesin .pf-rev{stroke-dashoffset:0}
.ch-portfolio #pf-m1 .pf-rev{transition-delay:.08s}
.ch-portfolio #pf-m2 .pf-rev{transition-delay:.16s}
.ch-portfolio #pf-m3 .pf-rev{transition-delay:.24s}
.ch-portfolio .pf-go{position:absolute;z-index:3;left:0;top:0;width:26px;height:18px;border-radius:5px;background:#F4F4F3;opacity:0;offset-rotate:0deg;offset-distance:0%;pointer-events:none;

.ch-portfolio .pf-rows{position:absolute;z-index:2;left:700px;top:156px;width:750px;transition:opacity .45s var(--zt-ease)}

.ch-portfolio.pf-rowsin .pf-row:nth-child(2){transition-delay:.09s,.09s,0s}
.ch-portfolio.pf-rowsin .pf-row:nth-child(3){transition-delay:.18s,.18s,0s}
.ch-portfolio.pf-rowsin .pf-row:nth-child(4){transition-delay:.27s,.27s,0s}
.ch-portfolio .pf-row.pf-lit{box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 0 1.5px rgba(244,244,243,.6)}
.ch-portfolio .pf-disc{position:relative;flex:none;width:68px;height:68px;border-radius:50%;background:#fff;display:grid;place-items:center;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.5),0 12px 20px -12px rgba(0,0,0,.85)}
.ch-portfolio .pf-disc img{width:36px;height:36px;display:block}
.ch-portfolio .pf-r-figma .pf-disc img{width:auto;height:36px}
.ch-portfolio .pf-disc::after{content:'';position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.75);opacity:0}

.ch-portfolio .pf-row.pf-open .pf-shackle{transform:translateY(-3px)}

      await api.say('N5', { onSeg: function (i, text) {

        if (on(text, /apply/i, 'apply')) api.later(1300, function () { arrive('wd-on-apply'); });
      } });

      /* no choice. He says he will show how Zero works, the camera comes to rest, run resolves, and the engine
         opens the pop-up over this screen. Anyone who wants out has the player's close button */
      await api.say('W1');

  ZT.chapter({

    run: async function (api) {

      function on(text, re, key) { if (did[key] || !re.test(text || '')) return false; did[key] = 1; return true; }
      api.onExit(function () { S.pick = S.press = S.replay = null; });
      root.classList.remove('wd-still');

      /* Navid is home, and the world has come back into focus, before anything is measured */
      await Promise.all([api.guide.home({ role: 'Founder of Zero' }), api.wait(900)]);

      /* the meter shows what the tour earned. The bar and the roles take their final state now; the number counts up to it. */
      var from = S.shown, to = api.points.get();
      setMeter(root, to);
      if (to !== from) {
        S.num.textContent = fmt(from); api.sfx('good');
        var n = 0, steps = 26, iv = api.every(40, function () {
          n++; S.num.textContent = fmt(from + (to - from) * (1 - Math.pow(1 - n / steps, 3)));
          if (n >= steps) { clearInterval(iv); S.num.textContent = fmt(to); }

      S.pick = function () { if (picked || !aimed) return; picked = true; root.classList.add('wd-picked'); if (onPick) onPick(); };
      function aim(point) {

        if (point) api.point(S.hit, { pad: 4, ax: .46, ay: .2 });   // up on the roof, so his name tag is not on the stop
      }
      if (!api.skipped) await api.say('E2', { onSeg: function (i, text) { if (on(text, /first scenario/i, 'aim')) aim(true); } });
      aim(false);
      api.clearRings();
      await api.turn({ badge: 'Your turn', text: 'Click your first scenario', tip: 'Click here to start', target: S.hit, pad: 4,
        until: function (done) { if (picked) api.later(260, done); else onPick = done; },
        auto: function () { return api.click(S.hit); } });
      api.clearRings(); api.cursor.hide();

      /* ease in on the building. The roles step aside and the welcome card takes their place. */
      S.hit.tabIndex = -1; S.hit.blur();
      S.cam.style.transition = ''; S.cam.style.transform = '';
      root.classList.remove('wd-flash'); root.classList.add('wd-zoom');

      S.press = function () { if (entered || !asked) return; entered = true; root.classList.add('wd-pressed'); if (onEnter) onEnter(); };
      function key(e) {
        if (e.key !== 'Enter' || e.repeat || e.isComposing) return;
        var t = e.target; if (t && t.closest && t.closest('.zt-dock')) return;   // the tour's own buttons keep their Enter
        e.preventDefault(); if (S.press) S.press();

      window.addEventListener('keydown', key);
      api.onExit(function () { window.removeEventListener('keydown', key); });
      asked = true;
      await api.turn({ badge: 'Your turn', text: 'Press <kbd>Enter</kbd>', target: S.enter, pad: 5,
        until: function (done) { if (entered) api.later(260, done); else onEnter = done; },
        auto: function () { return api.click(S.enter); } });
      window.removeEventListener('keydown', key);
      api.clearRings(); api.cursor.hide();

      root.classList.add('wd-pressed', 'wd-go');
      api.bg('#1E1E1E'); api.sfx('whoosh');
      await api.wait(950);

      /* the prototype's honest last state. Nothing follows it, so this run never resolves. */
      api.bare(true); api.guide.hide();
      S.replay = function () { S.replay = null; api.restart(); };
      root.classList.add('wd-over');
      await new Promise(function () {});
    }
  });
})();

/* ch/04-pou.js */
/* 4 · understanding: the learner says the brief back to their manager, straight after the kickoff.
   b8: the app's light kickoff chat with two things on it. Left, the thread: Navid's seat and his voice note,
   the learner's own voice card, his reply, and hold to talk under it. Right, the learner's own note from the
   meeting. Each part is the app's own component drawn about 1.4 times its size, and nothing is on screen
   that Navid does not name.
   Navid is the manager: he sits in the seat of the note, and the note plays while he speaks.
   One of the tour's learner actions: hold Space and say what the note says. The white key beside the note
   does it for them, so nobody needs a microphone to get through. */
(function () {
  var NB = 18, RB = 44;

            api.later(Math.max(1300, cue('S1', i, 'right here') - 700), function () { if (!asked) pointAt(w.chat, { pad: 6, ax: .37, ay: .08, lead: true, ms: 600 }); });
          } else if (/just ask/i.test(t) && !asked) asked = askDemo();
        } });
        await (asked || (asked = askDemo()));
        await api.wait(1500);                         // the answer gets read before he moves on

        /* S2 · guided mode. The pointer presses "I'm stuck", the surface turns light, the manager says he will
           walk it through, and the three steps tick one after another on "step by step". Nothing clicks them.
           Then the same pill is pressed again and the light draws back */
        var guided = null;
        var guidedDemo = async function () {
          var b = beat(), press = cue('S2', 0, 'switch on'), walk = cue('S2', 0, 'walk you through'), by = cue('S2', 0, 'step by step');
          await b.until(100);
          w.moveOn();                                 // the question is answered. The thread is clear for what comes next
          await b.until(Math.max(700, press - 880));
          await pointAt(w.stuck, { pad: 5, ax: .88, ay: .66, ms: 620 });
          await api.cursor.tap(); b.took(880);
          api.clearRings(); w.setGuided(true);
          await b.until(Math.max(walk - 200, b.t + 800));
          w.walk();
          await b.until(Math.max(by - 250, b.t + 900));
          for (var k = 0; k < 3; k++) { w.tickStep(k); await api.wait(450); }
          await api.wait(450);                        // three ticks, and a moment to see them
          await api.cursor.tap(); w.setGuided(false);
          await api.wait(720);
        };
        await api.say('S2', { onSeg: function () { if (!guided) guided = guidedDemo(); } });
        await (guided || (guided = guidedDemo()));
        rest();

        api.progress('feedback');
        await api.wait(260);
      }

      if (at !== 'coach') {
        /* S3 · the one thing the learner does here: submit. The file lands in the composer as he says so,
           and from then on a click on send, or Enter, counts, even while he is still talking */
        var turnDone = null;
        w.onSubmitted = function () { rest(); if (turnDone) turnDone(); };
        var stage = function () { if (S.file || S.round) return; w.addFile(); w.armEnter(); };
        if (at) await api.wait(420);
        await api.say('S3', { onSeg: function (i, t) {
          if (S.round) return;
          if (/added a file/i.test(t)) stage();
          else if (/hit send/i.test(t)) { stage(); pointAt(w.send, { pad: 5, ax: .8, ay: .8, lead: true, ms: 560 }); }
        } });
        stage();
        if (!S.round) rest();
        await api.turn({
          badge: 'Try this', text: 'Click <b>Send</b> to submit', tip: 'Click <b>Send</b>', target: S.round ? null : w.send, pad: 5,
          until: function (done) { turnDone = done; if (S.round) done(); },
          auto: function () { if (!S.round) return api.click(w.send); }       // self-play, and a click on the tip key
        });
        rest();

        /* S4 · he reads it, and one card comes back. Then, by itself: the fix goes in as a new file, it is sent
           again, the fix is ticked, the band steps up, and the points are paid */
        var reviewed = null, redone = null;
        var review = async function (k) {
          stopRide();
          var b = beat();
          await b.until(120);
          w.reading();
          await b.until(Math.max(cue('S4', k, 'give you feedback') - 100, b.t + 1050));
          w.verdict();
        };
        var redo = async function (k) {
          var b = beat(), again = cue('S4', k, 'send it again');
          await b.until(260);
          w.addFile(w.draft2);                        // the fix, as a new file in the composer
          await b.until(Math.max(again - 700, b.t + 520));
          await pointAt(w.send, { ax: .8, ay: .8, ring: false, ms: 520 });
          await api.cursor.tap(); w.send.click();     // and it is sent again
          rest();
          await api.wait(460);
          w.fixed();
          await api.wait(520);
          w.exceeds();
          await api.wait(420);                        // the verdict is on screen: that is what the points are for
          var r = api.rect(w.band);
          await api.points.add(api.data.points.submit, { from: w.band, dx: r.w / 2 + 96, hold: 800 });   // beside the verdict, not on it
        };
        await api.say('S4', { onSeg: function (i, t) {
          if (/review/i.test(t) && !reviewed) reviewed = review(i);
          else if (/send it again/i.test(t) && !redone) redone = (reviewed || (reviewed = review(0))).then(function () { return redo(i); });
        } });
        await (redone || (redone = (reviewed || (reviewed = review(0))).then(function () { return redo(1); })));
        await api.wait(420);
        api.progress('coach');
      } else {
        await api.wait(760);
      }

      /* S5 · same face, new seat. The coach's pill arrives top right and Navid takes it. On "how you work" it
         opens into the panel while the task leaves and the chat makes room. The two notes land on their words */
      var seat = null, live = null;
      var toCoach = function () {
        stopRide();
        if (!seat) { w.showCoach(); void root.offsetWidth; seat = api.guide.dock(w.coachSlot, { tag: 'none', role: 'Your coach' }); }
        return seat;
      };
      var coachLive = async function () {
        var b = beat();
        await b.until(Math.max(0, cue('S5', 0, 'your coach') - 700));
        await toCoach(); b.took(800);
        await b.until(Math.max(cue('S5', 0, 'how you work') - 300, b.t + 300));
        w.openCoach();
        await b.until(Math.max(cue('S5', 0, 'and showing'), b.t + 950));
        api.guide.sync();
        w.note(0);
        await b.until(Math.max(cue('S5', 0, 'how to get better'), b.t + 800));
        w.note(1);
      };
      await api.say('S5', { onSeg: function () { if (!live) live = coachLive(); } });
      await (live || (live = coachLive()));

      await api.wait(1300);
    }
  });
})();

/* ch/07-present.js */
/* 7 · presentation (b8). One beat, line R1, and it plays by itself: the learner does nothing.
   One dark room on a strict grid, drawn on the 1600 x 840 canvas (the player shows the top 786 of it):
     outer margin 56, every gap 24
     the shared slide     x 56 to 1112,   y 56 to 650    1056 x 594, 16:9
     three equal tiles    x 1136 to 1544, 408 x 182 each, sharing the slide's top and bottom edges
     the controls         x 56,           y 674 to 730   on the slide's left edge
     the caption          ends at x 1112, y 674 to 730   on the slide's right edge
   The skin is the app's own presentation room (StageWorkspacePresentation and PresentationMode on origin/dev):
   its greys, the flat tile with a face in a 96px disc and the name bottom left, the white control pills,
   the blue speaking ring, the caption words. Its content is cut down to what Navid says in R1.
   Navid is the engine's guide. He docks into the disc of his own tile and stays there. */
(function () {
  'use strict';

  var A = 'fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
  function ic(w, d) { return '<svg viewBox="0 0 24 24" ' + A + ' stroke-width="' + w + '">' + d + '</svg>'; }
  /* RoomIcons.tsx, path for path */
  var I = {
    mic: ic(2, '<path d="M12 19v3m7-12v2a7 7 0 0 1-14 0v-2"/><rect width="6" height="13" x="9" y="2" rx="3"/>'),
    cam: ic(2, '<path d="m16 13l5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect width="14" height="12" x="2" y="6" rx="2"/>')
  };

  var cold = false;            /* the tour was opened straight at this step, so the player itself is still opening */

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  /* one seat: a flat tile, the face in a disc, the name bottom left. `face` is the disc's own markup. */
  function tile(k, name, face) {
    return '<div class="pr-tile" data-k="' + k + '">' + face + '<span class="pr-nm">' + esc(name) + '</span></div>';
  }

  ZT.chapter({
    id: 'present', order: 7, steps: ['present'], tone: 'dark', bg: '#202124', window: true,

    mount: function (root, api) {
      var D = api.data || {}, stage = D.stage || {};
      var initial = String((D.learner && D.learner.name) || 'You').trim().charAt(0).toUpperCase() || 'Y';
      var title = String(stage.draft || 'Why hosts cancel').replace(/\.[a-z0-9]+$/i, '');      /* the file the learner sent in */
      var pct = D.causePct || '46%';
      var line = 'of cancellations are ' + String(D.cause || 'Calendar conflicts').toLowerCase();
      var question = 'How did you get to ' + pct + '?';

      root.innerHTML =
        '<div class="pr-room">' +
          /* the learner's own slide, shared. Drawn directly: the mark, the title, one number, one line. */
          '<div class="pr-share">' +
            '<div class="pr-slide" aria-label="Your slide, shared with the team">' +
              '<div class="pr-sl-top"><img class="pr-sl-mark" alt="' + esc(D.company || 'Airbnb') + '" src="' + api.asset('img/logo-airbnb.svg') + '">' +
                '<span class="pr-sl-t">' + esc(title) + '</span></div>' +
              '<div class="pr-sl-fig"><span class="pr-sl-n">' + esc(pct) + '</span><span class="pr-sl-l">' + esc(line) + '</span></div>' +
            '</div>' +
            /* the real controls, under the slide on its left edge */
            '<div class="pr-ctl" aria-hidden="true"><span class="pr-gmc">' + I.mic + '</span><span class="pr-gmc">' + I.cam + '</span>' +
              '<span class="pr-done">I’m done presenting</span></div>' +
          '</div>' +

          /* the team. Navid's disc is an empty seat: the guide takes its box. */
          '<div class="pr-tiles">' +
            tile('navid', 'Navid', '<span class="pr-face pr-seat"></span>') +
            tile('avery', 'Avery Kim', '<span class="pr-face"><img alt="" src="' + api.asset('img/cast-avery.jpg') + '"></span>') +
            tile('you', 'You', '<span class="pr-face pr-me"><b>' + esc(initial) + '</b></span>') +
          '</div>' +

          /* the one question, as the room's caption */
          '<div class="pr-cap" aria-live="polite"><b>Avery</b><span>' + esc(question) + '</span></div>' +
        '</div>';

      /* opened straight here: he starts in his home seat in the bar, so the flight into his tile is still seen */
      var g = api.guide.el ? api.guide.el() : null;
      cold = !!(g && g.classList.contains('zt-hidden'));
      if (cold) api.guide.home({ role: 'On your panel' });
    },

    run: async function (api) {
      var root = api.root, seat = root.querySelector('.pr-seat'), asker = root.querySelector('.pr-tile[data-k="avery"]');
      var shared = false, asked = false;

      /* "you present it to your team": the slide and its controls come up as one */
      function share() { if (shared) return; shared = true; root.classList.add('pr-on'); api.sfx('pop'); }
      /* "and they ask you questions": her tile wears the speaking ring and her question is the caption */
      function ask() { if (asked) return; asked = true; share(); asker.classList.add('pr-speaking'); root.classList.add('pr-asked'); api.sfx('soft'); }

      /* how far into sentence i its character k is spoken, in ms. From the line's own plan, so it follows the recording. */
      var plan = api.plan ? api.plan('R1') : { dur: 0, segs: [] }, segs = plan.segs || [];
      function spokenAt(i, text, k) {
        var end = segs[i + 1] ? segs[i + 1].t : plan.dur, len = Math.max(0, end - (segs[i] ? segs[i].t : 0));
        return len * 1000 * k / Math.max(1, text.length);
      }

      /* 1 · he takes his seat on the panel, in his own tile. Opened cold, the player is still growing to its size:
         a short wait, so his seat is measured where it will stand and he lands on it in one flight. */
      api.cursor.hide();
      if (cold) { cold = false; await api.wait(420); }
      await api.guide.dock(seat, { tag: 'none', role: 'On your panel' });

      /* 2 · the line. The first sentence carries two things, so the second is timed to its own words. */
      await api.say('R1', { onSeg: function (i, text) {
        var k = text.search(/,? and they ask/i);
        if (/final work|present/i.test(text)) share();
        if (k > -1) api.later(spokenAt(i, text, k), ask);
        if (/real job/i.test(text)) ask();
      } });
      ask();                                        /* nothing is left undone if a timer was dropped */

      /* 3 · "Just like you would at a real job." has been said: hold on the finished room */
      await api.wait(900);
    }
  });
})();

/* ch/08-portfolio.js */
/* 8 · the project is done, it sits on the portfolio, the portfolio goes out to companies, and one of them hires.
   Two steps on one screen (portfolio, jobs), so nothing is cut between them: the finished project becomes a
   tile, the tiles become the portfolio, the portfolio becomes the thing that is sent.
   This is the tour's own picture of it, not a copy of an app screen. One thing on screen per sentence. */
(function () {
  'use strict';

  var PROJECTS = [
    { k: 'airbnb',   title: 'Reducing host cancellations', logo: 'img/logo-airbnb.svg' },
    { k: 'doordash', title: 'Delivery time promise',       logo: 'img/logo-doordash.svg' },
    { k: 'netflix',  title: 'Offline recommendations',     logo: 'img/logo-netflix.svg' },
    { k: 'spotify',  title: 'Early churn analysis',        logo: 'img/logo-spotify.svg' }
  ];
  var ROLES = [
    { k: 'shopify', co: 'Shopify', role: 'Junior Business Analyst', logo: 'img/logo-shopify.svg' },
    { k: 'notion',  co: 'Notion',  role: 'Business Analyst',        logo: 'img/logo-notion.svg' },
    { k: 'figma',   co: 'Figma',   role: 'Product Analyst',         logo: 'img/logo-figma.svg' },
    { k: 'stripe',  co: 'Stripe',  role: 'Senior Business Analyst', logo: 'img/logo-stripe.svg' }
  ];
  var HIRE = 1;                                   // the company that writes back with an offer (Notion)
  var ROW_Y = [206, 322, 438, 554];               // the centre of each company row on the canvas

  var I = {
    tick: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path pathLength="1" d="M5.5 12.5l4.2 4.2L18.5 7.8"/></svg>',
    lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="9.5" rx="2.6"/><path class="pf-shackle" d="M8.2 10.5V7.8a3.8 3.8 0 0 1 7.6 0v2.7"/></svg>'
  };

  /* each line leaves the portfolio from its own point, so the four never run on top of each other */
  function path(y, i) { var y0 = 359 + i * 14; return 'M550 ' + y0 + 'C628 ' + y0 + ' 622 ' + y + ' 700 ' + y; }
  /* small paper pieces that fly out from behind a thing, once. Seeded, so every run looks the same */
  function pieces(n, seed, reach) {
    var out = '', s = seed;
    function rnd() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }
    for (var i = 0; i < n; i++) {
      var a = (i / n) * Math.PI * 2 + (rnd() - .5) * .5, d = reach * (.62 + rnd() * .5);
      var x = Math.cos(a) * d * 1.25, y = Math.sin(a) * d * .82 - 30;
      out += '<i class="pf-p' + (i % 4) + '" style="--x:' + x.toFixed(0) + 'px;--y:' + y.toFixed(0) + 'px;--r:' + ((rnd() - .5) * 540).toFixed(0) + 'deg;--d:' + (rnd() * .09).toFixed(2) + 's"></i>';
    }
    return out;
  }

  function build(root, api) {
    var me = api.data.learner || {}, name = me.name || 'You', init = name.charAt(0).toUpperCase();
    root.innerHTML =
      '<div class="pf-burst pf-b1">' + pieces(30, 7, 330) + '</div>' +

      '<div class="pf-sheet">' +
        '<div class="pf-who"><span class="pf-av">' + init + '</span><span class="pf-id"><b>' + name + '</b><em>' + (me.role || 'Business Analyst') + '</em></span></div>' +
        [1, 2, 3].map(function (i) { return '<i class="pf-slot" style="--i:' + i + '"></i>'; }).join('') +
        PROJECTS.map(function (p) {
          return '<div class="pf-tile pf-t-' + p.k + '">' +
            '<img class="pf-wm" alt="" draggable="false" src="' + api.asset(p.logo) + '">' +
            '<span class="pf-logo"><img alt="" draggable="false" src="' + api.asset(p.logo) + '"></span>' +
            '<em class="pf-tick">' + I.tick + '</em>' +
            '<b class="pf-title">' + p.title + '</b>' +
          '</div>';
        }).join('') +
      '</div>' +
      '<h2 class="pf-done-h">Project complete</h2>' +

      '<svg class="pf-lines" viewBox="0 0 1600 840" aria-hidden="true">' +
        '<defs>' + ROW_Y.map(function (y, i) {
          return '<mask id="pf-m' + i + '" maskUnits="userSpaceOnUse" x="0" y="0" width="1600" height="840"><path class="pf-rev" pathLength="1" d="' + path(y, i) + '"/></mask>';
        }).join('') + '</defs>' +
        ROW_Y.map(function (y, i) { return '<g mask="url(#pf-m' + i + ')"><path class="pf-dots" d="' + path(y, i) + '"/></g>'; }).join('') +
      '</svg>' +
      ROW_Y.map(function (y, i) { return '<i class="pf-go pf-go' + i + '" style="offset-path:path(\'' + path(y, i) + '\')"></i>'; }).join('') +

      '<div class="pf-rows">' + ROLES.map(function (r) {
        return '<div class="pf-row pf-r-' + r.k + '">' +
          '<span class="pf-disc"><img alt="" draggable="false" src="' + api.asset(r.logo) + '"></span>' +
          '<span class="pf-txt"><b>' + r.co + '</b><em>' + r.role + '</em></span>' +
          '<span class="pf-st"><i class="pf-lock">' + I.lock + '</i><i class="pf-ok">' + I.tick + '</i><span></span></span>' +
        '</div>';
      }).join('') + '</div>' +

      '<button class="pf-apply" type="button">Apply to ' + ROLES.length + ' roles</button>' +

      '<div class="pf-hire">' +
        '<div class="pf-burst pf-b2">' + pieces(38, 23, 420) + '</div>' +
        '<span class="pf-disc pf-hdisc"><img alt="" draggable="false" src="' + api.asset(ROLES[HIRE].logo) + '"></span>' +
        '<h2>You got the job.</h2>' +
        '<p>' + ROLES[HIRE].role + ' at ' + ROLES[HIRE].co + '</p>' +
      '</div>';

    function q(s) { return root.querySelector(s); }
    return root._pf = {
      tiles: [].slice.call(root.querySelectorAll('.pf-tile')), rows: [].slice.call(root.querySelectorAll('.pf-row')),
      goers: [].slice.call(root.querySelectorAll('.pf-go')), apply: q('.pf-apply')
    };
  }

  ZT.chapter({
    id: 'portfolio', order: 8, steps: ['portfolio', 'jobs'], window: true, tone: 'dark', bg: '#0E0E10',

    mount: function (root, api) {
      var S = build(root, api);
      if (api.startAt === 'jobs') {            // opened at the second step: the portfolio is already full
        root.classList.add('pf-still', 'pf-sheeted', 'pf-compact');
        S.tiles.forEach(function (t) { t.classList.add('pf-in'); });
      }
    },

    run: async function (api) {
      var root = api.root, S = root._pf, did = {};
      function on(text, re, key) { if (did[key] || !re.test(text || '')) return false; did[key] = 1; return true; }
      function add(c) { root.classList.add(c); }
      /* when, inside a line, a phrase is spoken (ms from the start of the line). The clip's own sentence times when
         the clip exists, an even spread across the sentence otherwise */
      function at(id, phrase) {
        var p = api.plan(id), low = phrase.toLowerCase();
        for (var i = 0; i < p.segs.length; i++) {
          var t = p.segs[i].text, k = t.toLowerCase().indexOf(low);
          if (k < 0) continue;
          var end = i + 1 < p.segs.length ? p.segs[i + 1].t : p.dur;
          return (p.segs[i].t + (end - p.segs[i].t) * (k / t.length)) * 1000;
        }
        return 0;
      }
      function status(row, text, cls) {
        var st = row.querySelector('.pf-st'), sp = st.querySelector('span');
        st.classList.add('pf-swap');
        api.later(170, function () { sp.textContent = text; row.className = row.className.replace(/\bpf-s-\w+/g, '').trim() + ' pf-s-' + cls; st.classList.remove('pf-swap'); });
      }
      function send(back) {                    // the portfolio travels out along every line (or a reply comes back)
        S.goers.forEach(function (g) { g.classList.remove('pf-fly', 'pf-flyback'); void g.offsetWidth; g.classList.add(back ? 'pf-flyback' : 'pf-fly'); });
      }

      api.guide.home({ role: 'Founder of Zero' });
      root.classList.remove('pf-still');

      if (api.startAt !== 'jobs') {
        /* ---------- F1 · the project is done ---------- */
        add('pf-hero');
        await api.say('F1', { onSeg: function (i, text) {
          if (on(text, /done/i, 'done')) api.later(Math.max(120, at('F1', 'done') - at('F1', 'Your project') - 260), function () { add('pf-done'); api.sfx('good'); });
        } });
        add('pf-done');
        await api.wait(500);

        /* ---------- F2 · it sits on the portfolio, and more projects join it ---------- */
        var more = function () {
          [1, 2, 3].forEach(function (n, k) { api.later(k * 430, function () { S.tiles[n].classList.add('pf-in'); api.sfx('tick'); }); });
        };
        await api.say('F2', { onSeg: function (i, text) {
          if (on(text, /portfolio/i, 'sheet')) { add('pf-sheeted'); S.tiles[0].classList.add('pf-in'); api.sfx('soft'); }
          if (on(text, /every project/i, 'more')) api.later(450, more);
        } });
        add('pf-sheeted'); S.tiles.forEach(function (t) { t.classList.add('pf-in'); });
        await api.wait(650);
      }

      /* ---------- H1 · the portfolio goes out to companies, and roles open ---------- */
      api.progress('jobs');
      function out() {
        add('pf-sheeted'); add('pf-compact'); api.sfx('whoosh');
        api.later(520, function () { add('pf-rowsin'); });
        api.later(760, function () { add('pf-linesin'); send(false); });
        S.rows.forEach(function (r, i) { api.later(1560 + i * 90, function () { r.classList.add('pf-got'); }); });
      }
      function open() {
        S.rows.forEach(function (r, i) { api.later(i * 360, function () { r.classList.add('pf-open'); api.sfx('tick'); }); });
      }
      await api.say('H1', { onSeg: function (i, text) {
        if (on(text, /companies/i, 'out')) out();
        if (on(text, /roles open/i, 'open')) api.later(Math.max(200, at('H1', 'the more roles') - at('H1', 'The more projects') - 200), open);
      } });
      add('pf-compact'); add('pf-rowsin'); add('pf-linesin');
      S.rows.forEach(function (r) { r.classList.add('pf-got', 'pf-open'); });

      /* ---------- H2 · we apply with you. The one thing the learner does here ---------- */
      var applied = false, onApply = null;
      S.apply.addEventListener('click', function () { if (applied || !root.classList.contains('pf-ask')) return; applied = true; if (onApply) onApply(); });
      await api.say('H2', { onSeg: function (i, text) {
        if (on(text, /we apply/i, 'ask')) api.later(Math.max(150, at('H2', 'we apply') - 250), function () { add('pf-ask'); api.sfx('pop'); });
      } });
      add('pf-ask');
      await api.turn({ badge: 'Try this', text: 'Click <b>Apply</b>', tip: 'Click <b>Apply</b>', side: 'bottom', target: S.apply, pad: 7, radius: 22,
        until: function (done) { if (applied) api.later(200, done); else onApply = done; },
        auto: function () { return api.click(S.apply); } });
      api.clearRings(); api.cursor.hide();
      add('pf-applied'); send(false);
      S.rows.forEach(function (r, i) { api.later(620 + i * 170, function () { status(r, 'Applied', 'applied'); api.sfx('tick'); }); });
      await api.wait(1700);

      /* ---------- H3 · companies write back, you interview, you get hired ---------- */
      var hireRow = S.rows[HIRE], seenRow = S.rows[2];
      function wrote() { send(true); api.later(700, function () { status(seenRow, 'Viewed', 'seen'); status(hireRow, 'Wants to meet', 'hot'); api.sfx('pop'); }); }
      function meet() { status(hireRow, 'Interview, Thu 2:00 pm', 'hot'); hireRow.classList.add('pf-lit'); api.sfx('soft'); }
      function hired() { if (root.classList.contains('pf-hired')) return; add('pf-hired'); api.sfx('good'); }
      await api.say('H3', { onSeg: function (i, text) {
        if (!on(text, /write back/i, 'h3')) return;
        api.later(Math.max(100, at('H3', 'companies write back') - 500), wrote);
        api.later(Math.max(1500, at('H3', 'you interview') - 150), meet);
        api.later(Math.max(2900, at('H3', 'you get hired') - 100), hired);
      } });
      hired();
      await api.wait(900);

      /* ---------- E1 · so that's how Zero works ---------- */
      await api.say('E1');
      await api.wait(700);
    }
  });
})();

</script>
