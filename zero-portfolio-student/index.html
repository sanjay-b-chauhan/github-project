  @font-face { font-family:'Supply Mono'; src:url('./fonts/PPSupplyMono-Regular.otf') format('opentype'); font-weight:400; font-style:normal; font-display:swap; }
  :root{
    /* ── ZERO tokens ── */
    --paper:rgb(255,255,255); --canvas:rgb(246,245,243); --cream:rgb(242,240,237);
    --bg:rgb(255,255,255); --sunken:rgba(31,29,30,0.03); --pressed:rgba(31,29,30,0.08);
    --line:rgba(31,29,30,0.12); --line-soft:rgba(31,29,30,0.06);
    --ink:rgb(31,29,30); --ink-2:rgba(31,29,30,0.70); --ink-3:rgba(31,29,30,0.45);
    --ink-4:rgba(31,29,30,0.30);
    /* brand forest + green */
    --forest:rgb(24,67,47); --green:rgb(20,135,74); --green-grad-a:#5FD079; --green-grad-b:#49BA61; --green-grad-c:#2E9A48;
    --signal:rgb(0,166,86); --signal-ink:rgb(15,70,40); --signal-soft:rgb(211,238,221);
    --mid:rgb(176,124,32); --ghost:rgba(31,29,30,0.32);
    --sh-card:none;
    --sh-hover:none;
    --sh-modal:none;
    --f-head:'Google Sans Flex','Inter Tight',ui-sans-serif,-apple-system,system-ui,sans-serif;
    --f-body:'Google Sans Flex','Inter Tight',ui-sans-serif,-apple-system,system-ui,sans-serif;
    --f-mono:'Google Sans Flex','Inter Tight',ui-sans-serif,-apple-system,system-ui,sans-serif;
    --r:24px; --r-lg:32px; --content-w:1320px;
    --ease-out:cubic-bezier(.22,1,.36,1); --ease-spring:cubic-bezier(.34,1.56,.64,1); --ease-apple:cubic-bezier(.32,.72,0,1); --ease-premium:cubic-bezier(.4,0,.2,1); --ease-butter:cubic-bezier(.16,1,.3,1);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{ background:var(--canvas); font-family:var(--f-body); color:var(--ink); letter-spacing:-0.02em; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:rgba(0,0,0,.14); border-radius:999px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  .noscroll::-webkit-scrollbar{ display:none; }
  ::selection{ background:rgba(21,122,78,.12); }
  .tnum{ font-variant-numeric:tabular-nums; }
  .head{ font-family:var(--f-head); font-weight:700; letter-spacing:-0.025em; }
  @keyframes riseUp{ from{transform:translateY(8px);} to{transform:translateY(0);} }
  @keyframes heartPop{ 0%{transform:scale(1);} 25%{transform:scale(1.42);} 55%{transform:scale(.85);} 100%{transform:scale(1);} }
  @keyframes ringBurst{ 0%{transform:translate(-50%,-50%) scale(.4);opacity:.5;} 100%{transform:translate(-50%,-50%) scale(2.6);opacity:0;} }
  @keyframes tipIn{ from{opacity:0;transform:translateY(-4px);} to{opacity:1;transform:translateY(0);} }
  @keyframes spinRing{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  @keyframes viewMorph{ 0%{opacity:.5;filter:blur(18px);transform:scale(.95) translateY(14px);} 45%{opacity:1;filter:blur(6px);} 100%{opacity:1;filter:blur(0);transform:none;} }
  @keyframes modalPop{ 0%{opacity:.4;filter:blur(12px);transform:scale(.9) translateY(8px);} 50%{opacity:1;} 100%{opacity:1;filter:blur(0);transform:scale(1) translateY(0);} }
  @keyframes overlayIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes shineSweep{ 0%{transform:translateX(-160%) skewX(-16deg);} 100%{transform:translateX(360%) skewX(-16deg);} }
  .rise{ animation:riseUp .6s var(--ease-butter) both; }
  .morph{ animation:viewMorph .66s var(--ease-butter) both; will-change:transform,filter,opacity; }
  .pop{ animation:modalPop .54s var(--ease-butter) both; will-change:transform,filter,opacity; }
  .lift{ transition:transform .24s var(--ease-apple), box-shadow .3s var(--ease-apple), border-color .22s var(--ease-apple), background .22s var(--ease-apple), opacity .2s var(--ease-apple); }
  .shimmer{ background:linear-gradient(100deg, rgba(31,29,30,.05) 30%, rgba(20,135,74,.16) 50%, rgba(31,29,30,.05) 70%); background-size:200% 100%; animation:shimmerX 1.1s linear infinite; }
  @keyframes shimmerX{ from{background-position:180% 0;} to{background-position:-20% 0;} }
  @keyframes revealIn{ from{opacity:0; transform:translateY(7px);} to{opacity:1; transform:none;} }
  @keyframes rowGlow{ 0%{background:rgba(0,166,86,.16);} 100%{background:transparent;} }
  @keyframes tickPop{ 0%{transform:scale(.3);opacity:0;} 60%{transform:scale(1.18);} 100%{transform:scale(1);opacity:1;} }
  @keyframes shakeX{ 0%,100%{transform:none;} 20%{transform:translateX(-4px);} 40%{transform:translateX(4px);} 60%{transform:translateX(-3px);} 80%{transform:translateX(2px);} }
  @keyframes trlA{ 0%,30%{opacity:1} 36%,94%{opacity:0} 100%{opacity:1} }
  @keyframes trlB{ 0%,30%{opacity:0} 36%,60%{opacity:1} 66%,100%{opacity:0} }
  @keyframes trlC{ 0%,60%{opacity:0} 66%,94%{opacity:1} 100%{opacity:0} }
  @keyframes trlCur{ 0%{left:22%;top:30%} 14%{left:44%;top:36%} 30%{left:44%;top:36%} 42%{left:58%;top:58%} 58%{left:30%;top:64%} 66%{left:30%;top:64%} 78%{left:52%;top:42%} 92%{left:38%;top:52%} 100%{left:22%;top:30%} }
  @keyframes trlScrollA{ 0%,16%{transform:translateY(0)} 26%,100%{transform:translateY(-16px)} }
  @keyframes sparklePulse{ 0%,100%{transform:scale(1); opacity:1;} 50%{transform:scale(1.3); opacity:.65;} }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; } }
  @keyframes soundBar{ 0%,100%{transform:scaleY(.3);} 50%{transform:scaleY(1);} }

<script>window.DATA = {"candidate": {"name": "Sanjay Chauhan", "location": "Toronto, Canada", "photo": null, "level": 4, "track": "Business Analyst", "tagline": "Completed 7 scenarios on the Zero Business Analyst track."}, "zerosAssessment": {"sectionLabel": "Zero's Assessment", "assessedFor": {"company": "Ramp", "companyLogo": "https://www.google.com/s2/favicons?sz=64&domain=ramp.com", "role": "Business Analyst · Strategy & Operations"}, "matchAnalysis": {"verdict": {"demonstrated": 6, "total": 9, "atHighPerformer": 2, "atThreshold": 4, "notYet": 3}, "jdRequirements": [{"id": "quantify-problem", "label": "Quantify a business problem in dollars or a target metric before proposing a solution", "status": "high-performer", "evidence": "Sized the opportunity before recommending in 6 of 7 projects, with the assumption stated each time.", "sources": [{"scenarioId": 4, "label": "Netflix", "logo": "https://www.google.com/s2/favicons?sz=64&domain=netflix.com"}, {"scenarioId": 2, "label": "Spotify", "logo": "https://www.google.com/s2/favicons?sz=64&domain=spotify.com"}, {"scenarioId": 7, "label": "Amazon", "logo": "https://www.google.com/s2/favicons?sz=64&domain=amazon.com"}]}, {"id": "root-cause", "label": "Diagnose root cause from segmented data, not the surface reason", "status": "high-performer", "evidence": "Isolated one named driver backed by segmentation in 6 of 7 diagnoses: playlist adoption at Spotify, the quality-check step at Amazon, calendar-sync conflicts at Airbnb.", "sources": [{"scenarioId": 2, "label": "Spotify", "logo": "https://www.google.com/s2/favicons?sz=64&domain=spotify.com"}, {"scenarioId": 7, "label": "Amazon", "logo": "https://www.google.com/s2/favicons?sz=64&domain=amazon.com"}, {"scenarioId": 6, "label": "Airbnb", "logo": "https://www.google.com/s2/favicons?sz=64&domain=airbnb.com"}]}, {"id": "build-model", "label": "Build and defend a quantitative model (cohort, decomposition, cost, sensitivity)", "status": "threshold", "evidence": "Built cohort, decomposition, and cost models with assumptions stated. A multi-point sensitivity range appeared only on the Amazon model.", "sources": [{"scenarioId": 2, "label": "Spotify", "logo": "https://www.google.com/s2/favicons?sz=64&domain=spotify.com"}, {"scenarioId": 4, "label": "Netflix", "logo": "https://www.google.com/s2/favicons?sz=64&domain=netflix.com"}, {"scenarioId": 7, "label": "Amazon", "logo": "https://www.google.com/s2/favicons?sz=64&domain=amazon.com"}]}, {"id": "recommendation-impact", "label": "Translate analysis into a recommendation tied to expected KPI impact", "status": "threshold", "evidence": "Each project closed with one recommendation and a target metric. Several recommendations were less specific or lower-yield than the diagnosis behind them.", "sources": [{"scenarioId": 4, "label": "Netflix", "logo": "https://www.google.com/s2/favicons?sz=64&domain=netflix.com"}, {"scenarioId": 3, "label": "Shopify", "logo": "https://www.google.com/s2/favicons?sz=64&domain=shopify.com"}, {"scenarioId": 6, "label": "Airbnb", "logo": "https://www.google.com/s2/favicons?sz=64&domain=airbnb.com"}]}, {"id": "stakeholder-writing", "label": "Communicate to senior stakeholders in writing", "status": "threshold", "evidence": "Wrote proposals and a decision memo to the single named decision-maker in each brief, opening with the recommendation in 6 of 7.", "sources": [{"scenarioId": 2, "label": "Spotify", "logo": "https://www.google.com/s2/favicons?sz=64&domain=spotify.com"}, {"scenarioId": 4, "label": "Netflix", "logo": "https://www.google.com/s2/favicons?sz=64&domain=netflix.com"}, {"scenarioId": 7, "label": "Amazon", "logo": "https://www.google.com/s2/favicons?sz=64&domain=amazon.com"}]}, {"id": "experiment-decision", "label": "Interpret an experiment and decide under uncertainty", "status": "threshold", "evidence": "On the Slack test he confirmed the primary lift was significant, segmented it, and treated a non-significant underpowered guardrail as unresolved rather than clear.", "sources": [{"scenarioId": 5, "label": "Slack", "logo": "https://www.google.com/s2/favicons?sz=64&domain=slack.com"}]}, {"id": "measurement-design", "label": "Design a measurement system or KPI architecture", "status": "not-yet", "evidence": "Not observed. The first measurement-design scenario unlocks at project 8; he has reached project 7.", "sources": []}, {"id": "open-ended-strategy", "label": "Structure open-ended strategy without a supplied dataset or framing", "status": "not-yet", "evidence": "Not observed. His structure was strongest when the brief named the metric and supplied the data. Defining the question cold is untested.", "sources": []}, {"id": "ai-enablement", "label": "Build or evaluate an AI-enabled workflow", "status": "not-yet", "evidence": "Not observed as a deliverable. He used an AI assistant for hypotheses and drafting throughout but built no AI workflow; those scenarios begin at project 12.", "sources": []}], "behavioralSignals": [{"label": "Sizes the problem before proposing a fix", "evidence": "Quantified the opportunity in dollars or the target metric before recommending in 6 of 7 projects. On Notion he sized it in signups, not revenue.", "sources": [{"scenarioId": 2, "label": "Spotify", "logo": "https://www.google.com/s2/favicons?sz=64&domain=spotify.com"}, {"scenarioId": 4, "label": "Netflix", "logo": "https://www.google.com/s2/favicons?sz=64&domain=netflix.com"}, {"scenarioId": 7, "label": "Amazon", "logo": "https://www.google.com/s2/favicons?sz=64&domain=amazon.com"}]}, {"label": "Commits to one driver with segmented evidence", "evidence": "Named a single driver in 6 of 7 diagnoses rather than a general conclusion. On Amazon he ruled out the dispatch-staging change before settling on the quality-check step.", "sources": [{"scenarioId": 2, "label": "Spotify", "logo": "https://www.google.com/s2/favicons?sz=64&domain=spotify.com"}, {"scenarioId": 6, "label": "Airbnb", "logo": "https://www.google.com/s2/favicons?sz=64&domain=airbnb.com"}, {"scenarioId": 7, "label": "Amazon", "logo": "https://www.google.com/s2/favicons?sz=64&domain=amazon.com"}]}, {"label": "States assumptions, and adds sensitivity on the larger models", "evidence": "6 of 7 models stated assumptions inline. The Amazon dispatch model carried three rate scenarios. No model was submitted with an unstated key assumption.", "sources": [{"scenarioId": 4, "label": "Netflix", "logo": "https://www.google.com/s2/favicons?sz=64&domain=netflix.com"}, {"scenarioId": 7, "label": "Amazon", "logo": "https://www.google.com/s2/favicons?sz=64&domain=amazon.com"}]}, {"label": "Checks the data against qualitative evidence before committing", "evidence": "In 3 of 7 projects he confirmed the quantitative finding against unstructured text, including the Amazon floor notes and 1,100 Spotify exit surveys.", "sources": [{"scenarioId": 2, "label": "Spotify", "logo": "https://www.google.com/s2/favicons?sz=64&domain=spotify.com"}, {"scenarioId": 7, "label": "Amazon", "logo": "https://www.google.com/s2/favicons?sz=64&domain=amazon.com"}]}], "probes": [{"label": "Give him a one-line problem with no dataset attached and watch whether he scopes it before asking for data.", "pattern": "His structured work appeared on briefs that already named the metric and supplied the data. On the two looser briefs the structure was thinner and the recommendation stayed general.", "whyItMatters": "A Strategy and Operations analyst, and any analyst at a small company, usually gets an ambiguous ask and no clean dataset. The track has not tested him defining the question cold.", "sources": [{"scenarioId": 1, "label": "Notion", "logo": "https://www.google.com/s2/favicons?sz=64&domain=notion.so"}, {"scenarioId": 3, "label": "Shopify", "logo": "https://www.google.com/s2/favicons?sz=64&domain=shopify.com"}]}, {"label": "Press him on the second-order cost of a recommendation.", "pattern": "He named the right fix on Shopify and Amazon but did not price its downside: merchant adoption on one, defect risk from sampling on the other.", "whyItMatters": "His recommendations will meet an operator who asks what the fix costs, not just what it saves. That defense is untested.", "sources": [{"scenarioId": 3, "label": "Shopify", "logo": "https://www.google.com/s2/favicons?sz=64&domain=shopify.com"}, {"scenarioId": 7, "label": "Amazon", "logo": "https://www.google.com/s2/favicons?sz=64&domain=amazon.com"}]}, {"label": "Ask him to define a metric for something not yet measured.", "pattern": "Every scenario handed him a target metric to move. Choosing what to measure when nothing is defined has not come up.", "whyItMatters": "Standing up measurement for a new initiative is core to the role and is the part of the track he has not reached.", "sources": []}]}}, "whyGoodFit": {"title": "Why Ron is a good fit for Ramp", "cards": [{"id": 1, "icon": "branch", "label": "Quantifies before recommending", "body": "On the Netflix slowdown he split year-over-year growth from 14% to 6% into a subscriber component and an ARPU component, attributed most of it to slowing regional subscriber adds, and sized the recovery path before naming a fix.", "tag": "Structured thinking"}, {"id": 2, "icon": "pushback", "label": "Goes past the surface reason", "body": "On Airbnb he cut from raw reason codes to calendar-sync conflicts among multi-listing hosts. On Spotify he isolated low early playlist adoption rather than price, with cohort and exit-survey evidence.", "tag": "Root-cause analysis"}, {"id": 3, "icon": "layers", "label": "Leaves a number a reviewer can check", "body": "His models state assumptions inline and carry a sensitivity range on the larger ones. On Amazon he reconciled cycle-time data against floor notes before naming the bottleneck.", "tag": "Defensible modeling"}]}, "howTheyWork": {"intro": "I work best on a framed problem with data in hand. I build the model, isolate one driver, size the opportunity, and open the write-up with the recommendation. On a loose brief I still lean on a manager to help scope the question first.", "signals": ["Opens written work with the recommendation and the number.", "States model assumptions inline.", "Confirms a driver against qualitative evidence before committing to it.", "Stronger on a framed brief than on an open one."], "wouldRehire": [{"persona": "Rachel Nguyen", "company": "Amazon, Fulfillment Operations", "verdict": true, "reason": "For defined diagnostic and process work with a reviewer on the final call. The fulfillment analysis was complete and cross-checked. The sampling recommendation needed review before it reached ops leadership."}, {"persona": "Marcus Tan", "company": "Netflix, Business Strategy", "verdict": false, "reason": "Not yet for an unsupervised strategic mandate. The quantitative work held up, but the recovery call optimized the lower-yield lever, which is the judgment that kind of role turns on. Would consider him for an analyst seat under a senior strategist."}]}, "scenarios": [{"id": 1, "order": 1, "title": "Diagnosed Notion's signup funnel and sized the recoverable conversion", "company": "Notion", "companyColor": "#000000", "companyLogo": "https://www.google.com/s2/favicons?sz=64&domain=notion.so", "thumbnail": null, "videoUrl": null, "brief": "Broke Notion's 5.9% visitor-to-account funnel into steps, isolated signup-start at 26% as the constraint against a ~40% benchmark, and sized the recovery at roughly 33K added accounts a month.", "whatUnlocked": "Funnel and conversion analysis, opportunity sizing.", "score": null, "tags": ["Growth & Revenue"], "deliverables": [{"title": "Visitor-to-Signup Funnel Model", "file": null}, {"title": "Conversion Recovery Recommendation", "file": null}], "behavioralSignals": ["Broke the path into steps before drawing a conclusion", "Sized the recovery off the step rates", "Left the recommendation at the category level"], "feedbackQuote": "Funnel diagnosis was sound. Recovery sized only as a ceiling, recommendation left general.", "performanceReview": {"overallPerformance": "Meets expectations", "summary": "Broke the funnel into steps, identified signup-start at 26% as the constraining step against a roughly 40% benchmark, and ruled out the adjacent steps. Sized the recovery from lifting that step halfway to benchmark and labeled it a ceiling. The recommendation named a direction, simplify the signup step, without a specific change to test.", "whatLanded": [{"point": "Worked the funnel step by step and located the constraint at signup-start rather than reporting the 5.9% headline. The steps around it were ruled out by their conversion rates.", "source": "Hana Brandt, Growth Analytics Lead"}, {"point": "Sized the recovery from the step rates, lifting the 26% step halfway to the 40% benchmark, which nets to roughly 33K added accounts a month at the ceiling.", "source": "Hana Brandt, Growth Analytics Lead"}], "whatMissed": [{"point": "The recommendation stayed at the category level, reduce signup friction, with no specific field, step, or change named to test first.", "source": "Hana Brandt, Growth Analytics Lead"}, {"point": "The 33K figure was presented as the only case. It assumes the users nudged into starting signup finish at today's 67% rate, which marginal users often do not, and no likely case was shown beside it.", "source": "Hana Brandt, Growth Analytics Lead"}], "howThisFits": "An early project, and the pattern that recurs: a sized diagnosis ahead of a thinner recommendation, here paired with an optimistic-only estimate.", "toolsUsed": [{"name": "Google Sheets", "logo": "https://www.google.com/s2/favicons?sz=64&domain=sheets.google.com", "features": "Step-by-step funnel build, conversion-rate splits, signup-lift sizing against a benchmark step"}, {"name": "Google Docs", "logo": "https://www.google.com/s2/favicons?sz=64&domain=docs.google.com", "features": "Conversion Recovery Recommendation, written recommendation-first"}, {"name": "Claude", "logo": "https://www.google.com/s2/favicons?sz=64&domain=claude.ai", "features": "Checking the benchmark assumption and which step was the constraint"}], "observableCounts": [{"label": "Funnel steps modeled", "value": "4"}, {"label": "Benchmark applied to the weak step", "value": "Yes (26% vs 40%)"}, {"label": "Sizing cases provided", "value": "1 (ceiling only)"}, {"label": "Revision cycles before sign-off", "value": "1"}], "teamFeedback": [{"initials": "HB", "name": "Hana Brandt", "role": "Growth Analytics Lead", "avatar": "https://i.pravatar.cc/150?u=hana-brandt", "feedback": "The funnel analysis was structured correctly. He split the path into steps, identified signup-start as the constraint at 26% against a roughly 40% benchmark, and ruled out the adjacent steps by their rates. The recovery was sized off those rates rather than guessed, but presented only as a ceiling, with no likely case and no adjustment for marginal users finishing at a lower rate. The recommendation named a direction without a specific change to test. The diagnosis was further along than the recommendation."}]}}, {"id": 2, "order": 2, "title": "Isolated Spotify's early-churn driver and scoped a $4M recovery", "company": "Spotify", "companyColor": "#1DB954", "companyLogo": "https://www.google.com/s2/favicons?sz=64&domain=spotify.com", "thumbnail": null, "videoUrl": null, "brief": "Segmented first-90-day Premium churn by tenure, isolated low early playlist adoption as the driver using cohort data and 1,100 exit surveys, and scoped the addressable recovery to about $4M of the $11.4M.", "whatUnlocked": "Cohort analysis, LTV/CAC, behavioral segmentation, opportunity sizing.", "score": null, "tags": ["Growth & Revenue"], "deliverables": [{"title": "Early-Tenure Churn Cohort Analysis", "file": null}, {"title": "Churn Root-Cause Diagnosis", "file": null}, {"title": "LTV Impact Model", "file": null}, {"title": "Subscriber Churn Reduction Proposal", "file": null}], "behavioralSignals": ["Segmented by tenure before drawing a conclusion", "Named the behavioral driver specifically", "Sized the addressable share rather than the full problem"], "feedbackQuote": "Driver isolated with cohort and survey evidence; recovery scoped to the addressable third; intervention underspecified.", "performanceReview": {"overallPerformance": "Meets expectations", "summary": "Segmented churn by tenure and plan, confirmed the rise sat in 0 to 90 day subscribers, and isolated low early playlist adoption as the driver using cohort data and 1,100 exit surveys. Sized the addressable recovery at about $4M, roughly a third of the $11.4M, rather than claiming the full amount back. The retention fix he proposed was directionally right and underspecified.", "whatLanded": [{"point": "Named a behavioral driver rather than dissatisfaction: early subscribers with few listening sessions in their final 30 days and no personalised-playlist engagement, with the cohort share quantified.", "source": "James Okafor, Head of Subscriber Growth"}, {"point": "Scoped the recovery to the share attributable to the driver, about $4M of the $11.4M, instead of assuming the full elevated churn was addressable. The cost build used the $18 re-acquisition cost net of the 22% re-subscription rate.", "source": "James Okafor, Head of Subscriber Growth"}], "whatMissed": [{"point": "The proposed day-7 playlist prompt was underspecified: no trigger logic, no content definition, and no contrast with the nudge already shipped. A prior experiment in the materials bore on it and was not used.", "source": "James Okafor, Head of Subscriber Growth"}], "howThisFits": "His strongest mode: a framed, data-rich brief where the diagnosis and the sizing hold. The recommendation mechanism is the thinner half, as on Notion and Shopify.", "toolsUsed": [{"name": "Google Sheets", "logo": "https://www.google.com/s2/favicons?sz=64&domain=sheets.google.com", "features": "Tenure-bucket and plan churn pivots, monthly trend, LTV recovery model at 5.8% versus 3.5%"}, {"name": "Google Docs", "logo": "https://www.google.com/s2/favicons?sz=64&domain=docs.google.com", "features": "Churn Root-Cause Diagnosis, written recommendation-first"}, {"name": "Claude", "logo": "https://www.google.com/s2/favicons?sz=64&domain=claude.ai", "features": "Clustering 1,100 exit-survey responses, testing which signal separated early churners"}], "observableCounts": [{"label": "Tenure buckets segmented", "value": "4"}, {"label": "Churn-driver hypotheses evaluated", "value": "5"}, {"label": "Exit-survey responses reviewed", "value": "1,100"}, {"label": "Recovery scoped to addressable share", "value": "Yes (~$4M of $11.4M)"}, {"label": "Revision cycles before sign-off", "value": "2"}], "teamFeedback": [{"initials": "JO", "name": "James Okafor", "role": "Head of Subscriber Growth", "avatar": "https://i.pravatar.cc/150?u=james-okafor", "feedback": "He isolated low early playlist adoption as the driver using cohort segmentation and 1,100 exit surveys, rather than stopping at a general dissatisfaction read. The recovery was scoped to the share the driver explains, about $4M of the $11.4M, which is the right instinct and avoids overclaiming. The retention proposal was the weak part: a day-7 prompt with no trigger logic or content defined, and it did not use a prior experiment in the materials that was directly relevant."}]}}, {"id": 3, "order": 3, "title": "Sized Shopify's copywriting-ticket cost and proposed a deflection fix", "company": "Shopify", "companyColor": "#95BF47", "companyLogo": "https://www.google.com/s2/favicons?sz=64&domain=shopify.com", "thumbnail": null, "videoUrl": null, "brief": "Derived the ~$13M annual cost of copywriting support tickets from volume and per-ticket cost, and recommended an in-editor AI copy assistant targeting a 12%-to-6% reduction, about $6.5M.", "whatUnlocked": "Ticket categorization, cost-driver analysis, automation-opportunity identification.", "score": null, "tags": ["Operations"], "deliverables": [{"title": "Support Ticket Category Analysis", "file": null}, {"title": "Copywriting Demand Root-Cause", "file": null}, {"title": "Support Cost Model", "file": null}, {"title": "Customer Support Cost Reduction Proposal", "file": null}], "behavioralSignals": ["Built the cost from volume and rate, not the brief's figure", "Framed the target as halving, not eliminating", "Did not price merchant adoption of the fix"], "feedbackQuote": "Cost model derived from the data; savings rested on an adoption rate that was never examined.", "performanceReview": {"overallPerformance": "Meets expectations", "summary": "Categorised tickets, derived the roughly $13M cost from volume and per-ticket cost rather than the brief, and recommended an in-editor AI copy assistant targeting a 12% to 6% cut, about $6.5M. The recommendation rested on a merchant-adoption and deflection assumption he did not examine.", "whatLanded": [{"point": "Built the cost from ticket volume and per-ticket cost, and showed the copywriting share trend rather than a single figure.", "source": "Daniel Cho, Director of Merchant Operations"}, {"point": "Framed the target as halving demand, not eliminating it, which kept the $6.5M claim bounded.", "source": "Daniel Cho, Director of Merchant Operations"}], "whatMissed": [{"point": "The savings assumed merchants would adopt the assistant and that it would deflect tickets rather than redirect them to other categories. Neither was sized; no adoption range was offered.", "source": "Daniel Cho, Director of Merchant Operations"}], "howThisFits": "Cost diagnosis ahead of a recommendation that does not yet survive its own adoption question, the same shape as Notion.", "toolsUsed": [{"name": "Google Sheets", "logo": "https://www.google.com/s2/favicons?sz=64&domain=sheets.google.com", "features": "Ticket-category breakdown, copywriting-share trend, annual cost model from per-ticket economics"}, {"name": "Google Docs", "logo": "https://www.google.com/s2/favicons?sz=64&domain=docs.google.com", "features": "Copywriting Demand Root-Cause, written recommendation-first"}, {"name": "Claude", "logo": "https://www.google.com/s2/favicons?sz=64&domain=claude.ai", "features": "Clustering copywriting tickets into request types to name the dominant reason merchants ask for help"}], "observableCounts": [{"label": "Ticket categories analyzed", "value": "9"}, {"label": "Request-type clusters formed", "value": "4"}, {"label": "Adoption scenarios modeled", "value": "0"}, {"label": "Revision cycles before sign-off", "value": "2"}], "teamFeedback": [{"initials": "DC", "name": "Daniel Cho", "role": "Director of Merchant Operations", "avatar": "https://i.pravatar.cc/150?u=daniel-cho", "feedback": "The cost model was built from volume and rate rather than the figure in the brief, and the target was framed as halving demand, not eliminating it, which kept the number honest. The recommended in-editor assistant rested on two unexamined assumptions: that merchants would adopt it, and that it would deflect tickets rather than shift them to another category. Neither was sized, so the $6.5M is a ceiling resting on adoption nobody has tested."}]}}, {"id": 4, "order": 4, "title": "Decomposed Netflix's revenue slowdown into subscriber and ARPU drivers", "company": "Netflix", "companyColor": "#E50914", "companyLogo": "https://www.google.com/s2/favicons?sz=64&domain=netflix.com", "thumbnail": null, "videoUrl": null, "brief": "Split Netflix's 14%-to-6% growth decline into subscriber and ARPU contributions across eight quarters, attributed most of it to slowing regional subscriber adds, and modeled the path back toward 10% as a range.", "whatUnlocked": "Revenue decomposition, multi-driver diagnosis, sensitivity modeling.", "score": null, "tags": ["Growth & Revenue"], "deliverables": [{"title": "Revenue Driver Breakdown (8 quarters)", "file": null}, {"title": "Slowdown Diagnosis", "file": null}, {"title": "Growth Recovery Model", "file": null}, {"title": "Revenue Growth Recovery Proposal", "file": null}], "behavioralSignals": ["Separated the subscriber effect from the ARPU effect", "Modeled each lever independently and gave a range", "Directed the recovery at the lower-yield lever"], "feedbackQuote": "Decomposition separated the drivers correctly; the recovery aimed at the lower-yield lever.", "performanceReview": {"overallPerformance": "Meets expectations", "summary": "Separated the growth decline into subscriber and ARPU contributions across eight quarters, attributed most of the deceleration to slowing subscriber adds in two regions with ARPU flat, and modeled the path back toward 10% growth as a range on the supplied base. The recovery directed effort at acquiring subscribers in those same low-ARPU regions, which is defensible but the lower-yield lever for this business.", "whatLanded": [{"point": "Separated the subscriber effect from the ARPU effect rather than treating revenue as one line, and put most of the deceleration on regional subscriber adds, not price.", "source": "Marcus Tan, Director of Business Strategy"}, {"point": "Modeled the three levers independently and expressed the recovery as a range with the swing assumption flagged, not a single figure.", "source": "Marcus Tan, Director of Business Strategy"}], "whatMissed": [{"point": "The recovery leaned on subscriber acquisition in low-ARPU regions, where each added subscriber yields less than an ARPU move. He optimized the driver that fell rather than the lever with the most revenue per subscriber, which is where this business has found recent growth.", "source": "Marcus Tan, Director of Business Strategy"}], "howThisFits": "The decomposition is the clearest evidence of his analytical ceiling on a framed quantitative brief. The lever choice is the recommendation-side gap again, here as a strategy judgment rather than missing detail.", "toolsUsed": [{"name": "Google Sheets", "logo": "https://www.google.com/s2/favicons?sz=64&domain=sheets.google.com", "features": "Revenue equals subscribers times ARPU decomposition across 8 quarters, contribution attribution, regional subscriber splits, recovery range"}, {"name": "Google Docs", "logo": "https://www.google.com/s2/favicons?sz=64&domain=docs.google.com", "features": "Slowdown Diagnosis, written recommendation-first"}, {"name": "Claude", "logo": "https://www.google.com/s2/favicons?sz=64&domain=claude.ai", "features": "Testing whether the slowdown sat in subscribers or ARPU before modeling, surfacing the regional split"}], "observableCounts": [{"label": "Drivers decomposed", "value": "2 (subscribers, ARPU)"}, {"label": "Quarters analyzed", "value": "8"}, {"label": "Levers modeled independently", "value": "3"}, {"label": "Recovery expressed as range vs point", "value": "Range"}, {"label": "Revision cycles before sign-off", "value": "1"}], "teamFeedback": [{"initials": "MT", "name": "Marcus Tan", "role": "Director of Business Strategy", "avatar": "https://i.pravatar.cc/150?u=marcus-tan", "feedback": "The decomposition was the strongest part of the submission. He separated subscriber and ARPU contributions across eight quarters and attributed most of the deceleration to regional subscriber adds, with ARPU flat, and gave the recovery as a range rather than a point. The recovery proposal is where the judgment slipped: he directed effort at acquiring more subscribers in the regions that slowed, which are low-ARPU, when a subscriber there is worth less than an ARPU move almost anywhere. Strong diagnosis, a debatable strategic call."}]}, "videoDuration": "2:31", "videoCaption": "Walkthrough of the subscriber-versus-ARPU decomposition and the recovery call", "relevanceBadge": {"tone": "soft", "label": "Relevant to the role"}}, {"id": 5, "order": 5, "title": "Read Slack's onboarding experiment and scoped the rollout to where it landed", "company": "Slack", "companyColor": "#4A154B", "companyLogo": "https://www.google.com/s2/favicons?sz=64&domain=slack.com", "thumbnail": null, "videoUrl": null, "brief": "Confirmed Slack's guided-setup activation lift (+3.6 points, significant) was concentrated in teams of 2-10, treated the underpowered opt-out guardrail as unresolved, and recommended a scoped rollout to small teams.", "whatUnlocked": "A/B interpretation, statistical significance, guardrail metrics, decision under uncertainty.", "score": null, "tags": ["Growth & Revenue"], "deliverables": [{"title": "Onboarding Experiment Readout", "file": null}, {"title": "Scale-or-Revert Decision Memo", "file": null}], "behavioralSignals": ["Confirmed and segmented the lift before trusting it", "Treated a non-significant guardrail as unresolved, not clear", "Put the recommendation below the readout in the memo"], "feedbackQuote": "Read the experiment and the guardrail correctly; recommendation buried in the memo.", "performanceReview": {"overallPerformance": "Meets expectations", "summary": "Treatment activation, defined as 3+ members and a first message within 7 days, was 44.8% against 41.2% control, a 3.6-point lift significant at this sample and concentrated in teams of 2 to 10, flat for solo and large workspaces. The guardrail, 7-day notification opt-out, moved from 6.1% to 6.8%, not significant and on an underpowered test. He recommended scaling to small teams and monitoring opt-out. The memo opened with experiment design rather than the recommendation.", "whatLanded": [{"point": "Confirmed significance and segmented the lift, finding it concentrated in small teams and flat elsewhere, which is what scoped the rollout to small teams rather than all workspaces.", "source": "Noah Feldman, Product Analytics Manager"}, {"point": "Did not read a non-significant guardrail as no effect. He flagged the test as underpowered for a small opt-out increase and recommended monitoring with a stopping rule rather than dismissing it.", "source": "Noah Feldman, Product Analytics Manager"}], "whatMissed": [{"point": "The decision memo opened with the experiment design and placed the recommendation several paragraphs in. For a decision memo the call belongs first.", "source": "Noah Feldman, Product Analytics Manager"}], "howThisFits": "A counter-case to his usual pattern: here the judgment and the decision were the strong part and the gap was the write-up structure, not recommendation rigor.", "toolsUsed": [{"name": "Google Sheets", "logo": "https://www.google.com/s2/favicons?sz=64&domain=sheets.google.com", "features": "Treatment-versus-control activation, significance check, segment splits, guardrail comparison"}, {"name": "Google Docs", "logo": "https://www.google.com/s2/favicons?sz=64&domain=docs.google.com", "features": "Scale-or-Revert Decision Memo, written recommendation-first"}, {"name": "Claude", "logo": "https://www.google.com/s2/favicons?sz=64&domain=claude.ai", "features": "Checking the significance read and framing the underpowered-guardrail logic"}], "observableCounts": [{"label": "Primary and guardrail metrics evaluated", "value": "2"}, {"label": "Segments tested for heterogeneity", "value": "3"}, {"label": "Recommendation position in the memo", "value": "Paragraph 4"}, {"label": "Revision cycles before sign-off", "value": "1"}], "teamFeedback": [{"initials": "NF", "name": "Noah Feldman", "role": "Product Analytics Manager", "avatar": "https://i.pravatar.cc/150?u=noah-feldman", "feedback": "He confirmed the activation lift was significant and broke it out by segment, finding the gain lives in small teams and is flat for solo and large workspaces, which is what scoped his rollout recommendation. On the guardrail he did not treat a non-significant opt-out change as no effect; he called the test underpowered for a small harm and asked to monitor it with a stopping rule. The weakness was structural: the decision memo led with experiment design, and the actual recommendation sat in the fourth paragraph."}]}}, {"id": 6, "order": 6, "title": "Traced Airbnb's host cancellations to calendar-sync conflicts", "company": "Airbnb", "companyColor": "#FF5A5F", "companyLogo": "https://www.google.com/s2/favicons?sz=64&domain=airbnb.com", "thumbnail": null, "videoUrl": null, "brief": "Segmented rising host cancellations by reason code and tenure, isolated calendar-sync conflicts among multi-listing hosts as the lead driver, and matched an operational fix to it.", "whatUnlocked": "Marketplace root-cause diagnosis, behavioral segmentation in an operations context.", "score": null, "tags": ["Operations"], "deliverables": [{"title": "Host Cancellation Trend Analysis", "file": null}, {"title": "Cancellation Reason-Code Root-Cause", "file": null}, {"title": "Cancellation Cost Model", "file": null}, {"title": "Host Cancellation Reduction Proposal", "file": null}], "behavioralSignals": ["Segmented past raw reason codes to a host sub-segment", "Tied the fix to the named driver", "Did not isolate the share the fix would address"], "feedbackQuote": "Driver found via segmentation; the $3M savings did not isolate what the fix actually addresses.", "performanceReview": {"overallPerformance": "Meets expectations", "summary": "Segmented cancellations by reason code and host tenure and isolated calendar-sync conflicts among multi-listing hosts as the lead driver, then tied the fix to it. The cost model was the weaker component: the $3M savings carried the per-cancellation cost without isolating what share of cancellations the calendar fix would actually remove.", "whatLanded": [{"point": "Segmented past the raw reason codes to find the calendar-sync problem concentrated in multi-listing hosts, which is the actionable cut rather than the headline reason.", "source": "Sophia Martinez, Director of Marketplace Operations"}, {"point": "Tied the operational fix to that specific driver rather than proposing a blanket policy.", "source": "Sophia Martinez, Director of Marketplace Operations"}], "whatMissed": [{"point": "The $3M assumes the move from 14% to 10% is fully addressed by the calendar fix. Cancellations have several causes, and he did not size the share the fix actually removes, so the savings is overstated.", "source": "Sophia Martinez, Director of Marketplace Operations"}], "howThisFits": "Here the driver work led and the financial model trailed, the reverse of Notion and Shopify. Across the set, one of the two halves leads and the other lags rather than both landing evenly.", "toolsUsed": [{"name": "Google Sheets", "logo": "https://www.google.com/s2/favicons?sz=64&domain=sheets.google.com", "features": "Cancellation-rate trend, reason-code and tenure segmentation, cost rollup"}, {"name": "Google Docs", "logo": "https://www.google.com/s2/favicons?sz=64&domain=docs.google.com", "features": "Cancellation Reason-Code Root-Cause, written recommendation-first"}, {"name": "Claude", "logo": "https://www.google.com/s2/favicons?sz=64&domain=claude.ai", "features": "Testing which reason-code and host-segment combination explained the rise"}], "observableCounts": [{"label": "Segmentation axes used", "value": "2 (reason code, host tenure)"}, {"label": "Reason-code categories analyzed", "value": "4"}, {"label": "Addressable share isolated in the cost model", "value": "No"}, {"label": "Revision cycles before sign-off", "value": "2"}], "teamFeedback": [{"initials": "SM", "name": "Sophia Martinez", "role": "Director of Marketplace Operations", "avatar": "https://i.pravatar.cc/150?u=sophia-martinez", "feedback": "He segmented by reason code and host tenure rather than acting on the raw codes, and found the calendar-sync problem concentrated in multi-listing hosts, then matched the fix to that driver. The cost model was the weak point: the $3M savings assumes the full move from 14% to 10% comes from the calendar fix, when cancellations have several causes. He did not isolate the share the fix removes, so the savings reads high."}]}}, {"id": 7, "order": 7, "title": "Mapped Amazon's fulfillment delays to the quality-check bottleneck", "company": "Amazon", "companyColor": "#FF9900", "companyLogo": "https://www.google.com/s2/favicons?sz=64&domain=amazon.com", "thumbnail": null, "videoUrl": null, "brief": "Mapped the five-stage pick-to-ship process across six fulfillment centers, identified the quality-check step as the bottleneck after the protocol change, and modeled the dispatch-cost recovery at three late-dispatch rates.", "whatUnlocked": "Process mapping, bottleneck identification, throughput and time-based KPIs, sensitivity under operational constraints.", "score": null, "tags": ["Operations"], "deliverables": [{"title": "Pick-to-Ship Process Map and Cycle-Time Overview", "file": null}, {"title": "Bottleneck Diagnosis", "file": null}, {"title": "Dispatch Cost Model", "file": null}, {"title": "Fulfillment Delay Reduction Proposal", "file": null}], "behavioralSignals": ["Mapped all five stages before naming the bottleneck", "Ruled out the competing cause explicitly", "Did not price the defect risk of the sampling fix"], "feedbackQuote": "Widest-scope work in the block; sampling recommendation left its defect-risk tradeoff unpriced.", "performanceReview": {"overallPerformance": "Meets expectations", "summary": "Mapped all five stages, identified the quality-check step as the bottleneck after the protocol change by reconciling cycle-time data with floor notes, and ruled out the dispatch-staging change as the primary cause. Modeled cost at 11%, 8%, and 6% late dispatch, so the case held under a partial fix: returning to 6% recovers about $6M, an 8% outcome about $3.6M. The recommendation to move quality check to 30% sampling did not price the defect risk it introduces.", "whatLanded": [{"point": "Mapped all five stages and showed which one grew rather than reporting the 4.2 to 6.1 hour headline. The quality-check step carried most of the increase after the new protocol.", "source": "Rachel Nguyen, Senior Manager Fulfillment Operations"}, {"point": "Reconciled the cycle-time data with the floor notes and ruled out the dispatch-staging change as the primary cause rather than leaving two candidates open.", "source": "Rachel Nguyen, Senior Manager Fulfillment Operations"}, {"point": "Modeled cost at three rates, so the recovery survives a partial fix: about $6M back at 6%, about $3.6M at 8%.", "source": "Rachel Nguyen, Senior Manager Fulfillment Operations"}], "whatMissed": [{"point": "Moving quality check from full inspection to 30% sampling raises defect and customer-impact risk, the first objection the recommendation would draw in review, and he did not price or bound it.", "source": "Rachel Nguyen, Senior Manager Fulfillment Operations"}], "howThisFits": "The widest-scope work in the block, and it holds up on the analytical side: five stages, a ruled-out alternative, a three-rate sensitivity case. The unpriced risk on the recommendation is the same recommendation-side gap, on the most consequential fix.", "toolsUsed": [{"name": "Google Sheets", "logo": "https://www.google.com/s2/favicons?sz=64&domain=sheets.google.com", "features": "Stage-level cycle-time pivots, process map with per-stage share, dispatch cost model at 11%, 8%, and 6%"}, {"name": "Google Docs", "logo": "https://www.google.com/s2/favicons?sz=64&domain=docs.google.com", "features": "Bottleneck Diagnosis, written recommendation-first"}, {"name": "Claude", "logo": "https://www.google.com/s2/favicons?sz=64&domain=claude.ai", "features": "Pulling bottleneck signals from unstructured floor notes, testing the quality-check cause against the dispatch-staging alternative"}], "observableCounts": [{"label": "Process stages mapped", "value": "5"}, {"label": "Bottleneck candidates evaluated", "value": "2"}, {"label": "Cost scenarios modeled", "value": "3 (11%, 8%, 6%)"}, {"label": "Downside of the recommendation priced", "value": "No"}, {"label": "Revision cycles before sign-off", "value": "2"}], "teamFeedback": [{"initials": "RN", "name": "Rachel Nguyen", "role": "Senior Manager Fulfillment Operations", "avatar": "https://i.pravatar.cc/150?u=rachel-nguyen", "feedback": "The widest-scope submission in the set. He mapped every stage, identified the quality-check step as where the time went after the protocol change, and confirmed it by reconciling cycle-time data with the floor notes instead of trusting one source. He also ruled out the dispatch-staging change rather than hedging between two causes, and modeled cost at three rates so the recovery holds under a partial fix. The gap is on the recommendation: moving quality check to 30% sampling raises defect risk, and he did not price or bound that, which is the first question it draws in review."}]}, "videoDuration": "2:48", "videoCaption": "Walkthrough of the pick-to-ship process map and the quality-check bottleneck call", "featured": true}], "experience": [{"id": 1, "organization": "Wealthsimple", "logo": "https://www.google.com/s2/favicons?sz=64&domain=wealthsimple.com", "type": "Internship", "location": "Toronto, Canada · Hybrid", "roles": [{"title": "Data & Analytics Intern", "period": "May 2024 – Aug 2024", "description": "Supported the growth analytics team with funnel reporting and weekly KPI dashboards for the self-serve onboarding funnel.", "skills": ["Funnel analysis", "Google Sheets", "SQL (basic)"]}]}, {"id": 2, "organization": "TMU Analytics Society", "logo": "https://www.google.com/s2/favicons?sz=64&domain=torontomu.ca", "type": "Part-time", "location": "Toronto, Canada · On-site", "roles": [{"title": "Case Team Lead", "period": "Sep 2023 – Apr 2024", "description": "Led a four-person case team to two regional finals and owned the quantitative modeling sections of each submission.", "skills": ["Financial modeling", "Presentation"]}]}], "academics": [{"id": 1, "institution": "Toronto Metropolitan University", "degree": "Bachelor of Commerce, Business Management", "period": "Sep 2021 – Apr 2025", "gpa": "3.4/4.0", "logo": "https://www.google.com/s2/favicons?sz=64&domain=torontomu.ca"}], "certificates": [{"id": 1, "title": "Google Data Analytics Professional Certificate", "issuer": "Google", "issued": "Aug 2024", "logo": "htt   const per=100/segments;

    {Array.from({length:segments}).map((_,i)=>{const fill=Math.max(0,Math.min(per,pct-i*per)); const w=(fill/per)*100;

  </div>);
};

const useCountUp=(target,dur=900)=>{
  const [n,setN]=useState(target);
  useEffect(()=>{ let raf,t0=null,started=false;
    const step=(t)=>{ if(t0==null){t0=t; started=true; setN(0);} const p=Math.min(1,(t-t0)/dur); setN(Math.round(target*(1-Math.pow(1-p,3)))); if(p<1) raf=requestAnimationFrame(step); };
    raf=requestAnimationFrame(step);
    const to=setTimeout(()=>{ if(!started||true) setN(target); }, dur+800);
    return ()=>{ cancelAnimationFrame(raf); clearTimeout(to); };
  },[target]);
  return n;
};

const AddEntryModal=({kind,onClose,onAdd,onDone})=>{
  const m=ENTRY_META[kind];
  const [vals,setVals]=useState({});
  const [logoUp,setLogoUp]=useState(null);
  const [logoOk,setLogoOk]=useState(false);
  const fileRef=useRef(null);
  const setF=(k,v)=>setVals(o=>({...o,[k]:v}));
  const logoField=m.fields.find(f=>f.logo);
  const orgVal=logoField?(vals[logoField.k]||"").trim():"";
  const guessDomain=(name)=>name.toLowerCase().replace(/[^a-z0-9 ]/g,"").split(/\s+/).filter(Boolean).slice(0,2).join("")+".com";
  const autoLogo=orgVal.length>2?("https://www.google.com/s2/favicons?sz=64&domain="+guessDomain(orgVal)):null;
  const pickFile=(e)=>{ try{ const f=e.target.files&&e.target.files[0]; if(f) setLogoUp(URL.createObjectURL(f)); }catch(_){} };
  const ready=m.fields.every(f=>!f.req||((vals[f.k]||"").trim().length>1));
  const save=()=>{ if(!ready) return;
    const entry=m.compose(Object.fromEntries(Object.entries(vals).map(([k,v])=>[k,(v||"").trim()])));
    const lg=logoUp||((logoOk&&autoLogo)?autoLogo:null); if(lg) entry.logo=lg;
    onAdd(entry); if(onDone) onDone(); onClose(); };
  useEffect(()=>{ const h=e=>e.key==="Escape"&&onClose(); window.addEventListener("keydown",h); return ()=>window.removeEventListener("keydown",h); },[]);
  const rows=[]; let i=0;
  while(i<m.fields.length){
    const f=m.fields[i];
    if(f.half&&m.fields[i+1]&&m.fields[i+1].half){ rows.push([f,m.fields[i+1]]); i+=2; }
    else{ rows.push([f]); i+=1; }
  }
  return ReactDOM.createPortal(
    <div onClick={onClose} style={{position:"fixed",inset:0,zIndex:9999,background:"rgba(0,0,0,.42)",backdropFilter:"blur(6px)",WebkitBackdropFilter:"blur(6px)",display:"flex",alignItems:"center",justifyContent:"center",animation:"overlayIn .2s ease both"}}>
      <div onClick={e=>e.stopPropagation()} className="pop" style={{position:"relative",width:"min(92vw,440px)",background:c("--bg"),border:"1.5px solid rgba(0,0,0,.06)",borderRadius:24,overflow:"hidden"}}>
        <button aria-label="Close" onClick={onClose} className="lift" style={{position:"absolute",top:16,right:16,width:30,height:30,borderRadius:"50%",border:`1px solid ${c("--line")}`,background:c("--bg"),display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",zIndex:5}}
          onMouseEnter={e=>e.currentTarget.style.background=c("--sunken")} onMouseLeave={e=>e.currentTarget.style.background=c("--bg")}><IcX s={13} col={c("--ink")}/></button>
        <div style={{padding:"22px 26px 0"}}>
          <div style={{fontSize:16,fontWeight:600,color:c("--ink"),letterSpacing:"-0.01em"}}>{m.title}</div>
        </div>
        <div style={{padding:"16px 26px 0",display:"flex",flexDirection:"column",gap:12}}>
          {rows.map((r,ri)=>(
            <div key={ri} style={{display:"flex",gap:12}}>
              {r.map(f=>(
                <div key={f.k} style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12.5,fontWeight:600,color:c("--ink"),marginBottom:6}}>{f.label}</div>
                  {f.area
                    ?<textarea style={{...inputSt,height:74,paddingTop:11,resize:"none",fontFamily:F.body,lineHeight:1.5}} value={vals[f.k]||""} onChange={e=>setF(f.k,e.target.value)} placeholder={f.ph}/>
                    :f.logo
                    ?<div style={{position:"relative"}}>
                      <input style={{...inputSt,paddingRight:46}} value={vals[f.k]||""} onChange={e=>setF(f.k,e.target.value)} placeholder={f.ph}/>
                      <span title="Company logo. Click to upload your own" onClick={()=>fileRef.current&&fileRef.current.click()}
                        style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",width:30,height:30,borderRadius:8,background:c("--sunken"),display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",overflow:"hidden"}}>
                        {(logoUp||autoLogo)
                          ?<img src={logoUp||autoLogo} alt="" onLoad={()=>setLogoOk(true)} onError={e=>{setLogoOk(false);e.currentTarget.style.display="none";}} style={{width:20,height:20,objectFit:"contain"}}/>
                          :<IcDoc s={13} col={c("--ink-3")}/>}
                      </span>
                      <input ref={fileRef} type="file" accept="image/*" onChange={pickFile} style={{display:"none"}}/>
                    </div>
                    :<input style={inputSt} value={vals[f.k]||""} onChange={e=>setF(f.k,e.target.value)} placeholder={f.ph}/>}
                </div>
              ))}
            </div>
          ))}
        </div>
        <div style={{padding:"18px 26px 22px",display:"flex",gap:10}}>
          <TButton variant="white" onClick={onClose} style={{flex:"0 0 auto",height:44,padding:"0 18px",fontSize:13.5}}>Cancel</TButton>
          <TButton variant="dark" onClick={save} style={{flex:1,height:44,fontSize:13.5,opacity:ready?1:0.45,cursor:ready?"pointer":"default"}}>Save</TButton>
        </div>
      </div>
    </div>
  , document.body);
};

const gapSubs=(names)=>names.map(n=>{
  const meta=hlSkillMeta(n); const badge=(TOOLS_RATED.find(t=>t.name===n)||{}).badge||meta.badge;

  const cur=skillPos(badge), tgt=goalPos(goal);

const TIER_WORD=new Proxy({},{get:(_,k)=>lword(Number(k))});
const TIER_STEPS=[0,1,2,3,4,5,6,7].map(i=>i/7);
const nearTier=(x)=>TIER_STEPS.reduce((a,b)=>Math.abs(b-x)<Math.abs(a-x)?b:a);
const deriveDim=(label,subs,metWord)=>{
  const cur=subs.reduce((n,sb)=>n+sb.cur,0)/subs.length;
  const tgt=subs.reduce((n,sb)=>n+sb.tgt,0)/subs.length;
  const met=subs.every(sb=>sb.cur>=sb.tgt);
  let cw=nearTier(cur); const tw=nearTier(tgt);
  if(!met&&cw>=tw){ const lower=TIER_STEPS.filter(v=>v<tw); cw=lower.length?lower[lower.length-1]:cw; }
  return {label,cur,tgt,met,curW:met?(metWord||TIER_WORD[nearTier(cur)]):TIER_WORD[cw],tgtW:TIER_WORD[tw],subs};
};

<script>
(()=>{
  const P={
    tick:{g:.28,layers:[{n:1,ft:"bandpass",ff:5400,q:1.8,a:.001,d:.018,p:.14},{o:2600,a:.001,d:.012,p:.018}]},
    press:{g:.14,layers:[{n:1,ft:"bandpass",ff:2000,q:1.4,a:.001,d:.014,p:.07}]},
    toggle:{g:.26,layers:[{n:1,ft:"bandpass",ff:2200,q:1.6,a:.001,d:.016,p:.12},{n:1,ft:"bandpass",ff:3800,q:1.6,off:.024,a:.001,d:.02,p:.1}]},
    open:{g:.15,layers:[{o:1100,glide:600,gt:.12,a:.004,d:.14,p:.05}]},
    chime:{g:.2,layers:[{o:1046.5,a:.006,d:.22,p:.09},{o:1568,off:.09,a:.006,d:.26,p:.08}]},
  };
  let ctx; const mk=()=>{ if(!ctx){ try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return ctx; };
  mk();
  const ensure=()=>{ const c0=mk(); if(c0&&c0.state==='suspended') c0.resume().catch(()=>{}); };
  ['pointerdown','pointerup','keydown','click','touchend','mousemove'].forEach(ev=>window.addEventListener(ev,ensure,{passive:true}));
  const play=(name)=>{ const c0=mk(); if(!c0) return; const prq=P[name]; if(!prq) return;
    if(c0.state!=='running'){ c0.resume().then(()=>{ if(c0.state==='running') doPlay(prq); },()=>{}); return; }
    doPlay(prq); };
  const doPlay=(pr)=>{
    const t0=ctx.currentTime; const m=ctx.createGain(); m.gain.value=pr.g; m.connect(ctx.destination);
    for(const L of pr.layers){ const t=t0+(L.off||0);
      const g=ctx.createGain(); g.gain.setValueAtTime(1e-4,t); g.gain.exponentialRampToValueAtTime(L.p,t+L.a); g.gain.exponentialRampToValueAtTime(1e-4,t+L.a+L.d); g.connect(m);
      if(L.n){ const len=Math.max(1,Math.floor((L.a+L.d+.05)*ctx.sampleRate)); const buf=ctx.createBuffer(1,len,ctx.sampleRate); const ch=buf.getChannelData(0);
        for(let i=0;i<len;i++) ch[i]=Math.random()*2-1;
        const src=ctx.createBufferSource(); src.buffer=buf; const f=ctx.createBiquadFilter(); f.type=L.ft; f.frequency.value=L.ff; if(L.q) f.Q.value=L.q;
        src.connect(f); f.connect(g); src.start(t); src.stop(t+L.a+L.d+.05);
      } else { const o=ctx.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(L.o,t); if(L.glide) o.frequency.exponentialRampToValueAtTime(L.glide,t+(L.gt||(L.a+L.d)));
        o.connect(g); o.start(t); o.stop(t+L.a+L.d+.05); }
    }
    setTimeout(()=>m.disconnect(),800);
  };
  let lastHover=0;
  document.addEventListener('pointerenter',(e)=>{ if(e.pointerType&&e.pointerType!=='mouse') return;
    const el=e.target instanceof Element ? e.target.closest('[data-snd-hover]') : null; if(!el) return;
    const rt=e.relatedTarget; if(rt instanceof Node && el.contains(rt)) return;
    const now=performance.now(); if(now-lastHover<150) return; lastHover=now; play('tick'); },true);
  document.addEventListener('pointerdown',(e)=>{ const b=e.target instanceof Element ? e.target.closest('button') : null; if(!b) return;
    if(b.dataset.snd==='toggle'){ play('toggle'); return; } play('press'); },true);
  document.addEventListener('click',(e)=>{ const b=e.target instanceof Element ? e.target.closest('button') : null; if(!b) return;
    const t=(b.textContent||'').trim(); if(t==='Add to portfolio'||t==='Add') play('chime'); },true);
  new MutationObserver((muts)=>{ for(const mu of muts) for(const n of mu.addedNodes){
    if(n instanceof Element && ((n.classList&&n.classList.contains('pop'))||(n.querySelector&&n.querySelector('.pop')))){ play('open'); return; } } })
    .observe(document.body,{childList:true,subtree:true});
})();
</script>

<script>
(function(){
  function sweep(){
    var kill=[].slice.call(document.querySelectorAll('button,input[type=range],select'))
      .filter(function(b){
        if(b.tagName==='INPUT'||b.tagName==='SELECT') return true;
        var t=(b.textContent||'').trim();

      });
    kill.forEach(function(b){
      var n=b;
      while(n&&n!==document.body){
        var cs; try{ cs=getComputedStyle(n); }catch(e){ return; }
        if(cs.position==='fixed'){ n.style.display='none'; return; }
        n=n.parentElement;
      }
      var a=b; for(var k2=0;k2<2&&a.parentElement!==document.body;k2++) a=a.parentElement;
      a.style.display='none';
    });
    var w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT), t2;
    while(w.nextNode()){ t2=w.currentNode;
      if(t2.nodeValue&&t2.nodeValue.indexOf('\u2014')>=0)
        t2.nodeValue=t2.nodeValue.replace(/\s?\u2014\s?/g,', '); }
  }
  /* onboarding preview: the coach rail leaves; the work stands alone */
  function railKill(){
    var marks=[].slice.call(document.querySelectorAll('body *')).filter(function(n){
      return n.children.length===0&&/Interview-ready|Edit portfolio/.test(n.textContent||''); });
    marks.forEach(function(m){
      var n=m, main=null;
      while(n&&n!==document.body){
        var p=n.parentElement; if(!p) break;
        var cs=getComputedStyle(p);
        if((cs.display==='flex'||cs.display==='grid')&&p.children.length>1&&
           p.getBoundingClientRect().width>800){ n.style.display='none'; return; }
        n=p;
      }
    });
  }
  setTimeout(railKill,950);
  new MutationObserver(function(){ clearTimeout(railKill._t); railKill._t=setTimeout(railKill,400); })
    .observe(document.body,{subtree:true,childList:true});
  setTimeout(sweep,900);
  new MutationObserver(function(){ clearTimeout(sweep._t); sweep._t=setTimeout(sweep,350); })
    .observe(document.body,{subtree:true,childList:true});
})();
</script>
