   (Portfolio/PortfolioView.tsx and its components, CampaignLanding/index.tsx, components/Sidebar.tsx, Common/BackButton.tsx).
   The app lays this page out on a 1920 wide canvas and scales the canvas to the window, so every number in
   this file is the app's own canvas pixel and .pf-stage carries the one scale (1600 / 1920).
   Light paper, rgb(246,245,243). Type is Google Sans Flex on the app's 1.5 line height, no tracking. */
.ch-portfolio{background:rgb(246,245,243);color:#1F1D1E;font-family:var(--f-sans);letter-spacing:0}
.ch-portfolio *,.ch-portfolio *::before,.ch-portfolio *::after{box-sizing:border-box}
.ch-portfolio svg{display:block}
.ch-portfolio .pf-stage{position:absolute;left:0;top:0;width:1920px;height:1008px;transform:scale(.833333);transform-origin:0 0;font-size:16px;line-height:1.5;color:#1F1D1E}

/* ---------- the shell: the map under the landing page's scrim (blur 25px, a wash to 50% black at the left edge) ---------- */
.ch-portfolio .pf-world{position:absolute;left:0;top:0;width:300px;height:100%;overflow:hidden;background:#232624}
.ch-portfolio .pf-world img{position:absolute;left:-60px;top:-60px;width:2040px;height:1128px;max-width:none;object-fit:cover;filter:blur(25px)}
.ch-portfolio .pf-world::after{content:"";position:absolute;left:0;top:0;width:1920px;height:100%;background:linear-gradient(270deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.5) 100%)}
/* the wordmark: 36px tall with its own 20 / 136 inset, at left 50, top 40 + 15 */
.ch-portfolio .pf-mark{position:absolute;left:55.3px;top:60.3px;width:88.1px;height:25.4px;color:#fff}
.ch-portfolio .pf-mark svg{width:100%;height:100%}
/* the nav pill, centred on the window's height (943 canvas px are on screen), and settings at the foot */
.ch-portfolio .pf-nav{position:absolute;left:50px;top:350.6px;display:flex;flex-direction:column;align-items:center;gap:16px;border-radius:999px;background:rgba(31,29,30,.8);padding:12px 8px}
.ch-portfolio .pf-nav i,.ch-portfolio .pf-util i{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff}
.ch-portfolio .pf-nav svg,.ch-portfolio .pf-util svg{width:24px;height:24px;opacity:.7}
.ch-portfolio .pf-nav i.pf-here{background:#fff;color:#1F1D1E}
.ch-portfolio .pf-nav i.pf-here svg{opacity:1}
.ch-portfolio .pf-util{position:absolute;left:50px;top:849.2px;width:60px;padding:5px 0;display:flex;flex-direction:column;align-items:center;gap:10px}
.ch-portfolio .pf-util svg{opacity:.4}

/* ---------- the panel: everything right of the 233px rail, its left corners rounded ---------- */
.ch-portfolio .pf-panel{position:absolute;left:233px;top:0;right:0;bottom:0;overflow:hidden;border-radius:24px 0 0 24px;background:#F6F5F3}
.ch-portfolio .pf-back{position:absolute;top:32px;left:32px;z-index:50;width:56px;height:56px;border-radius:50%;background:#fff;border:1px solid transparent;box-shadow:0 2px 8px rgba(0,0,0,.04);
  display:flex;align-items:center;justify-content:center;color:#000}
.ch-portfolio .pf-back svg{width:24px;height:24px}
.ch-portfolio .pf-wrap{display:flex;gap:48px;width:100%;max-width:1340px;height:100%;margin:0 auto;padding:0 8px 0 40px;overflow:hidden}
.ch-portfolio .pf-left{flex:3 1 0%;min-width:0;height:100%;overflow:hidden}
.ch-portfolio .pf-left-in{padding-bottom:120px}
.ch-portfolio .pf-right{flex:2 1 0%;min-width:0;height:100%;padding:48px 0;display:flex;flex-direction:column;gap:20px}

/* ---------- header (PortfolioHeader) ---------- */
.ch-portfolio .pf-hd{padding:40px 0 24px}
.ch-portfolio .pf-hd-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.ch-portfolio .pf-who{display:flex;align-items:center;gap:20px;min-width:0}
.ch-portfolio .pf-ava{flex:none;width:80px;height:80px;border-radius:50%;background:#f2d57b;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:500;color:#1F1D1E}
.ch-portfolio .pf-id{min-width:0}
.ch-portfolio .pf-name{margin:0;font-size:28px;font-weight:600;line-height:1.25;color:#1F1D1E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-portfolio .pf-meta{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:16px;font-weight:500;color:rgba(31,29,30,.55)}
.ch-portfolio .pf-meta span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ch-portfolio .pf-meta svg{width:13px;height:13px;flex:none}
/* the mastery badge: the tier between two laurels. It is there once there are scored skills. */
.ch-portfolio .pf-mastery{flex:none;display:inline-flex;align-items:center;gap:10px;padding:9px 16px;border-radius:999px;background:#fff;border:1px solid rgba(31,29,30,.12);color:#1F1D1E}
.ch-portfolio .pf-mastery b{font-size:17px;font-weight:600;line-height:1;white-space:nowrap}
.ch-portfolio .pf-laurel{width:10px;height:20px}
.ch-portfolio .pf-laurel-l{transform:scaleX(-1)}

/* ---------- Projects ---------- */
.ch-portfolio .pf-projects{margin-top:16px}
.ch-portfolio .pf-lbl{font-size:22px;font-weight:500;color:rgba(31,29,30,.45);margin-bottom:12px}
/* GeneratingProjectCard */
.ch-portfolio .pf-gen-w{overflow:hidden;padding-bottom:16px}
.ch-portfolio .pf-gen{display:flex;align-items:flex-start;gap:16px;padding:24px;border-radius:24px;background:#fff;border:1px solid rgba(31,29,30,.08)}
.ch-portfolio .pf-gen-ic{flex:none;width:40px;height:40px;border-radius:50%;background:rgba(31,29,30,.05);display:flex;align-items:center;justify-content:center;color:#1F1D1E}
.ch-portfolio .pf-gen-ic svg{width:20px;height:20px;animation:pf-portfolio-spin 1s linear infinite}
@keyframes pf-portfolio-spin{to{transform:rotate(360deg)}}
.ch-portfolio .pf-gen-x{flex:1;min-width:0}
.ch-portfolio .pf-gen-x b{display:block;font-size:17px;font-weight:600;line-height:1.3;color:#1F1D1E}
.ch-portfolio .pf-gen-x span{display:block;margin-top:4px;font-size:15px;line-height:1.55;color:rgba(31,29,30,.55)}

/* PortfolioProjectCardV2 */
.ch-portfolio .pf-card-w{display:flow-root;overflow:hidden;height:0}
.ch-portfolio .pf-card{border-radius:24px;margin-bottom:16px;padding:24px;background:#fff}
.ch-portfolio .pf-card-row{display:flex;gap:24px}
/* the case-study tile: the company's colour as a frame (150deg, 22% to 40%), a white panel inside it */
.ch-portfolio .pf-tile{flex:none;position:relative;width:288px;height:216px;border-radius:16px;overflow:hidden;background:linear-gradient(150deg,#FF5A5F38,#FF5A5F66)}
.ch-portfolio .pf-tile-in{position:absolute;inset:24px;border-radius:12px;background:#fff;padding:16px;display:flex;flex-direction:column;justify-content:space-between}
.ch-portfolio .pf-tile-co{display:flex;align-items:center;gap:8px}
.ch-portfolio .pf-tile-co img{display:block;width:20px;height:20px;object-fit:contain;border-radius:5px}
.ch-portfolio .pf-tile-co span{font-size:13px;font-weight:500;color:rgba(31,29,30,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-portfolio .pf-tile-t{min-width:0}
.ch-portfolio .pf-tile-t b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:20px;font-weight:600;line-height:1.15;color:#1F1D1E}
.ch-portfolio .pf-tile-t i{display:block;width:28px;height:3px;border-radius:999px;background:rgba(31,29,30,.25);margin-top:8px}
.ch-portfolio .pf-tile-l{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.12em;color:rgba(31,29,30,.4)}
/* the presentation in the tile's corner: a recording, so a play badge */
.ch-portfolio .pf-corner{position:absolute;right:8px;bottom:8px;z-index:1;width:56px;height:56px;border-radius:12px;overflow:hidden;border:2px solid #fff;background:#fff;display:flex;align-items:center;justify-content:center}
.ch-portfolio .pf-corner i{position:absolute;inset:0;background:#FF5A5F66}
.ch-portfolio .pf-corner em{position:relative;width:24px;height:24px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:#1F1D1E}
.ch-portfolio .pf-corner em svg{width:10px;height:10px}
.ch-portfolio .pf-body{flex:1;min-width:0;display:flex;flex-direction:column}
.ch-portfolio .pf-body h3{margin:0 0 8px;font-size:18px;font-weight:600;line-height:1.35;color:#1F1D1E}
.ch-portfolio .pf-body p{margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;line-height:1.6;color:#8C8688}
/* the chip row: the presentation and its length, each deliverable, the performance review */
.ch-portfolio .pf-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.ch-portfolio .pf-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid rgba(31,29,30,.05);background:#F4F3F0;font-size:13px;font-weight:500;color:#3A3638;white-space:nowrap}
.ch-portfolio .pf-chip svg{flex:none}
.ch-portfolio .pf-chip-pres svg{width:11px;height:11px;color:#1F1D1E}
.ch-portfolio .pf-chip-file svg{width:13px;height:13px;color:#8C8688}

/* ---------- Yet to do (YetToDoList): a dashed slot for each scenario still ahead ---------- */
.ch-portfolio .pf-todo{margin-top:4px}
.ch-portfolio .pf-td{overflow:hidden;padding-bottom:14px}
.ch-portfolio .pf-td:last-child{padding-bottom:0}
.ch-portfolio .pf-td-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px;border-radius:22px;border:1.5px dashed rgba(31,29,30,.12)}
.ch-portfolio .pf-td-t{min-width:0;font-size:16.5px;font-weight:600;line-height:1.3;color:rgba(31,29,30,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-portfolio .pf-td-p{flex:none;font-family:var(--f-mono);font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;color:rgba(31,29,30,.45);border:1px dashed rgba(31,29,30,.12);white-space:nowrap}

/* ---------- skills (SkillsMatrix, RatingChip) ---------- */
.ch-portfolio .pf-skills{margin-top:80px}
.ch-portfolio .pf-sk-lbl{font-size:22px;color:rgba(31,29,30,.42);margin-bottom:24px}
.ch-portfolio .pf-sk-grid{display:grid;grid-template-columns:1fr 1fr}
.ch-portfolio .pf-col{padding-right:48px}
.ch-portfolio .pf-col+.pf-col{padding:0 0 0 48px;border-left:1px solid rgba(31,29,30,.08)}
.ch-portfolio .pf-col-h{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.ch-portfolio .pf-col-h i{display:inline-flex;color:rgba(31,29,30,.45)}
.ch-portfolio .pf-col-h svg{width:15px;height:15px}
.ch-portfolio .pf-col-h span{font-size:16px;font-weight:600;color:#1F1D1E}
.ch-portfolio .pf-sk{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0}
.ch-portfolio .pf-sk>span{min-width:0;font-size:15px;color:#1F1D1E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-portfolio .pf-rate{flex:none;display:inline-flex;align-items:center;border-radius:999px;font-style:normal;font-size:11.5px;font-weight:600;padding:4px 12px;white-space:nowrap;border:1px solid transparent}
.ch-portfolio .pf-rate-excellent{color:rgb(0,166,86);background:rgb(211,238,221)}
.ch-portfolio .pf-rate-strong{color:rgb(15,70,40);background:rgba(20,135,74,.09)}
.ch-portfolio .pf-rate-good{color:rgb(176,124,32);background:rgba(176,124,32,.11)}
.ch-portfolio .pf-rate-developing{color:rgba(31,29,30,.45);border-color:rgba(31,29,30,.06)}

/* ---------- the right column: Getting started (GettingStartedCard), Edit portfolio (PortfolioPhasePanel) ---------- */
.ch-portfolio .pf-phase{display:flex;flex-direction:column;gap:12px}
.ch-portfolio .pf-gs{border-radius:26px;background:#fff;border:1px solid rgba(31,29,30,.05);padding:20px 22px}
.ch-portfolio .pf-gs-h{display:flex;align-items:center;gap:14px}
.ch-portfolio .pf-ring{position:relative;flex:none;width:50px;height:50px;display:inline-flex;align-items:center;justify-content:center}
.ch-portfolio .pf-ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#1F1D1E;font-variant-numeric:tabular-nums}
.ch-portfolio .pf-gs h3{margin:0;font-size:15.5px;font-weight:600;line-height:1.25;letter-spacing:-.01em;color:#1F1D1E}
.ch-portfolio .pf-gs p{margin:2px 0 0;font-size:12.5px;line-height:1.4;color:rgba(31,29,30,.45)}
.ch-portfolio .pf-gs ul{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column}
.ch-portfolio .pf-gs li{display:flex;align-items:center;gap:10px;margin:0 -10px;border-radius:10px;padding:7.5px 10px;border-bottom:1px solid rgba(31,29,30,.06)}
.ch-portfolio .pf-gs li.pf-last{border-bottom:0}
.ch-portfolio .pf-gs li>i{flex:none;width:15px;height:15px;border-radius:50%;border:1.5px dashed rgba(31,29,30,.32)}
.ch-portfolio .pf-gs li>span:first-of-type{flex:1;min-width:0;font-size:13px;line-height:18px;font-weight:600;color:#1F1D1E}
.ch-portfolio .pf-st-act{flex:none;display:flex;align-items:center;gap:6px}
.ch-portfolio .pf-st-act u{text-decoration:none;border-radius:999px;padding:4px;font-size:11.5px;font-weight:600;color:rgba(31,29,30,.45)}
.ch-portfolio .pf-st-act b{border-radius:999px;border:1px solid rgba(31,29,30,.12);background:#fff;padding:4px 12px;font-size:11.5px;font-weight:600;color:#1F1D1E}
.ch-portfolio .pf-edit{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 20px;border-radius:18px;border:1px solid rgba(31,29,30,.12);background:#fff;font-size:16px;font-weight:500;color:#1F1D1E}
.ch-portfolio .pf-edit svg{width:15px;height:15px}

/* ---------- the landing. The app swaps the update card for the project in one render. Here the same
   swap takes half a second, so the eye can follow the slot becoming the card. The class is the end state. ---------- */
.ch-portfolio .pf-gen-w,.ch-portfolio .pf-td-done{transition:height .5s var(--zt-ease),padding .5s var(--zt-ease),opacity .28s var(--zt-ease)}
.ch-portfolio .pf-card-w{opacity:0;transition:height .5s var(--zt-ease),opacity .42s var(--zt-ease) .14s}
.ch-portfolio .pf-card{transform:translateY(14px);transition:transform .6s var(--zt-ease) .08s}
.ch-portfolio .pf-mastery,.ch-portfolio .pf-skills{opacity:0;transition:opacity .45s var(--zt-ease) .3s}
.ch-portfolio.pf-landed .pf-gen-w,.ch-portfolio.pf-landed .pf-td-done{height:0;padding-bottom:0;opacity:0}
.ch-portfolio.pf-landed .pf-card-w{height:auto;opacity:1}
.ch-portfolio.pf-landed .pf-card{transform:none}
.ch-portfolio.pf-landed .pf-mastery,.ch-portfolio.pf-landed .pf-skills{opacity:1}

@media (prefers-reduced-motion:reduce){
  .ch-portfolio .pf-stage *{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}
}

/* ch/09-jobs.css */
/* 9 · the job portal, inside the pop-up. Every size, radius and colour here is the app's own
   (features/jobPortalV2 on dev, tokens from brandPalette.css): paper ink-100, cards ink-0 with an
   ink-900/5 hairline, radius 18 for cards and 14 for the theme's "xl". The app window is 1600 x 778,
   and the two column gaps are 20 where the app has 44, so the thread keeps its 720.
   Every state is a class, the motion is decoration. */
.ch-jobs{background:rgb(246,245,243);color:rgb(31,29,30);font-family:var(--f-sans);font-size:16px;font-weight:400;line-height:1.5;letter-spacing:0;
  --i0:#fff;--i50:rgb(249,248,246);--i100:rgb(246,245,243);--i150:rgb(242,240,237);--i200:rgb(232,230,226);--i300:rgb(217,217,217);--i400:rgb(170,168,165);--i900:rgb(31,29,30);
  --g7:rgb(42,110,72);--g5:rgb(73,186,97);--gt:rgba(73,186,97,.1);
  --a5:rgba(31,29,30,.05);--a10:rgba(31,29,30,.1);--a15:rgba(31,29,30,.15);--a20:rgba(31,29,30,.2);--a25:rgba(31,29,30,.25);
  --a40:rgba(31,29,30,.4);--a50:rgba(31,29,30,.5);--a70:rgba(31,29,30,.7);--a75:rgba(31,29,30,.75);
  --jp-out:cubic-bezier(.2,.6,.3,1)}
.ch-jobs *{box-sizing:border-box}
.ch-jobs p,.ch-jobs h2,.ch-jobs h3,.ch-jobs h4{margin:0;font-size:inherit;font-weight:inherit}
.ch-jobs ol,.ch-jobs ul{margin:0;padding:0;list-style:none}
.ch-jobs b{font-weight:600}
.ch-jobs em,.ch-jobs i,.ch-jobs u{font-style:normal;text-decoration:none}
.ch-jobs small{font-size:inherit}
.ch-jobs button{appearance:none;border:0;margin:0;font-family:inherit;letter-spacing:inherit;cursor:pointer}
.ch-jobs svg{display:block;flex:none}
.ch-jobs .jp-hide{display:none!important}
.ch-jobs .jp-app{position:absolute;left:0;top:0;width:1600px;height:778px;overflow:hidden;background:var(--i100)}

/* a block of the thread arrives by rising 10px. If the animation never runs, it is simply there. */
.ch-jobs .jp-up{animation:jp-jobs-up .45s var(--jp-out) backwards}
@keyframes jp-jobs-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* a small value that changes: the text is set first, this is only the tick */
.ch-jobs .jp-tick{animation:jp-jobs-tick .26s cubic-bezier(.34,1.56,.64,1)}
@keyframes jp-jobs-tick{0%{transform:scale(.88)}60%{transform:scale(1.06)}100%{transform:scale(1)}}

/* a brand mark, plain, its corners at 22% of its size */
.ch-jobs .jp-bl{display:block;object-fit:contain;border-radius:22%}
.ch-jobs .jp-bl-t{font:700 10px/1 var(--f-sans);letter-spacing:-.03em;color:var(--a50)}
/* the logo tile: 40 and 32, a hairline on white */
.ch-jobs .jp-tile{flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--a5);background:var(--i0)}
.ch-jobs .jp-tile-md{width:40px;height:40px;border-radius:14px}
.ch-jobs .jp-tile-sm{width:32px;height:32px;border-radius:10px}
/* the tag: 24 high, radius 10, 12px */
.ch-jobs .jp-tag{flex:none;display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:10px;font-size:12px;font-weight:500;line-height:1;white-space:nowrap;background:var(--i150);color:var(--a70)}
.ch-jobs .jp-tag.jp-strong{font-weight:600}
.ch-jobs .jp-tag-positive{background:var(--gt);color:var(--g7);font-weight:600}
.ch-jobs .jp-tag-live{background:var(--i150);color:var(--i900)}
.ch-jobs .jp-tag svg{width:12px;height:12px;overflow:visible}
.ch-jobs .jp-spin{transform-box:fill-box;transform-origin:center;animation:jp-jobs-spin .9s linear infinite}
@keyframes jp-jobs-spin{to{transform:rotate(360deg)}}

/* the agent's orb */
.ch-jobs .jp-orb{position:relative;flex:none;display:inline-block;border-radius:50%;
  background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.95) 0 7%,rgba(255,255,255,0) 20%),radial-gradient(circle at 72% 80%,rgba(255,255,255,.4) 0 6%,rgba(255,255,255,0) 22%),radial-gradient(circle at 50% 58%,#D6FF7A 0%,#A6EC3F 52%,#6CC81E 100%);
  box-shadow:inset 0 -4px 9px rgba(50,120,8,.38),inset 0 3px 6px rgba(255,255,255,.65),0 6px 16px -8px rgba(90,170,30,.7);
  animation:jp-jobs-jelly 4.2s ease-in-out infinite}
.ch-jobs .jp-orb.jp-muted{filter:saturate(.75);opacity:.85;animation:none}
.ch-jobs .jp-orb-md{width:38px;height:38px}
.ch-jobs .jp-orb-sm{width:22px;height:22px}
.ch-jobs .jp-orb i{position:absolute;background:#1A2A0A}
.ch-jobs .jp-orb i:nth-child(1),.ch-jobs .jp-orb i:nth-child(2){top:38%;width:10%;height:16%;border-radius:99px;animation:jp-jobs-blink 5s linear infinite}
.ch-jobs .jp-orb i:nth-child(1){left:32%}
.ch-jobs .jp-orb i:nth-child(2){right:32%}
.ch-jobs .jp-orb.jp-m-wait i:nth-child(1),.ch-jobs .jp-orb.jp-m-wait i:nth-child(2){height:18%}
.ch-jobs .jp-orb i:nth-child(3){left:50%;top:60%;width:26%;height:12%;margin-left:-13%;border-radius:0 0 99px 99px;transform-origin:50% 0}
.ch-jobs .jp-orb.jp-m-talk i:nth-child(3){animation:jp-jobs-talk .26s ease-in-out infinite alternate}
@keyframes jp-jobs-jelly{0%,100%{transform:scale(1,1)}30%{transform:scale(1.05,.95)}60%{transform:scale(.97,1.03)}}
@keyframes jp-jobs-blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.12)}}
@keyframes jp-jobs-talk{from{transform:scaleY(.35)}to{transform:scaleY(1.1)}}

/* ---------- the host's wordmark and the portal's tabs ---------- */
.ch-jobs .jp-wm{position:absolute;z-index:3;left:50px;top:55px;width:99px;height:36px;display:flex;align-items:center;color:var(--i900)}
.ch-jobs .jp-wm svg,.ch-jobs .jp-wm img{width:100%;height:auto}
.ch-jobs .jp-hd{position:absolute;left:0;right:0;top:0;height:64px;display:flex;align-items:center;gap:16px;padding:0 24px}
.ch-jobs .jp-hd-sp{flex:none;width:120px}
.ch-jobs .jp-tabs{flex:1;display:flex;justify-content:center;gap:2px}

.ch-jobs.jp-open .jp-cine{opacity:0;visibility:hidden;pointer-events:none}

                        '<span class="jp-view">View details' + I.down() + '</span></div>' +

                        '<div class="jp-cv-x"><p>' + first + '-Resume.pdf</p><small>Goes out with your applications</small></div>' +
                        '<div class="jp-cv-a"><span>' + I.out + 'Open</span><span class="jp-cv-i">' + I.pencil + '</span></div></div></div>' +
                      '<div class="jp-picks"><h4>Apply to</h4><ul>' + roles.map(pick).join('') + '</ul></div>' +
                      '<section class="jp-agreed"><span class="jp-agreed-m">' + I.tick(1.8) + '</span><div>' +
                        '<h4>You agreed to how zero applies for you on ' + AGREED_ON + '</h4><p>zero applies only to the roles you tick.</p>' +
                        '<span class="jp-also"><i class="jp-box jp-box-off"></i>Also apply to roles outside my region</span>' +
                        '<span class="jp-what"><u>What you agreed to</u>' + I.down(2.4) + '</span></div></section>' +
                      '<div class="jp-applybar"><button class="jp-apply" type="button" disabled>Apply to ' + plural(roles.length, 'role') + '</button></div>' +
                    '</div>' +
                    '<div class="jp-nav"><span>Back</span><span>Close this</span></div></section>' +
                '</div>' +
              '</div></div>' +
              '<div class="jp-reply jp-hide"><p>Apply to ' + esc(nameList(roles.map(function (r) { return r.co; }))) + '.</p></div></li>' +

              /* the applied beat: what the agent did, what it says, where each application is */
              '<li class="jp-li jp-hide"><div class="jp-beat">' + orb('md', 'talk') + '<div class="jp-col">' +
                '<div class="jp-blk jp-think"><span>' + I.wrench + '2 tool calls' + I.down() + '</span></div>' +
                '<div class="jp-blk"><p class="jp-msg jp-said"></p>' + actions(roles.length) + '</div>' +
                '<div class="jp-blk"><p class="jp-msg"><b class="jp-sum"></b></p><ul class="jp-results">' + roles.map(result).join('') + '</ul>' +
                  '<div class="jp-stop jp-hide"><p>zero keeps applying to new matches for you</p><span>Stop applying for me</span></div></div>' +
              '</div></div></li>' +

              /* the replies, one message each, in the order they come */
              word(esc(roles[Math.min(VIEWER, roles.length - 1)].co) + ' viewed your portfolio.') +
              word(esc(hire.co) + ' wants to interview you.') +
              word('Your interview with ' + esc(hire.co) + ' is booked.', WHEN + '.') +

              /* the offer: the portal's serif line, and the role's own card with Offer where Applied would be */
              '<li class="jp-li jp-won jp-hide"><div class="jp-beat">' + orb('md', 'talk') + '<div class="jp-col">' +
                '<div class="jp-blk"><h2 class="jp-hired">You got the job.</h2></div>' +
                '<div class="jp-blk"><ul class="jp-grid">' + card(hire, -1, tag(I.tick(1.7) + 'Offer', 'positive', true)).replace(' jp-hide', '') + '</ul></div>' +
              '</div></div></li>' +
            '</ol></div></div>' +
            '<div class="jp-foot"><ul class="jp-chips"><li></li><li></li></ul>' +
              '<div class="jp-comp">' + orb('sm') + '<span class="jp-comp-p">Ask zero anything</span><span class="jp-comp-m">' + I.mic + '</span><span class="jp-comp-s">' + I.send + '</span></div></div></section>' +

            /* right: what is waiting on the learner, and the applications */
            '<aside class="jp-agent"><div class="jp-wait">' + orb('md', 'wait') + '<span><b>Waiting on you</b><small>Want zero to apply to these for you?</small></span></div>' +
              '<section class="jp-apps jp-hide"><h3>Applications</h3><ul>' + roles.map(application).join('') + '</ul></section></aside>' +
          '</div>' +

          /* the act that plays over the panel: the portfolio, going to the companies */
          '<div class="jp-cine"><span class="jp-skip">' + I.x + '<span>Skip</span></span>' +
            '<div class="jp-line"><h2></h2></div>' +
            '<div class="jp-stage" style="left:' + STG.x + 'px;top:' + STG.y + 'px;width:' + STG.w + 'px;height:' + STG.h + 'px">' +
              '<div class="jp-env"><div class="jp-env-h"><span class="jp-env-a">' + initial + '</span><span class="jp-env-x"><b>' + name + '</b><small>' + track + '</small></span></div>' +
                '<div class="jp-env-v">' + slide(projects[0], false) + '</div></div>' +
              SENT_TO.map(mark).join('') +
            '</div></div>' +
        '</div>';

      root._jp = { roles: roles, projects: projects, hire: hire, slide: slide, tag: tag };
    },

    run: async function (api) {
      var root = api.root, J = root._jp, roles = J.roles, NR = roles.length, NC = SENT_TO.length;
      function $(s) { return root.querySelector(s); }
      function $$(s) { return [].slice.call(root.querySelectorAll(s)); }
      var cine = $('.jp-cine'), line = $('.jp-line h2'), marks = $$('.jp-mk'), beams = $$('.jp-beam'), pulses = $$('.jp-pulse');
      var thread = $('.jp-thread'), roll = $('.jp-roll'), lis = $$('.jp-li'), cards = $$('.jp-card'), act = $('.jp-act'), form = $('.jp-form');
      var launch = $('.jp-go'), btn = $('.jp-apply'), reply = $('.jp-reply'), results = $$('.jp-res'), said = $('.jp-said'), sum = $('.jp-sum');
      var you = $('.jp-you'), youRoll = $('.jp-you-roll'), stages = $$('.jp-st'), rate = $('.jp-rate'), cs = $('.jp-cs'), csIn = $('.jp-cs-in');
      var wait = $('.jp-wait'), apps = $('.jp-apps'), appRows = $$('.jp-app-r'), chips = $$('.jp-chips li'), orbs = $$('.jp-beat > .jp-orb');
      var landed = SENT_TO.map(function () { return false; }), sending = false, reached = false, open = false;
      var nCards = 1, nProj = 1, level = 0, offered = false, formOpen = false, armed = false, applied = false, swapped = false;
      var nDone = 0, cascade = null, turnDone = null, at = 0, replied = 0, hired = false, pt = 0;
      var wordLis = $$('.jp-word'), won = $('.jp-won');

      function show(el, rise) { if (!el.classList.contains('jp-hide')) return false; el.classList.remove('jp-hide'); if (rise) el.classList.add('jp-up'); return true; }
      function again(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
      /* Navid points. A newer point always wins, even when the older one is still in flight. */
      function pointAt(el, o) {
        var my = ++pt; api.clearRings();
        return api.point(el, o).then(function (hd) { if (my !== pt && hd) hd.clear(); return hd; });
      }
      function rest() { pt++; api.clearRings(); api.cursor.hide(); }
      /* the thread keeps its newest words in view, as the portal's own thread does */
      function follow() { roll.style.transform = 'translateY(' + -Math.max(0, roll.offsetHeight - thread.clientHeight) + 'px)'; }
      function ask(a, b) { chips[0].textContent = a; chips[1].textContent = b; }

      /* ---------- a · the act: the portfolio goes to the companies ---------- */
      function say(text) { line.innerHTML = words(text); line.classList.remove('jp-said-on'); void line.offsetWidth; line.classList.add('jp-said-on'); }
      function land(k, quiet) {
        if (landed[k]) return; landed[k] = true;
        marks[k].classList.add('jp-got'); beams[k].classList.add('jp-lit', 'jp-rest'); pulses[k].classList.add('jp-gone');
        if (!quiet) api.sfx('tick');
      }
      function send() {
        if (sending) return; sending = true;
        say('Going to the companies.');
        marks.forEach(function (m, k) {
          api.later(250 + k * 230, function () { if (landed[k]) return; beams[k].classList.add('jp-lit'); pulses[k].classList.add('jp-fly'); });
          api.later(250 + k * 230 + 420, function () { land(k); });
        });
        api.later(250 + (NC - 1) * 230 + 420 + 90, function () { reach(); });
      }
      function reach(quiet) {
        marks.forEach(function (m, k) { land(k, true); });
        if (reached) return; reached = true;
        if (quiet) { line.innerHTML = words('With 12 recruiters at ' + NC + ' companies.'); line.classList.add('jp-said-on'); }
        else say('With 12 recruiters at ' + NC + ' companies.');
      }
      /* the act ends and the portal is there */
      function openPortal() {
        reach(true);
        if (open) return; open = true;
        root.classList.add('jp-open'); follow();
      }

      /* ---------- b · projects are added, and a role lands for each ---------- */
      function addProject(n, quiet) {              // n is how many projects there are now
        if (n <= nProj || !J.projects[n - 1]) return; nProj = n;
        csIn.innerHTML = J.slide(J.projects[n - 1], true);
        if (!quiet) { again(cs, 'jp-new'); api.sfx('soft'); }
      }
      function addRole(n, quiet) {                 // n is how many roles are in the thread now
        if (n <= nCards || !cards[n - 1]) return; nCards = n;
        show(cards[n - 1], !quiet);
        $('.jp-top').classList.remove('jp-hide');
        $('.jp-n').textContent = pad2(n);
        $$('.jp-li')[0].querySelectorAll('.jp-src-m i')[n - 1].classList.remove('jp-hide');
        $$('.jp-li')[0].querySelector('.jp-src-n').textContent = plural(n, 'source');
        follow();
        if (!quiet) api.sfx(n === NR ? 'good' : 'pop');
      }
      function setLevel(k, quiet) {
        if (k <= level) return; level = k; rate.textContent = LEVELS[k];
        if (!quiet) { again(rate, 'jp-tick'); api.sfx('soft'); }
      }

      /* ---------- c · the offer to apply, its review, and the one button ---------- */
      function offer(quiet) { if (offered) return; offered = true; show(act, !quiet); follow(); }
      function review(quiet) {
        offer(true);
        if (formOpen) return; formOpen = true;
        launch.classList.add('jp-opened'); show(form, !quiet); follow();
        armed = true; btn.disabled = false;
      }
      launch.addEventListener('click', function () { if (!applied) review(); });

      /* ---------- d · zero applies, one application after another ---------- */
      function journey(k, detail) {                // stage k is the one in hand, the ones before it are done
        if (k < at) return; at = k;
        stages.forEach(function (s, n) { s.dataset.s = n < k ? 'done' : n === k ? 'current' : 'upcoming'; });
        if (detail != null && stages[k]) stages[k].querySelector('.jp-st-d').textContent = detail;
      }
      function summary() {
        var left = NR - nDone, parts = [];
        if (nDone) parts.push('Applied to ' + plural(nDone, 'role'));
        if (left) parts.push('Applying to ' + plural(left, 'role') + ' now');
        sum.textContent = parts.join(' · ');
        said.innerHTML = left ? '<b>I’m applying to ' + plural(NR, 'role') + ' for you.</b> The list below shows where each one is.'
          : '<b>I applied to ' + plural(NR, 'role') + ' for you.</b> There is nothing more for you to do on these.';
      }
      function phase(k, p) {                       // p is -1 in line, 0..3 while it is live, 4 when it is applied
        var r = results[k], pill = r.querySelector('.jp-pill'), fills = r.querySelectorAll('.jp-bar i'), names = r.querySelectorAll('.jp-bar-n span');
        if (r.dataset.p != null && +r.dataset.p >= p) return; r.dataset.p = p;
        var done = p >= PHASES.length, queued = p < 0;
        pill.className = 'jp-tag jp-strong jp-pill jp-tag-' + (done ? 'positive' : queued ? 'neutral' : 'live');
        pill.innerHTML = (done ? I.tick(1.7) : queued ? I.line : I.phase[p]) + (done ? 'Applied' : queued ? 'In line' : PHASES[p]);
        r.querySelector('small').textContent = done ? 'Sent, and the employer page confirmed it.' : queued ? 'In line. zero applies to 2 at a time for you.' : PHASE_LINE[p];
        for (var n = 0; n < fills.length; n++) {
          fills[n].className = done ? 'jp-f-ok' : n < p ? 'jp-f-done' : n === p ? 'jp-f-now' : '';
          names[n].classList.toggle('jp-on', done || n <= p);
        }
        if (!done) return;
        r.classList.add('jp-sent'); nDone++;
        var t = appRows[k].querySelector('.jp-tag'); t.className = 'jp-tag jp-tag-positive'; t.textContent = 'Applied';
        stages[1].querySelector('.jp-st-d').textContent = nDone + ' applied';
        lower(); summary();
      }
      /* the thread moves on: the learner's answer, then the agent at work */
      function swap(quiet) {
        if (swapped) return; swapped = true;
        review(true);
        act.classList.add('jp-hide'); show(reply, !quiet); show(lis[1], !quiet);
        results.forEach(function (r, k) { if (r.dataset.p == null) phase(k, k < 2 ? 0 : -1); });
        summary();
        orbs[0].className = 'jp-orb jp-orb-md jp-muted'; wait.querySelector('.jp-orb').classList.remove('jp-m-wait');
        wait.classList.add('jp-settled'); wait.querySelector('b').textContent = 'Nothing is waiting on you'; wait.querySelector('small').textContent = 'Your applications are below.';
        apps.classList.remove('jp-hide'); appRows.forEach(function (r) { show(r, !quiet); });
        ask('What does ' + roles[0].co + ' see?', 'What goes out with each one?');
        journey(1); stages[0].querySelector('.jp-st-d').textContent = plural(NR, 'role') + ' on your pathway';
        stages[1].querySelector('.jp-st-d').textContent = '';
        follow();
      }
      function appliedAll(quiet) {
        applied = true; btn.disabled = true;
        swap(true);
        results.forEach(function (r, k) { phase(k, PHASES.length); });
        orbs[1].classList.remove('jp-m-talk');
        show($('.jp-stop'), !quiet); follow();
      }
      function apply() {
        if (applied || !armed) return; applied = true;
        btn.disabled = true; btn.textContent = 'Starting…';
        api.later(320, function () { swap(); });
        var starts = [], end = 0;                  // zero works on two at a time, the next starts when one is sent
        roles.forEach(function (r, k) {
          starts[k] = k < 2 ? 320 + k * 170 : starts[k - 2] + PHASES.length * 150;
          for (var p = k < 2 ? 1 : 0; p <= PHASES.length; p++) (function (p) { api.later(starts[k] + p * 150, function () { phase(k, p); if (p === PHASES.length) api.sfx('tick'); }); })(p);
          end = Math.max(end, starts[k] + PHASES.length * 150);
        });
        api.later(end + 120, function () { appliedAll(); });
        cascade = api.wait(end + 380);
      }
      btn.addEventListener('click', function () {
        if (!armed || applied) return;
        rest(); apply();
        if (turnDone) turnDone();
      });

      /* ---------- e · the companies write back, one stage of the rail at a time ---------- */
      function status(k, text, tone, strong) {
        var t = appRows[k].querySelector('.jp-tag');
        t.className = 'jp-tag jp-tag-' + tone + (strong ? ' jp-strong' : ''); t.textContent = text; again(t, 'jp-tick');
      }
      function lower() {                           // the rail is longer than the window: bring its end into view
        var over = youRoll.offsetHeight - you.clientHeight;
        youRoll.style.transform = 'translateY(' + -(over > 0 ? Math.max(over, 48) : 0) + 'px)';
      }
      /* the newest message is the one the agent is saying: the ones before it go quiet */
      function settle() { orbs.forEach(function (o) { if (o.offsetParent) { o.classList.remove('jp-m-talk', 'jp-m-wait'); o.classList.add('jp-muted'); } }); }
      function tell(n, q) { settle(); show(wordLis[n], !q); follow(); }
      var REPLY = [
        function () { journey(2); stages[1].querySelector('.jp-st-d').textContent = plural(NR, 'application'); lower(); },
        function (q) { tell(0, q); status(VIEWER, 'Liked you', 'live'); if (!q) api.sfx('soft'); },                    // viewed
        function (q) { journey(3); tell(1, q); status(HIRED, 'Liked you', 'live'); if (!q) api.sfx('pop'); },           // asks for an interview
        function (q) { journey(4); tell(2, q); status(HIRED, 'Interview booked', 'live'); if (!q) api.sfx('soft'); },   // booked, with the day and time
        function () { journey(5); status(HIRED, 'Interview', 'live'); },                                                // the interviews, on the rail
        function (q) { journey(6); status(HIRED, 'Next interview', 'live'); if (!q) api.sfx('soft'); }
      ];
      var REPLY_AT = [0, 250, 1150, 2050, 2500, 2800];
      function tellOffer(q) { settle(); show(won, !q); follow(); }
      function replyTo(n, quiet) { while (replied <= n && replied < REPLY.length) { REPLY[replied](quiet); replied++; } }

      /* ---------- f · the offer ---------- */
      function hire(quiet) {
        replyTo(REPLY.length - 1, true);
        if (hired) return; hired = true;
        journey(STAGES.length);
        status(HIRED, 'Offer', 'positive', true);
        tellOffer(quiet);
        if (!quiet) api.sfx('good');
      }

      ask('Why is ' + roles[0].co + ' the strongest?', 'What does a ' + roles[0].match + '% match mean?');
      follow();
      api.guide.home({ role: ROLE });
      await api.wait(380);

      /* ---------- T16 · it goes to recruiters, more projects bring more roles, a higher level brings the higher tier ---------- */
      await api.say('T16', { onSeg: function (i) {
        if (i === 0) send();
        if (i === 1) {                                          // each project that arrives brings a role into the thread
          openPortal();
          api.later(200, function () { pointAt(cs, { pad: 5, ax: .5, ay: .6 }); });
          for (var k = 2; k < NR; k++) (function (k) {
            api.later(450 + (k - 2) * 800, function () { addProject(k); });
            api.later(620 + (k - 2) * 800, function () { addRole(k); });
          })(k);
        }
        if (i === 2) {                                          // the rating climbs, and the last role lands
          openPortal();
          for (var j = 2; j < NR; j++) { addProject(j, true); addRole(j, true); }
          addProject(NR);
          api.later(350, function () { pointAt(rate, { pad: 6, ax: .5, ay: .9 }); });
          api.later(650, function () { setLevel(1); });
          api.later(1350, function () { setLevel(2); });
          api.later(1800, function () { addRole(NR); });
          api.later(1950, function () { pointAt(cards[NR - 1], { pad: 5, ax: .5, ay: .8 }); });
        }
      } });
      /* whatever the clock did, the page is whole */
      openPortal();
      for (var n = 2; n <= NR; n++) { addProject(n, true); addRole(n, true); }
      setLevel(LEVELS.length - 1, true);
      await api.wait(120);
      rest();

      /* ---------- J1 · we apply with you. Then the one thing the learner does here ---------- */
      await api.say('J1', { onSeg: function () {
        offer();
        api.later(520, function () { if (!formOpen) api.click(launch); });
      } });
      review();
      if (!applied) rest();
      await api.turn({
        badge: 'Try this', text: 'Click <b>Apply to ' + plural(NR, 'role') + '</b>', tip: true, target: applied ? null : btn, pad: 6,
        until: function (done) { turnDone = done; if (applied) done(); },
        auto: function () { if (!applied) return api.click(btn); }
      });
      rest();
      if (cascade) await cascade;
      appliedAll(true);

      /* ---------- no voice: liked, interview booked, interview, next interview ---------- */
      await api.wait(200);
      REPLY.forEach(function (fn, k) { api.later(REPLY_AT[k], function () { replyTo(k); }); });
      await api.wait(3000);
      replyTo(REPLY.length - 1, true);

      /* ---------- T17A · so that's how Zero works ---------- */
      await api.say('T17A', { onSeg: function () { hire(); } });
      hire(true);
      await api.wait(900);
    }
  });
})();

</script>
