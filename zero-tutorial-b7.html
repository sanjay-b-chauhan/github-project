.ch-kickoff .ko-miss{width:14px;height:14px}
.ch-kickoff .ko-ch{display:inline-block;opacity:0;color:#49BA61;filter:blur(.6px);transition:opacity .12s ease-out,color .12s ease-out,filter .12s ease-out}
.ch-kickoff .ko-ch.ko-in{opacity:1}
.ch-kickoff .ko-ch.ko-done{color:#1F1D1E;filter:none}

/* ch/04-pou.css */
/* 4 · proof of understanding. A replica of the kickoff's POU chat as the app draws it on origin/dev:
   KickoffMeeting/index.tsx (the shared top bar + PouContextMeter), KickoffMeeting/Chat/index.tsx (the body grid),
   TrainingShared/Chat (ChatList, VoiceModuleStatic, TranscriptToggle, HoldToTalk, ListeningIndicator,
   ReadonlyNotesPanel) and the learner's Rive voice card, measured from voice_animation_v1.riv.
   The app window is the canvas, 1600 wide, and ends at y 786 where the player crops it. Real px values, 1:1. */
.ch-pou{background:#F2F0ED;color:#2A2118;font-family:var(--f-sans);letter-spacing:0;-webkit-font-smoothing:antialiased}
.ch-pou .pu-app{position:absolute;left:0;top:0;width:1600px;height:786px;display:flex;flex-direction:column;background:#F2F0ED}
.ch-pou button{margin:0;font-family:inherit}

/* ---------- the top bar: back, the context meter, nothing else (MeetingTopBar, PouContextMeter) ---------- */
.ch-pou .pu-top{flex:0 0 auto;display:grid;grid-template-columns:1.3fr 1.8fr 1.3fr;align-items:center;padding:16px 32px;background:#F2F0ED}
.ch-pou .pu-top-l{display:flex;align-items:center;gap:16px;min-width:0}
.ch-pou .pu-back{appearance:none;display:flex;align-items:center;justify-content:center;width:56px;height:56px;flex:0 0 56px;padding:0;border-radius:50%;
  background:#E8E4DF;border:1px solid #f5f5f5;color:#000;cursor:default}
.ch-pou .pu-back svg{display:block;width:24px;height:24px}
/* the level chip of the HUD (LegacyXpLevelPill), drawn at 50 high and zoomed to 33 as the app does */
.ch-pou .pu-top-r{position:relative;display:flex;align-items:center;justify-content:flex-end;gap:12px}
.ch-pou .pu-lvl{zoom:.66;display:flex;flex:none;flex-direction:column;align-items:flex-start;padding:10px 20px;border:2px solid rgba(255,255,255,.1);border-radius:30px;
  background:rgba(0,0,0,.2);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);opacity:0;transform:scale(.6);transform-origin:100% 50%}
.ch-pou.pu-lvl-on .pu-lvl{opacity:1;transform:none;transition:opacity .25s ease-out,transform .6s cubic-bezier(.34,1.56,.64,1)}
.ch-pou .pu-lvl-in{position:relative;display:flex;align-items:center;gap:8px;width:100%}
.ch-pou .pu-lvl-b{position:absolute;inset:0;z-index:1;pointer-events:none}
.ch-pou .pu-lvl-b b{position:absolute;left:50%;top:0;white-space:nowrap;font:500 15px/1 var(--f-mono);font-variant-numeric:tabular-nums;color:#FFD764;text-shadow:0 2px 10px rgba(0,0,0,.55);
  animation:pou-earn 1.25s cubic-bezier(.22,.61,.36,1) both}
.ch-pou .pu-lvl-b i{position:absolute;left:50%;top:50%;width:5px;height:5px;border-radius:50%;background:#FFD764}
@keyframes pou-earn{0%{opacity:0;transform:translate(-50%,4px) scale(.9)}33%,66%{opacity:1}100%{opacity:0;transform:translate(-50%,-36px) scale(1)}}
.ch-pou .pu-lvl-in>i{position:relative;flex:none;width:25.4px;height:26px}
.ch-pou .pu-lvl-in>i img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover}
.ch-pou .pu-lvl-in p{margin:0;font:400 22px/16px var(--f-mono);letter-spacing:-1.1px;white-space:nowrap;color:#fff;font-feature-settings:'lnum' 1,'tnum' 1;text-box-trim:trim-both;text-box-edge:cap alphabetic}
.ch-pou .pu-top-c{position:relative;display:flex;justify-content:center;align-items:center;width:100%;min-width:0}
.ch-pou .pu-meter{display:flex;justify-content:center;align-items:center;gap:16px;width:60%;padding:16px 20px;border-radius:999px;background:#fff;box-shadow:0 2px 12px rgba(31,29,30,.07)}
.ch-pou .pu-bar{position:relative;flex:1 1 0;min-width:0}
.ch-pou .pu-track{height:10px;border-radius:999px;overflow:hidden;background:rgba(31,29,30,.05)}
.ch-pou .pu-fill{position:relative;width:0;height:100%;border-radius:999px;overflow:hidden;isolation:isolate;
  background:linear-gradient(180deg,#7FD495 0%,#49BA61 50%,#37A653 100%);transition:width 1.2s cubic-bezier(.25,.1,.25,1)}
.ch-pou .pu-gloss{position:absolute;left:0;right:0;top:0;height:50%;border-radius:999px;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.8) 0%,rgba(255,255,255,0) 100%);mix-blend-mode:overlay}
.ch-pou .pu-shine{position:absolute;top:0;bottom:0;left:-45%;width:49%;pointer-events:none;transform:skewX(-18deg);
  background:linear-gradient(90deg,rgba(187,255,0,0) 0%,rgba(187,255,0,.7) 50%,rgba(187,255,0,0) 100%);mix-blend-mode:overlay;
  animation:pou-sweep 3.7s cubic-bezier(.37,0,.63,1) infinite}
@keyframes pou-sweep{from{left:-45%}to{left:135%}}
.ch-pou .pu-brain{display:block;flex:0 0 32px;width:32px;height:32px}
.ch-pou.pu-conceal .pu-meter{opacity:0}
.ch-pou .pu-brain path{fill:#1F1D1E;fill-opacity:.6}
.ch-pou.pu-done .pu-brain path{fill:#49BA61;fill-opacity:1}

/* ---------- the body: chat 1.8fr, notes 0.8fr, 30px apart ---------- */
.ch-pou .pu-body{flex:1 1 0;min-height:0;display:grid;grid-template-columns:1.8fr .8fr;column-gap:30px;padding:66px 40px 40px}
.ch-pou .pu-chat{display:flex;flex-direction:column;min-height:0;min-width:0;transition:opacity .4s ease}
.ch-pou.pu-held .pu-chat{opacity:0;pointer-events:none}
.ch-pou .pu-list{position:relative;flex:1 1 0;min-height:0}
.ch-pou .pu-topfade{position:absolute;left:0;right:0;top:0;height:15%;z-index:2;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,#F2F0ED 0%,rgba(242,240,237,0) 100%);transition:opacity .7s ease-in-out}
.ch-pou .pu-list.pu-scrolled .pu-topfade{opacity:1}
.ch-pou .pu-scroll{height:100%;padding:12px 0 16px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 16px,#000 calc(100% - 40px),transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0,#000 16px,#000 calc(100% - 40px),transparent 100%)}
.ch-pou .pu-scroll::-webkit-scrollbar{display:none}
.ch-pou .pu-inner{display:flex;flex-direction:column;max-width:768px;min-height:100%;margin:0 auto;padding:0 24px}
.ch-pou .pu-row{flex:0 0 auto}
.ch-pou .pu-tailgap{flex:0 0 112px;height:112px}

/* ---------- the manager's voice note (VoiceModuleStatic): one white pill, loader first, then the note ---------- */
.ch-pou .pu-npc{display:flex;align-items:flex-start;gap:12px}
.ch-pou .pu-av{position:relative;flex:0 0 40px;width:40px;height:40px}
/* his seat. It never animates, so the engine can always measure it. */
.ch-pou .pu-slot{position:absolute;inset:0;border-radius:50%;background:#C9C2B8}
.ch-pou .pu-av img{position:absolute;inset:0;display:block;width:100%;height:100%;border-radius:50%;object-fit:cover}
.ch-pou .pu-col{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.ch-pou .pu-imsg{position:relative;display:inline-flex}
.ch-pou .pu-tails{position:absolute;inset:0;pointer-events:none;transform-origin:88% 10%;opacity:0;transform:translate(7px,-5px) scale(0);
  transition:transform .42s cubic-bezier(.45,0,.55,1),opacity .42s cubic-bezier(.45,0,.55,1)}
.ch-pou .pu-tail{position:absolute;border-radius:50%;background:#fff}
.ch-pou .pu-tail-1{width:14px;height:14px;left:-3px;bottom:-1px}
.ch-pou .pu-tail-2{width:7px;height:7px;left:-8px;bottom:-6px}
.ch-pou .pu-pill{position:relative;display:flex;flex:none;align-items:center;overflow:hidden;width:255.64px;height:62px;padding:0 10px;border-radius:999px;background:#fff;
  transform-origin:16% 84%;transition:width .6s cubic-bezier(.65,0,.35,1),height .6s cubic-bezier(.65,0,.35,1)}
.ch-pou .pu-note{display:flex;flex:none;align-items:center;gap:8px;transition:opacity .42s cubic-bezier(.65,0,.35,1) .17s,filter .42s cubic-bezier(.65,0,.35,1) .17s}
.ch-pou .pu-loader{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;filter:blur(6px);
  transition:opacity .3s cubic-bezier(.65,0,.35,1),filter .3s cubic-bezier(.65,0,.35,1)}
.ch-pou .pu-dots{display:flex;align-items:center;gap:4.5px}
.ch-pou .pu-dots i{width:6px;height:6px;border-radius:50%;background:rgba(42,33,24,.4)}
/* loading: the iMessage bubble, 60 by 38, two tail circles, three dots */
.ch-pou .pu-npc.pu-loading .pu-pill{width:60px;height:38px}
.ch-pou .pu-npc.pu-loading .pu-note{opacity:0;filter:blur(8px);transition:none}
.ch-pou .pu-npc.pu-loading .pu-loader{opacity:1;filter:none;transition:none}
.ch-pou .pu-npc.pu-loading .pu-tails{opacity:1;transform:none;transition:none}
.ch-pou .pu-npc.pu-loading .pu-dots i{animation:pou-dot 1.25s ease-in-out infinite}
.ch-pou .pu-npc.pu-loading .pu-dots i:nth-child(2){animation-delay:.16s}
.ch-pou .pu-npc.pu-loading .pu-dots i:nth-child(3){animation-delay:.32s}
@keyframes pou-dot{0%,58%,100%{transform:translateY(0);opacity:.4}29%{transform:translateY(-3px);opacity:.9}}
/* the bubble blooms out of its tail, then breathes */
.ch-pou .pu-npc.pu-loading.pu-bloom .pu-tail{animation:pou-tail .5s cubic-bezier(.215,.61,.355,1) both}
.ch-pou .pu-npc.pu-loading.pu-bloom .pu-tail-2{animation-delay:.12s}
.ch-pou .pu-npc.pu-loading.pu-bloom .pu-pill{animation:pou-bubble .6s cubic-bezier(.215,.61,.355,1) .12s both,pou-breathe 1.7s ease-in-out .82s infinite alternate}
.ch-pou .pu-npc.pu-loading.pu-bloom .pu-dots{animation:pou-fade .5s cubic-bezier(.25,.46,.45,.94) .4s both}
@keyframes pou-tail{from{transform:scale(0);opacity:0}}
@keyframes pou-bubble{from{transform:scale(.45);opacity:0}}
@keyframes pou-breathe{from{transform:scale(1)}to{transform:scale(1.035)}}
@keyframes pou-fade{from{opacity:0}}
.ch-pou .pu-npc.pu-loading .pu-tr,.ch-pou .pu-npc.pu-loading .pu-trb{display:none}

.ch-pou .pu-pp{position:relative;display:flex;flex:none;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;background:rgba(42,33,24,.1);color:#747474}
.ch-pou .pu-pp svg{display:block;width:27px;height:27px}
.ch-pou .pu-pp .pu-i-pause{display:none}
.ch-pou .pu-playing .pu-pp .pu-i-play{display:none}
.ch-pou .pu-playing .pu-pp .pu-i-pause{display:block}
.ch-pou .pu-wave{display:flex;flex:none;align-items:center;gap:3.82px;height:28px}
.ch-pou .pu-wave i{flex:none;width:3.15px;border-radius:999px;background:rgba(42,33,24,.4);transition:background-color .15s cubic-bezier(.4,0,.2,1)}
.ch-pou .pu-wave i.pu-played{background:#2A2118}
.ch-pou .pu-tcol{display:flex;flex:none;flex-direction:column;align-items:center;justify-content:center;width:56px;padding:0 4px}
.ch-pou .pu-time{display:block;text-align:center;font:500 12px/1.3 var(--f-sans);letter-spacing:-.24px;text-transform:uppercase;font-variant-numeric:tabular-nums;color:rgba(0,0,0,.5);
  transform-origin:center;transition:transform .36s cubic-bezier(.22,1,.36,1)}
.ch-pou .pu-spd-slot{width:100%;height:0;transition:height .36s cubic-bezier(.22,1,.36,1)}
.ch-pou .pu-spd{display:flex;align-items:center;justify-content:center;width:100%;margin-top:4px;padding:4px 12px;border-radius:13px;white-space:nowrap;
  font:400 11px/1.3 var(--f-sans);font-variant-numeric:tabular-nums;background:rgba(31,29,30,.05);color:rgba(0,0,0,.5);opacity:0;transition:opacity .3s ease}
.ch-pou .pu-playing .pu-time{transform:scale(.77)}
.ch-pou .pu-playing .pu-spd-slot{height:26px}
.ch-pou .pu-playing .pu-spd{opacity:1}
.ch-pou .pu-clk{position:absolute;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none}

/* TRANSCRIPT, under every note. Closed until asked for. */
.ch-pou .pu-tr{appearance:none;display:flex;flex:none;align-items:center;gap:8px;padding:0 10px;border:0;background:none;cursor:pointer;
  font:500 12px/1.5 var(--f-mono);letter-spacing:-.24px;text-transform:uppercase;color:rgba(42,33,24,.5);transition:opacity .15s cubic-bezier(.4,0,.2,1)}
.ch-pou .pu-tr:hover{opacity:.8}
.ch-pou .pu-tr svg{display:block;width:12px;height:12px}
.ch-pou .pu-open>.pu-tr svg,.ch-pou .pu-open>.pu-under>.pu-tr svg{transform:rotate(180deg)}
.ch-pou .pu-trb{display:grid;grid-template-rows:0fr;width:100%;max-width:504px;padding:0 10px;overflow:hidden;opacity:0;
  transition:grid-template-rows .2s cubic-bezier(.4,0,.2,1),opacity .2s cubic-bezier(.4,0,.2,1)}
.ch-pou .pu-open>.pu-trb,.ch-pou .pu-open>.pu-under>.pu-trb{grid-template-rows:1fr;opacity:1}
.ch-pou .pu-trt{min-height:0;overflow:hidden}
.ch-pou .pu-trt p{margin:0 0 8px;padding-top:2px;font:400 14px/1.5 var(--f-sans);letter-spacing:.14px;color:#2A2118;text-align:left;overflow-wrap:break-word}
.ch-pou .pu-trt p+p{padding-top:0}

/* ---------- the learner's own voice card (VoiceAnimationRive, 420 by 160, the pill sits at 20% to 81%) ---------- */
.ch-pou .pu-me{display:flex;flex-direction:column;align-items:flex-end;transform-origin:100% 50%}
.ch-pou .pu-me.pu-fly{animation:pou-fly 1s linear(0,.0328,.1149,.2254,.3486,.4728,.5901,.6953,.7859,.8609,.9206,.9662,.9995,1.0221,1.0362,1.0436,1.046,1.0447,1.0411,1.0361,1.0305,1.0248,1.0193,1.0144,1.0102,1.0067,1.0039,1.0017,1.0001,.9991,.9984,.998,.9979,.9979,.9981,.9983,1) both}
@keyframes pou-fly{from{opacity:0;transform:scale(.36)}}
.ch-pou .pu-card{position:relative;flex:none;width:420px;height:160px}
.ch-pou .pu-mpill{position:absolute;left:81.25px;top:48.5px;width:257.25px;height:63.5px;border-radius:999px;overflow:hidden;background:#EAE8E6;
  box-shadow:inset 0 1px 0 #fff,0 0 0 .75px #DFDDDA}
.ch-pou .pu-mbtn{position:absolute;left:11.75px;top:11.1px;display:flex;align-items:center;justify-content:center;width:41.25px;height:41.25px;border-radius:50%;background:#DBD7D4;color:#747474}
.ch-pou .pu-mbtn svg{display:block;width:25px;height:25px;transform:translateX(.8px)}
.ch-pou .pu-mwave{position:absolute;left:63px;top:0;bottom:0;display:flex;align-items:center;gap:4.4px}
.ch-pou .pu-mwave i{flex:none;width:3px;border-radius:999px;background:#A5A19E}
.ch-pou .pu-mtime{position:absolute;right:17.5px;top:0;bottom:0;display:flex;align-items:center;font:400 13px/1 var(--f-sans);font-variant-numeric:tabular-nums;color:rgba(0,0,0,.5)}
/* analysing: the button glows, then white and green light crosses the pill twice. About 2.1s a round. */
.ch-pou .pu-shim{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .3s ease}
.ch-pou .pu-shim::before{content:"";position:absolute;top:0;bottom:0;left:0;width:78%;transform:translateX(-105%);
  background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.95) 34%,rgba(255,255,255,.4) 50%,rgba(203,233,165,.85) 68%,rgba(203,233,165,0) 100%)}
.ch-pou .pu-shim::after{content:"";position:absolute;left:-8px;top:-8.9px;width:81.25px;height:81.25px;border-radius:50%;opacity:0;
  background:radial-gradient(circle closest-side,rgba(255,255,255,.95) 0%,rgba(255,255,255,.9) 42%,rgba(203,233,165,.75) 70%,rgba(203,233,165,0) 100%)}
.ch-pou .pu-me.pu-analysing .pu-shim{opacity:1}
.ch-pou .pu-me.pu-analysing .pu-shim::before{animation:pou-shim 2.12s linear infinite}
.ch-pou .pu-me.pu-analysing .pu-shim::after{animation:pou-shim-b 2.12s ease-in-out infinite}
@keyframes pou-shim{0%,19%{transform:translateX(-105%)}50%{transform:translateX(135%)}50.01%{transform:translateX(-105%)}80%,100%{transform:translateX(135%)}}
@keyframes pou-shim-b{0%,4%{opacity:0}14%{opacity:.9}26%,100%{opacity:0}}
/* the reaction: a white coin under the pill's right corner. It simply appears, as the app builds it. */
.ch-pou .pu-coin{position:absolute;left:307.5px;top:101px;width:33.25px;height:33.25px;border-radius:50%;background:#fff;display:none}
.ch-pou .pu-coin img{position:absolute;left:9.375px;top:6.375px;display:block;width:14.875px;height:19.375px}
.ch-pou .pu-me.pu-reacted .pu-coin{display:block}
/* under the card: "Listening...", then TRANSCRIPT, pulled up over the artboard's empty band */
.ch-pou .pu-under{position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-end;width:100%;padding-right:79.8px;margin-top:-44px}
.ch-pou .pu-me.pu-reacted .pu-under{margin-top:-22px}
.ch-pou .pu-listen{display:flex;flex:none;width:340.2px;padding-left:84px}
.ch-pou .pu-listen-in{display:flex;align-items:center;gap:8px;padding:0 0 4px 10px;opacity:0;transition:opacity .4s cubic-bezier(.4,0,.2,1)}
.ch-pou .pu-listen img{display:block;flex:none;width:20px;height:20px;border-radius:50%;object-fit:cover;opacity:0;transform:scale(.6);filter:blur(3px)}
.ch-pou .pu-listen span{font:400 14px/1.5 var(--f-sans);letter-spacing:.14px;color:rgba(42,33,24,.5);white-space:nowrap}
.ch-pou .pu-listen.pu-on .pu-listen-in{opacity:1}
.ch-pou .pu-listen.pu-on img{opacity:1;transform:none;filter:none;
  transition:transform .5s linear(0,.21,.62,.98,1.2,1.27,1.24,1.15,1.06,1,.97,.96,.97,.99,1,1.01,1),opacity .3s cubic-bezier(0,0,.58,1),filter .28s cubic-bezier(0,0,.58,1)}
.ch-pou .pu-listen.pu-swap span{animation:pou-phrase .35s cubic-bezier(.4,0,.2,1) both}
@keyframes pou-phrase{from{opacity:0;transform:translateY(3px);filter:blur(3px)}}
.ch-pou .pu-me .pu-tr{align-self:flex-end}
.ch-pou .pu-me .pu-trt{width:fit-content;max-width:100%;margin-left:auto}
.ch-pou .pu-me .pu-trt p{text-align:justify}
/* a typed answer is a plain text turn, with its reaction badge (ChatList, user-text) */
.ch-pou .pu-tbub-w{position:relative;width:fit-content;max-width:80%}
.ch-pou .pu-me.pu-reacted .pu-tbub-w{margin-bottom:12px}
.ch-pou .pu-tbub{display:flex;justify-content:flex-end;align-items:flex-end;padding:20px;border-radius:24px;background:rgba(255,255,255,.1)}
.ch-pou .pu-tbub p{margin:0;font:400 18px/1.5 var(--f-sans);letter-spacing:.18px;color:#2A2118;overflow-wrap:anywhere}
.ch-pou .pu-tcoin{position:absolute;right:12px;bottom:-12px;display:none;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.ch-pou .pu-tcoin img{position:absolute;left:8px;top:5.5px;display:block;width:12.5px;height:16.3px}
.ch-pou .pu-me.pu-reacted .pu-tcoin{display:block}
.ch-pou .pu-me.pu-typed{margin-top:20px}

/* ---------- hold to talk (HoldToTalk): drawn for 1920, scaled by window width / 1920 from its bottom centre ---------- */
.ch-pou .pu-dock{flex:0 0 auto;width:100%;max-width:768px;margin:0 auto;padding-bottom:20px}
.ch-pou .pu-dockcol{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px}
.ch-pou .pu-htt{display:flex;flex-direction:column;align-items:center;gap:17px;transform:scale(.8333);transform-origin:center bottom}
.ch-pou .pu-htt-w{display:flex;flex-direction:column;align-items:center;transform-origin:center bottom;will-change:transform,filter;
  transition:transform .72s linear(0,.0414,.1448,.2831,.4347,.5838,.7194,.8352,.9282,.9982,1.0468,1.0768,1.0915,1.0946,1.0894,1.0788,1.0653,1.0509,1.0369,1.0244,1.0138,1.0054,.9992,.9949,.9924,.9912,.9911,.9917,.9928,.9941,.9954,.9967,.9979,.9989,.9996,1.0002,1),opacity .36s ease-out,filter .36s ease-out}
.ch-pou .pu-rec{appearance:none;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;width:124px;height:74px;padding:0;border:0;border-radius:55px;
  background:rgba(255,255,255,.16);box-shadow:0 76px 76px 0 rgba(0,0,0,.09),0 19px 42px 0 rgba(0,0,0,.1);color:#1F1D1E;cursor:pointer;
  touch-action:none;-webkit-user-select:none;user-select:none;pointer-events:none;transition:width .42s cubic-bezier(.22,1,.36,1)}
.ch-pou.pu-ready .pu-rec{pointer-events:auto}
.ch-pou .pu-rec-mic{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity .28s cubic-bezier(.4,0,.2,1),filter .28s cubic-bezier(.4,0,.2,1),transform .15s cubic-bezier(.4,0,.2,1)}
.ch-pou .pu-rec-mic svg{display:block;width:24px;height:24px}
.ch-pou.pu-ready .pu-htt[data-state="initial"] .pu-rec:active .pu-rec-mic{transform:scale(.95)}
.ch-pou .pu-rec-bar{position:absolute;inset:0;display:flex;align-items:center;gap:10px;padding:0 10px;opacity:0;filter:blur(10px);pointer-events:none;
  transition:opacity .28s cubic-bezier(.4,0,.2,1),filter .28s cubic-bezier(.4,0,.2,1)}
.ch-pou .pu-rec-x{display:flex;flex:none;align-items:center;justify-content:center;width:50px;height:50px;border-radius:39px;background:rgba(31,29,30,.05);color:#1F1D1E}
.ch-pou .pu-rec-x svg{display:block;width:14px;height:16px}
.ch-pou .pu-rec-wave{display:flex;flex:1 1 0;min-width:0;overflow:hidden;align-items:center;justify-content:center;gap:3px;height:24px}
.ch-pou .pu-rec-wave i{flex:none;width:3px;height:4px;min-height:4px;border-radius:999px;background:#1F1D1E}
.ch-pou .pu-rec-t{flex:none;padding:0 8px;font:400 14px/1.5 var(--f-sans);font-variant-numeric:tabular-nums;color:#1F1D1E}
.ch-pou .pu-rec-send{position:relative;display:flex;flex:none;align-items:center;justify-content:center;width:50px;height:50px;border-radius:39px;background:#1F1D1E;
  box-shadow:0 3px 4px -1px rgba(0,0,0,.15),inset 0 1px 0 0 rgba(255,255,255,.33)}
.ch-pou .pu-rec-send img{display:block;width:20px;height:20px;object-fit:contain}
.ch-pou .pu-htt[data-state="rec"] .pu-rec{width:536px}
.ch-pou .pu-htt[data-state="rec"] .pu-rec-mic{opacity:0;filter:blur(10px)}
.ch-pou .pu-htt[data-state="rec"] .pu-rec-bar{opacity:1;filter:none}
/* the label is its own element: mono caps, black at 50% */
.ch-pou .pu-lab{position:relative;display:flex;align-items:center;justify-content:center;height:18px;transition:opacity .3s ease .4s,transform .3s ease .4s}
.ch-pou .pu-lab span{position:absolute;display:flex;align-items:center;gap:4px;white-space:nowrap;font:400 14px/1.3 var(--f-mono);text-transform:uppercase;font-variant-numeric:tabular-nums;color:rgba(0,0,0,.5);
  transition:opacity .2s ease,transform .2s ease}
.ch-pou .pu-lab .pu-lab-rec{opacity:0;transform:translateY(3px)}
.ch-pou .pu-lab .pu-lab-rec em{display:inline-flex;gap:2px;font-style:normal}
.ch-pou .pu-htt[data-state="rec"] .pu-lab-idle{opacity:0;transform:translateY(-3px)}
.ch-pou .pu-htt[data-state="rec"] .pu-lab-rec{opacity:1;transform:none}
.ch-pou .pu-htt[data-state="rec"] .pu-lab-rec em i{font-style:normal;animation:pou-recdot .6s ease-in-out infinite}
.ch-pou .pu-htt[data-state="rec"] .pu-lab-rec em i:nth-child(2){animation-delay:.2s}
.ch-pou .pu-htt[data-state="rec"] .pu-lab-rec em i:nth-child(3){animation-delay:.4s}
@keyframes pou-recdot{0%,100%{opacity:.3}50%{opacity:1}}
/* sent, or the manager's turn: the pill shrinks and blurs away, the label goes first. It springs back when it is the learner's turn. */
.ch-pou .pu-htt.pu-out .pu-htt-w{transform:scale(.35);opacity:0;filter:blur(24px);transition:transform .8s cubic-bezier(.4,0,1,1),opacity .8s cubic-bezier(.4,0,1,1),filter .8s cubic-bezier(.4,0,1,1)}
.ch-pou .pu-htt.pu-out .pu-lab{opacity:0;transform:translateY(4px);transition:opacity .12s ease,transform .12s ease}
.ch-pou .pu-htt.pu-out .pu-rec{pointer-events:none}
.ch-pou .pu-htt.pu-dim .pu-htt-w{opacity:.4}

/* complete: the mic gives way to Continue */
.ch-pou .pu-cont-w{display:none;justify-content:center}
.ch-pou .pu-cont{appearance:none;display:flex;align-items:center;gap:12px;padding:16px 40px;border:0;border-radius:999px;background:#101828;color:#fff;cursor:pointer;
  font:500 16px/24px var(--f-sans);box-shadow:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1);transition:background-color .15s,box-shadow .15s}
.ch-pou .pu-cont:hover{background:#1e2939;box-shadow:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1)}
.ch-pou .pu-cont svg{display:block;width:20px;height:20px}
.ch-pou.pu-done .pu-htt,.ch-pou.pu-done .pu-help{display:none}
.ch-pou.pu-done .pu-cont-w{display:flex;animation:pou-cont .4s cubic-bezier(.42,0,.58,1) both}
@keyframes pou-cont{from{opacity:0;transform:translateY(20px)}}

/* the tour's own help, only when a take needs it. It uses the slot and the type of the app's mic error line. */
.ch-pou .pu-help{position:absolute;left:0;right:0;bottom:calc(100% - 12px);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.ch-pou .pu-msg{max-width:340px;margin:0;font:400 12px/16px var(--f-sans);text-align:center;color:rgba(0,0,0,.5);opacity:0;transform:translateY(3px);transition:opacity .2s ease,transform .2s ease}
.ch-pou .pu-msg.pu-show{opacity:1;transform:none}
.ch-pou .pu-msg.pu-err{color:#fb2c36}
.ch-pou .pu-msg b{font-weight:500;color:#1F1D1E}
.ch-pou .pu-alt{appearance:none;display:none;padding:0;border:0;background:none;cursor:pointer;pointer-events:auto;font:500 12px/16px var(--f-sans);color:#1F1D1E;text-decoration:underline;text-underline-offset:2px}
.ch-pou .pu-alt:hover{opacity:.7}
.ch-pou.pu-helpable .pu-alt{display:block}
.ch-pou .pu-field{display:none;align-items:center;gap:8px;width:440px;height:46px;padding:0 5px 0 18px;border-radius:999px;background:#fff;box-shadow:0 2px 12px rgba(31,29,30,.07);pointer-events:auto}
.ch-pou.pu-typing .pu-field{display:flex;animation:pou-rise .3s cubic-bezier(.4,0,.2,1) both}
.ch-pou.pu-typing .pu-alt{display:none}
@keyframes pou-rise{from{opacity:0;transform:translateY(6px)}}
.ch-pou .pu-in{flex:1 1 0;min-width:0;height:34px;border:0;outline:0;background:none;font:400 14px/1 var(--f-sans);color:#2A2118}
.ch-pou .pu-in::placeholder{color:rgba(42,33,24,.4)}
.ch-pou .pu-send{appearance:none;display:flex;flex:none;align-items:center;justify-content:center;width:36px;height:36px;padding:0;border:0;border-radius:50%;background:#1F1D1E;cursor:pointer;transition:opacity .2s}
.ch-pou .pu-send img{display:block;width:15px;height:15px;object-fit:contain}
.ch-pou .pu-send:disabled{opacity:.3;cursor:default}

/* ---------- the notes from the meeting (ReadonlyNotesPanel): white card, radius 32, yellow header ---------- */
.ch-pou .pu-notes{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;border-radius:32px;background:#fff;
  transition:opacity .45s cubic-bezier(.22,1,.36,1),transform .45s cubic-bezier(.22,1,.36,1)}
.ch-pou.pu-conceal .pu-notes{opacity:0;transform:translateX(28px)}
.ch-pou .pu-n-head{display:flex;flex:none;align-items:center;gap:10px;padding:14px 24px;background:#FCF2D3}
.ch-pou .pu-n-head svg{display:block;flex:none;width:18px;height:18px}
.ch-pou .pu-n-head span{font:500 14px/20px var(--f-sans);color:#423200}
.ch-pou .pu-n-body{flex:1 1 0;min-height:0;padding:24px 32px;overflow-y:auto;scrollbar-width:none}
.ch-pou .pu-n-body::-webkit-scrollbar{display:none}
.ch-pou .pu-n-sec{margin-bottom:24px;padding-bottom:12px}
.ch-pou .pu-n-hd{margin-bottom:16px;padding-bottom:12px}
.ch-pou .pu-n-hd h3{margin:0;font:500 18px/28px var(--f-serif);color:#2A2118}
.ch-pou .pu-n-rule{margin-top:12px;border-bottom:1px solid #e5e7eb}
.ch-pou .pu-n-items{display:flex;flex-direction:column;gap:8px}
.ch-pou .pu-n-item{display:flex;align-items:flex-start;gap:12px}
.ch-pou .pu-n-item>i{flex:none;width:7px;height:7px;margin-top:7px;border-radius:50%;background:#1F1D1E}
.ch-pou .pu-n-item>span{font:400 14px/1.625 var(--f-sans);color:#2A2118}
/* a fact that has been heard is run over with the notes' own yellow */
.ch-pou .pu-f{border-radius:4px;background:rgba(255,228,143,0);box-shadow:0 0 0 2px rgba(255,228,143,0);transition:background-color .35s ease,box-shadow .35s ease}
.ch-pou .pu-f.pu-hit{background:#FFE48F;box-shadow:0 0 0 2px #FFE48F}
.ch-pou.pu-recap .pu-f.pu-hit{animation:pou-recap .8s ease 1}
@keyframes pou-recap{40%{background:#F9D563;box-shadow:0 0 0 3px #F9D563}}

/* ---------- the hand-off from the meeting (CoinMeterBridge): a coin flips at the top, opens into the meter,
   "Context Meter" and "Got it" stand under it on a green wash, then the capsule glides home ---------- */
.ch-pou .pu-wash{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .26s ease;
  background:radial-gradient(85% 70% at 50% 6%,rgba(165,229,114,.5) 0%,rgba(165,229,114,.26) 44%,rgba(73,186,97,.08) 66%,rgba(73,186,97,0) 82%)}
.ch-pou.pu-intro .pu-wash{opacity:1;transition:opacity .6s ease}
.ch-pou .pu-cmb{position:absolute;z-index:4;width:0;pointer-events:none}
.ch-pou .pu-cmb-s{position:absolute;left:0;top:0;width:0;height:100%;transform:scale(0)}
.ch-pou .pu-cmb-box{position:absolute;left:50%;top:0;transform:translateX(-50%)}
.ch-pou .pu-cmb-glow{position:absolute;inset:-26px;border-radius:999px;filter:blur(20px);opacity:0;
  background:radial-gradient(50% 50% at 50% 50%,rgba(165,229,114,.85) 0%,rgba(73,186,97,.5) 55%,rgba(73,186,97,0) 78%)}
.ch-pou .pu-cmb-edge{position:absolute;inset:0;border-radius:999px;background:#DCDCDC}
.ch-pou .pu-cmb-face{position:absolute;inset:0;border-radius:999px;overflow:hidden;background:#fff;box-shadow:0 2px 12px rgba(31,29,30,.07)}
.ch-pou .pu-cmb-track{position:absolute;top:50%;height:10px;margin-top:-5px;border-radius:999px;background:rgba(31,29,30,.05);transform:scaleX(0);transform-origin:46% 50%;opacity:0}
.ch-pou .pu-cmb-face svg{position:absolute;left:50%;top:50%;display:block;width:32px;height:32px;margin:-16px 0 0 -16px;color:#49BA61}
.ch-pou .pu-cmb-face svg path{fill:currentColor}
.ch-pou .pu-cmb-burst{position:absolute;left:0;width:0;height:0}
.ch-pou .pu-cmb-burst i{position:absolute;border-radius:999px;opacity:0}
.ch-pou .pu-ctx{position:absolute;z-index:5;left:50%;display:flex;flex-direction:column;align-items:center;text-align:center;transform:translateX(-50%);
  opacity:0;pointer-events:none;transition:opacity .22s ease;--s:.65}
.ch-pou.pu-await .pu-ctx{opacity:1;transition:opacity .5s ease}
.ch-pou .pu-ctx h2{margin:0;font:400 calc(56px*var(--s))/1.3 var(--f-serif);letter-spacing:calc(-1.68px*var(--s));white-space:nowrap;color:#1F1D1E}
.ch-pou .pu-ctx p{max-width:calc(408px*var(--s));margin:calc(30px*var(--s)) 0 0;font:500 calc(24px*var(--s))/1.4 var(--f-sans);color:#1F1D1E;opacity:.6}
.ch-pou .pu-got{appearance:none;display:flex;align-items:center;justify-content:center;height:calc(60px*var(--s));margin-top:calc(60px*var(--s));padding:0 calc(40px*var(--s));border:0;border-radius:999px;
  background:#fff;color:#121212;font:600 calc(20px*var(--s))/1 var(--f-sans);letter-spacing:calc(-.4px*var(--s));cursor:pointer;
  box-shadow:0 calc(3.99px*var(--s)) calc(5.32px*var(--s)) calc(-1.33px*var(--s)) rgba(0,0,0,.15),0 0 0 1.33px #d4d4d4,inset 0 1.33px 0 0 rgba(255,255,255,.33);
  transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.ch-pou.pu-await .pu-got{pointer-events:auto}
.ch-pou.pu-await .pu-got:hover{transform:translateY(calc(-1px*var(--s)))}
.ch-pou.pu-await .pu-got:active{transform:translateY(calc(2px*var(--s))) scale(.955)}

/* ---------- what an earned answer sends to the meter (XpOrbOverlay) ---------- */
.ch-pou .pu-orbs{position:absolute;inset:0;z-index:6;overflow:hidden;pointer-events:none}
.ch-pou .pu-orb{position:absolute;left:-24px;top:-24px;width:48px;height:48px;border-radius:50%;opacity:0;
  background:radial-gradient(circle closest-side,rgba(255,255,255,.98) 0%,rgba(193,250,90,.95) 14.6%,rgba(225,255,0,0) 41.7%),radial-gradient(circle closest-side,rgba(190,250,90,.5) 0%,rgba(190,250,90,0) 100%)}
.ch-pou .pu-orb.pu-ghost{background:radial-gradient(circle closest-side,rgba(193,250,90,.4) 0%,rgba(193,250,90,0) 29%)}
.ch-pou .pu-glow{position:absolute;border-radius:50%;opacity:0}
.ch-pou .pu-glow-src{left:-70px;top:-70px;width:140px;height:140px;background:radial-gradient(circle closest-side,rgba(255,255,255,1) 0%,rgba(255,255,255,0) 100%)}
.ch-pou .pu-glow-dst{left:-30px;top:-30px;width:60px;height:60px;background:radial-gradient(circle closest-side,rgba(187,255,0,1) 0%,rgba(187,255,0,0) 100%)}

@media (prefers-reduced-motion:reduce){
  .ch-pou .pu-shine,.ch-pou .pu-dots i,.ch-pou .pu-shim::before,.ch-pou .pu-shim::after,.ch-pou .pu-npc.pu-loading.pu-bloom .pu-pill{animation:none}
  .ch-pou .pu-me.pu-fly{animation-duration:.2s}
}

/* ch/05-workspace.css */
/* 5 · workspace, feedback, coach. A rebuild of the real Stage workspace, read from zero-core-ui
   (origin/dev, 2026-10-12): StageDetailsPage's workspaceHeader / workspaceRail / workspaceChat /
   workspaceComposer scoped sheets, the in-thread feedback card (.fbunit + the score band), and
   features/coach (the top bar instrument pill and the coach panel).
   The canvas is the app's own window, 1600 x 772, with the app's CSS pixels 1:1. The surface is
   dark (#1E1E1E) in Do mode. Learn mode ("I'm stuck") is the one light surface (#FEFEFE): it is a
   second copy of the frame, revealed by the app's bottom-centre ripple.
   Mono labels are PP Supply Mono (the app registers it as 'Supply Mono' at one weight, so the
   sheets' font-weight 700 is the browser's own bold of the regular face, here as there). */
.ch-workspace{background:#1E1E1E;color:#f2f1ee;font-family:var(--f-sans)}

/* ---------- tokens (the scoped sheets' own values) ---------- */
.ch-workspace .ws-app{
  --w-bg:#1e1e1e;--w-card:#262626;--w-panel:#242424;--w-bubble:#333333;--w-soft:#282828;--w-hover:rgba(255,255,255,.06);
  --w-line:rgba(255,255,255,.075);--w-line2:rgba(255,255,255,.04);
  --w-tx:#f2f1ee;--w-tx2:#a5a29b;--w-tx3:#6d6a63;--w-tx4:#4a4844;
  --w-acc:#ffffff;--w-accsoft:rgba(255,255,255,.08);--w-onacc:#0d0d0d;--w-shadow:0 1px 3px rgba(0,0,0,.4);
  --w-ease:cubic-bezier(.625,.05,0,1);--w-tq:.24s;--w-tm:.48s;--w-ts:.6s;
  --w-mono:var(--f-mono);
  position:absolute;z-index:1;left:0;top:0;width:1600px;height:772px;display:flex;flex-direction:column;overflow:hidden;
  background:var(--w-bg);color:var(--w-tx);font-family:var(--f-sans);font-size:14px;line-height:1.55;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
.ch-workspace .ws-app[data-theme="light"]{
  --w-bg:#fefefe;--w-card:#ffffff;--w-panel:#fafafa;--w-bubble:#f2f2f3;--w-soft:#f6f6f7;--w-hover:#f0f0f1;
  --w-line:rgba(13,13,13,.055);--w-line2:rgba(13,13,13,.03);
  --w-tx:#111113;--w-tx2:#63636a;--w-tx3:#9a9aa0;--w-tx4:#c4c4ca;
  --w-acc:#111113;--w-accsoft:rgba(13,13,13,.05);--w-onacc:#ffffff;--w-shadow:0 1px 3px rgba(0,0,0,.05)}
.ch-workspace .ws-app *{box-sizing:border-box;margin:0;padding:0}
.ch-workspace .ws-app button{font-family:inherit;color:inherit;background:none;border:none;letter-spacing:inherit}
.ch-workspace .ws-app svg{display:block}
.ch-workspace .ws-lbl{font-family:var(--w-mono);font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--w-tx2)}

/* ---------- top bar: back, spacer, the level pill, then the coach ---------- */
.ch-workspace .ws-topbar{flex:0 0 auto;height:52px;display:flex;align-items:center;gap:9px;padding:0 16px;background:var(--w-bg);position:relative;z-index:20}
.ch-workspace .ws-spacer{flex:1}
.ch-workspace .ws-back{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--w-tx2);animation:ws-slidelr .5s var(--w-ease) both}
.ch-workspace .ws-back svg{width:20px;height:20px}
/* the HUD level pill, drawn for a 50px design height and zoomed to the bar's 33 */
.ch-workspace .ws-xp{flex:0 0 auto;zoom:.66;display:flex;flex-direction:column;align-items:flex-start;padding:10px 20px;border-radius:30px;
  background:rgba(0,0,0,.2);border:2px solid rgba(255,255,255,.1);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.ch-workspace .ws-xp>span{display:flex;align-items:center;gap:8px;width:100%}
.ch-workspace .ws-xp img{display:block;width:25.4px;height:26px;object-fit:cover}
.ch-workspace .ws-xp i{font-style:normal;font-family:var(--f-mono);font-weight:400;font-size:22px;letter-spacing:-1.1px;line-height:16px;color:#fff;white-space:nowrap;
  text-box-trim:trim-both;text-box-edge:cap alphabetic;font-feature-settings:'lnum' 1,'tnum' 1}

/* the coach: four instruments in one glass case, and she caps its right end */
.ch-workspace .ws-hud{position:relative;flex:0 0 auto;display:none;align-items:center}
.ch-workspace.ws-has-coach .ws-hud{display:flex;animation:ws-hudin .56s cubic-bezier(.2,0,0,1) both}
.ch-workspace .ws-hpill{display:flex;align-items:center;height:34px;padding-left:5px;border-radius:99px;background:rgba(255,255,255,.045);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.05)}
.ch-workspace .ws-hinsts{display:flex;align-items:center;gap:6px}
.ch-workspace .ws-hinst{position:relative;flex:0 0 auto;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#343434;box-shadow:inset 0 0 6px rgba(255,255,255,.45);color:#f2f1ee}
.ch-workspace .ws-hinst>span{display:grid;place-items:center;line-height:0;opacity:.78;transition:opacity .15s}
.ch-workspace .ws-hinst.ws-lit>span{opacity:1}
.ch-workspace .ws-gl{fill:currentColor}
.ch-workspace .ws-hinst .ws-gl{width:13px;height:13px}
.ch-workspace .ws-ring{position:absolute;pointer-events:none;transform:rotate(-90deg);opacity:0}
.ch-workspace .ws-ring circle{fill:none;stroke-linecap:round;stroke-dasharray:119.381;stroke-dashoffset:119.381;transition:stroke-dashoffset .5s cubic-bezier(.2,0,0,1)}
.ch-workspace .ws-read .ws-ring{opacity:1}
.ch-workspace .ws-hinst .ws-ring{inset:-2px;width:28px;height:28px}
.ch-workspace .ws-hinst .ws-ring circle{stroke-width:2.4}
.ch-workspace .ws-hseat{position:relative;flex:0 0 auto;margin-left:7px;width:34px;height:34px;border-radius:50%}
.ch-workspace .ws-hdot{position:absolute;top:-1px;right:-1px;width:9px;height:9px;border-radius:50%;background:#FF6A4D;box-shadow:0 0 0 3.5px rgba(255,106,77,.28);opacity:0;transform:scale(.4);transition:opacity .25s,transform .35s cubic-bezier(.34,1.4,.64,1);pointer-events:none}
.ch-workspace.ws-pushed .ws-hdot{opacity:1;transform:none}

/* a seat. The engine draws Navid over the empty slot. The initial is the app's own fallback for a missing portrait */
.ch-workspace .ws-seat b{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;background:var(--w-soft);color:var(--w-tx2);font-size:13px;font-weight:600;line-height:1}
.ch-workspace .ws-slot{position:absolute;inset:0;border-radius:50%;display:block}

/* ---------- the row: rail | gutter | chat ---------- */
.ch-workspace .ws-work{flex:1 1 auto;display:flex;min-height:0;width:100%}
.ch-workspace .ws-gutter{flex:0 0 5px}

/* ---------- rail ---------- */
.ch-workspace .ws-rail{flex:0 0 312px;min-width:272px;max-width:460px;background:var(--w-bg);display:flex;flex-direction:column;overflow:hidden}
.ch-workspace .ws-rail-top{padding:0 20px}
.ch-workspace .ws-brand{height:54px;display:flex;align-items:center;gap:11px}
.ch-workspace .ws-logo{flex:0 0 auto;width:38px;height:38px;border-radius:99px;background:var(--w-card);border:1px solid var(--w-line);display:grid;place-items:center;overflow:hidden}
.ch-workspace .ws-logo img{display:block;width:100%;height:100%;object-fit:contain;padding:6px}
.ch-workspace .ws-brand-t{font-size:14.5px;font-weight:600;line-height:1.28;letter-spacing:-.01em;color:var(--w-tx)}
.ch-workspace .ws-rail-body{flex:1;overflow:hidden;padding:16px 16px 20px;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 18px,#000 calc(100% - 22px),transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 18px,#000 calc(100% - 22px),transparent 100%)}
.ch-workspace .ws-active{position:relative;border:1px solid var(--w-line);border-radius:16px;padding:16px 16px 8px;margin-bottom:20px}
.ch-workspace .ws-active-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
.ch-workspace .ws-active-h div{flex:1;font-size:19px;font-weight:700;line-height:1.24;letter-spacing:-.02em}
.ch-workspace .ws-timer{margin-bottom:16px}
.ch-workspace .ws-timer-row{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.ch-workspace .ws-timer-row svg{width:14px;height:14px;color:var(--w-tx3)}
.ch-workspace .ws-timer-row span{font-family:var(--w-mono);font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--w-tx2)}
.ch-workspace .ws-timer-row b{margin-left:auto;font-family:var(--w-mono);font-size:13px;color:var(--w-tx);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.5px}
.ch-workspace .ws-timer-track{height:3px;border-radius:99px;background:var(--w-hover);overflow:hidden}
.ch-workspace .ws-timer-track i{display:block;height:100%;background:var(--w-acc);border-radius:99px;transition:width 1s linear}
.ch-workspace .ws-morph{border-top:1px solid var(--w-line);margin-top:16px;padding-top:18px}
.ch-workspace .ws-morph>.ws-lbl{display:block;margin-bottom:8px}
.ch-workspace .ws-req{margin:0 -8px 2px;border-radius:10px}
.ch-workspace .ws-req-h{display:flex;align-items:flex-start;gap:10px;padding:10px 10px}
.ch-workspace .ws-rt{flex:1;font-size:13.5px;font-weight:600;line-height:1.4;letter-spacing:-.01em;color:var(--w-tx)}
.ch-workspace .ws-req-h .ws-chev{color:var(--w-tx3);flex:0 0 auto;margin-top:1px}
.ch-workspace .ws-req-h .ws-chev svg{width:18px;height:18px}
.ch-workspace .ws-req.ws-open .ws-chev{transform:rotate(180deg)}
.ch-workspace .ws-req-body{display:grid;grid-template-rows:0fr}
.ch-workspace .ws-req.ws-open .ws-req-body{grid-template-rows:1fr}
.ch-workspace .ws-req-body>div{overflow:hidden}
.ch-workspace .ws-req-body ul{list-style:none;padding:2px 10px 12px 10px;display:flex;flex-direction:column;gap:9px}
.ch-workspace .ws-req-body li{position:relative;padding-left:16px;font-size:13px;line-height:1.5;color:var(--w-tx2)}
.ch-workspace .ws-req-body li::before{content:"";position:absolute;left:3px;top:8px;width:4px;height:4px;border-radius:99px;background:var(--w-tx4)}
/* Learn mode's follow-along board */
.ch-workspace .ws-walkpill{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px 8px 8px;margin-bottom:18px;border:1px solid var(--w-line);border-radius:99px;background:var(--w-card);text-align:left}
.ch-workspace .ws-wp-play{width:30px;height:30px;border-radius:99px;background:var(--w-acc);color:var(--w-onacc);display:grid;place-items:center;flex:0 0 auto}
.ch-workspace .ws-wp-play svg{width:13px;height:13px;margin-left:2px}
.ch-workspace .ws-wp-t{font-size:12.5px;color:var(--w-tx2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-workspace .ws-wp-t b{color:var(--w-tx);font-weight:600}
.ch-workspace .ws-morph>.ws-lbl.ws-follow{margin:16px 0 10px}
.ch-workspace .ws-csteps{padding:2px 2px 4px}
.ch-workspace .ws-cstep{display:flex;align-items:flex-start;gap:13px;padding:8px 0;position:relative}
.ch-workspace .ws-cstep::before{content:"";position:absolute;left:10px;top:-9px;height:20px;width:2px;background:var(--w-line)}
.ch-workspace .ws-cstep:first-child::before{display:none}
.ch-workspace .ws-cring{width:22px;height:22px;border-radius:99px;border:2px solid var(--w-line);background:var(--w-bg);display:grid;place-items:center;flex:0 0 auto;position:relative;z-index:1}
.ch-workspace .ws-cring i{width:8px;height:8px;border-radius:99px;background:transparent}
.ch-workspace .ws-cstep.ws-cur .ws-cring{border-color:#2e9e5b}
.ch-workspace .ws-cstep.ws-cur .ws-cring i{background:#2e9e5b}
.ch-workspace .ws-ct{flex:1;font-size:13px;line-height:1.4;color:var(--w-tx3);padding-top:2px}
.ch-workspace .ws-cstep.ws-cur .ws-ct{color:var(--w-tx);font-weight:600}
/* the shelves: Project Resources, then Task Resources */
.ch-workspace .ws-tres-wrap{border-top:1px solid var(--w-line);margin-top:16px;padding-top:2px}
.ch-workspace .ws-tres-wrap>.ws-lbl{display:block;margin:16px 0 6px}
.ch-workspace .ws-tres-list{display:flex;flex-direction:column;gap:1px;padding-bottom:8px}
.ch-workspace .ws-tres{display:flex;align-items:center;gap:9px;padding:7px 4px;border-radius:9px}
.ch-workspace .ws-ti{width:18px;height:18px;display:grid;place-items:center;flex:0 0 auto;color:var(--w-tx3)}
.ch-workspace .ws-ti svg{width:16px;height:16px}
.ch-workspace .ws-tn{flex:1;min-width:0;font-size:12.5px;font-weight:500;color:var(--w-tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* the upcoming stages. The app's group label is "Workflows" */
.ch-workspace .ws-group{margin-bottom:4px}
.ch-workspace .ws-group-h{display:flex;align-items:center;gap:9px;padding:12px 2px;color:var(--w-tx3)}
.ch-workspace .ws-group-h .ws-chev{transform:rotate(180deg)}
.ch-workspace .ws-group-h .ws-chev svg{width:16px;height:16px}
.ch-workspace .ws-group-h .ws-lbl{flex:1;color:inherit}
.ch-workspace .ws-cnt{font-size:11px;font-weight:700;color:var(--w-tx3)}
.ch-workspace .ws-gstep{display:flex;align-items:flex-start;gap:12px;padding:10px 2px;color:var(--w-tx3)}
.ch-workspace .ws-gstep .ws-ic{width:18px;height:18px;flex:0 0 auto;margin-top:1px;color:var(--w-tx4)}
.ch-workspace .ws-gstep .ws-st{flex:1;font-size:13px;line-height:1.35}
/* first paint: the app's own staggered rise */
.ch-workspace .ws-rev{animation:ws-rise .6s var(--w-ease) both;animation-delay:var(--d,0ms)}

/* ---------- chat column ---------- */
.ch-workspace .ws-center{position:relative;flex:1 1 auto;min-width:300px;display:flex;flex-direction:column;background:var(--w-bg);overflow:hidden}
.ch-workspace .ws-ctop{flex:0 0 auto;padding:0 24px}
.ch-workspace .ws-ctr2{height:54px;display:flex;align-items:center}
.ch-workspace .ws-peer{width:min(600px,100%);margin:0 auto;padding:0 28px;display:flex;align-items:center;gap:11px;min-width:0}
.ch-workspace .ws-peer-id{display:inline-flex;align-items:center;gap:11px;border-radius:22px}
.ch-workspace .ws-pava{position:relative;width:36px;height:36px;border-radius:99px;overflow:hidden;flex:0 0 auto;border:1px solid var(--w-line)}
.ch-workspace .ws-pname{font-size:14px;font-weight:600;line-height:1.2;color:var(--w-tx)}
.ch-workspace .ws-psub{font-size:11.5px;line-height:1.5;color:var(--w-tx3);margin-top:2px}
.ch-workspace .ws-thread{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding:4px 0 8px;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 18px,#000 calc(100% - 22px),transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 18px,#000 calc(100% - 22px),transparent 100%)}
.ch-workspace .ws-thread::-webkit-scrollbar{display:none}
.ch-workspace .ws-msgs{max-width:600px;margin:0 auto;padding:48px 28px 104px;display:flex;flex-direction:column;gap:36px;pointer-events:none}
.ch-workspace .ws-msgs>.ws-new{animation:ws-rise var(--w-tm) var(--w-ease) both}
/* the stage divider: one mono label in a hairline */
.ch-workspace .ws-stagediv{align-self:stretch;display:flex;align-items:center;gap:14px;margin:6px 0}
.ch-workspace .ws-sd-line{flex:1;height:1px;background:var(--w-line)}
.ch-workspace .ws-sd-txt{font-family:var(--w-mono);font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--w-tx3);white-space:nowrap}
/* text bubbles: a uniform 20px radius on both sides */
.ch-workspace .ws-mgr{align-self:flex-start;max-width:86%;color:var(--w-tx)}
.ch-workspace .ws-mgr.ws-cont{margin-top:-26px}
.ch-workspace .ws-mbubble{width:fit-content;max-width:100%;background:var(--w-soft);border:1px solid var(--w-line2);border-radius:20px;padding:10px 15px;font-size:14px;line-height:1.5;overflow-wrap:break-word}
.ch-workspace .ws-mbubble b{font-weight:600}
.ch-workspace .ws-user{align-self:flex-end;width:fit-content;max-width:82%;background:var(--w-bubble);color:var(--w-tx);padding:10px 15px;border-radius:20px;font-size:14px;line-height:1.5;overflow-wrap:break-word;white-space:pre-wrap}
.ch-workspace .ws-typing{align-self:flex-start;display:flex;align-items:center;gap:6px;padding:8px 2px}
.ch-workspace .ws-msgs>.ws-typing.ws-new{animation:ws-rise var(--w-tq) var(--w-ease) both}
.ch-workspace .ws-typing i{width:7px;height:7px;border-radius:99px;background:var(--w-tx3);animation:ws-tbob 1.2s infinite}
.ch-workspace .ws-typing i:nth-child(2){animation-delay:.16s}
.ch-workspace .ws-typing i:nth-child(3){animation-delay:.32s}
/* the sent-file card: a 112px page band over the name and a mono meta line */
.ch-workspace .ws-subm{align-self:flex-end;max-width:min(300px,100%);color:var(--w-tx)}
.ch-workspace .ws-subm-att{position:relative;display:block;max-width:200px;border:1px solid var(--w-line);border-radius:14px;background:var(--w-card);overflow:hidden}
.ch-workspace .ws-sth{display:block;height:112px;overflow:hidden;position:relative}
.ch-workspace .ws-sth svg{width:100%;height:100%}
.ch-workspace .ws-subm-m{padding:9px 13px 11px;min-width:0}
.ch-workspace .ws-subm-t{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-workspace .ws-subm-s{font-family:var(--w-mono);font-size:9.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--w-tx3);margin-top:2px}
.ch-workspace .ws-subm-cap{text-align:right;font-family:var(--w-mono);font-size:9.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--w-tx3);margin-top:6px}
.ch-workspace .ws-subm.ws-analyzing .ws-subm-att{box-shadow:0 0 0 1.5px rgba(63,185,104,.45)}
.ch-workspace .ws-subm.ws-analyzing .ws-subm-att::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 32%,rgba(63,185,104,.22) 50%,transparent 68%);background-size:220% 100%;animation:ws-submScan 1.5s var(--w-ease) infinite}
/* the review trail: shimmering step lines that fold into an overlapping-chip receipt */
.ch-workspace .ws-synth{align-self:flex-start;max-width:92%;margin:2px 0;padding:0 3px;position:relative}
.ch-workspace .ws-sy-list{display:flex;flex-direction:column}
.ch-workspace .ws-sy-list.ws-collapse{overflow:hidden;transition:height .55s cubic-bezier(.65,0,.35,1) .2s,opacity .55s cubic-bezier(.65,0,.35,1) .2s}
.ch-workspace .ws-sy-line{display:flex;align-items:center;gap:10px;padding:5px 0;opacity:0;min-width:0}
.ch-workspace .ws-sy-line.ws-in{animation:ws-syIn .55s var(--w-ease) forwards}
.ch-workspace .ws-sy-ic,.ch-workspace .ws-sy-chip,.ch-workspace .ws-sy-fly{flex:0 0 auto;width:23px;height:23px;border-radius:99px;background:var(--w-bubble);border:1px solid var(--w-line);display:grid;place-items:center;color:var(--w-tx2);box-shadow:0 0 0 2px var(--w-bg)}
.ch-workspace .ws-sy-ic svg,.ch-workspace .ws-sy-chip svg,.ch-workspace .ws-sy-fly svg{width:12px;height:12px}
.ch-workspace .ws-sy-line.ws-live .ws-sy-ic{animation:ws-syPulse 1.5s var(--w-ease) infinite}
.ch-workspace .ws-sy-t{font-size:13px;line-height:1.4;color:var(--w-tx3);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ch-workspace .ws-sy-line.ws-live .ws-sy-t{background:linear-gradient(100deg,var(--w-tx3) 0%,var(--w-tx3) 40%,var(--w-tx) 50%,var(--w-tx3) 60%,var(--w-tx3) 100%);background-size:230% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:ws-txshine 1.7s cubic-bezier(.4,0,.2,1) infinite}
.ch-workspace .ws-sy-line.ws-done .ws-sy-ic{color:var(--w-tx3)}
.ch-workspace .ws-synth.ws-folding .ws-sy-t{opacity:0;filter:blur(6px);transform:translateX(-6px);transition:opacity .32s ease-in,filter .32s ease-in,transform .32s ease-in}
.ch-workspace .ws-synth.ws-folding .ws-sy-ic{opacity:0}
.ch-workspace .ws-sy-fly{position:absolute;z-index:6;pointer-events:none;margin:0;transition:transform .6s cubic-bezier(.65,0,.35,1) var(--fd,.22s),opacity .2s ease-out .8s}
.ch-workspace .ws-sy-done{display:flex;align-items:center;gap:9px;padding:5px 0;opacity:0;filter:blur(6px);transition:opacity .38s var(--w-ease),filter .38s var(--w-ease)}
.ch-workspace .ws-sy-done .ws-sy-lbl,.ch-workspace .ws-sy-done .ws-sy-chev{opacity:0;transition:opacity .35s var(--w-ease) .3s}
.ch-workspace .ws-synth.ws-folded .ws-sy-done{opacity:1;filter:blur(0)}
.ch-workspace .ws-synth.ws-folded .ws-sy-done .ws-sy-lbl,.ch-workspace .ws-synth.ws-folded .ws-sy-done .ws-sy-chev{opacity:1}
.ch-workspace .ws-sy-chips{display:flex}
.ch-workspace .ws-sy-chip{position:relative}
.ch-workspace .ws-sy-chip+.ws-sy-chip{margin-left:-7px}
.ch-workspace .ws-sy-chip:nth-child(1){z-index:4}
.ch-workspace .ws-sy-chip:nth-child(2){z-index:3}
.ch-workspace .ws-sy-chip:nth-child(3){z-index:2}
.ch-workspace .ws-sy-chip:nth-child(4){z-index:1}
.ch-workspace .ws-sy-lbl{font-size:13px;font-weight:500;color:var(--w-tx2);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-workspace .ws-sy-chev{display:grid;place-items:center;color:var(--w-tx4)}
.ch-workspace .ws-sy-chev svg{width:14px;height:14px}
/* the feedback card: it lands in the thread. A Final Evaluation carries the score band, the manager's
   summary and its findings under a category heading */
.ch-workspace .ws-fbunit{align-self:stretch;margin:10px 0;padding:6px 18px 14px;border:1px solid var(--w-line);border-radius:16px;background:var(--w-card);box-shadow:var(--w-shadow);color:var(--w-tx)}
.ch-workspace .ws-msgs>.ws-fbunit.ws-new.ws-shim{animation:ws-rise var(--w-tm) var(--w-ease) both,ws-cardGlow 1.25s var(--w-ease) .1s}
.ch-workspace .ws-fbc-head{display:flex;align-items:center;gap:8px;padding:12px 0 8px;font-family:var(--w-mono);font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--w-tx2)}
.ch-workspace .ws-sb{--ws-sbc:#e7b90a}
.ch-workspace .ws-sb[data-band="BELOW"]{--ws-sbc:#ff6a4d}
.ch-workspace .ws-sb[data-band="EXCEEDS"]{--ws-sbc:#4ade80}
.ch-workspace .ws-sb[data-band="EXCEPTIONAL"]{--ws-sbc:#3fb968}
.ch-workspace .ws-sb-label{width:fit-content;font-size:13px;font-weight:700;letter-spacing:-.01em;line-height:1.2;color:var(--w-tx);margin:0 0 8px}
.ch-workspace .ws-sb-track{display:flex;gap:5px}
.ch-workspace .ws-sb-track i{flex:1;height:3px;border-radius:99px;background:rgba(255,255,255,.14);display:block}
.ch-workspace .ws-sb-track i.ws-on{background:var(--ws-sbc)}
.ch-workspace .ws-sb-grades{display:flex;gap:5px;margin-top:6px}
.ch-workspace .ws-sb-grades span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9px;font-weight:600;letter-spacing:.02em;line-height:1.2;color:var(--w-tx3)}
.ch-workspace .ws-sb-grades span.ws-on{color:var(--ws-sbc);font-weight:700}
.ch-workspace .ws-fec-summary{font-size:13.5px;line-height:1.55;letter-spacing:-.006em;color:var(--w-tx2);margin:12px 0 2px;overflow-wrap:break-word}
.ch-workspace .ws-fec-head{display:flex;align-items:baseline;gap:8px;padding:10px 0 2px;font-family:var(--w-mono);font-size:9.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--w-tx2)}
.ch-workspace .ws-fec-head span+span{font-weight:600;letter-spacing:.9px;color:var(--w-tx3)}
.ch-workspace .ws-fb2-row{display:flex;gap:13px;padding:15px 11px;margin:0 -9px;border-radius:14px;position:relative}
.ch-workspace .ws-fb2-rb{flex:1;min-width:0}
.ch-workspace .ws-fb2-rt{font-size:14.5px;font-weight:600;color:var(--w-tx);line-height:1.28;margin-bottom:6px;letter-spacing:-.01em}
.ch-workspace .ws-fb2-foot{display:flex;align-items:center;gap:9px;margin-top:11px;min-height:24px}
.ch-workspace .ws-prio{display:inline-block;font-family:var(--w-mono);font-size:8.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;padding:3px 8px;border-radius:6px}
.ch-workspace .ws-prio[data-p="high"]{color:#ff6a4d;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px #ff6a4d}
.ch-workspace .ws-prio[data-p="medium"]{color:#e7b90a;background:rgba(255,255,255,.06)}
.ch-workspace .ws-prio[data-p="low"]{color:#6d6a63;background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.075)}
/* "Tell me more" is there, as in the app, and shows on a hover of its row. The thread takes no pointer here */
.ch-workspace .ws-ask{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--w-tx2);background:var(--w-card);border:1px solid var(--w-line);padding:4px 11px 4px 9px;border-radius:99px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.18);opacity:0;transform:translateX(-5px)}
.ch-workspace .ws-ask svg{width:13px;height:13px}
.ch-workspace .ws-fb2-more{margin-left:auto;color:var(--w-tx4);flex:0 0 auto;display:grid;place-items:center}
.ch-workspace .ws-fb2-more svg{width:16px;height:16px}

/* ---------- composer ---------- */
.ch-workspace .ws-composer{flex:0 0 auto;padding:16px 24px 24px;position:relative}
.ch-workspace .ws-composer-in{max-width:600px;margin:0 auto;display:flex;align-items:flex-end;gap:11px;position:relative}
.ch-workspace .ws-pill{flex:1;min-width:0;min-height:91px;display:flex;flex-direction:column;position:relative;background:var(--w-soft);border:1px solid var(--w-line);border-radius:24px}
.ch-workspace .ws-att-row{display:none;flex-wrap:nowrap;gap:9px;padding:10px 10px 2px}
.ch-workspace .ws-pill.ws-has-att .ws-att-row{display:flex}
.ch-workspace .ws-att-big{position:relative;flex:0 0 auto;width:152px;border:1px solid var(--w-line);border-radius:12px;overflow:hidden;background:var(--w-card);animation:ws-rise var(--w-tm) var(--w-ease) both}
.ch-workspace .ws-atb-th{display:block;height:96px;overflow:hidden;position:relative}
.ch-workspace .ws-atb-th svg{width:100%;height:100%}
.ch-workspace .ws-atb-m{padding:7px 10px 8px}
.ch-workspace .ws-atb-n{display:block;font-size:11.5px;font-weight:600;color:var(--w-tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-workspace .ws-atb-s{display:block;font-family:var(--w-mono);font-size:8.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--w-tx3);margin-top:2px}
.ch-workspace .ws-ax{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:99px;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;z-index:2}
.ch-workspace .ws-ax svg{width:11px;height:11px}
.ch-workspace .ws-ta{width:100%;min-height:24px;color:var(--w-tx);font-size:15px;line-height:1.5;padding:13px 18px 4px;white-space:pre-wrap;word-break:break-word;pointer-events:none}
.ch-workspace .ws-ta:empty::before{content:attr(data-ph);color:var(--w-tx3)}
.ch-workspace .ws-pill-ctrl{display:flex;align-items:center;gap:4px;padding:4px 8px 8px;margin-top:auto}
.ch-workspace .ws-ctrl-spacer{flex:1}
.ch-workspace .ws-plus,.ch-workspace .ws-cam,.ch-workspace .ws-mic,.ch-workspace .ws-send{width:38px;height:38px;border-radius:99px;display:grid;place-items:center;flex:0 0 auto;color:var(--w-tx2);pointer-events:none;
  transition:background var(--w-tq) var(--w-ease),transform var(--w-tq) var(--w-ease),color var(--w-tq) var(--w-ease),opacity var(--w-tq) var(--w-ease)}
.ch-workspace .ws-plus svg,.ch-workspace .ws-cam svg,.ch-workspace .ws-mic svg,.ch-workspace .ws-send svg{width:20px;height:20px}
/* send: the app's white disc. It stands in for the mic the moment there is something to send */
.ch-workspace .ws-pill-ctrl .ws-send{background:#fff;color:#111;display:none;box-shadow:0 2px 10px rgba(0,0,0,.16)}
.ch-workspace .ws-pill.ws-active-send .ws-mic{display:none}
.ch-workspace .ws-pill.ws-active-send .ws-send{display:grid}
.ch-workspace .ws-pill.ws-has-att .ws-send{pointer-events:auto;cursor:pointer}
.ch-workspace .ws-pill.ws-has-att .ws-send:hover{transform:scale(1.06)}
/* the Do / Learn toggle. With easy_hard_mode on (the default) it is a pill, not a slider */
.ch-workspace .ws-stuck{display:inline-flex;align-items:center;height:32px;padding:0 16px;border-radius:99px;font-size:12.5px;font-weight:600;letter-spacing:-.005em;color:var(--w-tx);background:var(--w-bubble);box-shadow:inset 0 0 0 1px var(--w-line);white-space:nowrap;pointer-events:none}
.ch-workspace .ws-stuck.ws-on{color:var(--w-onacc);background:var(--w-acc);box-shadow:none}
/* the manager is working: the tools read as unavailable and the toggle stands down */
.ch-workspace .ws-composer.ws-busy .ws-plus,.ch-workspace .ws-composer.ws-busy .ws-cam,.ch-workspace .ws-composer.ws-busy .ws-mic,.ch-workspace .ws-composer.ws-busy .ws-send{opacity:.35;filter:grayscale(1)}
.ch-workspace .ws-composer.ws-busy .ws-stuck{display:none}
.ch-workspace .ws-composer.ws-busy .ws-ta:empty::before{content:""}
/* Learn mode's quick replies, above its composer */
.ch-workspace .ws-replies{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;min-height:38px;margin:0 auto 10px;max-width:600px}
.ch-workspace .ws-reply{display:inline-flex;align-items:center;font-size:13.5px;font-weight:500;line-height:1.5;letter-spacing:-.011em;color:#1a1917;background:#fff;border:1px solid rgba(26,25,23,.11);padding:10px 17px;border-radius:99px;box-shadow:0 1px 2px rgba(26,25,23,.04)}

/* ---------- Learn mode: the light copy of the frame, revealed from the bottom centre ---------- */
/* the shadow carries the light page colour down past the window's own height, as the app's page background does */
.ch-workspace .ws-app.ws-learn{z-index:3;pointer-events:none;box-shadow:0 68px 0 var(--w-bg);clip-path:circle(0% at 50% 100%);transition:clip-path .85s cubic-bezier(.62,0,.2,1)}
.ch-workspace.ws-guided .ws-app.ws-learn{clip-path:circle(150% at 50% 100%)}

/* ---------- the coach panel: an opaque inset card beside the work. No scrim, no blur ---------- */
.ch-workspace .ws-cpanel{position:absolute;z-index:30;top:106px;right:12px;bottom:12px;width:364px;display:flex;flex-direction:column;background:#1E1E1E;border:1px solid rgba(255,255,255,.075);border-radius:18px;box-shadow:0 1px 3px rgba(0,0,0,.4);
  opacity:0;visibility:hidden;transform:translateX(24px);transition:opacity .34s cubic-bezier(.2,.9,.3,1),transform .46s cubic-bezier(.2,.9,.3,1),visibility 0s .46s}
.ch-workspace.ws-coach-open .ws-cpanel{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.ch-workspace .ws-chead{flex:0 0 auto;display:flex;align-items:center;gap:8px;height:54px;padding:0 12px 0 22px}
.ch-workspace .ws-chead>span{flex:1;min-width:0;font-family:var(--f-mono);font-size:12px;line-height:1.5;letter-spacing:1.4px;text-transform:uppercase;color:#a5a29b}
.ch-workspace .ws-chead>span i{display:inline-block;vertical-align:middle;width:7px;height:7px;margin-left:7px;border-radius:50%;background:#FF6A4D;box-shadow:0 0 0 3px rgba(255,106,77,.26);opacity:0;transition:opacity .25s}
.ch-workspace.ws-pushed .ws-chead>span i{opacity:1}
.ch-workspace .ws-cclose{flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#a5a29b}
.ch-workspace .ws-cclose svg{width:16px;height:16px}
.ch-workspace .ws-ctabs{flex:0 0 auto;display:flex;align-items:center;gap:2px;padding:0 12px 8px}
.ch-workspace .ws-ctab{position:relative;padding:6px 8px;font-family:var(--f-mono);font-size:10px;font-weight:400;line-height:13px;letter-spacing:1.2px;text-transform:uppercase;color:#9a958c}
.ch-workspace .ws-ctab.ws-on{color:#f2f1ee}
.ch-workspace .ws-ctab.ws-on::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:1px;border-radius:999px;background:#f2f1ee}
.ch-workspace .ws-cbody{flex:1;min-height:0;overflow:hidden;padding:0 12px 30px;-webkit-mask-image:linear-gradient(to bottom,#000 0,#000 calc(100% - 26px),transparent);mask-image:linear-gradient(to bottom,#000 0,#000 calc(100% - 26px),transparent)}
.ch-workspace .ws-cin{display:flex;flex-direction:column;padding:0 8px}
/* the insight: what she has to say, in full ink. Nothing at all when she has nothing */
.ch-workspace .ws-insight{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--w-ease)}
.ch-workspace .ws-insight>div{overflow:hidden;min-height:0}
.ch-workspace .ws-insight p{margin:2px 2px 0;font-size:15px;line-height:24px;color:#f2f1ee;opacity:0;transform:translateY(8px);filter:blur(5px);transition:opacity .45s var(--w-ease),transform .55s var(--w-ease),filter .45s var(--w-ease)}
.ch-workspace .ws-insight p+p{margin-top:12px}
.ch-workspace .ws-insight p:last-child{padding-bottom:18px}
.ch-workspace.ws-pushed .ws-insight{grid-template-rows:1fr}
.ch-workspace .ws-insight p.ws-on{opacity:1;transform:none;filter:none}
.ch-workspace .ws-mrows{list-style:none;display:flex;flex-direction:column;margin-top:2px;border-top:1px solid transparent;transition:border-color .4s var(--w-ease),padding-top .5s var(--w-ease)}
.ch-workspace.ws-pushed .ws-mrows{margin-top:0;padding-top:12px;border-top-color:rgba(255,255,255,.075)}
.ch-workspace .ws-mrow{position:relative;display:flex;align-items:flex-start;gap:11px;margin:0 -9px;padding:10px;border-radius:14px}
.ch-workspace .ws-mrow+.ws-mrow::before{content:"";position:absolute;left:11px;right:11px;top:0;height:1px;background:rgba(255,255,255,.04)}
.ch-workspace .ws-mdisc{position:relative;flex:0 0 auto;display:grid;place-items:center;width:34px;height:34px;margin-top:2px;border-radius:50%;background:#343434;box-shadow:inset 0 0 8.5px rgba(255,255,255,.45);color:#f2f1ee}
.ch-workspace .ws-mdisc .ws-gl{width:16px;height:16px}
.ch-workspace .ws-mdisc .ws-ring{inset:-3px;width:40px;height:40px}
.ch-workspace .ws-mdisc .ws-ring circle{stroke-width:2.1}
.ch-workspace .ws-mtext{flex:1;min-width:0}
.ch-workspace .ws-mhead{display:flex;align-items:center;gap:8px;padding-top:4px}

/* ---------- motion ---------- */

/* entered half way: the frame is simply there */
.ch-workspace.ws-noent .ws-rev,.ch-workspace.ws-noent .ws-back{animation:none}
@keyframes ws-rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes ws-slidelr{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
@keyframes ws-hudin{from{opacity:0}to{opacity:1}}
@keyframes ws-tbob{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
@keyframes ws-submScan{0%{background-position:170% 0}100%{background-position:-170% 0}}
@keyframes ws-txshine{0%{background-position:130% 0}100%{background-position:-30% 0}}
@keyframes ws-syIn{0%{opacity:0;filter:blur(6px);transform:translateY(4px)}100%{opacity:1;filter:blur(0);transform:none}}
@keyframes ws-syPulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.1);opacity:1}}
@keyframes ws-cardGlow{0%{box-shadow:0 0 0 0 rgba(74,222,128,0)}34%{box-shadow:0 0 36px -4px rgba(74,222,128,.5)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
@keyframes ws-swap{from{opacity:0;filter:blur(5px);transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){
  .ch-workspace .ws-rev,.ch-workspace .ws-back,.ch-workspace .ws-msgs>.ws-new,.ch-workspace .ws-att-big{animation:none}

  .ch-workspace .ws-app.ws-learn,.ch-workspace .ws-cpanel{transition-duration:.01s}
  .ch-workspace .ws-subm.ws-analyzing .ws-subm-att::after{animation:none;background:rgba(63,185,104,.10)}
}

/* ch/07-present.css */
/* 7 · presentation. The app's presentation room, value for value from origin/dev:
   StageWorkspacePresentation/styles/presentationRoom.css, presentationPresenting.css, presentationMeetPanel.css,
   presentationQa.css, roomCaptionsToggle.css and PresentationMode/styles/presentationLiveRoom.css,
   presentationPresentingLive.css, presentingRoomFloor.css.
   The room is a 1600 x 786 window. Where the app writes vw, vh or a clamp, the number here is that rule
   resolved for this window and the rule is quoted beside it. The room's own states snap, as they do in the app. */
.ch-present{background:#202124;color:#f2f1ee;font:400 14px/1.55 var(--f-sans);letter-spacing:-.01em}
.ch-present *,.ch-present *::before,.ch-present *::after{box-sizing:border-box}

/* paneled and presenting: the room drops to the app's own grey (.zwp-rm background: var(--bg)) */
.ch-present.pr-s-share,.ch-present.pr-s-share .pr-room{background:#1e1e1e}
.ch-present svg{display:block}

/* which pieces each state shows */
.ch-present .pr-v{position:absolute;inset:0;display:none}
.ch-present.pr-s-greet .pr-v-greet,.ch-present.pr-s-share .pr-v-share,.ch-present.pr-s-qa .pr-v-qa{display:block}
.ch-present:not(.pr-s-greet) .pr-if-greet,.ch-present:not(.pr-s-share) .pr-if-share,.ch-present:not(.pr-s-qa) .pr-if-qa,
.ch-present.pr-s-greet .pr-if-run,.ch-present.pr-s-share .pr-if-door{display:none}

/* ---------- the top strip (.zwp-gm-topbar) ---------- */

.ch-present .pr-stitle{font-size:13px;color:rgba(255,255,255,.55);white-space:nowrap}
/* the contract clock: mono numerals, the timer icon, always */

/* ---------- the stage and the tiles (.zwp-rm-stage, .zwp-mgrid.zwp-is-big, .zwp-mtile) ---------- */
.ch-present .pr-stage{position:absolute;display:grid;place-items:center;align-content:center}

.ch-present .pr-tile.pr-speaking .pr-pulse{opacity:1;animation:pr-present-pulse 1.9s var(--zt-ease) infinite}
@keyframes pr-present-pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.42)}70%{box-shadow:0 0 0 22px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(63,185,104,0)}}

/* the Q&A (.zwp-present-room .zwp-is-qaroom). Head pad clamp(48px, 9vh, 96px) = 70.74.

/* ---------- the line above the pill (.zwp-lr-note) ---------- */
.ch-present .pr-note{position:absolute;left:50%;bottom:140px;transform:translateX(-50%);z-index:6;display:flex;flex-direction:column;align-items:center;gap:4px;

   base max(cap bottom + cap min + 8px, clamp(150px, 29.5vh, 236px)) = 235.08.

.ch-present .pr-v-share .pr-stage{left:20px;right:284px;top:62px;bottom:18px;padding:29.48px 34px 235.08px}
.ch-present .pr-desk{position:relative;width:784.79px;aspect-ratio:16 / 9;border-radius:14px;overflow:hidden;background:#0b0b0c;box-shadow:0 30px 80px rgba(0,0,0,.55)}

.ch-present .pr-ch-bar{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;background:#dee1e6;flex:0 0 auto}
.ch-present .pr-ch-bar i{width:12px;height:12px;border-radius:99px;flex:0 0 auto}
.ch-present .pr-tl-r{background:#ff5f57}
.ch-present .pr-tl-y{background:#febc2e}
.ch-present .pr-tl-g{background:#28c840}

.ch-present .pr-ct-addr{flex:1;background:#fff;border-radius:99px;padding:7px 15px;font-size:11.5px;color:#5f6368;font-family:var(--f-mono);letter-spacing:.2px}

/* the slide (.zwp-chrome-body .zwp-deck) */

/* ---------- presenting: the bottom cluster (.zwp-rm-dock, .zwp-gmc, .zwp-gm-done). Pills on the canvas, no box. ---------- */
.ch-present .pr-dock{position:absolute;left:668px;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;z-index:60}

   Top clamp(76px, 12vh, 96px) = 94.32, bottom clamp(76px, 13vh, 104px) = 102.18, right 16.
   The app's column is clamp(232px, 25vw, 300px). Here it is 264, so two seats and yours stand whole in this window. */
.ch-present .pr-meet{position:absolute;right:16px;top:94.32px;bottom:102.18px;width:264px;display:flex;flex-direction:column;justify-content:center;gap:14px;background:#1e1e1e;overflow:hidden;z-index:20}

.ch-present .pr-capband{position:absolute;left:0;right:0;bottom:92px;height:159.52px;padding:0 282px;display:flex;flex-direction:row;justify-content:center;align-items:center;gap:14px;text-align:left;

.ch-present .pr-rctxt{display:block;min-height:1.32em;max-height:3.96em;overflow:hidden;font-size:24px;line-height:1.32;font-weight:400;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}

.ch-present .pr-cw{display:inline-block;margin-right:.28em;animation:pr-present-word .32s var(--zt-ease)}
@keyframes pr-present-word{from{filter:blur(5px);opacity:.5}}

.ch-present .pr-seat{position:absolute;border-radius:50%;pointer-events:none}

@media (prefers-reduced-motion:reduce){
  .ch-present .pr-desk,.ch-present .pr-cw,.ch-present .pr-tile.pr-speaking .pr-pulse{animation:none!important}
