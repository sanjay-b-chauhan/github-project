.sc-pick .pk-card.is-picked{transform:translateY(-10px) scale(1.02)}

/* ================================================================
   System 1 · kickoff. The manager on a large tile, the brief as three numbers, the learner's notes on the right.
   ================================================================ */
.sc-kickoff .ko-video{position:absolute;left:132px;top:96px;width:600px;height:500px;border-radius:24px;overflow:hidden;background:#E8E4DF}
.sc-kickoff .ko-mate{position:absolute;left:744px;width:260px;height:244px;border-radius:24px;overflow:hidden;background:#E8E4DF}
.sc-kickoff .ko-mate:nth-of-type(2){top:96px}.sc-kickoff .ko-mate:nth-of-type(3){top:352px}
.sc-kickoff .ko-mn{position:absolute;left:18px;bottom:16px;display:flex;flex-direction:column;gap:4px}
.sc-kickoff .ko-mn b{font:500 12px/1 var(--sans);color:var(--tx)}
.sc-kickoff .ko-mn span{font:400 12px/1 var(--sans);color:var(--tx-3)}
.sc-kickoff .ko-video img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.sc-kickoff .ko-video::after{content:'';position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(0deg,rgba(0,0,0,.5),rgba(0,0,0,0));pointer-events:none}
.sc-kickoff .ko-who{position:absolute;left:20px;bottom:18px;z-index:1;display:flex;flex-direction:column;gap:5px;color:#fff}
.sc-kickoff .ko-who b{font:500 14px/1 var(--sans);letter-spacing:-.012em}
.sc-kickoff .ko-who span{font:400 12px/1 var(--sans);color:rgba(255,255,255,.76)}
/* who is speaking: three small bars, moving only while the manager talks */
.sc-kickoff .ko-live{position:absolute;left:18px;top:18px;z-index:1;display:flex;align-items:center;justify-content:center;gap:3px;width:40px;height:28px;border-radius:99px;background:rgba(16,16,16,.5)}
.sc-kickoff .ko-live i{width:3px;height:6px;border-radius:2px;background:#fff}
.sc-kickoff .ko-video.is-talking .ko-live i{animation:ko-talk .8s var(--ease) infinite}
.sc-kickoff .ko-video.is-talking .ko-live i:nth-child(2){animation-delay:.18s}.sc-kickoff .ko-video.is-talking .ko-live i:nth-child(3){animation-delay:.36s}
@keyframes ko-talk{0%,100%{height:5px}50%{height:13px}}
.sc-kickoff .ko-band{position:absolute;left:132px;top:616px;width:872px;height:172px;display:flex;align-items:center;gap:18px;padding:0 40px 0 28px;border-radius:24px;background:#fff;box-shadow:0 0 0 1px var(--line),var(--sh1)}
.sc-kickoff .ko-h{max-width:300px;font:400 28px/1.12 var(--serif);letter-spacing:-.024em;color:var(--tx);text-wrap:balance}
.sc-kickoff .ko-nums{display:flex;gap:40px;margin-left:auto}
.sc-kickoff .ko-num{display:flex;flex-direction:column;gap:12px;opacity:0;transform:translateY(10px);filter:blur(6px);transition:opacity .5s var(--ease),transform .7s var(--spring),filter .5s var(--ease)}
.sc-kickoff .ko-num.is-in{opacity:1;transform:none;filter:none}
.sc-kickoff .ko-num b{font:400 52px/.84 var(--serif);letter-spacing:-.03em;color:var(--tx);font-variant-numeric:lining-nums}
.sc-kickoff .ko-num span{font:400 12px/1 var(--sans);color:var(--tx-3);white-space:nowrap}
.sc-kickoff .ko-num.is-goal b{color:var(--ok-deep)}
.sc-kickoff .ko-notes{position:absolute;left:1028px;top:96px;width:440px;height:692px;display:flex;flex-direction:column;overflow:hidden;border-radius:24px;background:#fff;box-shadow:0 0 0 1px var(--line),var(--sh1)}
.sc-kickoff .ko-nh{flex:none;display:flex;align-items:center;gap:10px;height:52px;padding:0 22px;background:#F6F5F3}
.sc-kickoff .ko-nh svg{width:18px;height:18px;color:var(--tx-3)}
.sc-kickoff .ko-nh b{padding-bottom:1px;font:500 14px/1 var(--sans);color:var(--tx)}
.sc-kickoff .ko-nb{flex:1;min-height:0;display:flex;flex-direction:column;padding:22px 22px 0}
.sc-kickoff .ko-saved{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--spring)}
.sc-kickoff .ko-saved>*{min-height:0;overflow:hidden}
.sc-kickoff .ko-saved.is-in{grid-template-rows:1fr}
.sc-kickoff .ko-si{display:flex;align-items:flex-start;gap:11px;padding-bottom:16px;opacity:0;transform:translateY(6px);transition:opacity .4s var(--ease) .1s,transform .6s var(--spring) .1s}
.sc-kickoff .ko-saved.is-in .ko-si{opacity:1;transform:none}
.sc-kickoff .ko-ok{flex:none;width:20px;height:20px;margin-top:1px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:#fff}
.sc-kickoff .ko-ok svg{width:11px;height:11px}
.sc-kickoff .ko-si p{font:400 14px/1.45 var(--sans);color:var(--tx)}
.sc-kickoff .ko-si div span{display:block;margin-top:3px;font:400 12px/1.4 var(--sans);color:var(--ok-deep)}
.sc-kickoff .ko-field{min-height:64px;padding:12px 16px;border-radius:16px;background:#F5F4F2;box-shadow:inset 0 0 0 1px var(--line);font:400 14px/20px var(--sans);color:var(--tx)}
.sc-kickoff .ko-ph{color:var(--tx-4)}
.sc-kickoff .ko-field.is-typing .ko-ph{display:none}
.sc-kickoff .ko-caret{display:none;width:1.5px;height:16px;margin-left:1px;vertical-align:-3px;background:var(--ok);animation:ko-blink 1s steps(2) infinite}
.sc-kickoff .ko-field.is-typing .ko-caret{display:inline-block}
@keyframes ko-blink{50%{opacity:0}}
.sc-kickoff .ko-go{flex:none;padding:16px 22px 22px;opacity:0;transform:translateY(8px);transition:opacity .45s var(--ease),transform .6s var(--spring)}
.sc-kickoff .ko-go.is-in{opacity:1;transform:none}
.sc-kickoff .ko-go .sp-key{width:100%}

/* ================================================================
   System 1 · pop. Say it back: the manager's question, the answer by voice, the transcript, one line back.
   ================================================================ */
.sc-pop .po-col{position:absolute;left:460px;top:0;width:680px;height:840px;padding-bottom:16px;display:flex;flex-direction:column;justify-content:center}
.sc-pop .po-mgr{display:flex;align-items:center;gap:12px}
.sc-pop .po-mgr b{display:block;font:500 14px/18px var(--sans);color:var(--tx)}
.sc-pop .po-mgr span span{display:block;font:400 12px/16px var(--sans);color:var(--tx-3)}
.sc-pop .po-q{margin-top:18px;font-size:34px;line-height:1.14}
.sc-pop .po-rec{margin-top:28px;padding:16px 22px 20px 16px;border-radius:24px;background:#fff;box-shadow:0 0 0 1px var(--line),var(--sh1)}
.sc-pop .po-bar{display:flex;align-items:center;gap:16px}
.sc-pop .po-mic{position:relative;flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--field);color:var(--tx-2);transition:background .3s var(--ease),color .3s var(--ease)}
.sc-pop .po-mic svg{position:absolute;width:18px;height:18px;transition:opacity .25s var(--ease),transform .4s var(--spring)}
.sc-pop .po-mic svg+svg{width:16px;height:16px;opacity:0;transform:scale(.5)}
.sc-pop .po-rec.is-live .po-mic{background:#141312;color:#fff}
.sc-pop .po-rec.is-live .po-mic::after{content:'';position:absolute;inset:-5px;border-radius:50%;box-shadow:0 0 0 2px rgba(20,19,18,.22);animation:po-ring 1.4s var(--out) infinite}
@keyframes po-ring{from{transform:scale(.92);opacity:1}to{transform:scale(1.25);opacity:0}}
.sc-pop .po-rec.is-done .po-mic{background:var(--ok);color:#fff}
.sc-pop .po-rec.is-done .po-mic svg:first-child{opacity:0;transform:scale(.5)}
.sc-pop .po-rec.is-done .po-mic svg+svg{opacity:1;transform:none}
.sc-pop .po-wave{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;height:34px}
.sc-pop .po-wave i{width:3px;border-radius:2px;background:var(--tx-4);transition:height .11s linear,background .3s var(--ease)}
.sc-pop .po-rec.is-live .po-wave i{background:var(--tx-2)}
.sc-pop .po-rec.is-done .po-wave i{background:#CFCAC2}
.sc-pop .po-time{flex:none;min-width:30px;text-align:right;font:500 12px/1 var(--sans);color:var(--tx-3);font-variant-numeric:tabular-nums}
.sc-pop .po-said{margin-top:14px;padding-left:60px;font:400 14px/1.6 var(--sans);color:var(--tx);opacity:0;transform:translateY(6px);transition:opacity .45s var(--ease) .15s,transform .6s var(--spring) .15s}
.sc-pop .po-rec.is-done .po-said{opacity:1;transform:none}
.sc-pop .po-said mark{padding:1px 3px 2px;margin:0 -1px;border-radius:5px;background:#E9F6EE;color:var(--ok-deep);font-weight:500;white-space:nowrap}
.sc-pop .po-reply{display:flex;align-items:center;gap:10px;margin-top:22px;opacity:0;transform:translateY(8px);transition:opacity .45s var(--ease),transform .6s var(--spring)}
.sc-pop .po-reply.is-in{opacity:1;transform:none}
.sc-pop .po-bub{padding:10px 16px 11px;border-radius:20px;background:#fff;box-shadow:0 0 0 1px var(--line-2);font:400 14px/1.4 var(--sans);color:var(--tx)}
.sc-pop .po-go{align-self:flex-end;margin-top:28px;opacity:0;transform:translateY(8px);transition:opacity .45s var(--ease),transform .6s var(--spring)}
.sc-pop .po-go.is-in{opacity:1;transform:none}

/* ================================================================
   System 1 · present. The slide, the team on the call, the question, and the answer as a caption.
   ================================================================ */
.sc-present .pr-slide{position:absolute;left:132px;top:96px;width:968px;height:544px;display:flex;flex-direction:column;padding:26px 40px 30px;border-radius:20px;background:#fff;box-shadow:0 0 0 1px var(--line),var(--sh2)}
.sc-present .pr-deck{display:flex;align-items:center;gap:8px;font:400 12px/1 var(--sans);color:var(--tx-3)}
.sc-present .pr-pg{margin-left:auto;font-variant-numeric:tabular-nums}
.sc-present .pr-main{flex:1;display:flex;align-items:center;gap:44px}
.sc-present .pr-l{flex:0 0 360px}
.sc-present .pr-h{font:400 34px/1.1 var(--serif);letter-spacing:-.026em;color:var(--tx);text-wrap:balance}
.sc-present .pr-l ol{display:flex;flex-direction:column;gap:12px;margin-top:26px;list-style:none;counter-reset:pr}
.sc-present .pr-l li{display:flex;align-items:center;gap:11px;font:400 14px/1.4 var(--sans);color:var(--tx-2);counter-increment:pr}
.sc-present .pr-l li::before{content:counter(pr);flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--field);font:500 12px/1 var(--sans);color:var(--tx)}
.sc-present .pr-flow{flex:1;display:flex;align-items:center;justify-content:center;gap:8px}
.sc-present .pr-flow>b{display:grid;color:var(--tx-4)}
.sc-present .pr-flow>b svg{width:14px;height:14px}
.sc-present .pr-ph{flex:none;display:flex;flex-direction:column;gap:7px;width:84px;height:168px;padding:16px 10px 12px;border-radius:14px;background:#F6F5F3;box-shadow:inset 0 0 0 1.5px #E3DFD8}
.sc-present .pr-ph i{height:6px;border-radius:3px;background:#E3DFD8}
.sc-present .pr-ph i:first-child{width:62%;height:8px;background:#D3CEC6}
.sc-present .pr-ph i:nth-child(2){width:92%}
.sc-present .pr-ph i:nth-child(3){width:74%}
.sc-present .pr-ph i:last-child:not(:first-child){margin-top:auto;width:100%;height:20px;border-radius:7px}
.sc-present .pr-ph.is-on{background:#fff;box-shadow:inset 0 0 0 1.5px #141312}
.sc-present .pr-ph em{margin-top:auto;height:20px;border-radius:7px;background:#141312;color:#fff;font:500 9px/20px var(--sans);font-style:normal;text-align:center}
.sc-present .pr-team{position:absolute;left:1124px;top:96px;width:344px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sc-present .pr-tile{position:relative;height:200px;overflow:hidden;border-radius:18px;background:#E8E4DF;transition:box-shadow .3s var(--ease)}
.sc-present .pr-tile img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%}
.sc-present .pr-tile:first-child::after{content:'';position:absolute;left:0;right:0;bottom:0;height:50%;background:linear-gradient(0deg,rgba(0,0,0,.5),rgba(0,0,0,0))}
.sc-present .pr-tile.is-talking{box-shadow:inset 0 0 0 2px #141312}
.sc-present .pr-tile:first-child.is-talking{box-shadow:inset 0 0 0 2px #fff}
.sc-present .pr-nm{position:absolute;left:14px;bottom:13px;z-index:1;display:flex;flex-direction:column;gap:4px}
.sc-present .pr-nm b{font:500 12px/1 var(--sans);color:var(--tx)}
.sc-present .pr-nm span{font:400 12px/1 var(--sans);color:var(--tx-3)}
.sc-present .pr-tile:first-child .pr-nm b{color:#fff}
.sc-present .pr-tile:first-child .pr-nm span{color:rgba(255,255,255,.76)}
.sc-present .pr-caps{position:absolute;left:132px;top:660px;width:968px;display:flex;flex-direction:column;gap:10px}
.sc-present .pr-cap{display:flex;align-items:center;gap:10px;height:46px;padding:0 18px 1px 9px;border-radius:16px;background:#fff;box-shadow:0 0 0 1px var(--line),var(--sh1);
  opacity:0;transform:translateY(8px);transition:opacity .45s var(--ease),transform .6s var(--spring)}
.sc-present .pr-cap.is-in{opacity:1;transform:none}
.sc-present .pr-cap b{flex:none;font:500 14px/1 var(--sans);color:var(--tx)}
.sc-present .pr-cap>span:last-child{min-width:0;font:400 14px/1.3 var(--sans);color:var(--tx-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-present .pr-go{position:absolute;left:1124px;top:658px;width:344px;opacity:0;transform:translateY(8px);transition:opacity .45s var(--ease),transform .6s var(--spring)}
.sc-present .pr-go.is-in{opacity:1;transform:none}
.sc-present .pr-go .sp-key{width:100%}

/* ================================================================
   4 · applyask. Zero asks before it applies.
   ================================================================ */
.sc-applyask .aa-col{position:absolute;left:420px;top:84px;width:760px;height:728px;display:flex;flex-direction:column;justify-content:center}
.sc-applyask .aa-title{font-size:34px;line-height:1.14}
.sc-applyask .aa-title.is-swap{animation:aa-swap .6s var(--spring)}
@keyframes aa-swap{from{opacity:0;transform:translateY(8px)}}
.sc-applyask .aa-roles{margin-top:26px;padding:8px;border-radius:24px;background:#fff;box-shadow:0 0 0 1px var(--line),var(--sh1)}
.sc-applyask .aa-list{display:flex;flex-direction:column;gap:4px;border-radius:16px}
/* more roles than fit: the list scrolls inside its card and fades where there is more */
.sc-applyask .aa-roles.is-long .aa-list{max-height:364px;overflow-y:auto;overscroll-behavior:contain;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 28px,#000 calc(100% - 44px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 28px,#000 calc(100% - 44px),transparent 100%)}
.sc-applyask .aa-roles.is-long .aa-list.at-top{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 44px),transparent 100%);mask-image:linear-gradient(to bottom,#000 calc(100% - 44px),transparent 100%)}
.sc-applyask .aa-roles.is-long .aa-list.at-end{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 28px);mask-image:linear-gradient(to bottom,transparent 0,#000 28px)}
.sc-applyask .aa-roles.is-long .aa-list.at-top.at-end{-webkit-mask-image:none;mask-image:none}
.sc-applyask .aa-row{flex:none;display:grid;grid-template-columns:20px 44px minmax(0,1fr) auto;column-gap:14px;row-gap:10px;align-items:center;width:100%;padding:14px 16px 15px;border-radius:16px;text-align:left;transition:background .2s var(--ease),opacity .4s var(--ease)}
.sc-applyask .aa-row:hover{background:var(--wash)}
.sc-applyask .aa-row:active .aa-box{transform:scale(.9)}
.sc-applyask .aa-row.is-on{background:var(--field)}
.sc-applyask .aa-row.is-on:hover{background:var(--sunk)}
.sc-applyask .aa-row.is-sent,.sc-applyask .aa-row.is-off,.sc-applyask .aa-row.is-locked,.sc-applyask .aa-col.is-busy .aa-row{cursor:default}
.sc-applyask .aa-row.is-sent:hover,.sc-applyask .aa-row.is-off:hover,.sc-applyask .aa-row.is-locked:hover{background:transparent}
.sc-applyask .aa-row.is-locked{grid-template-columns:22px 44px minmax(0,1fr) auto;column-gap:13px}
.sc-applyask .aa-row.is-locked .sp-lg{filter:grayscale(1);opacity:.6}
.sc-applyask .aa-row.is-locked .aa-tx b{color:var(--tx-2)}
.sc-applyask .aa-col.is-busy .aa-row.is-on:hover{background:var(--field)}
.sc-applyask .aa-row.is-off{opacity:.5}
.sc-applyask .aa-box{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:transparent;box-shadow:inset 0 0 0 1.5px var(--tx-4);transition:background .18s var(--ease),box-shadow .18s var(--ease),color .18s var(--ease),border-radius .3s var(--ease),transform .18s var(--out)}
.sc-applyask .aa-box svg{width:12px;height:12px}
.sc-applyask .aa-row.is-on .aa-box{background:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);color:#fff}
.sc-applyask .aa-row.is-sent .aa-box{border-radius:50%;background:var(--ok);box-shadow:inset 0 0 0 1.5px var(--ok);color:#fff;animation:lp-pop .5s var(--spring)}
.sc-applyask .aa-tx{display:block;min-width:0}
.sc-applyask .aa-tx b{display:block;font:500 15px/20px var(--sans);letter-spacing:-.014em;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-applyask .aa-m{display:block;margin-top:2px;font:400 13px/18px var(--sans);color:var(--tx-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-applyask .aa-why{grid-column:3 / 5;display:block;font:400 13px/19px var(--sans);color:var(--tx-2);text-wrap:pretty}
.sc-applyask .aa-end{display:flex;align-items:center;justify-content:flex-end;gap:12px}
.sc-applyask .aa-sent{font:500 13px/18px var(--sans);color:var(--tx-2);white-space:nowrap;font-variant-numeric:tabular-nums;opacity:0;transform:translateX(6px);transition:opacity .35s var(--ease) .1s,transform .5s var(--spring) .1s}
.sc-applyask .aa-row.is-sent .aa-sent{opacity:1;transform:none}
/* the match ring, as in the portal */
.sc-applyask .aa-ring{position:relative;flex:none;width:44px;height:44px;display:grid;place-items:center}
.sc-applyask .aa-ring svg{position:absolute;inset:0;width:100%;height:100%}
.sc-applyask .aa-ring circle{fill:none;stroke-width:3.5}
.sc-applyask .aa-ring .tr{stroke:var(--line)}
.sc-applyask .aa-ring .ar{stroke:var(--ok-deep);stroke-linecap:round;stroke-dasharray:0 var(--c);transition:stroke-dasharray 1s var(--out) .35s}
.sc-applyask .aa-roles.is-in .aa-ring .ar{stroke-dasharray:var(--v) var(--c)}
.sc-applyask .aa-ring b{position:relative;font:600 13px/1 var(--sans);letter-spacing:-.01em;color:var(--tx);font-variant-numeric:tabular-nums}
/* what goes out */
.sc-applyask .aa-send{display:flex;align-items:center;gap:20px;margin-top:12px;padding:12px 28px 12px 12px;border-radius:24px;background:var(--sunk)}
.sc-applyask .aa-pf{flex:none;position:relative;width:132px;height:84px;border-radius:12px;background:#F3EEE9;box-shadow:inset 0 0 0 1px var(--line-2);display:block}
.sc-applyask .aa-sl{position:absolute;left:14px;right:14px;top:10px;bottom:10px;padding:9px 10px 0;border-radius:7px;background:#fff;box-shadow:0 0 0 1px var(--line-2),0 4px 10px -6px rgba(26,25,23,.2);display:block}
.sc-applyask .aa-sl b{display:block;margin-top:6px;font:400 11px/1.14 var(--serif);letter-spacing:-.02em;color:var(--tx)}
.sc-applyask .aa-sl>i{display:block;width:16px;height:1.5px;margin-top:5px;border-radius:2px;background:var(--ink)}
.sc-applyask .aa-stx{display:block;min-width:0}
.sc-applyask .aa-lbl{display:block;font:400 13px/18px var(--sans);color:var(--tx-3)}
.sc-applyask .aa-stx b{display:block;margin-top:3px;font:500 15px/20px var(--sans);color:var(--tx)}
.sc-applyask .aa-sub{display:block;margin-top:2px;font:400 13px/18px var(--sans);color:var(--tx-2)}
.sc-applyask .aa-act{display:flex;align-items:center;gap:10px;margin-top:22px}
.sc-applyask .aa-quiet{flex:1;padding-left:4px;font:400 13px/18px var(--sans);color:var(--tx-3);transition:opacity .3s var(--ease)}
.sc-applyask .aa-col.is-done .aa-quiet{opacity:0}
.sc-applyask .aa-go{min-width:148px}
.sc-applyask .aa-look{transition:background .2s,opacity .3s var(--ease)}
.sc-applyask .aa-look:active{transform:translateY(1px)}
.sc-applyask .aa-col.is-busy .aa-look,.sc-applyask .aa-col.is-done .aa-look{opacity:0;pointer-events:none}

/* ================================================================
   5 · whenback. Choosing a time is what brings them back.
   ================================================================ */
.sc-whenback .wb-wrap{position:absolute;inset:0;padding-top:16px;display:grid;place-items:center}
.sc-whenback .wb-panel{width:560px;padding:36px 32px 32px}
.sc-whenback .wb-logo{display:block;width:48px;height:48px;border-radius:14px;box-shadow:0 0 0 1px rgba(255,255,255,.14)}
.sc-whenback .wb-title{margin-top:22px;font-size:34px;line-height:1.14}
.sc-whenback .wb-line{margin-top:12px}
.sc-whenback .wb-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:26px}
.sc-whenback .wb-opt{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;height:60px;padding:0 18px 1px 20px;border-radius:18px;text-align:left;color:var(--tx);
  background:var(--glass-2);box-shadow:inset 0 0 0 1px var(--line);transition:background .2s var(--ease),color .2s var(--ease),box-shadow .2s var(--ease),transform .18s var(--out)}
.sc-whenback .wb-opt:hover{background:var(--glass-3)}
.sc-whenback .wb-opt:active{transform:scale(.985)}
.sc-whenback .wb-opt b{font:500 15px/20px var(--sans);letter-spacing:-.014em}
.sc-whenback .wb-opt span{font:400 15px/20px var(--sans);color:var(--tx-2);font-variant-numeric:tabular-nums;transition:color .2s var(--ease),transform .45s var(--spring)}
.sc-whenback .wb-opt i{position:absolute;right:16px;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;display:grid;place-items:center;background:#141312;color:#fff;opacity:0;transform:scale(.5);transition:opacity .2s var(--ease),transform .45s var(--spring)}
.sc-whenback .wb-opt i svg{width:11px;height:11px}
.sc-whenback .wb-opt.is-on{background:#F4F4F3;color:#131315;box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(0,0,0,.3),0 12px 24px -14px rgba(0,0,0,.7)}
.sc-whenback .wb-opt.is-on span{color:#5D5A54;transform:translateX(-32px)}
.sc-whenback .wb-opt.is-on i{opacity:1;transform:none}
.sc-whenback .wb-note{position:relative;height:20px;margin-top:18px}
.sc-whenback .wb-note>span{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:9px;height:20px;font:400 13px/20px var(--sans);color:var(--tx-3);white-space:nowrap;transition:opacity .3s var(--ease),transform .5s var(--spring)}
.sc-whenback .wb-held{color:var(--tx-2)!important;opacity:0;transform:translateY(6px)}
.sc-whenback .wb-panel.is-set .wb-hint{opacity:0}
.sc-whenback .wb-panel.is-set .wb-held{opacity:1;transform:none;transition-delay:.1s}
.sc-whenback .wb-panel.is-later .wb-held .sp-tick{display:none}
.sc-whenback .wb-act{display:flex;align-items:center;justify-content:space-between;margin-top:26px}
.sc-whenback .wb-now{height:48px;margin-left:-14px;padding:0 14px 1px;border-radius:15px;font:500 15px/1 var(--sans);letter-spacing:-.014em;color:var(--tx-2);transition:color .2s var(--ease),background .2s var(--ease)}
.sc-whenback .wb-now:hover{color:var(--tx);background:var(--glass-2)}
.sc-whenback .wb-now:active{background:var(--glass-3)}
.sc-whenback .wb-done{min-width:132px}

/* screens/jobs.css */
/* ZERO · System 3, Jobs: Home, Explore, Tracker.
   The job portal's own paper and white cards. Type is 14 and 12, with one display line a page.
   Green means open or done. Colour comes from the company logos, and from the fit marks the founder asked for. */
.sc-jb{--okd:#0C7E45;--okbg:#E9F6EE;--paper:#F8F7F5;color:var(--tx);font:400 14px/20px var(--sans);letter-spacing:-.012em}
.sc-jb .jb-page{position:absolute;left:180px;top:96px;width:1240px;bottom:0}
.sc-jb h1,.sc-jb h2,.sc-jb h3{font-weight:400}
.sc-jb ul,.sc-jb ol{list-style:none}
.sc-jb .sp-key,.sc-jb .sp-ghost{font-size:14px}
.sc-jb .sp-ghost{padding-bottom:1px}

/* things arrive once, a few pixels up, one after another */
.sc-jb .jb-in{animation:jb-in .6s var(--spring) both;animation-delay:calc(var(--i,0) * 60ms + 120ms)}
@keyframes jb-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sc-jb .pane.swap{animation:jb-swap .3s var(--out) both}
@keyframes jb-swap{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* a scroller fades where there is more to see, and only there */
.sc-jb .jb-scroll{overflow-y:auto;overscroll-behavior:contain;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 var(--ft,0px),#000 calc(100% - var(--fb,0px)),transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0,#000 var(--ft,0px),#000 calc(100% - var(--fb,0px)),transparent 100%)}

/* ---------- shared parts ---------- */
.sc-jb .jb-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 10px;font:600 14px/20px var(--sans);letter-spacing:-.014em;color:var(--tx)}
.sc-jb .jb-h span{font:400 12px/20px var(--sans);color:var(--tx-3);font-variant-numeric:tabular-nums}
.sc-jb .jb-lv{flex:none;display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px 0 8px;border-radius:99px;background:var(--sunk);color:var(--tx-2);font:500 12px/1 var(--sans);letter-spacing:-.004em;white-space:nowrap}
.sc-jb .jb-lv svg{width:12px;height:12px;margin-top:-1px}
.sc-jb .jb-lv.plain{padding:0 9px;background:var(--field)}
.sc-jb .jb-fit{display:inline-block;margin-left:5px;font-size:13px;line-height:13px;vertical-align:-1.5px;transform:translateY(1px)}
/* the heart teaches the matching what you like */
.sc-jb .jb-heart{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--tx-4);transition:color .2s,background .2s,transform .25s var(--spring)}
.sc-jb .jb-heart svg{width:16px;height:16px}
.sc-jb .jb-heart:hover{color:var(--tx-2);background:var(--field)}
.sc-jb .jb-heart:active{transform:scale(.88)}
.sc-jb .jb-heart.on{color:var(--ink)}
.sc-jb .jb-heart.on svg{fill:currentColor}
.sc-jb .jb-sent{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px 1px 12px;border-radius:12px;background:var(--okbg);color:var(--okd);font:500 14px/1 var(--sans);white-space:nowrap}
.sc-jb .jb-sent svg{width:14px;height:14px}
/* a checklist: a tick is proven, an open circle is still ahead */
.sc-jb .jb-asks li{display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:center;column-gap:12px;min-height:34px}
.sc-jb .jb-asks i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--tx-4)}
.sc-jb .jb-asks i svg{width:11px;height:11px}
.sc-jb .jb-asks .ok i{background:var(--okd);box-shadow:none;color:#fff}
.sc-jb .jb-asks b{font:500 14px/20px var(--sans);color:var(--tx)}
.sc-jb .jb-asks span{font:400 12px/16px var(--sans);color:var(--tx-3);text-align:right}
/* search */
.sc-jb .jb-find{display:flex;align-items:center;gap:8px;width:300px;height:36px;padding:0 5px 0 12px;border-radius:99px;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh1);color:var(--tx-3);cursor:text;transition:box-shadow .18s}
.sc-jb .jb-find:hover{box-shadow:0 0 0 1px rgba(26,25,23,.2),var(--sh1)}
.sc-jb .jb-find:focus-within{box-shadow:0 0 0 1.5px var(--ink),var(--sh1);color:var(--tx)}
.sc-jb .jb-find>svg{flex:none;width:15px;height:15px}
.sc-jb .jb-find input{flex:1;min-width:0;height:100%;padding:0 0 1px;border:0;outline:0;background:none;font:400 14px/1 var(--sans);letter-spacing:-.012em;color:var(--tx)}
.sc-jb .jb-find input::placeholder{color:var(--tx-3)}
.sc-jb .jb-find button{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--tx-3);opacity:0;pointer-events:none;transition:opacity .15s,background .15s,color .15s}
.sc-jb .jb-find.has button{opacity:1;pointer-events:auto}
.sc-jb .jb-find button:hover{background:var(--field);color:var(--tx)}
.sc-jb .jb-find button svg{width:12px;height:12px}

/* ---------- the chest: matte warm white, charcoal straps, a domed lid. A little ajar while it holds roles. ---------- */
.sc-jb .bx{position:relative;flex:none;width:200px;height:168px;perspective:620px}
.sc-jb .bx-shadow{position:absolute;left:12px;right:12px;bottom:-10px;height:22px;border-radius:50%;background:radial-gradient(closest-side,rgba(26,25,23,.24),rgba(26,25,23,0))}
.sc-jb .bx-in{position:absolute;left:6px;right:6px;top:58px;height:22px;border-radius:12px 12px 0 0;background:linear-gradient(#4A453F,#24221F)}
.sc-jb .bx-cards{position:absolute;left:0;right:0;top:50px;display:flex;justify-content:center;gap:5px;z-index:1}
.sc-jb .bx-cards .pk{display:block;transform:translateY(var(--y,10px)) rotate(var(--r,0deg));transition:transform .75s var(--spring),opacity .45s var(--ease);transition-delay:calc(var(--i) * 55ms + 120ms)}
.sc-jb .bx-cards .sp-lg{box-shadow:0 0 0 1.5px #fff,0 6px 12px -6px rgba(0,0,0,.45)}
.sc-jb .bx-body{position:absolute;left:0;right:0;bottom:0;height:94px;z-index:2;overflow:hidden;border-radius:5px 5px 22px 22px;background:linear-gradient(180deg,#F7F5F1 0%,#E9E5DE 100%);
  box-shadow:inset 0 0 0 1px rgba(26,25,23,.09),inset 0 1px 0 #fff,inset 0 -16px 22px -16px rgba(26,25,23,.18),0 22px 32px -22px rgba(26,25,23,.55)}
.sc-jb .bx-lid{position:absolute;left:-3px;right:-3px;top:16px;height:60px;z-index:3;overflow:hidden;border-radius:46% 46% 6px 6px / 74% 74% 6px 6px;background:linear-gradient(180deg,#FDFCFA 0%,#EFECE6 100%);
  box-shadow:inset 0 0 0 1px rgba(26,25,23,.09),inset 0 2px 0 #fff,inset 0 -10px 14px -12px rgba(26,25,23,.24),0 8px 12px -10px rgba(26,25,23,.4);
  transform-origin:50% 0;transition:transform .8s var(--spring),opacity .45s var(--ease) .1s}
.sc-jb .bx .st{position:absolute;top:0;bottom:0;width:12px;background:linear-gradient(90deg,#24221F,#403B35 50%,#24221F)}
.sc-jb .bx .st.l{left:23%}
.sc-jb .bx .st.r{right:23%}
.sc-jb .bx .latch{position:absolute;left:50%;top:64px;z-index:4;width:30px;height:24px;margin-left:-15px;border-radius:7px;background:linear-gradient(#403B35,#1C1B19);box-shadow:0 3px 6px -2px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.14);transition:transform .8s var(--spring)}
.sc-jb .bx .latch::after{content:'';position:absolute;left:50%;top:8px;width:5px;height:8px;margin-left:-2.5px;border-radius:3px 3px 1px 1px;background:#F4F2EE}
/* ajar: the logos peek out under the lid */
.sc-jb .bx.closed .bx-lid{transform:translateY(-12px) rotateX(-20deg)}
.sc-jb .bx.closed .pk:nth-child(odd){--y:6px}
.sc-jb .bx.closed .pk:nth-child(even){--y:9px}
/* open: the lid lifts away and the roles come out */
.sc-jb .bx.open .bx-lid{transform:translateY(-34px) rotateX(-84deg);opacity:0}
.sc-jb .bx.open .bx-cards{z-index:5}
.sc-jb .bx.open .pk:nth-child(1){--y:-30px;--r:-16deg;translate:-12px 0}
.sc-jb .bx.open .pk:nth-child(2){--y:-54px;--r:-8deg}
.sc-jb .bx.open .pk:nth-child(3){--y:-66px;--r:0deg}
.sc-jb .bx.open .pk:nth-child(4){--y:-54px;--r:8deg}
.sc-jb .bx.open .pk:nth-child(5){--y:-30px;--r:16deg;translate:12px 0}
/* empty: closed and quiet until the scouts bring the next ones */
.sc-jb .bx.empty .bx-cards{display:none}
.sc-jb .bx.empty .bx-lid{top:20px}

/* =====================================================================================================
   1. Home
   ===================================================================================================== */
.sc-jobs .hm{position:absolute;inset:0}
.sc-jobs .hm-c{position:absolute;left:500px;top:96px;width:600px;display:flex;flex-direction:column;gap:28px}
.sc-jobs .hm-l{position:absolute;left:180px;top:96px;width:540px;bottom:28px;display:flex;flex-direction:column;justify-content:center}
.sc-jobs .hm-r{position:absolute;left:760px;top:96px;width:660px;bottom:28px}
/* the box, while it holds roles */
.sc-jobs .hm-box.hero{display:flex;flex-direction:column;align-items:center;padding:44px 32px 36px;border-radius:28px;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh2)}
.sc-jobs .hm-box.hero .count{display:flex;flex-direction:column;align-items:center;margin-top:26px}
.sc-jobs .hm-box.hero .count b{font:400 72px/1 var(--serif);letter-spacing:-.03em;color:var(--tx);font-variant-numeric:tabular-nums}
.sc-jobs .hm-box.hero .count span{margin-top:8px;font:400 14px/20px var(--sans);color:var(--tx-2)}
.sc-jobs .hm-box.hero .sp-key{min-width:220px;margin-top:26px}
/* the agent at work: Zero sends them one by one */
.sc-jobs .hm-box.hero .agent{display:grid;place-items:center;height:168px}
.sc-jobs .hm-box.hero .count b em{font-style:normal}
.sc-jobs .hm-box.hero .count .sp-num{font-size:56px}
.sc-jobs .hm-box.hero .bar{display:block;width:240px;height:6px;margin-top:24px;border-radius:99px;background:var(--sunk);overflow:hidden}
.sc-jobs .hm-box.hero .bar i{display:block;width:0;height:100%;border-radius:99px;background:var(--okd);transition:width .3s var(--out)}
.sc-jobs .hm-box.hero.done .agent .sp-face{animation:hm-nod .7s var(--spring)}
.sc-jobs .hm-box .pre{position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none}
.sc-jobs .hm-box.hero{position:relative}
@keyframes hm-nod{40%{transform:translateY(-6px)}}
/* the box once it is collected: one quiet line */
.sc-jobs .hm-box.quiet{display:flex;align-items:center;gap:16px;padding:14px 18px 14px 14px;border-radius:22px;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh1)}
.sc-jobs .hm-box.quiet .bx{zoom:.36}
.sc-jobs .hm-box.quiet .t{flex:1;min-width:0;display:flex;flex-direction:column}
.sc-jobs .hm-box.quiet .t b{font:600 14px/20px var(--sans);letter-spacing:-.014em}
.sc-jobs .hm-box.quiet .t span{font:400 12px/18px var(--sans);color:var(--tx-3)}
/* what needs you */
.sc-jobs .hm-item{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:18px;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh1);transition:opacity .3s,transform .3s var(--out)}
.sc-jobs .hm-item.gone{opacity:0;transform:translateY(-4px)}
.sc-jobs .hm-item .t{flex:1;min-width:0;display:flex;flex-direction:column}
.sc-jobs .hm-item .t b{font:600 14px/20px var(--sans);letter-spacing:-.014em}
.sc-jobs .hm-item .t span{font:400 12px/18px var(--sans);color:var(--tx-3)}
.sc-jobs .hm-item.none{background:transparent;box-shadow:0 0 0 1px var(--line)}
.sc-jobs .hm-item.none .t b{font-weight:500;color:var(--tx-2)}
.sc-jobs .hm-item .ic{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--okbg);color:var(--okd)}
.sc-jobs .hm-item .ic svg{width:14px;height:14px}
/* where your applications stand: three plain counts */
.sc-jobs .hm-counts .row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sc-jobs .hm-counts button{display:flex;align-items:center;gap:8px;height:52px;padding:0 12px 1px 16px;border-radius:16px;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh1);text-align:left;transition:box-shadow .2s,background .2s}
.sc-jobs .hm-counts button:hover{box-shadow:0 0 0 1px rgba(26,25,23,.22),var(--sh1)}
.sc-jobs .hm-counts button:active{background:var(--wash)}
.sc-jobs .hm-counts span{flex:1;font:400 14px/1 var(--sans);color:var(--tx-2)}
.sc-jobs .hm-counts b{font:600 14px/1 var(--sans);color:var(--tx);font-variant-numeric:tabular-nums}
.sc-jobs .hm-counts svg{width:13px;height:13px;color:var(--tx-4)}
/* the roles out of the box */
.sc-jobs .bk{height:100%;display:flex;flex-direction:column;border-radius:24px;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh2);overflow:hidden}
.sc-jobs .bk header{flex:none;display:flex;align-items:center;gap:12px;height:60px;padding:0 24px 0 24px}
.sc-jobs .bk header b{font:600 14px/20px var(--sans);letter-spacing:-.014em}
.sc-jobs .bk header .sel{margin-left:auto;font:400 12px/1 var(--sans);color:var(--tx-3);font-variant-numeric:tabular-nums}
.sc-jobs .bk-list{flex:1;min-height:0;padding:0 12px 16px;display:flex;flex-direction:column;gap:2px}
.sc-jobs .bk-row{flex:none;display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 8px 8px 12px;border-radius:14px;transition:background .18s;animation:jb-in .5s var(--spring) both;animation-delay:calc(var(--i) * 32ms + 420ms)}
.sc-jobs .bk-row[data-a]{cursor:pointer}
.sc-jobs .bk-row:hover{background:var(--wash)}
.sc-jobs .bk-row.on{background:var(--wash)}
.sc-jobs .bk-row .t{flex:1;min-width:0;display:flex;flex-direction:column}
.sc-jobs .bk-row .t b{font:600 14px/20px var(--sans);letter-spacing:-.014em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-jobs .bk-row .t span{font:400 12px/18px var(--sans);color:var(--tx-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-jobs .bk-check{flex:none;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--tx-4);color:transparent;transition:background .15s,box-shadow .15s}
.sc-jobs .bk-check svg{width:12px;height:12px}
.sc-jobs .bk-check:hover{box-shadow:inset 0 0 0 1.5px var(--tx-2)}
.sc-jobs .bk-check[aria-checked="true"],.sc-jobs .bk-check.on{background:var(--ink);box-shadow:none;color:#fff}
.sc-jobs .bk-check.some{background:var(--ink);box-shadow:none}
.sc-jobs .bk-check.some svg{display:none}
.sc-jobs .bk-check.some::after{content:'';width:9px;height:2px;border-radius:2px;background:#fff}
/* sending, row by row */
.sc-jobs .bk-st{flex:none;display:flex;align-items:center;justify-content:flex-end;gap:8px;width:264px;font:400 12px/16px var(--sans);color:var(--tx-3);white-space:nowrap}
.sc-jobs .bk-st[data-st="wait"]::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--tx-4);opacity:.6}
.sc-jobs .bk-st .cs{display:flex;gap:3px}
.sc-jobs .bk-st .cs>span{display:block;animation:bk-sh .5s var(--spring) both;animation-delay:calc(var(--j) * 70ms)}
@keyframes bk-sh{from{opacity:0;transform:translateX(12px)}}
.sc-jobs .bk-st .doc{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--field);color:var(--tx-2)}
.sc-jobs .bk-st .doc svg{width:13px;height:13px}
.sc-jobs .bk-st .ok{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--okd);color:#fff}
.sc-jobs .bk-st .ok svg{width:10px;height:10px}
.sc-jobs .bk-st[data-st="sent"] .w{color:var(--tx-2)}
.sc-jobs .bk-row.now{background:var(--wash)}

/* =====================================================================================================
   2. Explore
   ===================================================================================================== */
.sc-explore .ex-top{display:flex;align-items:center;justify-content:space-between;height:36px}
.sc-explore .ex-focus{display:flex;align-items:center;gap:12px}
.sc-explore .ex-focus .lb{font:400 14px/1 var(--sans);color:var(--tx-3)}
.sc-explore .chips{display:flex;gap:6px}
.sc-explore .chips button{height:36px;padding:0 14px 1px;border-radius:99px;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh1);color:var(--tx-2);font:500 14px/1 var(--sans);transition:background .18s,color .18s,box-shadow .18s}
.sc-explore .chips button i{margin-left:6px;font:400 12px/1 var(--sans);font-style:normal;opacity:.6;font-variant-numeric:tabular-nums}
.sc-explore .chips button:hover{color:var(--tx);box-shadow:0 0 0 1px rgba(26,25,23,.2),var(--sh1)}
.sc-explore .chips button:active{background:var(--wash)}
.sc-explore .chips button.on{background:var(--ink);color:#fff;box-shadow:0 0 0 1px var(--ink)}
.sc-explore .chips button:disabled{opacity:.42;pointer-events:none}
.sc-explore .ex-split{position:absolute;left:0;right:0;top:56px;bottom:28px}
.sc-explore .ex-list{position:absolute;left:-4px;top:-4px;bottom:-4px;width:588px;padding:4px;display:flex;flex-direction:column;gap:6px}
.sc-explore .ex-row{flex:none;display:flex;align-items:center;gap:12px;padding:12px 10px 12px 14px;border-radius:18px;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh1);cursor:pointer;outline:0;transition:background .18s,box-shadow .18s}
.sc-explore .ex-row:hover,.sc-explore .ex-row:focus-visible{box-shadow:0 0 0 1px rgba(26,25,23,.22),var(--sh1)}
.sc-explore .ex-row:active{background:var(--wash)}
.sc-explore .ex-row .t{flex:1;min-width:0;display:flex;flex-direction:column}
.sc-explore .ex-row .t b{font:600 14px/20px var(--sans);letter-spacing:-.014em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-explore .ex-row .t span{font:400 12px/18px var(--sans);color:var(--tx-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-explore .ex-row.locked{background:transparent;box-shadow:0 0 0 1px var(--line)}
.sc-explore .ex-row.locked:hover{background:rgba(255,255,255,.7)}
.sc-explore .ex-row.locked .sp-lg{filter:grayscale(1);opacity:.5}
.sc-explore .ex-row.locked .t b{color:var(--tx-2)}
.sc-explore .ex-row.on,.sc-explore .ex-row.on:hover{background:var(--card);box-shadow:0 0 0 1.5px var(--ink),var(--sh1)}
.sc-explore .ex-apply{height:32px;padding:0 13px 1px;border-radius:10px}
.sc-explore .ex-done{flex:none;display:inline-flex;align-items:center;gap:5px;padding:0 6px;font:500 12px/1 var(--sans);color:var(--okd)}
.sc-explore .ex-done svg{width:12px;height:12px}
.sc-explore .ex-zero{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:20px;border-radius:18px;box-shadow:0 0 0 1px var(--line)}
.sc-explore .ex-zero b{font:600 14px/20px var(--sans)}
.sc-explore .ex-det{position:absolute;left:608px;right:0;top:0;max-height:100%;overflow-y:auto;border-radius:24px;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh1)}
.sc-explore .ex-det .pane{padding:26px 28px 28px}
.sc-explore .ex-det header{display:flex;align-items:center;gap:16px}
.sc-explore .ex-det h2{font:400 28px/32px var(--serif);letter-spacing:-.026em;color:var(--tx);text-wrap:balance}
.sc-explore .ex-det header p{margin-top:3px;font:400 14px/20px var(--sans);color:var(--tx-3)}
.sc-explore .ex-facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.sc-explore .ex-acts{display:flex;align-items:center;gap:10px;margin-top:22px}
.sc-explore .ex-said{font:400 12px/16px var(--sans);color:var(--tx-3)}
.sc-explore .ex-lock{display:flex;align-items:center;gap:14px;margin:22px 0 24px;padding:14px 14px 14px 16px;border-radius:16px;background:var(--wash);box-shadow:inset 0 0 0 1px var(--line)}
.sc-explore .ex-lock .sp-lock{background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh1);color:var(--tx-2)}
.sc-explore .ex-lock .sp-lock svg{width:44%;height:44%}
.sc-explore .ex-lock .t{flex:1;min-width:0;display:flex;flex-direction:column}
.sc-explore .ex-lock .t b{font:600 14px/20px var(--sans);letter-spacing:-.014em}
.sc-explore .ex-lock .t span{font:400 12px/18px var(--sans);color:var(--tx-2)}

/* =====================================================================================================
   3. Tracker
   ===================================================================================================== */
.sc-tracker .tk-h{margin-top:2px;font:400 28px/32px var(--serif);letter-spacing:-.026em;color:var(--tx)}
.sc-tracker .tk-cols{position:absolute;left:0;right:0;top:56px;bottom:28px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.sc-tracker .tk-col{display:flex;flex-direction:column;min-height:0;padding:16px 12px 0;border-radius:24px;background:rgba(26,25,23,.025);box-shadow:inset 0 0 0 1px var(--line-2);transition:box-shadow .6s var(--ease)}
.sc-tracker .tk-col .jb-h{padding:0 6px;margin-bottom:12px}
.sc-tracker .tk-col .jb-h span{font-size:14px;font-weight:600;color:var(--tx-3)}
.sc-tracker .tk-col.lit{animation:tk-lit 2.4s var(--ease) .5s both}
@keyframes tk-lit{0%,60%{box-shadow:inset 0 0 0 1.5px var(--ink)}100%{box-shadow:inset 0 0 0 1px var(--line-2)}}
.sc-tracker .tk-cards{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;margin:0 -4px;padding:4px 4px 16px}
.sc-tracker .tk-card{flex:none;display:flex;align-items:center;gap:12px;padding:12px 14px 12px 12px;border-radius:16px;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh1);cursor:pointer;outline:0;transition:box-shadow .18s,background .18s}
.sc-tracker .tk-card:hover,.sc-tracker .tk-card:focus-visible{box-shadow:0 0 0 1px rgba(26,25,23,.22),var(--sh1)}
.sc-tracker .tk-card:active{background:var(--wash)}
.sc-tracker .tk-card .t{flex:1;min-width:0;display:flex;flex-direction:column}
.sc-tracker .tk-card .t b{font:600 14px/20px var(--sans);letter-spacing:-.014em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-tracker .tk-card .t span{font:400 12px/18px var(--sans);color:var(--tx-3)}
.sc-tracker .tk-card .s{flex:none;display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.sc-tracker .tk-card .s b{display:inline-flex;align-items:center;gap:5px;font:600 12px/18px var(--sans);color:var(--tx)}
.sc-tracker .tk-card .s b svg{width:13px;height:13px;color:var(--tx-2)}
.sc-tracker .tk-card .s span{font:400 12px/18px var(--sans);color:var(--tx-3);font-variant-numeric:tabular-nums}
.sc-tracker .tk-card.lost{background:transparent;box-shadow:0 0 0 1px var(--line)}
.sc-tracker .tk-card.lost .sp-lg{filter:grayscale(1);opacity:.55}
.sc-tracker .tk-card.lost .s b{color:var(--tx-2);font-weight:500}
.sc-tracker .tk-zero{padding:14px 10px;font:400 12px/16px var(--sans);color:var(--tx-3)}

/* screens/later.css */
/* ZERO skill path · the later moments: recap, proof, dreamapply, offer, hired.
   World tone for the two panels that sit on the city, the job portal's paper for the Jobs pages and the letter.
   Sizes on every screen: one serif title, 15 body, 13 secondary, 12 small. The letter sets its own body in the serif. */

/* things take their place by rising a little. If the animation never runs, they are simply there. */
.sc-recap .lt-in,.sc-proof .lt-in,.sc-dreamapply .lt-in,.sc-offer .lt-in,.sc-hired .lt-in,.sc-coach .lt-in,.sc-credits .lt-in{animation:lt-rise .7s var(--spring) backwards;animation-delay:calc(var(--i,0) * 60ms + 140ms)}
@keyframes lt-rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* the quiet button sets down when pressed, like the key */
.sc-recap .sp-ghost,.sc-proof .sp-ghost,.sc-dreamapply .sp-ghost,.sc-offer .sp-ghost{transition:background .2s,transform .18s var(--out)}
.sc-recap .sp-ghost:active,.sc-proof .sp-ghost:active,.sc-dreamapply .sp-ghost:active,.sc-offer .sp-ghost:active{transform:translateY(1px)}

/* ================= 1 · recap ================= */
.sc-recap .rc-panel{position:absolute;left:480px;top:190px;width:640px;padding:32px 12px 12px}
.sc-recap .rc-panel h1{padding:0 12px}
.sc-recap .rc-rows{display:flex;flex-direction:column;gap:6px;margin-top:24px}
.sc-recap .rc-row{display:flex;align-items:center;gap:14px;width:100%;height:64px;padding:0 16px 0 12px;border-radius:18px;text-align:left;
  background:var(--glass-2);box-shadow:inset 0 0 0 1px var(--line-2);transition:background .2s var(--ease)}
.sc-recap .rc-row:hover{background:var(--glass-3)}
.sc-recap .rc-row:active{background:rgba(255,255,255,.13)}
.sc-recap .rc-row .tx{flex:1;min-width:0;font:400 15px/1.35 var(--sans);letter-spacing:-.012em;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-recap .rc-row .tx b{font-weight:500}
.sc-recap .rc-row .tx em{font-style:normal;color:var(--tx-2)}
.sc-recap .rc-row .go{flex:none;width:16px;height:16px;color:var(--tx-2);opacity:0;transform:translateX(-4px);transition:opacity .2s var(--ease),transform .3s var(--spring)}
.sc-recap .rc-row:hover .go{opacity:1;transform:none}
.sc-recap .rc-acts{display:flex;gap:8px;margin-top:12px}
.sc-recap .rc-acts .sp-key,.sc-recap .rc-acts .sp-ghost{height:52px;border-radius:18px}
.sc-recap .rc-acts .sp-key{flex:1;gap:10px}
.sc-recap .rc-acts .sp-ghost{padding:0 24px 2px}

/* ================= 2 · proof ================= */
.sc-proof .pf-scroll{position:absolute;left:256px;top:70px;width:1088px;height:770px;overflow-y:auto;overscroll-behavior:contain;padding:26px 24px 0;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 20px,#000 calc(100% - 80px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 20px,#000 calc(100% - 80px),transparent 100%)}
.sc-proof .pf-page{padding-bottom:120px}
.sc-proof .pf-card{background:var(--card);border-radius:24px;box-shadow:0 0 0 1px var(--line),var(--sh1)}

.sc-proof .pf-head{display:flex;align-items:center;gap:16px}
.sc-proof .pf-av{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(150deg,#EAE4D9,#CFC5B4);
  font:400 24px/1 var(--serif);color:rgba(26,25,23,.55)}
.sc-proof .pf-id{flex:1;min-width:0}
.sc-proof .pf-id h1{font:400 32px/1.1 var(--serif);letter-spacing:-.028em;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-proof .pf-id p{margin-top:3px;font:400 15px/1.3 var(--sans);color:var(--tx-2)}
.sc-proof .pf-copy{display:inline-grid;flex:none;padding:0 16px 1px 14px}
.sc-proof .pf-copy span{grid-area:1/1;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .2s var(--ease),transform .35s var(--spring)}
.sc-proof .pf-copy svg{width:15px;height:15px;flex:none}
.sc-proof .pf-copy .b{opacity:0;transform:translateY(5px)}
.sc-proof .pf-copy .b svg{color:var(--ok-deep)}
.sc-proof .pf-copy.done .a{opacity:0;transform:translateY(-5px)}
.sc-proof .pf-copy.done .b{opacity:1;transform:none}

.sc-proof .pf-level{display:flex;align-items:center;gap:24px;margin-top:24px;padding:24px 28px}
.sc-proof .pf-level .sp-ring circle{stroke-width:2.5}
.sc-proof .pf-level .sp-ring .tr{stroke:var(--sunk)}
/* at the very start of a level the arc has no length: hide it, or its round cap shows as a stray dot */
.sc-proof .pf-level .sp-ring[style$="--p:0"] .ar{opacity:0}
.sc-proof .pf-level .tx{flex:1;min-width:0}
.sc-proof .pf-level .lv{display:flex;align-items:center;gap:10px}
.sc-proof .pf-level .lv b{font:600 15px/1 var(--sans);color:var(--tx)}
.sc-proof .pf-level .lv span{display:inline-flex;align-items:center;height:22px;padding:0 8px 1px;border-radius:7px;background:var(--field);font:500 12px/1 var(--sans);color:var(--tx-2)}
.sc-proof .pf-level h2{margin-top:9px;font:400 24px/1.2 var(--serif);letter-spacing:-.022em;color:var(--tx);text-wrap:balance}
.sc-proof .pf-level .rv{display:flex;align-items:center;gap:6px;margin-top:10px;font:400 13px/1 var(--sans);color:var(--tx-2)}
.sc-proof .pf-level .rv svg{width:14px;height:14px;flex:none;color:var(--ok-deep)}

.sc-proof .pf-skills{margin-top:12px;padding:8px}
.sc-proof .pf-sk-head,.sc-proof .pf-sk{display:grid;grid-template-columns:minmax(0,1fr) 300px 224px;column-gap:40px;align-items:center;padding:0 20px}
.sc-proof .pf-sk-head{height:36px;font:400 12px/1 var(--sans);color:var(--tx-3)}
.sc-proof .pf-sk{height:62px;border-radius:16px;transition:background .2s var(--ease)}
.sc-proof .pf-sk:hover{background:var(--wash)}
.sc-proof .pf-sk .nm{min-width:0}
.sc-proof .pf-sk .nm b{display:block;font:500 15px/1.2 var(--sans);color:var(--tx)}
.sc-proof .pf-sk .nm span{display:block;margin-top:4px;font:400 13px/1.2 var(--sans);color:var(--tx-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-proof .pf-sk .pt{display:flex;align-items:center;gap:16px}
.sc-proof .pf-sk .bar{flex:1;height:6px;border-radius:99px;background:var(--field);overflow:hidden}
.sc-proof .pf-sk .bar i{display:block;width:0;height:100%;border-radius:99px;background:#E3A62B;transition:width 1.1s var(--out)}
.sc-proof .pf-sk .pt b{flex:none;width:46px;text-align:right;font:500 15px/1 var(--sans);font-variant-numeric:tabular-nums;color:var(--tx)}
.sc-proof .pf-sk .by{display:flex;align-items:center;gap:4px}
.sc-proof .pf-sk .by em{font:400 13px/1 var(--sans);font-style:normal;color:var(--tx-4)}

.sc-proof .pf-sec{display:flex;align-items:baseline;justify-content:space-between;margin:32px 0 12px}
.sc-proof .pf-sec b{font:600 15px/1.3 var(--sans);color:var(--tx)}
.sc-proof .pf-sec span{font:400 13px/1.3 var(--sans);color:var(--tx-3)}
.sc-proof .pf-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sc-proof .pf-proj{display:flex;gap:16px;padding:20px;border-radius:20px}
.sc-proof .pf-proj .tx{flex:1;min-width:0}
.sc-proof .pf-proj .hd{display:flex;align-items:baseline;gap:12px}
.sc-proof .pf-proj h3{flex:1;min-width:0;font:400 22px/1.2 var(--serif);letter-spacing:-.022em;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-proof .pf-proj .pts{flex:none;display:flex;align-items:center;gap:5px;font:500 15px/1 var(--sans);font-variant-numeric:tabular-nums;color:var(--tx)}
.sc-proof .pf-proj .m{margin-top:4px;font:400 13px/1.3 var(--sans);color:var(--tx-3)}
.sc-proof .pf-proj .m b{font-weight:500;color:var(--tx-2)}
.sc-proof .pf-proj .sk{display:flex;gap:6px;margin-top:14px}
.sc-proof .pf-proj .sk span{display:inline-flex;align-items:center;height:24px;padding:0 9px 1px;border-radius:8px;background:var(--field);font:500 12px/1 var(--sans);color:var(--tx-2);white-space:nowrap}
.sc-proof .pf-empty{padding:22px 24px;border-radius:20px;background:var(--sunk);font:400 15px/1.45 var(--sans);color:var(--tx-2)}

/* ================= 3 · dreamapply ================= */
.sc-dreamapply .da-scroll{position:absolute;left:386px;top:70px;width:828px;height:770px;overflow-y:auto;overscroll-behavior:contain;padding:26px 24px 0;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 20px,#000 calc(100% - 20px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 20px,#000 calc(100% - 20px),transparent 100%)}
.sc-dreamapply .da-col{padding-bottom:32px}
.sc-dreamapply .da-card{padding:28px;border-radius:24px;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh2)}

/* the match ring, as the job portal draws it */
.sc-dreamapply .lt-match{position:relative;flex:none;display:grid;place-items:center}
.sc-dreamapply .lt-match svg{position:absolute;inset:0;width:100%;height:100%}
.sc-dreamapply .lt-match circle{fill:none;stroke-width:3.5}
.sc-dreamapply .lt-match .tr{stroke:var(--line)}
.sc-dreamapply .lt-match .ar{stroke:var(--ok-deep);stroke-linecap:round}
.sc-dreamapply .lt-match b{position:relative;font:600 13px/1 var(--sans);letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--tx)}

.sc-dreamapply .da-hero{display:flex;align-items:center;gap:16px}
.sc-dreamapply .da-id{flex:1;min-width:0}
.sc-dreamapply .da-t{display:flex;align-items:center;gap:12px}
.sc-dreamapply .da-t h1{min-width:0;font:400 32px/1.1 var(--serif);letter-spacing:-.028em;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-dreamapply .da-tag{flex:none;display:flex;margin-top:3px}
.sc-dreamapply .da-id p{margin-top:5px;font:400 13px/1.3 var(--sans);color:var(--tx-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-dreamapply .da-st,.sc-dreamapply .da-role .s{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px 1px;border-radius:8px;background:var(--field);
  font:500 12px/1 var(--sans);color:var(--tx-2);white-space:nowrap}
.sc-dreamapply .da-st svg,.sc-dreamapply .da-role .s svg{width:12px;height:12px;flex:none}
.sc-dreamapply .da-st.open,.sc-dreamapply .da-role .s.open{background:#E9F6EE;color:var(--ok-deep)}
.sc-dreamapply .da-st i,.sc-dreamapply .da-role .s i{width:6px;height:6px;border-radius:50%;background:var(--ok-deep)}
.sc-dreamapply .da-match{flex:none;display:flex;align-items:center;gap:12px}
.sc-dreamapply .da-match em{display:block;font:400 12px/1 var(--sans);font-style:normal;color:var(--tx-3)}
.sc-dreamapply .da-match span b{display:block;margin-top:5px;font:500 13px/1 var(--sans);color:var(--tx)}
.sc-dreamapply .da-say{margin-top:22px;font:400 15px/1.45 var(--sans);color:var(--tx)}

.sc-dreamapply .da-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.sc-dreamapply .da-tile{padding:16px 16px 18px;border-radius:16px;background:var(--wash);box-shadow:inset 0 0 0 1px var(--line-2)}
.sc-dreamapply .da-tile h3{font:500 13px/1.2 var(--sans);color:var(--tx-3)}
.sc-dreamapply .da-tile ol,.sc-dreamapply .da-tile ul{list-style:none;display:flex;flex-direction:column;gap:14px;margin-top:14px}
.sc-dreamapply .da-tile li{display:flex;align-items:flex-start;gap:12px}
.sc-dreamapply .da-tile li .tx{flex:1;min-width:0}
.sc-dreamapply .da-tile li .tx b{display:block;font:500 15px/1.25 var(--sans);color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-dreamapply .da-tile li .tx>span{display:block;margin-top:3px;font:400 13px/1.4 var(--sans);color:var(--tx-2);text-wrap:pretty}
.sc-dreamapply .da-tile li .tx em{font-style:normal;color:var(--tx)}
.sc-dreamapply .da-cases .n{flex:none;width:12px;font:500 13px/36px var(--sans);font-variant-numeric:tabular-nums;color:var(--tx-3);text-align:center}
.sc-dreamapply .da-asks .ck{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--field);color:transparent}
.sc-dreamapply .da-asks .ck svg{width:11px;height:11px}
.sc-dreamapply .da-asks li.ok .ck{background:#E9F6EE;color:var(--ok-deep)}
.sc-dreamapply .da-tile .none{margin-top:14px;font:400 13px/1.4 var(--sans);color:var(--tx-2)}
/* "Let me read it first": both tiles open downwards together, so they stay one height */
.sc-dreamapply .da-x{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s var(--spring)}
.sc-dreamapply .da-x .in{min-height:0;overflow:hidden;opacity:0;transition:opacity .25s var(--ease)}
.sc-dreamapply .da-card.reading .da-x{grid-template-rows:1fr}
.sc-dreamapply .da-card.reading .da-x .in{opacity:1;transition:opacity .4s var(--ease) .14s}
.sc-dreamapply .da-x h3{padding-top:22px}
.sc-dreamapply .da-x .rest{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.sc-dreamapply .da-x p{margin-top:8px;font:400 13px/1.5 var(--sans);color:var(--tx-2);text-wrap:pretty}

.sc-dreamapply .da-top{display:flex;align-items:center;gap:16px;margin-top:12px;padding:14px 16px;border-radius:16px;background:var(--wash);box-shadow:inset 0 0 0 1px var(--line-2);
  cursor:pointer;outline:none;transition:background .2s var(--ease)}
.sc-dreamapply .da-top:hover{background:var(--field)}
.sc-dreamapply .da-top:focus-visible{box-shadow:inset 0 0 0 1.5px var(--ink)}
.sc-dreamapply .da-top .tx{flex:1;min-width:0}
.sc-dreamapply .da-top .tx b{display:block;font:500 15px/1.2 var(--sans);color:var(--tx)}

    if (!s) { if (defs[stepId]) return show(stepId, o); console.error('no step', stepId); return; }
    if (cross(s)) return;
    curStep = s;
    if (s.moment) setMoment(s.moment);
    try { history.replaceState(null, '', '#' + s.id); } catch (e) {}
    mount(s.screen, Object.assign({}, s.opts, o));
  }
  /* open a screen as things stand now (the rail, a button inside a screen) */
  function show(id, o) {
    var here = steps.filter(function (x) { return x.screen === id && (!x.moment || x.moment === state.moment); });
    var s = (o ? here.filter(function (x) { return x.opts && !x.opts.panel && Object.keys(x.opts).every(function (k) { return x.opts[k] === o[k]; }); })[0] : null) ||
      here.filter(function (x) { return !x.opts; })[0] || steps.filter(function (x) { return x.screen === id && !x.opts; })[0] || steps.filter(function (x) { return x.screen === id; })[0];
    if (s && cross(s)) return;
    if (s) curStep = s;
    try { history.replaceState(null, '', '#' + (s ? s.id : id)); } catch (e) {}
    mount(id, o);
  }
  /* in a system site, the stepper only walks that system's steps */
  function seq() { return SYS ? steps.filter(function (x) { return x.sys === SYS; }) : steps; }
  function idx() { return Math.max(0, seq().indexOf(curStep)); }
  function next() { var q = seq(), i = idx(); if (i < q.length - 1) go(q[i + 1].id); else if (SYS) goSite(SYS % 3 + 1); }
  function prev() { var q = seq(), i = idx(); if (i > 0) go(q[i - 1].id); }
  function siteURL(n) { return (window.SP_SITES && window.SP_SITES[n]) || ('?sys=' + n); }
  function goSite(n, stepId) { location.href = siteURL(n) + (stepId ? '#' + stepId : ''); }
  /* a button that leads into another system leaves this site for that one, at that step */
  function cross(s) {
    if (!SYS || !s.sys || s.sys === SYS) return false;
    if (strip) { strip.classList.add('leaving'); strip.querySelector('.go-to').innerHTML = 'Over to <b>' + s.sys + ' ' + SYSN[s.sys] + '</b>'; }
    setTimeout(function () { goSite(s.sys, s.id); }, 650);
    return true;
  }

  /* ---------- the systems strip: which system, this experience's title, where it lives, what crosses ---------- */
  var strip = null, playT = 0, playing = true;
  try { playing = sessionStorage.getItem('sp-play') !== '0'; } catch (e) {}
  function drawStrip() {
    if (!strip) return;
    var q = seq(), i = idx(), s = q[i] || {}, ties = s.ties || [];
    strip.innerHTML =
      '<div class="who"><span class="n">' + SYS + '</span><div><em>' + SYSN[SYS] + ' · ' + (i + 1) + ' of ' + q.length + '</em><b>' + esc(s.title || s.name || '') + '</b></div></div>' +
      '<div class="ties">' + (s.where ? '<span class="where">' + I.pin + esc(s.where) + '</span>' : '') + ties.map(function (t) {
        return '<span class="tie ' + (t.out ? 'out' : 'in') + '">' + (t.out ? '<i class="ar">' + I.arrow + '</i><span class="n s' + t.sys + '">' + t.sys + '</span>' : '<span class="n s' + t.sys + '">' + t.sys + '</span><i class="ar">' + I.arrow + '</i>') + esc(t.t) + '</span>';
      }).join('') + '</div>' +
      '<div class="ctl"><nav class="sys">' + [1, 2, 3].map(function (n) { return '<a href="' + siteURL(n) + '" class="' + (n === SYS ? 'on' : '') + '" title="' + SYSN[n] + '">' + n + '</a>'; }).join('') +
        '<a href="' + (window.SP_MAP || 'map.html') + '" class="map">Map</a></nav>' +
        '<button type="button" data-a="prev" aria-label="Back">' + I.left + '</button>' +
        '<button type="button" data-a="play" aria-label="' + (playing ? 'Pause' : 'Play') + '">' + (playing ? '<svg viewBox="0 0 16 16" fill="currentColor"><rect x="4" y="3.200" width="2.800" height="9.600" rx="1"/><rect x="9.200" y="3.200" width="2.800" height="9.600" rx="1"/></svg>' : I.play) + '</button>' +
        '<button type="button" data-a="next" aria-label="Next">' + (i === q.length - 1 ? '<span>' + (SYS % 3 + 1) + ' ' + SYSN[SYS % 3 + 1] + '</span>' : '') + I.right + '</button></div>' +
      '<div class="go-to"></div><i class="bar"><i style="animation-duration:' + (s.dur || 8000) + 'ms"></i></i>';
    strip.classList.toggle('playing', playing);
    clearTimeout(playT);
    if (playing && i < q.length - 1) playT = setTimeout(next, s.dur || 8000);
  }

  /* ---------- the review key ---------- */
  function drawDev() {
    var i = idx(), s = steps[i] || {}, groups = [], html = '';
    steps.forEach(function (x) { if (groups.indexOf(x.group) < 0) groups.push(x.group); });
    groups.forEach(function (g) {
      html += '<h4>' + g + '</h4><div class="grid">' + steps.map(function (x, k) { return x.group === g ? '<button data-go="' + x.id + '" class="' + (x === curStep ? 'on' : '') + '"><em>' + (k + 1) + '</em>' + esc(x.name) + '</button>' : ''; }).join('') + '</div>';
    });
    dev.innerHTML = '<div class="menu">' + html + '<div class="foot"><a href="' + (window.SP_PLAN || 'plan.html') + '" target="_blank" rel="noopener">Read the plan</a><button data-go="' + steps[0].id + '">Start over</button></div></div>' +
      '<div class="bar"><button data-a="menu" title="All screens">' + I.menu + '</button><button data-a="prev" title="Back  [">' + I.left + '</button><span class="name"><em>' + (i + 1) + ' / ' + steps.length + '</em>' + esc(s.name || '') + '</span><button data-a="next" title="Next  ]"' + (s.later ? ' class="lab"' : '') + '>' + (s.later ? esc(s.later) : '') + I.right + '</button></div>';
  }

  function fit() {
    var Rw = root.clientWidth || innerWidth, Rh = root.clientHeight || innerHeight, k = Math.min(Rw / W, Rh / H);
    stage.style.transform = 'translate(' + (-W * k / 2) + 'px,' + (-H * k / 2) + 'px) scale(' + k + ')';
  }

  function boot() {
    root = document.createElement('div'); root.id = 'sp-root'; root.dataset.tone = 'world';
    root.innerHTML = '<div id="sp-stage"><div id="sp-map" style="--city:url(' + asset('img/city-lo.jpg') + ')"><div class="mp-tilt"><div class="mp-cam"><img class="mp-city lo" alt="" draggable="false" src="' + asset('img/city-rest-lo.jpg') + '"><div class="mp-layer"></div></div></div><div class="mp-dimmer"></div><div class="mp-shade"></div></div>' +
      '<div id="sp-screens"></div><div class="sp-wm">' + (window.ZT_WORDMARK || '') + '</div>' +
      '<div class="sp-rail"><button data-mode="learn">' + I.learn + 'Learn</button><button data-mode="jobs">' + I.jobs + 'Jobs</button></div>' +
      '<div class="sp-tabs"><button data-tab="foryou" data-to="jobs">Home</button><button data-tab="explore" data-to="explore">Explore</button><button data-tab="tracker" data-to="tracker">Tracker</button></div>' +
      '<button class="sp-help" type="button">How it works</button>' +
      '<button class="sp-pill" type="button" aria-label="Your level and your path"></button>' +
      '<button class="sp-cred" type="button" aria-label="Your credits"><i class="coin"></i><b></b></button>' +
      '<button class="sp-fab" type="button" aria-label="Your coach">' + face(46) + '</button></div>';
    document.body.appendChild(root);
    dev = document.createElement('div'); dev.id = 'sp-dev'; document.body.appendChild(dev);
    if (SYS) {
      document.body.classList.add('sp-sys');
      strip = document.createElement('div'); strip.id = 'sp-strip'; document.body.appendChild(strip);
      strip.addEventListener('click', function (e) {
        var a = e.target.closest('[data-a]'); if (!a) return;
        if (a.dataset.a === 'next') next(); else if (a.dataset.a === 'prev') prev();
        else { playing = !playing; try { sessionStorage.setItem('sp-play', playing ? '1' : '0'); } catch (x) {} drawStrip(); }
      });
      /* anything the visitor does on the product pauses the clock, so it never moves under them */
      root.addEventListener('pointerdown', function () { if (playing) { playing = false; drawStrip(); } }, true);
    }
    stage = root.querySelector('#sp-stage'); mapEl = root.querySelector('#sp-map'); cam = root.querySelector('.mp-cam'); layer = root.querySelector('.mp-layer');
    screensEl = root.querySelector('#sp-screens'); pill = root.querySelector('.sp-pill'); rail = root.querySelector('.sp-rail'); tabs = root.querySelector('.sp-tabs');
    tabs.addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) show(b.dataset.to); });
    /* the sharp city replaces the light one once it has loaded */
    /* the city at rest is its own picture (quieter, baked in, so it stays sharp at any zoom); the colour one is used for the buildings that are yours */
    var hi = new Image(); hi.onload = function () { var im = root.querySelector('.mp-city'); im.src = hi.src; im.classList.remove('lo'); }; hi.src = asset('img/city-rest.webp');
    var col = new Image(); col.onload = function () { mapEl.style.setProperty('--city', 'url(' + col.src + ')'); }; col.src = asset('img/city.webp');
    /* the city leans a little toward the pointer, like a model on a table */
    var tilt = root.querySelector('.mp-tilt');
    addEventListener('mousemove', function (e) {
      if (!root.dataset.map || root.dataset.still) return;
      var nx = e.clientX / innerWidth * 2 - 1, ny = e.clientY / innerHeight * 2 - 1;
      tilt.style.transform = 'translate(' + (-nx * 9).toFixed(1) + 'px,' + (-ny * 6).toFixed(1) + 'px) skewX(' + (nx * .7).toFixed(3) + 'deg) scaleY(' + (1 + ny * .012).toFixed(4) + ')';
    });
    document.addEventListener('mouseleave', function () { tilt.style.transform = ''; });
    /* hovering a stop, its name or its building wakes that building up */
    function wake(e, on) {
      var t = e.target.closest && e.target.closest('[data-co]'); if (!t) return;
      var gl = layer.querySelector('.mp-glow[data-co="' + t.dataset.co + '"]'); if (gl) gl.classList.toggle('hov', on);
      var sd = layer.querySelector('.mp-stop[data-co="' + t.dataset.co + '"]'); if (sd) sd.classList.toggle('hov', on);
    }
    layer.addEventListener('mouseover', function (e) { wake(e, true); });
    layer.addEventListener('mouseout', function (e) { wake(e, false); });
    fit(); addEventListener('resize', fit);
    map.view({}, 0);
    rail.addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) show(b.dataset.mode === 'jobs' ? 'jobs' : 'world'); });
    pill.addEventListener('click', function () { if (panelEl) panelClose(); else panelOpen(); });
    cred = root.querySelector('.sp-cred');
    cred.addEventListener('click', function () { if (steps.some(function (x) { return x.id === 's2-credits'; })) go('s2-credits'); });
    fab = root.querySelector('.sp-fab');
    fab.addEventListener('click', function () { if (steps.some(function (x) { return x.id === 's2-coach'; })) go('s2-coach'); else show('coach'); });
    /* the four lines of the plan, one press away wherever the rail is */
    help = root.querySelector('.sp-help');
    help.addEventListener('click', function () { show('plan', { back: cur && cur.id !== 'plan' ? cur.id : 'world' }); });
    dev.addEventListener('click', function (e) {
      var g = e.target.closest('[data-go]'), a = e.target.closest('[data-a]');
      if (g) { dev.classList.remove('open'); go(g.dataset.go); }
      else if (a) { if (a.dataset.a === 'menu') dev.classList.toggle('open'); else if (a.dataset.a === 'next') next(); else prev(); }
    });
    document.addEventListener('click', function (e) { if (!dev.contains(e.target)) dev.classList.remove('open'); });
    addEventListener('keydown', function (e) {
      if (/input|textarea/i.test((e.target.tagName || ''))) return;
      if (e.key === ']') next(); else if (e.key === '[') prev(); else if (e.key === 'Escape') { dev.classList.remove('open'); panelClose(); }
