    var want = (location.hash || '').slice(1) || (new URLSearchParams(location.search).get('s') || '');
    go(seq().some(function (x) { return x.id === want; }) ? want : seq()[0].id);
    window.SP.ready = true;
  }

  window.SP = { screen: screen, step: step, go: go, show: show, next: next, prev: prev, state: state, map: map, I: I, logo: logo, steps: steps, ready: false, setMoment: setMoment,
    get current() { return cur; }, get currentStep() { return curStep; } };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else setTimeout(boot, 0);
})();

/* screens/dream.js */
/* The dream. Two questions on the city itself, then the plan in four lines.
   Left is where you answer, right is the city answering back: the camera flies to the building you pick,
   the job stands on it with its lock, and the road to it is drawn stop by stop. */
(function () {
  'use strict';

  /* ---------- 1 and 2: where, and which job ---------- */
  SP.screen({
    id: 'dream', tone: 'world', chrome: {},
    mount: function (root, api, opts) {
      var D = api.data, st = api.state, step = opts.step || 'co', back = opts.back;   // back = changing the job later: return there, keep the points
      root.innerHTML = '<div class="dr-panel sp-glass"><div class="dr-body"></div></div>';
      var body = root.querySelector('.dr-body');

      function look(co, close) {
        var h = D.HEART[co], rf = D.ROOF[co];
        api.map.view({ cx: h[0], cy: (h[1] + rf[1]) / 2 + (rf[2] === 'b' ? 1.5 : -1), s: close ? 2.5 : 2.15, fx: .665, fy: .5 }, 1500);
      }
      function stand(showCard) {
        api.map.draw({ road: false, stops: false, chips: 'none', dest: showCard ? 'locked' : 'none', beam: true, litDream: true, dream: st.dream });
      }

      function company() {
        step = 'co';
        body.innerHTML =
          '<h1 class="sp-h1 dr-h">Where do you want to work?</h1>' +
          '<p class="sp-p dr-sub">These came from your vision board. Pick the one to aim at first.</p>' +
          '<div class="dr-grid">' + D.DREAMS.map(function (co) {
            return '<button type="button" class="dr-co' + (co === st.dream.co ? ' on' : '') + '" data-co="' + co + '">' + api.logo(co, 40) + '<span>' + D.CO[co] + '</span><i>' + api.I.tick + '</i></button>';
          }).join('') + '</div>' +
          '<div class="dr-foot"><button type="button" class="sp-key dr-go">Continue' + api.I.arrow + '</button></div>';
        api.map.shade(.72, 0, 0);
        stand(false); look(st.dream.co, false);
      }
      function role() {
        step = 'role';
        var name = D.CO[st.dream.co];
        body.innerHTML =
          '<button type="button" class="dr-back" aria-label="Back">' + api.I.left + '</button>' +
          '<h1 class="sp-h1 dr-h">Which job at ' + name + '?</h1>' +
          '<p class="sp-p dr-sub">' + (back ? 'Your ' + D.fmt(st.pts) + ' skill points come with you.' : 'Each one opens at a level. Higher takes more scenarios.') + '</p>' +
          '<div class="dr-rungs">' + D.RUNGS.map(function (r) {
            var n = D.scenariosTo(r.level, st.pts);
            return '<button type="button" class="dr-rung' + (r.id === st.dream.rung ? ' on' : '') + '" data-rung="' + r.id + '">' +
              '<span class="lv"><b>' + r.level + '</b><em>Level</em></span>' +
              '<span class="tx"><b>' + r.title + '</b><em>About ' + n + ' scenarios. ' + r.pay + '.</em></span><i>' + api.I.tick + '</i></button>';
          }).join('') + '</div>' +
          '<div class="dr-foot"><button type="button" class="sp-key dr-go">' + (back ? 'Change to this' : 'This is the one') + api.I.arrow + '</button></div>';
        api.map.shade(.72, 0, 0);
        stand(true); look(st.dream.co, true);
      }

      root.addEventListener('click', function (e) {
        var c = e.target.closest('[data-co]'), r = e.target.closest('[data-rung]');
        if (c) {
          st.dream.co = c.dataset.co;
          Array.prototype.forEach.call(root.querySelectorAll('.dr-co'), function (b) { b.classList.toggle('on', b === c); });
          stand(false); look(st.dream.co, false);
        } else if (r) {
          st.dream.rung = r.dataset.rung;
          Array.prototype.forEach.call(root.querySelectorAll('.dr-rung'), function (b) { b.classList.toggle('on', b === r); });
          stand(true);
        } else if (e.target.closest('.dr-back')) { swap(company); }
        else if (e.target.closest('.dr-go')) { if (step === 'co') swap(role); else if (back) api.show(back); else api.go('plan'); }
      });
      function swap(fn) { body.classList.add('out'); api.later(200, function () { fn(); body.classList.remove('out'); }); }

      if (step === 'role') role(); else company();
    }
  });

  /* ---------- 3: the plan. Four lines, each one shown on the city as it is said. ---------- */
  SP.screen({
    id: 'plan', tone: 'world', chrome: {},
    mount: function (root, api, opts) {
      opts = opts || {};   // opts.back = opened later from "How it works": the button returns there and nothing is reset
      var D = api.data, st = api.state, rg = D.rung(st.dream.rung), name = D.CO[st.dream.co];
      var n = D.scenariosTo(rg.level, st.pts), g1 = D.gates(st.dream)[0], first = D.rolesAt(st.dream, g1).filter(function (r) { return !r.dream; });
      var LINES = [
        { ic: api.lock(30), t: '<b>' + rg.title + ' at ' + name + '</b> is locked. It opens at Level ' + rg.level + '.' },
        { ic: '<span class="pl-ic">' + api.star(16) + '</span>', t: '<b>Scenarios pay skill points.</b> Better work pays more, up to ' + D.fmt(D.SCENARIO_MAX) + ' each.' },
        { ic: '<span class="pl-ic">' + api.ring(1, .62, 30) + '</span>', t: '<b>You start at Level 1.</b> ' + D.fmt(D.PER_LEVEL) + ' skill points is a level, about one solid scenario.' },
        { ic: api.tick(30), t: '<b>Some levels open real roles on the way.</b> The first open at Level ' + g1 + (first.length ? ': ' + D.CO[first[0].co] + (first[1] ? ' and ' + D.CO[first[1].co] : '') : '') + '. Zero applies with you.' }
      ];
      root.innerHTML =
        '<div class="dr-panel pl sp-glass"><div class="dr-body">' +
          '<h1 class="sp-h1 dr-h">Here is how you get there.</h1>' +
          '<ol class="pl-list">' + LINES.map(function (l, i) { return '<li data-i="' + i + '">' + l.ic + '<p>' + l.t + '</p></li>'; }).join('') + '</ol>' +
          '<div class="dr-foot"><button type="button" class="sp-key dr-go">' + (opts.back ? 'Got it' : 'Start scenario 1' + api.I.arrow) + '</button>' +
          '<span class="pl-count">About ' + n + ' scenarios to ' + name + '</span></div>' +
        '</div></div>';
      var li = root.querySelectorAll('.pl-list li'), foot = root.querySelector('.dr-foot'), shown = -1;
      var zone = { x: 640, y: 96, w: 880, h: 660 };

      function beat(i) {
        if (i <= shown) return; shown = i;
        for (var k = 0; k <= i; k++) li[k].classList.add('on');
        Array.prototype.forEach.call(li, function (x, k) { x.classList.toggle('now', k === i); });
        if (i === 0) {
          var h = D.HEART[st.dream.co], rf = D.ROOF[st.dream.co];
          api.map.draw({ road: false, stops: false, chips: 'none', dest: 'locked', beam: true, litDream: true });
          api.map.view({ cx: h[0], cy: (h[1] + rf[1]) / 2, s: 2.3, fx: .675, fy: .5 }, 1200);
        } else if (i === 1) {
          api.map.fit(api.map.points(st.dream), zone, 1800);
          api.map.draw({ chips: 'none', dest: 'locked', beam: true, litDream: true, reveal: true, roles: true, done: opts.back ? st.done : 0 });
        } else if (i === 3) {
          api.map.layer().classList.add('mp-show-roles');
        }
        if (i === LINES.length - 1) foot.classList.add('on');
      }
      api.map.shade(.72, 0, 0);
      beat(0);
      api.later(2600, function () { beat(1); });
      api.later(5600, function () { beat(2); });
      api.later(8000, function () { beat(3); });
      root.addEventListener('click', function (e) {
        var l = e.target.closest('.pl-list li');
        if (e.target.closest('.dr-go')) { if (opts.back) api.show(opts.back); else api.go('world-0'); }
        else if (l) { for (var k = shown + 1; k <= +l.dataset.i; k++) beat(k); }
        else if (!e.target.closest('.dr-foot') && shown < LINES.length - 1) beat(shown + 1);
      });
    }
  });
})();

/* screens/world.js */
/* The world: home in Learn mode. The road to the job you want runs through the city, the next scenario is
   lit, and its card says what it pays and which roles it opens. Also the summit: the day the job opens. */
(function () {
  'use strict';

  SP.screen({
    id: 'world', tone: 'world', chrome: { rail: 'learn', pill: true },
    mount: function (root, api) {
      var D = api.data, st = api.state, SC = D.SCENARIOS, rg = D.rung(st.dream.rung), lv = D.level(st.pts);
      var need = D.need(st.dream), allDone = st.done >= need, open = lv >= rg.level, name = D.CO[st.dream.co];
      var sel = allDone ? 'd' : st.done, shown = null, tHover = 0;

      /* arriving with a scenario finished since the city was last seen: the marker walks there first */
      var from = (st.seenDone != null && st.seenDone < st.done && !allDone) ? st.seenDone : null;
      st.seenDone = st.done;

      api.map.shade(.3, .62, 0);
      api.map.fit(api.map.points(st.dream), { x: 130, y: 104, w: 1010, h: 650 }, 1500);
      api.map.draw({ chips: from == null ? 'now' : 'none', done: from == null ? st.done : from, you: true, beam: 'soft', dest: open ? 'open' : 'locked' });

      root.innerHTML = '<div class="wd-card sp-glass"></div>';
      var card = root.querySelector('.wd-card');

      function rolesList(list, st2) {
        return '<ul>' + list.map(function (r) {
          var s = D.roleState(r, st2 || st);
          return '<li>' + api.logo(r.co, 30) + '<span class="tx"><b>' + r.title + '</b><em>' + D.CO[r.co] + '</em></span>' + (s === 'locked' ? api.lock(22) : api.tick(22)) + '</li>';
        }).join('') + '</ul>';
      }
      /* not every level opens roles. When this one does, show them; when it does not, say what it is and how far the next roles are */
      function leads(after, opens, verb, far) {
        if (opens.length) return '<div class="wd-opens' + (far ? ' far' : '') + '"><p>' + verb + ' <b>Level ' + after + '</b>, which opens</p>' + rolesList(opens.slice(0, 3)) +
          (opens.length > 3 ? '<p class="wd-more">and ' + (opens.length - 3) + ' more</p>' : '') + '</div>';
        var ng = D.nextGate(st.dream, after), m = D.MILES[after], gap = ng ? ng - after : 0;
        return '<div class="wd-opens none' + (far ? ' far' : '') + '"><p>' + verb + ' <b>Level ' + after + '</b>' + (m ? ': ' + m.title.charAt(0).toLowerCase() + m.title.slice(1) + '.' : '.') + '</p>' +
          (ng ? '<p class="wd-gap">' + api.lock(22) + '<span>Roles open at <b>Level ' + ng + '</b>, ' + gap + (gap === 1 ? ' level' : ' levels') + ' on.</span></p>' : '') + '</div>';
      }
      function html(key) {

  function payFor(lv) { return ['$32 an hour', '$36 an hour', '$42 an hour', '$74,000 to 88,000', '$86,000 to 100,000', '$98,000 to 116,000'][Math.min(5, lv)]; }
  function roleById(st, id) { return all(st).filter(function (r) { return r.id === id; })[0]; }
  /* the box holds what the scouts found since you last looked, and only roles your level opened */

      api.map.shade(0, 0, .62);

      /* the week of the streak: days already kept, and today, the next one */
      var kept = st.streak % 7, today = kept + 1, pay = today === 7 ? CR.streakWeek : CR.streakDay;
      var ways = [['Finish a stage', '+' + CR.stage], ['Finish a scenario', '+' + CR.scenario], ['Level up', '+' + CR.levelUp],
        ['Keep your streak', '+' + CR.streakDay + ' a day'], ['Invite a friend', '+' + CR.invite]];
      var days = '';
      for (var d = 1; d <= 7; d++) {
        var cls = d <= kept ? 'kept' : d === today ? 'today' : '';
        days += '<li class="' + cls + (d === 7 ? ' chest' : '') + '" data-d="' + d + '"><span class="dot">' +
          (d === 7 ? CHEST : d <= kept ? api.I.tick : '+' + CR.streakDay) + '</span><em>' + (d === 7 ? '+' + CR.streakWeek : d === today ? 'Today' : 'Day ' + d) + '</em></li>';
      }

      root.innerHTML =
        '<div class="cr-panel sp-glass">' +
          '<div class="cr-bal lt-in" style="--i:0">' + coin(34) + '<b class="sp-num">' + D.fmt(st.credits) + '</b></div>' +
          '<p class="cr-unit lt-in" style="--i:1">Credits</p>' +
          '<ol class="cr-week lt-in" style="--i:2">' + days + '</ol>' +
          '<button type="button" class="sp-key cr-get lt-in" style="--i:3"><span>Collect today\'s ' + pay + '</span></button>' +
          '<p class="cr-rule lt-in" style="--i:4">Skill points can\'t be bought. Only your work earns them.</p>' +
          '<section class="cr-how lt-in" style="--i:5"><h2>How you earn</h2><ul>' + ways.map(function (w) {
            return '<li><span>' + esc(w[0]) + '</span><b>' + coin(14) + esc(w[1]) + '</b></li>';
          }).join('') + '</ul></section>' +
        '</div>';
      centre(api, q(root, '.cr-panel'), 8);

      var get = q(root, '.cr-get'), bal = q(root, '.cr-bal b');
      get.addEventListener('click', function () {
        if (get.disabled) return;
        get.disabled = true;
        var from = st.credits, cell = q(root, '.cr-week li.today');
        st.credits += pay; st.streak += 1; api.later(900, api.drawPill);
        if (cell) { cell.classList.remove('today'); cell.classList.add('kept', 'now'); if (today < 7) q(cell, '.dot').innerHTML = api.I.tick; q(cell, 'em').textContent = 'Day ' + today; }
        /* the balance counts up from where it was */
        var n = 18, i = 0;
        (function tick() { i++; bal.textContent = D.fmt(from + Math.round(pay * (1 - Math.pow(1 - i / n, 3)))); if (i < n) api.later(32, tick); })();
        q(get, 'span').innerHTML = api.I.tick + 'Collected';
        get.classList.add('done');
      });
    }
  });
})();

/* steps.js */
/* The three systems, each told as one site. A step is a screen at a moment, inside one system.
   sys: 1 Scenarios, 2 Levels and Coach, 3 Jobs. title: the one line the strip shows. where: where it lives in the product.
   ties: what crosses to or from the other systems at this moment ({ out: true } = leaves this system).
   dur: how long the step holds before the site plays the next one.
   Story: Sanjay aims at Product Designer at Apple (a Level 10 company). Level 0 at the start, one solid scenario is Level 1. */

  ties: [{ sys: 2, t: 'Level 0' }] });
