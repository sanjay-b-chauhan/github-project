<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Zero · levels · b3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,100..1000&display=swap">
<link rel="stylesheet" href="zero-level-system-assets-b3/journey.css">
</head>
<body>
<div class="app">

  <header class="bar">
    <img class="wm" src="zero-level-system-assets-b3/zero-wordmark.svg" alt="zero">
    <span class="tag">b3</span>
    <div class="cases" id="cases"></div>
    <div class="ctl">
      <button class="ib" id="play" aria-label="Play or pause"></button>
      <button class="ib" id="again" aria-label="Start over"></button>
      <button class="tb" id="speed" aria-label="Speed">1x</button>
      <button class="tb" id="tune" aria-expanded="false">Change the rules</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <svg class="wires" id="wires" aria-hidden="true"></svg>

    <aside class="left">
      <div class="card who">
        <img src="zero-level-system-assets-b3/maya.jpg" alt="Maya Reyes">
        <div><b id="lvNow"></b><span id="ptNow"></span></div>
      </div>
      <div class="card mot">
        <div class="mh"><span>Motivation</span><b id="motNow"></b></div>
        <div class="mbar" id="motBar"></div>
      </div>
      <div class="coach" id="coach">
        <div class="ch"><span>Coach</span><button class="tog" id="coachSw" role="switch" aria-label="Coach on or off"></button></div>
        <p class="cl" id="coachLine"></p>
        <div id="coachRows"></div>
      </div>
      <div class="card fx" id="fx"></div>
      <div class="legend" id="legend"></div>
    </aside>

    <section class="card mid" id="mid">
      <div class="lane lv" id="laneLv"><svg id="lvSvg"></svg></div>
      <div class="lane mo" id="laneMo"><span class="ll">Motivation</span><svg id="moSvg"></svg></div>
      <div class="lane sc" id="laneSc"><span class="ll">Scenarios</span><div id="scCells"></div></div>
    </section>

    <section class="card jobs">
      <div class="colh"><b>Job portal</b><span class="open" id="jobCount"></span></div>
      <div id="groups"></div>
    </section>
  </main>

  <div class="tune" id="tunePanel" hidden>
    <div class="th"><b>What a scenario pays</b><button class="tb" id="reset">Reset</button></div>
    <div id="payRows"></div>
    <div class="th"><b>Where jobs open</b></div>
    <div id="gateRows"></div>
    <div class="sw"><span>Weaker work stops at a gate</span><button class="tog" id="hold" role="switch" aria-label="Weaker work stops at a gate"></button></div>
    <div class="th"><b>The coach</b></div>
    <div id="coachRules"></div>
  </div>
</div>
<script src="zero-level-system-assets-b3/engine.js"></script>
<script src="zero-level-system-assets-b3/journey.js"></script>
</body>
</html>
