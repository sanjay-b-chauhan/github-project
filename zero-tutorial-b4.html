.ch-workspace .ws-fmeta i{font-style:normal;font-family:var(--f-mono);font-size:11px;font-weight:700;line-height:1.3;letter-spacing:.8px;text-transform:uppercase;color:var(--ws-tx-3);white-space:nowrap}
.ch-workspace .ws-cap{text-align:right;font-family:var(--f-mono);font-size:11px;font-weight:700;line-height:1.4;letter-spacing:.8px;text-transform:uppercase;color:var(--ws-tx-3);margin-top:6px}
.ch-workspace .ws-subm.ws-analyzing .ws-att{box-shadow:0 0 0 1.5px rgba(63,185,104,.45)}
.ch-workspace .ws-subm.ws-analyzing .ws-att::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 32%,rgba(63,185,104,.22) 50%,transparent 68%);background-size:220% 100%;animation:ws-sweep 1.5s var(--zt-ease) infinite}
/* "reading", then "reviewed" */
.ch-workspace .ws-synth{align-self:flex-start;display:flex;align-items:center;gap:9px;padding:0 3px;margin-top:-9px;min-width:0}
.ch-workspace .ws-sy-ic{flex:0 0 auto;width:23px;height:23px;border-radius:99px;background:var(--ws-bubble);border:1px solid var(--ws-line);display:grid;place-items:center;color:var(--ws-tx-2)}
.ch-workspace .ws-sy-ic svg{width:12px;height:12px}
.ch-workspace .ws-sy-t{font-size:13.5px;line-height:1.4;color:var(--ws-tx-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .4s var(--zt-ease)}
.ch-workspace .ws-synth.ws-live .ws-sy-ic{animation:ws-pulse 1.5s var(--zt-ease) infinite}
.ch-workspace .ws-synth.ws-done .ws-sy-t{color:var(--ws-tx-2);font-weight:500}
.ch-workspace .ws-time{align-self:center;font-size:12px;font-weight:500;line-height:1;color:var(--ws-tx-2);background:var(--ws-soft);border:1px solid var(--ws-line-2);padding:7px 12px;border-radius:99px}

/* ---------- composer. Its block never changes height: the pill grows upward over the chip row,
   so the thread above it never resizes. Only Submit is the learner's: the chips, the plus, the
   field and the guided switch are worked by Navid's pointer, so they do not take a click ---------- */
.ch-workspace .ws-composer{flex:0 0 151px;position:relative;padding:0 24px;transition:opacity .5s var(--zt-ease)}
.ch-workspace .ws-floor{position:absolute;left:24px;right:24px;bottom:14px}
.ch-workspace .ws-chips{height:46px;padding:0 6px}
.ch-workspace .ws-chiprow{display:inline-flex;gap:9px;border-radius:999px;opacity:0;transform:translateY(4px);transition:opacity .3s var(--zt-ease),transform .4s var(--zt-ease)}
.ch-workspace .ws-chiprow.ws-on{opacity:1;transform:none}
.ch-workspace .ws-chip{appearance:none;pointer-events:none;font-size:13.5px;font-weight:600;line-height:1;letter-spacing:-.01em;white-space:nowrap;padding:10px 15px;border-radius:99px;
  border:1px solid var(--ws-line);background:var(--ws-card);color:var(--ws-tx)}
.ch-workspace .ws-pill{display:flex;flex-direction:column;min-height:91px;background:var(--ws-soft);border:1px solid var(--ws-line);border-radius:26px}
.ch-workspace .ws-attrow{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--zt-ease)}
.ch-workspace .ws-attrow>div{overflow:hidden;min-height:0}
.ch-workspace .ws-pill.ws-has-att .ws-attrow{grid-template-rows:1fr}
.ch-workspace .ws-file{display:inline-flex;align-items:center;gap:9px;max-width:300px;margin:10px 10px 0;padding:6px 14px 6px 6px;border:1px solid var(--ws-line);border-radius:12px;background:var(--ws-card)}
.ch-workspace .ws-ftile{flex:0 0 auto;width:30px;height:30px;border-radius:8px;background:var(--ws-hover);display:grid;place-items:center;color:var(--ws-tx-2)}
.ch-workspace .ws-ftile svg{width:17px;height:17px}
.ch-workspace .ws-input{appearance:none;display:block;width:100%;min-width:0;pointer-events:none;background:none;border:0;outline:0;color:var(--ws-tx);font:inherit;font-size:15px;line-height:1.5;letter-spacing:-.01em;padding:13px 18px 4px}
.ch-workspace .ws-input::placeholder{color:var(--ws-tx-3)}
.ch-workspace .ws-ctrl{display:flex;align-items:center;gap:4px;padding:4px 8px 8px;margin-top:auto}
.ch-workspace .ws-grow{flex:1}
.ch-workspace .ws-plus{appearance:none;border:0;pointer-events:none;flex:0 0 auto;width:38px;height:38px;border-radius:99px;display:grid;place-items:center;background:none;color:var(--ws-tx-2)}
.ch-workspace .ws-plus svg{width:20px;height:20px}
/* guided mode: the composer's own switch */
.ch-workspace .ws-guided{appearance:none;border:0;pointer-events:none;flex:0 0 auto;display:flex;align-items:center;gap:8px;height:30px;padding:0 12px 0 4px;border-radius:99px;background:none;color:var(--ws-tx-2);letter-spacing:-.01em}
.ch-workspace .ws-g-track{position:relative;flex:0 0 auto;width:36px;height:20px;border-radius:99px;background:var(--ws-line);transition:background .48s var(--zt-ease)}
.ch-workspace .ws-g-k{position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:99px;background:var(--ws-tx-2);transition:transform .48s var(--zt-ease),background .48s var(--zt-ease)}
.ch-workspace .ws-g-l{font-size:13px;font-weight:600;line-height:1;transition:color .4s var(--zt-ease)}
.ch-workspace .ws-guided.ws-on .ws-g-track{background:var(--ws-guided)}
.ch-workspace .ws-guided.ws-on .ws-g-k{transform:translateX(16px);background:#fff}
.ch-workspace .ws-guided.ws-on .ws-g-l{color:var(--ws-tx)}
/* send. With the draft in the composer it reads Submit, and it is the one control that takes a click */
.ch-workspace .ws-send{appearance:none;border:0;pointer-events:none;flex:0 0 auto;height:38px;min-width:38px;padding:0 9px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--ws-hover);color:var(--ws-tx-4);font-size:14px;font-weight:600;line-height:1;letter-spacing:-.01em;transition:background .3s var(--zt-ease),color .3s var(--zt-ease),transform .24s var(--zt-ease)}
.ch-workspace .ws-send svg{width:20px;height:20px;flex:0 0 auto}
.ch-workspace .ws-send-t{display:none}
.ch-workspace .ws-pill.ws-has-att .ws-send{pointer-events:auto;cursor:pointer;padding:0 11px 0 17px;background:#fff;color:#111}
.ch-workspace .ws-pill.ws-has-att .ws-send-t{display:inline}
.ch-workspace .ws-pill.ws-has-att .ws-send svg{width:18px;height:18px}
.ch-workspace .ws-pill.ws-has-att .ws-send:hover{transform:scale(1.04)}
.ch-workspace .ws-pill.ws-has-att .ws-send:active{transform:scale(.98)}
.ch-workspace .ws-composer.ws-quiet{opacity:.55}

/* ---------- right panel and coach: two inset cards ----------
   A column makes room by growing from zero, and the chat glides over. The card itself never
   slides: it is held against the right edge of its column, so it is already where it will end
   up, and it arrives by un-blurring a little. Nothing is ever cut by the edge of the canvas. */
.ch-workspace .ws-right,.ch-workspace .ws-coach{flex:0 0 0;min-width:0;display:flex;justify-content:flex-end;padding:54px 0 14px;transition:flex-basis var(--ws-shift) var(--zt-ease)}
.ch-workspace.ws-right-open .ws-right{flex-basis:376px}
.ch-workspace.ws-coach-open .ws-coach{flex-basis:352px}
.ch-workspace .ws-card{flex:0 0 auto;margin-right:12px;display:flex;flex-direction:column;overflow:hidden;background:var(--ws-bg);border:1px solid var(--ws-line);border-radius:18px;box-shadow:0 1px 3px rgba(0,0,0,.4);
  opacity:0;visibility:hidden;pointer-events:none;transform:translateX(16px) scale(.985);filter:blur(8px);
  transition:opacity .5s var(--zt-ease) .16s,transform .7s var(--zt-ease) .16s,filter .5s var(--zt-ease) .16s}
.ch-workspace .ws-rcard{width:364px}
.ch-workspace .ws-ccard{width:340px;transition-delay:.3s}
.ch-workspace.ws-right-open .ws-rcard,.ch-workspace.ws-coach-open .ws-ccard{opacity:1;visibility:visible;pointer-events:auto;transform:none;filter:none}
.ch-workspace .ws-rhead{flex:0 0 54px;display:flex;align-items:center;gap:8px;padding:0 12px 0 22px}
.ch-workspace .ws-rname{flex:1;min-width:0;font-family:var(--f-mono);font-size:12.5px;line-height:1;letter-spacing:1.4px;text-transform:uppercase;color:var(--ws-tx-2)}
.ch-workspace .ws-rtog{width:30px;height:30px;display:grid;place-items:center;color:var(--ws-tx-3)}
.ch-workspace .ws-rtog svg{width:19px;height:19px}
.ch-workspace .ws-rbody{flex:1;min-height:0;position:relative;padding:0 12px 18px}

/* the draft, being read */
.ch-workspace .ws-doc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:10px;transition:opacity .4s var(--zt-ease),filter .4s var(--zt-ease),transform .5s var(--zt-ease)}
.ch-workspace.ws-fb-on .ws-doc{opacity:0;filter:blur(8px);transform:scale(.98);pointer-events:none}
.ch-workspace .ws-page{position:relative;width:316px;border-radius:12px;background:#f6f5f3;color:#1f1d1e;padding:26px 14px 14px;overflow:hidden}
.ch-workspace .ws-pg-t{font-size:18.5px;font-weight:700;line-height:1.25;letter-spacing:-.02em;padding:0 12px}
.ch-workspace .ws-pg-by{font-size:12px;line-height:1.3;color:rgba(31,29,30,.52);margin-top:4px;padding:0 12px}
.ch-workspace .ws-sec{position:relative;margin-top:12px;padding:12px 42px 14px 12px;border-radius:9px;transition:background .45s var(--zt-ease)}
.ch-workspace .ws-sec-h{font-size:12px;font-weight:600;line-height:1.2;color:rgba(31,29,30,.52);margin-bottom:8px}
.ch-workspace .ws-sec-b{font-size:14.5px;font-weight:600;line-height:1.3;margin-bottom:10px}
.ch-workspace .ws-ln{display:block;height:6px;border-radius:9px;background:rgba(31,29,30,.11)}
.ch-workspace .ws-ln+.ws-ln{margin-top:7px}
.ch-workspace .ws-bars{display:flex;flex-direction:column;gap:6px}
.ch-workspace .ws-bars span{display:flex;align-items:center;justify-content:flex-end;height:8px;border-radius:9px;background:rgba(31,29,30,.13)}
.ch-workspace .ws-bars span:first-child{height:20px;border-radius:6px;background:#1f1d1e}
.ch-workspace .ws-bars b{font-size:11.5px;font-weight:700;line-height:1;color:#f6f5f3;padding-right:7px}
.ch-workspace .ws-gap{height:28px;margin-top:10px;border-radius:7px;border:1.5px dashed rgba(31,29,30,.2);display:grid;place-items:center;transition:border-color .4s var(--zt-ease)}
.ch-workspace .ws-gap span{font-size:11.5px;font-weight:700;line-height:1;color:var(--ws-fix);opacity:0;transition:opacity .4s var(--zt-ease)}
.ch-workspace .ws-sec-mk{position:absolute;right:12px;top:10px;width:18px;height:18px;border-radius:99px;display:grid;place-items:center;color:#fff;border:1.5px solid transparent;opacity:0;transform:scale(.4);
  transition:opacity .25s var(--zt-ease),transform .45s cubic-bezier(.34,1.56,.64,1)}
.ch-workspace .ws-sec-mk i{position:absolute;inset:0;display:none;place-items:center}
.ch-workspace .ws-sec-mk svg{width:10px;height:10px}
.ch-workspace .ws-sec.ws-ok{background:rgba(63,185,104,.12)}

.ch-workspace .ws-sec.ws-ok .ws-i-tick{display:grid}
.ch-workspace .ws-sec.ws-bad{background:rgba(255,106,77,.11)}
.ch-workspace .ws-sec.ws-bad .ws-sec-mk{opacity:1;transform:none;border-color:var(--ws-fix);color:var(--ws-fix)}
.ch-workspace .ws-sec.ws-bad .ws-i-bang{display:grid}
.ch-workspace .ws-sec.ws-bad .ws-gap{border-color:var(--ws-fix)}
.ch-workspace .ws-sec.ws-bad .ws-gap span{opacity:1}
.ch-workspace .ws-scanline{position:absolute;left:0;right:0;top:0;height:64px;margin-top:-64px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,rgba(73,186,97,0),rgba(73,186,97,.2));border-bottom:2px solid var(--zt-green);transition:opacity .3s var(--zt-ease)}
.ch-workspace .ws-page.ws-scanning .ws-scanline{opacity:1;animation:ws-scan var(--ws-scan,1.4s) linear forwards}
.ch-workspace .ws-scan-note{margin-top:16px;font-size:13px;line-height:1.3;color:var(--ws-tx-2);font-variant-numeric:tabular-nums}

/* the feedback */
.ch-workspace .ws-fb{position:relative;padding:4px 10px 0;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .45s var(--zt-ease) .14s,transform .6s var(--zt-ease) .14s}
.ch-workspace.ws-fb-on .ws-fb{opacity:1;transform:none;pointer-events:auto}
.ch-workspace .ws-band-l{width:fit-content;font-size:20px;font-weight:700;line-height:1.22;letter-spacing:-.02em}

.ch-workspace .ws-track{display:flex;gap:5px;margin-top:13px}
.ch-workspace .ws-track i{flex:1;height:3px;border-radius:99px;background:var(--ws-hover);transition:background .6s var(--zt-ease)}
.ch-workspace .ws-track i.ws-lit{background:var(--ws-meets)}

.ch-workspace .ws-grades{display:flex;gap:5px;margin-top:8px}
.ch-workspace .ws-grades span{flex:1;min-width:0;font-family:var(--f-mono);font-size:11px;font-weight:700;line-height:1.4;letter-spacing:.2px;text-transform:uppercase;color:var(--ws-tx-3);transition:color .5s var(--zt-ease)}

.ch-workspace .ws-gate{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:7px 12px 7px 10px;border-radius:99px;font-family:var(--f-mono);font-size:11px;font-weight:700;line-height:1;letter-spacing:1.1px;text-transform:uppercase;white-space:nowrap;
  color:var(--ws-fix);background:rgba(255,106,77,.09);border:1px solid rgba(255,106,77,.3);transition:color .5s var(--zt-ease),background .5s var(--zt-ease),border-color .5s var(--zt-ease)}
.ch-workspace .ws-gate i{flex:0 0 auto;width:6px;height:6px;border-radius:99px;background:currentColor}
.ch-workspace .ws-fsec-h{display:flex;align-items:baseline;margin:22px 0 2px}
.ch-workspace .ws-fcnt{margin-left:auto;font-family:var(--f-mono);font-size:11px;line-height:1.5;color:var(--ws-tx-3);font-variant-numeric:tabular-nums}
.ch-workspace .ws-fmet{border-radius:14px}
.ch-workspace .ws-fi{display:flex;gap:13px;padding:11px 11px;margin:0 -9px;border-radius:14px;transition:background .5s var(--zt-ease),box-shadow .5s var(--zt-ease)}
.ch-workspace .ws-fb-b{flex:1;min-width:0}
.ch-workspace .ws-fmark{position:relative;flex:0 0 auto;width:23px;height:23px;border-radius:99px;display:grid;place-items:center;border:1.5px solid var(--ws-line);color:var(--ws-tx-3);
  transition:background .35s var(--zt-ease),border-color .35s var(--zt-ease),color .35s var(--zt-ease),box-shadow .35s var(--zt-ease)}
.ch-workspace .ws-fmark i{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transform:scale(.4);transition:opacity .25s var(--zt-ease),transform .4s var(--zt-ease)}
.ch-workspace .ws-fmark svg{width:13.5px;height:13.5px}
.ch-workspace .ws-fi.ws-met .ws-fmark{background:var(--ws-ok);border-color:var(--ws-ok);color:#fff;box-shadow:inset 0 2px 5px rgba(255,255,255,.4),inset 0 -3px 8px rgba(0,0,0,.12)}
.ch-workspace .ws-fi.ws-met .ws-i-tick{opacity:1;transform:none}
.ch-workspace .ws-fixrow{margin-top:6px;background:var(--ws-soft);box-shadow:inset 0 0 0 1px var(--ws-line-2)}
.ch-workspace .ws-fixrow .ws-fmark{border-color:rgba(255,106,77,.55);color:var(--ws-fix)}
.ch-workspace .ws-fixrow .ws-i-bang{opacity:1;transform:none}
.ch-workspace .ws-fixrow.ws-checking .ws-fmark::after{inset:-5px;border-top-color:var(--ws-fix)}
.ch-workspace .ws-ft{font-size:14px;font-weight:600;line-height:1.38}
.ch-workspace .ws-fnote{font-size:13px;line-height:1.5;color:var(--ws-tx-2);margin-top:2px;transition:color .45s var(--zt-ease)}
.ch-workspace .ws-fchips{display:flex;gap:6px;margin-top:9px}
.ch-workspace .ws-fchip{font-family:var(--f-mono);font-size:11px;font-weight:700;line-height:1;letter-spacing:.9px;text-transform:uppercase;padding:5px 8px 4px;border-radius:6px;white-space:nowrap;
  color:var(--ws-fix);background:rgba(255,106,77,.13);transition:color .45s var(--zt-ease),background .45s var(--zt-ease)}
.ch-workspace .ws-why{margin-top:12px}
.ch-workspace .ws-why .ws-fnote{margin-top:3px}
/* the fix, cleared */

/* calibrating: a meter reading itself. It gives way, in the same place, to what the coach saw */

.ch-workspace .ws-clive>*{grid-area:1/1}
.ch-workspace .ws-cal{align-self:start;display:flex;align-items:center;gap:11px;padding:19px 4px 0;opacity:0;visibility:hidden;transform:translateY(8px);filter:blur(5px);

.ch-workspace.ws-cal-on .ws-cal-m i:nth-child(3){animation-delay:.24s}

.ch-workspace.ws-seen-on .ws-cal{opacity:0;visibility:hidden;transform:translateY(-6px);filter:blur(5px);transition-delay:0s,0s,0s,.5s}
.ch-workspace .ws-seen{display:flex;flex-direction:column;gap:6px}
.ch-workspace .ws-obs{display:flex;align-items:flex-start;gap:12px;padding:10px 2px;opacity:0;transform:translateY(10px);filter:blur(6px);transition:opacity .45s var(--zt-ease),transform .6s var(--zt-ease),filter .45s var(--zt-ease)}

.ch-workspace .ws-obs-ic{flex:0 0 auto;width:34px;height:34px;border-radius:99px;display:grid;place-items:center;background:var(--ws-hover);box-shadow:inset 0 0 0 1px var(--ws-line);color:var(--ws-tx)}

.ch-workspace .ws-obs-b{flex:1;min-width:0;padding-top:1px}
.ch-workspace .ws-obs-l{display:block;font-size:12px;line-height:1.2;color:var(--ws-tx-3)}
.ch-workspace .ws-obs-t{font-size:14px;line-height:1.45;margin-top:4px;text-wrap:balance}

/* ---------- motion helpers ---------- */
/* laid out in one go: no entrance while the screen is being built, or while a final box is being measured */
.ch-workspace.ws-instant *,.ch-workspace.ws-instant *::before,.ch-workspace.ws-instant *::after{animation:none!important;transition:none!important}
.ch-workspace.ws-still,.ch-workspace.ws-still *{transition:none!important}
@keyframes ws-rise{from{opacity:0;transform:translateY(10px)}}
@keyframes ws-bob{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
@keyframes ws-spin{to{transform:rotate(360deg)}}
@keyframes ws-pop{0%{transform:scale(1)}45%{transform:scale(1.24)}100%{transform:scale(1)}}
@keyframes ws-pulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.1);opacity:1}}
@keyframes ws-sweep{0%{background-position:170% 0}100%{background-position:-170% 0}}
@keyframes ws-scan{from{top:0}to{top:calc(100% + 64px)}}
@keyframes ws-swap{from{opacity:0;filter:blur(6px);transform:translateY(5px)}}
@keyframes ws-meter{0%,100%{opacity:.25;transform:scaleY(.55)}40%{opacity:1;transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){
  .ch-workspace .ws-right,.ch-workspace .ws-coach{transition-duration:.01s}
  .ch-workspace .ws-card{transition-duration:.01s;transition-delay:0s}
  .ch-workspace .ws-msgs>.ws-new,.ch-workspace .ws-band-l.ws-swap{animation:none}
}

@keyframes pf-portfolio-send{0%{opacity:0;transform:translate(0,0) scale(.55)}14%{opacity:1}82%{opacity:1}100%{opacity:0;transform:translate(var(--pf-dx),-14px) scale(.8)}}

.ch-portfolio .pf-ph h2,.ch-portfolio .pf-rh h2{font:500 23px/30px var(--f-serif);letter-spacing:-.02em;margin:0;color:var(--pf-ink)}
.ch-portfolio .pf-count{display:inline-block;font:400 15px/27px var(--f-sans);color:var(--pf-ink3);font-variant-numeric:tabular-nums;padding-top:3px}
.ch-portfolio .pf-openn{display:inline-block;font:400 15px/27px var(--f-sans);color:var(--pf-ink3);font-variant-numeric:tabular-nums;padding-top:3px;white-space:nowrap}
/* the two things that move with the time-lapse share one look: the month, and the skill points */

.ch-portfolio .pf-row{position:absolute;left:96px;top:232px;width:1408px;height:368px;display:grid;grid-template-columns:repeat(4,334px);column-gap:24px;

.ch-portfolio .pf-slot{position:relative;border-radius:30px}

.ch-portfolio .pf-card{position:absolute;inset:0;border-radius:30px;background:#fff;border:1px solid var(--pf-line2);display:flex;flex-direction:column;overflow:hidden;

/* the presentation: its title slide, the presenter in the corner, and how it was rated */

.ch-portfolio .pf-g3{background:linear-gradient(142deg,#FAF8FB 0%,#EDE9F1 100%)}
.ch-portfolio .pf-sl{position:absolute;left:11%;right:11%;top:11%;bottom:11%;border-radius:11px;background:#fff;border:1px solid var(--pf-line2);
  padding:13px 15px 12px;display:flex;flex-direction:column}
.ch-portfolio .pf-sl-co{display:flex;align-items:center;gap:6px;font:500 10.5px/13px var(--f-sans);color:var(--pf-ink2)}
.ch-portfolio .pf-sl-co img{display:block;width:13px;height:13px;object-fit:contain}
.ch-portfolio .pf-sl-t{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;max-width:72%}
.ch-portfolio .pf-sl-t b{font:500 15px/1.17 var(--f-serif);letter-spacing:-.02em;color:var(--pf-ink);text-wrap:balance}

.ch-portfolio .pf-pip{position:absolute;right:6%;bottom:8%;width:62px;height:62px;border-radius:12px;border:2px solid #fff;background:#e9e6e0;

.ch-portfolio .pf-card h3{font:500 19px/1.24 var(--f-serif);letter-spacing:-.02em;margin:8px 0 0;color:var(--pf-ink);text-wrap:balance}

.ch-portfolio .pf-pill{display:inline-flex;align-items:center;gap:6px;height:28px;min-width:0;padding:0 12px 0 9px;border-radius:999px;background:var(--pf-sunk);

.ch-portfolio .pf-pill svg{width:13px;height:13px;flex:none}
.ch-portfolio .pf-pill span{min-width:0;overflow:hidden;text-overflow:ellipsis}

/* small values that move with the time-lapse: the text is set first, this is only the tick */
.ch-portfolio .pf-tick{animation:pf-portfolio-tick .5s var(--zt-ease)}
@keyframes pf-portfolio-tick{0%{opacity:.15;transform:translateY(7px);filter:blur(4px)}100%{opacity:1;transform:none;filter:none}}

/* ---------- roles: the same four the learner met in the world. Title, tier, open or closed. ---------- */
.ch-portfolio .pf-jobs{position:absolute;left:96px;top:658px;width:1408px;height:66px;display:grid;grid-template-columns:repeat(4,334px);column-gap:24px;
  transition:opacity .5s var(--zt-ease)}
.ch-portfolio .pf-job{position:relative;display:flex;align-items:center;gap:12px;min-width:0;padding:0 14px 0 13px;border-radius:20px;border:1px solid transparent;
  transition:background .4s var(--zt-ease),border-color .4s var(--zt-ease),transform .6s var(--zt-ease)}
.ch-portfolio .pf-job::before{content:"";position:absolute;inset:-1px;border-radius:20px;border:1.5px dashed rgba(31,29,30,.18);transition:opacity .3s var(--zt-ease)}
.ch-portfolio .pf-job.pf-in{background:#fff;border-color:var(--pf-line2)}
.ch-portfolio .pf-job.pf-in::before{opacity:0}
.ch-portfolio .pf-jm{position:relative;flex:none;width:32px;height:32px;border-radius:50%;background:var(--pf-sunk);color:var(--pf-ink3);

.ch-portfolio .pf-jx{flex:1;min-width:0;display:block}
.ch-portfolio .pf-jx b{display:block;font:600 16.5px/1.2 var(--f-sans);color:var(--pf-ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .4s var(--zt-ease)}

.ch-portfolio .pf-job.pf-in .pf-js{font-weight:600;color:var(--pf-ok)}

/* ---------- the finished project, coming together in front ---------- */
.ch-portfolio:not(.pf-flown) .pf-row,.ch-portfolio:not(.pf-flown) .pf-ph,.ch-portfolio:not(.pf-flown) .pf-rh,.ch-portfolio:not(.pf-flown) .pf-jobs{opacity:.55}
.ch-portfolio .pf-build{position:absolute;z-index:3;left:580px;top:128px;width:440px;border-radius:36px;background:#fff;border:1px solid var(--pf-line2);
  padding:26px 26px 24px;height:var(--pf-bh,auto);transform-origin:0 0;overflow:hidden;
  box-shadow:0 34px 70px -30px rgba(31,29,30,.28),0 3px 12px rgba(31,29,30,.045);
  transition:transform .8s var(--zt-ease),height .8s var(--zt-ease),border-radius .8s var(--zt-ease),box-shadow .7s var(--zt-ease),opacity .28s var(--zt-ease) .8s,visibility 0s linear 1.1s}

.ch-portfolio .pf-b-co{display:flex;align-items:center;gap:9px;font:500 14px/22px var(--f-sans);color:var(--pf-ink2)}
.ch-portfolio .pf-b-co img{display:block;width:22px;height:22px;object-fit:contain}
.ch-portfolio .pf-b-t{font:500 26px/1.14 var(--f-serif);letter-spacing:-.022em;margin:14px 0 0;color:var(--pf-ink);text-wrap:balance}
.ch-portfolio .pf-parts{display:flex;flex-direction:column;gap:8px;margin-top:22px}
.ch-portfolio .pf-part{display:flex;align-items:center;gap:14px;height:62px;padding:0 16px 0 11px;border-radius:20px;background:var(--pf-sunk)}
.ch-portfolio .pf-pt{flex:none;width:58px;height:40px;border-radius:11px;background:#fff;border:1px solid var(--pf-line2);display:grid;place-items:center;color:var(--pf-ink2);overflow:hidden}

.ch-portfolio .pf-mini{position:relative;display:block;width:100%;height:100%;background:linear-gradient(142deg,#FBF8F6 0%,#EDE4DD 100%)}
.ch-portfolio .pf-mini-s{position:absolute;left:7px;top:6px;right:10px;bottom:7px;border-radius:3.5px;background:#fff;box-shadow:0 0 0 1px var(--pf-line2);
  display:flex;flex-direction:column;justify-content:center;gap:3px;padding-left:5px}

.ch-portfolio .pf-mini-s i+i{width:9px;height:1.5px;background:var(--pf-ink4)}
.ch-portfolio .pf-mini-p{position:absolute;right:4px;bottom:4px;width:13px;height:13px;border-radius:4px;background:#f2d57b;border:1.5px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.12)}
.ch-portfolio .pf-px{flex:1;min-width:0;display:block}
.ch-portfolio .pf-px small{display:block;font:400 12.5px/1.2 var(--f-sans);color:var(--pf-ink3)}

.ch-portfolio .pf-pt,.ch-portfolio .pf-px{opacity:.36;transform:translateY(3px);transition:opacity .35s var(--zt-ease),transform .45s var(--zt-ease)}
.ch-portfolio .pf-part.pf-on .pf-pt,.ch-portfolio .pf-part.pf-on .pf-px{opacity:1;transform:none}
.ch-portfolio .pf-mk{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px dashed var(--pf-ink4);display:grid;place-items:center;color:#06210f;

@media (prefers-reduced-motion:reduce){
  .ch-portfolio .pf-page *,.ch-portfolio .pf-build,.ch-portfolio .pf-build *{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}
}

/* ch/09-jobs.css */
/* 9 · the job portal, inside the pop-up. The warm canvas of the ZERO Job Portal: the portfolio
   snapshot and the level on the left, the companies and the one floating sheet of roles in the
   middle, the job search on the right. Every state is a class, the motion is decoration. */
.ch-jobs{background:#F8F7F5;color:#1A1917;font-family:var(--f-sans);letter-spacing:-.014em;
  --jp-bg:#F8F7F5;--jp-field:#F1F0ED;--jp-wash:#FAF9F7;--jp-sunk:#EDEBE7;
  --jp-hair:rgba(13,13,13,.08);--jp-line:rgba(26,25,23,.14);
  --jp-tx:#1A1917;--jp-tx2:#5D5A54;--jp-tx3:#747068;--jp-tx4:#A9A49B;--jp-ink:#141312;
  --jp-ok:#0C7E45;--jp-okbg:#E9F6EE;--jp-gold:#E0A020;--jp-amb:#88680D;--jp-ambbg:#FBF3DE}
.ch-jobs .jp-page{position:absolute;inset:0}
.ch-jobs img{display:block;object-fit:contain}
.ch-jobs em{font-style:normal}

/* everything takes its place by rising a little. If the animation never runs, it is simply there. */
.ch-jobs .jp-rise{animation:jp-jobs-rise .56s var(--zt-ease) backwards;animation-delay:calc(var(--jp-i,0) * 40ms)}
@keyframes jp-jobs-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* small values that change: the text is set first, this is only the tick */
.ch-jobs .jp-tick{animation:jp-jobs-tick .46s var(--zt-ease)}
@keyframes jp-jobs-tick{from{opacity:.15;transform:translateY(7px)}to{opacity:1;transform:none}}

/* ---------- the portal's own bar ---------- */
.ch-jobs .jp-top{position:absolute;left:0;right:0;top:0;height:68px}
.ch-jobs .jp-wm{position:absolute;left:56px;top:27px;width:52px;height:15px;color:var(--jp-tx)}
.ch-jobs .jp-wm svg{display:block;width:100%;height:100%}
.ch-jobs .jp-wm img{width:100%;height:100%}
.ch-jobs .jp-seg{position:absolute;left:50%;top:16px;transform:translateX(-50%);display:flex;gap:2px}
.ch-jobs .jp-seg span{display:flex;align-items:center;height:36px;padding:0 16px;border-radius:999px;font:500 14.5px/1 var(--f-sans);color:var(--jp-tx3);white-space:nowrap}
.ch-jobs .jp-seg .jp-on{background:var(--jp-field);color:var(--jp-tx);font-weight:600}
.ch-jobs .jp-me{position:absolute;right:56px;top:16px;width:36px;height:36px;border-radius:50%;background:#f2d57b;display:grid;place-items:center;font:500 15px/1 var(--f-sans);color:#1f1d1e}
.ch-jobs .jp-title{position:absolute;left:56px;top:80px;margin:0;font:400 32px/40px var(--f-serif);letter-spacing:-.035em;color:var(--jp-tx)}

/* ---------- the portfolio, as the snapshot the companies get ---------- */
.ch-jobs .jp-pf{position:absolute;left:56px;top:136px;width:344px;height:404px;padding:16px;border-radius:20px;background:#fff;border:1px solid var(--jp-hair)}
.ch-jobs .jp-pf-h{display:flex;align-items:center;gap:12px;height:46px}
.ch-jobs .jp-ava{flex:none;width:46px;height:46px;border-radius:50%;background:#f2d57b;display:grid;place-items:center;font:500 18px/1 var(--f-sans);color:#1f1d1e}
.ch-jobs .jp-id{flex:1;min-width:0;display:block}
.ch-jobs .jp-id b{display:block;font:600 16.5px/21px var(--f-sans);color:var(--jp-tx)}
.ch-jobs .jp-id span{display:block;margin-top:1px;font:400 14px/18px var(--f-sans);color:var(--jp-tx2);white-space:nowrap}
.ch-jobs .jp-score{flex:none;display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px;border-radius:999px;border:1px solid var(--jp-line);color:var(--jp-tx)}
.ch-jobs .jp-score b{font:500 16px/1 var(--f-serif);letter-spacing:-.02em}
.ch-jobs .jp-leaf{display:block;width:9px;height:19px;flex:none}
.ch-jobs .jp-leaf-l{transform:scaleX(-1)}
.ch-jobs .jp-vis{position:relative;height:200px;margin-top:14px;border-radius:14px;background:#F3EEE9;border:1px solid var(--jp-hair);overflow:hidden}
.ch-jobs .jp-vis.jp-press{animation:jp-jobs-press .34s var(--zt-ease)}
@keyframes jp-jobs-press{0%{transform:scale(1)}32%{transform:scale(.972)}100%{transform:scale(1)}}
.ch-jobs .jp-sl{position:absolute;left:30px;right:30px;top:22px;bottom:22px;border-radius:10px;background:#fff;border:1px solid var(--jp-hair);padding:14px 16px;display:flex;flex-direction:column}
.ch-jobs .jp-sl-co{display:flex;align-items:center;gap:6px;font:500 13px/16px var(--f-sans);color:var(--jp-tx2)}
.ch-jobs .jp-sl-co img{width:15px;height:15px}
.ch-jobs .jp-sl-t{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;max-width:76%}
.ch-jobs .jp-sl-t b{font:500 18px/1.16 var(--f-serif);letter-spacing:-.02em;color:var(--jp-tx);text-wrap:balance}
.ch-jobs .jp-sl-t i{display:block;width:24px;height:2px;border-radius:2px;background:var(--jp-ink);margin-top:9px}
.ch-jobs .jp-pip{position:absolute;right:18px;bottom:14px;width:52px;height:52px;border-radius:12px;border:2px solid #fff;background:#e9e6e0;display:grid;place-items:center;box-shadow:0 6px 16px rgba(26,25,23,.12)}
.ch-jobs .jp-pip span{width:30px;height:30px;border-radius:50%;background:#f2d57b;display:grid;place-items:center;font:500 13.5px/1 var(--f-sans);color:#1f1d1e}
.ch-jobs .jp-pr-h{display:flex;align-items:baseline;gap:8px;height:20px;margin-top:16px;font:600 15px/20px var(--f-sans);color:var(--jp-tx)}
.ch-jobs .jp-pr-n{display:inline-block;font-weight:400;color:var(--jp-tx3);font-variant-numeric:tabular-nums}
.ch-jobs .jp-prs{display:grid;grid-template-columns:repeat(4,1fr);column-gap:10px;height:64px;margin-top:10px}
.ch-jobs .jp-pr{position:relative;display:block;border-radius:14px}
.ch-jobs .jp-pr::before{content:"";position:absolute;inset:0;border-radius:14px;border:1.5px dashed rgba(26,25,23,.18);transition:opacity .3s var(--zt-ease)}
.ch-jobs .jp-pr>span{position:absolute;inset:0;border-radius:14px;background:var(--jp-wash);border:1px solid var(--jp-hair);display:grid;place-items:center;
  opacity:0;transform:translateY(9px) scale(.84);transition:opacity .3s var(--zt-ease),transform .5s var(--zt-ease)}
.ch-jobs .jp-pr img{width:26px;height:26px}
.ch-jobs .jp-pr em{font:500 13px/1 var(--f-sans);color:var(--jp-tx2)}
.ch-jobs .jp-pr.jp-in::before{opacity:0}
.ch-jobs .jp-pr.jp-in>span{opacity:1;transform:none}

/* ---------- the level: points, a stop for every role, the tiers under it ---------- */
.ch-jobs .jp-sk{position:absolute;left:56px;top:556px;width:344px;height:188px;padding:20px;border-radius:20px;background:#fff;border:1px solid var(--jp-hair)}
.ch-jobs .jp-sk-h{font:600 15px/20px var(--f-sans);color:var(--jp-tx)}
.ch-jobs .jp-sk-n{display:flex;align-items:center;gap:9px;height:46px;margin-top:8px;transform-origin:0 50%;transition:transform .45s var(--zt-ease)}
.ch-jobs .jp-sk-n svg{flex:none;width:26px;height:26px;color:var(--jp-gold)}
.ch-jobs .jp-sk-n b{display:inline-block;font:400 40px/46px var(--f-serif);letter-spacing:-.035em;color:var(--jp-tx)}
/* while the level is climbing, the number is the thing to watch */
.ch-jobs .jp-sk.jp-up .jp-sk-n{transform:scale(1.07)}
.ch-jobs .jp-bar{position:relative;height:8px;margin-top:22px;border-radius:99px;background:var(--jp-sunk)}
.ch-jobs .jp-fill{position:absolute;left:0;top:0;bottom:0;width:var(--jp-p,0%);border-radius:99px;background:#E8B93C;transition:width .6s var(--zt-ease)}
.ch-jobs .jp-stop{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;border:2px solid #D8D3CA;
  transition:border-color .3s var(--zt-ease),background .3s var(--zt-ease),transform .45s var(--zt-ease)}
.ch-jobs .jp-stop.jp-in{border-color:#E8B93C;background:#E8B93C;box-shadow:inset 0 0 0 2.5px #fff;transform:scale(1.14)}
.ch-jobs .jp-tiers{position:relative;height:18px;margin-top:14px}
.ch-jobs .jp-tiers span{position:absolute;top:0;transform:translateX(-50%);font:500 14px/18px var(--f-sans);color:var(--jp-tx4);white-space:nowrap;transition:color .35s var(--zt-ease)}
.ch-jobs .jp-tiers span.jp-in{color:var(--jp-tx)}

/* ---------- the companies the portfolio goes to ---------- */
.ch-jobs .jp-lane{position:absolute;left:440px;top:76px;width:700px;height:124px;display:grid;grid-template-columns:repeat(6,1fr)}
.ch-jobs .jp-co{display:flex;flex-direction:column;align-items:center}
.ch-jobs .jp-disc{position:relative;width:84px;height:84px;margin-top:4px;border-radius:50%;background:#fff;border:1px solid var(--jp-hair);display:grid;place-items:center;
  box-shadow:0 14px 28px -18px rgba(26,25,23,.4),0 1px 2px rgba(26,25,23,.04)}
.ch-jobs .jp-disc img{width:38px;height:38px}
.ch-jobs .jp-disc em{font:600 13px/1 var(--f-sans);color:var(--jp-tx2)}
/* each company that has the portfolio gets its own tick */
.ch-jobs .jp-chk{position:absolute;right:-3px;bottom:-3px;width:28px;height:28px;border-radius:50%;background:var(--jp-ok);color:#fff;border:2.5px solid var(--jp-bg);display:grid;place-items:center;
  opacity:0;transform:scale(.3);transition:opacity .2s var(--zt-ease),transform .42s var(--zt-ease)}
.ch-jobs .jp-chk svg{width:12px;height:12px}
.ch-jobs .jp-co.jp-got .jp-chk{opacity:1;transform:none}
.ch-jobs .jp-co.jp-got .jp-disc{animation:jp-jobs-catch .46s var(--zt-ease)}
.ch-jobs .jp-co .jp-disc.jp-ping{animation:jp-jobs-ping .5s var(--zt-ease)}
@keyframes jp-jobs-catch{0%{transform:scale(1)}36%{transform:scale(1.09)}100%{transform:scale(1)}}
@keyframes jp-jobs-ping{0%{transform:scale(1)}30%{transform:scale(.93)}62%{transform:scale(1.06)}100%{transform:scale(1)}}
.ch-jobs .jp-co>b{margin-top:10px;font:500 14px/20px var(--f-sans);color:var(--jp-tx2)}

/* the portfolio in flight. One layer carries it across, the other lifts it and drops it in. Its end state is to be gone. */
.ch-jobs .jp-copy,.ch-jobs .jp-rep{position:absolute;z-index:6;left:0;top:0;width:0;height:0;pointer-events:none}
.ch-jobs .jp-copy>i{position:absolute;left:-36px;top:-46px;width:72px;height:92px;border-radius:13px;background:#fff;border:1px solid var(--jp-hair);box-shadow:0 12px 26px -12px rgba(26,25,23,.42);opacity:0}
.ch-jobs .jp-copy b{position:absolute;left:9px;top:9px;width:18px;height:18px;border-radius:50%;background:#f2d57b}
.ch-jobs .jp-copy span{position:absolute;left:33px;top:12px;width:26px;height:3.5px;border-radius:2px;background:rgba(26,25,23,.55)}
.ch-jobs .jp-copy span+span{top:20px;width:18px;background:rgba(26,25,23,.26)}
.ch-jobs .jp-copy em{position:absolute;left:9px;right:9px;top:36px;bottom:10px;border-radius:7px;background:#F3EEE9;border:1px solid var(--jp-hair)}
.ch-jobs .jp-copy em::after{content:"";position:absolute;left:8px;top:12px;width:22px;height:3.5px;border-radius:2px;background:rgba(26,25,23,.5)}
.ch-jobs .jp-rep>i{position:absolute;left:-25px;top:-25px;width:50px;height:50px;border-radius:16px;background:#fff;border:1px solid var(--jp-hair);box-shadow:0 12px 24px -10px rgba(26,25,23,.44);display:grid;place-items:center;opacity:0}
.ch-jobs .jp-rep img{width:26px;height:26px}
.ch-jobs .jp-rep .jp-date{width:100%;height:100%;border:0;border-radius:15px}
.ch-jobs .jp-rep em{font:600 13px/1 var(--f-sans);color:var(--jp-tx2)}
.ch-jobs .jp-copy.jp-go{animation:jp-jobs-across .7s var(--zt-ease) both}
.ch-jobs .jp-copy.jp-go>i{animation:jp-jobs-lift .7s var(--zt-ease) both}
.ch-jobs .jp-rep.jp-go{animation:jp-jobs-over .76s var(--zt-ease) both}
.ch-jobs .jp-rep.jp-go>i{animation:jp-jobs-back .76s var(--zt-ease) both}
@keyframes jp-jobs-across{from{transform:translateX(0)}to{transform:translateX(var(--jp-dx))}}
@keyframes jp-jobs-lift{0%{opacity:0;transform:translateY(0) scale(.72)}10%{opacity:1}46%{transform:translateY(calc(var(--jp-dy) - 30px)) scale(1)}86%{opacity:1}100%{opacity:0;transform:translateY(var(--jp-dy)) scale(.4)}}
/* an answer goes up and over: it clears the row of companies, crosses above the sheet, then comes down onto its step */
@keyframes jp-jobs-over{0%{transform:translateX(0)}14%{transform:translateX(0)}66%{transform:translateX(var(--jp-dx))}100%{transform:translateX(var(--jp-dx))}}
@keyframes jp-jobs-back{0%{opacity:0;transform:translateY(0) scale(.6)}10%{opacity:1}24%{transform:translateY(-46px) scale(1)}50%{transform:translateY(-46px) scale(1)}90%{opacity:1}100%{opacity:0;transform:translateY(var(--jp-dy)) scale(.84)}}

/* ---------- the one floating sheet: the roles, and the one button ---------- */
.ch-jobs .jp-sheet{position:absolute;left:440px;top:256px;width:700px;height:488px;padding:20px;border-radius:24px;background:#fff;border:1px solid var(--jp-hair);
  box-shadow:0 1px 2px rgba(26,25,23,.04),0 26px 50px -34px rgba(26,25,23,.34)}
.ch-jobs .jp-sh-h{position:relative;display:flex;align-items:center;height:48px;padding:0 4px}
.ch-jobs .jp-sh-h h2{margin:0;font:400 26px/48px var(--f-serif);letter-spacing:-.03em;color:var(--jp-tx)}
/* the key from the Zero site, at this size: it arrives when Navid gets to it */
.ch-jobs .jp-apply{position:absolute;right:0;top:1px;height:46px;padding:0 12px 0 20px;display:inline-flex;align-items:center;gap:11px;appearance:none;border:0;border-radius:15px;cursor:pointer;
  background:linear-gradient(#303432,#181A19);color:#fff;font:500 15.5px/1 var(--f-sans);letter-spacing:-.01em;white-space:nowrap;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -3px 0 rgba(0,0,0,.5),0 0 0 1px #121413,0 12px 20px -12px rgba(18,20,19,.5);
  opacity:0;transform:translateY(9px) scale(.93);pointer-events:none;
  transition:opacity .3s var(--zt-ease),transform .5s var(--zt-ease),filter .2s var(--zt-ease)}
.ch-jobs .jp-apply i{min-width:24px;height:24px;padding:0 7px;border-radius:8px;background:rgba(255,255,255,.15);display:grid;place-items:center;font:600 13px/1 var(--f-sans);font-style:normal;font-variant-numeric:tabular-nums}
.ch-jobs .jp-armed .jp-apply{opacity:1;transform:none;pointer-events:auto}
.ch-jobs .jp-armed .jp-apply:hover{filter:brightness(1.14)}
.ch-jobs .jp-armed .jp-apply:active{transform:translateY(1px) scale(.985)}
.ch-jobs .jp-sent .jp-apply{opacity:0;transform:scale(.92);pointer-events:none}
.ch-jobs .jp-appd{position:absolute;right:0;top:6px;height:36px;padding:0 13px 0 10px;display:inline-flex;align-items:center;gap:7px;border-radius:11px;background:var(--jp-okbg);color:var(--jp-ok);
  font:600 14.5px/1 var(--f-sans);white-space:nowrap;pointer-events:none;opacity:0;transform:translateY(9px) scale(.93);transition:opacity .3s var(--zt-ease) .14s,transform .5s var(--zt-ease) .14s}
.ch-jobs .jp-appd svg{width:14px;height:14px}
.ch-jobs .jp-sent .jp-appd{opacity:1;transform:none}

.ch-jobs .jp-roles{display:grid;grid-auto-rows:88px;row-gap:12px;margin-top:12px}
.ch-jobs .jp-role{position:relative;display:flex;align-items:center;gap:14px;padding:0 18px 0 16px;border-radius:18px;transition:background .4s var(--zt-ease)}
.ch-jobs .jp-role::before{content:"";position:absolute;inset:0;border-radius:18px;border:1.5px dashed rgba(26,25,23,.17);pointer-events:none;transition:opacity .3s var(--zt-ease)}
.ch-jobs .jp-role.jp-open{background:#F4F3F0;animation:jp-jobs-open .5s var(--zt-ease)}
.ch-jobs .jp-role.jp-open::before{opacity:0}
.ch-jobs .jp-role.jp-applied{animation:jp-jobs-applied .4s var(--zt-ease)}
@keyframes jp-jobs-open{0%{transform:scale(.985)}42%{transform:scale(1.012)}100%{transform:scale(1)}}
@keyframes jp-jobs-applied{0%{transform:scale(1)}34%{transform:scale(.988)}100%{transform:scale(1)}}
.ch-jobs .jp-lg{flex:none;width:54px;height:54px;border-radius:15px;background:#fff;border:1px solid var(--jp-hair);display:grid;place-items:center;opacity:.5;filter:grayscale(1);
  transition:opacity .4s var(--zt-ease),filter .4s var(--zt-ease)}
.ch-jobs .jp-lg img{width:28px;height:28px}
.ch-jobs .jp-lg em{font:600 13px/1 var(--f-sans);color:var(--jp-tx2)}
.ch-jobs .jp-role.jp-open .jp-lg{opacity:1;filter:none}
.ch-jobs .jp-rx{flex:1;min-width:0;display:block}
.ch-jobs .jp-rx b{display:block;font:600 16.5px/21px var(--f-sans);color:var(--jp-tx3);white-space:nowrap;transition:color .4s var(--zt-ease)}
.ch-jobs .jp-role.jp-open .jp-rx b{color:var(--jp-tx)}
.ch-jobs .jp-rx small{display:block;margin-top:3px;font:400 14px/18px var(--f-sans);color:var(--jp-tx3);white-space:nowrap}
.ch-jobs .jp-tier{flex:none;display:inline-flex;align-items:center;height:28px;padding:0 11px;border-radius:9px;background:var(--jp-field);font:500 13.5px/1 var(--f-sans);color:var(--jp-tx3);white-space:nowrap;
  transition:background .4s var(--zt-ease),color .4s var(--zt-ease)}
.ch-jobs .jp-role.jp-open .jp-tier{background:#fff;color:var(--jp-tx2)}
/* the higher tier wears the colour of the star that opens it */
.ch-jobs .jp-role.jp-open .jp-tier.jp-hi{background:var(--jp-ambbg);color:var(--jp-amb)}
/* locked, open, applied: three states in one place */
.ch-jobs .jp-st{position:relative;flex:none;width:118px;height:34px}
.ch-jobs .jp-st>span{position:absolute;right:0;top:0;height:34px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:opacity .28s var(--zt-ease),transform .45s var(--zt-ease)}
.ch-jobs .jp-need{padding:0 12px 0 10px;border-radius:999px;background:var(--jp-field);font:500 14.5px/1 var(--f-sans);color:var(--jp-tx2);font-variant-numeric:tabular-nums}
.ch-jobs .jp-need svg{flex:none;width:14px;height:14px;color:var(--jp-tx3)}
.ch-jobs .jp-need svg+svg{color:var(--jp-gold)}
.ch-jobs .jp-isopen,.ch-jobs .jp-isapp{font:600 15px/1 var(--f-sans);color:var(--jp-tx);opacity:0;transform:translateY(9px)}
.ch-jobs .jp-isapp{gap:7px}
.ch-jobs .jp-isapp i{width:20px;height:20px;border-radius:50%;background:var(--jp-ok);color:#fff;display:grid;place-items:center;transform:scale(.3);transition:transform .42s var(--zt-ease) .06s}
.ch-jobs .jp-isapp svg{width:11px;height:11px}
.ch-jobs .jp-role.jp-open .jp-need{opacity:0;transform:translateY(-9px) scale(.94)}
.ch-jobs .jp-role.jp-open .jp-isopen{opacity:1;transform:none}
.ch-jobs .jp-role.jp-applied .jp-isopen{opacity:0;transform:translateY(-9px)}
.ch-jobs .jp-role.jp-applied .jp-isapp{opacity:1;transform:none}
.ch-jobs .jp-role.jp-applied .jp-isapp i{transform:none}

/* ---------- the job search: what has happened, and what is next ---------- */
.ch-jobs .jp-rail{position:absolute;left:1180px;top:80px;width:364px;display:grid;grid-auto-rows:80px;row-gap:14px}
.ch-jobs .jp-step{position:relative;display:flex;align-items:center;gap:13px;padding:0 14px;border-radius:18px;border:1px solid transparent;
  transition:background .4s var(--zt-ease),border-color .4s var(--zt-ease),box-shadow .4s var(--zt-ease)}
.ch-jobs .jp-step.jp-cur{background:#fff;border-color:var(--jp-hair);box-shadow:0 1px 2px rgba(26,25,23,.04),0 16px 30px -24px rgba(26,25,23,.34);animation:jp-jobs-land .5s var(--zt-ease)}
@keyframes jp-jobs-land{0%{transform:scale(.97)}44%{transform:scale(1.018)}100%{transform:scale(1)}}
.ch-jobs .jp-step+.jp-step::before{content:"";position:absolute;left:24px;top:-39px;width:2px;height:62px;border-radius:2px;background:#DEDAD2;transition:background .4s var(--zt-ease)}
.ch-jobs .jp-step+.jp-step.jp-on::before{background:var(--jp-ink)}
.ch-jobs .jp-mk{position:relative;z-index:1;flex:none;width:24px;height:24px;border-radius:50%;border:2px solid #CFCAC1;background:var(--jp-bg);color:#fff;display:grid;place-items:center;
  transition:background .3s var(--zt-ease),border-color .3s var(--zt-ease),box-shadow .3s var(--zt-ease)}
.ch-jobs .jp-mk svg{width:12px;height:12px;opacity:0;transform:scale(.3);transition:opacity .2s var(--zt-ease),transform .42s var(--zt-ease)}
.ch-jobs .jp-step.jp-on .jp-mk{border-color:var(--jp-ink);background:var(--jp-ink);box-shadow:inset 0 0 0 4.5px #fff}
.ch-jobs .jp-step.jp-done .jp-mk{box-shadow:inset 0 0 0 0 #fff}
.ch-jobs .jp-step.jp-done .jp-mk svg{opacity:1;transform:none}
.ch-jobs .jp-sx{flex:1;min-width:0;display:block}
.ch-jobs .jp-sx b{display:block;font:600 16px/21px var(--f-sans);color:#9A958C;white-space:nowrap;transition:color .35s var(--zt-ease)}
.ch-jobs .jp-step.jp-on .jp-sx b{color:var(--jp-tx)}
.ch-jobs .jp-sx small{display:block;height:0;font:400 14px/18px var(--f-sans);color:var(--jp-tx2);white-space:nowrap;font-variant-numeric:tabular-nums;opacity:0;transform:translateY(6px);
  transition:height .4s var(--zt-ease),margin .4s var(--zt-ease),opacity .3s var(--zt-ease),transform .45s var(--zt-ease)}
.ch-jobs .jp-step.jp-has .jp-sx small{height:18px;margin-top:2px;opacity:1;transform:none}
.ch-jobs .jp-slot{flex:none;width:46px;height:46px;display:grid;place-items:center;opacity:0;transform:scale(.5);transition:opacity .25s var(--zt-ease),transform .45s var(--zt-ease)}
.ch-jobs .jp-step.jp-done .jp-slot{opacity:1;transform:none}
.ch-jobs .jp-tile{width:42px;height:42px;border-radius:13px;background:#fff;border:1px solid var(--jp-hair);display:grid;place-items:center}
.ch-jobs .jp-tile img{width:22px;height:22px}
.ch-jobs .jp-tile em{font:600 13px/1 var(--f-sans);color:var(--jp-tx2)}
.ch-jobs .jp-date{width:46px;height:46px;border-radius:13px;background:var(--jp-wash);border:1px solid var(--jp-hair);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ch-jobs .jp-date small{font:600 13px/14px var(--f-sans);color:var(--jp-tx2)}
.ch-jobs .jp-date b{margin-top:1px;font:400 19px/19px var(--f-serif);letter-spacing:-.02em;color:var(--jp-tx)}

/* ---------- the offer: one calm moment over the page ---------- */
.ch-jobs .jp-hero{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:96px;pointer-events:none;visibility:hidden;
  background:rgba(248,247,245,0);transition:background .5s var(--zt-ease),visibility 0s var(--zt-ease) .5s}
.ch-jobs.jp-hired .jp-hero{visibility:visible;background:rgba(248,247,245,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:background .5s var(--zt-ease),visibility 0s}
.ch-jobs .jp-hero>span,.ch-jobs .jp-hero>h2,.ch-jobs .jp-hero>.jp-h-card{position:relative;z-index:1;opacity:0;transform:translateY(18px) scale(.96);transition:opacity .4s var(--zt-ease),transform .7s var(--zt-ease)}
.ch-jobs.jp-hired .jp-hero>span,.ch-jobs.jp-hired .jp-hero>h2,.ch-jobs.jp-hired .jp-hero>.jp-h-card{opacity:1;transform:none}
.ch-jobs.jp-hired .jp-hero>span{transition-delay:.1s}
.ch-jobs.jp-hired .jp-hero>h2{transition-delay:.18s}
.ch-jobs.jp-hired .jp-hero>.jp-h-card{transition-delay:.28s}
.ch-jobs .jp-h-logo{width:76px;height:76px;border-radius:22px;background:#fff;border:1px solid var(--jp-hair);display:grid;place-items:center;box-shadow:0 18px 34px -22px rgba(26,25,23,.4)}
.ch-jobs .jp-h-logo img{width:40px;height:40px}
.ch-jobs .jp-h-logo em{font:600 14px/1 var(--f-sans);color:var(--jp-tx2)}
.ch-jobs .jp-h-t{margin:26px 0 0;font:400 56px/1.04 var(--f-serif);letter-spacing:-.035em;color:var(--jp-tx)}
.ch-jobs .jp-h-card{display:flex;align-items:center;gap:22px;margin-top:26px;padding:14px 14px 14px 20px;border-radius:18px;background:#fff;border:1px solid var(--jp-hair)}
.ch-jobs .jp-h-x{display:block}
.ch-jobs .jp-h-x b{display:block;font:600 16.5px/21px var(--f-sans);color:var(--jp-tx);white-space:nowrap}
.ch-jobs .jp-h-x small{display:block;margin-top:2px;font:400 14px/18px var(--f-sans);color:var(--jp-tx3);white-space:nowrap}
.ch-jobs .jp-h-tag{flex:none;display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px 0 10px;border-radius:11px;background:var(--jp-okbg);color:var(--jp-ok);font:600 14.5px/1 var(--f-sans)}
.ch-jobs .jp-h-tag svg{width:14px;height:14px}
/* a small burst, once. It ends gone. */
.ch-jobs .jp-conf{position:absolute;left:50%;top:372px;width:0;height:0}
.ch-jobs .jp-conf i{position:absolute;left:-3.5px;top:-5.5px;width:7px;height:11px;border-radius:2px;opacity:0}
.ch-jobs.jp-hired .jp-conf i{animation:jp-jobs-burst 1.5s var(--zt-ease) both;animation-delay:calc(.06s + var(--jp-d,0ms))}
@keyframes jp-jobs-burst{0%{opacity:0;transform:translate(0,0) rotate(0deg) scale(.5)}22%{opacity:0}34%{opacity:1}68%{opacity:1}100%{opacity:0;transform:translate(var(--jp-x),var(--jp-y)) rotate(var(--jp-r)) scale(1)}}

@media (prefers-reduced-motion:reduce){

      api.guide.home({ role: 'Founder of Zero' });
      api.later(120, function () { root.classList.add('wd-drift'); });   // the map is alive: one slow drift, nothing else yet
      await api.wait(900);
      await api.say('N3');

      /* the roles first, then the scenarios that lead to them, each on its own sentence. The road
         starts a beat in, so it is being drawn while he says "the scenarios you'll go through". */
      await api.say('N4', { onSeg: function (i, text) {
        if (on(text, /roles/i, 'roles')) arrive('wd-on-roles', 'soft');
        if (on(text, /scenarios/i, 'road')) api.later(600, function () { arrive('wd-on-road', 'soft'); });
      } });
      arrive('wd-on-roles'); arrive('wd-on-road');

      /* the meter, what it leads to, and what happens after every scenario. Each lands on the words
         that name it, a beat into its sentence ("...you earn skill points", "...open roles", "...we apply") */
      await api.say('N5', { onSeg: function (i, text) {
        if (on(text, /earn/i, 'meter')) api.later(900, function () { arrive('wd-on-meter', 'soft'); });
        if (on(text, /^skill points/i, 'link')) api.later(500, function () { arrive('wd-on-meter'); arrive('wd-on-link', 'tick'); });
        if (on(text, /apply/i, 'apply')) api.later(1300, function () { arrive('wd-on-apply'); });
      } });
      arrive('wd-on-meter'); arrive('wd-on-link'); arrive('wd-on-apply');

      /* the choice. The two buttons are the screen: no pill. A click counts as soon as they are up. */
      function ask() { if (S.asked || root.classList.contains('wd-on-ask')) return; S.asked = true; root.classList.add('wd-on-ask'); api.sfx('pop'); }
      var c = await Promise.race([choice, api.say('N6', { onSeg: function (i, text) { if (on(text, /how zero works/i, 'ask')) api.later(450, ask); } }).then(function () { return null; })]);
      if (!c) {
        ask();
        if (api.auto) api.later(1200, function () { if (S.asked) api.click(S.show); });
        c = await choice;
      }

      /* either way the camera stops where it is and the buttons leave. Then: straight to the first
         scenario, or run resolves, the engine opens the pop-up, and this screen stays behind it. */
      hold(root);
      root.classList.remove('wd-on-ask'); api.cursor.hide();
      await api.wait(260);
      if (c === 'start') { api.jump('start', { skipped: true }); return; }
      root.classList.add('wd-rest');
    }
  });

  /* 9 · back in the world: start the first scenario. Runs on the same mounted screen. */
  ZT.chapter({
    id: 'start', order: 9, steps: ['start'], tone: 'dark', bg: BG, window: false, reuse: 'world',

    /* set the screen back to its settled state before it is shown again (it may have been left mid-moment) */
    enter: function (root, api) {
      var S = root._wd;
      root.classList.add('wd-still');
      settle(root, MOMENT, false); settle(root, SHOWN, true);
      S.asked = false; S.hit.tabIndex = -1;
      S.num.textContent = fmt(S.shown);
    },

    run: async function (api) {
      var root = api.root, S = root._wd, did = {};
      var aimed = false, picked = false, onPick = null, asked = false, entered = false, onEnter = null;
      function on(text, re, key) { if (did[key] || !re.test(text || '')) return false; did[key] = 1; return true; }
      api.onExit(function () { S.pick = S.press = S.replay = null; });
      root.classList.remove('wd-still');

      /* Navid is home, and the world has come back into focus, before anything is measured */
      await Promise.all([api.guide.home({ role: 'Founder of Zero' }), api.wait(900)]);

      /* the meter shows what the tour earned. The bar and the roles take their final state now; the number counts up to it. */
      var from = S.shown, to = api.points.get();
      setMeter(root, to);
      if (to !== from) {
        S.num.textContent = fmt(from); api.sfx('good');
        var n = 0, steps = 26, iv = api.every(40, function () {
          n++; S.num.textContent = fmt(from + (to - from) * (1 - Math.pow(1 - n / steps, 3)));
          if (n >= steps) { clearInterval(iv); S.num.textContent = fmt(to); }
        });
      }

      /* the Airbnb stop flashes: the one thing to do. A click counts from the moment it does. */
      S.pick = function () { if (picked || !aimed) return; picked = true; root.classList.add('wd-picked'); if (onPick) onPick(); };
      function aim(point) {
        if (aimed) return; aimed = true;
        root.classList.add('wd-flash'); S.hit.tabIndex = 0; api.sfx('soft');
        if (point) api.point(S.hit, { pad: 4, ax: .46, ay: .2 });   // up on the roof, so his name tag is not on the stop
      }
      if (!api.skipped) await api.say('T17B', { onSeg: function (i, text) { if (on(text, /first scenario/i, 'aim')) aim(true); } });
      aim(false);
      api.clearRings();
      await api.turn({ badge: 'Your turn', text: 'Click your first scenario', tip: 'Click here to start', target: S.hit, pad: 4,
        until: function (done) { if (picked) api.later(260, done); else onPick = done; },
        auto: function () { return api.click(S.hit); } });
      api.clearRings(); api.cursor.hide();

      /* ease in on the building. The roles step aside and the welcome card takes their place. */
      S.hit.tabIndex = -1; S.hit.blur();
      S.cam.style.transition = ''; S.cam.style.transform = '';
      root.classList.remove('wd-flash'); root.classList.add('wd-zoom');
      api.sfx('whoosh');
      await api.wait(1500);

      S.press = function () { if (entered || !asked) return; entered = true; root.classList.add('wd-pressed'); if (onEnter) onEnter(); };
      function key(e) {
        if (e.key !== 'Enter' || e.repeat || e.isComposing) return;
        var t = e.target; if (t && t.closest && t.closest('.zt-dock')) return;   // the tour's own buttons keep their Enter
        e.preventDefault(); if (S.press) S.press();
      }
      window.addEventListener('keydown', key);
      api.onExit(function () { window.removeEventListener('keydown', key); });
      asked = true;
      await api.turn({ badge: 'Your turn', text: 'Press <kbd>Enter</kbd>', target: S.enter, pad: 5,
        until: function (done) { if (entered) api.later(260, done); else onEnter = done; },
        auto: function () { return api.click(S.enter); } });
      window.removeEventListener('keydown', key);
      api.clearRings(); api.cursor.hide();

      /* going in: the card presses, the map pushes into the building */
      root.classList.add('wd-pressed', 'wd-go');
      api.bg('#1E1E1E'); api.sfx('whoosh');
      await api.wait(950);

      /* the prototype's honest last state. Nothing follows it, so this run never resolves. */
      api.bare(true); api.guide.hide();
      S.replay = function () { S.replay = null; api.restart(); };
      root.classList.add('wd-over');
      await new Promise(function () {});
    }
  });
})();

  },

  run: async function (api) {
    var root = api.root, $ = function (s) { return root.querySelector(s); }, d = api.data;
    var slot = $('.ko-slot'), input = $('.ko-in'), list = $('.ko-list'), hint = $('.ko-hint'), tip = $('.ko-hint i'), nudge = $('.ko-nudge'), join = $('.ko-join');
    var TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M7.75 12l2.83 2.83 5.67-5.66"/></svg>';
    var WORDS = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen', 'twenty'];
    var did = {};
    function on(text, re, key) { if (did[key] || !re.test(text || '')) return false; did[key] = 1; return true; }
    function part(name) { $('.ko-l-' + name).classList.add('ko-on'); }

    /* ---------- 1 · the scenario's landing: a project, a manager, Join ---------- */
    await api.wait(240);
    root.classList.add('ko-l-on');                             // the card rises in with the pop-up, still loading
    await api.wait(260);
    await api.say('T1', { onSeg: function (i, text) {
      if (on(text, /enter a scenario/i, 'proj')) api.later(650, function () { part('proj'); });   // "First, we enter a scenario": it is named as he says it
      if (on(text, /a project/i, 'team')) {
        part('proj');
        api.later(2550, function () { part('team'); });       // "...and a manager you'll work with."
        api.later(3500, function () { part('cta'); });
      }
    } });
    part('proj'); part('team'); part('cta');
    await api.wait(250);

    /* Navid's pointer presses Join. The card grows into the room and the meeting is there. */
    join.addEventListener('click', function () { join.classList.add('ko-down'); }, { once: true });
    await api.click(join);
    api.cursor.hide();
    root.classList.add('ko-joining'); api.sfx('whoosh');
    api.bg('#F2F0ED'); api.tone('light');
    await api.wait(430);
    root.classList.add('ko-met');
    input.tabIndex = 0;                                        // the room is up: the notes can be reached and used

    /* ---------- the notes work from the moment the room is up ---------- */
    var notes = [], asking = false, awarded = false, onDone = null, earned = null, idleT = 0;
    /* does the text carry this percentage, as digits or as a word */
    function pct(text, v) {
      var n = parseInt(v, 10); if (isNaN(n)) return false;
      if (new RegExp('(^|[^0-9.,])' + n + '(?![0-9])').test(text)) return true;
      return !!WORDS[n] && new RegExp('\\b' + WORDS[n] + '\\b', 'i').test(text);
    }
    /* the three facts of the brief: the problem (14), the cost (the 3 million) and the target (10) */
    function facts(text) {
      var f = [];
      if (pct(text, d.now)) f.push('the problem');
      if (/\$\s?3(\.0+)?\s?(m\b|mm\b|mn\b|mil|million)|(^|[^0-9.,$])3(\.0+)?\s?(m\b|mm\b|mn\b|mil\b|mill\b|million)|\bthree\s+(mil\b|mill\b|million)|(^|[^0-9.,])3[,\s]?000[,\s]?000(?![0-9])/i.test(text)) f.push('the cost');
      if (pct(text, d.target)) f.push('the target');

    }
    /* the note to take is on screen from the first moment of the turn: nobody should have to guess what to write.

    function idle() {

    }

    function award(li) {

      var f = facts(notes.join(' . ')), good = f.length >= 2;
      li.classList.toggle('ko-good', good);
      li.querySelector('span').textContent = good
        ? 'Captured ' + (f.length > 2 ? f.slice(0, -1).join(', ') + ' and ' + f[f.length - 1] : f.join(' and '))
        : 'Saved. Add the numbers next time and it earns more.';
      api.cancel(idleT); root.classList.remove('ko-hinting', 'ko-short');
      api.cursor.hide();

      if (onDone) onDone();

      var text = input.value.replace(/\s+/g, ' ').trim();

        tip.textContent = text ? 'Add a little more. The note above has all three numbers.' : 'Type the note above first, or click here to fill it in.';
        root.classList.add('ko-short'); input.focus({ preventScroll: true });

      li.querySelector('p').textContent = text;
      list.appendChild(li); list.scrollTop = list.scrollHeight;
      notes.push(text); input.value = ''; root.classList.remove('ko-short'); tip.textContent = KO_TIP;
      if (asking) award(li); else idle();

    }
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); save(); } });
    input.addEventListener('input', function () {
      root.classList.remove('ko-short'); tip.textContent = KO_TIP; idle();
      if (asking && !api.auto) api.cursor.hide();           // the learner is writing: Navid's pointer gets out of the way
    });
    hint.addEventListener('click', function () {
      input.value = d.noteHint; root.classList.remove('ko-short'); tip.textContent = 'Now press Enter to save it.'; input.focus({ preventScroll: true }); idle();
    });

    /* ---------- 2 · the meeting. "For this one, I'll be your manager": he steps in and takes the seat ---------- */
    await api.wait(300);
    var seated = null;
    function sit() { if (!seated) seated = api.guide.dock(slot, { tag: 'inside', role: 'Your manager' }); return seated; }
    await api.say('T2', { onSeg: function (i, text) { if (on(text, /for this one/i, 'sit')) sit().then(function () { root.classList.add('ko-live'); }); } });
    await sit();
    root.classList.add('ko-live');
    await api.wait(300);

    /* ---------- 3 · the brief. Each number lands on the sentence that says it ---------- */
    function fig(name) { var el = $('.ko-' + name); if (el.classList.contains('ko-on')) return; el.classList.add('ko-on'); api.sfx('soft'); }
    await api.say('T3', { onSeg: function (i, text) {
      if (on(text, /fourteen|\b14\b/i, 'now')) fig('now');
      if (on(text, /million|\$\s?3/i, 'cost')) api.later(1000, function () { fig('cost'); });   // "It's costing us ... three million"
      if (on(text, /\bten\b|\b10\b/i, 'goal')) api.later(900, function () { fig('goal'); });   // "I need that down to ... ten"
    } });
    fig('now'); fig('cost'); fig('goal');
    await api.wait(200);

    /* ---------- 4 · the note. One of the tour's three learner actions ---------- */
    await api.say('T4', { onSeg: function (i, text) {
      if (on(text, /first note/i, 'aim')) api.point(input, { pad: 5, ax: .8, ay: .8 });   // low and right, so his name tag never sits on the words
    } });
    api.clearRings();
    asking = true;
    await api.turn({ badge: 'Try taking this note', text: 'Type it, then press <kbd>Enter</kbd>', target: input, pad: 5,
      until: function (done) {
        if (awarded) { api.later(260, done); return; }
        onDone = done;
        /* a note taken during the brief already counts, if it carries the numbers. If not, one more line can add them. */
        if (notes.length && facts(notes.join(' . ')).length >= 2) { award(list.lastElementChild); return; }
        idle();
        if (!api.auto) input.focus({ preventScroll: true });
      },
      auto: async function () {
        if (awarded) return;
        input.value = ''; root.classList.remove('ko-short');
        await api.typeInto(input, d.noteHint);
        await api.wait(240);
        save();
      } });
    asking = false; api.cancel(idleT); root.classList.remove('ko-hinting', 'ko-short');
    api.clearRings(); api.cursor.hide();

    /* ---------- 5 · "See, you just earned some skill points": the chip lands on the meter as he says it ---------- */
    await api.wait(120);
    await Promise.all([api.say('T5'), earned]);
    await api.wait(500);
  }
});

      var iView = Math.max(0, laneOf(VIEWER)), iHire = Math.max(0, laneOf(J.hireAt[0]));
      var pts = L[0], got = cos.map(function () { return false; }), nSent = 0, nProj = 1, nOpen = 0, nApplied = 0, at = -1;
      var sending = false, armed = false, applied = false, cascade = null, turnDone = null, landed = [false, false, false, false], hired = false, pt = 0;

      /* an element's box on the chapter's own canvas, whatever the window is scaled to */
      function box(el) {
        var x = 0, y = 0, n = el;
        while (n && n !== root) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
        return { x: x + el.offsetWidth / 2, y: y + el.offsetHeight / 2 };
      }
      /* swap a small value and let it tick. The text is the state, the tick is decoration. */
      function bump(el, text) {
        if (el.textContent === String(text)) return;
        el.textContent = text; el.classList.remove('jp-tick'); void el.offsetWidth; el.classList.add('jp-tick');
      }
      function again(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
      /* Navid points. A newer point always wins, even when the older one is still in flight. */
      function pointAt(el, o) {
        var my = ++pt; api.clearRings();
        return api.point(el, o).then(function (hd) { if (my !== pt && hd) hd.clear(); return hd; });
      }
      function rest() { pt++; api.clearRings(); api.cursor.hide(); }
      /* how far into a one-sentence line a phrase is spoken, read off its place in the text */
      function phraseAt(id, phrase) {
        var text = (api.lines[id] || {}).text || '', v = (window.ZT_VO || {})[id], k = text.toLowerCase().indexOf(phrase);
        var dur = v && v.dur ? v.dur : Math.max(.95, text.length * .061);
        return k < 0 ? 0 : dur * 1000 * k / text.length;
      }

      /* ---------- the job search rail: one step is the one in hand, the ones before it are ticked ---------- */
      function focus(k) { if (k <= at) return; at = k; steps.forEach(function (s, n) { s.classList.toggle('jp-cur', n === k); }); }
      function say(k, detail, tick) {
        var s = steps[k], el = s.querySelector('small');
        s.classList.add('jp-on');
        if (detail == null) return;
        s.classList.add('jp-has');
        if (tick) bump(el, detail); else el.textContent = detail;
      }
      function tickOff(k, detail, tick) { say(k, detail, tick); steps[k].classList.add('jp-done'); }

      /* ---------- a · the portfolio goes out, one company after another ---------- */
      function receive(k, quiet) {
        if (got[k]) return; got[k] = true; nSent++;
        cos[k].classList.add('jp-got');
        say(0, nSent + ' of ' + NC, !quiet);
        if (!quiet) api.sfx('tick');
      }
      function sentAll(quiet) {
        cos.forEach(function (c, k) { receive(k, true); });
        tickOff(0, NC + ' companies', !quiet);
      }
      function send() {
        if (sending) return; sending = true;
        var from = box(vis);
        focus(0); say(0, '0 of ' + NC);
        cos.forEach(function (c, k) {
          var to = box(c.querySelector('.jp-disc')), cp = copies[k];
          cp.style.left = from.x + 'px'; cp.style.top = from.y + 'px';
          cp.style.setProperty('--jp-dx', (to.x - from.x) + 'px'); cp.style.setProperty('--jp-dy', (to.y - from.y) + 'px');
          api.later(120 + k * 300, function () { if (got[k]) return; cp.classList.add('jp-go'); again(vis, 'jp-press'); });
          api.later(120 + k * 300 + 640, function () { receive(k); });
        });
        api.later(120 + (NC - 1) * 300 + 640 + 230, function () { sentAll(); });
      }

      /* ---------- b and c · projects add points, points open roles ---------- */
      function addProject(n, quiet) {              // n is how many projects there are now
        if (n <= nProj || !tiles[n - 1]) return; nProj = n;
        tiles[n - 1].classList.add('jp-in');
        if (quiet) prN.textContent = n; else { bump(prN, n); api.sfx('soft'); }
      }
      /* skill points are the one thing that opens roles: every role at or under the number is open */
      function setPoints(v, tick, quiet) {
        pts = Math.max(pts, v);
        if (tick) bump(skB, num(pts)); else skB.textContent = num(pts);
        bar.style.setProperty('--jp-p', barAt(d, J.stops, pts).toFixed(2) + '%');
        roles.forEach(function (r, k) {
          if (+r.dataset.at > pts || r.classList.contains('jp-open')) return;
          r.classList.add('jp-open'); nOpen++;
          if (stops[k]) stops[k].classList.add('jp-in');
          if (!quiet) api.sfx(k === NR - 1 ? 'good' : 'pop');
        });
        tiers.forEach(function (t) { t.classList.toggle('jp-in', +t.dataset.at <= pts); });
        if (at >= 1 || nOpen) { if (nOpen === NR) tickOff(1, nOpen + ' of ' + NR, !quiet); else say(1, nOpen + ' of ' + NR, !quiet); }
      }
      /* the number climbs in steps on a timer, never on animation frames */
      function climb(to, ms) {
        var from = pts, n = 14;
        sk.classList.add('jp-up');
        for (var k = 1; k <= n; k++) (function (k) {
          var p = 1 - Math.pow(1 - k / n, 2);
          api.later(ms * k / n, function () { setPoints(k === n ? to : Math.round((from + (to - from) * p) / 10) * 10); });
        })(k);
        api.later(ms + 260, function () { sk.classList.remove('jp-up'); });
      }

      /* ---------- d · one button applies to every open role ---------- */
      function arm() { if (armed) return; armed = true; btn.disabled = false; sheet.classList.add('jp-armed'); }
      function applyRole(k, quiet) {
        var r = roles[k]; if (r.classList.contains('jp-applied')) return;
        r.classList.add('jp-open', 'jp-applied'); nApplied++;
        say(2, nApplied + (nApplied === 1 ? ' role' : ' roles'), !quiet);
        if (quiet) return;
        api.sfx('tick');
        var co = cos[coOf[k]]; if (co) again(co.querySelector('.jp-disc'), 'jp-ping');
      }
      function appliedAll(quiet) {
        applied = true; sheet.classList.add('jp-armed', 'jp-sent'); btn.disabled = true;
        roles.forEach(function (r, k) { applyRole(k, true); });
        focus(2); tickOff(2, NR + ' roles', !quiet);
      }
      function apply() {
        if (applied || !armed) return; applied = true;
        sheet.classList.add('jp-sent'); btn.disabled = true;
        focus(2); say(2);
        roles.forEach(function (r, k) { api.later(180 + k * 200, function () { applyRole(k); }); });
        api.later(180 + NR * 200 + 40, function () { appliedAll(); });
        cascade = api.wait(180 + NR * 200 + 300);
      }
      btn.addEventListener('click', function () {
        if (!armed || applied) return;
        rest(); apply();
        if (turnDone) turnDone();
      });

      /* ---------- e · the companies write back ---------- */
      var REPLY = [
        { co: iView, step: 3, detail: SENT_TO[iView][1], sound: 'soft' },
        { co: iHire, step: 4, detail: J.hireAt[1], sound: 'pop' },
        { co: iHire, step: 5, detail: WHEN.day + ' ' + WHEN.date + ', ' + WHEN.time, sound: 'soft' },
        { co: iHire, step: 6, detail: J.hireAt[1] + ', ' + J.hire.title, sound: 'pop' }
      ];
      function land(n, quiet) {
        if (landed[n]) return; landed[n] = true;
        tickOff(REPLY[n].step, REPLY[n].detail, !quiet); focus(REPLY[n].step);
        if (!quiet) api.sfx(REPLY[n].sound);
      }
      /* the answer leaves the company and lands on the rail */
      function reply(n) {
        if (landed[n]) return;
        var q = REPLY[n], disc = cos[q.co].querySelector('.jp-disc'), from = box(disc), to = box(steps[q.step].querySelector('.jp-slot')), r = reps[n];
        r.style.left = from.x + 'px'; r.style.top = from.y + 'px';
        r.style.setProperty('--jp-dx', (to.x - from.x) + 'px'); r.style.setProperty('--jp-dy', (to.y - from.y) + 'px');
        r.classList.add('jp-go'); again(disc, 'jp-ping');
        api.later(680, function () { land(n); });
      }
      /* ---------- f · the offer ---------- */
      function hire(quiet) {
        REPLY.forEach(function (q, n) { land(n, true); });
        if (hired) return; hired = true;
        root.classList.add('jp-hired');
        if (!quiet) api.sfx('good');
      }

      setPoints(pts, false, true);
      api.guide.home({ role: ROLE });
      await api.wait(380);

      /* ---------- T16 · it goes to recruiters, more projects open more roles, a higher level opens the top tier ---------- */
      await api.say('T16', { onSeg: function (i) {
        if (i === 0) send();
        if (i === 1) {                                          // each project that arrives lifts the points, and a role opens
          sentAll(true); focus(1); say(1, nOpen + ' of ' + NR);
          for (var k = 2; k <= tiles.length; k++) (function (k) {
            api.later(150 + (k - 2) * 700, function () { addProject(k); });
            api.later(400 + (k - 2) * 700, function () { setPoints(L[Math.min(k - 1, L.length - 2)], true); });
          })(k);
        }
        if (i === 2) {                                          // the level climbs, and the top tier opens
          for (var j = 2; j <= tiles.length; j++) { addProject(j, true); setPoints(L[Math.min(j - 1, L.length - 2)], false, true); }
          api.later(250, function () { climb(L[L.length - 1], 1300); });
          api.later(1700, function () { pointAt(roles[NR - 1], { pad: 5, ax: .5, ay: .8 }); });
        }
      } });
      /* whatever the clock did, the page is whole */
      sk.classList.remove('jp-up');
      sentAll(true); focus(1);
      for (var n = 2; n <= tiles.length; n++) addProject(n, true);
      setPoints(L[L.length - 1], false, true);
      await api.wait(120);
      rest();

      /* ---------- J1 · we apply with you. Then the one thing the learner does here ---------- */
      await api.say('J1', { onSeg: function () {
        arm();
        api.later(Math.max(240, phraseAt('J1', 'we apply') - 850), function () { if (!applied) pointAt(btn, { pad: 6, ax: .88, ay: .16 }); });
      } });
      arm();
      if (!applied) rest();
      await api.turn({
        badge: 'Try this', text: 'Click <b>Apply to all</b>', tip: true, target: applied ? null : btn, pad: 6,
        until: function (done) { turnDone = done; if (applied) done(); },
        auto: function () { if (!applied) return api.click(btn); }
      });
      rest();
      if (cascade) await cascade;
      appliedAll(true);

      /* ---------- no voice: one company looks, one asks, the interview is booked, the offer arrives ---------- */
      await api.wait(220);
      REPLY.forEach(function (q, k) { api.later(k * 620, function () { reply(k); }); });
      await api.wait(3100);
      REPLY.forEach(function (q, k) { land(k, true); });

      /* ---------- T17A · so that's how Zero works ---------- */
      await api.say('T17A', { onSeg: function () { hire(); } });
      hire(true);
      await api.wait(900);
    }
  });
})();

</script>
