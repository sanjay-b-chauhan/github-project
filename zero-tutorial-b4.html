<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>How Zero works</title>
<link rel="icon" href="zero-tutorial-assets-b4/img/zero-mark.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,100..1000&display=swap">
<style>
/* core.css */
/* ZERO overview tour · core. Everything the tour itself draws is prefixed zt-.
   Chapter screens live under .zt-ch.ch-<id> and must scope their own rules there. */
@font-face{font-family:'STK Bureau Serif';src:url('zero-tutorial-assets-b4/fonts/STKBureau-SerifBook.otf') format('opentype');font-weight:400;font-display:swap}
@font-face{font-family:'STK Bureau Serif';src:url('zero-tutorial-assets-b4/fonts/STKBureau-SerifMedium.otf') format('opentype');font-weight:500;font-display:swap}
@font-face{font-family:'PP Supply Mono';src:url('zero-tutorial-assets-b4/fonts/PPSupplyMono-Regular.otf') format('opentype');font-weight:400;font-display:swap}

:root{
  --zt-ease:cubic-bezier(.625,.05,0,1);
  --zt-green:#49BA61; --zt-green-deep:#2E9A48; --zt-green-ink:#06210f;
  --f-serif:'STK Bureau Serif',Georgia,serif;
  --f-sans:'Google Sans Flex','Google Sans',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-mono:'PP Supply Mono','SFMono-Regular',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0E0E10}
body{font-family:var(--f-sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;transition:background .6s var(--zt-ease)}
button{font-family:inherit}

/* One fixed design canvas, scaled to fit. Chapters draw in 1600 x 840 px.
   The tour's own chrome takes its values from the onboarding people do before they download the
   app (the same dark page, field, text steps and pills) and its made buttons from the Zero site
   (the key: a gradient face, a light top edge, a dark bottom edge, a hairline). */
#zt-root{position:fixed;left:0;top:0;width:1600px;height:840px;transform-origin:0 0;
  --page:#0E0E10; --shell:#17171A; --card:#1C1C1F; --field:#222226; --wash:#1A1A1D;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.05);
  --tx:#F4F4F3; --tx-2:#A6A6AC; --tx-3:#77777E; --tx-4:#4A4A51; --ink:#F4F4F3; --on-ink:#131315;
  --key-dark:linear-gradient(#303432,#181A19);
  --key-dark-sh:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -3px 0 rgba(0,0,0,.5),0 0 0 1px #121413,0 14px 24px -14px rgba(18,20,19,.5);
  --key-light:linear-gradient(#FFFFFF,#EDEDEA);
  --key-light-sh:inset 0 1px 0 #fff,inset 0 -3px 0 rgba(0,0,0,.1),0 0 0 1px rgba(0,0,0,.18),0 14px 24px -14px rgba(0,0,0,.5);
  /* older names, still read by the chapters */
  --zt-ink:#F4F4F3; --zt-ink-2:#A6A6AC; --zt-ink-3:#77777E; --zt-chip:#222226; --zt-chip-h:#2C2C31; --zt-ink-inv:#131315}
#zt-root[data-tone="light"]{--zt-ink:#111113; --zt-ink-2:#63636a; --zt-ink-3:#9a9aa0; --zt-chip:#F0F0EE; --zt-chip-h:#E6E6E3; --zt-ink-inv:#fff}

/* Two layers. #zt-full holds the full-screen screens (first run, the world).
   The player sits on top of the world: 16:9, a glass frame with its hairlines, the picture, and one bar. */
#zt-full{position:absolute;inset:0;overflow:hidden}
#zt-playerbg{position:absolute;z-index:9;left:88px;top:16px;width:1424px;height:808px;border-radius:30px;
  background:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(24px) saturate(1.3);backdrop-filter:blur(24px) saturate(1.3);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.13),inset 0 1px 0 rgba(255,255,255,.28),0 0 0 1px rgba(0,0,0,.55),0 50px 130px -30px rgba(0,0,0,.85),0 14px 36px -10px rgba(0,0,0,.5);
  opacity:0;transform:translateY(18px) scale(.955);pointer-events:none;transition:opacity .42s var(--zt-ease),transform .7s var(--zt-ease)}
#zt-playerbg::after{content:'';position:absolute;inset:8px;border-radius:22px;background:var(--page);box-shadow:0 0 0 1px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.07)}
#zt-root.zt-windowed #zt-playerbg{opacity:1;transform:none}
#zt-win{position:absolute;z-index:10;left:96px;top:24px;width:1408px;height:692px;border-radius:22px 22px 0 0;overflow:hidden;background:#1E1E1E;
  opacity:0;transform:translateY(18px) scale(.955);transform-origin:50% 396px;pointer-events:none;
  transition:opacity .42s var(--zt-ease),transform .7s var(--zt-ease),background .5s var(--zt-ease)}
#zt-root.zt-windowed #zt-win{opacity:1;transform:none;pointer-events:auto}
#zt-stage{position:absolute;left:0;top:0;width:1600px;height:840px;transform:scale(.88);transform-origin:0 0;overflow:hidden}
#zt-full .zt-ch{transition:opacity .5s var(--zt-ease),transform .72s var(--zt-ease),filter .6s var(--zt-ease)}
#zt-full .zt-ch.zt-behind{filter:blur(7px) brightness(.5) saturate(.85);transform:scale(1.035);pointer-events:none}
#zt-root.zt-windowed:not(.zt-fullmode) #zt-full{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 7%,#000 93%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 7%,#000 93%,transparent 100%)}
/* compare mode (?full=1): the same screens fill the canvas and nothing sits behind them */
#zt-root.zt-fullmode #zt-win{left:0;top:0;width:1600px;height:840px;border-radius:0;box-shadow:none}
#zt-root.zt-fullmode #zt-playerbg,#zt-root.zt-fullmode #zt-veil{display:none!important}
#zt-root.zt-fullmode #zt-stage{transform:none}
#zt-root.zt-fullmode #zt-full .zt-ch.zt-behind{visibility:hidden}

/* ---------- the header of a full-screen screen: the wordmark, as in the onboarding ---------- */
.zt-logo{position:absolute;z-index:82;left:22px;top:22px;height:40px;padding:0 17px;display:flex;align-items:center;border-radius:999px;background:var(--field);color:var(--tx);
  opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .45s var(--zt-ease),transform .55s var(--zt-ease),background .4s,color .4s}
.zt-logo svg{height:13px;width:auto;display:block}
#zt-root.zt-hdr:not(.zt-windowed):not(.zt-bare) .zt-logo{opacity:1;transform:none}
/* on the world the wordmark stands on the map, white, as it does in the app */
#zt-root.zt-onmap .zt-logo{left:32px;top:28px;height:auto;padding:0;background:none;color:#fff;filter:drop-shadow(0 2px 10px rgba(0,0,0,.4))}
#zt-root.zt-onmap .zt-logo svg{height:24px}

/* ---------- skill points ---------- */
.zt-pts{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px 0 13px;border-radius:999px;background:var(--field);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
  font:400 13px/1 var(--f-sans);letter-spacing:-.01em;color:var(--tx);white-space:nowrap}
.zt-pts svg{width:15px;height:15px;color:#F2C94C;flex:none}
.zt-pts b{font:600 14.5px/1 var(--f-sans);font-variant-numeric:tabular-nums;min-width:1ch;text-align:right}
.zt-pts em{font-style:normal;color:var(--tx-3)}
.zt-pts.zt-bump{animation:zt-bump .5s var(--zt-ease)}
@keyframes zt-bump{35%{transform:scale(1.08);background:rgba(242,201,76,.26)}100%{transform:none}}
.zt-fly{position:absolute;z-index:90;display:flex;align-items:baseline;gap:7px;padding:9px 14px;border-radius:999px;background:#F2C94C;color:#2a2105;white-space:nowrap;pointer-events:none;
  font:400 13px/1 var(--f-sans);letter-spacing:-.01em;box-shadow:0 10px 30px rgba(0,0,0,.35);
  opacity:0;transform:translate(-50%,-50%) translateY(10px) scale(.7);
  transition:opacity .25s var(--zt-ease),transform .45s var(--zt-ease),left .7s var(--zt-ease),top .7s var(--zt-ease)}
.zt-fly b{font-weight:700;font-size:15px}
.zt-fly.zt-on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.zt-fly.zt-go{opacity:.9;transform:translate(-50%,-50%) scale(.62)}


/* chapter screens: a blur morph, never a hard cut */
.zt-ch{position:absolute;inset:0;overflow:hidden;opacity:0;transform:scale(1.012);filter:blur(12px);
  transition:opacity .5s var(--zt-ease),transform .72s var(--zt-ease),filter .5s var(--zt-ease)}
.zt-ch.zt-in{opacity:1;transform:none;filter:none}
.zt-ch.zt-exit{opacity:0;transform:scale(.988);filter:blur(12px);pointer-events:none}

/* ---------- the guide: one face that changes seat ---------- */
.zt-guide{position:absolute;z-index:60;left:28px;top:778px;width:48px;height:48px;border-radius:50%;pointer-events:none;
  transition:left .76s var(--zt-ease),top .76s var(--zt-ease),width .76s var(--zt-ease),height .76s var(--zt-ease),border-radius .76s var(--zt-ease),opacity .4s var(--zt-ease)}
.zt-guide.zt-instant{transition:none}
.zt-guide.zt-hidden{opacity:0}
.zt-g-photo{position:absolute;inset:0;border-radius:inherit;overflow:hidden;background:#2b2b2b}
.zt-g-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:opacity .5s var(--zt-ease)}
.zt-g-photo .zt-wide{opacity:0;object-position:68% 20%}
.zt-guide[data-shape="tile"] .zt-wide{opacity:1}
.zt-guide[data-shape="tile"] .zt-face{opacity:0}
.zt-g-ring{position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 0 rgba(255,255,255,0);transition:box-shadow .16s linear}
.zt-guide.zt-speaking .zt-g-ring{box-shadow:0 0 0 calc(2px + var(--amp,0) * 4px) rgba(255,255,255,calc(.7 + var(--amp,0) * .3))}
.zt-g-tag{position:absolute;white-space:nowrap;display:flex;flex-direction:column;gap:3px;color:var(--zt-ink);
  letter-spacing:-.01em;transition:opacity .35s var(--zt-ease)}
.zt-g-tag b{font:600 14px/1.1 var(--f-sans)}
.zt-g-tag span{font:400 12.5px/1.1 var(--f-sans);color:var(--zt-ink-2);display:inline-block;transition:opacity .25s,filter .25s,transform .35s var(--zt-ease)}
.zt-g-tag span.zt-swap{opacity:0;filter:blur(5px);transform:translateY(4px)}
.zt-guide[data-tag="right"] .zt-g-tag{left:calc(100% + 12px);top:50%;transform:translateY(-50%)}
.zt-guide[data-tag="below"] .zt-g-tag{top:calc(100% + 14px);left:50%;transform:translateX(-50%);align-items:center;text-align:center}
.zt-guide[data-tag="below"] .zt-g-tag b{font-size:17px}
.zt-guide[data-tag="below"] .zt-g-tag span{font-size:14px}
.zt-guide[data-tag="inside"] .zt-g-tag{left:16px;bottom:14px;flex-direction:row;align-items:baseline;gap:8px;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.55)}
.zt-guide[data-tag="inside"] .zt-g-tag span{color:rgba(255,255,255,.78)}
.zt-guide[data-tag="none"] .zt-g-tag{opacity:0}
.zt-guide.zt-flying .zt-g-tag{opacity:0;transition-duration:.12s}


/* ---------- Navid's pointer: white, with a hairline, so it reads on paper and on the dark ---------- */
.zt-cursor{position:absolute;z-index:72;left:0;top:0;--x:60px;--y:790px;transform:translate(var(--x),var(--y));opacity:0;pointer-events:none;
  transition:transform .72s var(--zt-ease),opacity .28s var(--zt-ease)}
.zt-cursor.zt-on{opacity:1}
.zt-cursor svg{display:block;width:24px;height:24px;filter:drop-shadow(0 3px 7px rgba(0,0,0,.45))}
.zt-cursor em{position:absolute;left:17px;top:20px;font:600 11.5px/1 var(--f-sans);font-style:normal;letter-spacing:-.005em;white-space:nowrap;
  background:var(--key-light);color:#131315;padding:6px 9px 6px;border-radius:4px 11px 11px 11px;box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(0,0,0,.2),0 6px 14px -4px rgba(0,0,0,.45)}
.zt-cursor.zt-tap svg{animation:zt-tap .36s var(--zt-ease)}
@keyframes zt-tap{40%{transform:scale(.8)}100%{transform:none}}
/* the ring: a white line over a dark one, so one ring works on every screen */
.zt-ink{position:absolute;inset:0;z-index:66;pointer-events:none;overflow:visible}
.zt-ink g{transition:opacity .35s}
.zt-ink rect{fill:none;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .62s var(--zt-ease)}
.zt-ink rect.zt-r-under{stroke:rgba(0,0,0,.42);stroke-width:5}
.zt-ink rect.zt-r-over{stroke:#fff;stroke-width:2.25}
.zt-ink g.zt-drawn rect{stroke-dashoffset:0}
#zt-root[data-ptone="light"] .zt-ink rect.zt-r-over{stroke:#111113}
#zt-root[data-ptone="light"] .zt-ink rect.zt-r-under{stroke:rgba(255,255,255,.75)}
.zt-ink g.zt-pulse{animation:zt-pulse 1.5s ease-in-out .7s infinite}
.zt-ink g.zt-gone{opacity:0}
@keyframes zt-pulse{50%{opacity:.4}}
.zt-ripple{position:absolute;z-index:71;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.3);pointer-events:none;animation:zt-ripple .55s var(--zt-ease) forwards}
@keyframes zt-ripple{to{transform:scale(4.4);opacity:0}}

/* ---------- the prompt beside the thing to act on: a white key ---------- */
.zt-tip{position:absolute;z-index:71;left:0;top:0;display:flex;align-items:center;height:38px;padding:0 14px;border-radius:12px;white-space:nowrap;
  background:var(--key-light);color:#131315;box-shadow:var(--key-light-sh);font:500 14px/1 var(--f-sans);letter-spacing:-.01em;
  opacity:0;transform:translateY(6px) scale(.96);pointer-events:none;transition:opacity .28s var(--zt-ease),transform .5s var(--zt-ease)}
.zt-tip.zt-on{opacity:1;transform:none}
.zt-tip>b{font:400 14px/1 var(--f-sans);color:#77777E;padding-right:10px;margin-right:10px;box-shadow:1px 0 0 rgba(0,0,0,.12)}
.zt-tip span b{font-weight:600}
.zt-tip kbd{font:500 12px/1 var(--f-sans);border:1px solid rgba(0,0,0,.18);border-bottom-width:2px;border-radius:6px;padding:3px 6px 4px;margin:0 2px;background:#fff}
.zt-tip i{position:absolute;left:var(--ax,50%);width:11px;height:11px;margin-left:-5.5px;background:#F1F1EE;transform:rotate(45deg);border-radius:2px;box-shadow:1px 1px 0 rgba(0,0,0,.2)}
.zt-tip[data-side=top] i{bottom:-5px}
.zt-tip[data-side=bottom] i{top:-5px;background:#fff;box-shadow:-1px -1px 0 rgba(0,0,0,.16)}

/* ---------- the tour's own controls ----------
   On a full-screen screen they float: Navid bottom left, what he says bottom centre, sound in a corner.
   In the player they are its bar. */
.zt-dock{position:absolute;inset:0;z-index:80;pointer-events:none}
.zt-home{position:absolute;left:28px;bottom:24px;width:48px;height:48px;border-radius:50%}
.zt-center{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:820px;min-height:48px;display:grid;place-items:end center}
.zt-center>*{grid-area:1/1}
.zt-cc{max-width:760px;font:400 16px/1.4 var(--f-sans);letter-spacing:-.012em;color:var(--tx);text-align:center;text-wrap:balance;
  background:rgba(14,14,16,.74);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);padding:11px 18px 12px;border-radius:16px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset 0 1px 0 rgba(255,255,255,.08),0 14px 34px -12px rgba(0,0,0,.6);
  opacity:0;transform:translateY(6px);transition:opacity .22s var(--zt-ease),transform .36s var(--zt-ease)}
.zt-cc.zt-on{opacity:1;transform:none}
#zt-root.zt-nocc .zt-cc{display:none}
.zt-right{position:absolute;right:22px;bottom:50px;display:flex;align-items:center;gap:8px;pointer-events:auto;transition:opacity .4s}
#zt-root.zt-ctltop:not(.zt-windowed) .zt-right{bottom:auto;top:19px}

/* a round control, 44px, as in the onboarding's header */
.zt-ib{appearance:none;border:0;flex:none;width:44px;height:44px;border-radius:999px;background:var(--field);color:var(--tx-2);display:grid;place-items:center;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);font:600 13px/1 var(--f-sans);font-variant-numeric:tabular-nums;letter-spacing:0;
  transition:background .2s,color .2s,transform .22s cubic-bezier(.2,.8,.3,1)}
.zt-ib:hover{background:#2C2C31;color:var(--tx)}
.zt-ib:active{transform:scale(.94)}
.zt-ib svg{width:17px;height:17px;display:block;grid-area:1/1}
.zt-ib.zt-off{color:var(--tx-4)}
.zt-spd.zt-on{background:var(--ink);color:var(--on-ink)}
#zt-root.zt-onmap:not(.zt-windowed) .zt-ib{background:rgba(14,14,16,.6);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.zt-play .zt-i-play{display:none}
#zt-root.zt-paused .zt-play .zt-i-play{display:block}
#zt-root.zt-paused .zt-play .zt-i-pause{display:none}

/* where you are: the step's name, and a dot for each step. The one you are in is a dash that fills as it plays */
.zt-steps{display:inline-flex;align-items:center;gap:12px;height:44px;padding:0 18px;border-radius:999px;background:var(--field);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);white-space:nowrap}
.zt-step{font:400 13px/1 var(--f-sans);letter-spacing:-.01em;color:var(--tx)}
.zt-dots{display:flex;align-items:center;gap:6px}
.zt-dots i{position:relative;width:4px;height:4px;border-radius:99px;background:var(--tx-4);overflow:hidden;transition:width .5s var(--zt-ease),background .4s}
.zt-dots i.zt-done{background:var(--tx-2)}
.zt-dots i.zt-now{width:22px}
.zt-dots i.zt-now::after{content:'';position:absolute;inset:0;background:var(--tx);transform-origin:0 50%;transform:scaleX(var(--p,0));transition:transform .12s linear}

/* only the player has steps, speed, play and a way out. A full-screen screen has sound, nothing more */
#zt-root:not(.zt-windowed) .zt-steps,#zt-root:not(.zt-windowed) .zt-pts,#zt-root:not(.zt-windowed) .zt-play,#zt-root:not(.zt-windowed) .zt-spd,#zt-root:not(.zt-windowed) .zt-skip,
#zt-root.zt-nostep .zt-steps{display:none}
#zt-root.zt-bare .zt-right,#zt-root.zt-bare .zt-center{opacity:0;pointer-events:none}
#zt-root.zt-fullmode .zt-pts,#zt-root.zt-fullmode .zt-steps,#zt-root.zt-fullmode .zt-play,#zt-root.zt-fullmode .zt-spd,#zt-root.zt-fullmode .zt-skip{display:inline-flex}
#zt-root.zt-fullmode .zt-ib{display:grid}

/* ---------- the player's bar ---------- */
#zt-root.zt-windowed:not(.zt-fullmode) .zt-dock{inset:auto;left:96px;top:716px;width:1408px;height:100px}
#zt-root.zt-windowed:not(.zt-fullmode) .zt-dock::before{content:'';position:absolute;left:0;right:0;top:0;height:1px;background:rgba(255,255,255,.07)}
#zt-root.zt-windowed:not(.zt-fullmode) .zt-home{left:26px;top:26px;bottom:auto}
#zt-root.zt-windowed:not(.zt-fullmode) .zt-guide[data-tag="right"] .zt-g-tag{opacity:0}
#zt-root.zt-windowed:not(.zt-fullmode) .zt-center{left:92px;top:0;bottom:auto;transform:none;width:640px;height:100px;min-height:0;place-items:center start}
#zt-root.zt-windowed:not(.zt-fullmode) .zt-cc{background:none;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none;padding:0;border-radius:0;text-align:left;max-width:640px;text-wrap:pretty}
#zt-root.zt-windowed:not(.zt-fullmode) .zt-right{right:26px;top:28px;bottom:auto}

/* ---------- what to do now. In the bar it is a plain line: a waiting dot, the ask, how. No box. ---------- */
.zt-turn{pointer-events:auto;display:flex;align-items:center;gap:12px;white-space:nowrap;font:400 16px/1.2 var(--f-sans);letter-spacing:-.012em;color:var(--tx-2);
  opacity:0;transform:translateY(8px);transition:opacity .28s var(--zt-ease),transform .5s var(--zt-ease)}
.zt-turn.zt-on{opacity:1;transform:none}
#zt-root:not(.zt-windowed):not(.zt-fullmode) .zt-turn{display:none}
.zt-turn .zt-badge{display:inline-flex;align-items:center;gap:10px;color:var(--tx);font-weight:500}
.zt-turn .zt-badge i{width:8px;height:8px;border-radius:50%;background:var(--tx);flex:none;animation:zt-wait 1.4s ease-in-out infinite}
@keyframes zt-wait{50%{opacity:.25;transform:scale(.7)}}
.zt-turn .zt-badge svg{width:15px;height:15px;display:none;color:var(--zt-green)}
.zt-turn.zt-ok .zt-badge i{display:none}
.zt-turn.zt-ok .zt-badge svg{display:block}
.zt-turn .zt-text b{font-weight:500;color:var(--tx)}
.zt-turn kbd{font:500 12px/1 var(--f-sans);color:var(--tx);background:var(--key-dark);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -2px 0 rgba(0,0,0,.5),0 0 0 1px #121413;border-radius:7px;padding:6px 8px 7px;margin:0 2px}
.zt-turn .zt-showme{appearance:none;border:0;cursor:pointer;height:34px;padding:0 13px;border-radius:10px;background:var(--field);color:var(--tx);font:500 13px/1 var(--f-sans);letter-spacing:-.005em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);display:none;transition:background .2s}
.zt-turn .zt-showme:hover{background:#2C2C31}
.zt-turn.zt-nudge .zt-showme{display:block}
#zt-root.zt-fullmode .zt-turn{background:rgba(14,14,16,.78);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);padding:12px 18px;border-radius:16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}

/* ---------- leaving, and the way back ---------- */
.zt-replay{display:none}
#zt-root.zt-exited .zt-replay{position:relative;display:inline-flex;align-items:center;gap:9px;appearance:none;border:0;cursor:pointer;height:44px;padding:0 18px 0 15px;border-radius:14px;
  background:var(--key-light);color:#131315;box-shadow:var(--key-light-sh);font:500 14px/1 var(--f-sans);letter-spacing:-.01em;transition:transform .22s cubic-bezier(.2,.8,.3,1)}
#zt-root.zt-exited .zt-replay svg{width:12px;height:12px;display:block}
#zt-root.zt-exited .zt-replay:hover{transform:translateY(-2px)}
#zt-root.zt-exited .zt-replay:active{transform:translateY(1px)}
.zt-replay i{display:none}

/* paused: a veil over the picture, one click carries on */
#zt-veil{display:none}
#zt-root.zt-windowed.zt-paused:not(.zt-fullmode) #zt-veil{display:grid;place-items:center;position:absolute;z-index:76;left:96px;top:24px;width:1408px;height:692px;
  border:0;border-radius:22px 22px 0 0;background:rgba(10,10,12,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);cursor:pointer}
#zt-veil i{width:84px;height:84px;border-radius:50%;background:var(--key-light);color:#131315;display:grid;place-items:center;box-shadow:var(--key-light-sh);transition:transform .22s cubic-bezier(.2,.8,.3,1)}
#zt-veil:hover i{transform:scale(1.05)}
#zt-veil svg{width:30px;height:30px;margin-left:4px}
#zt-veil span{display:none}

/* ---------- the dev control: for reviewing, never part of the product ----------
   A small key in the corner. It opens a stepper and a list of every screen, as the onboarding's does. */
.zt-dev{position:absolute;z-index:95;right:12px;bottom:10px;font-family:var(--f-sans);letter-spacing:-.01em}
.zt-dev-key{appearance:none;border:0;cursor:pointer;height:28px;padding:0 11px;border-radius:999px;background:rgba(28,28,31,.82);color:var(--tx-3);font:400 11.5px/1 var(--f-sans);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:color .2s,background .2s}
.zt-dev-key:hover{color:var(--tx);background:rgba(44,44,49,.9)}
.zt-dev-panel{display:none;position:absolute;right:0;bottom:38px;width:296px;padding:8px;border-radius:18px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line),0 18px 44px rgba(0,0,0,.55)}
.zt-dev.zt-open .zt-dev-panel{display:block}
.zt-dev-bar{display:flex;align-items:center;gap:4px;padding:4px;border-radius:999px;background:var(--wash)}
.zt-dev-nav{appearance:none;border:0;cursor:pointer;width:32px;height:32px;border-radius:999px;background:none;color:var(--tx-3);display:grid;place-items:center;transition:background .2s,color .2s}
.zt-dev-nav:hover{background:var(--field);color:var(--tx)}
.zt-dev-nav svg{width:15px;height:15px}
.zt-dev-nav.zt-flip svg{transform:rotate(180deg)}
.zt-dev-now{flex:1;text-align:center;font:400 12px/1 var(--f-sans);color:var(--tx-2);white-space:nowrap}
.zt-dev-h{margin:12px 6px 7px;font:400 11.5px/1 var(--f-sans);color:var(--tx-3)}
.zt-dev-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.zt-dev-grid button,.zt-dev-row button{appearance:none;border:0;cursor:pointer;height:34px;padding:0 11px;border-radius:10px;background:var(--wash);color:var(--tx-2);font:400 12px/1 var(--f-sans);text-align:left;white-space:nowrap;transition:background .2s,color .2s}
.zt-dev-grid button:hover,.zt-dev-row button:hover{background:var(--field);color:var(--tx)}

/* build stamp, so every screenshot names its build */

/* ch/00-signin.css */
/* 0 · first run of the desktop app: the app's login, welcome back with three keys, draw zero.
   The login is the app's own (city, clouds, glass card, white pill). The other two take the
   onboarding's page, type and controls, and the keys take the made button of the Zero site. */
.ch-signin{background:#0E0E10;color:#F4F4F3;font-family:var(--f-sans);letter-spacing:-.01em}
.ch-signin.si-through{background:none}

/* one screen at a time */
.ch-signin .si-login,.ch-signin .si-wel,.ch-signin .si-draw{position:absolute;inset:0;opacity:0;pointer-events:none;
  transition:opacity .6s var(--zt-ease),transform .8s var(--zt-ease),filter .6s var(--zt-ease)}
.ch-signin .si-on{opacity:1;pointer-events:auto}

/* ---------- 1 · the login ---------- */
.ch-signin .si-login{background:linear-gradient(180deg,#22364a,#16222f 60%,#101820);overflow:hidden}
.ch-signin.si-dark .si-login{transform:scale(1.03);filter:blur(14px)}
.ch-signin .si-sky{position:absolute;inset:0;overflow:hidden}
.ch-signin .si-city{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:58% 46%;animation:si-drift 72s ease-in-out infinite alternate}
@keyframes si-drift{0%{transform:scale(1.045) translate3d(-.8%,-.5%,0)}100%{transform:scale(1.09) translate3d(.9%,.6%,0)}}
.ch-signin .si-shadows{position:absolute;inset:0;mix-blend-mode:multiply}
.ch-signin .si-cloud{position:absolute;left:0;height:auto;pointer-events:none;will-change:transform;animation:si-cross linear infinite}
.ch-signin .si-cs{filter:brightness(0) blur(22px);opacity:.4;margin-top:15%;margin-left:9%}
@keyframes si-cross{0%{transform:translate3d(-70%,0,0)}100%{transform:translate3d(1900px,0,0)}}
.ch-signin .si-scrim{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(52% 62% at 82% 80%,rgba(8,10,14,.66),rgba(8,10,14,0) 74%),linear-gradient(180deg,rgba(8,10,14,0) 52%,rgba(8,10,14,.42))}
.ch-signin .si-wm{position:absolute;left:34px;top:30px;color:#fff;filter:drop-shadow(0 2px 10px rgba(0,0,0,.35))}
.ch-signin .si-wm svg{height:24px;width:auto;display:block}

.ch-signin .si-card{position:absolute;right:64px;bottom:60px;width:480px;display:flex;flex-direction:column;gap:26px;border-radius:32px;padding:40px 38px;
  background:rgba(10,12,16,.52);-webkit-backdrop-filter:blur(30px) saturate(1.25);backdrop-filter:blur(30px) saturate(1.25);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.13),inset 0 1px 0 rgba(255,255,255,.16),0 50px 100px -30px rgba(0,0,0,.7);
  animation:si-card .82s cubic-bezier(.16,1,.3,1) .16s both}
@keyframes si-card{0%{opacity:0;transform:translate3d(0,26px,0) scale(.98)}100%{opacity:1;transform:none}}
.ch-signin .si-card h1{margin:0;font:400 34px/1.14 var(--f-serif);letter-spacing:-.02em;color:#fff;text-wrap:balance}
.ch-signin .si-consent{display:flex;align-items:flex-start;gap:12px;font:400 14.5px/1.5 var(--f-sans);color:rgba(255,255,255,.74);cursor:pointer}
.ch-signin .si-consent u{color:rgba(255,255,255,.9);text-underline-offset:2px}
.ch-signin .si-box{appearance:none;flex:0 0 auto;width:18px;height:18px;margin:2px 0 0;border-radius:6px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);cursor:pointer}
.ch-signin .si-box:checked{background:#fff;box-shadow:inset 0 0 0 1px #fff}
.ch-signin .si-box:checked::after{content:'';display:block;width:5px;height:9px;margin:2px auto 0;border:solid #0b0d11;border-width:0 2px 2px 0;transform:rotate(43deg)}
.ch-signin .si-google{appearance:none;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:58px;border:0;border-radius:999px;background:#fff;color:#14110f;
  font:500 16.5px/1 var(--f-sans);letter-spacing:-.01em;cursor:pointer;box-shadow:0 12px 30px -12px rgba(0,0,0,.6);transition:transform .15s cubic-bezier(.16,1,.3,1),opacity .15s}
.ch-signin .si-google:hover{transform:scale(1.02)}
.ch-signin .si-google:active{transform:scale(.99)}
.ch-signin .si-g{display:grid}
.ch-signin .si-g svg{width:20px;height:20px;display:block}
.ch-signin .si-spin{display:none;width:20px;height:20px;border-radius:50%;border:2px solid rgba(20,17,15,.18);border-top-color:#14110f;animation:si-spin .9s linear infinite}
@keyframes si-spin{to{transform:rotate(360deg)}}
.ch-signin .si-google.si-busy{pointer-events:none}
.ch-signin .si-google.si-busy .si-g{display:none}
.ch-signin .si-google.si-busy .si-spin{display:block}

/* ---------- 2 · welcome back: the line he is saying, and three keys ---------- */
.ch-signin .si-wel{display:flex;flex-direction:column;align-items:center;transform:translateY(10px)}
.ch-signin .si-wel.si-on{transform:none}
.ch-signin .si-slot{flex:none;margin-top:238px;width:64px;height:64px;border-radius:50%}
.ch-signin .si-q{margin:30px 0 0;min-height:78px;max-width:660px;font:400 34px/1.14 var(--f-serif);letter-spacing:-.03em;text-align:center;text-wrap:balance;color:#F4F4F3}
.ch-signin .si-q span{display:inline-block;opacity:0;transform:translateY(12px);filter:blur(6px);transition:opacity .5s var(--zt-ease),transform .6s var(--zt-ease),filter .5s var(--zt-ease)}
.ch-signin .si-q.si-in span{opacity:1;transform:none;filter:none}
.ch-signin .si-q:not(.si-in) span{transition-delay:0s!important;transition-duration:.25s}

.ch-signin .si-perms{display:flex;gap:44px;margin-top:46px}
.ch-signin .si-perm{appearance:none;border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:14px;color:#77777E;
  opacity:0;transform:translateY(16px) scale(.92);transition:opacity .45s var(--zt-ease),transform .62s var(--zt-ease)}
.ch-signin .si-perms.si-in .si-perm{opacity:1;transform:none}
.ch-signin .si-perms.si-in .si-perm:nth-child(2){transition-delay:.08s}
.ch-signin .si-perms.si-in .si-perm:nth-child(3){transition-delay:.16s}
.ch-signin .si-perms.si-away .si-perm{opacity:0;transform:translateY(-10px) scale(.96);transition-delay:0s;pointer-events:none}
/* the key: a face, a light top edge, a dark bottom edge, a hairline. Pressing it sets it down */
.ch-signin .si-key{position:relative;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;color:#F4F4F3;
  background:linear-gradient(#2B2B2F,#1B1B1E);box-shadow:inset 0 1px 0 rgba(255,255,255,.13),inset 0 -3px 0 rgba(0,0,0,.45),0 0 0 1px #08080A,0 16px 26px -14px rgba(0,0,0,.7);
  transition:transform .2s cubic-bezier(.2,.8,.3,1),background .3s,color .3s,box-shadow .3s}
.ch-signin .si-key>svg{width:27px;height:27px;display:block}
.ch-signin .si-perm:hover .si-key{transform:translateY(-2px)}
.ch-signin .si-perm:active .si-key{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 -1px 0 rgba(0,0,0,.45),0 0 0 1px #08080A,0 6px 12px -8px rgba(0,0,0,.7)}
.ch-signin .si-perm b{font:400 12.5px/1 var(--f-sans);letter-spacing:-.005em;transition:color .3s}
/* asking: a thin arc turns round the key */
.ch-signin .si-key::after{content:'';position:absolute;inset:-7px;border-radius:50%;border:1.5px solid transparent;border-top-color:#F4F4F3;opacity:0;transition:opacity .2s}
.ch-signin .si-wait .si-key::after{opacity:.8;animation:si-spin .8s linear infinite}
/* on: the key turns to light, and a small tick sits on its shoulder */
.ch-signin .si-ok .si-key{background:linear-gradient(#FFFFFF,#EDEDEA);color:#131315;box-shadow:inset 0 1px 0 #fff,inset 0 -3px 0 rgba(0,0,0,.1),0 0 0 1px rgba(0,0,0,.5),0 16px 26px -14px rgba(0,0,0,.7)}
.ch-signin .si-ok,.ch-signin .si-no{pointer-events:none}
.ch-signin .si-ok b{color:#F4F4F3}
.ch-signin .si-key i{position:absolute;right:-3px;top:-3px;width:24px;height:24px;border-radius:50%;background:#131315;color:#F4F4F3;display:grid;place-items:center;
  box-shadow:0 0 0 2px #0E0E10;transform:scale(0);transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.ch-signin .si-key i svg{width:12px;height:12px}
.ch-signin .si-ok .si-key i{transform:none}
.ch-signin .si-no .si-key{color:#77777E}

/* ---------- 3 · draw zero ---------- */
.ch-signin .si-draw{cursor:crosshair}
.ch-signin .si-page{position:absolute;inset:0;background:#0E0E10}
.ch-signin .si-ink,.ch-signin .si-open{position:absolute;left:0;top:0;width:1600px;height:840px;display:block;touch-action:none}
.ch-signin .si-open{pointer-events:none;opacity:0}
.ch-signin .si-open.si-on{opacity:1}
.ch-signin .si-hint{position:absolute;left:0;right:0;top:398px;text-align:center;font:500 18px/1.4 var(--f-sans);letter-spacing:-.01em;color:#A6A6AC;pointer-events:none;
  transition:opacity .3s var(--zt-ease),transform .4s var(--zt-ease)}
.ch-signin .si-hint.si-quiet{opacity:.0}
.ch-signin .si-hint.si-gone{opacity:0;transform:translateY(-10px)}
.ch-signin.si-through .si-draw{cursor:default;pointer-events:none}

@media (prefers-reduced-motion:reduce){.ch-signin .si-city,.ch-signin .si-cloud{animation:none}}

/* ch/02-world.css */
/* The world. One screen, mounted once and kept: the learner's home, the backdrop behind the
   pop-up, and the place the first scenario is started from. Two chapters run on it (world, start).
   The map lives in .wd-cam (2080 x 1169.4, the city at 130%). Everything on the map is placed in
   percent of that box, so it rides the camera: wide (drift) -> wd-zoom (on Airbnb) -> wd-go (into it).
   What is showing is a set of classes on the root: wd-on-roles, wd-on-road, wd-on-meter, wd-on-link,
   wd-on-apply, wd-on-ask. The class is the state, the motion is decoration. */
.ch-world{background:#131514;color:#f2f1ee;font-family:var(--f-sans);letter-spacing:-.01em}
/* a state that is set, not played: the backdrop behind the pop-up, and the way back in */
.ch-world.wd-still *,.ch-world.wd-still *::before,.ch-world.wd-still *::after{transition:none!important}

/* ---------- the camera ----------
   .wd-map holds the map one pixel inside the screen. While the camera moves the map is its own layer,
   and at a fractional window scale that layer can overshoot the screen edge by a pixel: this keeps
   that pixel dark instead of a bright seam beside the letterbox. */
.ch-world .wd-map{position:absolute;left:1px;top:1px;right:1px;bottom:1px;overflow:hidden}
.ch-world .wd-cam{position:absolute;left:-1px;top:-1px;width:2080px;height:1169.4px;transform-origin:0 0;
  transform:translate(-470px,-180px)}
.ch-world.wd-drift .wd-cam{transform:translate(-446px,-168px);transition:transform 40s linear}
.ch-world.wd-zoom .wd-cam{transform:translate(-1797.5px,-1017.3px) scale(2.035);transition:transform .95s var(--zt-ease)}
.ch-world.wd-go .wd-cam{transform:translate(-3121px,-1839.6px) scale(3.185);transition:transform .85s var(--zt-ease)}
.ch-world .wd-city{position:absolute;left:0;top:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
/* a sharper cut of the Airbnb neighbourhood (same map, 4096 wide), feathered in for the close-up */
.ch-world .wd-detail{position:absolute;left:39.0625%;top:40.7986%;width:41.5039%;height:39.0625%;display:block;opacity:0;
  user-select:none;-webkit-user-drag:none;transition:opacity .5s var(--zt-ease) .4s;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent),linear-gradient(180deg,transparent,#000 8%,#000 92%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent),linear-gradient(180deg,transparent,#000 8%,#000 92%,transparent);
  -webkit-mask-composite:source-in;mask-composite:intersect}
.ch-world.wd-zoom .wd-detail{opacity:1}

/* ---------- the scenarios, as a road through the city ----------
   Drawn as cartography: a dark casing under a dotted line. Dotted means ahead. The first leg is
   brighter, so the road has a direction. A mask draws it along its length, at one steady speed,
   and each stop lands as the line reaches it (the delays come from the path, see the module). */
.ch-world .wd-road{position:absolute;left:0;top:0;width:100%;height:100%;z-index:2;pointer-events:none;overflow:visible;
  transition:opacity .3s var(--zt-ease)}
.ch-world .wd-road path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.ch-world .wd-road .wd-road-rev{stroke:#fff;stroke-width:28;stroke-linecap:butt;stroke-dasharray:1;stroke-dashoffset:1;
  transition:stroke-dashoffset 2.2s linear}
.ch-world.wd-on-road .wd-road .wd-road-rev{stroke-dashoffset:0}
.ch-world .wd-road-case{stroke:rgba(10,13,11,.46);stroke-width:11}
.ch-world .wd-road-dots{stroke:rgba(255,255,255,.6);stroke-width:4.4;stroke-dasharray:.01 11.5}
.ch-world .wd-road-first{stroke:#fff}

/* the stops: a numbered disc on the road, in the order they come */
.ch-world .wd-stop{position:absolute;z-index:4;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;display:grid;place-items:center;pointer-events:none;
  font:700 13px/1 var(--f-sans);letter-spacing:0;color:rgba(255,255,255,.9);background:rgba(18,20,26,.82);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.34),0 3px 10px rgba(0,0,0,.35);
  opacity:0;transform:scale(.4);transition:opacity .3s var(--zt-ease),transform .5s cubic-bezier(.34,1.56,.64,1)}

  opacity:0;visibility:hidden;transform:translateY(12px);filter:blur(8px);
  transition:opacity .5s var(--zt-ease),transform .65s var(--zt-ease),filter .5s var(--zt-ease),visibility 0s linear .5s}
.ch-world.wd-over .wd-end{opacity:1;visibility:visible;transform:none;filter:none;transition-delay:0s}
.ch-world .wd-end-wm{color:#F4F4F3;display:block}
.ch-world .wd-end-wm svg{height:22px;width:auto;display:block}
.ch-world .wd-end h2{margin:26px 0 0;font:400 44px/1.1 var(--f-serif);letter-spacing:-.02em;color:#f6f5f2;max-width:640px;text-wrap:balance}
.ch-world .wd-end p{margin:16px 0 0;font:400 16px/1.5 var(--f-sans);color:rgba(242,241,238,.6);max-width:440px;text-wrap:balance}
.ch-world .wd-replay{appearance:none;border:0;cursor:pointer;margin-top:34px;height:50px;padding:0 22px;border-radius:16px;
  font:500 15px/1 var(--f-sans);letter-spacing:-.012em;color:#F4F4F3;background:linear-gradient(#303236,#1A1B1E);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -3px 0 rgba(0,0,0,.5),0 0 0 1px #0a0a0b,0 14px 24px -14px rgba(0,0,0,.6);transition:transform .2s cubic-bezier(.2,.8,.3,1)}
.ch-world .wd-replay:hover{transform:translateY(-2px)}
.ch-world .wd-replay:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* resting behind the pop-up: nothing loops under the engine's blur */
.ch-world.wd-rest .wd-stop-go,.ch-world.wd-rest .wd-stop-go::before,.ch-world.wd-rest .wd-stop-go::after,.ch-world.wd-rest .wd-pin::before{animation:none}

@media (prefers-reduced-motion:reduce){
  .ch-world.wd-flash .wd-stop-go,.ch-world.wd-flash .wd-stop-go::before,.ch-world.wd-flash .wd-stop-go::after,.ch-world.wd-zoom .wd-pin::before{animation:none}
  .ch-world.wd-drift .wd-cam{transform:translate(-470px,-180px);transition:none}
}

/* ch/03-kickoff.css */
/* 3 · kickoff, inside the pop-up. Two states of one screen:
   the landing  (the scenario's own kickoff card on a blurred ground: project, manager, Join kickoff)
   the meeting  (presenter 820 x 520 + two teammates, the meeting strip under them, notes on the right)
   The palette is the one the real kickoff ships in: warm paper, white cards. */
.ch-kickoff{background:#F2F0ED;color:#1f1d1e;font-family:var(--f-sans);letter-spacing:-.01em;
  --ko-card:#fff;--ko-well:#f5f4f2;--ko-seat:#E8E4DF;--ko-line:rgba(31,29,30,.1);--ko-t1:#1f1d1e;--ko-t2:#6b6862;--ko-ok:#2E9A48}

/* ================= the landing ================= */
.ch-kickoff .ko-landing{position:absolute;left:0;top:0;width:100%;height:100%;z-index:5;background:#1B1815;overflow:hidden}
/* the ground: a paused, blurred picture with a flat warm wash over it, as the app does */
.ch-kickoff .ko-l-bg{position:absolute;left:-8%;top:-8%;width:116%;height:116%;display:block;object-fit:cover;filter:blur(42px);user-select:none;-webkit-user-drag:none}
.ch-kickoff .ko-l-wash{position:absolute;left:0;top:0;width:100%;height:100%;background:rgba(20,17,15,.62)}
.ch-kickoff .ko-l-card{position:absolute;left:450px;top:112px;width:700px;border-radius:32px;background:#fff;padding:50px 56px 52px;
  box-shadow:0 40px 100px -24px rgba(0,0,0,.5);
  opacity:0;transform:translateY(12px) scale(.96);
  transition:opacity .4s var(--zt-ease),transform .62s var(--zt-ease),background .45s var(--zt-ease),box-shadow .3s var(--zt-ease)}
.ch-kickoff.ko-l-on .ko-l-card{opacity:1;transform:none}
.ch-kickoff .ko-l-in{display:flex;flex-direction:column;align-items:center;text-align:center}
/* the real card's eyebrow is mono caps */
.ch-kickoff .ko-l-eye{margin:0;font:400 13px/1.4 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:rgba(31,29,30,.45)}
/* each part holds its place as a skeleton, then resolves on the word that names it */
.ch-kickoff .ko-l-part{display:grid;justify-items:center;align-items:center;width:100%}
.ch-kickoff .ko-l-part>*{grid-area:1/1}
.ch-kickoff .ko-l-sk{display:flex;flex-direction:column;align-items:center;transition:opacity .3s var(--zt-ease)}
.ch-kickoff .ko-l-sk i{display:block;border-radius:8px;background:rgba(31,29,30,.09);animation:ko-load 1.8s ease-in-out infinite}
.ch-kickoff .ko-l-part.ko-on .ko-l-sk i{animation:none}
@keyframes ko-load{50%{opacity:.55}}
.ch-kickoff .ko-l-real{display:flex;flex-direction:column;align-items:center;opacity:0;transform:translateY(10px);filter:blur(6px);
  transition:opacity .45s var(--zt-ease),transform .6s var(--zt-ease),filter .45s var(--zt-ease)}
.ch-kickoff .ko-l-part.ko-on .ko-l-sk{opacity:0}
.ch-kickoff .ko-l-part.ko-on .ko-l-real{opacity:1;transform:none;filter:none}

.ch-kickoff .ko-l-proj{margin-top:22px;min-height:136px}
.ch-kickoff .ko-l-proj .ko-l-sk i:nth-child(1){width:104px;height:30px;border-radius:999px}
.ch-kickoff .ko-l-proj .ko-l-sk i:nth-child(2){width:420px;height:28px;margin-top:24px}
.ch-kickoff .ko-l-proj .ko-l-sk i:nth-child(3){width:300px;height:28px;margin-top:14px}
.ch-kickoff .ko-l-co{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 14px 0 11px;border-radius:999px;background:#F2F0ED;
  font:500 13.5px/1 var(--f-sans);color:#1c1a18}
.ch-kickoff .ko-l-co img{width:17px;height:17px;display:block}
.ch-kickoff .ko-l-real h1{margin:14px 0 0;max-width:560px;font:400 38px/1.18 var(--f-serif);letter-spacing:-.01em;color:#2A2118;text-wrap:balance}

.ch-kickoff .ko-l-team{margin-top:34px;min-height:122px}
.ch-kickoff .ko-l-team .ko-l-sk{flex-direction:row;flex-wrap:wrap;justify-content:center;width:300px}
.ch-kickoff .ko-l-team .ko-l-sk i:nth-child(-n+3){width:64px;height:64px;border-radius:50%;box-shadow:0 0 0 3px #fff}
.ch-kickoff .ko-l-team .ko-l-sk i:nth-child(2),.ch-kickoff .ko-l-team .ko-l-sk i:nth-child(3){margin-left:-20px}
.ch-kickoff .ko-l-team .ko-l-sk i:nth-child(4){width:240px;height:16px;margin-top:18px}
.ch-kickoff .ko-l-team .ko-l-sk i:nth-child(5){width:180px;height:14px;margin-top:9px}
.ch-kickoff .ko-l-faces{display:flex;align-items:center}
.ch-kickoff .ko-l-faces>*{position:relative;flex:none;width:64px;height:64px;border-radius:50%}
.ch-kickoff .ko-l-faces>*+*{margin-left:-20px}
/* the manager's place is an outline: Navid has not taken his seat yet */
.ch-kickoff .ko-l-empty{background:#F2F0ED;border:1.5px dashed rgba(31,29,30,.3)}
.ch-kickoff .ko-l-face{overflow:hidden;box-shadow:0 0 0 3px #fff}
.ch-kickoff .ko-l-face img{width:100%;height:100%;object-fit:cover;display:block}
.ch-kickoff .ko-l-face::after{content:'';position:absolute;left:0;top:0;width:100%;height:100%;border-radius:50%;box-shadow:inset 0 0 10px rgba(232,228,223,.6)}
.ch-kickoff .ko-l-who{margin:14px 0 0;font:500 16px/1.25 var(--f-sans);color:#2A2118}
.ch-kickoff .ko-l-with{margin:4px 0 0;font:400 15px/1.25 var(--f-sans);color:rgba(0,0,0,.42)}

.ch-kickoff .ko-l-cta{margin-top:34px;min-height:54px}
.ch-kickoff .ko-l-cta .ko-l-sk i{width:176px;height:54px;border-radius:999px}
/* the app's ink pill. Here it is Navid's pointer that presses it, so it does not take the mouse. */
.ch-kickoff .ko-join{appearance:none;border:0;position:relative;overflow:hidden;height:54px;padding:0 46px;border-radius:999px;background:#1F1D1E;color:#fff;
  font:500 16px/1 var(--f-sans);letter-spacing:-.01em;pointer-events:none;
  box-shadow:0 10px 28px -8px rgba(31,29,30,.5),0 3px 8px -3px rgba(31,29,30,.35);
  opacity:0;transform:translateY(10px);filter:blur(6px);
  transition:opacity .45s var(--zt-ease),transform .6s var(--zt-ease),filter .45s var(--zt-ease)}
.ch-kickoff .ko-join::before{content:'';position:absolute;left:0;top:0;width:100%;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0))}
.ch-kickoff .ko-join span{position:relative}
.ch-kickoff .ko-l-part.ko-on .ko-join{opacity:1;transform:none;filter:none}
.ch-kickoff .ko-l-part.ko-on .ko-join.ko-down{transform:scale(.95);transition:transform .12s ease-out}

/* Join: the words leave fast, the card grows until it is the room, then the meeting is there */
.ch-kickoff.ko-joining .ko-l-in{opacity:0;transition:opacity .13s ease-out}
.ch-kickoff.ko-joining .ko-l-card{transform:scale(3.4);background:#F2F0ED;box-shadow:none}
.ch-kickoff.ko-met .ko-landing{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .4s var(--zt-ease),visibility 0s linear .4s}

/* ================= the meeting ================= */
/* every part of the room rises in once, after Join */
.ch-kickoff .ko-back,.ch-kickoff .ko-slot,.ch-kickoff .ko-seat,.ch-kickoff .ko-mate,.ch-kickoff .ko-band,.ch-kickoff .ko-notes{opacity:0;transform:translateY(16px);
  transition:opacity .5s var(--zt-ease),transform .7s var(--zt-ease)}
.ch-kickoff.ko-met .ko-back,.ch-kickoff.ko-met .ko-slot,.ch-kickoff.ko-met .ko-seat,.ch-kickoff.ko-met .ko-mate,.ch-kickoff.ko-met .ko-band,.ch-kickoff.ko-met .ko-notes{opacity:1;transform:none}
.ch-kickoff.ko-met .ko-m1{transition-delay:.06s}
.ch-kickoff.ko-met .ko-m2{transition-delay:.12s}
.ch-kickoff.ko-met .ko-notes{transition-delay:.16s}
.ch-kickoff.ko-met .ko-band{transition-delay:.2s}

/* top bar: the way out, as the kickoff has it */
.ch-kickoff .ko-back{position:absolute;left:32px;top:22px;width:44px;height:44px;border-radius:50%;background:var(--ko-seat);
  display:grid;place-items:center;color:var(--ko-t1)}
.ch-kickoff .ko-back svg{width:18px;height:18px;display:block}

/* the presenter's seat. .ko-slot stays empty: the guide takes its box and its radius */
.ch-kickoff .ko-slot,.ch-kickoff .ko-seat{position:absolute;left:32px;top:84px;width:820px;height:520px;border-radius:24px}
.ch-kickoff .ko-slot{background:var(--ko-seat)}
.ch-kickoff .ko-seat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;pointer-events:none}
.ch-kickoff .ko-seat i{width:76px;height:76px;border-radius:50%;border:1.5px dashed rgba(31,29,30,.26)}
.ch-kickoff .ko-seat span{font:400 14px/1 var(--f-sans);color:var(--ko-t2)}
.ch-kickoff.ko-met.ko-live .ko-seat{opacity:0;transition:opacity .3s var(--zt-ease)}

/* teammates */
.ch-kickoff .ko-mate{position:absolute;left:864px;width:240px;height:254px;border-radius:24px;overflow:hidden;background:var(--ko-seat)}
.ch-kickoff .ko-m1{top:84px}
.ch-kickoff .ko-m2{top:350px}
.ch-kickoff .ko-mate img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:block}
.ch-kickoff .ko-mate::after{content:'';position:absolute;left:0;right:0;bottom:0;height:40%;pointer-events:none;
  background:linear-gradient(0deg,rgba(0,0,0,.52),rgba(0,0,0,0))}
.ch-kickoff .ko-mate b{position:absolute;left:16px;bottom:14px;z-index:1;font:600 13.5px/1.1 var(--f-sans);color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.55)}
.ch-kickoff .ko-mate i{position:absolute;right:11px;bottom:9px;z-index:1;width:26px;height:26px;border-radius:50%;background:rgba(16,16,16,.6);
  display:grid;place-items:center;color:#fff}
.ch-kickoff .ko-mate i svg{width:14px;height:14px;display:block}

/* the meeting strip: what this call is, and the brief's three numbers as he says them */
.ch-kickoff .ko-band{position:absolute;left:32px;top:616px;width:1072px;height:132px;border-radius:24px;background:var(--ko-card);
  display:flex;align-items:center;padding:0 40px 0 26px}
.ch-kickoff .ko-logo{flex:none;width:46px;height:46px;border-radius:14px;background:#fff;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(31,29,30,.09)}
.ch-kickoff .ko-logo img{width:26px;height:26px;display:block}
.ch-kickoff .ko-ttl{margin-left:16px;margin-right:24px;min-width:0}
.ch-kickoff .ko-ttl span{display:block;font:400 13px/1 var(--f-sans);color:var(--ko-t2)}
.ch-kickoff .ko-ttl h2{margin:8px 0 0;font:500 19px/1.2 var(--f-sans);letter-spacing:-.015em;color:var(--ko-t1);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-kickoff .ko-stat{margin-left:auto;flex:none;display:flex;align-items:flex-start;gap:44px}
.ch-kickoff .ko-num{display:flex;flex-direction:column;gap:9px;opacity:0;transform:translateY(12px);filter:blur(8px);
  transition:opacity .5s var(--zt-ease),transform .6s var(--zt-ease),filter .5s var(--zt-ease)}
.ch-kickoff .ko-num b{display:block;font:400 60px/.82 var(--f-serif);letter-spacing:-.03em;color:var(--ko-t1);font-variant-numeric:lining-nums}
.ch-kickoff .ko-num span{display:block;font:400 13px/1 var(--f-sans);color:var(--ko-t2);white-space:nowrap}
.ch-kickoff .ko-goal b{color:var(--ko-ok)}
.ch-kickoff .ko-num.ko-on{opacity:1;transform:none;filter:none}

/* notes: the panel the kickoff keeps on the right. Type is a step larger here: the pop-up draws it at 90%. */
.ch-kickoff .ko-notes{position:absolute;left:1128px;top:84px;width:440px;height:664px;border-radius:24px;background:var(--ko-card);
  overflow:hidden;display:flex;flex-direction:column}
.ch-kickoff .ko-n-head{flex:none;height:54px;padding:0 24px;display:flex;align-items:center;gap:10px;background:#f1f0ee;
  font:500 15px/1 var(--f-sans);color:#2a2118}
.ch-kickoff .ko-n-head svg{width:18px;height:18px;display:block;flex:none;color:#b98a00}
.ch-kickoff .ko-n-body{flex:1;min-height:0;display:flex;flex-direction:column;padding:24px 24px 20px}
.ch-kickoff .ko-n-body h3{flex:none;margin:0 0 16px;font:600 16.5px/1.2 var(--f-sans);color:var(--ko-t1)}
.ch-kickoff .ko-list{flex:0 1 auto;min-height:0;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;
  overflow-y:auto;scrollbar-width:none}
.ch-kickoff .ko-list::-webkit-scrollbar{display:none}
.ch-kickoff .ko-list:not(:empty){margin-bottom:16px}
.ch-kickoff .ko-note{position:relative;flex:none;display:flex;align-items:flex-start;gap:11px;animation:ko-rise .45s var(--zt-ease) both}
.ch-kickoff .ko-note svg{flex:none;width:21px;height:21px;margin-top:1px;display:block;color:rgba(31,29,30,.38);animation:ko-pop .3s cubic-bezier(.34,1.56,.64,1) both;transition:color .3s var(--zt-ease)}
.ch-kickoff .ko-note svg path{stroke-dasharray:20;animation:ko-draw .38s ease-out .12s both}
.ch-kickoff .ko-note div{min-width:0}
.ch-kickoff .ko-note p{margin:0;font:400 15.5px/1.5 var(--f-sans);color:#2a2118;overflow-wrap:anywhere}
.ch-kickoff .ko-note span{display:block;margin-top:3px;font:400 13.5px/1.38 var(--f-sans);color:var(--ko-t2)}
/* green only when the note really carries the numbers */
.ch-kickoff .ko-note.ko-good svg{color:#49BA61}
.ch-kickoff .ko-note.ko-good span{color:var(--ko-ok)}
/* where the skill points rise from: beside the note, never on its words */
.ch-kickoff .ko-note em{position:absolute;right:66px;top:-26px;width:0;height:0}
@keyframes ko-rise{from{opacity:0;transform:translateY(8px)}}
@keyframes ko-pop{from{transform:scale(.35)}}
@keyframes ko-draw{from{stroke-dashoffset:20}}

/* the next line of the notes: where the learner writes. Two lines, so a full note is never cut off. */
.ch-kickoff .ko-field{position:relative;flex:none}
.ch-kickoff .ko-in{appearance:none;display:block;width:100%;height:72px;margin:0;border:0;outline:0;resize:none;overflow:hidden;border-radius:16px;padding:13px 78px 13px 38px;
  background:var(--ko-well);box-shadow:inset 0 0 0 1px var(--ko-line);color:var(--ko-t1);font:400 16px/23px var(--f-sans);letter-spacing:-.01em;
  caret-color:#49BA61;transition:box-shadow .2s var(--zt-ease)}
.ch-kickoff .ko-in::placeholder{color:rgba(31,29,30,.4)}
.ch-kickoff .ko-in:focus{box-shadow:inset 0 0 0 1.5px rgba(31,29,30,.44)}
.ch-kickoff .ko-field i{position:absolute;left:18px;top:21px;width:7px;height:7px;border-radius:50%;background:rgba(31,29,30,.5);pointer-events:none}
.ch-kickoff .ko-field kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:500 12px/1 var(--f-sans);color:rgba(31,29,30,.62);
  border:1px solid rgba(31,29,30,.16);border-bottom-width:2px;border-radius:7px;padding:5px 8px 6px;background:#fff;pointer-events:none}
.ch-kickoff .ko-help{position:relative;flex:none;min-height:40px;margin-top:12px}
.ch-kickoff .ko-nudge{position:absolute;left:6px;right:6px;top:0;margin:0;padding:0;text-align:left;
  font:400 13px/1.45 var(--f-sans);letter-spacing:-.01em;color:var(--ko-t2);opacity:0;transform:translateY(4px);pointer-events:none;
  transition:opacity .35s var(--zt-ease),transform .45s var(--zt-ease)}
/* the note to take. It is there from the first moment of the turn, and one click fills it in. */
.ch-kickoff .ko-hint{appearance:none;display:block;width:100%;margin:0;border:0;cursor:pointer;text-align:left;padding:14px 16px 15px;border-radius:16px;
  background:var(--ko-well);box-shadow:inset 0 0 0 1px var(--ko-line);opacity:0;transform:translateY(8px);pointer-events:none;
  transition:opacity .35s var(--zt-ease),transform .5s var(--zt-ease),box-shadow .2s var(--zt-ease)}
.ch-kickoff .ko-hint span{display:inline-block;height:24px;padding:0 10px;border-radius:999px;background:#1f1d1e;color:#fff;font:600 12.5px/24px var(--f-sans);letter-spacing:-.005em}
.ch-kickoff .ko-hint b{display:block;margin-top:11px;font:500 16px/1.42 var(--f-sans);letter-spacing:-.012em;color:var(--ko-t1);text-wrap:balance}
.ch-kickoff .ko-hint i{display:block;margin-top:9px;font:400 13px/1.4 var(--f-sans);font-style:normal;letter-spacing:-.005em;color:var(--ko-t2);transition:color .2s}
.ch-kickoff .ko-hint:hover{box-shadow:inset 0 0 0 1.5px rgba(31,29,30,.4)}
.ch-kickoff.ko-hinting .ko-hint{opacity:1;transform:none;pointer-events:auto}
.ch-kickoff.ko-hinting.ko-short .ko-hint i{color:#8a5a08}
.ch-kickoff.ko-short:not(.ko-hinting) .ko-nudge{opacity:1;transform:none}

/* ch/04-pou.css */
/* 4 · the conversation with your manager (v2). The workspace's voice check, rebuilt small:
   the white understanding pill, the voice-note card, one mic, and one "Try saying this" card.
   Dark tokens from the app. Drawn inside the pop-up at 90%, so the sentence to read is set large. */
.ch-pou{background:#1E1E1E;color:#f2f1ee;font-family:var(--f-sans);letter-spacing:-.01em;
  --pu-card:#262626;--pu-soft:#282828;--pu-bubble:#333333;--pu-line:rgba(255,255,255,.075);--pu-line2:rgba(255,255,255,.04);
  --pu-tx:#f2f1ee;--pu-tx2:#a5a29b;--pu-tx3:#6d6a63;--pu-tx4:#4a4844;--pu-ok:#3fb968}

/* ---------- the understanding pill: white, three checks, the brain greens when full ---------- */
.ch-pou .pu-top{position:absolute;left:0;right:0;top:26px;display:flex;justify-content:center}
.ch-pou .pu-pill{display:inline-flex;align-items:center;gap:12px;height:40px;padding:0 13px 0 17px;border-radius:999px;background:#fff;color:#1f1d1e;white-space:nowrap;
  box-shadow:0 16px 30px -8px rgba(0,0,0,.42),0 3px 10px rgba(0,0,0,.22)}
.ch-pou .pu-pill-l{font:600 13.5px/1 var(--f-sans);letter-spacing:-.01em}
.ch-pou .pu-meter{display:inline-flex;gap:5px}
.ch-pou .pu-meter i{width:26px;height:6px;border-radius:99px;background:rgba(31,29,30,.13);
  transition:background .5s var(--zt-ease),transform .45s cubic-bezier(.34,1.56,.64,1)}
.ch-pou .pu-meter i.pu-on{background:linear-gradient(90deg,#49ba61,#aff4be)}
.ch-pou .pu-meter i.pu-pop{transform:scaleY(1.7)}
.ch-pou .pu-brain{display:block;width:21px;height:21px;color:#9a9896;transition:color .48s var(--zt-ease)}
.ch-pou .pu-pill.pu-full .pu-brain{color:#49ba61}
.ch-pou .pu-pill.pu-full{animation:pou-full .9s var(--zt-ease) 1}
@keyframes pou-full{0%{transform:scale(1)}38%{transform:scale(1.045)}100%{transform:scale(1)}}

/* ---------- the thread: one 600px column, voice notes only ---------- */
.ch-pou .pu-thread{position:absolute;left:500px;top:84px;width:600px;height:452px;padding:0 28px;display:flex;flex-direction:column;gap:20px;
  overflow-y:auto;scrollbar-width:none}
.ch-pou .pu-thread::-webkit-scrollbar{display:none}
.ch-pou .pu-thread>*{flex:0 0 auto}
.ch-pou.pu-told .pu-thread{height:516px}
.ch-pou .pu-who{display:flex;align-items:baseline;gap:8px;height:16px;margin:0 0 -10px 51px;white-space:nowrap;
  opacity:0;transform:translateY(4px);transition:opacity .4s var(--zt-ease),transform .5s var(--zt-ease)}
.ch-pou.pu-seated .pu-who{opacity:1;transform:none}
.ch-pou .pu-who b{font:600 13px/16px var(--f-sans);color:var(--pu-tx)}
.ch-pou .pu-who span{font:400 12.5px/16px var(--f-sans);color:var(--pu-tx3)}

.ch-pou .pu-note{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.ch-pou .pu-note.pu-me{align-items:flex-end;transition:opacity .3s var(--zt-ease)}
.ch-pou .pu-note.pu-me.pu-miss{opacity:.5}
.ch-pou .pu-row{display:flex;align-items:center;gap:11px}
/* Navid's seat. The slot never animates, so the engine can always measure it. */
.ch-pou .pu-avw{position:relative;width:40px;height:40px;flex:0 0 40px}
.ch-pou .pu-slot{position:absolute;inset:0;border-radius:50%;background:var(--pu-card);box-shadow:inset 0 0 0 1px var(--pu-line)}
.ch-pou .pu-slot::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none}
.ch-pou.pu-seated .pu-slot::after{animation:pou-land .8s var(--zt-ease) 1}
@keyframes pou-land{from{box-shadow:0 0 0 0 rgba(73,186,97,.6)}to{box-shadow:0 0 0 13px rgba(73,186,97,0)}}

.ch-pou .pu-card,.ch-pou .pu-tr{opacity:0;transform:translateY(8px);filter:blur(10px);
  transition:opacity .5s var(--zt-ease),transform .6s var(--zt-ease),filter .5s var(--zt-ease)}
.ch-pou .pu-note.pu-on .pu-card,.ch-pou .pu-note.pu-on .pu-tr{opacity:1;transform:none;filter:none}
.ch-pou .pu-card{display:flex;align-items:center;gap:13px;height:54px;padding:0 16px 0 7px;border-radius:26px;background:var(--pu-soft);box-shadow:inset 0 0 0 1px var(--pu-line2)}
.ch-pou .pu-me .pu-card{background:var(--pu-bubble);box-shadow:none}
.ch-pou.pu-seated .pu-note:first-of-type .pu-card{animation:pou-wake .55s var(--zt-ease) 1}
@keyframes pou-wake{40%{transform:scale(1.035)}100%{transform:none}}
.ch-pou .pu-play{width:40px;height:40px;flex:0 0 40px;border-radius:99px;background:var(--pu-card);box-shadow:inset 0 0 0 1px var(--pu-line);display:grid;place-items:center;color:var(--pu-tx)}
.ch-pou .pu-play svg{display:block;width:16px;height:16px}
.ch-pou .pu-play .pu-i-pause{display:none}
.ch-pou .pu-note.pu-playing .pu-play .pu-i-play{display:none}
.ch-pou .pu-note.pu-playing .pu-play .pu-i-pause{display:block}
.ch-pou .pu-wave{display:flex;align-items:center;gap:2.5px;height:26px}
.ch-pou .pu-wave i{width:2.5px;border-radius:9px;background:var(--pu-tx4);flex:0 0 auto;transition:background .12s linear}
.ch-pou .pu-wave i.pu-lit{background:var(--pu-tx)}
.ch-pou .pu-me .pu-wave i{background:rgba(255,255,255,.2);transition:background .3s linear,height .14s linear}
.ch-pou .pu-me .pu-wave i.pu-lit{background:rgba(255,255,255,.38)}
.ch-pou .pu-me.pu-rec .pu-wave i.pu-lit{background:var(--pu-tx)}
.ch-pou .pu-note.pu-playing .pu-wave i{animation:pou-wave 1s ease-in-out infinite alternate}
@keyframes pou-wave{from{transform:scaleY(.42)}to{transform:scaleY(1)}}
.ch-pou .pu-dur{flex:0 0 auto;min-width:27px;font:400 11px/1 var(--f-mono);color:var(--pu-tx3);font-variant-numeric:tabular-nums}
/* while the learner is recording, the play button is a record light */
.ch-pou .pu-me.pu-rec .pu-play svg{display:none}
.ch-pou .pu-me.pu-rec .pu-play::after{content:"";width:10px;height:10px;border-radius:50%;background:#ff6a4d;animation:pou-blink 1s ease-in-out infinite alternate}
@keyframes pou-blink{from{opacity:.35}to{opacity:1}}

/* the transcript: real voice-note chrome, closed until asked for */
.ch-pou .pu-tr{appearance:none;border:0;background:none;display:inline-flex;align-items:center;gap:6px;margin-left:51px;padding:2px 4px;border-radius:6px;cursor:pointer;
  font:700 10px/12px var(--f-mono);letter-spacing:1.5px;text-transform:uppercase;color:var(--pu-tx3)}
.ch-pou .pu-tr:hover{color:var(--pu-tx2)}
.ch-pou .pu-tr svg{width:13px;height:13px;transition:transform .24s var(--zt-ease)}
.ch-pou .pu-note.pu-open .pu-tr svg{transform:rotate(180deg)}
.ch-pou .pu-trb{display:none;margin-left:55px;max-width:440px;font:400 13px/1.6 var(--f-sans);color:var(--pu-tx2)}
.ch-pou .pu-note.pu-open .pu-trb{display:block;animation:pou-in .4s var(--zt-ease) 1}
@keyframes pou-in{from{opacity:0;transform:translateY(6px);filter:blur(6px)}}

/* the learner's own words, live, under their note. Two lines, newest kept in view. */
.ch-pou .pu-said{display:none;flex-direction:column;justify-content:flex-end;max-width:470px;max-height:63px;overflow:hidden;padding:0 4px;text-align:right;
  font:400 13.5px/21px var(--f-sans);color:var(--pu-tx2)}
.ch-pou .pu-me.pu-has .pu-said{display:flex}
.ch-pou .pu-said b,.ch-pou .pu-bubble b{font-weight:600;color:var(--pu-tx)}
.ch-pou .pu-bubble{display:none;max-width:82%;padding:10px 15px;border-radius:20px;background:var(--pu-bubble);font:400 14px/1.5 var(--f-sans);color:var(--pu-tx2);overflow-wrap:break-word}
.ch-pou .pu-me.pu-typed .pu-row,.ch-pou .pu-me.pu-typed .pu-said{display:none}
.ch-pou .pu-me.pu-typed .pu-bubble{display:block;animation:pou-in .45s var(--zt-ease) 1}

/* ---------- what to say, and the one mic ---------- */
.ch-pou .pu-bottom{position:absolute;left:380px;top:476px;width:840px;height:280px}
/* "Try saying this": the sentence, big enough to read aloud. Its four facts light as they are heard.
   Anchored by its bottom edge, so a longer sentence grows upward and never pushes the mic. */
.ch-pou .pu-try{position:absolute;left:0;right:0;bottom:164px;padding:16px 26px 19px;border-radius:24px;background:var(--pu-card);box-shadow:inset 0 0 0 1px var(--pu-line);
  opacity:0;transform:translateY(12px);filter:blur(8px);pointer-events:none;
  transition:opacity .45s var(--zt-ease),transform .6s var(--zt-ease),filter .45s var(--zt-ease)}
.ch-pou.pu-ask .pu-try{opacity:1;transform:none;filter:none}
.ch-pou.pu-told .pu-try{opacity:0;transform:translateY(8px) scale(.985);filter:blur(8px);transition-duration:.3s,.4s,.3s}
.ch-pou .pu-try-l{display:inline-block;height:26px;padding:0 11px;border-radius:999px;background:#f4f3f1;color:#161616;font:600 13px/26px var(--f-sans);letter-spacing:-.005em}
.ch-pou .pu-try-t{margin:9px 0 0;font:500 24px/34px var(--f-sans);letter-spacing:-.015em;color:var(--pu-tx);text-wrap:balance}
.ch-pou .pu-f{display:inline-block;padding:0 7px;margin:0 -4px;border-radius:9px;background:rgba(255,255,255,.085);
  transition:background .35s var(--zt-ease),box-shadow .35s var(--zt-ease),color .35s var(--zt-ease)}
.ch-pou .pu-f.pu-hit{background:rgba(63,185,104,.24);box-shadow:inset 0 0 0 1px rgba(63,185,104,.55);color:#fff;animation:pou-ping .5s var(--zt-ease) 1}
@keyframes pou-ping{40%{transform:scale(1.06)}100%{transform:none}}
.ch-pou.pu-recap .pu-said b{animation:pou-said .9s var(--zt-ease) 1}
@keyframes pou-said{35%{color:#6fd189}100%{color:var(--pu-tx)}}

/* every mic state gets one short line, right above the mic */
.ch-pou .pu-line{position:absolute;left:0;right:0;top:132px;height:20px;text-align:center;white-space:nowrap;font:400 13.5px/20px var(--f-sans);color:var(--pu-tx2);
  opacity:0;transform:translateY(4px);transition:opacity .24s var(--zt-ease),transform .36s var(--zt-ease)}
.ch-pou .pu-line.pu-show{opacity:1;transform:none}
.ch-pou .pu-line b{font-weight:600;color:var(--pu-tx)}

.ch-pou .pu-ctl{position:absolute;left:0;right:0;top:158px;height:58px;display:flex;justify-content:center}
.ch-pou .pu-mic{appearance:none;border:0;margin:0;padding:0;position:relative;display:inline-flex;align-items:center;height:58px;min-width:58px;border-radius:999px;cursor:pointer;
  background:var(--pu-card);color:var(--pu-tx);box-shadow:inset 0 0 0 1px var(--pu-line),0 1px 3px rgba(0,0,0,.4);touch-action:none;-webkit-user-select:none;user-select:none;
  opacity:.38;filter:grayscale(1);pointer-events:none;
  transition:opacity .4s var(--zt-ease),filter .4s var(--zt-ease),background .3s var(--zt-ease),color .3s var(--zt-ease),box-shadow .3s var(--zt-ease),padding .45s var(--zt-ease),transform .3s var(--zt-ease)}
.ch-pou.pu-ready .pu-mic{opacity:1;filter:none;pointer-events:auto}
.ch-pou.pu-ready .pu-mic:hover{background:#2d2d2d}
.ch-pou .pu-mic-ic{width:58px;height:58px;flex:0 0 58px;display:grid;place-items:center}
.ch-pou .pu-mic-ic>*{grid-area:1/1}
.ch-pou .pu-mic-d{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;transition:background .3s var(--zt-ease),color .3s var(--zt-ease)}
.ch-pou .pu-mic-d svg{display:block;width:23px;height:23px}
.ch-pou .pu-mic-d .pu-i-tick,.ch-pou .pu-spin{display:none}
.ch-pou .pu-spin{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.16);border-top-color:var(--pu-tx);animation:pou-spin .8s linear infinite}
@keyframes pou-spin{to{transform:rotate(360deg)}}
.ch-pou .pu-live{display:flex;align-items:center;gap:2.5px;height:24px;width:0;overflow:hidden;opacity:0;transition:width .45s var(--zt-ease),opacity .3s var(--zt-ease)}
.ch-pou .pu-live i{width:2.5px;height:3px;border-radius:9px;background:var(--pu-tx);flex:0 0 auto;transition:height .07s linear}
.ch-pou .pu-time{width:0;overflow:hidden;opacity:0;text-align:right;font:400 11px/1 var(--f-mono);color:var(--pu-tx2);font-variant-numeric:tabular-nums;
  transition:width .45s var(--zt-ease),opacity .3s var(--zt-ease),margin .45s var(--zt-ease)}
/* listening: the mic opens into a live bar */
.ch-pou[data-mic="listening"] .pu-mic{padding-right:20px;background:#2c2c2c;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),0 1px 3px rgba(0,0,0,.4)}
.ch-pou[data-mic="listening"] .pu-mic-d{background:#fff;color:#0d0d0d}
.ch-pou[data-mic="listening"] .pu-live{width:128px;opacity:1}
.ch-pou[data-mic="listening"] .pu-time{width:30px;margin-left:12px;opacity:1}
/* checking: a short wait */
.ch-pou[data-mic="checking"] .pu-mic{pointer-events:none}
.ch-pou[data-mic="checking"] .pu-i-mic{display:none}
.ch-pou[data-mic="checking"] .pu-spin{display:block}
/* no mic: it steps back, the field takes over */
.ch-pou[data-mic="denied"] .pu-mic{opacity:.38;filter:grayscale(1)}
/* passed */
.ch-pou.pu-passed .pu-mic{background:var(--pu-ok);color:#06210f;box-shadow:none;pointer-events:none;opacity:1;filter:none;animation:pou-wake .55s var(--zt-ease) 1}
.ch-pou.pu-passed .pu-mic-d .pu-i-mic,.ch-pou.pu-passed .pu-spin{display:none}
.ch-pou.pu-passed .pu-mic-d .pu-i-tick{display:block}
.ch-pou.pu-passed .pu-mic-d{background:none;color:inherit}

/* the product's own label under the mic */
.ch-pou .pu-hint{position:absolute;left:0;right:0;top:226px;text-align:center;font:700 10px/12px var(--f-mono);letter-spacing:1.6px;text-transform:uppercase;color:var(--pu-tx3);
  opacity:.45;transition:opacity .3s var(--zt-ease),color .3s var(--zt-ease)}
.ch-pou .pu-hint b{font-weight:700;color:var(--pu-tx2)}
.ch-pou.pu-ready .pu-hint{opacity:1}
.ch-pou[data-mic="listening"] .pu-hint,.ch-pou[data-mic="checking"] .pu-hint{opacity:0}
.ch-pou.pu-passed .pu-hint{opacity:1;color:#6fd189}
.ch-pou .pu-alt{appearance:none;border:0;background:none;position:absolute;left:50%;top:244px;transform:translateX(-50%);padding:5px 9px;border-radius:8px;cursor:pointer;white-space:nowrap;
  font:500 12.5px/16px var(--f-sans);letter-spacing:-.01em;color:var(--pu-tx3);opacity:.45;pointer-events:none;transition:opacity .3s var(--zt-ease),color .2s}
.ch-pou.pu-ready .pu-alt{opacity:1;pointer-events:auto}
.ch-pou .pu-alt:hover{color:var(--pu-tx)}
.ch-pou[data-mic="listening"] .pu-alt,.ch-pou[data-mic="checking"] .pu-alt{opacity:0;pointer-events:none}

/* the typed way through: the app's answer box */
.ch-pou .pu-field{position:absolute;left:148px;right:148px;top:224px;height:46px;display:none;align-items:center;gap:8px;padding:0 6px 0 18px;border-radius:26px;
  background:var(--pu-card);box-shadow:inset 0 0 0 1px var(--pu-line);transition:box-shadow .2s}
.ch-pou .pu-field:focus-within{box-shadow:inset 0 0 0 1px rgba(255,255,255,.24)}
.ch-pou.pu-typing .pu-field{display:flex;animation:pou-in .4s var(--zt-ease) 1}
.ch-pou.pu-typing .pu-hint,.ch-pou.pu-typing .pu-alt{display:none}
.ch-pou .pu-in{flex:1;min-width:0;height:34px;border:0;outline:0;background:none;color:var(--pu-tx);font:400 14px/1 var(--f-sans);letter-spacing:-.01em}
.ch-pou .pu-in::placeholder{color:var(--pu-tx3)}
.ch-pou .pu-send{appearance:none;border:0;padding:0;width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:#fff;color:#0d0d0d;display:grid;place-items:center;cursor:pointer;
  transition:opacity .2s,transform .24s var(--zt-ease)}
.ch-pou .pu-send svg{display:block;width:17px;height:17px}
.ch-pou .pu-send:disabled{opacity:.3;cursor:default}
.ch-pou .pu-send:not(:disabled):hover{transform:scale(1.06)}
.ch-pou.pu-passed .pu-alt,.ch-pou.pu-passed .pu-field,.ch-pou.pu-passed .pu-line{display:none}
.ch-pou.pu-passed .pu-hint{display:block}

@media (prefers-reduced-motion:reduce){
  .ch-pou .pu-note.pu-playing .pu-wave i,.ch-pou .pu-spin,.ch-pou .pu-me.pu-rec .pu-play::after{animation:none}
}

/* ch/05-workspace.css */
/* 5 · workspace, feedback, coach. A small rebuild of the dark Stage workspace by hand:
   top bar, rail, chat with the peer header and the composer pill, right panel, coach.
   Proportions and tokens follow the real screen (rail 312, chat column 600, panel 376, coach 352).
   It is shown inside the pop-up at 90%, so the type sits one notch above the app's own
   scale: on screen it lands back at app size. Mono caps only where the real rail and
   panel carry them. Columns are separated by space and surface, never by a rule. */
.ch-workspace{
  --ws-bg:#1E1E1E;--ws-card:#262626;--ws-bubble:#333333;--ws-soft:#282828;--ws-hover:rgba(255,255,255,.06);
  --ws-line:rgba(255,255,255,.075);--ws-line-2:rgba(255,255,255,.04);
  --ws-tx:#f2f1ee;--ws-tx-2:#a5a29b;--ws-tx-3:#6d6a63;--ws-tx-4:#4a4844;
  --ws-ok:#3fb968;--ws-fix:#ff6a4d;--ws-meets:#e7b90a;--ws-exceeds:#4ade80;--ws-guided:#f5b73d;
  --ws-shift:.76s; /* a panel opening rides the same clock as Navid's flight, so he and his seat move as one */
  background:var(--ws-bg);color:var(--ws-tx);font-family:var(--f-sans);font-size:14.5px;line-height:1.55;letter-spacing:-.01em}
.ch-workspace svg{display:block}
.ch-workspace .ws-lbl{display:block;font-family:var(--f-mono);font-size:11px;font-weight:700;line-height:1.5;letter-spacing:1.4px;text-transform:uppercase;color:var(--ws-tx-2)}

/* ---------- top bar ---------- */
.ch-workspace .ws-top{position:absolute;left:0;right:0;top:0;height:52px;display:flex;align-items:center;padding:0 16px}
.ch-workspace .ws-back{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--ws-tx-2)}
.ch-workspace .ws-back svg{width:20px;height:20px}

/* ---------- the columns. Everything ends above y = 760: the pop-up crops just below it ---------- */
.ch-workspace .ws-work{position:absolute;left:0;right:0;top:52px;height:712px;display:flex}

/* ---------- rail ---------- */
.ch-workspace .ws-rail{flex:0 0 312px;min-width:0;display:flex;flex-direction:column}
.ch-workspace .ws-brand{flex:0 0 54px;display:flex;align-items:center;gap:11px;padding:0 20px}
.ch-workspace .ws-logo{flex:0 0 auto;width:38px;height:38px;border-radius:99px;background:var(--ws-card);border:1px solid var(--ws-line);display:grid;place-items:center}
.ch-workspace .ws-logo img{width:19px;height:21px;display:block}
.ch-workspace .ws-brand-t{font-size:15px;font-weight:600;line-height:1.26}
.ch-workspace .ws-rail-body{flex:1;min-height:0;padding:16px 16px 0}
.ch-workspace .ws-stages{border-radius:16px}
.ch-workspace .ws-active{border:1px solid var(--ws-line);border-radius:16px;padding:16px 16px 9px;margin-bottom:12px}
.ch-workspace .ws-stage-t{font-size:20px;font-weight:700;line-height:1.22;letter-spacing:-.02em;margin-bottom:17px}
.ch-workspace .ws-reqs{margin-top:5px}
.ch-workspace .ws-req{display:flex;align-items:flex-start;gap:10px;padding:9px 10px;margin:0 -8px 2px;border-radius:10px}
.ch-workspace .ws-req-b{flex:1;min-width:0}
.ch-workspace .ws-req-t{font-size:14px;font-weight:600;line-height:1.38;text-wrap:pretty}
.ch-workspace .ws-req-tag{display:grid;grid-template-rows:0fr;transition:grid-template-rows .48s var(--zt-ease)}
.ch-workspace .ws-req-tag span{overflow:hidden;min-height:0;font-size:12px;font-weight:600;line-height:1.5;color:var(--ws-fix);opacity:0;transition:opacity .4s var(--zt-ease)}
.ch-workspace .ws-req.ws-miss .ws-req-tag{grid-template-rows:1fr}
.ch-workspace .ws-req.ws-miss .ws-req-tag span{opacity:1}
/* the status mark. At rest it is the rail's own quiet dot. A review turns it into a tick or a "needs work" */
.ch-workspace .ws-mark{position:relative;flex:0 0 auto;width:18px;height:18px;margin-top:1px;border-radius:99px;display:grid;place-items:center;
  border:1.5px solid transparent;color:#fff;transition:background .35s var(--zt-ease),border-color .35s var(--zt-ease),color .35s var(--zt-ease)}
.ch-workspace .ws-mark::before{content:"";width:7px;height:7px;border-radius:99px;background:var(--ws-tx-4);transition:opacity .25s var(--zt-ease),transform .3s var(--zt-ease)}
.ch-workspace .ws-mark i{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transform:scale(.4);transition:opacity .25s var(--zt-ease),transform .4s var(--zt-ease)}
.ch-workspace .ws-mark svg{width:11px;height:11px}
.ch-workspace .ws-checking .ws-mark::after,.ch-workspace .ws-checking .ws-fmark::after{content:"";position:absolute;inset:-4px;border-radius:99px;border:1.5px solid transparent;border-top-color:var(--ws-tx-2);animation:ws-spin .7s linear infinite}
.ch-workspace .ws-req.ws-hit .ws-mark{background:var(--ws-ok);border-color:var(--ws-ok)}
.ch-workspace .ws-req.ws-hit.ws-pop .ws-mark{animation:ws-pop .55s cubic-bezier(.34,1.56,.64,1)}
.ch-workspace .ws-req.ws-miss .ws-mark{border-color:rgba(255,106,77,.6);color:var(--ws-fix)}
.ch-workspace .ws-req.ws-hit .ws-mark::before,.ch-workspace .ws-req.ws-miss .ws-mark::before{opacity:0;transform:scale(.3)}
.ch-workspace .ws-req.ws-hit .ws-i-tick,.ch-workspace .ws-req.ws-miss .ws-i-bang{opacity:1;transform:none}
.ch-workspace .ws-reswrap{margin:10px -6px 0;padding:4px 6px 0;border-radius:12px}
.ch-workspace .ws-res{display:flex;align-items:center;gap:9px;padding:7px 4px;margin:2px -4px 0;border-radius:9px}
.ch-workspace .ws-res-ic{flex:0 0 auto;width:18px;height:18px;display:grid;place-items:center;color:var(--ws-tx-3)}
.ch-workspace .ws-res-ic svg{width:16px;height:16px}
.ch-workspace .ws-res-n{flex:1;min-width:0;font-size:13px;font-weight:500;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-workspace .ws-group{padding:0 0 6px}
.ch-workspace .ws-group-h{display:flex;align-items:center;gap:9px;padding:10px 2px 7px;color:var(--ws-tx-3)}
.ch-workspace .ws-group-h svg{width:16px;height:16px;flex:0 0 auto;transform:rotate(180deg)}
.ch-workspace .ws-group-h .ws-lbl{flex:1;color:inherit}
.ch-workspace .ws-cnt{font-size:12px;font-weight:700;line-height:1}
.ch-workspace .ws-gstep{display:flex;align-items:flex-start;gap:12px;padding:8px 2px;color:var(--ws-tx-3)}
.ch-workspace .ws-gstep svg{flex:0 0 auto;width:18px;height:18px;margin-top:1px;color:var(--ws-tx-4)}

/* ---------- centre: the manager ---------- */
.ch-workspace .ws-center{flex:1 1 0;min-width:0;margin-left:5px;display:flex;flex-direction:column}
.ch-workspace .ws-col{width:min(600px,100%);margin-left:auto;margin-right:auto}
.ch-workspace .ws-ctop{flex:0 0 54px;padding:0 24px;display:flex;align-items:center}
.ch-workspace .ws-peer{padding:0 28px;display:flex;align-items:center}
.ch-workspace .ws-peer-id{display:inline-flex;align-items:center;gap:11px;border-radius:26px}
/* a seat. The engine draws Navid over the empty .ws-slot. The initial underneath is what stays when he leaves */
.ch-workspace .ws-seat{position:relative;flex:0 0 auto}
.ch-workspace .ws-seat b{position:absolute;inset:0;border-radius:50%;background:var(--ws-card);box-shadow:inset 0 0 0 1px var(--ws-line);display:grid;place-items:center;font-size:13px;font-weight:600;line-height:1;color:var(--ws-tx-3)}
.ch-workspace .ws-slot{position:absolute;inset:0;border-radius:50%;display:block}
.ch-workspace .ws-pava{width:36px;height:36px}

.ch-workspace .ws-pname{font-size:14.5px;font-weight:600;line-height:1.2}
.ch-workspace .ws-psub{font-size:12px;line-height:1.2;color:var(--ws-tx-3);margin-top:3px}

.ch-workspace .ws-thread{flex:1 1 0;min-height:0;padding:0 24px;overflow-y:auto;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 20px);mask-image:linear-gradient(to bottom,transparent 0,#000 20px)}
.ch-workspace .ws-thread::-webkit-scrollbar{display:none}
.ch-workspace .ws-thread.ws-scrolled{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 46px);mask-image:linear-gradient(to bottom,transparent 0,#000 46px)}
.ch-workspace .ws-msgs{padding:24px 28px 14px;display:flex;flex-direction:column;gap:24px}

.ch-workspace .ws-m{align-self:flex-start;max-width:430px}
.ch-workspace .ws-m+.ws-m{margin-top:-14px}
.ch-workspace .ws-bub{width:fit-content;max-width:100%;background:var(--ws-soft);border:1px solid var(--ws-line-2);border-radius:20px;padding:10px 15px;font-size:14.5px;line-height:1.5;overflow-wrap:break-word}
.ch-workspace .ws-u{align-self:flex-end;width:fit-content;max-width:400px;background:var(--ws-bubble);border-radius:20px;padding:10px 15px;font-size:14.5px;line-height:1.5;overflow-wrap:break-word}
.ch-workspace .ws-typing{align-self:flex-start;display:flex;align-items:center;gap:6px;padding:8px 2px;margin-top:-8px}

.ch-workspace .ws-typing i:nth-child(3){animation-delay:.32s}
/* a handed-in file */
.ch-workspace .ws-subm{align-self:flex-end;width:258px}
.ch-workspace .ws-att{position:relative;display:flex;align-items:center;gap:12px;padding:9px 14px 9px 9px;border:1px solid var(--ws-line);border-radius:14px;background:var(--ws-card);overflow:hidden;transition:box-shadow .4s var(--zt-ease)}
.ch-workspace .ws-thumb{flex:0 0 auto;width:34px;height:44px;border-radius:5px;background:#f6f5f3;padding:7px 6px 0;display:flex;flex-direction:column;gap:3.5px}
.ch-workspace .ws-thumb i{height:2.5px;border-radius:9px;background:rgba(31,29,30,.2)}
.ch-workspace .ws-thumb i:first-child{width:70%;height:3.5px;background:rgba(31,29,30,.55);margin-bottom:1.5px}
.ch-workspace .ws-thumb i:last-child{width:55%}
.ch-workspace .ws-fmeta{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
