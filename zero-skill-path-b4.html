<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Zero · the job you want</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,100..1000&display=swap">
<style>
/* core.css */
/* ZERO skill path · the shell and the shared parts.
   Three surfaces, all taken from Zero's own screens:
     world  = the city with dark glass on it (the app's home, the tutorial's world)
     paper  = the job portal's warm paper with white cards
   Type is STK Bureau Serif for titles and Google Sans Flex for everything else. Nothing else. */
@font-face{font-family:'STK Bureau Serif';src:url('zero-skill-path-assets-b4/fonts/STKBureau-SerifBook.otf') format('opentype');font-weight:400;font-display:swap}
@font-face{font-family:'STK Bureau Serif';src:url('zero-skill-path-assets-b4/fonts/STKBureau-SerifMedium.otf') format('opentype');font-weight:500;font-display:swap}

:root{
  --ease:cubic-bezier(.625,.05,0,1); --out:cubic-bezier(.16,1,.3,1); --spring:cubic-bezier(.22,1,.36,1);
  --serif:'STK Bureau Serif',Georgia,serif;
  --sans:'Google Sans Flex','Google Sans',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --gold:#FFD56B; --gold-2:#F0B94D; --gold-ink:#3A2A05;
  --ok:#49BA61; --ok-deep:#0C7E45;
  --key-light:linear-gradient(#FFFFFF,#EDEDEA);
  --key-light-sh:inset 0 1px 0 #fff,inset 0 -3px 0 rgba(0,0,0,.1),0 0 0 1px rgba(0,0,0,.18),0 14px 24px -14px rgba(0,0,0,.5);
  --key-dark:linear-gradient(#303432,#181A19);
  --key-dark-sh:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -3px 0 rgba(0,0,0,.5),0 0 0 1px #121413,0 14px 24px -14px rgba(18,20,19,.5);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#131514}
body{font-family:var(--sans);font-size:14px;letter-spacing:-.012em;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-synthesis:none;color:#F4F4F3}
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
svg{display:block}
*{scrollbar-width:none}::-webkit-scrollbar{width:0;height:0}
::selection{background:#FFE9A8;color:#111}

/* ---------- the stage: a 1600 x 840 canvas scaled to fit. The city bleeds past it to the window's edge. ---------- */
#sp-root{position:fixed;inset:0;overflow:hidden;background:#131514;transition:background .5s var(--ease)}
#sp-root[data-tone="paper"]{background:#F8F7F5}
#sp-stage{position:absolute;left:50%;top:50%;width:1600px;height:840px;transform-origin:0 0}

/* tone tokens */
#sp-root{
  --tx:#F4F4F3; --tx-2:rgba(244,244,243,.68); --tx-3:rgba(244,244,243,.44); --tx-4:rgba(244,244,243,.22);
  --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.06);
  --glass:rgba(17,18,19,.60); --glass-2:rgba(255,255,255,.06); --glass-3:rgba(255,255,255,.10);
  --ink:#F4F4F3; --on-ink:#131315;
}
#sp-root[data-tone="paper"]{
  --tx:#1A1917; --tx-2:#5D5A54; --tx-3:#747068; --tx-4:#A9A49B;
  --line:rgba(26,25,23,.09); --line-2:rgba(26,25,23,.05);
  --card:#FFFFFF; --field:#F1F0ED; --wash:#FAF9F7; --sunk:#EDEBE7;
  --ink:#141312; --on-ink:#FFFFFF;
  --sh1:0 1px 2px rgba(26,25,23,.035);
  --sh2:0 2px 8px rgba(26,25,23,.05),0 16px 40px -24px rgba(26,25,23,.24);
  --sh3:0 30px 80px rgba(26,25,23,.20);
  color:var(--tx);
}

/* ---------- the city ---------- */
#sp-map{position:absolute;left:-520px;top:-360px;width:2640px;height:1560px;overflow:hidden;background:#131514;opacity:0;visibility:hidden;transition:opacity .6s var(--ease),visibility 0s .6s}
#sp-root[data-map="1"] #sp-map{opacity:1;visibility:visible;transition:opacity .6s var(--ease)}
/* the city leans toward the pointer. It is a flat shear, not a 3D turn: a 3D turn makes the browser redraw the
   whole city at low resolution, and it goes soft on a sharp screen. */
.mp-tilt{position:absolute;inset:0;transform-origin:1320px 780px;transition:transform 1s var(--out)}
.mp-cam{position:absolute;left:520px;top:360px;width:1600px;height:900px;transform-origin:0 0;--s:1;will-change:transform;
  transition:transform var(--cam,1.4s) var(--ease)}
.mp-city{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
/* the city rests (its picture is the quiet one), so the buildings that are yours carry the colour */
.mp-glow{position:absolute;border-radius:50%;opacity:0;transform-origin:50% 78%;cursor:pointer;
  transition:opacity .9s var(--ease),transform .7s var(--spring)}
.mp-glow i{position:absolute;inset:0;background-image:var(--city);background-repeat:no-repeat;
  -webkit-mask-image:radial-gradient(closest-side,#000 58%,rgba(0,0,0,.6) 78%,transparent 100%);mask-image:radial-gradient(closest-side,#000 58%,rgba(0,0,0,.6) 78%,transparent 100%)}
.mp-on .mp-glow.lit{opacity:1}
.mp-on .mp-glow.hov{opacity:1;transform:scale(1.05) translateY(-.8%)}
.mp-on .mp-glow.dream:not(.lit):not(.hov){opacity:.38}
.mp-road{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.mp-road path{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.mp-road .case{stroke:rgba(10,12,11,.62);stroke-width:9}
.mp-road .ahead{stroke:rgba(255,255,255,.92);stroke-width:3;stroke-dasharray:.1 9}
.mp-road .walked{stroke:#fff;stroke-width:4}
.mp-road .last{stroke:var(--gold);stroke-width:3;stroke-dasharray:.1 9}
.mp-road .rev{stroke:#fff;stroke-width:14;stroke-dasharray:1;stroke-dashoffset:1}
.mp-road.drawn .rev{stroke-dashoffset:0;transition:stroke-dashoffset var(--draw,2.4s) cubic-bezier(.45,.05,.2,1)}
.mp-road.inst .rev{stroke-dashoffset:0;transition:none}
/* anything pinned to the map keeps its size while the camera moves */
.mp-pin{position:absolute;width:0;height:0;transform:scale(calc(1 / var(--s)));transform-origin:0 0;transition:transform var(--cam,1.4s) var(--ease)}
.mp-stop{position:absolute;left:-13px;top:-13px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  background:#1B1D1C;color:#fff;font:600 12px/1 var(--sans);letter-spacing:0;box-shadow:0 0 0 2px rgba(255,255,255,.9),0 4px 10px rgba(0,0,0,.4);
  opacity:0;transform:scale(.4);transition:opacity .3s var(--ease) var(--d,0s),transform .5s var(--spring) var(--d,0s)}
.mp-on .mp-stop{opacity:1;transform:none}
.mp-stop[data-i]{cursor:pointer}
.mp-on .mp-stop.hov{transform:scale(1.16);box-shadow:0 0 0 2px #fff,0 0 0 7px rgba(255,255,255,.22),0 4px 10px rgba(0,0,0,.4);transition:transform .35s var(--spring),box-shadow .3s}
.mp-on .mp-stop.under{opacity:0}
/* you: the marker that stands on the stop you are at, and walks the road when you finish one */
.mp-you-pin{z-index:3}
.mp-you{position:absolute;left:-17px;top:-17px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  background:#fff;color:#141312;font:600 11px/1 var(--sans);letter-spacing:-.01em;padding-bottom:1px;
  box-shadow:0 0 0 2px #141312,0 0 0 4px #fff,0 8px 18px rgba(0,0,0,.5);opacity:0;scale:.5;transition:opacity .3s var(--ease) .2s,scale .6s var(--spring) .2s}
.mp-on .mp-you{opacity:1;scale:1}
.mp-you::after{content:'';position:absolute;inset:-9px;border-radius:50%;border:2px solid rgba(255,255,255,.85);animation:mp-pulse 2.2s var(--out) infinite}
.mp-walking .mp-you::after{animation:none;opacity:0}
.mp-walking .mp-chip{opacity:0!important}
/* the roles a stop opens, as a small stack of marks beside it */
.mp-roles{position:absolute;left:0;top:0;display:flex;opacity:0;scale:.6;transition:opacity .4s var(--ease) var(--d,0s),scale .6s var(--spring) var(--d,0s)}
.mp-roles .sp-lg{box-shadow:0 0 0 2px #fff,0 4px 10px rgba(0,0,0,.45)}
.mp-roles .sp-lg+.sp-lg{margin-left:-7px}
.mp-roles em{align-self:center;margin-left:5px;height:20px;padding:0 7px;border-radius:99px;display:inline-flex;align-items:center;background:#fff;color:#141312;font:600 11px/1 var(--sans);font-style:normal;box-shadow:0 4px 10px rgba(0,0,0,.45)}
.mp-roles.b,.mp-roles.l{transform:translate(18px,-12px)} .mp-roles.r,.mp-roles.t{transform:translate(calc(-100% - 18px),-12px)}
.mp-on.mp-show-roles .mp-roles{opacity:1;scale:1}
.mp-stop.done{background:#fff;color:#141312}
.mp-stop.done svg{width:12px;height:12px}
.mp-stop.now{background:#fff;color:#141312;box-shadow:0 0 0 2px #fff,0 0 0 7px rgba(255,255,255,.28),0 4px 10px rgba(0,0,0,.4)}
.mp-stop.now::after{content:'';position:absolute;inset:-7px;border-radius:50%;border:2px solid rgba(255,255,255,.8);animation:mp-pulse 2.2s var(--out) infinite}
@keyframes mp-pulse{0%{opacity:.9;transform:scale(.8)}100%{opacity:0;transform:scale(1.9)}}
.mp-chip{position:absolute;left:0;top:0;display:flex;align-items:center;gap:7px;height:30px;padding:0 11px 0 5px;border-radius:99px;white-space:nowrap;
  background:rgba(20,21,21,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font:500 13px/1 var(--sans);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 0 1px rgba(0,0,0,.4),0 8px 18px -8px rgba(0,0,0,.6);
  opacity:0;transition:opacity .35s var(--ease) var(--d,0s),translate .5s var(--spring) var(--d,0s);translate:0 6px}
.mp-on .mp-chip{opacity:1;translate:0 0}
.mp-chip.b{transform:translate(-50%,20px)} .mp-chip.t{transform:translate(-50%,-52px)} .mp-chip.r{transform:translate(22px,-15px)} .mp-chip.l{transform:translate(calc(-100% - 22px),-15px)}
.mp-chip.now{background:#fff;color:#141312;box-shadow:0 0 0 1px rgba(0,0,0,.2),0 10px 22px -8px rgba(0,0,0,.6)}
.mp-chip em{font-style:normal;color:var(--ok-deep);font-weight:500;display:flex;align-items:center;gap:5px;margin-left:2px}
.mp-chip em::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--ok)}
.mp-chip.far{opacity:0!important}
.mp-chip.dim{background:rgba(20,21,21,.6);color:rgba(255,255,255,.78)}
/* the job you want, standing on its building */
.mp-dream{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:0;
  opacity:0;translate:0 10px;transition:opacity .5s var(--ease) var(--d,0s),translate .7s var(--spring) var(--d,0s)}
.mp-on .mp-dream{opacity:1;translate:0 0}
.mp-dream-card{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px 0 7px;border-radius:99px;white-space:nowrap;
  background:rgba(20,21,21,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 0 1px rgba(0,0,0,.5),0 0 0 2px rgba(255,213,107,.0),0 14px 30px -10px rgba(0,0,0,.7);
  transition:box-shadow .6s var(--ease),background .6s var(--ease)}
.mp-dream.above{transform:translate(-50%,-100%) translateY(-4px)} .mp-dream.below{transform:translate(-50%,10px)}
.mp-dream-card .tx b{display:block;font:500 14px/1.2 var(--sans);color:#fff;letter-spacing:-.012em}
.mp-dream-card .tx span{display:block;font:400 12px/1.15 var(--sans);color:rgba(255,255,255,.6);margin-top:3px}
.mp-dream-card{cursor:pointer}
.mp-dream-card .tx .segs{display:flex;gap:2.5px;margin-top:7px}
.mp-dream-card .tx .segs i{width:9px;height:3px;border-radius:2px;background:rgba(255,255,255,.2)}
.mp-dream-card .tx .segs i.on{background:var(--gold)}
.mp-dream-card:has(.segs){height:58px}
.mp-dream-card .lk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);color:rgba(255,255,255,.8);margin-left:4px;flex:none}
.mp-dream-card .lk svg{width:13px;height:13px}
.mp-dream i.stem{width:2px;height:14px;background:linear-gradient(rgba(255,255,255,.8),rgba(255,255,255,.1))}
.mp-dream.below i.stem{background:linear-gradient(rgba(255,255,255,.1),rgba(255,255,255,.8))}
.mp-dream.open .mp-dream-card{background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.2),0 0 0 6px rgba(255,213,107,.5),0 0 60px 10px rgba(255,213,107,.55),0 14px 30px -10px rgba(0,0,0,.7)}
.mp-dream.open .mp-dream-card .tx b{color:#141312}.mp-dream.open .mp-dream-card .tx span{color:#5D5A54}
.mp-dream.open .lk{background:var(--ok);color:#fff}
.mp-beam{position:absolute;left:-90px;top:-420px;width:180px;height:440px;pointer-events:none;opacity:0;transition:opacity 1s var(--ease);
  background:radial-gradient(ellipse 50% 6% at 50% 97%,rgba(255,223,140,.9),rgba(255,223,140,0) 70%),linear-gradient(to top,rgba(255,223,140,.5),rgba(255,223,140,0) 85%);
  -webkit-mask-image:linear-gradient(to right,transparent,#000 35%,#000 65%,transparent);mask-image:linear-gradient(to right,transparent,#000 35%,#000 65%,transparent);mix-blend-mode:screen}
.mp-on .mp-beam.on{opacity:.9}
.mp-on .mp-beam.on.soft{opacity:.42}
.mp-shade{position:absolute;inset:0;pointer-events:none;transition:opacity .8s var(--ease),background .8s var(--ease);
  background:linear-gradient(to right,rgba(10,12,11,var(--shl,0)) 0,rgba(10,12,11,var(--shl,0)) 560px,rgba(10,12,11,0) 1290px),
  linear-gradient(to left,rgba(10,12,11,var(--shr,0)) 0,rgba(10,12,11,var(--shr,0)) 560px,rgba(10,12,11,0) 1180px),
  linear-gradient(to bottom,rgba(10,12,11,.5) 0,rgba(10,12,11,.5) 360px,rgba(10,12,11,0) 540px),linear-gradient(to top,rgba(10,12,11,.4) 0,rgba(10,12,11,.4) 360px,rgba(10,12,11,0) 520px)}
.mp-dimmer{position:absolute;inset:0;background:rgba(9,10,10,var(--dim,0));pointer-events:none;transition:background .7s var(--ease)}

/* ---------- screens ---------- */
#sp-screens{position:absolute;inset:0;pointer-events:none}
.sp-screen{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .28s var(--ease)}
.sp-screen.on{opacity:1;pointer-events:auto;transition:opacity .5s var(--ease) .12s}
.sp-screen.on.rise>*{animation:sp-rise .7s var(--spring) both}
@keyframes sp-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- chrome that stays put between screens ---------- */
.sp-wm{position:absolute;left:30px;top:26px;height:26px;z-index:40;color:var(--tx);transition:color .5s var(--ease),opacity .4s}
.sp-wm svg{height:100%;width:auto}
.sp-rail{position:absolute;left:22px;top:50%;z-index:40;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:22px;
  background:var(--glass);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px rgba(0,0,0,.35),0 20px 40px -20px rgba(0,0,0,.6);
  opacity:0;pointer-events:none;translate:-10px 0;transition:opacity .45s var(--ease),translate .6s var(--spring),background .5s,box-shadow .5s}
#sp-root[data-rail] .sp-rail{opacity:1;pointer-events:auto;translate:0 0}
#sp-root[data-tone="paper"] .sp-rail{background:#fff;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:0 0 0 1px var(--line),var(--sh2)}
.sp-rail button{width:58px;padding:11px 0 9px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--tx-3);
  font:500 10.5px/1 var(--sans);letter-spacing:0;transition:color .25s,background .25s}
.sp-rail button svg{width:19px;height:19px}
.sp-rail button:hover{color:var(--tx)}
.sp-rail button.on{color:var(--on-ink);background:var(--ink)}
.sp-rail button{position:relative}
.sp-rail button i.n{position:absolute;right:8px;top:5px;min-width:17px;height:17px;padding:0 4px 0;border-radius:99px;display:grid;place-items:center;
  background:var(--ink);color:var(--on-ink);font:600 10.5px/1 var(--sans);font-style:normal;letter-spacing:0;font-variant-numeric:tabular-nums;box-shadow:0 0 0 2px rgba(17,18,19,.6)}
#sp-root[data-tone="paper"] .sp-rail button i.n{box-shadow:0 0 0 2px #fff}
.sp-rail button.on i.n{display:none}
/* how it works: the plan again, any time */
.sp-help{position:absolute;left:22px;bottom:22px;z-index:40;height:38px;padding:0 15px 1px;border-radius:99px;white-space:nowrap;font:500 13px/1 var(--sans);letter-spacing:-.01em;color:var(--tx-2);
  background:var(--glass);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px rgba(0,0,0,.35),0 14px 30px -16px rgba(0,0,0,.6);
  opacity:0;pointer-events:none;translate:0 8px;transition:opacity .45s var(--ease),translate .6s var(--spring),color .2s,background .5s,box-shadow .5s}
#sp-root[data-rail] .sp-help{opacity:1;pointer-events:auto;translate:0 0}
.sp-help:hover{color:var(--tx)}
#sp-root[data-tone="paper"] .sp-help{background:#fff;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:0 0 0 1px var(--line),var(--sh1)}
/* the job portal's own tabs, as in its Figma shell */
.sp-tabs{position:absolute;left:50%;top:27px;z-index:40;transform:translateX(-50%);display:flex;gap:2px;opacity:0;pointer-events:none;transition:opacity .4s var(--ease)}
#sp-root[data-tabs] .sp-tabs{opacity:1;pointer-events:auto}
.sp-tabs button{height:40px;padding:0 17px;border-radius:99px;font:500 14.5px/1 var(--sans);letter-spacing:-.014em;color:var(--tx-3);white-space:nowrap;transition:background .2s,color .2s}
.sp-tabs button:hover{color:var(--tx)}
.sp-tabs button.on{color:var(--tx);background:var(--sunk,rgba(255,255,255,.1))}
/* the one number: level, and how far to the next */
.sp-pill{position:absolute;right:26px;top:20px;z-index:40;display:flex;align-items:center;gap:11px;height:54px;padding:0 8px 0 8px;border-radius:99px;text-align:left;
  background:var(--glass);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px rgba(0,0,0,.35),0 20px 40px -20px rgba(0,0,0,.6);
  opacity:0;pointer-events:none;translate:0 -8px;transition:opacity .45s var(--ease),translate .6s var(--spring),background .5s,box-shadow .5s}
#sp-root[data-pill] .sp-pill{opacity:1;pointer-events:auto;translate:0 0}
#sp-root[data-tone="paper"] .sp-pill{background:#fff;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:0 0 0 1px var(--line),var(--sh2)}
.sp-pill .t{display:flex;flex-direction:column;gap:4px;padding-right:4px;min-width:112px}
.sp-pill .t b{font:500 14.5px/1 var(--sans);color:var(--tx);letter-spacing:-.014em;white-space:nowrap}
.sp-pill .t span{font:400 12.5px/1 var(--sans);color:var(--tx-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.sp-pill .t span.pd{display:flex;align-items:center;gap:5px;color:var(--tx)}
.sp-pill .goal{display:flex;align-items:center;gap:8px;height:38px;padding:0 13px 0 5px;border-radius:99px;background:var(--glass-2);box-shadow:inset 0 0 0 1px var(--line-2)}
#sp-root[data-tone="paper"] .sp-pill .goal{background:var(--field);box-shadow:none}
.sp-pill .goal span{font:400 12.5px/1 var(--sans);color:var(--tx-2);white-space:nowrap}
.sp-pill .goal b{font-weight:500;color:var(--tx)}
.sp-pill.bump{animation:sp-bump .6s var(--spring)}
@keyframes sp-bump{0%{scale:1}35%{scale:1.06}100%{scale:1}}

/* ---------- parts ---------- */
/* the level ring: the number is the level, the arc is how far into it you are */
.sp-ring{position:relative;flex:none;width:var(--z,38px);height:var(--z,38px);display:grid;place-items:center}
.sp-ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.sp-ring circle{fill:none;stroke-width:3;stroke-linecap:round}
.sp-ring .tr{stroke:var(--tx-4)}
.sp-ring .ar{stroke:var(--gold);stroke-dasharray:100;stroke-dashoffset:calc(100 - var(--p,0) * 100);transition:stroke-dashoffset 1s var(--out)}
#sp-root[data-tone="paper"] .sp-ring .ar{stroke:#E3A62B}
.sp-ring .pe{stroke:var(--gold);opacity:.4;stroke-dasharray:100;stroke-dashoffset:calc(100 - var(--pp,0) * 100);transition:stroke-dashoffset 1s var(--out)}
#sp-root[data-tone="paper"] .sp-ring .pe{stroke:#E3A62B}
.sp-ring b{position:relative;font:600 calc(var(--z,38px) * .40)/1 var(--sans);letter-spacing:-.02em;color:var(--tx);font-variant-numeric:tabular-nums}
/* the skill point star */
.sp-star{flex:none;width:var(--z,14px);height:var(--z,14px);color:var(--gold)}
#sp-root[data-tone="paper"] .sp-star{color:#E3A62B}
/* a company mark on its own colour */
.sp-lg{flex:none;position:relative;width:var(--z,32px);height:var(--z,32px);border-radius:calc(var(--z,32px) * .28);background:var(--c,#111);display:grid;place-items:center;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset 0 1px 0 rgba(255,255,255,.14)}
.sp-lg.round{border-radius:50%}
.sp-lg i{width:56%;height:56%;background:var(--m,#fff);-webkit-mask:var(--u) center/contain no-repeat;mask:var(--u) center/contain no-repeat}
.sp-lg.lightc{box-shadow:inset 0 0 0 1px rgba(0,0,0,.09)}
.sp-lg svg{width:54%;height:54%}
/* buttons: the key, as on the Zero site */
.sp-key{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:48px;padding:0 22px 2px;border-radius:15px;white-space:nowrap;
  background:var(--key-light);color:#131315;box-shadow:var(--key-light-sh);font:500 15px/1 var(--sans);letter-spacing:-.014em;
  transition:transform .18s var(--out),filter .2s,box-shadow .2s}
.sp-key:hover{filter:brightness(1.03)}
.sp-key:active{transform:translateY(1.5px);box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(0,0,0,.1),0 0 0 1px rgba(0,0,0,.18),0 6px 12px -8px rgba(0,0,0,.5)}
.sp-key.dark{background:var(--key-dark);color:#F4F4F3;box-shadow:var(--key-dark-sh)}
.sp-key.dark:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.5),0 0 0 1px #121413}
.sp-key.sm{height:40px;padding:0 16px 2px;border-radius:13px;font-size:14px}
.sp-key svg{width:16px;height:16px;flex:none}
.sp-key[disabled]{opacity:.45;pointer-events:none}
.sp-ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:15px;white-space:nowrap;
  color:var(--tx);font:500 15px/1 var(--sans);letter-spacing:-.014em;background:var(--glass-2);box-shadow:inset 0 0 0 1px var(--line);transition:background .2s}
.sp-ghost:hover{background:var(--glass-3)}
.sp-ghost.sm{height:40px;padding:0 15px;border-radius:13px;font-size:14px}
#sp-root[data-tone="paper"] .sp-ghost{background:#fff;box-shadow:0 0 0 1px var(--line),var(--sh1)}
#sp-root[data-tone="paper"] .sp-ghost:hover{background:var(--wash)}
/* glass panel on the city */
.sp-glass{background:var(--glass);backdrop-filter:blur(26px) saturate(1.3);-webkit-backdrop-filter:blur(26px) saturate(1.3);border-radius:30px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 0 0 1px rgba(255,255,255,.04),0 0 0 1px rgba(0,0,0,.4),0 40px 80px -40px rgba(0,0,0,.75)}
/* a lock, and a tick */
.sp-lock{flex:none;width:var(--z,26px);height:var(--z,26px);border-radius:50%;display:grid;place-items:center;background:var(--glass-3);color:var(--tx-2)}
.sp-lock svg{width:50%;height:50%}
#sp-root[data-tone="paper"] .sp-lock{background:var(--field);color:var(--tx-3)}
.sp-tick{flex:none;width:var(--z,26px);height:var(--z,26px);border-radius:50%;display:grid;place-items:center;background:var(--ok);color:#fff}
.sp-tick svg{width:50%;height:50%}
/* titles */
.sp-h1{font:400 40px/1.08 var(--serif);letter-spacing:-.028em;color:var(--tx);text-wrap:balance}
.sp-h2{font:400 28px/1.12 var(--serif);letter-spacing:-.024em;color:var(--tx);text-wrap:balance}
.sp-p{font:400 15px/1.45 var(--sans);letter-spacing:-.012em;color:var(--tx-2);text-wrap:pretty}
.sp-num{font-variant-numeric:tabular-nums}

/* ---------- the review key, bottom right. It is for stepping through the screens, not part of the product. ---------- */
#sp-dev{position:fixed;right:16px;bottom:16px;z-index:200;transition:right .45s cubic-bezier(.22,1,.36,1);font:500 12.5px/1 var(--sans);letter-spacing:-.005em;color:#F4F4F3}
#sp-dev .bar{display:flex;align-items:center;gap:2px;height:40px;padding:0 5px;border-radius:14px;background:var(--key-dark);box-shadow:var(--key-dark-sh)}
#sp-dev .bar button{height:30px;min-width:30px;padding:0 8px;border-radius:9px;display:grid;place-items:center;color:rgba(244,244,243,.72);transition:background .2s,color .2s}
#sp-dev .bar button:hover{background:rgba(255,255,255,.08);color:#fff}
#sp-dev .bar button svg{width:15px;height:15px}
#sp-dev .bar button.lab{display:flex;align-items:center;gap:6px;padding:0 8px 0 12px;background:#F4F4F3;color:#131315;white-space:nowrap;font:500 12.5px/1 var(--sans)}
#sp-dev .bar button.lab:hover{background:#fff;color:#131315}
#sp-dev .name{padding:0 10px;min-width:150px;text-align:center;white-space:nowrap;color:#F4F4F3}
#sp-dev .name em{font-style:normal;color:rgba(244,244,243,.45);margin-right:7px;font-variant-numeric:tabular-nums}
#sp-dev .menu{position:absolute;right:0;bottom:50px;width:560px;max-height:calc(100vh - 90px);overflow:auto;padding:16px;border-radius:20px;background:#1B1D1C;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 0 1px #0c0d0d,0 30px 70px -20px rgba(0,0,0,.8);display:none}
#sp-dev.open .menu{display:block}
#sp-dev .menu h4{font:500 11.5px/1 var(--sans);color:rgba(244,244,243,.45);margin:14px 4px 8px}
#sp-dev .menu h4:first-child{margin-top:2px}
#sp-dev .grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
#sp-dev .grid button{display:flex;align-items:center;gap:9px;height:34px;padding:0 10px;border-radius:10px;text-align:left;color:rgba(244,244,243,.8);white-space:nowrap;overflow:hidden}
#sp-dev .grid button em{font-style:normal;color:rgba(244,244,243,.36);font-variant-numeric:tabular-nums;width:16px;flex:none}
#sp-dev .grid button:hover{background:rgba(255,255,255,.07);color:#fff}
#sp-dev .grid button.on{background:#F4F4F3;color:#131315}
#sp-dev .grid button.on em{color:rgba(19,19,21,.5)}
#sp-dev .foot{display:flex;gap:6px;margin-top:14px}
#sp-dev .foot a,#sp-dev .foot button{flex:1;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.07);color:#F4F4F3;text-decoration:none;font:500 12.5px/1 var(--sans)}
#sp-dev .foot a:hover,#sp-dev .foot button:hover{background:rgba(255,255,255,.12)}

/* ---------- your path, as a quick view. Compact: the whole road to the job in one look, no scrolling. ---------- */
.sp-panel{position:absolute;inset:0;z-index:60}
.sp-panel .scrim{position:absolute;inset:-400px;background:rgba(7,8,8,.42);opacity:0;transition:opacity .35s var(--ease)}
#sp-root[data-tone="paper"] .sp-panel .scrim{background:rgba(26,25,23,.22)}
.sp-panel.on .scrim{opacity:1}
.sp-panel .sheet{position:absolute;right:14px;top:14px;width:424px;max-height:calc(100% - 28px);border-radius:28px;display:flex;flex-direction:column;overflow:hidden;
  background:rgba(20,21,21,.86);backdrop-filter:blur(30px) saturate(1.3);-webkit-backdrop-filter:blur(30px) saturate(1.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 0 0 1px rgba(255,255,255,.04),0 0 0 1px rgba(0,0,0,.45),0 40px 90px -30px rgba(0,0,0,.8);
  opacity:0;transform:translateX(28px);transition:opacity .3s var(--ease),transform .5s var(--spring);
  --pn-tile:rgba(255,255,255,.06);--pn-edge:rgba(255,255,255,.07);--pn-rail:rgba(255,255,255,.14);--pn-bg:#1A1B1B;--pn-gold:var(--gold)}
#sp-root[data-tone="paper"] .sp-panel .sheet{background:#fff;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:0 0 0 1px var(--line),var(--sh3);
  --pn-tile:#FAF9F7;--pn-edge:rgba(26,25,23,.09);--pn-rail:rgba(26,25,23,.14);--pn-bg:#fff;--pn-gold:#E3A62B}
.sp-panel.on .sheet{opacity:1;transform:none}
.sp-panel .x{position:absolute;right:14px;top:14px;z-index:3;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--tx-2);background:var(--pn-tile);box-shadow:inset 0 0 0 1px var(--pn-edge);transition:color .2s}
.sp-panel .x:hover{color:var(--tx)}
.sp-panel .x svg{width:13px;height:13px}

.sp-panel .pn-top{flex:none;padding:18px 20px 12px}
.sp-panel .pn-you{display:flex;align-items:center;gap:13px}
.sp-panel .pn-you .sp-ring circle{stroke-width:3}
.sp-panel .pn-you h2{font-size:27px;line-height:1;letter-spacing:-.028em}
.sp-panel .pn-you p{margin-top:6px;font:400 13.5px/1 var(--sans);color:var(--tx-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.sp-panel .pn-you p b{font-weight:500;color:var(--tx)}
.sp-panel .pn-bar{height:5px;margin-top:14px;border-radius:9px;background:var(--pn-rail);overflow:hidden}
.sp-panel .pn-bar i{display:block;height:100%;border-radius:9px;background:var(--pn-gold)}

/* the path: one line down the left, a node per level that matters */
.sp-panel .pn-path{flex:1;min-height:0;overflow:auto;padding:2px 14px 8px 20px;-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 14px),transparent 100%);mask-image:linear-gradient(to bottom,#000 calc(100% - 14px),transparent 100%)}
.sp-panel .pn-n.open:not(.job) .hd .pn-stack{display:none}
.sp-panel .pn-n{position:relative;padding:3px 0 3px 30px}
.sp-panel .pn-n::before{content:'';position:absolute;left:10px;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--pn-rail)}
.sp-panel .pn-n:first-child::before{top:14px}.sp-panel .pn-n:last-child::before{bottom:calc(100% - 22px)}
.sp-panel .pn-n.past::before,.sp-panel .pn-n.dot.past::before{background:var(--pn-gold)}
.sp-panel .pn-n.here::before{background:linear-gradient(to bottom,var(--pn-gold) 0,var(--pn-gold) 22px,var(--pn-rail) 22px)}
.sp-panel .pn-n>.nd{position:absolute;left:10px;top:7px;width:18px;height:18px;margin-left:-9px;border-radius:50%;display:grid;place-items:center;font-style:normal;background:var(--pn-bg);color:var(--tx-3);box-shadow:inset 0 0 0 1.5px var(--pn-rail)}
.sp-panel .pn-n>.nd>svg{width:9px;height:9px}
.sp-panel .pn-n.past>.nd{background:var(--pn-gold);color:#2A1E03;box-shadow:none}
.sp-panel .pn-n.here>.nd{top:9px;width:26px;height:26px;margin-left:-13px;box-shadow:0 0 0 3px var(--pn-bg)}
.sp-panel .pn-n.here>.nd .sp-ring b{font-size:11.5px}
.sp-panel .pn-n.here>.nd .sp-ring circle{stroke-width:3.6}
.sp-panel .pn-n.ahead.first>.nd{top:13px}
.sp-panel .pn-n.job>.nd{top:11px;width:22px;height:22px;margin-left:-11px;box-shadow:0 0 0 2px var(--pn-gold),0 0 0 4px var(--pn-bg)}
.sp-panel .pn-n.job>.nd .sp-lg{box-shadow:none}
.sp-panel .pn-n.dot{padding:0 0 0 30px}
.sp-panel .pn-n.dot>.nd{top:6px;width:6px;height:6px;margin-left:-3px;box-shadow:0 0 0 3px var(--pn-bg);background:var(--pn-rail)}
.sp-panel .pn-n.dot.past>.nd{background:var(--pn-gold)}
.sp-panel .pn-n.dot p{font:400 12px/18px var(--sans);color:var(--tx-4)}

.sp-panel .hd{display:flex;align-items:center;gap:8px;min-height:24px;white-space:nowrap}
.sp-panel .hd b{font:500 14px/1 var(--sans);letter-spacing:-.012em;color:var(--tx)}
.sp-panel .hd em{font:400 13px/1 var(--sans);font-style:normal;color:var(--tx-2);overflow:hidden;text-overflow:ellipsis}
.sp-panel .hd .you{margin-left:auto;flex:none;height:22px;padding:0 9px 1px;border-radius:99px;display:inline-flex;align-items:center;font:500 11.5px/1 var(--sans);background:var(--ink);color:var(--on-ink)}
.sp-panel .hd .rt{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:7px;font:400 12.5px/1 var(--sans);color:var(--tx-2);font-variant-numeric:tabular-nums}
.sp-panel .pn-n.past .hd em,.sp-panel .pn-n.past .hd .rt,.sp-panel .pn-n.ahead:not(.first):not(.job) .hd em{color:var(--tx-3)}
.sp-panel .row{padding:2px 8px 2px 0}
.sp-panel .pn-n[data-x]{cursor:pointer}
.sp-panel .pn-n[data-x] .row{padding:4px 8px;margin:-2px 0 -2px -8px;border-radius:12px;transition:background .2s}
.sp-panel .pn-n[data-x]:hover .row{background:var(--pn-tile)}
.sp-panel .pn-tile{padding:8px 10px 9px 11px;border-radius:16px;background:var(--pn-tile);box-shadow:inset 0 0 0 1px var(--pn-edge)}
.sp-panel .pn-n.job .pn-tile{box-shadow:inset 0 0 0 1.5px var(--pn-gold)}

/* a role: one line */
.sp-panel .pn-roles{list-style:none;margin-top:4px}
.sp-panel .pn-roles li{display:flex;align-items:center;gap:9px;height:32px}
.sp-panel .pn-roles .sp-lg{border-radius:7px}
.sp-panel .pn-roles .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:400 13px/1.2 var(--sans)}
.sp-panel .pn-roles .tx b{font-weight:500;letter-spacing:-.012em;color:var(--tx)}
.sp-panel .pn-roles .tx em{font-style:normal;color:var(--tx-3);margin-left:7px}
.sp-panel .lk{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;color:var(--tx-3);background:var(--pn-tile);box-shadow:inset 0 0 0 1px var(--pn-edge)}
.sp-panel .lk svg{width:10px;height:10px}
.sp-panel .pn-roles .st{flex:none;font:500 12px/1 var(--sans);color:var(--tx-2)}
.sp-panel .pn-roles .st.open{display:inline-flex;align-items:center;gap:5px;color:var(--ok)}
#sp-root[data-tone="paper"] .sp-panel .pn-roles .st.open{color:var(--ok-deep)}
.sp-panel .pn-roles .st.open::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.sp-panel .pn-stack{display:inline-flex}
.sp-panel .pn-stack .sp-lg{box-shadow:0 0 0 1.5px var(--pn-bg)}
.sp-panel .pn-stack .sp-lg+.sp-lg{margin-left:-6px}
/* a level with roles shows their marks; pressed, it shows the roles themselves */
.sp-panel .pn-n .pn-roles,.sp-panel .pn-n .pn-more{display:none}
.sp-panel .pn-n.here .pn-roles,.sp-panel .pn-n.open .pn-roles{display:block}
.sp-panel .pn-n.here .pn-more,.sp-panel .pn-n.open .pn-more{display:block}
.sp-panel .pn-roles li.xtra{display:none}
.sp-panel .pn-n.all .pn-roles li.xtra{display:flex}
.sp-panel .pn-more{height:24px;margin:2px 0 -2px 33px;font:500 12.5px/1 var(--sans);color:var(--tx-2);transition:color .2s}
.sp-panel .pn-more:hover{color:var(--tx)}

.sp-panel .tx2{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.sp-panel .tx2 b{font:500 13.5px/1.2 var(--sans);letter-spacing:-.012em;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-panel .tx2 em{font:400 12.5px/1.2 var(--sans);font-style:normal;color:var(--tx-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.sp-panel .pn-next{display:flex;align-items:center;gap:10px;margin-top:7px;padding:8px 10px;border-radius:12px;background:var(--pn-tile);box-shadow:inset 0 0 0 1px var(--pn-edge)}
.sp-panel .pn-next .sp-lg{border-radius:8px}
.sp-panel .to{margin-top:7px;font:400 13px/1.3 var(--sans);color:var(--tx-2)}
.sp-panel .to b{font-weight:500;color:var(--tx)}
.sp-panel .pn-job{display:flex;align-items:center;gap:10px;margin-top:6px}
.sp-panel .also{display:flex;align-items:center;gap:8px;margin-top:9px;font:400 12.5px/1 var(--sans);color:var(--tx-3)}
.sp-panel .pn-n.job.open .also{display:none}
.sp-panel .pn-foot{flex:none;padding:8px 16px 16px}
.sp-panel .pn-foot .sp-key{width:100%;height:46px;border-radius:15px}
#sp-root[data-tone="paper"] .sp-panel .pn-foot .sp-key{background:var(--key-dark);color:#F4F4F3;box-shadow:var(--key-dark-sh)}
.sp-panel .pn-foot .sp-key svg{margin-right:-4px}

/* screens/dream.css */
/* the dream: where, which job, and the plan */
.sc-dream .dr-panel,.sc-plan .dr-panel{position:absolute;left:112px;top:50%;width:468px;transform:translateY(-50%);padding:36px 32px 32px;border-radius:34px}
.sc-dream .dr-body,.sc-plan .dr-body{transition:opacity .2s var(--ease),transform .3s var(--ease)}
.sc-dream .dr-body.out{opacity:0;transform:translateY(6px)}
.sc-dream .dr-h,.sc-plan .dr-h{font-size:38px}
.sc-dream .dr-sub{margin-top:12px;max-width:330px}
.sc-dream .dr-back{position:relative;width:38px;height:38px;margin:-6px 0 18px -6px;border-radius:50%;display:grid;place-items:center;color:var(--tx-2);background:var(--glass-2);box-shadow:inset 0 0 0 1px var(--line);transition:background .2s,color .2s}
.sc-dream .dr-back:hover{background:var(--glass-3);color:var(--tx)}
.sc-dream .dr-back svg{width:16px;height:16px}

/* the six companies */
.sc-dream .dr-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:26px}
.sc-dream .dr-co{position:relative;display:flex;align-items:center;gap:13px;height:68px;padding:0 14px;border-radius:20px;text-align:left;
  background:var(--glass-2);box-shadow:inset 0 0 0 1px var(--line-2);transition:background .25s var(--ease),box-shadow .25s var(--ease),transform .2s var(--out)}
.sc-dream .dr-co:hover{background:var(--glass-3)}
.sc-dream .dr-co:active{transform:scale(.985)}
.sc-dream .dr-co>span:not(.sp-lg){font:500 16px/1 var(--sans);letter-spacing:-.016em;color:var(--tx)}
.sc-dream .dr-co>i{margin-left:auto;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#141312;color:#fff;opacity:0;scale:.5;transition:opacity .2s,scale .35s var(--spring)}
.sc-dream .dr-co>i svg{width:11px;height:11px}
.sc-dream .dr-co.on{background:var(--key-light);box-shadow:var(--key-light-sh)}
.sc-dream .dr-co.on>span:not(.sp-lg){color:#141312}
.sc-dream .dr-co.on>i{opacity:1;scale:1}

/* the four rungs */
.sc-dream .dr-rungs{display:flex;flex-direction:column;gap:8px;margin-top:26px}
.sc-dream .dr-rung{position:relative;display:flex;align-items:center;gap:14px;height:72px;padding:0 16px 0 12px;border-radius:20px;text-align:left;
  background:var(--glass-2);box-shadow:inset 0 0 0 1px var(--line-2);transition:background .25s var(--ease),box-shadow .25s var(--ease),transform .2s var(--out)}
.sc-dream .dr-rung:hover{background:var(--glass-3)}
.sc-dream .dr-rung:active{transform:scale(.99)}
.sc-dream .dr-rung .lv{flex:none;width:48px;height:48px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:var(--glass-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.sc-dream .dr-rung .lv b{font:500 18px/1 var(--sans);letter-spacing:-.02em;color:var(--tx);font-variant-numeric:tabular-nums}
.sc-dream .dr-rung .lv em{font:400 10.5px/1 var(--sans);font-style:normal;color:var(--tx-3);letter-spacing:0}
.sc-dream .dr-rung .tx{display:flex;flex-direction:column;gap:6px;min-width:0}
.sc-dream .dr-rung .tx b{font:500 16px/1 var(--sans);letter-spacing:-.016em;color:var(--tx);white-space:nowrap}
.sc-dream .dr-rung .tx em{font:400 13px/1 var(--sans);font-style:normal;color:var(--tx-2);white-space:nowrap}
.sc-dream .dr-rung>i{margin-left:auto;flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#141312;color:#fff;opacity:0;scale:.5;transition:opacity .2s,scale .35s var(--spring)}
.sc-dream .dr-rung>i svg{width:11px;height:11px}
.sc-dream .dr-rung.on{background:var(--key-light);box-shadow:var(--key-light-sh)}
.sc-dream .dr-rung.on .lv{background:#141312;box-shadow:none}
.sc-dream .dr-rung.on .lv b{color:#fff}.sc-dream .dr-rung.on .lv em{color:rgba(255,255,255,.6)}
.sc-dream .dr-rung.on .tx b{color:#141312}.sc-dream .dr-rung.on .tx em{color:#5D5A54}
.sc-dream .dr-rung.on>i{opacity:1;scale:1}

.sc-dream .dr-foot,.sc-plan .dr-foot{display:flex;align-items:center;gap:16px;margin-top:28px}
.sc-dream .dr-go svg,.sc-plan .dr-go svg{margin-right:-4px}

/* the plan */
.sc-plan .dr-panel.pl{width:500px;padding:38px 34px 32px}
.sc-plan .pl-list{list-style:none;display:flex;flex-direction:column;gap:6px;margin-top:26px}
.sc-plan .pl-list li{display:flex;align-items:center;gap:15px;min-height:70px;padding:12px 18px 12px 14px;border-radius:20px;cursor:pointer;
  opacity:0;transform:translateY(10px);transition:opacity .5s var(--ease),transform .7s var(--spring),background .5s var(--ease),box-shadow .5s var(--ease)}
.sc-plan .pl-list li.on{opacity:.62;transform:none}
.sc-plan .pl-list li.on.now,.sc-plan .pl-list li.on:hover{opacity:1}
.sc-plan .pl-list li.now{background:var(--glass-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.sc-plan .pl-list li>span{flex:none}
.sc-plan .pl-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--glass-3)}
.sc-plan .pl-ic .sp-ring{--z:30px}
.sc-plan .pl-ic:has(.sp-ring){background:none}
.sc-plan .pl-list p{font:400 15px/1.42 var(--sans);letter-spacing:-.012em;color:var(--tx-2);text-wrap:pretty}
.sc-plan .pl-list p b{font-weight:500;color:var(--tx)}
.sc-plan .dr-foot{opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .5s var(--ease) .5s,transform .7s var(--spring) .5s}
.sc-plan .dr-foot.on{opacity:1;transform:none;pointer-events:auto}
.sc-plan .pl-count{font:400 13px/1 var(--sans);color:var(--tx-3);white-space:nowrap}

/* screens/world.css */
/* the world: the city stays clickable, only the card takes the pointer */
.sc-world.on{pointer-events:none}
.sc-world .wd-card{position:absolute;right:26px;top:50%;width:372px;transform:translateY(-50%);padding:10px;border-radius:32px;pointer-events:auto;
  transition:opacity .5s var(--ease),translate .7s var(--spring)}
.sc-world .wd-card.wait{opacity:0;translate:16px 0;pointer-events:none}
.sc-world .wd-card.in .wd-hero{animation:sp-rise .6s var(--spring) both}
.sc-world .wd-card.in .wd-body>*{animation:sp-rise .6s var(--spring) both}
.sc-world .wd-card.in .wd-body>*:nth-child(1){animation-delay:.05s}.sc-world .wd-card.in .wd-body>*:nth-child(2){animation-delay:.09s}
.sc-world .wd-card.in .wd-body>*:nth-child(3){animation-delay:.13s}.sc-world .wd-card.in .wd-body>*:nth-child(4){animation-delay:.17s}
.sc-world .wd-card.in .wd-body>*:nth-child(5){animation-delay:.21s}.sc-world .wd-card.in .wd-body>*:nth-child(6){animation-delay:.25s}
.sc-world .wd-card.quick .wd-hero img,.sc-world .wd-card.quick .wd-body{animation:wd-swap .28s var(--ease) both}
@keyframes wd-swap{from{opacity:0}to{opacity:1}}

/* the building, as the picture of what you are about to do */
.sc-world .wd-hero{position:relative;height:176px;border-radius:22px;overflow:hidden;background:#1b1d1c;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.sc-world .wd-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.sc-world .wd-hero::after{content:'';position:absolute;inset:0;border-radius:22px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);
  background:linear-gradient(to top,rgba(10,12,11,.5),rgba(10,12,11,0) 46%);pointer-events:none}
.sc-world .wd-tag,.sc-world .wd-no{position:absolute;z-index:1;display:flex;align-items:center;height:32px;border-radius:99px;white-space:nowrap;
  background:rgba(20,21,21,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 0 1px rgba(0,0,0,.3);color:#fff}
.sc-world .wd-tag{left:10px;bottom:10px;gap:7px;padding:0 13px 0 5px;font:500 13.5px/1 var(--sans);letter-spacing:-.012em}
.sc-world .wd-no{right:10px;top:10px;padding:0 12px 1px;font:400 12.5px/1 var(--sans);color:rgba(255,255,255,.86)}
.sc-world .wd-body{padding:18px 12px 12px;display:flex;flex-direction:column}
.sc-world .wd-title{font-size:28px}
.sc-world .wd-ask{margin-top:9px}
.sc-world .wd-meta{display:flex;gap:8px;margin-top:16px}
.sc-world .wd-meta>span{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px 1px 11px;border-radius:99px;background:var(--glass-2);box-shadow:inset 0 0 0 1px var(--line-2);
  font:400 13.5px/1 var(--sans);color:var(--tx);white-space:nowrap;font-variant-numeric:tabular-nums}
.sc-world .wd-meta>span>svg{width:15px;height:15px;color:var(--tx-2)}
.sc-world .wd-meta>span.ok>svg{color:var(--ok);width:14px;height:14px}
/* what this scenario opens: the reason to start it */
.sc-world .wd-opens{margin-top:14px;padding:14px 12px 8px;border-radius:20px;background:var(--glass-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.sc-world .wd-opens p{font:400 13px/1 var(--sans);color:var(--tx-2);padding:0 4px 8px}
.sc-world .wd-opens p b{font-weight:500;color:var(--tx)}
.sc-world .wd-opens ul{list-style:none}
.sc-world .wd-opens li{display:flex;align-items:center;gap:11px;height:48px;padding:0 4px}
.sc-world .wd-opens li .tx{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.sc-world .wd-opens li b{font:500 14px/1.3 var(--sans);letter-spacing:-.012em;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-world .wd-opens li em{font:400 12.5px/1.3 var(--sans);font-style:normal;color:var(--tx-3)}
.sc-world .wd-lv{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--glass-3);font:500 13.5px/1 var(--sans);color:var(--tx);font-variant-numeric:tabular-nums}
.sc-world .wd-state{display:flex;align-items:center;gap:11px;margin-top:16px;font:400 14px/1.36 var(--sans);color:var(--tx-2)}
.sc-world .wd-state b{font-weight:500;color:var(--tx)}
.sc-world .wd-state.ok span{color:var(--tx)}
.sc-world .wd-start,.sc-world .wd-apply{margin-top:14px;width:100%;height:52px;border-radius:17px}
.sc-world .wd-path,.sc-world .wd-proof{margin-top:14px;width:100%}
.sc-world .wd-start svg{width:14px;height:14px;margin-right:-1px}

/* the summit */
.sc-summit .sm-box{position:absolute;left:112px;top:50%;width:468px;transform:translateY(-50%);padding:36px 34px 34px;border-radius:34px}
.sc-summit .sm-ring{display:block}
.sc-summit .sm-ring .sp-ring circle{stroke-width:2.6}
.sc-summit .sm-ring .sp-ring .ar{transition:stroke-dashoffset 1s var(--out)}
.sc-summit .sm-h{margin-top:26px;font-size:60px;letter-spacing:-.035em}
.sc-summit .sm-line{margin-top:14px;font:400 19px/1.35 var(--sans);letter-spacing:-.018em;color:var(--tx-2);text-wrap:balance}
.sc-summit .sm-line b{font-weight:500;color:var(--tx)}
.sc-summit .sm-sub{margin-top:12px;font:400 15px/1.45 var(--sans);color:var(--tx-2);max-width:390px;text-wrap:pretty}
.sc-summit .sm-go{margin-top:28px;height:52px;border-radius:17px}
.sc-summit .sm-h,.sc-summit .sm-line,.sc-summit .sm-sub,.sc-summit .sm-go{opacity:0;transform:translateY(12px);transition:opacity .6s var(--ease),transform .8s var(--spring)}
.sc-summit .sm-box.on .sm-h{opacity:1;transform:none}
.sc-summit .sm-box.on .sm-line{opacity:1;transform:none;transition-delay:.12s}
.sc-summit .sm-box.on .sm-sub{opacity:1;transform:none;transition-delay:.9s}
.sc-summit .sm-box.on .sm-go{opacity:1;transform:none;transition-delay:1.3s}
.sc-summit .sm-fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

.sc-world .wd-opens.none p:first-child{padding-bottom:0}
.sc-world .wd-gap{display:flex;align-items:center;gap:10px;margin-top:10px;padding:0 4px 6px;font:400 13.5px/1.35 var(--sans);color:var(--tx-2)}
.sc-world .wd-gap b{font-weight:500;color:var(--tx)}
.sc-world .wd-more{padding:2px 4px 4px 46px;font:400 12.5px/1 var(--sans);color:var(--tx-3)}

/* screens/loop.css */
/* ZERO skill path · the loop around one scenario.
   earn (inside the workspace) · review · levelup · applyask · whenback.
   Paper values come from the job portal, the workspace layout from the app's own Stage workspace
   (rail, the manager in the middle), the world values from core.css. */

/* ---------- shared: things take their place by rising a little ---------- */
.sc-earn .en-new,.sc-review [data-in],.sc-levelup [data-in],.sc-levelup .lu-late,.sc-applyask [data-in],.sc-whenback [data-in]{
  opacity:0;transform:translateY(10px);transition:opacity .5s var(--ease),transform .7s var(--spring)}
.sc-earn .en-new.is-in,.sc-review [data-in].is-in,.sc-levelup [data-in].is-in,.sc-levelup .lu-late.is-in,.sc-applyask [data-in].is-in,.sc-whenback [data-in].is-in{opacity:1;transform:none}
.sc-earn.is-instant *,.sc-review.is-instant *,.sc-levelup.is-instant *,.sc-applyask.is-instant *,.sc-whenback.is-instant *,
.sc-earn.is-instant *::after,.sc-levelup.is-instant *::after{transition:none!important;animation:none!important}
@keyframes lp-spin{to{transform:rotate(360deg)}}
@keyframes lp-pop{0%{transform:scale(.5)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes lp-sweep{0%{background-position:170% 0}100%{background-position:-170% 0}}

/* ================================================================
   1 · earn. The workspace, in its light skin: warm paper, white cards.
   ================================================================ */
.sc-earn::before{content:'';position:absolute;inset:-900px;background:#F2F0ED}

/* ----- the rail: the scenario, and the moments that pay ----- */
.sc-earn .en-rail{position:absolute;left:30px;top:96px;width:320px}
.sc-earn .en-chip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 13px 0 5px;border-radius:99px;background:#fff;box-shadow:0 0 0 1px var(--line),var(--sh1)}
.sc-earn .en-chip>span:last-child{padding-bottom:1px;font:500 13px/1 var(--sans);color:var(--tx-2)}
.sc-earn .en-title{margin-top:14px}
.sc-earn .en-card{margin-top:22px;padding:8px;border-radius:22px;background:#fff;box-shadow:0 0 0 1px var(--line),var(--sh1)}
.sc-earn .en-h{padding:9px 12px 9px;font:400 13px/18px var(--sans);color:var(--tx-3)}
.sc-earn .en-row{display:grid;grid-template-columns:18px minmax(0,1fr) auto;align-items:center;column-gap:12px;padding:11px 12px;border-radius:14px}
.sc-earn .en-lb{font:400 15px/18px var(--sans);color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-earn .en-pt{font:400 13px/18px var(--sans);color:var(--tx-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.sc-earn .en-pt b{font-weight:500;color:var(--tx)}
.sc-earn .en-row.is-ahead .en-lb{color:var(--tx-3)}
.sc-earn .en-dot{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--tx-4)}
/* the one being graded */
.sc-earn .en-row.is-now{margin:2px 0;padding-top:13px;padding-bottom:13px;background:var(--field)}
.sc-earn .en-row.is-now .en-lb{font-weight:500}
.sc-earn .en-mk{position:relative;width:18px;height:18px}
.sc-earn .en-mk .sp-tick{position:absolute;inset:0;opacity:0;transform:scale(.5)}
.sc-earn .en-spin{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(26,25,23,.14);border-top-color:var(--tx-2);animation:lp-spin .8s linear infinite;transition:opacity .25s var(--ease)}
.sc-earn .en-row.is-graded .en-spin{opacity:0;animation:none}
.sc-earn .en-row.is-graded .en-mk .sp-tick{opacity:1;transform:none;animation:lp-pop .5s var(--spring)}
.sc-earn .en-why{grid-column:2 / 4;position:relative;height:19px;margin-top:4px;overflow:hidden;transition:height .5s var(--spring)}
.sc-earn .en-why span{position:absolute;left:0;right:0;top:0;font:400 13px/19px var(--sans);color:var(--tx-2);text-wrap:pretty;transition:opacity .35s var(--ease)}
.sc-earn .en-why-a{color:var(--tx-3)}
.sc-earn .en-why-b{opacity:0}
.sc-earn .en-row.is-graded .en-why-a{opacity:0}
.sc-earn .en-row.is-graded .en-why-b{opacity:1;transition-delay:.15s}
/* the running total */
.sc-earn .en-total{margin-top:8px;padding:16px 20px 20px;border-radius:22px;background:#fff;box-shadow:0 0 0 1px var(--line),var(--sh1)}
.sc-earn .en-total-r{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sc-earn .en-total-r>span:first-child{font:400 13px/18px var(--sans);color:var(--tx-2)}
.sc-earn .en-total-n{display:flex;align-items:center;gap:7px;font:400 15px/18px var(--sans);color:var(--tx-3);font-variant-numeric:tabular-nums}
.sc-earn .en-total-n b{font-weight:500;color:var(--tx)}
.sc-earn .en-bar{height:4px;margin-top:14px;border-radius:99px;background:var(--sunk);overflow:hidden}
.sc-earn .en-bar i{display:block;height:100%;border-radius:99px;background:#E3A62B;transition:width .9s var(--out)}

/* ----- the manager, in the middle ----- */
.sc-earn .en-main{position:absolute;left:656px;top:96px;width:640px;height:668px;display:flex;flex-direction:column}
.sc-earn .en-peer{flex:none;display:flex;align-items:center;gap:12px;height:40px}
.sc-earn .en-ava{flex:none;width:40px;height:40px;border-radius:50%;background:#DDD9D2 center/cover no-repeat;box-shadow:0 0 0 1px var(--line)}
.sc-earn .en-who b{display:block;font:500 15px/18px var(--sans);color:var(--tx)}
.sc-earn .en-who span{display:block;margin-top:2px;font:400 13px/16px var(--sans);color:var(--tx-3)}
.sc-earn .en-thread{flex:1;min-height:0;margin:4px -24px 0;padding:0 24px;overflow-y:auto;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%)}
.sc-earn .en-msgs{display:flex;flex-direction:column;gap:20px;padding:22px 0 24px}
.sc-earn .en-bub{align-self:flex-start;max-width:460px;padding:10px 16px 11px;border-radius:20px;background:#fff;box-shadow:0 0 0 1px var(--line-2);font:400 15px/1.45 var(--sans);color:var(--tx)}
.sc-earn .en-bub+.en-bub{margin-top:-12px}
/* the handed-in file */
.sc-earn .en-file{align-self:flex-end}
.sc-earn .en-att{position:relative;display:flex;align-items:center;gap:13px;padding:10px 20px 10px 10px;border-radius:18px;background:#fff;box-shadow:0 0 0 1px var(--line),var(--sh1);overflow:hidden}
.sc-earn .en-thumb{flex:none;display:flex;align-items:center;justify-content:center;gap:3px;width:62px;height:46px;border-radius:8px;background:var(--field)}
.sc-earn .en-thumb i{width:7px;height:20px;border-radius:2px;background:var(--tx-4)}
.sc-earn .en-fm b{display:block;font:500 15px/18px var(--sans);color:var(--tx);white-space:nowrap}
.sc-earn .en-fm span{display:block;margin-top:2px;font:400 13px/16px var(--sans);color:var(--tx-3);white-space:nowrap}
.sc-earn .en-cap{margin-top:6px;padding-right:4px;text-align:right;font:400 12px/16px var(--sans);color:var(--tx-3)}
.sc-earn .en-file.is-reading .en-att::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 32%,rgba(26,25,23,.07) 50%,transparent 68%);background-size:220% 100%;animation:lp-sweep 1.1s var(--ease) infinite}
/* "reading", then "reviewed" */
.sc-earn .en-synth{align-self:flex-start;display:flex;align-items:center;gap:9px;margin-top:-4px;padding-left:2px}
.sc-earn .en-synth i{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 0 0 1px var(--line);color:var(--tx-2)}
.sc-earn .en-synth i svg{width:13px;height:13px}
.sc-earn .en-synth span{font:400 13px/18px var(--sans);color:var(--tx-3);transition:color .4s var(--ease)}
.sc-earn .en-synth.is-done span{color:var(--tx-2)}
/* the review: what was good, what is left, and the points on each */
.sc-earn .en-review{align-self:flex-start;width:548px;margin-top:-8px;padding:8px;border-radius:22px;background:#fff;box-shadow:0 0 0 1px var(--line),var(--sh2)}
.sc-earn .en-note{display:grid;grid-template-columns:22px minmax(0,1fr) auto;column-gap:12px;align-items:center;padding:11px 12px 13px;
  opacity:0;transform:translateY(6px);transition:opacity .45s var(--ease) .12s,transform .6s var(--spring) .12s}
.sc-earn .en-note+.en-note{transition-delay:.26s}
.sc-earn .en-review.is-in .en-note{opacity:1;transform:none}
.sc-earn .en-note b{display:block;font:500 15px/22px var(--sans);color:var(--tx)}
.sc-earn .en-note p{grid-column:2 / 4;margin-top:1px;font:400 13px/19px var(--sans);color:var(--tx-2);text-wrap:pretty}
.sc-earn .en-ring{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--tx-4)}
.sc-earn .en-tag{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px 1px 9px;border-radius:99px;font:500 13px/1 var(--sans);white-space:nowrap;font-variant-numeric:tabular-nums;
  opacity:0;transform:scale(.8);transition:opacity .3s var(--ease),transform .55s var(--spring)}
.sc-earn .en-tag.is-in{opacity:1;transform:none}
.sc-earn .en-tag.is-good{background:var(--field);color:var(--tx)}
.sc-earn .en-tag.is-held{padding:0 11px 1px;color:var(--tx-3);box-shadow:inset 0 0 0 1px var(--line);transition-delay:.12s}
/* the one thing to do next */
.sc-earn .en-next{flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;height:72px;margin-top:4px;padding:0 12px 0 24px;border-radius:26px;background:#fff;box-shadow:0 0 0 1px var(--line),var(--sh2)}
.sc-earn .en-next p{font:400 15px/20px var(--sans);color:var(--tx-2)}

/* ================================================================
   2 · review. One result, then what it paid.
   ================================================================ */
.sc-review .rv-col{position:absolute;left:420px;top:0;width:760px;height:840px;padding:10px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sc-review .rv-chip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 13px 0 5px;border-radius:99px;background:#fff;box-shadow:0 0 0 1px var(--line),var(--sh1)}
.sc-review .rv-chip>span:last-child{padding-bottom:1px;font:500 13px/1 var(--sans);color:var(--tx-2)}
.sc-review .rv-title{margin-top:18px;text-align:center}
.sc-review .rv-pts{display:flex;align-items:center;gap:9px;margin-top:14px;height:34px}
.sc-review .rv-n{font:500 28px/34px var(--sans);letter-spacing:-.03em;color:var(--tx);font-variant-numeric:tabular-nums;white-space:nowrap}
.sc-review .rv-pts>span:last-child{margin-left:1px;padding-top:7px;font:400 15px/20px var(--sans);color:var(--tx-2)}
.sc-review .rv-card{align-self:stretch;margin-top:28px;padding:24px 28px 26px;border-radius:24px;background:#fff;box-shadow:0 0 0 1px var(--line),var(--sh1);display:flex;flex-direction:column;gap:22px}
.sc-review .rv-r1{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.sc-review .rv-name{font:500 15px/20px var(--sans);color:var(--tx)}
.sc-review .rv-of{font:400 15px/20px var(--sans);color:var(--tx-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.sc-review .rv-of b{font-weight:500;color:var(--tx)}
.sc-review .rv-bar{height:4px;margin-top:9px;border-radius:99px;background:var(--sunk);overflow:hidden}
.sc-review .rv-bar i{display:block;width:0;height:100%;border-radius:99px;background:#E3A62B;transition:width 1s var(--out)}
.sc-review .rv-why{margin-top:10px;font:400 13px/18px var(--sans);color:var(--tx-2)}
/* what was left, and the way to get some of it back */
.sc-review .rv-left{position:relative;align-self:stretch;display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:84px;margin-top:12px;padding:16px 20px 16px 28px;border-radius:24px;background:var(--sunk)}
.sc-review .rv-ask,.sc-review .rv-fix{transition:opacity .3s var(--ease)}
.sc-review .rv-ask p{font:400 13px/18px var(--sans);color:var(--tx-2)}
.sc-review .rv-ask b{display:block;margin-top:4px;font:500 15px/20px var(--sans);color:var(--tx)}
.sc-review .rv-fix{flex:none}
.sc-review .rv-fix:active{transform:translateY(1px)}
.sc-review .rv-fixed{position:absolute;left:28px;right:28px;top:0;bottom:0;display:flex;align-items:center;gap:12px;opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .4s var(--ease) .18s,transform .6s var(--spring) .18s}
.sc-review .rv-fixed b{font:500 15px/20px var(--sans);color:var(--tx)}
.sc-review .rv-left.is-fixed .rv-ask,.sc-review .rv-left.is-fixed .rv-fix{opacity:0;pointer-events:none}
.sc-review .rv-left.is-fixed .rv-fixed{opacity:1;transform:none}
.sc-review .rv-left.is-fixed .rv-fixed .sp-tick{animation:lp-pop .5s var(--spring) .18s backwards}
.sc-review .rv-go{margin-top:28px}
.sc-review .rv-go .sp-key{min-width:148px}

/* ================================================================
   3 · levelup. The level, and the roles it opens.
   ================================================================ */
.sc-levelup .lu-burst{position:absolute;left:0;top:0;width:1600px;height:840px;pointer-events:none}
.sc-levelup::before{content:'';position:absolute;left:200px;top:-80px;width:1200px;height:1000px;pointer-events:none;background:radial-gradient(closest-side,rgba(9,10,10,.62),rgba(9,10,10,.5) 45%,rgba(9,10,10,0))}
.sc-levelup .lu-col{position:absolute;inset:0;padding-bottom:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
/* the ring: the number is the level, the arc is how far into it */
.sc-levelup .lu-ring{position:relative;flex:none;width:132px;height:132px;border-radius:50%;display:grid;place-items:center;
  background:var(--glass);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px rgba(0,0,0,.35),0 30px 60px -26px rgba(0,0,0,.8)}
.sc-levelup .lu-ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.sc-levelup .lu-ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.sc-levelup .lu-ring .tr{stroke:rgba(244,244,243,.13)}
.sc-levelup .lu-ring .a1,.sc-levelup .lu-ring .a2{stroke:var(--gold);stroke-dasharray:100;transition:stroke-dashoffset .9s var(--out),opacity .45s var(--ease)}
.sc-levelup .lu-ring .a1{stroke-dashoffset:calc(100 - var(--p,0) * 100)}
.sc-levelup .lu-ring .a2{stroke-dashoffset:calc(100 - var(--q,0) * 100);opacity:0}
.sc-levelup .lu-ring.is-rolled .a1{opacity:0}
.sc-levelup .lu-ring.is-rolled .a2{opacity:1;transition:stroke-dashoffset 1s var(--out) .12s,opacity .2s var(--ease) .1s}
.sc-levelup .lu-ring.is-rolled{animation:lu-bump .8s var(--spring)}
@keyframes lu-bump{0%{transform:scale(1)}30%{transform:scale(1.07)}100%{transform:scale(1)}}
.sc-levelup .lu-num{position:relative;width:96px;height:64px;overflow:hidden}
.sc-levelup .lu-num b{position:absolute;inset:0;display:grid;place-items:center;font:600 54px/1 var(--sans);letter-spacing:-.03em;color:var(--tx);font-variant-numeric:tabular-nums;
  transition:transform .65s var(--spring),opacity .3s var(--ease)}
.sc-levelup .lu-num .n{transform:translateY(64%);opacity:0}
.sc-levelup .lu-ring.is-rolled .lu-num .o{transform:translateY(-64%);opacity:0}
.sc-levelup .lu-ring.is-rolled .lu-num .n{transform:none;opacity:1}
.sc-levelup .lu-title{margin-top:22px}
.sc-levelup .lu-line{margin-top:8px}
/* a role: locked, then open. The open face spreads from the lock. */
.sc-levelup .lu-roles{display:flex;gap:16px;margin-top:30px}
.sc-levelup .lu-roles.is-4 .lu-role{width:272px}
.sc-levelup .lu-more{margin-top:14px;font:400 13px/18px var(--sans);color:var(--tx-2)}
/* a level between gates: the one thing that happened, as the thing itself, then how far the next roles are */
.sc-levelup .lu-mile{display:flex;align-items:center;gap:14px;margin-top:22px;padding:10px 18px 10px 10px;border-radius:20px;text-align:left;
  background:rgba(26,28,27,.88);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 0 0 1px rgba(255,255,255,.05),0 0 0 1px rgba(0,0,0,.45),0 24px 48px -30px rgba(0,0,0,.9)}
.sc-levelup .lu-pf{flex:none;position:relative;display:block;width:100px;height:64px;border-radius:10px;background:#F3EEE9}
.sc-levelup .lu-sl{position:absolute;left:10px;right:10px;top:8px;bottom:8px;display:block;padding:8px 8px 0;border-radius:5px;background:#fff;box-shadow:0 0 0 1px rgba(26,25,23,.06),0 3px 8px -5px rgba(26,25,23,.3)}
.sc-levelup .lu-sl b{display:block;margin-top:4px;font:400 9px/1.12 var(--serif);letter-spacing:-.015em;color:#1A1917}
.sc-levelup .lu-mtx{display:block;min-width:0}
.sc-levelup .lu-mtx b{display:block;font:500 15px/20px var(--sans);letter-spacing:-.014em;color:var(--tx)}
.sc-levelup .lu-mtx span{display:block;margin-top:2px;font:400 13px/18px var(--sans);color:var(--tx-2)}
.sc-levelup .lu-mile>.sp-tick{margin-left:6px}
.sc-levelup .lu-pull{margin-top:28px;font:500 15px/20px var(--sans);letter-spacing:-.014em;color:var(--tx)}
.sc-levelup .lu-pull+.lu-roles{margin-top:14px}
.sc-levelup .lu-role{position:relative;width:296px;border-radius:24px;text-align:left;box-shadow:0 24px 48px -30px rgba(0,0,0,.9)}
.sc-levelup .lu-face{display:flex;flex-direction:column;padding:20px 20px 19px;border-radius:24px}
.sc-levelup .lu-top{display:flex;align-items:flex-start;justify-content:space-between}
.sc-levelup .lu-t{margin-top:18px;font:500 15px/20px var(--sans);letter-spacing:-.014em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-levelup .lu-m{margin-top:2px;font:400 13px/18px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-levelup .lu-t+.lu-m{margin-top:3px}
.sc-levelup .lu-s{display:flex;align-items:center;gap:7px;margin-top:14px;font:500 13px/18px var(--sans)}
.sc-levelup .lu-lk{background:rgba(26,28,27,.88);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 0 0 1px rgba(255,255,255,.05),0 0 0 1px rgba(0,0,0,.45)}
.sc-levelup .lu-lk .sp-lg{filter:grayscale(1);opacity:.55;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.sc-levelup .lu-lk .lu-t{color:var(--tx-2)}
.sc-levelup .lu-lk .lu-m{color:var(--tx-3)}
.sc-levelup .lu-lk .lu-s{font-weight:400;color:var(--tx-3)}
.sc-levelup .lu-lk .sp-lock svg{overflow:visible}
.sc-levelup .lu-sh{transform-box:view-box;transform-origin:9.1px 6.3px;transition:transform .22s var(--spring)}
.sc-levelup .lu-role.is-click .lu-sh{transform:translateY(-1.5px) rotate(24deg)}
.sc-levelup .lu-op{position:absolute;inset:0;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.22);
  clip-path:circle(0px at calc(100% - 34px) 34px);transition:clip-path .75s cubic-bezier(.32,0,.12,1)}
.sc-levelup .lu-role.is-open .lu-op{clip-path:circle(420px at calc(100% - 34px) 34px)}
.sc-levelup .lu-op .lu-t{color:#141312}
.sc-levelup .lu-op .lu-m{color:#5D5A54}
.sc-levelup .lu-op .lu-s{color:var(--ok-deep)}
.sc-levelup .lu-op .lu-s::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--ok)}
.sc-levelup .lu-op .sp-tick path{stroke-dasharray:12;stroke-dashoffset:12;transition:stroke-dashoffset .4s var(--out) .22s}
.sc-levelup .lu-role.is-open .lu-op .sp-tick path{stroke-dashoffset:0}
.sc-levelup .lu-role.is-open .lu-op .sp-tick{animation:lp-pop .55s var(--spring)}
.sc-levelup .lu-role.is-open{animation:lu-lift .8s var(--spring)}
@keyframes lu-lift{0%{transform:scale(1)}32%{transform:scale(1.035)}100%{transform:scale(1)}}
/* the long goal, and what the next level holds */
.sc-levelup .lu-goal{display:flex;align-items:center;gap:10px;margin-top:30px}
.sc-levelup .lu-goal>span:last-child{font:400 15px/20px var(--sans);color:var(--tx-2)}
.sc-levelup .lu-goal b{font-weight:500;color:var(--tx)}
/* the next gate: its level behind a lock, who is there, and how far */
.sc-levelup .lu-next{display:flex;align-items:center;gap:10px;margin-top:12px}
.sc-levelup .lu-next>span{font:400 13px/18px var(--sans);color:var(--tx-2)}
.sc-levelup .lu-next>.lu-nchip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 6px 0 10px;border-radius:99px;background:rgba(26,28,27,.86);box-shadow:inset 0 0 0 1px var(--line);color:var(--tx-2)}
.sc-levelup .lu-nchip b{padding-bottom:1px;font:500 13px/1 var(--sans)}
.sc-levelup .lu-nchip>svg{width:12px;height:12px;color:var(--tx-3)}
.sc-levelup .lu-stack{display:inline-flex;margin-left:4px;padding-left:4px}
.sc-levelup .lu-stack .sp-lg{margin-left:-4px;filter:grayscale(1) brightness(.86);box-shadow:0 0 0 1.5px #232524}
.sc-levelup .lu-go{margin-top:28px}

/* ================================================================
   4 · applyask. Zero asks before it applies.
   ================================================================ */
.sc-applyask .aa-col{position:absolute;left:420px;top:84px;width:760px;height:728px;display:flex;flex-direction:column;justify-content:center}
.sc-applyask .aa-title{font-size:34px;line-height:1.14}
.sc-applyask .aa-title.is-swap{animation:aa-swap .6s var(--spring)}
@keyframes aa-swap{from{opacity:0;transform:translateY(8px)}}
.sc-applyask .aa-roles{margin-top:26px;padding:8px;border-radius:24px;background:#fff;box-shadow:0 0 0 1px var(--line),var(--sh1)}
.sc-applyask .aa-list{display:flex;flex-direction:column;gap:4px;border-radius:16px}
/* more roles than fit: the list scrolls inside its card and fades where there is more */
.sc-applyask .aa-roles.is-long .aa-list{max-height:364px;overflow-y:auto;overscroll-behavior:contain;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 28px,#000 calc(100% - 44px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 28px,#000 calc(100% - 44px),transparent 100%)}
.sc-applyask .aa-roles.is-long .aa-list.at-top{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 44px),transparent 100%);mask-image:linear-gradient(to bottom,#000 calc(100% - 44px),transparent 100%)}
.sc-applyask .aa-roles.is-long .aa-list.at-end{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 28px);mask-image:linear-gradient(to bottom,transparent 0,#000 28px)}
.sc-applyask .aa-roles.is-long .aa-list.at-top.at-end{-webkit-mask-image:none;mask-image:none}
.sc-applyask .aa-row{flex:none;display:grid;grid-template-columns:20px 44px minmax(0,1fr) auto;column-gap:14px;row-gap:10px;align-items:center;width:100%;padding:14px 16px 15px;border-radius:16px;text-align:left;transition:background .2s var(--ease),opacity .4s var(--ease)}
.sc-applyask .aa-row:hover{background:var(--wash)}
.sc-applyask .aa-row:active .aa-box{transform:scale(.9)}
.sc-applyask .aa-row.is-on{background:var(--field)}
.sc-applyask .aa-row.is-on:hover{background:var(--sunk)}
.sc-applyask .aa-row.is-sent,.sc-applyask .aa-row.is-off,.sc-applyask .aa-row.is-locked,.sc-applyask .aa-col.is-busy .aa-row{cursor:default}
.sc-applyask .aa-row.is-sent:hover,.sc-applyask .aa-row.is-off:hover,.sc-applyask .aa-row.is-locked:hover{background:transparent}
.sc-applyask .aa-row.is-locked{grid-template-columns:22px 44px minmax(0,1fr) auto;column-gap:13px}
.sc-applyask .aa-row.is-locked .sp-lg{filter:grayscale(1);opacity:.6}
.sc-applyask .aa-row.is-locked .aa-tx b{color:var(--tx-2)}
.sc-applyask .aa-col.is-busy .aa-row.is-on:hover{background:var(--field)}
.sc-applyask .aa-row.is-off{opacity:.5}
.sc-applyask .aa-box{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:transparent;box-shadow:inset 0 0 0 1.5px var(--tx-4);transition:background .18s var(--ease),box-shadow .18s var(--ease),color .18s var(--ease),border-radius .3s var(--ease),transform .18s var(--out)}
.sc-applyask .aa-box svg{width:12px;height:12px}
.sc-applyask .aa-row.is-on .aa-box{background:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);color:#fff}
.sc-applyask .aa-row.is-sent .aa-box{border-radius:50%;background:var(--ok);box-shadow:inset 0 0 0 1.5px var(--ok);color:#fff;animation:lp-pop .5s var(--spring)}
.sc-applyask .aa-tx{display:block;min-width:0}
.sc-applyask .aa-tx b{display:block;font:500 15px/20px var(--sans);letter-spacing:-.014em;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-applyask .aa-m{display:block;margin-top:2px;font:400 13px/18px var(--sans);color:var(--tx-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-applyask .aa-why{grid-column:3 / 5;display:block;font:400 13px/19px var(--sans);color:var(--tx-2);text-wrap:pretty}
.sc-applyask .aa-end{display:flex;align-items:center;justify-content:flex-end;gap:12px}
.sc-applyask .aa-sent{font:500 13px/18px var(--sans);color:var(--tx-2);white-space:nowrap;font-variant-numeric:tabular-nums;opacity:0;transform:translateX(6px);transition:opacity .35s var(--ease) .1s,transform .5s var(--spring) .1s}
.sc-applyask .aa-row.is-sent .aa-sent{opacity:1;transform:none}
/* the match ring, as in the portal */
.sc-applyask .aa-ring{position:relative;flex:none;width:44px;height:44px;display:grid;place-items:center}
.sc-applyask .aa-ring svg{position:absolute;inset:0;width:100%;height:100%}
.sc-applyask .aa-ring circle{fill:none;stroke-width:3.5}
.sc-applyask .aa-ring .tr{stroke:var(--line)}
.sc-applyask .aa-ring .ar{stroke:var(--ok-deep);stroke-linecap:round;stroke-dasharray:0 var(--c);transition:stroke-dasharray 1s var(--out) .35s}
.sc-applyask .aa-roles.is-in .aa-ring .ar{stroke-dasharray:var(--v) var(--c)}
.sc-applyask .aa-ring b{position:relative;font:600 13px/1 var(--sans);letter-spacing:-.01em;color:var(--tx);font-variant-numeric:tabular-nums}
/* what goes out */
.sc-applyask .aa-send{display:flex;align-items:center;gap:20px;margin-top:12px;padding:12px 28px 12px 12px;border-radius:24px;background:var(--sunk)}
.sc-applyask .aa-pf{flex:none;position:relative;width:132px;height:84px;border-radius:12px;background:#F3EEE9;box-shadow:inset 0 0 0 1px var(--line-2);display:block}
.sc-applyask .aa-sl{position:absolute;left:14px;right:14px;top:10px;bottom:10px;padding:9px 10px 0;border-radius:7px;background:#fff;box-shadow:0 0 0 1px var(--line-2),0 4px 10px -6px rgba(26,25,23,.2);display:block}
.sc-applyask .aa-sl b{display:block;margin-top:6px;font:400 11px/1.14 var(--serif);letter-spacing:-.02em;color:var(--tx)}
.sc-applyask .aa-sl>i{display:block;width:16px;height:1.5px;margin-top:5px;border-radius:2px;background:var(--ink)}
.sc-applyask .aa-stx{display:block;min-width:0}
.sc-applyask .aa-lbl{display:block;font:400 13px/18px var(--sans);color:var(--tx-3)}
.sc-applyask .aa-stx b{display:block;margin-top:3px;font:500 15px/20px var(--sans);color:var(--tx)}
.sc-applyask .aa-sub{display:block;margin-top:2px;font:400 13px/18px var(--sans);color:var(--tx-2)}
.sc-applyask .aa-act{display:flex;align-items:center;gap:10px;margin-top:22px}
.sc-applyask .aa-quiet{flex:1;padding-left:4px;font:400 13px/18px var(--sans);color:var(--tx-3);transition:opacity .3s var(--ease)}
.sc-applyask .aa-col.is-done .aa-quiet{opacity:0}
.sc-applyask .aa-go{min-width:148px}
.sc-applyask .aa-look{transition:background .2s,opacity .3s var(--ease)}
.sc-applyask .aa-look:active{transform:translateY(1px)}
.sc-applyask .aa-col.is-busy .aa-look,.sc-applyask .aa-col.is-done .aa-look{opacity:0;pointer-events:none}

/* ================================================================
   5 · whenback. Choosing a time is what brings them back.
   ================================================================ */
.sc-whenback .wb-wrap{position:absolute;inset:0;padding-top:16px;display:grid;place-items:center}
.sc-whenback .wb-panel{width:560px;padding:36px 32px 32px}
.sc-whenback .wb-logo{display:block;width:48px;height:48px;border-radius:14px;box-shadow:0 0 0 1px rgba(255,255,255,.14)}
.sc-whenback .wb-title{margin-top:22px;font-size:34px;line-height:1.14}
.sc-whenback .wb-line{margin-top:12px}
.sc-whenback .wb-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:26px}
.sc-whenback .wb-opt{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;height:60px;padding:0 18px 1px 20px;border-radius:18px;text-align:left;color:var(--tx);
  background:var(--glass-2);box-shadow:inset 0 0 0 1px var(--line);transition:background .2s var(--ease),color .2s var(--ease),box-shadow .2s var(--ease),transform .18s var(--out)}
.sc-whenback .wb-opt:hover{background:var(--glass-3)}
.sc-whenback .wb-opt:active{transform:scale(.985)}
.sc-whenback .wb-opt b{font:500 15px/20px var(--sans);letter-spacing:-.014em}
.sc-whenback .wb-opt span{font:400 15px/20px var(--sans);color:var(--tx-2);font-variant-numeric:tabular-nums;transition:color .2s var(--ease),transform .45s var(--spring)}
.sc-whenback .wb-opt i{position:absolute;right:16px;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;display:grid;place-items:center;background:#141312;color:#fff;opacity:0;transform:scale(.5);transition:opacity .2s var(--ease),transform .45s var(--spring)}
.sc-whenback .wb-opt i svg{width:11px;height:11px}
.sc-whenback .wb-opt.is-on{background:#F4F4F3;color:#131315;box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(0,0,0,.3),0 12px 24px -14px rgba(0,0,0,.7)}
.sc-whenback .wb-opt.is-on span{color:#5D5A54;transform:translateX(-32px)}
.sc-whenback .wb-opt.is-on i{opacity:1;transform:none}
.sc-whenback .wb-note{position:relative;height:20px;margin-top:18px}
.sc-whenback .wb-note>span{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:9px;height:20px;font:400 13px/20px var(--sans);color:var(--tx-3);white-space:nowrap;transition:opacity .3s var(--ease),transform .5s var(--spring)}
.sc-whenback .wb-held{color:var(--tx-2)!important;opacity:0;transform:translateY(6px)}
.sc-whenback .wb-panel.is-set .wb-hint{opacity:0}
.sc-whenback .wb-panel.is-set .wb-held{opacity:1;transform:none;transition-delay:.1s}
.sc-whenback .wb-panel.is-later .wb-held .sp-tick{display:none}
.sc-whenback .wb-act{display:flex;align-items:center;justify-content:space-between;margin-top:26px}
.sc-whenback .wb-now{height:48px;margin-left:-14px;padding:0 14px 1px;border-radius:15px;font:500 15px/1 var(--sans);letter-spacing:-.014em;color:var(--tx-2);transition:color .2s var(--ease),background .2s var(--ease)}
.sc-whenback .wb-now:hover{color:var(--tx);background:var(--glass-2)}
.sc-whenback .wb-now:active{background:var(--glass-3)}
.sc-whenback .wb-done{min-width:132px}

/* screens/jobs.css */
/* ZERO skill path · Jobs mode: For you, Explore, Applications, one application, and a no.
   Values are the job portal's own: warm paper, white cards, serif titles, calm density.
   One grammar: white is open to you, paper is ahead. Green means open or done, gold is the level, nothing else has colour.
   .sc-jb is on all five roots, so the shared parts are written once. Type: a serif title, then 15, 13 and 12. */
.sc-jb{--okd:#0C7E45;--okbg:#E9F6EE;--au:#E3A62B;--paper:#F8F7F5;color:var(--tx);font:400 15px/22px var(--sans);letter-spacing:-.012em}
.sc-jb .jb-page{position:absolute;left:180px;top:96px;width:1240px;bottom:0}
.sc-jb h1,.sc-jb h2,.sc-jb h3{font-weight:400}
.sc-jb ul,.sc-jb ol{list-style:none}

/* things arrive once, a few pixels up, one after another */
.sc-jb .jb-in{animation:jb-in .6s var(--spring) both;animation-delay:calc(var(--i,0) * 60ms + 140ms)}
@keyframes jb-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sc-jb .pane.swap{animation:jb-swap .32s var(--out) both}
@keyframes jb-swap{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* a scroller fades where there is more to see, and only there */
.sc-jb .jb-scroll{overflow-y:auto;overscroll-behavior:contain;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 var(--ft,0px),#000 calc(100% - var(--fb,0px)),transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0,#000 var(--ft,0px),#000 calc(100% - var(--fb,0px)),transparent 100%)}

/* ---------- shared parts ---------- */
.sc-jb .jb-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:0 0 12px;font:600 15px/20px var(--sans);letter-spacing:-.016em;color:var(--tx)}
.sc-jb .jb-h span{font:400 13px/20px var(--sans);letter-spacing:-.012em;color:var(--tx-3)}
.sc-jb .jb-h .r{display:inline-flex;align-items:baseline;gap:14px}
.sc-jb .jb-h button{display:inline-flex;align-items:center;gap:3px;font:500 13px/20px var(--sans);letter-spacing:-.012em;color:var(--tx-2);white-space:nowrap;transition:color .2s}
.sc-jb .jb-h button:hover{color:var(--tx)}
.sc-jb .jb-h button:active{color:var(--tx-3)}
.sc-jb .jb-h button svg{width:13px;height:13px}
/* the match ring, as the job portal draws it */
.sc-jb .jb-ring{position:relative;flex:none;display:inline-grid;place-items:center;width:var(--z);height:var(--z)}
.sc-jb .jb-ring svg{position:absolute;inset:0;width:100%;height:100%}
.sc-jb .jb-ring circle{fill:none;stroke-width:3.5}
.sc-jb .jb-ring .tr{stroke:var(--line)}
.sc-jb .jb-ring .ar{stroke:var(--okd);stroke-linecap:round}
.sc-jb .jb-ring b{position:relative;font:700 12px/1 var(--sans);letter-spacing:-.01em;color:var(--tx);font-variant-numeric:tabular-nums}
/* where the ring would be, a locked role says the level it opens at */
.sc-jb .jb-lv{flex:none;display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px 0 8px;border-radius:99px;background:var(--sunk);color:var(--tx-2);font:500 12px/1 var(--sans);letter-spacing:-.006em;white-space:nowrap}
.sc-jb .jb-lv svg{width:12px;height:12px;margin-top:-1px}
.sc-jb .jb-tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:7px;background:var(--field);color:var(--tx-2);font:500 12px/1 var(--sans);letter-spacing:-.006em;white-space:nowrap}
.sc-jb .jb-tag svg{width:11px;height:11px;color:var(--okd)}
.sc-jb .jb-tag.dk{background:var(--ink);color:#fff}
/* the climb: one segment a level, gold as far as the points go */
.sc-jb .jb-bar{flex:1;display:flex;gap:3px;height:8px}
.sc-jb .jb-bar>i{flex:1;position:relative;overflow:hidden;border-radius:99px;background:var(--sunk)}
.sc-jb .jb-bar u{position:absolute;left:0;top:0;bottom:0;width:var(--f);border-radius:99px;background:var(--au);animation:jb-fill .6s var(--out) both;animation-delay:calc(var(--d,0ms) + 520ms)}
@keyframes jb-fill{from{width:0}}
.sc-jb .pane.swap .jb-bar u{animation-delay:calc(var(--d,0ms) + 120ms)}
/* a scenario as the way through */
.sc-jb .jb-sc{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;border-radius:16px;background:var(--wash);box-shadow:inset 0 0 0 1px var(--line);transition:background .2s}
.sc-jb button.jb-sc:hover{background:var(--field)}
.sc-jb button.jb-sc:active{background:var(--sunk)}
