.sc-jb .jb-sc .g{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sc-jb .jb-sc .g b{font:600 15px/20px var(--sans);letter-spacing:-.016em;color:var(--tx)}
.sc-jb .jb-sc .g span{font:400 13px/18px var(--sans);color:var(--tx-2)}
.sc-jb .jb-sc em{flex:none;width:32px;height:32px;margin-right:2px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh1);color:var(--tx)}
.sc-jb .jb-sc em svg{width:14px;height:14px}
/* a checklist: a tick is proven, an open circle is still ahead */
.sc-jb .jb-asks li{display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:center;column-gap:12px;min-height:34px}
.sc-jb .jb-asks i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--tx-4)}
.sc-jb .jb-asks i svg{width:11px;height:11px}
.sc-jb .jb-asks .ok i{background:var(--okd);box-shadow:none;color:#fff}
.sc-jb .jb-asks b{font:500 15px/20px var(--sans);letter-spacing:-.014em;color:var(--tx)}
.sc-jb .jb-asks span{font:400 13px/18px var(--sans);color:var(--tx-3);text-align:right}
.sc-jb .sp-ghost{padding-bottom:1px}
.sc-jb .sp-ghost svg{width:15px;height:15px;flex:none}
.sc-jb .sp-ghost.on svg{color:var(--okd)}

/* =====================================================================================================
   1. For you
   ===================================================================================================== */
.sc-jobs .jb-main{position:absolute;left:-4px;top:-4px;width:868px;bottom:0;padding:4px 4px 44px}
.sc-jobs .jb-main section+section{margin-top:28px}
.sc-jobs .jb-side{position:absolute;left:900px;top:0;width:340px}

/* the job you want */
.sc-jobs .jb-hero{padding:24px;border-radius:24px;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh1);cursor:pointer;outline:0;transition:transform .3s var(--out),box-shadow .3s}
.sc-jobs .jb-hero:hover,.sc-jobs .jb-hero:focus-visible{transform:translateY(-1px);box-shadow:0 0 0 1px var(--line),var(--sh2)}
.sc-jobs .jb-hero header{display:flex;align-items:center;gap:16px}
.sc-jobs .jb-hero .tx{flex:1;min-width:0}
.sc-jobs .jb-hero h1{font:400 32px/36px var(--serif);letter-spacing:-.028em;color:var(--tx)}
.sc-jobs .jb-hero header p{margin-top:2px;font:400 15px/20px var(--sans);color:var(--tx-2)}
.sc-jobs .jb-now{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px 0 10px;border-radius:99px;background:var(--okbg);color:var(--okd);font:600 13px/1 var(--sans);white-space:nowrap}
.sc-jobs .jb-now svg{width:13px;height:13px}
/* the climb to it, from Level 1: your points in gold, and the gates where roles open marked on the way */
.sc-jobs .jb-track{position:relative;display:flex;align-items:center;gap:10px;height:24px;margin:24px 0 46px}
.sc-jobs .jb-track .mk{position:absolute;top:4px;left:calc((100% - 31px) * var(--k) / var(--n) - 9.5px);width:16px;height:16px}
.sc-jobs .jb-track .mk i{display:grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--tx-4),0 0 0 3px var(--card);color:#fff;transition:box-shadow .2s}
.sc-jobs .jb-track .mk i svg{width:9px;height:9px}
.sc-jobs .jb-track .mk.open i{background:var(--okd);box-shadow:0 0 0 3px var(--card)}
.sc-jobs .jb-track .mk span{position:absolute;top:24px;left:50%;transform:translateX(-50%);white-space:nowrap;font:400 12px/16px var(--sans);color:var(--tx-3);transition:color .2s}
.sc-jobs .jb-track .mk:hover span{color:var(--tx)}
.sc-jobs .jb-track .mk:hover i{box-shadow:inset 0 0 0 1.5px var(--tx-2),0 0 0 3px var(--card)}
.sc-jobs .jb-track .mk.open:hover i{box-shadow:0 0 0 3px var(--card)}
.sc-jobs .jb-track .end{flex:none;position:relative;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--tx-2)}
.sc-jobs .jb-track .end svg{width:12px;height:12px}
.sc-jobs .jb-track .end.open,.sc-jobs .jb-track .end.applied{background:var(--okd);color:#fff}
.sc-jobs .jb-track .end span{position:absolute;top:28px;right:0;white-space:nowrap;font:500 12px/16px var(--sans);color:var(--tx-2)}
.sc-jobs .jb-hero footer{display:flex;align-items:center;justify-content:space-between;gap:24px}
.sc-jobs .jb-hero footer p{font:400 15px/22px var(--sans);color:var(--tx-2)}
.sc-jobs .jb-hero footer b{font-weight:600;color:var(--tx)}
/* the one glow in Jobs: the job you want, open */
.sc-jobs .jb-hero.open{box-shadow:0 0 0 1px rgba(227,166,43,.55),0 0 0 5px rgba(255,213,107,.26),0 22px 60px -22px rgba(227,166,43,.5)}
.sc-jobs .jb-hero.open:hover{box-shadow:0 0 0 1px rgba(227,166,43,.7),0 0 0 5px rgba(255,213,107,.32),0 26px 64px -22px rgba(227,166,43,.6)}

/* role cards, in the job portal's own shape: mark top left, the ring or the lock top right. One row of three. */
.sc-jobs .jb-none{margin:-4px 0 12px;font:400 15px/22px var(--sans);color:var(--tx-2)}
.sc-jobs .jb-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.sc-jobs .jb-card{display:flex;flex-direction:column;align-items:stretch;min-width:0;text-align:left;padding:16px;border-radius:20px;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh1);transition:transform .3s var(--out),box-shadow .3s,background .2s}
.sc-jobs .jb-card:hover{transform:translateY(-2px);box-shadow:0 0 0 1px var(--line),var(--sh2)}
.sc-jobs .jb-card:active{transform:none;box-shadow:0 0 0 1px var(--line),var(--sh1)}
.sc-jobs .jb-card .top{display:flex;align-items:center;justify-content:space-between}
.sc-jobs .jb-card>b{margin:12px 0 2px;font:600 15px/20px var(--sans);letter-spacing:-.016em;color:var(--tx);overflow-wrap:anywhere}
.sc-jobs .jb-card .m{font:400 13px/18px var(--sans);color:var(--tx-3)}
.sc-jobs .jb-card .w{display:flex;align-items:center;gap:6px;margin-top:10px;font:400 13px/18px var(--sans);color:var(--tx-2)}
.sc-jobs .jb-card .w svg{flex:none;width:14px;height:14px;color:var(--tx-3)}
.sc-jobs .jb-card .w.ap svg{width:13px;height:13px;color:var(--okd)}
.sc-jobs .jb-card.locked{background:transparent;box-shadow:0 0 0 1px var(--line)}
.sc-jobs .jb-card.locked:hover{background:rgba(255,255,255,.72);box-shadow:0 0 0 1px var(--line)}

/* what Zero is doing */
.sc-jobs .jb-feed{display:flex;flex-direction:column;gap:16px;padding:20px;border-radius:20px;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh1)}
.sc-jobs .jb-feed .it{display:flex;align-items:center;gap:12px;text-align:left}
.sc-jobs .jb-feed button.it{margin:-6px -8px;padding:6px 8px;border-radius:12px;transition:background .2s}
.sc-jobs .jb-feed button.it:hover{background:var(--wash)}
.sc-jobs .jb-feed button.it:active{background:var(--field)}
.sc-jobs .jb-feed .t{display:flex;flex-direction:column;min-width:0}
.sc-jobs .jb-feed .t b{font:500 13px/18px var(--sans);color:var(--tx)}
.sc-jobs .jb-feed .t span{margin-top:1px;font:400 12px/16px var(--sans);color:var(--tx-3)}
.sc-jobs .jb-feed .ic{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--field);color:var(--tx-2)}
.sc-jobs .jb-feed .ic svg{width:16px;height:16px}
.sc-jobs .jb-feed .dot{flex:none;align-self:flex-start;width:6px;height:6px;margin:8px 1px 0;border-radius:50%;background:var(--tx-4)}
.sc-jobs .jb-feed .dot+.t b{font:400 15px/22px var(--sans);color:var(--tx);text-wrap:balance}
.sc-jobs .jb-feed .lk{display:flex;align-items:center;gap:8px;height:44px;margin:4px -8px -8px;padding:0 10px 1px 12px;border-radius:12px;background:var(--wash);box-shadow:inset 0 0 0 1px var(--line);font:500 13px/1 var(--sans);color:var(--tx);transition:background .2s}
.sc-jobs .jb-feed .lk:hover{background:var(--field)}
.sc-jobs .jb-feed .lk:active{background:var(--sunk)}
.sc-jobs .jb-feed .lk span{flex:1;text-align:left}
.sc-jobs .jb-feed .lk em{font-style:normal;font-weight:400;color:var(--tx-3);font-variant-numeric:tabular-nums}
.sc-jobs .jb-feed .lk svg{width:14px;height:14px;color:var(--tx-3)}

/* =====================================================================================================
   2. Explore
   ===================================================================================================== */
.sc-explore .jb-top{display:flex;align-items:center;justify-content:space-between;height:34px}
.sc-explore .jb-fil{display:flex;gap:6px}
.sc-explore .jb-fil button{height:34px;padding:0 14px 1px;border-radius:99px;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh1);color:var(--tx-2);font:500 13px/1 var(--sans);transition:background .18s,color .18s,box-shadow .18s}
.sc-explore .jb-fil button i{margin-left:6px;font-style:normal;font-weight:400;opacity:.6;font-variant-numeric:tabular-nums}
.sc-explore .jb-fil button:hover{color:var(--tx);box-shadow:0 0 0 1px rgba(26,25,23,.2),var(--sh1)}
.sc-explore .jb-fil button:active{background:var(--wash)}
.sc-explore .jb-fil button.on{background:var(--ink);color:#fff;box-shadow:0 0 0 1px var(--ink)}
.sc-explore .jb-fil button:disabled{opacity:.42;pointer-events:none}
/* search, as on any job board: it filters as you type */
.sc-explore .jb-find{display:flex;align-items:center;gap:8px;width:300px;height:34px;padding:0 5px 0 12px;border-radius:99px;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh1);color:var(--tx-3);cursor:text;transition:box-shadow .18s}
.sc-explore .jb-find:hover{box-shadow:0 0 0 1px rgba(26,25,23,.2),var(--sh1)}
.sc-explore .jb-find:focus-within{box-shadow:0 0 0 1.5px var(--ink),var(--sh1);color:var(--tx)}
.sc-explore .jb-find>svg{flex:none;width:15px;height:15px}
.sc-explore .jb-find input{flex:1;min-width:0;height:100%;padding:0 0 1px;border:0;outline:0;background:none;font:400 13px/1 var(--sans);letter-spacing:-.012em;color:var(--tx)}
.sc-explore .jb-find input::placeholder{color:var(--tx-3)}
.sc-explore .jb-find button{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--tx-3);opacity:0;pointer-events:none;transition:opacity .15s,background .15s,color .15s}
.sc-explore .jb-find.has button{opacity:1;pointer-events:auto}
.sc-explore .jb-find button:hover{background:var(--field);color:var(--tx)}
.sc-explore .jb-find button svg{width:12px;height:12px}
.sc-explore .jb-split{position:absolute;left:0;right:0;top:50px;bottom:28px}

.sc-explore .jb-list{position:absolute;left:-4px;top:-4px;bottom:-4px;width:478px;padding:4px;display:flex;flex-direction:column;gap:8px}
.sc-explore .jb-row{flex:none;display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border-radius:20px;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh1);transition:background .18s,box-shadow .18s}
.sc-explore .jb-row:hover{box-shadow:0 0 0 1px rgba(26,25,23,.22),var(--sh1)}
.sc-explore .jb-row:active{background:var(--wash)}
.sc-explore .jb-row .g{flex:1;min-width:0;display:flex;flex-direction:column}
.sc-explore .jb-row .g b{font:600 15px/20px var(--sans);letter-spacing:-.016em;color:var(--tx)}
.sc-explore .jb-row .m{margin-top:2px;font:400 13px/18px var(--sans);color:var(--tx-3)}
.sc-explore .jb-row .tg{display:flex;gap:6px;margin-top:8px}
.sc-explore .jb-row.locked{background:transparent;box-shadow:0 0 0 1px var(--line)}
.sc-explore .jb-row.locked:hover{background:rgba(255,255,255,.72);box-shadow:0 0 0 1px rgba(26,25,23,.22)}
.sc-explore .jb-row.on,.sc-explore .jb-row.on:hover{background:var(--card);box-shadow:0 0 0 1.5px var(--ink),var(--sh1)}
.sc-explore .jb-zero{flex:none;display:flex;flex-direction:column;align-items:flex-start;padding:20px;border-radius:20px;box-shadow:0 0 0 1px var(--line)}
.sc-explore .jb-zero b{font:600 15px/20px var(--sans);letter-spacing:-.016em}
.sc-explore .jb-zero span{margin:2px 0 14px;font:400 13px/18px var(--sans);color:var(--tx-3)}

.sc-explore .jb-det{position:absolute;left:490px;right:0;top:0;bottom:0;overflow:hidden;border-radius:24px;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh1)}
.sc-explore .jb-det .in{position:absolute;inset:0;padding:26px 28px 32px}
.sc-explore .dh{display:flex;align-items:flex-start;gap:16px}
.sc-explore .dh h2{font:400 28px/32px var(--serif);letter-spacing:-.026em;color:var(--tx);text-wrap:balance}
.sc-explore .dh p{margin-top:4px;font:400 13px/18px var(--sans);color:var(--tx-3)}
.sc-explore .da{display:flex;align-items:center;gap:8px;margin-top:20px}
.sc-explore .jb-sent{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px 1px 12px;margin-right:4px;border-radius:13px;background:var(--okbg);color:var(--okd);font:500 13px/1 var(--sans);white-space:nowrap}
.sc-explore .jb-sent svg{width:14px;height:14px}
/* Zero only acts on a yes */
.sc-explore .jb-ask{margin-top:20px;padding:16px;border-radius:16px;background:var(--wash);box-shadow:inset 0 0 0 1px var(--line);animation:jb-swap .3s var(--out) both}
.sc-explore .jb-ask b{display:block;font:600 15px/20px var(--sans);letter-spacing:-.016em}
.sc-explore .jb-ask p{margin-top:2px;font:400 13px/19px var(--sans);color:var(--tx-2)}
.sc-explore .jb-ask div{display:flex;gap:8px;margin-top:14px}
/* three facts */
.sc-explore .jb-ins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
.sc-explore .jb-ins>div{display:flex;align-items:center;gap:12px;min-height:76px;padding:12px 14px;border-radius:14px;background:var(--wash)}
.sc-explore .jb-ins em{flex:none;min-width:52px;text-align:center;font:400 28px/1 var(--serif);letter-spacing:-.02em;font-style:normal;color:var(--tx)}
.sc-explore .jb-ins .jb-ring b{font-size:13px}
.sc-explore .jb-ins p span{display:block;font:400 12px/16px var(--sans);color:var(--tx-3)}
.sc-explore .jb-ins p b{display:block;margin-top:1px;font:600 13px/18px var(--sans);letter-spacing:-.014em;color:var(--tx)}
.sc-explore .jb-det section{margin-top:22px}
.sc-explore .jb-det section .jb-h{margin-bottom:8px}
/* what the job is, in three plain lines */
.sc-explore .jb-about li{position:relative;padding-left:16px;font:400 15px/24px var(--sans);color:var(--tx-2)}
.sc-explore .jb-about li::before{content:'';position:absolute;left:2px;top:10px;width:4px;height:4px;border-radius:50%;background:var(--tx-4)}
.sc-explore .jb-gap{margin:0 0 12px;font:400 15px/22px var(--sans);color:var(--tx-2)}
/* a locked role: how many scenarios, the level that takes you to, and the one to start */
.sc-explore .jb-lock{margin-top:20px;padding:16px 16px 18px;border-radius:16px;background:var(--wash);box-shadow:inset 0 0 0 1px var(--line)}
.sc-explore .jb-lock .hd{display:flex;align-items:center;gap:14px}
.sc-explore .jb-lock .hd p{flex:1;min-width:0}
.sc-explore .jb-lock .sp-lock{background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh1);color:var(--tx-2)}
.sc-explore .jb-lock .sp-lock svg{width:44%;height:44%}
.sc-explore .jb-lock .hd p b{display:block;font:600 15px/20px var(--sans);letter-spacing:-.016em}
.sc-explore .jb-lock .hd p span{display:block;margin-top:1px;font:400 13px/18px var(--sans);color:var(--tx-2)}
.sc-explore .jb-lock .jb-bar{height:6px;margin-top:16px}
.sc-explore .jb-why{display:flex;align-items:center;gap:20px;margin-top:20px;padding:12px 12px 12px 16px;border-radius:16px;box-shadow:inset 0 0 0 1px var(--line)}
.sc-explore .jb-why p{flex:1;min-width:0;font:400 13px/19px var(--sans);color:var(--tx-2);text-wrap:pretty}

/* =====================================================================================================
   3. Applications
   ===================================================================================================== */
.sc-tracker .jb-page{left:370px;width:860px}
.sc-tracker .tk-h{margin-top:2px;font:400 32px/36px var(--serif);letter-spacing:-.028em;color:var(--tx)}
.sc-tracker .tk-list{position:absolute;left:-4px;right:-4px;top:58px;bottom:0;padding:4px 4px 44px;display:flex;flex-direction:column;gap:8px}
.sc-tracker .tk-row{flex:none;display:flex;align-items:center;gap:12px;padding:14px 14px 14px 16px;border-radius:20px;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh1);cursor:pointer;outline:0;transition:background .18s,box-shadow .18s,transform .3s var(--out)}
.sc-tracker .tk-row:hover,.sc-tracker .tk-row:focus-visible{box-shadow:0 0 0 1px rgba(26,25,23,.22),var(--sh1)}
.sc-tracker .tk-row:active{background:var(--wash)}
.sc-tracker .tk-row .g{flex:1;min-width:0;display:flex;flex-direction:column}
.sc-tracker .tk-row .g b{font:600 15px/20px var(--sans);letter-spacing:-.016em;color:var(--tx)}
.sc-tracker .tk-row .m{margin-top:2px;font:400 13px/18px var(--sans);color:var(--tx-3)}
.sc-tracker .tk-row .s{flex:none;width:336px;display:flex;align-items:center;gap:12px}
.sc-tracker .tk-row .s i{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--field);color:var(--tx-2)}
.sc-tracker .tk-row .s i svg{width:15px;height:15px}
.sc-tracker .tk-row .s b{display:block;font:500 15px/20px var(--sans);letter-spacing:-.014em;color:var(--tx)}
.sc-tracker .tk-row .mv{display:block;margin-top:2px;font:400 13px/18px var(--sans);color:var(--tx-3)}
.sc-tracker .tk-row .mv.go{display:inline-flex;align-items:center;gap:2px;font-weight:500;color:var(--tx);transition:color .2s}
.sc-tracker .tk-row .mv.go svg{width:13px;height:13px;transition:transform .25s var(--out)}
.sc-tracker .tk-row .mv.go:hover svg{transform:translateX(2px)}
.sc-tracker .tk-row .mv.go:active{color:var(--tx-2)}
.sc-tracker .tk-row>em{flex:none;display:grid;place-items:center;width:24px;height:24px;color:var(--tx-4);transition:color .2s,transform .25s var(--out)}
.sc-tracker .tk-row>em svg{width:14px;height:14px}
.sc-tracker .tk-row:hover>em{color:var(--tx-2);transform:translateX(2px)}
.sc-tracker .tk-row.you .s i{background:var(--ink);color:#fff}
.sc-tracker .tk-row.you .mv{color:var(--tx);font-weight:600}
.sc-tracker .tk-row.ended{background:transparent;box-shadow:0 0 0 1px var(--line)}
.sc-tracker .tk-row.ended .s i{background:var(--sunk)}
.sc-tracker .tk-row.ended:hover{background:rgba(255,255,255,.72);box-shadow:0 0 0 1px rgba(26,25,23,.22)}
/* nothing sent yet */
.sc-tracker .tk-none{position:absolute;left:120px;top:54px;width:620px;padding:36px;border-radius:24px;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh1)}
.sc-tracker .tk-none h1{font:400 32px/36px var(--serif);letter-spacing:-.028em}
.sc-tracker .tk-none p{margin:10px 0 24px;font:400 15px/22px var(--sans);color:var(--tx-2);text-wrap:pretty}

/* =====================================================================================================
   4. One application: the role, where it stands, the one card for now, then the history
   ===================================================================================================== */
.sc-app .ap-page{position:absolute;left:406px;top:92px;width:788px;bottom:0;padding:4px 4px 44px}
.sc-app .ap-top{display:flex;align-items:center;gap:14px}
.sc-app .ap-top div{flex:1;min-width:0}
.sc-app .ap-top div b{display:block;font:600 15px/20px var(--sans);letter-spacing:-.016em;color:var(--tx)}
.sc-app .ap-top div span{display:block;margin-top:2px;font:400 13px/18px var(--sans);color:var(--tx-3)}
.sc-app .ap-all{flex:none;display:inline-flex;align-items:center;gap:3px;height:34px;padding:0 9px 1px 14px;border-radius:99px;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh1);color:var(--tx-2);font:500 13px/1 var(--sans);transition:color .2s,box-shadow .2s}
.sc-app .ap-all:hover{color:var(--tx);box-shadow:0 0 0 1px rgba(26,25,23,.2),var(--sh1)}
.sc-app .ap-all:active{background:var(--wash)}
.sc-app .ap-all svg{width:13px;height:13px}

/* the rail: a tick is behind you, the dark one is where it stands, a ring is still ahead */
.sc-app .ap-railbox{margin-top:26px}
.sc-app .ap-rail{position:relative;height:60px}
.sc-app .ap-rail::before,.sc-app .ap-rail::after{content:'';position:absolute;left:11px;top:10px;height:2px;border-radius:2px}
.sc-app .ap-rail::before{right:11px;background:rgba(26,25,23,.11)}
.sc-app .ap-rail::after{width:calc((100% - 22px) * var(--p));background:var(--okd)}
.sc-app .ap-rail li{position:absolute;top:0;left:calc(11px + (100% - 22px) * var(--i) / var(--n));width:0;display:flex;flex-direction:column;align-items:center;white-space:nowrap}
.sc-app .ap-rail li:first-child{align-items:flex-start;margin-left:-11px}
.sc-app .ap-rail li:last-child{align-items:flex-end;margin-left:11px}
.sc-app .ap-rail li i{position:relative;z-index:1;flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--tx-4),0 0 0 4px var(--paper);color:#fff}
.sc-app .ap-rail li i svg{width:11px;height:11px}
.sc-app .ap-rail li.done i{background:var(--okd);box-shadow:0 0 0 4px var(--paper)}
.sc-app .ap-rail li.now i,.sc-app .ap-rail li.end i{background:var(--ink);box-shadow:0 0 0 4px var(--paper)}
.sc-app .ap-rail li.now i::after{content:'';width:8px;height:8px;border-radius:50%;background:#fff}
.sc-app .ap-rail li b{margin-top:8px;font:500 13px/18px var(--sans);letter-spacing:-.012em;color:var(--tx-3)}
.sc-app .ap-rail li.done b{color:var(--tx-2)}
.sc-app .ap-rail li.now b,.sc-app .ap-rail li.end b{font-weight:600;color:var(--tx)}
.sc-app .ap-rail li span{font:400 12px/16px var(--sans);color:var(--tx-3)}
.sc-app .ap-rail li.now span{color:var(--tx-2)}

/* the one card */
.sc-app .ap-now{margin-top:20px;padding:28px;border-radius:24px;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh2)}
.sc-app .ap-who{display:inline-flex;align-items:center;height:26px;padding:0 11px 1px;border-radius:99px;background:var(--field);color:var(--tx-2);font:500 12px/1 var(--sans);letter-spacing:-.006em;white-space:nowrap}
.sc-app .ap-who.you{background:var(--ink);color:#fff}
.sc-app .ap-now h1{margin-top:14px;font:400 32px/36px var(--serif);letter-spacing:-.028em;color:var(--tx);text-wrap:balance}
.sc-app .ap-now .lead{margin-top:8px;max-width:640px;font:400 15px/22px var(--sans);color:var(--tx-2);text-wrap:balance}
.sc-app .ap-now .jb-h{margin:24px 0 8px}
.sc-app .ap-acts{display:flex;gap:8px;margin-top:24px}
/* sent: what went out, in order */
.sc-app .ap-cases li{display:grid;grid-template-columns:16px 36px minmax(0,1fr) auto;align-items:center;column-gap:12px;min-height:48px}
.sc-app .ap-cases em{font:500 13px/1 var(--sans);font-style:normal;color:var(--tx-3);font-variant-numeric:tabular-nums}
.sc-app .ap-cases b{font:600 15px/20px var(--sans);letter-spacing:-.016em}
.sc-app .ap-cases .k{font:400 13px/18px var(--sans);color:var(--tx-3)}
/* invited: who, how long, the format, then the times */
.sc-app .ap-facts{display:grid;grid-template-columns:84px minmax(0,1fr);row-gap:6px;margin-top:20px}
.sc-app .ap-facts dt{font:400 13px/22px var(--sans);color:var(--tx-3)}
.sc-app .ap-facts dd{font:400 15px/22px var(--sans);color:var(--tx);text-wrap:pretty}
.sc-app .ap-slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:22px}
.sc-app .ap-slots button{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:14px 16px 15px;border-radius:16px;background:var(--wash);box-shadow:inset 0 0 0 1px var(--line);transition:background .18s,box-shadow .18s}
.sc-app .ap-slots button:hover{background:var(--field)}
.sc-app .ap-slots button:active{background:var(--sunk)}
.sc-app .ap-slots button.on,.sc-app .ap-slots button.on:hover{background:var(--card);box-shadow:inset 0 0 0 1.5px var(--ink)}
.sc-app .ap-slots i{position:absolute;right:14px;top:14px;width:18px;height:18px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--tx-4);transition:box-shadow .2s var(--out)}
.sc-app .ap-slots .on i{box-shadow:inset 0 0 0 5.5px var(--ink)}
.sc-app .ap-slots b{font:600 15px/20px var(--sans);letter-spacing:-.016em;color:var(--tx)}
.sc-app .ap-slots span{font:400 13px/18px var(--sans);color:var(--tx-2)}
.sc-app .ap-slots .t{margin-top:8px;font:500 15px/20px var(--sans);color:var(--tx)}
/* scheduled: the case they asked for, and what they are likely to ask */
.sc-app .ap-prep{display:grid;grid-template-columns:292px minmax(0,1fr);column-gap:36px}
.sc-app .ap-case{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--wash);box-shadow:inset 0 0 0 1px var(--line)}
.sc-app .ap-case .x b{display:block;font:600 15px/20px var(--sans);letter-spacing:-.016em}
.sc-app .ap-case .x span{display:block;margin-top:1px;font:400 13px/18px var(--sans);color:var(--tx-3)}
.sc-app .ap-say{margin:12px 0 18px;font:400 13px/19px var(--sans);color:var(--tx-2);text-wrap:pretty}
.sc-app .ap-qs{display:flex;flex-direction:column;gap:14px}
.sc-app .ap-qs b{display:block;font:600 15px/21px var(--sans);letter-spacing:-.016em}
.sc-app .ap-qs span{display:block;margin-top:2px;font:400 13px/19px var(--sans);color:var(--tx-2);text-wrap:balance}
.sc-app .ap-qs em{font-style:normal;font-weight:500;color:var(--tx)}
/* interviewed: what Zero did, then the reply */
.sc-app .ap-did,.sc-app .ap-reply .row{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 12px;border-radius:16px}
.sc-app .ap-did{margin-top:22px;background:var(--wash);box-shadow:inset 0 0 0 1px var(--line)}
.sc-app .ap-did .ic{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh1);color:var(--tx-2)}
.sc-app .ap-did .ic svg{width:16px;height:16px}
.sc-app .ap-now .x{flex:1;min-width:0}
.sc-app .ap-did .x b,.sc-app .ap-reply .x b{display:block;font:600 15px/20px var(--sans);letter-spacing:-.016em}
.sc-app .ap-did .x span,.sc-app .ap-reply .x span{display:block;margin-top:1px;font:400 13px/18px var(--sans);color:var(--tx-3)}
.sc-app .ap-reply{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .6s var(--spring),opacity .4s var(--ease) .12s,margin-top .6s var(--spring)}
.sc-app .ap-reply>div{min-height:0;overflow:hidden}
.sc-app .ap-reply.in{grid-template-rows:1fr;opacity:1;margin-top:10px}
.sc-app .ap-reply .row{box-shadow:inset 0 0 0 1.5px var(--ink)}
.sc-app .ap-reply .sp-key{position:relative}
.sc-app .ap-reply.in .sp-key::after{content:'';position:absolute;inset:-5px;border-radius:20px;border:1.5px solid var(--ink);opacity:0;animation:ap-pulse 2.8s var(--out) 1.2s infinite}
@keyframes ap-pulse{0%{opacity:.34;transform:scale(.97)}60%,100%{opacity:0;transform:scale(1.06)}}

/* the history, kept quiet */
.sc-app .ap-hist{margin-top:26px;padding:0 4px}
.sc-app .ap-hist h3{margin-bottom:4px;font:500 13px/18px var(--sans);color:var(--tx-3)}
.sc-app .ap-hist li{display:grid;grid-template-columns:152px minmax(0,1fr);align-items:center;min-height:26px}
.sc-app .ap-hist li span{font:400 13px/18px var(--sans);color:var(--tx-3)}
.sc-app .ap-hist li b{font:400 13px/18px var(--sans);color:var(--tx-2)}

/* =====================================================================================================
   5. A no
   ===================================================================================================== */
.sc-passed{display:flex;align-items:center;justify-content:center;padding:96px 0 28px}
.sc-passed .ps-card{flex:none;display:flex;width:720px;max-height:100%;overflow:hidden;border-radius:24px;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh2)}
.sc-passed .ps-card>.jb-scroll{flex:1;padding:32px 36px}
.sc-passed header{display:flex;align-items:center;gap:14px}
.sc-passed header>span:last-child{font:400 13px/18px var(--sans);color:var(--tx-3)}
.sc-passed h1{margin-top:20px;font:400 36px/40px var(--serif);letter-spacing:-.028em;color:var(--tx)}
.sc-passed .why{margin-top:8px;font:400 15px/22px var(--sans);color:var(--tx-2)}
.sc-passed .cols{display:flex;flex-direction:column;gap:20px;margin:28px 0 24px}
.sc-passed .jb-h{margin-bottom:6px}
.sc-passed .jb-asks li{grid-template-columns:20px minmax(0,1fr);align-items:start;row-gap:1px;padding:7px 0;min-height:0}
.sc-passed .jb-asks span{grid-column:2;text-align:left;color:var(--tx-2)}
.sc-passed .jb-asks b{font-weight:600}
.sc-passed .jb-sc.fix{padding:16px}
.sc-passed footer{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:20px}
.sc-passed footer p{font:400 13px/18px var(--sans);color:var(--tx-3)}

/* screens/later.css */
/* ZERO skill path · the later moments: recap, proof, dreamapply, offer, hired.
   World tone for the two panels that sit on the city, the job portal's paper for the Jobs pages and the letter.
   Sizes on every screen: one serif title, 15 body, 13 secondary, 12 small. The letter sets its own body in the serif. */

/* things take their place by rising a little. If the animation never runs, they are simply there. */
.sc-recap .lt-in,.sc-proof .lt-in,.sc-dreamapply .lt-in,.sc-offer .lt-in,.sc-hired .lt-in{animation:lt-rise .7s var(--spring) backwards;animation-delay:calc(var(--i,0) * 60ms + 140ms)}
@keyframes lt-rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* the quiet button sets down when pressed, like the key */
.sc-recap .sp-ghost,.sc-proof .sp-ghost,.sc-dreamapply .sp-ghost,.sc-offer .sp-ghost{transition:background .2s,transform .18s var(--out)}
.sc-recap .sp-ghost:active,.sc-proof .sp-ghost:active,.sc-dreamapply .sp-ghost:active,.sc-offer .sp-ghost:active{transform:translateY(1px)}

/* ================= 1 · recap ================= */
.sc-recap .rc-panel{position:absolute;left:480px;top:190px;width:640px;padding:32px 12px 12px}
.sc-recap .rc-panel h1{padding:0 12px}
.sc-recap .rc-rows{display:flex;flex-direction:column;gap:6px;margin-top:24px}
.sc-recap .rc-row{display:flex;align-items:center;gap:14px;width:100%;height:64px;padding:0 16px 0 12px;border-radius:18px;text-align:left;
  background:var(--glass-2);box-shadow:inset 0 0 0 1px var(--line-2);transition:background .2s var(--ease)}
.sc-recap .rc-row:hover{background:var(--glass-3)}
.sc-recap .rc-row:active{background:rgba(255,255,255,.13)}
.sc-recap .rc-row .tx{flex:1;min-width:0;font:400 15px/1.35 var(--sans);letter-spacing:-.012em;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-recap .rc-row .tx b{font-weight:500}
.sc-recap .rc-row .tx em{font-style:normal;color:var(--tx-2)}
.sc-recap .rc-row .go{flex:none;width:16px;height:16px;color:var(--tx-2);opacity:0;transform:translateX(-4px);transition:opacity .2s var(--ease),transform .3s var(--spring)}
.sc-recap .rc-row:hover .go{opacity:1;transform:none}
.sc-recap .rc-acts{display:flex;gap:8px;margin-top:12px}
.sc-recap .rc-acts .sp-key,.sc-recap .rc-acts .sp-ghost{height:52px;border-radius:18px}
.sc-recap .rc-acts .sp-key{flex:1;gap:10px}
.sc-recap .rc-acts .sp-ghost{padding:0 24px 2px}

/* ================= 2 · proof ================= */
.sc-proof .pf-scroll{position:absolute;left:256px;top:70px;width:1088px;height:770px;overflow-y:auto;overscroll-behavior:contain;padding:26px 24px 0;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 20px,#000 calc(100% - 80px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 20px,#000 calc(100% - 80px),transparent 100%)}
.sc-proof .pf-page{padding-bottom:120px}
.sc-proof .pf-card{background:var(--card);border-radius:24px;box-shadow:0 0 0 1px var(--line),var(--sh1)}

.sc-proof .pf-head{display:flex;align-items:center;gap:16px}
.sc-proof .pf-av{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(150deg,#EAE4D9,#CFC5B4);
  font:400 24px/1 var(--serif);color:rgba(26,25,23,.55)}
.sc-proof .pf-id{flex:1;min-width:0}
.sc-proof .pf-id h1{font:400 32px/1.1 var(--serif);letter-spacing:-.028em;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-proof .pf-id p{margin-top:3px;font:400 15px/1.3 var(--sans);color:var(--tx-2)}
.sc-proof .pf-copy{display:inline-grid;flex:none;padding:0 16px 1px 14px}
.sc-proof .pf-copy span{grid-area:1/1;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .2s var(--ease),transform .35s var(--spring)}
.sc-proof .pf-copy svg{width:15px;height:15px;flex:none}
.sc-proof .pf-copy .b{opacity:0;transform:translateY(5px)}
.sc-proof .pf-copy .b svg{color:var(--ok-deep)}
.sc-proof .pf-copy.done .a{opacity:0;transform:translateY(-5px)}
.sc-proof .pf-copy.done .b{opacity:1;transform:none}

.sc-proof .pf-level{display:flex;align-items:center;gap:24px;margin-top:24px;padding:24px 28px}
.sc-proof .pf-level .sp-ring circle{stroke-width:2.5}
.sc-proof .pf-level .sp-ring .tr{stroke:var(--sunk)}
.sc-proof .pf-level .tx{flex:1;min-width:0}
.sc-proof .pf-level .lv{display:flex;align-items:center;gap:10px}
.sc-proof .pf-level .lv b{font:600 15px/1 var(--sans);color:var(--tx)}
.sc-proof .pf-level .lv span{display:inline-flex;align-items:center;height:22px;padding:0 8px 1px;border-radius:7px;background:var(--field);font:500 12px/1 var(--sans);color:var(--tx-2)}
.sc-proof .pf-level h2{margin-top:9px;font:400 24px/1.2 var(--serif);letter-spacing:-.022em;color:var(--tx);text-wrap:balance}
.sc-proof .pf-level .rv{display:flex;align-items:center;gap:6px;margin-top:10px;font:400 13px/1 var(--sans);color:var(--tx-2)}
.sc-proof .pf-level .rv svg{width:14px;height:14px;flex:none;color:var(--ok-deep)}

.sc-proof .pf-skills{margin-top:12px;padding:8px}
.sc-proof .pf-sk-head,.sc-proof .pf-sk{display:grid;grid-template-columns:minmax(0,1fr) 300px 224px;column-gap:40px;align-items:center;padding:0 20px}
.sc-proof .pf-sk-head{height:36px;font:400 12px/1 var(--sans);color:var(--tx-3)}
.sc-proof .pf-sk{height:62px;border-radius:16px;transition:background .2s var(--ease)}
.sc-proof .pf-sk:hover{background:var(--wash)}
.sc-proof .pf-sk .nm{min-width:0}
.sc-proof .pf-sk .nm b{display:block;font:500 15px/1.2 var(--sans);color:var(--tx)}
.sc-proof .pf-sk .nm span{display:block;margin-top:4px;font:400 13px/1.2 var(--sans);color:var(--tx-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-proof .pf-sk .pt{display:flex;align-items:center;gap:16px}
.sc-proof .pf-sk .bar{flex:1;height:6px;border-radius:99px;background:var(--field);overflow:hidden}
.sc-proof .pf-sk .bar i{display:block;width:0;height:100%;border-radius:99px;background:#E3A62B;transition:width 1.1s var(--out)}
.sc-proof .pf-sk .pt b{flex:none;width:46px;text-align:right;font:500 15px/1 var(--sans);font-variant-numeric:tabular-nums;color:var(--tx)}
.sc-proof .pf-sk .by{display:flex;align-items:center;gap:4px}
.sc-proof .pf-sk .by em{font:400 13px/1 var(--sans);font-style:normal;color:var(--tx-4)}

.sc-proof .pf-sec{display:flex;align-items:baseline;justify-content:space-between;margin:32px 0 12px}
.sc-proof .pf-sec b{font:600 15px/1.3 var(--sans);color:var(--tx)}
.sc-proof .pf-sec span{font:400 13px/1.3 var(--sans);color:var(--tx-3)}
.sc-proof .pf-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sc-proof .pf-proj{display:flex;gap:16px;padding:20px;border-radius:20px}
.sc-proof .pf-proj .tx{flex:1;min-width:0}
.sc-proof .pf-proj .hd{display:flex;align-items:baseline;gap:12px}
.sc-proof .pf-proj h3{flex:1;min-width:0;font:400 22px/1.2 var(--serif);letter-spacing:-.022em;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-proof .pf-proj .pts{flex:none;display:flex;align-items:center;gap:5px;font:500 15px/1 var(--sans);font-variant-numeric:tabular-nums;color:var(--tx)}
.sc-proof .pf-proj .m{margin-top:4px;font:400 13px/1.3 var(--sans);color:var(--tx-3)}
.sc-proof .pf-proj .m b{font-weight:500;color:var(--tx-2)}
.sc-proof .pf-proj .sk{display:flex;gap:6px;margin-top:14px}
.sc-proof .pf-proj .sk span{display:inline-flex;align-items:center;height:24px;padding:0 9px 1px;border-radius:8px;background:var(--field);font:500 12px/1 var(--sans);color:var(--tx-2);white-space:nowrap}
.sc-proof .pf-empty{padding:22px 24px;border-radius:20px;background:var(--sunk);font:400 15px/1.45 var(--sans);color:var(--tx-2)}

/* ================= 3 · dreamapply ================= */
.sc-dreamapply .da-scroll{position:absolute;left:386px;top:70px;width:828px;height:770px;overflow-y:auto;overscroll-behavior:contain;padding:26px 24px 0;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 20px,#000 calc(100% - 20px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 20px,#000 calc(100% - 20px),transparent 100%)}
.sc-dreamapply .da-col{padding-bottom:32px}
.sc-dreamapply .da-card{padding:28px;border-radius:24px;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh2)}

/* the match ring, as the job portal draws it */
.sc-dreamapply .lt-match{position:relative;flex:none;display:grid;place-items:center}
.sc-dreamapply .lt-match svg{position:absolute;inset:0;width:100%;height:100%}
.sc-dreamapply .lt-match circle{fill:none;stroke-width:3.5}

/* screens/loop.js */
/* ZERO skill path · the loop around one scenario.
   Five screens, in story order:
     earn      points land inside the workspace, with a reason, at a named moment
     review    the scenario, graded: one result, then what it paid by skill
     levelup   any level: a gate opens its roles, a level between gates shows how far the next ones are
     applyask  Zero asks before it applies
     whenback  the learner picks when the next scenario happens
   Every number is read from SP_DATA. Each screen draws from api.state alone, and takes
   opts.instant to land on its final state with no motion. */
(function () {
  'use strict';

  var WORDS = ['No', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten'];
  function word(n) { return WORDS[n] || String(n); }
  function all(el, s) { return Array.prototype.slice.call(el.querySelectorAll(s)); }
  function plural(n, one, many) { return n === 1 ? one : many; }
  function list(a) { return a.length < 3 ? a.join(' and ') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]; }
  function uniq(a) { return a.filter(function (x, i) { return a.indexOf(x) === i; }); }

  /* a step or a screen that is not in this build is skipped quietly */
  function known(id) { return (window.SP.steps || []).some(function (s) { return s.id === id || s.screen === id; }); }
  function go(api, id) { if (known(id)) api.go(id); }
  function show(api, id) { if (known(id)) api.show(id); }

  /* a number that counts to its value. It stops by itself if the screen has gone. */
  function count(el, from, to, ms, fmt, pre) {
    var t0 = null;
    function f(t) {
      if (!el.isConnected) return;
      if (t0 === null) t0 = t;
      var k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3);

  }

  /* things marked data-in="ms" take their place in that order */
  function arrive(root, api, instant) {
    all(root, '[data-in]').forEach(function (el) {
      if (instant) { el.classList.add('is-in'); return; }
      api.later(140 + (+el.getAttribute('data-in') || 0), function () { el.classList.add('is-in'); });
    });

  function quick(opts) { return !!(opts && opts.instant) || !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
  /* opts.instant: lay the final state out with motion off, then give motion back for what is clicked next */

     1 · earn. Inside the workspace, at the moment a stage is graded.

    before: ['You found the cause: calendar conflicts.', 'Now design the fix. Send me the flow when it is ready.'],
    file: 'New cancel flow', meta: 'Figma, 5 screens',
    good: { t: 'Swap first is the right idea.', s: 'A host with a calendar conflict can move the date and keep the booking.' },
    fix: { t: 'Steps 2 and 4 have no way back.', s: 'A host who taps by mistake is stuck.' },

  SP.screen({
    id: 'earn', tone: 'paper', chrome: { pill: true },
    mount: function (root, api, opts) {
      var D = api.data, E = D.EARN, fmt = D.fmt, esc = api.esc, instant = quick(opts);
      var sc = D.scenario(D.RESULT.scenario), num = D.SCENARIOS.indexOf(sc) + 1;
      var now = 0; E.forEach(function (e, i) { if (e.k === STAGE.k) now = i; });
      var cur = E[now], miss = cur.max - cur.got, before = 0, max = 0;
      E.forEach(function (e, i) { max += e.max; if (i < now) before += e.got; });
      var after = before + cur.got, ahead = E.slice(now + 1);
      var aheadMax = ahead.reduce(function (n, e) { return n + e.max; }, 0);

        var st = i < now ? 'done' : i === now ? 'now is-grading' : 'ahead';

/* ZERO skill path · Jobs mode: For you, Explore, Applications, one application from the yes to the reply, and a no.

   Roles open at gate levels only. A lock is never a wall: it says how many scenarios, the level that takes you to,

(function () {

  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var FULL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var EVE = { Monday: 'Sunday', Tuesday: 'Monday', Wednesday: 'Tuesday', Thursday: 'Wednesday', Friday: 'Thursday', Saturday: 'Friday', Sunday: 'Saturday' };

  }
  /* when something happened: as a distance for the feed, as a date for a page */
  function when(a, d) { return a.fresh ? 'Just now' : a.late ? ago(d) : 'Today, 11:04'; }
  function date(a, d) { return a.fresh ? 'Just now' : a.late ? day(d) : 'Today, 11:04'; }
  function sentLine(a) { return !a || (!a.fresh && !a.late) ? 'Applied today, 11:04' : a.fresh ? 'Applied just now' : 'Applied ' + day(a.ev[0][1]); }

  /* ---------- parts ---------- */
  var IC = {
    heart: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13.2S2.7 10.1 2.7 6.4A2.8 2.8 0 018 5.1a2.8 2.8 0 015.3 1.3c0 3.7-5.3 6.8-5.3 6.8z"/></svg>',
    filled: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="5.8"/><path d="M5.6 8h4.8"/></svg>',
    mark: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.4 2.6h7.2v10.9L8 10.9l-3.6 2.6z"/></svg>',
    markOn: '<svg viewBox="0 0 16 16" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.4 2.6h7.2v10.9L8 10.9l-3.6 2.6z"/></svg>',
    search: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7.2" cy="7.2" r="4.4"/><path d="M10.5 10.5l3 3"/></svg>'
  };
  /* the match ring, as the job portal draws it */
  function ring(pct, z) {
    var r = z / 2 - 3.5, c = 2 * Math.PI * r, h = z / 2;
    return '<span class="jb-ring" style="--z:' + z + 'px" title="' + pct + ' match"><svg viewBox="0 0 ' + z + ' ' + z + '"><circle class="tr" cx="' + h + '" cy="' + h + '" r="' + r + '"/>' +
      '<circle class="ar" cx="' + h + '" cy="' + h + '" r="' + r + '" stroke-dasharray="' + (c * pct / 100).toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 ' + h + ' ' + h + ')"/></svg><b>' + pct + '</b></span>';
  }
  function lockPill(api, lv) { return '<span class="jb-lv">' + api.I.lock + 'Level ' + lv + '</span>'; }
  /* the climb from Level 1 to a level: one segment a level gained, gold as far as the points go */
  function bar(st, top) {
    var h = '', i, f;
    for (i = 1; i < top; i++) {
      f = Math.max(0, Math.min(1, (st.pts - D.at(i)) / D.PER_LEVEL));
      h += '<i>' + (f > 0 ? '<u style="--f:' + (f * 100).toFixed(1) + '%;--d:' + ((i - 1) * 45) + 'ms"></u>' : '') + '</i>';
    }
    return '<span class="jb-bar">' + h + '</span>';
  }
  /* a scenario as a way through: where the fix is, what it trains, what it pays */
  function scRow(api, i, opt) {
    var sc = D.SCENARIOS[i], o = opt || {};
    return '<' + (o.tag || 'button') + ' class="jb-sc' + (o.cls ? ' ' + o.cls : '') + '"' + (o.tag ? '' : ' type="button" data-go="world"') + '>' + api.logo(sc.co, 40) +
      '<span class="g"><b>Scenario ' + (i + 1) + ', ' + D.CO[sc.co] + '. ' + api.esc(sc.title) + '.</b>' +
      '<span>Trains ' + (o.skill ? D.SKILLS[o.skill].name.toLowerCase() : list(trains(sc))) + '. Up to ' + D.fmt(D.SCENARIO_MAX) + ' skill points.</span></span>' +
      (o.end || '<em>' + api.I.arrow + '</em>') + '</' + (o.tag || 'button') + '>';
  }
  /* a scroller fades where there is more, and only there */
  function fade(el) {
    if (!el) return function () {};
    function set() {
      var more = el.scrollHeight - el.clientHeight - el.scrollTop;
      el.style.setProperty('--ft', el.scrollTop > 2 ? '20px' : '0px');
      el.style.setProperty('--fb', more > 2 ? '40px' : '0px');
    }
    el.addEventListener('scroll', set); set();
    return set;
  }
  /* one click handler a screen. The nearest marked element wins:
     data-a is the screen's own action, data-go opens a screen, data-step a step of the story, data-role a role in Explore. */
  function wire(root, api, more) {
    function act(e) {
      var el = e.target.closest ? e.target.closest('[data-a],[data-go],[data-step],[data-role]') : null, d, o;
      if (!el || !root.contains(el) || el.disabled) return;
      d = el.dataset;
      if (d.a) { if (more) more(d.a, el, e); }
      else if (d.go) { o = {}; if (d.id) o.id = d.id; if (d.stage) o.stage = d.stage; if (d.f) o.f = d.f; api.show(d.go, o); }
      else if (d.step) api.go(d.step);
      else if (d.role) { if (more && more('role', el, e) === true) return; api.show('explore', { id: d.role }); }
    }
    root.addEventListener('click', act);
    root.addEventListener('keydown', function (e) {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute && e.target.getAttribute('role') === 'button') { e.preventDefault(); act(e); }
    });
  }

  /* =====================================================================================================
     1. For you. The job you want on top, what is open now, the next gate, and what Zero is doing.
        Only what matters at this point: one row of roles a section, and a way to see the rest.
     ===================================================================================================== */
  function hero(api, st) {
    var tg = D.target(st.dream), s = D.roleState(tg, st), L = tg.level, h, far = L > 10;
    var marks = D.gates(st.dream).filter(function (g) { return g < L; }).map(function (g) {
      var at = D.rolesAt(st.dream, g), r = at.filter(function (x) { return x.dream; })[0] || at[0], on = lvl(st) >= g;
      return '<button type="button" class="mk ' + (on ? 'open' : 'locked') + '" data-role="' + r.id + '" style="--k:' + (g - 1) + '">' + (on ? '<i>' + api.I.tick + '</i>' : '<i></i>') +
        '<span>' + (far ? '' : D.GATES[g].name + ', ') + 'Level ' + g + '</span></button>';
    }).join('');
    h = '<header>' + api.logo(tg.co, 56) + '<div class="tx"><h1>' + api.esc(tg.title) + '</h1><p>' + D.CO[tg.co] + ' · ' + place(tg) + ' · ' + tg.pay + '</p></div>' +
      (s === 'locked' ? '' : '<span class="jb-now">' + api.I.tick + (s === 'applied' ? 'Applied' : 'Open to you now') + '</span>') + '</header>' +
      '<div class="jb-track" style="--n:' + (L - 1) + '">' + bar(st, L) + marks +
      '<span class="end ' + s + '">' + (s === 'locked' ? api.I.lock : api.I.tick) + '<span>Level ' + L + '</span></span></div>';
    if (s === 'locked') {
      h += '<footer><p><b>' + opensAt(tg) + '</b> ' + youAre(st) + ' ' + cap(about(L, st)) + '.</p>' +
        '<button type="button" class="sp-key dark" data-go="world">' + startLabel(st, 'Continue') + api.I.arrow + '</button></footer>';
    } else if (s === 'open') {
      h += '<footer><p><b>Level ' + L + ' reached.</b> I apply with you, and only on your yes.</p>' +
        '<button type="button" class="sp-key dark" data-step="dreamapply">Apply with Zero' + api.I.arrow + '</button></footer>';
    } else {
      h += '<footer><p><b>Applied, on your yes.</b> Every reply lands on its page.</p>' +
        '<button type="button" class="sp-key dark" data-go="app" data-id="' + tg.id + '">See the application' + api.I.arrow + '</button></footer>';
    }
    return '<div class="jb-hero ' + s + '" role="button" tabindex="0" data-role="' + tg.id + '">' + h + '</div>';
  }

  function card(api, st, r, apps) {
    var s = D.roleState(r, st), a, w = '';
    if (s === 'applied') {
      a = (apps || []).filter(function (x) { return x.id === r.id; })[0];
      w = a && a.late && !a.plain ? '<span class="w">' + (api.I[a.ic] || IC[a.ic]) + a.st + '</span>'
        : '<span class="w ap">' + api.I.tick + sentLine(a) + '</span>';
    } else if (s === 'open') {
      w = '<span class="w">' + r.applicants + ' applicants. ' + posted(r) + '.</span>';
    }
    return '<button type="button" class="jb-card ' + s + '" ' + (s === 'applied' ? 'data-go="app" data-id' : 'data-role') + '="' + r.id + '"><span class="top">' + api.logo(r.co, 40) + (s === 'locked' ? lockPill(api, r.level) : ring(D.match(r, st), 38)) + '</span>' +
      '<b>' + api.esc(r.title) + '</b><span class="m">' + D.CO[r.co] + ' · ' + r.loc + '</span><span class="m">' + r.pay + '</span>' + w + '</button>';
  }

  /* the feed on the right: what Zero is doing, said plainly, for the moment the learner is in */
  function feed(api, st, apps, nOpen) {
    var total = D.roles(st.dream).length, rows = [], sc = D.SCENARIOS[Math.max(0, st.done - 1)], tg = D.target(st.dream);
    function it(mark, text, time, id) {
      var inner = mark + '<span class="t"><b>' + text + '</b>' + (time ? '<span>' + time + '</span>' : '') + '</span>';
      rows.push(id ? '<button type="button" class="it" data-go="app" data-id="' + id + '">' + inner + '</button>' : '<div class="it">' + inner + '</div>');
    }
    var eye = '<span class="ic">' + api.I.eye + '</span>', dot = '<i class="dot"></i>';
    if (!apps.length && !nOpen && !st.done) {
      var g = D.gates(st.dream).filter(function (x) { return x <= tg.level; });
      it(dot, 'Every role here is real and open today.');
      it(dot, 'Roles open at ' + (g.length > 1 ? 'Levels ' : 'Level ') + list(g) + '.');
      it(dot, 'Zero applies with you, and only on your yes.');
    } else if (!apps.length && !nOpen) {
      it('<span class="ic">' + api.I.doc + '</span>', 'Your portfolio is live', 'With your ' + D.CO[sc.co] + ' case');
      it(eye, 'Watching ' + total + ' roles on your path');
    } else if (!apps.length) {
      it('<span class="ic">' + api.I.doc + '</span>', 'Matched your work to ' + nOpen + ' ' + many(nOpen, 'role'), 'Today');
      it('<span class="ic">' + api.I.clock + '</span>', 'Waiting on your yes to apply');
      it(eye, 'Watching ' + (total - nOpen) + ' more roles on your path');
    } else {
      apps.slice().sort(function (a, b) { return a.last - b.last || a.rk - b.rk; }).slice(0, 3).forEach(function (a) {
        it(api.logo(a.role.co, 32), a.said ? a.co + ' ' + a.said : 'Applied to ' + a.co, when(a, a.last), a.id);
      });
      it(eye, 'Watching ' + (total - apps.length) + ' more roles on your path');
    }
    return '<div class="jb-feed">' + rows.join('') +
      (apps.length ? '<button type="button" class="lk" data-go="tracker"><span>All applications</span><em>' + apps.length + '</em>' + api.I.right + '</button>' : '') + '</div>';
  }

  SP.screen({
    id: 'jobs', tone: 'paper', chrome: { rail: 'jobs', pill: true, tabs: 'foryou' },
    mount: function (root, api) {
      var st = api.state, L = lvl(st), apps = appsOf(st), i = 0, h = '';
      var all = D.roles(st.dream).filter(function (r) { return !r.target; });
      var open = all.filter(function (r) { return D.roleState(r, st) === 'open'; }).sort(byMatch(st));
      /* applications that have closed live in the tracker, not under what is open */
      var closed = {}; apps.forEach(function (a) { if (a.ended) closed[a.id] = 1; });
      var mine = all.filter(function (r) { return D.roleState(r, st) === 'applied' && !closed[r.id]; }).sort(byMatch(st));
      /* what you can act on comes first. With nothing left to apply to, what is already out. */
      var now = open.length ? open : mine, gate = D.nextGate(st.dream, L);
      /* the company you want comes first among the roles at a gate: it opens earlier doors on the way */
      var ahead = gate ? all.filter(function (r) { return r.level === gate; }).sort(function (a, b) { return (b.dream ? 1 : 0) - (a.dream ? 1 : 0); }) : [];
      function sec(inner) { return '<section class="jb-in" style="--i:' + (i++) + '">' + inner + '</section>'; }
      function grid(a) { return '<div class="jb-grid">' + a.slice(0, 3).map(function (r) { return card(api, st, r, apps); }).join('') + '</div>'; }
      function more(n, f) { return n > 3 ? '<button type="button" data-go="explore" data-f="' + f + '">See all ' + n + api.I.right + '</button>' : ''; }

      h += sec('<h3 class="jb-h">The job you want</h3>' + hero(api, st));
      if (now.length) {
        h += sec('<h3 class="jb-h">Open to you now' + more(now.length, open.length ? 'open' : 'applied') + '</h3>' + grid(now));
        if (ahead.length) {
          h += sec('<h3 class="jb-h">Opens next<span class="r"><span>Level ' + gate + '. ' + toGo(gate, st) + ', ' + about(gate, st) + '.</span>' + more(ahead.length, 'locked') + '</span></h3>' + grid(ahead));
        }
      } else if (ahead.length) {
        h += sec('<h3 class="jb-h">Open to you now' + more(ahead.length, 'locked') + '</h3><p class="jb-none">Nothing is open yet. Your first ' + many(ahead.length, 'role') + ' ' + (ahead.length === 1 ? 'opens' : 'open') +
          ' at Level ' + gate + ', ' + about(gate, st) + ' away.</p>' + grid(ahead));
      }
      root.classList.add('sc-jb');
      root.innerHTML = '<div class="jb-page"><div class="jb-main jb-scroll">' + h + '</div>' +
        '<aside class="jb-side jb-in" style="--i:1"><h3 class="jb-h">' + (apps.length || now.length || st.done ? 'What Zero is doing' : 'How this works') + '</h3>' + feed(api, st, apps, open.length) + '</aside></div>';
      var set = fade(root.querySelector('.jb-main'));
      api.later(900, set);
      wire(root, api);
    }
  });

  /* =====================================================================================================
     2. Explore. Every role on the path from day one, like a job board: search, the list, one role in full.
        A locked role is fully readable. It only cannot be applied to yet.
     ===================================================================================================== */
  SP.screen({
    id: 'explore', tone: 'paper', chrome: { rail: 'jobs', pill: true, tabs: 'explore' },
    mount: function (root, api, opts) {
      var st = api.state, apps = appsOf(st), ui = { f: 'all', q: '', sel: opts && opts.id, ask: '', saved: {}, tell: {} };
      var all = D.roles(st.dream), g = { open: [], applied: [], locked: [] };
      all.forEach(function (r) { g[D.roleState(r, st)].push(r); });
      g.open.sort(byMatch(st)); g.applied.sort(byMatch(st));
      /* the order is set when the screen opens and holds while you are on it, so applying never makes a row jump */
      var order = g.open.concat(g.applied, g.locked);
      if (!ui.sel || !roleById(st, ui.sel)) ui.sel = order[0].id;

      root.classList.add('sc-jb');
      root.innerHTML = '<div class="jb-page"><div class="jb-top jb-in" style="--i:0"><div class="jb-fil"></div>' +
        '<label class="jb-find">' + IC.search + '<input type="text" placeholder="Search ' + all.length + ' roles" aria-label="Search roles by title or company" autocomplete="off" spellcheck="false">' +
        '<button type="button" data-a="clear" aria-label="Clear the search">' + api.I.close + '</button></label></div>' +
        '<div class="jb-split"><div class="jb-list jb-scroll jb-in" style="--i:1"></div><div class="jb-det jb-in" style="--i:2"><div class="in jb-scroll"></div></div></div></div>';
      var filEl = root.querySelector('.jb-fil'), listEl = root.querySelector('.jb-list'), detEl = root.querySelector('.jb-det .in');
      var findEl = root.querySelector('.jb-find'), qEl = findEl.querySelector('input');
      var setList = fade(listEl), setDet = fade(detEl);

      function shown() {
        var q = ui.q.trim().toLowerCase();
        return order.filter(function (r) {
          if (ui.f !== 'all' && D.roleState(r, st) !== ui.f) return false;
          return !q || (r.title + ' ' + D.CO[r.co]).toLowerCase().indexOf(q) >= 0;
        });
      }
      function drawFil() {
        var c = { all: all.length, open: 0, locked: 0, applied: 0 };
        all.forEach(function (r) { c[D.roleState(r, st)]++; });
        filEl.innerHTML = [['all', 'All'], ['open', 'Open'], ['locked', 'Locked'], ['applied', 'Applied']].map(function (f) {
          return '<button type="button" data-a="filter" data-f="' + f[0] + '" class="' + (ui.f === f[0] ? 'on' : '') + '"' + (c[f[0]] ? '' : ' disabled') + '>' + f[1] + '<i>' + c[f[0]] + '</i></button>';
        }).join('');
      }
      function row(r) {
        var s = D.roleState(r, st), tags = '';
        if (s === 'applied') tags += '<span class="jb-tag">' + api.I.tick + 'Applied</span>';
        if (r.target) tags += '<span class="jb-tag dk">The job you want</span>';
        return '<button type="button" class="jb-row ' + s + (ui.sel === r.id ? ' on' : '') + '" data-role="' + r.id + '">' + api.logo(r.co, 40) +
          '<span class="g"><b>' + api.esc(r.title) + '</b><span class="m">' + D.CO[r.co] + ' · ' + r.loc + ' · ' + r.pay + '</span>' + (tags ? '<span class="tg">' + tags + '</span>' : '') + '</span>' +
          (s === 'locked' ? lockPill(api, r.level) : ring(D.match(r, st), 38)) + '</button>';
      }
      function drawList() {
        var top = listEl.scrollTop, vis = shown();
        listEl.innerHTML = vis.length ? vis.map(row).join('')
          : '<div class="jb-zero"><b>No role matches that.</b><span>Search looks at the title and the company.</span>' +
            '<button type="button" class="sp-ghost sm" data-a="clear">Clear the search</button></div>';
        listEl.scrollTop = top; setList();
        findEl.classList.toggle('has', !!ui.q);
      }
      function reveal() {
        var el = listEl.querySelector('.jb-row.on'); if (!el) return;
        var a = el.offsetTop, b = a + el.offsetHeight;

        else if (b > listEl.scrollTop + listEl.clientHeight - 44) listEl.scrollTop = b - listEl.clientHeight + 44;
        setList();
      }
      /* after the filter or the search changes: keep the chosen role if it is still listed, or take the first that is */
      function settle() {
        var vis = shown(), was = ui.sel;
        if (vis.length && !vis.some(function (r) { return r.id === ui.sel; })) ui.sel = vis[0].id;
        ui.ask = '';
        listEl.scrollTop = 0; drawList();
        if (ui.sel !== was) drawDet();
      }

      function head(r, extra) {
        return '<header class="dh">' + api.logo(r.co, 48) + '<div><h2>' + api.esc(r.title) + '</h2><p>' + D.CO[r.co] + ' · ' + place(r) + ' · ' + r.pay + (extra ? ' · ' + extra : '') + '</p></div></header>';
      }
      /* the job post is the same whether the role is locked or open: what it is, then what it asks for, each line tied to a scenario */
      function postHTML(r) {
        var rows = asks(r, st), ok = rows.filter(function (a) { return a.ok; }).length;
        return '<section><h3 class="jb-h">About the role</h3><ul class="jb-about">' + aboutRole(r).map(function (l) { return '<li>' + l + '</li>'; }).join('') + '</ul></section>' +
          '<section><h3 class="jb-h">What this job asks for<span>' + ok + ' of ' + rows.length + ' proven</span></h3><ul class="jb-asks">' + rows.map(function (a) {
            return '<li class="' + (a.ok ? 'ok' : '') + '"><i>' + (a.ok ? api.I.tick : '') + '</i><b>' + a.text + '</b><span>' + api.esc(a.tie) + '</span></li>';
          }).join('') + '</ul></section>';
      }
      function detOpen(r, s) {
        var m = D.match(r, st), ev = backing(r, st), gap = missing(st), a = apps.filter(function (x) { return x.id === r.id; })[0], acts, n = reply(r);
        var save = '<button type="button" class="sp-ghost sm' + (ui.saved[r.id] ? ' on' : '') + '" data-a="save">' + (ui.saved[r.id] ? IC.markOn + 'Saved' : IC.mark + 'Save') + '</button>';
        if (s === 'applied') {
          acts = '<div class="da"><span class="jb-sent">' + api.I.tick + (a && a.fresh ? 'Applied just now, on your yes.' : a && a.late ? 'Applied ' + day(a.ev[0][1]) + '. ' + a.st + '.' : 'Applied today at 11:04, on your yes.') + '</span>' +
            '<button type="button" class="sp-ghost sm" data-go="app" data-id="' + r.id + '">See the application</button></div>';
        } else if (ui.ask === r.id) {
          acts = '<div class="jb-ask"><b>Apply to ' + D.CO[r.co] + ' with Zero?</b>' +
            '<p>I send your portfolio' + (ev[0] ? ' with the ' + D.CO[ev[0].co] + ' case on top' : '') + '. Nothing goes out until you say yes.</p>' +
            '<div><button type="button" class="sp-key dark sm" data-a="yes">Yes, apply</button><button type="button" class="sp-ghost sm" data-a="no">Not now</button></div></div>';
        } else if (r.target) {
          acts = '<div class="da"><button type="button" class="sp-key dark sm" data-step="dreamapply">Apply with Zero' + api.I.arrow + '</button>' + save + '</div>';
        } else {
          acts = '<div class="da"><button type="button" class="sp-key dark sm" data-a="apply">Apply</button>' + save + '</div>';
        }
        return head(r) + acts +
          '<div class="jb-ins"><div>' + ring(m, 52) + '<p><span>Match</span><b>' + bandOf(m) + '</b></p></div>' +
          '<div><em>' + r.applicants + '</em><p><span>Applicants</span><b>' + posted(r) + '</b></p></div>' +
          '<div><em>' + n + '</em><p><span>Days to a reply</span><b>Typical for ' + D.CO[r.co] + '</b></p></div></div>' +
          postHTML(r) +
          (gap ? '<section><h3 class="jb-h">To raise your match</h3><p class="jb-gap">' + gap.line + ' This closes it.</p>' + scRow(api, gap.i, { skill: gap.k }) + '</section>' : '');
      }
      function detLocked(r) {
        var n = D.scenariosTo(r.level, st.pts), left = nextSc(st);
        return head(r, posted(r)) +
          '<div class="jb-lock"><div class="hd">' + api.lock(36) +
          '<p><b>' + (left ? 'Complete ' + n + ' more ' + many(n, 'scenario') + ' to apply.' : 'Raise your grades to apply.') + '</b>' +
          '<span>That takes you to Level ' + r.level + '. ' + youAre(st) + '</span></p>' +
          '<button type="button" class="sp-key dark sm" data-go="world">' + startLabel(st, 'Start the next one') + api.I.arrow + '</button></div>' + bar(st, r.level) + '</div>' +
          postHTML(r) +
          '<div class="jb-why"><p>I only put you forward for roles your work can back up. That is why a recruiter opens a Zero portfolio.</p>' +
          '<button type="button" class="sp-ghost sm' + (ui.tell[r.id] ? ' on' : '') + '" data-a="tell">' + (ui.tell[r.id] ? api.I.tick + 'You will hear when it opens' : 'Tell me when it opens') + '</button></div>';
      }
      function drawDet(quiet) {
        var r = roleById(st, ui.sel), s = D.roleState(r, st);
        detEl.innerHTML = '<div class="pane' + (quiet ? '' : ' swap') + '">' + (s === 'locked' ? detLocked(r) : detOpen(r, s)) + '</div>';
        if (!quiet) detEl.scrollTop = 0;
        setDet();
      }

      if (opts && opts.f && g[opts.f] && g[opts.f].length && !opts.id) { ui.f = opts.f; ui.sel = shown()[0].id; }
      drawFil(); drawList(); drawDet(true); reveal();
      api.later(900, function () { setList(); setDet(); });
      qEl.addEventListener('input', function () { ui.q = qEl.value; settle(); });
      qEl.addEventListener('keydown', function (e) { if (e.key === 'Escape' && ui.q) { e.stopPropagation(); qEl.value = ui.q = ''; settle(); } });
      wire(root, api, function (a, el) {
        if (a === 'role') {
          if (el.classList.contains('jb-row')) {
            if (ui.sel !== el.dataset.role) { ui.sel = el.dataset.role; ui.ask = ''; drawList(); drawDet(); }

        if (a === 'filter') { ui.f = el.dataset.f; drawFil(); settle(); }

        else if (a === 'apply') { ui.ask = ui.sel; drawDet(true); }
        else if (a === 'no') { ui.ask = ''; drawDet(true); }
        /* the yes: it goes out, and the application gets its own page */
        else if (a === 'yes') {
          if (st.applied.indexOf(ui.sel) < 0) st.applied.push(ui.sel);
          api.drawPill();
          api.show('app', { id: ui.sel, stage: 'sent' });
        }
        /* small switches change in place, so nothing around them redraws */
        else if (a === 'save') {
          ui.saved[ui.sel] = !ui.saved[ui.sel]; el.classList.toggle('on', ui.saved[ui.sel]);
          el.innerHTML = ui.saved[ui.sel] ? IC.markOn + 'Saved' : IC.mark + 'Save';
        }
        else if (a === 'tell') {
          ui.tell[ui.sel] = !ui.tell[ui.sel]; el.classList.toggle('on', ui.tell[ui.sel]);
          el.innerHTML = ui.tell[ui.sel] ? api.I.tick + 'You will hear when it opens' : 'Tell me when it opens';

    }
  });

  /* =====================================================================================================

  SP.screen({

            '<span class="g"><b>' + api.esc(r.title) + '</b><span class="m">' + a.co + ' · Sent ' + (a.fresh ? 'just now' : a.late ? day(a.ev[0][1]) : 'today') + '</span></span>' +
