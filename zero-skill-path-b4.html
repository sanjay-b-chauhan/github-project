  });

  /* =====================================================================================================
     4. One application, from the yes to the reply. The role, where it stands, one card for what is
        happening now and whose move it is, then a quiet history. The followed one is the job you want.
     ===================================================================================================== */
  /* three questions they are likely to ask, each tied to something in the learner's own work */
  function questions() {
    var lead = D.scenario(D.JOURNEY.cases[0]), first = D.scenario(D.RESULT.scenario), R = D.RESULT.bySkill;
    return [
      { q: 'Why this flow, and what did you leave out?', from: lead.title, tie: 'The brief: ' + lower(lead.ask) },
      { q: 'How did you find the real cause?', from: first.title, tie: R[0].why },
      { q: 'What would your fix cost to build?', from: first.title, tie: 'Your review asked for a cost. Bring a number.' }
    ];
  }

  SP.screen({
    id: 'app', tone: 'paper', chrome: { rail: 'jobs', pill: true, tabs: 'foryou' },
    mount: function (root, api, opts) {
      var st = api.state, J = D.JOURNEY, o = opts || {}, role = roleById(st, o.id || J.role) || D.target(st.dream), co = D.CO[role.co];
      var isJ = role.id === J.role, a = appsOf(st).filter(function (x) { return x.id === role.id; })[0], days = reply(role), mm = memo(st);
      var STAGES = ['sent', 'viewed', 'invited', 'scheduled', 'interviewed'];
      var ui = { stage: 'sent', pick: -1, slot: st.interviewSlot >= 0 && st.interviewSlot < J.slots.length ? st.interviewSlot : 0, other: false, practise: false, replied: false };
      if (isJ) ui.stage = STAGES.indexOf(o.stage) >= 0 ? o.stage : /offer|hired/.test(o.stage || '') ? 'interviewed' : 'sent';
      else ui.stage = a && !a.plain && o.stage !== 'sent' ? 'story' : 'sent';
      var panel = J.panel.map(function (p) { return p.name; }), firsts = J.panel.map(function (p) { return p.name.split(' ')[0]; });

      root.classList.add('sc-jb');
      root.innerHTML = '<div class="ap-page jb-scroll">' +
        '<header class="ap-top jb-in" style="--i:0">' + api.logo(role.co, 48) + '<div><b>' + api.esc(role.title) + '</b><span>' + co + ' · ' + role.loc + ' · ' + role.pay + '</span></div>' +
        '<button type="button" class="ap-all" data-go="tracker">All applications' + api.I.right + '</button></header>' +
        '<div class="ap-railbox jb-in" style="--i:1"></div><div class="ap-now jb-in" style="--i:2"></div><div class="ap-hist jb-in" style="--i:3"></div></div>';
      var railEl = root.querySelector('.ap-railbox'), nowEl = root.querySelector('.ap-now'), histEl = root.querySelector('.ap-hist'), setPage = fade(root.querySelector('.ap-page'));

      /* ---- where it stands: Applied, Viewed, Interview, Offer. Ticks are behind you, the dark one is now. ---- */
      function rail() {
        var slot = J.slots[ui.slot], nodes, at = 0, i;
        if (ui.stage === 'story') {
          var find = function (re) { var hit = null; a.ev.forEach(function (e) { if (re.test(e[0])) hit = e; }); return hit; };
          var sent = find(/^Sent/), seen = find(/^Viewed/), talk = find(/^Interview/), last = a.ev[a.ev.length - 1];
          nodes = [{ t: 'Applied', d: day(sent[1]) }, { t: 'Viewed', d: seen ? day(seen[1]) : '' }];
          at = seen ? 1 : 0;
          if (a.ended) { nodes.push({ t: a.ended, d: day(last[1]), end: 1 }); at = 2; }
          else {
            nodes.push({ t: 'Interview', d: talk ? (/booked/.test(talk[0]) && a.sub ? a.sub : day(talk[1])) : '' }, { t: 'Offer', d: '' });
            if (talk) at = 2;
          }
        } else {
          var k = STAGES.indexOf(ui.stage);
          nodes = [
            { t: 'Applied', d: isJ ? short(jday(8)) : a ? date(a, a.ev[0][1]).replace(', 11:04', '') : 'Just now' },
            { t: 'Viewed', d: k >= 1 ? short(jday(6)) : '' },
            { t: 'Interview', d: k === 2 ? 'Pick a time' : k >= 3 ? slot.day.slice(0, 3) + ', ' + short(slot.date) : '' },
            { t: 'Offer', d: '' }
          ];
          at = k <= 0 ? 0 : k === 1 ? 1 : 2;
        }
        for (i = 0; i < nodes.length; i++) nodes[i].s = nodes[i].end ? 'end' : i < at ? 'done' : i === at ? 'now' : 'next';
        var lit = nodes[at].end ? at - 1 : at;   /* green runs to the last thing that went well, never into a no */
        railEl.innerHTML = '<ol class="ap-rail" style="--n:' + (nodes.length - 1) + ';--p:' + (lit / (nodes.length - 1)).toFixed(4) + '">' + nodes.map(function (nd, j) {
          return '<li class="' + nd.s + '" style="--i:' + j + '"><i>' + (nd.s === 'done' ? api.I.tick : nd.s === 'end' ? api.I.close : '') + '</i><b>' + nd.t + '</b><span>' + (nd.d || '&nbsp;') + '</span></li>';
        }).join('') + '</ol>';
      }

      /* ---- the one card: what is happening now, and whose move it is ---- */
      function who(mine, text) { return '<span class="ap-who' + (mine ? ' you' : '') + '">' + text + '</span>'; }
      function sentCard() {
        var cases = isJ ? J.cases.map(D.scenario) : backing(role, st);
        return who(false, 'Waiting on ' + co) + '<h1>Application sent.</h1>' +
          '<p class="lead">Nothing for you to do. ' + co + ' usually replies in about ' + days + ' days, and I will tell you the moment they open it.</p>' +
          (cases.length ? '<h3 class="jb-h">What went out<span>Your portfolio, in this order</span></h3><ol class="ap-cases">' + cases.map(function (sc, i) {
            return '<li><em>' + (i + 1) + '</em>' + api.logo(sc.co, 36) + '<b>' + api.esc(sc.title) + '</b><span class="k">' + D.CO[sc.co] + ' · ' + D.SKILLS[sc.skills[0]].name + '</span></li>';
          }).join('') + '</ol>' : '');
      }
      function viewedCard() {
        return who(false, 'Waiting on ' + co) + '<h1>' + co + ' opened your application.</h1>' +
          '<p class="lead">Nothing for you to do. If they want to talk, the invite lands here and I tell you straight away.</p>';
      }
      function invitedCard() {
        return who(true, 'Your move') + '<h1>' + co + ' wants to talk.</h1>' +
          '<p class="lead">' + J.recruiter.name + ', ' + lower(J.recruiter.title) + ', sent the invite. Pick a time and I confirm it with ' + J.recruiter.name.split(' ')[0] + '.</p>' +
          '<dl class="ap-facts"><dt>Who</dt><dd>' + list(J.panel.map(function (p) { return p.name + ', ' + lower(p.title); })) + '</dd>' +
          '<dt>How long</dt><dd>' + J.length + '</dd><dt>Format</dt><dd>' + J.format + '</dd></dl>' +
          '<div class="ap-slots" role="radiogroup" aria-label="Pick a time">' + J.slots.map(function (s, i) {
            return '<button type="button" class="' + (ui.pick === i ? 'on' : '') + '" role="radio" aria-checked="' + (ui.pick === i) + '" data-a="pick" data-i="' + i + '"><i></i><b>' + s.day + '</b><span>' + s.date + '</span><span class="t">' + s.time + '</span></button>';
          }).join('') + '</div>' +
          '<div class="ap-acts"><button type="button" class="sp-key dark" data-a="confirm"' + (ui.pick < 0 ? ' disabled' : '') + '>Confirm</button>' +
          '<button type="button" class="sp-ghost' + (ui.other ? ' on' : '') + '" data-a="other">' + (ui.other ? api.I.tick + 'I asked for other times.' : 'None of these work') + '</button></div>';
      }
      function scheduledCard() {
        var s = J.slots[ui.slot], lead = D.scenario(J.cases[0]), n = D.SCENARIOS.indexOf(lead) + 1;
        return who(true, 'Your move: prepare') + '<h1>' + s.day + ', ' + s.date + ' at ' + s.time + '.</h1>' +
          '<p class="lead">' + J.length + ' with ' + list(panel) + '. It is held in your calendar.</p>' +
          '<div class="ap-prep"><div><h3 class="jb-h">They asked to see</h3>' +
          '<div class="ap-case">' + api.logo(lead.co, 44) + '<span class="x"><b>' + api.esc(lead.title) + '</b><span>' + D.CO[lead.co] + ' · Scenario ' + n + '</span></span></div>' +
          '<p class="ap-say">' + J.format + '</p>' +
          '<button type="button" class="sp-ghost sm' + (ui.practise ? ' on' : '') + '" data-a="practise">' + (ui.practise ? api.I.tick + 'Practice run set for ' + (EVE[s.day] || 'the day before') : 'Practise with Zero') + '</button></div>' +
          '<div><h3 class="jb-h">They are likely to ask</h3><ol class="ap-qs">' + questions().map(function (x) {
            return '<li><b>' + x.q + '</b><span><em>' + api.esc(x.from) + '.</em> ' + api.esc(x.tie) + '</span></li>';
          }).join('') + '</ol></div></div>';
      }
      function interviewedCard() {
        var s = J.slots[ui.slot];
        return who(ui.replied, ui.replied ? 'Your move' : 'Waiting on ' + co) + '<h1>' + (ui.replied ? 'Interview done. ' + co + ' replied.' : 'Interview done. Waiting on ' + co + '.') + '</h1>' +
          '<p class="lead">' + (ui.replied ? 'Their answer is in. Open it when you are ready.' : 'Their move now. ' + co + ' usually answers within a week of an interview.') + '</p>' +
          '<div class="ap-did"><span class="ic">' + api.I.send + '</span><span class="x"><b>I sent a thank you note to ' + list(firsts) + '.</b><span>On your yes, ' + s.day + ' afternoon.</span></span></div>' +
          '<div class="ap-reply' + (ui.replied ? ' in' : '') + '"><div><div class="row">' + api.logo(role.co, 44) + '<span class="x"><b>They replied.</b><span>' + J.recruiter.name + ', ' + lower(J.recruiter.title) + '. Just now.</span></span>' +
          '<button type="button" class="sp-key dark" data-step="offer">Open it' + api.I.arrow + '</button></div></div></div>';
      }
      function storyCard() {
        var done = a.mine && mm.confirmed && mm.confirmed[a.id], you = a.mine && !done, acts = '';
        if (you) acts = '<button type="button" class="sp-key dark" data-a="thu">Confirm Thursday</button><button type="button" class="sp-ghost' + (ui.other ? ' on' : '') + '" data-a="other">' + (ui.other ? api.I.tick + 'I asked for another time.' : 'Ask for another time') + '</button>';
        else if (a.act) acts = '<button type="button" class="sp-key dark" data-step="' + a.act + '">See what to practise' + api.I.arrow + '</button>';
        return who(you, done ? 'Waiting on ' + co : a.label) + '<h1>' + (done ? 'Confirmed for ' + thursday() + ', 2:00pm.' : a.head) + '</h1>' +
          '<p class="lead">' + (done ? co + ' has your yes. It is held in your calendar.' : a.body) + '</p>' + (acts ? '<div class="ap-acts">' + acts + '</div>' : '');
      }
      function now(quiet) {
        var f = { sent: sentCard, viewed: viewedCard, invited: invitedCard, scheduled: scheduledCard, interviewed: interviewedCard, story: storyCard }[ui.stage];
        nowEl.innerHTML = '<div class="pane' + (quiet ? '' : ' swap') + '">' + f() + '</div>';
      }

      /* ---- the history, newest first ---- */
      function said(ev) {
        return /^Sent/.test(ev) ? 'Application sent, on your yes.' : ev === 'Viewed' ? co + ' opened your application.' : ev === 'Liked you' ? co + ' liked your portfolio.'
          : ev === 'Interview booked' ? co + ' booked an interview.' : ev === 'Not selected' ? co + ' passed.' : /^Role filled/.test(ev) ? co + ' filled the role.' : ev + '.';
      }
      function hist() {
        var rows = [], s = J.slots[ui.slot], k = STAGES.indexOf(ui.stage);
        if (ui.stage === 'story') a.ev.forEach(function (e) { rows.push([day(e[1]), said(e[0])]); });
        else if (!isJ) rows.push([a ? date(a, a.ev[0][1]) : 'Just now', 'Application sent, on your yes.']);
        else {
          rows.push([jday(8), 'Level ' + role.level + ' reached. The role opened to you.']);
          rows.push([jday(8) + ', 10:42am', 'Application sent, on your yes.']);
          if (k >= 1) rows.push([jday(6), co + ' opened your application.']);
          if (k >= 2) rows.push([jday(5), J.recruiter.name + ' invited you to interview.']);
          if (k >= 3) rows.push([jday(5), 'You confirmed ' + s.day + ', ' + s.time + '.']);
          if (k >= 4) rows.push([s.date, 'Interview with ' + list(panel) + '.'], [s.date, 'Thank you note sent, on your yes.']);
        }
        histEl.innerHTML = '<h3>History</h3><ol>' + rows.reverse().map(function (r) { return '<li><span>' + r[0] + '</span><b>' + r[1] + '</b></li>'; }).join('') + '</ol>';
      }
      function draw(quiet) { rail(); now(quiet); hist(); setPage(); }

      draw(true);
      api.later(900, setPage);
      /* the last beat: the reply lands while you are looking at the wait. The card changes in place, nothing else moves. */
      if (ui.stage === 'interviewed') api.later(2600, function () {
        var w = nowEl.querySelector('.ap-who'), r = nowEl.querySelector('.ap-reply'); if (!r) return;
        ui.replied = true;
        w.className = 'ap-who you'; w.textContent = 'Your move';
        nowEl.querySelector('h1').textContent = 'Interview done. ' + co + ' replied.';
        nowEl.querySelector('.lead').textContent = 'Their answer is in. Open it when you are ready.';
        r.classList.add('in'); api.later(700, setPage);
      });
      wire(root, api, function (k, el) {
        if (k === 'pick') {
          ui.pick = +el.dataset.i;
          Array.prototype.forEach.call(nowEl.querySelectorAll('.ap-slots button'), function (b, i) { b.classList.toggle('on', i === ui.pick); b.setAttribute('aria-checked', i === ui.pick); });
          nowEl.querySelector('[data-a="confirm"]').disabled = false;
        }
        /* confirming turns this page into the scheduled one, in place */
        else if (k === 'confirm') {
          if (ui.pick < 0) return; ui.slot = st.interviewSlot = ui.pick;
          /* on the followed application the story moves to its next step, so the review key and the address agree with the page */
          if (role.id === J.role && SP.steps.some(function (x) { return x.id === 'app-prep'; })) { api.go('app-prep'); return; }
          ui.stage = 'scheduled'; draw(); root.querySelector('.ap-page').scrollTop = 0;
        }
        else if (k === 'other') {
          ui.other = !ui.other; el.classList.toggle('on', ui.other);
          el.innerHTML = ui.other ? api.I.tick + (ui.stage === 'story' ? 'I asked for another time.' : 'I asked for other times.') : (ui.stage === 'story' ? 'Ask for another time' : 'None of these work');
        }
        else if (k === 'practise') {
          ui.practise = !ui.practise; el.classList.toggle('on', ui.practise);
          el.innerHTML = ui.practise ? api.I.tick + 'Practice run set for ' + (EVE[J.slots[ui.slot].day] || 'the day before') : 'Practise with Zero';
        }
        else if (k === 'thu') { mm.confirmed = mm.confirmed || {}; mm.confirmed[a.id] = 1; now(); }
      });
    }
  });

  /* =====================================================================================================
     5. A no. The reason, what held up, the one gap, and the scenario that trains exactly that.
     ===================================================================================================== */
  SP.screen({
    id: 'passed', tone: 'paper', chrome: { rail: 'jobs', pill: true, tabs: 'foryou' },
    mount: function (root, api) {
      var st = api.state, SC = D.SCENARIOS, r = roleById(st, 'r-klar'), co = D.CO[r.co], gapK = 'visual', i, fix = -1, replay = false;
      for (i = st.done; i < SC.length; i++) if (SC[i].skills.indexOf(gapK) >= 0) { fix = i; break; }
      if (fix < 0) { replay = true; for (i = SC.length - 1; i >= 0; i--) if (SC[i].skills.indexOf(gapK) >= 0) { fix = i; break; } }
      var a = appsOf(st).filter(function (x) { return x.id === r.id; })[0], others = st.applied.filter(function (id) { return id !== r.id; }).length;
      var res = D.RESULT.bySkill[0], held = [], best = null;

      if (best) held.push({ t: D.SKILLS[best.k].name, s: ofCases(best.c, st.done) });

        '<button type="button" class="sp-ghost sm" data-go="tracker">' + api.I.back + 'Back to applications</button></footer></div></div>';

})();

/* screens/later.js */
/* ZERO skill path · the later moments.

              '<section class="da-tile da-cases"><h3>' + (picks.length === 3 ? 'Your three strongest cases first' : 'Your strongest cases first') + '</h3>' +
                (picks.length ? '<ol>' + caseRows + '</ol>' : '<p class="none">Your first scenario puts the first case here.</p>') +
                (rest.length ? '<div class="da-x"><div class="in"><h3>Then the other ' + (WORD[rest.length] || rest.length) + ', newest first</h3><div class="rest">' +
                  rest.map(function (s) { return api.logo(s.co, 30); }).join('') + '</div><p>Every case carries its review.</p></div></div>' : '') +
              '</section>' +
              '<section class="da-tile da-asks"><h3>What it asks for</h3><ul>' + askRows + '</ul>' +
                (picks.length ? '<div class="da-x"><div class="in"><h3>The note I would send</h3><p>My portfolio opens with ' +
                  (WORD[titles.length] || titles.length) + ' reviewed ' + many(titles.length, 'case') + ': ' + esc(list(titles)) + '. A manager graded each one.</p></div></div>' : '') +
              '</section>' +
            '</div>' +
            (locked ? '' : '<div class="da-top lt-in" style="--i:3" role="switch" aria-checked="true" tabindex="0"><span class="tx"><b>Top choice</b><span>One role a month can carry this. The recruiter sees it.</span></span><span class="da-sw"></span></div>') +
            '<footer class="da-foot lt-in" style="--i:4">' +
              '<p class="da-quiet"><span class="q">Nothing goes out without your yes.</span><span class="s">' + api.I.tick + 'Sent, 10:42. I will tell you the moment they open it.</span></p>' +
              (picks.length ? '<button type="button" class="sp-ghost da-read">Let me read it first</button>' : '') +
              '<button type="button" class="sp-key dark da-apply"><span>' + (locked ? 'See the path' : 'Apply with Zero') + '</span></button>' +
            '</footer>' +
          '</div>' +
        '</div></div>';

      var card = q(root, '.da-card'), scroll = q(root, '.da-scroll'), apply = q(root, '.da-apply'), read = q(root, '.da-read'), top = q(root, '.da-top');
      function sent() {
        card.classList.add('sent');
        q(root, '.da-tag').innerHTML = tag('applied');
        q(root, '.da-say .tail').textContent = 'Here is what I sent.';
        var note = q(root, '.da-asks .da-x h3');
        if (note) note.textContent = 'The note I sent';
        q(apply, 'span').textContent = 'Continue';
        apply.disabled = false;
      }
      if (was === 'applied') sent();

      if (top) {
        var flip = function () {
          if (card.classList.contains('sent') || card.classList.contains('busy')) return;
          var on = top.getAttribute('aria-checked') !== 'true';
          top.setAttribute('aria-checked', on ? 'true' : 'false');
        };
        top.addEventListener('click', flip);
        top.addEventListener('keydown', function (e) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
      }
      if (read) read.addEventListener('click', function () {
        var open = card.classList.toggle('reading');
        read.textContent = open ? 'Show less' : 'Let me read it first';
        if (open) api.later(520, function () { scroll.scrollTo({ top: scroll.scrollHeight, behavior: 'smooth' }); });
      });
      apply.addEventListener('click', function () {
        if (locked) { api.show('path'); return; }
        if (card.classList.contains('sent')) { api.go('app-sent'); return; }
        card.classList.add('busy');
        apply.disabled = true;
        q(apply, 'span').textContent = 'Sending';
        api.later(900, function () {
          if (st.applied.indexOf(role.id) < 0) st.applied.push(role.id);
          card.classList.remove('busy');
          sent();
          api.drawPill();
        });
      });
    }
  });

  /* ================= 4 · offer: the letter, and the answer ================= */
  /* the company's own mark, bare, the way it heads a letter */
  function mark(api, co, z) {
    var D = api.data, c = (D.TINT[co] || '#111113').toLowerCase(), ink = typeof D.INK[co] === 'string' ? D.INK[co] : '';
    if (co === 'microsoft') return api.logo(co, z + 6);
    var col = /^#(111113|1e1e1e|fff|ffb3c7|9fe870)/.test(c) ? (ink || '#141312') : c;
    /* the mask is set here, not in the stylesheet, so its address resolves from the page and not from the css file */
    var u = 'url(' + api.asset('logo/' + co + '.svg') + ') left center/contain no-repeat';
    /* the apple is drawn narrower than its box, so it moves left to stand on the margin with the text */
    var pull = co === 'apple' ? Math.round(z * .1) : 0;
    return '<i class="ol-mark" style="width:' + z + 'px;height:' + z + 'px;margin-left:-' + pull + 'px;background:' + col + ';-webkit-mask:' + u + ';mask:' + u + '"></i>';
  }
  /* a signature in ink: one hand, two words */
  var SIGN = '<svg viewBox="0 0 172 46" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path pathLength="1" d="M5 35C9 24 13 12 17 7c2 8 2 18 4 26 3-10 7-20 12-25 1 9 1 19 4 26 4-4 7-9 11-10-4 0-7 4-6 7 2 3 6-2 8-6-1 4 0 7 3 6 4-1 6-5 8-8-1 8-4 17-9 19-3 0 2-9 8-14 3-3 6-5 9-5-3 0-6 4-5 7 2 3 6-2 8-6-1 4 0 7 4 6"/>' +
    '<path pathLength="1" d="M104 13c-7-3-14 5-12 13 2 7 9 8 15 2 3-6 4-15 6-22-1 9-3 19-3 27 2-6 5-10 8-9 2 2 0 6 3 8 4 0 8-5 6-8-3-1-5 3-3 6 3 3 7 0 9-4 0 3 0 6 1 7 2-5 5-8 8-7 2 2 0 6 3 7 5 0 12-3 22-9"/></svg>';

  SP.screen({
    id: 'offer', tone: 'paper', chrome: { rail: 'jobs', pill: true, tabs: 'foryou' },
    mount: function (root, api) {
      var D = api.data, st = api.state, esc = api.esc, J = D.JOURNEY, role = D.target(st.dream), co = D.CO[role.co], t = terms(D, role);
      var done = D.SCENARIOS.slice(0, st.done), lead = D.scenario(J.cases[0]), rec = J.recruiter;
      var panel = list(J.panel.map(function (p) { return p.name.split(' ')[0]; }));
      /* where the figure sits in the range the posting gave */
      var range = money(role.pay), sal = money(t.salary)[0], pos = range.length > 1 ? (sal - range[0]) / (range[1] - range[0]) : -1;
      var where = pos < 0 ? '' : pos < .25 ? 'in the lower part of' : pos < .45 ? 'below the middle of' : pos <= .55 ? 'in the middle of' : pos < .78 ? 'above the middle of' : 'near the top of';
      var say = where ? 'I checked it against the posting. <b>' + esc(t.salary) + '</b> sits ' + where + ' their range, <span>' + esc(role.pay) + '</span>.'
        : 'I checked it against the posting. It matches the ' + esc(role.pay) + ' they listed.';
      var rows = [['Role', role.title], ['Salary', t.yearly], ['Sign on', t.bonus.replace(/ sign on$/i, '')], ['Equity', t.equity], ['Start date', t.start], ['Reply by', t.reply]];
      var SAID = {
        week: { icon: api.I.clock, html: '<b>Asked.</b> They usually answer within a day.' },
        no: { icon: api.I.tick, html: '<b>Declined, with thanks.</b> Your other applications stay live.' }
      };

      root.innerHTML =
        '<div class="ol-wrap">' +
          '<article class="ol-sheet">' +
            '<header class="ol-head">' + mark(api, role.co, 30) + '<span>' + esc(t.sent) + '</span></header>' +
            '<div class="ol-body">' +
              '<p>Dear ' + esc(D.learner.name) + ',</p>' +
              '<p>We would like you to join ' + esc(co) + ' as a ' + esc(role.title) + ' in ' + esc(role.loc) + '. ' + esc(panel) + ' asked me to tell you why: ' +
                (lead && done.indexOf(lead) >= 0 ? 'you walked them through ' + esc(lead.title) + ', and every decision held up when they pushed on it.' : 'your decisions held up when they pushed on them.') + '</p>' +
              '<p>The terms are below. Take the time you need with them, and write to me with any question before you answer.</p>' +
            '</div>' +
            '<dl class="ol-terms">' + rows.map(function (r) { return '<div><dt>' + r[0] + '</dt><dd>' + esc(r[1]) + '</dd></div>'; }).join('') + '</dl>' +
            '<footer class="ol-sign"><p>Sincerely,</p>' + SIGN + '<b>' + esc(rec.name) + '</b><span>' + esc(rec.title) + ', ' + esc(co) + '</span></footer>' +
          '</article>' +
          '<aside class="ol-side">' +
            '<h1 class="lt-in" style="--i:4">' + esc(co) + ' made you an offer.</h1>' +
            '<div class="ol-turn">' +
              '<div class="ol-ask"><p class="ol-say lt-in" style="--i:5">' + say + '</p>' +
                '<div class="ol-acts lt-in" style="--i:6"><button type="button" class="sp-key dark" data-say="yes">Accept</button>' +
                  '<div><button type="button" class="sp-ghost" data-say="week">Ask for a week</button><button type="button" class="sp-ghost" data-say="no">Decline</button></div></div></div>' +
              '<div class="ol-said"></div>' +
            '</div>' +
          '</aside>' +
        '</div>';

      var side = q(root, '.ol-side'), said = q(root, '.ol-said');
      qa(root, '[data-say]').forEach(function (b) {
        b.addEventListener('click', function () {
          var k = b.dataset.say, a = SAID[k];
          if (k === 'yes') { api.go('hired'); return; }
          if (side.dataset.said) return;
          side.dataset.said = k;
          said.innerHTML = '<p><span class="mk">' + a.icon + '</span><span>' + a.html + '</span></p><button type="button" class="sp-ghost">See applications</button>';
          q(said, 'button').addEventListener('click', function () { api.show('tracker'); });
        });
      });
    }
  });

  /* ================= 5 · hired: the end of the path ================= */
  SP.screen({
    id: 'hired', tone: 'world', chrome: {},
    mount: function (root, api) {
      var D = api.data, st = api.state, esc = api.esc, role = D.target(st.dream), co = D.CO[role.co], t = terms(D, role);
      api.map.draw({ chips: 'none', dest: 'open', done: D.need(st.dream) });
      api.map.fit(api.map.points(st.dream), ZONE, 1400);
      api.map.shade(0, 0, .6);

      /* the application that got the job counts too, whether or not this moment has it in the list */
      var apps = st.applied.length + (st.applied.indexOf(role.id) < 0 ? 1 : 0), talks = Math.max(1, Math.round(apps / 3));
      var nums = [[st.done, many(st.done, 'scenario')], [st.pts, 'skill points'], [apps, many(apps, 'application')], [talks, many(talks, 'interview')]];

      root.innerHTML =
        '<div class="hi-light"></div>' +
        '<div class="hi-panel sp-glass">' +
          '<div class="lt-in" style="--i:0">' + api.logo(role.co, 60) + '</div>' +
          '<h1 class="sp-h1 lt-in" style="--i:1">You got the job.</h1>' +
          '<p class="hi-role lt-in" style="--i:2">' + esc(role.title) + ' at ' + esc(co) + '. <b>You start ' + esc(t.start) + '.</b></p>' +
          '<div class="hi-path lt-in" style="--i:3">' + nums.map(function (n) { return '<div><b class="sp-num" data-n="' + n[0] + '">' + D.fmt(n[0]) + '</b><span>' + n[1] + '</span></div>'; }).join('') + '</div>' +
          '<p class="hi-now lt-in" style="--i:4">I have told ' + esc(co) + ', and closed your other applications with a thank you.</p>' +
          '<button type="button" class="sp-key hi-go lt-in" style="--i:5">See your portfolio</button>' +
        '</div>';

      centre(api, q(root, '.hi-panel'), 6);
      qa(root, '.hi-path b').forEach(function (b, i) { countUp(api, b, +b.dataset.n, 1000, 800 + i * 90); });
      q(root, '.hi-go').addEventListener('click', function () { api.show('proof'); });
    }
  });
})();

/* steps.js */
/* The story, in the order the review key steps through it. A step is a screen at a moment.
   Levels: you start at Level 1. One scenario later it is Level 2 (portfolio live, no roles yet).
   Two scenarios in it is Level 3 and the first roles open. Level 10 opens the job you picked. */
SP.step({ id: 'dream-co',   screen: 'dream',  moment: 'day0', opts: { step: 'co' },   name: 'Where do you want to work',  group: 'The job you want' });
SP.step({ id: 'dream-role', screen: 'dream',  moment: 'day0', opts: { step: 'role' }, name: 'Which job there',            group: 'The job you want' });
SP.step({ id: 'plan',       screen: 'plan',   moment: 'day0', name: 'How you get there',                    group: 'The job you want' });

SP.step({ id: 'world-0',    screen: 'world',    moment: 'day0',   name: 'World, day one: Level 1',          group: 'Learn' });
SP.step({ id: 'earn',       screen: 'earn',     moment: 'day0',   name: 'Inside a scenario: points land',   group: 'Learn' });
SP.step({ id: 'review',     screen: 'review',   moment: 'day0',   name: 'Scenario review: what it paid',    group: 'Learn' });
SP.step({ id: 'levelup',    screen: 'levelup',  moment: 'won1',   name: 'Level 2: no roles yet, one level to go', group: 'Learn' });
SP.step({ id: 'whenback',   screen: 'whenback', moment: 'after1', name: 'When is the next one',             group: 'Learn' });
SP.step({ id: 'world-1',    screen: 'world',    moment: 'after1', name: 'World, after scenario 1',          group: 'Learn' });
SP.step({ id: 'path',       screen: 'world',    moment: 'after1', opts: { panel: true }, name: 'Your path: the quick view', group: 'Learn' });
SP.step({ id: 'levelup-3',  screen: 'levelup',  moment: 'won2',   name: 'Level 3: the first roles open',    group: 'Learn' });
SP.step({ id: 'applyask',   screen: 'applyask', moment: 'won2',   name: 'Zero asks before it applies',      group: 'Learn' });
SP.step({ id: 'world-2',    screen: 'world',    moment: 'after2', name: 'World, at Level 3',                group: 'Learn' });

SP.step({ id: 'jobs-0',      screen: 'jobs',    moment: 'day0',   name: 'Jobs on day one: all there, all locked', group: 'Jobs' });
SP.step({ id: 'jobs-1',      screen: 'jobs',    moment: 'after2', name: 'Jobs at Level 3',                  group: 'Jobs' });
SP.step({ id: 'explore',     screen: 'explore', moment: 'after2', name: 'Explore: every job, open and locked', group: 'Jobs' });
SP.step({ id: 'role-locked', screen: 'explore', moment: 'after2', opts: { id: 'r-klar' }, name: 'A locked job, and the way in', group: 'Jobs' });
SP.step({ id: 'role-open',   screen: 'explore', moment: 'won2',   opts: { id: 'r-duo' },  name: 'An open job, before applying', group: 'Jobs' });
SP.step({ id: 'tracker',     screen: 'tracker', moment: 'mid',    name: 'Applications: what happened after', group: 'Jobs' });
SP.step({ id: 'passed',      screen: 'passed',  moment: 'mid',    name: 'A no, and what to practise',       group: 'Jobs' });
SP.step({ id: 'proof',       screen: 'proof',   moment: 'mid',    name: 'Portfolio: what a recruiter sees', group: 'Jobs' });
SP.step({ id: 'path-jobs',   screen: 'jobs',    moment: 'mid',    opts: { panel: 900 }, name: 'Your path, opened from Jobs at Level 7', group: 'Jobs' });

SP.step({ id: 'recap',      screen: 'recap',      moment: 'mid',    name: 'Welcome back: what moved',       group: 'Further on' });
SP.step({ id: 'world-6',    screen: 'world',      moment: 'mid',    name: 'World, at Level 7',              group: 'Further on' });
SP.step({ id: 'summit',     screen: 'summit',     moment: 'summit', name: 'Level 10: the job opens',        group: 'Further on' });

SP.step({ id: 'dreamapply', screen: 'dreamapply', moment: 'summit', name: 'Apply to the job you wanted',    group: 'Getting the job' });
SP.step({ id: 'app-sent',   screen: 'app',        moment: 'summit', opts: { id: 'd-mid', stage: 'sent' },        name: 'Application sent',           group: 'Getting the job', later: 'Two days later' });
SP.step({ id: 'app-invite', screen: 'app',        moment: 'summit', opts: { id: 'd-mid', stage: 'invited' },     name: 'Interview invite: pick a time', group: 'Getting the job' });
SP.step({ id: 'app-prep',   screen: 'app',        moment: 'summit', opts: { id: 'd-mid', stage: 'scheduled' },   name: 'Interview booked: prepare',   group: 'Getting the job', later: 'After the interview' });
SP.step({ id: 'app-done',   screen: 'app',        moment: 'summit', opts: { id: 'd-mid', stage: 'interviewed' }, name: 'Interview done: waiting',     group: 'Getting the job' });
SP.step({ id: 'offer',      screen: 'offer',      moment: 'summit', name: 'The offer letter',                group: 'Getting the job' });
SP.step({ id: 'hired',      screen: 'hired',      moment: 'summit', name: 'You got the job',                 group: 'Getting the job' });
SP.step({ id: 'dreamapply-watch', screen: 'dreamapply', moment: 'summit', opts: { watch: true }, name: 'Edge case: no opening there today', group: 'Getting the job' });

</script>
</body>
</html>
