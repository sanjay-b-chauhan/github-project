<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Zero · levels · b2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,100..1000&display=swap">
<link rel="stylesheet" href="zero-level-system-assets-b2/journey.css">
</head>
<body>
<div class="app">

  <header class="bar">
    <img class="wm" src="zero-level-system-assets-b2/zero-wordmark.svg" alt="zero">
    <span class="tag">b2</span>
    <div class="cases" id="cases"></div>
    <div class="ctl">
      <button class="ib" id="play" aria-label="Play or pause"></button>
      <button class="ib" id="again" aria-label="Start over"></button>
      <button class="tb" id="speed" aria-label="Speed">1x</button>
      <button class="tb" id="tune" aria-expanded="false">Change pay</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <svg class="wires" id="wires" aria-hidden="true"></svg>

    <section class="col scen">
      <div class="colh"><b>Scenarios</b>
        <div class="cnt"><button id="less" aria-label="One scenario fewer">&minus;</button><span id="scCount"></span><button id="more" aria-label="One scenario more">+</button></div>
      </div>
      <div class="legend" id="legend"></div>
      <div class="rows" id="rows"></div>
    </section>

    <section class="col lvl">
      <div class="who">
        <img src="zero-level-system-assets-b2/maya.jpg" alt="Maya Reyes">
        <div><b id="lvNow"></b><span id="ptNow"></span></div>
      </div>
      <div class="say" id="say"></div>
      <div class="lad" id="lad">
        <div class="steps" id="steps"></div>
        <div class="cells" id="cells"></div>
      </div>
      <div class="cap">1 level = 1,000 skill points</div>
      <div class="skills" id="skills"></div>
    </section>

    <section class="col jobs">
      <div class="colh"><b>Job portal</b><span class="open" id="jobCount"></span></div>
      <div id="groups"></div>
    </section>
  </main>

  <div class="tune" id="tunePanel" hidden>
    <div class="th"><b>What a scenario pays</b><button class="tb" id="reset">Reset</button></div>
    <div id="payRows"></div>
    <div class="th"><b>Where jobs open</b></div>
    <div id="gateRows"></div>
    <div class="sw"><span>Weaker work stops at a gate</span><button class="tog" id="hold" role="switch" aria-label="Weaker work stops at a gate"></button></div>
  </div>
</div>
<script src="zero-level-system-assets-b2/engine.js"></script>
<script src="zero-level-system-assets-b2/journey.js"></script>
</body>
</html>
