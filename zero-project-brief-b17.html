<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zero project brief</title>
<meta name="description" content="The project brief: the scenario card stays where it is and the brief opens beside it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,300..800&family=Inter:opsz,wght@14..32,400;14..32,500&display=swap">
<style>
/* b17 (23 Oct), Sanjay on b16: one full card, in the centre, the scenario card and the brief joined into it; more
   space; Earn up to, Time and Difficulty gone; and controls for the spacing and the type. So Start lifts the card to
   the middle and it grows into one surface: the card's identity (art, title, company, project type, manager, Start)
   becomes the right column, the brief the left. The surface grows from the card's own box (a window wide layer
   clipped to it, 460ms) while the content is revealed by the same edge. Ctrl+D (or Controls) opens a panel of
   sliders: card size, column, inner space, section space, radius, every type size, line height, tracking, font. It
   remembers them on this machine and copies the values to send back.
/* b16 (23 Oct), Sanjay on b15: "we already have this screen" (the scenario card on the map). Click it and it stays
   where it is; the brief opens on its left: overview, stages, what you'll cover, what you get, divided by hairlines.
   Type, size and spacing from the job portal and the portfolio (zero-portfolio max26-v95, measured headless): Inter
   with cv11 and ss01 at -0.006em, 12px body in #4E525C, 14/500 item lines, 16/500 section heads, 24 for figures,
   #E7E7EB hairlines. Every item one line, never a title over a body. Nothing that does not help: no meta sentences.
   Two surfaces on the switch: light (the portfolio's) and glass (the card's own material).
/* b15 (23 Oct), Sanjay on b14: keep the art, the title and the company row; the top a black part, the bottom another
   surface; the selected tab keeps its outline pill AND its words go a touch heavier; "Overview", not "The brief"; no
   How it works; the stages one line each, joined from 1 to 7; What you'll cover and What you get more engaging; a max
   width, more air, tighter tracking; three versions: A tabs on top, B tabs on the right, C my own (a poster: the
   identity and Start stay on the left in black, the right reads as one page with a nav that follows you).
/* b14 (23 Oct), Sanjay on b13: outlines only on the company, the project type and the manager, nowhere else (no
   outlined numbers, no outlined lists, no "bill" table). The brief is a paragraph, the numbers, then more to read, so
   it scrolls. The card keeps one height; what does not fit scrolls inside it (the tabs stay put). A big Start. The
   light version is a bluish off-white, not beige. More content from the data we have: the tutorial's case (Navid's
   own words, the five steps from kickoff to presentation, why it matters, the deliverables, skill and tool lines).
/* b13 (22 Oct), Sanjay on b12: the same inner space on every side; no surface colour anywhere, outlines only; no
   underline, the selected tab gets an outline; no body text in the brief; charcoal, not pure black; fewer and smaller
   type sizes. So the card wraps its content with 48px all round and grows or shrinks with the tab (top and height
   move together, 380ms); type is four sizes, 24 title, 20 numbers, 14 reading, 12 labels; the brief is the three
   numbers plus the role, the goal and the ask, one line each (the backend's overview fields).
/* b12 (22 Oct). Sanjay's board of what he likes: b4 exactly (its type, its air, the art on top with the title under it,
   "loved that effect"); the company, project type and manager as small text in OUTLINE boxes (no fill); What you'll
   cover as the three columns, workflows, skills, tool stack; What you get as one line and an icon each, with the Rank 1
   logos; the stages with a one line each and their time ("those parts are why it feels like this"). No bold, no
   underline except under the selected tab. Start stays top right. No zoom: b4's sizes at every screen (b10's 1.25 zoom
   on his 2560 screen is what read as "super zoomed in"). Think Apple or Airbnb: clean, spaced out.
/* b10 (22 Oct), Sanjay on b9: the brief is a tab too, and the tabs are only words with an underline under the open one,
   no pill. The brief keeps its design (the two paragraphs and the three numbers) inside its tab.
/* b9 (22 Oct). Sanjay: b4 was the one (clean, the hierarchy right, super clean), so b9 is b4 again with tabs to make
   it clear. The right side goes completely: there is no time, no difficulty, no points and no streak in the product.
   Under the title: the company, the project type, the manager, then the brief. Then three tabs, Stages, What you'll
   cover, What you get: click, click, click. What you'll cover is skills, condensed, two or three things (the founders'
   call, 22 Oct). And one backend project: the page is drawn from ONE record in the shape the backend already sends,
   project_brief (title, description, overview, skills, tools, deliverables, team) plus the scenario's stages
   (stage_title, sequence_order), so it can be wired to the real row field for field. The map keeps b6's quiet locks.
/* The project brief, b4. Desktop only (Zero is a desktop app).
   b3 was the app's own Scenario Overview (zero-core-ui dev, ScenarioOverviewV1). Sanjay on b3 (22 Oct): no mono fonts;
   bigger, with the whole type and spacing redone and more air; "This scenario takes you to Rank 1" and "What you'll
   unlock" go; "Earn up to" and the streak stay; a solid black or off-white surface instead of the see-through glass;
   a faster, smoother open and close.
   So: one family (Google Sans Flex) on one scale, 36 title, 20 section heads, 16 body, 14 meta; space instead of rules
   between sections; the card grows to about 80% of the window (up to 1480 by 977); two surfaces on a switch, black and
   off-white (the job portal's light inks). The open is a solid shell growing from the scenario card while the content is
   revealed by its edge, 420ms on a quick-out curve; no blur on a moving layer, no fades on the content. */
:root{--sans:'Google Sans Flex','Google Sans',-apple-system,system-ui,sans-serif;--ease:cubic-bezier(.32,.72,0,1);--green:#4ade80}
body{--hd:#0B0B0C;--pill:rgba(255,255,255,.1);--sf:#19191B;--rail:#161617;--ink:#F3F3F1;--ink2:rgba(243,243,241,.7);--ink3:rgba(243,243,241,.5);--tile:rgba(255,255,255,.045);
  --line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.15);--dim:.2}
body.t-white{--hd:#E7EDF5;--pill:#FFFFFF;--sf:#F5F8FC;--rail:#E9EEF5;--ink:#101828;--ink2:#475467;--ink3:#7A8699;--tile:#FFFFFF;--line:rgba(16,24,40,.08);--line2:rgba(16,24,40,.14);--dim:.16}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#101112;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;margin:0;padding:0;cursor:pointer;-webkit-appearance:none;appearance:none}

/* ---------------- the world (cover) and the app's canvas (contain) ---------------- */
#world{position:fixed;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#app{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;font-family:var(--sans);color:#fff;pointer-events:none}
#app>*{pointer-events:auto}
.map{position:absolute;inset:0;overflow:hidden;background:#131514}
.cam{position:absolute;inset:0;transform-origin:56% 64%;transition:transform 1s var(--ease)}
.city{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;user-select:none}
body.picked .cam{transform:translate(-140px,-60px) scale(1.2)}
.mk{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;display:grid;place-items:center;
  background:rgba(18,20,26,.84);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.34),0 3px 10px rgba(0,0,0,.35);color:rgba(255,255,255,.78)}
.mk svg{width:15px;height:15px}
.mk.go{background:radial-gradient(circle,#1c1a18 0 4px,#fff 4.8px);box-shadow:0 0 0 3px rgba(255,255,255,.3),0 3px 10px rgba(0,0,0,.35)}
.mk.go::after{content:'';position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.85);animation:ring 2.2s cubic-bezier(0,0,.2,1) infinite}
@keyframes ring{0%{transform:scale(.9);opacity:0}18%{opacity:.85}100%{transform:scale(3.1);opacity:0}}
.chip{position:absolute;display:flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 11px;border-radius:999px;white-space:nowrap;font:600 15px/1 var(--sans);
  background:rgba(18,20,26,.78);color:rgba(255,255,255,.92);box-shadow:0 6px 20px rgba(0,0,0,.3),inset 0 0 0 1px rgba(255,255,255,.12)}
.chip img{width:17px;height:17px;display:block;filter:brightness(0) invert(1);opacity:.85}
.chip em{font:500 14px/1 var(--sans);font-style:normal;color:rgba(255,255,255,.6);margin-left:2px}
.chip.go{background:rgba(255,255,255,.96);color:#1c1a18;box-shadow:0 8px 22px rgba(0,0,0,.28);cursor:pointer}
.chip.go img{filter:none;opacity:1}
.chip.go em{display:inline-flex;align-items:center;gap:6px;color:#1f7a36;font-weight:600}
.chip.go em::before{content:'';width:7px;height:7px;border-radius:50%;background:#49BA61}
.chip.t{transform:translate(-50%,-100%)}.chip.b{transform:translate(-50%,0)}
.mk.lk{cursor:pointer;transition:transform .2s var(--ease),background-color .2s}
.mk.lk:hover,.mk.lk.open{z-index:6;background:rgba(18,20,26,.96);transform:scale(1.12)}
.tip{position:absolute;left:50%;bottom:calc(100% + 10px);display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:10px 14px 10px 12px;border-radius:14px;
  white-space:nowrap;text-align:left;background:rgba(18,20,26,.92);box-shadow:0 10px 24px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.12);
  transform-origin:50% 100%;transform:translate(-50%,0) scale(.6);visibility:hidden;transition:transform .18s var(--ease),visibility 0s linear .18s;pointer-events:none}
.mk.lk:hover .tip,.mk.lk.open .tip{transform:translate(-50%,0) scale(.893);visibility:visible;transition:transform .22s var(--ease),visibility 0s}
.tip b{display:flex;align-items:center;gap:8px;font:600 15px/1 var(--sans);color:#fff}
.tip b img{width:16px;height:16px;filter:brightness(0) invert(1)}
.tip em{display:none;align-items:center;gap:6px;font:500 13px/1 var(--sans);font-style:normal;color:rgba(255,255,255,.62)}
.tip em svg{width:12px;height:12px}
.mk.lk.open .tip em{display:flex}
.hit{position:absolute;left:52.3%;top:55.5%;width:7.6%;height:13.8%;border-radius:30px;cursor:pointer;transition:background .2s,box-shadow .2s}
.hit:hover{background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7)}
body.picked .hit,body.picked .chip.go{pointer-events:none}
.hint{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);display:flex;align-items:center;height:48px;padding:0 20px;border-radius:999px;
  background:rgba(18,20,26,.78);font:500 17px/1 var(--sans);color:rgba(255,255,255,.85);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);transition:transform .4s var(--ease),opacity .3s}
body.picked .hint{transform:translate(-50%,40px);opacity:0}

/* ---------------- the scenario card on the right (the app's ScenarioIntroV1, set in the one sans) ---------------- */
.card{position:absolute;right:40px;top:50%;width:470px;padding:20px;transform:translate(560px,-50%);visibility:hidden;
  transition:transform .6s var(--ease),visibility 0s linear .6s}
body.picked .card{transform:translate(0,-50%);visibility:visible;transition:transform .6s var(--ease) .1s,visibility 0s}
.c-body{position:relative;overflow:hidden;border-radius:42px;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(16px) saturate(1.1);backdrop-filter:blur(16px) saturate(1.1);box-shadow:0 44px 90px -24px rgba(0,0,0,.5)}
.c-in{display:flex;flex-direction:column;align-items:center;gap:34px;padding:20px}
.c-nav{display:flex;align-items:center;justify-content:space-between;width:100%}
.c-chev{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;color:rgba(255,255,255,.7)}
.c-chev svg{width:24px;height:24px}.c-chev.off{opacity:.2}
.c-count{display:flex;height:46px;align-items:center;gap:8px;border-radius:999px;background:rgba(255,255,255,.1);padding:0 20px;font:500 16px/1 var(--sans);font-variant-numeric:tabular-nums}
.c-count i{font-style:normal;color:rgba(255,255,255,.4)}.c-count em{font-style:normal;color:rgba(255,255,255,.6)}
.c-art{width:336px;height:210px;object-fit:contain;display:block}
.c-desc{margin:0;max-width:360px;padding:0 10px;font:500 24px/1.35 var(--sans);text-align:center}
.c-meta{display:flex;flex-direction:column;align-items:center;gap:26px;width:100%}
.c-rule{width:100%;height:1px;background:rgba(255,255,255,.12)}
.c-rows{display:flex;flex-direction:column;gap:20px;width:100%}
.c-row{display:flex;height:30px;align-items:center;justify-content:space-between;padding:0 20px}
.c-row>span:first-child{font:500 16px/1 var(--sans);color:rgba(255,255,255,.55)}
.c-row>b,.c-diff b{font:500 18px/1 var(--sans)}
.c-xp{display:inline-flex;align-items:center;gap:6px;border-radius:40px;padding:6px 10px;background:rgba(255,224,107,.12);box-shadow:0 0 0 1px rgba(255,225,127,.4)}
.c-xp img{width:18px;height:18px;display:block}.c-xp b{font:600 18px/1.2 var(--sans);font-variant-numeric:tabular-nums;color:#fff9d5}
.c-diff{display:flex;align-items:center;gap:20px}
.c-bars{display:inline-flex;gap:2px}.c-bars i{display:block;width:23px;height:10px;border-radius:30px;background:#fff}.c-bars i.dim{opacity:.1}
/* the app's StartButtonV1 */
.start{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:62px;padding:15px 40px;border-radius:100px;
  background-image:linear-gradient(90deg,rgba(255,255,255,.4),rgba(255,255,255,.4)),linear-gradient(180deg,rgba(229,229,229,.8),rgb(226,226,226));
  box-shadow:0 6px 0 #c8c8c8,0 12px 18px -6px rgba(0,0,0,.4),0 0 0 1.33px #e6e6e6,inset 0 1.33px 0 rgba(255,255,255,.75);transition:transform .1s cubic-bezier(.34,1.56,.64,1),box-shadow .1s}
.start:hover{transform:translateY(-1px)}
.start:active,.start.down{transform:translateY(5px);box-shadow:0 1px 0 #c8c8c8,0 3px 8px -4px rgba(0,0,0,.4),0 0 0 1.33px #e6e6e6,inset 0 1.33px 0 rgba(255,255,255,.75)}
.start svg{width:7.8px;height:9.9px;margin-right:3.5px;position:relative;z-index:2}
.start b{position:relative;z-index:2;font:600 23px/1.2 var(--sans);letter-spacing:-.48px;
  background:linear-gradient(100deg,#121212 0%,#121212 34%,#ff5ec0 42%,#8b7bff 50%,#37dcc4 58%,#121212 66%,#121212 100%);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:holo 3s ease-in-out infinite}
@keyframes holo{0%{background-position:130% 0}55%,100%{background-position:-30% 0}}

/* ---------------- the full card: one surface in the centre, grown from the scenario card ---------------- */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);opacity:0;visibility:hidden;transition:opacity .32s var(--ease),visibility 0s linear .32s}
body.open .scrim{opacity:1;visibility:visible;transition:opacity .32s var(--ease),visibility 0s}
body{--k-surface:#F7F9FC;--k-ink:#131417;--k-ink2:#4E525C;--k-ink3:#6A6F7A;--k-line:#E7E7EB;--k-line2:#D4D5DA}
body.t-glass{--k-surface:rgba(16,16,18,.72);--k-ink:rgba(255,255,255,.94);--k-ink2:rgba(255,255,255,.66);--k-ink3:rgba(255,255,255,.48);--k-line:rgba(255,255,255,.1);--k-line2:rgba(255,255,255,.16)}
/* the surface covers the window and is clipped to a box, so growing it is a clip, not a resize */
.surface{position:fixed;inset:0;z-index:21;visibility:hidden;background:var(--k-surface)}
body.t-glass .surface{-webkit-backdrop-filter:blur(18px) saturate(1.1);backdrop-filter:blur(18px) saturate(1.1)}
.ov{--pad:48px;--gap:32px;--colw:340px;--radius:32px;--fs:13px;--lh:1.6;--fs-item:14px;--fs-h:16px;--fs-fig:26px;--fs-title:22px;--ls:-.006em;
  --font:'Inter',-apple-system,system-ui,sans-serif;--ink:var(--k-ink);--ink2:var(--k-ink2);--ink3:var(--k-ink3);--line:var(--k-line);--line2:var(--k-line2);
  position:fixed;z-index:22;visibility:hidden;display:flex;overflow:hidden;border-radius:var(--radius);
  font-family:var(--font);font-size:var(--fs);line-height:var(--lh);letter-spacing:var(--ls);color:var(--ink2);font-feature-settings:'cv11','ss01';-webkit-font-smoothing:antialiased}
body.open .surface,body.open .ov{visibility:visible}
.ov button{font:inherit;letter-spacing:inherit;color:inherit}
.ov-x{position:fixed;z-index:23;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);transform:scale(.6);opacity:0;visibility:hidden;transition:transform .2s var(--ease),opacity .2s,background-color .15s,visibility 0s linear .2s}
.ov-x:hover{background:rgba(255,255,255,.3)}
.ov-x svg{width:20px;height:20px}
body.shown .ov-x{transform:none;opacity:1;visibility:visible;transition:transform .3s var(--ease),opacity .2s,background-color .15s,visibility 0s}
/* left: the brief */
.lft{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.tabs{position:relative;flex:none;display:flex;gap:2px;padding:calc(var(--pad) - 10px) var(--pad) 10px calc(var(--pad) - 12px)}
.tab{position:relative;z-index:1;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;height:34px;padding:0 12px;border-radius:99px;
  font-size:var(--fs-item);line-height:1;color:var(--ink3);transition:color .2s}
.tab::after{content:attr(data-l);height:0;overflow:hidden;visibility:hidden;font-weight:500}
.tab:hover{color:var(--ink2)}
.tab.on{color:var(--ink);font-weight:500}
.tab-pill{position:absolute;left:0;top:0;border-radius:99px;box-shadow:inset 0 0 0 1px var(--line2);transition:transform .38s var(--ease),width .38s var(--ease)}
.read{position:relative;flex:1 1 auto;min-height:0;overflow-y:auto;padding:0 var(--pad) var(--pad);scrollbar-width:thin;scrollbar-color:var(--line2) transparent;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 16px,#000 calc(100% - 32px),transparent);mask-image:linear-gradient(to bottom,transparent,#000 16px,#000 calc(100% - 32px),transparent)}
.sec{padding:var(--gap) 0}
.sec+.sec{border-top:1px solid var(--line)}
.sh{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 calc(var(--gap) * .55)}
.sh h3{margin:0;font-weight:500;font-size:var(--fs-h);line-height:1.4;letter-spacing:-.012em;color:var(--ink)}
.sh span{color:var(--ink3);font-variant-numeric:tabular-nums}
.sub{display:block;margin:calc(var(--gap) * .8) 0 8px;color:var(--ink3)}
.sub:first-of-type{margin-top:0}
.p{margin:0;color:var(--ink2)}
.p+.p{margin-top:.8em}
.p em{font-style:normal;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:calc(var(--gap) * .8)}
.stat b{display:block;font-weight:400;font-size:var(--fs-fig);line-height:1.15;letter-spacing:-.025em;color:var(--ink);font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:4px;color:var(--ink3)}
.quote{display:flex;align-items:flex-start;gap:12px;margin:calc(var(--gap) * .8) 0 0}
.quote img{flex:none;width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:top}
.quote blockquote{margin:0;font-size:var(--fs-item);line-height:1.45;color:var(--ink)}
.quote figcaption{margin-top:4px;color:var(--ink3)}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:'';position:absolute;left:10.5px;top:20px;bottom:20px;width:1px;background:var(--line2)}
.tl li{position:relative;display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:14px;align-items:center;min-height:40px}
.node{position:relative;z-index:1;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--k-surface);box-shadow:inset 0 0 0 1px var(--line2);
  font-size:11px;line-height:1;letter-spacing:0;color:var(--ink3);font-variant-numeric:tabular-nums}
body.t-glass .node{background:#232325}
.tl li:first-child .node{background:var(--ink);color:#fff;box-shadow:none}
body.t-glass .tl li:first-child .node{color:#111}
.tl .tx{font-size:var(--fs-item);line-height:1.4;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .tm{color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.lines{list-style:none;margin:0;padding:0}
.lines li{display:flex;align-items:center;gap:12px;min-height:38px;font-size:var(--fs-item);line-height:1.4;color:var(--ink)}
.lines li>svg{flex:none;width:16px;height:16px;color:var(--ink3)}
.lines li>.lg{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:#fff;box-shadow:0 0 0 1px var(--line)}
.lines li>.lg img{width:15px;height:15px;display:block}
.lines li>.rk{flex:none;width:24px;height:24px;object-fit:contain}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px}
.lgs{display:flex;align-items:center;margin-left:auto}
.lgs i{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--k-surface),0 0 0 3px var(--line)}
.lgs i+i{margin-left:-5px}
.lgs img{width:14px;height:14px;display:block;border-radius:3px}
/* right: the card's identity, joined to the brief */
.rt{flex:none;width:var(--colw);display:flex;flex-direction:column;padding:var(--pad) calc(var(--pad) - 8px);border-left:1px solid var(--line)}
.rt .art{display:block;width:100%;height:132px;object-fit:contain;object-position:left center}
.rt .title{margin:22px 0 0;font-weight:500;font-size:var(--fs-title);line-height:1.2;letter-spacing:-.022em;color:var(--ink)}
.facts{display:flex;flex-direction:column;gap:8px;margin-top:calc(var(--gap) * .8)}
.fact{display:flex;align-items:center;gap:12px;min-width:0;padding:10px 12px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line2)}
.fact .ic{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;color:var(--ink)}
.fact .ic.lg{background:#fff;box-shadow:0 0 0 1px var(--line)}.fact .ic.lg img{width:15px;height:15px;display:block}
.fact .ic.ty{box-shadow:inset 0 0 0 1px var(--line2)}.fact .ic.ty svg{width:14px;height:14px}
.fact img.ic{object-fit:cover;object-position:top}
.fact .t{display:flex;flex-direction:column;min-width:0}
.fact i{font-style:normal;font-size:12px;color:var(--ink3)}
.fact b{font-weight:500;font-size:var(--fs-item);line-height:1.4;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt .start{margin-top:auto;width:100%;height:56px;flex:none}
.rt .start b{font-size:20px}
body:not(.t-glass) .rt .start{background:linear-gradient(#313337,#17181B);box-shadow:0 5px 0 #0F1012,0 12px 18px -8px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12)}
body:not(.t-glass) .rt .start.down,body:not(.t-glass) .rt .start:active{box-shadow:0 1px 0 #0F1012,0 3px 8px -4px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12)}
body:not(.t-glass) .rt .start b{background:none;color:#fff;animation:none}
body:not(.t-glass) .rt .start svg path{fill:#fff}

/* ---------------- controls (Ctrl+D): a dev panel, never part of the product ---------------- */
.ctl{position:fixed;left:12px;top:12px;z-index:60;width:252px;max-height:calc(100vh - 24px);overflow:auto;padding:12px;border-radius:14px;background:#161618;
  box-shadow:0 0 0 1px rgba(255,255,255,.1),0 20px 40px -16px rgba(0,0,0,.6);font:400 12px/16px -apple-system,system-ui,sans-serif;color:rgba(255,255,255,.72)}
.ctl[hidden]{display:none}
.ctl h4{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px;font:500 12px/16px -apple-system,system-ui,sans-serif;color:#fff}
.ctl h4 button{height:24px;padding:0 8px;border-radius:6px;color:rgba(255,255,255,.6)}
.ctl h4 button:hover{background:rgba(255,255,255,.08);color:#fff}
.ctl .row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 8px;margin:0 0 10px}
.ctl .row output{font-variant-numeric:tabular-nums;color:#fff}
.ctl input[type=range]{grid-column:1/-1;width:100%;height:18px;margin:0;accent-color:#fff}
.ctl select{grid-column:1/-1;height:28px;padding:0 6px;border-radius:7px;border:0;background:#232326;color:#fff;font:inherit}
.ctl .acts{display:flex;gap:6px;margin-top:4px}
.ctl .acts button{flex:1;height:30px;border-radius:8px;background:#232326;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.ctl .acts button:hover{background:#2C2C30}
.ctl .note{margin-top:8px;color:rgba(255,255,255,.45)}

.toast{position:fixed;left:50%;bottom:36px;z-index:30;display:flex;align-items:center;gap:12px;height:48px;padding:0 20px 0 12px;border-radius:999px;background:#fff;color:#131417;
  font:500 15px/1 var(--sans);box-shadow:0 0 0 1px rgba(19,20,23,.1),0 20px 40px -18px rgba(0,0,0,.4);transform:translate(-50%,90px);pointer-events:none;transition:transform .4s var(--ease)}
.toast.on{transform:translate(-50%,0)}
.toast i{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#131417;color:#fff}
.toast svg{width:14px;height:14px}
.proto{position:fixed;left:14px;bottom:12px;z-index:50;display:flex;align-items:center;gap:2px;padding:3px;border-radius:999px;background:rgba(20,21,23,.82);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);font:500 12px/1 system-ui,sans-serif;color:rgba(255,255,255,.62)}
.proto button{height:28px;padding:0 12px;border-radius:999px}.proto button:hover{color:#fff}
.proto button.on{background:rgba(255,255,255,.14);color:#fff}
.proto span{padding:0 10px 0 6px;color:rgba(255,255,255,.4)}
.proto .sep{width:1px;height:16px;margin:0 4px;padding:0;background:rgba(255,255,255,.14)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}

    ['fs-h', 'Heading size', 13, 24, .5, 16, 'px'], ['fs-fig', 'Figure size', 18, 44, 1, 26, 'px'], ['fs-title', 'Title size', 16, 34, 1, 22, 'px'],
    ['ls', 'Tracking', -.03, .02, .002, -.006, 'em']];
  var FONTS = { 'Inter': "'Inter',-apple-system,system-ui,sans-serif", 'Google Sans Flex': "'Google Sans Flex','Google Sans',system-ui,sans-serif", 'System': "-apple-system,'SF Pro Text',system-ui,sans-serif" };
  var V = {};
  CTL.forEach(function (c) { V[c[0]] = c[5]; }); V.font = 'Inter';
  try { var saved = JSON.parse(localStorage.getItem('zpb-controls') || 'null'); if (saved) Object.keys(saved).forEach(function (k) { if (k in V) V[k] = saved[k]; }); } catch (e) {}
  function applyV(save) {
    CTL.forEach(function (c) { if (c[0] !== 'w' && c[0] !== 'h') ov.style.setProperty('--' + c[0], V[c[0]] + c[6]); });
    ov.style.setProperty('--font', FONTS[V.font] || FONTS.Inter);
    if (save) { try { localStorage.setItem('zpb-controls', JSON.stringify(V)); } catch (e) {} }
  }
  function fmt(c, v) { return (c[6] === 'em' ? (+v).toFixed(3) : c[4] < 1 ? (+v).toFixed(2) : v) + c[6]; }
  function buildCtl() {
    ctl.innerHTML = '<h4>Controls<button type="button" data-ctl>Close</button></h4>' +
      CTL.map(function (c) { return '<label class="row"><span>' + c[1] + '</span><output data-o="' + c[0] + '">' + fmt(c, V[c[0]]) + '</output><input type="range" min="' + c[2] + '" max="' + c[3] + '" step="' + c[4] + '" value="' + V[c[0]] + '" data-k="' + c[0] + '"></label>'; }).join('') +
      '<label class="row"><span>Font</span><output></output><select data-font>' + Object.keys(FONTS).map(function (f) { return '<option' + (f === V.font ? ' selected' : '') + '>' + f + '</option>'; }).join('') + '</select></label>' +
      '<div class="acts"><button type="button" data-copy>Copy values</button><button type="button" data-reset>Reset</button></div><p class="note">Ctrl+D shows and hides this.</p>';
  }
  buildCtl();
  ctl.addEventListener('input', function (e) {
    var k = e.target.getAttribute('data-k');
    if (k) { V[k] = +e.target.value; var c = CTL.filter(function (x) { return x[0] === k; })[0]; ctl.querySelector('[data-o="' + k + '"]').textContent = fmt(c, V[k]); }
    if (e.target.hasAttribute('data-font')) V.font = e.target.value;
    applyV(true); resize(); mark(cur, true);
  });
  ctl.addEventListener('click', function (e) {
    if (e.target.closest('[data-copy]')) {
      var txt = JSON.stringify(V);
      var done = function () { e.target.textContent = 'Copied'; setTimeout(function () { e.target.textContent = 'Copy values'; }, 1400); };
      if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done, function () { prompt('Copy these values', txt); });
      else prompt('Copy these values', txt);
    } else if (e.target.closest('[data-reset]')) {
      CTL.forEach(function (c) { V[c[0]] = c[5]; }); V.font = 'Inter'; buildCtl(); applyV(true); resize(); mark(cur, true);
    }
  });
  function toggleCtl() { ctl.hidden = !ctl.hidden; document.querySelector('.proto [data-ctl]').classList.toggle('on', !ctl.hidden); }
  applyV(false);

  /* ---- the surface: ?v=glass for the card's own material ---- */
  function theme(t) {
    B.classList.toggle('t-glass', t === 'glass');
    Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (b) { b.classList.toggle('on', b.getAttribute('data-t') === t); });
    try { history.replaceState(null, '', t === 'glass' ? '?v=glass' : location.pathname); } catch (e) {}
  }
  theme(/[?&]v=glass/.test(location.search) ? 'glass' : 'light');

  /* ---- sizes: the world covers the window, the canvas fits it, the full card sits in the middle ---- */
  var R = null, busy = false;
  function layout() {
    var w = innerWidth, h = innerHeight, width = Math.round(Math.min(w - 96, V.w)), height = Math.round(Math.min(h - 64, V.h));
    return { left: Math.round((w - width) / 2), top: Math.round((h - height) / 2), width: width, height: height };
  }
  function place(el, r) { el.style.left = r.left + 'px'; el.style.top = r.top + 'px'; el.style.width = r.width + 'px'; el.style.height = r.height + 'px'; }
  function inset(r, rad) { return 'inset(' + [r.top, innerWidth - r.left - r.width, innerHeight - r.top - r.height, r.left].map(function (v) { return v.toFixed(1) + 'px'; }).join(' ') + ' round ' + (+rad).toFixed(1) + 'px)'; }
  function resize() {
    R = layout();
    if (!busy) { place(ov, R); surface.style.clipPath = inset(R, V.radius); }
    var out = R.left + R.width + 16 + 44 <= innerWidth - 8;
    ox.style.left = (out ? R.left + R.width + 16 : R.left + R.width - 64) + 'px'; ox.style.top = (out ? R.top : R.top + 20) + 'px';
  }
  function fit() {
    var S = Math.min(innerWidth / 1920, innerHeight / 1080), C = Math.max(innerWidth / 1920, innerHeight / 1080);
    app.style.transform = 'scale(' + S + ')'; app.style.left = Math.round((innerWidth - 1920 * S) / 2) + 'px'; app.style.top = Math.round((innerHeight - 1080 * S) / 2) + 'px';
    world.style.transform = 'scale(' + C + ')'; world.style.left = Math.round((innerWidth - 1920 * C) / 2) + 'px'; world.style.top = Math.round((innerHeight - 1080 * C) / 2) + 'px';
    resize();
  }
  fit(); mark(0, true); addEventListener('resize', function () { fit(); mark(cur, true); });

  /* ---- open and close: the card lifts to the middle and grows into the full card; the content is revealed by its edge ---- */
  var DUR_IN = 460, DUR_OUT = 360, EASE = 'cubic-bezier(.32,.72,0,1)';
  function frames() {
    var c = card.getBoundingClientRect(), r0 = 42 * c.width / card.offsetWidth; R = layout();
    var ins = [Math.max(0, c.top - R.top), Math.max(0, R.left + R.width - c.right), Math.max(0, R.top + R.height - c.bottom), Math.max(0, c.left - R.left)];
    return {
      surface: [{ clipPath: inset({ left: c.left, top: c.top, width: c.width, height: c.height }, r0) }, { clipPath: inset(R, V.radius) }],
      clip: [{ clipPath: 'inset(' + ins.map(function (v) { return v.toFixed(1) + 'px'; }).join(' ') + ' round ' + r0.toFixed(1) + 'px)' }, { clipPath: 'inset(0px 0px 0px 0px round ' + V.radius + 'px)' }]
    };
  }
  function open() {
    if (busy || B.classList.contains('open')) return; busy = true;
    var key = app.querySelector('.start'); key.classList.add('down');
    setTimeout(function () {
      key.classList.remove('down');
      read.scrollTop = 0; mark(0, true);
      var k = frames(); place(ov, R); surface.style.clipPath = inset(R, V.radius); resize();
      B.classList.add('open'); card.style.visibility = 'hidden';
      surface.animate(k.surface, { duration: DUR_IN, easing: EASE });
      ov.animate(k.clip, { duration: DUR_IN, easing: EASE }).onfinish = function () { B.classList.add('shown'); busy = false; mark(cur, true); };
    }, 90);
  }
  function close() {
    if (busy || !B.classList.contains('open')) return; busy = true;
    B.classList.remove('shown');
    var k = frames();
    var a = surface.animate(k.surface.slice().reverse(), { duration: DUR_OUT, easing: EASE, fill: 'forwards' });
    var b = ov.animate(k.clip.slice().reverse(), { duration: DUR_OUT, easing: EASE, fill: 'forwards' });
    b.onfinish = function () { card.style.visibility = ''; B.classList.remove('open'); a.cancel(); b.cancel(); busy = false; };
  }
  function startOver() {
    surface.getAnimations().concat(ov.getAnimations()).forEach(function (a) { a.cancel(); });
    B.classList.remove('open', 'shown', 'picked'); card.style.visibility = ''; busy = false; toast.classList.remove('on');
  }

  document.addEventListener('click', function (e) {
    var lk = e.target.closest('.mk.lk');
    Array.prototype.forEach.call(document.querySelectorAll('.mk.lk.open'), function (m) { if (m !== lk) m.classList.remove('open'); });
    if (lk) { lk.classList.toggle('open'); return; }
    if (e.target.closest('.ctl') && !e.target.closest('[data-ctl]')) return;
    var tb = e.target.closest('[data-tab]');
    if (tb) { jumpTo(+tb.getAttribute('data-tab')); return; }
    var t = e.target.closest('[data-pick],[data-open],[data-close],[data-go],[data-r],[data-t],[data-ctl],.scrim');
    if (!t) return;
    if (t.hasAttribute('data-pick')) B.classList.add('picked');
    else if (t.hasAttribute('data-open')) open();
    else if (t.hasAttribute('data-close') || t.classList.contains('scrim')) close();
    else if (t.hasAttribute('data-go')) { t.classList.add('down'); setTimeout(function () { t.classList.remove('down'); }, 160); toast.classList.remove('on'); void toast.offsetWidth; toast.classList.add('on'); setTimeout(function () { toast.classList.remove('on'); }, 2600); }
    else if (t.hasAttribute('data-t')) theme(t.getAttribute('data-t'));
    else if (t.hasAttribute('data-ctl')) toggleCtl();
    else if (t.hasAttribute('data-r')) startOver();
  });
  addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'd' || e.key === 'D')) { e.preventDefault(); toggleCtl(); return; }
    if (e.target.closest && e.target.closest('.ctl')) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'g') theme(B.classList.contains('t-glass') ? 'light' : 'glass');
  });
})();
</script>
