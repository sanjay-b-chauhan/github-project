<style>
:root{
  --page:#FAFAF9; --shell:#F1F1EF; --card:#FFF; --field:#F0F0EE; --wash:#F7F7F5;
  --line:rgba(13,13,13,.08); --line-2:rgba(13,13,13,.045);
  --tx:#111113; --tx-2:#63636a; --tx-3:#9a9aa0; --tx-4:#c4c4ca;
  --ink:#111113; --on-ink:#fff; --ok:#3fb968; --commit:#4ade80; --gold:#8a6d00;
  --f:'Google Sans Flex','Google Sans',-apple-system,system-ui,sans-serif;
  --serif:'STK Bureau Serif',Georgia,serif;
  --r-sm:8px; --r-md:12px; --r:16px; --r-lg:20px; --r-xl:26px; --pill:999px;
}
*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ height:100%; }
body{ background:var(--page); color:var(--tx); font-family:var(--f); font-size:14px;
  letter-spacing:-.018em; overflow:hidden; -webkit-font-smoothing:antialiased;
  transition:background-color .6s ease, color .6s ease; }
body.dark{
  --page:#0E0E10; --shell:#17171A; --card:#1C1C1F; --field:#222226; --wash:#1A1A1D; --bubble:#222226;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.05);
  --tx:#F4F4F3; --tx-2:#A6A6AC; --tx-3:#77777E; --tx-4:#4A4A51;
  --ink:#F4F4F3; --on-ink:#131315;
}
.veil{ position:fixed; inset:0; z-index:95; background:#FAFAF9; opacity:0; pointer-events:none; }
/* the charge: it opens out of the middle and leaves the screen, and black is
   what it leaves behind */
.energ{ position:fixed; inset:0; z-index:94; pointer-events:none; opacity:0; --r1:0%; --r2:0%;
  filter:blur(52px);
  background:radial-gradient(circle at 50% 50%, #DFF6B4 0%, #A8E6CF 34%, #4ADE80 66%, #22c55e 100%);
  -webkit-mask-image:radial-gradient(circle at 50% 50%,
    transparent var(--r2), #000 calc(var(--r2) + 20%), #000 var(--r1), transparent calc(var(--r1) + 20%));
  mask-image:radial-gradient(circle at 50% 50%,
    transparent var(--r2), #000 calc(var(--r2) + 20%), #000 var(--r1), transparent calc(var(--r1) + 20%)); }

.pcards{ display:flex; gap:16px; justify-content:center; }
.pcard{ width:212px; height:264px; background:var(--card); border:1px solid var(--line); border-radius:28px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
  transition:transform .24s cubic-bezier(.2,.8,.3,1), box-shadow .24s ease; }
.pcard .pi{ width:58px; height:58px; border-radius:19px; background:var(--wash);
  display:flex; align-items:center; justify-content:center; color:var(--tx-2); }
.pcard .pi svg{ width:24px; height:24px; }
.pcard .pl{ font-size:15px; font-weight:600; letter-spacing:-.02em; }
.pcard:hover{ transform:translateY(-5px); box-shadow:0 14px 32px rgba(0,0,0,.09); }

/* the dock: one global place the user acts, always centered at the bottom */
.dock{ position:fixed; left:0; right:0; bottom:0; z-index:80; display:flex; justify-content:center;
  padding:0 24px 34px; pointer-events:none; opacity:0;
  transition:padding-left .9s cubic-bezier(.625,.05,0,1); }
.dockin{ display:flex; align-items:center; gap:14px; pointer-events:auto; }
.dbig{ height:58px; padding:0 34px; border-radius:var(--pill); background:var(--ink); color:var(--on-ink);
  font-size:16px; font-weight:600; letter-spacing:-.02em; display:inline-flex; align-items:center;
  transition:transform .22s cubic-bezier(.2,.8,.3,1); }
.dbig:hover{ transform:translateY(-2px); }
.dmic{ width:66px; height:66px; border-radius:var(--pill); background:var(--ink); color:var(--on-ink);
  display:flex; align-items:center; justify-content:center; position:relative;
  transition:transform .22s cubic-bezier(.2,.8,.3,1); }
.dmic svg{ width:25px; height:25px; }
.dmic:hover{ transform:scale(1.05); }

/* a job, not a tag: the company, what the job is, where, and what it pays */

  mask-image:linear-gradient(90deg,transparent 0,#000 30px,#000 calc(100% - 30px),transparent 100%); }
.tlrail{ position:absolute; left:0; right:0; top:16px; height:2px;
  background:rgba(13,13,13,.13); border-radius:2px; }
body.dark .tlrail{ background:rgba(255,255,255,.15); }
.tlrow{ display:flex; gap:14px; overflow-x:auto; padding:40px 40px 10px; scroll-snap-type:x mandatory;
  scroll-behavior:smooth; scroll-padding-inline:40px; }
.tlrow::after{ content:''; flex:0 0 8px; }
.tlrow::-webkit-scrollbar{ height:0; }
.tlc{ position:relative; flex:0 0 300px; scroll-snap-align:center; text-align:left;
  background:var(--card); border:1px solid var(--line); border-radius:20px; padding:24px; }
/* the number sits on the line, not beside it */
.tlc .nd{ position:absolute; top:-40px; left:50%; transform:translateX(-50%);
  width:34px; height:34px; border-radius:var(--pill);
  background:var(--ink); color:var(--on-ink); display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:600; box-shadow:0 0 0 6px var(--shell); }
.tlc .nd svg{ width:15px; height:15px; }
.tlc .ct{ font-size:15.5px; font-weight:600; letter-spacing:-.03em; }
.tlc .cw{ margin-top:4px; font-size:11.5px; color:var(--tx-3); }
.cwhy{ margin-top:8px; font-size:12px; line-height:1.45; color:var(--tx-3); text-align:left; }
.tls{ display:flex; align-items:flex-start; gap:10px; padding:9px 0; text-align:left;
  font-size:12.5px; line-height:1.5; color:var(--tx-2); }
.tls + .tls{ border-top:1px solid var(--line-2); }
.tls .sq{ width:5px; height:5px; border-radius:2px; background:var(--tx-4); flex-shrink:0; margin-top:6px; }
.tls .tx{ flex:1; min-width:0; text-align:left; }
.tools{ margin-top:14px; display:flex; flex-wrap:wrap; gap:7px; }
.tool{ display:inline-flex; align-items:center; gap:7px; height:30px; padding:0 12px 0 6px;
  border-radius:var(--pill); background:var(--wash); font-size:11.5px; color:var(--tx-2); }
.tool .tm{ width:20px; height:20px; border-radius:7px; background:#fff; display:flex; align-items:center;
  justify-content:center; box-shadow:0 2px 7px rgba(0,0,0,.13); }
.tool .tm svg{ width:12px; height:12px; }
.tlc.end{ background:linear-gradient(152deg,#14532d 0%,#166534 52%,#15803d 100%);
  border-color:transparent; color:#fff; flex:0 0 250px;
  box-shadow:0 18px 40px rgba(21,128,61,.28); }
.tlc.end .nd{ background:#4ADE80; color:#0d2818; box-shadow:0 0 0 6px var(--shell); }
.tlc.end .cw{ color:rgba(255,255,255,.66); }
.tlc.end .ce{ margin-top:14px; font-size:15px; line-height:1.42; letter-spacing:-.025em; }
.tlc .tro{ width:42px; height:42px; }
.tlrow.vert{ flex-direction:column; overflow-x:visible; padding:14px 4px 14px 34px; gap:34px; }
.tlrow.vert::after{ display:none; }
.tlrow.vert .tlc{ flex:1 1 auto; width:100%; }
.tlrow.vert .tlc .nd{ top:50%; left:-26px; transform:translate(-50%,-50%); }
.tlwrap.vert{ padding-top:0; -webkit-mask-image:none; mask-image:none; }
.tlwrap.vert .tlrail{ left:0; top:14px; bottom:14px; right:auto; width:2px; height:auto; }

/* ONE option component. Rectangle with the icon centred over the label by
   default; the same thing laid flat as a pill when the answer is just a yes. */
.opts2{ display:flex; flex-wrap:wrap; gap:12px; justify-content:center; max-width:730px; margin:0 auto; }
.opt{ position:relative; flex:0 0 auto; min-width:154px; max-width:212px;
  padding:22px 20px 20px; border-radius:22px; background:var(--card); border:1px solid var(--line);
  display:flex; flex-direction:column; align-items:center; gap:15px; text-align:center;
  font-size:15px; font-weight:500; letter-spacing:-.022em; line-height:1.3;
  transition:transform .3s cubic-bezier(.2,.8,.3,1), box-shadow .3s ease, background .3s ease,
             border-color .3s ease, color .3s ease; }
.opt .oi2{ width:46px; height:46px; border-radius:16px; background:var(--wash); color:var(--tx-2);
  display:flex; align-items:center; justify-content:center;
  transition:background .3s ease, color .3s ease, transform .3s cubic-bezier(.2,.9,.3,1); }
.opt .oi2 svg{ width:22px; height:22px; }
.opt .oi2.lg{ background:#fff; box-shadow:0 6px 18px rgba(0,0,0,.14); }
.opt .oi2.lg svg{ width:25px; height:25px; }
.opt:hover{ transform:translateY(-6px); box-shadow:0 20px 42px rgba(0,0,0,.11); }
.opt:hover .oi2{ transform:scale(1.07); }
.opt.on{ background:var(--ink); color:var(--on-ink); border-color:transparent; }
.opt.on .oi2{ background:rgba(255,255,255,.17); color:var(--on-ink); }
.opt.on .oi2.lg{ background:#fff; }
.opt.pill{ flex-direction:row; align-items:center; min-width:0; max-width:none;
  height:54px; padding:0 24px 0 15px; border-radius:var(--pill); gap:12px; }
.opt.pill .oi2{ width:30px; height:30px; border-radius:var(--pill); }
.opt.pill .oi2 svg{ width:15px; height:15px; }
.opt.pill.bare{ padding:0 24px; }

.anl{ display:flex; flex-direction:column; gap:16px; max-width:360px; margin:0 auto; }
.anlr{ display:flex; align-items:center; gap:14px; font-size:15.5px; letter-spacing:-.02em;
  color:var(--tx-3); transition:color .4s ease; }
.anlr .ad{ width:24px; height:24px; flex-shrink:0; border-radius:50%; border:1.5px solid var(--line);
  display:flex; align-items:center; justify-content:center; color:var(--tx-4);
  transition:background .35s ease, color .35s ease, border-color .35s ease; }
.anlr .ad svg{ width:12px; height:12px; }
.anlr.done{ color:var(--tx); }
.anlr.done .ad{ background:var(--commit); border-color:transparent; color:#0d2818; }
/* the light: mint, green, lime and yellow, moving behind everything */
.aur{ position:fixed; inset:0; z-index:86; pointer-events:none; opacity:0; overflow:hidden; }
.aur b{ position:absolute; left:0; top:0; width:46vmin; height:46vmin; border-radius:50%;
  filter:blur(62px); display:block; }
.rip{ position:fixed; inset:0; z-index:87; pointer-events:none; display:none; }
.rip s{ position:absolute; left:50%; top:50%; width:20px; height:20px; margin:-10px 0 0 -10px;
  border-radius:50%; border:1.5px solid rgba(74,222,128,.7); display:block; }
.core{ position:fixed; left:50%; top:50%; width:170px; height:170px; margin:-85px 0 0 -85px;
  z-index:87; border-radius:50%; pointer-events:none; opacity:0; filter:blur(11px);
  background:radial-gradient(circle at 50% 50%, rgba(255,255,255,.98) 0%, rgba(200,241,105,.92) 32%, rgba(74,222,128,.55) 58%, rgba(74,222,128,0) 72%); }
.conf{ position:fixed; inset:0; z-index:92; pointer-events:none; overflow:hidden; }
.conf i{ position:absolute; display:block; will-change:transform,opacity; }
/* a sheen passes over anything that has just become true */
.sheen{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:5; border-radius:inherit; }
.sheen i{ position:absolute; top:-45%; bottom:-45%; width:46%; left:-60%; display:block;
  background:linear-gradient(100deg, transparent, rgba(168,230,207,.45) 32%, rgba(255,255,255,.85) 50%, rgba(200,241,105,.4) 68%, transparent);
  filter:blur(16px); transform:skewX(-14deg); }

/* A long panel is a document, not a wall: one column at a readable measure,
   and the user can scroll it themselves. */
.doc{ max-width:640px; margin:0 auto; padding:24px 0; }
.scroll.docs{ display:flex; flex-direction:column; overflow-y:auto; overscroll-behavior:contain; }
.scroll.docs > .doc{ width:100%; margin-top:auto; margin-bottom:auto; }
/* each piece is lit as it lands, so the eye knows where to look */
.lit{ animation:lit 1.7s cubic-bezier(.625,.05,0,1) forwards; }
@keyframes lit{
  0%{ box-shadow:0 20px 40px rgba(0,0,0,.13); }
  70%{ box-shadow:0 7px 18px rgba(0,0,0,.05); }
  100%{ box-shadow:0 0 0 rgba(0,0,0,0); } }
body.dark .lit{ animation-name:litd; }
@keyframes litd{
  0%{ box-shadow:0 20px 40px rgba(0,0,0,.45); }
  70%{ box-shadow:0 7px 18px rgba(0,0,0,.18); }
  100%{ box-shadow:0 0 0 rgba(0,0,0,0); } }
/* pieces of the document are outlined objects, not washes */
.doc .prow, .doc .todo, .doc .blk, .doc .lrow, .doc .rcard, .doc .rewrow, .doc .linr{
  background:var(--card); border:1px solid var(--line); }
.doc .pname{ font-size:23px; }
.doc .psec{ margin-top:30px; margin-bottom:13px; }
.doc .pbio{ margin-top:18px; }

/* options are squares. Three answers means three squares, side by side. */
.sq{ display:grid; gap:12px; width:100%; margin:0 auto; }
/* square whatever the column does: the panel can widen underneath them */
.sqc{ position:relative; width:100%; aspect-ratio:1; padding:20px;
  background:var(--card); border:1px solid var(--line); border-radius:26px;
  display:flex; flex-direction:column; align-items:flex-start; justify-content:space-between; text-align:left;
  transition:transform .26s cubic-bezier(.2,.8,.3,1), box-shadow .26s ease, background .3s ease, border-color .3s ease; }
.sqc .si{ width:46px; height:46px; border-radius:15px; background:var(--wash); color:var(--tx-2);
  display:flex; align-items:center; justify-content:center; transition:background .3s ease; }
.sqc .si svg{ width:21px; height:21px; }
.sqc .si.lg{ background:#fff; box-shadow:0 6px 16px rgba(0,0,0,.12); }
.sqc .si.lg svg{ width:24px; height:24px; }
.sqc .sl{ font-size:16.5px; font-weight:600; letter-spacing:-.028em; line-height:1.22; }
.sqc:hover{ transform:translateY(-6px); box-shadow:0 18px 40px rgba(0,0,0,.11); }
.sqc.on{ background:var(--ink); color:var(--on-ink); border-color:transparent; }
.sqc.on .si{ background:rgba(255,255,255,.14); color:var(--on-ink); }
.sqc.on .si.lg{ background:#fff; }
.sqc .tk{ position:absolute; top:15px; right:15px; width:24px; height:24px; border-radius:var(--pill);
  background:var(--on-ink); color:var(--ink); display:flex; align-items:center; justify-content:center;
  opacity:0; transform:scale(.4); transition:opacity .2s ease, transform .3s cubic-bezier(.2,1.5,.4,1); }
.sqc .tk svg{ width:12px; height:12px; }
.sqc.on .tk{ opacity:1; transform:scale(1); }

/* what you are saying, live, while you say it */
.dtr{ position:fixed; left:0; right:0; bottom:120px; z-index:79; display:flex; justify-content:center;
  padding:0 24px; pointer-events:none; opacity:0;
  transition:padding-left .9s cubic-bezier(.625,.05,0,1); }
.dtr span{ max-width:min(560px,44vw); font-size:16px; line-height:1.45; color:var(--tx-2);
  text-align:center; text-wrap:balance; }
.dtr b{ color:var(--tx); font-weight:500; }

/* the transformation layer: the board comes apart into companies */
.zook{ position:fixed; inset:0; z-index:88; pointer-events:none; }
.zc{ position:fixed; margin:0!important; will-change:transform,opacity; }
.ztile{ position:fixed; width:74px; height:74px; border-radius:23px; background:#fff;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 24px 48px rgba(0,0,0,.3), 0 2px 6px rgba(0,0,0,.18); }
.ztile svg{ width:34px; height:34px; }

.metapills{ display:flex; flex-wrap:wrap; gap:8px; margin-top:11px; }
.mp{ display:inline-flex; align-items:center; gap:9px; height:34px; padding:0 15px 0 8px;
  border-radius:var(--pill); background:var(--card); border:1px solid var(--line);
  font-size:12.5px; font-weight:500; letter-spacing:-.015em; }
.mp .mi{ width:21px; height:21px; display:inline-flex; flex-shrink:0; }
.mp .mi svg{ width:100%; height:100%; }
.cosbig{ display:flex; flex-wrap:wrap; gap:12px; }
.cbg{ width:60px; height:60px; border-radius:19px; background:#fff; display:flex; align-items:center;
  justify-content:center; box-shadow:0 14px 28px rgba(0,0,0,.16), 0 1px 3px rgba(0,0,0,.09); }
.cbg svg{ width:28px; height:28px; }
.cbg:nth-child(2n){ transform:rotate(3.5deg); }
.cbg:nth-child(3n){ transform:rotate(-4deg); }
.cbg:nth-child(5n){ transform:rotate(2deg); }

.lin{ display:flex; flex-direction:column; gap:9px; }

.linr .lc{ width:21px; height:21px; flex-shrink:0; border-radius:var(--pill); background:var(--commit);

.linr .lc svg{ width:11px; height:11px; }
.srcpill{ display:inline-flex; align-items:center; gap:6px; height:22px; padding:0 9px; border-radius:var(--r-sm);

.ghost{ box-shadow:0 16px 36px rgba(0,0,0,.16); }
@media (max-width:1180px){ .right{ display:none!important; } }

let voOn=true, voRate=1, voNow=null;
const voCache={};
function voFind(text){
  const k=String(text||'').replace(/\s+/g,' ').trim();
  return Object.prototype.hasOwnProperty.call(VO_CLIPS,k)?VO_CLIPS[k]:null;
}
function voStop(){ if(voNow){ try{ voNow.pause(); voNow.currentTime=0; }catch(e){} voNow=null; } }
/* resolves when the clip has finished, or immediately when we have no take */
function voPlay(text){
  if(!voOn||!sndOn) return null;
  const src=voFind(text); if(!src) return null;
  voStop();
  let a=voCache[text];
  if(!a){ a=new Audio(src); a.preload='auto'; voCache[text]=a; }
  a.playbackRate=voRate;
  try{ a.currentTime=0; }catch(e){}
  voNow=a;
  const pr=a.play(); if(pr&&pr.catch) pr.catch(()=>{});
  return new Promise(res=>{
    let done=false;
    const fin=()=>{ if(done)return; done=true;
      a.removeEventListener('ended',fin); a.removeEventListener('error',fin);
      if(voNow===a) voNow=null; res(); };
    a.addEventListener('ended',fin);
    a.addEventListener('error',fin);
    /* a throttled tab still lands */
    setTimeout(fin, ((a.duration||4)*1000)/voRate + 900);
  });
}
/* say it and show it together, and fall back to the old timing when there is no take */
async function voLine(text,fallback){
  /* audio outlives a screen change: without this a stale line resumes when its
     clip ends and paints over whatever is now on screen. */
  const g=gen;
  if(g!==gen) return;
  line(text);
  const p=voPlay(text);
  if(p){ await p; if(g!==gen) return; await wait(300/voRate); }
  else await wait(fallback||1800);
  if(g!==gen) return;
}

/* ---- pen on paper: real friction noise that tracks the hand ----
   Not a loop. A filtered noise bed whose brightness and level follow stroke
   speed, so a slow nib whispers and a fast one hisses. */
const AUD=(function(){
  let ctx=null;
  function ac(){
    if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
    if(ctx&&ctx.state==='suspended'){ try{ ctx.resume(); }catch(e){} }
    return ctx;
  }
  let nb=null;
  function noise(c){
    if(nb&&nb.sampleRate===c.sampleRate) return nb;
    const n=Math.floor(c.sampleRate*2), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
    let last=0;
    for(let i=0;i<n;i++){ const w=Math.random()*2-1; last=(last+.02*w)/1.02; d[i]=last*3.2+w*.4; }
    nb=b; return b;
  }
  /* the pen */
  let src=null,hp=null,bp=null,gn=null,live=false,target=0,cur=0,raf=0;
  function penStart(){
    const c=ac(); if(!c||!sndOn||live) return; live=true;
    src=c.createBufferSource(); src.buffer=noise(c); src.loop=true;
    hp=c.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=620;
    bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1900; bp.Q.value=.8;
    gn=c.createGain(); gn.gain.value=0;
    src.connect(hp); hp.connect(bp); bp.connect(gn); gn.connect(c.destination);
    src.start();
    /* the nib touching down */
    const t=c.currentTime, o=c.createOscillator(), og=c.createGain();
    o.type='triangle'; o.frequency.setValueAtTime(320,t); o.frequency.exponentialRampToValueAtTime(90,t+.05);
    og.gain.setValueAtTime(.055,t); og.gain.exponentialRampToValueAtTime(.0001,t+.07);
    o.connect(og); og.connect(c.destination); o.start(t); o.stop(t+.09);
    const tick=()=>{ if(!live) return;
      cur+=(target-cur)*.22; target*=.82;   /* a still hand goes quiet on its own */
      const c2=ac(); if(c2&&gn){
        gn.gain.setTargetAtTime(Math.min(.075,cur*.075),c2.currentTime,.02);
        bp.frequency.setTargetAtTime(1500+Math.min(1,cur)*3400,c2.currentTime,.03);
      }
      raf=requestAnimationFrame(tick); };
    raf=requestAnimationFrame(tick);
  }
  function penMove(speed){ if(!live) return; target=Math.max(target,Math.min(1.6,speed*2.6)); }
  function penStop(){
    if(!live) return; live=false; cancelAnimationFrame(raf);
    const c=ac(); if(!c||!gn){ src=null; return; }
    const t=c.currentTime, g=gn, s=src;
    g.gain.cancelScheduledValues(t); g.gain.setTargetAtTime(0,t,.05);
    setTimeout(()=>{ try{ s.stop(); }catch(e){} },320);
    src=null; gn=null; cur=0; target=0;
  }
  /* the flip into the dark: a sweep, a sub, and a shimmer tail */
  function whoosh(){
    const c=ac(); if(!c||!sndOn) return;
    const t=c.currentTime;
    const s=c.createBufferSource(); s.buffer=noise(c); s.loop=true;
    const f=c.createBiquadFilter(); f.type='bandpass'; f.Q.value=1.1;
    f.frequency.setValueAtTime(360,t);
    f.frequency.exponentialRampToValueAtTime(5200,t+.62);
    f.frequency.exponentialRampToValueAtTime(280,t+1.5);
    const g=c.createGain();
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.13,t+.5);
    g.gain.exponentialRampToValueAtTime(.0001,t+1.55);
    s.connect(f); f.connect(g); g.connect(c.destination); s.start(t); s.stop(t+1.7);
    const o=c.createOscillator(), og=c.createGain();
    o.type='sine'; o.frequency.setValueAtTime(96,t+.34); o.frequency.exponentialRampToValueAtTime(34,t+1.1);
    og.gain.setValueAtTime(.0001,t+.34); og.gain.exponentialRampToValueAtTime(.16,t+.46);
    og.gain.exponentialRampToValueAtTime(.0001,t+1.25);
    o.connect(og); og.connect(c.destination); o.start(t+.34); o.stop(t+1.3);
    [1568,2093,2637].forEach((hz,i)=>{
      const b=c.createOscillator(), bg=c.createGain();
      b.type='sine'; b.frequency.value=hz;
      const at=t+.72+i*.07;
      bg.gain.setValueAtTime(.0001,at); bg.gain.exponentialRampToValueAtTime(.03,at+.05);
      bg.gain.exponentialRampToValueAtTime(.0001,at+.85);
      b.connect(bg); bg.connect(c.destination); b.start(at); b.stop(at+.9);
    });
  }
  return { penStart:penStart, penMove:penMove, penStop:penStop, whoosh:whoosh };
})();

const KW={
  company:{ 'Startup':['startup','early stage','scrappy','small team'],
    'Scale-up':['scale-up','scaleup','growth stage','series b','series c'],
    'Big tech':['big tech','faang','enterprise','large company','big company','corporate','established'],

function grab(text,map){ const t=' '+text.toLowerCase()+' ';
  for(const [val,words] of Object.entries(map)) if(words.some(w=>t.includes(w))) return val; return null; }
function grabCity(text){ const t=text.toLowerCase();
  for(const c of CITIES) if(t.includes(c.toLowerCase())) return c==='NYC'?'New York':(c==='Bengaluru'?'Bangalore':c); return null; }
function grabName(text){
  const m=text.match(/(?:i'?m|i am|my name is|call me|this is)\s+([A-Za-z]{2,15})/i);
  if(!m) return null;
  const bad=['looking','trying','currently','from','based','working','studying','interested','going','still','just','really','not','more','about','done','ready','excited','good','fine','open','a','an','the'];
  const n=m[1].toLowerCase();
  if(bad.includes(n)) return null;
  return m[1].charAt(0).toUpperCase()+m[1].slice(1).toLowerCase();
}
function quoteOf(text){ let q=text.trim().replace(/\s+/g,' ');
  if(q.length>64) q=q.slice(0,61).replace(/\s\S*$/,'')+'…';
  return q.charAt(0).toUpperCase()+q.slice(1); }
function extractInto(text){
  const found=[];
  const n=grabName(text); if(n&&!P.name){P.name=n;found.push('name');}
  const c=grabCity(text); if(c&&!P.location){P.location=c;found.push('location');}
  const co=grab(text,KW.company); if(co&&!P.company){P.company=co;found.push('company');}
  const ind=grab(text,KW.industry); if(ind&&!P.industry){P.industry=ind;found.push('industry');}
  const lv=grab(text,KW.level); if(lv&&!P.level){P.level=lv;}
  for(const r of pack().roleCards) if(text.toLowerCase().includes(r.toLowerCase())&&!P.role){P.role=r;found.push('role');}
  /* they already told us what they do. Asking "are you a student" after that is
     the exact repetition the founder called out. */
  if(!P.doing && (P.level||P.role||P.industry) && String(text).trim().split(/\s+/).length>=6){
    P.doing=quoteOf(text); found.push('doing');
  }
  const t=text.toLowerCase();
  /* a named company, so "more like Figma" lands without re-asking */
  if(!P.dream){
    const names=(DREAMS[PKEY]||DREAMS.design).concat(pack().cos||[],DREAM_EXTRA,Object.keys(LOGO||{}));
    const hit=[], seen={};
    for(const n of names){ if(n&&n.length>2&&!seen[n]&&t.includes(n.toLowerCase())){ seen[n]=1; hit.push(n); } }
    if(hit.length){ P.dream=hit.join(', '); found.push('dream'); }
  }
  if(!P.workmode){
    if(/fully remote|\bremote\b|from home/.test(t)){ P.workmode='Remote'; found.push('mode'); }
    else if(/hybrid/.test(t)){ P.workmode='Hybrid'; found.push('mode'); }
    else if(/in person|in-person|onsite|on-site|in the office/.test(t)){ P.workmode='In person'; found.push('mode'); }
  }
  if(!P.timeline){
    if(/right now|straight away|asap|as soon as/.test(t)){ P.timeline='Now'; found.push('timing'); }
    else if(/3 months|three months/.test(t)){ P.timeline='In 3 months'; found.push('timing'); }
    else if(/this year|by the end of the year/.test(t)){ P.timeline='This year'; found.push('timing'); }
    else if(/no rush|no hurry/.test(t)){ P.timeline='No rush'; found.push('timing'); }
  }
  if(!P.jobtype){
    if(/internship|intern\b/.test(t)){ P.jobtype='An internship'; found.push('shape'); }
    else if(/full time|full-time/.test(t)){ P.jobtype='Full time'; found.push('shape'); }
  }
  return found;
}

function safeTL(tl,ms){

  /* chain, never replace: this used to clobber the caller's onComplete */
  const prev=tl.eventCallback('onComplete');
  tl.eventCallback('onComplete',function(){ clearTimeout(t); if(prev) prev.apply(this,arguments); });
  return tl; }

function joinList(a){ if(a.length<2) return a[0]||''; return a.slice(0,-1).join(', ')+' and '+a[a.length-1]; }
function reflectAbout(){
  const bits=[];
  if(P.level&&P.level!=='Finding out') bits.push(P.level.charAt(0).toLowerCase()+P.level.slice(1));
  if(P.role) bits.push('looking at '+P.role);
  if(P.location) bits.push('based in '+P.location);
  if(P.industry) bits.push('drawn to '+(SHORT[P.industry]||P.industry));
  if(!bits.length) return 'Got it. Let me start putting that down.';
  /* three reads as a sentence, four reads as a list */
  const j=joinList(bits.slice(0,3));
  return 'Got it. '+j.charAt(0).toUpperCase()+j.slice(1)+'.';

/* the bars follow the actual voice when the mic is open, and breathe when it is not */
function levelMeter(bars,idleTL){
  let ac=null, raf=0, stream=null;
  try{
    navigator.mediaDevices.getUserMedia({audio:true}).then(s2=>{
      stream=s2; ac=new (window.AudioContext||window.webkitAudioContext)();
      const an=ac.createAnalyser(); an.fftSize=64; an.smoothingTimeConstant=.72;
      ac.createMediaStreamSource(s2).connect(an);
      const data=new Uint8Array(an.frequencyBinCount);
      if(idleTL) idleTL.pause();
      const loop=()=>{ an.getByteFrequencyData(data);
        for(let i=0;i<bars.length;i++){
          const v=data[2+(i%(data.length-3))]/255;
          bars[i].style.height=(5+v*29)+'px'; }
        raf=requestAnimationFrame(loop); };
      loop();
    }).catch(()=>{});
  }catch(e){}
  return ()=>{ if(raf) cancelAnimationFrame(raf);
    try{ stream&&stream.getTracks().forEach(t2=>t2.stop()); }catch(e){}
    try{ ac&&ac.close(); }catch(e){} };
}

/* recording: waveform, cancel, send. The voice note is the message. */
function startRecording(onText){
  const wrap=mk('div','dockin');
  const cancel=mk('button','dghostbtn',I.x); cancel.setAttribute('aria-label','Cancel');
  const r=mk('div','drec');
  const wave=mk('div','wave');
  const bars=[]; for(let i=0;i<26;i++){ const b=mk('span'); wave.appendChild(b); bars.push(b); }
  const time=mk('div','dtime','0:00');
  const send=mk('button','dsend on',I.arrow); send.setAttribute('aria-label','Send');
  r.appendChild(wave); r.appendChild(time); r.appendChild(send);
  wrap.appendChild(cancel); wrap.appendChild(r);
  dockIn(wrap);
  sfx('press');
  let t0=Date.now(), heard='', live=true, sent=false, lastAt=Date.now(), idle=null, myRec=null;
  const wav=gsap.timeline({repeat:-1});
  bars.forEach((b,i)=>wav.to(b,{height:6+Math.random()*26,duration:.34,yoyo:true,repeat:-1,
    ease:'sine.inOut',delay:i*0.012},0));
  const tick=setInterval(()=>{ const s2=Math.floor((Date.now()-t0)/1000);
    time.textContent='0:'+String(s2).padStart(2,'0'); },500);
  const stopMeter=levelMeter(bars,wav);
  const stopAll=()=>{ live=false; wav.kill(); clearInterval(tick); clearInterval(idle);
    stopMeter(); stopRec(); showTranscript('',''); };
  /* one way out, used by silence, by Send, and by nothing else. It must NOT set
     `locked` - every receiver guards on locked and would bail on its own signal. */
  const finish=txt=>{ if(!live||sent) return; sent=true; stopAll(); sfx('release'); onText(txt); };
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){ try{
      myRec=new SR(); rec=myRec;
      myRec.lang='en-US'; myRec.interimResults=true; myRec.continuous=true;
      myRec.onresult=e=>{ let f2='', iv='';
        for(let i=0;i<e.results.length;i++){
          if(e.results[i].isFinal) f2+=e.results[i][0].transcript; else iv+=e.results[i][0].transcript; }
        if(f2) heard=f2;
        if(f2||iv) lastAt=Date.now();
        showTranscript(heard.trim(),iv.trim()); };
      myRec.onerror=ev=>{
        const err=ev&&ev.error;
        if(err==='not-allowed'||err==='service-not-allowed'){
          /* no mic permission: drop to typing rather than sit on a dead recorder */
          stopAll(); dockMode='type'; dockInput(onText); }
        /* no-speech, aborted, network: onend will restart us */ };
      /* continuous recognition still ends itself on a pause - restart or we look frozen */
      myRec.onend=()=>{ if(live&&!sent){ try{ myRec.start(); }catch(e){} } };
      myRec.start(); listening=true;
    }catch(e){} }
  /* voice-first: stop talking and it moves on by itself */
  idle=setInterval(()=>{
    if(!live||sent) return;
    if(heard.trim() && Date.now()-lastAt>1700) finish(heard.trim());
  },250);
  cancel.onclick=()=>{ if(!live)return; stopAll(); sfx('tick'); dockInput(onText); };
  send.onclick=()=>{ finish(heard.trim()||'__voice__'); };
}

let shown={}, keys={}, queue=[], scanning=false, boardLive=false;
/* Each sentence loads itself: a skeleton with a green shine, then it resolves.
   The container never flashes, only the row that is arriving. */
const SKW=[[5,9,4],[6,4,8],[4,7],[7,5,6],[5,4],[6,7]];
function skeleton(o){
  const r=mk('div','vbs sk'); r.dataset.o=String(o);
  (SKW[o]||[6,5]).forEach(ch=>{ const b=mk('span','skb'); b.style.width=ch+'ch'; r.appendChild(b); });
  return r;
}
function placeRow(host,row,o){
  const after=[...host.children].find(r=>+r.dataset.o>o);
  if(after) host.insertBefore(row,after); else host.appendChild(row);
}
function spring(row){
  const bits=row.querySelectorAll('.vbc, .vbl, .vbq');
  safeTL(gsap.timeline()
    .fromTo(row,{opacity:0,y:8},{opacity:1,y:0,duration:.45})
    .fromTo(bits,{scale:.78,opacity:0},{scale:1,opacity:1,duration:.48,stagger:.08,ease:'back.out(1.7)'},'-=.28'),1500);
}
function pump(){
  if(scanning||!queue.length) return;
  scanning=true;
  queue.sort((a,b)=>a.o-b.o);
  const item=queue.shift();
  const host=$('vbg'+(item.g||0)); if(!host){ scanning=false; return; }
  const sk=skeleton(item.o);
  placeRow(host,sk,item.o);
  safeTL(gsap.timeline().fromTo(sk,{opacity:0,y:10},{opacity:1,y:0,duration:.35}),700);
  sfx('loading');
  let done=false;
  const resolve=()=>{
    if(done) return; done=true;
    const row=mk('div','vbs'); row.dataset.o=String(item.o); row.dataset.id=item.id;
    row.innerHTML=item.html();
    if(sk.isConnected) host.replaceChild(row,sk); else placeRow(host,row,item.o);
    spring(row);
    sfx('droplet');
    setTimeout(()=>{ scanning=false; pump(); },620);
  };
  setTimeout(resolve,1150);
}
/* a sentence already on the board can change: the name arriving rewrites the first line */
function morphRow(x){
  const vb=$('vb'); if(!vb) return;
  const row=vb.querySelector('.vbs[data-id="'+x.id+'"]');
  /* still waiting its turn in the queue: it will render with the newer words anyway */
  if(!row){ if(!queue.some(q2=>q2.id===x.id)) shown[x.id]=0; return; }
  safeTL(gsap.timeline().to(row,{opacity:.25,duration:.22}),400);
  setTimeout(()=>{
    row.innerHTML=x.html(); gsap.set(row,{opacity:1});
    const bits=row.querySelectorAll('.vbc, .vbl, .vbq');
    safeTL(gsap.timeline().fromTo(bits,{scale:.7,opacity:0},
      {scale:1,opacity:1,duration:.5,stagger:.07,ease:'back.out(1.8)'}),1400);
    sfx('sparkle');
  },240);
}

}

let drawInit=false;
function showDraw(){
  const d=$('drawScreen'); d.style.display='flex';
  safeTL(gsap.timeline()
    .fromTo(d,{opacity:0},{opacity:1,duration:.55},0)
    .fromTo('.dcenter',{scale:.94,opacity:0},{scale:1,opacity:1,duration:.7,ease:EIO},.1),1400);
  if(drawInit) return; drawInit=true;
  const cv=$('drawCanvas'), ctx=cv.getContext('2d');
  let pts=[], down=false, len=0, W=11;
  function size(){ const dpr=devicePixelRatio||1;
    if(!innerWidth||!innerHeight) return; /* hidden or prerendered, try again later */
    cv.width=innerWidth*dpr; cv.height=innerHeight*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.lineCap='round'; ctx.lineJoin='round'; }
  size(); addEventListener('resize',size);
  /* A real brush: the stroke is a filled ribbon whose width breathes with speed.
     Slow hand means the nib dwells and ink pools. Fast hand starves it. */
  function ribbon(a,b,wa,wb){
    const ang=Math.atan2(b.y-a.y,b.x-a.x);
    const n1=ang+Math.PI/2, n2=ang-Math.PI/2;
    ctx.beginPath();
    ctx.moveTo(a.x+Math.cos(n1)*wa/2, a.y+Math.sin(n1)*wa/2);
    ctx.lineTo(b.x+Math.cos(n1)*wb/2, b.y+Math.sin(n1)*wb/2);
    ctx.lineTo(b.x+Math.cos(n2)*wb/2, b.y+Math.sin(n2)*wb/2);
    ctx.lineTo(a.x+Math.cos(n2)*wa/2, a.y+Math.sin(n2)*wa/2);
    ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(b.x,b.y,wb/2,0,7); ctx.fill();
  }
  function inkSeg(){
    const n=pts.length; if(n<2) return;
    const a=pts[n-2], b=pts[n-1];
    const d2=Math.hypot(b.x-a.x,b.y-a.y), dt=Math.max(1,b.t-a.t);
    const speed=d2/dt;
    const target=Math.max(INK.min,Math.min(INK.max,INK.max-speed*INK.sens));
    const prev=W;
    W+=(target-W)*.22;
    ctx.fillStyle=INK.color;
    ctx.globalAlpha=1;
    ribbon(a,b,prev,W);
    /* wetness: a slow nib bleeds. Stamp sparsely, or overlapping alphas moire. */
    if(INK.wet>0 && speed<0.3 && n%4===0){
      ctx.globalAlpha=INK.wet;
      ctx.beginPath(); ctx.arc(b.x,b.y,W*0.58,0,7); ctx.fill();
      ctx.globalAlpha=1;
    }
  }
  function clearInk(){ ctx.save(); ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,cv.width,cv.height); ctx.restore(); }
  cv.addEventListener('pointerdown',e=>{ down=true; len=0; W=INK.max*0.5; AUD.penStart();
    if(!cv.width) size();
    pts=[{x:e.clientX,y:e.clientY,t:performance.now()}];
    ctx.fillStyle=INK.color;
    ctx.beginPath(); ctx.arc(e.clientX,e.clientY,W/2,0,7); ctx.fill(); });
  cv.addEventListener('pointermove',e=>{ if(!down)return;
    const p={x:e.clientX,y:e.clientY,t:performance.now()}, q2=pts[pts.length-1];
    const d2=Math.hypot(p.x-q2.x,p.y-q2.y);
    if(d2<2.5) return;
    AUD.penMove(d2/Math.max(1,p.t-q2.t));
    len+=d2; pts.push(p); inkSeg(); });
  const fin=()=>{ if(!down)return; down=false; AUD.penStop();
    /* the zero must close: start and end land near each other */
    const a=pts[0], b=pts[pts.length-1];
    let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
    pts.forEach(pp=>{ minx=Math.min(minx,pp.x); miny=Math.min(miny,pp.y);
      maxx=Math.max(maxx,pp.x); maxy=Math.max(maxy,pp.y); });
    const diag=Math.hypot(maxx-minx,maxy-miny);
    const closed=len>250 && Math.hypot(b.x-a.x,b.y-a.y)<Math.max(80,diag*INK.tol);
    if(closed) accept();
    else { sfx('tick');
      gsap.to(cv,{opacity:0,duration:.4});
      setTimeout(()=>{ clearInk(); gsap.set(cv,{opacity:1}); },450); } };
  cv.addEventListener('pointerup',fin); cv.addEventListener('pointercancel',fin);
  cv.addEventListener('dblclick',()=>accept(true));
  addEventListener('keydown',e=>{ if(e.key==='Enter'&&$('drawScreen').style.display!=='none') accept(true); });
  let accepted=false;
  window.__acceptDraw=()=>accept(true);
  function accept(skip){
    if(accepted) return; accepted=true;
    AUD.penStop(); AUD.whoosh();
    /* the ink swells until it floods the whole screen, then the world goes dark */
    gsap.to('#dH',{opacity:0,y:-10,duration:.35});
    if(!skip&&pts.length>2){
      const obj={w:W};
      const cover=Math.hypot(innerWidth,innerHeight)*2.2;
      const redraw=()=>{ ctx.fillStyle=INK.color; ctx.globalAlpha=1;
        for(let i=1;i<pts.length;i++) ribbon(pts[i-1],pts[i],obj.w,obj.w);
        ribbon(pts[pts.length-1],pts[0],obj.w,obj.w); };
      safeTL(gsap.timeline().to(obj,{w:cover,duration:1.15,ease:'power3.in',onUpdate:redraw}),1900);
    }
    /* the charge rides out with the ink as it sweeps itself shut: a soft
       anticipation ahead of the dark, never a hard ring */
    const d=$('drawScreen');
    let flipped=false;
    const flip=()=>{
      if(flipped) return; flipped=true;
      document.body.classList.add('dark');
      d.style.background='#0E0E10';
    };
    setTimeout(()=>{
      const en=mk('div','energ'); document.body.appendChild(en);
      const o={p:0};
      const paint=()=>{
        const r1=o.p*150;
        const r2=Math.max(0,(o.p-.38)/.62)*150;
        en.style.setProperty('--r1',r1.toFixed(1)+'%');
        en.style.setProperty('--r2',r2.toFixed(1)+'%');
      };
      en.style.setProperty('--r1','0%'); en.style.setProperty('--r2','0%');
      safeTL(gsap.timeline()
        .to(en,{opacity:.5,duration:.34,ease:'power2.out'},0)
        .to(o,{p:1,duration:1.5,ease:'power2.out',onUpdate:paint},0)
        .to(en,{opacity:0,duration:.5,ease:'power2.in'},1.05),2600);
      setTimeout(()=>{ if(en.isConnected) en.remove(); },2300);
    }, skip?120:300);
    setTimeout(flip, skip?420:1180);
    setTimeout(()=>{ gsap.to(d,{opacity:0,duration:.6}); }, skip?520:1320);
    setTimeout(()=>{ d.style.display='none'; introStage(); }, skip?900:1780);
  }
}

function tierOf(co){ return (TIERS[PKEY]||TIERS.design)[co]||null; }
/* the ones they named in the first answer come first, already chosen */
function listingDeck(){
  const all=(LISTINGS[PKEY]||LISTINGS.design).slice();
  const want=dreamList();
  const pinned=all.filter(r=>want.indexOf(r[0])>=0);
  const rest=all.filter(r=>want.indexOf(r[0])<0);
  return pinned.concat(rest);
}
/* the aim is the tier holding most of the picks, ties resolve upward */
function aimTier(){
  const n={S:0,A:0,B:0};
  P.picks.forEach(r=>{ const t=tierOf(r[0]); if(t) n[t]++; });
  if(n.S>=n.A&&n.S>=n.B&&n.S) return 'S';
  if(n.A>=n.B&&n.A) return 'A';
  return n.B?'B':'A';
}
/* Fifty-plus roles, built from real titles at real companies. Grouped so the
   eye lands on a family first, filtered so the list never reads as a wall. */
const TITLES={
  design:[['Product Designer','mid'],['Senior Product Designer','senior'],['UX Designer','mid'],
    ['UI Designer','mid'],['Design Engineer','mid'],['Brand Designer','mid'],
    ['Design Systems Designer','mid'],['UX Researcher','mid'],['Motion Designer','mid'],
    ['Staff Product Designer','staff']],
  swe:[['Software Engineer','mid'],['Senior Software Engineer','senior'],['Full Stack Engineer','mid'],
    ['Frontend Engineer','mid'],['Backend Engineer','mid'],['Product Engineer','mid'],
    ['Infrastructure Engineer','mid'],['Machine Learning Engineer','mid'],
    ['Member of Technical Staff','mid'],['Staff Engineer','staff']],
  ba:[['Business Analyst','mid'],['Senior Business Analyst','senior'],['Data Analyst','mid'],
    ['Strategy Analyst','mid'],['Product Analyst','mid'],['Analytics Engineer','mid'],
    ['Operations Analyst','mid'],['Revenue Analyst','mid'],['Insights Analyst','mid'],
    ['Strategy and Ops Manager','senior']]
};
const POOL_COS=['Figma','Airbnb','Apple','Google','OpenAI','Stripe','Linear','Notion',
  'Spotify','Netflix','Microsoft','Vercel','Shopify','Salesforce','Snowflake','Datadog','HubSpot','Adobe'];
const SEN_LABEL={mid:'Mid-level',senior:'Senior',staff:'Staff'};
const BAND={ S:{mid:[155,205],senior:[190,245],staff:[230,300]},
             A:{mid:[135,175],senior:[165,210],staff:[200,255]},
             B:{mid:[115,150],senior:[140,180],staff:[170,215]} };
function rolePool(){
  const fam=TITLES[PKEY]||TITLES.design, out=[];
  fam.forEach((t,ti)=>{
    POOL_COS.forEach((co,ci)=>{
      const tier=tierOf(co); if(!tier) return;
      if((ti+ci)%3!==0) return;
      const b=BAND[tier][t[1]];
      out.push([co,t[0],SEN_LABEL[t[1]],'$'+b[0]+'k - $'+b[1]+'k',tier,t[1]]);
    });
  });
  /* interleave the titles so the first screen is a spread, not one role six times */
  const byTitle={};
  out.forEach(r=>{ (byTitle[r[1]]=byTitle[r[1]]||[]).push(r); });
  const names=Object.keys(byTitle), mixed=[];
  let more=true;
  for(let i=0; more; i++){
    more=false;
    names.forEach(n=>{ if(byTitle[n][i]){ mixed.push(byTitle[n][i]); more=true; } });
  }
  return mixed;
}

function tierStage(){
  const t=aimTier();

                :'Your picks sit at B tier. Is that right?';
  const {box}=turn({q:q});
  P.aimTier=t;
  const up=t==='S'?['plus','Add a backup or two','back']:['spark','I want to aim higher','up'];
  choices(box,[['check',"Yes, that's the aim",'yes'],up],async v=>{
    if(v==='up'){ P.aimTier=t==='B'?'A':'S'; }
    await reflect(said(P.aimTier+' tier it is'));
    afterCommit(()=>go(nextAlign));
  },{pill:true,nomorph:true});

/* Phase 3 is the hinge. Before it they were talking, after it Zero is showing.
   The handshake in between is Zero proving it listened, in their own terms. */
const CO_PHRASE={ 'Startup':'somewhere small and fast','Scale-up':'somewhere growing fast',
  'Big tech':'somewhere big','Agency':'in an agency' };
const TIME_PHRASE={ 'Now':'And you want it now.','In 3 months':'Inside three months.',
  'This year':'This year.','No rush':'No rush on the timing.' };
const upper=x=>x?x.charAt(0).toUpperCase()+x.slice(1):x;
function summaryBeats(){
  const out=[];
  if(P.role) out.push('You, aiming at '+P.role+'.');
  const place=[];
  if(P.company) place.push(CO_PHRASE[P.company]||low(P.company));
  if(P.industry) place.push('in '+low(SHORT[P.industry]||P.industry));
  if(place.length) out.push(upper(place.join(', '))+'.');
  const where=cityList(P.citynext)[0]||P.location;
  const tail=[];
  if(P.problems) tail.push('chasing '+low(P.problems));
  if(where) tail.push('from '+where);
  if(tail.length) out.push(upper(tail.join(', '))+'.');
  if(P.timeline&&TIME_PHRASE[P.timeline]) out.push(TIME_PHRASE[P.timeline]);
  return out.filter(x=>x&&x.length<=58);
}
async function synthStage(){

  lineDots('Reading everything you said');
  shiftLeft('56vw');
  safeTL(gsap.timeline().to('.right',{width:'56%',duration:.9,ease:EIO}),2200);
  sfx('loading');
  await wait(900);
  await analysing();
  /* lights on: the dark listening phase ends where the path begins */
  const veil=mk('div','veil'); document.body.appendChild(veil);
  veil.style.background='radial-gradient(circle at 50% 50%, #FFFFFF 0%, #F2FBEA 45%, #FAFAF9 100%)';
  safeTL(gsap.timeline().to(veil,{opacity:1,duration:.5,ease:'power2.in'}),900);
  await wait(520);
  document.body.classList.remove('dark'); sfx('bloom');
  safeTL(gsap.timeline().to(veil,{opacity:0,duration:.75,ease:'power2.out'}),1200);
  setTimeout(()=>{ if(veil.isConnected) veil.remove(); },1000);
  await swapPanel('Your vision board',s2=>{ s2.classList.add('ctr');
    const vb=mk('div','vb'); vb.id='vb';
    vb.innerHTML=boardHTML(); s2.appendChild(vb); boardLive=true; $('paper').classList.add('canvas');
    /* out of the blur, one line at a time, and then the light passes over it */
    safeTL(gsap.timeline().fromTo(vb.querySelectorAll('.vbs'),
      {opacity:0,y:20,filter:'blur(16px)',scale:1.04},
      {opacity:1,y:0,filter:'blur(0px)',scale:1,duration:.85,stagger:.16,ease:'power3.out'}),3000); },false);
  setTimeout(()=>sheen(document.querySelector('.shell'),1.45),1300);
  sfx('ready');
  await wait(1500);
  /* the board is up. Now Zero says it back, one short beat at a time. */
  await reflect(P.name?"Okay, "+P.name+". Here's what I've got.":"Here's what I've got.",1800);
  const beats=summaryBeats();
  for(let i=0;i<beats.length;i++) await reflect(beats[i],1900);
  visionStage();
}
function visionStage(fromEdit){
  if(fromEdit){ swapPanel('Your vision board',s2=>{ s2.classList.add('ctr');
    const vb=mk('div','vb'); vb.id='vb';
    vb.innerHTML=boardHTML(); s2.appendChild(vb); boardLive=true; $('paper').classList.add('canvas'); },false); }
  dockHide();
  const {box}=turn({q:'Did I get this right?'});
  choices(box,[['check','That is me','ok'],['pen','Fix one thing','fix'],['plus','Add more','more']],v=>{
    if(v==='ok'){ sfx('success'); retireMeter(); boardRewards=true;
      clearTurn(); dockHide(); setTimeout(transformStage,520); }
    else if(v==='fix'){ go(editStage); }
    else { go(addMoreStage); } },{pill:true,nomorph:true});
}
/* no menu of edit options. They say what is wrong in their own words, Zero
   clears that one thing and reads the same sentence for the correction. */
function editStage(){
  const {box}=turn({q:'What should I change?'});
  let answered=false;
  const take=async text=>{
    answered=true;
    const t=(text||'').toLowerCase();
    if(/\brole\b|\bjob\b|title|position/.test(t)) P.role=null;
    if(/compan|startup|scale|big tech|agency/.test(t)) P.company=null;
    if(/dream/.test(t)) P.dream=null;
    if(/cit(y|ies)|live|based|move|relocat/.test(t)) P.citynext=null;
    if(/remote|hybrid|in person|office/.test(t)) P.workmode=null;
    if(/industr|space|sector/.test(t)) P.industry=null;
    if(/tim(e|ing)|month|year|deadline/.test(t)){ P.timeline=null; P.jobtype=null; }
    if(/problem|project|work on/.test(t)) P.problems=null;
    extractInto(text);              /* the same sentence usually carries the fix */
    renderBoard();
    await reflect(said('changed that'),1300);
    if(!ALIGN.find(a=>!a[1]())){ visionStage(true); return; }
    editReturn='vision';
    go(nextAlign);
  };
  dockInput(take);
  const g=gen;
  setTimeout(()=>{ if(answered||locked||g!==gen) return;
    chipsRow(box,['The role','The companies','Where I want to be','The timing'],take); },7000);
}

/* ============================ 16 · the transformation ============================ */
/* green, blue and yellow, thrown from wherever the good news landed */
function confetti(x,y,n){
  n=n||84; sfx('press');
  const layer=mk('div','conf'); document.body.appendChild(layer);
  const CC=['#4ADE80','#5D87FF','#F5DE6B','#A8E6CF','#0084CE','#C8F169','#FACC15'];
  for(let i=0;i<n;i++){
    const p=mk('i');
    const w=4+Math.random()*7, h=Math.random()<.25?w:9+Math.random()*13;
    p.style.cssText='left:'+(x-w/2)+'px;top:'+(y-h/2)+'px;width:'+w+'px;height:'+h+'px;'+
      'background:'+CC[i%CC.length]+';border-radius:'+(Math.random()<.22?'50%':'2px')+';';
    layer.appendChild(p);
    const ang=-Math.PI/2+(Math.random()-.5)*2.3, sp=200+Math.random()*380;
    const spin=(Math.random()<.5?-1:1)*(380+Math.random()*620);
    gsap.to(p,{x:Math.cos(ang)*sp, y:Math.sin(ang)*sp, rotation:spin,
      duration:.7+Math.random()*.45, ease:'power2.out'});
    gsap.to(p,{y:'+='+(innerHeight*.8+Math.random()*260), rotation:'+='+(spin*.6),
      duration:1.9+Math.random()*1.3, ease:'power1.in', delay:.5+Math.random()*.25});
    gsap.to(p,{opacity:0, duration:.7, delay:1.8+Math.random()*.9});
  }
  /* cleanup rides the last tween, with a wall clock backstop behind it */
  let dead=false;
  const kill=()=>{ if(dead) return; dead=true; if(layer.isConnected) layer.remove(); };
  gsap.to(layer,{opacity:1,duration:3.4,onComplete:kill});
  setTimeout(kill,9000);
}
/* a sheen passes over whatever has just become true */
function sheen(el,dur){
  if(!el) return;
  if(getComputedStyle(el).position==='static') el.style.position='relative';
  const s2=mk('div','sheen'), i2=mk('i'); s2.appendChild(i2); el.appendChild(s2);
  const kill=()=>{ if(s2.isConnected) s2.remove(); };
  safeTL(gsap.timeline({onComplete:kill}).fromTo(i2,{left:'-60%'},
    {left:'125%',duration:dur||1.2,ease:'power2.inOut'}),(dur||1.2)*1000+700);
  setTimeout(kill,(dur||1.2)*1000+900);
}
/* The approval is the trigger. The board goes soft, the light gathers to the
   middle of the screen, a ripple opens out of it, and what comes back is the
   set of companies that hire this exact person. */
function revealSequence(onLand,onDone){
  /* the middle of the board, not the middle of the browser */
  const pr=document.querySelector('.right').getBoundingClientRect();
  const cx=pr.width?pr.left+pr.width/2:innerWidth/2;
  const cy=pr.height?pr.top+pr.height/2:innerHeight/2;
  const S=Math.min(pr.width||innerWidth,innerHeight)*0.62;
  const CLR=['#A8E6CF','#4ADE80','#C8F169','#F5DE6B'];
  const aur=$('aur'); aur.innerHTML='';
  const blobs=CLR.map(c2=>{ const b=mk('b');
    b.style.background='radial-gradient(circle at 50% 50%, '+c2+' 0%, '+c2+'00 70%)';
    aur.appendChild(b); return b; });
  const vb=$('vb');
  const R0=vb?vb.getBoundingClientRect():{left:cx-220,top:cy-170,width:440,height:340};
  const bx=R0.left+R0.width/2, by=R0.top+R0.height/2;
  blobs.forEach((b,i)=>{ const a2=(i/blobs.length)*Math.PI*2-Math.PI/4;
    gsap.set(b,{x:bx-S/2+Math.cos(a2)*R0.width*.52, y:by-S/2+Math.sin(a2)*R0.height*.5,
      scale:.45, opacity:0}); });

  const core=mk('div','core'); document.body.appendChild(core);
  gsap.set(core,{scale:.2,left:cx-85,top:cy-85,margin:0});
  const rip=$('rip'); rip.innerHTML=''; rip.style.display='block';
  const rings=[0,1,2].map(()=>{ const s3=mk('s'); rip.appendChild(s3); return s3; });
  gsap.set(rings,{left:cx-10,top:cy-10,margin:0});

  /* the board's own chips travel with the light */
  const layer=mk('div','zook'); document.body.appendChild(layer);
  const clones=[];
  [...document.querySelectorAll('#vb .vbc, #vb .vbl')].forEach(el=>{
    const r=el.getBoundingClientRect(); if(!r.width) return;
    const c2=el.cloneNode(true); c2.className=el.className+' zc';
    c2.style.cssText+=';position:fixed;left:'+r.left+'px;top:'+r.top+'px;font-size:'+getComputedStyle(el).fontSize+';';
    layer.appendChild(c2); clones.push({c:c2,r:r});
  });
  const names=COS();
  const tiles=names.map((n,i)=>{ const t2=mk('div','ztile',LOGO[n]||'');
    t2.style.left=(cx-37)+'px'; t2.style.top=(cy-37)+'px'; layer.appendChild(t2); return t2; });
  gsap.set(tiles,{scale:0,opacity:0});

  const tl=gsap.timeline();
  /* 1 · the light blooms and the board goes soft */
  tl.set(aur,{opacity:1})
    .to(blobs,{scale:1,opacity:.92,duration:.85,stagger:.08,ease:'power2.out'},0)
    .to(vb,{filter:'blur(15px)',scale:1.06,opacity:.5,duration:1.0,ease:EIO},.18);
  /* 2 · zook, zook, zook: every chip it wrote is pulled into the middle */
  clones.forEach((o,i)=>{
    tl.to(o.c,{x:cx-o.r.left-o.r.width/2, y:cy-o.r.top-o.r.height/2, scale:.5,
      rotate:(i%2?8:-8), filter:'blur(3px)', duration:.5, ease:'power4.in'}, .3+i*.06);
    tl.call(()=>sfx('tick'),null,.3+i*.06+.46);
  });
  const tZ=.3+clones.length*.06+.5;
  /* 3 · everything gathers and ignites */
  tl.to(blobs,{x:cx-S/2,y:cy-S/2,scale:.36,duration:.95,ease:'power3.inOut'},tZ-.35)
    .to(vb,{opacity:0,duration:.4},tZ-.3)
    .to(core,{opacity:1,scale:1,duration:.55,ease:'power2.out'},tZ)
    .to(clones.map(o=>o.c),{opacity:0,scale:.2,filter:'blur(10px)',duration:.45,ease:'power2.in'},tZ)
    .call(()=>sfx('bloom'),null,tZ);
  /* 4 · a ripple opens out of it */
  rings.forEach((s3,i)=>{
    tl.fromTo(s3,{scale:0,opacity:.9},{scale:38,opacity:0,duration:1.6,ease:'power2.out'},tZ+.35+i*.2); });
  tl.to(core,{scale:1.45,opacity:.25,duration:.7,ease:'power2.out'},tZ+.5);
  /* 5 · and it comes back as the companies */
  const R=Math.max(140,Math.min(pr.width||innerWidth,innerHeight)*0.30);
  const tB=tZ+.72;
  tiles.forEach((t2,i)=>{
    const a2=(i/tiles.length)*Math.PI*2-Math.PI/2;
    tl.fromTo(t2,{scale:0,opacity:0,filter:'blur(12px)'},
      {x:Math.cos(a2)*R, y:Math.sin(a2)*R, scale:1, opacity:1, filter:'blur(0px)',
       rotate:(i%2?9:-9), duration:.85, ease:'back.out(1.5)'}, tB+i*.06); });
  const tS=tB+tiles.length*.06+.6;
  tl.to(tiles,{rotate:0,scale:1.06,duration:.5,ease:'sine.inOut'},tS)
    .to(core,{opacity:0,duration:.5},tS)
    .to(blobs,{opacity:.35,scale:.9,duration:.8},tS);

  let landed=false, fired=false;
  const land=()=>{ if(landed) return; landed=true; sfx('page');
    if(onLand) onLand();
    setTimeout(()=>sheen(document.querySelector('.shell'),1.35),320); };
  const finish=()=>{ land(); if(fired) return; fired=true;
    if(layer.isConnected) layer.remove();
    if(core.isConnected) core.remove();
    rip.style.display='none'; rip.innerHTML='';
    gsap.to(aur,{opacity:0,duration:.6,onComplete:()=>{aur.innerHTML='';}});
    if(onDone) onDone(); };
  tl.call(land,null,tS+.4)
    .to(tiles,{x:0,y:0,scale:.35,opacity:0,filter:'blur(9px)',duration:.8,ease:EIO,stagger:.035},tS+.5);
  tl.eventCallback('onComplete',finish);
  /* a throttled tab freezes the ticker, so the clock guarantees both handoffs */
  setTimeout(land,(tS+.4)*1000+700);
  setTimeout(finish,(tS+1.5)*1000+900);
}

/* the line runs between the nodes, not past them */
function fitRail(){
  const wrap=$('tlWrap'), row=$('tlRow'); if(!wrap||!row) return;
  const rail=wrap.querySelector('.tlrail'); if(!rail) return;
  const nodes=[...row.querySelectorAll('.nd')];
  if(nodes.length<2){ rail.style.opacity='0'; return; }
  rail.style.opacity='1';
  const wr=wrap.getBoundingClientRect();
  const f=nodes[0].getBoundingClientRect(), l=nodes[nodes.length-1].getBoundingClientRect();
  if(row.classList.contains('vert')){
    rail.style.left='0'; rail.style.right='auto';
    rail.style.top=Math.round(f.top+f.height/2-wr.top)+'px';
    rail.style.bottom=Math.round(wr.bottom-(l.top+l.height/2))+'px';
  } else {
    rail.style.top='16px'; rail.style.bottom='auto';
    rail.style.left='0'; rail.style.right='0';
  }
}

function placeShort(){
  const all=cityList(P.citynext).filter(Boolean);
  const list=all.length?all:[P.location].filter(Boolean);
  if(!list.length) return 'Anywhere';
  if(list.length<=2) return list.join(' and ');
  return list.slice(0,2).join(', ')+' +'+(list.length-2);
}

  ['Persona',    ()=>personaPick()],
  ['Draw ZERO',  ()=>{ $('drawScreen').style.display='flex'; gsap.set('#drawScreen',{opacity:1});
                       gsap.set('#dH',{opacity:1,y:0}); }],

/* what each step would have produced, so any step can be entered cold */
function dbgFill(upTo){
  const d=pack();
  /* the stepper has to be able to go backwards. Without this P only ever grows,
     so an earlier step shows a fuller board than it should. */
  Object.keys(P).forEach(k=>{ P[k]= k==='picks' ? [] : null; });
  const set=(i,fn)=>{ if(upTo>i) fn(); };
  set(3,()=>P.name='Sanjay');
  set(4,()=>{ P.about='I want to be doing product design at a startup'; });
  set(5,()=>P.level='Student');
  set(6,()=>P.doing='Final year design, Mumbai');
  set(7,()=>{ P.picks=(LISTINGS[PKEY]||LISTINGS.design).slice(0,3);
    P.dream=P.picks.map(r=>r[0]).join(', '); P.role=P.picks[0][1]; P.company='Big tech'; });
  set(8,()=>P.aimTier=aimTier());
  set(9,()=>P.industry='Tech and AI');
  set(10,()=>P.problems=d.problemChips[0]);
  set(11,()=>P.timeline='This year');
  set(12,()=>P.why='I want to prove I can do it');
  set(16,()=>{ P.aim=d.roles[0][0]; P.role=P.aim; });
  set(17,()=>P.linked='LinkedIn');
}
let dbgAt=0;
function dbgGoto(i){
  i=Math.max(0,Math.min(DBG_STEPS.length-1,i));
  dbgAt=i;
  /* nothing from the last step gets to finish */
  gen++;
  try{ gsap.killTweensOf(['#col','#scroll','.right','#dock','#dtr','#top','#aur','#paper','#turn']); }catch(e){}
  locked=false; editReturn=null; scanning=false; queue.length=0; shown={}; keys={}; tlMode='h';
  const t0=$('turn'); if(t0) t0.remove();
  $('col').innerHTML=''; $('dockIn').innerHTML='';
  gsap.set('#dock',{opacity:0}); gsap.set('#dtr',{opacity:0}); $('dtr').innerHTML='';
  stopRec();
  document.querySelectorAll('.zook,.conf,.core,.veil,.sheen,.gh').forEach(n=>n.remove());
  $('rip').style.display='none'; $('rip').innerHTML='';
  $('aur').innerHTML=''; gsap.set('#aur',{opacity:0});
  gsap.set(['#logoPill','.tr'],{opacity:i>=2?1:0,y:0});
  if(i!==1) $('drawScreen').style.display='none';
  document.body.classList.toggle('dark', i>=2&&i<=13);
  $('col').innerHTML='';
  dbgFill(i);
  /* the panel exists from the moment Zero starts writing things down */
  const wide=i>=13;
  if(i>=5){
    panelBorn=true; boardLive=true;
    gsap.set('.right',{width:wide?'56%':'40%',opacity:1,x:0});
    shiftLeft(wide?'56vw':'40vw');
    $('cap').innerHTML='<span class="live pulse"></span>'+(wide?'Your vision board':'Zero is listening');
    const sc=$('scroll'); sc.className='scroll ctr'; sc.innerHTML='';
    const vb=mk('div','vb'); vb.id='vb'; vb.innerHTML=boardHTML(); sc.appendChild(vb);
    SENTENCES().forEach(x=>{ if(x.ready){ shown[x.id]=1; keys[x.id]=x.key; } });
    meterRetired=i>14; boardRewards=i>14;
    renderMeter();
  } else {
    panelBorn=false; boardLive=false;
    gsap.set('.right',{width:0,opacity:0}); shiftLeft('0px');
  }
  setPhase(i<14?0:(i<17?1:(i<19?2:(i<20?3:4))));
  const lbl=$('dbgStep'); if(lbl) lbl.textContent=(i+1)+'. '+DBG_STEPS[i][0];
  const pv=$('dbgPrev'), nx=$('dbgNext');
  if(pv) pv.disabled=i<=0;
  if(nx) nx.disabled=i>=DBG_STEPS.length-1;
  fastMode=true;
  try{ DBG_STEPS[i][1](); }catch(e){ console.warn('step',i,e); }
  /* long enough for the stage to paint, short enough that the narration still plays */
  clearTimeout(dbgGoto._t);
  dbgGoto._t=setTimeout(()=>{ fastMode=false; },900);
}
(function(){
  const pv=$('dbgPrev'), nx=$('dbgNext'), st=$('dbgStep'), gr=$('dbgBtn');
  pv.className='dbgnav flip'; pv.innerHTML=I.arrow;
  nx.className='dbgnav'; nx.innerHTML=I.arrow;
  gr.innerHTML=I.gear;
  pv.onclick=()=>{ sfx('tick'); dbgGoto(dbgAt-1); };
  nx.onclick=()=>{ sfx('tick'); dbgGoto(dbgAt+1); };
  st.onclick=()=>{ sfx('tick'); dbgGoto(0); };
  st.textContent='1. Persona';
  addEventListener('keydown',e=>{
    if(document.activeElement&&document.activeElement.tagName==='INPUT') return;
    if(e.key==='ArrowRight'){ dbgGoto(dbgAt+1); }
    if(e.key==='ArrowLeft'){ dbgGoto(dbgAt-1); }
  });
})();

/* ---- tuning drawer (debug, prototype only) ---- */
/* grouped, so only the thing you are tuning is open */
(function(){
  const panel=$('dbgPanel'), btn=$('dbgBtn');
  let openSec=null;
  function section(title){
    const sec=mk('div','dbgsec');
    const h=mk('button','dbgh');
    h.appendChild(mk('span',null,title));
    h.appendChild(mk('span','cv',I.arrow));
    const body=mk('div','dbgbody');
    sec.appendChild(h); sec.appendChild(body); panel.appendChild(sec);
    h.onclick=()=>{
      const isOpen=sec.classList.contains('open');
      if(openSec) openSec.classList.remove('open');
      if(isOpen){ openSec=null; }
      else { sec.classList.add('open'); openSec=sec;
        safeTL(gsap.timeline().fromTo(body.children,{opacity:0,y:8},
          {opacity:1,y:0,duration:.34,stagger:.035}),1200); }
      sfx('tick');
    };
    return body;
  }
  function range(body,label,min,max,step,get,set){
    const r=mk('div','dbgrow');
    const lb=mk('div','lb');
    lb.appendChild(mk('span',null,label));
    const val=mk('span','val',String(get()));
    lb.appendChild(val); r.appendChild(lb);
    const inp=document.createElement('input'); inp.type='range';
    inp.min=min; inp.max=max; inp.step=step; inp.value=get();
    inp.oninput=()=>{ set(parseFloat(inp.value)); val.textContent=inp.value; };
    r.appendChild(inp); body.appendChild(r);
  }
  function swatch(body,label,get,set){
    const r=mk('div','dbgrow flat');
    const lb=mk('div','lb'); lb.appendChild(mk('span',null,label)); r.appendChild(lb);
    const inp=document.createElement('input'); inp.type='color'; inp.value=get();
    inp.oninput=()=>set(inp.value);
    r.appendChild(inp); body.appendChild(r);
  }
  function toggle(body,label,get,set){
    const r=mk('div','dbgrow flat');
    const lb=mk('div','lb'); lb.appendChild(mk('span',null,label)); r.appendChild(lb);
    const inp=document.createElement('input'); inp.type='checkbox'; inp.checked=get();
    inp.onchange=()=>set(inp.checked);
    r.appendChild(inp); body.appendChild(r);
  }

  const draw=section('Draw ZERO');
  range(draw,'Ink max',20,180,2,()=>INK.max,v=>INK.max=v);
  range(draw,'Ink min',4,90,2,()=>INK.min,v=>INK.min=v);
  range(draw,'Speed thin',0,80,2,()=>INK.sens,v=>INK.sens=v);
  range(draw,'Wetness',0,.5,.02,()=>INK.wet,v=>INK.wet=v);
  range(draw,'Close tolerance',.1,.7,.05,()=>INK.tol,v=>INK.tol=v);
  swatch(draw,'Ink colour',()=>INK.color,v=>INK.color=v);

  const board=section('Vision board');
  range(board,'Text size',14,34,1,
    ()=>parseInt(getComputedStyle(document.documentElement).getPropertyValue('--vbfs'))||22,
    v=>document.documentElement.style.setProperty('--vbfs',v+'px'));

  const motion=section('Motion');
  range(motion,'Speed',.25,2,.05,()=>1,v=>gsap.globalTimeline.timeScale(v));

  const theme=section('Theme');
  toggle(theme,'Dark mode',()=>document.body.classList.contains('dark'),
    v=>document.body.classList.toggle('dark',v));

  btn.onclick=()=>{ panel.classList.toggle('open'); sfx('tick'); };
})();
