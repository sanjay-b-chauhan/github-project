/* ------------------------------------------------------------------ roles --
   Every card states how close it is and why. The tier is computed from the
   same evidence the read-out used, so a role cannot claim to be a direct fit
   on an axis the user never actually settled. */
const JTIERS=[[5,'DIRECT FIT'],[4,'STRONG FIT'],[3,'CLOSE'],[2,'ADJACENT'],[1,'A STRETCH']];
const JPOOL=[
 {co:'OpenAI',role:'Product Designer',where:'Remote Canada / US',yrs:'1-4 years',
  edge:'you said AI was the thing pulling you, and this is the room where that gets decided',
  d:'Make powerful AI clear and useful through thoughtful, trustworthy product experiences.',
  t:{type:'ai_frontier',ethos:'frontier',world:'b2c',shape:'collaborative',domain:'ai_interaction',city:'toronto'}},
 {co:'Anthropic',role:'Product Designer',where:'Remote Canada / US',yrs:'2-5 years',
  edge:'you want to solve real problems, and making a model legible to a person is about as real as it gets',
  d:'Design the surfaces where people and models actually meet, and keep them legible.',
  t:{type:'ai_frontier',ethos:'frontier',world:'b2c',shape:'collaborative',domain:'ai_interaction',city:'toronto'}},
 {co:'Figma',role:'Product Designer',where:'Toronto',yrs:'1-4 years',
  edge:'you already work in this tool every day, and here you would be designing the thing itself',
  d:'Design tools that let a whole team move through one file without stepping on each other.',
  t:{type:'saas',ethos:'frontier',world:'b2b',shape:'collaborative',domain:'team_tools',city:'toronto'}},
 {co:'Shopify',role:'Product Designer',where:'Toronto',yrs:'1-3 years',
  edge:'you wanted work people actually use, and every merchant on it is a real business',
  d:'Help independent merchants run a business with confidence, not just a storefront.',
  t:{type:'commerce',ethos:'established',world:'b2b',shape:'collaborative',domain:'team_tools',city:'toronto'}},
 {co:'Notion',role:'Product Designer',where:'Remote',yrs:'2-4 years',
  edge:'you came from graphic design, and this is where craft still shows on the surface',
  d:'Make a blank page feel like a starting point instead of a demand.',
  t:{type:'saas',ethos:'frontier',world:'b2c',shape:'individual',domain:'creator_tools',city:'new_york'}},
 {co:'Stripe',role:'Product Designer',where:'New York',yrs:'2-5 years',
  edge:'you like problems with a right answer, and money is the least forgiving of them',
  d:'Show businesses what is happening to their money, plainly.',
  t:{type:'saas',ethos:'frontier',world:'b2b',shape:'collaborative',domain:'team_tools',city:'new_york'}}
];
/* Reasons name the axis AND the evidence behind it, so a claim can be checked.
   An axis the rounds never settled contributes nothing rather than a guess. */
const JREASON={
  type:{ai_frontier:'the AI-first companies you kept picking',commerce:'the consumer businesses you leaned to',
        saas:'the tools-for-teams world you chose',creator:'the creative tools you chose',impact:'the mission work you chose'},
  ethos:{frontier:'ambitious teams over established scale',established:'proven scale over frontier bets'},
  world:{b2c:'products people use directly',b2b:'teams and the systems behind them'},
  shape:{collaborative:'work that moves with a team',individual:'work you can finish yourself'},
  domain:{ai_interaction:'AI interaction problems',team_tools:'team tooling problems',
          everyday_utility:'everyday utility problems',learning:'learning problems',creator_tools:'creator tooling problems'}
};
function jscore(job){
  let hit=0, tot=0; const why=[];
  JORDER.forEach(k=>{
    /* an axis the rounds never settled proves nothing - unless the user
       went and set it themselves on screens 01-06, which is stronger */
    if(rconf(k)<.25 && !pstated(k)) return;
    tot++;
    if(presolve(k)===job.t[k]){ hit++;
      const r=JREASON[k]&&JREASON[k][job.t[k]]; if(r) why.push(r); }
  });
  const loc=presolve('location')||[];
  const li=loc.indexOf(job.t.city);
  if(loc.length){ tot++; if(li===0){ hit++; why.push('the city you ranked first'); }
                  else if(li===1){ hit+=.5; why.push('your second city'); } }
  const ratio=tot?hit/tot:.5;
  const tier=ratio>=.85?5:ratio>=.68?4:ratio>=.5?3:ratio>=.3?2:1;
  return {tier:tier, why:why.slice(0,3)};
}
/* Reasons are ordered most specific first. Ethos and world are true of half
   the pool, so leading with them made every tile say the same sentence - the
   thing that killed the screen. Domain and company type actually separate. */
const JORDER=['domain','type','world','shape','ethos'];
function jcard(job){
  const sc=jscore(job);
  const label=(JTIERS.find(t=>t[0]===sc.tier)||JTIERS[2])[1];
  const c=mk('div','jrc');
  c.style.setProperty('--tint',(typeof RTINT!=='undefined'&&RTINT[job.co])||'#c9a227');
  c.appendChild(mk('span','jrtint'));

  /* logo and fit share a row, so the badge can never land on the name */
  const top=mk('div','jrtop');
  const fit=mk('div','jrfit'+(sc.tier>=4?' jrbest':''));
  const bar=mk('span','jrbar');
  for(let i=1;i<=5;i++){ const b=mk('i'); if(i<=sc.tier) b.className='on'; bar.appendChild(b); }
  fit.appendChild(bar);
  fit.appendChild(mk('span','jrfl',label));
  top.appendChild(mk('span','jrlogo',rlogo(job.co)));
  top.appendChild(fit);
  c.appendChild(top);
  c.appendChild(mk('div','jrco',job.co));
  c.appendChild(mk('div','jrrole',job.role));
  c.appendChild(mk('div','jrm',job.where+' · '+job.yrs));

  const make=mk('div','jrmake');
  make.appendChild(mk('div','jrml','What you would make'));
  make.appendChild(mk('div','jrd',job.d));
  c.appendChild(make);

  /* Addressed to the person, and different on every tile. The job's own edge
     comes first because it is the only part that could not be said about any
     other company here; the evidence follows so the claim stays checkable. */
  const who=P.name||'you';
  const up=t=>t?t.charAt(0).toUpperCase()+t.slice(1):t;
  const bits=[];
  /* two sentences, not one run-on. The first is the thing only this company
     could claim; the second is the evidence, so the claim stays checkable. */
  if(job.edge) bits.push(up(job.edge)+'.');
  if(sc.why.length) bits.push('It lands on '+sc.why.slice(0,2).join(' and ')+'.');
  if(bits.length) c.appendChild(mk('div','jrwhy',
    '<b>Why this is you, '+who+'.</b> '+bits.join(' ')));
  return {el:c,tier:sc.tier};
}
function buildRoles(host){
  const wrap=mk('div','jr'); wrap.id='jrList';
  host.appendChild(wrap);
}
async function addRoles(){
  const host=$('jrList'); if(!host) return;

  for(const r of ranked){

let HZAT=0;
function hzscreen(host,sc){
  host.innerHTML='';
  const box=mk('div','hz');
  if(sc.kind==='url'){
    const f=document.createElement('iframe');
    f.className='hzframe'; f.setAttribute('title',sc.label||'Zero'); f.setAttribute('loading','eager');
    f.src=sc.src; box.appendChild(f);
  } else if(sc.kind==='world'){
    const f=mk('div','hzframe');
    f.style.cssText+=';background:url(zero-world.jpg) center/cover no-repeat';
    box.appendChild(f);
  } else {
    /* an honest gap beats an invented screen: these two exist only inside the
       desktop app and have not been captured yet */
    const h=mk('div','hzhold');
    h.appendChild(mk('b',null,sc.label));
    h.appendChild(mk('span',null,sc.note));
    box.appendChild(h);
  }
  host.appendChild(box);
  setCap(sc.label||'How Zero works',false);
}
function hzcopy(box,beat,host){
  const wrap=mk('div');
  if(beat.tail){
    /* the pill is part of the sentence, so it is built inline rather than
       parked in a row underneath where it would read as a control */
    const p=mk('div','hzline');
    p.style.cssText='font-size:19px;line-height:1.55;color:var(--tx-2);letter-spacing:-.015em';
    const parts=beat.tail.split(/(\$\w+)/);
    parts.forEach(seg=>{
      const m=/^\$(\w+)$/.exec(seg);
      if(!m){ p.appendChild(document.createTextNode(seg)); return; }
      const pill=beat.pills.find(x=>x.t===m[1]);
      const el=mk('span','hzp',pill?pill.t:m[1]);
      el.onclick=()=>{ if(!pill) return; sfx('tick');
        wrap.querySelectorAll('.hzp').forEach(x=>x.classList.remove('on'));
        el.classList.add('on'); hzscreen(host,pill.screen); };
      el.onmouseenter=()=>{ if(pill) hzscreen(host,pill.screen); };
      p.appendChild(el);
    });
    wrap.appendChild(p);
  }
  const dots=mk('div','hzdots');
  HZBEATS.forEach((_,i)=>{ const d=mk('i'); if(i<=HZAT) d.className='on'; dots.appendChild(d); });
  wrap.appendChild(dots);
  box.appendChild(wrap);
  enter([wrap],{y:12,blur:7,duration:.55},1200);
}
async function worksStage(){
  atStep('How it works');
  const myGen=gen;
  setPhase(3);
  if(HZAT===0){
    clearTurn(); dockHide(); await wait(360);
    if(myGen!==gen) return;
    await swapPanel('How Zero works',h=>{ const host=mk('div'); host.id='hzHost';
      host.style.cssText='position:absolute;inset:0'; h.appendChild(host); },false,false);
  }
  const beat=HZBEATS[Math.min(HZAT,HZBEATS.length-1)];
  const host=$('hzHost');
  if(host) hzscreen(host,beat.screen);
  if(myGen!==gen) return;
  await voLine(beat.say,Math.max(2000,beat.say.length*44));
  if(myGen!==gen) return;
  const {box}=turn({q:beat.then});
  await wait(300);
  if(myGen!==gen) return;
  hzcopy(box,beat,host);
  const last=HZAT>=HZBEATS.length-1;
  cta(last?'What do I start with?':'Keep going',()=>{
    if(last){ HZAT=0; go(claimStage); }
    else { HZAT++; locked=false; worksStage(); }
  });
}

/* Walk the whole flow with sensible answers already filled in, no clicking. */
const DBG_STEPS=[
  ['Draw',        ()=>{ $('drawScreen').style.display='flex';
                        gsap.set('#drawScreen',{opacity:1}); gsap.set('#dH',{opacity:1,y:0}); }],
  ['Open',        ()=>openStage()],
  ['LinkedIn',    ()=>linkedinStage()],
  ['Read back',   ()=>readbackStage()],
  ['Pivot',       ()=>pivotStage(P.pivot)],
  ['Cards intro', ()=>cardsIntroStage()],
  ['Cards',       ()=>cardsStage()],
  ['Reflection',  ()=>reflectStage()],
  ['Preferences', ()=>prefStage()],
  ['Vision',      ()=>visionStage(true)],
  ['Roles',       ()=>rolesStage()],
  ['Synthesis',   ()=>synthesisStage()],
  ['Portfolio',   ()=>portfolioStage()],
  ['How it works',()=>worksStage()],
  ['Claim',       ()=>claimStage()],
  ['Credits',     ()=>creditsStage()],
  ['Handoff',     ()=>finishStage('sanjay@z-ro.co')],
];
/* what each step would have produced, so any step can be entered cold */
function dbgFill(upTo){
  const d=pack();
  /* the stepper has to be able to go backwards. Without this P only ever grows,
     so an earlier step shows a fuller board than it should. */
  Object.keys(P).forEach(k=>{ P[k]= k==='picks' ? [] : null; });
  const set=(i,fn)=>{ if(upTo>i) fn(); };
  /* indices track DBG_STEPS: 0 Open, 1 LinkedIn, 2 Read back, 3 Pivot,
     4 Cards intro, 5 Cards, 6 Reflection, 7 Preferences, 8 Vision, ... */
  set(1,()=>P.name='Sanjay');
  set(2,()=>{ P.linked='LinkedIn'; P.linkedUrl='linkedin.com/in/sanjaybchauhan'; });
  set(3,()=>{ P.level='Student';
    P.year='Third year'; P.college='Narsee Monjee';
    P.interned='2 internships'; P.tools='Figma, Illustrator, prototyping';
    P.follows='OpenAI, Figma, Notion';
    P.about='I started in graphic design but recently I have been looking more into product design.';
    P.pivot=['graphic design','product design']; });
  set(4,()=>{ P.why='I want to work on products people actually use and build a career I can grow in.'; });
  set(6,()=>{ /* the cards have been played: their read-out is the preference state */
    P.role=d.roles&&d.roles[0]?d.roles[0][0]:'Product Designer';
    P.dream='OpenAI, Figma, Anthropic';
    P.industry='Tech and AI';
    P.problems=d.problemChips?d.problemChips[0]:'Confusing tools';
    P.location='Toronto';
    P.timeline='This year'; });
  /* the cards are behind every screen from the reflection on. Replaying the
     deck here is what the real flow would have left behind, so a jumped-to
     screen scores on the same evidence a walked-to one does. */
  set(6,()=>{ try{ rreset(); rdeck().forEach(r=>rapply(r, r.n%3===0?'b':'a')); }catch(e){} });
  set(9,()=>{ P.aim=d.roles&&d.roles[0]?d.roles[0][0]:'Product Designer'; });
}
/* The stepper was rebuilding the Zero board on every jump, so steps that should
   show the LinkedIn board showed the synthesised one - the exact confusion the
   two boards exist to avoid. This lays the LinkedIn board out instantly, no
   animation, for any step before Zero has the whole picture. */
function lkSeed(){
  const sc=$('scroll'); if(!sc) return;
  sc.className='scroll'; sc.innerHTML='';
  buildLinked(sc);
  const w=$('lkw'); if(!w) return;
  const d=LINKEDIN[PKEY]||LINKEDIN.design;
  const facts=[['Currently',d.headline],['Working at',d.org]]
    .concat(d.city?[['Based in',d.city]]:[])
    .concat([['Experience',d.exp]])
    .concat(d.since?[['Doing this for',d.since]]:[])
    .concat([['Skills listed',d.skills]])
    .concat(d.follows?[['Following',d.follows]]:[])
    .concat(d.into?[['Signals',d.into]]:[])
    .filter(f=>f[1]);
  /* whatever they have already chosen belongs here too */
  Object.keys(RPICKED).forEach(co=>facts.push(['You chose',co+' · '+RPICKED[co].role]));
  facts.forEach((f,i)=>{
    const el=mk('div','lkf'+(f[0]==='You chose'?' picked':''));
    const head=mk('div','lkft');
    head.innerHTML='<span class="lkfi">'+(LKICON[f[0]]||I.spark)+'</span>'+f[0];
    el.appendChild(head); el.appendChild(mk('div','lkfv',f[1]));
    if(f[0]==='You chose') el.dataset.co=f[1].split(' · ')[0];
    w.appendChild(el);
    const ln=mk('div','lkline'); ln._for=el; w.insertBefore(ln,w.firstChild);
  });
  const url=w.querySelector('.lkurl'); if(url) url.classList.remove('reading');
  lkRelayout(); setTimeout(lkRelayout,50);
}
let dbgAt=0;
/* The pill used to move only when its own arrows were pressed, so walking the
   real flow left it stuck on step one. Stages announce themselves instead. */
function atStep(label){
  const i=DBG_STEPS.findIndex(x=>x[0]===label);
  if(i<0) return;
  dbgAt=i;
  const lbl=$('dbgStep'); if(lbl) lbl.textContent=(i+1)+'. '+label;
  const pv=$('dbgPrev'), nx=$('dbgNext');
  if(pv) pv.style.opacity=i<=0?.3:1;
  if(nx) nx.style.opacity=i>=DBG_STEPS.length-1?.3:1;
}
function dbgGoto(i){
  i=Math.max(0,Math.min(DBG_STEPS.length-1,i));
  dbgAt=i;
  /* nothing from the last step gets to finish */
  gen++;
  try{ gsap.killTweensOf(['#col','#scroll','.right','#dock','#dtr','#top','#aur','#paper','#turn']); }catch(e){}
  locked=false; editReturn=null; scanning=false; queue.length=0; shown={}; keys={}; tlMode='h';
  PACE=false; paceQueue.length=0;
  const t0=$('turn'); if(t0) t0.remove();
  $('col').innerHTML=''; $('dockIn').innerHTML='';
  gsap.set('#dock',{opacity:0}); gsap.set('#dtr',{opacity:0}); $('dtr').innerHTML='';
  stopRec();
  document.querySelectorAll('.zook,.conf,.core,.veil,.sheen,.gh').forEach(n=>n.remove());
  $('rip').style.display='none'; $('rip').innerHTML='';
  $('aur').innerHTML=''; gsap.set('#aur',{opacity:0});
  gsap.set(['#logoPill','.tr'],{opacity:i>=1?1:0,y:0});
  if(i!==0) $('drawScreen').style.display='none';
  /* the stepper must reproduce the same boundary, or a jump lands in the
     wrong light and the device stops reading as intentional */
  document.body.classList.toggle('dark', i<=8);
  $('col').innerHTML='';
  dbgFill(i);
  /* the panel exists from the moment Zero starts writing things down */
  /* panel opens at the read-back (2) and widens once the board is the subject (8) */
  const born=i>=3, wide=i>=9;
  /* One board. It is the user's, not LinkedIn's and not Zero's, so it holds
     whatever has been learned by the step being shown. */
  /* ...but it is a drawer, and the cards are where it shuts. Gate on the step
     title, not its index, so inserting a step cannot silently reopen it. */
  const title=(DBG_STEPS[i]||[''])[0]||'';
  /* the cards, the read-out and the confirmation screens all want the whole
     screen: "इसमें vision board होने की जरूरत नहीं है" */
  const zeroBoard=!/^(Cards|Reflection|Preferences)/.test(title);
  /* one board everywhere; where the drawer is shut, the panel is simply not
     on stage - nothing seeds a second board anymore */
  if(born&&!zeroBoard){
    panelBorn=true; boardLive=false;
    gsap.set('.right',{width:0,opacity:0});
    shiftLeft('0vw');
  }
  else if(born){
    panelBorn=true; boardLive=true;
    gsap.set('.right',{width:panelPref?panelPref+'px':'40%',opacity:1,x:0});
    shiftLeft(panelPref?panelPref+'px':'40vw');
    mountResizer();
    $('cap').innerHTML='<span class="live pulse"></span>'+(wide?'Your vision board':'Zero is listening');
    const sc=$('scroll'); sc.className='scroll ctr'; sc.innerHTML='';
    const vb=mk('div','vb'); vb.id='vb'; vb.innerHTML=boardHTML(); sc.appendChild(vb);
    SENTENCES().forEach(x=>{ if(x.ready){ shown[x.id]=1; keys[x.id]=x.key; } });
    meterRetired=i>=9; boardRewards=i>=9;
  } else {
    panelBorn=false; boardLive=false;
    gsap.set('.right',{width:0,opacity:0}); shiftLeft('0px');
  }
  meterRetired=i>14; boardRewards=i>14;
  renderMeter();                    /* every step, not only the ones with a panel */
  setPhase(i<14?0:(i<16?1:(i<18?2:(i<19?3:4))));
  const lbl=$('dbgStep'); if(lbl) lbl.textContent=(i+1)+'. '+DBG_STEPS[i][0];
  const pv=$('dbgPrev'), nx=$('dbgNext');
  if(pv) pv.disabled=i<=0;
  if(nx) nx.disabled=i>=DBG_STEPS.length-1;
  /* a jumped-to panel must show its content, not the empty frame it starts as */
  clearTimeout(dbgGoto._f);
  dbgGoto._f=setTimeout(async()=>{
    const g=gen;
    const n=sel=>document.querySelectorAll(sel).length;
    try{
      const nm=DBG_STEPS[i][0];
      /* only top up what the stage's own sequence has not reached yet, or the
         fill races the beats and doubles everything */
      if(nm==='Curriculum'){
        for(let k=n('.tlc'); k<4 && g===gen; k++) await addCurriculumCard(k);
      }
      if(nm==='How it works'){
        for(let k=n('.zstep'); k<ZSTEPS.length && g===gen; k++) await addLoopStep(k);
      }
      /* Portfolio needs no fill: the panel embeds the real portfolio whole */
    }catch(e){}
  },1500);
  fastMode=true;
  try{ DBG_STEPS[i][1](); }catch(e){ console.warn('step',i,e); }
  /* long enough for the stage to paint, short enough that the narration still plays */
  clearTimeout(dbgGoto._t);
  dbgGoto._t=setTimeout(()=>{ fastMode=false; },900);
}
(function(){
  const pv=$('dbgPrev'), nx=$('dbgNext'), st=$('dbgStep'), gr=$('dbgBtn');
  pv.className='dbgnav flip'; pv.innerHTML=I.arrow;
  nx.className='dbgnav'; nx.innerHTML=I.arrow;
  gr.innerHTML=I.gear;
  pv.onclick=()=>{ sfx('tick'); dbgGoto(dbgAt-1); };
  nx.onclick=()=>{ sfx('tick'); paceAdvance(); };
  st.onclick=()=>{ sfx('tick'); dbgGoto(0); };
  st.textContent='1. '+DBG_STEPS[0][0];
  addEventListener('keydown',e=>{
    if(document.activeElement&&document.activeElement.tagName==='INPUT') return;
    if(e.key==='ArrowRight'){ paceAdvance(); }
    if(e.key==='ArrowLeft'){ dbgGoto(dbgAt-1); }
  });
})();

/* ---- tuning drawer (debug, prototype only) ---- */
/* grouped, so only the thing you are tuning is open */
(function(){
  const panel=$('dbgPanel'), btn=$('dbgBtn');
  let openSec=null;
  function section(title){
    const sec=mk('div','dbgsec');
    const h=mk('button','dbgh');
    h.appendChild(mk('span',null,title));
    h.appendChild(mk('span','cv',I.arrow));
    const body=mk('div','dbgbody');
    sec.appendChild(h); sec.appendChild(body); panel.appendChild(sec);
    h.onclick=()=>{
      const isOpen=sec.classList.contains('open');
      if(openSec) openSec.classList.remove('open');
      if(isOpen){ openSec=null; }
      else { sec.classList.add('open'); openSec=sec;
        safeTL(gsap.timeline().fromTo(body.children,{opacity:0,y:8},
          {opacity:1,y:0,duration:.34,stagger:.035}),1200); }
      sfx('tick');
    };
    return body;
  }
  function range(body,label,min,max,step,get,set){
    const r=mk('div','dbgrow');
    const lb=mk('div','lb');
    lb.appendChild(mk('span',null,label));
    const val=mk('span','val',String(get()));
    lb.appendChild(val); r.appendChild(lb);
    const inp=document.createElement('input'); inp.type='range';
    inp.min=min; inp.max=max; inp.step=step; inp.value=get();
    inp.oninput=()=>{ set(parseFloat(inp.value)); val.textContent=inp.value; };
    r.appendChild(inp); body.appendChild(r);
  }
  function swatch(body,label,get,set){
    const r=mk('div','dbgrow flat');
    const lb=mk('div','lb'); lb.appendChild(mk('span',null,label)); r.appendChild(lb);
    const inp=document.createElement('input'); inp.type='color'; inp.value=get();
    inp.oninput=()=>set(inp.value);
    r.appendChild(inp); body.appendChild(r);
  }
  function toggle(body,label,get,set){
    const r=mk('div','dbgrow flat');
    const lb=mk('div','lb'); lb.appendChild(mk('span',null,label)); r.appendChild(lb);
    const inp=document.createElement('input'); inp.type='checkbox'; inp.checked=get();
    inp.onchange=()=>set(inp.checked);
    r.appendChild(inp); body.appendChild(r);
  }

  const draw=section('Draw ZERO');
  range(draw,'Ink max',20,180,2,()=>INK.max,v=>INK.max=v);
  range(draw,'Ink min',4,90,2,()=>INK.min,v=>INK.min=v);
  range(draw,'Speed thin',0,80,2,()=>INK.sens,v=>INK.sens=v);
  range(draw,'Wetness',0,.5,.02,()=>INK.wet,v=>INK.wet=v);
  range(draw,'Close tolerance',.1,.7,.05,()=>INK.tol,v=>INK.tol=v);
  swatch(draw,'Ink colour',()=>INK.color,v=>INK.color=v);

  /* every colour the screen is built from, writable live. Vars land on body
     inline, which outranks both the light defaults and the body.dark set. */
  function cssVar(name){ 
    const v=getComputedStyle(document.body).getPropertyValue(name).trim();
    if(/^#/.test(v)) return v.length===4?'#'+v[1]+v[1]+v[2]+v[2]+v[3]+v[3]:v.slice(0,7);
    const m=v.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
    if(!m) return '#888888';
    return '#'+[m[1],m[2],m[3]].map(x=>(+x).toString(16).padStart(2,'0')).join('');
  }
  function pick(body,label,options,get,set){
    const r=mk('div','dbgrow flat');
    const lb=mk('div','lb'); lb.appendChild(mk('span',null,label)); r.appendChild(lb);
    const sel=document.createElement('select');
    options.forEach(o=>{ const op=document.createElement('option');
      op.value=o[1]; op.textContent=o[0]; sel.appendChild(op); });
    sel.value=get(); sel.onchange=()=>set(sel.value);
    r.appendChild(sel); body.appendChild(r);
  }
  const FONTS=[['Serif (STK Bureau)',"var(--serif)"],['Sans (system)',"var(--f)"],['Georgia',"Georgia,serif"],['Mono',"ui-monospace,Menlo,monospace"]];
  const setB=(n,v)=>document.body.style.setProperty(n,v);

  const type=section('Typography');
  range(type,'Question size',18,48,1,()=>parseInt(getComputedStyle(document.querySelector('.q')||document.body).fontSize)||30,
    v=>setB('--qfs',v+'px'));
  pick(type,'Question font',FONTS,()=>"var(--serif)",v=>setB('--qfont',v));
  range(type,'Board size',14,34,1,()=>parseInt(getComputedStyle(document.body).getPropertyValue('--vbfs'))||22,
    v=>setB('--vbfs',v+'px'));
  range(type,'Board line height',1.4,3.2,.05,()=>2.35,v=>setB('--vblh',v));
  pick(type,'Board font',FONTS,()=>"var(--f)",v=>setB('--vbfont',v));

  const col2=section('Colours');
  [['Background','--page'],['Shell','--shell'],['Card','--card'],['Wash','--wash'],
   ['Text','--tx'],['Text 2','--tx-2'],['Text 3','--tx-3'],['Text 4','--tx-4'],
   ['Ink (buttons)','--ink'],['On ink','--on-ink'],['Green','--ok'],['Commit green','--commit']
  ].forEach(([label,vn])=>swatch(col2,label,()=>cssVar(vn),v=>setB(vn,v)));

  const board=section('Vision board');
  range(board,'Text size',14,34,1,
    ()=>parseInt(getComputedStyle(document.documentElement).getPropertyValue('--vbfs'))||22,
    v=>document.documentElement.style.setProperty('--vbfs',v+'px'));

  const motion=section('Motion');
  range(motion,'Speed',.25,2,.05,()=>1,v=>gsap.globalTimeline.timeScale(v));

  const theme=section('Theme');
  toggle(theme,'Dark mode',()=>document.body.classList.contains('dark'),
    v=>document.body.classList.toggle('dark',v));

  btn.onclick=()=>{ panel.classList.toggle('open'); sfx('tick'); };
})();
