.sqc .tk svg{ width:12px; height:12px; }
.sqc.on .tk{ opacity:1; transform:scale(1); }

/* what you are saying, live, while you say it */
.dtr{ position:fixed; left:0; right:0; bottom:120px; z-index:79; display:flex; justify-content:center;
  padding:0 24px; pointer-events:none; opacity:0;
  transition:padding-left .9s cubic-bezier(.625,.05,0,1); }
.dtr span{ max-width:min(560px,44vw); font-size:16px; line-height:1.45; color:var(--tx-2);
  text-align:center; text-wrap:balance; }
.dtr b{ color:var(--tx); font-weight:500; }

/* the transformation layer: the board comes apart into companies */
.zook{ position:fixed; inset:0; z-index:88; pointer-events:none; }
.zc{ position:fixed; margin:0!important; will-change:transform,opacity; }
.ztile{ position:fixed; width:74px; height:74px; border-radius:23px; background:#fff;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 24px 48px rgba(0,0,0,.3), 0 2px 6px rgba(0,0,0,.18); }
.ztile svg{ width:34px; height:34px; }

.metapills{ display:flex; flex-wrap:wrap; gap:8px; margin-top:11px; }
.mp{ display:inline-flex; align-items:center; gap:9px; height:34px; padding:0 15px 0 8px;
  border-radius:var(--pill); background:var(--card); border:1px solid var(--line);
  font-size:12.5px; font-weight:500; letter-spacing:-.015em; }
.mp .mi{ width:21px; height:21px; display:inline-flex; flex-shrink:0; }
.mp .mi svg{ width:100%; height:100%; }
.cosbig{ display:flex; flex-wrap:wrap; gap:12px; }
.cbg{ width:60px; height:60px; border-radius:19px; background:#fff; display:flex; align-items:center;
  justify-content:center; box-shadow:0 14px 28px rgba(0,0,0,.16), 0 1px 3px rgba(0,0,0,.09); }
.cbg svg{ width:28px; height:28px; }
.cbg:nth-child(2n){ transform:rotate(3.5deg); }
.cbg:nth-child(3n){ transform:rotate(-4deg); }
.cbg:nth-child(5n){ transform:rotate(2deg); }

.lin{ display:flex; flex-direction:column; gap:9px; }
.linr{ display:flex; align-items:center; gap:14px; padding:18px 24px; border-radius:var(--r-md); background:var(--wash); }
.linr .lk{ flex:1; min-width:0; }
.linr .lkt{ font-size:11.5px; color:var(--tx-3); }
.linr .lkv{ margin-top:3px; font-size:13.5px; font-weight:600; }
.linr .lc{ width:21px; height:21px; flex-shrink:0; border-radius:var(--pill); background:var(--commit);
  color:#0d0d0d; display:flex; align-items:center; justify-content:center; }
.linr .lc svg{ width:11px; height:11px; }
.srcpill{ display:inline-flex; align-items:center; gap:6px; height:22px; padding:0 9px; border-radius:var(--r-sm);
  background:var(--card); font-size:11px; color:var(--tx-3); }
.srcpill svg{ width:13px; height:13px; }

.ghost{ box-shadow:0 16px 36px rgba(0,0,0,.16); }
@media (max-width:1180px){ .right{ display:none!important; } }
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{ animation-duration:.01ms!important; transition-duration:.01ms!important; } }

/* The welcome is ONE recording. Playing six clips back to back stacked six
   lead-ins and six tails and never sounded like a person talking. The audio
   runs unbroken and the text swaps at the moment the voice reaches it. */
let welEl=null;
/* One clip per line. Nothing is sliced and nothing seeks, so a line can never
   run into the next one and replay it. */
const VO_CLIPS={};   /* per-line takes retired: their keys never matched the on-screen lines */
let voOn=true, voRate=1, voNow=null;
const voCache={};
function voFind(text){
  const k=String(text||'').replace(/\s+/g,' ').trim();
  return Object.prototype.hasOwnProperty.call(VO_CLIPS,k)?VO_CLIPS[k]:null;
}
function voStop(){ if(voNow){ try{ voNow.pause(); voNow.currentTime=0; }catch(e){} voNow=null; } }
/* resolves when the clip has finished, or immediately when we have no take */
function voPlay(text){
  if(!voOn||!sndOn) return null;
  const src=voFind(text); if(!src) return null;
  voStop();
  let a=voCache[text];
  if(!a){ a=new Audio(src); a.preload='auto'; voCache[text]=a; }
  a.playbackRate=voRate;
  try{ a.currentTime=0; }catch(e){}
  voNow=a;
  const pr=a.play(); if(pr&&pr.catch) pr.catch(()=>{});
  return new Promise(res=>{
    let done=false;
    const fin=()=>{ if(done)return; done=true;
      a.removeEventListener('ended',fin); a.removeEventListener('error',fin);
      if(voNow===a) voNow=null; res(); };
    a.addEventListener('ended',fin);
    a.addEventListener('error',fin);
    /* a throttled tab still lands */
    setTimeout(fin, ((a.duration||4)*1000)/voRate + 900);
  });
}
/* say it and show it together, and fall back to the old timing when there is no take */
/* Drive mode: while on, every conversational beat waits at this gate and one
   press of the next arrow releases exactly one. Off by default, so the flow
   auto-plays until the person reaches for the wheel. */
let PACE=false; const paceQueue=[];
function paceGate(){
  if(!PACE) return Promise.resolve();
  return new Promise(res=>paceQueue.push(res));
}
function paceRelease(){ const r=paceQueue.shift(); if(r) r(); }
function paceAdvance(){
  PACE=true;
  /* a Zero line is waiting: let it speak */
  if(paceQueue.length){ paceRelease(); return; }
  /* otherwise it is YOUR move */
  if(SCRIPTED&&!locked&&sayScripted()) return;

  if(act&&!locked){ act.click(); return; }
  /* nothing left on this screen: the old section jump is the right fallback */
  dbgGoto(dbgAt+1);
}
async function voLine(text,fallback){
  { const g0=gen; await paceGate(); if(g0!==gen) return; }
  /* audio outlives a screen change: without this a stale line resumes when its
     clip ends and paints over whatever is now on screen. */
  const g=gen;
  if(g!==gen) return;
  line(text);
  const p=voPlay(text);
  if(p){ await p; if(g!==gen) return; await wait(300/voRate); }

  if(g!==gen) return;
}

/* ---- pen on paper: real friction noise that tracks the hand ----
   Not a loop. A filtered noise bed whose brightness and level follow stroke
   speed, so a slow nib whispers and a fast one hisses. */
const AUD=(function(){
  let ctx=null;
  function ac(){
    if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
    if(ctx&&ctx.state==='suspended'){ try{ ctx.resume(); }catch(e){} }
    return ctx;
  }
  let nb=null;
  function noise(c){
    if(nb&&nb.sampleRate===c.sampleRate) return nb;
    const n=Math.floor(c.sampleRate*2), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
    let last=0;
    for(let i=0;i<n;i++){ const w=Math.random()*2-1; last=(last+.02*w)/1.02; d[i]=last*3.2+w*.4; }
    nb=b; return b;
  }
  /* the pen */
  let src=null,hp=null,bp=null,gn=null,live=false,target=0,cur=0,raf=0;
  function penStart(){
    const c=ac(); if(!c||!sndOn||live) return; live=true;
    src=c.createBufferSource(); src.buffer=noise(c); src.loop=true;
    hp=c.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=620;
    bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1900; bp.Q.value=.8;
    gn=c.createGain(); gn.gain.value=0;
    src.connect(hp); hp.connect(bp); bp.connect(gn); gn.connect(c.destination);
    src.start();
    /* the nib touching down */
    const t=c.currentTime, o=c.createOscillator(), og=c.createGain();
    o.type='triangle'; o.frequency.setValueAtTime(320,t); o.frequency.exponentialRampToValueAtTime(90,t+.05);
    og.gain.setValueAtTime(.055,t); og.gain.exponentialRampToValueAtTime(.0001,t+.07);
    o.connect(og); og.connect(c.destination); o.start(t); o.stop(t+.09);
    const tick=()=>{ if(!live) return;
      cur+=(target-cur)*.22; target*=.82;   /* a still hand goes quiet on its own */
      const c2=ac(); if(c2&&gn){
        gn.gain.setTargetAtTime(Math.min(.075,cur*.075),c2.currentTime,.02);
        bp.frequency.setTargetAtTime(1500+Math.min(1,cur)*3400,c2.currentTime,.03);
      }
      raf=requestAnimationFrame(tick); };
    raf=requestAnimationFrame(tick);
  }
  function penMove(speed){ if(!live) return; target=Math.max(target,Math.min(1.6,speed*2.6)); }
  function penStop(){
    if(!live) return; live=false; cancelAnimationFrame(raf);
    const c=ac(); if(!c||!gn){ src=null; return; }
    const t=c.currentTime, g=gn, s=src;
    g.gain.cancelScheduledValues(t); g.gain.setTargetAtTime(0,t,.05);
    setTimeout(()=>{ try{ s.stop(); }catch(e){} },320);
    src=null; gn=null; cur=0; target=0;
  }
  /* the flip into the dark: a sweep, a sub, and a shimmer tail */
  function whoosh(){
    const c=ac(); if(!c||!sndOn) return;
    const t=c.currentTime;
    const s=c.createBufferSource(); s.buffer=noise(c); s.loop=true;
    const f=c.createBiquadFilter(); f.type='bandpass'; f.Q.value=1.1;
    f.frequency.setValueAtTime(360,t);
    f.frequency.exponentialRampToValueAtTime(5200,t+.62);
    f.frequency.exponentialRampToValueAtTime(280,t+1.5);
    const g=c.createGain();
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.13,t+.5);
    g.gain.exponentialRampToValueAtTime(.0001,t+1.55);
    s.connect(f); f.connect(g); g.connect(c.destination); s.start(t); s.stop(t+1.7);
    const o=c.createOscillator(), og=c.createGain();
    o.type='sine'; o.frequency.setValueAtTime(96,t+.34); o.frequency.exponentialRampToValueAtTime(34,t+1.1);
    og.gain.setValueAtTime(.0001,t+.34); og.gain.exponentialRampToValueAtTime(.16,t+.46);
    og.gain.exponentialRampToValueAtTime(.0001,t+1.25);
    o.connect(og); og.connect(c.destination); o.start(t+.34); o.stop(t+1.3);
    [1568,2093,2637].forEach((hz,i)=>{
      const b=c.createOscillator(), bg=c.createGain();
      b.type='sine'; b.frequency.value=hz;
      const at=t+.72+i*.07;

/* ------------------------------------------------------- microphone access --
   The browser's permission dialog is the harshest interruption in the flow, so
   Zero asks for it first, in its own voice. The native prompt then reads as the
   answer to a question rather than as something that jumped the user.

   Every branch has to be handled or the flow strands: denied must never
   re-prompt in a loop, dismissed gets one more chance later, and a machine with
   no microphone at all should simply never be offered one. */
let micState='unknown';       /* unknown | granted | denied | dismissed | absent */

async function micProbe(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ micState='absent'; return micState; }
  try{
    if(navigator.permissions&&navigator.permissions.query){
      const st=await navigator.permissions.query({name:'microphone'});
      if(st.state==='granted') micState='granted';
      else if(st.state==='denied') micState='denied';
      st.onchange=()=>{ micState=st.state==='granted'?'granted':st.state==='denied'?'denied':'unknown'; };
    }
  }catch(e){}
  return micState;
}
function micPointer(show){
  let el=document.querySelector('.mkpoint');
  if(show){
    if(!el){ el=mk('div','mkpoint');
      el.innerHTML='<span>Your browser will ask up here</span>';
      document.body.appendChild(el); }
    safeTL(gsap.timeline().fromTo(el,{opacity:0,y:-8},{opacity:1,y:0,duration:.4}),800);
  } else if(el){
    safeTL(gsap.timeline({onComplete:()=>{ if(el.isConnected) el.remove(); }})
      .to(el,{opacity:0,y:-8,duration:.3}),700);
  }
}
/* Ask, then ask. Resolves true only if the microphone is actually usable. */
async function micRequest(){
  await micProbe();
  if(micState==='granted') return true;
  if(micState==='absent')  return false;
  if(micState==='denied'){
    /* never loop a denied permission: say so once and stay on the keyboard */
    await reflect('Your browser is holding the mic back. I will read instead.',2200);
    return false;
  }
  micPointer(true);
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    stream.getTracks().forEach(t=>t.stop());     /* we only needed the answer */
    micState='granted'; micPointer(false);
    return true;
  }catch(e){
    micPointer(false);
    const name=String(e&&e.name||'');
    micState=(name==='NotAllowedError')?'denied':(name==='NotFoundError'?'absent':'dismissed');
    if(micState==='denied') await reflect('No problem. I will read instead.',1900);

/* Each sentence loads itself: a skeleton with a green shine, then it resolves.
   The container never flashes, only the row that is arriving. */
const SKW=[[5,9,4],[6,4,8],[4,7],[7,5,6],[5,4],[6,7]];
function skeleton(o){
  const r=mk('div','vbs sk'); r.dataset.o=String(o);
  (SKW[o]||[6,5]).forEach(ch=>{ const b=mk('span','skb'); b.style.width=ch+'ch'; r.appendChild(b); });
  return r;
}
function placeRow(host,row,o){
  const after=[...host.children].find(r=>+r.dataset.o>o);
  if(after) host.insertBefore(row,after); else host.appendChild(row);
}
function spring(row){
  const bits=row.querySelectorAll('.vbc, .vbl, .vbq');
  safeTL(gsap.timeline()
    .fromTo(row,{opacity:0,y:8},{opacity:1,y:0,duration:.45})
    .fromTo(bits,{scale:.78,opacity:0},{scale:1,opacity:1,duration:.48,stagger:.08,ease:'back.out(1.7)'},'-=.28'),1500);
}
let pumping=null;
function pump(){
  if(scanning||!queue.length) return;
  scanning=true;
  queue.sort((a,b)=>a.o-b.o);
  const item=queue.shift();
  pumping=item;
  const host=$('vbg0'); if(!host){ scanning=false; return; }
  const sk=skeleton(item.o);
  placeRow(host,sk,item.o);
  safeTL(gsap.timeline().fromTo(sk,{opacity:0,y:10},{opacity:1,y:0,duration:.35}),700);
  sfx('loading');
  let done=false;
  const resolve=()=>{
    if(done) return; done=true;
    const row=mk('div','vbs'); row.dataset.o=String(item.o); row.dataset.id=item.id;
    row.innerHTML=item.html();
    /* belt and braces: whatever the races upstream, one sentence renders once */
    const twin=host.querySelector('.vbs[data-id="'+item.id+'"]');
    if(twin) twin.remove();
    if(sk.isConnected) host.replaceChild(row,sk); else placeRow(host,row,item.o);
    pumping=null;
    spring(row);
    sfx('droplet');
    setTimeout(()=>{ scanning=false; pump(); },620);
  };
  setTimeout(resolve,1150);
}
/* a sentence already on the board can change: the name arriving rewrites the first line */
function morphRow(x){
  const vb=$('vb'); if(!vb) return;
  const row=vb.querySelector('.vbs[data-id="'+x.id+'"]');
  /* Not in the DOM yet. It is either queued or IN FLIGHT as a skeleton, and
     both render the newest words when their turn comes - only a sentence in
     neither place was truly lost. Forgetting the in-flight case is what
     doubled the board: a key change during the 1150ms skeleton window
     re-queued a sentence that was already landing. */
  if(!row){
    const inFlight=pumping&&pumping.id===x.id;
    if(!inFlight&&!queue.some(q2=>q2.id===x.id)) shown[x.id]=0;
    return; }
  safeTL(gsap.timeline().to(row,{opacity:.25,duration:.22}),400);
  setTimeout(()=>{
    row.innerHTML=x.html(); gsap.set(row,{opacity:1});
    const bits=row.querySelectorAll('.vbc, .vbl, .vbq');
    safeTL(gsap.timeline().fromTo(bits,{scale:.7,opacity:0},
      {scale:1,opacity:1,duration:.5,stagger:.07,ease:'back.out(1.8)'}),1400);
    sfx('sparkle');
  },240);
}
/* Things that are true but do not belong in the sentence. Someone says they
   dance and that is not nothing - it just is not part of "Sanjay is going
   after product design". It gets pinned beside the paragraph so the person can
   see their own words landed somewhere. */
const PINS=[];
function pin(text,glyph){
  if(!text) return;
  if(PINS.some(p=>p.text===text)) return;
  PINS.push({text:text,glyph:glyph||'\u2726'});
  renderPins();
}
function renderPins(){
  const host=$('vbPins'); if(!host) return;
  PINS.forEach((p,i)=>{
    if(host.querySelector('[data-pin="'+i+'"]')) return;
    const el=mk('div','vbpin'); el.dataset.pin=String(i);
    el.appendChild(mk('span','vbpg',p.glyph));
    el.appendChild(mk('span','vbpt',p.text));
    /* a pin is not part of the sentence, so it never sits in line with it */
    el.style.transform='rotate('+((i%2?1:-1)*(1.5+i*.6)).toFixed(1)+'deg)';
    host.appendChild(el);
    enter([el],{y:10,blur:6,duration:.5},900);
  });
}

const PINWORDS=[
  [/\b(danc\w+)\b/i,'\uD83D\uDC83','enjoys dancing'],
  [/\b(act(?:ing|or)|theatre|theater)\b/i,'\uD83C\uDFAD','into acting and theatre'],
  [/\b(music|sing\w*|guitar|piano|produc\w* music)\b/i,'\uD83C\uDFB5','makes music'],
  [/\b(photograph\w+)\b/i,'\uD83D\uDCF7','shoots photographs'],

  [/\b(sport|footbal\w*|cricket|basketball|run(?:ning)?|gym)\b/i,'\u26BD','plays sport'],
  [/\b(travel\w*)\b/i,'\u2708\uFE0F','travels'],
  [/\b(gam(?:e|ing|er)s?)\b/i,'\uD83C\uDFAE','games'],
  [/\b(volunteer\w*|ngo|nonprofit)\b/i,'\uD83E\uDD1D','volunteers'],
  [/\b(cook\w*|bak\w*)\b/i,'\uD83C\uDF73','cooks']

const TIME_PHRASE={ 'Now':'And you want it now.','In 3 months':'Inside three months.',
  'This year':'This year.','No rush':'No rush on the timing.' };
const upper=x=>x?x.charAt(0).toUpperCase()+x.slice(1):x;
function summaryBeats(){
  const out=[];
  if(P.role) out.push('You, aiming at '+P.role+'.');
  const place=[];
  if(P.company) place.push(CO_PHRASE[P.company]||low(P.company));
  if(P.industry) place.push('in '+low(SHORT[P.industry]||P.industry));
  if(place.length) out.push(upper(place.join(', '))+'.');
  const where=cityList(P.citynext)[0]||P.location;
  const tail=[];
  if(P.problems) tail.push('chasing '+low(P.problems));
  if(where) tail.push('from '+where);
  if(tail.length) out.push(upper(tail.join(', '))+'.');
  if(P.timeline&&TIME_PHRASE[P.timeline]) out.push(TIME_PHRASE[P.timeline]);
  return out.filter(x=>x&&x.length<=58);
}
/* Dark is the intake. Zero is reading the profile, hearing the note, watching
   the choices - the room stays low while it is still gathering. The board is
   the first thing Zero gives back rather than takes, so that is where the
   lights come up. */
async function lightsUp(){
  if(!document.body.classList.contains('dark')) return;
  const v=mk('div','veil'); document.body.appendChild(v);
  safeTL(gsap.timeline()
    .fromTo(v,{opacity:0},{opacity:1,duration:.42,ease:'power2.out'})
    .add(()=>{ document.body.classList.remove('dark'); })
    .to(v,{opacity:0,duration:.72,ease:'power2.inOut'},'+=0.05')
    .add(()=>{ if(v.isConnected) v.remove(); }),2400);
  sfx('bloom');
  await wait(600);
}
async function visionStage(fromEdit){
  atStep('Vision');
  await lightsUp();
  /* the drawer opens again: the cards are played and confirmed, so there is
     finally something worth adding that a single pick could not have told us */
  boardLive=true;
  if(fromEdit){ swapPanel('Your vision board',s2=>{ s2.classList.add('ctr');
    const vb=mk('div','vb'); vb.id='vb';
    vb.innerHTML=boardHTML(); s2.appendChild(vb); boardLive=true; $('paper').classList.add('canvas'); },false); }
  dockHide();
  const {box}=turn({q:'Did I get this right?'});
  choices(box,[['spark','Reveal the perfect roles for me','ok'],['pen','Fix one thing','fix'],
    ['plus','Add more','more']],v=>{
    if(v==='ok'){ sfx('success'); retireMeter(); boardRewards=true;
      clearTurn(); dockHide(); setTimeout(rolesStage,520); }
    else if(v==='fix'){ go(editStage); }
    else { go(addMoreStage); } },{pill:true,nomorph:true});
}
/* no menu of edit options. They say what is wrong in their own words, Zero
   clears that one thing and reads the same sentence for the correction. */
function editStage(){
  const {box}=turn({q:'What should I change?'});
  let answered=false;
  const take=async text=>{
    answered=true;
    const t=(text||'').toLowerCase();
    if(/\brole\b|\bjob\b|title|position/.test(t)) P.role=null;
    if(/compan|startup|scale|big tech|agency/.test(t)) P.company=null;
    if(/dream/.test(t)) P.dream=null;
    if(/cit(y|ies)|live|based|move|relocat/.test(t)) P.citynext=null;
    if(/remote|hybrid|in person|office/.test(t)) P.workmode=null;
    if(/industr|space|sector/.test(t)) P.industry=null;
    if(/tim(e|ing)|month|year|deadline/.test(t)){ P.timeline=null; P.jobtype=null; }
    if(/problem|project|work on/.test(t)) P.problems=null;
    extractInto(text);              /* the same sentence usually carries the fix */
    renderBoard();
    await reflect(said('changed that'),1300);
    /* no router to re-enter in v5: the correction lands on the board and the
       user is returned to it straight away */
    visionStage(true);
  };
  dockInput(take);
  const g=gen;
  setTimeout(()=>{ if(answered||locked||g!==gen) return;
    chipsRow(box,['The role','The companies','Where I want to be','The timing'],take); },7000);
}
function addMoreStage(){
  turn({q:'Tell me more.'});
  dockInput(text=>{
    P.problems=P.problems?P.problems+' · '+quoteOf(text):quoteOf(text);
    renderBoard(); editReturn=null; dockHide(); visionStage(true); });
}

/* ============================ 16 · the transformation ============================ */
/* green, blue and yellow, thrown from wherever the good news landed */
function confetti(x,y,n){
  n=n||84; sfx('press');
  const layer=mk('div','conf'); document.body.appendChild(layer);
  const CC=['#4ADE80','#5D87FF','#F5DE6B','#A8E6CF','#0084CE','#C8F169','#FACC15'];
  for(let i=0;i<n;i++){
    const p=mk('i');
    const w=4+Math.random()*7, h=Math.random()<.25?w:9+Math.random()*13;
    p.style.cssText='left:'+(x-w/2)+'px;top:'+(y-h/2)+'px;width:'+w+'px;height:'+h+'px;'+
      'background:'+CC[i%CC.length]+';border-radius:'+(Math.random()<.22?'50%':'2px')+';';
    layer.appendChild(p);
    const ang=-Math.PI/2+(Math.random()-.5)*2.3, sp=200+Math.random()*380;
    const spin=(Math.random()<.5?-1:1)*(380+Math.random()*620);
    gsap.to(p,{x:Math.cos(ang)*sp, y:Math.sin(ang)*sp, rotation:spin,
      duration:.7+Math.random()*.45, ease:'power2.out'});
    gsap.to(p,{y:'+='+(innerHeight*.8+Math.random()*260), rotation:'+='+(spin*.6),
      duration:1.9+Math.random()*1.3, ease:'power1.in', delay:.5+Math.random()*.25});
    gsap.to(p,{opacity:0, duration:.7, delay:1.8+Math.random()*.9});
  }
  /* cleanup rides the last tween, with a wall clock backstop behind it */
  let dead=false;
  const kill=()=>{ if(dead) return; dead=true; if(layer.isConnected) layer.remove(); };
  gsap.to(layer,{opacity:1,duration:3.4,onComplete:kill});
  setTimeout(kill,9000);
}
/* a sheen passes over whatever has just become true */
function sheen(el,dur){
  if(!el) return;
  if(getComputedStyle(el).position==='static') el.style.position='relative';
  const s2=mk('div','sheen'), i2=mk('i'); s2.appendChild(i2); el.appendChild(s2);
  const kill=()=>{ if(s2.isConnected) s2.remove(); };
  safeTL(gsap.timeline({onComplete:kill}).fromTo(i2,{left:'-60%'},
    {left:'125%',duration:dur||1.2,ease:'power2.inOut'}),(dur||1.2)*1000+700);
  setTimeout(kill,(dur||1.2)*1000+900);
}
/* The approval is the trigger. The board goes soft, the light gathers to the
   middle of the screen, a ripple opens out of it, and what comes back is the
   set of companies that hire this exact person. */
function revealSequence(onLand,onDone){
  /* the middle of the board, not the middle of the browser */
  const pr=document.querySelector('.right').getBoundingClientRect();
  const cx=pr.width?pr.left+pr.width/2:innerWidth/2;
  const cy=pr.height?pr.top+pr.height/2:innerHeight/2;
  const S=Math.min(pr.width||innerWidth,innerHeight)*0.62;
  const CLR=['#A8E6CF','#4ADE80','#C8F169','#F5DE6B'];
  const aur=$('aur'); aur.innerHTML='';
  const blobs=CLR.map(c2=>{ const b=mk('b');
    b.style.background='radial-gradient(circle at 50% 50%, '+c2+' 0%, '+c2+'00 70%)';
    aur.appendChild(b); return b; });
  const vb=$('vb');
  const R0=vb?vb.getBoundingClientRect():{left:cx-220,top:cy-170,width:440,height:340};
  const bx=R0.left+R0.width/2, by=R0.top+R0.height/2;
  blobs.forEach((b,i)=>{ const a2=(i/blobs.length)*Math.PI*2-Math.PI/4;
    gsap.set(b,{x:bx-S/2+Math.cos(a2)*R0.width*.52, y:by-S/2+Math.sin(a2)*R0.height*.5,
      scale:.45, opacity:0}); });

  const core=mk('div','core'); document.body.appendChild(core);
  gsap.set(core,{scale:.2,left:cx-85,top:cy-85,margin:0});
  const rip=$('rip'); rip.innerHTML=''; rip.style.display='block';
  const rings=[0,1,2].map(()=>{ const s3=mk('s'); rip.appendChild(s3); return s3; });
  gsap.set(rings,{left:cx-10,top:cy-10,margin:0});

  /* the board's own chips travel with the light */
  const layer=mk('div','zook'); document.body.appendChild(layer);
  const clones=[];
  [...document.querySelectorAll('#vb .vbc, #vb .vbl')].forEach(el=>{
    const r=el.getBoundingClientRect(); if(!r.width) return;
    const c2=el.cloneNode(true); c2.className=el.className+' zc';
    c2.style.cssText+=';position:fixed;left:'+r.left+'px;top:'+r.top+'px;font-size:'+getComputedStyle(el).fontSize+';';
    layer.appendChild(c2); clones.push({c:c2,r:r});
  });
  const names=COS();
  const tiles=names.map((n,i)=>{ const t2=mk('div','ztile',LOGO[n]||'');
    t2.style.left=(cx-37)+'px'; t2.style.top=(cy-37)+'px'; layer.appendChild(t2); return t2; });
  gsap.set(tiles,{scale:0,opacity:0});

  const tl=gsap.timeline();
  /* 1 · the light blooms and the board goes soft */
  tl.set(aur,{opacity:1})
    .to(blobs,{scale:1,opacity:.92,duration:.85,stagger:.08,ease:'power2.out'},0)
    .to(vb,{filter:'blur(15px)',scale:1.06,opacity:.5,duration:1.0,ease:EIO},.18);
  /* 2 · zook, zook, zook: every chip it wrote is pulled into the middle */
  clones.forEach((o,i)=>{
    tl.to(o.c,{x:cx-o.r.left-o.r.width/2, y:cy-o.r.top-o.r.height/2, scale:.5,
      rotate:(i%2?8:-8), filter:'blur(3px)', duration:.5, ease:'power4.in'}, .3+i*.06);
    tl.call(()=>sfx('tick'),null,.3+i*.06+.46);
  });
  const tZ=.3+clones.length*.06+.5;
  /* 3 · everything gathers and ignites */
  tl.to(blobs,{x:cx-S/2,y:cy-S/2,scale:.36,duration:.95,ease:'power3.inOut'},tZ-.35)
    .to(vb,{opacity:0,duration:.4},tZ-.3)
    .to(core,{opacity:1,scale:1,duration:.55,ease:'power2.out'},tZ)
    .to(clones.map(o=>o.c),{opacity:0,scale:.2,filter:'blur(10px)',duration:.45,ease:'power2.in'},tZ)
    .call(()=>sfx('bloom'),null,tZ);
  /* 4 · a ripple opens out of it */
  rings.forEach((s3,i)=>{
    tl.fromTo(s3,{scale:0,opacity:.9},{scale:38,opacity:0,duration:1.6,ease:'power2.out'},tZ+.35+i*.2); });
  tl.to(core,{scale:1.45,opacity:.25,duration:.7,ease:'power2.out'},tZ+.5);
  /* 5 · and it comes back as the companies */
  const R=Math.max(140,Math.min(pr.width||innerWidth,innerHeight)*0.30);
  const tB=tZ+.72;
  tiles.forEach((t2,i)=>{
    const a2=(i/tiles.length)*Math.PI*2-Math.PI/2;
    tl.fromTo(t2,{scale:0,opacity:0,filter:'blur(12px)'},
      {x:Math.cos(a2)*R, y:Math.sin(a2)*R, scale:1, opacity:1, filter:'blur(0px)',
       rotate:(i%2?9:-9), duration:.85, ease:'back.out(1.5)'}, tB+i*.06); });
  const tS=tB+tiles.length*.06+.6;
  tl.to(tiles,{rotate:0,scale:1.06,duration:.5,ease:'sine.inOut'},tS)
    .to(core,{opacity:0,duration:.5},tS)
    .to(blobs,{opacity:.35,scale:.9,duration:.8},tS);

  let landed=false, fired=false;
  const land=()=>{ if(landed) return; landed=true; sfx('page');
    if(onLand) onLand();
    setTimeout(()=>sheen(document.querySelector('.shell'),1.35),320); };
  const finish=()=>{ land(); if(fired) return; fired=true;
    if(layer.isConnected) layer.remove();
    if(core.isConnected) core.remove();
    rip.style.display='none'; rip.innerHTML='';
    gsap.to(aur,{opacity:0,duration:.6,onComplete:()=>{aur.innerHTML='';}});
    if(onDone) onDone(); };
  tl.call(land,null,tS+.4)
    .to(tiles,{x:0,y:0,scale:.35,opacity:0,filter:'blur(9px)',duration:.8,ease:EIO,stagger:.035},tS+.5);
  tl.eventCallback('onComplete',finish);
  /* a throttled tab freezes the ticker, so the clock guarantees both handoffs */
  setTimeout(land,(tS+.4)*1000+700);
  setTimeout(finish,(tS+1.5)*1000+900);
}

/* Fixed spots collided as soon as a card ran to two lines, and they bunched to
   one side because a left-anchored card cannot sit past ~60% without spilling.
   Placing each fact on a ring around the person, anchored by its own centre,
   spaces them by construction and uses the whole panel. */
/* one mark per kind of fact, so a glance reads the shape of what Zero found */
const LKICON={'Currently':I.target,'Working at':I.bld,'Studying at':I.bld,
  'Based in':I.pin,'Experience':I.pen,'Doing this for':I.clock,'Skills listed':I.spark,
  'Following':I.heart,'Signals':I.compass,'You told me':I.user};
function lkFact(w,label,value,i,total){
  const f=mk('div','lkf');
  const head=mk('div','lkft');
  const ic=LKICON[label]||I.spark;
  head.innerHTML='<span class="lkfi">'+ic+'</span>'+label;
  f.appendChild(head);
  f.appendChild(mk('div','lkfv',value));
  w.appendChild(f);
  const wr=w.getBoundingClientRect();
  /* start at the top and go round; nudge the radius per item so the ring reads
     as gathered rather than as a dial */
  const ang=(-Math.PI/2)+(i/Math.max(1,total))*Math.PI*2;
  const wob=1+((i%3)-1)*0.09;
  f._ang=ang; f._wob=wob;      /* so a resize can put it back where it belongs */
  const rx=Math.min(wr.width*0.27,232)*wob;
  const ry=Math.min(wr.height*0.24,214)*wob;
  const x=wr.width/2+Math.cos(ang)*rx;
  const y=wr.height/2+Math.sin(ang)*ry;
  f.style.left=x+'px'; f.style.top=y+'px';
  f.style.transform='translate(-50%,-50%) rotate('+((i%2?1:-1)*(0.4+(i%3)*0.4)).toFixed(2)+'deg)';
  /* A ring spaces evenly only if every card is the same size, and they are not
     - a five-item skills list is three lines tall. Walk this one outward along
     its own angle until it clears the ones already placed, so the layout stays
     correct whatever the profile happens to say. */
  const hit=el=>{
    const a=f.getBoundingClientRect();
    const me=w.querySelector('.lkme');
    if(me){ const h=me.getBoundingClientRect();
      if(a.left<h.right+14&&h.left-14<a.right&&a.top<h.bottom+14&&h.top-14<a.bottom) return true; }
    return [...w.querySelectorAll('.lkf')].some(o=>{ if(o===f) return false;
      const b=o.getBoundingClientRect();
      return a.left<b.right+10&&b.left<a.right+10&&a.top<b.bottom+10&&b.top<a.bottom+10; });
  };
  let push=0;
  while(hit()&&push<9){
    push++;
    f.style.left=(x+Math.cos(ang)*push*16)+'px';
    f.style.top =(y+Math.sin(ang)*push*16)+'px';
  }
  /* Pull anything that ran past the panel back inside. A block cut off by the
     edge is worse than one sitting a little closer to its neighbour. */
  (()=>{
    const PAD=16, wb=w.getBoundingClientRect(), fb=f.getBoundingClientRect();
    if(!wb.width||!fb.width) return;
    let nx=parseFloat(f.style.left), ny=parseFloat(f.style.top);
    const l=fb.left-wb.left, t=fb.top-wb.top, r=fb.right-wb.left, b=fb.bottom-wb.top;
    if(l<PAD)           nx+=PAD-l;
    if(r>wb.width-PAD)  nx-=r-(wb.width-PAD);
    if(t<PAD)           ny+=PAD-t;
    if(b>wb.height-PAD) ny-=b-(wb.height-PAD);
    f.style.left=nx+'px'; f.style.top=ny+'px';
  })();
  /* The stroke is not decoration drawn under a card that has already arrived.
     It reaches out from Zero and the fact lands on the end of it, which is the
     difference between a diagram and something being handed to you. */
  f.style.opacity='0';
  return new Promise(resolve=>{
    requestAnimationFrame(()=>{
      /* the panel is still tweening its width while the first facts land, so a
         box measured at entry is already wrong by the time the line is drawn */
      const wr2=w.getBoundingClientRect();
      const fr=f.getBoundingClientRect();
      const cx=wr2.width/2, cy=wr2.height/2;
      const fx=fr.left-wr2.left+fr.width/2, fy=fr.top-wr2.top+fr.height/2;
      const dx=fx-cx, dy=fy-cy, len=Math.hypot(dx,dy)||1;
      const ux=dx/len, uy=dy/len;
      const HUB=44;
      const ln=mk('div','lkline');
      ln.style.left=(cx+ux*HUB)+'px'; ln.style.top=(cy+uy*HUB)+'px';
      /* All the way to the block's centre. Stopping at a computed edge left
         gaps whenever the block shifted after placement, and the block sits
         above the stroke now, so the tail is never seen. */
      ln.style.width=Math.max(0,len-HUB)+'px';
      ln.style.transform='rotate('+Math.atan2(dy,dx)+'rad)';
      ln._for=f;
      w.insertBefore(ln,w.firstChild);
      sfx('whisper');                                   /* the reach */
      safeTL(gsap.timeline({onComplete:()=>{
          f.style.opacity='';
          sfx(i%2 ? 'droplet' : 'tick');                /* the arrival */
          safeTL(gsap.timeline().fromTo(f,{opacity:0,scale:.9,filter:'blur(6px)'},
            {opacity:1,scale:1,filter:'blur(0px)',duration:.42,ease:'back.out(1.6)'}),900);
          resolve(f);
        }})
        .fromTo(ln,{scaleX:0,opacity:.95},{scaleX:1,opacity:1,duration:.34,ease:'power2.out'})
        .to(ln,{opacity:.5,duration:.6},'+=0.05'),1400);
    });
  });
}
/* A correction lands on the LinkedIn board as a new fact, next to the ones
   Zero read, so the user can see their words sitting alongside the profile's. */
/* A company the user chose becomes a block on the board they are looking at,
   carrying what the card said, and the whole set re-separates so it has space
   of its own rather than landing on top of what is already there. */
function absorbPick(card){
  const w=$('lkw'); if(!w||!card) return;
  const seen=w.querySelector('.lkf[data-co="'+card.co+'"]');
  if(seen) return;
  const n=w.querySelectorAll('.lkf').length;
  Promise.resolve(lkFact(w,'You chose',card.co+' · '+card.role,n,n+1))
    .then(f=>{ if(!f) return;
      f.classList.add('picked');
      f.dataset.co=card.co;
      lkRelayout(); setTimeout(lkRelayout,60); });
}
function absorbNote(text){
  const w=$('lkw'); if(!w||!String(text||'').trim()) return;
  const n=w.querySelectorAll('.lkf').length;
  Promise.resolve(lkFact(w,'You told me',String(text).trim().slice(0,120),n,n+1))
    .then(f=>{ if(f) f.classList.add('mine');
      /* re-deal every slot for the new count so the newcomer has its own room */
      lkRelayout(); setTimeout(lkRelayout,60); });

/* The panel is still tweening its width while the first facts land, so a line
   drawn then was measured against a centre that afterwards moved. Rather than
   guess, re-derive every stroke from the final positions once the read is
   over. Each line stores which block it belongs to so the pairing survives. */
function lkRelayout(){
  const w=$('lkw'); if(!w) return;
  const wr=w.getBoundingClientRect();
  if(!wr.width) return;
  const cx=wr.width/2, cy=wr.height/2, HUB=44;
  /* The blocks are placed in pixels, so resizing the panel used to move only
     the hub and leave them stranded - and on a narrower panel they landed on
     top of it. Re-derive every position from the ring, then re-separate and
     re-clamp, before the strokes are redrawn against them. */
  const all=[...w.querySelectorAll('.lkf')];
  /* Angles are re-dealt for the count as it is NOW. Keeping the original
     angles meant a note added later landed on a slot that was already taken,
     which is how three of them ended up stacked on each other. */
  all.forEach((f,idx)=>{
    f._ang=(-Math.PI/2)+(idx/Math.max(1,all.length))*Math.PI*2;
    f._wob=1+((idx%3)-1)*0.09;
  });
  all.forEach(f=>{
    if(f._ang===undefined) return;
    const wob=f._wob||1;
    const rx=Math.min(wr.width*0.27,232)*wob, ry=Math.min(wr.height*0.24,214)*wob;
    f.style.left=(cx+Math.cos(f._ang)*rx)+'px';
    f.style.top =(cy+Math.sin(f._ang)*ry)+'px';
  });
  const overlaps=(f)=>{ const a=f.getBoundingClientRect();
    return all.some(o=>{ if(o===f) return false; const b=o.getBoundingClientRect();
      return a.left<b.right+10&&b.left<a.right+10&&a.top<b.bottom+10&&b.top<a.bottom+10; }); };
  /* the hub is an object on the board too, and nothing may sit on it */
  const hubBox=()=>{ const h=w.querySelector('.lkme').getBoundingClientRect();
    return {l:h.left-14,r:h.right+14,t:h.top-14,b:h.bottom+14}; };
  all.forEach(f=>{
    if(f._ang===undefined) return;
    const x0=parseFloat(f.style.left), y0=parseFloat(f.style.top);
    let push=0;
    const onHub=()=>{ const a=f.getBoundingClientRect(), h=hubBox();
      return a.left<h.r&&h.l<a.right&&a.top<h.b&&h.t<a.bottom; };
    /* push outward along its own spoke, and if that is not enough, fan it
       sideways: on a narrow panel pure radial pushing runs out of room */
    while((overlaps(f)||onHub())&&push<26){
      push++;
      const out=Math.min(push,14)*15;
      const fan=push>14 ? (push-14)*0.07*((push%2)?1:-1) : 0;
      f.style.left=(x0+Math.cos(f._ang+fan)*out)+'px';
      f.style.top =(y0+Math.sin(f._ang+fan)*out)+'px';
    }
    const PAD=16, fb=f.getBoundingClientRect();
    let nx=parseFloat(f.style.left), ny=parseFloat(f.style.top);
    const l=fb.left-wr.left, t=fb.top-wr.top, rr=fb.right-wr.left, b=fb.bottom-wr.top;
    if(l<PAD) nx+=PAD-l;
    if(rr>wr.width-PAD) nx-=rr-(wr.width-PAD);
    if(t<PAD) ny+=PAD-t;
    if(b>wr.height-PAD) ny-=b-(wr.height-PAD);
    f.style.left=nx+'px'; f.style.top=ny+'px';
  });
  w.querySelectorAll('.lkline').forEach(ln=>{
    const f=ln._for; if(!f||!f.isConnected) return;
    const fr=f.getBoundingClientRect();
    const fx=fr.left-wr.left+fr.width/2, fy=fr.top-wr.top+fr.height/2;
    const dx=fx-cx, dy=fy-cy, len=Math.hypot(dx,dy)||1;
    const ux=dx/len, uy=dy/len;
    ln.style.left=(cx+ux*HUB)+'px';
    ln.style.top=(cy+uy*HUB)+'px';
    ln.style.width=Math.max(0,len-HUB)+'px';
    ln.style.transform='rotate('+Math.atan2(dy,dx)+'rad)';
  });
}

/* Zero reads eight things off the profile and then put almost none of them on
   the board, which made the board look like it had learned nothing. Everything
   the profile states goes straight on. What it cannot know yet - the target
   companies, the trade-offs - is left for the cards. */
function absorbLinked(){
  const d=LINKEDIN[PKEY]||LINKEDIN.design;
  if(!d) return [];
  const filled=[];
  const put=(k,v)=>{ if(v&&!P[k]){ P[k]=v; filled.push(k); } };
  const head=String(d.headline||'');
  const roleM=/^(.*?)(?:\s+at\s+.+)?$/.exec(head);
  if(roleM) put('role',roleM[1].replace(/^(Senior|Lead|Staff|Principal|Junior)\s+/i,'').trim());
  put('company',d.org);
  put('location',(d.city||'').split(',')[0].trim());
  if(/final year|student|studying/i.test(head)) put('level','Student');
  else if(d.since||/\sat\s/i.test(head))        put('level','Working');
  put('doing',d.exp);
  /* the companies they follow are the ones they already look up to, so they
     seed the board now; the cards confirm or replace them */
  if(d.follows) put('dream',d.follows.split(/,\s*/).filter(Boolean).slice(0,4).join(', '));
  const blob=((d.follows||'')+' '+(d.skills||'')+' '+head).toLowerCase();
  if(/openai|anthropic|\bai\b|\bml\b/.test(blob))            put('industry','Tech and AI');
  else if(/shopify|commerce|retail/.test(blob))              put('industry','Commerce');
  else if(/health|clinic|patient/.test(blob))                put('industry','Health');
  else if(/figma|notion|linear|design|product/.test(blob))   put('industry','Tech and AI');
  if(d.into) put('problems',d.into);
  return filled;
}

  await beat('Do it well and you climb faster.',()=>addLoopStep(7),1700);
  line('Every round leaves you readier than the last.');
  await wait(2100);
  cta('What do I start with?',creditsStage);
}
function buildReward(s){
  const boxR=mk('div','rew');
  const n=mk('div','rewn','0'); n.id='rewN'; boxR.appendChild(n);
  boxR.appendChild(mk('div','rewl','credits, yours to claim'));
  boxR.appendChild(mk('div','rewsub','Credits are what scenarios and reviews cost inside Zero. 10,000 covers your first 2 months in full. After that, finished work keeps paying for the next brief.'));
  s.appendChild(boxR);
  const d=pack();
  const scen=d.projects.reduce((a,p)=>a+p.steps.length,0);
  const g=mk('div','rewgrid');
  [['Going after',P.aim||P.role||d.role],['Scenarios ready',String(scen)],
   ['Credits','10,000'],['Cost to start','Nothing']]
    .forEach(([k,v])=>{ const r=mk('div','rewrow'); r.appendChild(mk('span','k',k));
      r.appendChild(mk('span','v',I.check+'<span>'+v+'</span>')); g.appendChild(r); });
  s.appendChild(g);
  const dlC=mk('div','dl'); dlC.id='dlCard'; dlC.style.display='none';
  const z=mk('div','dz',ZSVG);
  const nn=mk('div','dn','<div class="dt">Zero for desktop</div><div class="dd">macOS and Windows · your credits are already on it</div>');
  const b=mk('button','db',I.dl+'<span>Download</span>'); b.onclick=()=>sfx('success');
  dlC.appendChild(z); dlC.appendChild(nn); dlC.appendChild(b); s.appendChild(dlC);
}
async function creditsStage(){
  atStep('Credits');
  clearTurn(); dockHide(); await wait(380);
  line('To get started, here is 10,000 credits.');
  await wait(1500);
  await swapPanel('What you start with',buildReward,false,true);
  $('scroll').classList.add('ctr');
  await wait(450);
  const c2={v:0};
  safeTL(gsap.timeline().to(c2,{v:10000,duration:1.7,ease:EIO,
    onUpdate:()=>{const e=$('rewN'); if(e) e.textContent=fmt(Math.round(c2.v));}}),2200);
  setTimeout(()=>{const e=$('rewN'); if(e) e.textContent=fmt(10000);},2250);
  sfx('sparkle');
  setTimeout(()=>{ const e=$('rewN'); if(!e) return;
    const r=e.getBoundingClientRect();
    confetti(r.left+r.width/2, r.top+r.height*.62);
    safeTL(gsap.timeline().fromTo(e,{scale:.94},{scale:1,duration:.6,ease:'back.out(2.4)'}),1200);
    sfx('success'); },1900);
  await wait(2200); sfx('chime');
  line('Enter your email and they are yours.');
  await wait(1200);
  emailDock(v=>{
    const ok=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim());
    if(!ok){ sfx('error'); locked=false;
      gsap.fromTo('.dfield',{x:0},{x:7,duration:.07,yoyo:true,repeat:5}); return; }
    sfx('success'); finishStage(v.trim());
  });
}
async function finishStage(email){
  clearTurn(); dockHide();
  const dlC=$('dlCard');
  if(dlC){ dlC.style.display='flex';
    safeTL(gsap.timeline().fromTo(dlC,{opacity:0,y:16},{opacity:1,y:0,duration:.6}),1000);
    const s=$('scroll'); setTimeout(()=>{s.scrollTop=Math.max(0,s.scrollHeight-s.clientHeight);},300); }
  setCap('Ready when you are',false); await wait(600);
  await voLine('Sent to '+(email||'your inbox')+'.',1700);
  /* the peak. Everything before this was a promise; this is the thing itself,
     with their name on it and a date they can hold us to. */
  const co=dreamList().slice(0,2).join(' and ')||'the companies you picked';
  const wk=(P.timeline==='Now')?10:(P.timeline==='In 3 months')?12:(P.timeline==='No rush')?20:16;
  const d=new Date(); d.setDate(d.getDate()+wk*7);
  const when=d.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  await voLine('Look at what you are about to build.',2000);
  await voLine((P.role||'Your role')+', at '+co+'.',2200);
  await voLine('Ready by '+when+'.',1900);
  await voLine('This is what gets you in the room.',2100);
  await voLine("And you'll have made every piece of it.",2300);
  await wait(400);
  dockFinal('Start week one',()=>{ sfx('success'); });
  sfx('ready');
}

/* Atul's copy, verbatim from the Figma, "I'm Zero" in it. He put real time
   into these words and the narrative is stitched around them. Broken only at
   sentence boundaries - a mid-sentence break is what reads as AI copy. */
const OPEN_CUES=[
 {"t":"Hey, I'm Zero.","s":0},
 {"t":"You're here because you want to find the job you'll be proud to grow into.","s":2.0},
 {"t":"Give me five minutes to understand you. What you want, what you're good at, and what matters to you.","s":5.6},
 {"t":"Then I'll show you the roles where you can thrive, and map the path to get there.","s":10.2},
 {"t":"Let's get started. What should I call you?","s":13.6}];
let openEl=null;
/* One continuous take in Navid's voice, with the on-screen text cued to it.
   Not one clip per line: seeking around inside a file overruns its own line
   and replays it, which is what made the old build stutter. */
function playOpen(){
  const g=gen;
  /* The recorded take says different words now. Until a take exists for this
     copy, the opening is the timed read - wrong audio is worse than none. */
  return timedOpen(g);
  // eslint-disable-next-line no-unreachable
  if(!voOn||!sndOn) return timedOpen(g);
  if(!openEl){ openEl=new Audio(OPEN_SRC); openEl.preload='auto'; }
  const a=openEl;
  try{ a.pause(); a.currentTime=0; }catch(e){}
  let started=false;
  const pr=a.play(); if(pr&&pr.then) pr.then(()=>{started=true;}).catch(()=>{});
  return new Promise(res=>{
    let i=0, done=false;
    let stopClock=null;
    const fin=()=>{ if(done) return; done=true;
      if(stopClock) stopClock();
      try{ a.pause(); }catch(e){} res(); };
    /* autoplay refused: fall back to the timed read so the opening is never blank */
    setTimeout(()=>{ if(done||started||a.currentTime>0) return;
      timedOpen(g).then(()=>{ if(!done){ done=true; res(); } }); },420);
    /* rAF is the obvious clock and the wrong one: a backgrounded or throttled
       tab pauses it outright, the audio plays on, and every cue lands at once
       on the last line. timeupdate plus a short interval keeps firing. */
    const tick=()=>{
      if(done) return;
      if(g!==gen){ fin(); return; }
      while(i<OPEN_CUES.length && a.currentTime>=OPEN_CUES[i].s){ line(OPEN_CUES[i].t); i++; }
      if(a.ended) fin();
    };
    const iv=setInterval(tick,80);
    a.addEventListener('timeupdate',tick);
    const stop=()=>{ clearInterval(iv); a.removeEventListener('timeupdate',tick); };
    stopClock=stop;
    a.addEventListener('ended',()=>{ tick(); stop(); fin(); },{once:true});
    setTimeout(()=>{ stop(); fin(); },(a.duration||15)*1000+1500);
  });
}
async function timedOpen(g){
  for(let i=0;i<OPEN_CUES.length;i++){
    if(g!==gen) return;
    line(OPEN_CUES[i].t);
    const nx=OPEN_CUES[i+1];
    await wait(nx?Math.max(900,(nx.s-OPEN_CUES[i].s)*1000):1800);
  }
}

  cv.addEventListener('pointermove',e=>{ if(!down)return;
    const p={x:e.clientX,y:e.clientY,t:performance.now()}, q2=pts[pts.length-1];
    const d2=Math.hypot(p.x-q2.x,p.y-q2.y);
    if(d2<2.5) return;
    AUD.penMove(d2/Math.max(1,p.t-q2.t));
    len+=d2; pts.push(p); inkSeg(); });
  const fin=()=>{ if(!down)return; down=false; AUD.penStop();
    /* the zero must close: start and end land near each other */
    const a=pts[0], b=pts[pts.length-1];
    let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
    pts.forEach(pp=>{ minx=Math.min(minx,pp.x); miny=Math.min(miny,pp.y);
      maxx=Math.max(maxx,pp.x); maxy=Math.max(maxy,pp.y); });
    const diag=Math.hypot(maxx-minx,maxy-miny);
    const closed=len>250 && Math.hypot(b.x-a.x,b.y-a.y)<Math.max(80,diag*INK.tol);
    if(closed) accept();
    else { sfx('tick'); retract(); } };
  /* A fade dissolves the whole mark at once, which reads as an error message.
     Retracting it walks the head along the path so the stroke un-draws itself
     from the start and the last thing left is the tail, still moving. */
  function retract(){
    const total=pts.length;
    if(total<3){ clearInk(); pts=[]; return; }
    const o={head:0};
    const draw=()=>{
      clearInk();
      ctx.fillStyle=INK.color; ctx.globalAlpha=1;
      const head=Math.floor(o.head);
      for(let i=head+1;i<total;i++){
        /* the tail thins as it goes, so the last of the ink looks like it is
           being lifted rather than chopped */
        const life=(i-head)/Math.max(1,total-head);
        const w=W*Math.min(1,.35+life*.9);
        ribbon(pts[i-1],pts[i],w,w);
      }
    };
    safeTL(gsap.timeline({onComplete:()=>{ clearInk(); pts=[]; }})
      .to(o,{head:total-1,duration:.62,ease:'power2.in',onUpdate:draw}),1400);
  }
  cv.addEventListener('pointerup',fin); cv.addEventListener('pointercancel',fin);
  cv.addEventListener('dblclick',()=>accept(true));
  addEventListener('keydown',e=>{ if(e.key==='Enter'&&$('drawScreen').style.display!=='none') accept(true); });
  let accepted=false;
  window.__acceptDraw=()=>accept(true);
  function accept(skip){
    if(accepted) return; accepted=true;
    AUD.penStop(); AUD.whoosh();
    /* the ink swells until it floods the whole screen, then the world goes dark */
    gsap.to('#dH',{opacity:0,y:-10,duration:.35});
    if(!skip&&pts.length>2){
      const obj={w:W};
      const cover=Math.hypot(innerWidth,innerHeight)*2.2;
      const redraw=()=>{ ctx.fillStyle=INK.color; ctx.globalAlpha=1;
        for(let i=1;i<pts.length;i++) ribbon(pts[i-1],pts[i],obj.w,obj.w);
        ribbon(pts[pts.length-1],pts[0],obj.w,obj.w); };
      safeTL(gsap.timeline().to(obj,{w:cover,duration:1.15,ease:'power3.in',onUpdate:redraw}),1900);
    }
    /* the charge rides out with the ink as it sweeps itself shut: a soft
       anticipation ahead of the dark, never a hard ring */
    const d=$('drawScreen');
    let flipped=false;
    const flip=()=>{
      if(flipped) return; flipped=true;
      document.body.classList.add('dark');
      d.style.background='#0E0E10';
    };
    setTimeout(()=>{
      const en=mk('div','energ'); document.body.appendChild(en);
      const o={p:0};
      const paint=()=>{
        const r1=o.p*150;
        const r2=Math.max(0,(o.p-.38)/.62)*150;
        en.style.setProperty('--r1',r1.toFixed(1)+'%');
        en.style.setProperty('--r2',r2.toFixed(1)+'%');
      };
      en.style.setProperty('--r1','0%'); en.style.setProperty('--r2','0%');
      safeTL(gsap.timeline()
        .to(en,{opacity:.5,duration:.34,ease:'power2.out'},0)
        .to(o,{p:1,duration:1.5,ease:'power2.out',onUpdate:paint},0)
        .to(en,{opacity:0,duration:.5,ease:'power2.in'},1.05),2600);
      setTimeout(()=>{ if(en.isConnected) en.remove(); },2300);
    }, skip?120:300);
    setTimeout(flip, skip?420:1180);
    setTimeout(()=>{ gsap.to(d,{opacity:0,duration:.6}); }, skip?520:1320);
    setTimeout(()=>{ d.style.display='none'; openStage(); }, skip?900:1780);
  }
}

  const {box}=turn({q:'Connect your LinkedIn, drop a resume, or just tell me.'});

/* ---- 3 - what the profile said, and the invitation to correct it --------
   Zero offers a reading and asks to be corrected. No role question here:
   roles are inferred later, from choices rather than claims. */
/* point at the rows being talked about; everything else steps back */
function spotRows(ids){
  const vb=$('vb'); if(!vb) return;
  vb.classList.add('spotting');
  vb.querySelectorAll('.vbs').forEach(r=>r.classList.toggle('spot',ids.indexOf(r.dataset.id)>=0));
}
function unspot(){
  const vb=$('vb'); if(!vb) return;
  vb.classList.remove('spotting');
  vb.querySelectorAll('.vbs.spot').forEach(r=>r.classList.remove('spot'));
}
async function readbackStage(){
  atStep('Read back');
  setPhase(0);
  bornPanel();
  clearTurn(); dockHide(); await wait(360);
  const d=(typeof LINKEDIN!=='undefined'&&(LINKEDIN[PKEY]||LINKEDIN.design))||{};
  if(P.linked){
    spotRows(['s1']);
    await voLine('Okay, '+P.name+". I've read your LinkedIn.",2100);
    await voLine((d.headline||'Early in your career')+'.',2000);
    spotRows(['p1','p2']);
    if(d.exp&&/year/i.test(d.exp)) await voLine("You're in your "+lower1(d.exp)+(d.since?', with '+lower1(d.since)+' behind you':'')+'.',2500);
    else if(d.exp) await voLine('You have done '+lower1(d.exp)+'.',2300);
    spotRows(['p2']);
    if(d.skills) await voLine('I can see signals around '+firstFew(d.skills,3)+'.',2500);
    spotRows(['s1','p1','p2','p3']);
    await voLine("That's the story I'm seeing. I could be wrong.",2300);
  }
  unspot();
  await voLine('Tell me what I got wrong, or what I missed.',2600);
  const {box}=turn({q:P.linked?'Have I missed anything?':'Tell me where you are starting from.'});
  devPills(box,[
    "That feels right. I started in graphic design, did an internship there, but recently I've been looking more into product design.",
    "Mostly right, though I've moved away from graphics. Product design is the direction I want to explore."
  ],handleNote);
  askOpen(box,handleNote);
  function handleNote(text){
    if(locked) return; locked=true;
    P.about=text;
    /* Whatever they said that the sentence has no room for still gets kept.
       This is the "someone who enjoys creative spaces" case: not part of the
       story, but not thrown away either. */
    harvestPins(text);
    if(typeof extractInto==='function') extractInto(text);
    /* a correction updates the LinkedIn board in place; the Zero board does
       not exist yet and must not be conjured by an edit */
    absorbNote(text);
    const pivot=detectPivot(text);
    if(pivot){ P.pivot=pivot; go(()=>pivotStage(pivot)); }
    else go(cardsIntroStage);
  }
}

/* the profile is written for a card, not for a sentence: trim it to something
   Zero can actually say out loud in one breath */
const lower1=t=>String(t||'').charAt(0).toLowerCase()+String(t||'').slice(1);
function firstFew(list,n){
  const a=String(list||'').split(/,\s*/).filter(Boolean).slice(0,n);
  return a.length<2 ? (a[0]||'') : a.slice(0,-1).join(', ')+' and '+a[a.length-1];
}

/* a pivot is the most interesting thing a note can contain, so it gets asked
   about rather than filed away */
const PIVOTS=[['graphic design','product design'],['marketing','product'],
  ['engineering','product'],['analytics','product'],['research','design']];
function detectPivot(t){
  const x=String(t||'').toLowerCase();
  for(const [from,to] of PIVOTS){
    if(x.indexOf(from)>=0 && x.indexOf(to)>=0 && x.indexOf(from)<x.lastIndexOf(to)) return [from,to];
  }
  return null;
}

/* ---- 4 - the pivot question -------------------------------------------- */
async function pivotStage(pv){
  atStep('Pivot');
  setPhase(0);
  const [from,to]=pv||['graphic design','product design'];
  await voLine("That's a meaningful shift, from "+from+' to '+to+'.',2600);
  const {box}=turn({q:'What is it about '+to+' that feels right for you?'});
  devPills(box,[
    "It feels like where things are moving. AI is changing everything and that makes me a little nervous too. I want to solve real problems and build a career I can grow in.",
    "I want to work on products people actually use, not just make things look good."
  ],handle);
  askOpen(box,handle);
  function handle(text){
    if(locked) return; locked=true;
    P.why=text;
    if(typeof extractInto==='function') extractInto(text);
    go(cardsIntroStage);
  }
}

/* ---- 5 - handing over to the cards -------------------------------------- */
/* say back the thing they actually told us, not a generic nod */
function reflectPivot(){
  const t=String(P.why||'').toLowerCase();
  if(/real problem|actually use|people use/.test(t)) return 'Real problems, on things people actually use. Noted.';
  if(/grow|career/.test(t))                          return 'Somewhere you can keep growing. Noted.';
  if(/ai|nervous|uncertain|figur/.test(t))           return 'Still figuring out where AI lands. That is fair.';
  return 'Got it. That helps more than you would think.';
}
async function cardsIntroStage(){
  atStep('Cards intro');
  /* The board is a drawer and this is where it shuts. The cards are the whole
     event and anything else on screen competes with them - and no single pick
     is interpretable yet anyway, so there is nothing honest to add. */
  boardLive=false;
  setPhase(1);
  clearTurn(); dockHide(); await wait(380);
  /* every other handoff restates what they just said; this was the only one
     that did not, after the most personal answer in the flow */
  if(P.why) /* A person hearing "I am changing direction" says "I get why" before they
     say "now do this". Skipping it is what made the flow feel like a form. */
  await voLine('I get why you moved. Product design is where a lot of this is heading.',3000);
  if(myGen!==gen) return;
  await voLine(reflectPivot(),2400);
  await voLine('Okay, '+P.name+'. Two roles at a time.',1900);
  await voLine("Both close to where you're headed.",2000);
  await voLine("Each time, pick the one that feels more like you. There isn't a perfect answer.",3000);
  await voLine('Your choices tell me what matters most.',2100);
  await voLine('So I can build a path around it.',2000);
  cardsStage();
}

/* ---------------------------------------------------------------- engine ----
   Confidence is lean x evidence, never a raw score. Lean has a dead zone, so a
   near tie reports "unknown" instead of a weak winner; evidence saturates, so a
   repeat that agrees raises confidence even though it barely moves the mean.
   Together they make the one guarantee that matters: Zero cannot say something
   confident that the choices do not support. */
const RSTATE={};
/* A round claims to isolate one axis by holding the others equal. Nothing was
   checking that the cards actually do hold them, so a pool edit could quietly
   turn an isolate round into a confounded one and the read-out would keep
   citing it as clean evidence. This verifies every claim at boot: a hold that
   does not hold is demoted to `varies` and the round is flagged confounded,
   which drops its weight rather than silently lying. */
function auditRounds(){
  const problems=[];
  RROUNDS.forEach(r=>{
    const A=RCARD[r.a], B=RCARD[r.b];
    if(!A||!B){ problems.push({round:r.n,issue:'missing card'}); return; }
    (r.holds||[]).slice().forEach(h=>{
      let ok=true;
      if(h==='compPct')      ok=Math.abs(A.t.compPct-B.t.compPct)<=0.08;
      else if(h==='company') ok=A.co===B.co;
      else if(h==='city')    ok=A.t.city===B.t.city;
      else                   ok=A.t[h]===B.t[h];
      if(!ok){
        problems.push({round:r.n,hold:h,a:A.t[h]!==undefined?A.t[h]:A.co,b:B.t[h]!==undefined?B.t[h]:B.co});
        r.holds=r.holds.filter(x=>x!==h);
        r.varies=(r.varies||[]).concat(h);
        r.confounded=true;
      }
    });
    /* a claim on an axis that does not actually differ teaches nothing */
    (r.claims||[]).forEach(c=>{
      if(c.a===c.b) problems.push({round:r.n,claim:c.dim,issue:'both sides identical'});
    });
  });
  if(problems.length&&/[?&]debug=1/.test(location.search)) console.table(problems);
  return problems;
}
const RAUDIT=auditRounds();
function rreset(){
  ['world','shape','ethos'].forEach(k=>RSTATE[k]={kind:'beta',a:1,b:1,ev:[]});
  ['location','type','domain','level'].forEach(k=>RSTATE[k]={kind:'pair',W:{},ev:[]});
  RSTATE.comp={trials:[],forgone:0};
  RPICKS.length=0;
}
const RPICKS=[];
function wbump(node,win,lose,w){
  node.W[win]=node.W[win]||{}; node.W[win][lose]=(node.W[win][lose]||0)+w;
}
function rconf(k){
  const n=RSTATE[k]; if(!n) return 0;
  if(n.kind==='beta'){
    const mean=n.a/(n.a+n.b), ev=n.a+n.b-2;
    const lean=Math.max(0,Math.min(1,(Math.abs(mean-.5)-.08)/.32));
    return lean*(1-Math.exp(-ev/1.1));
  }
  const r=rrank(k); if(r.length<2) return 0;
  const sep=(r[0].p-r[1].p)/(r[0].p+r[1].p||1);
  const tot=n.ev.reduce((a,e)=>a+e.w,0);
  return Math.max(0,Math.min(1,sep*2.2))*(1-Math.exp(-tot/1.1));
}
/* Bradley-Terry: two cities may never meet directly, so a win count cannot
   rank them. This lets the unseen pair be inferred through the ones that did. */
function rrank(k){
  /* rconf already guards this; rrank did not, so jumping straight to the roles
     screen threw before a single tile could render */
  const n=RSTATE[k]; if(!n||!n.W) return [];
  const W=n.W, opts=[...new Set(Object.keys(W).concat(
    ...Object.values(W).map(o=>Object.keys(o))))];
  if(!opts.length) return [];
  const p={}; opts.forEach(o=>p[o]=1);
  for(let t=0;t<60;t++){
    opts.forEach(i=>{
      /* phantom opponent plays one win AND one loss, so an option that never
         lost cannot run away to infinity */
      let num=.5,den=1/(p[i]+1);
      opts.forEach(j=>{ if(i===j) return;
        num+=(W[i]&&W[i][j])||0;
        const tot=((W[i]&&W[i][j])||0)+((W[j]&&W[j][i])||0);
        if(tot>0) den+=tot/(p[i]+p[j]);
      });
      p[i]=Math.max(1e-4,num/den);
    });
    const g=Math.exp(opts.reduce((a,o)=>a+Math.log(p[o]),0)/opts.length);
    opts.forEach(o=>p[o]=p[o]/g);          /* scale is meaningless; ratios are not */
  }
  return opts.map(o=>({opt:o,p:p[o]})).sort((x,y)=>y.p-x.p);
}
function rwinner(k){
  const n=RSTATE[k]; if(!n) return null;
  if(n.kind==='beta') return n.a>=n.b?n.optA:n.optB;
  const r=rrank(k); return r.length?r[0].opt:null;
}
function rapply(round,pick){
  const chose=pick==='a'?round.a:round.b;
  RPICKS.push({n:round.n,pick:pick,card:chose});
  const phaseW={explore:1.0,isolate:1.25,tradeoff:1.15}[round.phase]||1;
  /* costly signal: in a trade-off round, taking the cheaper card means money
     was on the table and lost, so the attribute claim is worth more. Taking the
     richer one leaves money as an unexcluded explanation, so it is worth less. */
  let costly=1;
  if(round.phase==='tradeoff'){
    const A=RCARD[round.a].t.compPct, B=RCARD[round.b].t.compPct;
    const tookCheaper=(pick==='a'?A:B)<(pick==='a'?B:A);
    costly=tookCheaper?1.4:0.3;
  }
  (round.claims||[]).forEach(c=>{
    if(c.a===c.b) return;                       /* nothing to learn from a tie */
    const roleW=c.role==='primary'?1:c.role==='secondary'?.45:1/(round.claims.length||1);
    const w=phaseW*roleW*(round.confounded?.5:1)*costly;
    const win=pick==='a'?c.a:c.b, lose=pick==='a'?c.b:c.a;
    const node=RSTATE[c.dim]; if(!node) return;
    if(node.kind==='beta'){
      node.optA=node.optA||c.a; node.optB=node.optB||c.b;
      if(win===node.optA) node.a+=w; else node.b+=w;
    } else wbump(node,win,lose,w);
    node.ev.push({n:round.n,win:win,w:w,confounded:!!round.confounded,costly:costly>1});
  });
  if(round.compTrial){
    const A=RCARD[round.a].t.compPct, B=RCARD[round.b].t.compPct;
    const tookRicher=(pick==='a'?A:B)>(pick==='a'?B:A);
    const gap=Math.abs(A-B);
    RSTATE.comp.trials.push({n:round.n,tookRicher:tookRicher,gap:gap,
      w:round.phase==='tradeoff'?1:.4});
    if(!tookRicher) RSTATE.comp.forgone+=gap;
  }
}
/* how hard money pulled, 0 = never chose it, 1 = always */
function rmoneyPull(){
  const t=RSTATE.comp.trials; if(!t.length) return .5;
  const tot=t.reduce((a,x)=>a+x.w,0);
  return t.reduce((a,x)=>a+(x.tookRicher?x.w:0),0)/(tot||1);
}

function rroundsToPlay(){
  const n=parseInt(localStorage.getItem(RCOUNT_KEY)||'10',10);

/* The three phases each do a different job: explore reads you, isolate repeats
   to raise confidence, trade-off makes you pay for what you said you wanted.
   Cutting the deck to 10 by truncation would drop every trade-off round, so
   the read-out would claim money came second with nothing behind it. Sample
   proportionally instead. */
function rdeck(){
  const total=rroundsToPlay();
  if(total>=RROUNDS.length) return RROUNDS.slice();
  const byPhase={explore:[],isolate:[],tradeoff:[]};
  RROUNDS.forEach(r=>byPhase[r.phase].push(r));
  const order=['explore','isolate','tradeoff'];
  const want={}; let left=total;
  order.forEach((ph,i)=>{
    const n=i===order.length-1?left:Math.max(1,Math.round(total*byPhase[ph].length/RROUNDS.length));
    want[ph]=Math.min(n,byPhase[ph].length); left-=want[ph];
  });
  /* within a phase, take rounds that cover a dimension not yet seen before
     taking a second round on the same axis. Trimming by position quietly drops
     round 9, the only clean two-city comparison, and the ranking loses the one
     piece of evidence that was not confounded by the work. */
  const out=[], seen={};
  order.forEach(ph=>{
    const pool=byPhase[ph].slice(); let n=want[ph];
    const dims=r=>(r.claims||[]).filter(c=>c.role!=='secondary').map(c=>c.dim);
    while(n>0&&pool.length){
      let idx=pool.findIndex(r=>dims(r).some(d=>!seen[d]));
      if(idx<0) idx=0;
      const r=pool.splice(idx,1)[0];
      dims(r).forEach(d=>seen[d]=1);
      out.push(r); n--;
    }
  });
  return out.sort((x,y)=>x.n-y.n);
}

/* Cursor-driven tilt. With a 760px perspective this is a real turn rather than
   a hint of one, but it still stops short of shearing the text. */
function gyro(el){
  const M=13;
  el.addEventListener('pointermove',e=>{
    const r=el.getBoundingClientRect();
    if(!r.width) return;
    const px=(e.clientX-r.left)/r.width-.5;
    const py=(e.clientY-r.top)/r.height-.5;
    el.style.transition='box-shadow .3s, border-color .24s';
    el.style.transform='rotateY('+(px*M*2).toFixed(2)+'deg) rotateX('+(-py*M*2).toFixed(2)+'deg)';
  });
  el.addEventListener('pointerleave',()=>{
    el.style.transition='box-shadow .3s, border-color .24s, transform .55s var(--e,cubic-bezier(.625,.05,0,1))';
    el.style.transform='';
  });
}

      .to(other.parentElement||other,{opacity:0,y:26,
        rotate:(other.parentElement||other).classList.contains('tiltL')?-7:7,
        duration:.4,ease:'power2.in'},0)
      .add(()=>{ if(row.isConnected) row.remove(); }),1200);
    renderBoard();
    setTimeout(()=>{
      if(myGen!==gen) return;
      RN++; locked=false; rcRound(myGen,false);
    },620);
  };});
}


/* ---------------------------------------------------------------- read-out --
   The locked sentence is the TOP tier, reachable only when every clause's gate
   passes. Each clause steps down through weaker wordings and then out
   altogether. This is the whole point of the mechanic: the user has to
   recognise the trade they made, and a claim they did not make destroys that
   faster than saying nothing would. */
const RWORDS={
  location:{
    strong:'Location matters a lot.',
    moderate:'Location seems to matter a lot.',
    weak:"Location might matter more than you'd say out loud."},
  work:{
    strong:"You're drawn to ambitious teams, and work where you help people or teams get something real done.",
    moderate:'You lean toward ambitious teams, and work that helps people get something real done.',
    weak:'Ambitious teams pulled you some of the time, though not every time.'},
  comp:{
    strong:'Compensation matters, but you repeatedly chose the right work and place over a stronger package.',
    moderate:'Compensation matters, and more than once you chose the work and the place over a stronger package.',
    mixed:"Compensation matters, and you traded it both ways, so I'd call that one open.",
    first:'Compensation came first more often than not, and that is a real answer too.'}
};
function rtier(c){ return c>=.70?'strong':c>=.45?'moderate':c>=.25?'weak':null; }
function rcites(k){
  const n=RSTATE[k]; if(!n) return [];
  return [...new Set(n.ev.map(e=>e.n))].sort((a,b)=>a-b);
}
function rreadout(){
  const parts=[], cites=[];
  const lc=rconf('location');
  const lt=rtier(lc);
  if(lt){ parts.push(RWORDS.location[lt]); cites.push({c:'location',rounds:rcites('location')}); }

  /* "ambitious teams AND work that helps people" is two claims wearing one
     coat, so both have to clear on their own or it steps down */
  const ec=rconf('ethos'), wc=rconf('world');
  const both=Math.min(ec,wc), wt=rtier(both);
  if(wt){ parts.push(RWORDS.work[wt]);
    cites.push({c:'work',rounds:[...new Set(rcites('ethos').concat(rcites('world')))].sort((a,b)=>a-b)}); }

  /* "repeatedly" is a count, so it needs a count behind it */
  const pull=rmoneyPull(), tr=rtradeoffs(), forg=RSTATE.comp.forgone;
  let ck=null;
  if(tr>=3&&pull<.40&&forg>=.30) ck='strong';
  else if(tr>=2&&pull<.50)       ck='moderate';
  else if(pull>=.60)             ck='first';
  else if(tr>=1)                 ck='mixed';
  if(ck){ parts.push(RWORDS.comp[ck]); cites.push({c:'comp',rounds:RSTATE.comp.trials.map(t=>t.n)}); }

  if(!parts.length) parts.push('I have a first read on you, but I want to check it with you.');
  return {lines:parts, cites:cites};
}

async function reflectStage(){
  atStep('Reflection');
  const myGen=gen;
  clearTurn(); dockHide(); await wait(420);
  if(myGen!==gen) return;
  const r=rreadout();
  /* This is Zero talking, not a report to audit. One thought at a time, the
     last receding as the next arrives - the citations were turning agreement
     into proofreading. Nothing else is on screen; the board is shut. */
  await voLine("Here's what I heard from your choices.",2200);
  if(myGen!==gen) return;
  const {box}=turn({q:''});
  const say=mk('div','rsay'); box.appendChild(say);
  for(let i=0;i<r.lines.length;i++){
    if(myGen!==gen) return;
    const p=mk('p','rsayl',r.lines[i]);
    say.appendChild(p);
    /* what came before does not vanish, it just stops being the live one */
    Array.from(say.children).forEach(el=>{ if(el!==p) el.classList.add('past'); });
    enter([p],{y:14,blur:7,duration:.62},1400);
    await wait(2000+r.lines[i].length*12);
  }
  if(myGen!==gen) return;
  await wait(300);
  choices(box,[['check','That is me','ok'],['pen','Let me adjust it','edit']],v=>{
    if(v==='ok'){ PFAT=0; psyncP(); go(()=>visionStage(false)); }

/* ------------------------------------------------------------ preferences --
   Six screens, all pre-answered. Editing never touches the tallies: an
   override is stored beside them, so a claim can still cite the rounds that
   produced it - or say "you told me this" when it cannot. */
const PFOVERRIDE={};
function presolve(k){
  if(PFOVERRIDE[k]!==undefined) return PFOVERRIDE[k];
  if(k==='location') return rrank('location').map(r=>r.opt);
  if(k==='priorities') return ppriority();
  return rwinner(k);
}
function pedit(k,v){ PFOVERRIDE[k]=v; psyncP(); }
function pstated(k){ return PFOVERRIDE[k]!==undefined; }

const PFLABEL={
  b2c:'B2C', b2b:'B2B', collaborative:'Collaborative', individual:'Individual craft',
  frontier:'Frontier', established:'Established scale',
  ai_frontier:'AI frontier', commerce:'Commerce', saas:'SaaS', creator:'Creator', impact:'Impact',
  ai_interaction:'AI interaction', team_tools:'Team tools', everyday_utility:'Everyday utility',
  learning:'Learning', creator_tools:'Creator tools',
  toronto:'Toronto', new_york:'New York', san_francisco:'San Francisco'
};
const PFSUB={
  ai_frontier:'OpenAI · Anthropic · Perplexity', commerce:'DoorDash · Shopify · Uber',
  saas:'Figma · Stripe · Salesforce', creator:'Adobe · Spotify', impact:'Health · Climate · Civic',
  b2c:'People using a product in their everyday lives.', b2b:'Teams and the systems they run on.',
  collaborative:'Work that moves because a team moves with it.',
  individual:'Work you can take from blank to finished yourself.',
  toronto:'Canada', new_york:'United States', san_francisco:'United States'
};
/* order by how much weight each axis actually carried, not by confidence: the
   thing you traded for most often is the thing that matters most */
function ppriority(){
  const pull=k=>{ const n=RSTATE[k]; if(!n) return 0;
    return (n.ev||[]).reduce((a,e)=>a+e.w*(e.costly?1.4:1),0); };
  const work=pull('ethos')+pull('world')+pull('shape');
  const loc=pull('location');
  const money=RSTATE.comp.trials.reduce((a,t)=>a+(t.tookRicher?t.w:0),0)*1.6;
  const rows=[
    {k:'work', t:'Work that feels right', s:pworkSub(), v:work},
    {k:'location', t:'Location', s:(PFLABEL[presolveCity()]||'Your top city')+' first', v:loc},
    {k:'comp', t:'Compensation', s:rmoneyPull()<.5?'important, not first':'came first more often', v:money}
  ];
  return rows.sort((a,b)=>b.v-a.v);
}
function presolveCity(){ const l=presolve('location'); return l&&l.length?l[0]:'toronto'; }
function pworkSub(){
  const a=PFLABEL[presolve('shape')]||'', b=PFLABEL[presolve('type')]||'';
  return [a,b].filter(Boolean).join(' + ').toLowerCase()||'the work you kept choosing';
}
/* the board and the roles read from P, so mirror the resolved answers into it */
function psyncP(){
  const city=presolveCity();
  P.location=PFLABEL[city]||P.location;
  const t=presolve('type');
  /* these must be keys IND_COS actually knows, or COS() silently falls back
     to the persona defaults and the board shows companies nobody chose */
  P.industry=t==='ai_frontier'?'Tech and AI':t==='commerce'?'Commerce':
             t==='saas'?'Tech and AI':t==='creator'?'Media':P.industry;
  const d=presolve('domain');
  if(PFLABEL[d]) P.problems=PFLABEL[d];
}

const PFSCREENS=[
 {id:'01',key:'type',    kind:'bubbles',title:'Companies that tend to attract you',
  opts:['ai_frontier','commerce','saas','creator','impact']},
 {id:'02',key:'shape',   kind:'two',    title:'How you like to work',
  opts:['collaborative','individual']},
 {id:'03',key:'world',   kind:'two',    title:'The userbase you would design for',
  opts:['b2c','b2b']},
 {id:'04',key:'domain',  kind:'bubbles',title:'The problems you want to spend time on',
  opts:['ai_interaction','team_tools','everyday_utility','learning','creator_tools']},
 {id:'05',key:'location',kind:'ranked', title:'Where can this future happen?'},
 {id:'06',key:'priorities',kind:'order',title:'And this is the order you kept choosing'}
];

function pwhy(key){
  if(pstated(key)) return 'You told me this.';
  const r=rcites(key);
  if(!r.length) return '';
  return 'From your choices in round'+(r.length>1?'s ':' ')+r.join(', ')+'.';
}

/* pools the user added on top of the one Zero read, per screen */
const PFALSO={};
function pbubbles(box,sc){
  const win=presolve(sc.key);
  const ranked=sc.opts.slice().sort((a,b)=>(a===win?-1:b===win?1:0));
  const wrap=mk('div','pfbub');
  /* the chosen one sits in the middle at full size; the rest orbit it, still
     one tap away, because this screen exists to be disagreed with */
  const ring=[[50,50,158],[20,24,92],[80,26,84],[17,74,80],[83,76,88]];
  ranked.forEach((o,i)=>{
    const [x,y,d]=ring[Math.min(i,ring.length-1)];
    const extra=PFALSO[sc.key]||[];
    const on=(i===0)||extra.indexOf(o)>=0;
    const b=mk('button','pfb'+(i===0?' pfmid':on?' pfalso':' pfoff'));
    b.style.cssText='width:'+d+'px;height:'+d+'px;left:calc('+x+'% - '+(d/2)+'px);top:calc('+y+'% - '+(d/2)+'px)';
    b.appendChild(mk('b',null,PFLABEL[o]||o));
    if(i===0&&PFSUB[o]) b.appendChild(mk('span',null,PFSUB[o]));
    /* Multi-select: "मुझे तो ये भी पसंद है और ये भी" is a real answer, and
       letting someone widen their own net costs us nothing. Tapping the one
       Zero read promotes a second pool instead; tapping an extra drops it. */
    b.onclick=()=>{
      if(locked) return; sfx('toggle');
      if(i===0){ pedit(sc.key,o); PFALSO[sc.key]=[]; }
      else {
        const a=PFALSO[sc.key]||(PFALSO[sc.key]=[]);
        const at=a.indexOf(o); if(at>=0) a.splice(at,1); else a.push(o);
      }
      prender(sc);
    };
    wrap.appendChild(b);
  });
  box.appendChild(wrap);
  enter(Array.from(wrap.children),{y:14,blur:8,scale:.9,stagger:.05,duration:.55},1500);
}
function ptwo(box,sc){
  const win=presolve(sc.key);
  const row=mk('div','pftwo');
  sc.opts.forEach(o=>{
    const p=mk('button','pfp'+(o===win?' on':''));
    p.appendChild(mk('h4',null,PFLABEL[o]||o));
    if(PFSUB[o]) p.appendChild(mk('p',null,PFSUB[o]));
    if(o===win) p.appendChild(mk('span','pfsel','This is what I read'));
    p.onclick=()=>{ if(locked) return; sfx('toggle'); pedit(sc.key,o); prender(sc); };
    row.appendChild(p);
  });
  box.appendChild(row);
  enter(Array.from(row.children),{y:16,blur:8,stagger:.06,duration:.55},1400);
}
function pranked(box,sc){
  const order=presolve('location').slice();
  const list=mk('div','pfrank');
  order.forEach((o,i)=>list.appendChild(prow(i+1,PFLABEL[o]||o,PFSUB[o]||'',o,order,sc)));
  box.appendChild(list);
  /* a pair the rounds never put head to head has no honest rank */
  const c=rconf('location');
  if(c<.45){
    const tie=mk('div','pftie','These are close. You never compared them directly, so drag to set the order.');
    tie.style.marginTop='10px'; box.appendChild(tie);
  }
  enter(Array.from(list.children),{y:12,blur:6,stagger:.06,duration:.5},1300);
}
function prow(n,title,sub,key,order,sc){
  const r=mk('div','pfr'); r.draggable=true; r.dataset.k=key;
  r.appendChild(mk('span','pfrn',String(n)));
  const t=mk('div','pfrt'); t.appendChild(mk('b',null,title));
  if(sub) t.appendChild(mk('span',null,sub));
  r.appendChild(t);
  r.appendChild(mk('span','pfgrip','⋮⋮'));
  r.ondragstart=e=>{ r.classList.add('drag'); e.dataTransfer.setData('text/plain',key); };
  r.ondragend=()=>r.classList.remove('drag');
  r.ondragover=e=>{ e.preventDefault(); r.classList.add('over'); };
  r.ondragleave=()=>r.classList.remove('over');
  r.ondrop=e=>{ e.preventDefault(); r.classList.remove('over');
    const from=e.dataTransfer.getData('text/plain');
    if(!from||from===key) return;
    const a=order.indexOf(from), b=order.indexOf(key);
    order.splice(b,0,order.splice(a,1)[0]);
    sfx('tick'); pedit('location',order.slice()); prender(sc);
  };
  return r;
}
function porder(box,sc){
  const rows=presolve('priorities');
  const list=mk('div','pfrank');
  /* this screen states the most contestable thing Zero says - that money came
     second - so of all six it is the one that has to be draggable */
  rows.forEach((r,i)=>{
    const el=mk('div','pfr'); el.draggable=true; el.dataset.k=r.k;
    el.appendChild(mk('span','pfrn',String(i+1)));
    const t=mk('div','pfrt'); t.appendChild(mk('b',null,r.t)); t.appendChild(mk('span',null,r.s));
    el.appendChild(t);
    el.appendChild(mk('span','pfgrip','\u22ee\u22ee'));
    el.ondragstart=e=>{ el.classList.add('drag'); e.dataTransfer.setData('text/plain',r.k); };
    el.ondragend=()=>el.classList.remove('drag');
    el.ondragover=e=>{ e.preventDefault(); el.classList.add('over'); };
    el.ondragleave=()=>el.classList.remove('over');
    el.ondrop=e=>{ e.preventDefault(); el.classList.remove('over');
      const from=e.dataTransfer.getData('text/plain'); if(!from||from===r.k) return;
      const cur=presolve('priorities').slice();
      const a=cur.findIndex(x=>x.k===from), b=cur.findIndex(x=>x.k===r.k);
      cur.splice(b,0,cur.splice(a,1)[0]);
      sfx('tick'); pedit('priorities',cur); prender(sc);
    };
    list.appendChild(el);
  });
  box.appendChild(list);
  enter(Array.from(list.children),{y:12,blur:6,stagger:.07,duration:.5},1300);
}

let PFAT=0;
function prender(sc){
  const box=document.querySelector('#turn .opts');
  if(!box) return;
  box.innerHTML='';
  pbuild(box,sc);
}
function pbuild(box,sc){
  const wrap=mk('div','pfx');
  const top=mk('div','pfxtop');
  top.appendChild(mk('span',null,'What I read from your choices'));
  top.appendChild(mk('span','pfxnum',sc.id+' / 06'));

  if(sc.kind==='bubbles') pbubbles(host,sc);

  else if(sc.kind==='ranked') pranked(host,sc);
  else porder(host,sc);
  const why=pwhy(sc.key);
  if(why) wrap.appendChild(mk('div','pfxwhy',why));
  dockAction(sc.id==='06'?'Create my vision board':'Continue',()=>{
    PFAT++; locked=false;

    else prefStage();

}
