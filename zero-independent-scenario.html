:root{
  --bg:#FEFEFE; --rail:#FEFEFE; --card:#ffffff; --panel:#fafafa; --bubble:#f2f2f3;
  --soft:#f6f6f7; --hover:#f0f0f1;
  --line:rgba(13,13,13,.055); --line-2:rgba(13,13,13,.03);
  --tx:#111113; --tx-2:#63636a; --tx-3:#9a9aa0; --tx-4:#c4c4ca;
  --accent:#111113; --accent-soft:rgba(13,13,13,.05); --on-accent:#ffffff;
  --code-bg:#fafafa; --code-tx:#1a1a1c;
  --shadow:0 1px 3px rgba(0,0,0,.05);
  --shadow-sm:none;
  --f-head:'Google Sans Flex','Google Sans',-apple-system,system-ui,sans-serif;
  --f-body:'Google Sans Flex','Google Sans',-apple-system,system-ui,sans-serif;
  --mono:'Supply Mono','Supply','SFMono-Regular',ui-monospace,'SF Mono','Roboto Mono','Courier New',monospace;
  --serif:'STK Bureau Serif',Georgia,'Times New Roman',serif;
  --sans:'Google Sans Flex','Google Sans',-apple-system,system-ui,sans-serif;
  --r:14px; --pill:999px; --r-comp:26px; --fs:14px; --maxw:600px; --bw:1px;
  --ease:cubic-bezier(.625,.05,0,1); --t-q:.24s; --t-m:.48s; --t-s:.6s;   /* Osmo / apple-butter easing, common throughout */
  --fix:#ff6a4d; --ok:#3fb968; --hi:#e0a020; --meets:#e7b90a;   /* final-evaluation accents: Fix / cleared / High importance / Meets */
}

:root[data-theme="dark"]{
  --bg:#1E1E1E; --rail:#1E1E1E; --card:#262626; --panel:#242424; --bubble:#333333;
  --soft:#282828; --hover:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.075); --line-2:rgba(255,255,255,.04);
  --tx:#f2f1ee; --tx-2:#a5a29b; --tx-3:#6d6a63; --tx-4:#4a4844;
  --accent:#ffffff; --accent-soft:rgba(255,255,255,.08); --on-accent:#0d0d0d;
  --code-bg:#141414; --code-tx:#d6d3cc;
  --shadow:0 1px 3px rgba(0,0,0,.4); --shadow-sm:none;
}

*{box-sizing:border-box;margin:0;padding:0}

html,body{height:100%}

body{font-family:var(--f-body);background:var(--bg);color:var(--tx);font-size:var(--fs);line-height:1.55;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden;transition:background var(--t-m) var(--ease),color var(--t-m) var(--ease)}

button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}

input{font-family:inherit}

.scroll{scrollbar-width:thin;scrollbar-color:var(--tx-4) transparent}

.scroll::-webkit-scrollbar{width:7px}

.scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}

.scroll::-webkit-scrollbar-track{background:transparent}

/* ===== TYPE SYSTEM (one scale, both panels) =====
   label      = Supply Mono · 10px · 700 · ls 1.4 · caps · tx-2   (dims to tx-3 ONLY when its whole section is inactive/collapsed)
   panel name = Supply Mono · 12px · 400 · ls 1.4 · caps · tx-2   (FEEDBACK, RESOURCES — the place, not the content)
   heading    = sans · 13.5px · 600 · -1% · tx                    (requirement headings; findings ride the same voice at 14.5/600/1.28)
   body       = sans · 13–13.5px · -1% · lh 1.6 · tx-2            (bullets, summaries/context)
   payload    = sans · 13.5px · -1% · lh 1.6 · tx                 (what the user EXPANDED to read: Why/Approach bodies)
   display    = sans · 19px · 700 · -2% · lh 1.24 · tx            (stage title)
   ALL sans text carries -1% tracking (display -2%). SemiBold = 600, never 650.
   LEGIBILITY LAW: tx-4 is DECORATION ONLY (dots, chevrons, rules) — never text.
   White marks what must be read; gray marks context. Never repeat the left rail's headings in the panel. */
.lbl{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--tx-2)}

.group-h .lbl{color:inherit}

.rev{opacity:0;animation:rise var(--t-s) var(--ease) forwards;animation-delay:var(--d,0ms)}


.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}

.work{flex:1 1 auto;display:flex;overflow:hidden;min-height:0}

/* lightweight tooltips (data-tip), above by default, .tipdn for top-bar icons */
[data-tip]{position:relative}

.tipdn[data-tip]::after{bottom:auto;top:calc(100% + 8px);transform:translateX(-50%) translateY(-4px)}

.tipdn[data-tip]:hover::after{transform:translateX(-50%)}

.tipstart[data-tip]::after{left:0;transform:translateY(4px)}

.tipstart[data-tip]:hover::after{transform:none}

.tipdn.tipstart[data-tip]::after{transform:translateY(-4px)}

.tipdn.tipstart[data-tip]:hover::after{transform:none}

/* full-width global top bar: back (left) · XP + meter + resources (right) · divider line */
.topbar{flex:0 0 auto;height:52px;display:flex;align-items:center;gap:9px;padding:0 16px;background:var(--bg)}

.topbar .spacer{flex:1}

.topbar .back,.topbar .xp-chip,.topbar .perf,.topbar .hic{animation:slidelr .5s var(--ease) both}

.topbar .back{animation-delay:0s}
.topbar .xp-chip{animation-delay:.06s}
.topbar .perf{animation-delay:.13s}
.topbar .hic{animation-delay:.2s}

.app:not(.tech) .res-btn{display:none}
   /* the right-hand Resources panel is a technical-scenario control */
.res-btn.on{background:var(--soft);color:var(--tx)}

.app.pip .set-fab{display:none}

.topbar .hic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--tx-3);transition:background var(--t-q) var(--ease),color var(--t-q) var(--ease)}

.topbar .hic:hover{background:var(--hover);color:var(--tx)}

.topbar .hic.on{background:var(--soft);color:var(--tx)}

.topbar .hic svg{width:20px;height:20px}

.topbar .hic.pulse{animation:respulse 1.4s var(--ease)}

.topbar .perf{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--tx-2);background:var(--soft);border:var(--bw) solid var(--line-2);padding:6px 12px 6px 10px;border-radius:99px;white-space:nowrap;transition:border-color .4s var(--ease)}

/* ===== PiP mode: the WHOLE workspace collapses into one compact, draggable floating window (chat + timer). Everything else hides. ===== */
.app.pip .topbar,.app.pip .rail,.app.pip .right,.app.pip .gutter,.app.pip .gutterR{display:none !important}

.app.pip{background:#08080a}

.app.pip .pip-desktop{display:block;position:fixed;inset:0;z-index:1;overflow:hidden;background:linear-gradient(155deg,#1e3a8a 0%,#6d28d9 34%,#db2777 68%,#f97316 100%)}

.app.pip.pip-min .pip-desktop{filter:none}

/* ===== PiP = a MICRO chat window: ~70% of the old footprint, type stepped down to the industry
   legibility floor (Discord's chat scale bottoms at 12px; Slack's compact mode tightens rhythm, not glyphs).
   Everything here is scoped to .app.pip so the full screen keeps its own scale. ===== */
.app.pip .center{position:fixed;right:16px;bottom:16px;width:264px;min-width:0;height:min(408px,74vh);z-index:75;border:var(--bw) solid var(--line-2);border-radius:15px;box-shadow:0 32px 88px rgba(0,0,0,.6);background:var(--bg);overflow:hidden}
   /* GSAP pipFlip drives the morph, no CSS pop */
/* type: body 12.5 / meta 11 / mono 9 — legible at arm's length, invisible when you're working next to it */
.app.pip .msgs .mgr .mbubble,.app.pip .user{font-size:12.5px;line-height:1.5;padding:8px 12px;border-radius:5px 14px 14px 14px}

.app.pip .user{border-radius:15px 15px 5px 15px}

.app.pip .chat-peer .pname{font-size:12.5px}

.app.pip .pill textarea,.app.pip .pill #ta{font-size:12.5px;padding:9px 13px 3px}

.app.pip .pill #ta:empty:before{font-size:12.5px}

/* the composer nests concentrically inside the 15px window — a 24px pill reads wrong at this size */
.app.pip .pill{border-radius:13px}

.app.pip .subm .att .m .t,.app.pip .att-big .atb-n{font-size:11px}

.app.pip .subm .sth{height:80px}

.app.pip .att-big{width:118px}
.app.pip .att-big .atb-th{height:74px}

.app.pip .synth .sy-t,.app.pip .synth .sy-lbl{font-size:11.5px}

.app.pip .synth .sy-ic,.app.pip .synth .sy-chip{width:19px;height:19px}

.app.pip .synth .sy-ic svg,.app.pip .synth .sy-chip svg{width:10px;height:10px}

.app.pip .vmsg{padding:5px 9px 5px 5px}

.app.pip .fbpill{font-size:11.5px;padding:7px 13px}

.app.pip .stagediv .sd-txt{font-size:9px}

/* controls shrink with the window so the composer doesn't eat the view */
.app.pip .pill-ctrl{gap:1px;padding:2px 5px 5px}

.app.pip .pill-ctrl .plus,.app.pip .pill-ctrl .mic,.app.pip .pill-ctrl .send,.app.pip .pill-ctrl .cam{width:30px;height:30px}

.app.pip .pill-ctrl .plus svg,.app.pip .pill-ctrl .mic svg,.app.pip .pill-ctrl .send svg,.app.pip .pill-ctrl .cam svg{width:16px;height:16px}

.app.pip .stuck-slider{height:26px}

.app.pip .stuck-slider .track{width:30px;height:17px}

.app.pip .stuck-slider .track .k{width:13px;height:13px}

.app.pip .stuck-slider.on .track .k{transform:translateX(13px)}

/* the composer tooltips must escape the compact window, not hide behind it */
.app.pip .composer,.app.pip .composer-in,.app.pip .pill,.app.pip .pill-ctrl{overflow:visible}

.app.pip [data-tip]::after,.app.pip [data-tip]::before{z-index:320}

/* the header is the drag handle + window controls */
.app.pip .c-top{padding:8px 10px 7px;cursor:grab;border-bottom:var(--bw) solid var(--line)}

.app.pip .c-top:active{cursor:grabbing}

.app.pip .ct-r2{height:auto}

.app.pip .chat-peer{padding:0 4px;width:100%;max-width:none}

.app.pip .chat-peer .pava{width:30px;height:30px}

.app.pip .chat-peer .psub,.app.pip .ph-pill{display:none}
   /* less clutter in the compact window */
.app.pip .chat-peer .ph-flex{flex:1}

.app.pip .pip-clock{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9.5px;font-variant-numeric:tabular-nums;color:var(--tx-2);background:var(--soft);border:var(--bw) solid var(--line-2);padding:3px 8px;border-radius:99px;margin-right:6px}

.app.pip .pip-ctrls{display:inline-flex;gap:2px}

/* content reflows responsively to the narrow window — tighter rhythm, even gutters */
.app.pip .msgs{padding:12px 12px 20px;gap:12px}

.app.pip .msgs .mgr,.app.pip .msgs .mgr .mbubble{max-width:96%}

.app.pip .uturn{max-width:96%}

.app.pip .composer{padding:0 10px 10px}

.app.pip .composer-in{padding:0}

.app.pip .composer .foot{display:none}

.app.pip .pip-timer{display:none}

.app.pip .stuck-slider .slbl{display:none}

.app.pip .stuck-slider{padding:0 6px 0 4px}

/* minimized → a small ZERO logo bubble; click to reopen */
.app.pip.pip-min .center{display:none}

.app.pip.pip-min .pip-bubble{display:flex;position:fixed;right:24px;bottom:24px;z-index:80;width:46px;height:46px;border-radius:15px;align-items:center;justify-content:center;background:#0e0d0c;border:var(--bw) solid var(--line-2);box-shadow:0 20px 48px rgba(0,0,0,.55);cursor:grab}
   /* GSAP pipFlip drives the collapse morph */
.app.pip.pip-min .pip-bubble:active{cursor:grabbing}

.gutter{flex:0 0 5px;cursor:col-resize;position:relative;z-index:5}

.gutter::after{content:"";position:absolute;inset:0 2px;border-radius:99px;background:transparent;transition:background var(--t-q) var(--ease)}

.gutter:hover::after{background:var(--line)}
.gutter.drag::after{background:var(--accent)}
.gutter.hidden{display:none}


/* ============ LEFT ============ */
.rail{flex:0 0 312px;min-width:272px;max-width:460px;background:var(--rail);display:flex;flex-direction:column;overflow:hidden}

.rail-top{padding:0 20px}

.rail-top .brand{height:54px;align-items:center;padding:0;margin:0}

.back{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--tx-2);transition:background var(--t-q) var(--ease),transform var(--t-q) var(--ease)}

.back:hover{background:var(--hover);color:var(--tx);transform:translateX(-2px)}

.back svg{width:20px;height:20px}

.brand{display:flex;align-items:center;gap:11px}

.brand .logo{width:38px;height:38px;border-radius:99px;background:var(--card);border:var(--bw) solid var(--line);display:grid;place-items:center;flex:0 0 auto;box-shadow:var(--shadow-sm)}

.brand .logo svg{width:20px;height:22px}

.brand .meta .t{font-size:14.5px;font-weight:600;line-height:1.28;letter-spacing:-.01em;color:var(--tx)}


.rail-body{flex:1;overflow-y:auto;padding:16px 16px 20px}


/* mode switch = a MORPH: ONE soft green glow on the whole active card (no per-section outline), while the morph-zone
   content blurs out and staggers back in (GSAP-driven, see morphActiveSection). */
.active.morphing{animation:cardGlow 1.15s var(--ease)}

/* active stage, one outline-only container */
.active{position:relative;border:var(--bw) solid var(--line);border-radius:16px;padding:16px 16px 8px;margin-bottom:20px}

.active-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}

.active-h .t{flex:1;font-size:19px;font-weight:700;line-height:1.24;letter-spacing:-.02em}

.active-h .help{width:28px;height:28px;border-radius:99px;display:grid;place-items:center;color:var(--tx-3);flex:0 0 auto;transition:color var(--t-q) var(--ease)}

.active-h .help:hover{color:var(--tx)}

.active-h .help svg{width:17px;height:17px}


.req{margin:0 -8px 2px;border-radius:10px;transition:background .22s var(--ease),box-shadow .22s var(--ease)}

.req:hover{background:var(--soft);box-shadow:inset 0 2px 26px -11px rgba(255,255,255,.16),inset 0 0 0 1px rgba(255,255,255,.06)}
   /* the WHOLE section highlights — header AND its expanded items, same hover language as the feedback rows */
.req-h{display:flex;align-items:flex-start;gap:10px;padding:10px 10px;cursor:pointer}

.req-h .rt{flex:1;font-size:13.5px;font-weight:600;line-height:1.4;letter-spacing:-.01em;color:var(--tx)}
   /* heading */
.req-h .rdot{width:7px;height:7px;border-radius:99px;background:var(--tx-4);flex:0 0 auto;margin-top:6px;transition:background .5s var(--ease)}

.req.hit .req-h .rdot{background:#2e9e5b}

.req.miss .req-h .rdot{background:#e0a020}

.req.hit,.req.miss{position:relative}

.req-h .chev{color:var(--tx-3);flex:0 0 auto;margin-top:1px;transition:transform var(--t-q) var(--ease)}

.req-h .chev svg{width:18px;height:18px}

.req.open .req-h .chev{transform:rotate(180deg)}

.req.open .req-body{grid-template-rows:1fr}

.group-h .lbl{flex:1}

.group-h .cnt{font-size:11px;font-weight:700;color:var(--tx-3)}

/* task resources, simple one-line rows inside the active card */
.tres-list{display:flex;flex-direction:column;gap:1px;padding-bottom:8px}

.tres{display:flex;align-items:center;gap:9px;padding:7px 4px;border-radius:9px;cursor:pointer;transition:background var(--t-q) var(--ease)}

.tres:hover{background:var(--hover)}

.tres .ti{width:18px;height:18px;display:grid;place-items:center;flex:0 0 auto;color:var(--tx-3)}

.tres .ti svg{width:16px;height:16px}

.tres .tn{flex:1;min-width:0;font-size:12.5px;font-weight:500;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tres .eye{color:var(--tx-4);opacity:0;transition:opacity var(--t-q) var(--ease);flex:0 0 auto}

.tres:hover .eye{opacity:.85}
.tres .eye svg{width:15px;height:15px}

/* a new resource does not just appear in the list, it arrives: out of a blur, into place, with one
   soft pass of colour so you can see WHICH row is the new one */
.tres.just-in{animation:tresIn .72s var(--osmo) both, tresLand 1.6s var(--ease)}

/* stage-complete: new active reveals with a heavy blur, inner content staggers in */
.active.just-active{animation:activeReveal .9s cubic-bezier(.5,0,.15,1) both,unlockGlow 1.25s ease .2s both}

.active.just-active>*{animation:innerReveal .66s cubic-bezier(.5,0,.15,1) both}

.active.just-active>.active-h{animation-delay:.2s}

.active.just-active>.timer{animation-delay:.3s}

.active.just-active>.lbl{animation-delay:.38s}

.active.just-active>.req{animation-delay:.46s}

.active.just-active>.req:nth-of-type(2){animation-delay:.56s}


/* ============ CENTER ============ */
.center{flex:1 1 auto;min-width:300px;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}

.c-top{flex:0 0 auto;padding:0 24px}

/* live performance meter (4 segments fill by level, color by level) */
.perf .pf-meter{display:flex;gap:3px;align-items:flex-end}

.perf .pf-meter i{width:4px;height:13px;border-radius:2px;background:var(--line);transition:background .5s var(--ease),transform .45s cubic-bezier(.34,1.56,.64,1)}

.perf .pf-label{font-weight:600;letter-spacing:.1px;transition:color .4s var(--ease)}

.perf[data-lvl="1"] .pf-meter i:nth-child(-n+1){background:#ff6a4d}

.perf[data-lvl="1"] .pf-label{color:#ff8a72}

.perf[data-lvl="2"] .pf-meter i:nth-child(-n+2){background:#facc15}

.perf[data-lvl="2"] .pf-label{color:#e7c04a}

.perf[data-lvl="3"] .pf-meter i:nth-child(-n+3){background:#4ade80}

.perf[data-lvl="3"] .pf-label{color:#7fe0a3}

.perf[data-lvl="4"] .pf-meter i{background:#a3e635}

.perf[data-lvl="4"] .pf-label{color:#c5f06a}

.perf.bump{animation:xpbump .8s cubic-bezier(.34,1.56,.64,1)}

.perf.bump .pf-meter i{animation:pfhop .5s var(--ease)}

/* total-XP chip: counts up + bumps when XP lands */
.xp-chip{display:flex;align-items:center;gap:5px;font-size:11px;background:var(--soft);border:var(--bw) solid var(--line-2);padding:6px 12px;border-radius:99px;white-space:nowrap;transition:border-color .4s var(--ease)}

.xp-chip .xi{display:grid;color:#facc15}
.xp-chip .xi svg{width:13px;height:13px}

.xp-chip b{font-size:12px;font-variant-numeric:tabular-nums;color:var(--tx)}

.xp-chip .xl{color:var(--tx-3);font-weight:600;letter-spacing:.4px}

.xp-chip.bump{animation:xpbump .8s cubic-bezier(.34,1.56,.64,1)}

.pill.stuck .stuck-meter{opacity:1;transform:scale(1);margin-left:0;pointer-events:auto}

.pill.stuck .stuck-meter:hover{transform:scale(1.1)}

/* ===== Proof of Understanding (voice Q&A, morphs INTO the existing chat) ===== */
.center{position:relative}

/* the chat is the source of truth, it is NEVER hidden. POU is just a new segment the thread scrolls up into. */
.msgs>*{transition:opacity .4s var(--ease),filter .45s var(--ease)}

.app.poumode .ph-pill{display:inline-flex;animation:pillIn .6s var(--ease) forwards, pillGlow 2.4s var(--ease) .5s}
   /* the bar reads "spent" once its XP has flown to the counter */
/* …and once the XP has landed, the bar's job is DONE — it leaves; it never lingers waiting for the button */
.app.poumode .ph-pill.gone{animation:pillOut .55s var(--ease) forwards}

/* composer → voice module: deep blurry morph */
.composer-in,.foot{transition:opacity .5s var(--ease),filter .5s var(--ease),transform .55s cubic-bezier(.62,0,.2,1)}

.composer.micmode .composer-in{opacity:0;filter:blur(18px);transform:scale(.8) translateY(6px);pointer-events:none}

.composer.micmode .foot{opacity:0}

.composer.micmode .pou-micbar{opacity:1;filter:blur(0);transform:none;pointer-events:auto}

/* exit (leaving stuck): old light layer on top so it can shrink away into the button */
:root.vt-shrink::view-transition-old(root){z-index:2}


.thread{flex:1;overflow-y:auto;padding:4px 0 8px;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 52px,#000 calc(100% - 6px),transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0,#000 52px,#000 calc(100% - 6px),transparent 100%);}

.msgs{max-width:var(--maxw);margin:0 auto;padding:48px 28px 104px;display:flex;flex-direction:column;gap:36px}

.msg-spacer{flex:0 0 auto;width:100%}

.mgr{max-width:96%;font-size:14.5px;line-height:1.72;color:var(--tx);overflow-wrap:break-word;word-break:normal}

.mgr b{font-weight:600}

/* WhatsApp-style manager message: text in a left bubble; identity lives in the sticky top bar */
.msgs .mgr{align-self:flex-start;max-width:86%}

.msgs .mgr .mbubble{width:fit-content;max-width:100%;background:var(--soft);border:var(--bw) solid var(--line-2);border-radius:6px 18px 18px 18px;padding:10px 15px;font-size:14px;line-height:1.5;overflow-wrap:break-word}

.msgs .mgr.cont{margin-top:-26px}
          /* consecutive Jay bubbles sit tight, like a broken-up chat */
.msgs .mgr.cont .mbubble{border-radius:18px}

/* two-row top bar: row 1 = XP + performance (right), row 2 = Jay profile on the chat column */
.ct-r2{height:54px;display:flex;align-items:center}

.chat-peer{width:min(var(--maxw),100%);margin:0 auto;padding:0 28px;display:flex;align-items:center;gap:11px;min-width:0}

.chat-peer .pava{width:36px;height:36px;border-radius:99px;overflow:hidden;flex:0 0 auto;border:var(--bw) solid var(--line);position:relative}

.chat-peer .pava img{width:100%;height:100%;object-fit:cover;display:block}

.chat-peer .pava .pdot{position:absolute;right:0;bottom:0;width:10px;height:10px;border-radius:99px;background:#2ec76a;border:2px solid var(--bg)}

.chat-peer .pname{font-size:14px;font-weight:600;line-height:1.2}

.chat-peer .psub{font-size:11.5px;color:var(--tx-3);margin-top:2px}

.chat-peer .ph-flex{flex:1}

/* word-stagger blur reveal */
/* clean word-by-word stagger, with a soft blur as each word pops in */
.mgr .w{display:inline-block;opacity:0;filter:blur(4px);transform:translateY(4px);animation:wordin .28s var(--ease) forwards;animation-delay:var(--wd,0ms)}

/* Jay is typing bubble */
.typing{align-self:flex-start;display:flex;align-items:center;gap:6px;padding:8px 2px;animation:rise var(--t-q) var(--ease)}

.typing i{width:7px;height:7px;border-radius:99px;background:var(--tx-3);animation:tbob 1.2s infinite}

.typing i:nth-child(2){animation-delay:.16s}
.typing i:nth-child(3){animation-delay:.32s}

.user{align-self:flex-end;width:fit-content;max-width:82%;background:var(--bubble);padding:10px 15px;border-radius:20px 20px 6px 20px;font-size:14px;line-height:1.5;overflow-wrap:break-word;word-break:normal;white-space:pre-wrap}

/* full-width row: gives bubbles a real width to size against, then right-aligns them */
.uturn{align-self:stretch;width:100%;display:flex;flex-direction:column;align-items:flex-end;gap:10px}

.uturn>*{align-self:flex-end;max-width:82%}

.subm .att .m .t{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.fbcard .m .t{font-size:14px;font-weight:600}

:root[data-theme="light"] .thought .th-steps .th-ic{background:var(--card)}

.hv-scroll .msgs{max-width:var(--maxw);margin:0 auto;padding:34px 28px 64px;display:flex;flex-direction:column;gap:36px;pointer-events:none}

/* resource card sent inline in chat: click opens it on the right, same as a stage resource */
.c-resfile{max-width:340px;display:flex;align-items:center;gap:11px;padding:11px 13px;border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow-sm);cursor:pointer;transition:transform var(--t-q) var(--ease),background var(--t-q) var(--ease)}

.c-resfile:hover{transform:translateY(-2px);background:var(--soft)}

.crf-ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;color:var(--tx-2);background:var(--soft);border:var(--bw) solid var(--line-2)}

.crf-ic svg{width:20px;height:20px}

.crf-ic.vid{background:var(--accent);color:var(--on-accent);border:none}

.crf-ic.vid svg{width:14px;height:14px;margin-left:1px}

.crf-m{flex:1;min-width:0}

.crf-t{font-size:13px;font-weight:600;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.crf-s{font-size:11px;color:var(--tx-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.crf-open{color:var(--tx-4);flex:0 0 auto}

.crf-open svg{width:16px;height:16px}
.c-file .m .t{font-size:12.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* during the tour, force the composer into a clean normal form so + and "I'm stuck" are always visible */
.composer.tour-lift{opacity:1 !important;transform:none !important;pointer-events:none}

.composer.tour-lift .npad,.composer.tour-lift .np-head{display:none !important}

.composer.tour-lift #ta{display:block !important}

.composer.tour-lift .pill-ctrl .plus,.composer.tour-lift .pill-ctrl .cam,.composer.tour-lift .pill-ctrl .mic{display:grid !important}

.composer.tour-lift .pill-ctrl .stuck-slider{display:inline-flex !important}


/* ---- composer: send-on-type + growing + attachment menu ---- */
.composer{flex:0 0 auto;padding:16px 24px 24px;position:relative;transition:opacity .45s var(--ease),transform .5s var(--ease)}

/* manager busy: you can still type + attach, but SEND is held (dimmed, not-allowed) until Jay finishes */
.composer.mgr-busy .send,.composer.mgr-busy .rec-send{opacity:.35;cursor:not-allowed;filter:grayscale(1)}

.composer.mgr-busy.busy-nudge .pill{animation:busyNudge .4s var(--ease)}

/* nothing at the bottom until the notepad opens, the composer stays hidden through the planning intro */
.composer.hidden{opacity:0;transform:translateY(26px) scale(.985);pointer-events:none}

.composer-in{max-width:var(--maxw);margin:0 auto;display:flex;align-items:flex-end;gap:11px;position:relative}

.pill{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:var(--soft);border:var(--bw) solid var(--line);border-radius:24px;transition:border-color var(--t-q) var(--ease),min-height .45s var(--ease)}

.pill:focus-within{border-color:var(--tx-4)}

.pill.recording textarea,.pill.recording #ta{display:none}

.pill.recording .rec-top{display:flex}

.pill.recording .plus,.pill.recording .cam,.pill.recording .stuck-slider,.pill.recording .mic,.pill.recording .send{opacity:0;pointer-events:none;transition:opacity .25s var(--ease)}

.pill.recording .rec-cancel,.pill.recording .rec-send{display:grid;animation:recfade .3s var(--ease)}

.att-row{display:none;flex-wrap:nowrap;gap:9px;padding:10px 10px 2px;overflow-x:auto;scrollbar-width:none}

.att-row::-webkit-scrollbar{display:none}

.pill.has-att .att-row{display:flex}

/* two-row composer: textarea on top, controls below (ChatGPT-style) */
.pill textarea,.pill #ta{width:100%;background:none;border:none;outline:none;color:var(--tx);font-family:inherit;font-size:15px;line-height:1.5;padding:13px 18px 4px;resize:none;max-height:150px;overflow-y:auto}

.pill textarea::placeholder{color:var(--tx-3)}

.pill textarea::-webkit-scrollbar,.pill #ta::-webkit-scrollbar{width:0}

/* rich contenteditable composer: placeholder + numbered / bullet pointers you type inline */
.pill #ta{min-height:24px;white-space:pre-wrap;word-break:break-word;cursor:text}

.pill #ta:empty:before{content:attr(data-ph);color:var(--tx-3);pointer-events:none}

.pill #ta ol,.pill #ta ul{margin:3px 0;padding-left:24px}

.pill #ta ol{list-style:decimal}
.pill #ta ul{list-style:disc}

.pill #ta li{margin:2px 0;padding-left:2px}

/* the same pointers render in the sent message, exactly as typed */
.user ol,.user ul{margin:5px 0;padding-left:22px}

.user ol{list-style:decimal}
.user ul{list-style:disc}

.user li{margin:3px 0}

.pill-ctrl{display:flex;align-items:center;gap:4px;padding:4px 8px 8px}

.ctrl-spacer{flex:1}

.pill-ctrl .plus,.pill-ctrl .mic,.pill-ctrl .send,.pill-ctrl .cam{width:38px;height:38px;border-radius:99px;display:grid;place-items:center;flex:0 0 auto;color:var(--tx-2);transition:background var(--t-q) var(--ease),transform var(--t-q) var(--ease),color var(--t-q) var(--ease)}

.pill-ctrl .plus:hover,.pill-ctrl .mic:hover,.pill-ctrl .cam:hover{background:var(--hover);color:var(--tx)}

/* PiP gate: dimmed + no-hover-lift until the build phase; a one-shot glint when it unlocks */
.pill-ctrl .cam.pip-locked{color:var(--tx-4);cursor:default}

.pill-ctrl .cam.pip-locked:hover{background:transparent;color:var(--tx-4)}

.pill-ctrl .cam.pip-juston{animation:pipGlint 2.4s var(--ease) 1}

@media (prefers-reduced-motion: reduce){.pill-ctrl .cam.pip-juston{animation:none}}

/* sound toggle in the top bar — quiet chrome, matches the Resources icon button */
.snd-btn .snd-off{display:none}

.snd-btn svg{width:19px;height:19px}

.snd-btn[data-on="0"] .snd-on{display:none}

.snd-btn[data-on="0"] .snd-off{display:block}

.snd-btn[data-on="0"]{color:var(--tx-3)}

.pill-ctrl .plus svg,.pill-ctrl .mic svg,.pill-ctrl .send svg,.pill-ctrl .cam svg{width:20px;height:20px}

.pill-ctrl .send{background:#fff;color:#111;display:none;box-shadow:0 2px 10px rgba(0,0,0,.16)}

.pill-ctrl .send:hover{transform:scale(1.06)}

.pill.active-send .mic{display:none}

.pill.active-send .send{display:grid}

.composer .foot{max-width:var(--maxw);margin:8px auto 0;text-align:center;font-size:11px;color:var(--tx-3)}

/* ---- PLANNING ---- composer becomes a notepad while planning */
/* NOTEPAD = the composer morphs into a dark bullet notepad (plain chat, no cream/yellow) */
.composer.notepad .pill{background:var(--card);border:var(--bw) solid var(--line);border-radius:20px;box-shadow:var(--shadow)}

.composer.notepad #ta{display:none}
                               /* the bullet editor replaces the plain input */
.composer.notepad .np-head{display:flex}

.composer.notepad .npad{display:block}

.composer.notepad .pill-ctrl .plus,
.composer.notepad .pill-ctrl .cam,
.composer.notepad .pill-ctrl .stuck-slider,
.composer.notepad .pill-ctrl .stuck-meter,
.composer.notepad .pill-ctrl .mic{display:none}

.composer.notepad .pill-ctrl{padding:2px 12px 12px}

.composer.notepad .pill-ctrl .ctrl-spacer{flex:1}

.composer.notepad .pill-ctrl .send{display:grid;background:#fff;color:#111;transition:background var(--t-q) var(--ease),color var(--t-q) var(--ease),opacity var(--t-q) var(--ease)}

.composer.notepad:not(.plan-ready) .pill-ctrl .send{background:var(--soft);color:var(--tx-4);opacity:.55;pointer-events:none;box-shadow:none;cursor:not-allowed}
   /* can't send until both requirements have a point */
.composer.notepad .foot{opacity:0;pointer-events:none}

.composer.notepad.plan-ready .np-head .np-hint{color:#3fb968}

:root[data-theme="dark"] .planlock{background:linear-gradient(180deg,rgba(74,222,128,.12),transparent 42%),var(--card)}

/* left card hint while only the title is showing */
.plan-hint{font-size:12.5px;color:var(--tx-3);line-height:1.55;margin-top:2px}

/* time-estimate pills */
.timepills{max-width:var(--maxw);margin:0 auto 10px;display:none;flex-wrap:wrap;gap:8px;padding:0 6px;justify-content:flex-start}

.timepills.show{display:flex;animation:rise var(--t-m) var(--ease)}

/* manager emoji reaction badge */
.uturn,.plannote,.msg{position:relative}

.mgr .msg-react{right:auto;left:52px}

.tres-wrap.reveal{animation:blurIn .7s var(--ease) .25s both}

.req.sb,.cstep.sb{position:relative}

.req.sb .req-h,.req.sb .req-body{opacity:0}

/* skeleton shimmer bar while a step loads (green, higher-contrast per feedback). Same idiom for plan reqs AND I'm-stuck steps. */
.req.sb.sb-load::before,.cstep.sb.sb-load::before{content:"";position:absolute;border-radius:8px;
  background:linear-gradient(100deg,rgba(74,222,128,.12) 26%,rgba(74,222,128,.55) 50%,rgba(74,222,128,.12) 74%);background-size:200% 100%;animation:sbShimmer 1.05s linear infinite}

.req.sb.sb-load::before{left:1px;right:14px;top:4px;height:15px}

:root[data-theme="light"] .req.sb.sb-load::before,:root[data-theme="light"] .cstep.sb.sb-load::before{background:linear-gradient(100deg,rgba(20,135,74,.10) 26%,rgba(20,135,74,.40) 50%,rgba(20,135,74,.10) 74%);background-size:200% 100%}

/* resolve: the text reveals with a rise, exactly when the step lands (no coral corner dot) */
.req.sb.sb-in .req-h{opacity:1;animation:sbReveal .5s var(--ease)}

.req.sb.sb-in .req-body{opacity:1;animation:sbReveal .5s var(--ease) .05s both}


/* ============ RIGHT, floating resources ============ */
.right{flex:0 1 0;min-width:0;max-width:1200px;display:flex;overflow:hidden;transition:flex-basis var(--t-m) var(--ease),opacity var(--t-m) var(--ease),padding var(--t-m) var(--ease);opacity:0;padding:0}

.right.open{flex-basis:376px;opacity:1;padding:70px 12px 12px 0}
   /* the panel starts where the left card starts (54px header + 16px rail padding) — the gap above is reserved */
.right.open.docmode{flex-basis:700px;padding-top:14px}
   /* the doc viewer is a full overlay, so drop the reserved top gap */
.right-inner{flex:1;min-width:280px;background:var(--rail);border:var(--bw) solid var(--line);border-radius:18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}

.app.fb-hidden .fb-handle{display:grid;place-items:center;position:fixed;top:79px;right:24px;z-index:70;width:30px;height:30px;   /* 52 topbar + 14 panel offset + 13 header inset — the panel offset dropped from 70 to 14, so this followed it */
  background:none;border:none;cursor:pointer;color:var(--tx-2);transition:color var(--t-q) var(--ease)}

.app.fb-hidden .fb-handle:hover{color:var(--tx)}

.app.fb-hidden .right.open{flex-basis:0;opacity:0;padding:0;pointer-events:none}
   /* hidden → the panel slides away, the toggle stays put top-right */
.r-head{flex:0 0 auto;height:54px;display:flex;align-items:center;gap:8px;padding:0 12px 0 22px}
   /* ONE left edge: the panel name lines up with every line below it */
.r-head .rback,.r-head .x,.r-head .fb-toggle{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--tx-2);flex:0 0 auto;background:none;border:none;cursor:pointer;transition:background var(--t-q) var(--ease),color var(--t-q) var(--ease)}

.r-head .rback:hover,.r-head .x:hover,.r-head .fb-toggle:hover{background:var(--hover);color:var(--tx)}

.r-head .rback svg,.r-head .x svg{width:18px;height:18px}

.r-head .fb-toggle svg{width:19px;height:19px}

.r-head .t{font-family:var(--mono);font-size:12px;font-weight:400;letter-spacing:1.4px;text-transform:uppercase;color:var(--tx-2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
   /* panel name = a mono LABEL — the place, not the content */
.r-body{flex:1;overflow-y:auto;padding:0 12px 18px 12px}

.r-body>.fev:first-child,.r-body>.fb2:first-child{margin-top:0}

/* SCROLL FADE: content dissolves at a scroller's edges instead of cutting off hard — one rule, every scrolling body */
.r-body,.rail-body,.thread{--fade-t:18px;--fade-b:22px;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 var(--fade-t),#000 calc(100% - var(--fade-b)),transparent 100%);
  mask-image:linear-gradient(180deg,transparent 0,#000 var(--fade-t),#000 calc(100% - var(--fade-b)),transparent 100%)}

.r-body.swap{animation:rise var(--t-m) var(--ease)}

/* ===== panel tabs + resources (right panel: Feedback | Resources) ===== */
.r-head .spacer{flex:1}

/* two DISTINCT underline tabs (technical scenario): Resources is the base, Feedback sits on top */
.r-head.hastabs{border-bottom:var(--bw) solid var(--line)}

.r-tabs2{display:flex;align-items:stretch;height:100%;flex:0 0 auto}

.r-tab2{position:relative;display:inline-flex;align-items:center;gap:7px;padding:0 2px;height:100%;font-family:var(--mono);font-size:12px;font-weight:400;letter-spacing:1.4px;text-transform:uppercase;color:var(--tx-3);border:none;background:none;cursor:pointer;transition:color var(--t-q) var(--ease)}

.r-tab2:not(:first-child){margin-left:20px}

.r-tab2:hover{color:var(--tx-2)}

.r-tab2.on{color:var(--tx)}

.r-tab2::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px 2px 0 0;background:var(--tx);transform:scaleX(0);transform-origin:center;transition:transform var(--t-m) var(--ease)}

.r-tab2.on::after{transform:scaleX(1)}

.r-tab2 .dot{width:6px;height:6px;border-radius:99px;background:#4ade80;opacity:0;transform:scale(.4);transition:opacity var(--t-q) var(--ease),transform var(--t-q) var(--ease)}

.r-tab2 .dot.live{opacity:1;transform:none;animation:dotPulse 1.7s ease infinite}

.pinres.just-in{animation:blurIn .6s var(--ease)}

:root:not([data-theme="dark"]) .pinres .schip{color:#188038;border-color:rgba(24,128,56,.28);background:rgba(24,128,56,.06)}

.rg-h .lbl{flex:1}

.rg-h .cnt{font-size:11px;font-weight:700;color:var(--tx-3)}

/* panel resource row: the left-rail .tres aesthetic, elevated */
.pres{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;cursor:pointer;transition:background var(--t-q) var(--ease)}

.pres.just-in{animation:lresIn .55s var(--ease)}

.fev-sec.hide{display:none}

.res .m .t{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.fbentry .m .t{font-size:13px;font-weight:600}

:root[data-theme="dark"] .fbunit{background:var(--card);border-color:var(--line-2);box-shadow:0 16px 40px rgba(0,0,0,.36),0 2px 8px rgba(0,0,0,.24)}

:root:not([data-theme="dark"]) .fbperf-track{background:rgba(15,17,20,.07)}

/* ============================================================
   FINAL EVALUATION PANEL (.fev), final submission only.
   Distinct from stage feedback (.fb2): carries the overall
   rating, Content/Style sections, importance + Fix chips,
   and the Why / Approach expand.
   ============================================================ */
.fev{padding:0 8px 34px}

.fev-rating{font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.24;color:var(--tx);margin:0 2px 12px}
   /* same voice as the left card's stage title */
.fev-track{display:flex;gap:5px;margin:0 2px 7px}

.fev-track i{flex:1;height:3px;border-radius:99px;background:var(--hover);transition:background .5s var(--ease)}

.fev-track i.on{background:var(--gc,var(--meets))}

.fev-grades{display:flex;gap:5px;margin:0 2px 0}

.fev-grades span{flex:1;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--tx-3)}

.fev-grades span.on{color:var(--tx)}

.fev-sum{font-size:13.5px;line-height:1.6;color:var(--tx-2);margin:12px 2px 0}
   /* NEVER truncate — the two-line budget is enforced by writing FEWER WORDS */
.fev-sum b{color:var(--tx);font-weight:600}

/* category filter chips */
.fev-sec:first-of-type{margin-top:18px}
   /* the summary breathes before the first section (the filter row used to hold this gap) */
.fev-sec{margin-top:18px;border-top:var(--bw) solid var(--line);padding-top:12px}

.fev-sec-h{display:flex;align-items:baseline;gap:8px;margin:0 2px 6px}

.fev-sec-h .sh{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--tx-3)}
   /* label */
.fev-sec-h .cnt{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--tx-3);font-variant-numeric:tabular-nums}
   /* HOVER only — the open state is told by the chevron + the content, not a lingering glow */
:root:not([data-theme="dark"]) .fitem:hover{box-shadow:inset 0 0 0 1px var(--line)}
   /* same rhythm as the left rail's .req-h */
/* marks */
.fmark{width:23px;height:23px;border-radius:99px;flex:0 0 auto;display:grid;place-items:center;margin-top:1px;position:relative;border:1.5px solid var(--line);color:var(--tx-3);transition:background .35s var(--ease),border-color .35s var(--ease),color .35s var(--ease)}
   /* tucked up, only a sliver peeks, like it's sneaking out from behind the card */
.active-slot.has-fb .active{position:relative;z-index:1;background:var(--rail)}

.fbsec-h .sh{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--tx-3)}

.fbsec-h .cnt{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--tx-4);font-size:11.5px;font-weight:600}

/* action pills above the input */
.action-bar{max-width:var(--maxw);margin:0 auto 10px;display:none;gap:9px;padding:0 6px}

.action-bar.show{display:flex;animation:rise var(--t-m) var(--ease)}
                        /* sits tight under the question bubble, same trick as .mgr.cont */
.mcq:not(.done){animation:mcqIn .55s var(--ease) both}

/* ===== PLAN NOTES MODE: the chat box becomes a real note-taking surface — bigger, with Slack-style tools,
   and "Share my plan" as the one CTA. One slam, not a chat. ===== */
.fmt-bar{display:none;align-items:center;gap:2px;padding:9px 12px 0}

.composer.notesmode .fmt-bar{display:flex;animation:rise var(--t-q) var(--ease)}

.fmt-bar button{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--tx-3);font-size:13.5px;transition:background var(--t-q) var(--ease),color var(--t-q) var(--ease)}

.fmt-bar button:hover{background:var(--hover);color:var(--tx)}

.fmt-bar button svg{width:16px;height:16px}

.fb-sep{width:1px;height:16px;background:var(--line);margin:0 6px}

.composer.notesmode #ta{min-height:150px;font-size:14.5px;line-height:1.6}

.composer.notesmode .mic,.composer.notesmode .send{display:none}

.share-plan{display:none;align-items:center;font-size:13px;font-weight:600;color:var(--on-accent);background:var(--accent);border-radius:99px;padding:10px 18px;transition:transform var(--t-q) var(--ease),opacity var(--t-q) var(--ease)}

.share-plan:hover{transform:translateY(-1px)}

.share-plan:active{transform:scale(.97)}

.composer.notesmode .share-plan{display:inline-flex}

/* planning is a NOTEPAD VIEW, not a chat: the pad fills the room, the chat controls step out, Share is the one CTA */
.composer.notesmode .plus,.composer.notesmode .cam,.composer.notesmode .stuck-slider{display:none}

.fmt-lbl{display:none;margin-left:auto;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--tx-3);padding-right:6px}

.composer.notesmode .fmt-lbl{display:block}

.composer.notesmode:has(#ta:empty) .share-plan{background:var(--bubble);color:var(--tx-3);box-shadow:inset 0 0 0 1px var(--line);pointer-events:none}
   /* muted until there's a plan to share — still visibly a BUTTON (raised pill + hairline), not floating text */
/* ===== the notepad lives IN THE THREAD: a card right under the kickoff voice note, at chat width —
   "listen to the note, write your plan here" — part of the conversation, not the bottom input ===== */
.plan-pad{align-self:stretch;display:flex;flex-direction:column;margin:6px 0;border:var(--bw) solid var(--line);border-radius:16px;background:var(--card);animation:rise var(--t-m) var(--ease)}

.plan-pad .fmt-bar{display:flex;padding:10px 14px 0}

.plan-pad .fmt-lbl{display:block}

/* it opens compact and GROWS as you write, rather than reserving a wall of empty space up front */
.plan-pad .pp-ed{min-height:min(21vh,190px);max-height:46vh;overflow-y:auto;padding:10px 17px 6px;font-size:14.5px;line-height:1.6;outline:none;color:var(--tx);white-space:pre-wrap;word-break:break-word;cursor:text}

.plan-pad .pp-ed:empty:before{content:attr(data-ph);color:var(--tx-3);pointer-events:none}

.plan-pad .pp-foot{display:flex;justify-content:flex-end;padding:0 14px 12px}

.plan-pad .share-plan{display:inline-flex}

.plan-pad:has(.pp-ed:empty) .share-plan{background:var(--bubble);color:var(--tx-3);box-shadow:inset 0 0 0 1px var(--line);pointer-events:none}

.composer.choicemode .mcq-dock{display:block}

.composer.choicemode #ta,.composer.choicemode .att-row,.composer.choicemode .quote-bar,.composer.choicemode .npad{display:none}

.pill.hmorph{transition:height .45s var(--ease);overflow:hidden}

.composer.dropmode .drop-zone{opacity:1;filter:blur(0);transform:none;pointer-events:auto}

.composer.dropmode .pill{min-height:104px;border-style:dashed;border-color:var(--tx-4)}

.composer.dropmode .pill>*:not(.drop-zone){opacity:0;filter:blur(12px);pointer-events:none}

.pill>*{transition:opacity .4s var(--ease),filter .45s var(--ease)}

.detail .meta{font-size:11.5px;color:var(--tx-3);margin-bottom:16px}

.sheet-head .t{font-size:16px;font-weight:600}

.sheet-head .spacer{flex:1}

.fbitem.active{background:var(--accent-soft)}

/* same message styling as the main workspace chat: bubbles, no repeated avatar */
.s-chat .mgr{align-self:flex-start;max-width:90%}

.s-chat .mgr .mbubble{width:fit-content;max-width:100%;background:var(--soft);border:var(--bw) solid var(--line-2);border-radius:6px 16px 16px 16px;padding:10px 14px;font-size:14px;line-height:1.55;overflow-wrap:break-word}

.s-chat .mgr.cont{margin-top:-8px}

.s-chat .mgr.cont .mbubble{border-radius:16px}


/* ============ MANAGER PROFILE (right panel, click the manager avatar) ============ */
.chat-peer .pava,.chat-peer .pmeta{cursor:pointer}

.chat-peer .pava{transition:box-shadow var(--t-q) var(--ease)}

.chat-peer .pava:hover{box-shadow:0 0 0 3px var(--accent-soft)}

.chat-peer .pname{transition:color var(--t-q) var(--ease)}

.chat-peer .pmeta:hover .pname{color:var(--accent)}


/* ============ DOCUMENT VIEWER (in the right panel) ============ */
.right-inner{position:relative}

.r-head .dv-actions{display:flex;gap:4px;margin-left:auto}

.r-head .dv-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--tx-2);transition:background var(--t-q) var(--ease)}

.r-head .dv-ic:hover{background:var(--hover);color:var(--tx)}

.r-head .dv-ic svg{width:18px;height:18px}

.user .uq{border-left:2px solid var(--tx-4);padding-left:9px;margin-bottom:7px;font-size:12.5px;color:var(--tx-3);line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;transition:color var(--t-q) var(--ease),border-color var(--t-q) var(--ease)}

.user .uq:hover{color:var(--tx-2);border-color:var(--accent)}


@media(max-width:1080px){.rail,.right,.gutter{display:none}}

.prc-doc span.sh{width:58%}



/* presentation chips, docked in the chat's timepills bar (attached to chat, like the time estimate) */
.timepills.pres-chips{justify-content:center;gap:14px}


/* bottom-bar morph: the input converts into the "Start presenting" CTA, same footprint */
.composer.pres-cta-mode .composer-in,.composer.pres-cta-mode .foot,.composer.pres-cta-mode .action-bar,.composer.pres-cta-mode .timepills,.composer.pres-cta-mode .pou-micbar{display:none!important}

/* ===== PRESENTATION ENTRY POPUP ===== */
.pentry-scrim{position:fixed;inset:0;z-index:520;display:grid;place-items:center;padding:24px;background:transparent;backdrop-filter:blur(16px) saturate(1.05);-webkit-backdrop-filter:blur(16px) saturate(1.05);opacity:0;transition:opacity .3s var(--ease)}

.pentry-scrim.show{opacity:1}

.pentry{width:min(820px,94vw);height:min(478px,84vh);display:grid;grid-template-columns:1.1fr .9fr;grid-template-rows:minmax(0,1fr);background:var(--card);border:var(--bw) solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 44px 130px rgba(0,0,0,.55);transform:scale(.97) translateY(8px);transition:transform .34s var(--ease)}

.pentry-scrim.show .pentry{transform:none}

.pf-label{text-align:center;font-size:11px;color:var(--tx-3);font-weight:500;letter-spacing:.2px;margin:24px 0 14px}

.pentry .pcard{max-width:none}


/* ===== CLAW OPTIONS (replaces choice pills) ===== */
.timepills.claw-host.show{display:flex;flex-wrap:wrap;gap:9px;padding:0 6px}

.sp-tab.active{color:#1a73e8;border-bottom-color:#1a73e8;background:none}

.sp-row .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.zs-art.w .win2{left:20%;right:20%;top:20%;bottom:20%;border-radius:5px;background:rgba(255,255,255,.3);box-shadow:0 4px 12px rgba(0,0,0,.4)}

.zs-art.w .win2::before{content:'';position:absolute;top:0;left:0;right:0;height:7px;border-radius:5px 5px 0 0;background:rgba(255,255,255,.28)}

.mp-rz.w{left:-4px;top:12px;bottom:12px;width:9px;cursor:ew-resize}

.qrec-b.send{background:#f2f1ee;color:#111}

.qrec-b.send:hover{background:#fff}



/* ===== v57: one meter, tight top, walkthrough ===== */
.fev{padding:0 8px 34px!important}

.fev-rating{margin-bottom:14px}



/* ===== v58: panel to the top, scale + summary back ===== */
/* the 70px was clearing a header that already has its own space */
#app .right{padding-top:14px!important}

.fev-rating{margin-bottom:12px}

.fev-sum{font-size:13.5px;line-height:1.6;color:var(--tx-2);margin:0 0 20px;
  padding-bottom:18px;border-bottom:var(--bw) solid var(--line)}



/* ===== v59: verdict reads as type, not a banner ===== */
/* the scroll fade was washing the top of the verdict: start it flush */
.r-body{--fade-t:0px}

/* the verdict is set, not shouted */
.fev .fev-rating{font-family:var(--serif)!important;font-weight:500!important;font-size:26px!important;
  letter-spacing:-.012em!important;line-height:1.15!important;color:var(--tx)!important;margin:2px 2px 13px!important}

/* a hairline bar, not a slab */
.fev .fev-meter{height:4px!important;margin:0 2px 9px!important;box-shadow:inset 0 0 0 1px var(--line)}

.fev .fev-scale{margin:0 2px 16px!important}

.fev .fev-sum{margin-left:2px;margin-right:2px}



/* ===== v60: chip height, one divider, sticky walkthrough ===== */
/* the perf chip was outgrowing the XP pill beside it */
.topbar .perf{height:33px;padding:0 12px 0 10px;align-self:center;line-height:1}

.topbar .xp-chip{height:33px;align-self:center}

/* the summary and the first section were each drawing a rule: keep the section's */
.fev .fev-sum{border-bottom:none!important;padding-bottom:0!important;margin-bottom:0!important}

.fev .fev-sec:first-of-type{margin-top:22px}

/* the walkthrough stays reachable however long the feedback runs */
.r-body{--fade-b:0px}

.fev{padding-bottom:0!important}

.fev .fev-walk{position:sticky;bottom:0;z-index:4;margin:22px 2px 0;
  background:var(--tx);box-shadow:0 -18px 24px -10px var(--bg)}

.fev .fev-walk::before{content:'';position:absolute;left:-14px;right:-14px;bottom:-18px;top:auto;height:18px;
  background:var(--bg);z-index:-1}




/* the meter bars were bottom-aligned while the label centred: line them up */
.topbar .perf{align-items:center}

.topbar .perf>*{align-self:center!important}

.topbar .perf .pf-meter{align-items:center;line-height:0}

/* a global .pf-label (the portfolio one) was adding 24px/14px margins here */
.topbar .perf .pf-label{line-height:1;display:block;margin:0!important;text-align:left}

.r-body:has(> .fev){padding-bottom:14px}



/* ===== the evaluation is tinted by its band ===== */
.right-inner.fev-live{position:relative}

/* a shadow, not a halo: it sits inside the top edge and stays quiet */
.right-inner.fev-live::before{content:'';position:absolute;left:0;right:0;top:0;height:120px;z-index:3;pointer-events:none;
  border-radius:18px 18px 0 0;
  box-shadow:inset 0 26px 42px -30px var(--gc), inset 0 1px 0 0 color-mix(in srgb,var(--gc) 26%,transparent);
  opacity:.9}

/* the top of the scale earns something louder */
.right-inner.fev-live[data-band="exceptional"]::before{
  box-shadow:inset 0 60px 80px -46px var(--gc), inset 0 1px 0 0 color-mix(in srgb,var(--gc) 55%,transparent);
  opacity:1;animation:fevPulse 4.2s var(--ease) infinite}



/* ===== glow softened, spacing, panel divider ===== */
/* the 1px inset line was drawing a hard edge across the top: gone, and the wash is wider and fainter */
.right-inner.fev-live::before{
  height:200px!important;border-radius:18px 18px 0 0;
  box-shadow:none!important;
  background:linear-gradient(to bottom, color-mix(in srgb,var(--gc) 15%,transparent), transparent 78%)!important;
  opacity:.75!important}

.right-inner.fev-live[data-band="exceptional"]::before{
  background:linear-gradient(to bottom, color-mix(in srgb,var(--gc) 26%,transparent), transparent 82%)!important;
  opacity:1!important;animation:fevPulse 5s var(--ease) infinite}

/* the band colour is scoped to the verdict, never the panel's other tabs */
.right-inner:not(.fev-live)::before{display:none!important}



/* the tint is gated on the verdict actually being in the panel, so it cannot
   survive into resources or a doc view no matter which path opened them */
.right-inner.fev-live::before{content:none!important}

.right-inner.fev-live:has(.fev)::before{content:''!important}



/* ===== v112: the verdict breathes, and the band is a glow behind the panel ===== */
/* the scale sat flush against the prose — the labels belong to the bar, the prose needs its own bar of air */
.fev .fev-track{margin:0 2px 8px!important}

.fev .fev-grades{margin:0 2px 0!important}

.fev .fev-sum{margin-top:30px!important}

/* the same wash the presentation report wears, so a verdict reads the same wherever it lands.
   --gc is set live, so this travels with the meter while the grade detects itself. */
.right-inner.fev-live::before{
  height:280px!important;
  background:linear-gradient(to bottom, color-mix(in srgb,var(--gc) 14%,transparent), transparent 76%)!important;
  opacity:.85!important;
  transition:background .5s var(--osmo),opacity .5s var(--osmo)}

.right-inner.fev-live[data-band="exceptional"]::before{
  background:linear-gradient(to bottom, color-mix(in srgb,var(--gc) 22%,transparent), transparent 82%)!important;
  opacity:1!important;animation:fevPulse 5s var(--ease) infinite}

/* the stage is finished. There is nothing left to ask him, so the input goes away entirely and
   the one thing you can still do takes the middle of the column. */
.composer.stage-done .composer-in,
.composer.stage-done .foot,
.composer.stage-done .timepills,
.composer.stage-done .plan-pin{display:none!important}

.composer.stage-done .action-bar{justify-content:center;margin-bottom:30px}

.per-slide .t{left:8%;top:33%;width:68%;height:8px;background:#2f2c29}



/* the popup hosts the flying recording, so the portfolio panel keeps its own clipping */
.pentry{position:relative}





/* ===== stage UX styles merged from the team's build ===== */
.app.pip .chat-peer .psub,.app.pip .ph-pill{display:none}

.fev-head{overflow:hidden;max-height:600px;opacity:1;transition:max-height .6s var(--ease),opacity .45s var(--ease),margin-bottom .6s var(--ease)}

.fev-head.collapsed{max-height:0;opacity:0;margin-bottom:-18px}

.fev .fnote{display:none!important}


/* ===== v86: every sheet arrives the same way — the room blurs, then it rises =====
   One curve does all of it, so the whole product moves like one thing. */
:root{ --osmo:cubic-bezier(.65,.05,0,1); }

/* the blur and the rise are one movement on one curve. No stagger, nothing to catch on. */
.zshare,.join-scrim,.pentry-scrim{
  opacity:0; backdrop-filter:blur(0px) saturate(1); -webkit-backdrop-filter:blur(0px) saturate(1);
  transition:opacity .46s var(--osmo), backdrop-filter .46s var(--osmo), -webkit-backdrop-filter .46s var(--osmo);
}

.zshare.show,.join-scrim.show,.pentry-scrim.show{
  opacity:1; backdrop-filter:blur(20px) saturate(1.04); -webkit-backdrop-filter:blur(20px) saturate(1.04);
}

.zshare .zs-card,.join-scrim .join-pop,.pentry-scrim .pentry{
  transform:translateY(44px) scale(.99);
  transition:transform .46s var(--osmo);
  will-change:transform;
}

.zshare.show .zs-card,.join-scrim.show .join-pop,.pentry-scrim.show .pentry{ transform:none }


/* ===== v89: the chat gets its corners back =====
   The tail corner was the only sharp thing in a soft interface. It goes. */
.msgs .mgr .mbubble{border-radius:20px!important}

.msgs .mgr.cont .mbubble{border-radius:20px!important}

.s-chat .mgr.cont .mbubble{border-radius:18px!important}

.user{border-radius:20px!important}

.app.pip .msgs .mgr .mbubble,.app.pip .user{border-radius:14px!important}


/* ===== v97: one actionable pill, sitting on the strip above the chat =====
   Not a stacked card list. A short row of pills you can hit and move on. */
.zpill{display:inline-flex;align-items:center;gap:8px;padding:10px 17px;border-radius:99px;cursor:pointer;
  border:var(--bw) solid var(--line);background:var(--card);color:var(--tx);
  font-family:var(--f-body);font-size:13.5px;font-weight:600;white-space:nowrap;
  transition:background var(--t-q) var(--ease),transform var(--t-q) var(--ease),border-color var(--t-q) var(--ease)}

.zpill:hover{background:var(--hover);transform:translateY(-1px)}

.zpill svg{width:15px;height:15px;flex:0 0 auto}

.zpill .zp-i{display:grid;place-items:center;color:var(--tx-2)}

   destroyed per use. Idle at inset:0 with opacity 0 it swallowed every click in the app: no typing,
   no reactions, nothing. It only takes pointer events while it is actually open. */
.pentry-scrim{pointer-events:none}
.pentry-scrim.show{pointer-events:auto}

/* a person in the rail, on the rhythm of .tres and the bar of .fev-track */
.pgrp+.pgrp{margin-top:22px}

.pers{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:8px 8px;border-radius:11px;
  transition:background var(--t-q) var(--ease)}
.pers:hover{background:var(--hover)}
.pers.on{background:var(--soft)}
.pers.locked{opacity:.4;pointer-events:none}
/* the person, as a face. The ring around it is how the relationship reads: it fills the way a
   story rim does, in their own colour, with the heart sitting on it. */
.pav{position:relative;width:40px;height:40px;flex:0 0 40px;border-radius:99px;display:grid;place-items:center}
.pav img{width:34px;height:34px;border-radius:99px;object-fit:cover;display:block}
.pav .ini{width:34px;height:34px;border-radius:99px;display:grid;place-items:center;color:#fff;font-size:12.5px;font-weight:600}
.pav::before{content:'';position:absolute;inset:0;border-radius:99px;pointer-events:none;
  background:conic-gradient(from -90deg,var(--rc) calc(var(--rp)*1%),var(--line) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 2px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 2px));
  transition:background .6s var(--ease)}
.pav .hb{position:absolute;right:-3px;bottom:-3px;width:15px;height:15px;border-radius:99px;
  background:var(--rail);display:grid;place-items:center;color:var(--rc)}
.pav .hb svg{width:9px;height:9px;display:block}
.pers.locked .pav::before{background:var(--line)}
.pers .pm{flex:1;min-width:0}
.pers .pn{font-size:12.5px;font-weight:600;letter-spacing:-.005em;display:flex;align-items:center;gap:6px}

  text-transform:uppercase;color:var(--tx-3);padding:2px 0}
.rmove.up{color:var(--ok)} .rmove.dn{color:var(--fix)}

/* the ask: our .req rhythm, with a slot that fills in */
.slot{display:flex;align-items:flex-start;gap:10px;padding:8px 2px}
.slot+.slot{border-top:var(--bw) solid var(--line-2)}

  };
  let ctx=null,on=(()=>{try{const v=localStorage.getItem('zsnd');return v===null?true:v==='1';}catch(e){return true}})();
  const c=()=>{try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;if(!ctx)ctx=new C();if(ctx.state==='suspended')ctx.resume().catch(()=>{});return ctx;}catch(e){return null}};

/* ---------- Jay, and the gate ---------- */
function jayOpen(){
  typing('jay',()=>{
    say('jay','Host cancellations went from 8% to 14% in six weeks. Support is drowning and nobody has owned it.');
    setTimeout(()=>typing('jay',()=>{
      say('jay','Before I give you the team, I need to know you understand the job. There are <b>five things</b> your recommendation has to cover. I am not telling you what they are. Walk me through what you think they should be.');
      gateStage=1; $('ta').dataset.ph='Tell him what it has to cover…'; renderRight();
    },700),600);
  },600);
}
function gate(text){
  const t=' '+text.toLowerCase()+' ';
  const nu=[], nb=[];
  REQS.forEach(r=>{ if(!got[r.k]&&hits(t,r.kw)){ got[r.k]=true; nu.push(r); } });
  BONUS.forEach(b=>{ if(!bonusGot.includes(b.k)&&hits(t,b.kw)){ bonusGot.push(b.k); nb.push(b); } });
  gateTurns++; awardXP(nu.length*30+nb.length*50); renderRight();
  const parts=[];
  if(nu.length) parts.push('Good, '+nu.map(r=>r.ack).join(' and '));
  if(nb.length) parts.push((parts.length?'and ':'')+nb.map(b=>b.ack).join(' and ')+', which is past what I asked but I like it');
  if(gotCount()===REQS.length){ openTeam(parts); return; }
  rmove('jay', nu.length*2 + nb.length*3 || -1);
  if(gateTurns>=6){ revealRest(); return; }
  typing('jay',()=>{
    if(parts.length) say('jay', parts.join(', ')+'. That is '+gotCount()+' of five. What else does it need?');
    else say('jay','Not quite. Think about what I would need to act on this. What are the pieces? '+gotCount()+' of five so far.');
  });
}
function openTeam(parts){
  gateStage=2; rmove('jay',4);
  typing('jay',()=>{
    say('jay','That is all five. '+(parts&&parts.length?parts.join(', ')+'. ':'')+'Now show me how you are going to go at it. Who are you talking to, and in what order?');
    setTimeout(planPad,600); ZSND.play('success');
  });
}

    awardXP(80);
    typing('jay',()=>{
      say('jay','That works. The team is open now, go pull what you need and bring me the recommendation.');
      planDone=true; gateOpen=true; renderRail(); renderRight(); showSubmit();
    },1000);
  });
  place(pad); requestAnimationFrame(()=>{ scrollDown(); pad.querySelector('.pp-ed').focus(); });
}
/* one pad, used by planning and by the write-up */
function makePad(id,label,ph,cta,onShare){
  const pad=document.createElement('div'); pad.className='plan-pad'; pad.id=id;
  pad.innerHTML='<div class="fmt-bar">'
    +'<button data-fmt="bold" data-tip="Bold"><b>B</b></button>'
    +'<button data-fmt="italic" data-tip="Italic"><i>I</i></button>'
    +'<span class="fb-sep"></span>'
    +'<button data-fmt="insertUnorderedList" data-tip="Bulleted list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="4.4" cy="6" r="1.1" fill="currentColor" stroke="none"/><circle cx="4.4" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="4.4" cy="18" r="1.1" fill="currentColor" stroke="none"/><path d="M9 6h11M9 12h11M9 18h11"/></svg></button>'
    +'<span class="fmt-lbl">'+label+'</span></div>'
    +'<div class="pp-ed" contenteditable="true" role="textbox" aria-multiline="true" data-ph="'+ph+'"></div>'
    +'<div class="pp-foot"><button class="share-plan">'+cta+'</button></div>';
  const ed=pad.querySelector('.pp-ed');
  pad.querySelectorAll('[data-fmt]').forEach(b=>b.addEventListener('mousedown',e=>{ e.preventDefault(); ed.focus(); document.execCommand(b.dataset.fmt); }));
  pad.querySelector('.share-plan').onclick=()=>{ const v=ed.innerText.trim(); if(v.length<12) return; pad.remove(); onShare(v); };
  return pad;
}
function revealRest(){
  const miss=REQS.filter(r=>!got[r.k]); miss.forEach(r=>got[r.k]=true);
  gateStage=2; rmove('jay',1); renderRight();
  typing('jay',()=>{
    say('jay','Let me fill the gaps. You also needed '+miss.map(r=>r.ack).join(', ')+'. That is the five, pinned on the right. Now show me how you are going to go at it.');
    setTimeout(planPad,600);
  });
}

/* ---------- the team ---------- */
function reply(id, text){
  const t=' '+text.toLowerCase()+' ', K=KNOW[id];
  if(hits(t,THANKW)){ typing(id,()=>{ say(id,K.thanks); rmove(id,1); }); return; }
  if(hits(t,GREETW)&&text.length<24){ typing(id,()=>{ say(id,K.greet); rmove(id,1); }); return; }
  if(hits(t,FILEW)&&FILES[id]){ typing(id,()=>{ say(id,'Yeah, here you go.'); handFile(id); rmove(id,1); }); return; }
  const rule=(K.rules||[]).find(r=>hits(t,r.kw));
  if(rule){
    asks[id]++;
    if(asks[id]>FATIGUE){ typing(id,()=>{ say(id,K.tired); rmove(id,-2); }); return; }
    typing(id,()=>{ say(id,rule.r); rmove(id,2); awardXP(25); }); return;
  }
  const other=TEAM.find(o=>o!==id&&hits(t,LANE[o]));
  if(other){ typing(id,()=>{ say(id,'That is more '+PEOPLE[other].first+'’s area, '+PEOPLE[other].role.toLowerCase()+'. I would ask them.'); rmove(id,-1); }); return; }
  typing(id,()=>{ say(id,K.dunno); rmove(id,-1); });
}

/* ---------- right panel: the ask, then the read ---------- */
/* the panel is tabbed the way ours is: the ask, the files you have pulled, and once he has read
   it, your read. Each is its own panel rather than one long column. */
let panelTab='ask', hasReport=false, filesDot=false, reportData=null;
function renderTabs(){
  const tabs=[['ask','The ask',false],['files','Files',filesDot]];
  if(hasReport) tabs.push(['read','Your read',false]);
  $('rHead').innerHTML='<div class="r-tabs2" id="rTabs">'
    +tabs.map(([k,t,dot])=>'<button class="r-tab2'+(panelTab===k?' on':'')+'" data-t="'+k+'"><span>'+t+'</span>'
      +(dot?'<span class="dot live"></span>':'')+'</button>').join('')
    +'</div><span class="spacer"></span>';
  $('rHead').querySelectorAll('.r-tab2').forEach(b=>b.onclick=()=>selectTab(b.dataset.t));
}
function selectTab(k){ panelTab=k; if(k==='files') filesDot=false; renderRight(); ZSND.play('tap'); }
function renderRight(justFile){
  renderTabs();
  let h='';
  if(panelTab==='ask'){
    h+='<div class="rsec"><div class="rsec-h"><span class="lbl">Minimum expectations</span><span class="cnt">'+gotCount()+' of '+REQS.length+'</span></div>';
    REQS.forEach((r,i)=>{ const on=got[r.k];
      h+='<div class="slot'+(on?' on':'')+'"><span class="sn">'+(on?HI.tick:(i+1))+'</span>'
        +'<span class="st">'+(on?r.t:'Not uncovered yet')+'</span></div>'; });
    h+='</div>';
    h+='<div class="rsec"><div class="rsec-h"><span class="lbl">Beyond the ask</span><span class="cnt">'+bonusGot.length+'</span></div>';
    if(bonusGot.length) bonusGot.forEach(k=>{ const b=BONUS.find(x=>x.k===k);
      h+='<div class="xtra"><span class="xi">+</span><span>'+b.t+'</span></div>'; });
    else h+='<div class="rnone">Anything you raise past the basics collects here.</div>';
    h+='</div>';
  } else if(panelTab==='files'){
    h+='<div class="rsec"><div class="rsec-h"><span class="lbl">Shared files</span><span class="cnt">'+files.length+' of 4</span></div>';
    if(!files.length) h+='<div class="rnone">Nothing yet. Ask people for their data and it lands here.</div>';
    else files.forEach((k,i)=>{ const f=FILES[k];
      h+='<div class="tres'+(justFile&&i===files.length-1?' just-in':'')+'" data-f="'+k+'"><span class="ti">'+HI.file+'</span>'
        +'<span class="tn">'+f.name+'</span><span class="eye">'+HI.view+'</span></div>'; });
    h+='</div>';
  } else if(panelTab==='read'&&reportData){ h=reportHTML(reportData); }
  $('rBody').innerHTML=h;
  $('rBody').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>openDoc(b.dataset.f));
}
function syncMorale(){
  const m=Math.round(TEAM.reduce((a,id)=>a+rel[id],0)/TEAM.length);
  const lvl = m>=75?4:m>=60?3:m>=45?2:1;
  $('perfChip').dataset.lvl=lvl;
  $('perfLabel').textContent = m>=75?'Team is with you' : m>=60?'Team is fine' : m>=45?'Team is strained' : 'Team is done with you';
}

/* ---------- documents ---------- */
function openDoc(k){
  const f=FILES[k];
  $('docSheet').innerHTML='<div class="r-head" style="padding:18px 22px 14px"><span class="t">'+f.name+'</span>'
    +'<button class="hic" id="docX" aria-label="Close">'+HI.x+'</button></div>'
    +'<div style="padding:0 22px 22px"><div class="fdata" style="font-family:var(--mono);font-size:11.5px;line-height:1.8;color:var(--tx-2);background:var(--soft);border-radius:16px;padding:16px 18px;white-space:pre-wrap">'+esc(f.doc)+'</div></div>';
  $('docX').onclick=closeDoc;
  const s=$('docScrim'); s.classList.add('show'); ZSND.play('open');
}
function closeDoc(){ $('docScrim').classList.remove('show'); ZSND.play('close'); }
$('docScrim').onclick=e=>{ if(e.target.id==='docScrim') closeDoc(); };

/* ---------- the recommendation: our pad, in the thread ---------- */
function showSubmit(){
  const bar=$('actionBar');
  bar.innerHTML='<button class="zpill go" id="pillSub"><span class="zp-i">'+HI.tick+'</span>Write your recommendation</button>';
  bar.classList.add('show');
  $('pillSub').onclick=openPad;
}
function clearBar(){ const b=$('actionBar'); b.classList.remove('show'); b.innerHTML=''; }
function openPad(){
  if(submitted||document.getElementById('recPad')) return;
  clearBar(); switchTo('jay');
  const pad=makePad('recPad','Your recommendation',
    'What is driving the cancellations, what it is costing, and what you recommend…','Send to Jay',
    v=>evaluate(v));
  place(pad); requestAnimationFrame(()=>{ scrollDown(); pad.querySelector('.pp-ed').focus(); });
}

/* ---------- the read: our evaluation panel ---------- */
const BANDS=[
  {k:'Below',       t:'Below expectations',  c:'var(--fix)'},
  {k:'Meets',       t:'Meets expectations',  c:'var(--meets)'},
  {k:'Exceeds',     t:'Exceeds expectations',c:'var(--ok)'},
  {k:'Exceptional', t:'Exceptional',         c:'#a06bff'}
];
const PROOF=[
  {t:'Named the driver', kw:['sync','calendar','conflict','double book'],
   miss:'You never say what is actually causing them. Calendar conflicts are 46% of cancellations, and 71% of those are multi-platform sync.'},
  {t:'Sized the problem', kw:['8','14','%','percent','rate','climb','trend','week'],
   miss:'No sense of scale. 8% to 14% in six weeks is the shape of it.'},
  {t:'Put a number on it', kw:['$','28','12m','12 m','million','cost','support'],
   miss:'Nothing on what it costs. $28 a cancellation across 107k a quarter is roughly $12M a year.'},
  {t:'Recommended something concrete', kw:['real-time','real time','polling','hard block','sync fix','five-minute','5-min','fix the sync'],
   miss:'No concrete fix. Taking the sync job back to real-time polling with a hard block is the thing Avery can actually ship.'},
  {t:'Said what it would move', kw:['10','3m','3 m','$3','save','saving','reduce','drop','point','target'],
   miss:'You do not say what the fix is worth. Marco can defend about $3M a year at a 10% rate.'}
];
function evaluate(raw){
  submitted=true;
  const t=raw.toLowerCase();
  const proof=PROOF.map(p=>({t:p.t, miss:p.miss, ok:hits(t,p.kw)}));
  const hit=proof.filter(p=>p.ok).length;
  const spoke=TEAM.filter(id=>opened[id]);
  const missed=TEAM.filter(id=>!opened[id]);
  const burned=TEAM.filter(id=>rel[id]<50);
  const morale=Math.round(TEAM.reduce((a,id)=>a+rel[id],0)/TEAM.length);
  const work=[
    {ok:missed.length===0, t:'Talked to everyone who held a piece',
     d: missed.length? 'You used '+spoke.length+' of 4. '+missed.map(id=>PEOPLE[id].first).join(' and ')+' never heard from you.'
        : 'All four, and each of them owns something the others do not.'},
    {ok:files.length>=3, t:'Got the evidence in writing',
     d: files.length>=3 ? 'You asked for their data instead of taking their word for it.'
        : 'You collected '+files.length+' of 4 files. Numbers you cannot show are numbers you cannot defend.'},
    {ok:burned.length===0, t:'Kept the team on your side',
     d: burned.length? 'You wore out '+burned.map(id=>PEOPLE[id].first).join(' and ')+'. You will need them next time.'
        : 'Nobody got worn out getting you here.'},
    {ok:bonusGot.length>0, t:'Went past the brief',
     d: bonusGot.length? 'You raised '+bonusGot.length+' thing'+(bonusGot.length>1?'s':'')+' Jay never asked for.'
        : 'You covered what was asked and nothing else.'}
  ];
  const wOK=work.filter(w=>w.ok).length;
  let band = hit<=2 ? 0 : hit<=3 ? 1 : 2;
  if(hit===5 && wOK>=3) band=3;
  if(hit>=4 && wOK<=1) band=1;

  const turn=document.createElement('div'); turn.className='uturn';
  turn.innerHTML='<div class="user">'+esc(raw.length>240?raw.slice(0,240)+'…':raw)+'</div>';
  place(turn); scrollDown(); ZSND.play('commit');
  rmove('jay', band>=2?5:band===1?1:-2);
  typing('jay',()=>{
    say('jay', band>=2
      ? 'This is it. You ran it yourself and you brought me something I can act on. The full read is on the right.'
      : hit<=2
        ? 'This is not there yet. I have written the whole read up on the right.'
        : 'Close, but not done. I have written up where it falls short, on the right.');
    setTimeout(()=>report(band,proof,work,morale), 700);
  },1100);
}
function report(band, proof, work, morale){
  reportData={band,proof,work,morale}; hasReport=true; panelTab='read';
  awardXP([0,60,140,220][band]);
  renderRight();
  ZSND.play(band>=2?'success':'error');
}
function reportHTML(d){
  const band=d.band, proof=d.proof, work=d.work, morale=d.morale, B=BANDS[band];
  const verdict=[
    'This does not clear the bar. What is missing is what would let anyone act on it.',
    'It holds together, but a reader still has to do work you should have done for them.',
    'Strong. You found the driver, you priced it, and you recommended something someone can build.',
    'Nothing left for me to send back. You worked it like someone who has done this before.'
  ][band];
  let h='<div class="fev" style="--gc:'+B.c+'" data-rating="'+(band+1)+'">'
    +'<div class="fev-head">'
    +'<div class="fev-rating rev" style="--d:60ms">'+B.t+'</div>'
    +'<div class="fev-track rev" style="--d:120ms">'+BANDS.map((b,i)=>'<i class="'+(i<=band?'on':'')+'"></i>').join('')+'</div>'
    +'<div class="fev-grades rev" style="--d:120ms">'+BANDS.map((b,i)=>'<span class="'+(i===band?'on':'')+'">'+b.k+'</span>').join('')+'</div>'
    +'<div class="fev-sum rev" style="--d:180ms">'+verdict+'</div>'
    +'</div>';
  h+='<div class="fev-sec"><div class="fev-sec-h"><span class="sh">What you delivered</span><span class="cnt">'+proof.filter(p=>p.ok).length+' of 5</span></div>';
  proof.forEach(p=>{ h+='<div class="wrow"><span class="wk '+(p.ok?'y':'n')+'">'+(p.ok?HI.tick:HI.x)+'</span>'
    +'<span><span class="wt">'+p.t+'</span>'+(p.ok?'':'<span class="wd">'+p.miss+'</span>')+'</span></div>'; });
  h+='</div>';
  h+='<div class="fev-sec"><div class="fev-sec-h"><span class="sh">How you worked</span><span class="cnt">'+work.filter(w=>w.ok).length+' of 4</span></div>';
  work.forEach(w=>{ h+='<div class="wrow"><span class="wk '+(w.ok?'y':'n')+'">'+(w.ok?HI.tick:HI.x)+'</span>'
    +'<span><span class="wt">'+w.t+'</span><span class="wd">'+w.d+'</span></span></div>'; });
  h+='</div>';
  h+='<div class="fev-sec"><div class="fev-sec-h"><span class="sh">The team you leave behind</span><span class="cnt">'+morale+'</span></div>';
  TEAM.forEach(id=>{ const v=rel[id];
    const line=v>=70?'Would work with you again tomorrow.':v>=50?'Fine, but you did not leave much in the bank.':'You spent more than you put in.';
    h+='<div class="wrow">'+face(id,false)
      +'<span style="flex:1"><span class="wt">'+PEOPLE[id].name+'</span><span class="wd">'+line+'</span></span>'
      +'<span class="pv" style="color:'+relColor(v)+'">'+v+'</span></div>'; });
  h+='</div></div>';
  return h;
}

/* ---------- composer ---------- */
const ta=$('ta');
Object.defineProperty(ta,'value',{get(){return ta.innerText.replace(/ /g,' ')},set(v){ta.innerHTML=v?'':''}});
function sendNow(){
  const v=ta.innerText.trim(); if(!v) return;
  ta.innerHTML=''; refreshComposer();
  me(active, v); scrollDown(); ZSND.play('select');
  if(active==='jay'&&gateStage===1){ gate(v); return; }
  reply(active, v);
}
$('sendBtn').onclick=sendNow;
/* clicking anywhere on the pill puts the caret in the input, the way it does in the workspace */
$('pill').addEventListener('mousedown',e=>{ if(e.target.closest('button')) return; e.preventDefault(); ta.focus(); });
function refreshComposer(){ $('pill').classList.toggle('active-send', !!ta.innerText.trim()); }
ta.addEventListener('input',()=>{ if(!ta.textContent.trim()&&!ta.querySelector('ol,ul')) ta.innerHTML=''; refreshComposer(); });
ta.addEventListener('paste',e=>{ e.preventDefault(); const t=(e.clipboardData||window.clipboardData).getData('text/plain'); document.execCommand('insertText',false,t); });
ta.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendNow(); }});
$('sndBtn').onclick=()=>{ const n=!ZSND.isOn(); ZSND.set(n); if(n)ZSND.play('tap'); };
/* the bottom bar does what it does everywhere else in the product */
$('plusBtn').onclick=()=>{ ZSND.play('tap'); nudge('Attach anything you have pulled together. Jay reads it when you send the recommendation.'); };
$('connectBtn').onclick=()=>{ ZSND.play('tap'); nudge('Connect a tool and its data lands in your files, alongside what the team sends you.'); };
$('camBtn').onclick=()=>{ ZSND.play('tap'); nudge('Grab a screenshot of what you are looking at and send it to whoever is in this thread.'); };
$('stuckToggle').onclick=()=>{ stuck=!stuck; $('stuckToggle').classList.toggle('on',stuck); ZSND.play(stuck?'toggleOn':'toggleOff');
  nudge(stuck? 'Stuck mode is on. Ask anyone anything and they will point you at who actually owns it.'
             : 'Stuck mode off. You are driving again.'); };
$('micBtn').onclick=()=>{ ZSND.play('tap'); nudge('Say it out loud instead of typing. Same thread, same person.'); };
let stuck=false;
function nudge(t){ const d=document.createElement('div'); d.className='rmove rev'; d.textContent=t;
  d.style.cssText='text-transform:none;letter-spacing:0;font-family:var(--f-body);font-size:12.5px;line-height:1.55;max-width:var(--maxw);text-align:center;color:var(--tx-3)';
  place(d); scrollDown(); }
try{ $('sndBtn').dataset.on=ZSND.isOn()?'1':'0'; }catch(e){}
(function(){ const w=()=>{ try{ZSND.play('tap')}catch(e){} window.removeEventListener('pointerdown',w,true); };
  window.addEventListener('pointerdown',w,true); })();

renderRail(); renderRight(); syncMorale(); switchTo('jay');
</script>
