y=\"9.6\" width=\"86\" height=\"1.2\" fill=\"#fff\" opacity=\".28\"/></g>\n      <path d=\"M34 5 11 14l23 9z\" fill=\"#f0d3a8\"/><path d=\"M34 14 11 14l23 9z\" fill=\"#d9b485\"/>\n      <path d=\"M17.5 11.6 3 14l14.5 2.4z\" fill=\"#2a2c30\"/>\n      <rect x=\"120\" y=\"4.5\" width=\"15\" height=\"19\" fill=\"#e3b23c\"/><rect x=\"120\" y=\"4.5\" width=\"15\" height=\"4.5\" fill=\"#f6d777\"/>\n      <rect x=\"120\" y=\"19\" width=\"15\" height=\"4.5\" fill=\"#bd8f22\"/><rect x=\"124.5\" y=\"4.5\" width=\"1.6\" height=\"19\" fill=\"#fff\" opacity=\".35\"/>\n      <rect x=\"134\" y=\"5.5\" width=\"14\" height=\"17\" rx=\"5\" fill=\"#ff9d95\"/><rect x=\"134\" y=\"5.5\" width=\"14\" height=\"5\" rx=\"4\" fill=\"#ffb9b3\"/></svg>`,\n  propPin:`<svg width=\"34\" height=\"38\" viewBox=\"0 0 34 38\" fill=\"none\"><ellipse cx=\"17\" cy=\"35\" rx=\"3.4\" ry=\"2\" fill=\"rgba(0,0,0,.3)\"/>\n      <path d=\"M17 20v16\" stroke=\"#8e1810\" stroke-width=\"2.6\" stroke-linecap=\"round\"/><circle cx=\"17\" cy=\"12\" r=\"11\" fill=\"#e0473a\"/>\n      <circle cx=\"17\" cy=\"12\" r=\"11\" stroke=\"#fff\" stroke-width=\"2.6\"/><circle cx=\"13\" cy=\"8\" r=\"3.4\" fill=\"#ff9d92\"/></svg>`\n};\nconst slugify = s => s.toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'');\nconst MONO = ['#ff9e7d','#8ecdff','#c9b8ff','#c9f24f','#ffd84d','#8fe3c0'];\nconst markCache = new Map();\nfunction brandMark(slug){\n  if(!slug) return Promise.resolve(null);\n  if(markCache.has(slug)) return markCache.get(slug);\n  const p = fetch('https://cdn.simpleicons.org/'+slug)\n    .then(r => r.ok ? r.text() : null)\n    .then(t => (!t || !/^\\s*<svg[\\s>]/i.test(t) || /<script/i.test(t)) ? null : t.replace('<svg ','<svg width=\"24\" height=\"24\" '))\n    .catch(()=>null);\n  markCache.set(slug,p); return p;\n}\nconst photoCache = new Map();\nfunction cityPhoto(city){\n  const key = city.trim().toLowerCase();\n  if(photoCache.has(key)) return photoCache.get(key);\n  const p = (async ()=>{\n    try{\n      const u = 'https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=pageimages&pithumbsize=760&redirects=1&titles='+encodeURIComponent(city.trim());\n      const r = await fetch(u); if(!r.ok) return null;\n      const d = await r.json();\n      const pages = d && d.query && d.query.pages; if(!pages) return null;\n      const pg = Object.values(pages)[0];\n      return (pg && pg.thumbnail && pg.thumbnail.source) || null;\n    }catch(e){ return null; }\n  })();\n  photoCache.set(key,p); return p;\n}\nfunction highlight(t){\n  const w = esc(t).split(' ');\n  if(w.length<5) return w.join(' ');\n  const a = Math.max(1,Math.floor(w.length*.36));\n  const b = Math.min(w.length, a+Math.max(2,Math.round(w.length*.3)));\n  return w.slice(0,a).join(' ')+' <mark>'+w.slice(a,b).join(' ')+'</mark> '+w.slice(b).join(' ');\n}\nconst initials = s => { const p=s.trim().split(/\\s+/); return ((p[0]||'?')[0]||'?').toUpperCase()+(p[1]?p[1][0].toUpperCase():''); };\nconst SHEEN = '<div class=\"sheen\"><i></i></div>';\nconst KILL  = '<button class=\"kill\" title=\"Take it off\">\u00d7</button>';\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 what is on the mat \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nfunction manifest(){\n  const out = [];\n  if(S.name.trim()) out.push({id:'name', type:'name', rot:-1.2});\n  let tagIdx = 0;\n  S.entries.forEach(en=>{\n    if(!String(en.value||'').trim() && en.type!=='field' && !PICTURE.includes(en.type)) return;\n    if(en.type==='field' && !String(en.value||'').trim() && !String(en.label||'').trim()) return;\n    if(PICTURE.includes(en.type) && !en.src && !String(en.value||'').trim()) return;   // a picture is content on its own\n    const it = {id:'e'+en.id, type:en.type, data:en, rot:en.rot};\n    if(COLOURABLE.includes(en.type)) it.tone = en.color || defaultTone(en, en.type==='tag' ? tagIdx++ : 0);\n    out.push(it);\n  });\n  if(S.props) PROPS.forEach((p,i)=> out.push({id:'prop:'+i, type:'prop', data:p, full:p.f, rot:p.rot}));\n  return out;\n}\nfunction markup(it){\n  const v = it.data ? String(it.data.value||'') : '';\n  switch(it.type){\n    case 'name':    return {cls:'p-name',  html:KILL+esc(S.name.trim())};\n    /* a role wears a briefcase so it never reads as just another tag */\n    case 'role':    return {cls:'p-role', style:`--tone:${it.tone||'#ffd84d'}`, html:SHEEN+KILL+\n      `<span class=\"bag\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n        <rect x=\"2.5\" y=\"7\" width=\"19\" height=\"13.5\" rx=\"3\"/><path d=\"M8.5 7V5.4A2.4 2.4 0 0 1 11 3h2a2.4 2.4 0 0 1 2.5 2.4V7\"/><path d=\"M2.5 12.5h19\"/></svg></span><span>${esc(v)}</span>`};\n    case 'tag':     return {cls:'p-tag',   html:SHEEN+KILL+esc(v), style:`--tone:${it.tone}`};\n    case 'line':    return {cls:'p-vision',html:SHEEN+KILL+'<span class=\"q\">\u201c</span>'+highlight(v)};\n    case 'note':    return {cls:'p-note', style:`--tone:${it.tone||'#ffd84d'}`, html:SHEEN+KILL+esc(v)};\n    case 'sticker': return {cls:'p-stk', style:`--tone:${it.tone||'#ffd84d'}`, html:SHEEN+KILL+esc(v||'\u2605')};\n    case 'polaroid': return {cls:'p-photo', style:`--pw:${sizeOf(it.data)}px`, html:SHEEN+KILL+\n      `<span class=\"mark\">${ART.propPin}</span>\n       <div class=\"shot\">${it.data.src\n          ? `<img alt=\"\" draggable=\"false\" src=\"${it.data.src}\"/>`\n          : '<span class=\"none\">pick a picture or a gif in the panel</span>'}</div>\n       <div class=\"cap\">${esc(v)}</div>`};\n    /* A bare image. A PNG keeps its own silhouette, so the stroke follows the\n       shape instead of boxing it in; anything opaque gets the usual frame. */\n    case 'text': {\n      const k = it.data.size || 'm';\n      return {cls:'p-text', style:`--fs:${TEXT_SIZE[k]}px;--stw:${TEXT_STROKE[k]}px;--tone:${it.tone||'#16281d'}`,\n              html:KILL+esc(v)};\n    }\n    case 'image': {\n      const png = it.data.kind === 'png';\n      return {cls:'p-image'+(png?' cut':''), style:`--pw:${sizeOf(it.data)}px`, html:\n        (png?'':SHEEN) + KILL + (it.data.src\n          ? `<img alt=\"\" draggable=\"false\" src=\"${it.data.src}\"/>`\n          : '<span class=\"none\">pick a picture or a gif in the panel</span>')};\n    }\n    case 'field':   return {cls:'p-cus', html:SHEEN+KILL+\n      `<span class=\"ck\">${esc(it.data.label||'Note')}</span><span class=\"cv\">${esc(v||it.data.label)}</span>`};\n    case 'company':{\n      const s = slugify(v), col = MONO[(s.charCodeAt(0)||0)%MONO.length];\n      return {cls:'p-co', html:SHEEN+KILL+`<div class=\"logo\"></div><div class=\"co-n\">${esc(v)}</div>`,\n        after: el=>{\n          const box = el.querySelector('.logo');\n          brandMark(s).then(svg=>{\n            if(!box.isConnected) return;\n            if(!svg){ box.classList.add('mono'); box.style.background=col; box.textContent=initials(v); return; }\n            box.innerHTML = svg;\n            const mark = box.firstElementChild;\n            if(G && mark) G.fromTo(mark,{scale:.4,opacity:0},{scale:1,opacity:1,duration:.55,ease:'back.out(3)'});\n          });\n        }};\n    }\n    case 'place': return {cls:'p-loc', html:SHEEN+KILL+\n      `<span class=\"mark\">${ART.propPin}</span>\n       <div class=\"shot\"><div class=\"fb\">${ART.map}</div><div class=\"shim\"></div><img alt=\"\" draggable=\"false\" crossorigin=\"anonymous\"/></div>\n       <div class=\"cap\"><span>${esc(v)}</span></div>`,\n      after: el=>loadShot(el, v)};\n    case 'prop':\n      return {cls:'p-prop', html: it.data.k==='clip' ? ART.propClip : it.data.k==='pencil' ? ART.propPencil : ART.propPin};\n  }\n}\nfunction loadShot(el, city){\n  const shot = el.querySelector('.shot'), img = shot.querySelector('img'), shim = shot.querySelector('.shim');\n  if(G) G.fromTo(shim,{x:'-100%'},{x:'110%',duration:1.1,ease:'power2.inOut',repeat:-1,repeatDelay:.25});\n  const stop = ()=>{ if(G) G.killTweensOf(shim); shim.style.display='none'; };\n  cityPhoto(city).then(src=>{\n    if(!src || !el.isConnected) return stop();\n    img.onload = ()=>{ stop(); shot.querySelector('.fb').style.display='none';\n      if(G) G.to(img,{opacity:1,duration:.7,ease:'power2.out'}); else img.style.opacity=1; };\n    img.onerror = stop;\n    img.crossOrigin = 'anonymous';\n    img.src = src;\n  });\n}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 reconcile \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\n/* Never setAttribute('style') on a live piece \u2014 that wipes the transform GSAP\n   is holding it in place with. Set each custom property on its own instead. */\nfunction pieceBox(el){\n  return { x:(parseFloat(el.style.left)||0)+(G?(+G.getProperty(el,'x')||0):0),\n           y:(parseFloat(el.style.top) ||0)+(G?(+G.getProperty(el,'y')||0):0),\n           w:el.offsetWidth, h:el.offsetHeight };\n}\n/* drag a host and everything stuck to it comes along */\nfunction moveAttached(hostEl){\n  const id = hostEl.dataset.id;\n  const h = pieceBox(hostEl);\n  S.entries.forEach(en=>{\n    if(en.type!=='text' || en.attach !== id) return;\n    const el = pieceEl('e'+en.id); if(!el) return;\n    const bx = parseFloat(el.style.left)||0, by = parseFloat(el.style.top)||0;\n    const nx = h.x + (en.ax||0) - bx, ny = h.y + (en.ay||0) - by;\n    if(G){ G.killTweensOf(el); G.set(el,{x:nx, y:ny}); }\n    else el.style.transform = `translate(${nx}px,${ny}px)`;\n  });\n}\n/* dropped a label on top of something? then it belongs to that something */\nfunction attachIfDropped(en, el){\n  if(en.type !== 'text') return;\n  const me = pieceBox(el);\n  const cx = me.x + me.w/2, cy = me.y + me.h/2;\n  let host = null;\n  plane.querySelectorAll('.piece').forEach(o=>{\n    if(o === el) return;\n    const t = o.dataset.type;\n    if(t==='text' || t==='prop' || t==='name') return;\n    const b = pieceBox(o);\n    if(cx>=b.x && cx<=b.x+b.w && cy>=b.y && cy<=b.y+b.h) host = {el:o, b};\n  });\n  if(host){ en.attach = host.el.dataset.id; en.ax = me.x - host.b.x; en.ay = me.y - host.b.y; }\n  else { en.attach = null; en.ax = en.ay = 0; }\n}\n\n/* A shadow that html2canvas will actually draw: a plain div, same size and\n   corner radius as the piece, sitting just behind and a little down-right.\n   Text and cut-out PNGs are skipped \u2014 a box behind a glyph or a silhouette\n   would read as a mistake, not a shadow. */\nfunction buildExportShadows(){\n  const made = [];\n  plane.querySelectorAll('.piece').forEach(el=>{\n    const t = el.dataset.type;\n    if(t==='prop' || t==='name' || t==='text') return;\n    if(el.classList.contains('cut')) return;\n    const cs = getComputedStyle(el);\n    const d = document.createElement('div');\n    d.className = 'shadow-proxy';\n    d.style.left = el.style.left; d.style.top = el.style.top;\n    d.style.width = el.offsetWidth+'px'; d.style.height = el.offsetHeight+'px';\n    d.style.borderRadius = cs.borderRadius;\n    const x = (G?(+G.getProperty(el,'x')||0):0) + 5;\n    const y = (G?(+G.getProperty(el,'y')||0):0) + 7;\n    const rot = G?(+G.getProperty(el,'rotation')||0):0;\n    const sc  = G?(+G.getProperty(el,'scale')||1):1;\n    d.style.transform = `translate(${x}px,${y}px) rotate(${rot}deg) scale(${sc})`;\n    plane.appendChild(d);\n    made.push(d);\n  });\n  return made;\n}\n\nfunction setVars(el, str){\n  if(!str) return;\n  str.split(';').forEach(part=>{\n    const i = part.indexOf(':');\n    if(i > 0) el.style.setProperty(part.slice(0,i).trim(), part.slice(i+1).trim());\n  });\n}\nconst pieceEl = id => plane.querySelector(`.piece[data-id=\"${CSS.escape(id)}\"]`);\nfunction sync(fromEl){\n  const want = manifest(), wantIds = new Set(want.map(i=>i.id)), fresh = [];\n  plane.querySelectorAll('.piece').forEach(el=>{ if(!wantIds.has(el.dataset.id)) removeEl(el); });\n  want.forEach(it=>{\n    let el = pieceEl(it.id);\n    const m = markup(it);\n    if(!m) return;\n    if(!el){\n      el = document.createElement('div');\n      el.className = 'piece ' + m.cls;\n      el.dataset.id = it.id; el.dataset.type = it.type; el.dataset.rot = it.rot||0;\n      setVars(el, m.style);\n      el.innerHTML = m.html;\n      el.style.zIndex = it.type==='name' ? 40 : ++zTop;\n      plane.appendChild(el);\n      if(G) G.set(el,{x:0,y:0,rotation:it.rot||0,opacity:0});\n      wire(el,it);\n      if(m.after) m.after(el);\n      fresh.push([el,it]);\n    } else if(el.dataset.sig !== m.html){\n      el.className = 'piece ' + m.cls;\n      setVars(el, m.style);\n      el.innerHTML = m.html;\n      wire(el,it);\n      if(m.after) m.after(el);\n      if(G) G.fromTo(el,{scale:.94},{scale:1,duration:.45,ease:'back.out(2.4)'});\n    }\n    el.dataset.sig = m.html + '|' + (m.style||'');\n  });\n  layout(want, fresh.map(f=>f[0]));\n  fresh.forEach(([el,it])=> springIn(el,it,fromEl));\n  drawThread(); updateCount();\n}\nfunction removeEl(el){\n  const done = ()=>{ el.remove(); drawThread(); updateCount(); };\n  if(!G) return done();\n  G.killTweensOf(el);\n  G.to(el,{scale:.6,opacity:0,y:'+=16',duration:.38,ease:'power2.in',onComplete:done});\n}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 layout: name in the middle, spiral pack around it \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nfunction layout(want, skipAnim){\n  const W = plane.clientWidth, H = plane.clientHeight;\n  const cx = W/2, cy = H/2, PAD = 16;\n  const nodes = [];\n  want.forEach(it=>{\n    const el = pieceEl(it.id); if(!el) return;\n    const w = el.offsetWidth, h = el.offsetHeight;\n    const pinned = !!POS[it.id];\n    const p = POS[it.id] || {dx:0,dy:0};\n    let bx, by;\n    if(it.type==='prop'){ bx = W*it.full[0]; by = H*it.full[1]; }\n    else { bx = cx - w/2; by = cy - h/2; }\n    el.style.left = Math.round(bx)+'px'; el.style.top = Math.round(by)+'px';\n    nodes.push({el,it,sx:bx,sy:by,pinned,x:bx+p.dx,y:by+p.dy,w,h,\n                place: !pinned && it.type!=='prop' && it.type!=='name'\n                       && !(it.type==='text' && it.data && it.data.attach)});\n  });\n  const loose = S.spread === 'loose';\n  const GAP = loose ? PAD + 34 : PAD;\n  const occupied = nodes.filter(n=>!n.place && n.it.type!=='prop').map(n=>({x:n.x,y:n.y,w:n.w,h:n.h}));\n  const free = (x,y,w,h,gap)=>{\n    if(x < 8 || y < 8 || x+w > W-8 || y+h > H-8) return false;\n    for(const o of occupied)\n      if(x < o.x+o.w+gap && x+w+gap > o.x && y < o.y+o.h+gap && y+h+gap > o.y) return false;\n    return true;\n  };\n  const hub = nodes.find(n=>n.it.type==='name');\n  const r0 = (hub ? Math.hypot(hub.w, hub.h)/2 + 26 : 80) + (loose ? 60 : 0);\n  nodes.filter(n=>n.place)\n       .map((n,i)=>({n,i,area:n.w*n.h}))\n       .sort((a,b)=> b.area-a.area)\n       .forEach(({n,i})=>{\n    const a0 = i * 2.399963, rMax = Math.hypot(W,H);\n    let done = false;\n    for(const gap of [GAP, Math.round(GAP/2), 8, 2]){\n      for(let r = r0; r < rMax && !done; r += (loose ? 18 : 12)){\n        for(let k = 0; k < 48 && !done; k++){\n          const a = a0 + k*(Math.PI*2/48);\n          const x = cx + Math.cos(a)*r - n.w/2;\n          const y = cy + Math.sin(a)*r*(loose ? .92 : .84) - n.h/2;\n          if(free(x,y,n.w,n.h,gap)){ n.x = x; n.y = y; done = true; }\n        }\n      }\n      if(done) break;\n    }\n    if(!done){\n      n.x = clamp(n.x, 8, Math.max(8, W-n.w-8));\n      n.y = clamp(n.y, 8, Math.max(8, H-n.h-8));\n    }\n    occupied.push({x:n.x,y:n.y,w:n.w,h:n.h});\n  });\n  /* A text label dropped onto something belongs to it now: park it at its\n     stored offset from that piece rather than letting the packer move it. */\n  nodes.forEach(n=>{\n    const at = n.it.data && n.it.data.attach;\n    if(n.it.type !== 'text' || !at) return;\n    const host = nodes.find(o=>o.it.id === at);\n    if(!host){ n.it.data.attach = null; return; }\n    n.x = host.x + (n.it.data.ax || 0);\n    n.y = host.y + (n.it.data.ay || 0);\n  });\n\n  nodes.forEach(n=>{\n    const dx = n.x-n.sx, dy = n.y-n.sy;\n    if(!G){ n.el.style.transform = `translate(${dx}px,${dy}px)`; return; }\n    if(n.pinned || (skipAnim && skipAnim.includes(n.el))) G.set(n.el,{x:dx,y:dy});\n    else G.to(n.el,{x:dx,y:dy,duration:.6,ease:'power3.out',overwrite:'auto',onUpdate:drawThread});\n  });\n}\nfunction springIn(el, it, fromEl){\n  if(!G){ el.style.opacity=1; return; }\n  const rot = +el.dataset.rot||0;\n  const bx = +G.getProperty(el,'x')||0, by = +G.getProperty(el,'y')||0;\n  let from = {x:bx, y:by-60, scale:.6, rotation:rot-8};\n  if(fromEl){\n    const a = fromEl.getBoundingClientRect(), b = el.getBoundingClientRect();\n    from = {x: bx+(a.left+a.width/2)-(b.left+b.width/2),\n            y: by+(a.top+a.height/2)-(b.top+b.height/2), scale:.45, rotation:-4};\n  }\n  G.set(el,{transformPerspective:900, opacity:0, ...from});\n  const tl = G.timeline();\n  tl.to(el,{opacity:1,duration:.16,ease:'none'},0)\n    .to(el,{x:bx,y:by,scale:1,rotation:rot,duration:1.05,ease:'elastic.out(1, 0.55)',overwrite:'auto',onUpdate:drawThread,\n            onComplete:()=>{ if(it.type!=='name') idle(el,rot); }},0);\n  setTimeout(()=>{ if(tl.progress()<1) tl.progress(1); }, 3000);\n}\nfunction idle(el, rot){\n  if(!G || REDUCED) return;\n  if(el.dataset.type === 'text'){                 // a stuck label holds still\n    const id = el.dataset.id.slice(1);\n    const en = S.entries.find(e=>String(e.id)===id);\n    if(en && en.attach) return;\n  }\n  G.to(el,{y:'+=3', rotation:rot+rnd(-.4,.4), duration:rnd(3.6,5.6), ease:'sine.inOut', yoyo:true, repeat:-1, delay:rnd(0,1.4)});\n}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 drag \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nfunction wire(el, it){\n  const rebind = ()=>{ const k = el.querySelector('.kill');\n    if(k) k.addEventListener('click', ev=>{ ev.stopPropagation(); eraseFromBoard(it); }); };\n  if(el.dataset.wired){ rebind(); return; }\n  el.dataset.wired = '1'; rebind();\n  let live=false,sx=0,sy=0,ox=0,oy=0,vx=0,vy=0,lx=0,ly=0,lt=0;\n  el.addEventListener('pointerenter', ()=>{\n    if(SPOKE_TYPES.includes(it.type)) setFocusType(it.type);\n    Snd.hover();\n    if(!G) return;\n    const sh = el.querySelector('.sheen i');\n    if(sh) G.fromTo(sh,{x:'-190%'},{x:'470%',duration:.95,ease:'power2.inOut'});\n    if(!live) G.to(el,{scale:1.045,duration:.6,ease:'elastic.out(1,.75)',overwrite:'auto'});\n  });\n  el.addEventListener('pointerleave', ()=>{\n    if(!live) setFocusType(null);\n    if(G && !live) G.to(el,{scale:1,duration:.7,ease:'elastic.out(1,.6)',overwrite:'auto'});\n  });\n  el.addEventListener('pointerdown', e=>{\n    if(e.target.closest('.kill')) return;\n    live = true;\n    try{ el.setPointerCapture(e.pointerId); }catch(_){}\n    el.classList.add('dragging'); if(it.type!=='name') el.style.zIndex = ++zTop;\n    if(G) G.killTweensOf(el);\n    sx=e.clientX; sy=e.clientY;\n    ox = G ? (+G.getProperty(el,'x')||0) : 0;\n    oy = G ? (+G.getProperty(el,'y')||0) : 0;\n    lx=e.clientX; ly=e.clientY; lt=performance.now(); vx=vy=0;\n    if(G) G.to(el,{scale:1.07,duration:.28,ease:'power3.out',overwrite:'auto'});\n  });\n  el.addEventListener('pointermove', e=>{\n    if(!live) return;\n    const now=performance.now(), dt=Math.max(1,now-lt);\n    vx=(e.clientX-lx)/dt*16; vy=(e.clientY-ly)/dt*16; lx=e.clientX; ly=e.clientY; lt=now;\n    const bx = parseFloat(el.style.left)||0, by = parseFloat(el.style.top)||0;\n    const W = plane.clientWidth, H = plane.clientHeight;\n    const nx = clamp(bx+ox+(e.clientX-sx), 6, Math.max(6,W-el.offsetWidth-6)) - bx;\n    const ny = clamp(by+oy+(e.clientY-sy), 6, Math.max(6,H-el.offsetHeight-6)) - by;\n    if(G) G.to(el,{x:nx,y:ny,rotation:(+el.dataset.rot||0)+clamp(vx*.7,-9,9),duration:.18,ease:'power2.out',overwrite:'auto'});\n    else el.style.transform = `translate(${nx}px,${ny}px)`;\n    moveAttached(el);\n    drawThread();\n  });\n  const release = ()=>{\n    if(!live) return;\n    live=false; el.classList.remove('dragging');\n    Snd.drop();\n    const rot = +el.dataset.rot||0;\n    if(G){\n      const bx = parseFloat(el.style.left)||0, by = parseFloat(el.style.top)||0;\n      const W = plane.clientWidth, H = plane.clientHeight;\n      const nx = clamp(bx+(+G.getProperty(el,'x')||0)+vx*2.6, 6, Math.max(6,W-el.offsetWidth-6)) - bx;\n      const ny = clamp(by+(+G.getProperty(el,'y')||0)+vy*1.2, 6, Math.max(6,H-el.offsetHeight-6)) - by;\n      POS[el.dataset.id] = {dx:nx, dy:ny};\n      G.to(el,{x:nx,y:ny,duration:.7,ease:'power3.out',overwrite:'auto',\n               onUpdate:()=>{ moveAttached(el); drawThread(); },\n               onInterrupt:()=>moveAttached(el),\n               onComplete:()=>{ moveAttached(el); if(it.type!=='name') idle(el,rot); }});\n      G.to(el,{rotation:rot,scale:1,duration:1,ease:'elastic.out(1,.42)'});\n    }\n    if(it.type==='text' && it.data){ attachIfDropped(it.data, el); moveAttached(el); }\n    save();\n  };\n  el.addEventListener('pointerup', release);\n  el.addEventListener('pointercancel', release);\n}\n/* taking a piece off the mat removes its row too \u2014 one list, one truth */\nfunction eraseFromBoard(it){\n  if(it.type==='name'){ S.name=''; $('#f-name').value=''; nameTick(false); }\n  else if(it.data && it.data.id!=null){ S.entries = S.entries.filter(e=>e.id!==it.data.id); renderRows(); }\n  delete POS[it.id];\n  sync(); save();\n}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n   THE ROPES \u2014 real string, not a drawn curve.\n   Each strand is a little verlet chain pinned at the name and at\n   the piece. It hangs under gravity and swings when you drag\n   something. Hovering a piece lights up every rope of that kind\n   and sends a traveller running along it.\n   \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nfunction centreOf(el){\n  return { x:(parseFloat(el.style.left)||0)+(G?(+G.getProperty(el,'x')||0):0)+el.offsetWidth/2,\n           y:(parseFloat(el.style.top) ||0)+(G?(+G.getProperty(el,'y')||0):0)+el.offsetHeight/2 };\n}\n/* 'text' is deliberately absent: a loose label is free \u2014 you drop it beside\n   whatever it belongs to, and no thread ties it back to the name. */\nconst SPOKE_TYPES = ['role','company','place','tag','note','field','line','polaroid','image'];\nconst SEGMENTS = 14;\nlet ropes = [], ropeSig = '', focusType = null;\n\nfunction ropeLayer(){ return threadSvg; }\nfunction makeRope(el){\n  const svgns = 'http://www.w3.org/2000/svg';\n  const line = document.createElementNS(svgns,'path'); line.setAttribute('class','rope');\n  const spark = document.createElementNS(svgns,'path'); spark.setAttribute('class','spark');\n  const knot = document.createElementNS(svgns,'circle'); knot.setAttribute('class','knot'); knot.setAttribute('r','5');\n  ropeLayer().appendChild(line); ropeLayer().appendChild(spark); ropeLayer().appendChild(knot);\n  const a = centreOf(el);\n  const pts = [];\n  for(let i=0;i<=SEGMENTS;i++) pts.push({x:a.x, y:a.y, px:a.x, py:a.y});\n  return {el, type:el.dataset.type, line, spark, knot, pts, born:false};\n}\nfunction clearRopes(){\n  ropes.forEach(r=>{ r.line.remove(); r.spark.remove(); r.knot.remove(); });\n  ropes = [];\n}\n/* called whenever the set of pieces may have changed */\nfunction drawThread(){\n  const hub = pieceEl('name');\n  const spokes = [];\n  SPOKE_TYPES.forEach(t=> plane.querySelectorAll(`.piece[data-type=\"${t}\"]`).forEach(e=>spokes.push(e)));\n  if(!S.thread || !hub || !S.name.trim() || !spokes.length){\n    if(ropes.length) clearRopes();\n    ropeSig = ''; return;\n  }\n  const sig = spokes.map(e=>e.dataset.id).join('>');\n  if(sig !== ropeSig){\n    ropeSig = sig;\n    clearRopes();\n    spokes.forEach(el=> ropes.push(makeRope(el)));\n    stepRopes(28);                      // settle the new ropes before they are seen\n    ropes.forEach((r,i)=>{\n      if(!G || REDUCED) return;\n      const L = r.line.getTotalLength()||300;\n      G.fromTo(r.line,{strokeDasharray:L,strokeDashoffset:L},\n        {strokeDashoffset:0,duration:.75,delay:i*.05,ease:'power2.inOut',\n         onComplete:()=>{ r.line.style.strokeDasharray='none'; }});\n      G.from(r.knot,{scale:0,transformOrigin:'50% 50%',duration:.5,delay:i*.05,ease:'back.out(3)'});\n    });\n  }\n}\n/* one physics tick \u2014 runs off the GSAP ticker */\nfunction stepRopes(iterations){\n  if(!ropes.length) return;\n  const hub = pieceEl('name');\n  if(!hub){ clearRopes(); ropeSig=''; return; }\n  const h = centreOf(hub);\n  const passes = iterations || 1;\n  for(let pass=0; pass<passes; pass++){\n    ropes.forEach(r=>{\n      if(!r.el.isConnected) return;\n      const p = centreOf(r.el);\n      const pts = r.pts, last = pts.length-1;\n      // integrate the middle links\n      for(let i=1;i<last;i++){\n        const pt = pts[i];\n        const vx = (pt.x-pt.px)*0.94, vy = (pt.y-pt.py)*0.94;\n        pt.px = pt.x; pt.py = pt.y;\n        pt.x += vx; pt.y += vy + 0.9;                       // gravity\n      }\n      // pin both ends, then relax the chain toward its rest length\n      const rest = (Math.hypot(p.x-h.x, p.y-h.y) * 1.07) / last;\n      for(let k=0;k<5;k++){\n        pts[0].x = h.x; pts[0].y = h.y;\n        pts[last].x = p.x; pts[last].y = p.y;\n        for(let i=0;i<last;i++){\n          const a = pts[i], b = pts[i+1];\n          const dx = b.x-a.x, dy = b.y-a.y;\n          const d = Math.hypot(dx,dy) || 1;\n          const diff = (d-rest)/d*0.5;\n          const ox = dx*diff, oy = dy*diff;\n          if(i !== 0){ a.x += ox; a.y += oy; }\n          if(i+1 !== last){ b.x -= ox; b.y -= oy; }\n        }\n      }\n    });\n  }\n  // paint\n  ropes.forEach(r=>{\n    const pts = r.pts;\n    let d = `M${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;\n    for(let i=1;i<pts.length-1;i++){\n      const a = pts[i], b = pts[i+1];\n      d += ` Q${a.x.toFixed(1)} ${a.y.toFixed(1)} ${((a.x+b.x)/2).toFixed(1)} ${((a.y+b.y)/2).toFixed(1)}`;\n    }\n    const e = pts[pts.length-1];\n    d += ` L${e.x.toFixed(1)} ${e.y.toFixed(1)}`;\n    r.line.setAttribute('d', d);\n    r.knot.setAttribute('cx', e.x.toFixed(1)); r.knot.setAttribute('cy', e.y.toFixed(1));\n    const hot = focusType && r.type === focusType;\n    const cold = focusType && r.type !== focusType;\n    r.line.classList.toggle('hot', !!hot);\n    r.line.classList.toggle('cold', !!cold);\n    r.knot.classList.toggle('cold', !!cold);\n    if(hot){ r.spark.setAttribute('d', d); r.spark.classList.add('on'); }\n    else if(r.spark.classList.contains('on')){ r.spark.classList.remove('on'); r.spark.setAttribute('d',''); }\n  });\n}\nfunction setFocusType(t){\n  if(focusType === t) return;\n  focusType = t;\n  plane.querySelectorAll('.piece').forEach(el=>{\n    const dim = t && SPOKE_TYPES.includes(el.dataset.type) && el.dataset.type !== t;\n    el.classList.toggle('faded', !!dim);\n  });\n}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n   THE PANEL \u2014 one row per thing, each row is\n   [type \u25be] [what it says] [\u00d7]\n   \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nconst rowsBox = $('#rows'), basicBox = $('#basicRows');\nconst rowTimers = {};\nconst BASIC_TYPES = ['role','company','place','tag','note'];\n\n/* the five basics always exist, in order, so the panel tells you\n   exactly what there is to fill in and nothing more */\nfunction ensureBasics(){\n  BASIC_TYPES.forEach(t=>{\n    if(!S.entries.some(e=>e.basic && e.type===t)){\n      const en = newEntry(t); en.basic = true;\n      S.entries.push(en);\n    }\n  });\n}\nfunction basicEntries(){\n  const out = [];\n  BASIC_TYPES.forEach(t=> S.entries.filter(e=>e.basic && e.type===t).forEach(e=>out.push(e)));\n  return out;\n}\nfunction renderRows(){\n  ensureBasics();\n  basicBox.innerHTML = '';\n  basicEntries().forEach(en => basicBox.appendChild(buildRow(en)));\n\n  const more = S.entries.filter(e=>!e.basic);\n  rowsBox.innerHTML = '';\n  if(!more.length){\n    const e = document.createElement('div');\n    e.className = 'emptyrow';\n    e.textContent = 'Optional. Hit Add for a field, a line, a sticker \u2014 or more of anything above.';\n    rowsBox.appendChild(e);\n  }\n  more.forEach(en => rowsBox.appendChild(buildRow(en)));\n  $('#rowCount').textContent = more.length ? '\u00b7 ' + more.length : '';\n}\n\nfunction sizeControl(en){\n  const sizes = document.createElement('div');\n  sizes.className = 'sizes';\n  SIZES.forEach(([k,lab])=>{\n    const b = document.createElement('button');\n    b.type='button'; b.textContent = lab;\n    if((en.size||'m') === k) b.classList.add('on');\n    b.title = 'Size: ' + lab;\n    b.addEventListener('click', ()=>{ en.size = k; Snd.click(); renderRows(); sync(); save(); });\n    sizes.appendChild(b);\n  });\n  return sizes;\n}\n\nfunction buildRow(en){\n  const T = TYPES[en.type] || TYPES.tag;\n  const row = document.createElement('div');\n  row.className = 'row';\n  row.dataset.id = en.id;\n  row.style.setProperty('--rowc', T.accent);\n\n  if(en.basic){\n    const chip = document.createElement('span');\n    chip.className = 'fixed';\n    chip.textContent = T.icon + '  ' + T.label;\n    row.appendChild(chip);\n  } else {\n    const sel = document.createElement('div');\n    sel.className = 'sel';\n    const select = document.createElement('select');\n    select.setAttribute('aria-label','Type');\n    TYPE_ORDER.forEach(k=>{\n      const o = document.createElement('option');\n      o.value = k; o.textContent = TYPES[k].icon + '  ' + TYPES[k].label;\n      if(k===en.type) o.selected = true;\n      select.appendChild(o);\n    });\n    select.addEventListener('change', ()=>{\n      Snd.click();\n      en.type = select.value;\n      if(en.type==='sticker' && !STICKERS.includes(en.value)) en.value = '\u2605';\n      if(en.type!=='sticker' && STICKERS.includes(en.value)) en.value = '';\n      if(!COLOURABLE.includes(en.type)) en.color = null;\n      renderRows(); sync(); save();\n      const fresh = rowsBox.querySelector(`.row[data-id=\"${en.id}\"] input, .row[data-id=\"${en.id}\"] button`);\n      if(fresh && fresh.focus) fresh.focus();\n    });\n    sel.appendChild(select);\n    row.appendChild(sel);\n  }\n\n  if(en.type === 'sticker'){\n    const g = document.createElement('div');\n    g.className = 'glyphs';\n    STICKERS.forEach(ch=>{\n      const b = document.createElement('button');\n      b.type='button'; b.textContent = ch;\n      if(en.value === ch) b.classList.add('on');\n      b.addEventListener('click', ()=>{ en.value = ch; renderRows(); sync(); save(); });\n      g.appendChild(b);\n    });\n    row.appendChild(g);\n  } else if(PICTURE.includes(en.type)){\n    const pick = document.createElement('button');\n    pick.type='button'; pick.className='pickimg';\n    pick.innerHTML = en.src\n      ? `<img alt=\"\" src=\"${en.src}\"/>`\n      : `<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n           <rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"3\"/><circle cx=\"8.5\" cy=\"9.5\" r=\"1.6\"/><path d=\"m4 17 5-5 4.5 4.5L16 14l4 4\"/></svg>`;\n    pick.title = en.src ? 'Change the picture' : 'Pick a picture or a gif';\n    const file = document.createElement('input');\n    file.type='file'; file.accept='image/*,image/gif'; file.style.display='none';\n    pick.addEventListener('click', ()=>file.click());\n    file.addEventListener('change', async ()=>{\n      const f = file.files && file.files[0];\n      if(!f) return;\n      pick.classList.add('busy');\n      try{\n        const got = await readImage(f);\n        en.src = got.src; en.kind = got.kind;\n        pick.classList.remove('busy');\n        Snd.add();\n        renderRows(); sync(); save();\n      }catch(err){\n        pick.classList.remove('busy');\n        pick.classList.add('bad');\n        pick.title = err.message || 'Could not use that file.';\n        setTimeout(()=>{ pick.classList.remove('bad'); }, 2200);\n      }\n    });\n    row.appendChild(pick); row.appendChild(file);\n\n    // a caption only belongs on a polaroid; an image is just the image\n    if(en.type === 'polaroid'){\n      const cap = document.createElement('input');\n      cap.value = en.value||''; cap.placeholder = T.ph; cap.maxLength = 44;\n      cap.addEventListener('input', ()=>{ en.value = cap.value; queueSync(en.id); });\n      row.appendChild(cap);\n    } else {\n      const sp = document.createElement('span'); sp.style.flex = '1'; row.appendChild(sp);\n    }\n\n    row.appendChild(sizeControl(en));\n\n  } else {\n    if(en.type === 'field'){\n      const l = document.createElement('input');\n      l.className='lbl'; l.value = en.label||''; l.placeholder = T.ph2 || 'Label'; l.maxLength = 18;\n      l.addEventListener('input', ()=>{ en.label = l.value; queueSync(en.id); });\n      row.appendChild(l);\n      const d = document.createElement('span'); d.className='div'; row.appendChild(d);\n    }\n    const inp = document.createElement('input');\n    inp.value = en.value||''; inp.placeholder = T.ph; inp.maxLength = en.type==='line' ? 90 : en.type==='note' ? 90 : 30;\n    if(en.type==='company') inp.setAttribute('list','colist');\n    inp.addEventListener('input', ()=>{ en.value = inp.value; queueSync(en.id); });\n    inp.addEventListener('keydown', e=>{\n      if(e.key!=='Enter') return;\n      e.preventDefault();\n      const plus = row.querySelector('.more-btn');\n      if(en.basic && plus) plus.click();          // Enter on a basic adds another of the same kind\n      else addRow(en.type);\n    });\n    row.appendChild(inp);\n    if(SIZEABLE.includes(en.type)) row.appendChild(sizeControl(en));\n  }\n\n  // only a piece that is itself a block of colour gets a colour circle\n  if(COLOURABLE.includes(en.type)){\n    const idx = S.entries.filter(e=>e.type==='tag').indexOf(en);\n    const shown = en.color || defaultTone(en, idx < 0 ? 0 : idx);\n    const wrap = document.createElement('div');\n    wrap.className = 'dot-wrap';\n    const dot = document.createElement('button');\n    dot.type='button'; dot.className='dot'; dot.title='Colour';\n    dot.style.background = shown;\n    if(!en.color) dot.classList.add('auto');\n    const pop = document.createElement('div');\n    pop.className = 'dotpop';\n    SWATCHES.forEach(c=>{\n      const b = document.createElement('button');\n      b.type='button'; b.className='sw'; b.style.background=c;\n      if((en.color||'').toLowerCase()===c) b.classList.add('on');\n      b.addEventListener('click', ev=>{\n        ev.stopPropagation();\n        en.color = c; Snd.click();\n        renderRows(); sync(); save();\n      });\n      pop.appendChild(b);\n    });\n    // anything else you like, straight off the wheel\n    const wheel = document.createElement('label');\n    wheel.className = 'wheel'; wheel.title = 'Pick any colour';\n    const ci = document.createElement('input');\n    ci.type='color'; ci.value = /^#[0-9a-f]{6}$/i.test(shown) ? shown : '#c9f24f';\n    ci.addEventListener('input', ()=>{ en.color = ci.value; dot.style.background = ci.value; queueSync(en.id); });\n    ci.addEventListener('change', ()=>{ en.color = ci.value; renderRows(); sync(); save(); });\n    ci.addEventListener('click', ev=>ev.stopPropagation());\n    wheel.appendChild(ci);\n    pop.appendChild(wheel);\n    // back to whatever it would have been\n    const auto = document.createElement('button');\n    auto.type='button'; auto.className='sw autobtn'; auto.title='Back to default';\n    auto.textContent='\u21ba';\n    auto.addEventListener('click', ev=>{ ev.stopPropagation(); en.color=null; Snd.click(); renderRows(); sync(); save(); });\n    pop.appendChild(auto);\n\n    dot.addEventListener('click', ev=>{\n      ev.stopPropagation();\n      const open = wrap.classList.contains('open');\n      document.querySelectorAll('.dot-wrap.open').forEach(w=>w.classList.remove('open'));\n      wrap.classList.toggle('open', !open);\n    });\n    wrap.appendChild(dot); wrap.appendChild(pop);\n    row.appendChild(wrap);\n  }\n\n  // a basic row can spawn another of its own kind \u2014 a second company, a third tag\n  if(en.basic){\n    const plus = document.createElement('button');\n    plus.className='more-btn'; plus.type='button'; plus.textContent='+';\n    plus.title = 'Add another ' + T.label.toLowerCase();\n    plus.addEventListener('click', ()=>{\n      const twin = newEntry(en.type); twin.basic = true;\n      const at = S.entries.lastIndexOf(S.entries.filter(e=>e.basic && e.type===en.type).slice(-1)[0]);\n      S.entries.splice(at+1, 0, twin);\n      Snd.add();\n      renderRows(); sync(); save();\n      const row2 = basicBox.querySelector(`.row[data-id=\"${twin.id}\"]`);\n      const f = row2 && row2.querySelector('input'); if(f) f.focus();\n      if(G && row2) G.from(row2,{y:-8,opacity:0,duration:.45,ease:'back.out(2)'});\n    });\n    row.appendChild(plus);\n  }\n\n  const x = document.createElement('button');\n  x.className='rx'; x.type='button'; x.textContent='\u00d7';\n  const onlyOfKind = en.basic && S.entries.filter(e=>e.basic && e.type===en.type).length === 1;\n  x.title = onlyOfKind ? 'Clear' : 'Remove';\n  x.addEventListener('click', ()=>{\n    Snd.remove();\n    if(onlyOfKind){ en.value=''; en.label=''; en.src=null; en.kind=null; }     // the five basics stay put, they just empty\n    else { S.entries = S.entries.filter(e=>e.id!==en.id); }\n    delete POS['e'+en.id];\n    renderRows(); sync(); save();\n  });\n  row.appendChild(x);\n  return row;\n}\n\nfunction queueSync(id){\n  clearTimeout(rowTimers[id]);\n  rowTimers[id] = setTimeout(()=>{ sync(); save(); }, 300);\n}\nfunction addRow(type){\n  const en = newEntry(type || 'field');\n  if(en.type==='sticker') en.value = '\u2605';\n  S.entries.push(en);\n  Snd.add();\n  renderRows(); sync(); save();\n  const row = rowsBox.querySelector(`.row[data-id=\"${en.id}\"]`);\n  const f = row && row.querySelector('input');\n  if(f) f.focus();\n  if(G && row) G.from(row,{y:-8,opacity:0,duration:.45,ease:'back.out(2)'});\n}\n$('#addRow').addEventListener('click', ()=>addRow());\ndocument.addEventListener('click', ()=>{\n  document.querySelectorAll('.dot-wrap.open').forEach(w=>w.classList.remove('open'));\n});\n\n/* name */\nconst nameInput = $('#f-name');\nlet nameTimer;\nfunction nameTick(on){\n  const t = $('#nameTick');\n  if(G) G.to(t,{opacity:on?1:0,scale:on?1:.4,duration:.35,ease:'back.out(3)'});\n  else t.style.opacity = on?1:0;\n}\nnameInput.addEventListener('input', ()=>{\n  S.name = nameInput.value;\n  nameTick(!!nameInput.value.trim());\n  clearTimeout(nameTimer);\n  nameTimer = setTimeout(()=>{ sync(nameInput); save(); }, 220);\n});\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 dice \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nconst shuffle = a => { const c=[...a]; for(let i=c.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [c[i],c[j]]=[c[j],c[i]]; } return c; };\n$('#dice').addEventListener('click', ()=>{\n  Snd.roll();\n  S.name = pick(POOL.names);\n  const E = [];\n  E.push(newEntry('role', pick(POOL.roles)));\n  shuffle(POOL.companies).slice(0, Math.floor(rnd(2,5))).forEach(c=>E.push(newEntry('company', c)));\n  shuffle(POOL.places).slice(0, Math.random()<.55?2:1).forEach(p=>{\n    E.push(newEntry('place', p));\n    const mark = LANDMARKS[p];                       // and the landmark that goes with it\n    if(mark){ const t = newEntry('text', mark); t.size='s'; E.push(t); }\n  });\n  shuffle(POOL.tags).slice(0, Math.floor(rnd(3,6))).forEach(t=>E.push(newEntry('tag', t)));\n  E.push(newEntry('line', pick(POOL.lines)));\n  shuffle(POOL.notes).slice(0, Math.floor(rnd(1,3))).forEach(n=>E.push(newEntry('note', n)));\n  shuffle(POOL.fields).slice(0, Math.floor(rnd(1,3))).forEach(f=>E.push(newEntry('field', f[1], f[0])));\n  shuffle(POOL.shouts).slice(0, Math.floor(rnd(1,3))).forEach(t=>{\n    const e = newEntry('text', t); e.size = pick(['s','m']); E.push(e);\n  });\n  shuffle(STICKERS).slice(0, Math.floor(rnd(1,3))).forEach(g=>E.push(newEntry('sticker', g)));\n  E.forEach(en=>{ if(BASIC_TYPES.includes(en.type)) en.basic = true; });   // the five live up top\n  S.entries = E;\n  POS = {};\n  nameInput.value = S.name; nameTick(true);\n  renderRows();\n  plane.querySelectorAll('.piece:not(.p-prop)').forEach(e=>e.remove());\n  ropeSig='';\n  sync($('#dice')); save();\n  if(G) G.fromTo('#dieIcon',{rotation:0},{rotation:360,duration:.7,ease:'back.out(2)',transformOrigin:'50% 50%'});\n});\n$('#wipe').addEventListener('click', ()=>{\n  Snd.remove();\n  S.name=''; S.entries=[]; POS={};\n  nameInput.value=''; nameTick(false);\n  renderRows();\n  const els = [...plane.querySelectorAll('.piece:not(.p-prop)')];\n  const finish = ()=>{ els.forEach(e=>e.remove()); ropeSig=''; sync(); };\n  if(!G){ finish(); return save(); }\n  G.to(els,{y:'+=60',opacity:0,scale:.85,duration:.42,ease:'power2.in',stagger:{each:.05,from:'end'},onComplete:finish});\n  save();\n});\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 board controls \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\n$('#tSound').addEventListener('click', e=>{\n  S.sound = Snd.toggle();\n  e.currentTarget.classList.toggle('on', S.sound);\n  e.currentTarget.dataset.tip = S.sound ? 'Sound' : 'Muted';\n  e.currentTarget.querySelectorAll('.w1,.w2').forEach(w=> w.style.opacity = S.sound ? 1 : 0);\n  save();\n});\n$('#tMat').addEventListener('click', e=>{\n  Snd.sweep();\n  S.mat = randomMat(); drawMat(); save();\n  const t = MAT_THEMES.find(x=>x.id===S.mat.theme);\n  e.currentTarget.dataset.tip = t ? t.name+' mat' : 'New mat';\n  if(G) G.fromTo('#matSvg',{opacity:.25},{opacity:1,duration:.55,ease:'power2.out'});\n});\nfunction setPanel(open){\n  S.panel = open;\n  document.body.classList.toggle('no-panel', !open);\n  save();\n  const settle = ()=>{ drawMat(); layout(manifest()); drawThread(); };\n  const root = document.documentElement;\n  const to = open ? 420 : 0;\n  const from = parseFloat(getComputedStyle(root).getPropertyValue('--panelw')) || (open ? 0 : 420);\n  if(!G){ root.style.setProperty('--panelw', to+'px'); settle(); return; }\n  // tween a plain number and write the variable ourselves \u2014 asking GSAP to\n  // animate the custom property directly does nothing here\n  const box = {v: from};\n  G.killTweensOf(box);\n  G.to(box, {v: to, duration:.42, ease:'power3.inOut',\n    onUpdate:()=>root.style.setProperty('--panelw', box.v.toFixed(1)+'px'),\n    onComplete:()=>{ root.style.setProperty('--panelw', to+'px'); settle(); }});\n  G.to($('.dock'), {opacity: open ? 1 : 0, duration:.28, ease:'power2.out'});\n}\n$('#tPanel').addEventListener('click', ()=>{ Snd.click(); setPanel(false); });\n$('#tPanelShow').addEventListener('click', ()=>{ Snd.click(); setPanel(true); });\n$('#tThread').addEventListener('click', e=>{ Snd.click(); S.thread=!S.thread; e.currentTarget.classList.toggle('on',S.thread); drawThread(); save(); });\n$('#tProps').addEventListener('click',  e=>{ Snd.click(); S.props=!S.props;  e.currentTarget.classList.toggle('on',S.props);  sync(); save(); });\n$('#tHide').addEventListener('click', e=>{\n  Snd.click();\n  S.chrome = !S.chrome;\n  $('#pillrow').classList.toggle('hidden', !S.chrome);\n  e.currentTarget.classList.toggle('off', !S.chrome);\n  e.currentTarget.dataset.tip = S.chrome ? 'Hide' : 'Show';\n  save();\n});\n$('#tSpread').addEventListener('click', e=>{\n  Snd.sweep();\n  S.spread = S.spread==='tidy' ? 'loose' : 'tidy';\n  e.currentTarget.dataset.tip = S.spread==='tidy' ? 'Tidy' : 'Spread out';\n  e.currentTarget.classList.toggle('on', S.spread==='loose');\n  POS = {}; layout(manifest()); save();\n});\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 download \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nconst SAVE_ICONS = {\n  idle:`<path d=\"M12 3.5v11\"/><path d=\"m7.5 10.5 4.5 4.5 4.5-4.5\"/><path d=\"M4.5 19.5h15\"/>`,\n  busy:`<path d=\"M12 4a8 8 0 1 1-8 8\" opacity=\".9\"/>`,\n  done:`<path d=\"M4.5 12.5 10 18 19.5 6.5\"/>`,\n  fail:`<path d=\"M6 6l12 12M18 6 6 18\"/>`\n};\nconst setSaveIcon = (btn,k)=>{ const s=btn.querySelector('svg'); if(s) s.innerHTML=SAVE_ICONS[k]; btn.classList.toggle('spin',k==='busy'); };\n$('#tSave').addEventListener('click', async e=>{\n  const btn = e.currentTarget;\n  if(btn.dataset.busy) return;\n  btn.dataset.busy='1'; setSaveIcon(btn,'busy');\n  const wasChrome = S.chrome;\n  let reshaped = false, savedPOS = null;\n  const unshape = ()=>{\n    if(!reshaped) return;\n    reshaped = false;\n    document.body.classList.remove('shooting');\n    if(savedPOS) POS = savedPOS;\n    setTimeout(()=>{ drawMat(); layout(manifest()); }, 60);\n  };\n  try{\n    if(!window.html2canvas) await new Promise((res,rej)=>{\n      const sc = document.createElement('script');\n      sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';\n      sc.onload = res; sc.onerror = rej; document.head.appendChild(sc);\n    });\n    $('#pillrow').classList.add('hidden');\n    document.body.classList.add('exporting');\n    if(document.fonts && document.fonts.ready) await document.fonts.ready;\n    await new Promise(r=>setTimeout(r,240));\n\n    const board = $('#board'), mat = $('.mat');\n    // a portrait board would export as a tall mat floating in dark bands \u2014\n    // relay it into a wide frame first so the mat itself is landscape\n    // always shoot from the same 5:4 frame, so the picture never depends on\n    // how the window happened to be sized\n    reshaped = true;\n    if(reshaped){\n      savedPOS = POS; POS = {};\n      document.body.classList.add('shooting');\n      void board.offsetHeight;                       // force the new frame to reflow\n      // rAF never fires on a hidden tab, so always give it a timer to fall back on\n      await new Promise(r=>{\n        let done = false;\n        const fin = ()=>{ if(!done){ done = true; r(); } };\n        requestAnimationFrame(()=>requestAnimationFrame(fin));\n        setTimeout(fin, 250);\n      });\n      drawMat();\n      layout(manifest());                            // pack against the real wide plane\n      await new Promise(r=>setTimeout(r,1000));\n      layout(manifest());                            // and settle once more, sizes now final\n      await new Promise(r=>setTimeout(r,700));\n      stepRopes(30);\n    }\n    const br = board.getBoundingClientRect(), mr = mat.getBoundingClientRect();\n    const s = Math.min(2, Math.max(1.5, window.devicePixelRatio||1));\n    const shadows = buildExportShadows();\n    const shot = await html2canvas(board, {\n      useCORS:true, allowTaint:false, backgroundColor:null, scale:s,\n      ignoreElements: el => el.classList && (el.classList.contains('controls') || el.classList.contains('kill'))\n    });\n    shadows.forEach(d=>d.remove());\n\n    /* Crop to what is actually on the mat. Exporting the whole frame left\n       wide bands of empty green down the sides. */\n    let bx0=Infinity, by0=Infinity, bx1=-Infinity, by1=-Infinity;\n    // the 'vision board' pill lives in the top-left corner of the mat; counting\n    // it would peg the crop to that corner forever, so it is left out here and\n    // painted back on afterwards\n    const marks = [...plane.querySelectorAll('.piece')];\n    marks.forEach(el=>{\n      const r = el.getBoundingClientRect();\n      if(!r.width || !r.height) return;\n      bx0 = Math.min(bx0, r.left  - mr.left);  by0 = Math.min(by0, r.top    - mr.top);\n      bx1 = Math.max(bx1, r.right - mr.left);  by1 = Math.max(by1, r.bottom - mr.top);\n    });\n    const BREATH = 100;          // even margin all the way round the content\n    if(!isFinite(bx0)){ bx0 = 0; by0 = 0; bx1 = mr.width; by1 = mr.height; }\n    bx0 = Math.max(0, bx0 - BREATH);          by0 = Math.max(0, by0 - BREATH);\n    bx1 = Math.min(mr.width,  bx1 + BREATH);  by1 = Math.min(mr.height, by1 + BREATH);\n    let cw = bx1 - bx0, ch = by1 - by0;\n    // still a landscape picture, even if the board happens to sit tall\n    if(cw/ch < 1.2){\n      const grow = (ch*1.2 - cw)/2;\n      bx0 = Math.max(0, bx0 - grow);\n      bx1 = Math.min(mr.width, bx1 + grow);\n      cw = bx1 - bx0;\n    }\n    const sx=(mr.left-br.left + bx0)*s, sy=(mr.top-br.top + by0)*s, sw=cw*s, sh=ch*s;\n    const padX=Math.round(26*s), padY=Math.round(46*s), foot=Math.round(88*s), radius=Math.round(18*s);\n    // the canvas hugs the mat \u2014 no stretched-out side bands\n    const outW = Math.round(sw+padX*2), outH = Math.round(sh+padY+foot);\n    const out = document.createElement('canvas');\n    out.width=outW; out.height=outH;\n    const g2 = out.getContext('2d');\n    g2.fillStyle='#12211a'; g2.fillRect(0,0,outW,outH);\n    const dx=Math.round((outW-sw)/2), dy=padY;\n    g2.save(); g2.beginPath();\n    if(g2.roundRect) g2.roundRect(dx,dy,sw,sh,radius);\n    else { g2.moveTo(dx+radius,dy); g2.arcTo(dx+sw,dy,dx+sw,dy+sh,radius); g2.arcTo(dx+sw,dy+sh,dx,dy+sh,radius);\n           g2.arcTo(dx,dy+sh,dx,dy,radius); g2.arcTo(dx,dy,dx+sw,dy,radius); g2.closePath(); }\n    g2.clip(); g2.drawImage(shot,sx,sy,sw,sh,dx,dy,sw,sh); g2.restore();\n\n    // the label, drawn at the corner of whatever we ended up cropping to\n    (()=>{\n      const pad=Math.round(15*s), fsz=Math.round(17*s);\n      g2.font=`600 ${fsz}px Fredoka, Nunito, sans-serif`;\n      const label='vision board', tw2=g2.measureText(label).width;\n      const bw=tw2+pad*2, bh=Math.round(38*s), r2=Math.round(13*s);\n      const lx=dx+Math.round(26*s), ly=dy+Math.round(26*s);\n      g2.beginPath();\n      if(g2.roundRect) g2.roundRect(lx,ly,bw,bh,r2);\n      else { g2.moveTo(lx+r2,ly); g2.arcTo(lx+bw,ly,lx+bw,ly+bh,r2); g2.arcTo(lx+bw,ly+bh,lx,ly+bh,r2);\n             g2.arcTo(lx,ly+bh,lx,ly,r2); g2.arcTo(lx,ly,lx+bw,ly,r2); g2.closePath(); }\n      g2.fillStyle='#fff'; g2.fill();\n      g2.fillStyle='#16281d'; g2.textAlign='left'; g2.textBaseline='middle';\n      g2.fillText(label, lx+pad, ly+bh/2+Math.round(1*s));\n    })();\n\n    // made with love, and where to find him underneath\n    g2.font = `500 ${Math.round(19*s)}px Fredoka, Nunito, sans-serif`;\n    g2.textBaseline='middle'; g2.textAlign='left';\n    const p1='made with ', p2='\\u2665', p3=' by Sanjay Chauhan';\n    const w1=g2.measureText(p1).width, w2=g2.measureText(p2).width, w3=g2.measureText(p3).width;\n    let tx=(outW-(w1+w2+w3))/2;\n    const ty=dy + sh + foot/2 - Math.round(13*s);\n    g2.fillStyle='rgba(255,255,255,.92)'; g2.fillText(p1,tx,ty); tx+=w1;\n    g2.fillStyle='#e0473a';               g2.fillText(p2,tx,ty); tx+=w2;\n    g2.fillStyle='rgba(255,255,255,.92)'; g2.fillText(p3,tx,ty);\n    g2.font = `400 ${Math.round(14*s)}px Fredoka, Nunito, sans-serif`;\n    g2.textAlign       en.style.setProperty('--r1','0%'); en.style.setProperty('--r2','0%');
      safeTL(gsap.timeline()
        .to(en,{opacity:.5,duration:.34,ease:'power2.out'},0)
        .to(o,{p:1,duration:1.5,ease:'power2.out',onUpdate:paint},0)
        .to(en,{opacity:0,duration:.5,ease:'power2.in'},1.05),2600);
      setTimeout(()=>{ if(en.isConnected) en.remove(); },2300);
    }, skip?120:300);
    setTimeout(flip, skip?420:1180);
    setTimeout(()=>{ gsap.to(d,{opacity:0,duration:.6}); }, skip?520:1320);
    setTimeout(()=>{ d.style.display='none'; introStage(); }, skip?900:1780);

/* Phase 3 is the hinge. Before it they were talking, after it Zero is showing.
   The handshake in between is Zero proving it listened, in their own terms. */
const CO_PHRASE={ 'Startup':'somewhere small and fast','Scale-up':'somewhere growing fast',
  'Big tech':'somewhere big','Agency':'in an agency' };
const TIME_PHRASE={ 'Now':'And you want it now.','In 3 months':'Inside three months.',
  'This year':'This year.','No rush':'No rush on the timing.' };
const upper=x=>x?x.charAt(0).toUpperCase()+x.slice(1):x;
function summaryBeats(){
  const out=[];
  if(P.role) out.push('You, aiming at '+P.role+'.');
  const place=[];
  if(P.company) place.push(CO_PHRASE[P.company]||low(P.company));
  if(P.industry) place.push('in '+low(SHORT[P.industry]||P.industry));
  if(place.length) out.push(upper(place.join(', '))+'.');
  const where=cityList(P.citynext)[0]||P.location;
  const tail=[];
  if(P.problems) tail.push('chasing '+low(P.problems));
  if(where) tail.push('from '+where);
  if(tail.length) out.push(upper(tail.join(', '))+'.');
  if(P.timeline&&TIME_PHRASE[P.timeline]) out.push(TIME_PHRASE[P.timeline]);
  return out.filter(x=>x&&x.length<=58);
}
async function synthStage(){
  setPhase(1);

  await wait(520);

  setTimeout(()=>{ if(veil.isConnected) veil.remove(); },1000);
  await swapPanel('Your vision board',s2=>{ boardLive=true; renderBoard(); },false);
  setTimeout(()=>sheen(document.querySelector('.shell'),1.45),1300);

  await reflect(P.name?"Okay, "+P.name+". Here's what I've got.":"Here's what I've got.",1800);
  const beats=summaryBeats();
  for(let i=0;i<beats.length;i++) await reflect(beats[i],1900);

/* ============================ 16 · the transformation ============================ */
/* green, blue and yellow, thrown from wherever the good news landed */
function confetti(x,y,n){
  n=n||84; sfx('press');
  const layer=mk('div','conf'); document.body.appendChild(layer);
  const CC=['#4ADE80','#5D87FF','#F5DE6B','#A8E6CF','#0084CE','#C8F169','#FACC15'];
  for(let i=0;i<n;i++){
    const p=mk('i');
    const w=4+Math.random()*7, h=Math.random()<.25?w:9+Math.random()*13;
    p.style.cssText='left:'+(x-w/2)+'px;top:'+(y-h/2)+'px;width:'+w+'px;height:'+h+'px;'+
      'background:'+CC[i%CC.length]+';border-radius:'+(Math.random()<.22?'50%':'2px')+';';
    layer.appendChild(p);
    const ang=-Math.PI/2+(Math.random()-.5)*2.3, sp=200+Math.random()*380;
    const spin=(Math.random()<.5?-1:1)*(380+Math.random()*620);
    gsap.to(p,{x:Math.cos(ang)*sp, y:Math.sin(ang)*sp, rotation:spin,
      duration:.7+Math.random()*.45, ease:'power2.out'});
    gsap.to(p,{y:'+='+(innerHeight*.8+Math.random()*260), rotation:'+='+(spin*.6),
      duration:1.9+Math.random()*1.3, ease:'power1.in', delay:.5+Math.random()*.25});
    gsap.to(p,{opacity:0, duration:.7, delay:1.8+Math.random()*.9});
  }
  /* cleanup rides the last tween, with a wall clock backstop behind it */
  let dead=false;
  const kill=()=>{ if(dead) return; dead=true; if(layer.isConnected) layer.remove(); };
  gsap.to(layer,{opacity:1,duration:3.4,onComplete:kill});
  setTimeout(kill,9000);
}
/* a sheen passes over whatever has just become true */
function sheen(el,dur){
  if(!el) return;
  if(getComputedStyle(el).position==='static') el.style.position='relative';
  const s2=mk('div','sheen'), i2=mk('i'); s2.appendChild(i2); el.appendChild(s2);
  const kill=()=>{ if(s2.isConnected) s2.remove(); };
  safeTL(gsap.timeline({onComplete:kill}).fromTo(i2,{left:'-60%'},
    {left:'125%',duration:dur||1.2,ease:'power2.inOut'}),(dur||1.2)*1000+700);
  setTimeout(kill,(dur||1.2)*1000+900);
}
/* The approval is the trigger. The board goes soft, the light gathers to the
   middle of the screen, a ripple opens out of it, and what comes back is the
   set of companies that hire this exact person. */
function revealSequence(onLand,onDone){
  /* the middle of the board, not the middle of the browser */
  const pr=document.querySelector('.right').getBoundingClientRect();
  const cx=pr.width?pr.left+pr.width/2:innerWidth/2;
  const cy=pr.height?pr.top+pr.height/2:innerHeight/2;
  const S=Math.min(pr.width||innerWidth,innerHeight)*0.62;
  const CLR=['#A8E6CF','#4ADE80','#C8F169','#F5DE6B'];
  const aur=$('aur'); aur.innerHTML='';
  const blobs=CLR.map(c2=>{ const b=mk('b');
    b.style.background='radial-gradient(circle at 50% 50%, '+c2+' 0%, '+c2+'00 70%)';
    aur.appendChild(b); return b; });
  const vb=$('vb');
  const R0=vb?vb.getBoundingClientRect():{left:cx-220,top:cy-170,width:440,height:340};
  const bx=R0.left+R0.width/2, by=R0.top+R0.height/2;
  blobs.forEach((b,i)=>{ const a2=(i/blobs.length)*Math.PI*2-Math.PI/4;
    gsap.set(b,{x:bx-S/2+Math.cos(a2)*R0.width*.52, y:by-S/2+Math.sin(a2)*R0.height*.5,
      scale:.45, opacity:0}); });

  const core=mk('div','core'); document.body.appendChild(core);
  gsap.set(core,{scale:.2,left:cx-85,top:cy-85,margin:0});
  const rip=$('rip'); rip.innerHTML=''; rip.style.display='block';
  const rings=[0,1,2].map(()=>{ const s3=mk('s'); rip.appendChild(s3); return s3; });
  gsap.set(rings,{left:cx-10,top:cy-10,margin:0});

  /* the board's own chips travel with the light */
  const layer=mk('div','zook'); document.body.appendChild(layer);
  const clones=[];
  [...document.querySelectorAll('#vb .vbc, #vb .vbl')].forEach(el=>{
    const r=el.getBoundingClientRect(); if(!r.width) return;
    const c2=el.cloneNode(true); c2.className=el.className+' zc';
    c2.style.cssText+=';position:fixed;left:'+r.left+'px;top:'+r.top+'px;font-size:'+getComputedStyle(el).fontSize+';';
    layer.appendChild(c2); clones.push({c:c2,r:r});
  });
  const names=COS();
  const tiles=names.map((n,i)=>{ const t2=mk('div','ztile',LOGO[n]||'');
    t2.style.left=(cx-37)+'px'; t2.style.top=(cy-37)+'px'; layer.appendChild(t2); return t2; });
  gsap.set(tiles,{scale:0,opacity:0});

  const tl=gsap.timeline();
  /* 1 · the light blooms and the board goes soft */
  tl.set(aur,{opacity:1})
    .to(blobs,{scale:1,opacity:.92,duration:.85,stagger:.08,ease:'power2.out'},0)
    .to(vb,{filter:'blur(15px)',scale:1.06,opacity:.5,duration:1.0,ease:EIO},.18);
  /* 2 · zook, zook, zook: every chip it wrote is pulled into the middle */
  clones.forEach((o,i)=>{
    tl.to(o.c,{x:cx-o.r.left-o.r.width/2, y:cy-o.r.top-o.r.height/2, scale:.5,
      rotate:(i%2?8:-8), filter:'blur(3px)', duration:.5, ease:'power4.in'}, .3+i*.06);
    tl.call(()=>sfx('tick'),null,.3+i*.06+.46);
  });
  const tZ=.3+clones.length*.06+.5;
  /* 3 · everything gathers and ignites */
  tl.to(blobs,{x:cx-S/2,y:cy-S/2,scale:.36,duration:.95,ease:'power3.inOut'},tZ-.35)
    .to(vb,{opacity:0,duration:.4},tZ-.3)
    .to(core,{opacity:1,scale:1,duration:.55,ease:'power2.out'},tZ)
    .to(clones.map(o=>o.c),{opacity:0,scale:.2,filter:'blur(10px)',duration:.45,ease:'power2.in'},tZ)
    .call(()=>sfx('bloom'),null,tZ);
  /* 4 · a ripple opens out of it */
  rings.forEach((s3,i)=>{
    tl.fromTo(s3,{scale:0,opacity:.9},{scale:38,opacity:0,duration:1.6,ease:'power2.out'},tZ+.35+i*.2); });
  tl.to(core,{scale:1.45,opacity:.25,duration:.7,ease:'power2.out'},tZ+.5);
  /* 5 · and it comes back as the companies */
  const R=Math.max(140,Math.min(pr.width||innerWidth,innerHeight)*0.30);
  const tB=tZ+.72;
  tiles.forEach((t2,i)=>{
    const a2=(i/tiles.length)*Math.PI*2-Math.PI/2;
    tl.fromTo(t2,{scale:0,opacity:0,filter:'blur(12px)'},
      {x:Math.cos(a2)*R, y:Math.sin(a2)*R, scale:1, opacity:1, filter:'blur(0px)',
       rotate:(i%2?9:-9), duration:.85, ease:'back.out(1.5)'}, tB+i*.06); });
  const tS=tB+tiles.length*.06+.6;
  tl.to(tiles,{rotate:0,scale:1.06,duration:.5,ease:'sine.inOut'},tS)
    .to(core,{opacity:0,duration:.5},tS)
    .to(blobs,{opacity:.35,scale:.9,duration:.8},tS);

  let landed=false, fired=false;
  const land=()=>{ if(landed) return; landed=true; sfx('page');
    if(onLand) onLand();
    setTimeout(()=>sheen(document.querySelector('.shell'),1.35),320); };
  const finish=()=>{ land(); if(fired) return; fired=true;
    if(layer.isConnected) layer.remove();
    if(core.isConnected) core.remove();
    rip.style.display='none'; rip.innerHTML='';
    gsap.to(aur,{opacity:0,duration:.6,onComplete:()=>{aur.innerHTML='';}});
    if(onDone) onDone(); };
  tl.call(land,null,tS+.4)
    .to(tiles,{x:0,y:0,scale:.35,opacity:0,filter:'blur(9px)',duration:.8,ease:EIO,stagger:.035},tS+.5);
  tl.eventCallback('onComplete',finish);
  /* a throttled tab freezes the ticker, so the clock guarantees both handoffs */
  setTimeout(land,(tS+.4)*1000+700);
  setTimeout(finish,(tS+1.5)*1000+900);
}

  if(nodes.length<2){ rail.style.opacity='0'; return; }

  const wr=wrap.getBoundingClientRect();
  const f=nodes[0].getBoundingClientRect(), l=nodes[nodes.length-1].getBoundingClientRect();
  if(row.classList.contains('vert')){
    rail.style.left='0'; rail.style.right='auto';

    rail.style.bottom=Math.round(wr.bottom-(l.top+l.height/2))+'px';

  ['folder','You get a scenario','A real brief from a real company, with a real deadline.'],
  ['target','You see what good looks like','The bar is handed to you before you start, not after.'],
  ['pen','You build the real thing','Not an exercise. The actual deliverable, in the actual tools.'],
  ['users','A manager reviews it','Someone senior reads your work and tells you the truth.'],
  ['route','You take the notes and go again','You revise it the way you would on the job, not for a grade.'],
  ['play','You present it','You defend the calls you made, out loud, to people who push back.'],
  ['bars','Zero calibrates you','Speed, independence and communication, measured on every scenario.'],
  ['flag','You get guaranteed interviews','Partners browse verified portfolios, and yours is one of them.'],
];
function buildLoop(s){
  const head=mk('div'); head.style.cssText='display:flex;align-items:center;gap:14px;margin-bottom:6px';
  const z=mk('div'); z.style.cssText='width:48px;height:48px;border-radius:14px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;padding:0 10px';
  z.innerHTML=ZSVG; z.querySelector('svg').style.cssText='height:13px;width:auto';
  const zt=mk('div'); zt.innerHTML='<div class="pname">'+(P.name?'How Zero gets you there, '+P.name:'How Zero gets you there')+
    '</div><div class="pmeta"><span class="m">7 steps, on repeat, until you are hired</span></div>';
  head.appendChild(z); head.appendChild(zt); s.appendChild(head);
  const body=mk('div'); body.id='pBody'; body.style.marginTop='16px'; s.appendChild(body);
}
async function addLoopStep(i){
  const [ic,t,d]=ZSTEPS[i];
  const last=i===ZSTEPS.length-1;
  const r=mk('div','zstep'+(last?' last':''));
  r.appendChild(mk('div','zn',I[ic]||I.target));
  const b=mk('div','zb'); b.appendChild(mk('div','zt',t)); b.appendChild(mk('div','zd',d));
  r.appendChild(b);
  const wrap=mk('div'); wrap.style.marginBottom='8px'; wrap.appendChild(r);
  await ghostIn(wrap,64,360);
}
async function zeroStage(){
  setPhase(4);
  clearTurn(); dockHide(); await wait(380);
  line('You learn the job by doing it, before you have it.');
  await wait(1400);
  await swapPanel('How Zero works',buildLoop,false,true);
  await wait(600);
  await beat('Everything here is a real project.',()=>addLoopStep(0),1500);
  await beat('The same brief a company hands its own team.',()=>addLoopStep(1),1700);
  await beat('You do the work, properly.',()=>addLoopStep(2),1500);
  await beat("You're not on your own. You get a manager.",()=>addLoopStep(3),1700);
  await beat('They push back until it is sharp.',()=>addLoopStep(4),1600);
  await beat('Then you present it, like you would on the job.',()=>addLoopStep(5),1700);
  await beat('And they watch how you work, not just what you made.',()=>addLoopStep(6),1900);
  await beat('Do it well and you climb faster.',()=>addLoopStep(7),1700);
  line('Every round leaves you readier than the last.');
  await wait(2100);
  cta('What do I start with?',creditsStage);
}
function buildReward(s){
  const boxR=mk('div','rew');
  const n=mk('div','rewn','0'); n.id='rewN'; boxR.appendChild(n);
  boxR.appendChild(mk('div','rewl','credits, yours to claim'));
  boxR.appendChild(mk('div','rewsub','Credits are what scenarios and reviews cost inside Zero. 10,000 covers your first 2 months in full. After that, finished work keeps paying for the next brief.'));
  s.appendChild(boxR);
  const d=pack();
  const scen=d.projects.reduce((a,p)=>a+p.steps.length,0);
  const g=mk('div','rewgrid');
  [['Going after',P.aim||P.role||d.role],['Scenarios ready',String(scen)],
   ['Credits','10,000'],['Cost to start','Nothing']]
    .forEach(([k,v])=>{ const r=mk('div','rewrow'); r.appendChild(mk('span','k',k));
      r.appendChild(mk('span','v',I.check+'<span>'+v+'</span>')); g.appendChild(r); });
  s.appendChild(g);
  const dlC=mk('div','dl'); dlC.id='dlCard'; dlC.style.display='none';
  const z=mk('div','dz',ZSVG);
  const nn=mk('div','dn','<div class="dt">Zero for desktop</div><div class="dd">macOS and Windows · your credits are already on it</div>');
  const b=mk('button','db',I.dl+'<span>Download</span>'); b.onclick=()=>sfx('success');
  dlC.appendChild(z); dlC.appendChild(nn); dlC.appendChild(b); s.appendChild(dlC);
}
async function creditsStage(){
  clearTurn(); dockHide(); await wait(380);
  line('To get started, here is 10,000 credits.');
  await wait(1500);
  await swapPanel('What you start with',buildReward,false,true);
  $('scroll').classList.add('ctr');
  await wait(450);
  const c2={v:0};
  safeTL(gsap.timeline().to(c2,{v:10000,duration:1.7,ease:EIO,
    onUpdate:()=>{const e=$('rewN'); if(e) e.textContent=fmt(Math.round(c2.v));}}),2200);
  setTimeout(()=>{const e=$('rewN'); if(e) e.textContent=fmt(10000);},2250);
  sfx('sparkle');
  setTimeout(()=>{ const e=$('rewN'); if(!e) return;
    const r=e.getBoundingClientRect();
    confetti(r.left+r.width/2, r.top+r.height*.62);
    safeTL(gsap.timeline().fromTo(e,{scale:.94},{scale:1,duration:.6,ease:'back.out(2.4)'}),1200);
    sfx('success'); },1900);
  await wait(2200); sfx('chime');
  line('Enter your email and they are yours.');
  await wait(1200);
  emailDock(v=>{
    const ok=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim());
    if(!ok){ sfx('error'); locked=false;
      gsap.fromTo('.dfield',{x:0},{x:7,duration:.07,yoyo:true,repeat:5}); return; }
    sfx('success'); finishStage(v.trim());
  });
}
async function finishStage(email){
  clearTurn(); dockHide();
  const dlC=$('dlCard');
  if(dlC){ dlC.style.display='flex';
    safeTL(gsap.timeline().fromTo(dlC,{opacity:0,y:16},{opacity:1,y:0,duration:.6}),1000);
    const s=$('scroll'); setTimeout(()=>{s.scrollTop=Math.max(0,s.scrollHeight-s.clientHeight);},300); }
  setCap('Ready when you are',false); await wait(600);
  line('Sent to '+(email||'your inbox')+'. Your first scenario is already briefed.');
  await wait(1600);
  dockFinal('Download the app',()=>{ sfx('success'); });
  sfx('ready');
}

/* ============================ boot ============================ */
gsap.set(['#logoPill','.tr'],{opacity:0,y:-9});
setPhase(0);
personaPick();

/* ============================ step-through (prototype only) ============================ */
/* Walk the whole flow with sensible answers already filled in, no clicking. */
const DBG_STEPS=[
  ['Persona',    ()=>personaPick()],
  ['Draw ZERO',  ()=>{ $('drawScreen').style.display='flex'; gsap.set('#drawScreen',{opacity:1});
                       gsap.set('#dH',{opacity:1,y:0}); }],
  ['Founder',    ()=>introStage(true)],
  ['Name',       ()=>nameStage()],
  ['What you want',()=>aboutStage()],
  ['Stage',      ()=>stageStage()],
  ['Doing',      ()=>doingStage()],
  ['Role',       ()=>roleStage()],
  ['Company',    ()=>companyStage()],
  ['Dream',      ()=>dreamStage()],
  ['Push back',  ()=>probeStage()],
  ['Industry',   ()=>industryStage()],
  ['Problems',   ()=>problemsStage()],
  ['Cities',     ()=>citiesStage()],
  ['Work mode',  ()=>modeStage()],
  ['Timing',     ()=>timelineStage()],
  ['Shape',      ()=>jobtypeStage()],
  ['Why',        ()=>motivationStage()],
  ['Read back',  ()=>synthStage()],
  ['Vision',     ()=>visionStage(true)],
  ['Transform',  ()=>transformStage()],
  ['Which role', ()=>aimStage()],
  ['Calibrate',  ()=>calibrateStage()],
  ['Curriculum', ()=>roadmapStage()],
  ['Portfolio',  ()=>portfolioStage()],
  ['How it works',()=>zeroStage()],
  ['Credits',    ()=>creditsStage()],
  ['Handoff',    ()=>finishStage('sanjay@z-ro.co')],
];
/* what each step would have produced, so any step can be entered cold */
function dbgFill(upTo){
  const d=pack();
  /* the stepper has to be able to go backwards. Without this P only ever grows,
     so an earlier step shows a fuller board than it should. */
  Object.keys(P).forEach(k=>{ P[k]=null; });
  const set=(i,fn)=>{ if(upTo>i) fn(); };
  set(3,()=>P.name='Sanjay');
  set(4,()=>{ P.about='I want to be doing product design at a startup'; });
  set(5,()=>P.level='Student');
  set(6,()=>P.doing='Final year design, Mumbai');
  set(7,()=>P.role=d.roleCards[0]);
  set(8,()=>P.company='Big tech');
  set(9,()=>P.dream=(DREAMS[PKEY]||DREAMS.design)[0]);
  set(10,()=>{ P.openness='open to a smaller team'; P.probed=1; });
  set(11,()=>P.industry='Tech and AI');
  set(12,()=>P.problems=d.problemChips[0]);
  set(13,()=>{ P.citynext='Mumbai, Dubai, London'; P.location='Mumbai'; });
  set(14,()=>P.workmode='Hybrid');
  set(15,()=>P.timeline='This year');
  set(16,()=>P.jobtype='Full time');
  set(17,()=>P.why='I want to prove I can do it');
  set(21,()=>{ P.aim=d.roles[0][0]; P.role=P.aim; });
  set(22,()=>P.linked='LinkedIn');
}
let dbgAt=0;
function dbgGoto(i){
  i=Math.max(0,Math.min(DBG_STEPS.length-1,i));
  dbgAt=i;
  /* nothing from the last step gets to finish */
  gen++;
  try{ gsap.killTweensOf(['#col','#scroll','.right','#dock','#dtr','#top','#aur','#paper','#turn']); }catch(e){}
  locked=false; editReturn=null; scanning=false; queue.length=0; shown={}; keys={}; tlMode='h';
  const t0=$('turn'); if(t0) t0.remove();
  $('col').innerHTML=''; $('dockIn').innerHTML='';
  gsap.set('#dock',{opacity:0}); gsap.set('#dtr',{opacity:0}); $('dtr').innerHTML='';
  stopRec();
  document.querySelectorAll('.zook,.conf,.core,.veil,.sheen,.gh').forEach(n=>n.remove());
  $('rip').style.display='none'; $('rip').innerHTML='';
  $('aur').innerHTML=''; gsap.set('#aur',{opacity:0});
  gsap.set(['#logoPill','.tr'],{opacity:i>=2?1:0,y:0});
  if(i!==1) $('drawScreen').style.display='none';
  document.body.classList.toggle('dark', i>=2&&i<=18);
  $('col').innerHTML='';
  dbgFill(i);
  /* the panel exists from the moment Zero starts writing things down */
  const wide=i>=18;
  if(i>=5){
    panelBorn=true; boardLive=true;
    gsap.set('.right',{width:wide?'56%':'40%',opacity:1,x:0});
    shiftLeft(wide?'56vw':'40vw');
    $('cap').innerHTML='<span class="live pulse"></span>'+(wide?'Your vision board':'Zero is listening');
    meterRetired=i>19; boardRewards=i>19;
    renderBoard();
  } else {
    panelBorn=false; boardLive=false;
    gsap.set('.right',{width:0,opacity:0}); shiftLeft('0px');
  }
  setPhase(i<19?0:(i<22?1:(i<24?2:(i<25?3:4))));
  const lbl=$('dbgStep'); if(lbl) lbl.textContent=(i+1)+'. '+DBG_STEPS[i][0];
  const pv=$('dbgPrev'), nx=$('dbgNext');
  if(pv) pv.disabled=i<=0;
  if(nx) nx.disabled=i>=DBG_STEPS.length-1;
  fastMode=true;
  try{ DBG_STEPS[i][1](); }catch(e){ console.warn('step',i,e); }
  /* long enough for the stage to paint, short enough that the narration still plays */
  clearTimeout(dbgGoto._t);
  dbgGoto._t=setTimeout(()=>{ fastMode=false; },900);
}
(function(){
  const pv=$('dbgPrev'), nx=$('dbgNext'), st=$('dbgStep'), gr=$('dbgBtn');
  pv.className='dbgnav flip'; pv.innerHTML=I.arrow;
  nx.className='dbgnav'; nx.innerHTML=I.arrow;
  gr.innerHTML=I.gear;
  pv.onclick=()=>{ sfx('tick'); dbgGoto(dbgAt-1); };
  nx.onclick=()=>{ sfx('tick'); dbgGoto(dbgAt+1); };
  st.onclick=()=>{ sfx('tick'); dbgGoto(0); };
  st.textContent='1. Persona';
  addEventListener('keydown',e=>{
    if(document.activeElement&&document.activeElement.tagName==='INPUT') return;
    if(e.key==='ArrowRight'){ dbgGoto(dbgAt+1); }
    if(e.key==='ArrowLeft'){ dbgGoto(dbgAt-1); }
  });
})();

/* ---- tuning drawer (debug, prototype only) ---- */
/* grouped, so only the thing you are tuning is open */
(function(){
  const panel=$('dbgPanel'), btn=$('dbgBtn');
  let openSec=null;
  function section(title){
    const sec=mk('div','dbgsec');
    const h=mk('button','dbgh');
    h.appendChild(mk('span',null,title));
    h.appendChild(mk('span','cv',I.arrow));
    const body=mk('div','dbgbody');
    sec.appendChild(h); sec.appendChild(body); panel.appendChild(sec);
    h.onclick=()=>{
      const isOpen=sec.classList.contains('open');
      if(openSec) openSec.classList.remove('open');
      if(isOpen){ openSec=null; }
      else { sec.classList.add('open'); openSec=sec;
        safeTL(gsap.timeline().fromTo(body.children,{opacity:0,y:8},
          {opacity:1,y:0,duration:.34,stagger:.035}),1200); }
      sfx('tick');
    };
    return body;
  }
  function range(body,label,min,max,step,get,set){
    const r=mk('div','dbgrow');
    const lb=mk('div','lb');
    lb.appendChild(mk('span',null,label));
    const val=mk('span','val',String(get()));
    lb.appendChild(val); r.appendChild(lb);
    const inp=document.createElement('input'); inp.type='range';
    inp.min=min; inp.max=max; inp.step=step; inp.value=get();
    inp.oninput=()=>{ set(parseFloat(inp.value)); val.textContent=inp.value; };
    r.appendChild(inp); body.appendChild(r);
  }
  function swatch(body,label,get,set){
    const r=mk('div','dbgrow flat');
    const lb=mk('div','lb'); lb.appendChild(mk('span',null,label)); r.appendChild(lb);
    const inp=document.createElement('input'); inp.type='color'; inp.value=get();
    inp.oninput=()=>set(inp.value);
    r.appendChild(inp); body.appendChild(r);
  }
  function toggle(body,label,get,set){
    const r=mk('div','dbgrow flat');
    const lb=mk('div','lb'); lb.appendChild(mk('span',null,label)); r.appendChild(lb);
    const inp=document.createElement('input'); inp.type='checkbox'; inp.checked=get();
    inp.onchange=()=>set(inp.checked);
    r.appendChild(inp); body.appendChild(r);
  }

  const draw=section('Draw ZERO');
  range(draw,'Ink max',20,180,2,()=>INK.max,v=>INK.max=v);
  range(draw,'Ink min',4,90,2,()=>INK.min,v=>INK.min=v);
  range(draw,'Speed thin',0,80,2,()=>INK.sens,v=>INK.sens=v);
  range(draw,'Wetness',0,.5,.02,()=>INK.wet,v=>INK.wet=v);
  range(draw,'Close tolerance',.1,.7,.05,()=>INK.tol,v=>INK.tol=v);
  swatch(draw,'Ink colour',()=>INK.color,v=>INK.color=v);

  const board=section('Vision board');
  range(board,'Text size',14,34,1,
    ()=>parseInt(getComputedStyle(document.documentElement).getPropertyValue('--vbfs'))||22,
    v=>document.documentElement.style.setProperty('--vbfs',v+'px'));

  const motion=section('Motion');
  range(motion,'Speed',.25,2,.05,()=>1,v=>gsap.globalTimeline.timeScale(v));

  const theme=section('Theme');
  toggle(theme,'Dark mode',()=>document.body.classList.contains('dark'),
    v=>document.body.classList.toggle('dark',v));

  btn.onclick=()=>{ panel.classList.toggle('open'); sfx('tick'); };
})();
