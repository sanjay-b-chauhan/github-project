<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zero project brief</title>
<meta name="description" content="The project brief, opened from the world, in the app's own scenario overview.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,300..800&display=swap">
<style>
/* The project brief, b3. Desktop only (Zero is a desktop app).
   Built on the app's own Scenario Overview as it is on dev today (pulled 22 Oct, 47496b7eb2):
   CampaignLanding/components/ScenarioOverviewV1.tsx and ScenarioOverview/* (overviewStyles, overviewLayout, OverviewStory,
   OverviewRail, OverviewWhyBox, OverviewUnlockPanel, OverviewManager, OverviewAccordion, overviewMotion).
   Its numbers, value for value: the card min(1060, w - 148) by min(780, h - 56), centred, radius 42, glass
   rgba(18,18,18,.62) blur 16; the rail min(400, 42% of the card) with a hairline on its left; the close key 44 round
   outside the top right corner; the scrim black at .36; body 15 Google Sans Flex 500, muted 14 at 60%, mono labels 13
   caps .04em at 60%, gold labels 12 caps .1em in the level badge gold rgb(240,194,122), pills 14, panels radius 20 with
   a white 12% hairline on white 4%, the title STK Bureau Serif 30. Sections rise 24px, a step of .06s after .22s.
   It opens from the scenario card as the app's FLIP does (0.6s, power3 in-out, the content late).
   Sanjay's brief (22 Oct): left is all the content, scrolling section by section, in paragraphs that explain;
   right is the game side. What you'll cover: why you should care, the workflows, the skills, the tool stack. What you
   get: a real portfolio project, why companies want it, the roles that open. */
@font-face{font-family:'PP Supply Mono';src:url(zero-project-brief-assets-b3/fonts/PPSupplyMono-Regular.otf) format('opentype');font-weight:400;font-display:swap}
@font-face{font-family:'STK Bureau Serif';src:url(zero-project-brief-assets-b3/fonts/STKBureau-SerifBook.otf) format('opentype');font-weight:400;font-display:swap}
@font-face{font-family:'STK Bureau Serif';src:url(zero-project-brief-assets-b3/fonts/STKBureau-SerifMedium.otf) format('opentype');font-weight:500;font-display:swap}
:root{--sans:'Google Sans Flex','Google Sans',-apple-system,system-ui,sans-serif;--mono:'PP Supply Mono',ui-monospace,monospace;--serif:'STK Bureau Serif',Georgia,serif;
  --gold:rgb(240,194,122);--green:#4ade80;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#101112;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;margin:0;padding:0;cursor:pointer;-webkit-appearance:none;appearance:none}

/* ---------------- the world (cover) and the app's canvas (contain), as CampaignLanding draws them ---------------- */
#world{position:fixed;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#app{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;font-family:var(--sans);color:#fff;pointer-events:none}
#app>*{pointer-events:auto}
.map{position:absolute;inset:0;overflow:hidden;background:#131514}
.cam{position:absolute;inset:0;transform-origin:56% 64%;transition:transform 1s var(--ease)}
.city{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;user-select:none}
body.picked .cam{transform:translate(-140px,-60px) scale(1.2)}
.mk{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;display:grid;place-items:center;
  background:rgba(18,20,26,.84);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.34),0 3px 10px rgba(0,0,0,.35);color:rgba(255,255,255,.78)}
.mk svg{width:15px;height:15px}
.mk.go{background:radial-gradient(circle,#1c1a18 0 4px,#fff 4.8px);box-shadow:0 0 0 3px rgba(255,255,255,.3),0 3px 10px rgba(0,0,0,.35)}
.mk.go::after{content:'';position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.85);animation:ring 2.2s cubic-bezier(0,0,.2,1) infinite}
@keyframes ring{0%{transform:scale(.9);opacity:0}18%{opacity:.85}100%{transform:scale(3.1);opacity:0}}
.chip{position:absolute;display:flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 11px;border-radius:999px;white-space:nowrap;font:600 15px/1 var(--sans);
  background:rgba(18,20,26,.78);color:rgba(255,255,255,.92);box-shadow:0 6px 20px rgba(0,0,0,.3),inset 0 0 0 1px rgba(255,255,255,.12)}
.chip img{width:17px;height:17px;display:block;filter:brightness(0) invert(1);opacity:.85}
.chip em{font:500 14px/1 var(--sans);font-style:normal;color:rgba(255,255,255,.6);margin-left:2px}
.chip.go{background:rgba(255,255,255,.96);color:#1c1a18;box-shadow:0 8px 22px rgba(0,0,0,.28);cursor:pointer}
.chip.go img{filter:none;opacity:1}
.chip.go em{display:inline-flex;align-items:center;gap:6px;color:#1f7a36;font-weight:600}
.chip.go em::before{content:'';width:7px;height:7px;border-radius:50%;background:#49BA61}
.chip.t{transform:translate(-50%,-100%)}.chip.b{transform:translate(-50%,0)}
.hit{position:absolute;left:52.3%;top:55.5%;width:7.6%;height:13.8%;border-radius:30px;cursor:pointer;transition:background .2s,box-shadow .2s}
.hit:hover{background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7)}
body.picked .hit,body.picked .chip.go{pointer-events:none}
.hint{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);display:flex;align-items:center;height:48px;padding:0 20px;border-radius:999px;
  background:rgba(18,20,26,.78);font:500 17px/1 var(--sans);color:rgba(255,255,255,.85);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);transition:transform .4s var(--ease),opacity .3s}
body.picked .hint{transform:translate(-50%,40px);opacity:0}

/* ---------------- the app's scenario card (ScenarioIntroV1), on the right ---------------- */
.card{position:absolute;right:40px;top:50%;width:470px;padding:20px;transform:translate(560px,-50%);visibility:hidden;
  transition:transform .8s cubic-bezier(.22,1,.36,1),visibility 0s linear .8s}
body.picked .card{transform:translate(0,-50%);visibility:visible;transition:transform .8s cubic-bezier(.22,1,.36,1) .12s,visibility 0s}
.c-body{position:relative;overflow:hidden;border-radius:42px;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(16px) saturate(1.1);backdrop-filter:blur(16px) saturate(1.1);box-shadow:0 44px 90px -24px rgba(0,0,0,.5)}
.c-in{display:flex;flex-direction:column;align-items:center;gap:34px;padding:20px;transition:opacity .16s ease-out}
.c-nav{display:flex;align-items:center;justify-content:space-between;width:100%}
.c-chev{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;color:rgba(255,255,255,.7)}
.c-chev svg{width:24px;height:24px}.c-chev.off{opacity:.2}
.c-count{display:flex;height:46px;align-items:center;gap:10px;border-radius:999px;background:rgba(255,255,255,.1);padding:0 20px;font:400 16px/1 var(--mono)}
.c-count i{font-style:normal;color:rgba(255,255,255,.4)}.c-count em{font-style:normal;color:rgba(255,255,255,.6)}
.c-art{width:336px;height:210px;object-fit:contain;display:block}
.c-desc{margin:0;max-width:360px;padding:0 10px;font:500 24px/1.35 var(--sans);text-align:center}
.c-meta{display:flex;flex-direction:column;align-items:center;gap:26px;width:100%}
.c-rule{width:100%;height:1px;background:rgba(255,255,255,.12)}
.c-rows{display:flex;flex-direction:column;gap:20px;width:100%}
.c-row{display:flex;height:30px;align-items:center;justify-content:space-between;padding:0 20px}
.c-row>span:first-child{font:400 16px/1 var(--mono);text-transform:uppercase;color:rgba(255,255,255,.5)}
.c-row>b,.c-diff b{font:500 18px/1 var(--sans)}
.c-xp{display:inline-flex;align-items:center;gap:6px;border-radius:40px;padding:6px 10px;background:rgba(255,224,107,.12);box-shadow:0 0 0 1px rgba(255,225,127,.4)}
.c-xp img{width:18px;height:18px;display:block}.c-xp b{font:400 18px/1.2 var(--mono);letter-spacing:-1.62px;color:#fff9d5}
.c-diff{display:flex;align-items:center;gap:20px}
.c-bars{display:inline-flex;gap:2px}.c-bars i{display:block;width:23px;height:10px;border-radius:30px;background:#fff}.c-bars i.dim{opacity:.1}
/* StartButtonV1 */
.start{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:62px;padding:15px 40px;border-radius:100px;
  background-image:linear-gradient(90deg,rgba(255,255,255,.4),rgba(255,255,255,.4)),linear-gradient(180deg,rgba(229,229,229,.8),rgb(226,226,226));
  box-shadow:0 6px 0 #c8c8c8,0 12px 18px -6px rgba(0,0,0,.4),0 0 0 1.33px #e6e6e6,inset 0 1.33px 0 rgba(255,255,255,.75);transition:transform .1s cubic-bezier(.34,1.56,.64,1),box-shadow .1s}
.start:hover{transform:translateY(-1px)}
.start:active,.start.down{transform:translateY(5px);box-shadow:0 1px 0 #c8c8c8,0 3px 8px -4px rgba(0,0,0,.4),0 0 0 1.33px #e6e6e6,inset 0 1.33px 0 rgba(255,255,255,.75)}
.start svg{width:7.8px;height:9.9px;margin-right:3.5px;position:relative;z-index:2}
.start b{position:relative;z-index:2;font:600 23px/1.2 var(--sans);letter-spacing:-.48px;
  background:linear-gradient(100deg,#121212 0%,#121212 34%,#ff5ec0 42%,#8b7bff 50%,#37dcc4 58%,#121212 66%,#121212 100%);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:holo 3s ease-in-out infinite}
@keyframes holo{0%{background-position:130% 0}55%,100%{background-position:-30% 0}}

/* ---------------- the overview (ScenarioOverviewV1), in window pixels as the app draws it ---------------- */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.36);opacity:0;visibility:hidden;transition:opacity .35s var(--ease),visibility 0s linear .35s}
body.open .scrim{opacity:1;visibility:visible;transition:opacity .35s var(--ease),visibility 0s}
.ov{position:fixed;z-index:21;overflow:hidden;border-radius:42px;visibility:hidden;font-family:var(--sans);color:#fff;
  background:rgba(18,18,18,.62);-webkit-backdrop-filter:blur(16px) saturate(1.1);backdrop-filter:blur(16px) saturate(1.1);
  box-shadow:0 44px 90px -24px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.08)}
body.open .ov{visibility:visible}
.ov-in{display:flex;width:100%;height:100%;opacity:0;transition:opacity .3s var(--ease)}
body.shown .ov-in{opacity:1}
.ov-x{position:fixed;z-index:22;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);opacity:0;visibility:hidden;transition:background-color .15s,opacity .3s var(--ease),visibility 0s linear .3s}
.ov-x:hover{background:rgba(255,255,255,.3)}.ov-x:active{transform:scale(.94)}
.ov-x svg{width:20px;height:20px}
body.shown .ov-x{opacity:1;visibility:visible;transition:background-color .15s,opacity .3s var(--ease),visibility 0s}
/* sections rise 24px, .06s apart, after .22s (overviewMotion) */
.rs{opacity:0;transform:translateY(24px);transition:opacity .32s var(--ease),transform .32s var(--ease)}
body.shown .rs{opacity:1;transform:none}
.scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
.scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:8px;border:2px solid transparent;background-clip:padding-box}

/* the story: everything there is to read, section by section */
.story{flex:1 1 auto;min-width:0;padding:32px 36px 40px}
.st-art{display:block;height:clamp(64px,9vh,96px);width:auto;max-width:min(280px,56vw);object-fit:contain}
.st-title{margin:18px 0 0;font:400 30px/1.15 var(--serif);color:#fff}
.st-meta{display:flex;align-items:center;gap:10px;margin-top:14px;font:500 15px/1 var(--sans);color:rgba(255,255,255,.88)}
.st-meta .lg{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#fff}
.st-meta .lg img{width:15px;height:15px;display:block}
.tag{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:99px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
  font:400 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.04em;color:rgba(255,255,255,.7)}
.mgr{display:flex;align-items:center;gap:12px;margin-top:18px}
.mgr img{width:36px;height:36px;border-radius:50%;object-fit:cover;object-position:top;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.mgr span{display:flex;flex-direction:column;gap:2px;line-height:1.2}
.mgr b{font:500 15px/1.2 var(--sans)}.mgr i{font:500 14px/1.2 var(--sans);font-style:normal;color:rgba(255,255,255,.6)}
.sec{margin-top:28px;padding-top:24px;border-top:1px solid rgba(255,255,255,.1)}
.lbl{margin:0 0 14px;font:400 13px/1 var(--mono);text-transform:uppercase;letter-spacing:.04em;color:rgba(255,255,255,.6)}
.sub{margin:22px 0 8px;font:500 15px/1.3 var(--sans);color:#fff}
.sub:first-of-type{margin-top:0}
.p{margin:0 0 12px;max-width:620px;font:400 15px/1.6 var(--sans);color:rgba(255,255,255,.75)}
.p b{font-weight:500;color:#fff}
.nums{display:flex;gap:10px;margin-top:6px}
.num{flex:1;min-width:0;padding:14px 16px;border-radius:20px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.num b{display:block;font:400 22px/1 var(--mono);letter-spacing:-.03em;color:#fff;font-feature-settings:'lnum' 1,'tnum' 1}
.num span{display:block;margin-top:8px;font:500 13px/1.3 var(--sans);color:rgba(255,255,255,.6)}
.stages{list-style:none;margin:0;padding:0;position:relative}
.stages::before{content:'';position:absolute;left:13.5px;top:24px;bottom:24px;width:1px;background:rgba(255,255,255,.12)}
.sg{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:14px;align-items:start;padding:12px 0}
.sg-n{position:relative;z-index:1;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#202022;box-shadow:0 0 0 4px rgba(26,26,27,.95),inset 0 0 0 1px rgba(255,255,255,.14);
  font:400 13px/1 var(--mono);color:rgba(255,255,255,.75)}
.sg:first-child .sg-n{background:#fff;color:#121212;box-shadow:0 0 0 4px rgba(26,26,27,.95)}
.sg-t{display:flex;flex-direction:column;gap:3px;min-width:0;padding-top:4px}
.sg-t b{font:500 15px/1.3 var(--sans)}
.sg-t span{font:500 14px/1.4 var(--sans);color:rgba(255,255,255,.6)}
.sg-m{padding-top:6px;font:400 14px/1 var(--mono);color:rgba(255,255,255,.6);font-feature-settings:'lnum' 1,'tnum' 1}
.sg-total{float:right;font:400 13px/1 var(--mono);color:rgba(255,255,255,.45)}
.wf{display:flex;flex-direction:column;gap:2px}
.wf-r{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.wf-r+.wf-r{margin-top:6px}
.wf-r>span:first-child{display:flex;flex-direction:column;gap:3px;min-width:0}
.wf-r .pill{flex:none}
.wf-r b{font:500 15px/1.3 var(--sans)}
.wf-r i{font:500 14px/1.4 var(--sans);font-style:normal;color:rgba(255,255,255,.6)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);font:500 14px/1.3 var(--sans);white-space:nowrap}
.pill img{width:18px;height:18px;border-radius:5px;background:rgba(255,255,255,.9);padding:2px;object-fit:contain}
.gets{display:flex;flex-direction:column;gap:6px}
.gt{display:flex;align-items:flex-start;gap:14px;padding:14px 16px;border-radius:20px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.gt .tile{flex:none}
.gt span.t{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.gt b{font:500 15px/1.3 var(--sans)}
.gt i{font:500 14px/1.45 var(--sans);font-style:normal;color:rgba(255,255,255,.6)}
.lgs{display:flex;align-items:center;margin-top:8px}
.lgs span{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(26,26,27,1)}
.lgs span+span{margin-left:-7px}
.lgs img{width:16px;height:16px;display:block;border-radius:4px}

/* the rail: the game side. Rank, rewards, streak, time and difficulty, what you'll unlock, Start */
.rail{flex:none;display:flex;flex-direction:column;min-height:0;border-left:1px solid rgba(255,255,255,.1)}
.rail-sc{flex:1 1 auto;min-height:0;padding:28px 24px 12px;-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 28px),transparent)}
.gold-lbl{margin:0;font:400 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--gold)}
.tile{position:relative;display:grid;place-items:center;width:40px;height:40px;border-radius:10px;color:var(--gold);
  border:1px solid rgba(240,194,122,.35);background:rgba(240,194,122,.14)}
.tile svg{width:20px;height:20px}
.lockb{position:absolute;right:-2px;bottom:-2px;display:grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--gold);color:#0d0d0e;box-shadow:0 0 0 2px #141415}
.lockb svg{width:9px;height:9px}
.rank{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;border:1px solid rgba(240,194,122,.45);background:rgba(240,194,122,.06)}
.rank img{width:56px;height:56px;object-fit:contain;flex:none;animation:bob 3.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-3deg)}}
.rank-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.rank-t b{font:500 15px/1.2 var(--sans)}
.bar{position:relative;height:8px;border-radius:30px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:30px;background:linear-gradient(90deg,#e8b45f,var(--gold));transition:width 1.4s var(--ease) .6s}
body.shown .bar i{width:100%}
.bar-l{display:flex;justify-content:space-between;font:400 12px/1 var(--mono);color:rgba(255,255,255,.55)}
.panel{margin-top:14px;padding:0 16px;border-radius:20px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.acc{border-top:1px solid rgba(255,255,255,.1)}.acc:first-child{border-top:0}
.acc-h{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 0;text-align:left}
.acc-h span{font:400 13px/1 var(--mono);text-transform:uppercase;letter-spacing:.04em;color:rgba(255,255,255,.6)}
.acc-h svg{width:16px;height:16px;color:rgba(255,255,255,.6);transform:rotate(180deg);transition:transform .2s}
.acc.shut .acc-h svg{transform:none}
.acc-b{padding-bottom:16px}
.acc.shut .acc-b{display:none}
.tier{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.tier:last-child{border-bottom:0;padding-bottom:0}.tier:first-child{padding-top:0}
.tier span.x{display:flex;align-items:center;gap:10px;white-space:nowrap}
.tier img{width:17px;height:17px}
.tier .xp{font:500 16px/1 var(--mono);letter-spacing:-.03em;font-feature-settings:'lnum' 1,'tnum' 1}
.lvlup{display:inline-flex;align-items:center;gap:2px;padding:3px 8px;border-radius:30px;font:500 11px/1 var(--mono);color:var(--green);
  background:color-mix(in srgb,var(--green) 16%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--green) 40%,transparent)}
.lvlup svg{width:12px;height:12px}
.tier .nm{font:500 15px/1.2 var(--sans);text-align:right}
.val{font:500 15px/1.2 var(--sans)}
.diff{display:flex;align-items:center;gap:10px}
.diff i{display:block;width:16px;height:8px;border-radius:30px;background:#fff}.diff i.dim{opacity:.2}
.diffs{display:inline-flex;gap:2px}
.streak{display:flex;align-items:center;gap:14px;margin-top:14px;padding:14px 16px;border-radius:20px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.flame{width:34px;height:40px;flex:none;filter:drop-shadow(0 4px 10px rgba(255,120,40,.35));animation:flick 1.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flick{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.04,.97) rotate(-2deg)}60%{transform:scale(.98,1.04) rotate(2deg)}}
.streak span{display:flex;flex-direction:column;gap:3px}
.streak b{font:500 15px/1.2 var(--sans)}

    '<div class="story scroll">' +
      '<img class="st-art rs" alt="Cancel Crisis" src="' + A + 'img/airbnb-art.webp">' +

    '</div>';
