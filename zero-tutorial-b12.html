.ch-portfolio .pf-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid rgba(31,29,30,.05);background:#F4F3F0;font-size:13px;font-weight:500;color:#3A3638;white-space:nowrap}

.ch-portfolio .pf-chip-pres svg{width:11px;height:11px;color:#1F1D1E}
.ch-portfolio .pf-chip-file svg{width:13px;height:13px;color:#8C8688}

/* ---------- Yet to do (YetToDoList): a dashed slot for each scenario still ahead ---------- */
.ch-portfolio .pf-todo{margin-top:4px}
.ch-portfolio .pf-td{overflow:hidden;padding-bottom:14px}
.ch-portfolio .pf-td:last-child{padding-bottom:0}
.ch-portfolio .pf-td-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px;border-radius:22px;border:1.5px dashed rgba(31,29,30,.12)}
.ch-portfolio .pf-td-t{min-width:0;font-size:16.5px;font-weight:600;line-height:1.3;color:rgba(31,29,30,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-portfolio .pf-td-p{flex:none;font-family:var(--f-mono);font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;color:rgba(31,29,30,.45);border:1px dashed rgba(31,29,30,.12);white-space:nowrap}

/* ---------- skills (SkillsMatrix, RatingChip) ---------- */
.ch-portfolio .pf-skills{margin-top:80px}
.ch-portfolio .pf-sk-lbl{font-size:22px;color:rgba(31,29,30,.42);margin-bottom:24px}
.ch-portfolio .pf-sk-grid{display:grid;grid-template-columns:1fr 1fr}
.ch-portfolio .pf-col{padding-right:48px}
.ch-portfolio .pf-col+.pf-col{padding:0 0 0 48px;border-left:1px solid rgba(31,29,30,.08)}
.ch-portfolio .pf-col-h{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.ch-portfolio .pf-col-h i{display:inline-flex;color:rgba(31,29,30,.45)}
.ch-portfolio .pf-col-h svg{width:15px;height:15px}
.ch-portfolio .pf-col-h span{font-size:16px;font-weight:600;color:#1F1D1E}
.ch-portfolio .pf-sk{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0}
.ch-portfolio .pf-sk>span{min-width:0;font-size:15px;color:#1F1D1E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-portfolio .pf-rate{flex:none;display:inline-flex;align-items:center;border-radius:999px;font-style:normal;font-size:11.5px;font-weight:600;padding:4px 12px;white-space:nowrap;border:1px solid transparent}
.ch-portfolio .pf-rate-excellent{color:rgb(0,166,86);background:rgb(211,238,221)}
.ch-portfolio .pf-rate-strong{color:rgb(15,70,40);background:rgba(20,135,74,.09)}
.ch-portfolio .pf-rate-good{color:rgb(176,124,32);background:rgba(176,124,32,.11)}
.ch-portfolio .pf-rate-developing{color:rgba(31,29,30,.45);border-color:rgba(31,29,30,.06)}

/* ---------- the right column: Getting started (GettingStartedCard), Edit portfolio (PortfolioPhasePanel) ---------- */
.ch-portfolio .pf-phase{display:flex;flex-direction:column;gap:12px}
.ch-portfolio .pf-gs{border-radius:26px;background:#fff;border:1px solid rgba(31,29,30,.05);padding:20px 22px}
.ch-portfolio .pf-gs-h{display:flex;align-items:center;gap:14px}
.ch-portfolio .pf-ring{position:relative;flex:none;width:50px;height:50px;display:inline-flex;align-items:center;justify-content:center}
.ch-portfolio .pf-ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#1F1D1E;font-variant-numeric:tabular-nums}
.ch-portfolio .pf-gs h3{margin:0;font-size:15.5px;font-weight:600;line-height:1.25;letter-spacing:-.01em;color:#1F1D1E}
.ch-portfolio .pf-gs p{margin:2px 0 0;font-size:12.5px;line-height:1.4;color:rgba(31,29,30,.45)}
.ch-portfolio .pf-gs ul{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column}
.ch-portfolio .pf-gs li{display:flex;align-items:center;gap:10px;margin:0 -10px;border-radius:10px;padding:7.5px 10px;border-bottom:1px solid rgba(31,29,30,.06)}
.ch-portfolio .pf-gs li.pf-last{border-bottom:0}
.ch-portfolio .pf-gs li>i{flex:none;width:15px;height:15px;border-radius:50%;border:1.5px dashed rgba(31,29,30,.32)}
.ch-portfolio .pf-gs li>span:first-of-type{flex:1;min-width:0;font-size:13px;line-height:18px;font-weight:600;color:#1F1D1E}
.ch-portfolio .pf-st-act{flex:none;display:flex;align-items:center;gap:6px}
.ch-portfolio .pf-st-act u{text-decoration:none;border-radius:999px;padding:4px;font-size:11.5px;font-weight:600;color:rgba(31,29,30,.45)}
.ch-portfolio .pf-st-act b{border-radius:999px;border:1px solid rgba(31,29,30,.12);background:#fff;padding:4px 12px;font-size:11.5px;font-weight:600;color:#1F1D1E}
.ch-portfolio .pf-edit{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 20px;border-radius:18px;border:1px solid rgba(31,29,30,.12);background:#fff;font-size:16px;font-weight:500;color:#1F1D1E}
.ch-portfolio .pf-edit svg{width:15px;height:15px}

/* ---------- the landing. The app swaps the update card for the project in one render. Here the same
   swap takes half a second, so the eye can follow the slot becoming the card. The class is the end state. ---------- */
.ch-portfolio .pf-gen-w,.ch-portfolio .pf-td-done{transition:height .5s var(--zt-ease),padding .5s var(--zt-ease),opacity .28s var(--zt-ease)}
.ch-portfolio .pf-card-w{opacity:0;transition:height .5s var(--zt-ease),opacity .42s var(--zt-ease) .14s}
.ch-portfolio .pf-card{transform:translateY(14px);transition:transform .6s var(--zt-ease) .08s}
.ch-portfolio .pf-mastery,.ch-portfolio .pf-skills{opacity:0;transition:opacity .45s var(--zt-ease) .3s}
.ch-portfolio.pf-landed .pf-gen-w,.ch-portfolio.pf-landed .pf-td-done{height:0;padding-bottom:0;opacity:0}
.ch-portfolio.pf-landed .pf-card-w{height:auto;opacity:1}
.ch-portfolio.pf-landed .pf-card{transform:none}
.ch-portfolio.pf-landed .pf-mastery,.ch-portfolio.pf-landed .pf-skills{opacity:1}

@media (prefers-reduced-motion:reduce){
  .ch-portfolio .pf-stage *{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}
}

/* ---------- b9: the finished project on its own, then into its place ----------
   pf-inst: nothing moves (the page is put in its landed state at mount). pf-hoo-on: the veil is up.
   pf-hoo-in: the tile is there. pf-hoo-done: the tick, the words, the paper. pf-hoo-go: the veil lifts and the tile
   flies to the card. pf-hoo-gone: the card's own tile has taken over. */
.ch-portfolio.pf-inst .pf-stage *{transition:none!important}
.ch-portfolio .pf-hoo{position:absolute;left:0;top:0;width:1920px;height:1008px;pointer-events:none}
.ch-portfolio .pf-hoo-v{position:absolute;left:0;top:0;width:100%;height:100%;background:rgb(246,245,243);opacity:1;transition:opacity .6s var(--zt-ease)}
.ch-portfolio .pf-hoo-t{position:absolute;left:816px;top:300px;width:288px;height:216px;opacity:0;transform:scale(1.62);
  transition:transform .8s var(--zt-ease),opacity .4s var(--zt-ease)}
.ch-portfolio .pf-hoo-t .pf-tile{box-shadow:0 26px 44px -26px rgba(31,29,30,.38),0 0 0 1px rgba(31,29,30,.06)}
.ch-portfolio.pf-hoo-in .pf-hoo-t{opacity:1;transform:scale(1.75)}
.ch-portfolio .pf-hoo-k{position:absolute;right:-12px;top:-12px;width:34px;height:34px;border-radius:50%;background:#1FA95C;color:#fff;display:grid;place-items:center;
  box-shadow:0 0 0 3px rgb(246,245,243);transform:scale(0);transition:transform .5s cubic-bezier(.2,.9,.3,1),opacity .25s var(--zt-ease)}
.ch-portfolio .pf-hoo-k svg{width:20px;height:20px;display:block}
.ch-portfolio .pf-hoo-k path{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .4s var(--zt-ease) .2s}
.ch-portfolio.pf-hoo-done .pf-hoo-k{transform:none}
.ch-portfolio.pf-hoo-done .pf-hoo-k path{stroke-dashoffset:0}
.ch-portfolio .pf-hoo-h{position:absolute;left:0;right:0;top:640px;margin:0;text-align:center;font:400 44px/1 var(--f-serif);letter-spacing:-.03em;color:#1F1D1E;opacity:0;transform:translateY(12px);
  transition:opacity .45s var(--zt-ease),transform .6s var(--zt-ease)}
.ch-portfolio.pf-hoo-done .pf-hoo-h{opacity:1;transform:none}
.ch-portfolio .pf-hoo-b{position:absolute;left:960px;top:408px;width:0;height:0}
.ch-portfolio .pf-hoo-b i{position:absolute;left:-7px;top:-3px;width:15px;height:7px;border-radius:2px;background:#FF5A5F;opacity:0}
.ch-portfolio .pf-hoo-b .pf-p1{background:#F2C94C}
.ch-portfolio .pf-hoo-b .pf-p2{background:#1F1D1E}
.ch-portfolio .pf-hoo-b .pf-p3{width:9px;height:9px;left:-4px;top:-4px;border-radius:50%;background:#FFB3B5}
.ch-portfolio.pf-hoo-done .pf-hoo-b i{animation:pf-hoo-pop 1.3s cubic-bezier(.16,.8,.3,1) var(--d) both}
@keyframes pf-hoo-pop{
  0%{transform:translate(0,0) rotate(0deg) scale(.3);opacity:0}
  9%{opacity:1}
  56%{transform:translate(calc(var(--x)*.92),calc(var(--y)*.96)) rotate(calc(var(--r)*.7)) scale(1);opacity:1}
  100%{transform:translate(var(--x),calc(var(--y) + 74px)) rotate(var(--r)) scale(.9);opacity:0}}
/* into its place: the veil lifts, the words and the tick go, and the card's own tile waits unseen until the copy arrives */
.ch-portfolio.pf-hoo-on .pf-card .pf-tile{visibility:hidden}
.ch-portfolio.pf-hoo-go .pf-hoo-v{opacity:0}
.ch-portfolio.pf-hoo-go .pf-hoo-h{opacity:0;transform:translateY(-10px);transition-duration:.25s}
.ch-portfolio.pf-hoo-go .pf-hoo-k{opacity:0}
.ch-portfolio.pf-hoo-go .pf-hoo-t .pf-tile{box-shadow:0 0 0 0 rgba(31,29,30,0);transition:box-shadow .6s var(--zt-ease)}
.ch-portfolio.pf-hoo-gone .pf-card .pf-tile{visibility:visible}
.ch-portfolio.pf-hoo-gone .pf-hoo{display:none}

/* ---------- b10: more projects, as cards. With each one the level goes up and a role opens ----------
   pf-grid: the first card gives up its text and becomes a tile, so four fit as a grid. pf-row2: the second row is open.
   .pf-x.pf-in: one more project has landed. .pf-td-gone: its "Yet to do" slot has closed. */
.ch-portfolio .pf-projects{position:relative;transition:padding-bottom .55s var(--zt-ease)}
.ch-portfolio.pf-row2 .pf-projects{padding-bottom:280px}
.ch-portfolio .pf-card-w{width:746px;transition:height .5s var(--zt-ease),opacity .42s var(--zt-ease) .14s,width .55s var(--zt-ease)}
.ch-portfolio .pf-card .pf-tile{transition:width .55s var(--zt-ease)}
.ch-portfolio .pf-body{max-height:216px;overflow:hidden;transition:opacity .18s var(--zt-ease)}
.ch-portfolio.pf-grid .pf-card-w{width:365px}
.ch-portfolio.pf-grid .pf-card .pf-tile{width:317px}
.ch-portfolio.pf-grid .pf-body{opacity:0}
.ch-portfolio .pf-projects .pf-x{position:absolute;width:365px;margin:0;opacity:0;transform:translateY(-16px) scale(1.1);
  transition:opacity .35s var(--zt-ease),transform .6s var(--zt-ease);box-shadow:0 30px 44px -30px rgba(31,29,30,0)}
.ch-portfolio .pf-projects .pf-x .pf-tile{width:317px}
.ch-portfolio .pf-projects .pf-x.pf-in{opacity:1;transform:none}
.ch-portfolio .pf-td.pf-td-gone{padding-bottom:0;opacity:0;transition:height .5s var(--zt-ease),padding .5s var(--zt-ease),opacity .25s var(--zt-ease)}

/* the level and the roles: one card in the page's own card style, above Getting started */
.ch-portfolio .pf-rl{border-radius:26px;background:#fff;border:1px solid rgba(31,29,30,.05);padding:20px 22px 12px}
.ch-portfolio .pf-rl-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ch-portfolio .pf-rl h3{margin:0;font-size:15.5px;font-weight:600;line-height:1.25;letter-spacing:-.01em;color:#1F1D1E}
.ch-portfolio .pf-lv{display:inline-flex;align-items:center;gap:7px;padding:7px 13px 7px 10px;border-radius:999px;background:#1F1D1E;color:#fff}
.ch-portfolio .pf-lv svg{width:14px;height:14px;display:block;color:#F2C94C}
.ch-portfolio .pf-lv b{font-size:13.5px;font-weight:600;line-height:1;white-space:nowrap}
.ch-portfolio .pf-lv i{font-style:normal;font-variant-numeric:tabular-nums}
.ch-portfolio .pf-lv.pf-bump{animation:pf-bump .5s var(--zt-ease)}
@keyframes pf-bump{0%{transform:scale(1)}35%{transform:scale(1.16)}100%{transform:scale(1)}}
.ch-portfolio .pf-rl ul{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column}
.ch-portfolio .pf-rl li{display:flex;align-items:center;gap:11px;margin:0 -10px;padding:9px 10px;border-bottom:1px solid rgba(31,29,30,.06)}
.ch-portfolio .pf-rl li:last-child{border-bottom:0}
.ch-portfolio .pf-rl-i{position:relative;flex:none;width:26px;height:26px;border-radius:50%;background:#F4F3F0;color:rgba(31,29,30,.4);display:grid;place-items:center;
  transition:background .35s var(--zt-ease),color .35s var(--zt-ease)}
.ch-portfolio .pf-rl-i svg{grid-area:1/1;width:14px;height:14px;display:block;transition:opacity .25s var(--zt-ease),transform .35s var(--zt-ease)}
.ch-portfolio .pf-rl-tick{opacity:0;transform:scale(.5)}
.ch-portfolio .pf-rl-tick path{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .35s var(--zt-ease) .12s}
.ch-portfolio .pf-rl-t{flex:1;min-width:0;font-size:14px;line-height:18px;font-weight:600;color:rgba(31,29,30,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .35s var(--zt-ease)}
.ch-portfolio .pf-rl em{flex:none;display:inline-grid;font-style:normal;font-size:12px;font-weight:600;line-height:1;padding:6px 10px;border-radius:999px;color:rgba(31,29,30,.45);border:1px solid rgba(31,29,30,.08);
  transition:color .35s var(--zt-ease),background .35s var(--zt-ease),border-color .35s var(--zt-ease)}
.ch-portfolio .pf-rl em span{grid-area:1/1;text-align:center;transition:opacity .25s var(--zt-ease)}
.ch-portfolio .pf-rl em span+span{opacity:0}
.ch-portfolio .pf-rl li.pf-open .pf-rl-i{background:#1FA95C;color:#fff}
.ch-portfolio .pf-rl li.pf-open .pf-rl-lock{opacity:0;transform:translateY(-4px)}
.ch-portfolio .pf-rl li.pf-open .pf-rl-tick{opacity:1;transform:none}
.ch-portfolio .pf-rl li.pf-open .pf-rl-tick path{stroke-dashoffset:0}
.ch-portfolio .pf-rl li.pf-open .pf-rl-t{color:#1F1D1E}
.ch-portfolio .pf-rl li.pf-open em{color:#1F8A4C;background:#E9F6EE;border-color:rgba(31,138,76,.18)}
.ch-portfolio .pf-rl li.pf-open em span{opacity:0}
.ch-portfolio .pf-rl li.pf-open em span+span{opacity:1}

/* ch/09-jobs.css */
/* 8b · the job portal step, in the job portal's own light language: an off-white canvas, white cards with a
   hairline, ink type, one serif line. Three columns: the portfolio, Zero, what is happening.
   Every state is a class on the root: jb-here, jb-working, jb-rolesin, jb-ask, jb-applied, jb-hired. */
.ch-jobs{background:#F3F3F5;color:#4E525C;font:400 14px/20px var(--f-sans);letter-spacing:-.011em;overflow:hidden}
.ch-jobs .jb-lab{margin:0 0 10px;font-size:13px;line-height:18px;color:#6A6F7A}
.ch-jobs .jb-left,.ch-jobs .jb-mid,.ch-jobs .jb-right{opacity:0;transform:translateY(12px);transition:opacity .45s var(--zt-ease),transform .6s var(--zt-ease)}
.ch-jobs.jb-here .jb-left,.ch-jobs.jb-here .jb-mid,.ch-jobs.jb-here .jb-right{opacity:1;transform:none}
.ch-jobs.jb-here .jb-mid{transition-delay:.06s}
.ch-jobs.jb-here .jb-right{transition-delay:.12s}

/* a company's logo on a white tile, as the portal draws it */
.ch-jobs .jb-lg{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px #E7E7EB}
.ch-jobs .jb-lg img{width:22px;height:22px;display:block;object-fit:contain}
.ch-jobs .jb-lg.jb-xs{width:28px;height:28px;border-radius:9px}
.ch-jobs .jb-lg.jb-xs img{width:16px;height:16px}

/* ---------- left: the portfolio ---------- */
.ch-jobs .jb-left{position:absolute;left:56px;top:102px;width:340px}
.ch-jobs .jb-pf{border-radius:24px;background:#fff;padding:20px;box-shadow:inset 0 0 0 1px #E7E7EB}
.ch-jobs .jb-who{display:flex;align-items:center;gap:12px}
.ch-jobs .jb-av{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#EDEDF0;font-size:15px;font-weight:500;color:#131417}
.ch-jobs .jb-id{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.ch-jobs .jb-id b{font-size:16px;line-height:20px;font-weight:600;color:#131417}
.ch-jobs .jb-id em{font-size:13px;line-height:18px;font-style:normal;color:#6A6F7A}
.ch-jobs .jb-lv{flex:none;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px 0 9px;border-radius:99px;background:#131417;color:#fff}
.ch-jobs .jb-lv svg{width:13px;height:13px;display:block;color:#F2C94C}
.ch-jobs .jb-lv b{font-size:13px;line-height:1;font-weight:600;white-space:nowrap}
.ch-jobs .jb-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.ch-jobs .jb-tile{height:104px;border-radius:14px;padding:10px}
.ch-jobs .jb-tile div{height:100%;border-radius:9px;background:#fff;padding:10px;display:grid;grid-template-columns:18px 1fr;column-gap:7px;align-content:space-between}
.ch-jobs .jb-tile img{width:18px;height:18px;display:block;object-fit:contain}
.ch-jobs .jb-tile span{font-size:13px;line-height:18px;font-weight:500;color:#131417}
.ch-jobs .jb-tile em{grid-column:1/3;font-size:12.5px;line-height:16px;font-style:normal;font-weight:500;color:#4E525C}

/* ---------- centre: Zero ---------- */
.ch-jobs .jb-mid{position:absolute;left:424px;top:86px;width:752px;height:614px;border-radius:28px;background:#fff;
  box-shadow:0 0 0 1px rgba(19,20,23,.05),0 1px 2px rgba(19,20,23,.04),0 40px 70px -50px rgba(19,20,23,.35)}
/* Zero: one calm dark sphere. No face, no colour. A thin arc turns round it while it is doing something */
.ch-jobs .jb-orb{position:absolute;left:348px;top:46px;width:56px;height:56px;border-radius:50%;
  background:radial-gradient(circle at 33% 27%,rgba(255,255,255,.6) 0 5%,rgba(255,255,255,0) 24%),radial-gradient(circle at 50% 60%,#4C4F57 0%,#24262B 55%,#0F1012 100%);
  box-shadow:inset 0 -4px 9px rgba(0,0,0,.5),inset 0 3px 6px rgba(255,255,255,.2),0 12px 22px -12px rgba(19,20,23,.65)}
.ch-jobs .jb-orb::after{content:'';position:absolute;inset:-8px;border-radius:50%;border:1.5px solid transparent;border-top-color:#131417;opacity:0;transition:opacity .25s var(--zt-ease)}
.ch-jobs.jb-working .jb-orb::after{opacity:.75;animation:jb-spin .9s linear infinite}
@keyframes jb-spin{to{transform:rotate(360deg)}}
.ch-jobs .jb-line{position:absolute;left:76px;right:76px;top:118px;height:76px;margin:0;display:flex;align-items:center;justify-content:center;text-align:center;
  font:400 32px/38px var(--f-serif);letter-spacing:-.025em;color:#131417;text-wrap:balance;transition:opacity .17s var(--zt-ease)}
.ch-jobs .jb-line.jb-swap{opacity:0}

.ch-jobs .jb-roles{position:absolute;left:116px;right:116px;top:216px;transition:opacity .4s var(--zt-ease)}
.ch-jobs .jb-role{display:flex;align-items:center;gap:14px;height:60px;margin-bottom:8px;padding:0 14px 0 10px;border-radius:16px;background:#F6F6F8;box-shadow:inset 0 0 0 1px #E7E7EB;
  opacity:0;transform:translateY(10px);transition:opacity .4s var(--zt-ease),transform .55s var(--zt-ease),box-shadow .35s var(--zt-ease),background .35s var(--zt-ease)}
.ch-jobs .jb-role.jb-in{opacity:1;transform:none}
.ch-jobs .jb-role.jb-lit{background:#fff;box-shadow:inset 0 0 0 1.5px #131417}
.ch-jobs .jb-r-figma .jb-lg img{width:auto;height:22px}
.ch-jobs .jb-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.ch-jobs .jb-txt b{font-size:15px;line-height:20px;font-weight:600;color:#131417;white-space:nowrap}
.ch-jobs .jb-txt em{font-size:13px;line-height:18px;font-style:normal;color:#6A6F7A}
.ch-jobs .jb-st{flex:none;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:99px;background:#EDEDF0;font-size:13px;line-height:18px;color:#4E525C;white-space:nowrap;
  transition:opacity .17s var(--zt-ease),background .3s var(--zt-ease),color .3s var(--zt-ease)}

/* ch/02-world.js */
/* The world, in 3D (b12). The learner's home after "draw Zero" is the Zero world map itself: the real 3D place,
   its buildings, its road and its own cards, running in a frame under the tour (assets/world3d/world.html, a copy
   of the world map build with a small bridge added). The tour only drives it: it tells the world when to arrive,
   which view to take and when to play its own day-one entrance, and Navid speaks over that.
   Two chapters run on this one screen:
     world  (order 1)  it opens from cloud, the roles, the whole road, the first scenario opens, then the tour
     start  (order 9)  back here after the tour: press Start on the first scenario's own card */
(function () {
  'use strict';

  var BG = '#DCE9F2';                      // the world's own sky, behind it while it loads
  var SRC = 'world3d/world.html';

  function build(root, api) {
    var name = ((api.data.learner || {}).name || '').trim();
    root.innerHTML =
      '<iframe class="wd-frame" title="Your world" tabindex="-1" src="' + api.asset(SRC) + '?still=1' + (name ? '&n=' + encodeURIComponent(name) : '') + '#world-0"></iframe>' +
      '<div class="wd-block"></div>' +                                             // the tour is talking: the map is not for dragging yet
      '<button class="wd-hot" type="button" tabindex="-1" aria-label="Start your first scenario"></button>' +
      '<div class="wd-veil"></div>' +
      '<div class="wd-end">' +
        '<span class="wd-end-wm">' + (window.ZT_WORDMARK || '') + '</span>' +
        '<h2>This is where your first scenario begins.</h2>' +
        '<button class="wd-replay" type="button">Replay the first run</button>' +
      '</div>';
    var frame = root.querySelector('.wd-frame'), zroot = document.getElementById('zt-root');
    var S = root._wd = { frame: frame, hot: root.querySelector('.wd-hot'), isReady: false, waits: {}, n: 0, onStart: null, replay: null };
    S.ready = new Promise(function (res) { S.readyRes = res; });

    /* the frame draws at the window's own pixels, not at the canvas's scale, so the 3D stays sharp on any screen */
    function size() {
      var k = zroot.getBoundingClientRect().width / zroot.offsetWidth || 1, b = (window.ZT && ZT.bleed) || { x: 0, y: 0 };
      frame.style.left = (-b.x) + 'px'; frame.style.top = (-b.y) + 'px';
      frame.style.width = Math.ceil((1600 + 2 * b.x) * k) + 'px'; frame.style.height = Math.ceil((840 + 2 * b.y) * k) + 'px';
      frame.style.transform = 'scale(' + (1 / k) + ')';
      S.k = k;
    }
    size(); window.addEventListener('resize', size); S.size = size;

    S.send = function (m) { m.zt = 1; try { frame.contentWindow.postMessage(m, '*'); } catch (e) {} };
    /* where a thing of the world stands, in the tour's own canvas pixels (null when it is not on screen) */
    S.rect = function (sel) {
      return new Promise(function (res) {
        var id = ++S.n; S.waits[id] = res; S.send({ cmd: 'rect', id: id, sel: sel });
        setTimeout(function () { if (S.waits[id]) { delete S.waits[id]; res(null); } }, 700);
      });
    };
    window.addEventListener('message', function (e) {
      var m = e.data || {}; if (!m.zwm || e.source !== frame.contentWindow) return;
      if (m.ev === 'ready') { S.isReady = true; S.readyRes(true); }
      else if (m.ev === 'rect' && S.waits[m.id]) {
        var f = S.waits[m.id]; delete S.waits[m.id];
        if (!m.rect) { f(null); return; }
        var zr = zroot.getBoundingClientRect(), fr = frame.getBoundingClientRect(), k = S.k || 1;
        f({ x: (fr.left + m.rect[0] - zr.left) / k, y: (fr.top + m.rect[1] - zr.top) / k, w: m.rect[2] / k, h: m.rect[3] / k });
      }
      else if (m.ev === 'start') { if (S.onStart) S.onStart(); }
      else if (m.ev === 'error') console.error('[zt] world3d', m.msg);
    });
    S.hot.addEventListener('click', function () { if (S.onStart) S.onStart(); });
    root.querySelector('.wd-replay').addEventListener('click', function () { if (S.replay) S.replay(); });
    return S;
  }

  /* 1 · your world */
  ZT.chapter({
    id: 'world', order: 1, steps: ['world'], tone: 'dark', bg: BG, window: false, persist: true, header: false, onmap: true,

    mount: function (root, api) {
      var S = build(root, api);
      /* opened straight on the world (a jump, or behind the tour's pop-up): it is simply there, at rest */
      if (api.startAt) root.classList.add('wd-there');
    },

    run: async function (api) {
      var root = api.root, S = root._wd, did = {};
      function on(text, re, key) { if (did[key] || !re.test(text || '')) return false; did[key] = 1; return true; }
      root.classList.add('wd-there');
      api.guide.home({ role: 'Founder of Zero' });
      await Promise.race([S.ready, api.wait(6000)]);
      /* reached without the zero (a jump): it still opens from cloud, the way it does after the zero */
      if (!root.classList.contains('wd-opened')) { root.classList.add('wd-opened'); S.send({ cmd: 'arrive', ms: 2600 }); await api.wait(1500); }
      await api.wait(900);
      await api.say('N3');

      /* the roles, by the world's own levels panel. Then the whole road, from above: every scenario on it */
      await api.say('N4', { onSeg: function (i, text) {
        if (on(text, /roles/i, 'roles')) S.send({ cmd: 'go', step: 'world-0', opts: { levels: true } });
        if (on(text, /scenarios/i, 'road')) S.send({ cmd: 'go', step: 'place' });
      } });
      if (!did.road) S.send({ cmd: 'go', step: 'place' });
      await api.wait(350);

      /* skill points, by the world's own day-one entrance: Zero's building pays the first ones, the level shows,
         the road runs to the first company, and its scenario opens */
      await api.say('N5', { onSeg: function (i) { if (i === 0 && !did.enter) { did.enter = 1; S.send({ cmd: 'go', step: 'world-0', enter: true, wait: 300 }); } } });
      if (!did.enter) { did.enter = 1; S.send({ cmd: 'go', step: 'world-0', enter: true, wait: 0 }); }

      await api.say('W1');
      await api.wait(900);                                   // the first scenario's card has opened by now: the tour starts over it
    }
  });

  /* 9 · back in the world: start the first scenario, on its own card */
  ZT.chapter({
    id: 'start', order: 9, steps: ['start'], tone: 'dark', bg: BG, window: false, reuse: 'world',

    enter: function (root, api) {
      var S = root._wd; root.classList.add('wd-there', 'wd-opened'); root.classList.remove('wd-go', 'wd-over', 'wd-hot-on');
      if (S && S.size) S.size();
    },

    run: async function (api) {
      var root = api.root, S = root._wd, started = false, onGo = null;
      api.onExit(function () { S.onStart = null; S.replay = null; root.classList.remove('wd-hot-on'); });
      await Promise.all([api.guide.home({ role: 'Founder of Zero' }), api.wait(700)]);
      await Promise.race([S.ready, api.wait(6000)]);
      S.send({ cmd: 'go', step: 'focus' });                  // beside the first company, its card open (also when the tour was left early)

      S.onStart = function () { if (started) return; started = true; if (onGo) onGo(); };
      if (!api.skipped) await api.say('E2'); else await api.wait(1800);

      /* the card's own Start button is the thing to press. A clear button of the tour's sits exactly on it */
      var r = null;
      for (var i = 0; i < 12 && !r; i++) { r = await S.rect('.sh-go.wd-start'); if (!r) await api.wait(300); }
      if (r) { S.hot.style.left = r.x + 'px'; S.hot.style.top = r.y + 'px'; S.hot.style.width = r.w + 'px'; S.hot.style.height = r.h + 'px'; root.classList.add('wd-hot-on'); }
      await api.turn({ badge: 'Your turn', text: 'Click <b>Start</b>', tip: 'Click <b>Start</b>', target: r ? S.hot : null, pad: 5, radius: 18,
        until: function (done) { if (started) api.later(200, done); else onGo = done; },
        auto: function () { return r ? api.click(S.hot) : (S.onStart(), Promise.resolve()); } });
      api.clearRings(); api.cursor.hide();
      root.classList.remove('wd-hot-on');

      /* going in */
      root.classList.add('wd-go'); api.bg('#1E1E1E'); api.sfx('whoosh');
      await api.wait(950);
      /* the prototype's honest last state. Nothing follows it, so this run never resolves. */
      api.bare(true); api.guide.hide();
      S.replay = function () { S.replay = null; api.restart(); };
      root.classList.add('wd-over');
      await new Promise(function () {});
    }
  });
})();

      /* ---------- F1 · the project is done ---------- */
      root.classList.add('pf-hoo-in');
      await api.say('F1', { onSeg: function (i, text) {
        if (on(text, /done/i, 'done')) api.later(Math.max(120, at('F1', 'done') - at('F1', 'Your project') - 260), function () { root.classList.add('pf-hoo-done'); api.sfx('good'); });
      } });
      root.classList.add('pf-hoo-done');
      await api.wait(450);

      /* ---------- F2 · it sits on the portfolio, and every project after it is added ---------- */
      await api.say('F2', { onSeg: function (i, text) {
        if (on(text, /portfolio/i, 'place')) api.later(200, function () { place(); });
        if (on(text, /every project/i, 'more')) { place(true); if (!level) levelUp(true); added(); }
      } });
      place(true);
      if (!moreDone) { if (!level) levelUp(true); added(true); }
      else await api.wait(1500);                             // the last card and its role land just after the line ends
      await api.wait(900);
    }
  });
})();

/* ch/09-jobs.js */
/* 8b · the job portal step. Light and off-white, in the job portal's own language, and laid out the way the
   designer described it: the portfolio on the left, Zero (the AI) in the centre, what is happening on the right.
   It is the tour's own picture of the portal, not a copy of an app screen (the recruiter portal is not final),
   drawn at the scale of the real screens around it. One thing happens per sentence:
     H1  the portfolio goes out to companies, and the roles that are open for it arrive
     H2  Zero applies with you: the one thing the learner does here
     H3  companies write back, an interview is booked, one of them hires */
(function () {
  'use strict';

  var PROJECTS = [
    { co: 'Airbnb',   t: 'Host cancellations',      logo: 'img/logo-airbnb.svg',   tint: '#FF5A5F' },
    { co: 'DoorDash', t: 'Delivery time promise',   logo: 'img/logo-doordash.svg', tint: '#FF3008' },
    { co: 'Netflix',  t: 'Offline recommendations', logo: 'img/logo-netflix.svg',  tint: '#E50914' },
    { co: 'Spotify',  t: 'Early churn analysis',    logo: 'img/logo-spotify.svg',  tint: '#1ED760' }
  ];
  var ROLES = [
    { k: 'shopify', co: 'Shopify', role: 'Junior Business Analyst', logo: 'img/logo-shopify.svg' },
    { k: 'notion',  co: 'Notion',  role: 'Business Analyst',        logo: 'img/logo-notion.svg' },
    { k: 'figma',   co: 'Figma',   role: 'Product Analyst',         logo: 'img/logo-figma.svg' },
    { k: 'stripe',  co: 'Stripe',  role: 'Senior Business Analyst', logo: 'img/logo-stripe.svg' }
  ];
  var HIRE = 1, SEEN = 2;                         // Notion makes the offer, Figma only looks
  var ROW = 64, KEEP = 7;                         // the feed: one row every 64px, and how many it holds

  var STAR = '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 1.6l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.4l-3.8 2 .7-4.3-3.1-3 4.3-.6z"/></svg>';
  var TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 12.5l4.2 4.2L18.5 7.8"/></svg>';

  /* small paper pieces that fly out from behind a thing, once. Seeded, so every run looks the same */
  function pieces(n, seed, reach) {
    var out = '', s = seed;
    function rnd() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }
    for (var i = 0; i < n; i++) {
      var a = (i / n) * Math.PI * 2 + (rnd() - .5) * .5, d = reach * (.62 + rnd() * .5);
      out += '<i class="jb-p' + (i % 4) + '" style="--x:' + (Math.cos(a) * d * 1.25).toFixed(0) + 'px;--y:' + (Math.sin(a) * d * .82 - 24).toFixed(0) + 'px;--r:' + ((rnd() - .5) * 540).toFixed(0) + 'deg;--d:' + (rnd() * .09).toFixed(2) + 's"></i>';
    }
    return out;
  }

  function build(root, api) {
    var me = api.data.learner || {}, name = me.name || 'You', init = name.charAt(0).toUpperCase();
    root.innerHTML =
      /* left: the portfolio */
      '<div class="jb-left"><p class="jb-lab">Your portfolio</p>' +
        '<div class="jb-pf"><div class="jb-who"><span class="jb-av">' + init + '</span><span class="jb-id"><b>' + name + '</b><em>' + (me.role || 'Business Analyst') + '</em></span>' +
            '<span class="jb-lv">' + STAR + '<b>Level ' + PROJECTS.length + '</b></span></div>' +
          '<div class="jb-grid">' + PROJECTS.map(function (p) {
            return '<div class="jb-tile" style="background:linear-gradient(150deg,' + p.tint + '38,' + p.tint + '66)"><div><img alt="" draggable="false" src="' + api.asset(p.logo) + '"><span>' + p.co + '</span><em>' + p.t + '</em></div></div>';
          }).join('') + '</div></div></div>' +

      /* centre: Zero, one line from it, and what that line is about */
      '<div class="jb-mid">' +
        '<span class="jb-orb"></span>' +
        '<h2 class="jb-line"></h2>' +
        '<div class="jb-roles">' + ROLES.map(function (r) {
          return '<div class="jb-role jb-r-' + r.k + '"><span class="jb-lg"><img alt="" draggable="false" src="' + api.asset(r.logo) + '"></span>' +
            '<span class="jb-txt"><b>' + r.role + '</b><em>' + r.co + '</em></span><span class="jb-st"><i>' + TICK + '</i><span>Open</span></span></div>';
        }).join('') + '</div>' +
        '<button class="jb-apply" type="button">Apply to ' + ROLES.length + ' roles</button>' +
        '<div class="jb-hire"><div class="jb-burst">' + pieces(34, 23, 300) + '</div>' +
          '<span class="jb-lg jb-hlg"><img alt="" draggable="false" src="' + api.asset(ROLES[HIRE].logo) + '"></span>' +
          '<h2>You got the job.</h2><p>' + ROLES[HIRE].role + ' at ' + ROLES[HIRE].co + '</p></div>' +
      '</div>' +

      /* right: what is happening, newest first */
      '<div class="jb-right"><p class="jb-lab">What is happening</p><div class="jb-feed"></div></div>' +
      '<i class="jb-chip"></i>';

    function q(s) { return root.querySelector(s); }
    return root._jb = { line: q('.jb-line'), roles: [].slice.call(root.querySelectorAll('.jb-role')), apply: q('.jb-apply'), feed: q('.jb-feed'), chip: q('.jb-chip'), rows: [] };
  }

  ZT.chapter({
    id: 'jobs', order: 8.5, steps: ['jobs'], window: true, tone: 'light', bg: '#F3F3F5',

    mount: function (root, api) { build(root, api); },

    run: async function (api) {
      var root = api.root, S = root._jb, did = {};
      function on(text, re, key) { if (did[key] || !re.test(text || '')) return false; did[key] = 1; return true; }
      function add(c) { root.classList.add(c); }
      /* when, inside a line, a phrase is spoken (ms from the start of the line) */
      function at(id, phrase) {
        var p = api.plan(id), low = phrase.toLowerCase();
        for (var i = 0; i < p.segs.length; i++) {
          var t = p.segs[i].text, k = t.toLowerCase().indexOf(low);
          if (k < 0) continue;
          var end = i + 1 < p.segs.length ? p.segs[i + 1].t : p.dur;
          return (p.segs[i].t + (end - p.segs[i].t) * (k / t.length)) * 1000;
        }
        return 0;
      }
      /* what Zero says, in the centre. One line at a time */
      function say(text) {
        if (S.line.textContent === text) return;
        S.line.classList.add('jb-swap');
        api.later(S.line.textContent ? 170 : 0, function () { S.line.textContent = text; S.line.classList.remove('jb-swap'); });
      }
      /* one more thing happened: it goes to the top of the list on the right, and the rest step down */
      function happen(r, html, good) {
        var el = api.h('<div class="jb-ev' + (good ? ' jb-ev-good' : '') + '"><span class="jb-lg jb-xs"><img alt="" draggable="false" src="' + api.asset(r.logo) + '"></span><span class="jb-ev-t">' + html + '</span><em>now</em></div>');
        S.rows.forEach(function (o) { var em = o.querySelector('em'); if (em) em.textContent = ''; });
        S.rows.unshift(el); S.feed.insertBefore(el, S.feed.firstChild);
        S.rows.forEach(function (o, i) { o.style.top = (i * ROW) + 'px'; if (i >= KEEP - 1) o.classList.add('jb-old'); });
        while (S.rows.length > KEEP) { var out = S.rows.pop(); if (out.parentNode) out.parentNode.removeChild(out); }
        void el.offsetWidth; el.classList.add('jb-in');
      }
      function status(i, text, cls) {
        var row = S.roles[i], st = row.querySelector('.jb-st'), sp = st.querySelector('span');
        st.classList.add('jb-swap');
        api.later(170, function () { sp.textContent = text; row.className = row.className.replace(/\bjb-s-\w+/g, '').trim() + ' jb-s-' + cls; st.classList.remove('jb-swap'); });
      }
      /* a small copy of the portfolio travels: to Zero, or from Zero out to the companies */
      function fly(x0, y0, x1, y1) {
        var c = S.chip.cloneNode(false); root.appendChild(c);
        c.style.transform = 'translate(' + x0 + 'px,' + y0 + 'px) scale(.7)'; void c.offsetWidth;
        c.classList.add('jb-go'); c.style.transform = 'translate(' + x1 + 'px,' + y1 + 'px) scale(1)';
        api.later(620, function () { if (c.parentNode) c.parentNode.removeChild(c); });
      }
      function work(onoff) { root.classList.toggle('jb-working', onoff); }

      api.guide.home({ role: 'Founder of Zero' });
      await api.wait(60);
      add('jb-here');
      await api.wait(380);

      /* ---------- H1 · the portfolio goes out to companies, and the roles open for it arrive ---------- */
      function out() {
        say('Sending your portfolio to four companies.'); work(true); api.sfx('whoosh');
        fly(215, 250, 789, 152);                                                    // the portfolio goes to Zero
        ROLES.forEach(function (r, i) {
          api.later(620 + i * 300, function () { fly(789, 152, 1223, 150); });       // and Zero sends it on
          api.later(980 + i * 300, function () { happen(r, 'Sent to <b>' + r.co + '</b>'); api.sfx('tick'); });
        });
      }
      function open() {
        work(false); say('Four roles are open for you.'); add('jb-rolesin');
        S.roles.forEach(function (r, i) { api.later(120 + i * 240, function () { r.classList.add('jb-in'); api.sfx('tick'); }); });
      }
      await api.say('H1', { onSeg: function (i, text) {
        if (on(text, /companies/i, 'out')) out();
        if (on(text, /roles open/i, 'open')) api.later(Math.max(300, at('H1', 'the more roles') - at('H1', 'The more projects') - 350), open);
      } });
      if (!did.open) open();
      S.roles.forEach(function (r) { r.classList.add('jb-in'); });

      /* ---------- H2 · we apply with you. The one thing the learner does here ---------- */
      var applied = false, onApply = null;
      S.apply.addEventListener('click', function () { if (applied || !root.classList.contains('jb-ask')) return; applied = true; if (onApply) onApply(); });
      await api.say('H2', { onSeg: function (i, text) {
        if (on(text, /we apply/i, 'ask')) api.later(Math.max(150, at('H2', 'we apply') - 250), function () { add('jb-ask'); api.sfx('pop'); });
      } });
      add('jb-ask');
      await api.turn({ badge: 'Try this', text: 'Click <b>Apply</b>', tip: 'Click <b>Apply</b>', side: 'bottom', target: S.apply, pad: 6, radius: 28,
        until: function (done) { if (applied) api.later(200, done); else onApply = done; },
        auto: function () { return api.click(S.apply); } });
      api.clearRings(); api.cursor.hide();
      add('jb-applied'); work(true); say('Applying to four roles.');
      ROLES.forEach(function (r, i) {
        api.later(260 + i * 260, function () { status(i, 'Applied', 'applied'); happen(r, 'Applied to <b>' + r.co + '</b>', true); api.sfx('tick'); });
      });
      await api.wait(1500);
      work(false); say('Applied to four roles.');
      await api.wait(500);

      /* ---------- H3 · companies write back, you interview, you get hired ---------- */
      var hire = ROLES[HIRE], seen = ROLES[SEEN];
      function wrote() {
        status(SEEN, 'Viewed', 'seen'); happen(seen, '<b>' + seen.co + '</b> viewed your portfolio'); api.sfx('pop');
        api.later(620, function () { status(HIRE, 'Wants to meet', 'hot'); happen(hire, '<b>' + hire.co + '</b> wants to meet you'); say(hire.co + ' wants to meet you.'); api.sfx('pop'); });
      }
      function meet() { status(HIRE, 'Interview, Thu 2:00 pm', 'hot'); S.roles[HIRE].classList.add('jb-lit'); happen(hire, 'Interview with <b>' + hire.co + '</b>, Thu 2:00 pm'); say('Your interview is booked.'); api.sfx('soft'); }
      function hired() { if (root.classList.contains('jb-hired')) return; add('jb-hired'); happen(hire, 'Offer from <b>' + hire.co + '</b>', true); api.sfx('good'); }
      await api.say('H3', { onSeg: function (i, text) {
        if (!on(text, /write back/i, 'h3')) return;
        api.later(Math.max(100, at('H3', 'companies write back') - 300), wrote);
        api.later(Math.max(1500, at('H3', 'you interview') - 150), meet);
        api.later(Math.max(2900, at('H3', 'you get hired') - 100), hired);
      } });
      hired();
      await api.wait(900);

      /* ---------- E1 · so that's how Zero works ---------- */
      await api.say('E1');
      await api.wait(700);
    }
  });
})();
