<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>How Zero works</title>
<link rel="icon" href="zero-tutorial-assets-b14/img/zero-mark.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,100..1000&display=swap">
<style>
/* core.css */
/* ZERO overview tour · core. Everything the tour itself draws is prefixed zt-.
   Chapter screens live under .zt-ch.ch-<id> and must scope their own rules there. */
@font-face{font-family:'STK Bureau Serif';src:url('zero-tutorial-assets-b14/fonts/STKBureau-SerifBook.otf') format('opentype');font-weight:400;font-display:swap}
@font-face{font-family:'STK Bureau Serif';src:url('zero-tutorial-assets-b14/fonts/STKBureau-SerifMedium.otf') format('opentype');font-weight:500;font-display:swap}
@font-face{font-family:'PP Supply Mono';src:url('zero-tutorial-assets-b14/fonts/PPSupplyMono-Regular.otf') format('opentype');font-weight:400;font-display:swap}

:root{
  --zt-ease:cubic-bezier(.625,.05,0,1);
  --zt-green:#49BA61; --zt-green-deep:#2E9A48; --zt-green-ink:#06210f;
  --f-serif:'STK Bureau Serif',Georgia,serif;
  --f-sans:'Google Sans Flex','Google Sans',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-mono:'PP Supply Mono','SFMono-Regular',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0E0E10}
body{font-family:var(--f-sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;transition:background .6s var(--zt-ease)}
button{font-family:inherit}

/* One fixed design canvas, scaled to fit. Chapters draw in 1600 x 840 px.
   The tour's own chrome takes its values from the onboarding people do before they download the
   app (the same dark page, field, text steps and pills) and its made buttons from the Zero site
   (the key: a gradient face, a light top edge, a dark bottom edge, a hairline). */
#zt-root{position:fixed;left:0;top:0;width:1600px;height:840px;transform-origin:0 0;
  --page:#0E0E10; --shell:#17171A; --card:#1C1C1F; --field:#222226; --wash:#1A1A1D;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.05);
  --tx:#F4F4F3; --tx-2:#A6A6AC; --tx-3:#77777E; --tx-4:#4A4A51; --ink:#F4F4F3; --on-ink:#131315;
  --key-dark:linear-gradient(#303432,#181A19);
  --key-dark-sh:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -3px 0 rgba(0,0,0,.5),0 0 0 1px #121413,0 14px 24px -14px rgba(18,20,19,.5);
  --key-light:linear-gradient(#FFFFFF,#EDEDEA);
  --key-light-sh:inset 0 1px 0 #fff,inset 0 -3px 0 rgba(0,0,0,.1),0 0 0 1px rgba(0,0,0,.18),0 14px 24px -14px rgba(0,0,0,.5);
  /* older names, still read by the chapters */
  --zt-ink:#F4F4F3; --zt-ink-2:#A6A6AC; --zt-ink-3:#77777E; --zt-chip:#222226; --zt-chip-h:#2C2C31; --zt-ink-inv:#131315}
#zt-root[data-tone="light"]{--zt-ink:#111113; --zt-ink-2:#63636a; --zt-ink-3:#9a9aa0; --zt-chip:#F0F0EE; --zt-chip-h:#E6E6E3; --zt-ink-inv:#fff}

/* Two layers. #zt-full holds the full-screen screens (first run, the world).
   The player sits on top of the world: 16:9, a glass frame with its hairlines, the picture, and one bar. */
#zt-full{position:absolute;inset:0;overflow:visible}   /* a chapter still clips itself; one that fills the window opts out and runs to --zt-bx / --zt-by */
#zt-playerbg{position:absolute;z-index:9;left:88px;top:16px;width:1424px;height:808px;border-radius:30px;
  background:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(24px) saturate(1.3);backdrop-filter:blur(24px) saturate(1.3);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.13),inset 0 1px 0 rgba(255,255,255,.28),0 0 0 1px rgba(0,0,0,.55),0 50px 130px -30px rgba(0,0,0,.85),0 14px 36px -10px rgba(0,0,0,.5);
  opacity:0;transform:translateY(18px) scale(.955);pointer-events:none;transition:opacity .42s var(--zt-ease),transform .7s var(--zt-ease)}
#zt-playerbg::after{content:'';position:absolute;inset:8px;border-radius:22px;background:var(--page);box-shadow:0 0 0 1px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.07)}
#zt-root.zt-windowed #zt-playerbg{opacity:1;transform:none}
#zt-win{position:absolute;z-index:10;left:96px;top:24px;width:1408px;height:692px;border-radius:22px 22px 0 0;overflow:hidden;background:#1E1E1E;
  opacity:0;transform:translateY(18px) scale(.955);transform-origin:50% 396px;pointer-events:none;
  transition:opacity .42s var(--zt-ease),transform .7s var(--zt-ease),background .5s var(--zt-ease)}
#zt-root.zt-windowed #zt-win{opacity:1;transform:none;pointer-events:auto}
#zt-stage{position:absolute;left:0;top:0;width:1600px;height:840px;transform:scale(.88);transform-origin:0 0;overflow:hidden}
#zt-full .zt-ch{transition:opacity .5s var(--zt-ease),transform .72s var(--zt-ease),filter .6s var(--zt-ease)}
#zt-full .zt-ch.zt-behind{filter:blur(7px) brightness(.5) saturate(.85);transform:scale(1.035);pointer-events:none}
/* (the world behind the player used to fade out at its sides to hide the bars; it fills the window now) */
/* compare mode (?full=1): the same screens fill the canvas and nothing sits behind them */
#zt-root.zt-fullmode #zt-win{left:0;top:0;width:1600px;height:840px;border-radius:0;box-shadow:none}
#zt-root.zt-fullmode #zt-playerbg,#zt-root.zt-fullmode #zt-veil{display:none!important}
#zt-root.zt-fullmode #zt-stage{transform:none}
#zt-root.zt-fullmode #zt-full .zt-ch.zt-behind{visibility:hidden}

/* ---------- the header of a full-screen screen: the wordmark, as in the onboarding ---------- */
.zt-logo{position:absolute;z-index:82;left:22px;top:22px;height:40px;padding:0 17px;display:flex;align-items:center;border-radius:999px;background:var(--field);color:var(--tx);
  opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .45s var(--zt-ease),transform .55s var(--zt-ease),background .4s,color .4s}
.zt-logo svg{height:13px;width:auto;display:block}
#zt-root.zt-hdr:not(.zt-windowed):not(.zt-bare) .zt-logo{opacity:1;transform:none}
/* on the world the wordmark stands on the map, white, as it does in the app */
#zt-root.zt-onmap .zt-logo{left:32px;top:28px;height:auto;padding:0;background:none;color:#fff;filter:drop-shadow(0 2px 10px rgba(0,0,0,.4))}
#zt-root.zt-onmap .zt-logo svg{height:24px}

/* ---------- skill points ---------- */
.zt-pts{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px 0 13px;border-radius:999px;background:var(--field);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
  font:400 13px/1 var(--f-sans);letter-spacing:-.01em;color:var(--tx);white-space:nowrap}
.zt-pts svg{width:15px;height:15px;color:#F2C94C;flex:none}
.zt-pts .zt-xp{width:19px;height:19px;flex:none;display:block;object-fit:contain;margin:0 -1px 0 -2px}   /* the app's own skill points star */
.zt-pts b{font:600 14.5px/1 var(--f-sans);font-variant-numeric:tabular-nums;min-width:1ch;text-align:right}
.zt-pts em{font-style:normal;color:var(--tx-3)}
.zt-pts.zt-bump{animation:zt-bump .5s var(--zt-ease)}
@keyframes zt-bump{35%{transform:scale(1.08);background:rgba(242,201,76,.26)}100%{transform:none}}
.zt-fly{position:absolute;z-index:90;display:flex;align-items:baseline;gap:7px;padding:9px 14px;border-radius:999px;background:#F2C94C;color:#2a2105;white-space:nowrap;pointer-events:none;
  font:400 13px/1 var(--f-sans);letter-spacing:-.01em;box-shadow:0 10px 30px rgba(0,0,0,.35);
  opacity:0;transform:translate(-50%,-50%) translateY(10px) scale(.7);
  transition:opacity .25s var(--zt-ease),transform .45s var(--zt-ease),left .7s var(--zt-ease),top .7s var(--zt-ease)}
.zt-fly b{font-weight:700;font-size:15px}
.zt-fly.zt-on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.zt-fly.zt-go{opacity:.9;transform:translate(-50%,-50%) scale(.62)}


/* chapter screens: a blur morph, never a hard cut */
.zt-ch{position:absolute;inset:0;overflow:hidden;opacity:0;transform:scale(1.012);filter:blur(12px);
  transition:opacity .5s var(--zt-ease),transform .72s var(--zt-ease),filter .5s var(--zt-ease)}
.zt-ch.zt-in{opacity:1;transform:none;filter:none}
.zt-ch.zt-exit{opacity:0;transform:scale(.988);filter:blur(12px);pointer-events:none}

/* ---------- the guide: one face that changes seat ---------- */
.zt-guide{position:absolute;z-index:60;left:28px;top:778px;width:48px;height:48px;border-radius:50%;pointer-events:none;
  transition:left .76s var(--zt-ease),top .76s var(--zt-ease),width .76s var(--zt-ease),height .76s var(--zt-ease),border-radius .76s var(--zt-ease),opacity .4s var(--zt-ease)}
.zt-guide.zt-instant{transition:none}
.zt-guide.zt-hidden{opacity:0}
.zt-g-photo{position:absolute;inset:0;border-radius:inherit;overflow:hidden;background:#2b2b2b}
.zt-g-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:opacity .5s var(--zt-ease)}
.zt-g-photo .zt-wide{opacity:0;object-position:68% 20%}
.zt-guide[data-shape="tile"] .zt-wide{opacity:1}
.zt-guide[data-shape="tile"] .zt-face{opacity:0}
.zt-g-ring{position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 0 rgba(255,255,255,0);transition:box-shadow .16s linear}
.zt-guide.zt-speaking .zt-g-ring{box-shadow:0 0 0 calc(2px + var(--amp,0) * 4px) rgba(255,255,255,calc(.7 + var(--amp,0) * .3))}
.zt-g-tag{position:absolute;white-space:nowrap;display:flex;flex-direction:column;gap:3px;color:var(--zt-ink);
  letter-spacing:-.01em;transition:opacity .35s var(--zt-ease)}
.zt-g-tag b{font:600 14px/1.1 var(--f-sans)}
.zt-g-tag span{font:400 12.5px/1.1 var(--f-sans);color:var(--zt-ink-2);display:inline-block;transition:opacity .25s,filter .25s,transform .35s var(--zt-ease)}
.zt-g-tag span.zt-swap{opacity:0;filter:blur(5px);transform:translateY(4px)}
.zt-guide[data-tag="right"] .zt-g-tag{left:calc(100% + 12px);top:50%;transform:translateY(-50%)}
.zt-guide[data-tag="below"] .zt-g-tag{top:calc(100% + 14px);left:50%;transform:translateX(-50%);align-items:center;text-align:center}
.zt-guide[data-tag="below"] .zt-g-tag b{font-size:17px}
.zt-guide[data-tag="below"] .zt-g-tag span{font-size:14px}
.zt-guide[data-tag="inside"] .zt-g-tag{left:16px;bottom:14px;flex-direction:row;align-items:baseline;gap:8px;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.55)}
.zt-guide[data-tag="inside"] .zt-g-tag span{color:rgba(255,255,255,.78)}
.zt-guide[data-tag="none"] .zt-g-tag{opacity:0}
.zt-guide.zt-flying .zt-g-tag{opacity:0;transition-duration:.12s}


/* ---------- Navid's pointer: white, with a hairline, so it reads on paper and on the dark ---------- */
.zt-cursor{position:absolute;z-index:72;left:0;top:0;--x:60px;--y:790px;transform:translate(var(--x),var(--y));opacity:0;pointer-events:none;
  transition:transform .72s var(--zt-ease),opacity .28s var(--zt-ease)}
.zt-cursor.zt-on{opacity:1}
.zt-cursor svg{display:block;width:24px;height:24px;filter:drop-shadow(0 3px 7px rgba(0,0,0,.45))}
.zt-cursor em{position:absolute;left:17px;top:20px;font:600 11.5px/1 var(--f-sans);font-style:normal;letter-spacing:-.005em;white-space:nowrap;
  background:var(--key-light);color:#131315;padding:6px 9px 6px;border-radius:4px 11px 11px 11px;box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(0,0,0,.2),0 6px 14px -4px rgba(0,0,0,.45)}
.zt-cursor.zt-tap svg{animation:zt-tap .36s var(--zt-ease)}
@keyframes zt-tap{40%{transform:scale(.8)}100%{transform:none}}
/* the ring: a white line over a dark one, so one ring works on every screen */
.zt-ink{position:absolute;inset:0;z-index:66;pointer-events:none;overflow:visible}
.zt-ink g{transition:opacity .35s}
.zt-ink rect{fill:none;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .62s var(--zt-ease)}
.zt-ink rect.zt-r-under{stroke:rgba(0,0,0,.42);stroke-width:5}
.zt-ink rect.zt-r-over{stroke:#fff;stroke-width:2.25}
.zt-ink g.zt-drawn rect{stroke-dashoffset:0}
#zt-root[data-ptone="light"] .zt-ink rect.zt-r-over{stroke:#111113}
#zt-root[data-ptone="light"] .zt-ink rect.zt-r-under{stroke:rgba(255,255,255,.75)}
.zt-ink g.zt-pulse{animation:zt-pulse 1.5s ease-in-out .7s infinite}
.zt-ink g.zt-gone{opacity:0}
@keyframes zt-pulse{50%{opacity:.4}}
.zt-ripple{position:absolute;z-index:71;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.3);pointer-events:none;animation:zt-ripple .55s var(--zt-ease) forwards}
@keyframes zt-ripple{to{transform:scale(4.4);opacity:0}}

/* ---------- the prompt beside the thing to act on: a white key ---------- */
.zt-tip{position:absolute;z-index:71;left:0;top:0;display:flex;align-items:center;height:38px;padding:0 14px;border-radius:12px;white-space:nowrap;
  background:var(--key-light);color:#131315;box-shadow:var(--key-light-sh);font:500 14px/1 var(--f-sans);letter-spacing:-.01em;
  opacity:0;transform:translateY(6px) scale(.96);pointer-events:none;transition:opacity .28s var(--zt-ease),transform .5s var(--zt-ease)}
.zt-tip.zt-on{opacity:1;transform:none}
/* a tip that can be clicked does the thing for the learner. It is a key: it lifts, and it sets down when pressed */
.zt-tip.zt-can{pointer-events:auto;cursor:pointer}
.zt-tip.zt-can.zt-on:hover{transform:translateY(-2px)}
.zt-tip.zt-can.zt-on:active,.zt-tip.zt-went.zt-on{transform:translateY(1px)}
.zt-tip.zt-went{pointer-events:none;opacity:.55}
.zt-tip>b{font:400 14px/1 var(--f-sans);color:#77777E;padding-right:10px;margin-right:10px;box-shadow:1px 0 0 rgba(0,0,0,.12)}
.zt-tip span b{font-weight:600}
.zt-tip kbd{font:500 12px/1 var(--f-sans);border:1px solid rgba(0,0,0,.18);border-bottom-width:2px;border-radius:6px;padding:3px 6px 4px;margin:0 2px;background:#fff}
.zt-tip i{position:absolute;left:var(--ax,50%);width:11px;height:11px;margin-left:-5.5px;background:#F1F1EE;transform:rotate(45deg);border-radius:2px;box-shadow:1px 1px 0 rgba(0,0,0,.2)}
.zt-tip[data-side=top] i{bottom:-5px}
.zt-tip[data-side=bottom] i{top:-5px;background:#fff;box-shadow:-1px -1px 0 rgba(0,0,0,.16)}

/* ---------- the tour's own controls ----------
   On a full-screen screen they float: Navid bottom left, what he says bottom centre, sound in a corner.
   In the player they are its bar. */
.zt-dock{position:absolute;inset:0;z-index:80;pointer-events:none}
.zt-home{position:absolute;left:28px;bottom:24px;width:48px;height:48px;border-radius:50%}
.zt-center{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:820px;min-height:48px;display:grid;place-items:end center}
.zt-center>*{grid-area:1/1}
.zt-cc{max-width:760px;font:400 16px/1.4 var(--f-sans);letter-spacing:-.012em;color:var(--tx);text-align:center;text-wrap:balance;
  background:rgba(14,14,16,.74);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);padding:11px 18px 12px;border-radius:16px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset 0 1px 0 rgba(255,255,255,.08),0 14px 34px -12px rgba(0,0,0,.6);
  opacity:0;transform:translateY(6px);transition:opacity .22s var(--zt-ease),transform .36s var(--zt-ease)}
.zt-cc.zt-on{opacity:1;transform:none}
#zt-root.zt-nocc .zt-cc{display:none}
.zt-right{position:absolute;right:22px;bottom:50px;display:flex;align-items:center;gap:8px;pointer-events:auto;transition:opacity .4s}
#zt-root.zt-ctltop:not(.zt-windowed) .zt-right{bottom:auto;top:19px}

/* a round control, 44px, as in the onboarding's header */
.zt-ib{appearance:none;border:0;flex:none;width:44px;height:44px;border-radius:999px;background:var(--field);color:var(--tx-2);display:grid;place-items:center;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);font:600 13px/1 var(--f-sans);font-variant-numeric:tabular-nums;letter-spacing:0;
  transition:background .2s,color .2s,transform .22s cubic-bezier(.2,.8,.3,1)}
.zt-ib:hover{background:#2C2C31;color:var(--tx)}
.zt-ib:active{transform:scale(.94)}
.zt-ib svg{width:17px;height:17px;display:block;grid-area:1/1}
.zt-ib.zt-off{color:var(--tx-4)}
.zt-spd.zt-on{background:var(--ink);color:var(--on-ink)}
#zt-root.zt-onmap:not(.zt-windowed) .zt-ib{background:rgba(14,14,16,.6);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.zt-play .zt-i-play{display:none}
#zt-root.zt-paused .zt-play .zt-i-play{display:block}
#zt-root.zt-paused .zt-play .zt-i-pause{display:none}

/* where you are: the step's name, and a dot for each step. The one you are in is a dash that fills as it plays */
.zt-steps{display:inline-flex;align-items:center;gap:12px;height:44px;padding:0 18px;border-radius:999px;background:var(--field);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);white-space:nowrap}
.zt-step{font:400 13px/1 var(--f-sans);letter-spacing:-.01em;color:var(--tx)}
.zt-dots{display:flex;align-items:center;gap:6px}
.zt-dots i{position:relative;width:4px;height:4px;border-radius:99px;background:var(--tx-4);overflow:hidden;transition:width .5s var(--zt-ease),background .4s}
.zt-dots i.zt-done{background:var(--tx-2)}
.zt-dots i.zt-now{width:22px}
.zt-dots i.zt-now::after{content:'';position:absolute;inset:0;background:var(--tx);transform-origin:0 50%;transform:scaleX(var(--p,0));transition:transform .12s linear}

/* only the player has steps, speed, play and a way out. A full-screen screen has sound, nothing more */
#zt-root:not(.zt-windowed) .zt-steps,#zt-root:not(.zt-windowed) .zt-pts,#zt-root:not(.zt-windowed) .zt-play,#zt-root:not(.zt-windowed) .zt-spd,#zt-root:not(.zt-windowed) .zt-skip,
#zt-root.zt-nostep .zt-steps{display:none}
#zt-root.zt-bare .zt-right,#zt-root.zt-bare .zt-center{opacity:0;pointer-events:none}
#zt-root.zt-fullmode .zt-pts,#zt-root.zt-fullmode .zt-steps,#zt-root.zt-fullmode .zt-play,#zt-root.zt-fullmode .zt-spd,#zt-root.zt-fullmode .zt-skip{display:inline-flex}
#zt-root.zt-fullmode .zt-ib{display:grid}

/* ---------- the player's bar ---------- */
#zt-root.zt-windowed:not(.zt-fullmode) .zt-dock{inset:auto;left:96px;top:716px;width:1408px;height:100px}
#zt-root.zt-windowed:not(.zt-fullmode) .zt-dock::before{content:'';position:absolute;left:0;right:0;top:0;height:1px;background:rgba(255,255,255,.07)}
#zt-root.zt-windowed:not(.zt-fullmode) .zt-home{left:26px;top:26px;bottom:auto}
#zt-root.zt-windowed:not(.zt-fullmode) .zt-guide[data-tag="right"] .zt-g-tag{opacity:0}
#zt-root.zt-windowed:not(.zt-fullmode) .zt-center{left:92px;top:0;bottom:auto;transform:none;width:640px;height:100px;min-height:0;place-items:center start}
#zt-root.zt-windowed:not(.zt-fullmode) .zt-cc{background:none;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none;padding:0;border-radius:0;text-align:left;max-width:640px;text-wrap:pretty}
#zt-root.zt-windowed:not(.zt-fullmode) .zt-right{right:26px;top:28px;bottom:auto}

/* ---------- what to do now. In the bar it is a plain line: a waiting dot, the ask, how. No box. ---------- */
.zt-turn{pointer-events:auto;display:flex;align-items:center;gap:12px;white-space:nowrap;font:400 16px/1.2 var(--f-sans);letter-spacing:-.012em;color:var(--tx-2);
  opacity:0;transform:translateY(8px);transition:opacity .28s var(--zt-ease),transform .5s var(--zt-ease)}
.zt-turn.zt-on{opacity:1;transform:none}
#zt-root:not(.zt-windowed):not(.zt-fullmode) .zt-turn{display:none}
.zt-turn .zt-badge{display:inline-flex;align-items:center;gap:10px;color:var(--tx);font-weight:500}
.zt-turn .zt-badge i{width:8px;height:8px;border-radius:50%;background:var(--tx);flex:none;animation:zt-wait 1.4s ease-in-out infinite}
@keyframes zt-wait{50%{opacity:.25;transform:scale(.7)}}
.zt-turn .zt-badge svg{width:15px;height:15px;display:none;color:var(--zt-green)}
.zt-turn.zt-ok .zt-badge i{display:none}
.zt-turn.zt-ok .zt-badge svg{display:block}
.zt-turn .zt-text b{font-weight:500;color:var(--tx)}
.zt-turn kbd{font:500 12px/1 var(--f-sans);color:var(--tx);background:var(--key-dark);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -2px 0 rgba(0,0,0,.5),0 0 0 1px #121413;border-radius:7px;padding:6px 8px 7px;margin:0 2px}
.zt-turn .zt-showme{appearance:none;border:0;cursor:pointer;height:34px;padding:0 13px;border-radius:10px;background:var(--field);color:var(--tx);font:500 13px/1 var(--f-sans);letter-spacing:-.005em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);display:none;transition:background .2s}
.zt-turn .zt-showme:hover{background:#2C2C31}
.zt-turn.zt-nudge .zt-showme{display:block}
#zt-root.zt-fullmode .zt-turn{background:rgba(14,14,16,.78);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);padding:12px 18px;border-radius:16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}

/* ---------- leaving, and the way back ---------- */
.zt-replay{display:none}
#zt-root.zt-exited .zt-replay{position:relative;display:inline-flex;align-items:center;gap:9px;appearance:none;border:0;cursor:pointer;height:44px;padding:0 18px 0 15px;border-radius:14px;
  background:var(--key-light);color:#131315;box-shadow:var(--key-light-sh);font:500 14px/1 var(--f-sans);letter-spacing:-.01em;transition:transform .22s cubic-bezier(.2,.8,.3,1)}
#zt-root.zt-exited .zt-replay svg{width:12px;height:12px;display:block}
#zt-root.zt-exited .zt-replay:hover{transform:translateY(-2px)}
#zt-root.zt-exited .zt-replay:active{transform:translateY(1px)}
.zt-replay i{display:none}

/* paused: a veil over the picture, one click carries on */
#zt-veil{display:none}
#zt-root.zt-windowed.zt-paused:not(.zt-fullmode) #zt-veil{display:grid;place-items:center;position:absolute;z-index:76;left:96px;top:24px;width:1408px;height:692px;
  border:0;border-radius:22px 22px 0 0;background:rgba(10,10,12,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);cursor:pointer}
#zt-veil i{width:84px;height:84px;border-radius:50%;background:var(--key-light);color:#131315;display:grid;place-items:center;box-shadow:var(--key-light-sh);transition:transform .22s cubic-bezier(.2,.8,.3,1)}
#zt-veil:hover i{transform:scale(1.05)}
#zt-veil svg{width:30px;height:30px;margin-left:4px}
#zt-veil span{display:none}

/* ---------- the dev control: for reviewing, never part of the product ----------
   A small key in the corner. It opens a stepper and a list of every screen, as the onboarding's does. */
.zt-dev{position:absolute;z-index:95;right:12px;bottom:10px;font-family:var(--f-sans);letter-spacing:-.01em}
.zt-dev-key{appearance:none;border:0;cursor:pointer;height:28px;padding:0 11px;border-radius:999px;background:rgba(28,28,31,.82);color:var(--tx-3);font:400 11.5px/1 var(--f-sans);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:color .2s,background .2s}
.zt-dev-key:hover{color:var(--tx);background:rgba(44,44,49,.9)}
.zt-dev-panel{display:none;position:absolute;right:0;bottom:38px;width:296px;padding:8px;border-radius:18px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line),0 18px 44px rgba(0,0,0,.55)}
.zt-dev.zt-open .zt-dev-panel{display:block}
.zt-dev-bar{display:flex;align-items:center;gap:4px;padding:4px;border-radius:999px;background:var(--wash)}
.zt-dev-nav{appearance:none;border:0;cursor:pointer;width:32px;height:32px;border-radius:999px;background:none;color:var(--tx-3);display:grid;place-items:center;transition:background .2s,color .2s}
.zt-dev-nav:hover{background:var(--field);color:var(--tx)}
.zt-dev-nav svg{width:15px;height:15px}
.zt-dev-nav.zt-flip svg{transform:rotate(180deg)}
.zt-dev-now{flex:1;text-align:center;font:400 12px/1 var(--f-sans);color:var(--tx-2);white-space:nowrap}
.zt-dev-h{margin:12px 6px 7px;font:400 11.5px/1 var(--f-sans);color:var(--tx-3)}
.zt-dev-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.zt-dev-grid button,.zt-dev-row button{appearance:none;border:0;cursor:pointer;height:34px;padding:0 11px;border-radius:10px;background:var(--wash);color:var(--tx-2);font:400 12px/1 var(--f-sans);text-align:left;white-space:nowrap;transition:background .2s,color .2s}
.zt-dev-grid button:hover,.zt-dev-row button:hover{background:var(--field);color:var(--tx)}
.zt-dev-grid button.zt-now,.zt-dev-row button.zt-on{background:var(--ink);color:var(--on-ink)}
.zt-dev-row{display:flex;gap:4px;flex-wrap:wrap}
.zt-dev-row button{text-align:center;flex:1}

/* build stamp, so every screenshot names its build */
.zt-build{display:none}

@media (prefers-reduced-motion:reduce){
  .zt-ch,.zt-guide,.zt-cursor,.zt-turn,.zt-cc{transition-duration:.01s!important}
  .zt-ink g.zt-pulse,.zt-turn .zt-badge i{animation:none}
}

/* ch/00-signin.css */
/* 0 · first run of the desktop app: sign in, welcome back with three keys, draw zero.
   One city lies under all three screens (.si-world, drawn live). It is grey on the login, asleep in the dark after
   it, and only takes its colours when the zero opens it. Type and controls are the onboarding's; the keys are the
   made button of the Zero site. */
.ch-signin{background:#0E0E10;color:#F4F4F3;font-family:var(--f-sans);letter-spacing:-.01em;transition:background 1s var(--zt-ease)}
.ch-signin.si-pale{background:#F1F0EC}
.ch-signin.si-through{background:none;transition:none}
.ch-signin.zt-ch{overflow:visible}   /* the city runs out to the window's edge */

/* the city. It holds the picture exactly where the world's camera holds it, so the opening happens in place */
.ch-signin .si-world{position:absolute;left:0;top:0;width:1600px;height:840px;display:block;opacity:0;transition:opacity .7s var(--zt-ease)}
.ch-signin .si-world.si-on{opacity:1}
.ch-signin .si-world.si-out{opacity:0;transition:opacity .42s var(--zt-ease)}
/* no WebGL: a plain grey picture on the login, a plain dark page after it */
.ch-signin .si-fb{position:absolute;left:-236px;top:-192px;width:2080px;height:1169.4px;display:none;filter:grayscale(1) contrast(.45) brightness(1.5);opacity:.3;transition:opacity .9s var(--zt-ease)}
.ch-signin.si-flat .si-fb{display:block}
.ch-signin.si-flat .si-world{display:none}
.ch-signin.si-flat.si-dark .si-fb{opacity:0}

/* one screen at a time */
.ch-signin .si-login,.ch-signin .si-wel,.ch-signin .si-draw{position:absolute;inset:0;opacity:0;pointer-events:none;
  transition:opacity .6s var(--zt-ease),transform .8s var(--zt-ease)}
.ch-signin .si-on{opacity:1;pointer-events:auto}

/* ---------- 1 · the login: the wordmark in the centre, sign in at the bottom ---------- */
.ch-signin .si-login{color:#111113}
.ch-signin.si-dark .si-login{opacity:1;pointer-events:none}
.ch-signin .si-mark{position:absolute;left:0;right:0;top:368px;display:flex;justify-content:center;color:#111113;transform-origin:50% 50%;
  transition:transform 1s var(--zt-ease),color .8s var(--zt-ease),opacity .25s var(--zt-ease)}
.ch-signin .si-mark svg{height:64px;width:auto;display:block}
.ch-signin.si-dark .si-mark{color:#F4F4F3}
.ch-signin .si-mark.si-gone{opacity:0}
.ch-signin .si-foot{position:absolute;left:0;right:0;bottom:66px;display:flex;flex-direction:column;align-items:center;gap:18px;
  transition:opacity .4s var(--zt-ease),transform .6s var(--zt-ease)}
.ch-signin.si-dark .si-foot{opacity:0;transform:translateY(14px);pointer-events:none}
/* the key: a face, a light top edge, a darker bottom edge, a hairline */
.ch-signin .si-google{appearance:none;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;width:330px;height:58px;border-radius:19px;color:#131315;
  font:500 16px/1 var(--f-sans);letter-spacing:-.012em;background:linear-gradient(#FFFFFF,#F1F1EE);
  box-shadow:inset 0 1px 0 #fff,inset 0 -3px 0 rgba(0,0,0,.07),0 0 0 1px rgba(17,17,19,.13),0 18px 30px -16px rgba(17,17,19,.34);
  transition:transform .2s cubic-bezier(.2,.8,.3,1),box-shadow .2s}
.ch-signin .si-google:hover{transform:translateY(-2px)}
.ch-signin .si-google:active{transform:translateY(1px);box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(0,0,0,.07),0 0 0 1px rgba(17,17,19,.13),0 8px 14px -10px rgba(17,17,19,.34)}
.ch-signin .si-g{display:grid}
.ch-signin .si-g svg{width:20px;height:20px;display:block}
.ch-signin .si-spin{display:none;width:20px;height:20px;border-radius:50%;border:2px solid rgba(20,17,15,.16);border-top-color:#14110f;animation:si-spin .9s linear infinite}
@keyframes si-spin{to{transform:rotate(360deg)}}
.ch-signin .si-google.si-busy{pointer-events:none}
.ch-signin .si-google.si-busy .si-g{display:none}
.ch-signin .si-google.si-busy .si-spin{display:block}
.ch-signin .si-legal{margin:0;font:400 12.5px/1.4 var(--f-sans);letter-spacing:-.005em;color:rgba(17,17,19,.5)}
.ch-signin .si-legal u{text-underline-offset:2px;text-decoration-color:rgba(17,17,19,.25)}

/* ---------- 2 · welcome back: the line he is saying, and three keys ---------- */
.ch-signin .si-wel{display:flex;flex-direction:column;align-items:center;transform:translateY(10px)}
.ch-signin .si-wel.si-on{transform:none}
.ch-signin .si-slot{flex:none;margin-top:238px;width:64px;height:64px;border-radius:50%}
.ch-signin .si-q{margin:30px 0 0;min-height:78px;max-width:660px;font:400 34px/1.14 var(--f-serif);letter-spacing:-.03em;text-align:center;text-wrap:balance;color:#F4F4F3}
.ch-signin .si-q span{display:inline-block;opacity:0;transform:translateY(12px);filter:blur(6px);transition:opacity .5s var(--zt-ease),transform .6s var(--zt-ease),filter .5s var(--zt-ease)}
.ch-signin .si-q.si-in span{opacity:1;transform:none;filter:none}
.ch-signin .si-q:not(.si-in) span{transition-delay:0s!important;transition-duration:.25s}

.ch-signin .si-perms{display:flex;gap:44px;margin-top:46px}
.ch-signin .si-perm{appearance:none;border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:14px;color:#77777E;
  opacity:0;transform:translateY(16px) scale(.92);transition:opacity .45s var(--zt-ease),transform .62s var(--zt-ease)}
.ch-signin .si-perms.si-in .si-perm{opacity:1;transform:none}
.ch-signin .si-perms.si-in .si-perm:nth-child(2){transition-delay:.08s}
.ch-signin .si-perms.si-in .si-perm:nth-child(3){transition-delay:.16s}
.ch-signin .si-perms.si-away .si-perm{opacity:0;transform:translateY(-10px) scale(.96);transition-delay:0s;pointer-events:none}
/* the key: a face, a light top edge, a dark bottom edge, a hairline. Pressing it sets it down */
.ch-signin .si-key{position:relative;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;color:#F4F4F3;
  background:linear-gradient(#2B2B2F,#1B1B1E);box-shadow:inset 0 1px 0 rgba(255,255,255,.13),inset 0 -3px 0 rgba(0,0,0,.45),0 0 0 1px #08080A,0 16px 26px -14px rgba(0,0,0,.7);
  transition:transform .2s cubic-bezier(.2,.8,.3,1),background .3s,color .3s,box-shadow .3s}
.ch-signin .si-key>svg{width:27px;height:27px;display:block}
.ch-signin .si-perm:hover .si-key{transform:translateY(-2px)}
.ch-signin .si-perm:active .si-key{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 -1px 0 rgba(0,0,0,.45),0 0 0 1px #08080A,0 6px 12px -8px rgba(0,0,0,.7)}
.ch-signin .si-perm b{font:400 12.5px/1 var(--f-sans);letter-spacing:-.005em;transition:color .3s}
/* asking: a thin arc turns round the key */
.ch-signin .si-key::after{content:'';position:absolute;inset:-7px;border-radius:50%;border:1.5px solid transparent;border-top-color:#F4F4F3;opacity:0;transition:opacity .2s}
.ch-signin .si-wait .si-key::after{opacity:.8;animation:si-spin .8s linear infinite}
.ch-signin .si-wait{pointer-events:none}
/* on: the key turns to light, and a small tick sits on its shoulder. A key can be switched off again, and asked again */
.ch-signin .si-ok .si-key{background:linear-gradient(#FFFFFF,#EDEDEA);color:#131315;box-shadow:inset 0 1px 0 #fff,inset 0 -3px 0 rgba(0,0,0,.1),0 0 0 1px rgba(0,0,0,.5),0 16px 26px -14px rgba(0,0,0,.7)}
.ch-signin .si-ok b{color:#F4F4F3}
.ch-signin .si-key i{position:absolute;right:-3px;top:-3px;width:24px;height:24px;border-radius:50%;background:#131315;color:#F4F4F3;display:grid;place-items:center;
  box-shadow:0 0 0 2px #0E0E10;transform:scale(0);transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.ch-signin .si-key i svg{width:12px;height:12px}
.ch-signin .si-ok .si-key i{transform:none}
.ch-signin .si-no .si-key{color:#77777E}
/* b14: not allowed yet. The key rests a step back (no lift, a quieter face), its icon is grey and slashed, its name is grey.
   Allowed: the slash draws out as the key turns to light. Off for now: the slash draws back in */
.ch-signin .si-perm:not(.si-ok) .si-key{color:#8E8E95;background:linear-gradient(#242427,#19191C);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),inset 0 -2px 0 rgba(0,0,0,.4),0 0 0 1px #08080A,0 10px 18px -12px rgba(0,0,0,.6)}
.ch-signin .si-perm:not(.si-ok):hover .si-key{color:#C9C9CE}
.ch-signin .si-key .si-cut,.ch-signin .si-key .si-slash{fill:none;stroke-linecap:round;stroke-dasharray:23;stroke-dashoffset:0;transition:stroke-dashoffset .38s cubic-bezier(.2,.8,.3,1)}
.ch-signin .si-key .si-cut{stroke:#1F1F22;stroke-width:4.4}
.ch-signin .si-key .si-slash{stroke:currentColor;stroke-width:1.7}
.ch-signin .si-ok .si-key .si-cut,.ch-signin .si-ok .si-key .si-slash{stroke-dashoffset:23}
.ch-signin .si-ok .si-key .si-cut{stroke:#F6F6F4}

/* ---------- 3 · draw zero ---------- */
.ch-signin .si-draw{cursor:crosshair}
.ch-signin .si-page{position:absolute;left:calc(-1*var(--zt-bx,0px));top:calc(-1*var(--zt-by,0px));width:calc(100% + 2*var(--zt-bx,0px));height:calc(100% + 2*var(--zt-by,0px));background:#0E0E10;display:none}
.ch-signin.si-flat .si-page{display:block}
.ch-signin .si-ink{position:absolute;left:0;top:0;width:1600px;height:840px;display:block;touch-action:none}
.ch-signin .si-hint{position:absolute;left:0;right:0;top:387px;text-align:center;font:500 18px/1.4 var(--f-sans);letter-spacing:-.01em;color:#A6A6AC;pointer-events:none;
  transition:opacity .3s var(--zt-ease),transform .4s var(--zt-ease)}
.ch-signin .si-hint.si-quiet{opacity:0}
.ch-signin .si-hint.si-gone{opacity:0;transform:translateY(-10px)}
.ch-signin.si-through .si-draw{cursor:default;pointer-events:none}
/* the dotted zero. The dots walk the way the hand should go, and one brighter dot leads them round from the top */
.ch-signin .si-guide{position:absolute;left:0;top:0;width:1600px;height:840px;display:block;pointer-events:none;overflow:visible;opacity:0;transform:scale(.94);transform-origin:800px 400px;
  transition:opacity .5s var(--zt-ease),transform .7s var(--zt-ease)}
.ch-signin .si-draw.si-on .si-guide{opacity:1;transform:none;transition-delay:.25s}
.ch-signin .si-dots{fill:none;stroke:rgba(244,244,243,.42);stroke-width:5;stroke-linecap:round;stroke-dasharray:.001 1;animation:si-walk 1.5s linear infinite}
.ch-signin .si-lead{fill:none;stroke:#F4F4F3;stroke-width:11;stroke-linecap:round;stroke-dasharray:.0001 1;animation:si-lead 3.4s cubic-bezier(.6,0,.3,1) infinite}
@keyframes si-walk{to{stroke-dashoffset:-1}}
@keyframes si-lead{0%{stroke-dashoffset:0;opacity:0}7%{opacity:1}74%{stroke-dashoffset:-1;opacity:1}82%,100%{stroke-dashoffset:-1;opacity:0}}
.ch-signin.si-tracing .si-guide{opacity:.34}
.ch-signin.si-tracing .si-lead{animation:none;opacity:0}
.ch-signin.si-drawn .si-guide{opacity:0;transition-delay:0s}

@media (prefers-reduced-motion:reduce){.ch-signin .si-mark{transition-duration:.01s}.ch-signin .si-dots,.ch-signin .si-lead{animation:none}.ch-signin .si-lead{opacity:0}}

/* ch/02-world.css */
/* The world. One screen, mounted once and kept: the learner's home, the backdrop behind the
   pop-up, and the place the first scenario is started from. Two chapters run on it (world, start).
   The map lives in .wd-cam (2080 x 1169.4, the city at 130%). Everything on the map is placed in
   percent of that box, so it rides the camera: wide (drift) -> wd-zoom (on Airbnb) -> wd-go (into it).
   What is showing is a set of classes on the root: wd-on-roles, wd-on-road, wd-on-meter, wd-on-link,
   wd-on-apply. The class is the state, the motion is decoration. */
.ch-world{background:#131514;color:#f2f1ee;font-family:var(--f-sans);letter-spacing:-.01em}
/* a state that is set, not played: the backdrop behind the pop-up, and the way back in */
.ch-world.wd-still *,.ch-world.wd-still *::before,.ch-world.wd-still *::after{transition:none!important}

/* ---------- the camera ----------
   .wd-map holds the map one pixel inside the screen. While the camera moves the map is its own layer,
   and at a fractional window scale that layer can overshoot the screen edge by a pixel: this keeps
   that pixel dark instead of a bright seam beside the letterbox. */
.ch-world.zt-ch{overflow:visible}
.ch-world .wd-map{position:absolute;left:calc(1px - var(--zt-bx,0px));top:calc(1px - var(--zt-by,0px));right:calc(1px - var(--zt-bx,0px));bottom:calc(1px - var(--zt-by,0px));overflow:hidden}
/* the camera rests with the Zero building in the middle of the screen (it stands at 49.8%, 50.6% of the picture) */

  transition:opacity .32s var(--zt-ease),transform .5s var(--zt-ease),visibility 0s linear .35s;transition-delay:0s,0s,.35s}
.ch-world.wd-go .wd-lead path{opacity:0}
.ch-world.wd-go .wd-mark{opacity:0}
.ch-world .wd-end{position:absolute;left:0;top:0;width:100%;height:760px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  opacity:0;visibility:hidden;transform:translateY(12px);filter:blur(8px);
  transition:opacity .5s var(--zt-ease),transform .65s var(--zt-ease),filter .5s var(--zt-ease),visibility 0s linear .5s}
.ch-world.wd-over .wd-end{opacity:1;visibility:visible;transform:none;filter:none;transition-delay:0s}
.ch-world .wd-end-wm{color:#F4F4F3;display:block}
.ch-world .wd-end-wm svg{height:22px;width:auto;display:block}
.ch-world .wd-end h2{margin:26px 0 0;font:400 44px/1.1 var(--f-serif);letter-spacing:-.02em;color:#f6f5f2;max-width:640px;text-wrap:balance}
.ch-world .wd-end p{margin:16px 0 0;font:400 16px/1.5 var(--f-sans);color:rgba(242,241,238,.6);max-width:440px;text-wrap:balance}
.ch-world .wd-replay{appearance:none;border:0;cursor:pointer;margin-top:34px;height:50px;padding:0 22px;border-radius:16px;
  font:500 15px/1 var(--f-sans);letter-spacing:-.012em;color:#F4F4F3;background:linear-gradient(#303236,#1A1B1E);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -3px 0 rgba(0,0,0,.5),0 0 0 1px #0a0a0b,0 14px 24px -14px rgba(0,0,0,.6);transition:transform .2s cubic-bezier(.2,.8,.3,1)}
.ch-world .wd-replay:hover{transform:translateY(-2px)}
.ch-world .wd-replay:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* resting behind the pop-up: nothing loops under the engine's blur */
.ch-world.wd-rest .wd-stop-go,.ch-world.wd-rest .wd-stop-go::before,.ch-world.wd-rest .wd-stop-go::after,.ch-world.wd-rest .wd-pin::before{animation:none}

@media (prefers-reduced-motion:reduce){
  .ch-world.wd-flash .wd-stop-go,.ch-world.wd-flash .wd-stop-go::before,.ch-world.wd-flash .wd-stop-go::after,.ch-world.wd-zoom .wd-pin::before{animation:none}
  .ch-world.wd-drift .wd-cam{transform:translate(-236px,-192px);transition:none}
}
/* b14: the app's own skill points star, in the meter and beside each role's number. A role that is not near yet shows it grey */
.ch-world .wd-m-num .wd-xp{width:18px;height:18px;display:block;flex:none;align-self:center;object-fit:contain;margin-right:-1px}
.ch-world .wd-r-at .wd-xp{width:13px;height:13px;display:block;object-fit:contain;filter:grayscale(1) brightness(1.3);opacity:.55;transition:filter .4s,opacity .4s}
.ch-world.wd-on-link .wd-role.wd-next .wd-r-at .wd-xp,.ch-world .wd-role.wd-open .wd-r-at .wd-xp{filter:none;opacity:1}

/* ch/03-kickoff.css */
/* 3 · kickoff, inside the pop-up: the app's own kickoff meeting, value for value (origin/dev).
   The canvas is the app window: 1600 x 786 is on screen, so the app's layout is solved for that size.
     top bar 88 high · meeting grid 30 from the sides and the bottom · columns 1.8fr / 0.8fr with a 30 gap
     left column 1045.38 x 668 at (30, 88) · notes column 464.62 x 668 at (1105.38, 88)
     the greeting's video is a 16:9 tile, 820 x 461.25, in the middle of that window at (390, 162.375), radius 24
   Text with no font class in the app inherits Google Sans Flex from the app shell (MainApp), so it does here.
   The deck is the run's own HTML template: 1280 wide, scaled to the column (x 0.8167), its type sized by
   the column's own width and height (--qw, --qh, --q are 1% of them, the template's cqw / cqh / cqmin). */
.ch-kickoff{background:#1B1815;color:#000;letter-spacing:0;
  --ko-sys:var(--f-sans);font-family:var(--ko-sys);
  --ko-apple:cubic-bezier(.22,1,.36,1)}
.ch-kickoff.ko-reveal{background:#F2F0ED}
.ch-kickoff.ko-inline{background:#F2F0ED}
.ch-kickoff .ko-app{position:absolute;left:0;top:0;width:1600px;height:786px;overflow:hidden}
.ch-kickoff svg{display:block}

/* ================= the landing (KickoffMeeting/index.tsx, LandingBackdrop, JoinCtaButton) ================= */
.ch-kickoff .ko-landing{position:absolute;left:0;top:0;width:1600px;height:786px;z-index:40;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .25s ease-out}
.ch-kickoff.ko-l-on .ko-landing{opacity:1}
/* the ground: the scenario's picture, blurred 42px and scaled past the frame, under a warm wash */
.ch-kickoff .ko-l-bd{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;background:#1B1815}
.ch-kickoff .ko-l-bd img{position:absolute;left:0;top:0;width:100%;height:100%;display:block;object-fit:cover;transform:scale(1.1);filter:blur(42px);user-select:none;-webkit-user-drag:none}
.ch-kickoff .ko-l-bd i{position:absolute;left:0;top:0;width:100%;height:100%;background:radial-gradient(120% 90% at 50% 30%,rgba(27,24,21,.32),rgba(15,13,11,.72) 100%)}
.ch-kickoff .ko-l-back,.ch-kickoff .ko-fs-back{position:absolute;left:24px;top:24px;z-index:20;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.1);
  border:1px solid transparent;box-shadow:0 2px 8px rgba(0,0,0,.04);display:flex;align-items:center;justify-content:center;color:#fff}
.ch-kickoff .ko-l-back svg,.ch-kickoff .ko-fs-back svg,.ch-kickoff .ko-back svg{width:24px;height:24px}
.ch-kickoff .ko-l-card{position:relative;z-index:10;width:760px;border-radius:32px;background:#fff;padding:64px;box-shadow:0 40px 100px -24px rgba(0,0,0,.5);
  opacity:0;transform:translateY(10px) scale(.96);transition:opacity .5s var(--ko-apple),transform .5s var(--ko-apple)}
.ch-kickoff.ko-l-on .ko-l-card{opacity:1;transform:none}
.ch-kickoff .ko-l-in{display:flex;flex-direction:column;align-items:center;transition:opacity .13s ease-out}
/* each line rises 14px, 80ms after the one above (landingRise) */
.ch-kickoff .ko-rise{opacity:0;transform:translateY(14px);transition:opacity .5s var(--ko-apple) var(--d,0s),transform .5s var(--ko-apple) var(--d,0s)}
.ch-kickoff.ko-l-on .ko-rise{opacity:1;transform:none}
/* b14: the card carries the project's brief, so its head is set tighter than the bare card's (24 between the eyebrow and the
   title, 48 between groups): the eyebrow, the company over its title, then the brief's meta line under them */
.ch-kickoff .ko-l-head{display:flex;flex-direction:column;align-items:center}
.ch-kickoff .ko-l-eye{margin:0;font:400 13px/18.2px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:rgba(31,29,30,.45)}
.ch-kickoff .ko-l-h{margin:0;font:400 40px/1.18 var(--f-serif);letter-spacing:-.01em;color:#2A2118;text-align:center;white-space:nowrap}
.ch-kickoff .ko-l-ttl{margin-top:22px;display:flex;flex-direction:column;align-items:center}
.ch-kickoff .ko-l-pair{display:flex;flex-direction:column;align-items:center;gap:10px}
.ch-kickoff .ko-l-co{margin:0;display:flex;align-items:center;gap:7px;font:500 15px/18.2px var(--ko-sys);color:#2A2118}
.ch-kickoff .ko-l-co img{display:block;width:17px;height:17px}
/* the brief's meta: the app's Clock and Gauge at 14, the duration in the mono it is set in, the level in the sans */
.ch-kickoff .ko-l-meta{margin-top:18px;display:flex;align-items:center;gap:18px}
.ch-kickoff .ko-l-meta span{display:flex;align-items:center;gap:6px;font:500 13px/1 var(--ko-sys);color:rgba(31,29,30,.55)}
.ch-kickoff .ko-l-meta span.ko-l-dur{font:400 13px/1 var(--f-mono)}
.ch-kickoff .ko-l-meta svg{width:14px;height:14px;color:rgba(31,29,30,.38)}
/* the description is the card's one paragraph, under its title like a lede */
.ch-kickoff .ko-l-desc{margin:22px 0 0;max-width:520px;font:400 14px/1.6 var(--ko-sys);color:rgba(31,29,30,.6);text-align:center;text-wrap:balance}
/* tools, skills, the manager: a quiet label column and its things, one line each. The block is as wide as its longest line and
   sits on the card's centre line; each line is as wide as its words, so a ring round it hugs them */
.ch-kickoff .ko-l-facts{margin:36px 0 0;display:flex;flex-direction:column;align-items:flex-start;gap:16px}
.ch-kickoff .ko-l-row{display:flex;align-items:center;min-height:30px}
.ch-kickoff .ko-l-row dt{flex:none;width:104px;font:400 13px/1.25 var(--ko-sys);color:rgba(31,29,30,.45)}
.ch-kickoff .ko-l-row dd{margin:0;display:flex;align-items:center;gap:7px}
/* the dock card's own chip (Chips.tsx), drawn on white: the time pill's ink tints, 13px, 6 by 11, the tool's real logo at 16 */
.ch-kickoff .ko-l-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;background:rgba(31,29,30,.035);box-shadow:inset 0 0 0 1px rgba(31,29,30,.09);
  font:400 13px/1.25 var(--ko-sys);color:rgba(31,29,30,.78);white-space:nowrap}
.ch-kickoff .ko-l-tool{padding-left:7px}
.ch-kickoff .ko-l-chip img{flex:none;display:block;width:16px;height:16px;border-radius:4px;object-fit:contain}
/* the manager: the card's own avatar (the faint concentric ring, the warm inner light), at the line's size */
.ch-kickoff .ko-l-who dd{gap:10px}
.ch-kickoff .ko-l-av{position:relative;flex:none;width:28px;height:28px}
.ch-kickoff .ko-l-av img{display:block;width:28px;height:28px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px rgba(0,0,0,.05)}
.ch-kickoff .ko-l-av i{position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 5px rgba(232,228,223,.6),0 0 1px 2px rgba(232,228,223,.5);pointer-events:none}
.ch-kickoff .ko-l-who b{font:500 14px/1.25 var(--ko-sys);color:#2A2118}
.ch-kickoff .ko-l-cta{margin-top:48px;display:flex;flex-direction:column;align-items:center;gap:16px}
.ch-kickoff .ko-l-time{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(31,29,30,.05);box-shadow:inset 0 0 0 1px rgba(31,29,30,.1);
  font:400 13px/19.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:rgba(31,29,30,.5)}
.ch-kickoff .ko-l-time svg{width:16px;height:16px;color:rgba(31,29,30,.55)}
.ch-kickoff .ko-l-time b{font-weight:400;color:rgba(31,29,30,.8)}
.ch-kickoff .ko-l-btn{position:relative;display:flex;align-items:center;justify-content:center}
/* the one place the app lets green glow: a breathing light behind the commit button */
.ch-kickoff .ko-glow{position:absolute;left:-12px;top:-12px;right:-12px;bottom:-12px;border-radius:9999px;pointer-events:none;filter:blur(16px);
  background:radial-gradient(closest-side,rgba(126,215,145,.55),rgba(126,215,145,.18) 62%,rgba(126,215,145,0) 100%);animation:ko-glow 2.8s var(--ko-apple) infinite}
@keyframes ko-glow{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.18);opacity:.9}}
/* the app's ink pill. Here it is Navid's pointer that presses it, so it does not take the mouse. */
.ch-kickoff .ko-join{appearance:none;border:0;margin:0;position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:19px 48px;border-radius:999px;background:#1F1D1E;
  box-shadow:0 10px 28px -8px rgba(31,29,30,.5),0 3px 8px -3px rgba(31,29,30,.35);pointer-events:none;transition:transform .16s ease-out}
.ch-kickoff .ko-join i{position:absolute;left:0;top:0;width:100%;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0))}
.ch-kickoff .ko-join span{position:relative;z-index:1;font:500 16px/1 var(--ko-sys);letter-spacing:-.01em;color:#fff}
.ch-kickoff .ko-join.ko-down{transform:scale(.95)}

/* until Navid starts on the project the card waits in its arriving state, its lines and its back key with it.
   On his first sentence they come in with the entrance they always had. */
.ch-kickoff.ko-brief .ko-l-card{opacity:0;transform:translateY(10px) scale(.96)}
.ch-kickoff.ko-brief .ko-rise{opacity:0;transform:translateY(14px)}
.ch-kickoff .ko-l-back{transition:opacity .25s ease-out}
.ch-kickoff.ko-brief .ko-l-back{opacity:0}

/* Join: the words leave in 130ms, the card grows 3.2 times on the app's spring (stiffness 190, damping 30),
   and at 820ms it cross-fades with the meeting that is already drawn under it (520ms) */
.ch-kickoff.ko-joining .ko-l-back{display:none}
.ch-kickoff.ko-joining .ko-l-in{opacity:0}
.ch-kickoff.ko-joining .ko-l-card{transform:scale(3.2);
  transition:transform .82s linear(0,.108,.299,.48,.626,.736,.815,.872,.911,.938,.958,.971,.98,.986,.99,.993,.995,.997,.998,.999,1) .04s}
.ch-kickoff.ko-reveal .ko-landing{opacity:0;pointer-events:none;transition:opacity .52s var(--ko-apple)}
.ch-kickoff.ko-met .ko-landing{visibility:hidden}

/* ================= the meeting ================= */
.ch-kickoff .ko-meet{position:absolute;left:0;top:0;width:1600px;height:786px;background:#F2F0ED;opacity:0}
.ch-kickoff.ko-reveal .ko-meet{opacity:1;transition:opacity .52s cubic-bezier(.16,1,.3,1)}
.ch-kickoff.ko-inline .ko-meet{background:#F2F0ED}

/* ---- the greeting: the manager's video is a 16:9 tile in the middle of the light ground (b9: it was the whole window) ---- */
.ch-kickoff .ko-slot{position:absolute;z-index:20;left:390px;top:162.375px;width:820px;height:461.25px;border-radius:24px;background:#000}
/* once he is in it the seat itself is clear, so nothing dark jumps ahead of him when the tile moves into the column */
.ch-kickoff.ko-live .ko-slot{background:transparent}
.ch-kickoff.ko-inline .ko-slot{left:30px;top:88px;width:1045.38px;height:668px;border-radius:24px}
.ch-kickoff.ko-playing .ko-slot{visibility:hidden}
/* until he is in it, the seat is a video that is still loading: the app's own spinner */
.ch-kickoff .ko-wait{position:absolute;z-index:21;left:0;top:0;width:1600px;height:786px;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0}
.ch-kickoff .ko-wait i{width:40px;height:40px;box-sizing:border-box;border-radius:50%;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;animation:ko-spin 1s linear infinite}
.ch-kickoff.ko-reveal .ko-wait{opacity:1;transition:opacity .26s var(--ko-apple) .3s}
.ch-kickoff.ko-live .ko-wait{display:none}
@keyframes ko-spin{to{transform:rotate(360deg)}}
.ch-kickoff .ko-fs{position:absolute;z-index:22;left:390px;top:162.375px;width:820px;height:0}
.ch-kickoff .ko-fs-skip{position:absolute;right:24px;top:24px;display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.1);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 2px 8px rgba(0,0,0,.04);font:500 14px/20px var(--ko-sys);color:#fff}
.ch-kickoff .ko-fs-skip svg{width:16px;height:16px}
.ch-kickoff.ko-inline .ko-fs{display:none}

/* ---- the top bar (MeetingTopBar): back on the left, the level chip on the right ---- */
.ch-kickoff .ko-top{position:absolute;left:0;top:0;width:1600px;height:88px;background:#F2F0ED;visibility:hidden;opacity:0}
.ch-kickoff.ko-inline .ko-top{visibility:visible;opacity:1;transition:opacity .4s ease-out}
.ch-kickoff .ko-back{position:absolute;left:32px;top:16px;width:56px;height:56px;box-sizing:border-box;border-radius:50%;background:#E8E4DF;border:1px solid #f5f5f5;
  display:flex;align-items:center;justify-content:center;color:#000}
/* the HUD level pill, authored at 50 high and zoomed to 33 (LegacyXpLevelPill, pillScale) */
.ch-kickoff .ko-lvl{position:absolute;right:32px;top:27.5px;opacity:0;transform:scale(.6);transform-origin:100% 50%}
/* b14: the meeting's top bar is light, and there the app draws its level badge in the badge's LIGHT theme
   (KickoffMeeting: LevelBadge theme LIGHT; index.css .level-badge-scope): a white pill with a faint ink edge and a soft shadow,
   ink numerals. Same size and place as before, only the surface and the ink change */
.ch-kickoff .ko-lvl-pill{zoom:.66;display:flex;align-items:center;gap:8px;padding:10px 20px;box-sizing:border-box;border-radius:30px;border:2px solid rgba(31,29,30,.07);
  background:linear-gradient(180deg,#fff,rgb(245,247,246));box-shadow:0 4px 16px rgba(0,0,0,.07)}
.ch-kickoff .ko-lvl-pill img{display:block;width:25.4px;height:26px;object-fit:cover}
.ch-kickoff .ko-lvl-pill p{margin:0;font:400 22px/16px var(--f-mono);letter-spacing:-1.1px;color:rgb(31,29,30);white-space:nowrap;font-feature-settings:'lnum' 1,'tnum' 1;text-box-trim:trim-both;text-box-edge:cap alphabetic}
.ch-kickoff.ko-lvl-on .ko-lvl{opacity:1;transform:none;transition:opacity .25s ease-out,transform .6s cubic-bezier(.34,1.56,.64,1)}
/* an award lands: the gain rises off the pill and fades (EarnBurst) */
/* the gain rises in the light theme's gold ink, so it reads on the light bar */
.ch-kickoff .ko-lvl-up{position:absolute;left:50%;top:0;font:500 15px/1 var(--f-mono);color:rgb(185,131,32);white-space:nowrap;font-variant-numeric:tabular-nums;opacity:0;pointer-events:none}
.ch-kickoff.ko-lvl-hit .ko-lvl-up{animation:ko-up 1.25s cubic-bezier(.22,.61,.36,1) both}
@keyframes ko-up{0%{opacity:0;transform:translate(-50%,4px) scale(.9)}33%{opacity:1}66%{opacity:1}100%{opacity:0;transform:translate(-50%,-36px) scale(1)}}

/* ---- the left column: the player surface ---- */
.ch-kickoff .ko-player{position:absolute;left:30px;top:88px;width:1540px;height:668px;border-radius:24px;overflow:hidden;background:#CCC8C3;
  box-shadow:0 1px 3px 0 rgba(0,0,0,.1),0 1px 2px -1px rgba(0,0,0,.1);transition:width .55s cubic-bezier(.16,1,.3,1)}
.ch-kickoff.ko-notes-in .ko-player{width:1045.38px}
/* the old full-window video uncovered this surface as it shrank. The tile grows onto it, so it waits until it is covered (.76s) */
.ch-kickoff .ko-player{visibility:hidden}
.ch-kickoff.ko-inline .ko-player{visibility:visible;transition:width .55s cubic-bezier(.16,1,.3,1),visibility 0s .76s}

/* the deck. The template's own tokens for this scenario: ground #222, ink #fff, label #B3B3B3, tile #333, brand #FF385C.
   Its face is Plus Jakarta Sans (the chapter loads it), at the deck's own sizes, weights and tracking (-.04em / -.05em).
   The tour's sans is only the fallback while it loads. */
.ch-kickoff .ko-stage{position:absolute;left:0;top:0;width:1280px;height:817.93px;transform:scale(.816703);transform-origin:0 0;overflow:hidden;background:#222;color:#fff;
  font-family:'Plus Jakarta Sans',var(--f-sans);--q:6.68px;--qw:10.4538px;--qh:6.68px;visibility:hidden}
.ch-kickoff.ko-playing .ko-stage{visibility:visible}
.ch-kickoff .ko-panel{position:absolute;left:0;top:0;width:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:clamp(40px,calc(7*var(--q)),84px);gap:clamp(14px,calc(2.4*var(--q)),30px);overflow:hidden;opacity:0;transition:opacity .22s cubic-bezier(.215,.61,.355,1)}
.ch-kickoff .ko-panel.ko-act{opacity:1;transition:opacity .38s cubic-bezier(.215,.61,.355,1)}
.ch-kickoff .ko-panel>*{max-width:100%;overflow-wrap:anywhere}
.ch-kickoff .ko-panel.ko-hero{background:linear-gradient(135deg,#FF385C 0%,#BF2A45 100%)}
/* the brand's mark, top left of every slide */
.ch-kickoff .ko-wm{position:absolute;top:clamp(26px,calc(5*var(--q)),48px);left:clamp(30px,calc(5*var(--q)),58px);display:inline-flex;align-items:center;gap:7px;height:clamp(30px,calc(4.5*var(--q)),56px);line-height:1;white-space:nowrap}
.ch-kickoff .ko-wm img{display:block;height:100%;width:auto;filter:brightness(0) invert(1)}
.ch-kickoff .ko-wm b{font:800 21px/1 'Plus Jakarta Sans',var(--f-sans);letter-spacing:-.04em;color:#fff}
.ch-kickoff .ko-hero .ko-wm{height:clamp(38px,calc(5.5*var(--q)),68px)}
.ch-kickoff .ko-hero .ko-wm b{font-size:27px}
/* lines rise 22px, 85ms apart. A number lands from 1.22 with a little overshoot. (the deck's setPanel) */
.ch-kickoff .ko-u{opacity:0;transform:translateY(22px);transition:opacity 0s .22s,transform 0s .22s}
.ch-kickoff .ko-num.ko-u{transform:translateY(14px) scale(1.22)}
.ch-kickoff .ko-act .ko-u{opacity:1;transform:none;transition:opacity .58s cubic-bezier(.165,.84,.44,1) calc(.06s + var(--i,0)*.085s),transform .58s cubic-bezier(.165,.84,.44,1) calc(.06s + var(--i,0)*.085s)}
.ch-kickoff .ko-act .ko-num.ko-u{transition:opacity .68s cubic-bezier(.34,1.5,.64,1) .1s,transform .68s cubic-bezier(.34,1.5,.64,1) .1s}
.ch-kickoff .ko-st{font-weight:800;font-size:clamp(30px,min(calc(6.4*var(--qw)),calc(11.4*var(--qh))),88px);letter-spacing:-.04em;line-height:1.06;max-width:min(1120px,94%);color:#fff}
.ch-kickoff .ko-st.ko-st-s{font-size:clamp(20px,calc(4*var(--q)),40px)}
.ch-kickoff .ko-num{font-weight:800;font-size:clamp(56px,min(calc(15.6*var(--qw)),calc(27.8*var(--qh))),230px);letter-spacing:-.05em;line-height:.84;font-variant-numeric:tabular-nums;color:#fff}
.ch-kickoff .ko-cover{max-width:min(1140px,94%);display:flex;flex-direction:column;align-items:center;gap:clamp(14px,calc(2.6*var(--q)),28px)}
.ch-kickoff .ko-big{font-weight:800;font-size:clamp(40px,min(calc(9*var(--qw)),calc(16*var(--qh))),128px);letter-spacing:-.045em;line-height:.96;color:#fff}
.ch-kickoff .ko-sub{font-size:clamp(16px,calc(4*var(--q)),34px);font-weight:600;color:rgba(255,255,255,.85)}
.ch-kickoff .ko-flow{display:flex;align-items:center;gap:clamp(18px,calc(4.5*var(--q)),48px);flex-wrap:wrap;justify-content:center}
.ch-kickoff .ko-fnum{font-weight:800;font-size:clamp(44px,min(calc(11.7*var(--qw)),calc(20.8*var(--qh))),170px);letter-spacing:-.04em;line-height:.85;font-variant-numeric:tabular-nums}
.ch-kickoff .ko-fnum.ko-good{color:#FF385C}
.ch-kickoff .ko-fop{display:flex;flex-direction:column;align-items:center;gap:.3em;font-size:16px}
.ch-kickoff .ko-pill{background:#333;border:1px solid rgba(255,255,255,.15);color:#fff;font-weight:800;font-size:clamp(13px,calc(2.4*var(--q)),23px);padding:.35em .9em;border-radius:999px}
.ch-kickoff .ko-ar{font-size:clamp(22px,calc(5*var(--q)),46px);color:#B3B3B3;line-height:1.2}

/* the idle progress strip: one bar per chapter of the meeting, flush with the bottom of the player (PlayerBar) */
.ch-kickoff .ko-strip{position:absolute;z-index:2;left:45px;right:45px;bottom:0;height:6px;display:flex;align-items:center;gap:3px;visibility:hidden;pointer-events:none}
.ch-kickoff.ko-playing .ko-strip{visibility:visible}
.ch-kickoff.ko-grading .ko-strip{visibility:hidden}
.ch-kickoff .ko-strip i{position:relative;height:6px;min-width:0;border-radius:52px;overflow:hidden;background:rgba(255,255,255,.25)}
.ch-kickoff .ko-strip b{position:absolute;left:0;top:0;height:100%;width:0;border-radius:52px;background:#fff}
.ch-kickoff .ko-strip i:first-child b{width:100%}
.ch-kickoff.ko-playing .ko-strip i:nth-child(2) b{width:62%;transition:width 60s linear}

/* while the notes are read the full bar is pinned open (PlayerBar, forceShowControls) and its controls are locked,
   and the checkpoint card (SegmentPopIn) stands on the seek bar at the end of the chapter that just played */
.ch-kickoff .ko-bar{position:absolute;z-index:3;left:0;right:0;bottom:0;box-sizing:border-box;display:flex;align-items:center;gap:21px;padding:30px 40px;background:rgba(0,0,0,.5);
  opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .3s cubic-bezier(.32,.72,0,1),transform .3s cubic-bezier(.32,.72,0,1)}
.ch-kickoff.ko-grading .ko-bar{opacity:1;transform:none}
.ch-kickoff .ko-bb{flex:none;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;font:600 14px/20px var(--ko-sys);color:#fff;opacity:.4}
.ch-kickoff .ko-bb svg{width:13.405px;height:14.68px}
.ch-kickoff .ko-trk{position:relative;flex:1;height:6px;display:flex;align-items:center;gap:3px}
.ch-kickoff .ko-trk>i{position:relative;height:6px;min-width:0;border-radius:52px;overflow:hidden;background:rgba(255,255,255,.25)}
.ch-kickoff .ko-trk>i>b{position:absolute;left:0;top:0;height:100%;width:0;border-radius:52px;background:#fff}
.ch-kickoff .ko-trk>i:nth-child(-n+2)>b{width:100%}
.ch-kickoff .ko-pop-at{position:absolute;left:17.85%;bottom:100%;margin-bottom:12px;width:0;height:0}
.ch-kickoff .ko-pop{position:absolute;left:-140px;bottom:0;box-sizing:border-box;width:280px;padding:28px 32px;border-radius:28px;background:#1F1D1E;box-shadow:0 25px 50px -12px rgba(0,0,0,.25);
  display:flex;flex-direction:column;align-items:center;gap:20px;transform-origin:50% 100%;opacity:0;transform:translateY(15px) scale(0);transition:opacity .22s cubic-bezier(.6,0,1,.4),transform .22s cubic-bezier(.6,0,1,.4)}
.ch-kickoff.ko-grading .ko-pop{opacity:1;transform:none;transition:opacity .28s cubic-bezier(0,.7,.3,1),transform .28s cubic-bezier(0,.7,.3,1)}
.ch-kickoff .ko-pop-av{display:block;flex:none;width:48px;height:48px;border-radius:50%;object-fit:cover}
.ch-kickoff .ko-pop-in{position:relative;width:100%;height:40px}
.ch-kickoff .ko-pop-an,.ch-kickoff .ko-cont{position:absolute;left:0;top:0;box-sizing:border-box;width:100%;height:40px;margin:0;border:0;border-radius:999px;padding:10px 24px;font:500 14px/20px var(--ko-sys);text-align:center}
.ch-kickoff .ko-pop-an{overflow:hidden;color:#fff;transition:opacity .18s cubic-bezier(.4,0,.2,1),transform .18s cubic-bezier(.4,0,.2,1)}
.ch-kickoff .ko-pop-an i{position:absolute;left:0;top:0;width:100%;height:100%;background:linear-gradient(to right,transparent,rgba(255,255,255,.15),transparent);background-size:200% 100%;animation:ko-pill 2s ease-in-out infinite}
.ch-kickoff .ko-pop-an span{position:relative}
@keyframes ko-pill{0%{background-position:200% 0}100%{background-position:-200% 0}}
/* it is Navid's pointer that presses Continue, so it does not take the mouse */
.ch-kickoff .ko-cont{appearance:none;background:#fff;color:#1F1D1E;pointer-events:none;opacity:0;transform:translateY(8px);transition:opacity .18s cubic-bezier(.4,0,.2,1) .18s,transform .18s cubic-bezier(.4,0,.2,1) .18s}
.ch-kickoff.ko-graded .ko-pop-an{opacity:0;transform:translateY(-8px)}
.ch-kickoff.ko-graded .ko-cont{opacity:1;transform:none}
.ch-kickoff.ko-cont-done .ko-strip i:nth-child(2) b{width:100%;transition:none}

/* ---- the right column: Meeting Notes (RightPanel, NotesPanel) ---- */
.ch-kickoff .ko-col{position:absolute;left:1105.38px;top:88px;width:464.62px;height:668px;opacity:0;transform:translateX(64px)}
/* it glides in from the right on a soft spring (stiffness 70, damping 14) while the grid opens */
.ch-kickoff.ko-notes-in .ko-col{opacity:1;transform:none;
  transition:opacity .3s ease-out,transform .95s linear(0,.069,.219,.39,.551,.687,.793,.871,.926,.963,.985,.998,1.005,1.008,1.008,1.007,1.006,1.005,1.003,1)}
.ch-kickoff .ko-notes{position:relative;box-sizing:border-box;width:100%;height:100%;border-radius:24px;border:1px solid #fff;background:#fff;overflow:hidden;display:flex;flex-direction:column}
.ch-kickoff .ko-n-head{position:relative;flex:none;box-sizing:border-box;min-height:52px;padding:14px 24px;display:flex;align-items:center;gap:10px;overflow:hidden;background:#FCF2D3;border-bottom:1px solid transparent}
.ch-kickoff .ko-n-ico{position:relative;flex:none;width:18px;height:18px;opacity:0}
.ch-kickoff .ko-n-ico svg{width:18px;height:18px}
.ch-kickoff .ko-n-ttl{position:relative;font:500 14px/20px var(--ko-sys);color:#423200;opacity:0}
/* the header's own icon and title cut in as the flying ones land */
.ch-kickoff.ko-hd-ico .ko-n-ico,.ch-kickoff.ko-hd-ttl .ko-n-ttl{opacity:1}
/* the landing light: a soft cream bloom behind the icon, in fast, out slow */
.ch-kickoff .ko-n-glow{position:absolute;left:33px;top:50%;width:216px;height:216px;margin:-108px 0 0 -108px;border-radius:50%;background:#FEFFDB;filter:blur(60px);mix-blend-mode:screen;opacity:0;pointer-events:none}
.ch-kickoff.ko-hd-ico .ko-n-glow{animation:ko-bloom 1.05s both}
@keyframes ko-bloom{0%{opacity:0;transform:scale(.4);animation-timing-function:cubic-bezier(.16,1,.3,1)}43%{opacity:1;transform:scale(1);animation-timing-function:cubic-bezier(.7,0,.84,0)}100%{opacity:.01;transform:scale(1)}}

/* the in-panel intro (NotesPanelIntroCard): drawn at full size, set at 0.65 and lifted 67px, as the app does */
.ch-kickoff .ko-intro{flex:1;min-height:0;display:flex}
.ch-kickoff .ko-i-in{flex:1;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:30px;text-align:center;transform:translateY(-67px) scale(.65)}
.ch-kickoff .ko-i-circle{flex:none;width:150px;height:150px;border-radius:50%;background:#FCF2D3;display:flex;align-items:center;justify-content:center}
.ch-kickoff .ko-i-ico{display:block;width:58px;height:58px;opacity:.8}
.ch-kickoff .ko-i-ico svg{width:100%;height:100%}
.ch-kickoff .ko-i-txt{display:flex;flex-direction:column;align-items:center}
.ch-kickoff .ko-i-ttl{margin:0;font:400 56px/1.3 var(--f-serif);letter-spacing:-1.68px;white-space:nowrap;color:#433D40}
.ch-kickoff .ko-i-sub{margin:30px 0 0;width:366px;max-width:100%;font:500 24px/1.4 var(--f-sans);color:#433D40;opacity:.6}
.ch-kickoff .ko-i-cta{margin-top:30px}
.ch-kickoff .ko-ready{appearance:none;border:0;margin:0;display:flex;align-items:center;justify-content:center;height:90px;padding:0 60px;border-radius:150px;background:#1F1D1E;
  font:600 30px/1.5 var(--f-sans);letter-spacing:-.6px;color:#fff;pointer-events:none;
  box-shadow:0 5.99px 7.98px -2px rgba(0,0,0,.15),0 0 0 2px #d4d4d4,inset 0 2px 0 0 rgba(255,255,255,.33);transition:transform .12s ease-out,box-shadow .12s ease-out}
.ch-kickoff .ko-ready.ko-down{transform:translateY(3px) scale(.955);box-shadow:0 1.5px 3px -1.5px rgba(0,0,0,.2),0 0 0 2px #d4d4d4,inset 0 2px 3px 0 rgba(0,0,0,.2)}
/* each line arrives out of a blur, 35px low, overshoots 5px and settles: circle, title, line, button, 220ms apart */
.ch-kickoff.ko-notes-in .ko-i-circle{animation:ko-line .7s backwards}
.ch-kickoff.ko-notes-in .ko-i-ttl{animation:ko-line .7s .22s backwards}
.ch-kickoff.ko-notes-in .ko-i-sub{animation:ko-line-s .7s .44s backwards}
.ch-kickoff.ko-notes-in .ko-i-cta{animation:ko-line .7s .66s backwards}
@keyframes ko-line{0%{filter:blur(10px);opacity:0;transform:translateY(35px);animation-timing-function:cubic-bezier(.22,1,.36,1)}50%{filter:blur(5px);opacity:.5;transform:translateY(-5px);animation-timing-function:cubic-bezier(.22,1,.36,1)}100%{filter:blur(0);opacity:1;transform:none}}
@keyframes ko-line-s{0%{filter:blur(10px);opacity:0;transform:translateY(35px);animation-timing-function:cubic-bezier(.22,1,.36,1)}50%{filter:blur(5px);opacity:.3;transform:translateY(-5px);animation-timing-function:cubic-bezier(.22,1,.36,1)}100%{filter:blur(0);opacity:.6;transform:none}}
/* "I'm ready": the card hands off to the header. The circle and the button shrink away, the line blurs out,
   and the icon and the title fly (700ms, x and y on different curves, so the path bends) */
.ch-kickoff.ko-ready .ko-i-circle{animation:none;opacity:0;transform:scale(.7);transition:opacity .35s ease-out,transform .35s ease-out}
.ch-kickoff.ko-ready .ko-i-ico,.ch-kickoff.ko-ready .ko-i-ttl{visibility:hidden}
.ch-kickoff.ko-ready .ko-i-sub{animation:none;opacity:0;filter:blur(8px);transition:opacity .35s ease-out .2s,filter .35s ease-out .2s}
.ch-kickoff.ko-ready .ko-i-cta{animation:none;opacity:0;transform:scale(.8);filter:blur(2px);transition:opacity .35s ease-out,transform .35s ease-out,filter .35s ease-out}
.ch-kickoff .ko-fly{position:absolute;z-index:5;pointer-events:none;transition:transform .7s cubic-bezier(.76,-.37,.69,.45)}
.ch-kickoff .ko-fly>div{width:100%;height:100%;transition:transform .7s cubic-bezier(.46,.33,.54,.45)}
.ch-kickoff .ko-fly>div>div{width:100%;height:100%;transform-origin:0 0;transition:transform .7s cubic-bezier(.76,-.37,.69,.45)}
.ch-kickoff .ko-fly-i>div>div{animation:ko-fly-o .7s linear both}
.ch-kickoff .ko-fly-i svg{width:100%;height:100%}
@keyframes ko-fly-o{0%{opacity:.8}50%{opacity:1}99.9%{opacity:1}100%{opacity:0}}
.ch-kickoff .ko-fly-t,.ch-kickoff .ko-fly-t>div{transition-duration:.6s;transition-delay:.1s}
.ch-kickoff .ko-fly-t>div>div{transition:transform .6s cubic-bezier(.42,0,.58,1) .1s}
.ch-kickoff .ko-fly-t span{display:block;font-family:var(--f-serif);font-weight:400;line-height:1.3;letter-spacing:-1.68px;white-space:nowrap;color:#433D40}

/* the notes list */
.ch-kickoff .ko-n-body{flex:1;min-height:0;box-sizing:border-box;padding:24px 32px;overflow-y:auto;scrollbar-width:none;display:none}
.ch-kickoff .ko-n-body::-webkit-scrollbar{display:none}
.ch-kickoff.ko-playing .ko-intro{display:none}
.ch-kickoff.ko-playing .ko-n-body{display:block}
.ch-kickoff .ko-seg{margin-bottom:16px;padding-bottom:12px}
.ch-kickoff .ko-seg h3{margin:0;font:600 16px/24px var(--f-sans);color:#2A2118}
.ch-kickoff .ko-seg i{display:block;margin-top:12px;border-bottom:1px solid oklch(.928 .006 264.531)}
.ch-kickoff .ko-list{display:flex;flex-direction:column;gap:4px;margin-bottom:16px}
.ch-kickoff .ko-fill{min-height:40px;cursor:text}
/* one note (ChecklistNoteItem): a 20px point, 12px, the line */
.ch-kickoff .ko-row{position:relative;display:flex;align-items:flex-start;gap:12px;padding:2px 8px;margin:0 -8px;border-radius:8px;animation:ko-fade .3s ease-in-out}
@keyframes ko-fade{from{opacity:0}}
.ch-kickoff .ko-pt{position:relative;flex:none;width:20px;height:20px;margin-top:2px;display:flex;align-items:center;justify-content:center}
.ch-kickoff .ko-dot{position:relative;z-index:1;display:block;width:7px;height:7px;border-radius:50%;background:#1F1D1E;transition:background-color .3s}
.ch-kickoff .ko-tx{flex:1;min-width:0}
.ch-kickoff .ko-ta{appearance:none;display:block;width:100%;height:24px;min-height:24px;max-height:180px;margin:0 0 7px;padding:0;border:0;outline:0;resize:none;overflow-y:auto;background:transparent;border-radius:0;
  font:400 14px/1.625 var(--ko-sys);letter-spacing:0;color:oklch(.278 .033 256.848);caret-color:currentColor;scrollbar-width:none}
.ch-kickoff .ko-ta::placeholder{color:color-mix(in oklab,currentColor 50%,transparent);opacity:1}
.ch-kickoff .ko-p{margin:0;min-height:24px;font:400 14px/1.625 var(--ko-sys);color:oklch(.278 .033 256.848);cursor:default;overflow-wrap:anywhere;transition:color .3s}
.ch-kickoff .ko-read .ko-p{color:oklch(.446 .03 256.802)}
/* where the skill points rise from: over the note's point, never on its words */
.ch-kickoff .ko-from{position:absolute;left:78px;top:-18px;width:0;height:0}

/* analysing: the point turns green and breathes, specks are pulled into it, a green band sweeps the words toward it */
.ch-kickoff .ko-an .ko-dot,.ch-kickoff .ko-seen .ko-dot{background:#49BA61}
.ch-kickoff .ko-an .ko-pt::before{content:'';position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:rgba(73,186,97,.25);animation:ko-ring 1.5s ease-in-out infinite}
@keyframes ko-ring{0%,100%{transform:scale(1);opacity:.25}50%{transform:scale(1.8);opacity:.5}}
.ch-kickoff .ko-pt u{position:absolute;left:50%;top:50%;width:3.25px;height:3.25px;margin:-1.6px 0 0 -1.6px;border-radius:50%;background:#49BA61;opacity:0;pointer-events:none;text-decoration:none}
.ch-kickoff .ko-an .ko-pt u,.ch-kickoff .ko-seen .ko-pt u{animation:ko-absorb 1.2s cubic-bezier(.45,.45,1,.4) infinite}
@keyframes ko-absorb{0%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0}4%{opacity:.45}27%{opacity:.45}30%{transform:translate(0,0) scale(.5);opacity:0}100%{transform:translate(0,0) scale(.5);opacity:0}}
.ch-kickoff .ko-an .ko-p span,.ch-kickoff .ko-seen .ko-p span{background-image:linear-gradient(90deg,#1F1D1E 0%,#1F1D1E 40%,#92D6A0 47%,#92D6A0 51%,#49BA61 58%,#1F1D1E 68%,#1F1D1E 100%);background-size:250% 100%;background-position:0% 0;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:ko-shim .5s linear infinite}
@keyframes ko-shim{to{background-position:100% 0}}
/* graded right (GradedPointCircle): the ring pops, the tick draws, the points number floats up 16px and fades */
.ch-kickoff .ko-ok{width:20px;height:20px;animation:ko-pop .3s cubic-bezier(.34,1.56,.64,1) both}
.ch-kickoff .ko-ok-t{stroke-dasharray:20;animation:ko-draw .35s ease-out backwards}
@keyframes ko-pop{from{transform:scale(.35)}}
@keyframes ko-draw{from{stroke-dashoffset:20}}
.ch-kickoff .ko-plus{position:absolute;left:50%;top:-14px;font:700 17.5px/1 var(--ko-sys);color:#49BA61;white-space:nowrap;pointer-events:none;opacity:0;animation:ko-float .65s ease-out both}
@keyframes ko-float{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-16px)}}
/* a point the notes missed: the black star, its words decoded letter by letter (DecryptedText) */
.ch-kickoff .ko-miss{width:14px;height:14px}
.ch-kickoff .ko-ch{display:inline-block;opacity:0;color:#49BA61;filter:blur(.6px);transition:opacity .12s ease-out,color .12s ease-out,filter .12s ease-out}
.ch-kickoff .ko-ch.ko-in{opacity:1}
.ch-kickoff .ko-ch.ko-done{color:#1F1D1E;filter:none}

/* the tour's white key under the note line, set in two lines for this turn only (the chapter adds .ko-tip2 while the turn is
   open): "Try taking this note" over the note, so the key stays inside the notes panel with air on both sides */
#zt-root:has(.ch-kickoff) .zt-tip.ko-tip2{height:auto;flex-direction:column;align-items:flex-start;gap:6px;padding:11px 12px 12px;font-size:13px}
#zt-root:has(.ch-kickoff) .zt-tip.ko-tip2>b{padding-right:0;margin-right:0;box-shadow:none;font-size:13px;line-height:1.15}
#zt-root:has(.ch-kickoff) .zt-tip.ko-tip2>span{line-height:1.15}

/* ch/04-pou.css */
/* 4 · proof of understanding. A replica of the kickoff's POU chat as the app draws it on origin/dev:
   KickoffMeeting/index.tsx (the shared top bar + PouContextMeter), KickoffMeeting/Chat/index.tsx (the body grid),
   TrainingShared/Chat (ChatList, VoiceModuleStatic, TranscriptToggle, HoldToTalk, ListeningIndicator,
   ReadonlyNotesPanel) and the learner's Rive voice card, measured from voice_animation_v1.riv.
   The app window is the canvas, 1600 wide, and ends at y 786 where the player crops it. Real px values, 1:1. */
.ch-pou{background:#F2F0ED;color:#2A2118;font-family:var(--f-sans);letter-spacing:0;-webkit-font-smoothing:antialiased}
.ch-pou .pu-app{position:absolute;left:0;top:0;width:1600px;height:786px;display:flex;flex-direction:column;background:#F2F0ED}
.ch-pou button{margin:0;font-family:inherit}

/* ---------- the top bar: back, the context meter, nothing else (MeetingTopBar, PouContextMeter) ---------- */
.ch-pou .pu-top{flex:0 0 auto;display:grid;grid-template-columns:1.3fr 1.8fr 1.3fr;align-items:center;padding:16px 32px;background:#F2F0ED}
.ch-pou .pu-top-l{display:flex;align-items:center;gap:16px;min-width:0}
.ch-pou .pu-back{appearance:none;display:flex;align-items:center;justify-content:center;width:56px;height:56px;flex:0 0 56px;padding:0;border-radius:50%;
  background:#E8E4DF;border:1px solid #f5f5f5;color:#000;cursor:default}
.ch-pou .pu-back svg{display:block;width:24px;height:24px}
/* the level chip of the HUD (LegacyXpLevelPill), drawn at 50 high and zoomed to 33 as the app does */
.ch-pou .pu-top-r{position:relative;display:flex;align-items:center;justify-content:flex-end;gap:12px}
.ch-pou .pu-lvl{zoom:.66;display:flex;flex:none;flex-direction:column;align-items:flex-start;padding:10px 20px;border:2px solid rgba(255,255,255,.1);border-radius:30px;
  background:rgba(0,0,0,.2);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);opacity:0;transform:scale(.6);transform-origin:100% 50%}
.ch-pou.pu-lvl-on .pu-lvl{opacity:1;transform:none;transition:opacity .25s ease-out,transform .6s cubic-bezier(.34,1.56,.64,1)}
.ch-pou .pu-lvl-in{position:relative;display:flex;align-items:center;gap:8px;width:100%}
.ch-pou .pu-lvl-b{position:absolute;inset:0;z-index:1;pointer-events:none}
.ch-pou .pu-lvl-b b{position:absolute;left:50%;top:0;white-space:nowrap;font:500 15px/1 var(--f-mono);font-variant-numeric:tabular-nums;color:#FFD764;text-shadow:0 2px 10px rgba(0,0,0,.55);
  animation:pou-earn 1.25s cubic-bezier(.22,.61,.36,1) both}
.ch-pou .pu-lvl-b i{position:absolute;left:50%;top:50%;width:5px;height:5px;border-radius:50%;background:#FFD764}
@keyframes pou-earn{0%{opacity:0;transform:translate(-50%,4px) scale(.9)}33%,66%{opacity:1}100%{opacity:0;transform:translate(-50%,-36px) scale(1)}}
.ch-pou .pu-lvl-in>i{position:relative;flex:none;width:25.4px;height:26px}
.ch-pou .pu-lvl-in>i img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover}
.ch-pou .pu-lvl-in p{margin:0;font:400 22px/16px var(--f-mono);letter-spacing:-1.1px;white-space:nowrap;color:#fff;font-feature-settings:'lnum' 1,'tnum' 1;text-box-trim:trim-both;text-box-edge:cap alphabetic}
.ch-pou .pu-top-c{position:relative;display:flex;justify-content:center;align-items:center;width:100%;min-width:0}
.ch-pou .pu-meter{display:flex;justify-content:center;align-items:center;gap:16px;width:60%;padding:16px 20px;border-radius:999px;background:#fff;box-shadow:0 2px 12px rgba(31,29,30,.07)}
.ch-pou .pu-bar{position:relative;flex:1 1 0;min-width:0}
.ch-pou .pu-track{height:10px;border-radius:999px;overflow:hidden;background:rgba(31,29,30,.05)}
.ch-pou .pu-fill{position:relative;width:0;height:100%;border-radius:999px;overflow:hidden;isolation:isolate;
  background:linear-gradient(180deg,#7FD495 0%,#49BA61 50%,#37A653 100%);transition:width 1.2s cubic-bezier(.25,.1,.25,1)}
.ch-pou .pu-gloss{position:absolute;left:0;right:0;top:0;height:50%;border-radius:999px;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.8) 0%,rgba(255,255,255,0) 100%);mix-blend-mode:overlay}
.ch-pou .pu-shine{position:absolute;top:0;bottom:0;left:-45%;width:49%;pointer-events:none;transform:skewX(-18deg);
  background:linear-gradient(90deg,rgba(187,255,0,0) 0%,rgba(187,255,0,.7) 50%,rgba(187,255,0,0) 100%);mix-blend-mode:overlay;
  animation:pou-sweep 3.7s cubic-bezier(.37,0,.63,1) infinite}
@keyframes pou-sweep{from{left:-45%}to{left:135%}}
.ch-pou .pu-brain{display:block;flex:0 0 32px;width:32px;height:32px}
.ch-pou.pu-conceal .pu-meter{opacity:0}
.ch-pou .pu-brain path{fill:#1F1D1E;fill-opacity:.6}
.ch-pou.pu-done .pu-brain path{fill:#49BA61;fill-opacity:1}

/* ---------- the body: chat 1.8fr, notes 0.8fr, 30px apart ---------- */
.ch-pou .pu-body{flex:1 1 0;min-height:0;display:grid;grid-template-columns:1.8fr .8fr;column-gap:30px;padding:66px 40px 40px}
.ch-pou .pu-chat{display:flex;flex-direction:column;min-height:0;min-width:0;transition:opacity .4s ease}
.ch-pou.pu-held .pu-chat{opacity:0;pointer-events:none}
.ch-pou .pu-list{position:relative;flex:1 1 0;min-height:0}
.ch-pou .pu-topfade{position:absolute;left:0;right:0;top:0;height:15%;z-index:2;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,#F2F0ED 0%,rgba(242,240,237,0) 100%);transition:opacity .7s ease-in-out}
.ch-pou .pu-list.pu-scrolled .pu-topfade{opacity:1}
.ch-pou .pu-scroll{height:100%;padding:12px 0 16px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 16px,#000 calc(100% - 40px),transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0,#000 16px,#000 calc(100% - 40px),transparent 100%)}
.ch-pou .pu-scroll::-webkit-scrollbar{display:none}
.ch-pou .pu-inner{display:flex;flex-direction:column;max-width:768px;min-height:100%;margin:0 auto;padding:0 24px}
.ch-pou .pu-row{flex:0 0 auto}
.ch-pou .pu-tailgap{flex:0 0 112px;height:112px}

/* ---------- the manager's voice note (VoiceModuleStatic): one white pill, loader first, then the note ---------- */
.ch-pou .pu-npc{display:flex;align-items:flex-start;gap:12px}
.ch-pou .pu-av{position:relative;flex:0 0 40px;width:40px;height:40px}
/* his seat. It never animates, so the engine can always measure it. */
.ch-pou .pu-slot{position:absolute;inset:0;border-radius:50%;background:#C9C2B8}
.ch-pou .pu-av img{position:absolute;inset:0;display:block;width:100%;height:100%;border-radius:50%;object-fit:cover}
