  font-family:var(--f-sans);font-size:14px;line-height:1.55;letter-spacing:-.01em;color:#f2f1ee;-webkit-font-smoothing:antialiased}
.ch-workspace.ws-pp-on .ws-pp{visibility:visible}
.ch-workspace .ws-pp::before{content:"";position:absolute;inset:0;border-radius:28px;box-shadow:0 25px 50px -12px rgba(0,0,0,.55),0 10px 30px rgba(0,0,0,.25);opacity:0;transition:opacity .5s ease}
.ch-workspace.ws-pp-on .ws-pp::before{opacity:1}
.ch-workspace .ws-pp-card{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;border-radius:28px;background:#1b1b1d;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.ch-workspace .ws-pp-card>*{opacity:0;transform:translateY(8px);filter:blur(6px);transition:opacity .34s var(--w-ease),transform .5s var(--w-ease),filter .34s var(--w-ease)}
.ch-workspace.ws-pp-on .ws-pp-card>*{opacity:1;transform:none;filter:none}
.ch-workspace.ws-pp-on .ws-pp-card>:nth-child(2){transition-delay:.05s}
.ch-workspace.ws-pp-on .ws-pp-card>:nth-child(3){transition-delay:.1s}
.ch-workspace.ws-pp-out .ws-pp-card>*{opacity:0;transform:scale(.98);filter:blur(6px);transition-duration:.16s;transition-delay:0s}
.ch-workspace .ws-pp-drag{flex:0 0 auto;display:flex;justify-content:center;padding:4px 0 8px}
.ch-workspace .ws-pp-drag i{width:20px;height:4px;border-radius:99px;background:rgba(255,255,255,.2)}
.ch-workspace .ws-pp-head{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 12px 4px}
.ch-workspace .ws-pp-title{flex:1;min-width:0;padding-top:2px;font-size:14px;font-weight:500;line-height:1.375;letter-spacing:-.015em;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.05)}
.ch-workspace .ws-pp-timer{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.08);color:#7fd894;font-size:11px;font-weight:600;line-height:16px;font-variant-numeric:tabular-nums}
.ch-workspace .ws-pp-timer svg{width:12px;height:12px}
.ch-workspace .ws-pp-timer b{font-weight:600}
.ch-workspace .ws-pp-acts{flex:0 0 auto;display:flex;align-items:center;gap:6px}
.ch-workspace .ws-pp-chev{width:36px;height:36px;display:grid;place-items:center;color:#a3a3a3}
.ch-workspace .ws-pp-chev svg{width:20px;height:20px}
.ch-workspace .ws-pp-ib{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05),0 1px 2px rgba(0,0,0,.05);color:rgba(255,255,255,.7)}
.ch-workspace .ws-pp-ib svg{width:14px;height:14px}
.ch-workspace .ws-pp-ib.ws-pp-brief{color:#fff}
.ch-workspace .ws-pp-ib.ws-pp-brief svg{width:16px;height:16px}
.ch-workspace .ws-pp-ok{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#e2e2e2;color:#000;box-shadow:0 10px 15px -3px rgba(0,0,0,.2),0 4px 6px -4px rgba(0,0,0,.2)}
.ch-workspace .ws-pp-ok svg{width:16px;height:16px}
.ch-workspace .ws-pp-body{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.ch-workspace .ws-pp-thread{flex:1;min-height:0;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 15px,#000 calc(100% - 15px),transparent);mask-image:linear-gradient(180deg,transparent 0,#000 15px,#000 calc(100% - 15px),transparent)}
/* the compact .app.pip scope: 12.5 bubbles, a 12px gutter, 9px stage labels, an 80 page band on a sent file */
.ch-workspace .ws-pp-msgs{display:flex;flex-direction:column;gap:12px;padding:12px 12px 20px;pointer-events:none}
.ch-workspace .ws-pp-msgs>.ws-new{animation:ws-rise var(--w-tm) var(--w-ease) both}
.ch-workspace .ws-pp .ws-mgr{max-width:96%}
.ch-workspace .ws-pp .ws-mgr.ws-cont{margin-top:-6px}
.ch-workspace .ws-pp .ws-mbubble,.ch-workspace .ws-pp .ws-user{font-size:12.5px;line-height:1.5;padding:8px 12px;border-radius:14px}
.ch-workspace .ws-pp .ws-user{max-width:86%}
.ch-workspace .ws-pp .ws-stagediv{margin:2px 0}
.ch-workspace .ws-pp .ws-sd-txt{font-size:9px}
.ch-workspace .ws-pp .ws-sth{height:80px}
.ch-workspace .ws-pp .ws-subm-t{font-size:11px}
.ch-workspace .ws-pp .ws-subm-m{padding:7px 11px 9px}
.ch-workspace .ws-pp-foot{flex:0 0 auto;padding:4px 12px 12px}
.ch-workspace .ws-pp-comp{padding:0 10px 10px}
.ch-workspace .ws-pp-pill{position:relative;display:flex;flex-direction:column;background:#282828;border:1px solid rgba(255,255,255,.075);border-radius:13px}
.ch-workspace .ws-pp-attrow{display:none;gap:9px;padding:10px 10px 2px}
.ch-workspace .ws-pp-pill.ws-has-att .ws-pp-attrow{display:flex}
.ch-workspace .ws-pp .ws-att-big{width:118px}
.ch-workspace .ws-pp .ws-atb-th{height:74px}
.ch-workspace .ws-pp .ws-atb-n{font-size:11px}
.ch-workspace .ws-pp-ta{min-height:19px;padding:9px 13px 3px;font-size:12.5px;line-height:1.5;color:#f2f1ee}
.ch-workspace .ws-pp-ta:empty::before{content:attr(data-ph);color:#6d6a63}
.ch-workspace .ws-pp-ctrl{display:flex;align-items:center;gap:1px;padding:2px 5px 5px}
.ch-workspace .ws-pp-b,.ch-workspace .ws-pp-send{width:30px;height:30px;flex:0 0 auto;border-radius:99px;display:grid;place-items:center;color:#a5a29b}
.ch-workspace .ws-pp-b svg,.ch-workspace .ws-pp-send svg{width:16px;height:16px}
.ch-workspace .ws-pp-stuck{display:inline-flex;align-items:center;height:26px;padding:0 11px;margin-left:3px;border-radius:99px;font-size:11.5px;font-weight:600;letter-spacing:-.005em;color:#f2f1ee;background:#333;box-shadow:inset 0 0 0 1px rgba(255,255,255,.075);white-space:nowrap}
.ch-workspace .ws-pp-sp{flex:1}
.ch-workspace .ws-pp-send{display:none;background:#fff;color:#111;box-shadow:0 2px 10px rgba(0,0,0,.16);cursor:pointer;transition:transform var(--w-tq) var(--w-ease)}
.ch-workspace .ws-pp-pill.ws-active-send .ws-pp-mic{display:none}
.ch-workspace .ws-pp-pill.ws-active-send .ws-pp-send{display:grid}
.ch-workspace .ws-pp-send:hover{transform:scale(1.06)}
.ch-workspace .ws-pp-send:active{transform:scale(.95)}
/* its drop state, as the PiP's file drop zone draws it: a dashed 24 radius box, white at 20 percent, "Drop file here" */
.ch-workspace .ws-pp-drop{position:absolute;left:10px;right:10px;top:2px;bottom:10px;z-index:3;display:grid;place-items:center;border-radius:24px;pointer-events:none;
  background:linear-gradient(rgba(255,255,255,.2),rgba(255,255,255,.2)),rgba(27,27,29,.84);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  opacity:0;transform:scale(.97);transition:opacity .22s var(--w-ease),transform .45s cubic-bezier(.34,1.4,.64,1)}
.ch-workspace.ws-pp-over .ws-pp-drop{opacity:1;transform:scale(1.02)}
.ch-workspace .ws-pp-dash{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ch-workspace .ws-pp-dash rect{width:calc(100% - 1px);height:calc(100% - 1px);fill:none;stroke:rgba(255,255,255,.3);stroke-width:1;stroke-dasharray:8 4}
.ch-workspace .ws-pp-dz{position:relative;display:flex;align-items:center;gap:4px;font-size:18px;font-weight:500;line-height:20px;letter-spacing:-.015em;color:#fff}
.ch-workspace .ws-pp-dz svg{width:24px;height:24px;color:#fff}

/* ---- the file in the hand: a copy of Claude's card under the pointer, lifted. It settles back if it is let go anywhere else ---- */
.ch-workspace .ws-ghost{position:absolute;z-index:60;pointer-events:none;transform-origin:0 0}
.ch-workspace .ws-ghost .ws-cl-file{transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease}
.ch-workspace .ws-ghost.ws-up .ws-cl-file{transform:rotate(-1.5deg) scale(1.03);box-shadow:inset 0 0 0 1px rgba(31,30,29,.13),0 22px 48px rgba(0,0,0,.32),0 4px 12px rgba(0,0,0,.16)}
.ch-workspace .ws-ghost.ws-up.ws-over .ws-cl-file{transform:rotate(-1deg) scale(.6)}
.ch-workspace .ws-ghost.ws-home{transition:left .36s cubic-bezier(.62,0,.2,1),top .36s cubic-bezier(.62,0,.2,1)}
.ch-workspace .ws-ghost.ws-land{transition:transform .46s cubic-bezier(.62,0,.2,1),opacity .18s ease .3s;opacity:0}
.ch-workspace.ws-dragging-file{cursor:grabbing}
@keyframes ws-spark{0%{transform:rotate(0) scale(1)}25%{transform:rotate(90deg) scale(.84)}50%{transform:rotate(180deg) scale(1)}75%{transform:rotate(270deg) scale(.84)}100%{transform:rotate(360deg) scale(1)}}

/* ---------- motion ---------- */
/* laid out in one go: nothing enters while the screen is being built */
.ch-workspace.ws-instant *,.ch-workspace.ws-instant *::before,.ch-workspace.ws-instant *::after{animation:none!important;transition:none!important}
/* entered half way: the frame is simply there */
.ch-workspace.ws-noent .ws-rev,.ch-workspace.ws-noent .ws-back{animation:none}
@keyframes ws-rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes ws-stepIn{from{opacity:0;filter:blur(7px);transform:translateY(-12px)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes ws-activeReveal{0%{opacity:0;filter:blur(24px);transform:translateY(22px) scale(.93)}45%{opacity:1}62%{filter:blur(5px)}100%{opacity:1;filter:blur(0);transform:none}}
@keyframes ws-unlockGlow{0%{box-shadow:0 0 0 0 rgba(163,230,53,0)}32%{box-shadow:0 0 0 2px rgba(163,230,53,.4),0 0 34px rgba(74,222,128,.34)}100%{box-shadow:0 0 0 0 rgba(163,230,53,0)}}
@keyframes ws-innerReveal{from{opacity:0;filter:blur(10px);transform:translateY(11px)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes ws-rxspin{0%{transform:rotate(-50deg) scale(.4);opacity:0}70%{transform:rotate(6deg) scale(1.09)}100%{transform:none;opacity:1}}
@keyframes ws-orbit{from{transform:rotate(0deg) translateX(var(--or,44px))}to{transform:rotate(360deg) translateX(var(--or,44px))}}
@keyframes ws-orbin{to{opacity:.95}}
@keyframes ws-rxfill{to{width:100%}}
@keyframes ws-slidelr{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
@keyframes ws-hudin{from{opacity:0}to{opacity:1}}
@keyframes ws-tbob{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
@keyframes ws-submScan{0%{background-position:170% 0}100%{background-position:-170% 0}}
@keyframes ws-txshine{0%{background-position:130% 0}100%{background-position:-30% 0}}
@keyframes ws-syIn{0%{opacity:0;filter:blur(6px);transform:translateY(4px)}100%{opacity:1;filter:blur(0);transform:none}}
@keyframes ws-syPulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.1);opacity:1}}
@keyframes ws-cardGlow{0%{box-shadow:0 0 0 0 rgba(74,222,128,0)}34%{box-shadow:0 0 36px -4px rgba(74,222,128,.5)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
@keyframes ws-swap{from{opacity:0;filter:blur(5px);transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){
  .ch-workspace .ws-rev,.ch-workspace .ws-back,.ch-workspace .ws-msgs>.ws-new,.ch-workspace .ws-att-big{animation:none}
  .ch-workspace .ws-gstep.ws-slide-in,.ch-workspace .ws-active.ws-just-active,.ch-workspace .ws-active.ws-just-active>*,.ch-workspace .ws-rx-burst,.ch-workspace .ws-rx-ring i{animation:none}
  .ch-workspace .ws-rx-bar>i{animation:none;width:100%}
  .ch-workspace .ws-cr,.ch-workspace .ws-pp-card>*,.ch-workspace .ws-pp-drop,.ch-workspace.ws-desk-on .ws-app[data-theme="dark"],.ch-workspace.ws-desk-on .ws-app[data-theme="dark"] .ws-work{transition-duration:.01s}
  .ch-workspace .ws-cl-a.ws-cl-working .ws-cl-spark,.ch-workspace .ws-cl-think span{animation:none}
  .ch-workspace .ws-sy-line.ws-in{animation:none;opacity:1}
  .ch-workspace .ws-app.ws-learn,.ch-workspace .ws-cpanel{transition-duration:.01s}
  .ch-workspace .ws-subm.ws-analyzing .ws-subm-att::after{animation:none;background:rgba(63,185,104,.10)}

/* ch/07-present.css */
/* 7 · presentation. The app's presentation room, value for value from origin/dev:
   StageWorkspacePresentation/styles/presentationRoom.css, presentationPresenting.css, presentationMeetPanel.css,
   presentationQa.css, roomCaptionsToggle.css and PresentationMode/styles/presentationLiveRoom.css,
   presentationPresentingLive.css, presentingRoomFloor.css.
   The room is a 1600 x 786 window. Where the app writes vw, vh or a clamp, the number here is that rule
   resolved for this window and the rule is quoted beside it. The room's own states snap, as they do in the app. */
.ch-present{background:#202124;color:#f2f1ee;font:400 14px/1.55 var(--f-sans);letter-spacing:-.01em}
.ch-present *,.ch-present *::before,.ch-present *::after{box-sizing:border-box}
.ch-present .pr-room{position:absolute;left:0;top:0;width:1600px;height:786px;overflow:hidden;background:#202124}
/* paneled and presenting: the room drops to the app's own grey (.zwp-rm background: var(--bg)) */
.ch-present.pr-s-share,.ch-present.pr-s-share .pr-room{background:#1e1e1e}
.ch-present svg{display:block}

/* which pieces each state shows */
.ch-present .pr-v{position:absolute;inset:0;display:none}
.ch-present.pr-s-greet .pr-v-greet,.ch-present.pr-s-share .pr-v-share,.ch-present.pr-s-qa .pr-v-qa{display:block}
.ch-present:not(.pr-s-greet) .pr-if-greet,.ch-present:not(.pr-s-share) .pr-if-share,.ch-present:not(.pr-s-qa) .pr-if-qa,
.ch-present.pr-s-greet .pr-if-run,.ch-present.pr-s-share .pr-if-door{display:none}

/* ---------- the top strip (.zwp-gm-topbar) ---------- */
.ch-present .pr-topbar{position:absolute;top:16px;left:16px;right:16px;height:64px;background:#242528;border-radius:14px;padding:0 12px 0 16px;
  display:flex;align-items:center;justify-content:space-between;z-index:60}
.ch-present .pr-tl{display:flex;align-items:center;gap:14px;min-width:0}
.ch-present .pr-title{font-size:14px;font-weight:500;color:#e8eaed;white-space:nowrap}
.ch-present .pr-stitle{font-size:13px;color:rgba(255,255,255,.55);white-space:nowrap}
/* the contract clock: mono numerals, the timer icon, always */
.ch-present .pr-ck{font-family:var(--f-mono);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:#e8eaed;background:#3c4043;border-radius:10px;padding:9px 12px;
  display:inline-flex;align-items:center;gap:6px}
.ch-present .pr-ck svg{width:14px;height:14px}
.ch-present .pr-ck b{font-weight:700}
.ch-present .pr-acts{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.ch-present .pr-act{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:rgba(255,255,255,.72);background:rgba(255,255,255,.08)}
.ch-present .pr-act.pr-on{background:#8ab4f8;color:#202124}
.ch-present .pr-act svg,.ch-present .pr-leave svg{width:20px;height:20px}
.ch-present .pr-leave{width:44px;height:44px;border-radius:12px;background:#ea4335;color:#fff;display:grid;place-items:center}

/* ---------- the stage and the tiles (.zwp-rm-stage, .zwp-mgrid.zwp-is-big, .zwp-mtile) ---------- */
.ch-present .pr-stage{position:absolute;display:grid;place-items:center;align-content:center}
.ch-present .pr-grid{display:flex;gap:26px;justify-content:center;align-items:center;width:100%}
.ch-present .pr-tile{position:relative;flex:0 0 auto;border-radius:12px;background:#3c4043;display:grid;place-items:center;overflow:hidden}
.ch-present .pr-tile.pr-speaking{outline:3px solid #8ab4f8;outline-offset:-3px}
.ch-present .pr-facewrap{position:relative;display:grid;place-items:center}
.ch-present .pr-pulse{position:absolute;width:96px;height:96px;border-radius:99px;pointer-events:none;opacity:0;box-shadow:0 0 0 0 rgba(255,255,255,.35);transition:opacity .3s var(--zt-ease)}
.ch-present .pr-tile.pr-speaking .pr-pulse{opacity:1;animation:pr-present-pulse 1.9s var(--zt-ease) infinite}
@keyframes pr-present-pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.42)}70%{box-shadow:0 0 0 22px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(63,185,104,0)}}
.ch-present .pr-face{position:relative;width:96px;height:96px;border-radius:99px;overflow:hidden;background:#3c4043;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.ch-present .pr-face img,.ch-present .pr-init img,.ch-present .pr-capav img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ch-present .pr-nm{position:absolute;left:16px;bottom:14px;z-index:4;max-width:calc(100% - 28px);font-size:14px;font-weight:600;color:#fff}
.ch-present .pr-nm>span{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.ch-present .pr-nm em{font-style:normal;font-weight:400;color:#b7b4ba;font-size:14px}
.ch-present .pr-nm em::before{content:'\2022';margin-right:7px;color:#6f6c74}

/* the room before the run (.zwp-live-room). Stage reserve: 96px 0 300px under a 48px head row.
   Tile: min(640px, 46.5vw, (100dvh - 470px) * 1.6) = 505.6, at 16 / 10. */
.ch-present .pr-v-greet .pr-stage{left:16px;right:16px;top:58px;bottom:14px;padding:96px 0 300px}
.ch-present .pr-v-greet .pr-tile{width:505.6px;height:316px}
/* the Q&A (.zwp-present-room .zwp-is-qaroom). Head pad clamp(48px, 9vh, 96px) = 70.74.
   Reserve clamp(92px + cap min, 32vh, 300px) = 251.52. Tile: min(640px, 46%), at 16 / 10. */
.ch-present .pr-v-qa .pr-stage{left:16px;right:16px;top:58px;bottom:14px;padding:70.74px 0 251.52px}
.ch-present .pr-v-qa .pr-tile{width:640px;height:400px}

/* ---------- your own seat (.zwp-rm-selfpip) ---------- */
.ch-present .pr-self{position:absolute;right:16px;bottom:96px;width:250px;aspect-ratio:16 / 10;border-radius:12px;overflow:hidden;background:#262626;
  box-shadow:0 16px 42px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.075);z-index:6;display:grid;place-items:center}
/* in the Q&A: bottom clamp(52px, 11vh, 96px) = 86.46 */
.ch-present .pr-v-qa .pr-self{bottom:86.46px}
.ch-present .pr-zav{display:grid;place-items:center}
.ch-present .pr-zav b{width:62px;height:62px;border-radius:99px;background:#6f7f9c;color:#fff;display:grid;place-items:center;font-weight:600;font-size:21.08px;line-height:1;letter-spacing:.01em}
.ch-present .pr-self-nm{position:absolute;left:10px;bottom:9px;z-index:2;font-size:11.5px;font-weight:600;color:#fff;background:rgba(0,0,0,.5);border-radius:7px;padding:3px 9px}
/* the camera switch on the seat (.zwp-lr-cam), only before the run */
.ch-present .pr-lrcam{position:absolute;right:8px;bottom:8px;z-index:3;width:34px;height:34px;display:grid;place-items:center;border-radius:99px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.55);color:#fff}
.ch-present .pr-lrcam svg{width:18px;height:18px}

/* ---------- the line above the pill (.zwp-lr-note) ---------- */
.ch-present .pr-note{position:absolute;left:50%;bottom:140px;transform:translateX(-50%);z-index:6;display:flex;flex-direction:column;align-items:center;gap:4px;
  width:max-content;max-width:420px;text-align:center;font-size:13px;line-height:1.35;color:#a5a29b;pointer-events:none}

/* ---------- the room's white centre pill (.zwp-gm-phase) ---------- */
.ch-present .pr-pill{position:absolute;left:50%;transform:translateX(-50%);height:48px;min-height:48px;margin:0;padding:0 8px 0 24px;gap:12px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:99px;background:#fff;color:#202124;border:0;font:600 14.5px/1.55 var(--f-sans);letter-spacing:-.01em;white-space:nowrap;cursor:default;box-shadow:0 18px 44px rgba(0,0,0,.45)}
.ch-present .pr-pill.pr-dis{opacity:.6}
/* the offer that starts the run (.zwp-is-offer): under the caption band */
.ch-present .pr-offer{bottom:84px;z-index:6;color:#0d0d0d;box-shadow:0 12px 34px rgba(0,0,0,.42)}
.ch-present .pr-gpt{height:32px;padding:0 13px;gap:6px;display:inline-flex;align-items:center;border-radius:99px;background:#eceae6;color:#202124;
  font-family:var(--f-mono);font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.ch-present .pr-gpt svg{width:14px;height:14px;opacity:.75}

/* the featured slot: the case study tile lands on it, then turns over into the recording.
   pf-flat: the turn is done and the recording stands on its own, with no 3D layer left on it */
.ch-portfolio .pf-sl .pf-fslot{position:relative;width:100%;aspect-ratio:96/60;perspective:1100px}

.ch-portfolio.pf-flat .pf-sl .pf-flip,.ch-portfolio.pf-flat .pf-sl .pf-back{transform:none;transition:none}
.ch-portfolio.pf-flat .pf-sl .pf-front{display:none}

/* the list: each project lands on top and pushes the others down. The source's 26px gap becomes each row's own

/* ---------- b11's project done moment (unchanged) on the app's 1920 canvas ----------
   pf-inst: nothing moves. pf-hoo-on: the veil is up. pf-hoo-in: the tile is there. pf-hoo-done: the tick, the words,
   the paper. pf-hoo-go: the veil lifts and the tile flies to the featured slot (b14: taking the slot's shape on the way).
   pf-hoo-gone: the slot's own copy has taken over. */
.ch-portfolio .pf-fx{position:absolute;z-index:1;left:0;top:0;width:1920px;height:1008px;transform:scale(.833333);transform-origin:0 0;font-size:16px;line-height:1.5;color:#1F1D1E;pointer-events:none}

  transition:transform .8s var(--zt-ease),opacity .4s var(--zt-ease)}

/* 8b · the job portal step (b14). The designer's job portal, v82 (job-portal/handover/zero-job-portal-handover-v82),
   rebuilt at its real scale from its own computed CSS: the grey canvas with the white sheet, the top bar, the Jobs
   table, the applying pill, the For you to-do, and its level up and offer celebrations (the WebGL sky, st25).
   Every class is jb- and every rule sits under .ch-jobs. Inter is the portal's own face (assets/fonts, loaded in JS). */
.ch-jobs{--jb-canvas:#F3F3F5;--jb-well:#F6F6F8;--jb-well2:#EDEDF0;--jb-line:#E7E7EB;--jb-line2:#D4D5DA;--jb-ink:#131417;--jb-ink2:#4E525C;--jb-ink3:#6A6F7A;--jb-ink4:#A6A9B2;
  --jb-e:cubic-bezier(.2,0,0,1);--jb-f:'JB Inter','Inter',-apple-system,'SF Pro Text','Helvetica Neue',system-ui,sans-serif;--jb-h:786px;
  background:var(--jb-canvas);color:var(--jb-ink2);font:400 14px/20px var(--jb-f);letter-spacing:-.006em;font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased;overflow:hidden}
.ch-jobs.jb-full{--jb-h:840px}
.ch-jobs *{box-sizing:border-box}

.ch-jobs p,.ch-jobs h1,.ch-jobs h2,.ch-jobs h3{margin:0}

<script>
/* script.js */
/* ZERO desktop first run + "How Zero works" · the words (v3).
   Written from Navid's own phrasing in the 2026-10 founder conversation. One voice: Navid.
   He will record these himself; until then the clips are placeholders.
   `text` is what the captions show. `tts` (optional) is what a voice model is sent when the
   spelling needs help. Never edit a line after its audio exists: change the id and re-record that clip. */

/* the progress row counts only the tour itself. `lines` are the lines spoken in that step, in order:
   the player fills the step's bar as they play. */
/* `short` is the name on the player's step bar, `about` is the one line that says what the step is */
window.ZT_STEPS = [
  { id: 'kickoff',   label: 'Kickoff',                short: 'Kickoff',       about: 'Your manager briefs you. You take notes.', lines: ['K1P','K1Q','K2','K3','K4','K5'] },
  { id: 'pou',       label: 'Proof of understanding', short: 'Understanding', about: 'You say it back, so you are both aligned.', lines: ['P1','P2','P3'] },
  { id: 'workspace', label: 'Workspace',              short: 'Workspace',     about: 'Where you do the work, with your manager in the chat.', lines: ['S1A','S2','ST'] },
  { id: 'feedback',  label: 'Feedback',               short: 'Feedback',      about: 'You submit. Your manager reviews it.', lines: ['S3C','S3D','S4','S4B'] },
  { id: 'coach',     label: 'Coach',                  short: 'Coach',         about: 'Your coach shows you how to get better.', lines: ['S5'] },
  { id: 'present',   label: 'Presentation',           short: 'Presentation',  about: 'You present your work to your team.', lines: ['R1'] },
  { id: 'portfolio', label: 'Portfolio',              short: 'Portfolio',     about: 'Your work becomes proof.', lines: ['F1','F2'] },
  { id: 'jobs',      label: 'Get hired',              short: 'Get hired',     about: 'We send it out, you apply, companies write back.', lines: ['H1','H2','H3','E1'] }
];

/* v3 of the words (b8). The tour is one talk from start to end: every step hands over to the next one
   ("Okay, so that's the kickoff. Next..."), and the screen shows only the thing he is saying. */
window.ZT_LINES = {
  /* ---- first run: sign in, permissions, draw Zero (step: signin) ---- */
  N0: { text: "Hey, welcome back.", on: "Right after they sign in. Your photo is on screen." },
  N1: { text: "Before we go in, turn these on for a smooth experience.", on: "Three keys appear: microphone, camera, screen. They turn each one on." },
  N2: { text: "Great. Now draw a zero to enter.", on: "They draw a zero with the mouse and the world opens." },

  /* ---- your world: the job comes first (step: world) ---- */
  N3: { text: "So this is your world. Made just for you, to help you get into the roles you want.", on: "The Zero world, full screen." },
  N4: { text: "Here are the roles we're training you for. And these are the scenarios you'll go through to get job ready.", on: "The roles arrive first, then the scenarios as a road on the map." },
  N5: { text: "As you do scenarios, you earn skill points. Skill points unlock roles. And after every scenario, we apply to those roles with you.", on: "The skill points meter appears and links to the first role." },
  W1: { text: "So, let me show you how Zero works.", on: "No choice, no button. The tour opens over the world by itself." },

  /* ---- kickoff (step: kickoff) ---- */
  K1P: { text: "First, you work on projects. Every project is real work, at a real company. This one is Airbnb, and the job is to reduce host cancellations.", on: "The project's brief: the company, the title." },
  K1Q: { text: "For each project, you can see the tools you'll use, the skills you'll learn, and your manager, who's with you the whole way.", on: "On the same brief: the tools, the skills, the manager, each as you name it." },
  K2: { text: "It starts with a kickoff meeting, where your manager briefs you. For this one, that's me.", on: "The manager joins the card, the meeting is joined, and you are on camera in a tile, not full screen." },
  K3: { text: "So here's the brief. Fourteen percent of our hosts cancel on their guests. It's costing us three million dollars a year. I need that down to ten percent.", on: "Your tile becomes the meeting: the deck on the left, notes on the right. The numbers land as you say them." },
  K4: { text: "Make sure you take good notes, because that's how you earn skill points. Try it. Take your first note.", on: "Learner action 1: they click the note and it types itself, or they type it." },
  K5: { text: "Nice. See, you just earned some skill points.", on: "Skill points fly to the meter." },

  /* ---- the conversation with your manager (step: pou) ---- */
  P1: { text: "Okay, so that's the kickoff. Next, you talk it through with your manager, so we both know you've got it.", on: "You become a voice note in the manager thread." },
  P2: { text: "Send a really good response back, just like you would in real life. Try it. Hold space, and say what's on the screen.", on: "Learner action 2: they hold Space and say their own note." },
  P3: { text: "Great response. It's detailed, and it has the numbers.", on: "Skill points for a good response." },

  /* ---- workspace, feedback, coach (steps: workspace, feedback, coach) ---- */
  S1A: { text: "Now comes the real work. This is your workspace. What you need to deliver is on the left, and your manager is right here in the chat. Whatever doubt you have, ask your manager.", on: "The workspace. A question is asked and answered by itself." },
  S2: { text: "And if you want more help, switch on guided mode, and I'll walk you through it, step by step.", on: "Guided mode comes on. Three steps tick, one after another. Then it goes back." },
  ST: { text: "Then you do the work in the tools you'd use on the job. Claude, ChatGPT, Google Sheets, whatever you use.", on: "The tools, by their real logos, over the workspace. Each lights as you name it." },
  /* b14: S3B's take, without "I've added a file for you." The learner drags the file in themselves between the two */
  S3C: { text: "When it's ready, you come back here, and send it to your manager.", on: "Zero is a small window over Claude. The finished file is in Claude's chat. Learner action: they drag it into Zero's chat." },
  S3D: { text: "Go ahead, hit send.", on: "The file is in Zero's composer. Learner action: they click Send." },
  S4: { text: "Then I review it, and give you feedback. You make the changes, and send it again.", on: "The review, the feedback, then the fix and the second send play by themselves." },
  S4B: { text: "When it's good, I approve it, and your stage is complete. Then you move on to the next stage.", on: "The stage is marked complete and the next stage opens." },
  S5: { text: "And the whole time, your coach is watching how you work, and showing you how to get better.", on: "The coach opens with two short notes." },

  /* ---- presentation (step: present) ---- */
  R1: { text: "Once your final work is in, you present it to your team, and they ask you questions. Just like you would at a real job.", on: "The presentation room. The learner's slide is shared and a teammate asks a question." },

  /* ---- project done, portfolio (step: portfolio) ---- */
  F1: { text: "And that's it. Your project is done.", on: "The finished project, on its own, and a small celebration." },
  F2: { text: "It goes straight onto your portfolio. And every project you finish gets added to it.", on: "The project lands on the portfolio. Three more projects join it." },

  /* ---- sent to companies, roles open, apply, hired (step: jobs) ---- */
  H1: { text: "That portfolio is what we send out to companies. The more projects you do, the more roles open up for you.", on: "The portfolio goes out to companies. A role opens at each one." },
  H2: { text: "And after every scenario, we apply to those roles with you. Go ahead, apply.", on: "Learner action 4: they click Apply." },
  H3: { text: "Then companies write back, you interview, and you get hired.", on: "A reply, an interview, an offer." },

    send: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2L7.3 8.7M14 2L9.7 14l-2.4-5.3L2 6.3z"/></svg>',
    play: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>'

  var seq = 0;
  function fmt(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function r1(n) { return Math.round(n * 10) / 10; }
  function px(p) { return [p[0] / 100 * MAP_W, p[1] / 100 * MAP_H]; }
  /* a smooth line through the points (Catmull-Rom, written as cubic Beziers), from point a to point b */
  function spline(P, a, b) {
    var K = .16, d = 'M' + r1(P[a][0]) + ' ' + r1(P[a][1]);

        r1(p2[0] - (p3[0] - p1[0]) * K) + ' ' + r1(p2[1] - (p3[1] - p1[1]) * K) + ' ' + r1(p2[0]) + ' ' + r1(p2[1]);

  /* ---------- the meter: how far the points are from the next role ---------- */
  function setMeter(root, pts) {
    var S = root._wd, R = S.roles, k = 0;
    while (k < R.length && pts >= R[k].at) k++;
    var lo = k ? R[k - 1].at : 0, hi = k < R.length ? R[k].at : null;
    S.shown = pts;
    S.num.textContent = fmt(pts);
    S.fill.style.width = (hi == null ? 100 : Math.max(0, Math.min(100, (pts - lo) / (hi - lo) * 100))) + '%';
    S.rows.forEach(function (li, i) { li.classList.toggle('wd-open', i < k); li.classList.toggle('wd-next', i === k); });
    S.cap.innerHTML = hi == null ? 'Every role here is open'
      : pts > lo ? '<b>' + fmt(hi - pts) + ' more</b> to open ' + R[k].title
      : R[k].title + ' opens at <b>' + fmt(hi) + '</b>';
  }
  /* stop the slow drift exactly where it is, so every ring and rect taken after this stays true */

  var SHOWN = ['wd-on-roles', 'wd-on-road', 'wd-on-meter', 'wd-on-link', 'wd-on-apply'];

  /* ---------- the screen ---------- */
  function build(root, api) {
    var d = api.data;

    var logo = {

    };
    var roles = (d.roles || []).slice().sort(function (a, b) { return a.at - b.at; });
    /* only the scenarios this city has a building for */
    var stops = (d.scenarios || []).map(function (s) {
      var k = String(s.company || '').toLowerCase().replace(/[^a-z0-9]/g, '');
      return PLACE[k] ? { k: k, s: s, p: PLACE[k] } : null;
    }).filter(Boolean);

    /* the road: one line through every stop in order */
    var P = [], at = [];
    stops.forEach(function (st, i) {
      if (i) (VIA[stops[i - 1].k + '>' + st.k] || []).forEach(function (v) { P.push(px(v)); });
      at.push(P.length); P.push(px([st.p.x, st.p.y]));
    });
    var len = [0];
    for (var i = 1; i < P.length; i++) len.push(len[i - 1] + Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]));
    var total = len[len.length - 1] || 1, uid = 'wd-road-' + (++seq);

        '<defs><mask id="' + uid + '" maskUnits="userSpaceOnUse" x="0" y="0" width="' + MAP_W + '" height="' + MAP_H + '">' +
          '<path class="wd-road-rev" pathLength="1" d="' + spline(P, 0, P.length - 1) + '"/></mask></defs>' +
        '<g mask="url(#' + uid + ')">' +
          '<path class="wd-road-case" d="' + spline(P, 0, P.length - 1) + '"/>' +
          '<path class="wd-road-dots" d="' + spline(P, 0, P.length - 1) + '"/>' +
          '<path class="wd-road-dots wd-road-first" d="' + spline(P, 0, at[1]) + '"/>' +
        '</g></svg>';
    var marks = stops.map(function (st, n) {

        '<div class="wd-chip wd-side-' + c[2] + (go ? ' wd-chip-go' : ' wd-chip-far') + '" style="left:' + c[0] + '%;top:' + c[1] + '%;--wd-d:' + r1((wait + .1) * 10) / 10 + 's" title="' + st.s.title + '">' +
          (logo[st.k] ? '<img alt="" src="' + logo[st.k] + '">' : '') + '<b>' + st.s.company + '</b>' + (go ? '<em>Ready</em>' : '') + '</div>';

    var ready = (stops.filter(function (st) { return st.s.state === 'ready'; })[0] || stops[0] || { p: PLACE.airbnb }).p;

        '<img class="wd-city" alt="" draggable="false" src="' + api.asset('img/zero-city.jpg') + '">' +
        '<img class="wd-detail" alt="" draggable="false" src="' + api.asset('img/sc-city-airbnb.webp') + '">' +
        road +
        '<div class="wd-beam"></div>' +
        '<button class="wd-hit" type="button" tabindex="-1" aria-label="' + d.company + '. Your first scenario."></button>' +
        '<div class="wd-pin"></div>' +
        marks +
      '</div></div>' +
      '<div class="wd-shade"></div>' +
      '<svg class="wd-lead" viewBox="0 0 1600 840" aria-hidden="true"><path pathLength="1" d="' + lead + '"/></svg>' +

        '<div class="wd-meter"><div class="wd-m-in"><div class="wd-m-box">' +

      '</div>' +

      '<div class="wd-side"><div class="wd-card">' +
        '<div class="wd-co"><img alt="" src="' + api.asset('img/sc-logo-airbnb.svg') + '"><span>' + d.company + '</span></div>' +
        '<div class="wd-hello"><h2>' + (first ? 'Welcome, ' + first + '.' : 'Welcome.') + '</h2><p>Your first project is ready.</p></div>' +
        '<img class="wd-art" alt="" src="' + api.asset('img/airbnb-art.webp') + '">' +
        '<p class="wd-title">' + d.title + '</p>' +
        '<p class="wd-sum">' + d.summary + '</p>' +
        '<button class="wd-enter" type="button">' + I.play + '<span>Enter</span></button>' +
      '</div></div>' +

        '<span class="wd-end-wm">' + (window.ZT_WORDMARK || '') + '</span>' +

    function q(s) { return root.querySelector(s); }

      pick: null, press: null, replay: null

    wire(S.hit, 'pick'); wire(q('.wd-chip-go'), 'pick');

  /* 1 · your world. The job comes first: roles, the scenarios that lead to them, and the points between. */
  ZT.chapter({
    id: 'world', order: 1, steps: ['world'], tone: 'dark', bg: BG, window: false, persist: true, header: true, onmap: true,

    mount: function (root, api) {

      if (api.startAt) {

        root.classList.add('wd-still', 'wd-rest');

    },

    run: async function (api) {
      var root = api.root, S = root._wd, did = {};
      function on(text, re, key) { if (did[key] || !re.test(text || '')) return false; did[key] = 1; return true; }
      function arrive(c, sound) { if (root.classList.contains(c)) return; root.classList.add(c); if (sound) api.sfx(sound); }

      api.guide.home({ role: 'Founder of Zero' });
      api.later(120, function () { root.classList.add('wd-drift'); });   // the map is alive: one slow drift, nothing else yet
      await api.wait(900);
      await api.say('N3');

      /* the roles first, then the scenarios that lead to them, each on its own sentence. The road
         starts a beat in, so it is being drawn while he says "the scenarios you'll go through". */
      await api.say('N4', { onSeg: function (i, text) {
        if (on(text, /roles/i, 'roles')) arrive('wd-on-roles', 'soft');
        if (on(text, /scenarios/i, 'road')) api.later(600, function () { arrive('wd-on-road', 'soft'); });

      arrive('wd-on-roles'); arrive('wd-on-road');

         that name it, a beat into its sentence ("...you earn skill points", "...open roles", "...we apply") */
      await api.say('N5', { onSeg: function (i, text) {
        if (on(text, /earn/i, 'meter')) api.later(900, function () { arrive('wd-on-meter', 'soft'); });
        if (on(text, /^skill points/i, 'link')) api.later(500, function () { arrive('wd-on-meter'); arrive('wd-on-link', 'tick'); });
        if (on(text, /apply/i, 'apply')) api.later(1300, function () { arrive('wd-on-apply'); });
      } });
      arrive('wd-on-meter'); arrive('wd-on-link'); arrive('wd-on-apply');

      /* no choice. He says he will show how Zero works, the camera comes to rest, run resolves, and the engine
         opens the pop-up over this screen. Anyone who wants out has the player's close button */
      await api.say('W1');

      function on(text, re, key) { if (did[key] || !re.test(text || '')) return false; did[key] = 1; return true; }
      api.onExit(function () { S.pick = S.press = S.replay = null; });
      root.classList.remove('wd-still');

      /* Navid is home, and the world has come back into focus, before anything is measured */
      await Promise.all([api.guide.home({ role: 'Founder of Zero' }), api.wait(900)]);

      /* the meter shows what the tour earned. The bar and the roles take their final state now; the number counts up to it. */
      var from = S.shown, to = api.points.get();
      setMeter(root, to);

        var n = 0, steps = 26, iv = api.every(40, function () {
          n++; S.num.textContent = fmt(from + (to - from) * (1 - Math.pow(1 - n / steps, 3)));
          if (n >= steps) { clearInterval(iv); S.num.textContent = fmt(to); }
        });
      }

      /* the Airbnb stop flashes: the one thing to do. A click counts from the moment it does. */
      S.pick = function () { if (picked || !aimed) return; picked = true; root.classList.add('wd-picked'); if (onPick) onPick(); };
      function aim(point) {
        if (aimed) return; aimed = true;
        root.classList.add('wd-flash'); S.hit.tabIndex = 0; api.sfx('soft');
        if (point) api.point(S.hit, { pad: 4, ax: .46, ay: .2 });   // up on the roof, so his name tag is not on the stop
      }
      if (!api.skipped) await api.say('E2', { onSeg: function (i, text) { if (on(text, /first scenario/i, 'aim')) aim(true); } });
      aim(false);
      api.clearRings();
      await api.turn({ badge: 'Your turn', text: 'Click your first scenario', tip: 'Click here to start', target: S.hit, pad: 4,
        until: function (done) { if (picked) api.later(260, done); else onPick = done; },
        auto: function () { return api.click(S.hit); } });
      api.clearRings(); api.cursor.hide();

      /* ease in on the building. The roles step aside and the welcome card takes their place. */
      S.hit.tabIndex = -1; S.hit.blur();
      S.cam.style.transition = ''; S.cam.style.transform = '';
      root.classList.remove('wd-flash'); root.classList.add('wd-zoom');
      api.sfx('whoosh');

      function key(e) {
        if (e.key !== 'Enter' || e.repeat || e.isComposing) return;
        var t = e.target; if (t && t.closest && t.closest('.zt-dock')) return;   // the tour's own buttons keep their Enter
        e.preventDefault(); if (S.press) S.press();
      }
      window.addEventListener('keydown', key);
      api.onExit(function () { window.removeEventListener('keydown', key); });
      asked = true;
      await api.turn({ badge: 'Your turn', text: 'Press <kbd>Enter</kbd>', target: S.enter, pad: 5,
        until: function (done) { if (entered) api.later(260, done); else onEnter = done; },
        auto: function () { return api.click(S.enter); } });
      window.removeEventListener('keydown', key);
      api.clearRings(); api.cursor.hide();

      /* going in: the card presses, the map pushes into the building */
      root.classList.add('wd-pressed', 'wd-go');
      api.bg('#1E1E1E'); api.sfx('whoosh');
      await api.wait(950);

      /* the prototype's honest last state. Nothing follows it, so this run never resolves. */
      api.bare(true); api.guide.hide();
      S.replay = function () { S.replay = null; api.restart(); };
      root.classList.add('wd-over');
      await new Promise(function () {});
    }
  });
})();

        S.zt.classList.add('jb-on'); orbsIn(root);
        return new Promise(function (res) {
          api.later(720, function () { phase('Building a resume ' + RAMP.ats + ' can read'); });
          api.later(1440, function () { phase('Writing your note to ' + RAMP.mgr); });
          api.later(2160, function () { phase('Sending <b>in 2s</b>', 'Sending through ' + RAMP.ats + ' in 2s'); });
          api.later(2610, function () { phase('Sending <b>in 1s</b>', 'Sending through ' + RAMP.ats + ' in 1s'); });
          api.later(3060, function () {
            S.ztm.innerHTML = ' · Sent';
            cells[0].querySelector('.jb-esel').outerHTML = '<span class="jb-esel jb-esel-off"></span>';
            cells[2].innerHTML = fit;
            cells[5].innerHTML = '<span class="jb-sp">Applied</span>';
            cells[6].innerHTML = '';
            S.tbAp.innerHTML = 'Applied<span class="jb-tbn">1</span>';
            S.toast.classList.add('jb-on'); api.sfx('good');
          });
          api.later(3710, function () { S.zt.classList.remove('jb-on'); });     // the portal drops the pill once it is sent
          api.later(4030, res);
        });
      }
      S.apply.addEventListener('click', function () {
        if (applied || !askOpen) return;
        applied = true; api.cursor.hide(); api.sfx('tick'); if (applyRing) { applyRing.clear(); applyRing = null; } sentP = applyNow();
        if (onApply) onApply();
      });
      await api.say('H2', { onSeg: function (i, text) { if (on(text, /go ahead/i, 'ask')) askOpen = true; } });
      askOpen = true;
      api.cursor.hide();
      /* the tip sits in the empty middle of the table's top bar, above the Action column, pointing down at Ramp's Apply,
         so it covers no button and no words. It hangs off a still point there (zero size, so the engine draws no ring
         round it), and Apply gets its own pulsing ring */
      if (!applied) applyRing = api.ring(S.apply, { pulse: true, pad: 5, radius: 12 });
      await api.turn({ badge: 'Try this', text: 'Click <b>Apply</b> on Ramp', tip: 'Click <b>Apply</b>', target: S.tipAt, pad: 0,
        until: function (done) { if (applied) api.later(150, done); else onApply = function () { api.later(150, done); }; },
        auto: function () { return api.click(S.apply); } });
      api.clearRings(); api.cursor.hide();
      await sentP;
      await api.wait(600);

      /* ---------- H3 · companies write back, you interview, you get hired ---------- */
      var accepted = false;
      function accept() {
        if (accepted) return; accepted = true;
        S.accept.classList.add('jb-down'); api.sfx('tick');
        api.later(160, function () {
          /* the portal's own state when nothing is left: To-do is done */
          var box = S.tds.querySelector('.jb-box');
          box.innerHTML = '<span class="jb-ok">' + ic('check') + '</span><p class="jb-dt">To-do is done</p><button type="button" class="jb-kb jb-k36">' + ic('map') + 'Back to map</button>';
          box.classList.add('jb-fin'); box.style.animation = 'none'; void box.offsetWidth; box.style.animation = '';
          S.say.innerHTML = 'Your call with <b>Ramp</b> is booked. Nothing needs you right now.';
          S.say.classList.remove('jb-swap'); void S.say.offsetWidth; S.say.classList.add('jb-swap');
        });
      }
      S.accept.addEventListener('click', accept);
      var hired = false;
      function hire() { if (hired) return; hired = true; api.cursor.hide(); X.open('hire'); api.sfx('whoosh'); }
      var tIv = at('H3', 'you interview'), tHi = at('H3', 'you get hired');
      await api.say('H3', { onSeg: function (i, text) {
        if (!on(text, /write back/i, 'h3')) return;
        page('you'); root.classList.add('jb-mail'); api.sfx('pop');
        api.later(Math.max(350, tIv - 900), function () { api.click(S.accept, { ms: 600 }).then(function () { accept(); }); });
        api.later(Math.max(1700, tHi - 100), hire);
      } });
      if (!did.h3) { page('you'); root.classList.add('jb-mail'); }
      accept(); hire();
      await api.wait(2300);

      /* ---------- E1 · so that's how Zero works ---------- */
      await api.say('E1');
      await api.wait(1200);
    }
  });
})();

</script>
