/* ═══════════ download ═══════════ */
const SAVE_ICONS = {
  idle:`<path d="M12 3.5v11"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M4.5 19.5h15"/>`,
  busy:`<path d="M12 4a8 8 0 1 1-8 8" opacity=".9"/>`,
  done:`<path d="M4.5 12.5 10 18 19.5 6.5"/>`,
  fail:`<path d="M6 6l12 12M18 6 6 18"/>`
};
const setSaveIcon = (btn,k)=>{ const s=btn.querySelector('svg'); if(s) s.innerHTML=SAVE_ICONS[k]; btn.classList.toggle('spin',k==='busy'); };
$('#tSave').addEventListener('click', async e=>{
  const btn = e.currentTarget;
  if(btn.dataset.busy) return;
  btn.dataset.busy='1'; setSaveIcon(btn,'busy');
  const wasChrome = S.chrome;
  let reshaped = false, savedPOS = null;
  const unshape = ()=>{
    if(!reshaped) return;
    reshaped = false;
    document.body.classList.remove('shooting');
    if(savedPOS) POS = savedPOS;
    setTimeout(()=>{ drawMat(); layout(manifest()); }, 60);
  };
  try{
    if(!window.html2canvas) await new Promise((res,rej)=>{
      const sc = document.createElement('script');
      sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
      sc.onload = res; sc.onerror = rej; document.head.appendChild(sc);
    });
    $('#pillrow').classList.add('hidden');
    document.body.classList.add('exporting');
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    await new Promise(r=>setTimeout(r,240));

    const board = $('#board'), mat = $('.mat');
    // a portrait board would export as a tall mat floating in dark bands —
    // relay it into a wide frame first so the mat itself is landscape
    // always shoot from the same 5:4 frame, so the picture never depends on
    // how the window happened to be sized
    reshaped = true;
    if(reshaped){
      savedPOS = POS; POS = {};
      document.body.classList.add('shooting');
      void board.offsetHeight;                       // force the new frame to reflow
      // rAF never fires on a hidden tab, so always give it a timer to fall back on
      await new Promise(r=>{
        let done = false;
        const fin = ()=>{ if(!done){ done = true; r(); } };
        requestAnimationFrame(()=>requestAnimationFrame(fin));
        setTimeout(fin, 250);
      });
      drawMat();
      layout(manifest());                            // pack against the real wide plane
      await new Promise(r=>setTimeout(r,1000));
      layout(manifest());                            // and settle once more, sizes now final
      await new Promise(r=>setTimeout(r,700));
      stepRopes(30);
    }
    const br = board.getBoundingClientRect(), mr = mat.getBoundingClientRect();
    const s = Math.min(2, Math.max(1.5, window.devicePixelRatio||1));
    const shadows = buildExportShadows();
    const shot = await html2canvas(board, {
      useCORS:true, allowTaint:false, backgroundColor:null, scale:s,
      ignoreElements: el => el.classList && (el.classList.contains('controls') || el.classList.contains('kill'))
    });
    shadows.forEach(d=>d.remove());

    /* Crop to what is actually on the mat. Exporting the whole frame left
       wide bands of empty green down the sides. */
    let bx0=Infinity, by0=Infinity, bx1=-Infinity, by1=-Infinity;
    // the 'vision board' pill lives in the top-left corner of the mat; counting
    // it would peg the crop to that corner forever, so it is left out here and
    // painted back on afterwards
    const marks = [...plane.querySelectorAll('.piece')];
    marks.forEach(el=>{
      const r = el.getBoundingClientRect();
      if(!r.width || !r.height) return;
      bx0 = Math.min(bx0, r.left  - mr.left);  by0 = Math.min(by0, r.top    - mr.top);
      bx1 = Math.max(bx1, r.right - mr.left);  by1 = Math.max(by1, r.bottom - mr.top);
    });
    const BREATH = 100;          // even margin all the way round the content
    if(!isFinite(bx0)){ bx0 = 0; by0 = 0; bx1 = mr.width; by1 = mr.height; }
    bx0 = Math.max(0, bx0 - BREATH);          by0 = Math.max(0, by0 - BREATH);
    bx1 = Math.min(mr.width,  bx1 + BREATH);  by1 = Math.min(mr.height, by1 + BREATH);
    let cw = bx1 - bx0, ch = by1 - by0;
    // still a landscape picture, even if the board happens to sit tall
    if(cw/ch < 1.2){
      const grow = (ch*1.2 - cw)/2;
      bx0 = Math.max(0, bx0 - grow);
      bx1 = Math.min(mr.width, bx1 + grow);
      cw = bx1 - bx0;
    }
    const sx=(mr.left-br.left + bx0)*s, sy=(mr.top-br.top + by0)*s, sw=cw*s, sh=ch*s;
    const padX=Math.round(26*s), padY=Math.round(46*s), foot=Math.round(88*s), radius=Math.round(18*s);
    // the canvas hugs the mat — no stretched-out side bands
    const outW = Math.round(sw+padX*2), outH = Math.round(sh+padY+foot);
    const out = document.createElement('canvas');
    out.width=outW; out.height=outH;
    const g2 = out.getContext('2d');
    g2.fillStyle='#12211a'; g2.fillRect(0,0,outW,outH);
    const dx=Math.round((outW-sw)/2), dy=padY;
    g2.save(); g2.beginPath();
    if(g2.roundRect) g2.roundRect(dx,dy,sw,sh,radius);
    else { g2.moveTo(dx+radius,dy); g2.arcTo(dx+sw,dy,dx+sw,dy+sh,radius); g2.arcTo(dx+sw,dy+sh,dx,dy+sh,radius);
           g2.arcTo(dx,dy+sh,dx,dy,radius); g2.arcTo(dx,dy,dx+sw,dy,radius); g2.closePath(); }
    g2.clip(); g2.drawImage(shot,sx,sy,sw,sh,dx,dy,sw,sh); g2.restore();

    // the label, drawn at the corner of whatever we ended up cropping to
    (()=>{
      const pad=Math.round(15*s), fsz=Math.round(17*s);
      g2.font=`600 ${fsz}px Fredoka, Nunito, sans-serif`;
      const label='vision board', tw2=g2.measureText(label).width;
      const bw=tw2+pad*2, bh=Math.round(38*s), r2=Math.round(13*s);
      const lx=dx+Math.round(26*s), ly=dy+Math.round(26*s);
      g2.beginPath();
      if(g2.roundRect) g2.roundRect(lx,ly,bw,bh,r2);
      else { g2.moveTo(lx+r2,ly); g2.arcTo(lx+bw,ly,lx+bw,ly+bh,r2); g2.arcTo(lx+bw,ly+bh,lx,ly+bh,r2);
             g2.arcTo(lx,ly+bh,lx,ly,r2); g2.arcTo(lx,ly,lx+bw,ly,r2); g2.closePath(); }
      g2.fillStyle='#fff'; g2.fill();
      g2.fillStyle='#16281d'; g2.textAlign='left'; g2.textBaseline='middle';
      g2.fillText(label, lx+pad, ly+bh/2+Math.round(1*s));
    })();

    // made with love, and where to find him underneath
    g2.font = `500 ${Math.round(19*s)}px Fredoka, Nunito, sans-serif`;
    g2.textBaseline='middle'; g2.textAlign='left';
    const p1='made with ', p2='\u2665', p3=' by Sanjay Chauhan';
    const w1=g2.measureText(p1).width, w2=g2.measureText(p2).width, w3=g2.measureText(p3).width;
    let tx=(outW-(w1+w2+w3))/2;
    const ty=dy + sh + foot/2 - Math.round(13*s);
    g2.fillStyle='rgba(255,255,255,.92)'; g2.fillText(p1,tx,ty); tx+=w1;
    g2.fillStyle='#e0473a';               g2.fillText(p2,tx,ty); tx+=w2;
    g2.fillStyle='rgba(255,255,255,.92)'; g2.fillText(p3,tx,ty);
    g2.font = `400 ${Math.round(14*s)}px Fredoka, Nunito, sans-serif`;
    g2.textAlign='center'; g2.fillStyle='rgba(255,255,255,.55)';
    g2.fillText('www.chauhansanjay.com', outW/2, ty + Math.round(25*s));
    const a = document.createElement('a');
    a.download = (S.name.trim() ? S.name.trim().toLowerCase().replace(/\s+/g,'-') : 'vision') + '-board.png';
    a.href = out.toDataURL('image/png');
    a.click();
    Snd.shutter();
    unshape();
  }catch(err){
    plane.querySelectorAll('.shadow-proxy').forEach(d=>d.remove());
    unshape();
    setSaveIcon(btn,'fail'); btn.dataset.tip="Couldn't save";
    setTimeout(()=>{ setSaveIcon(btn,'idle'); btn.dataset.tip='Download'; }, 1800);
    document.body.classList.remove('exporting');
    if(wasChrome) $('#pillrow').classList.remove('hidden');
    delete btn.dataset.busy; return;
  }
  document.body.classList.remove('exporting');
  if(wasChrome) $('#pillrow').classList.remove('hidden');
  setSaveIcon(btn,'done'); setTimeout(()=>setSaveIcon(btn,'idle'),1500);
  delete btn.dataset.busy;
});

function updateCount(){
  const c = $('#cnt');
  const n = [...plane.querySelectorAll('.piece')].filter(p=>p.dataset.type!=='prop').length;
  if(c.textContent===String(n)) return;
  c.textContent = n;
  if(G) G.fromTo(c,{scale:1.6},{scale:1,duration:.55,ease:'back.out(3)'});
}

/* ═══════════ persistence + boot ═══════════ */
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({S,POS,uid})); }catch(e){} }
function load(){
  try{
    const raw = localStorage.getItem(KEY); if(!raw) return false;
    const o = JSON.parse(raw); if(!o||!o.S) return false;
    S = Object.assign(S,o.S);
    if(!Array.isArray(S.entries)) S.entries = [];
    S.entries.forEach(e=>{ if(e.type==='photo') e.type='polaroid'; });   // renamed
    POS = o.POS||{}; uid = o.uid||1;
    return true;
  }catch(e){ return false; }
}
function boot(){
  load();
  $('#tThread').classList.toggle('on', S.thread);
  $('#tProps').classList.toggle('on', S.props);
  $('#tSpread').dataset.tip = S.spread==='tidy' ? 'Tidy' : 'Spread out';
  $('#tSpread').classList.toggle('on', S.spread==='loose');
  $('#pillrow').classList.toggle('hidden', !S.chrome);
  $('#tHide').classList.toggle('off', !S.chrome);
  const mt = MAT_THEMES.find(x=>x.id===S.mat.theme);
  if(mt) $('#tMat').dataset.tip = mt.name+' mat';
  Snd.set(S.sound !== false);
  $('#tSound').classList.toggle('on', S.sound !== false);
  $('#tSound').dataset.tip = S.sound !== false ? 'Sound' : 'Muted';
  $('#tSound').querySelectorAll('.w1,.w2').forEach(w=> w.style.opacity = S.sound !== false ? 1 : 0);

  $('#colist').innerHTML = COMPANIES.map(c=>`<option value="${esc(c)}"></option>`).join('');
  nameInput.value = S.name || '';
  nameTick(!!S.name);
  document.body.classList.toggle('no-panel', S.panel === false);
  document.documentElement.style.setProperty('--panelw', S.panel === false ? '0px' : '420px');
  if(S.panel === false) $('.dock').style.opacity = '0';
  renderRows(); drawMat(); sync();
  if(!S.name.trim()) setTimeout(()=>nameInput.focus(), 700);

  if(G){
    G.ticker.add(()=>stepRopes(1));        // the ropes live on the ticker
    G.from('.dock-scroll > *',{x:-24,opacity:0,duration:.75,stagger:.05,ease:'power3.out',clearProps:'all'});
    G.from('.tw',{y:-22,opacity:0,duration:.8,ease:'back.out(2.2)',clearProps:'all'});
    G.from('.ibtn',{y:-14,opacity:0,duration:.6,stagger:.06,delay:.15,ease:'back.out(2)',clearProps:'all'});
    G.to('.bshine',{left:'140%',duration:1.15,ease:'power2.inOut',repeat:-1,repeatDelay:3.6,delay:1.6});
  }
  let rt;
  const reflow = ()=>{ clearTimeout(rt);
    rt = setTimeout(()=>{ drawMat(); layout(manifest()); drawThread(); }, 120); };
  window.addEventListener('resize', reflow);
  /* the mat is not always the size of the window. Inside the onboarding the panel
     grows and shrinks on its own, so watch the mat itself and redraw the grid,
     the arcs and the ticks to whatever size it actually is. */
  if(window.ResizeObserver){
    const mat = $('.mat');
    if(mat){ let w0=0,h0=0;
      new ResizeObserver(es=>{
        const r = es[0].contentRect;
        if(Math.abs(r.width-w0)<2 && Math.abs(r.height-h0)<2) return;
        w0=r.width; h0=r.height; reflow();
      }).observe(mat);
    }
  }
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
/* ---- driven by the ZERO onboarding ----------------------------------------
   The input panel is for the standalone tool. Inside the onboarding the
   conversation is the input, so the panel hides and entries come from the
   parent document. Declared inside the IIFE so it can reach S and sync(). */
window.ZERO_VB = {
  ready: true,
  set: function(name, items){
    try{
      /* Freeze where everything already sits. Without this the ids change on
         every answer, POS misses, and the whole board re-lays-out, throwing
         away anything the user dragged. */
      plane.querySelectorAll('.piece').forEach(function(el){
        var id = el.dataset.id; if(!id) return;
        var dx = G ? (+G.getProperty(el,'x')||0) : 0;
        var dy = G ? (+G.getProperty(el,'y')||0) : 0;
        POS[id] = {dx:dx, dy:dy};
      });
      S.name = name || '';
      S.entries = (items||[]).map(function(it){
        var e = newEntry(it.type, it.value, it.label);
        e.basic = false;
        /* a stable id keyed on content, so a piece keeps its identity and its
           position across every re-sync */
        e.id = it.type + ':' + String(it.value||it.label||'').toLowerCase().replace(/[^a-z0-9]+/g,'-');
        return e;
      });
      S.panel = false; S.chrome = false; S.props = false;
      document.body.classList.add('driven');
      sync();
      /* the mat is the frame: pull anything that overhangs back inside, and
         remember where it ended up so it stays there */
      setTimeout(function(){
        var W = plane.clientWidth, H = plane.clientHeight, PAD = 10;
        plane.querySelectorAll('.piece').forEach(function(el){
          var L = parseFloat(el.style.left)||0, T = parseFloat(el.style.top)||0;
          var dx = G ? (+G.getProperty(el,'x')||0) : 0;
          var dy = G ? (+G.getProperty(el,'y')||0) : 0;
          var w = el.offsetWidth, h = el.offsetHeight;
          var x = L+dx, y = T+dy, nx = x, ny = y;
          if(x < PAD) nx = PAD;
          if(y < PAD) ny = PAD;
          if(x+w > W-PAD) nx = Math.max(PAD, W-PAD-w);
          if(y+h > H-PAD) ny = Math.max(PAD, H-PAD-h);
          if(nx !== x || ny !== y){
            var ndx = dx+(nx-x), ndy = dy+(ny-y);
            if(G) G.to(el,{x:ndx,y:ndy,duration:.5,ease:'power3.out',onUpdate:drawThread});
            POS[el.dataset.id] = {dx:ndx, dy:ndy};
          }
        });
        drawThread();
      }, 1250);
      return S.entries.length;
    }catch(err){ return 'ERR '+err.message; }
  }
};
try{
  if(window.parent !== window){
    localStorage.removeItem(KEY);           /* never inherit a standalone session */
    document.documentElement.classList.add('driven');
    document.body.classList.add('driven');  /* transparent from the first frame */
  }
}catch(e){}

})();
</script>
