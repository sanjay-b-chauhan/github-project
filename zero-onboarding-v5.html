  const phaseW={explore:1.0,isolate:1.25,tradeoff:1.15}[round.phase]||1;
  /* costly signal: in a trade-off round, taking the cheaper card means money
     was on the table and lost, so the attribute claim is worth more. Taking the
     richer one leaves money as an unexcluded explanation, so it is worth less. */
  let costly=1;
  if(round.phase==='tradeoff'){
    const A=RCARD[round.a].t.compPct, B=RCARD[round.b].t.compPct;
    const tookCheaper=(pick==='a'?A:B)<(pick==='a'?B:A);
    costly=tookCheaper?1.4:0.3;
  }
  (round.claims||[]).forEach(c=>{
    if(c.a===c.b) return;                       /* nothing to learn from a tie */
    const roleW=c.role==='primary'?1:c.role==='secondary'?.45:1/(round.claims.length||1);
    const w=phaseW*roleW*(round.confounded?.5:1)*costly;
    const win=pick==='a'?c.a:c.b, lose=pick==='a'?c.b:c.a;
    const node=RSTATE[c.dim]; if(!node) return;
    if(node.kind==='beta'){
      node.optA=node.optA||c.a; node.optB=node.optB||c.b;
      if(win===node.optA) node.a+=w; else node.b+=w;
    } else wbump(node,win,lose,w);
    node.ev.push({n:round.n,win:win,w:w,confounded:!!round.confounded,costly:costly>1});
  });

    const A=RCARD[round.a].t.compPct, B=RCARD[round.b].t.compPct;
    const tookRicher=(pick==='a'?A:B)>(pick==='a'?B:A);
    const gap=Math.abs(A-B);
    RSTATE.comp.trials.push({n:round.n,tookRicher:tookRicher,gap:gap,

/* how hard money pulled, 0 = never chose it, 1 = always */
function rmoneyPull(){
  const t=RSTATE.comp.trials; if(!t.length) return .5;
  const tot=t.reduce((a,x)=>a+x.w,0);
  return t.reduce((a,x)=>a+(x.tookRicher?x.w:0),0)/(tot||1);

function rtradeoffs(){ return RSTATE.comp.trials.filter(x=>x.w>=1).length; }

let RN=0;
const RCOUNT_KEY='rcount';
function rroundsToPlay(){
  const n=parseInt(localStorage.getItem(RCOUNT_KEY)||'10',10);
  return Math.max(3,Math.min(RROUNDS.length,isNaN(n)?10:n));
}
/* The three phases each do a different job: explore reads you, isolate repeats
   to raise confidence, trade-off makes you pay for what you said you wanted.
   Cutting the deck to 10 by truncation would drop every trade-off round, so
   the read-out would claim money came second with nothing behind it. Sample
   proportionally instead. */
function rdeck(){
  const total=rroundsToPlay();
  if(total>=RROUNDS.length) return RROUNDS.slice();
  const byPhase={explore:[],isolate:[],tradeoff:[]};
  RROUNDS.forEach(r=>byPhase[r.phase].push(r));
  const order=['explore','isolate','tradeoff'];
  const want={}; let left=total;
  order.forEach((ph,i)=>{
    const n=i===order.length-1?left:Math.max(1,Math.round(total*byPhase[ph].length/RROUNDS.length));
    want[ph]=Math.min(n,byPhase[ph].length); left-=want[ph];
  });
  /* within a phase, take rounds that cover a dimension not yet seen before
     taking a second round on the same axis. Trimming by position quietly drops
     round 9, the only clean two-city comparison, and the ranking loses the one
     piece of evidence that was not confounded by the work. */
  const out=[], seen={};
  order.forEach(ph=>{
    const pool=byPhase[ph].slice(); let n=want[ph];
    const dims=r=>(r.claims||[]).filter(c=>c.role!=='secondary').map(c=>c.dim);
    while(n>0&&pool.length){
      let idx=pool.findIndex(r=>dims(r).some(d=>!seen[d]));
      if(idx<0) idx=0;
      const r=pool.splice(idx,1)[0];
      dims(r).forEach(d=>seen[d]=1);
      out.push(r); n--;
    }
  });
  return out.sort((x,y)=>x.n-y.n);
}

/* ---------------------------------------------------------------- read-out --
   The locked sentence is the TOP tier, reachable only when every clause's gate
   passes. Each clause steps down through weaker wordings and then out
   altogether. This is the whole point of the mechanic: the user has to
   recognise the trade they made, and a claim they did not make destroys that
   faster than saying nothing would. */
const RWORDS={
  location:{
    strong:'Location matters a lot.',
    moderate:'Location seems to matter a lot.',
    weak:"Location might matter more than you'd say out loud."},
  work:{
    strong:"You're drawn to ambitious teams, and work where you help people or teams get something real done.",
    moderate:'You lean toward ambitious teams, and work that helps people get something real done.',
    weak:'Ambitious teams pulled you some of the time, though not every time.'},
  comp:{
    strong:'Compensation matters, but you repeatedly chose the right work and place over a stronger package.',
    moderate:'Compensation matters, and more than once you chose the work and the place over a stronger package.',
    mixed:"Compensation matters, and you traded it both ways, so I'd call that one open.",
    first:'Compensation came first more often than not, and that is a real answer too.'}
};
function rtier(c){ return c>=.70?'strong':c>=.45?'moderate':c>=.25?'weak':null; }
function rcites(k){
  const n=RSTATE[k]; if(!n) return [];
  return [...new Set(n.ev.map(e=>e.n))].sort((a,b)=>a-b);
}
function rreadout(){
  const parts=[], cites=[];
  const lc=rconf('location');
  const lt=rtier(lc);
  if(lt){ parts.push(RWORDS.location[lt]); cites.push({c:'location',rounds:rcites('location')}); }

  /* "ambitious teams AND work that helps people" is two claims wearing one
     coat, so both have to clear on their own or it steps down */
  const ec=rconf('ethos'), wc=rconf('world');
  const both=Math.min(ec,wc), wt=rtier(both);
  if(wt){ parts.push(RWORDS.work[wt]);
    cites.push({c:'work',rounds:[...new Set(rcites('ethos').concat(rcites('world')))].sort((a,b)=>a-b)}); }

  /* "repeatedly" is a count, so it needs a count behind it */
  const pull=rmoneyPull(), tr=rtradeoffs(), forg=RSTATE.comp.forgone;
  let ck=null;
  if(tr>=3&&pull<.40&&forg>=.30) ck='strong';
  else if(tr>=2&&pull<.50)       ck='moderate';
  else if(pull>=.60)             ck='first';
  else if(tr>=1)                 ck='mixed';
  if(ck){ parts.push(RWORDS.comp[ck]); cites.push({c:'comp',rounds:RSTATE.comp.trials.map(t=>t.n)}); }

  if(!parts.length) parts.push('I have a first read on you, but I want to check it with you.');
  return {lines:parts, cites:cites};
}

/* ------------------------------------------------------------ preferences --
   Six screens, all pre-answered. Editing never touches the tallies: an
   override is stored beside them, so a claim can still cite the rounds that
   produced it - or say "you told me this" when it cannot. */
const PFOVERRIDE={};
function presolve(k){
  if(PFOVERRIDE[k]!==undefined) return PFOVERRIDE[k];
  if(k==='location') return rrank('location').map(r=>r.opt);
  if(k==='priorities') return ppriority();
  return rwinner(k);
}
function pedit(k,v){ PFOVERRIDE[k]=v; psyncP(); }
function pstated(k){ return PFOVERRIDE[k]!==undefined; }

const PFLABEL={
  b2c:'B2C', b2b:'B2B', collaborative:'Collaborative', individual:'Individual craft',
  frontier:'Frontier', established:'Established scale',
  ai_frontier:'AI frontier', commerce:'Commerce', saas:'SaaS', creator:'Creator', impact:'Impact',
  ai_interaction:'AI interaction', team_tools:'Team tools', everyday_utility:'Everyday utility',
  learning:'Learning', creator_tools:'Creator tools',
  toronto:'Toronto', new_york:'New York', san_francisco:'San Francisco'
};
const PFSUB={
  ai_frontier:'OpenAI · Anthropic · Perplexity', commerce:'DoorDash · Shopify · Uber',
  saas:'Figma · Stripe · Salesforce', creator:'Adobe · Spotify', impact:'Health · Climate · Civic',
  b2c:'People using a product in their everyday lives.', b2b:'Teams and the systems they run on.',
  collaborative:'Work that moves because a team moves with it.',
  individual:'Work you can take from blank to finished yourself.',
  toronto:'Canada', new_york:'United States', san_francisco:'United States'
};
/* order by how much weight each axis actually carried, not by confidence: the
   thing you traded for most often is the thing that matters most */
function ppriority(){
  const pull=k=>{ const n=RSTATE[k]; if(!n) return 0;
    return (n.ev||[]).reduce((a,e)=>a+e.w*(e.costly?1.4:1),0); };
  const work=pull('ethos')+pull('world')+pull('shape');
  const loc=pull('location');
  const money=RSTATE.comp.trials.reduce((a,t)=>a+(t.tookRicher?t.w:0),0)*1.6;
  const rows=[
    {k:'work', t:'Work that feels right', s:pworkSub(), v:work},
    {k:'location', t:'Location', s:(PFLABEL[presolveCity()]||'Your top city')+' first', v:loc},
    {k:'comp', t:'Compensation', s:rmoneyPull()<.5?'important, not first':'came first more often', v:money}
  ];
  return rows.sort((a,b)=>b.v-a.v);
}
function presolveCity(){ const l=presolve('location'); return l&&l.length?l[0]:'toronto'; }
function pworkSub(){
  const a=PFLABEL[presolve('shape')]||'', b=PFLABEL[presolve('type')]||'';
  return [a,b].filter(Boolean).join(' + ').toLowerCase()||'the work you kept choosing';
}
/* the board and the roles read from P, so mirror the resolved answers into it */
function psyncP(){
  const city=presolveCity();
  P.location=PFLABEL[city]||P.location;
  const t=presolve('type');
  /* these must be keys IND_COS actually knows, or COS() silently falls back
     to the persona defaults and the board shows companies nobody chose */
  P.industry=t==='ai_frontier'?'Tech and AI':t==='commerce'?'Commerce':
             t==='saas'?'Tech and AI':t==='creator'?'Media':P.industry;
  const d=presolve('domain');
  if(PFLABEL[d]) P.problems=PFLABEL[d];
}

const PFSCREENS=[
 {id:'01',key:'type',    kind:'bubbles',title:'Companies that tend to attract you',
  opts:['ai_frontier','commerce','saas','creator','impact']},

  opts:['collaborative','individual']},
 {id:'03',key:'world',   kind:'two',    title:'The userbase you would design for',

function pwhy(key){
  if(pstated(key)) return 'You told me this.';
  const r=rcites(key);
  if(!r.length) return '';

function prow(n,title,sub,key,order,sc){
  const r=mk('div','pfr'); r.draggable=true; r.dataset.k=key;
  r.appendChild(mk('span','pfrn',String(n)));
  const t=mk('div','pfrt'); t.appendChild(mk('b',null,title));

  r.ondragstart=e=>{ r.classList.add('drag'); e.dataTransfer.setData('text/plain',key); };
  r.ondragend=()=>r.classList.remove('drag');
  r.ondragover=e=>{ e.preventDefault(); r.classList.add('over'); };
  r.ondragleave=()=>r.classList.remove('over');
  r.ondrop=e=>{ e.preventDefault(); r.classList.remove('over');

    if(!from||from===key) return;
    const a=order.indexOf(from), b=order.indexOf(key);
    order.splice(b,0,order.splice(a,1)[0]);
    sfx('tick'); pedit('location',order.slice()); prender(sc);

  return r;

function porder(box,sc){
  const rows=presolve('priorities');
  const list=mk('div','pfrank');
  /* this screen states the most contestable thing Zero says - that money came
     second - so of all six it is the one that has to be draggable */
  rows.forEach((r,i)=>{

    el.appendChild(mk('span','pfrn',String(i+1)));
    const t=mk('div','pfrt'); t.appendChild(mk('b',null,r.t)); t.appendChild(mk('span',null,r.s));
    el.appendChild(t);
    el.appendChild(mk('span','pfgrip','\u22ee\u22ee'));
    el.ondragstart=e=>{ el.classList.add('drag'); e.dataTransfer.setData('text/plain',r.k); };
    el.ondragend=()=>el.classList.remove('drag');
    el.ondragover=e=>{ e.preventDefault(); el.classList.add('over'); };
    el.ondragleave=()=>el.classList.remove('over');
    el.ondrop=e=>{ e.preventDefault(); el.classList.remove('over');
      const from=e.dataTransfer.getData('text/plain'); if(!from||from===r.k) return;
      const cur=presolve('priorities').slice();
      const a=cur.findIndex(x=>x.k===from), b=cur.findIndex(x=>x.k===r.k);
      cur.splice(b,0,cur.splice(a,1)[0]);
      sfx('tick'); pedit('priorities',cur); prender(sc);
    };
    list.appendChild(el);
  });
  box.appendChild(list);
  enter(Array.from(list.children),{y:12,blur:6,stagger:.07,duration:.5},1300);
}

/* ------------------------------------------------------------------ roles --
   Every card states how close it is and why. The tier is computed from the
   same evidence the read-out used, so a role cannot claim to be a direct fit
   on an axis the user never actually settled. */
const JTIERS=[[5,'DIRECT FIT'],[4,'STRONG FIT'],[3,'CLOSE'],[2,'ADJACENT'],[1,'A STRETCH']];
const JPOOL=[
 {co:'OpenAI',role:'Product Designer',where:'Remote Canada / US',yrs:'1-4 years',
  d:'Make powerful AI clear and useful through thoughtful, trustworthy product experiences.',
  t:{type:'ai_frontier',ethos:'frontier',world:'b2c',shape:'collaborative',domain:'ai_interaction',city:'toronto'}},
 {co:'Anthropic',role:'Product Designer',where:'Remote Canada / US',yrs:'2-5 years',
  d:'Design the surfaces where people and models actually meet, and keep them legible.',
  t:{type:'ai_frontier',ethos:'frontier',world:'b2c',shape:'collaborative',domain:'ai_interaction',city:'toronto'}},
 {co:'Figma',role:'Product Designer',where:'Toronto',yrs:'1-4 years',
  d:'Design tools that let a whole team move through one file without stepping on each other.',
  t:{type:'saas',ethos:'frontier',world:'b2b',shape:'collaborative',domain:'team_tools',city:'toronto'}},
 {co:'Shopify',role:'Product Designer',where:'Toronto',yrs:'1-3 years',
  d:'Help independent merchants run a business with confidence, not just a storefront.',
  t:{type:'commerce',ethos:'established',world:'b2b',shape:'collaborative',domain:'team_tools',city:'toronto'}},
 {co:'Notion',role:'Product Designer',where:'Remote',yrs:'2-4 years',
  d:'Make a blank page feel like a starting point instead of a demand.',
  t:{type:'saas',ethos:'frontier',world:'b2c',shape:'individual',domain:'creator_tools',city:'new_york'}},
 {co:'Stripe',role:'Product Designer',where:'New York',yrs:'2-5 years',
  d:'Show businesses what is happening to their money, plainly.',
  t:{type:'saas',ethos:'frontier',world:'b2b',shape:'collaborative',domain:'team_tools',city:'new_york'}}
];
/* Reasons name the axis AND the evidence behind it, so a claim can be checked.
   An axis the rounds never settled contributes nothing rather than a guess. */
const JREASON={
  type:{ai_frontier:'the AI-first companies you kept picking',commerce:'the consumer businesses you leaned to',
        saas:'the tools-for-teams world you chose',creator:'the creative tools you chose',impact:'the mission work you chose'},
  ethos:{frontier:'ambitious teams over established scale',established:'proven scale over frontier bets'},
  world:{b2c:'products people use directly',b2b:'teams and the systems behind them'},
  shape:{collaborative:'work that moves with a team',individual:'work you can finish yourself'},
  domain:{ai_interaction:'AI interaction problems',team_tools:'team tooling problems',
          everyday_utility:'everyday utility problems',learning:'learning problems',creator_tools:'creator tooling problems'}
};
function jscore(job){
  let hit=0, tot=0; const why=[];
  ['type','ethos','world','shape','domain'].forEach(k=>{
    /* an axis the rounds never settled proves nothing - unless the user
       went and set it themselves on screens 01-06, which is stronger */
    if(rconf(k)<.25 && !pstated(k)) return;
    tot++;
    if(presolve(k)===job.t[k]){ hit++;
      const r=JREASON[k]&&JREASON[k][job.t[k]]; if(r) why.push(r); }
  });
  const loc=presolve('location')||[];
  const li=loc.indexOf(job.t.city);
  if(loc.length){ tot++; if(li===0){ hit++; why.push('the city you ranked first'); }
                  else if(li===1){ hit+=.5; why.push('your second city'); } }
  const ratio=tot?hit/tot:.5;
  const tier=ratio>=.85?5:ratio>=.68?4:ratio>=.5?3:ratio>=.3?2:1;
  return {tier:tier, why:why.slice(0,3)};
}
function jcard(job){
  const sc=jscore(job);
  const label=(JTIERS.find(t=>t[0]===sc.tier)||JTIERS[2])[1];
  const c=mk('div','jrc');
  const tier=mk('div','jrtier'+(sc.tier>=4?' top':''));
  const bar=mk('span','jrbar');
  for(let i=1;i<=5;i++){ const b=mk('i'); if(i<=sc.tier) b.className='on'; bar.appendChild(b); }
  tier.appendChild(bar);
  tier.appendChild(mk('span',null,'0'+sc.tier+' · '+label));
  c.appendChild(tier);
  const h=mk('div','jrhead');
  h.appendChild(mk('span','jrlogo',rlogo(job.co)));
  h.appendChild(mk('div','jrt',job.co+' · '+job.role));
  c.appendChild(h);
  c.appendChild(mk('div','jrm',job.where+' · full-time · '+job.yrs));
  c.appendChild(mk('div','jrd',job.d));
  if(sc.why.length) c.appendChild(mk('div','jrwhy','<b>Why it fits:</b> '+sc.why.join(', ')+'.'));
  return {el:c,tier:sc.tier};
}
function buildRoles(host){
  const wrap=mk('div','jr'); wrap.id='jrList';
  host.appendChild(wrap);
}
async function addRoles(){
  const host=$('jrList'); if(!host) return;
  const ranked=JPOOL.map(j=>jcard(j)).sort((a,b)=>b.tier-a.tier).slice(0,4);

    const h=mk('div','hzhold');
    h.appendChild(mk('b',null,sc.label));
    h.appendChild(mk('span',null,sc.note));
    box.appendChild(h);
  }
  host.appendChild(box);
  setCap(sc.label||'How Zero works',false);
}
function hzcopy(box,beat,host){
  const wrap=mk('div');
  if(beat.tail){
    /* the pill is part of the sentence, so it is built inline rather than
       parked in a row underneath where it would read as a control */
    const p=mk('div','hzline');
    p.style.cssText='font-size:19px;line-height:1.55;color:var(--tx-2);letter-spacing:-.015em';
    const parts=beat.tail.split(/(\$\w+)/);
    parts.forEach(seg=>{
      const m=/^\$(\w+)$/.exec(seg);
      if(!m){ p.appendChild(document.createTextNode(seg)); return; }
      const pill=beat.pills.find(x=>x.t===m[1]);
      const el=mk('span','hzp',pill?pill.t:m[1]);
      el.onclick=()=>{ if(!pill) return; sfx('tick');
        wrap.querySelectorAll('.hzp').forEach(x=>x.classList.remove('on'));
        el.classList.add('on'); hzscreen(host,pill.screen); };
      el.onmouseenter=()=>{ if(pill) hzscreen(host,pill.screen); };
      p.appendChild(el);
    });
    wrap.appendChild(p);
  }
  const dots=mk('div','hzdots');
  HZBEATS.forEach((_,i)=>{ const d=mk('i'); if(i<=HZAT) d.className='on'; dots.appendChild(d); });
  wrap.appendChild(dots);
  box.appendChild(wrap);
  enter([wrap],{y:12,blur:7,duration:.55},1200);
}
async function worksStage(){
  atStep('How it works');
  const myGen=gen;
  setPhase(3);
  if(HZAT===0){
    clearTurn(); dockHide(); await wait(360);
    if(myGen!==gen) return;
    await swapPanel('How Zero works',h=>{ const host=mk('div'); host.id='hzHost';
      host.style.cssText='position:absolute;inset:0'; h.appendChild(host); },false,false);
  }
  const beat=HZBEATS[Math.min(HZAT,HZBEATS.length-1)];
  const host=$('hzHost');
  if(host) hzscreen(host,beat.screen);
  if(myGen!==gen) return;
  await voLine(beat.say,Math.max(2000,beat.say.length*44));
  if(myGen!==gen) return;
  const {box}=turn({q:beat.then});
  await wait(300);
  if(myGen!==gen) return;
  hzcopy(box,beat,host);
  const last=HZAT>=HZBEATS.length-1;
  cta(last?'What do I start with?':'Keep going',()=>{
    if(last){ HZAT=0; go(claimStage); }
    else { HZAT++; locked=false; worksStage(); }
  });
}

/* ---- 6..12 - built next ------------------------------------------------- */
function stub(label,next,note){
  setPhase(1);
  const {box}=turn({q:label});
  const n=mk('div','devl',note||'not built yet');
  n.style.cssText='margin-top:18px;opacity:.55';
  box.appendChild(n);
  if(next) cta('Continue',next);
}
function synthesisStage(){stub('The picture I have.', portfolioStage,'step 5 - synthesis monologue'); }
function claimStage(){    stub('10,000 credits.',     creditsStage,  'step 8 - slide to claim'); }

/* ============================ boot ============================ */
gsap.set(['#logoPill','.tr'],{opacity:0,y:-9});
setPhase(0);
openStage();

/* ============================ step-through (prototype only) ============================ */
/* Walk the whole flow with sensible answers already filled in, no clicking. */
const DBG_STEPS=[
  ['Open',        ()=>openStage()],
  ['LinkedIn',    ()=>linkedinStage()],
  ['Read back',   ()=>readbackStage()],
  ['Pivot',       ()=>pivotStage(P.pivot)],
  ['Cards intro', ()=>cardsIntroStage()],
  ['Cards',       ()=>cardsStage()],
  ['Reflection',  ()=>reflectStage()],
  ['Preferences', ()=>prefStage()],
  ['Vision',      ()=>visionStage(true)],
  ['Roles',       ()=>rolesStage()],
  ['Synthesis',   ()=>synthesisStage()],
  ['Portfolio',   ()=>portfolioStage()],
  ['How it works',()=>worksStage()],
  ['Claim',       ()=>claimStage()],
  ['Credits',     ()=>creditsStage()],
  ['Handoff',     ()=>finishStage('sanjay@z-ro.co')],
];
/* what each step would have produced, so any step can be entered cold */
function dbgFill(upTo){
  const d=pack();
  /* the stepper has to be able to go backwards. Without this P only ever grows,
     so an earlier step shows a fuller board than it should. */
  Object.keys(P).forEach(k=>{ P[k]= k==='picks' ? [] : null; });
  const set=(i,fn)=>{ if(upTo>i) fn(); };
  /* indices track DBG_STEPS: 0 Open, 1 LinkedIn, 2 Read back, 3 Pivot,
     4 Cards intro, 5 Cards, 6 Reflection, 7 Preferences, 8 Vision, ... */
  set(0,()=>P.name='Sanjay');
  set(1,()=>{ P.linked='LinkedIn'; P.linkedUrl='linkedin.com/in/sanjaybchauhan'; });
  set(2,()=>{ P.level='Student';
    P.about='I started in graphic design but recently I have been looking more into product design.';
    P.pivot=['graphic design','product design']; });
  set(3,()=>{ P.why='I want to work on products people actually use and build a career I can grow in.'; });
  set(5,()=>{ /* the cards have been played: their read-out is the preference state */
    P.role=d.roles&&d.roles[0]?d.roles[0][0]:'Product Designer';
    P.dream='OpenAI, Figma, Anthropic';
    P.industry='Tech and AI';
    P.problems=d.problemChips?d.problemChips[0]:'Confusing tools';
    P.location='Toronto';
    P.timeline='This year'; });
  set(8,()=>{ P.aim=d.roles&&d.roles[0]?d.roles[0][0]:'Product Designer'; });
}
let dbgAt=0;
/* The pill used to move only when its own arrows were pressed, so walking the
   real flow left it stuck on step one. Stages announce themselves instead. */
function atStep(label){
  const i=DBG_STEPS.findIndex(x=>x[0]===label);
  if(i<0) return;
  dbgAt=i;
  const lbl=$('dbgStep'); if(lbl) lbl.textContent=(i+1)+'. '+label;
  const pv=$('dbgPrev'), nx=$('dbgNext');
  if(pv) pv.style.opacity=i<=0?.3:1;
  if(nx) nx.style.opacity=i>=DBG_STEPS.length-1?.3:1;
}
function dbgGoto(i){
  i=Math.max(0,Math.min(DBG_STEPS.length-1,i));
  dbgAt=i;
  /* nothing from the last step gets to finish */
  gen++;
  try{ gsap.killTweensOf(['#col','#scroll','.right','#dock','#dtr','#top','#aur','#paper','#turn']); }catch(e){}
  locked=false; editReturn=null; scanning=false; queue.length=0; shown={}; keys={}; tlMode='h';
  const t0=$('turn'); if(t0) t0.remove();
  $('col').innerHTML=''; $('dockIn').innerHTML='';
  gsap.set('#dock',{opacity:0}); gsap.set('#dtr',{opacity:0}); $('dtr').innerHTML='';
  stopRec();
  document.querySelectorAll('.zook,.conf,.core,.veil,.sheen,.gh').forEach(n=>n.remove());
  $('rip').style.display='none'; $('rip').innerHTML='';
  $('aur').innerHTML=''; gsap.set('#aur',{opacity:0});
  gsap.set(['#logoPill','.tr'],{opacity:i>=1?1:0,y:0});
  if(i!==1) $('drawScreen').style.display='none';
  document.body.classList.remove('dark');
  $('col').innerHTML='';
  dbgFill(i);
  /* the panel exists from the moment Zero starts writing things down */
  /* panel opens at the read-back (2) and widens once the board is the subject (8) */
  const born=i>=2, wide=i>=8;
  if(born){
    panelBorn=true; boardLive=true;
    gsap.set('.right',{width:wide?'56%':'40%',opacity:1,x:0});
    shiftLeft(wide?'56vw':'40vw');
    $('cap').innerHTML='<span class="live pulse"></span>'+(wide?'Your vision board':'Zero is listening');
    const sc=$('scroll'); sc.className='scroll ctr'; sc.innerHTML='';
    const vb=mk('div','vb'); vb.id='vb'; vb.innerHTML=boardHTML(); sc.appendChild(vb);
    SENTENCES().forEach(x=>{ if(x.ready){ shown[x.id]=1; keys[x.id]=x.key; } });
    meterRetired=i>=8; boardRewards=i>=8;
  } else {
    panelBorn=false; boardLive=false;
    gsap.set('.right',{width:0,opacity:0}); shiftLeft('0px');
  }
  meterRetired=i>14; boardRewards=i>14;
  renderMeter();                    /* every step, not only the ones with a panel */
  setPhase(i<14?0:(i<16?1:(i<18?2:(i<19?3:4))));
  const lbl=$('dbgStep'); if(lbl) lbl.textContent=(i+1)+'. '+DBG_STEPS[i][0];
  const pv=$('dbgPrev'), nx=$('dbgNext');
  if(pv) pv.disabled=i<=0;
  if(nx) nx.disabled=i>=DBG_STEPS.length-1;
  /* a jumped-to panel must show its content, not the empty frame it starts as */
  clearTimeout(dbgGoto._f);
  dbgGoto._f=setTimeout(async()=>{
    const g=gen;
    const n=sel=>document.querySelectorAll(sel).length;
    try{
      const nm=DBG_STEPS[i][0];
      /* only top up what the stage's own sequence has not reached yet, or the
         fill races the beats and doubles everything */
      if(nm==='Curriculum'){
        for(let k=n('.tlc'); k<4 && g===gen; k++) await addCurriculumCard(k);
      }
      if(nm==='How it works'){
        for(let k=n('.zstep'); k<ZSTEPS.length && g===gen; k++) await addLoopStep(k);
      }
      /* Portfolio needs no fill: the panel embeds the real portfolio whole */
    }catch(e){}
  },1500);
  fastMode=true;
  try{ DBG_STEPS[i][1](); }catch(e){ console.warn('step',i,e); }
  /* long enough for the stage to paint, short enough that the narration still plays */
  clearTimeout(dbgGoto._t);
  dbgGoto._t=setTimeout(()=>{ fastMode=false; },900);
}
(function(){
  const pv=$('dbgPrev'), nx=$('dbgNext'), st=$('dbgStep'), gr=$('dbgBtn');
  pv.className='dbgnav flip'; pv.innerHTML=I.arrow;
  nx.className='dbgnav'; nx.innerHTML=I.arrow;
  gr.innerHTML=I.gear;
  pv.onclick=()=>{ sfx('tick'); dbgGoto(dbgAt-1); };
  nx.onclick=()=>{ sfx('tick'); dbgGoto(dbgAt+1); };
  st.onclick=()=>{ sfx('tick'); dbgGoto(0); };
  st.textContent='1. '+DBG_STEPS[0][0];
  addEventListener('keydown',e=>{
    if(document.activeElement&&document.activeElement.tagName==='INPUT') return;
    if(e.key==='ArrowRight'){ dbgGoto(dbgAt+1); }
    if(e.key==='ArrowLeft'){ dbgGoto(dbgAt-1); }
  });
})();

/* ---- tuning drawer (debug, prototype only) ---- */
/* grouped, so only the thing you are tuning is open */
(function(){
  const panel=$('dbgPanel'), btn=$('dbgBtn');
  let openSec=null;
  function section(title){
    const sec=mk('div','dbgsec');
    const h=mk('button','dbgh');
    h.appendChild(mk('span',null,title));
    h.appendChild(mk('span','cv',I.arrow));
    const body=mk('div','dbgbody');
    sec.appendChild(h); sec.appendChild(body); panel.appendChild(sec);
    h.onclick=()=>{
      const isOpen=sec.classList.contains('open');
      if(openSec) openSec.classList.remove('open');
      if(isOpen){ openSec=null; }
      else { sec.classList.add('open'); openSec=sec;
        safeTL(gsap.timeline().fromTo(body.children,{opacity:0,y:8},
          {opacity:1,y:0,duration:.34,stagger:.035}),1200); }
      sfx('tick');
    };
    return body;
  }
  function range(body,label,min,max,step,get,set){
    const r=mk('div','dbgrow');
    const lb=mk('div','lb');
    lb.appendChild(mk('span',null,label));
    const val=mk('span','val',String(get()));
    lb.appendChild(val); r.appendChild(lb);
    const inp=document.createElement('input'); inp.type='range';
    inp.min=min; inp.max=max; inp.step=step; inp.value=get();
    inp.oninput=()=>{ set(parseFloat(inp.value)); val.textContent=inp.value; };
    r.appendChild(inp); body.appendChild(r);
  }
  function swatch(body,label,get,set){
    const r=mk('div','dbgrow flat');
    const lb=mk('div','lb'); lb.appendChild(mk('span',null,label)); r.appendChild(lb);
    const inp=document.createElement('input'); inp.type='color'; inp.value=get();
    inp.oninput=()=>set(inp.value);
    r.appendChild(inp); body.appendChild(r);
  }
  function toggle(body,label,get,set){
    const r=mk('div','dbgrow flat');
    const lb=mk('div','lb'); lb.appendChild(mk('span',null,label)); r.appendChild(lb);
    const inp=document.createElement('input'); inp.type='checkbox'; inp.checked=get();
    inp.onchange=()=>set(inp.checked);
    r.appendChild(inp); body.appendChild(r);
  }

  const draw=section('Draw ZERO');
  range(draw,'Ink max',20,180,2,()=>INK.max,v=>INK.max=v);
  range(draw,'Ink min',4,90,2,()=>INK.min,v=>INK.min=v);
  range(draw,'Speed thin',0,80,2,()=>INK.sens,v=>INK.sens=v);
  range(draw,'Wetness',0,.5,.02,()=>INK.wet,v=>INK.wet=v);
  range(draw,'Close tolerance',.1,.7,.05,()=>INK.tol,v=>INK.tol=v);
  swatch(draw,'Ink colour',()=>INK.color,v=>INK.color=v);

  const board=section('Vision board');
  range(board,'Text size',14,34,1,
    ()=>parseInt(getComputedStyle(document.documentElement).getPropertyValue('--vbfs'))||22,
    v=>document.documentElement.style.setProperty('--vbfs',v+'px'));

  const motion=section('Motion');
  range(motion,'Speed',.25,2,.05,()=>1,v=>gsap.globalTimeline.timeScale(v));

  const theme=section('Theme');
  toggle(theme,'Dark mode',()=>document.body.classList.contains('dark'),
    v=>document.body.classList.toggle('dark',v));

  btn.onclick=()=>{ panel.classList.toggle('open'); sfx('tick'); };
})();
