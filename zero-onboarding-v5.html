/* green, blue and yellow, thrown from wherever the good news landed */
function confetti(x,y,n){
  n=n||84; sfx('press');
  const layer=mk('div','conf'); document.body.appendChild(layer);
  const CC=['#4ADE80','#5D87FF','#F5DE6B','#A8E6CF','#0084CE','#C8F169','#FACC15'];
  for(let i=0;i<n;i++){
    const p=mk('i');
    const w=4+Math.random()*7, h=Math.random()<.25?w:9+Math.random()*13;
    p.style.cssText='left:'+(x-w/2)+'px;top:'+(y-h/2)+'px;width:'+w+'px;height:'+h+'px;'+
      'background:'+CC[i%CC.length]+';border-radius:'+(Math.random()<.22?'50%':'2px')+';';
    layer.appendChild(p);
    const ang=-Math.PI/2+(Math.random()-.5)*2.3, sp=200+Math.random()*380;
    const spin=(Math.random()<.5?-1:1)*(380+Math.random()*620);
    gsap.to(p,{x:Math.cos(ang)*sp, y:Math.sin(ang)*sp, rotation:spin,
      duration:.7+Math.random()*.45, ease:'power2.out'});
    gsap.to(p,{y:'+='+(innerHeight*.8+Math.random()*260), rotation:'+='+(spin*.6),
      duration:1.9+Math.random()*1.3, ease:'power1.in', delay:.5+Math.random()*.25});
    gsap.to(p,{opacity:0, duration:.7, delay:1.8+Math.random()*.9});
  }
  /* cleanup rides the last tween, with a wall clock backstop behind it */
  let dead=false;
  const kill=()=>{ if(dead) return; dead=true; if(layer.isConnected) layer.remove(); };
  gsap.to(layer,{opacity:1,duration:3.4,onComplete:kill});
  setTimeout(kill,9000);
}
/* a sheen passes over whatever has just become true */
function sheen(el,dur){
  if(!el) return;
  if(getComputedStyle(el).position==='static') el.style.position='relative';
  const s2=mk('div','sheen'), i2=mk('i'); s2.appendChild(i2); el.appendChild(s2);
  const kill=()=>{ if(s2.isConnected) s2.remove(); };
  safeTL(gsap.timeline({onComplete:kill}).fromTo(i2,{left:'-60%'},
    {left:'125%',duration:dur||1.2,ease:'power2.inOut'}),(dur||1.2)*1000+700);
  setTimeout(kill,(dur||1.2)*1000+900);
}
/* The approval is the trigger. The board goes soft, the light gathers to the
   middle of the screen, a ripple opens out of it, and what comes back is the
   set of companies that hire this exact person. */
function revealSequence(onLand,onDone){
  /* the middle of the board, not the middle of the browser */
  const pr=document.querySelector('.right').getBoundingClientRect();
  const cx=pr.width?pr.left+pr.width/2:innerWidth/2;
  const cy=pr.height?pr.top+pr.height/2:innerHeight/2;
  const S=Math.min(pr.width||innerWidth,innerHeight)*0.62;
  const CLR=['#A8E6CF','#4ADE80','#C8F169','#F5DE6B'];
  const aur=$('aur'); aur.innerHTML='';
  const blobs=CLR.map(c2=>{ const b=mk('b');
    b.style.background='radial-gradient(circle at 50% 50%, '+c2+' 0%, '+c2+'00 70%)';
    aur.appendChild(b); return b; });
  const vb=$('vb');
  const R0=vb?vb.getBoundingClientRect():{left:cx-220,top:cy-170,width:440,height:340};
  const bx=R0.left+R0.width/2, by=R0.top+R0.height/2;
  blobs.forEach((b,i)=>{ const a2=(i/blobs.length)*Math.PI*2-Math.PI/4;
    gsap.set(b,{x:bx-S/2+Math.cos(a2)*R0.width*.52, y:by-S/2+Math.sin(a2)*R0.height*.5,
      scale:.45, opacity:0}); });

  const core=mk('div','core'); document.body.appendChild(core);
  gsap.set(core,{scale:.2,left:cx-85,top:cy-85,margin:0});
  const rip=$('rip'); rip.innerHTML=''; rip.style.display='block';
  const rings=[0,1,2].map(()=>{ const s3=mk('s'); rip.appendChild(s3); return s3; });
  gsap.set(rings,{left:cx-10,top:cy-10,margin:0});

  /* the board's own chips travel with the light */
  const layer=mk('div','zook'); document.body.appendChild(layer);
  const clones=[];
  [...document.querySelectorAll('#vb .vbc, #vb .vbl')].forEach(el=>{
    const r=el.getBoundingClientRect(); if(!r.width) return;
    const c2=el.cloneNode(true); c2.className=el.className+' zc';
    c2.style.cssText+=';position:fixed;left:'+r.left+'px;top:'+r.top+'px;font-size:'+getComputedStyle(el).fontSize+';';
    layer.appendChild(c2); clones.push({c:c2,r:r});
  });
  const names=COS();
  const tiles=names.map((n,i)=>{ const t2=mk('div','ztile',LOGO[n]||'');
    t2.style.left=(cx-37)+'px'; t2.style.top=(cy-37)+'px'; layer.appendChild(t2); return t2; });
  gsap.set(tiles,{scale:0,opacity:0});

  const tl=gsap.timeline();
  /* 1 · the light blooms and the board goes soft */
  tl.set(aur,{opacity:1})
    .to(blobs,{scale:1,opacity:.92,duration:.85,stagger:.08,ease:'power2.out'},0)
    .to(vb,{filter:'blur(15px)',scale:1.06,opacity:.5,duration:1.0,ease:EIO},.18);
  /* 2 · zook, zook, zook: every chip it wrote is pulled into the middle */
  clones.forEach((o,i)=>{
    tl.to(o.c,{x:cx-o.r.left-o.r.width/2, y:cy-o.r.top-o.r.height/2, scale:.5,
      rotate:(i%2?8:-8), filter:'blur(3px)', duration:.5, ease:'power4.in'}, .3+i*.06);
    tl.call(()=>sfx('tick'),null,.3+i*.06+.46);
  });
  const tZ=.3+clones.length*.06+.5;
  /* 3 · everything gathers and ignites */
  tl.to(blobs,{x:cx-S/2,y:cy-S/2,scale:.36,duration:.95,ease:'power3.inOut'},tZ-.35)
    .to(vb,{opacity:0,duration:.4},tZ-.3)
    .to(core,{opacity:1,scale:1,duration:.55,ease:'power2.out'},tZ)
    .to(clones.map(o=>o.c),{opacity:0,scale:.2,filter:'blur(10px)',duration:.45,ease:'power2.in'},tZ)
    .call(()=>sfx('bloom'),null,tZ);
  /* 4 · a ripple opens out of it */
  rings.forEach((s3,i)=>{
    tl.fromTo(s3,{scale:0,opacity:.9},{scale:38,opacity:0,duration:1.6,ease:'power2.out'},tZ+.35+i*.2); });
  tl.to(core,{scale:1.45,opacity:.25,duration:.7,ease:'power2.out'},tZ+.5);
  /* 5 · and it comes back as the companies */
  const R=Math.max(140,Math.min(pr.width||innerWidth,innerHeight)*0.30);
  const tB=tZ+.72;
  tiles.forEach((t2,i)=>{
    const a2=(i/tiles.length)*Math.PI*2-Math.PI/2;
    tl.fromTo(t2,{scale:0,opacity:0,filter:'blur(12px)'},
      {x:Math.cos(a2)*R, y:Math.sin(a2)*R, scale:1, opacity:1, filter:'blur(0px)',
       rotate:(i%2?9:-9), duration:.85, ease:'back.out(1.5)'}, tB+i*.06); });
  const tS=tB+tiles.length*.06+.6;
  tl.to(tiles,{rotate:0,scale:1.06,duration:.5,ease:'sine.inOut'},tS)
    .to(core,{opacity:0,duration:.5},tS)
    .to(blobs,{opacity:.35,scale:.9,duration:.8},tS);

  let landed=false, fired=false;
  const land=()=>{ if(landed) return; landed=true; sfx('page');
    if(onLand) onLand();
    setTimeout(()=>sheen(document.querySelector('.shell'),1.35),320); };
  const finish=()=>{ land(); if(fired) return; fired=true;
    if(layer.isConnected) layer.remove();
    if(core.isConnected) core.remove();
    rip.style.display='none'; rip.innerHTML='';
    gsap.to(aur,{opacity:0,duration:.6,onComplete:()=>{aur.innerHTML='';}});
    if(onDone) onDone(); };
  tl.call(land,null,tS+.4)
    .to(tiles,{x:0,y:0,scale:.35,opacity:0,filter:'blur(9px)',duration:.8,ease:EIO,stagger:.035},tS+.5);
  tl.eventCallback('onComplete',finish);
  /* a throttled tab freezes the ticker, so the clock guarantees both handoffs */
  setTimeout(land,(tS+.4)*1000+700);
  setTimeout(finish,(tS+1.5)*1000+900);
}

/* Fixed spots collided as soon as a card ran to two lines, and they bunched to
   one side because a left-anchored card cannot sit past ~60% without spilling.
   Placing each fact on a ring around the person, anchored by its own centre,
   spaces them by construction and uses the whole panel. */
function lkFact(w,label,value,i,total){
  const f=mk('div','lkf');
  f.appendChild(mk('div','lkft',label));
  f.appendChild(mk('div','lkfv',value));
  w.appendChild(f);
  const wr=w.getBoundingClientRect();
  /* start at the top and go round; nudge the radius per item so the ring reads
     as gathered rather than as a dial */
  const ang=(-Math.PI/2)+(i/Math.max(1,total))*Math.PI*2;
  const wob=1+((i%3)-1)*0.09;
  const rx=Math.min(wr.width*0.34,300)*wob;
  const ry=Math.min(wr.height*0.33,300)*wob;
  const x=wr.width/2+Math.cos(ang)*rx;
  const y=wr.height/2+Math.sin(ang)*ry;
  f.style.left=x+'px'; f.style.top=y+'px';
  f.style.transform='translate(-50%,-50%) rotate('+((i%2?1:-1)*(0.4+(i%3)*0.4)).toFixed(2)+'deg)';
  /* A ring spaces evenly only if every card is the same size, and they are not
     - a five-item skills list is three lines tall. Walk this one outward along
     its own angle until it clears the ones already placed, so the layout stays
     correct whatever the profile happens to say. */
  const hit=el=>{
    const a=f.getBoundingClientRect();
    return [...w.querySelectorAll('.lkf')].some(o=>{ if(o===f) return false;
      const b=o.getBoundingClientRect();
      return a.left<b.right+10&&b.left<a.right+10&&a.top<b.bottom+10&&b.top<a.bottom+10; });
  };
  let push=0;
  while(hit()&&push<9){
    push++;
    f.style.left=(x+Math.cos(ang)*push*22)+'px';
    f.style.top =(y+Math.sin(ang)*push*22)+'px';
  }
  requestAnimationFrame(()=>{
    const fr=f.getBoundingClientRect();
    const cx=wr.width/2, cy=wr.height/2;
    const fx=fr.left-wr.left+fr.width/2, fy=fr.top-wr.top+fr.height/2;
    const dx=fx-cx, dy=fy-cy, len=Math.hypot(dx,dy);
    /* stop the hairline at the card edge, not under it */
    const edge=Math.min(fr.width,fr.height)/2+8;
    const ln=mk('div','lkline');
    ln.style.left=cx+'px'; ln.style.top=cy+'px';
    ln.style.width=Math.max(0,len-58-edge)+'px';
    ln.style.transform='rotate('+Math.atan2(dy,dx)+'rad)';
    w.insertBefore(ln,w.firstChild);
    safeTL(gsap.timeline().fromTo(ln,{scaleX:0,opacity:0},
      {scaleX:1,opacity:1,duration:.5,ease:'power2.out'}),900);
  });
  return f;
}

    .concat(d.follows?[['Following',d.follows]]:[])
    .concat(d.into?[['Signals',d.into]]:[])
    .filter(f=>f[1]);
  const w=$('lkw'); if(!w) return;
  const g=gen;
  for(let i=0;i<facts.length;i++){
    if(g!==gen||!$('lkw')) return;
    const f=lkFact(w,facts[i][0],facts[i][1],i,facts.length);
    safeTL(gsap.timeline().fromTo(f,{opacity:0,scale:.86,filter:'blur(7px)'},
      {opacity:1,scale:1,filter:'blur(0px)',duration:.52,ease:'back.out(1.5)'}),1100);

/* Zero reads eight things off the profile and then put almost none of them on
   the board, which made the board look like it had learned nothing. Everything
   the profile states goes straight on. What it cannot know yet - the target
   companies, the trade-offs - is left for the cards. */
function absorbLinked(){
  const d=LINKEDIN[PKEY]||LINKEDIN.design;
  if(!d) return [];
  const filled=[];
  const put=(k,v)=>{ if(v&&!P[k]){ P[k]=v; filled.push(k); } };
  const head=String(d.headline||'');
  const roleM=/^(.*?)(?:\s+at\s+.+)?$/.exec(head);
  if(roleM) put('role',roleM[1].replace(/^(Senior|Lead|Staff|Principal|Junior)\s+/i,'').trim());
  put('company',d.org);
  put('location',(d.city||'').split(',')[0].trim());
  if(/final year|student|studying/i.test(head)) put('level','Student');
  else if(d.since||/\sat\s/i.test(head))        put('level','Working');
  put('doing',d.exp);
  /* the companies they follow are the ones they already look up to, so they
     seed the board now; the cards confirm or replace them */
  if(d.follows) put('dream',d.follows.split(/,\s*/).filter(Boolean).slice(0,4).join(', '));
  const blob=((d.follows||'')+' '+(d.skills||'')+' '+head).toLowerCase();
  if(/openai|anthropic|\bai\b|\bml\b/.test(blob))            put('industry','Tech and AI');
  else if(/shopify|commerce|retail/.test(blob))              put('industry','Commerce');
  else if(/health|clinic|patient/.test(blob))                put('industry','Health');
  else if(/figma|notion|linear|design|product/.test(blob))   put('industry','Tech and AI');
  if(d.into) put('problems',d.into);
  return filled;
}

/* the line runs between the nodes, not past them */
function fitRail(){
  const wrap=$('tlWrap'), row=$('tlRow'); if(!wrap||!row) return;
  const rail=wrap.querySelector('.tlrail'); if(!rail) return;
  const nodes=[...row.querySelectorAll('.nd')];
  if(nodes.length<2){ rail.style.opacity='0'; return; }
  rail.style.opacity='1';
  const wr=wrap.getBoundingClientRect();
  const f=nodes[0].getBoundingClientRect(), l=nodes[nodes.length-1].getBoundingClientRect();
  if(row.classList.contains('vert')){
    rail.style.left='0'; rail.style.right='auto';
    rail.style.top=Math.round(f.top+f.height/2-wr.top)+'px';
    rail.style.bottom=Math.round(wr.bottom-(l.top+l.height/2))+'px';
  } else {
    rail.style.top='16px'; rail.style.bottom='auto';
    rail.style.left='0'; rail.style.right='0';
  }

      if(done) return;
      if(g!==gen){ fin(); return; }
      while(i<OPEN_CUES.length && a.currentTime>=OPEN_CUES[i].s){ line(OPEN_CUES[i].t); i++; }
      if(a.ended) fin();
    };
    const iv=setInterval(tick,80);
    a.addEventListener('timeupdate',tick);
    const stop=()=>{ clearInterval(iv); a.removeEventListener('timeupdate',tick); };
    stopClock=stop;
    a.addEventListener('ended',()=>{ tick(); stop(); fin(); },{once:true});
    setTimeout(()=>{ stop(); fin(); },(a.duration||15)*1000+1500);
  });
}
async function timedOpen(g){
  for(let i=0;i<OPEN_CUES.length;i++){
    if(g!==gen) return;
    line(OPEN_CUES[i].t);
    const nx=OPEN_CUES[i+1];
    await wait(nx?Math.max(900,(nx.s-OPEN_CUES[i].s)*1000):1800);
  }
}


/* ============================ 0 - draw zero to enter ==================
   The ritual before the promise. Drawing the mark is what turns the
   lights down: from here until the board exists, Zero is taking things
   in, and the dark is what that phase looks like. */
function showDraw(){
  const d=$('drawScreen'); d.style.display='flex';
  safeTL(gsap.timeline()
    .fromTo(d,{opacity:0},{opacity:1,duration:.55},0)
    .fromTo('.dcenter',{scale:.94,opacity:0},{scale:1,opacity:1,duration:.7,ease:EIO},.1),1400);
  if(drawInit) return; drawInit=true;
  const cv=$('drawCanvas'), ctx=cv.getContext('2d');
  let pts=[], down=false, len=0, W=11;
  function size(){ const dpr=devicePixelRatio||1;
    if(!innerWidth||!innerHeight) return; /* hidden or prerendered, try again later */
    cv.width=innerWidth*dpr; cv.height=innerHeight*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.lineCap='round'; ctx.lineJoin='round'; }
  size(); addEventListener('resize',size);
  /* A real brush: the stroke is a filled ribbon whose width breathes with speed.
     Slow hand means the nib dwells and ink pools. Fast hand starves it. */
  function ribbon(a,b,wa,wb){
    const ang=Math.atan2(b.y-a.y,b.x-a.x);
    const n1=ang+Math.PI/2, n2=ang-Math.PI/2;
    ctx.beginPath();
    ctx.moveTo(a.x+Math.cos(n1)*wa/2, a.y+Math.sin(n1)*wa/2);
    ctx.lineTo(b.x+Math.cos(n1)*wb/2, b.y+Math.sin(n1)*wb/2);
    ctx.lineTo(b.x+Math.cos(n2)*wb/2, b.y+Math.sin(n2)*wb/2);
    ctx.lineTo(a.x+Math.cos(n2)*wa/2, a.y+Math.sin(n2)*wa/2);
    ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(b.x,b.y,wb/2,0,7); ctx.fill();
  }
  function inkSeg(){
    const n=pts.length; if(n<2) return;
    const a=pts[n-2], b=pts[n-1];
    const d2=Math.hypot(b.x-a.x,b.y-a.y), dt=Math.max(1,b.t-a.t);
    const speed=d2/dt;
    const target=Math.max(INK.min,Math.min(INK.max,INK.max-speed*INK.sens));
    const prev=W;
    W+=(target-W)*.22;
    ctx.fillStyle=INK.color;
    ctx.globalAlpha=1;
    ribbon(a,b,prev,W);
    /* wetness: a slow nib bleeds. Stamp sparsely, or overlapping alphas moire. */
    if(INK.wet>0 && speed<0.3 && n%4===0){
      ctx.globalAlpha=INK.wet;
      ctx.beginPath(); ctx.arc(b.x,b.y,W*0.58,0,7); ctx.fill();
      ctx.globalAlpha=1;
    }
  }
  function clearInk(){ ctx.save(); ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,cv.width,cv.height); ctx.restore(); }
  cv.addEventListener('pointerdown',e=>{ down=true; len=0; W=INK.max*0.5; AUD.penStart();
    if(!cv.width) size();
    pts=[{x:e.clientX,y:e.clientY,t:performance.now()}];
    ctx.fillStyle=INK.color;
    ctx.beginPath(); ctx.arc(e.clientX,e.clientY,W/2,0,7); ctx.fill(); });
  cv.addEventListener('pointermove',e=>{ if(!down)return;
    const p={x:e.clientX,y:e.clientY,t:performance.now()}, q2=pts[pts.length-1];
    const d2=Math.hypot(p.x-q2.x,p.y-q2.y);
    if(d2<2.5) return;
    AUD.penMove(d2/Math.max(1,p.t-q2.t));
    len+=d2; pts.push(p); inkSeg(); });
  const fin=()=>{ if(!down)return; down=false; AUD.penStop();
    /* the zero must close: start and end land near each other */
    const a=pts[0], b=pts[pts.length-1];
    let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
    pts.forEach(pp=>{ minx=Math.min(minx,pp.x); miny=Math.min(miny,pp.y);
      maxx=Math.max(maxx,pp.x); maxy=Math.max(maxy,pp.y); });
    const diag=Math.hypot(maxx-minx,maxy-miny);
    const closed=len>250 && Math.hypot(b.x-a.x,b.y-a.y)<Math.max(80,diag*INK.tol);
    if(closed) accept();
    else { sfx('tick'); retract(); } };
  /* A fade dissolves the whole mark at once, which reads as an error message.
     Retracting it walks the head along the path so the stroke un-draws itself
     from the start and the last thing left is the tail, still moving. */
  function retract(){
    const total=pts.length;
    if(total<3){ clearInk(); pts=[]; return; }
    const o={head:0};
    const draw=()=>{
      clearInk();
      ctx.fillStyle=INK.color; ctx.globalAlpha=1;
      const head=Math.floor(o.head);
      for(let i=head+1;i<total;i++){
        /* the tail thins as it goes, so the last of the ink looks like it is
           being lifted rather than chopped */
        const life=(i-head)/Math.max(1,total-head);
        const w=W*Math.min(1,.35+life*.9);
        ribbon(pts[i-1],pts[i],w,w);
      }
    };
    safeTL(gsap.timeline({onComplete:()=>{ clearInk(); pts=[]; }})
      .to(o,{head:total-1,duration:.62,ease:'power2.in',onUpdate:draw}),1400);
  }
  cv.addEventListener('pointerup',fin); cv.addEventListener('pointercancel',fin);
  cv.addEventListener('dblclick',()=>accept(true));
  addEventListener('keydown',e=>{ if(e.key==='Enter'&&$('drawScreen').style.display!=='none') accept(true); });
  let accepted=false;
  window.__acceptDraw=()=>accept(true);
  function accept(skip){
    if(accepted) return; accepted=true;
    AUD.penStop(); AUD.whoosh();
    /* the ink swells until it floods the whole screen, then the world goes dark */
    gsap.to('#dH',{opacity:0,y:-10,duration:.35});
    if(!skip&&pts.length>2){
      const obj={w:W};
      const cover=Math.hypot(innerWidth,innerHeight)*2.2;
      const redraw=()=>{ ctx.fillStyle=INK.color; ctx.globalAlpha=1;
        for(let i=1;i<pts.length;i++) ribbon(pts[i-1],pts[i],obj.w,obj.w);
        ribbon(pts[pts.length-1],pts[0],obj.w,obj.w); };
      safeTL(gsap.timeline().to(obj,{w:cover,duration:1.15,ease:'power3.in',onUpdate:redraw}),1900);
    }
    /* the charge rides out with the ink as it sweeps itself shut: a soft
       anticipation ahead of the dark, never a hard ring */
    const d=$('drawScreen');
    let flipped=false;
    const flip=()=>{
      if(flipped) return; flipped=true;
      document.body.classList.add('dark');
      d.style.background='#0E0E10';
    };
    setTimeout(()=>{
      const en=mk('div','energ'); document.body.appendChild(en);
      const o={p:0};
      const paint=()=>{
        const r1=o.p*150;
        const r2=Math.max(0,(o.p-.38)/.62)*150;
        en.style.setProperty('--r1',r1.toFixed(1)+'%');
        en.style.setProperty('--r2',r2.toFixed(1)+'%');
      };
      en.style.setProperty('--r1','0%'); en.style.setProperty('--r2','0%');
      safeTL(gsap.timeline()
        .to(en,{opacity:.5,duration:.34,ease:'power2.out'},0)
        .to(o,{p:1,duration:1.5,ease:'power2.out',onUpdate:paint},0)
        .to(en,{opacity:0,duration:.5,ease:'power2.in'},1.05),2600);
      setTimeout(()=>{ if(en.isConnected) en.remove(); },2300);
    }, skip?120:300);
    setTimeout(flip, skip?420:1180);
    setTimeout(()=>{ gsap.to(d,{opacity:0,duration:.6}); }, skip?520:1320);
    setTimeout(()=>{ d.style.display='none'; openStage(); }, skip?900:1780);
  }
}
/* ---- 1 - the promise, then the name ------------------------------------- */
async function openStage(){
  atStep('Open');
  setPhase(0);
  const myGen=gen;
  dockHide();
  /* the wordmark and phase dots arrive with Zero's first words */
  safeTL(gsap.timeline().to(['#logoPill','.tr'],{opacity:1,y:0,duration:.55,stagger:.07}),1400);
  qWide=true;
  await playOpen();
  qWide=false;
  if(gen!==myGen) return;
  /* the last cue already wrote this line; repeating it re-runs the word

/* ---- 2 - LinkedIn, at step two ------------------------------------------

   Zero offers a reading and asks to be corrected. No role question here:
   roles are inferred later, from choices rather than claims. */
async function readbackStage(){
  atStep('Read back');
  setPhase(0);

  const d=(typeof LINKEDIN!=='undefined'&&(LINKEDIN[PKEY]||LINKEDIN.design))||{};

    if(d.skills) await voLine('I can see signals around '+firstFew(d.skills,3)+'.',2500);
    await voLine("That's the story I'm seeing. I could be wrong.",2300);
  }

  devPills(box,[

  ],handleNote);

    if(locked) return; locked=true;

/* the profile is written for a card, not for a sentence: trim it to something
   Zero can actually say out loud in one breath */
const lower1=t=>String(t||'').charAt(0).toLowerCase()+String(t||'').slice(1);
function firstFew(list,n){
  const a=String(list||'').split(/,\s*/).filter(Boolean).slice(0,n);
  return a.length<2 ? (a[0]||'') : a.slice(0,-1).join(', ')+' and '+a[a.length-1];
}

/* a pivot is the most interesting thing a note can contain, so it gets asked
   about rather than filed away */
const PIVOTS=[['graphic design','product design'],['marketing','product'],
  ['engineering','product'],['analytics','product'],['research','design']];
function detectPivot(t){
  const x=String(t||'').toLowerCase();
  for(const [from,to] of PIVOTS){
    if(x.indexOf(from)>=0 && x.indexOf(to)>=0 && x.indexOf(from)<x.lastIndexOf(to)) return [from,to];
  }
  return null;
}

/* ---- 4 - the pivot question -------------------------------------------- */
async function pivotStage(pv){
  atStep('Pivot');
  setPhase(0);
  const [from,to]=pv||['graphic design','product design'];
  await voLine("That's a meaningful shift, from "+from+' to '+to+'.',2600);
  const {box}=turn({q:'What is it about '+to+' that feels right for you?'});
  devPills(box,[
    "It feels like where things are moving. AI is changing everything and that makes me a little nervous too. I want to solve real problems and build a career I can grow in.",
    "I want to work on products people actually use, not just make things look good."
  ],handle);
  dockInput(handle);
  function handle(text){
    if(locked) return; locked=true;
    P.why=text;
    if(typeof extractInto==='function') extractInto(text);
    renderBoard();
    go(cardsIntroStage);
  }
}

/* ---- 5 - handing over to the cards -------------------------------------- */
/* say back the thing they actually told us, not a generic nod */
function reflectPivot(){
  const t=String(P.why||'').toLowerCase();
  if(/real problem|actually use|people use/.test(t)) return 'Real problems, on things people actually use. Noted.';
  if(/grow|career/.test(t))                          return 'Somewhere you can keep growing. Noted.';
  if(/ai|nervous|uncertain|figur/.test(t))           return 'Still figuring out where AI lands. That is fair.';
  return 'Got it. That helps more than you would think.';
}

  atStep('Cards intro');

/* ---------------------------------------------------------------- engine ----
   Confidence is lean x evidence, never a raw score. Lean has a dead zone, so a
   near tie reports "unknown" instead of a weak winner; evidence saturates, so a
   repeat that agrees raises confidence even though it barely moves the mean.
   Together they make the one guarantee that matters: Zero cannot say something
   confident that the choices do not support. */
const RSTATE={};
/* A round claims to isolate one axis by holding the others equal. Nothing was
   checking that the cards actually do hold them, so a pool edit could quietly
   turn an isolate round into a confounded one and the read-out would keep
   citing it as clean evidence. This verifies every claim at boot: a hold that
   does not hold is demoted to `varies` and the round is flagged confounded,
   which drops its weight rather than silently lying. */
function auditRounds(){
  const problems=[];
  RROUNDS.forEach(r=>{
    const A=RCARD[r.a], B=RCARD[r.b];
    if(!A||!B){ problems.push({round:r.n,issue:'missing card'}); return; }
    (r.holds||[]).slice().forEach(h=>{
      let ok=true;
      if(h==='compPct')      ok=Math.abs(A.t.compPct-B.t.compPct)<=0.08;
      else if(h==='company') ok=A.co===B.co;
      else if(h==='city')    ok=A.t.city===B.t.city;
      else                   ok=A.t[h]===B.t[h];
      if(!ok){
        problems.push({round:r.n,hold:h,a:A.t[h]!==undefined?A.t[h]:A.co,b:B.t[h]!==undefined?B.t[h]:B.co});
        r.holds=r.holds.filter(x=>x!==h);
        r.varies=(r.varies||[]).concat(h);
        r.confounded=true;
      }
    });
    /* a claim on an axis that does not actually differ teaches nothing */
    (r.claims||[]).forEach(c=>{
      if(c.a===c.b) problems.push({round:r.n,claim:c.dim,issue:'both sides identical'});
    });
  });
  if(problems.length&&/[?&]debug=1/.test(location.search)) console.table(problems);
  return problems;
}
const RAUDIT=auditRounds();
function rreset(){
  ['world','shape','ethos'].forEach(k=>RSTATE[k]={kind:'beta',a:1,b:1,ev:[]});
  ['location','type','domain','level'].forEach(k=>RSTATE[k]={kind:'pair',W:{},ev:[]});
  RSTATE.comp={trials:[],forgone:0};
  RPICKS.length=0;
}
const RPICKS=[];
function wbump(node,win,lose,w){
  node.W[win]=node.W[win]||{}; node.W[win][lose]=(node.W[win][lose]||0)+w;
}
function rconf(k){
  const n=RSTATE[k]; if(!n) return 0;
  if(n.kind==='beta'){
    const mean=n.a/(n.a+n.b), ev=n.a+n.b-2;
    const lean=Math.max(0,Math.min(1,(Math.abs(mean-.5)-.08)/.32));
    return lean*(1-Math.exp(-ev/1.1));
  }
  const r=rrank(k); if(r.length<2) return 0;
  const sep=(r[0].p-r[1].p)/(r[0].p+r[1].p||1);
  const tot=n.ev.reduce((a,e)=>a+e.w,0);
  return Math.max(0,Math.min(1,sep*2.2))*(1-Math.exp(-tot/1.1));
}
/* Bradley-Terry: two cities may never meet directly, so a win count cannot
   rank them. This lets the unseen pair be inferred through the ones that did. */
function rrank(k){
  const n=RSTATE[k], W=n.W, opts=[...new Set(Object.keys(W).concat(
    ...Object.values(W).map(o=>Object.keys(o))))];
  if(!opts.length) return [];
  const p={}; opts.forEach(o=>p[o]=1);
  for(let t=0;t<60;t++){
    opts.forEach(i=>{
      /* phantom opponent plays one win AND one loss, so an option that never
         lost cannot run away to infinity */
      let num=.5,den=1/(p[i]+1);
      opts.forEach(j=>{ if(i===j) return;
        num+=(W[i]&&W[i][j])||0;
        const tot=((W[i]&&W[i][j])||0)+((W[j]&&W[j][i])||0);
        if(tot>0) den+=tot/(p[i]+p[j]);
      });
      p[i]=Math.max(1e-4,num/den);
    });
    const g=Math.exp(opts.reduce((a,o)=>a+Math.log(p[o]),0)/opts.length);
    opts.forEach(o=>p[o]=p[o]/g);          /* scale is meaningless; ratios are not */
  }
  return opts.map(o=>({opt:o,p:p[o]})).sort((x,y)=>y.p-x.p);
}
function rwinner(k){
  const n=RSTATE[k]; if(!n) return null;
  if(n.kind==='beta') return n.a>=n.b?n.optA:n.optB;

}
function rapply(round,pick){
  const chose=pick==='a'?round.a:round.b;

  const phaseW={explore:1.0,isolate:1.25,tradeoff:1.15}[round.phase]||1;
  /* costly signal: in a trade-off round, taking the cheaper card means money
     was on the table and lost, so the attribute claim is worth more. Taking the
     richer one leaves money as an unexcluded explanation, so it is worth less. */
  let costly=1;
  if(round.phase==='tradeoff'){
    const A=RCARD[round.a].t.compPct, B=RCARD[round.b].t.compPct;
    const tookCheaper=(pick==='a'?A:B)<(pick==='a'?B:A);
    costly=tookCheaper?1.4:0.3;
  }
  (round.claims||[]).forEach(c=>{
    if(c.a===c.b) return;                       /* nothing to learn from a tie */
    const roleW=c.role==='primary'?1:c.role==='secondary'?.45:1/(round.claims.length||1);
    const w=phaseW*roleW*(round.confounded?.5:1)*costly;
    const win=pick==='a'?c.a:c.b, lose=pick==='a'?c.b:c.a;
    const node=RSTATE[c.dim]; if(!node) return;
    if(node.kind==='beta'){

      if(win===node.optA) node.a+=w; else node.b+=w;
    } else wbump(node,win,lose,w);
    node.ev.push({n:round.n,win:win,w:w,confounded:!!round.confounded,costly:costly>1});
  });
  if(round.compTrial){
    const A=RCARD[round.a].t.compPct, B=RCARD[round.b].t.compPct;
    const tookRicher=(pick==='a'?A:B)>(pick==='a'?B:A);
    const gap=Math.abs(A-B);
    RSTATE.comp.trials.push({n:round.n,tookRicher:tookRicher,gap:gap,

function rmoneyPull(){
  const t=RSTATE.comp.trials; if(!t.length) return .5;

/* The three phases each do a different job: explore reads you, isolate repeats
   to raise confidence, trade-off makes you pay for what you said you wanted.
   Cutting the deck to 10 by truncation would drop every trade-off round, so
   the read-out would claim money came second with nothing behind it. Sample
   proportionally instead. */
function rdeck(){
  const total=rroundsToPlay();
  if(total>=RROUNDS.length) return RROUNDS.slice();
  const byPhase={explore:[],isolate:[],tradeoff:[]};
  RROUNDS.forEach(r=>byPhase[r.phase].push(r));
  const order=['explore','isolate','tradeoff'];
  const want={}; let left=total;
  order.forEach((ph,i)=>{
    const n=i===order.length-1?left:Math.max(1,Math.round(total*byPhase[ph].length/RROUNDS.length));
    want[ph]=Math.min(n,byPhase[ph].length); left-=want[ph];
  });
  /* within a phase, take rounds that cover a dimension not yet seen before
     taking a second round on the same axis. Trimming by position quietly drops
     round 9, the only clean two-city comparison, and the ranking loses the one
     piece of evidence that was not confounded by the work. */
  const out=[], seen={};
  order.forEach(ph=>{
    const pool=byPhase[ph].slice(); let n=want[ph];
    const dims=r=>(r.claims||[]).filter(c=>c.role!=='secondary').map(c=>c.dim);
    while(n>0&&pool.length){
      let idx=pool.findIndex(r=>dims(r).some(d=>!seen[d]));
      if(idx<0) idx=0;
      const r=pool.splice(idx,1)[0];
      dims(r).forEach(d=>seen[d]=1);
      out.push(r); n--;
    }
  });
  return out.sort((x,y)=>x.n-y.n);
}

/* Cursor-driven tilt. With a 760px perspective this is a real turn rather than
   a hint of one, but it still stops short of shearing the text. */
function gyro(el){
  const M=13;
  el.addEventListener('pointermove',e=>{
    const r=el.getBoundingClientRect();
    if(!r.width) return;
    const px=(e.clientX-r.left)/r.width-.5;
    const py=(e.clientY-r.top)/r.height-.5;
    el.style.transition='box-shadow .3s, border-color .24s';
    el.style.transform='rotateY('+(px*M*2).toFixed(2)+'deg) rotateX('+(-py*M*2).toFixed(2)+'deg)';
  });
  el.addEventListener('pointerleave',()=>{
    el.style.transition='box-shadow .3s, border-color .24s, transform .55s var(--e,cubic-bezier(.625,.05,0,1))';
    el.style.transform='';
  });
}

       becomes one of the marks, carrying what was on the card so the board can

    const chosen=RCARD[el.dataset.side==='a'?round.a:round.b];
    RPICKED[chosen.co]={role:chosen.role,city:chosen.city,pay:money(chosen.band||chosen.pay)};
    const seen=dreamList();
    if(seen.indexOf(chosen.co)<0){ seen.push(chosen.co); P.dream=seen.join(', '); }
    const other=el===A?B:A;
    /* the pick flies into the board, so the choice visibly becomes the thing
       the board is made of, and the other card falls away */
    morphToBoard(el);
    safeTL(gsap.timeline()
      .to(el,{opacity:0,scale:.97,duration:.34,ease:'power2.in'},0)
      .to(other.parentElement||other,{opacity:0,y:26,
        rotate:(other.parentElement||other).classList.contains('tiltL')?-7:7,
        duration:.4,ease:'power2.in'},0)
      .add(()=>{ if(row.isConnected) row.remove(); }),1200);
    renderBoard();
    setTimeout(()=>{
      if(myGen!==gen) return;
      RN++; locked=false; rcRound(myGen,false);
    },620);
  };});
}


/* ---------------------------------------------------------------- read-out --
   The locked sentence is the TOP tier, reachable only when every clause's gate
   passes. Each clause steps down through weaker wordings and then out
   altogether. This is the whole point of the mechanic: the user has to
   recognise the trade they made, and a claim they did not make destroys that
   faster than saying nothing would. */
const RWORDS={
  location:{
    strong:'Location matters a lot.',
    moderate:'Location seems to matter a lot.',
    weak:"Location might matter more than you'd say out loud."},
  work:{
    strong:"You're drawn to ambitious teams, and work where you help people or teams get something real done.",
    moderate:'You lean toward ambitious teams, and work that helps people get something real done.',
    weak:'Ambitious teams pulled you some of the time, though not every time.'},
  comp:{
    strong:'Compensation matters, but you repeatedly chose the right work and place over a stronger package.',
    moderate:'Compensation matters, and more than once you chose the work and the place over a stronger package.',
    mixed:"Compensation matters, and you traded it both ways, so I'd call that one open.",
    first:'Compensation came first more often than not, and that is a real answer too.'}
};
function rtier(c){ return c>=.70?'strong':c>=.45?'moderate':c>=.25?'weak':null; }
function rcites(k){
  const n=RSTATE[k]; if(!n) return [];
  return [...new Set(n.ev.map(e=>e.n))].sort((a,b)=>a-b);
}
function rreadout(){
  const parts=[], cites=[];
  const lc=rconf('location');
  const lt=rtier(lc);
  if(lt){ parts.push(RWORDS.location[lt]); cites.push({c:'location',rounds:rcites('location')}); }

  /* "ambitious teams AND work that helps people" is two claims wearing one
     coat, so both have to clear on their own or it steps down */
  const ec=rconf('ethos'), wc=rconf('world');
  const both=Math.min(ec,wc), wt=rtier(both);
  if(wt){ parts.push(RWORDS.work[wt]);
    cites.push({c:'work',rounds:[...new Set(rcites('ethos').concat(rcites('world')))].sort((a,b)=>a-b)}); }

  /* "repeatedly" is a count, so it needs a count behind it */
  const pull=rmoneyPull(), tr=rtradeoffs(), forg=RSTATE.comp.forgone;
  let ck=null;
  if(tr>=3&&pull<.40&&forg>=.30) ck='strong';
  else if(tr>=2&&pull<.50)       ck='moderate';
  else if(pull>=.60)             ck='first';
  else if(tr>=1)                 ck='mixed';
  if(ck){ parts.push(RWORDS.comp[ck]); cites.push({c:'comp',rounds:RSTATE.comp.trials.map(t=>t.n)}); }

  if(!parts.length) parts.push('I have a first read on you, but I want to check it with you.');
  return {lines:parts, cites:cites};
}

/* ------------------------------------------------------------ preferences --
   Six screens, all pre-answered. Editing never touches the tallies: an
   override is stored beside them, so a claim can still cite the rounds that
   produced it - or say "you told me this" when it cannot. */
const PFOVERRIDE={};
function presolve(k){
  if(PFOVERRIDE[k]!==undefined) return PFOVERRIDE[k];
  if(k==='location') return rrank('location').map(r=>r.opt);
  if(k==='priorities') return ppriority();
  return rwinner(k);
}
function pedit(k,v){ PFOVERRIDE[k]=v; psyncP(); }
function pstated(k){ return PFOVERRIDE[k]!==undefined; }

const PFLABEL={
  b2c:'B2C', b2b:'B2B', collaborative:'Collaborative', individual:'Individual craft',
  frontier:'Frontier', established:'Established scale',
  ai_frontier:'AI frontier', commerce:'Commerce', saas:'SaaS', creator:'Creator', impact:'Impact',
  ai_interaction:'AI interaction', team_tools:'Team tools', everyday_utility:'Everyday utility',
  learning:'Learning', creator_tools:'Creator tools',
  toronto:'Toronto', new_york:'New York', san_francisco:'San Francisco'
};
const PFSUB={
  ai_frontier:'OpenAI · Anthropic · Perplexity', commerce:'DoorDash · Shopify · Uber',
  saas:'Figma · Stripe · Salesforce', creator:'Adobe · Spotify', impact:'Health · Climate · Civic',
  b2c:'People using a product in their everyday lives.', b2b:'Teams and the systems they run on.',
  collaborative:'Work that moves because a team moves with it.',
  individual:'Work you can take from blank to finished yourself.',
  toronto:'Canada', new_york:'United States', san_francisco:'United States'
};
/* order by how much weight each axis actually carried, not by confidence: the
   thing you traded for most often is the thing that matters most */
function ppriority(){
  const pull=k=>{ const n=RSTATE[k]; if(!n) return 0;
    return (n.ev||[]).reduce((a,e)=>a+e.w*(e.costly?1.4:1),0); };
  const work=pull('ethos')+pull('world')+pull('shape');
  const loc=pull('location');
  const money=RSTATE.comp.trials.reduce((a,t)=>a+(t.tookRicher?t.w:0),0)*1.6;
  const rows=[
    {k:'work', t:'Work that feels right', s:pworkSub(), v:work},
    {k:'location', t:'Location', s:(PFLABEL[presolveCity()]||'Your top city')+' first', v:loc},
    {k:'comp', t:'Compensation', s:rmoneyPull()<.5?'important, not first':'came first more often', v:money}
  ];
  return rows.sort((a,b)=>b.v-a.v);
}
function presolveCity(){ const l=presolve('location'); return l&&l.length?l[0]:'toronto'; }
function pworkSub(){
  const a=PFLABEL[presolve('shape')]||'', b=PFLABEL[presolve('type')]||'';
  return [a,b].filter(Boolean).join(' + ').toLowerCase()||'the work you kept choosing';
}
/* the board and the roles read from P, so mirror the resolved answers into it */
function psyncP(){
  const city=presolveCity();
  P.location=PFLABEL[city]||P.location;
  const t=presolve('type');
  /* these must be keys IND_COS actually knows, or COS() silently falls back
     to the persona defaults and the board shows companies nobody chose */
  P.industry=t==='ai_frontier'?'Tech and AI':t==='commerce'?'Commerce':
             t==='saas'?'Tech and AI':t==='creator'?'Media':P.industry;
  const d=presolve('domain');
  if(PFLABEL[d]) P.problems=PFLABEL[d];
}

const PFSCREENS=[
 {id:'01',key:'type',    kind:'bubbles',title:'Companies that tend to attract you',
  opts:['ai_frontier','commerce','saas','creator','impact']},
 {id:'02',key:'shape',   kind:'two',    title:'How you like to work',
  opts:['collaborative','individual']},
 {id:'03',key:'world',   kind:'two',    title:'The userbase you would design for',
  opts:['b2c','b2b']},
 {id:'04',key:'domain',  kind:'bubbles',title:'The problems you want to spend time on',
  opts:['ai_interaction','team_tools','everyday_utility','learning','creator_tools']},
 {id:'05',key:'location',kind:'ranked', title:'Where can this future happen?'},
 {id:'06',key:'priorities',kind:'order',title:'And this is the order you kept choosing'}
];

function pwhy(key){
  if(pstated(key)) return 'You told me this.';
  const r=rcites(key);
  if(!r.length) return '';
  return 'From your choices in round'+(r.length>1?'s ':' ')+r.join(', ')+'.';
}

function pbubbles(box,sc){

function ptwo(box,sc){

function pranked(box,sc){

    tie.style.marginTop='10px'; box.appendChild(tie);

function prow(n,title,sub,key,order,sc){
  const r=mk('div','pfr'); r.draggable=true; r.dataset.k=key;
  r.appendChild(mk('span','pfrn',String(n)));
  const t=mk('div','pfrt'); t.appendChild(mk('b',null,title));
  if(sub) t.appendChild(mk('span',null,sub));
  r.appendChild(t);
  r.appendChild(mk('span','pfgrip','⋮⋮'));
  r.ondragstart=e=>{ r.classList.add('drag'); e.dataTransfer.setData('text/plain',key); };
  r.ondragend=()=>r.classList.remove('drag');
  r.ondragover=e=>{ e.preventDefault(); r.classList.add('over'); };
  r.ondragleave=()=>r.classList.remove('over');
  r.ondrop=e=>{ e.preventDefault(); r.classList.remove('over');
    const from=e.dataTransfer.getData('text/plain');
    if(!from||from===key) return;
    const a=order.indexOf(from), b=order.indexOf(key);
    order.splice(b,0,order.splice(a,1)[0]);
    sfx('tick'); pedit('location',order.slice()); prender(sc);
  };
  return r;
}
function porder(box,sc){
  const rows=presolve('priorities');
  const list=mk('div','pfrank');
  /* this screen states the most contestable thing Zero says - that money came
     second - so of all six it is the one that has to be draggable */
  rows.forEach((r,i)=>{
    const el=mk('div','pfr'); el.draggable=true; el.dataset.k=r.k;
    el.appendChild(mk('span','pfrn',String(i+1)));
    const t=mk('div','pfrt'); t.appendChild(mk('b',null,r.t)); t.appendChild(mk('span',null,r.s));
    el.appendChild(t);
    el.appendChild(mk('span','pfgrip','\u22ee\u22ee'));
    el.ondragstart=e=>{ el.classList.add('drag'); e.dataTransfer.setData('text/plain',r.k); };
    el.ondragend=()=>el.classList.remove('drag');
    el.ondragover=e=>{ e.preventDefault(); el.classList.add('over'); };
    el.ondragleave=()=>el.classList.remove('over');
    el.ondrop=e=>{ e.preventDefault(); el.classList.remove('over');
      const from=e.dataTransfer.getData('text/plain'); if(!from||from===r.k) return;
      const cur=presolve('priorities').slice();
      const a=cur.findIndex(x=>x.k===from), b=cur.findIndex(x=>x.k===r.k);
      cur.splice(b,0,cur.splice(a,1)[0]);
      sfx('tick'); pedit('priorities',cur); prender(sc);
    };
    list.appendChild(el);
  });
  box.appendChild(list);
  enter(Array.from(list.children),{y:12,blur:6,stagger:.07,duration:.5},1300);
}

let PFAT=0;

function pbuild(box,sc){

/* ------------------------------------------------------------------ roles --
   Every card states how close it is and why. The tier is computed from the
   same evidence the read-out used, so a role cannot claim to be a direct fit
   on an axis the user never actually settled. */
const JTIERS=[[5,'DIRECT FIT'],[4,'STRONG FIT'],[3,'CLOSE'],[2,'ADJACENT'],[1,'A STRETCH']];
const JPOOL=[
 {co:'OpenAI',role:'Product Designer',where:'Remote Canada / US',yrs:'1-4 years',
  d:'Make powerful AI clear and useful through thoughtful, trustworthy product experiences.',
  t:{type:'ai_frontier',ethos:'frontier',world:'b2c',shape:'collaborative',domain:'ai_interaction',city:'toronto'}},
 {co:'Anthropic',role:'Product Designer',where:'Remote Canada / US',yrs:'2-5 years',
  d:'Design the surfaces where people and models actually meet, and keep them legible.',
  t:{type:'ai_frontier',ethos:'frontier',world:'b2c',shape:'collaborative',domain:'ai_interaction',city:'toronto'}},
 {co:'Figma',role:'Product Designer',where:'Toronto',yrs:'1-4 years',
  d:'Design tools that let a whole team move through one file without stepping on each other.',
  t:{type:'saas',ethos:'frontier',world:'b2b',shape:'collaborative',domain:'team_tools',city:'toronto'}},
 {co:'Shopify',role:'Product Designer',where:'Toronto',yrs:'1-3 years',
  d:'Help independent merchants run a business with confidence, not just a storefront.',
  t:{type:'commerce',ethos:'established',world:'b2b',shape:'collaborative',domain:'team_tools',city:'toronto'}},
 {co:'Notion',role:'Product Designer',where:'Remote',yrs:'2-4 years',
  d:'Make a blank page feel like a starting point instead of a demand.',
  t:{type:'saas',ethos:'frontier',world:'b2c',shape:'individual',domain:'creator_tools',city:'new_york'}},
 {co:'Stripe',role:'Product Designer',where:'New York',yrs:'2-5 years',
  d:'Show businesses what is happening to their money, plainly.',
  t:{type:'saas',ethos:'frontier',world:'b2b',shape:'collaborative',domain:'team_tools',city:'new_york'}}
];
/* Reasons name the axis AND the evidence behind it, so a claim can be checked.
   An axis the rounds never settled contributes nothing rather than a guess. */
const JREASON={
  type:{ai_frontier:'the AI-first companies you kept picking',commerce:'the consumer businesses you leaned to',
        saas:'the tools-for-teams world you chose',creator:'the creative tools you chose',impact:'the mission work you chose'},
  ethos:{frontier:'ambitious teams over established scale',established:'proven scale over frontier bets'},
  world:{b2c:'products people use directly',b2b:'teams and the systems behind them'},
  shape:{collaborative:'work that moves with a team',individual:'work you can finish yourself'},
  domain:{ai_interaction:'AI interaction problems',team_tools:'team tooling problems',
          everyday_utility:'everyday utility problems',learning:'learning problems',creator_tools:'creator tooling problems'}
};
function jscore(job){
  let hit=0, tot=0; const why=[];
  ['type','ethos','world','shape','domain'].forEach(k=>{
    /* an axis the rounds never settled proves nothing - unless the user
       went and set it themselves on screens 01-06, which is stronger */
    if(rconf(k)<.25 && !pstated(k)) return;
    tot++;
    if(presolve(k)===job.t[k]){ hit++;
      const r=JREASON[k]&&JREASON[k][job.t[k]]; if(r) why.push(r); }
  });
  const loc=presolve('location')||[];
  const li=loc.indexOf(job.t.city);
  if(loc.length){ tot++; if(li===0){ hit++; why.push('the city you ranked first'); }
                  else if(li===1){ hit+=.5; why.push('your second city'); } }
  const ratio=tot?hit/tot:.5;
  const tier=ratio>=.85?5:ratio>=.68?4:ratio>=.5?3:ratio>=.3?2:1;
  return {tier:tier, why:why.slice(0,3)};
}
function jcard(job){
  const sc=jscore(job);
  const label=(JTIERS.find(t=>t[0]===sc.tier)||JTIERS[2])[1];
  const c=mk('div','jrc');
  const tier=mk('div','jrtier'+(sc.tier>=4?' top':''));
  const bar=mk('span','jrbar');
  for(let i=1;i<=5;i++){ const b=mk('i'); if(i<=sc.tier) b.className='on'; bar.appendChild(b); }
  tier.appendChild(bar);
  tier.appendChild(mk('span',null,'0'+sc.tier+' · '+label));
  c.appendChild(tier);
  const h=mk('div','jrhead');
  h.appendChild(mk('span','jrlogo',rlogo(job.co)));
  h.appendChild(mk('div','jrt',job.co+' · '+job.role));
  c.appendChild(h);
  c.appendChild(mk('div','jrm',job.where+' · full-time · '+job.yrs));
  c.appendChild(mk('div','jrd',job.d));
  if(sc.why.length) c.appendChild(mk('div','jrwhy','<b>Why it fits:</b> '+sc.why.join(', ')+'.'));
  return {el:c,tier:sc.tier};
}
function buildRoles(host){
  const wrap=mk('div','jr'); wrap.id='jrList';
  host.appendChild(wrap);
}
async function addRoles(){
  const host=$('jrList'); if(!host) return;
  const ranked=JPOOL.map(j=>jcard(j)).sort((a,b)=>b.tier-a.tier).slice(0,4);
  for(const r of ranked){

  if(sc.kind==='url'){
    const f=document.createElement('iframe');
    f.className='hzframe'; f.setAttribute('title',sc.label||'Zero'); f.setAttribute('loading','eager');
    f.src=sc.src; box.appendChild(f);
  } else if(sc.kind==='world'){
    const f=mk('div','hzframe');
    f.style.cssText+=';background:url(zero-world.jpg) center/cover no-repeat';
    box.appendChild(f);
  } else {
    /* an honest gap beats an invented screen: these two exist only inside the
       desktop app and have not been captured yet */
    const h=mk('div','hzhold');
    h.appendChild(mk('b',null,sc.label));
    h.appendChild(mk('span',null,sc.note));
    box.appendChild(h);
  }
  host.appendChild(box);
  setCap(sc.label||'How Zero works',false);
}
function hzcopy(box,beat,host){
  const wrap=mk('div');
  if(beat.tail){
    /* the pill is part of the sentence, so it is built inline rather than
       parked in a row underneath where it would read as a control */
    const p=mk('div','hzline');
    p.style.cssText='font-size:19px;line-height:1.55;color:var(--tx-2);letter-spacing:-.015em';
    const parts=beat.tail.split(/(\$\w+)/);
    parts.forEach(seg=>{
      const m=/^\$(\w+)$/.exec(seg);
      if(!m){ p.appendChild(document.createTextNode(seg)); return; }
      const pill=beat.pills.find(x=>x.t===m[1]);
      const el=mk('span','hzp',pill?pill.t:m[1]);
      el.onclick=()=>{ if(!pill) return; sfx('tick');
        wrap.querySelectorAll('.hzp').forEach(x=>x.classList.remove('on'));
        el.classList.add('on'); hzscreen(host,pill.screen); };
      el.onmouseenter=()=>{ if(pill) hzscreen(host,pill.screen); };
      p.appendChild(el);
    });
    wrap.appendChild(p);
  }
  const dots=mk('div','hzdots');
  HZBEATS.forEach((_,i)=>{ const d=mk('i'); if(i<=HZAT) d.className='on'; dots.appendChild(d); });
  wrap.appendChild(dots);
  box.appendChild(wrap);
  enter([wrap],{y:12,blur:7,duration:.55},1200);
}
async function worksStage(){
  atStep('How it works');
  const myGen=gen;
  setPhase(3);
  if(HZAT===0){
    clearTurn(); dockHide(); await wait(360);
    if(myGen!==gen) return;
    await swapPanel('How Zero works',h=>{ const host=mk('div'); host.id='hzHost';
      host.style.cssText='position:absolute;inset:0'; h.appendChild(host); },false,false);
  }
  const beat=HZBEATS[Math.min(HZAT,HZBEATS.length-1)];
  const host=$('hzHost');
  if(host) hzscreen(host,beat.screen);
  if(myGen!==gen) return;
  await voLine(beat.say,Math.max(2000,beat.say.length*44));
  if(myGen!==gen) return;
  const {box}=turn({q:beat.then});
  await wait(300);
  if(myGen!==gen) return;
  hzcopy(box,beat,host);
  const last=HZAT>=HZBEATS.length-1;
  cta(last?'What do I start with?':'Keep going',()=>{
    if(last){ HZAT=0; go(claimStage); }
    else { HZAT++; locked=false; worksStage(); }
  });
}

/* ---- 6..12 - built next ------------------------------------------------- */
function stub(label,next,note){
  setPhase(1);
  const {box}=turn({q:label});
  const n=mk('div','devl',note||'not built yet');
  n.style.cssText='margin-top:18px;opacity:.55';

function synthesisStage(){stub('The picture I have.', portfolioStage,'step 5 - synthesis monologue'); }
function claimStage(){    stub('10,000 credits.',     creditsStage,  'step 8 - slide to claim'); }

/* ============================ boot ============================ */
gsap.set(['#logoPill','.tr'],{opacity:0,y:-9});
setPhase(0);
showDraw();

/* ============================ step-through (prototype only) ============================ */
/* Walk the whole flow with sensible answers already filled in, no clicking. */
const DBG_STEPS=[
  ['Draw',        ()=>{ $('drawScreen').style.display='flex';
                        gsap.set('#drawScreen',{opacity:1}); gsap.set('#dH',{opacity:1,y:0}); }],
  ['Open',        ()=>openStage()],
  ['LinkedIn',    ()=>linkedinStage()],
  ['Read back',   ()=>readbackStage()],
  ['Pivot',       ()=>pivotStage(P.pivot)],
  ['Cards intro', ()=>cardsIntroStage()],
  ['Cards',       ()=>cardsStage()],
  ['Reflection',  ()=>reflectStage()],
  ['Preferences', ()=>prefStage()],
  ['Vision',      ()=>visionStage(true)],
  ['Roles',       ()=>rolesStage()],
  ['Synthesis',   ()=>synthesisStage()],
  ['Portfolio',   ()=>portfolioStage()],
  ['How it works',()=>worksStage()],
  ['Claim',       ()=>claimStage()],
  ['Credits',     ()=>creditsStage()],
  ['Handoff',     ()=>finishStage('sanjay@z-ro.co')],
];
/* what each step would have produced, so any step can be entered cold */
function dbgFill(upTo){
  const d=pack();
  /* the stepper has to be able to go backwards. Without this P only ever grows,
     so an earlier step shows a fuller board than it should. */
  Object.keys(P).forEach(k=>{ P[k]= k==='picks' ? [] : null; });
  const set=(i,fn)=>{ if(upTo>i) fn(); };
  /* indices track DBG_STEPS: 0 Open, 1 LinkedIn, 2 Read back, 3 Pivot,
     4 Cards intro, 5 Cards, 6 Reflection, 7 Preferences, 8 Vision, ... */
  set(1,()=>P.name='Sanjay');
  set(2,()=>{ P.linked='LinkedIn'; P.linkedUrl='linkedin.com/in/sanjaybchauhan'; });
  set(3,()=>{ P.level='Student';
    P.about='I started in graphic design but recently I have been looking more into product design.';
    P.pivot=['graphic design','product design']; });
  set(4,()=>{ P.why='I want to work on products people actually use and build a career I can grow in.'; });
  set(6,()=>{ /* the cards have been played: their read-out is the preference state */
    P.role=d.roles&&d.roles[0]?d.roles[0][0]:'Product Designer';
    P.dream='OpenAI, Figma, Anthropic';
    P.industry='Tech and AI';
    P.problems=d.problemChips?d.problemChips[0]:'Confusing tools';
    P.location='Toronto';
    P.timeline='This year'; });
  set(9,()=>{ P.aim=d.roles&&d.roles[0]?d.roles[0][0]:'Product Designer'; });
}
let dbgAt=0;
/* The pill used to move only when its own arrows were pressed, so walking the
   real flow left it stuck on step one. Stages announce themselves instead. */
function atStep(label){
  const i=DBG_STEPS.findIndex(x=>x[0]===label);
  if(i<0) return;
  dbgAt=i;
  const lbl=$('dbgStep'); if(lbl) lbl.textContent=(i+1)+'. '+label;
  const pv=$('dbgPrev'), nx=$('dbgNext');
  if(pv) pv.style.opacity=i<=0?.3:1;
  if(nx) nx.style.opacity=i>=DBG_STEPS.length-1?.3:1;
}
function dbgGoto(i){
  i=Math.max(0,Math.min(DBG_STEPS.length-1,i));
  dbgAt=i;
  /* nothing from the last step gets to finish */
  gen++;
  try{ gsap.killTweensOf(['#col','#scroll','.right','#dock','#dtr','#top','#aur','#paper','#turn']); }catch(e){}
  locked=false; editReturn=null; scanning=false; queue.length=0; shown={}; keys={}; tlMode='h';
  const t0=$('turn'); if(t0) t0.remove();
  $('col').innerHTML=''; $('dockIn').innerHTML='';
  gsap.set('#dock',{opacity:0}); gsap.set('#dtr',{opacity:0}); $('dtr').innerHTML='';
  stopRec();
  document.querySelectorAll('.zook,.conf,.core,.veil,.sheen,.gh').forEach(n=>n.remove());
  $('rip').style.display='none'; $('rip').innerHTML='';
  $('aur').innerHTML=''; gsap.set('#aur',{opacity:0});
  gsap.set(['#logoPill','.tr'],{opacity:i>=1?1:0,y:0});
  if(i!==0) $('drawScreen').style.display='none';
  /* the stepper must reproduce the same boundary, or a jump lands in the
     wrong light and the device stops reading as intentional */
  document.body.classList.toggle('dark', i<=8);
  $('col').innerHTML='';
  dbgFill(i);
  /* the panel exists from the moment Zero starts writing things down */
  /* panel opens at the read-back (2) and widens once the board is the subject (8) */
  const born=i>=3, wide=i>=9;
  if(born){
    panelBorn=true; boardLive=true;
    gsap.set('.right',{width:panelPref?panelPref+'px':(wide?'56%':'40%'),opacity:1,x:0});
    shiftLeft(panelPref?panelPref+'px':(wide?'56vw':'40vw'));
    mountResizer();
    $('cap').innerHTML='<span class="live pulse"></span>'+(wide?'Your vision board':'Zero is listening');
    const sc=$('scroll'); sc.className='scroll ctr'; sc.innerHTML='';
    const vb=mk('div','vb'); vb.id='vb'; vb.innerHTML=boardHTML(); sc.appendChild(vb);
    SENTENCES().forEach(x=>{ if(x.ready){ shown[x.id]=1; keys[x.id]=x.key; } });
    meterRetired=i>=9; boardRewards=i>=9;
  } else {
    panelBorn=false; boardLive=false;
    gsap.set('.right',{width:0,opacity:0}); shiftLeft('0px');
  }
  meterRetired=i>14; boardRewards=i>14;
  renderMeter();                    /* every step, not only the ones with a panel */
  setPhase(i<14?0:(i<16?1:(i<18?2:(i<19?3:4))));
  const lbl=$('dbgStep'); if(lbl) lbl.textContent=(i+1)+'. '+DBG_STEPS[i][0];
  const pv=$('dbgPrev'), nx=$('dbgNext');
  if(pv) pv.disabled=i<=0;
  if(nx) nx.disabled=i>=DBG_STEPS.length-1;
  /* a jumped-to panel must show its content, not the empty frame it starts as */
  clearTimeout(dbgGoto._f);
  dbgGoto._f=setTimeout(async()=>{
    const g=gen;
    const n=sel=>document.querySelectorAll(sel).length;
    try{
      const nm=DBG_STEPS[i][0];
      /* only top up what the stage's own sequence has not reached yet, or the
         fill races the beats and doubles everything */
      if(nm==='Curriculum'){
        for(let k=n('.tlc'); k<4 && g===gen; k++) await addCurriculumCard(k);
      }
      if(nm==='How it works'){
        for(let k=n('.zstep'); k<ZSTEPS.length && g===gen; k++) await addLoopStep(k);
      }
      /* Portfolio needs no fill: the panel embeds the real portfolio whole */
    }catch(e){}
  },1500);
  fastMode=true;
  try{ DBG_STEPS[i][1](); }catch(e){ console.warn('step',i,e); }
  /* long enough for the stage to paint, short enough that the narration still plays */
  clearTimeout(dbgGoto._t);
  dbgGoto._t=setTimeout(()=>{ fastMode=false; },900);
}
(function(){
  const pv=$('dbgPrev'), nx=$('dbgNext'), st=$('dbgStep'), gr=$('dbgBtn');
  pv.className='dbgnav flip'; pv.innerHTML=I.arrow;
  nx.className='dbgnav'; nx.innerHTML=I.arrow;
  gr.innerHTML=I.gear;
  pv.onclick=()=>{ sfx('tick'); dbgGoto(dbgAt-1); };
  nx.onclick=()=>{ sfx('tick'); dbgGoto(dbgAt+1); };
  st.onclick=()=>{ sfx('tick'); dbgGoto(0); };
  st.textContent='1. '+DBG_STEPS[0][0];
  addEventListener('keydown',e=>{
    if(document.activeElement&&document.activeElement.tagName==='INPUT') return;
    if(e.key==='ArrowRight'){ dbgGoto(dbgAt+1); }
    if(e.key==='ArrowLeft'){ dbgGoto(dbgAt-1); }
  });
})();

/* ---- tuning drawer (debug, prototype only) ---- */
/* grouped, so only the thing you are tuning is open */
(function(){
  const panel=$('dbgPanel'), btn=$('dbgBtn');
  let openSec=null;
  function section(title){
    const sec=mk('div','dbgsec');
    const h=mk('button','dbgh');
    h.appendChild(mk('span',null,title));
    h.appendChild(mk('span','cv',I.arrow));
    const body=mk('div','dbgbody');
    sec.appendChild(h); sec.appendChild(body); panel.appendChild(sec);
    h.onclick=()=>{
      const isOpen=sec.classList.contains('open');
      if(openSec) openSec.classList.remove('open');
      if(isOpen){ openSec=null; }
      else { sec.classList.add('open'); openSec=sec;
        safeTL(gsap.timeline().fromTo(body.children,{opacity:0,y:8},
          {opacity:1,y:0,duration:.34,stagger:.035}),1200); }
      sfx('tick');
    };
    return body;
  }
  function range(body,label,min,max,step,get,set){
    const r=mk('div','dbgrow');
    const lb=mk('div','lb');
    lb.appendChild(mk('span',null,label));
    const val=mk('span','val',String(get()));
    lb.appendChild(val); r.appendChild(lb);
    const inp=document.createElement('input'); inp.type='range';
    inp.min=min; inp.max=max; inp.step=step; inp.value=get();
    inp.oninput=()=>{ set(parseFloat(inp.value)); val.textContent=inp.value; };
    r.appendChild(inp); body.appendChild(r);
  }
  function swatch(body,label,get,set){
    const r=mk('div','dbgrow flat');
    const lb=mk('div','lb'); lb.appendChild(mk('span',null,label)); r.appendChild(lb);
    const inp=document.createElement('input'); inp.type='color'; inp.value=get();
    inp.oninput=()=>set(inp.value);
    r.appendChild(inp); body.appendChild(r);
  }
  function toggle(body,label,get,set){
    const r=mk('div','dbgrow flat');
    const lb=mk('div','lb'); lb.appendChild(mk('span',null,label)); r.appendChild(lb);
    const inp=document.createElement('input'); inp.type='checkbox'; inp.checked=get();
    inp.onchange=()=>set(inp.checked);
    r.appendChild(inp); body.appendChild(r);
  }

  const draw=section('Draw ZERO');
  range(draw,'Ink max',20,180,2,()=>INK.max,v=>INK.max=v);
  range(draw,'Ink min',4,90,2,()=>INK.min,v=>INK.min=v);
  range(draw,'Speed thin',0,80,2,()=>INK.sens,v=>INK.sens=v);
  range(draw,'Wetness',0,.5,.02,()=>INK.wet,v=>INK.wet=v);
  range(draw,'Close tolerance',.1,.7,.05,()=>INK.tol,v=>INK.tol=v);
  swatch(draw,'Ink colour',()=>INK.color,v=>INK.color=v);

  const board=section('Vision board');
  range(board,'Text size',14,34,1,
    ()=>parseInt(getComputedStyle(document.documentElement).getPropertyValue('--vbfs'))||22,
    v=>document.documentElement.style.setProperty('--vbfs',v+'px'));

  const motion=section('Motion');
  range(motion,'Speed',.25,2,.05,()=>1,v=>gsap.globalTimeline.timeScale(v));

  const theme=section('Theme');
  toggle(theme,'Dark mode',()=>document.body.classList.contains('dark'),
    v=>document.body.classList.toggle('dark',v));

  btn.onclick=()=>{ panel.classList.toggle('open'); sfx('tick'); };
})();
