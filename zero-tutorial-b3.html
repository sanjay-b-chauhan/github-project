<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>How Zero works</title>
<link rel="icon" href="zero-tutorial-assets-b3/img/zero-mark.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,100..1000&display=swap">
<style>
/* core.css */
/* ZERO overview tour · core. Everything the tour itself draws is prefixed zt-.
   Chapter screens live under .zt-ch.ch-<id> and must scope their own rules there. */
@font-face{font-family:'STK Bureau Serif';src:url('zero-tutorial-assets-b3/fonts/STKBureau-SerifBook.otf') format('opentype');font-weight:400;font-display:swap}
@font-face{font-family:'STK Bureau Serif';src:url('zero-tutorial-assets-b3/fonts/STKBureau-SerifMedium.otf') format('opentype');font-weight:500;font-display:swap}
@font-face{font-family:'PP Supply Mono';src:url('zero-tutorial-assets-b3/fonts/PPSupplyMono-Regular.otf') format('opentype');font-weight:400;font-display:swap}

:root{
  --zt-ease:cubic-bezier(.625,.05,0,1);
  --zt-green:#49BA61; --zt-green-deep:#2E9A48; --zt-green-ink:#06210f;
  --f-serif:'STK Bureau Serif',Georgia,serif;
  --f-sans:'Google Sans Flex','Google Sans',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-mono:'PP Supply Mono','SFMono-Regular',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#141414}
body{font-family:var(--f-sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;transition:background .6s var(--zt-ease)}
button{font-family:inherit}

/* One fixed design canvas, scaled to fit. Chapters draw in 1600 x 840 px. */
#zt-root{position:fixed;left:0;top:0;width:1600px;height:840px;transform-origin:0 0;
  --zt-ink:#f2f1ee; --zt-ink-2:rgba(242,241,238,.6); --zt-ink-3:rgba(242,241,238,.34);
  --zt-chip:rgba(255,255,255,.08); --zt-chip-h:rgba(255,255,255,.14); --zt-ink-inv:#161616}
#zt-root[data-tone="light"]{--zt-ink:#1f1d1e; --zt-ink-2:rgba(31,29,30,.62); --zt-ink-3:rgba(31,29,30,.34);
  --zt-chip:rgba(31,29,30,.06); --zt-chip-h:rgba(31,29,30,.11); --zt-ink-inv:#ffffff}
/* Two layers. #zt-full holds the full-screen chapters (sign in, the world).
   #zt-win is the pop-up that sits on top of the world: it shows a tour screen at 90%,
   cropped just above the tour's own dock. */
#zt-full{position:absolute;inset:0;overflow:hidden}
/* The player is 16:9: 1408 x 792. The picture is the top 692, the control bar the bottom 100.
   A tour screen is drawn in it at 88%, cropped just under its last control. */
#zt-playerbg{position:absolute;z-index:9;left:96px;top:24px;width:1408px;height:792px;border-radius:22px;background:#101110;
  box-shadow:0 0 0 1px rgba(255,255,255,.1),0 34px 100px rgba(0,0,0,.62);
  opacity:0;transform:translateY(18px) scale(.955);pointer-events:none;transition:opacity .42s var(--zt-ease),transform .7s var(--zt-ease)}
#zt-root.zt-windowed #zt-playerbg{opacity:1;transform:none}
#zt-win{position:absolute;z-index:10;left:96px;top:24px;width:1408px;height:692px;border-radius:22px 22px 0 0;overflow:hidden;background:#1E1E1E;
  opacity:0;transform:translateY(18px) scale(.955);transform-origin:50% 396px;pointer-events:none;
  transition:opacity .42s var(--zt-ease),transform .7s var(--zt-ease),background .5s var(--zt-ease)}
#zt-root.zt-windowed #zt-win{opacity:1;transform:none;pointer-events:auto}
#zt-stage{position:absolute;left:0;top:0;width:1600px;height:840px;transform:scale(.88);transform-origin:0 0;overflow:hidden}
#zt-full .zt-ch{transition:opacity .5s var(--zt-ease),transform .72s var(--zt-ease),filter .6s var(--zt-ease)}
#zt-full .zt-ch.zt-behind{filter:blur(6px) brightness(.6) saturate(.9);transform:scale(1.035);pointer-events:none}
/* behind the pop-up the world melts into the page colour at its sides, so a wider window shows no seam */
#zt-root.zt-windowed:not(.zt-fullmode) #zt-full{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 7%,#000 93%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 7%,#000 93%,transparent 100%)}
/* compare mode (?full=1): the same screens fill the canvas and nothing sits behind them */
#zt-root.zt-fullmode #zt-win{left:0;top:0;width:1600px;height:840px;border-radius:0;box-shadow:none}
#zt-root.zt-fullmode #zt-playerbg,#zt-root.zt-fullmode #zt-veil{display:none!important}
#zt-root.zt-fullmode #zt-stage{transform:none}
#zt-root.zt-fullmode #zt-full .zt-ch.zt-behind{visibility:hidden}

/* the row above the pop-up: what this is, and the skill points you are earning */
.zt-top{position:absolute;z-index:11;left:80px;right:80px;top:0;height:48px;display:flex;align-items:center;gap:10px;color:#f2f1ee;
  opacity:0;transform:translateY(-6px);transition:opacity .4s var(--zt-ease) .15s,transform .5s var(--zt-ease) .15s;pointer-events:none}
#zt-root.zt-windowed .zt-top{opacity:1;transform:none}
.zt-top-t{font:600 14px/1 var(--f-sans);letter-spacing:-.01em}
.zt-top-s{font:400 13px/1 var(--f-sans);color:rgba(242,241,238,.55);letter-spacing:-.01em}
.zt-pts{margin-left:auto;display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 13px 0 10px;border-radius:999px;background:rgba(255,255,255,.09);
  font:400 13px/1 var(--f-sans);letter-spacing:-.01em;color:#f2f1ee}
.zt-pts svg{width:14px;height:14px;color:#F2C94C}
.zt-pts b{font-weight:600;font-variant-numeric:tabular-nums;min-width:1ch;text-align:right}
.zt-pts em{font-style:normal;color:rgba(242,241,238,.6)}
.zt-pts.zt-bump{animation:zt-bump .5s var(--zt-ease)}
@keyframes zt-bump{35%{transform:scale(1.12);background:rgba(242,201,76,.28)}100%{transform:none}}
#zt-root.zt-fullmode .zt-top{left:auto;right:28px;top:8px;height:auto}
#zt-root.zt-fullmode .zt-top-t,#zt-root.zt-fullmode .zt-top-s{display:none}
#zt-root.zt-fullmode .zt-pts{background:rgba(20,20,20,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.zt-fly{position:absolute;z-index:90;display:flex;align-items:baseline;gap:7px;padding:9px 14px;border-radius:999px;background:#F2C94C;color:#2a2105;white-space:nowrap;pointer-events:none;
  font:400 13px/1 var(--f-sans);letter-spacing:-.01em;box-shadow:0 10px 30px rgba(0,0,0,.35);
  opacity:0;transform:translate(-50%,-50%) translateY(10px) scale(.7);
  transition:opacity .25s var(--zt-ease),transform .45s var(--zt-ease),left .7s var(--zt-ease),top .7s var(--zt-ease)}
.zt-fly b{font-weight:700;font-size:15px}
.zt-fly.zt-on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.zt-fly.zt-go{opacity:.9;transform:translate(-50%,-50%) scale(.62)}

/* progress and Skip only belong to the tour itself */
#zt-root:not(.zt-windowed) .zt-step,#zt-root:not(.zt-windowed) .zt-dots,#zt-root:not(.zt-windowed) .zt-skip,
#zt-root.zt-nostep .zt-step,#zt-root.zt-nostep .zt-dots{display:none}

/* chapter screens: a blur morph, never a hard cut */
.zt-ch{position:absolute;inset:0;overflow:hidden;opacity:0;transform:scale(1.012);filter:blur(12px);
  transition:opacity .5s var(--zt-ease),transform .72s var(--zt-ease),filter .5s var(--zt-ease)}
.zt-ch.zt-in{opacity:1;transform:none;filter:none}
.zt-ch.zt-exit{opacity:0;transform:scale(.988);filter:blur(12px);pointer-events:none}

/* ---------- the guide: one face that changes seat ---------- */
.zt-guide{position:absolute;z-index:60;left:28px;top:778px;width:48px;height:48px;border-radius:50%;pointer-events:none;
  transition:left .76s var(--zt-ease),top .76s var(--zt-ease),width .76s var(--zt-ease),height .76s var(--zt-ease),border-radius .76s var(--zt-ease),opacity .4s var(--zt-ease)}
.zt-guide.zt-instant{transition:none}
.zt-guide.zt-hidden{opacity:0}
.zt-g-photo{position:absolute;inset:0;border-radius:inherit;overflow:hidden;background:#2b2b2b}
.zt-g-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:opacity .5s var(--zt-ease)}
.zt-g-photo .zt-wide{opacity:0;object-position:68% 20%}
.zt-guide[data-shape="tile"] .zt-wide{opacity:1}
.zt-guide[data-shape="tile"] .zt-face{opacity:0}
.zt-g-ring{position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 0 rgba(73,186,97,0);transition:box-shadow .16s linear}
.zt-guide.zt-speaking .zt-g-ring{box-shadow:0 0 0 calc(2px + var(--amp,0) * 4px) rgba(73,186,97,calc(.62 + var(--amp,0) * .38))}
.zt-g-tag{position:absolute;white-space:nowrap;display:flex;flex-direction:column;gap:3px;color:var(--zt-ink);
  letter-spacing:-.01em;transition:opacity .35s var(--zt-ease)}
.zt-g-tag b{font:600 14px/1.1 var(--f-sans)}
.zt-g-tag span{font:400 12.5px/1.1 var(--f-sans);color:var(--zt-ink-2);display:inline-block;transition:opacity .25s,filter .25s,transform .35s var(--zt-ease)}
.zt-g-tag span.zt-swap{opacity:0;filter:blur(5px);transform:translateY(4px)}
.zt-guide[data-tag="right"] .zt-g-tag{left:calc(100% + 12px);top:50%;transform:translateY(-50%)}
.zt-guide[data-tag="below"] .zt-g-tag{top:calc(100% + 14px);left:50%;transform:translateX(-50%);align-items:center;text-align:center}
.zt-guide[data-tag="below"] .zt-g-tag b{font-size:17px}
.zt-guide[data-tag="below"] .zt-g-tag span{font-size:14px}
.zt-guide[data-tag="inside"] .zt-g-tag{left:16px;bottom:14px;flex-direction:row;align-items:baseline;gap:8px;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.55)}
.zt-guide[data-tag="inside"] .zt-g-tag span{color:rgba(255,255,255,.78)}
.zt-guide[data-tag="none"] .zt-g-tag{opacity:0}
.zt-guide.zt-flying .zt-g-tag{opacity:0;transition-duration:.12s}

/* ---------- Navid's pointer ---------- */
.zt-cursor{position:absolute;z-index:72;left:0;top:0;--x:60px;--y:790px;transform:translate(var(--x),var(--y));opacity:0;pointer-events:none;
  transition:transform .72s var(--zt-ease),opacity .28s var(--zt-ease)}
.zt-cursor.zt-on{opacity:1}
.zt-cursor svg{display:block;width:24px;height:24px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
.zt-cursor em{position:absolute;left:17px;top:20px;font:600 11.5px/1 var(--f-sans);font-style:normal;letter-spacing:-.005em;
  background:var(--zt-green);color:var(--zt-green-ink);padding:5px 8px 5px;border-radius:3px 10px 10px 10px;white-space:nowrap}
.zt-cursor.zt-tap svg{animation:zt-tap .36s var(--zt-ease)}
@keyframes zt-tap{40%{transform:scale(.8)}100%{transform:none}}
.zt-ink{position:absolute;inset:0;z-index:66;pointer-events:none;overflow:visible}
.zt-ink rect{fill:none;stroke:var(--zt-green);stroke-width:2.25;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;
  transition:stroke-dashoffset .62s var(--zt-ease),opacity .35s}
.zt-ink rect.zt-drawn{stroke-dashoffset:0}
.zt-ink rect.zt-pulse{animation:zt-pulse 1.5s ease-in-out .7s infinite}
.zt-ink rect.zt-gone{opacity:0}
@keyframes zt-pulse{50%{opacity:.38}}
.zt-ripple{position:absolute;z-index:71;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:2px solid var(--zt-green);pointer-events:none;animation:zt-ripple .55s var(--zt-ease) forwards}
@keyframes zt-ripple{to{transform:scale(4.4);opacity:0}}

/* ---------- the tour's own controls: one quiet row along the bottom ---------- */
.zt-dock{position:absolute;left:0;right:0;bottom:0;height:76px;z-index:80;pointer-events:none}
.zt-home{position:absolute;left:28px;bottom:14px;width:48px;height:48px;border-radius:50%}
.zt-center{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:820px;height:56px;display:grid;place-items:end center}
.zt-center>*{grid-area:1/1}
.zt-cc{max-width:760px;font:400 15.5px/1.38 var(--f-sans);letter-spacing:-.01em;color:#fff;text-align:center;text-wrap:balance;
  background:rgba(16,16,16,.8);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:9px 16px 10px;border-radius:14px;
  opacity:0;transform:translateY(6px);transition:opacity .22s var(--zt-ease),transform .36s var(--zt-ease)}
.zt-cc.zt-on{opacity:1;transform:none}
#zt-root.zt-nocc .zt-cc{display:none}
.zt-tip{position:absolute;z-index:71;left:0;top:0;display:flex;align-items:center;gap:9px;height:40px;padding:0 15px 0 5px;border-radius:999px;background:#fff;color:#161616;white-space:nowrap;
  font:500 14.5px/1 var(--f-sans);letter-spacing:-.01em;box-shadow:0 12px 34px rgba(0,0,0,.38),0 0 0 1px rgba(0,0,0,.06);opacity:0;transform:translateY(6px) scale(.96);pointer-events:none;
  transition:opacity .28s var(--zt-ease),transform .5s var(--zt-ease)}
.zt-tip.zt-on{opacity:1;transform:none}
.zt-tip>b{height:30px;padding:0 12px;border-radius:999px;background:#161616;color:#fff;font:600 12.5px/30px var(--f-sans);letter-spacing:-.005em}
.zt-tip span b{font-weight:600}
.zt-tip kbd{font:500 12px/1 var(--f-sans);border:1px solid rgba(0,0,0,.18);border-bottom-width:2px;border-radius:6px;padding:3px 6px 4px;margin:0 2px}
.zt-tip i{position:absolute;left:var(--ax,50%);width:12px;height:12px;margin-left:-6px;background:#fff;transform:rotate(45deg);border-radius:2px}
.zt-tip[data-side=top] i{bottom:-5px}
.zt-tip[data-side=bottom] i{top:-5px}
.zt-turn{pointer-events:auto;display:flex;align-items:center;gap:11px;background:#fff;color:#161616;border-radius:999px;padding:7px 18px 7px 7px;
  font:500 14.5px/1.2 var(--f-sans);letter-spacing:-.01em;box-shadow:0 14px 44px rgba(0,0,0,.3),0 0 0 1px rgba(0,0,0,.06);
  opacity:0;transform:translateY(12px) scale(.96);transition:opacity .28s var(--zt-ease),transform .5s var(--zt-ease);white-space:nowrap}
.zt-turn.zt-on{opacity:1;transform:none}
.zt-turn .zt-badge{display:inline-flex;align-items:center;gap:6px;background:#161616;color:#fff;font:600 12.5px/1 var(--f-sans);padding:9px 12px;border-radius:999px;transition:background .3s}
.zt-turn .zt-badge svg{width:13px;height:13px;display:none}
.zt-turn.zt-ok .zt-badge{background:var(--zt-green);color:var(--zt-green-ink)}
.zt-turn.zt-ok .zt-badge svg{display:block}
.zt-turn kbd{font:500 12px/1 var(--f-sans);color:#333;border:1px solid rgba(0,0,0,.16);border-bottom-width:2px;border-radius:7px;padding:5px 8px;background:#f5f5f4;margin:0 1px}
.zt-turn .zt-showme{appearance:none;border:0;background:none;color:#6b6b6b;font:500 13px/1 var(--f-sans);padding:6px 0 6px 12px;margin-left:2px;cursor:pointer;
  border-left:1px solid rgba(0,0,0,.1);display:none}
.zt-turn .zt-showme:hover{color:#161616}
.zt-turn.zt-nudge .zt-showme{display:block}
.zt-right{position:absolute;right:28px;bottom:22px;display:flex;align-items:center;gap:12px;color:var(--zt-ink-2);font:500 12.5px/1 var(--f-sans);letter-spacing:-.005em;pointer-events:auto;transition:opacity .4s}
.zt-step{color:var(--zt-ink)}
.zt-dots{display:flex;align-items:center;gap:5px}
.zt-dots i{width:6px;height:6px;border-radius:99px;background:var(--zt-ink-3);transition:width .5s var(--zt-ease),background .4s}
.zt-dots i.zt-done{background:var(--zt-ink-2)}
.zt-dots i.zt-now{width:20px;background:var(--zt-ink)}
.zt-spd{appearance:none;border:0;height:32px;min-width:46px;padding:0 10px;border-radius:10px;background:var(--zt-chip);color:var(--zt-ink);cursor:pointer;
  font:600 12.5px/1 var(--f-sans);letter-spacing:0;font-variant-numeric:tabular-nums;transition:background .2s,color .2s}
.zt-spd:hover{background:var(--zt-chip-h)}
.zt-spd.zt-on{background:var(--zt-ink);color:var(--zt-ink-inv)}
.zt-ib{appearance:none;border:0;width:32px;height:32px;border-radius:10px;background:var(--zt-chip);color:var(--zt-ink);display:grid;place-items:center;cursor:pointer;transition:background .2s}
.zt-ib:hover{background:var(--zt-chip-h)}
.zt-ib svg{width:16px;height:16px}
.zt-ib.zt-off{color:var(--zt-ink-3)}
.zt-skip{appearance:none;border:0;background:var(--zt-chip);color:var(--zt-ink);font:500 12.5px/1 var(--f-sans);height:32px;padding:0 12px;border-radius:10px;cursor:pointer;transition:background .2s}
.zt-skip:hover{background:var(--zt-chip-h)}
#zt-root.zt-bare .zt-right,#zt-root.zt-bare .zt-center{opacity:0;pointer-events:none}

/* build stamp, so every screenshot names its build */
.zt-build{position:absolute;right:28px;bottom:6px;z-index:81;font:400 10px/1 var(--f-sans);color:var(--zt-ink-3);pointer-events:none}

@media (prefers-reduced-motion:reduce){
  .zt-ch,.zt-guide,.zt-cursor,.zt-turn,.zt-cc{transition-duration:.01s!important}
  .zt-ink rect.zt-pulse{animation:none}
}

/* ---------- the recording script page (?script=1) ---------- */
.zt-sp{min-height:100vh;background:rgb(246,245,243);color:rgb(31,29,30);font-family:var(--f-sans);letter-spacing:-.01em;padding:44px 24px 96px}
.zt-sp-in{max-width:820px;margin:0 auto}
.zt-sp-top{display:flex;align-items:center;gap:9px;font:500 16px/1 var(--f-sans)}
.zt-sp-top img{width:24px;height:24px;display:block}
.zt-sp-top a{margin-left:auto;font:500 14px/1 var(--f-sans);color:rgb(31,29,30);text-decoration:none;background:rgba(31,29,30,.07);padding:10px 14px;border-radius:999px}
.zt-sp-top a:hover{background:rgba(31,29,30,.12)}
.zt-sp h1{font:400 52px/1.05 var(--f-serif);letter-spacing:-.02em;margin:56px 0 0}
.zt-sp-lede{font:400 18px/1.5 var(--f-sans);color:rgba(31,29,30,.7);margin:16px 0 0;max-width:640px;text-wrap:pretty}
.zt-sp-how{margin:22px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font:400 15px/1.45 var(--f-sans);color:rgba(31,29,30,.7)}
.zt-sp-how li{padding-left:18px;position:relative}
.zt-sp-how li::before{content:"";position:absolute;left:2px;top:9px;width:5px;height:5px;border-radius:50%;background:rgba(31,29,30,.35)}
.zt-sp section{margin-top:52px}
.zt-sp h2{font:400 26px/1.15 var(--f-serif);letter-spacing:-.015em;margin:0 0 14px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.zt-sp h2 em{font:400 14px/1 var(--f-sans);font-style:normal;color:rgba(31,29,30,.5);letter-spacing:-.01em}
.zt-sp-row{display:flex;align-items:flex-start;gap:16px;background:#fff;border-radius:20px;padding:18px 16px 18px 18px;margin-top:8px;box-shadow:0 0 0 1px rgba(31,29,30,.05)}
.zt-sp-id{flex:0 0 auto;min-width:40px;text-align:center;font:500 12.5px/1 var(--f-sans);color:rgba(31,29,30,.6);background:rgba(31,29,30,.06);padding:7px 8px;border-radius:9px;margin-top:2px}
.zt-sp-line{flex:1 1 auto;min-width:0}
.zt-sp-line p{margin:0;font:400 18px/1.45 var(--f-sans);color:rgb(31,29,30);text-wrap:pretty}
.zt-sp-line span{display:block;margin-top:7px;font:400 13.5px/1.4 var(--f-sans);color:rgba(31,29,30,.5)}
.zt-sp-play{appearance:none;border:0;cursor:pointer;flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px 0 10px;border-radius:999px;background:rgba(31,29,30,.06);color:rgb(31,29,30);font:500 12.5px/1 var(--f-sans);font-variant-numeric:tabular-nums}
.zt-sp-play:hover{background:rgba(31,29,30,.1)}
.zt-sp-play svg{width:12px;height:12px}
.zt-sp-play i{font-style:normal;color:rgba(31,29,30,.6)}
.zt-sp-play.zt-sp-on{background:#49BA61;color:#06210f}
.zt-sp-play.zt-sp-on i{color:#06210f}
.zt-sp-foot{margin-top:44px;font:400 13.5px/1.5 var(--f-sans);color:rgba(31,29,30,.5);max-width:560px}
@media (max-width:560px){.zt-sp h1{font-size:38px}.zt-sp-row{flex-wrap:wrap}.zt-sp-line{flex-basis:100%;order:3}.zt-sp-play{margin-left:auto}}

/* ---------- player mode: the control bar ----------
   Row one: Navid's seat, what he is saying or what to try, and the skill points.
   Row two: play, the steps by name, speed, captions, sound, exit. */
.zt-play,.zt-scrub,.zt-replay,#zt-veil{display:none}
.zt-skip{display:inline-flex;align-items:center;gap:8px}
.zt-skip kbd{font:500 10.5px/1 var(--f-sans);border:1px solid var(--zt-ink-3);border-radius:5px;padding:3px 5px;color:var(--zt-ink-2)}
