<!doctype html>
<meta charset="utf-8">
<title>Zero — homepage journey card</title>
<!--
  ZERO nav lab — the homepage journey card, as HTML.

  A faithful standalone copy of the React card at
  src/renderer/devtools/navLab/roadmap/JourneyCardSlot.tsx (+ hud/cardKit.tsx
  for the surface tokens and StartButtonV1.tsx for the CTA). Every number here
  is the shipped number, not a re-taste: card width 430, radius 42, padding 20,
  fill rgba(0,0,0,.5) with blur(16px) saturate(1.1), title 27px, meta rows 30px
  tall with 16px mono labels and 18px values.

  Toggle the states on the page: ACTIVE (Continue + the journey bar),
  LOCKED (the flat "Finish N more" plate + the Back-to-active pill under the
  card) and COMPLETED (band / time / XP earned).
-->
<style>
  /* ── fonts: pulled from the live lab, so this file needs no font files ── */
  @font-face{font-family:'Google_Sans_Flex';font-style:normal;font-weight:100 900;font-display:swap;
    src:url(https://sanjay-b-chauhan.github.io/zero-nav-lab/fonts/Google_Sans_Flex/GoogleSansFlex-VariableFont.ttf) format('truetype-variations')}
  @font-face{font-family:'PPSupplyMono';font-style:normal;font-weight:400;font-display:swap;
    src:url(https://sanjay-b-chauhan.github.io/zero-nav-lab/fonts/Supply-Free/PPSupplyMono-Regular.otf) format('opentype')}
  @font-face{font-family:'STK_Bureau_Serif';font-style:normal;font-weight:400;font-display:swap;
    src:url(https://sanjay-b-chauhan.github.io/zero-nav-lab/fonts/STK_Bureau_Serif/STKBureau-SerifBook.otf) format('opentype')}

  :root{
    --card-w:430px;            /* cardKit CARD_W */
    --card-radius:42px;        /* CARD_SHELL */
    --card-pad:20px;
    --green:rgb(73,186,97);
    --gold-bg:rgba(255,224,107,.12);
    --gold-ring:0 0 0 1px rgba(255,225,127,.4);
  }

  /* the page is only a stage for the card — the real host is the city map */
  body{margin:0;min-height:100vh;display:grid;place-items:center;gap:26px;padding:40px 20px;
    background:#141210 center/cover no-repeat;
    font-family:'Google_Sans_Flex',system-ui,sans-serif}
  .stage{display:flex;flex-direction:column;align-items:center;gap:14px}

  /* ── THE CARD ──────────────────────────────────────────────────────────
     No border. A card is rgba(0,0,0,.5) + blur(16px) saturate(1.1); the 2px
     border and blur(10px) belong to a PILL. Mixing them was the first bug
     this kit was written to stop. */
  .zcard{
    position:relative;display:flex;width:var(--card-w);flex-direction:column;align-items:center;
    gap:20px;overflow:hidden;border-radius:var(--card-radius);padding:var(--card-pad);
    background:rgba(0,0,0,.5);
    -webkit-backdrop-filter:blur(16px) saturate(1.1);backdrop-filter:blur(16px) saturate(1.1);
    box-shadow:0 44px 90px -24px rgba(0,0,0,.5);
    color:#fff;
  }
  /* ⚠️ never wrap this in a will-change/transform layer: any backdrop root
     above it blanks backdrop-filter and the glass goes flat. */

  /* ── header: pager arrows at the ENDS, company pill centred ── */
  .zc-head{display:flex;width:100%;align-items:center;justify-content:space-between}
  .zc-arrow{position:relative;z-index:5;display:grid;place-items:center;width:34px;height:34px;flex-shrink:0;
    border:0;background:none;border-radius:9999px;color:rgba(255,255,255,.6);cursor:pointer;
    transition:background-color .15s,color .15s}
  .zc-arrow:hover{background:rgba(255,255,255,.12);color:#fff}
  .zc-arrow:disabled{pointer-events:none;opacity:.25}
  .zc-copill{display:flex;height:36px;align-items:center;gap:8px;border-radius:9999px;padding:0 15px;
    background:rgba(255,255,255,.94);border:0;cursor:pointer;transition:opacity .15s}
  .zc-copill:hover{opacity:.85}
  .zc-copill img{width:19px;height:19px;object-fit:contain}
  .zc-copill span{font-size:14px;font-weight:500;color:#1c1a18}
  /* locked: the company is dimmed, not hidden — the reveal is the reward */
  .locked .zc-copill{background:rgba(255,255,255,.55);filter:grayscale(1);opacity:.65}

  /* ── title zone: the art, then the brief's NAME under it ── */
  .zc-title-zone{display:flex;min-height:96px;width:100%;flex-direction:column;align-items:center;
    justify-content:center;gap:10px}
  .zc-art{width:auto;max-width:100%;max-height:108px;object-fit:contain;
    filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}
  .locked .zc-art{filter:grayscale(1) opacity(.55)}
  /* 27px (was 19px) — the title is the thing, not a caption to the lettering.
     Meta values are 18px, so it needs a clear step above them. */
  .zc-title{margin:0;text-align:center;font-size:27px;font-weight:500;line-height:1.22;
    letter-spacing:-.015em;color:rgba(255,255,255,.92);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  /* a scenario with NO art (the two training stops) sets its name in the serif
     at display size, so both card kinds keep one silhouette */
  .zc-title-serif{margin:0;text-align:center;font-family:'STK_Bureau_Serif',serif;font-size:54px;
    line-height:.95;letter-spacing:-.03em;color:rgba(255,255,255,.95)}

  /* ── meta block ── */
  .zc-meta-wrap{display:flex;width:100%;flex-direction:column;align-items:center;gap:22px}
  .zc-divider{height:1px;width:100%;background:rgba(255,255,255,.12)}
  .zc-meta{display:flex;width:100%;flex-direction:column;gap:16px}
  .zc-row{display:flex;height:30px;width:100%;align-items:center;justify-content:space-between;padding:0 20px}
  .zc-label{font-family:'PPSupplyMono',monospace;font-size:16px;text-transform:uppercase;
    color:rgba(255,255,255,.5);white-space:nowrap}
  .zc-value{font-size:18px;font-weight:500;color:#fff}
  .zc-value.band{color:var(--green)}
  .zc-xp{display:inline-flex;align-items:center;gap:6px;border-radius:40px;padding:6px 10px;
    background:var(--gold-bg);box-shadow:var(--gold-ring)}
  .zc-xp span{font-family:'PPSupplyMono',monospace;font-size:18px;letter-spacing:-1.62px;color:#fff9d5}

  /* the journey bar belongs to the ACTIVE stop only — on a locked card it
     reads as that scenario's own progress, which it is not */
  .zc-bar{height:5px;width:100%;overflow:hidden;border-radius:9999px;background:rgba(255,255,255,.1)}
  .zc-bar > i{display:block;height:100%;border-radius:9999px;background:var(--green)}

  /* ── the way in ── */
  .zc-cta{width:100%}
  /* locked: a FLAT plate, never a disabled start button — the 3D press and the
     shine both say "press me". And it names the next action, not the barrier. */
  .zc-locked-plate{display:flex;height:58px;width:100%;align-items:center;justify-content:center;gap:8px;
    border-radius:100px;padding:0 20px;background:rgba(255,255,255,.08)}
  .zc-locked-plate span{text-align:center;font-size:15px;color:rgba(255,255,255,.55)}

  /* StartButtonV1, ported verbatim: white pill, tactile 3D press, three light
     lines sweeping across, holographic text as the shine passes over it */
  .sbtn{position:relative;display:flex;height:62px;width:100%;align-items:center;justify-content:center;
    gap:10px;overflow:hidden;border:0;outline:none;border-radius:100px;padding:15px 40px;cursor:pointer;
    user-select:none;
    background-image:linear-gradient(90deg,rgba(255,255,255,.4),rgba(255,255,255,.4)),
                     linear-gradient(180deg,rgba(229,229,229,.8),rgb(226,226,226));
    box-shadow:0 6px 0 #c8c8c8,0 12px 18px -6px rgba(0,0,0,.4),0 0 0 1.33px #e6e6e6,
               inset 0 1.33px 0 rgba(255,255,255,.75);
    transition:transform .1s cubic-bezier(.34,1.56,.64,1),box-shadow .1s}
  .sbtn:hover{transform:translateY(-1px)}
  .sbtn:active{transform:translateY(5px);
    box-shadow:0 1px 0 #c8c8c8,0 3px 8px -4px rgba(0,0,0,.4),0 0 0 1.33px #e6e6e6,
               inset 0 1.33px 0 rgba(255,255,255,.75)}
  .sbtn > svg,.sbtn > .sbtn-label{position:relative;z-index:2}
  .sbtn-label{font-weight:600;font-size:23px;letter-spacing:-.48px;
    background:linear-gradient(100deg,#121212 0%,#121212 34%,#ff5ec0 42%,#8b7bff 50%,#37dcc4 58%,#121212 66%,#121212 100%);
    background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:sbtn-holotext 3s ease-in-out infinite}
  @keyframes sbtn-holotext{0%{background-position:130% 0}55%,100%{background-position:-30% 0}}
  .sbtn::after{content:'';position:absolute;inset:-25% 0;width:120%;z-index:1;pointer-events:none;
    background:linear-gradient(100deg,transparent 33%,rgba(255,255,255,.9) 38%,transparent 41%,
      transparent 46%,rgba(255,255,255,.9) 51%,transparent 54%,
      transparent 59%,rgba(255,255,255,.9) 64%,transparent 67%);
    transform:translateX(-100%) skewX(-14deg);animation:sbtn-shine 3s ease-in-out infinite}
  @keyframes sbtn-shine{0%{transform:translateX(-100%) skewX(-14deg)}55%,100%{transform:translateX(100%) skewX(-14deg)}}
  .sbtn:hover::after{animation-duration:1s}

  /* ── the way back: a pill UNDER the card, outside it ───────────────────
     It replaced the ✕ (2026-08-21). The slot is always full, so there was
     never anything to dismiss — leaving a stop just returns you to the active
     one, and the control should say where it takes you. Only rendered when
     you are away from the active stop. */
  .zc-back{display:flex;height:42px;align-items:center;gap:8px;border-radius:9999px;padding:0 18px;
    border:0;cursor:pointer;font-family:inherit;font-size:14.5px;font-weight:500;
    color:rgba(255,255,255,.75);background:rgba(0,0,0,.5);
    -webkit-backdrop-filter:blur(16px) saturate(1.1);backdrop-filter:blur(16px) saturate(1.1);
    transition:color .15s}
  .zc-back:hover{color:#fff}

  @media (prefers-reduced-motion:reduce){
    .sbtn-label{animation:none;background:none;color:#121212}
    .sbtn::after{animation:none;opacity:0}
  }

  /* page-only chrome, not part of the card */
  .switch{display:flex;gap:8px}
  .switch button{font-family:'PPSupplyMono',monospace;font-size:12px;letter-spacing:.08em;
    text-transform:uppercase;color:rgba(255,255,255,.55);background:rgba(255,255,255,.06);
    border:0;border-radius:9999px;padding:9px 16px;cursor:pointer}
  .switch button[aria-pressed="true"]{background:rgba(255,255,255,.16);color:#fff}
  [hidden]{display:none !important}
</style>

<div class="switch" role="group" aria-label="Card state">
  <button type="button" data-state="current" aria-pressed="true">Active</button>
  <button type="button" data-state="locked" aria-pressed="false">Locked</button>
  <button type="button" data-state="completed" aria-pressed="false">Completed</button>
</div>

<script>
  /* State switching, page-only. In the app this is `scenarioStatus(seq,
     completedCount)` and the Back pill's condition is
     `scenario.sequence_order === completedCount + 1` — derived from the
     roadmap, never from "is a selection set", because the pager can land you
     back on the active stop with a selection still live. */
  const card = document.getElementById('card');
  const back = document.getElementById('back');
  const faceAhead = document.querySelector('[data-face="ahead"]');
  const faceDone  = document.querySelector('[data-face="done"]');
  const bar       = document.querySelector('[data-only="current"]');
  const ctaOpen   = document.querySelector('[data-cta="open"]');
  const ctaLocked = document.querySelector('[data-cta="locked"]');
  const label     = ctaOpen.querySelector('.sbtn-label');
  const title     = document.querySelector('.zc-title');

  const STATES = {
    current:   {title:'Decompose a revenue slowdown', cta:'Continue',    pos:'4 of 9'},
    locked:    {title:'Condition a market entry on a gap', cta:'Continue', pos:'8 of 9'},
    completed: {title:'Isolate an early-churn driver', cta:'View report', pos:'3 of 9'},
  };

  function show(state){
    const s = STATES[state];
    card.classList.toggle('locked', state === 'locked');
    faceAhead.hidden = state === 'completed';
    faceDone.hidden  = state !== 'completed';
    bar.hidden       = state !== 'current';
    ctaOpen.hidden   = state === 'locked';
    ctaLocked.hidden = state !== 'locked';
    label.textContent = s.cta;
    title.textContent = s.title;
    faceAhead.querySelectorAll('.zc-value')[2].textContent = s.pos;
    back.hidden = state === 'current';   /* only when you have moved off active */
  }

  document.querySelectorAll('.switch button').forEach((b) => {
    b.onclick = () => {
      document.querySelectorAll('.switch button')
        .forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      show(b.dataset.state);
    };
  });
  back.onclick = () => document.querySelector('.switch button[data-state="current"]').click();
</script>
