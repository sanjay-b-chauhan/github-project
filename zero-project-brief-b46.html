:root{--sans:'Google Sans Flex','Google Sans',-apple-system,system-ui,sans-serif;--ease:cubic-bezier(.32,.72,0,1);--green:#4ade80}
body{--hd:#0B0B0C;--pill:rgba(255,255,255,.1);--sf:#19191B;--rail:#161617;--ink:#F3F3F1;--ink2:rgba(243,243,241,.7);--ink3:rgba(243,243,241,.5);--tile:rgba(255,255,255,.045);
  --line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.15);--dim:.2}
body.t-white{--hd:#E7EDF5;--pill:#FFFFFF;--sf:#F5F8FC;--rail:#E9EEF5;--ink:#101828;--ink2:#475467;--ink3:#7A8699;--tile:#FFFFFF;--line:rgba(16,24,40,.08);--line2:rgba(16,24,40,.14);--dim:.16}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#101112;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;margin:0;padding:0;cursor:pointer;-webkit-appearance:none;appearance:none}

/* ---------------- the world (cover) and the app's canvas (contain) ---------------- */
#world{position:fixed;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#app{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;font-family:var(--sans);color:#fff;pointer-events:none}
#app>*{pointer-events:auto}
.map{position:absolute;inset:0;overflow:hidden;background:#131514}
.cam{position:absolute;inset:0;transform-origin:56.2% 64.4%;transition:transform 1s var(--ease)}
.city{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;user-select:none}
body.picked .cam{transform:translate(-80px,-150px) scale(1.65)}
.mk{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;display:grid;place-items:center;
  background:rgba(18,20,26,.84);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.34),0 3px 10px rgba(0,0,0,.35);color:rgba(255,255,255,.78)}
.mk svg{width:15px;height:15px}
.mk.go{background:radial-gradient(circle,#1c1a18 0 4px,#fff 4.8px);box-shadow:0 0 0 3px rgba(255,255,255,.3),0 3px 10px rgba(0,0,0,.35)}
.mk.go::after{content:'';position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.85);animation:ring 2.2s cubic-bezier(0,0,.2,1) infinite}
@keyframes ring{0%{transform:scale(.9);opacity:0}18%{opacity:.85}100%{transform:scale(3.1);opacity:0}}
.chip{position:absolute;display:flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 11px;border-radius:999px;white-space:nowrap;font:600 15px/1 var(--sans);
  background:rgba(18,20,26,.78);color:rgba(255,255,255,.92);box-shadow:0 6px 20px rgba(0,0,0,.3),inset 0 0 0 1px rgba(255,255,255,.12)}
.chip img{width:17px;height:17px;display:block;filter:brightness(0) invert(1);opacity:.85}
.chip em{font:500 14px/1 var(--sans);font-style:normal;color:rgba(255,255,255,.6);margin-left:2px}
.chip.go{background:rgba(255,255,255,.96);color:#1c1a18;box-shadow:0 8px 22px rgba(0,0,0,.28);cursor:pointer}
.chip.go img{filter:none;opacity:1}
.chip.go em{display:inline-flex;align-items:center;gap:6px;color:#1f7a36;font-weight:600}
.chip.go em::before{content:'';width:7px;height:7px;border-radius:50%;background:#49BA61}
.chip.t{transform:translate(-50%,-100%)}.chip.b{transform:translate(-50%,0)}
.mk.lk{cursor:pointer;transition:transform .2s var(--ease),background-color .2s}
.mk.lk:hover,.mk.lk.open{z-index:6;background:rgba(18,20,26,.96);transform:scale(1.12)}
.tip{position:absolute;left:50%;bottom:calc(100% + 10px);display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:10px 14px 10px 12px;border-radius:14px;
  white-space:nowrap;text-align:left;background:rgba(18,20,26,.92);box-shadow:0 10px 24px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.12);
  transform-origin:50% 100%;transform:translate(-50%,0) scale(.6);visibility:hidden;transition:transform .18s var(--ease),visibility 0s linear .18s;pointer-events:none}
.mk.lk:hover .tip,.mk.lk.open .tip{transform:translate(-50%,0) scale(.893);visibility:visible;transition:transform .22s var(--ease),visibility 0s}
.tip b{display:flex;align-items:center;gap:8px;font:600 15px/1 var(--sans);color:#fff}
.tip b img{width:16px;height:16px;filter:brightness(0) invert(1)}
.tip em{display:none;align-items:center;gap:6px;font:500 13px/1 var(--sans);font-style:normal;color:rgba(255,255,255,.62)}
.tip em svg{width:12px;height:12px}
.mk.lk.open .tip em{display:flex}
.hit{position:absolute;left:52.3%;top:55.5%;width:7.6%;height:13.8%;border-radius:30px;cursor:pointer;transition:background .2s,box-shadow .2s}
.hit:hover{background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7)}
body.picked .hit,body.picked .chip.go{pointer-events:none}
.hint{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);display:flex;align-items:center;height:48px;padding:0 20px;border-radius:999px;
  background:rgba(18,20,26,.78);font:500 17px/1 var(--sans);color:rgba(255,255,255,.85);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);transition:transform .4s var(--ease),opacity .3s}
body.picked .hint{transform:translate(-50%,40px);opacity:0}

/* ---------------- the scenario card on the right (the app's ScenarioIntroV1, set in the one sans) ---------------- */
.card{position:absolute;right:40px;top:50%;width:424px;padding:18px;transform:translate(560px,-50%);visibility:hidden;
  transition:transform .6s var(--ease),visibility 0s linear .6s}
body.picked .card{transform:translate(0,-50%);visibility:visible;transition:transform .6s var(--ease) .1s,visibility 0s}
.c-body{position:relative;overflow:hidden;border-radius:38px;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(16px) saturate(1.1);backdrop-filter:blur(16px) saturate(1.1);box-shadow:0 44px 90px -24px rgba(0,0,0,.5)}
.c-in{display:flex;flex-direction:column;align-items:center;gap:30px;padding:18px}
.c-nav{display:flex;align-items:center;justify-content:space-between;width:100%}
.c-chev{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;color:rgba(255,255,255,.7)}
.c-chev svg{width:22px;height:22px}.c-chev.off{opacity:.2}
.c-count{display:flex;height:42px;align-items:center;gap:8px;border-radius:999px;background:rgba(255,255,255,.1);padding:0 18px;font:500 15px/1 var(--sans);font-variant-numeric:tabular-nums}
.c-count i{font-style:normal;color:rgba(255,255,255,.4)}.c-count em{font-style:normal;color:rgba(255,255,255,.6)}
.c-art{width:302px;height:189px;object-fit:contain;display:block}
.c-desc{margin:0;max-width:324px;padding:0 10px;font:500 22px/1.35 var(--sans);text-align:center}
.c-meta{display:flex;flex-direction:column;align-items:center;gap:26px;width:100%}
.c-rule{width:100%;height:1px;background:rgba(255,255,255,.12)}
.c-rows{display:flex;flex-direction:column;gap:20px;width:100%}
.c-row{display:flex;height:30px;align-items:center;justify-content:space-between;padding:0 20px}
.c-row>span:first-child{font:500 16px/1 var(--sans);color:rgba(255,255,255,.55)}
.c-row>b,.c-diff b{font:500 18px/1 var(--sans)}
.c-xp{display:inline-flex;align-items:center;gap:6px;border-radius:40px;padding:6px 10px;background:rgba(255,224,107,.12);box-shadow:0 0 0 1px rgba(255,225,127,.4)}
.c-xp img{width:18px;height:18px;display:block}.c-xp b{font:600 18px/1.2 var(--sans);font-variant-numeric:tabular-nums;color:#fff9d5}
.c-diff{display:flex;align-items:center;gap:20px}
.c-bars{display:inline-flex;gap:2px}.c-bars i{display:block;width:23px;height:10px;border-radius:30px;background:#fff}.c-bars i.dim{opacity:.1}
/* the app's StartButtonV1 */
.start{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:62px;padding:15px 40px;border-radius:100px;
  background-image:linear-gradient(90deg,rgba(255,255,255,.4),rgba(255,255,255,.4)),linear-gradient(180deg,rgba(229,229,229,.8),rgb(226,226,226));
  box-shadow:0 6px 0 #c8c8c8,0 12px 18px -6px rgba(0,0,0,.4),0 0 0 1.33px #e6e6e6,inset 0 1.33px 0 rgba(255,255,255,.75);transition:transform .1s cubic-bezier(.34,1.56,.64,1),box-shadow .1s}
.start{transition:transform .38s cubic-bezier(.34,1.56,.64,1),box-shadow .38s cubic-bezier(.34,1.56,.64,1)}
.start.down{transform:translateY(5px) scale(.985);transition:transform .06s ease-out,box-shadow .06s ease-out;
  box-shadow:0 1px 0 #c8c8c8,0 2px 6px -4px rgba(0,0,0,.4),0 0 0 1.33px #e6e6e6,inset 0 2px 5px rgba(0,0,0,.14)}
.start svg{width:7.8px;height:9.9px;margin-right:3.5px;position:relative;z-index:2}
.card .start{height:56px}
.card .start b{font-size:21px}
.start b{position:relative;z-index:2;font:600 23px/1.2 var(--sans);letter-spacing:-.48px;
  background:linear-gradient(100deg,#121212 0%,#121212 34%,#ff5ec0 42%,#8b7bff 50%,#37dcc4 58%,#121212 66%,#121212 100%);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:holo 3s ease-in-out infinite}
@keyframes holo{0%{background-position:130% 0}55%,100%{background-position:-30% 0}}

/* ---------------- b39: the brief, a sheet from the bottom (one column) ---------------- */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(6,7,9,.48);opacity:0;visibility:hidden;transition:opacity .4s var(--ease),visibility 0s linear .4s}
body.open .scrim{opacity:1;visibility:visible;transition:opacity .45s var(--ease),visibility 0s}
body{--k-surface:#F7F9FC;--k-raise:#FFFFFF;--k-ink:#131417;--k-ink2:#4E525C;--k-ink3:#6A6F7A;--k-line:#E7E7EB;--k-line2:#D4D5DA}
body.t-dark{--k-surface:#18181B;--k-raise:rgba(255,255,255,.06);--k-ink:rgba(255,255,255,.94);--k-ink2:rgba(255,255,255,.66);--k-ink3:rgba(255,255,255,.48);--k-line:rgba(255,255,255,.1);--k-line2:rgba(255,255,255,.16)}
/* the card steps aside while the sheet is up */
body.open .card{transform:translate(560px,-50%);transition:transform .45s cubic-bezier(.5,0,.75,0)}
.sheet{--sw:760px;--sh:880px;--top:48px;--pad:40px;--radius:28px;--gap:40px;--head:20px;--sub:30px;--bul:5px;--row:32px;--stage:38px;--art:56px;
  --fs:12px;--lh:1.6;--fs-item:12px;--fs-h:14px;--fs-title:18px;--ls:-.006em;
  --font:'Inter',-apple-system,system-ui,sans-serif;--ink:var(--k-ink);--ink2:var(--k-ink2);--ink3:var(--k-ink3);--line:var(--k-line);--line2:var(--k-line2);
  position:fixed;z-index:22;left:50%;top:50%;width:min(var(--sw),calc(100vw - 48px));height:min(var(--sh),calc(100vh - var(--top) * 2));visibility:hidden;
  display:flex;flex-direction:column;border-radius:var(--radius);background:var(--k-surface);
  box-shadow:0 40px 100px -30px rgba(0,0,0,.55),0 0 0 1px rgba(16,24,40,.06);
  font-family:var(--font);font-size:var(--fs);line-height:var(--lh);letter-spacing:var(--ls);color:var(--ink2);font-feature-settings:'cv11','ss01';-webkit-font-smoothing:antialiased}
body.t-dark .sheet{box-shadow:0 40px 100px -24px rgba(0,0,0,.75),inset 0 0 0 1px rgba(255,255,255,.08)}
.sheet button{font:inherit;letter-spacing:inherit;color:inherit}
/* the head: the art in its container, the title, Start; one line */
.hd{flex:none;display:flex;align-items:center;gap:16px;padding:var(--pad) var(--pad) 18px}
.hd-art{flex:none;display:grid;place-items:center;width:var(--art);height:var(--art);border-radius:16px;background:var(--k-raise);box-shadow:inset 0 0 0 1px var(--line)}
.hd-art img{width:84%;height:84%;object-fit:contain;display:block}
.hd-t{flex:1 1 auto;min-width:0;margin:0;font-weight:500;font-size:var(--fs-title);line-height:1.3;letter-spacing:-.018em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Start: the app's raised key (StartButtonV1), sized for the head: a lip it sinks into, the play in a disc, the holo word */
.sheet .sb-go{position:relative;overflow:hidden;flex:none;display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;min-width:150px;padding:0 30px 0 22px;
  border-radius:99px;cursor:pointer;font-weight:600;font-size:17px;letter-spacing:-.02em;
  background:linear-gradient(180deg,#3B3D42,#1A1B1E);box-shadow:0 5px 0 #0B0C0E,0 14px 24px -10px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.16),0 0 0 1px #0B0C0E;
  transition:transform .38s cubic-bezier(.34,1.56,.64,1),box-shadow .38s cubic-bezier(.34,1.56,.64,1)}
.sheet .sb-go.down{transform:translateY(4px) scale(.985);transition:transform .06s ease-out,box-shadow .06s ease-out;
  box-shadow:0 1px 0 #0B0C0E,0 2px 6px -4px rgba(0,0,0,.45),inset 0 2px 6px rgba(0,0,0,.45),0 0 0 1px #0B0C0E}
.sb-go .pl{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff}
.sb-go .pl svg{width:8px;height:10px;margin-left:2px}
.sb-go .pl svg path{fill:currentColor}
.sb-go b{font-weight:600;background:linear-gradient(100deg,#fff 0%,#fff 34%,#ff9ad5 42%,#b5a8ff 50%,#86ecd9 58%,#fff 66%,#fff 100%);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:holo 3s ease-in-out infinite}
body.t-dark .sheet .sb-go{background:linear-gradient(180deg,#FFFFFF,#E4E4E4);box-shadow:0 5px 0 #BDBDBD,0 14px 24px -10px rgba(0,0,0,.6),inset 0 1px 0 #fff,0 0 0 1px #CFCFCF}
body.t-dark .sheet .sb-go.down{box-shadow:0 1px 0 #BDBDBD,0 2px 6px -4px rgba(0,0,0,.6),inset 0 2px 6px rgba(0,0,0,.16),0 0 0 1px #CFCFCF}
body.t-dark .sb-go .pl{background:rgba(18,18,18,.08);color:#121212}
body.t-dark .sb-go b{background-image:linear-gradient(100deg,#121212 0%,#121212 34%,#ff5ec0 42%,#8b7bff 50%,#37dcc4 58%,#121212 66%,#121212 100%)}
/* the close, outside the popup */
.sb-close{position:fixed;z-index:23;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;cursor:pointer;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  transform:scale(.6);visibility:hidden;transition:transform .2s var(--ease),background-color .15s,visibility 0s linear .2s}
body.open .sb-close{transform:none;visibility:visible;transition:transform .4s cubic-bezier(.34,1.56,.64,1) .3s,background-color .15s,visibility 0s .3s}
.sb-close:hover{background:rgba(255,255,255,.26)}
.sb-close svg{width:20px;height:20px}
/* the tabs, then the reading */
.tabs{position:relative;flex:none;display:flex;gap:2px;padding:4px var(--pad) 8px calc(var(--pad) - 12px)}
.tab{position:relative;z-index:1;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;height:34px;padding:0 12px;border-radius:99px;
  font-size:var(--fs-item);line-height:1;color:var(--ink3);transition:color .2s}
.tab::after{content:attr(data-l);height:0;overflow:hidden;visibility:hidden;font-weight:500}
.tab:hover{color:var(--ink2)}
.tab.on{color:var(--ink);font-weight:500}
.tab-pill{position:absolute;left:0;top:0;border-radius:99px;box-shadow:inset 0 0 0 1px var(--line2)}
.read{position:relative;flex:1 1 auto;min-height:0;overflow-y:auto;padding:0 var(--pad) var(--pad);scrollbar-width:thin;scrollbar-color:var(--line2) transparent;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 16px,#000 calc(100% - 32px),transparent);mask-image:linear-gradient(to bottom,transparent,#000 16px,#000 calc(100% - 32px),transparent)}
.sec{padding:var(--gap) 0}
.sec:first-child{padding-top:calc(var(--gap) * .6)}
.sec+.sec{border-top:1px solid var(--line)}
.sh{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 var(--head)}
.sh h3{margin:0;font-weight:500;font-size:var(--fs-h);line-height:1.4;letter-spacing:-.012em;color:var(--ink)}
.sh>span{color:var(--ink3);font-variant-numeric:tabular-nums}
.sub{display:block;margin:var(--sub) 0 6px;color:var(--ink3)}
.sh+.sub,.sh+.subrow{margin-top:0}
.p{margin:0;color:var(--ink)}
.p em{font-style:normal;color:inherit}
/* the Overview's facts: one grid, so the labels share a column and the values line up */
.facts{display:grid;grid-template-columns:max-content minmax(0,1fr);column-gap:20px;row-gap:8px;margin:20px 0 0}
.facts dt{display:flex;align-items:center;min-height:30px;color:var(--ink3)}
.facts dd{margin:0;display:flex;align-items:center;gap:10px;min-width:0;min-height:30px;font-size:var(--fs-item);color:var(--ink)}
.facts .lg{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:#fff;box-shadow:0 0 0 1px var(--line)}
.facts .lg img{width:15px;height:15px;display:block}
.facts img.fc{flex:none;width:24px;height:24px;border-radius:50%;object-fit:cover;object-position:top}
.facts .pj{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line2);color:var(--ink2)}
.facts .pj svg{width:13px;height:13px}
/* the facts across: one outlined box, three cells, the picture beside the label and the value */
.facts-s{display:none;align-items:center;flex-wrap:wrap;row-gap:12px;margin:24px 0 0}
.sheet.f-across .facts-s{display:flex}
.sheet.f-across .facts{display:none}
.facts-s .fx{display:flex;align-items:center;gap:12px;min-width:0}
.facts-s .dv{flex:none;width:1px;height:24px;margin:0 32px;background:var(--line2)}
.facts-s .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.facts-s i{font-style:normal;color:var(--ink3)}
.facts-s b{font-weight:500;font-size:var(--fs-item);line-height:1.4;color:var(--ink)}
.facts-s .lg{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#fff;box-shadow:0 0 0 1px var(--line)}
.facts-s .lg img{width:17px;height:17px;display:block}
.facts-s img.fc{flex:none;width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:top}
.facts-s .pj{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line2);color:var(--ink2)}
.facts-s .pj svg{width:14px;height:14px}
/* Zero's block, as AI: why this project is for you. A beam of light runs round its edge; the orb is white with a light
   moving inside it. Open, and it folds like a dropdown */
@property --beam{syntax:'<angle>';initial-value:0deg;inherits:false}
.why{position:relative;margin:0 0 26px;border-radius:18px;--ai-t:#7CE3AA;--beam-c:rgba(124,227,170,.75);
  background:linear-gradient(160deg,rgba(60,200,120,.12),rgba(60,200,120,.03) 55%,rgba(60,200,120,0)),var(--k-raise);box-shadow:inset 0 0 0 1px rgba(95,219,150,.16)}
body:not(.t-dark) .why{--ai-t:#1F8A4C;--beam-c:rgba(46,170,96,.55);background:linear-gradient(160deg,rgba(46,184,105,.09),rgba(46,184,105,.02) 55%,rgba(46,184,105,0)),#fff;box-shadow:inset 0 0 0 1px rgba(46,170,96,.16)}
.why::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:conic-gradient(from var(--beam),transparent 0deg,transparent 250deg,var(--beam-c) 320deg,transparent 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  animation:beam 7s linear infinite}
@keyframes beam{to{--beam:360deg}}
.sheet .why-h{display:flex;align-items:center;gap:12px;width:100%;padding:16px 16px 12px 20px;text-align:left;cursor:pointer;border-radius:18px}
.why-tt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
.why-tt b{font-weight:500;font-size:var(--fs-item);line-height:1.35;color:var(--ink)}
.why-tt em{font-style:normal;font-weight:400;font-size:var(--fs-item);line-height:1.3;color:var(--ai-t)}
.why-tt b span{font-weight:400;color:var(--ink3)}
/* the coach's face, first */
.why-face{flex:none;width:34px;height:34px;border-radius:50%;object-fit:cover;object-position:top;box-shadow:0 0 0 2px var(--k-surface),0 0 0 3px rgba(95,219,150,.45)}
.why-h .chev{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;color:var(--ink3);transition:transform .35s var(--ease),background-color .15s}
.why-h:hover .chev{background:var(--k-raise)}
.why-h .chev svg{width:16px;height:16px}
.why.open .why-h .chev{transform:rotate(180deg)}
.why-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .42s var(--ease)}
.why.open .why-b{grid-template-rows:1fr}
.why-b>div{min-height:0;overflow:hidden}
.why-in{padding:0 22px 20px 20px}
.why-in>p{margin:0 0 14px;max-width:560px;color:var(--ink)}
.why-l{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.why-l li{position:relative;padding:3px 0 3px 18px;line-height:1.7;color:var(--ink)}
.why-l li::before{content:'';position:absolute;left:3px;top:13px;width:4px;height:4px;border-radius:50%;background:var(--ai-t)}
/* a picture inside the words: a tool's round logo, the level's badge */
.il{position:relative;top:-1px;display:inline-grid;place-items:center;width:18px;height:18px;margin:0 5px 0 1px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px var(--line);vertical-align:middle}
.il img{width:11px;height:11px;display:block}
.il.bd{background:none;box-shadow:none}
.il.bd img{width:19px;height:19px}
/* the pictures: round, 24, side by side when there are a few (the tools) */
.why-v{display:flex;align-items:center}
.why-v>*{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--k-surface),0 0 0 2.5px var(--line)}
.why-v>*+*{margin-left:-5px}
.why-v img{width:14px;height:14px;display:block}
.why-v .ic{background:var(--k-surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.why-v .ic svg{width:13px;height:13px}
.why-v .bd{background:none;box-shadow:none}
.why-v .bd img{width:26px;height:26px}
/* the skills and concepts: one outlined pill each */
.pills{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.pills li{display:inline-flex;align-items:center;height:32px;padding:0 14px;border-radius:99px;box-shadow:inset 0 0 0 1px var(--line2);font-size:var(--fs);line-height:1;color:var(--ink);white-space:nowrap}
/* plain bullets, one thing a line */
.bul{margin:0;padding:0;list-style:none}
.bul li{position:relative;display:block;padding:var(--bul) 0 var(--bul) 18px;font-size:var(--fs-item);line-height:1.4;color:var(--ink)}
.bul li::before{content:'';position:absolute;left:3px;top:calc(var(--bul) + 7px);width:4px;height:4px;border-radius:50%;background:var(--ink3)}
/* the tool stack: the tools in a row, logo and name */
.subrow{display:flex;align-items:baseline;justify-content:space-between;margin:var(--sub) 0 10px}
.subrow .sub{margin:0}
.tools{display:flex;flex-wrap:wrap;gap:14px 32px;margin:0;padding:0;list-style:none}
.tools li{display:inline-flex;align-items:center;gap:10px;font-size:var(--fs-item);line-height:1.4;color:var(--ink)}
.tools .lg{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px var(--line)}
.tools .lg img{width:14px;height:14px;display:block}
/* the stages, with their estimated times and the total under them */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl li{position:relative;display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:14px;align-items:center;min-height:var(--stage)}
.node{position:relative;z-index:1;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line2);
  font-size:11px;line-height:1;letter-spacing:0;color:var(--ink3);font-variant-numeric:tabular-nums}
.tl .tx{font-size:var(--fs-item);line-height:1.4;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .tm{color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.tl-tot{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin:14px 0 0 36px}
.tl-tot span{font-size:var(--fs-item);font-weight:500;color:var(--ink)}
.tl-tot b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
/* the deliverables: each by its own kind of file, the name, and what it is */
.dels{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.dels li{display:flex;align-items:center;gap:14px}
.dic{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;color:var(--ink);background:var(--k-raise);box-shadow:inset 0 0 0 1px var(--line)}
.dic svg{width:20px;height:20px}
.dt{display:flex;flex-direction:column;gap:2px;min-width:0}
.dt b{font-weight:500;font-size:var(--fs-item);line-height:1.4;color:var(--ink)}
.dt span{color:var(--ink3)}
/* ---------------- controls (Ctrl+D): a dev panel, never part of the product ---------------- */
.ctl{position:fixed;left:12px;top:12px;z-index:60;width:252px;max-height:calc(100vh - 24px);overflow:auto;padding:12px;border-radius:14px;background:#161618;
  box-shadow:0 0 0 1px rgba(255,255,255,.1),0 20px 40px -16px rgba(0,0,0,.6);font:400 12px/16px -apple-system,system-ui,sans-serif;color:rgba(255,255,255,.72)}
.ctl[hidden]{display:none}
.ctl h4{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px;font:500 12px/16px -apple-system,system-ui,sans-serif;color:#fff}
.ctl h4 button{height:24px;padding:0 8px;border-radius:6px;color:rgba(255,255,255,.6)}
.ctl h4 button:hover{background:rgba(255,255,255,.08);color:#fff}
.ctl .row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 8px;margin:0 0 10px}
.ctl .row output{font-variant-numeric:tabular-nums;color:#fff}
.ctl input[type=range]{grid-column:1/-1;width:100%;height:18px;margin:0;accent-color:#fff}
.ctl select{grid-column:1/-1;height:28px;padding:0 6px;border-radius:7px;border:0;background:#232326;color:#fff;font:inherit}
.ctl .acts{display:flex;gap:6px;margin-top:4px}
.ctl .acts button{flex:1;height:30px;border-radius:8px;background:#232326;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.ctl .acts button:hover{background:#2C2C30}
.ctl .note{margin-top:8px;color:rgba(255,255,255,.45)}

.toast{position:fixed;left:50%;bottom:36px;z-index:30;display:flex;align-items:center;gap:12px;height:48px;padding:0 20px 0 12px;border-radius:999px;background:#fff;color:#131417;
  font:500 15px/1 var(--sans);box-shadow:0 0 0 1px rgba(19,20,23,.1),0 20px 40px -18px rgba(0,0,0,.4);transform:translate(-50%,90px);pointer-events:none;transition:transform .4s var(--ease)}
.toast.on{transform:translate(-50%,0)}
.toast i{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#131417;color:#fff}
.toast svg{width:14px;height:14px}
.proto{position:fixed;left:14px;bottom:12px;z-index:50;display:flex;align-items:center;gap:2px;padding:3px;border-radius:999px;background:rgba(20,21,23,.82);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);font:500 12px/1 system-ui,sans-serif;color:rgba(255,255,255,.62)}
.proto button{height:28px;padding:0 12px;border-radius:999px}.proto button:hover{color:#fff}

    var k = e.target.getAttribute('data-k');
    if (k) { V[k] = +e.target.value; var c = CTL.filter(function (x) { return x[0] === k; })[0]; ctl.querySelector('[data-o="' + k + '"]').textContent = fmt(c, V[k]); }
    if (e.target.hasAttribute('data-font')) V.font = e.target.value;
    applyV(true); mark(cur, true);
  });
  ctl.addEventListener('click', function (e) {
    if (e.target.closest('[data-copy]')) {
      var txt = JSON.stringify(V);
      var done = function () { e.target.textContent = 'Copied'; setTimeout(function () { e.target.textContent = 'Copy values'; }, 1400); };
      if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done, function () { prompt('Copy these values', txt); });
      else prompt('Copy these values', txt);
    } else if (e.target.closest('[data-reset]')) {
      CTL.forEach(function (c) { V[c[0]] = c[5]; }); V.font = 'Inter'; buildCtl(); applyV(true); mark(cur, true);
    }
  });
  function toggleCtl() { ctl.hidden = !ctl.hidden; document.querySelector('.proto [data-ctl]').classList.toggle('on', !ctl.hidden); }
  applyV(false);

  /* ---- dark and light: ?v=light ---- */
  function theme(t) {
    B.classList.toggle('t-dark', t === 'dark');
    Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (b) { b.classList.toggle('on', b.getAttribute('data-t') === t); });
    var q = []; if (t === 'light') q.push('v=light'); if (!sheet.classList.contains('f-across')) q.push('f=down');
    try { history.replaceState(null, '', q.length ? '?' + q.join('&') : location.pathname); } catch (e) {}
  }
  theme(/[?&]v=light/.test(location.search) ? 'light' : 'dark');

  /* ---- sizes: the world covers the window, the canvas fits it ---- */
  function fit() {
    var S = Math.min(innerWidth / 1920, innerHeight / 1080), C = Math.max(innerWidth / 1920, innerHeight / 1080);
    app.style.transform = 'scale(' + S + ')'; app.style.left = Math.round((innerWidth - 1920 * S) / 2) + 'px'; app.style.top = Math.round((innerHeight - 1080 * S) / 2) + 'px';
    world.style.transform = 'scale(' + C + ')'; world.style.left = Math.round((innerWidth - 1920 * C) / 2) + 'px'; world.style.top = Math.round((innerHeight - 1080 * C) / 2) + 'px';
  }
  fit(); mark(0, true); addEventListener('resize', function () { fit(); mark(cur, true); });

  /* ---- open: the popup rises from below and settles in the middle (a touch of scale, no fade), the card steps aside,
     and the close lands beside it. Close: it drops away and the card returns. ---- */
  var busy = false, tl = null, xBtn = document.querySelector('.sb-close');
  xBtn.innerHTML = I.x;
  function placeX() {
    var w = sheet.offsetWidth, h = sheet.offsetHeight, l = (innerWidth - w) / 2, t = (innerHeight - h) / 2, out = l + w + 16 + 44 <= innerWidth - 8;
    xBtn.style.left = (out ? l + w + 16 : l + w - 60) + 'px'; xBtn.style.top = (out ? t : t + 16) + 'px';
  }
  function open() {
    if (busy || B.classList.contains('open') || !window.gsap) return; busy = true;
    setTimeout(function () {
      read.scrollTop = 0; placeX();
      gsap.set(sheet, { visibility: 'visible' }); mark(0, true);
      B.classList.add('open');
      tl = gsap.timeline({ onComplete: function () { busy = false; } });
      tl.fromTo(sheet, { y: innerHeight * .62, scale: .96 }, { y: 0, scale: 1, duration: .7, ease: 'power4.out' }, 0);
      tl.fromTo(rise, { y: 14 }, { y: 0, duration: .5, ease: 'power3.out', stagger: .03, clearProps: 'transform' }, .22);   // the keys' own press needs its transform back
      tl.fromTo(sheet.querySelectorAll('.sec:first-child > *'), { y: 18 }, { y: 0, duration: .55, ease: 'power3.out', stagger: .05 }, .28);
      if (sheet.querySelector('.why.open')) writeIn(tl, .5);
    }, 140);
  }
  function close() {
    if (busy || !B.classList.contains('open')) return; busy = true;
    if (tl) tl.kill();
    B.classList.remove('open');
    gsap.to(sheet, { y: innerHeight * .7, scale: .97, duration: .42, ease: 'power3.in', onComplete: function () { gsap.set(sheet, { visibility: 'hidden' }); busy = false; } });
  }
  function startOver() {
    if (tl) tl.kill(); gsap.set(sheet, { y: 0, scale: 1, visibility: 'hidden' });
    B.classList.remove('open', 'picked'); busy = false; toast.classList.remove('on');
  }
  var rise = [sheet.querySelector('.hd-art'), sheet.querySelector('.hd-t'), sheet.querySelector('.sb-go')].concat([].slice.call(tabEls));
  if (window.gsap) gsap.set(sheet, { xPercent: -50, yPercent: -50 });
  addEventListener('resize', placeX);
  /* the facts down the page or across it: ?f=across */
  function facts(f) {
    sheet.classList.toggle('f-across', f === 'across');
    Array.prototype.forEach.call(document.querySelectorAll('[data-f]'), function (b) { b.classList.toggle('on', b.getAttribute('data-f') === f); });
    var q = []; if (!B.classList.contains('t-dark')) q.push('v=light'); if (f === 'down') q.push('f=down');
    try { history.replaceState(null, '', q.length ? '?' + q.join('&') : location.pathname); } catch (e) {}
  }
  facts(sheet.classList.contains('f-across') ? 'across' : 'down');
  /* tactile keys: Start and Enter go in the moment they are pressed, stay in while held, and spring back on release,
     with a soft click each way (two short sines; the first press starts the audio) */
  var ac = null;
  function click(f, g) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      var o = ac.createOscillator(), v = ac.createGain(), t0 = ac.currentTime;
      o.type = 'sine'; o.frequency.setValueAtTime(f, t0); o.frequency.exponentialRampToValueAtTime(f * .6, t0 + .05);
      v.gain.setValueAtTime(0, t0); v.gain.linearRampToValueAtTime(g, t0 + .004); v.gain.exponentialRampToValueAtTime(.0001, t0 + .07);
      o.connect(v); v.connect(ac.destination); o.start(t0); o.stop(t0 + .08);
    } catch (e) {}
  }
  document.addEventListener('pointerdown', function (e) {
    var k = e.target.closest('.start, .sb-go'); if (!k) return;
    k.classList.add('down'); click(1150, .06);
    function up() { k.classList.remove('down'); click(820, .04); removeEventListener('pointerup', up); removeEventListener('pointercancel', up); }
    addEventListener('pointerup', up); addEventListener('pointercancel', up);
  });
  /* Zero writes: the two lines arrive word by word, each lifting out of its own mask, and the points follow, each
     wiped up into place (a mask, no fade) */
  var words = null;
  function writeIn(t, at) {
    var lead = sheet.querySelector('.why-in > p'), pts = sheet.querySelectorAll('.why-l li');
    if (!words && window.SplitText) words = SplitText.create(lead, { type: 'words', mask: 'words' }).words;
    var w = words || [lead];
    t.fromTo(w, { yPercent: 110 }, { yPercent: 0, duration: .32, ease: 'power2.out', stagger: .018 }, at);
    t.fromTo(pts, { clipPath: 'inset(0 0 100% 0)', y: 10 }, { clipPath: 'inset(0 0 0% 0)', y: 0, duration: .5, ease: 'power3.out', stagger: .09 }, at + Math.min(.6, w.length * .018));
  }
  /* Zero's block folds and opens */
  sheet.addEventListener('click', function (e) {
    var h = e.target.closest('.why-h'); if (!h) return;
    var w = h.parentNode, o = !w.classList.contains('open'); w.classList.toggle('open', o); h.setAttribute('aria-expanded', o);
    if (o && window.gsap) writeIn(gsap.timeline(), .12);
  });

  document.addEventListener('click', function (e) {
    var lk = e.target.closest('.mk.lk');
    Array.prototype.forEach.call(document.querySelectorAll('.mk.lk.open'), function (m) { if (m !== lk) m.classList.remove('open'); });
    if (lk) { lk.classList.toggle('open'); return; }
    if (e.target.closest('.ctl') && !e.target.closest('[data-ctl]')) return;
    var tb = e.target.closest('[data-tab]');
    if (tb) { jumpTo(+tb.getAttribute('data-tab')); return; }
    var fb = e.target.closest('[data-f]');
    if (fb) { facts(fb.getAttribute('data-f')); return; }
    var t = e.target.closest('[data-pick],[data-open],[data-close],[data-go],[data-r],[data-t],[data-ctl]');
    if (!t) return;
    if (t.hasAttribute('data-pick')) B.classList.add('picked');
    else if (t.hasAttribute('data-open')) open();
    else if (t.hasAttribute('data-close')) close();
    else if (t.hasAttribute('data-go')) { toast.classList.remove('on'); void toast.offsetWidth; toast.classList.add('on'); setTimeout(function () { toast.classList.remove('on'); }, 2600); }
    else if (t.hasAttribute('data-t')) theme(t.getAttribute('data-t'));
    else if (t.hasAttribute('data-ctl')) toggleCtl();
    else if (t.hasAttribute('data-r')) startOver();
  });
  addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'd' || e.key === 'D')) { e.preventDefault(); toggleCtl(); return; }
    if (e.target.closest && e.target.closest('.ctl')) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'g') theme(B.classList.contains('t-dark') ? 'light' : 'dark');
  });
})();
