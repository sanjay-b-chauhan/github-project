<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zero project brief</title>
<meta name="description" content="The project brief, opened from the world: three looks to choose from.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,300..800&display=swap">
<style>
/* The project brief, b2. Desktop only (Zero is a desktop app).
   The flow is the app's: the world; click the company; the app's dark scenario card comes in on the right
   (ScenarioPanel V1 / ScenarioIntroV1, value for value); Start opens the brief at the centre, in one of three looks:
     dark    the card itself grows from the right into the centre (the app's FLIP, 0.6s power3 in-out)
     paper   a white sheet rises from the bottom to the centre (the Zero Jobs design system: Inter, hairlines, one black key)
     class   a course page you step into, the Skillshare class page's principle (big cover, lessons with their times, tiles)
   One set of data in the founders' order: company, manager, project type, tool stack; the brief; the stages with a time
   each; what you'll cover (workflow and skills); what you get. Everything is drawn on the app's own 1920 x 1080 canvas,
   scaled to the window as CampaignLanding is. */
@font-face{font-family:'JB Inter';src:url(zero-project-brief-assets-b2/fonts/jb-inter-latin.woff2) format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'PP Supply Mono';src:url(zero-project-brief-assets-b2/fonts/PPSupplyMono-Regular.otf) format('opentype');font-weight:400;font-display:swap}
:root{--sans:'Google Sans Flex','Google Sans',-apple-system,system-ui,sans-serif;--inter:'JB Inter','Inter',-apple-system,system-ui,sans-serif;--mono:'PP Supply Mono',ui-monospace,monospace;
  --out:cubic-bezier(.16,1,.3,1);--inout:cubic-bezier(.65,0,.35,1);--e:cubic-bezier(.2,0,0,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#101112;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;margin:0;padding:0;cursor:pointer;-webkit-appearance:none;appearance:none}
/* the world fills the window (cover); the app's UI sits on its 1920 x 1080 canvas scaled to fit (contain), as in the app */
#world{position:fixed;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#app{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;font-family:var(--sans);color:#fff;pointer-events:none;--bx:0px;--by:0px}
#app>*{pointer-events:auto}
#app>.scrim,#app>.shell{pointer-events:none}

/* ---------------- the world ---------------- */
.map{position:absolute;inset:0;overflow:hidden;background:#131514}
.cam{position:absolute;inset:0;transform-origin:56% 64%;transition:transform 1s var(--out)}
.city{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;user-select:none}
body.picked .cam{transform:translate(-140px,-60px) scale(1.2)}   /* eases toward Airbnb; the city still covers every edge */
.mk{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;display:grid;place-items:center;
  background:rgba(18,20,26,.84);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.34),0 3px 10px rgba(0,0,0,.35);color:rgba(255,255,255,.78)}
.mk svg{width:15px;height:15px}
.mk.go{background:radial-gradient(circle,#1c1a18 0 4px,#fff 4.8px);box-shadow:0 0 0 3px rgba(255,255,255,.3),0 3px 10px rgba(0,0,0,.35)}
.mk.go::after{content:'';position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.85);animation:ring 2.2s cubic-bezier(0,0,.2,1) infinite}
@keyframes ring{0%{transform:scale(.9);opacity:0}18%{opacity:.85}100%{transform:scale(3.1);opacity:0}}
.chip{position:absolute;display:flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 11px;border-radius:999px;white-space:nowrap;font:600 15px/1 var(--sans);
  background:rgba(18,20,26,.78);color:rgba(255,255,255,.92);box-shadow:0 6px 20px rgba(0,0,0,.3),inset 0 0 0 1px rgba(255,255,255,.12)}
.chip img{width:17px;height:17px;display:block;filter:brightness(0) invert(1);opacity:.85}
.chip em{font:500 14px/1 var(--sans);font-style:normal;color:rgba(255,255,255,.6);margin-left:2px}
.chip.go{background:rgba(255,255,255,.96);color:#1c1a18;box-shadow:0 8px 22px rgba(0,0,0,.28);cursor:pointer}
.chip.go img{filter:none;opacity:1}
.chip.go em{display:inline-flex;align-items:center;gap:6px;color:#1f7a36;font-weight:600}
.chip.go em::before{content:'';width:7px;height:7px;border-radius:50%;background:#49BA61}
.chip.t{transform:translate(-50%,-100%)}.chip.b{transform:translate(-50%,0)}.chip.l{transform:translate(-100%,-50%)}
.hit{position:absolute;left:52.3%;top:55.5%;width:7.6%;height:13.8%;border-radius:30px;cursor:pointer;transition:background .2s,box-shadow .2s}
.hit:hover{background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7)}
body.picked .hit,body.picked .chip.go{pointer-events:none}
.hint{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;height:48px;padding:0 20px;border-radius:999px;
  background:rgba(18,20,26,.78);font:500 17px/1 var(--sans);color:rgba(255,255,255,.85);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);transition:transform .4s var(--out),opacity .3s}
body.picked .hint{transform:translate(-50%,40px);opacity:0}

/* ---------------- the app's scenario card (ScenarioIntroV1), on the right ---------------- */
.card{position:absolute;right:40px;top:50%;width:470px;padding:20px;transform:translate(560px,-50%);visibility:hidden;
  transition:transform .8s cubic-bezier(.22,1,.36,1),visibility 0s linear .8s}
body.picked .card{transform:translate(0,-50%);visibility:visible;transition:transform .8s cubic-bezier(.22,1,.36,1) .12s,visibility 0s}
.c-body{position:relative;overflow:hidden;border-radius:42px;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(16px) saturate(1.1);backdrop-filter:blur(16px) saturate(1.1);
  box-shadow:0 44px 90px -24px rgba(0,0,0,.5)}
.c-in{display:flex;flex-direction:column;align-items:center;gap:34px;padding:20px;transition:opacity .16s ease-out}
.c-nav{display:flex;align-items:center;justify-content:space-between;width:100%}
.c-chev{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;color:rgba(255,255,255,.7)}
.c-chev svg{width:24px;height:24px}.c-chev.off{opacity:.2}
.c-count{display:flex;height:46px;align-items:center;gap:10px;border-radius:999px;background:rgba(255,255,255,.1);padding:0 20px;font:400 16px/1 var(--mono)}
.c-count i{font-style:normal;color:rgba(255,255,255,.4)}.c-count em{font-style:normal;color:rgba(255,255,255,.6)}
.c-art{width:336px;height:210px;object-fit:contain;display:block}
.c-desc{margin:0;max-width:360px;padding:0 10px;font:500 24px/1.35 var(--sans);text-align:center}
.c-meta{display:flex;flex-direction:column;align-items:center;gap:26px;width:100%}
.c-rule{width:100%;height:1px;background:rgba(255,255,255,.12)}
.c-rows{display:flex;flex-direction:column;gap:20px;width:100%}
.c-row{display:flex;height:30px;align-items:center;justify-content:space-between;padding:0 20px}
.c-row>span:first-child{font:400 16px/1 var(--mono);text-transform:uppercase;color:rgba(255,255,255,.5)}
.c-row>b,.c-diff b{font:500 18px/1 var(--sans)}
.c-xp{display:inline-flex;align-items:center;gap:6px;border-radius:40px;padding:6px 10px;background:rgba(255,224,107,.12);box-shadow:0 0 0 1px rgba(255,225,127,.4)}
.c-xp img{width:18px;height:18px;display:block}.c-xp b{font:400 18px/1.2 var(--mono);letter-spacing:-1.62px;color:#fff9d5}
.c-diff{display:flex;align-items:center;gap:20px}
.c-bars{display:inline-flex;gap:2px}.c-bars i{display:block;width:23px;height:10px;border-radius:30px;background:#fff}.c-bars i.dim{opacity:.1}
/* StartButtonV1: the white pill, its 3D press, the holographic label */
.start{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:62px;padding:15px 40px;border-radius:100px;
  background-image:linear-gradient(90deg,rgba(255,255,255,.4),rgba(255,255,255,.4)),linear-gradient(180deg,rgba(229,229,229,.8),rgb(226,226,226));
  box-shadow:0 6px 0 #c8c8c8,0 12px 18px -6px rgba(0,0,0,.4),0 0 0 1.33px #e6e6e6,inset 0 1.33px 0 rgba(255,255,255,.75);transition:transform .1s cubic-bezier(.34,1.56,.64,1),box-shadow .1s}
.start:hover{transform:translateY(-1px)}
.start:active,.start.down{transform:translateY(5px);box-shadow:0 1px 0 #c8c8c8,0 3px 8px -4px rgba(0,0,0,.4),0 0 0 1.33px #e6e6e6,inset 0 1.33px 0 rgba(255,255,255,.75)}
.start svg{width:7.8px;height:9.9px;margin-right:3.5px;position:relative;z-index:2}
.start b{position:relative;z-index:2;font:600 23px/1.2 var(--sans);letter-spacing:-.48px;
  background:linear-gradient(100deg,#121212 0%,#121212 34%,#ff5ec0 42%,#8b7bff 50%,#37dcc4 58%,#121212 66%,#121212 100%);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:holo 3s ease-in-out infinite}
@keyframes holo{0%{background-position:130% 0}55%,100%{background-position:-30% 0}}

/* ---------------- the brief (shared parts; each look below sets its own surface and type) ---------------- */
.scrim{position:absolute;left:calc(-1*var(--bx));top:calc(-1*var(--by));right:calc(-1*var(--bx));bottom:calc(-1*var(--by));background:rgba(8,9,10,.5);opacity:0;visibility:hidden;transition:opacity .4s,visibility 0s linear .4s}
body.open .scrim{opacity:1;visibility:visible;transition:opacity .4s,visibility 0s}
.shell{position:absolute;border-radius:42px;background:#151517;visibility:hidden;box-shadow:0 60px 120px -40px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.08)}
.brief{position:absolute;visibility:hidden;display:flex;flex-direction:column}
.b-x{position:absolute;top:28px;right:28px;z-index:3;display:grid;place-items:center;width:44px;height:44px;border-radius:12px}
.b-x svg{width:20px;height:20px}
.b-hero{display:grid;align-items:stretch}
.b-art{display:grid;place-items:center;overflow:hidden;position:relative}
.b-art img{display:block;width:84%;height:auto;user-select:none}
.b-play{position:absolute;left:24px;bottom:22px;display:flex;align-items:center;gap:10px;height:44px;padding:0 18px 0 6px;border-radius:999px}
.b-play i{display:grid;place-items:center;width:32px;height:32px;border-radius:50%}
.b-play svg{width:11px;height:11px}
.b-id{display:flex;flex-direction:column;min-width:0}
.b-co{display:flex;align-items:center;gap:10px}
.b-co .lg{display:grid;place-items:center;width:30px;height:30px;border-radius:50%}
.b-co .lg img{width:17px;height:17px;display:block}
.b-type{display:inline-flex;align-items:center;border-radius:999px}
.b-title{margin:0}
.b-mgr{display:flex;align-items:center;gap:12px}
.b-mgr img{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:top;display:block}
.b-mgr>span{display:flex;flex-direction:column}
.b-mgr i{font-style:normal}
.b-tools{display:flex;gap:8px;flex-wrap:wrap}
.b-tool{display:inline-flex;align-items:center;gap:8px;border-radius:999px;white-space:nowrap}
.b-tool img{width:18px;height:18px;display:block}
.b-act{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.b-key{display:inline-flex;align-items:center;gap:10px;white-space:nowrap}
.b-key svg{width:12px;height:12px}
.b-facts{display:flex}
.b-fact{display:flex;align-items:center;gap:10px}
.b-fact b{white-space:nowrap;font-variant-numeric:tabular-nums}
.b-fact svg,.b-fact img{width:22px;height:22px;display:block;flex:none}
.bars{display:flex;align-items:flex-end;gap:2px;width:22px;height:20px}
.bars i{display:block;width:4.5px;border-radius:2px}
.bars i:nth-child(1){height:7px}.bars i:nth-child(2){height:11px}.bars i:nth-child(3){height:15px}.bars i:nth-child(4){height:19px}
.b-body{display:grid;min-height:0}
.b-sec{min-width:0}
.b-h{margin:0}
.b-quote{display:flex;align-items:flex-end;gap:12px}
.b-quote img{width:34px;height:34px;border-radius:50%;object-fit:cover;object-position:top;flex:none}
.b-quote p{margin:0}
.b-nums{display:flex}
.b-num{display:flex;flex-direction:column;gap:4px}
.b-num b{font-variant-numeric:tabular-nums}
.b-stages{list-style:none;margin:0;padding:0;position:relative}
.b-st{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:16px;position:relative}
.b-st-n{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;position:relative;z-index:1;font-variant-numeric:tabular-nums}
.b-st b{font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-st em{font-style:normal;font-variant-numeric:tabular-nums}
.b-sh{display:flex;align-items:baseline;justify-content:space-between}
.b-flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.b-fl{position:relative;display:flex;flex-direction:column;gap:12px}
.b-fl::before{content:'';position:relative;z-index:1;width:14px;height:14px;border-radius:50%}
.b-fl::after{content:'';position:absolute;top:6px;left:14px;right:0;height:2px}
.b-fl:last-child::after{display:none}
.b-chips{display:flex;flex-wrap:wrap;gap:8px}
.b-chip{display:inline-flex;align-items:center;border-radius:999px;white-space:nowrap}
.b-gets{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.b-get{display:flex;align-items:center;gap:14px}
.b-get .ic{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;flex:none}
.b-get .ic svg,.b-get .ic img{width:20px;height:20px;display:block}
.b-get .lgs{display:flex;margin-left:auto}
.b-get .lgs span{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#fff}
.b-get .lgs span+span{margin-left:-8px}
.b-get .lgs img{width:17px;height:17px;display:block;border-radius:4px}
/* the brief's parts come in after its surface: rise and deblur, a step apart */
.brief .rv{opacity:0;transform:translateY(18px);filter:blur(8px);transition:opacity .55s var(--out),transform .55s var(--out),filter .55s var(--out)}
body.shown .brief .rv{opacity:1;transform:none;filter:none}
body.shown .brief .rv:nth-child(2){transition-delay:.06s}body.shown .brief .rv:nth-child(3){transition-delay:.12s}
body.shown .brief .rv:nth-child(4){transition-delay:.18s}body.shown .brief .rv:nth-child(5){transition-delay:.24s}

/* ================= 1 · dark: the card grows into the centre ================= */
body.v-dark .brief{left:220px;top:90px;width:1480px;height:900px;padding:48px 56px 48px}
body.v-dark .brief{color:#fff}
body.v-dark .b-x{color:rgba(255,255,255,.7);background:rgba(255,255,255,.06)}
body.v-dark .b-hero{grid-template-columns:420px minmax(0,1fr) auto;gap:40px}
body.v-dark .b-art{height:262px;border-radius:28px;background:radial-gradient(120% 100% at 50% 100%,rgba(255,255,255,.06),rgba(255,255,255,.02));box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
body.v-dark .b-play{display:none}
body.v-dark .b-id{gap:16px;padding-top:6px}
body.v-dark .b-co{font:500 18px/1 var(--sans);color:rgba(255,255,255,.88)}
body.v-dark .b-co .lg{background:#fff}
body.v-dark .b-type{height:30px;padding:0 13px;background:rgba(255,255,255,.08);font:400 15px/1 var(--mono);text-transform:uppercase;letter-spacing:.04em;color:rgba(255,255,255,.6)}
body.v-dark .b-title{font:500 46px/1.12 var(--sans);letter-spacing:-.02em}
body.v-dark .b-mgr b{font:500 18px/1.3 var(--sans)}body.v-dark .b-mgr i{font:400 15px/1.3 var(--sans);color:rgba(255,255,255,.5)}
body.v-dark .b-tool{height:36px;padding:0 14px 0 10px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);font:400 16px/1 var(--sans);color:rgba(255,255,255,.88)}
body.v-dark .b-act{padding-top:58px;padding-right:0}
body.v-dark .b-key{height:62px;padding:0 34px 0 30px;border-radius:100px;font:600 21px/1 var(--sans);letter-spacing:-.4px;color:#121212;
  background-image:linear-gradient(90deg,rgba(255,255,255,.4),rgba(255,255,255,.4)),linear-gradient(180deg,rgba(229,229,229,.8),rgb(226,226,226));
  box-shadow:0 6px 0 #c8c8c8,0 12px 18px -6px rgba(0,0,0,.4),0 0 0 1.33px #e6e6e6,inset 0 1.33px 0 rgba(255,255,255,.75)}
body.v-dark .b-key:active{transform:translateY(5px);box-shadow:0 1px 0 #c8c8c8,0 0 0 1.33px #e6e6e6}
body.v-dark .b-facts{gap:28px;margin-top:6px}
body.v-dark .b-fact b{font:500 18px/1 var(--sans)}
body.v-dark .b-fact svg{color:rgba(255,255,255,.55)}
body.v-dark .bars i{background:#fff}body.v-dark .bars i.dim{opacity:.15}
body.v-dark .b-body{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"brief cover" "stages get";gap:36px 72px;margin-top:44px}
body.v-dark .b-h{font:400 15px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.45);margin-bottom:18px}
body.v-dark .b-quote p{padding:14px 18px;border-radius:20px;background:rgba(255,255,255,.07);font:400 19px/1.45 var(--sans);color:rgba(255,255,255,.92)}
body.v-dark .b-nums{display:none}
body.v-dark .b-sh .b-h{margin-bottom:0}body.v-dark .b-sh{margin-bottom:12px}
body.v-dark .b-total{font:400 16px/1 var(--mono);color:rgba(255,255,255,.45)}
body.v-dark .b-st{height:52px;padding:0 4px}
body.v-dark .b-stages::before{content:'';position:absolute;left:19px;top:26px;bottom:26px;width:1px;background:rgba(255,255,255,.12)}
body.v-dark .b-st-n{background:#232326;box-shadow:0 0 0 4px #151517;font:400 15px/1 var(--mono);color:rgba(255,255,255,.7)}
body.v-dark .b-st:first-child .b-st-n{background:#fff;color:#121212}
body.v-dark .b-st b{font:400 19px/1.3 var(--sans)}
body.v-dark .b-st em{font:400 16px/1 var(--mono);color:rgba(255,255,255,.5)}
body.v-dark .b-fl{font:400 15px/1.3 var(--sans);color:rgba(255,255,255,.7)}
body.v-dark .b-fl::before{background:#151517;box-shadow:inset 0 0 0 2px rgba(255,255,255,.3)}
body.v-dark .b-fl:first-child::before{background:#fff;box-shadow:none}
body.v-dark .b-fl::after{background:rgba(255,255,255,.12)}
body.v-dark .b-chips{margin-top:22px}
body.v-dark .b-chip{height:36px;padding:0 15px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);font:400 16px/1 var(--sans);color:rgba(255,255,255,.88)}
body.v-dark .b-gets{gap:12px}
body.v-dark .b-get{font:400 18px/1.3 var(--sans);color:rgba(255,255,255,.9)}
body.v-dark .b-get .ic{background:rgba(255,255,255,.07);color:rgba(255,255,255,.7)}
body.v-dark .b-get .lgs span{box-shadow:0 0 0 2px #151517}

/* ================= 2 · paper: a white sheet rises to the centre (the Zero Jobs design system) ================= */
body.v-paper .brief{left:240px;top:80px;width:1440px;height:920px;padding:44px 52px 44px;border-radius:36px;background:#fff;color:#4E525C;font-family:var(--inter);
  font-feature-settings:'cv11','ss01';letter-spacing:-.006em;box-shadow:0 0 0 1px rgba(19,20,23,.05),0 60px 120px -40px rgba(0,0,0,.6);
  transform:translateY(1200px);transition:transform .75s var(--out),visibility 0s linear .75s}
body.v-paper.open .brief{transform:none;transition:transform .75s var(--out),visibility 0s}
body.v-paper.picked.open .card{transform:translate(560px,-50%)}
body.v-paper .b-x{color:#4E525C;background:#fff;box-shadow:0 0 0 1px #E7E7EB,0 6px 14px -8px rgba(19,20,23,.3)}
body.v-paper .b-hero{grid-template-columns:420px minmax(0,1fr) auto;gap:40px}
body.v-paper .b-art{height:248px;border-radius:24px;background:#F6F6F8;box-shadow:inset 0 0 0 1px #E7E7EB}
body.v-paper .b-play{display:none}
body.v-paper .b-id{gap:14px;padding-top:4px}
body.v-paper .b-co{font:500 17px/1 var(--inter);color:#131417}
body.v-paper .b-co .lg{background:#fff;box-shadow:inset 0 0 0 1px #E7E7EB}
body.v-paper .b-type{height:28px;padding:0 12px;background:#F6F6F8;font:400 15px/1 var(--inter);color:#6A6F7A}
body.v-paper .b-title{font:400 40px/1.15 var(--inter);letter-spacing:-.022em;color:#131417}

  function setV(v, keep) {
    V = v; B.classList.remove('v-dark', 'v-paper', 'v-class'); B.classList.add('v-' + v);
    Array.prototype.forEach.call(document.querySelectorAll('.proto [data-v]'), function (b) { b.classList.toggle('on', b.dataset.v === v); });
    try { history.replaceState(null, '', '?v=' + v); } catch (e) {}
    if (keep && B.classList.contains('open')) { instantClose(); setTimeout(open, 120); }
  }
  function pick() { if (B.classList.contains('picked')) return; B.classList.add('picked'); }

  /* open the brief, in the chosen look */
  function open() {
    if (busy || B.classList.contains('open')) return; busy = true;
    var key = $('.start'); key.classList.add('down'); setTimeout(function () { key.classList.remove('down'); }, 160);
    if (V === 'dark') {
      /* the card grows into the brief: one dark shell tweens from the card's box to the brief's (0.6s, power3 in-out),
         the card's own content leaves fast, the brief's parts rise in after */
      var from = box(card), to = { x: 220, y: 90, w: 1480, h: 900 };
      cin.style.opacity = '0';
      shell.style.cssText = 'visibility:visible;left:' + from.x + 'px;top:' + from.y + 'px;width:' + from.w + 'px;height:' + from.h + 'px;border-radius:42px';
      card.style.visibility = 'hidden';
      B.classList.add('open');
      var an = shell.animate([{ left: from.x + 'px', top: from.y + 'px', width: from.w + 'px', height: from.h + 'px', borderRadius: '42px' },
        { left: to.x + 'px', top: to.y + 'px', width: to.w + 'px', height: to.h + 'px', borderRadius: '36px' }], { duration: 640, easing: 'cubic-bezier(.65,0,.35,1)', fill: 'forwards' });
      an.onfinish = function () { B.classList.add('shown'); busy = false; };
    } else {
      B.classList.add('open');
      setTimeout(function () { B.classList.add('shown'); busy = false; }, V === 'class' ? 380 : 320);
    }
  }
  function instantClose() {
    B.classList.remove('open', 'shown'); shell.getAnimations().forEach(function (a) { a.cancel(); });
    shell.style.visibility = 'hidden'; card.style.visibility = ''; cin.style.opacity = '';
  }
  function close() {
    if (busy || !B.classList.contains('open')) return; busy = true;
    B.classList.remove('shown');
    if (V === 'dark') {
      var to = box(card);
      var an = shell.animate([{ left: '220px', top: '90px', width: '1480px', height: '900px', borderRadius: '36px' },
        { left: to.x + 'px', top: to.y + 'px', width: to.w + 'px', height: to.h + 'px', borderRadius: '42px' }], { duration: 560, easing: 'cubic-bezier(.65,0,.35,1)', fill: 'forwards', delay: 120 });
      B.classList.remove('open');
      an.onfinish = function () { card.style.visibility = ''; cin.style.opacity = ''; shell.style.visibility = 'hidden'; an.cancel(); busy = false; };
    } else {
      B.classList.remove('open'); setTimeout(function () { busy = false; }, 700);
    }
  }
  function startOver() { instantClose(); B.classList.remove('picked'); busy = false; toast.classList.remove('on'); }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-pick],[data-open],.b-x,[data-go],.b-play');
    if (!t) return;
    if (t.hasAttribute('data-pick')) pick();
    else if (t.hasAttribute('data-open')) open();
    else if (t.classList.contains('b-x')) close();
    else if (t.hasAttribute('data-go')) { toast.classList.remove('on'); void toast.offsetWidth; toast.classList.add('on'); setTimeout(function () { toast.classList.remove('on'); }, 2600); }
  });
  document.querySelector('.proto').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.v) setV(b.dataset.v, true); else if (b.hasAttribute('data-r')) startOver();
  });
  addEventListener('keydown', function (e) {
    if (e.key === 'Escape') close();
    if (e.key === '1' || e.key === '2' || e.key === '3') setV(['dark', 'paper', 'class'][+e.key - 1], true);
  });
  setV(V);
})();
</script>
</body>
</html>
