<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Zero home, level and coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,100..1000&display=swap">
<link rel="stylesheet" href="zero-skill-path-home-assets-b7/home.css">
</head>
<body>
<!-- prototype control, outside the app -->
<div id="dev">
  <a class="dv-home" href="zero-skill-path-index.html">Zero skill path</a>
  <div class="dv-seg" id="moments"></div>
  <span class="dv-b">b7</span>
</div>

<div id="stage">
  <div id="app">
    <div class="titlebar"><i></i><i></i><i></i><span class="tb-r"><span class="tb-theme"></span><img class="tb-av" alt=""></span></div>
    <div class="screen" id="screen">
      <div class="world" id="world"><img id="city" alt=""><div class="beam" id="beam"></div><div class="pin" id="pin"></div></div>
      <img class="wm" alt="zero">
      <nav class="rail" id="rail"></nav>
      <div class="hud" id="hud">
        <button class="chip-lv" id="chipLv" type="button" aria-label="Your level"></button>
        <button class="chip-co" id="chipCo" type="button" aria-label="Your coach"></button>
      </div>
      <div class="panel" id="panel" role="dialog" aria-label="Level and coach">
        <div class="pn-tabs" id="tabs"><button type="button" data-tab="level">Level</button><button type="button" data-tab="coach">Coach</button><i class="pn-ind"></i></div>
        <div class="pn-body">
          <section class="pn-page" data-page="level" id="pgLevel"></section>
          <section class="pn-page" data-page="coach" id="pgCoach"></section>
        </div>
      </div>
      <aside class="card" id="card"></aside>
      <div class="capsule" id="capsule"></div>
    </div>
  </div>
</div>
<script src="zero-skill-path-home-assets-b7/data.js"></script>
<script src="zero-skill-path-home-assets-b7/home.js"></script>
</body>
</html>
