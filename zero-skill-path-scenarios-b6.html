  opacity:0;transform:translateY(8px);transition:opacity .45s var(--ease),transform .6s var(--spring)}
.sc-present .pr-cap.is-in{opacity:1;transform:none}
.sc-present .pr-cap b{flex:none;font-weight:500;color:var(--tx)}
.sc-present .pr-cap>span:last-child{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-present .pr-go{position:absolute;left:1076px;top:644px;width:392px;opacity:0;transform:translateY(8px);transition:opacity .45s var(--ease),transform .6s var(--spring)}
.sc-present .pr-go.is-in{opacity:1;transform:none}
.sc-present .pr-go .sp-key{width:100%}

/* ================================================================
   4 · applyask. Zero asks before it applies.
   ================================================================ */
.sc-applyask .aa-col{position:absolute;left:420px;top:84px;width:760px;height:728px;display:flex;flex-direction:column;justify-content:center}
.sc-applyask .aa-title{font-size:34px;line-height:1.14}
.sc-applyask .aa-title.is-swap{animation:aa-swap .6s var(--spring)}
@keyframes aa-swap{from{opacity:0;transform:translateY(8px)}}
.sc-applyask .aa-roles{margin-top:26px;padding:8px;border-radius:24px;background:#fff;box-shadow:0 0 0 1px var(--line),var(--sh1)}
.sc-applyask .aa-list{display:flex;flex-direction:column;gap:4px;border-radius:16px}
/* more roles than fit: the list scrolls inside its card and fades where there is more */
.sc-applyask .aa-roles.is-long .aa-list{max-height:364px;overflow-y:auto;overscroll-behavior:contain;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 28px,#000 calc(100% - 44px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 28px,#000 calc(100% - 44px),transparent 100%)}
.sc-applyask .aa-roles.is-long .aa-list.at-top{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 44px),transparent 100%);mask-image:linear-gradient(to bottom,#000 calc(100% - 44px),transparent 100%)}
.sc-applyask .aa-roles.is-long .aa-list.at-end{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 28px);mask-image:linear-gradient(to bottom,transparent 0,#000 28px)}
.sc-applyask .aa-roles.is-long .aa-list.at-top.at-end{-webkit-mask-image:none;mask-image:none}
.sc-applyask .aa-row{flex:none;display:grid;grid-template-columns:20px 44px minmax(0,1fr) auto;column-gap:14px;row-gap:10px;align-items:center;width:100%;padding:14px 16px 15px;border-radius:16px;text-align:left;transition:background .2s var(--ease),opacity .4s var(--ease)}
.sc-applyask .aa-row:hover{background:var(--wash)}
.sc-applyask .aa-row:active .aa-box{transform:scale(.9)}
.sc-applyask .aa-row.is-on{background:var(--field)}
.sc-applyask .aa-row.is-on:hover{background:var(--sunk)}
.sc-applyask .aa-row.is-sent,.sc-applyask .aa-row.is-off,.sc-applyask .aa-row.is-locked,.sc-applyask .aa-col.is-busy .aa-row{cursor:default}
.sc-applyask .aa-row.is-sent:hover,.sc-applyask .aa-row.is-off:hover,.sc-applyask .aa-row.is-locked:hover{background:transparent}
.sc-applyask .aa-row.is-locked{grid-template-columns:22px 44px minmax(0,1fr) auto;column-gap:13px}
.sc-applyask .aa-row.is-locked .sp-lg{filter:grayscale(1);opacity:.6}
.sc-applyask .aa-row.is-locked .aa-tx b{color:var(--tx-2)}
.sc-applyask .aa-col.is-busy .aa-row.is-on:hover{background:var(--field)}
.sc-applyask .aa-row.is-off{opacity:.5}
.sc-applyask .aa-box{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:transparent;box-shadow:inset 0 0 0 1.5px var(--tx-4);transition:background .18s var(--ease),box-shadow .18s var(--ease),color .18s var(--ease),border-radius .3s var(--ease),transform .18s var(--out)}
.sc-applyask .aa-box svg{width:12px;height:12px}
.sc-applyask .aa-row.is-on .aa-box{background:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);color:#fff}
.sc-applyask .aa-row.is-sent .aa-box{border-radius:50%;background:var(--ok);box-shadow:inset 0 0 0 1.5px var(--ok);color:#fff;animation:lp-pop .5s var(--spring)}
.sc-applyask .aa-tx{display:block;min-width:0}
.sc-applyask .aa-tx b{display:block;font:500 15px/20px var(--sans);letter-spacing:-.014em;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-applyask .aa-m{display:block;margin-top:2px;font:400 13px/18px var(--sans);color:var(--tx-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-applyask .aa-why{grid-column:3 / 5;display:block;font:400 13px/19px var(--sans);color:var(--tx-2);text-wrap:pretty}
.sc-applyask .aa-end{display:flex;align-items:center;justify-content:flex-end;gap:12px}
.sc-applyask .aa-sent{font:500 13px/18px var(--sans);color:var(--tx-2);white-space:nowrap;font-variant-numeric:tabular-nums;opacity:0;transform:translateX(6px);transition:opacity .35s var(--ease) .1s,transform .5s var(--spring) .1s}
.sc-applyask .aa-row.is-sent .aa-sent{opacity:1;transform:none}
/* the match ring, as in the portal */
.sc-applyask .aa-ring{position:relative;flex:none;width:44px;height:44px;display:grid;place-items:center}
.sc-applyask .aa-ring svg{position:absolute;inset:0;width:100%;height:100%}
.sc-applyask .aa-ring circle{fill:none;stroke-width:3.5}
.sc-applyask .aa-ring .tr{stroke:var(--line)}
.sc-applyask .aa-ring .ar{stroke:var(--ok-deep);stroke-linecap:round;stroke-dasharray:0 var(--c);transition:stroke-dasharray 1s var(--out) .35s}
.sc-applyask .aa-roles.is-in .aa-ring .ar{stroke-dasharray:var(--v) var(--c)}
.sc-applyask .aa-ring b{position:relative;font:600 13px/1 var(--sans);letter-spacing:-.01em;color:var(--tx);font-variant-numeric:tabular-nums}
/* what goes out */
.sc-applyask .aa-send{display:flex;align-items:center;gap:20px;margin-top:12px;padding:12px 28px 12px 12px;border-radius:24px;background:var(--sunk)}
.sc-applyask .aa-pf{flex:none;position:relative;width:132px;height:84px;border-radius:12px;background:#F3EEE9;box-shadow:inset 0 0 0 1px var(--line-2);display:block}
.sc-applyask .aa-sl{position:absolute;left:14px;right:14px;top:10px;bottom:10px;padding:9px 10px 0;border-radius:7px;background:#fff;box-shadow:0 0 0 1px var(--line-2),0 4px 10px -6px rgba(26,25,23,.2);display:block}
.sc-applyask .aa-sl b{display:block;margin-top:6px;font:400 11px/1.14 var(--serif);letter-spacing:-.02em;color:var(--tx)}
.sc-applyask .aa-sl>i{display:block;width:16px;height:1.5px;margin-top:5px;border-radius:2px;background:var(--ink)}
.sc-applyask .aa-stx{display:block;min-width:0}
.sc-applyask .aa-lbl{display:block;font:400 13px/18px var(--sans);color:var(--tx-3)}
.sc-applyask .aa-stx b{display:block;margin-top:3px;font:500 15px/20px var(--sans);color:var(--tx)}
.sc-applyask .aa-sub{display:block;margin-top:2px;font:400 13px/18px var(--sans);color:var(--tx-2)}
.sc-applyask .aa-act{display:flex;align-items:center;gap:10px;margin-top:22px}
.sc-applyask .aa-quiet{flex:1;padding-left:4px;font:400 13px/18px var(--sans);color:var(--tx-3);transition:opacity .3s var(--ease)}
.sc-applyask .aa-col.is-done .aa-quiet{opacity:0}
.sc-applyask .aa-go{min-width:148px}
.sc-applyask .aa-look{transition:background .2s,opacity .3s var(--ease)}
.sc-applyask .aa-look:active{transform:translateY(1px)}
.sc-applyask .aa-col.is-busy .aa-look,.sc-applyask .aa-col.is-done .aa-look{opacity:0;pointer-events:none}

/* ================================================================
   5 · whenback. Choosing a time is what brings them back.
   ================================================================ */
.sc-whenback .wb-wrap{position:absolute;inset:0;padding-top:16px;display:grid;place-items:center}
.sc-whenback .wb-panel{width:560px;padding:36px 32px 32px}
.sc-whenback .wb-logo{display:block;width:48px;height:48px;border-radius:14px;box-shadow:0 0 0 1px rgba(255,255,255,.14)}
.sc-whenback .wb-title{margin-top:22px;font-size:34px;line-height:1.14}
.sc-whenback .wb-line{margin-top:12px}
.sc-whenback .wb-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:26px}
.sc-whenback .wb-opt{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;height:60px;padding:0 18px 1px 20px;border-radius:18px;text-align:left;color:var(--tx);
  background:var(--glass-2);box-shadow:inset 0 0 0 1px var(--line);transition:background .2s var(--ease),color .2s var(--ease),box-shadow .2s var(--ease),transform .18s var(--out)}
.sc-whenback .wb-opt:hover{background:var(--glass-3)}
.sc-whenback .wb-opt:active{transform:scale(.985)}
.sc-whenback .wb-opt b{font:500 15px/20px var(--sans);letter-spacing:-.014em}
.sc-whenback .wb-opt span{font:400 15px/20px var(--sans);color:var(--tx-2);font-variant-numeric:tabular-nums;transition:color .2s var(--ease),transform .45s var(--spring)}
.sc-whenback .wb-opt i{position:absolute;right:16px;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;display:grid;place-items:center;background:#141312;color:#fff;opacity:0;transform:scale(.5);transition:opacity .2s var(--ease),transform .45s var(--spring)}
.sc-whenback .wb-opt i svg{width:11px;height:11px}
.sc-whenback .wb-opt.is-on{background:#F4F4F3;color:#131315;box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(0,0,0,.3),0 12px 24px -14px rgba(0,0,0,.7)}
.sc-whenback .wb-opt.is-on span{color:#5D5A54;transform:translateX(-32px)}
.sc-whenback .wb-opt.is-on i{opacity:1;transform:none}
.sc-whenback .wb-note{position:relative;height:20px;margin-top:18px}
.sc-whenback .wb-note>span{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:9px;height:20px;font:400 13px/20px var(--sans);color:var(--tx-3);white-space:nowrap;transition:opacity .3s var(--ease),transform .5s var(--spring)}
.sc-whenback .wb-held{color:var(--tx-2)!important;opacity:0;transform:translateY(6px)}
.sc-whenback .wb-panel.is-set .wb-hint{opacity:0}
.sc-whenback .wb-panel.is-set .wb-held{opacity:1;transform:none;transition-delay:.1s}
.sc-whenback .wb-panel.is-later .wb-held .sp-tick{display:none}
.sc-whenback .wb-act{display:flex;align-items:center;justify-content:space-between;margin-top:26px}
.sc-whenback .wb-now{height:48px;margin-left:-14px;padding:0 14px 1px;border-radius:15px;font:500 15px/1 var(--sans);letter-spacing:-.014em;color:var(--tx-2);transition:color .2s var(--ease),background .2s var(--ease)}
.sc-whenback .wb-now:hover{color:var(--tx);background:var(--glass-2)}
.sc-whenback .wb-now:active{background:var(--glass-3)}
.sc-whenback .wb-done{min-width:132px}

/* screens/jobs.css */
/* ZERO · System 3, Jobs: Home, Explore, Applications, Inbox.
   The approved portal's restraint: flat white cards with a hairline, 14 and 12, one serif line a page, pill buttons,
   segmented filters, a sheet with a light row hover. Colour comes from logos, faces and the fit marks. */
.sc-jb{--wl:#F4F3F1;--wl2:#ECEBE8;--ln:rgba(26,25,23,.085);--ln2:rgba(26,25,23,.16);--good:#0C7E45;--goodbg:#E8F5EE;--paper:#F8F7F5;
  color:var(--tx);font:400 14px/20px var(--sans);letter-spacing:-.011em}
.sc-jb h1,.sc-jb h2,.sc-jb h3{font-weight:400}
.sc-jb ul,.sc-jb ol{list-style:none}
.sc-jb .jb-col{position:absolute;top:92px;bottom:0}
.sc-jb .jb-col.narrow{left:356px;width:888px;padding:8px 4px 56px}
.sc-jb .jb-col.wide{left:180px;width:1240px;padding-top:8px}

/* arrivals: once, a few pixels up */
.sc-jb .jb-in{animation:jb-in .5s var(--out) both;animation-delay:calc(var(--i,0) * 50ms + 80ms)}
@keyframes jb-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sc-jb .swap{animation:jb-in .28s var(--out) both}
.sc-jb .jb-scroll{overflow-y:auto;overscroll-behavior:contain;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 var(--ft,0px),#000 calc(100% - var(--fb,0px)),transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0,#000 var(--ft,0px),#000 calc(100% - var(--fb,0px)),transparent 100%)}

/* ---------- atoms ---------- */
.sc-jb .jb-title{display:flex;align-items:center;gap:14px;min-height:42px}
.sc-jb .jb-title h1,.sc-jb .ex-top h1{font:400 28px/34px var(--serif);letter-spacing:-.025em;color:var(--tx);text-wrap:balance}
.sc-jb .jb-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:36px 0 12px;font:500 14px/20px var(--sans);color:var(--tx)}
.sc-jb .jb-h span{font:400 12px/16px var(--sans);color:var(--tx-3)}
.sc-jb .jb-card{background:#fff;border-radius:20px;box-shadow:inset 0 0 0 1px var(--ln),0 1px 2px rgba(26,25,23,.02)}
.sc-jb .jb-k,.sc-jb .jb-s{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 18px 1px;border-radius:99px;white-space:nowrap;flex:none;font:500 14px/1 var(--sans);letter-spacing:-.011em;transition:transform .12s var(--out),filter .12s,background .12s,box-shadow .12s}
.sc-jb .jb-k{color:#fff;background:linear-gradient(#313337,#17181B);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -2px 0 rgba(0,0,0,.45),0 0 0 1px #0F1012,0 10px 20px -14px rgba(19,20,23,.6)}
.sc-jb .jb-k:hover{filter:brightness(1.16)}
.sc-jb .jb-k:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 0 1px #0F1012}
.sc-jb .jb-k.light{color:var(--tx);background:#fff;box-shadow:none}
.sc-jb .jb-k.light:hover{filter:none;background:#F1F0EE}
.sc-jb .jb-s{color:var(--tx);background:#fff;box-shadow:inset 0 0 0 1px var(--ln2),inset 0 -2px 0 rgba(26,25,23,.04)}
.sc-jb .jb-s:hover{background:var(--wl)}
.sc-jb .jb-s:active{transform:translateY(1px);box-shadow:inset 0 0 0 1px var(--ln2)}
.sc-jb .jb-k.sm,.sc-jb .jb-s.sm{height:32px;padding:0 14px 1px}
.sc-jb .jb-k.xs,.sc-jb .jb-s.xs{height:28px;padding:0 12px 1px;font-size:12px}
.sc-explore .ex-row:hover .jb-s.xs{background:#fff}
.sc-jb .jb-k:disabled{opacity:.35;pointer-events:none}
.sc-jb .jb-k svg,.sc-jb .jb-s svg{width:15px;height:15px}
.sc-jb .jb-chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:99px;background:var(--wl2);font:400 12px/1 var(--sans);color:var(--tx-2);white-space:nowrap}
.sc-jb .jb-fit{font-size:14px;line-height:1}
.sc-jb .jb-nil{display:block;width:6px;height:2px;border-radius:2px;background:var(--wl2)}
.sc-jb .jb-done{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 14px 1px 12px;border-radius:99px;background:var(--goodbg);color:var(--good);font:500 14px/1 var(--sans)}
.sc-jb .jb-done svg{width:14px;height:14px}
/* like: the heart teaches the matching */
.sc-jb .jb-like{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;color:var(--tx-4);transition:color .15s,background .15s,transform .2s var(--spring)}
.sc-jb .jb-like svg{width:15px;height:15px}
.sc-jb .jb-like:hover{color:var(--tx-2);background:var(--wl)}
.sc-jb .jb-like:active{transform:scale(.86)}
.sc-jb .jb-like.on{color:var(--tx)}
.sc-jb .jb-like.on svg{fill:currentColor}
.sc-jb .jb-like.big{width:36px;height:36px}
.sc-jb .jb-like.big svg{width:18px;height:18px}
.sc-jb .jb-ck{display:grid;place-items:center;width:18px;height:18px;border-radius:5px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--tx-4);color:transparent;transition:background .12s,box-shadow .12s}
.sc-jb .jb-ck svg{width:11px;height:11px}
.sc-jb .jb-ck:hover{box-shadow:inset 0 0 0 1.5px var(--tx-2)}
.sc-jb .jb-ck.on{background:var(--tx);box-shadow:none;color:#fff}
.sc-jb .jb-ck.some{background:var(--tx);box-shadow:none}
.sc-jb .jb-ck.some svg{display:none}
.sc-jb .jb-ck.some::after{content:'';width:8px;height:2px;border-radius:2px;background:#fff}
.sc-jb .ex-x{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;color:var(--tx-3);transition:background .12s,color .12s}
.sc-jb .ex-x svg{width:14px;height:14px}
.sc-jb .ex-x:hover{background:var(--wl);color:var(--tx)}
/* a recruiter's face with the company's mark on it */
.sc-jb .jb-ph{position:relative;flex:none;width:var(--z);height:var(--z)}
.sc-jb .jb-ph img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;background:var(--wl2)}
.sc-jb .jb-ph i{position:absolute;right:-3px;bottom:-3px;display:block;border-radius:30%;box-shadow:0 0 0 2px #fff}
/* segmented filters and search */
.sc-jb .jb-seg{display:inline-flex;gap:2px;padding:3px;border-radius:99px;background:var(--wl2)}
.sc-jb .jb-seg button{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 13px 1px;border-radius:99px;font:500 12px/1 var(--sans);color:var(--tx-2);transition:background .12s,color .12s}
.sc-jb .jb-seg button i{font-style:normal;font-weight:400;color:var(--tx-3);font-variant-numeric:tabular-nums}
.sc-jb .jb-seg button:hover{color:var(--tx)}
.sc-jb .jb-seg button.on{background:#fff;color:var(--tx);box-shadow:0 0 0 1px var(--ln),0 6px 12px -10px rgba(26,25,23,.5)}
.sc-jb .jb-find{display:flex;align-items:center;gap:8px;width:280px;height:36px;padding:0 14px;border-radius:12px;background:var(--wl2);color:var(--tx-3);cursor:text}
.sc-jb .jb-find:focus-within{box-shadow:inset 0 0 0 2px var(--tx);background:#fff}
.sc-jb .jb-find svg{flex:none;width:15px;height:15px}
.sc-jb .jb-find input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;font:400 14px/1 var(--sans);letter-spacing:-.011em;color:var(--tx)}
.sc-jb .jb-find input::placeholder{color:var(--tx-3)}

/* =====================================================================================================
   1. Home
   ===================================================================================================== */
.sc-jobs .jb-title .sp-face{flex:none}
.sc-jobs .hm-acts{padding:6px}
.sc-jobs .hm-act{display:flex;align-items:center;gap:14px;min-height:64px;padding:10px 10px 10px 12px;border-radius:14px;transition:background .12s}
.sc-jobs .hm-act:hover{background:var(--wl)}
.sc-jobs .hm-act .t{flex:1;min-width:0;display:flex;flex-direction:column}
.sc-jobs .hm-act .t b{font:500 14px/20px var(--sans);color:var(--tx)}
.sc-jobs .hm-act .t span{font:400 12px/16px var(--sans);color:var(--tx-3)}
.sc-jobs .hm-zero{display:grid;place-items:center;width:36px;height:36px;flex:none}
.sc-jobs .hm-likes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}

/* screens/later.css */
/* ZERO skill path · the later moments: recap, proof, dreamapply, offer, hired.
   World tone for the two panels that sit on the city, the job portal's paper for the Jobs pages and the letter.
   Sizes on every screen: one serif title, 15 body, 13 secondary, 12 small. The letter sets its own body in the serif. */

/* things take their place by rising a little. If the animation never runs, they are simply there. */
.sc-recap .lt-in,.sc-proof .lt-in,.sc-dreamapply .lt-in,.sc-offer .lt-in,.sc-hired .lt-in,.sc-coach .lt-in,.sc-credits .lt-in,.sc-slider .lt-in{animation:lt-rise .7s var(--spring) backwards;animation-delay:calc(var(--i,0) * 60ms + 140ms)}
@keyframes lt-rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* the quiet button sets down when pressed, like the key */
.sc-recap .sp-ghost,.sc-proof .sp-ghost,.sc-dreamapply .sp-ghost,.sc-offer .sp-ghost{transition:background .2s,transform .18s var(--out)}
.sc-recap .sp-ghost:active,.sc-proof .sp-ghost:active,.sc-dreamapply .sp-ghost:active,.sc-offer .sp-ghost:active{transform:translateY(1px)}

/* ================= 1 · recap ================= */
.sc-recap .rc-panel{position:absolute;left:480px;top:190px;width:640px;padding:32px 12px 12px}
.sc-recap .rc-panel h1{padding:0 12px}
.sc-recap .rc-rows{display:flex;flex-direction:column;gap:6px;margin-top:24px}
.sc-recap .rc-row{display:flex;align-items:center;gap:14px;width:100%;height:64px;padding:0 16px 0 12px;border-radius:18px;text-align:left;
  background:var(--glass-2);box-shadow:inset 0 0 0 1px var(--line-2);transition:background .2s var(--ease)}
.sc-recap .rc-row:hover{background:var(--glass-3)}
.sc-recap .rc-row:active{background:rgba(255,255,255,.13)}
.sc-recap .rc-row .tx{flex:1;min-width:0;font:400 15px/1.35 var(--sans);letter-spacing:-.012em;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-recap .rc-row .tx b{font-weight:500}
.sc-recap .rc-row .tx em{font-style:normal;color:var(--tx-2)}
.sc-recap .rc-row .go{flex:none;width:16px;height:16px;color:var(--tx-2);opacity:0;transform:translateX(-4px);transition:opacity .2s var(--ease),transform .3s var(--spring)}
.sc-recap .rc-row:hover .go{opacity:1;transform:none}
.sc-recap .rc-acts{display:flex;gap:8px;margin-top:12px}
.sc-recap .rc-acts .sp-key,.sc-recap .rc-acts .sp-ghost{height:52px;border-radius:18px}
.sc-recap .rc-acts .sp-key{flex:1;gap:10px}
.sc-recap .rc-acts .sp-ghost{padding:0 24px 2px}

/* ================= 2 · proof ================= */
/* one view, no scroll: header, the level line, the skills, and the projects as one compact row */
.sc-proof .pf-page{position:absolute;left:280px;top:96px;width:1040px}
.sc-proof .pf-card{background:var(--card);border-radius:24px;box-shadow:0 0 0 1px var(--line),var(--sh1)}

.sc-proof .pf-head{display:flex;align-items:center;gap:16px}
.sc-proof .pf-av{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;object-fit:cover;background:linear-gradient(150deg,#EAE4D9,#CFC5B4);
  box-shadow:0 0 0 1px var(--line);font:400 24px/1 var(--serif);color:rgba(26,25,23,.55)}
.sc-proof .pf-id{flex:1;min-width:0}
.sc-proof .pf-id h1{font:400 30px/1.1 var(--serif);letter-spacing:-.028em;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-proof .pf-id p{margin-top:4px;font:400 14px/1.3 var(--sans);color:var(--tx-2)}
.sc-proof .pf-copy{display:inline-grid;flex:none;padding:0 16px 1px 14px}
.sc-proof .pf-copy span{grid-area:1/1;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .2s var(--ease),transform .35s var(--spring)}
.sc-proof .pf-copy svg{width:15px;height:15px;flex:none}
.sc-proof .pf-copy .b{opacity:0;transform:translateY(5px)}
.sc-proof .pf-copy .b svg{color:var(--ok-deep)}
.sc-proof .pf-copy.done .a{opacity:0;transform:translateY(-5px)}
.sc-proof .pf-copy.done .b{opacity:1;transform:none}

.sc-proof .pf-level{display:flex;align-items:center;gap:18px;margin-top:20px;padding:16px 22px}
.sc-proof .pf-level .sp-ring circle{stroke-width:2.5}
.sc-proof .pf-level .sp-ring .tr{stroke:var(--sunk)}
/* at the very start of a level the arc has no length: hide it, or its round cap shows as a stray dot */
.sc-proof .pf-level .sp-ring[style$="--p:0"] .ar{opacity:0}
.sc-proof .pf-level .tx{flex:1;min-width:0}
.sc-proof .pf-level .lv{display:flex;align-items:center;gap:10px}
.sc-proof .pf-level .lv b{font:600 14px/1 var(--sans);color:var(--tx)}
.sc-proof .pf-level .lv span{display:inline-flex;align-items:center;height:22px;padding:0 8px 1px;border-radius:7px;background:var(--field);font:500 12px/1 var(--sans);color:var(--tx-2)}
.sc-proof .pf-level h2{margin-top:8px;font:400 14px/1.4 var(--sans);color:var(--tx)}
.sc-proof .pf-level .rv{display:flex;align-items:center;gap:6px;margin-top:8px;font:400 12px/1 var(--sans);color:var(--tx-3)}
.sc-proof .pf-level .rv svg{width:14px;height:14px;flex:none;color:var(--ok-deep)}

.sc-proof .pf-skills{margin-top:12px;padding:6px 8px 8px}
.sc-proof .pf-sk-head,.sc-proof .pf-sk{display:grid;grid-template-columns:minmax(0,1fr) 340px 224px;column-gap:40px;align-items:center;padding:0 14px}
.sc-proof .pf-sk-head{height:34px;font:400 12px/1 var(--sans);color:var(--tx-3)}
.sc-proof .pf-sk{height:44px;border-radius:12px;transition:background .2s var(--ease)}
.sc-proof .pf-sk:hover{background:var(--wash)}
.sc-proof .pf-sk .nm{min-width:0}
.sc-proof .pf-sk .nm b{display:block;font:500 14px/1.2 var(--sans);color:var(--tx)}
.sc-proof .pf-sk .pt{display:flex;align-items:center;gap:16px}
.sc-proof .pf-sk .bar{flex:1;height:6px;border-radius:99px;background:var(--field);overflow:hidden}
.sc-proof .pf-sk .bar i{display:block;width:0;height:100%;border-radius:99px;background:#E3A62B;transition:width 1.1s var(--out)}
.sc-proof .pf-sk .pt b{flex:none;width:46px;text-align:right;font:500 14px/1 var(--sans);font-variant-numeric:tabular-nums;color:var(--tx)}
.sc-proof .pf-sk .by{display:flex;align-items:center;gap:4px}
.sc-proof .pf-sk .by em{font:400 12px/1 var(--sans);font-style:normal;color:var(--tx-4)}

.sc-proof .pf-sec{display:flex;align-items:baseline;gap:8px;margin:24px 2px 10px}
.sc-proof .pf-sec b{font:600 14px/1.3 var(--sans);color:var(--tx)}
.sc-proof .pf-sec span{font:400 12px/1.3 var(--sans);color:var(--tx-3)}
.sc-proof .pf-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sc-proof .pf-proj{display:flex;align-items:center;gap:12px;height:68px;padding:0 16px 0 14px;border-radius:18px;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh1)}
.sc-proof .pf-proj .tx{flex:1;min-width:0}
.sc-proof .pf-proj h3{font:500 14px/1.25 var(--sans);color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-proof .pf-proj p{margin-top:3px;font:400 12px/1.3 var(--sans);color:var(--tx-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-proof .pf-proj.more{background:var(--wash);box-shadow:inset 0 0 0 1px var(--line)}
.sc-proof .pf-proj.more .lgs{display:flex}
.sc-proof .pf-proj.more .lgs .sp-lg{margin-left:-6px;box-shadow:0 0 0 2px var(--wash)}
.sc-proof .pf-proj.more .lgs .sp-lg:first-child{margin-left:0}
.sc-proof .pf-proj.more b{font:500 14px/1 var(--sans);color:var(--tx-2)}
.sc-proof .pf-empty{padding:20px 22px;border-radius:18px;background:var(--sunk);font:400 14px/1.45 var(--sans);color:var(--tx-2)}

/* ================= 3 · dreamapply ================= */
.sc-dreamapply .da-scroll{position:absolute;left:386px;top:70px;width:828px;height:770px;overflow-y:auto;overscroll-behavior:contain;padding:26px 24px 0;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 20px,#000 calc(100% - 20px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 20px,#000 calc(100% - 20px),transparent 100%)}
.sc-dreamapply .da-col{padding-bottom:32px}
.sc-dreamapply .da-card{padding:28px;border-radius:24px;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh2)}

/* the match ring, as the job portal draws it */
.sc-dreamapply .lt-match{position:relative;flex:none;display:grid;place-items:center}
.sc-dreamapply .lt-match svg{position:absolute;inset:0;width:100%;height:100%}
.sc-dreamapply .lt-match circle{fill:none;stroke-width:3.5}
.sc-dreamapply .lt-match .tr{stroke:var(--line)}
.sc-dreamapply .lt-match .ar{stroke:var(--ok-deep);stroke-linecap:round}
.sc-dreamapply .lt-match b{position:relative;font:600 13px/1 var(--sans);letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--tx)}

.sc-dreamapply .da-hero{display:flex;align-items:center;gap:16px}
.sc-dreamapply .da-id{flex:1;min-width:0}
.sc-dreamapply .da-t{display:flex;align-items:center;gap:12px}
.sc-dreamapply .da-t h1{min-width:0;font:400 32px/1.1 var(--serif);letter-spacing:-.028em;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-dreamapply .da-tag{flex:none;display:flex;margin-top:3px}
.sc-dreamapply .da-id p{margin-top:5px;font:400 13px/1.3 var(--sans);color:var(--tx-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-dreamapply .da-st,.sc-dreamapply .da-role .s{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px 1px;border-radius:8px;background:var(--field);
  font:500 12px/1 var(--sans);color:var(--tx-2);white-space:nowrap}
.sc-dreamapply .da-st svg,.sc-dreamapply .da-role .s svg{width:12px;height:12px;flex:none}
.sc-dreamapply .da-st.open,.sc-dreamapply .da-role .s.open{background:#E9F6EE;color:var(--ok-deep)}
.sc-dreamapply .da-st i,.sc-dreamapply .da-role .s i{width:6px;height:6px;border-radius:50%;background:var(--ok-deep)}
.sc-dreamapply .da-match{flex:none;display:flex;align-items:center;gap:12px}
.sc-dreamapply .da-match em{display:block;font:400 12px/1 var(--sans);font-style:normal;color:var(--tx-3)}
.sc-dreamapply .da-match span b{display:block;margin-top:5px;font:500 13px/1 var(--sans);color:var(--tx)}
.sc-dreamapply .da-say{margin-top:22px;font:400 15px/1.45 var(--sans);color:var(--tx)}

.sc-dreamapply .da-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.sc-dreamapply .da-tile{padding:16px 16px 18px;border-radius:16px;background:var(--wash);box-shadow:inset 0 0 0 1px var(--line-2)}
.sc-dreamapply .da-tile h3{font:500 13px/1.2 var(--sans);color:var(--tx-3)}
.sc-dreamapply .da-tile ol,.sc-dreamapply .da-tile ul{list-style:none;display:flex;flex-direction:column;gap:14px;margin-top:14px}
.sc-dreamapply .da-tile li{display:flex;align-items:flex-start;gap:12px}
.sc-dreamapply .da-tile li .tx{flex:1;min-width:0}
.sc-dreamapply .da-tile li .tx b{display:block;font:500 15px/1.25 var(--sans);color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-dreamapply .da-tile li .tx>span{display:block;margin-top:3px;font:400 13px/1.4 var(--sans);color:var(--tx-2);text-wrap:pretty}
.sc-dreamapply .da-tile li .tx em{font-style:normal;color:var(--tx)}
.sc-dreamapply .da-cases .n{flex:none;width:12px;font:500 13px/36px var(--sans);font-variant-numeric:tabular-nums;color:var(--tx-3);text-align:center}
.sc-dreamapply .da-asks .ck{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--field);color:transparent}
.sc-dreamapply .da-asks .ck svg{width:11px;height:11px}
.sc-dreamapply .da-asks li.ok .ck{background:#E9F6EE;color:var(--ok-deep)}
.sc-dreamapply .da-tile .none{margin-top:14px;font:400 13px/1.4 var(--sans);color:var(--tx-2)}
/* "Let me read it first": both tiles open downwards together, so they stay one height */
.sc-dreamapply .da-x{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s var(--spring)}
.sc-dreamapply .da-x .in{min-height:0;overflow:hidden;opacity:0;transition:opacity .25s var(--ease)}
.sc-dreamapply .da-card.reading .da-x{grid-template-rows:1fr}
.sc-dreamapply .da-card.reading .da-x .in{opacity:1;transition:opacity .4s var(--ease) .14s}
.sc-dreamapply .da-x h3{padding-top:22px}
.sc-dreamapply .da-x .rest{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.sc-dreamapply .da-x p{margin-top:8px;font:400 13px/1.5 var(--sans);color:var(--tx-2);text-wrap:pretty}

.sc-dreamapply .da-top{display:flex;align-items:center;gap:16px;margin-top:12px;padding:14px 16px;border-radius:16px;background:var(--wash);box-shadow:inset 0 0 0 1px var(--line-2);
  cursor:pointer;outline:none;transition:background .2s var(--ease)}
.sc-dreamapply .da-top:hover{background:var(--field)}
.sc-dreamapply .da-top:focus-visible{box-shadow:inset 0 0 0 1.5px var(--ink)}
.sc-dreamapply .da-top .tx{flex:1;min-width:0}
.sc-dreamapply .da-top .tx b{display:block;font:500 15px/1.2 var(--sans);color:var(--tx)}
.sc-dreamapply .da-top .tx span{display:block;margin-top:3px;font:400 13px/1.3 var(--sans);color:var(--tx-2)}
.sc-dreamapply .da-sw{flex:none;position:relative;width:40px;height:24px;border-radius:99px;background:var(--tx-4);transition:background .25s var(--ease)}
.sc-dreamapply .da-sw::after{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .35s var(--spring)}
.sc-dreamapply .da-top[aria-checked="true"] .da-sw{background:var(--ink)}
.sc-dreamapply .da-top[aria-checked="true"] .da-sw::after{transform:translateX(16px)}
.sc-dreamapply .da-card.sent .da-top,.sc-dreamapply .da-card.busy .da-top{pointer-events:none}
.sc-dreamapply .da-card.sent .da-sw{opacity:.45}

.sc-dreamapply .da-foot{display:flex;align-items:center;gap:8px;margin-top:20px}
.sc-dreamapply .da-quiet{flex:1;min-width:0;display:grid}
.sc-dreamapply .da-quiet span{grid-area:1/1;align-self:center;font:400 13px/1.3 var(--sans);color:var(--tx-3);transition:opacity .25s var(--ease),transform .4s var(--spring)}
.sc-dreamapply .da-quiet .s{display:flex;align-items:center;gap:9px;font-size:15px;color:var(--tx);opacity:0;transform:translateY(5px)}
.sc-dreamapply .da-quiet .s svg{flex:none;width:20px;height:20px;padding:4.5px;border-radius:50%;background:#E9F6EE;color:var(--ok-deep)}
.sc-dreamapply .da-card.sent .da-quiet .q{opacity:0;transform:translateY(-5px)}
.sc-dreamapply .da-card.sent .da-quiet .s{opacity:1;transform:none;transition-delay:.1s}
.sc-dreamapply .da-card.sent .da-read{display:none}
.sc-dreamapply .da-read{padding:0 20px 1px}
.sc-dreamapply .da-apply{min-width:160px;margin-right:1px}
.sc-dreamapply .da-apply[disabled]{opacity:1}
.sc-dreamapply .da-apply[disabled] span{opacity:.6}
.sc-dreamapply .da-watching{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 20px 1px 16px;border-radius:15px;background:var(--field);font:500 15px/1 var(--sans);letter-spacing:-.014em;color:var(--tx-2)}
.sc-dreamapply .da-watching svg{width:16px;height:16px;flex:none}

/* the day there is no opening: what is open at this level */
.sc-dreamapply .da-sec{display:flex;align-items:baseline;justify-content:space-between;margin:32px 0 12px}
.sc-dreamapply .da-sec b{font:600 15px/1.3 var(--sans);color:var(--tx)}
.sc-dreamapply .da-sec span{font:400 13px/1.3 var(--sans);color:var(--tx-3)}
.sc-dreamapply .da-near{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sc-dreamapply .da-role{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:16px 16px 18px;border-radius:20px;background:var(--card);
  box-shadow:0 0 0 1px var(--line),var(--sh1);transition:box-shadow .25s var(--ease),transform .35s var(--spring)}
.sc-dreamapply .da-role:hover{box-shadow:0 0 0 1px rgba(26,25,23,.16),var(--sh2);transform:translateY(-2px)}
.sc-dreamapply .da-role:active{transform:none}
.sc-dreamapply .da-role .top{align-self:stretch;display:flex;align-items:center;justify-content:space-between}
.sc-dreamapply .da-role>b{margin-top:14px;font:500 15px/1.25 var(--sans);color:var(--tx)}
.sc-dreamapply .da-role .m{margin-top:3px;font:400 13px/1.3 var(--sans);color:var(--tx-3)}
.sc-dreamapply .da-role .s{margin-top:14px}
.sc-dreamapply .da-after{display:flex;justify-content:flex-end;margin-top:16px;padding-right:1px}

/* ================= 4 · offer: the letter ================= */
/* a sheet of paper and, beside it, the answer. The two are centred as one thing. */
.sc-offer .ol-wrap{position:absolute;left:124px;right:124px;top:92px;bottom:24px;display:flex;align-items:center;justify-content:center;gap:72px}
.sc-offer .ol-sheet{flex:none;width:648px;padding:44px 56px 40px;border-radius:3px;background:#fff;
  box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(26,25,23,.05),0 30px 60px -34px rgba(26,25,23,.34);
  animation:lt-sheet .9s var(--spring) .12s backwards}
@keyframes lt-sheet{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.sc-offer .ol-head{display:flex;align-items:center;justify-content:space-between}
.sc-offer .ol-head .ol-mark{display:block}
.sc-offer .ol-head span{font:400 13px/1 var(--sans);color:var(--tx-3)}
.sc-offer .ol-body{margin-top:36px}
.sc-offer .ol-body p,.sc-offer .ol-sign p{font:400 16px/25px var(--serif);letter-spacing:-.008em;color:var(--tx);text-wrap:pretty}
.sc-offer .ol-body p+p{margin-top:12px}
.sc-offer .ol-terms{margin-top:22px;padding:8px 20px;border-radius:10px;background:var(--wash);box-shadow:inset 0 0 0 1px var(--line-2)}
.sc-offer .ol-terms div{display:grid;grid-template-columns:132px minmax(0,1fr);align-items:center;height:30px}
.sc-offer .ol-terms dt{font:400 13px/1 var(--sans);color:var(--tx-3)}
.sc-offer .ol-terms dd{font:500 15px/1 var(--sans);color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-offer .ol-sign{margin-top:22px}
.sc-offer .ol-sign svg{display:block;width:150px;height:40px;margin:4px 0 6px -4px;color:#22211E}
/* the name is signed once, after the sheet has landed. If the animation never runs, it is simply signed. */
.sc-offer .ol-sign path{stroke-dasharray:1;animation:lt-sign .9s cubic-bezier(.45,.05,.3,1) 1.05s backwards}
.sc-offer .ol-sign path+path{animation-duration:.8s;animation-delay:1.9s}
@keyframes lt-sign{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.sc-offer .ol-sign b{display:block;font:500 15px/20px var(--sans);color:var(--tx)}
.sc-offer .ol-sign span{display:block;font:400 13px/18px var(--sans);color:var(--tx-3)}

.sc-offer .ol-side{flex:none;width:340px}
.sc-offer .ol-side h1{font:400 36px/1.1 var(--serif);letter-spacing:-.028em;color:var(--tx);text-wrap:balance}
.sc-offer .ol-turn{display:grid;margin-top:16px}
.sc-offer .ol-ask,.sc-offer .ol-said{grid-area:1/1;align-self:start;transition:opacity .25s var(--ease),transform .45s var(--spring)}
.sc-offer .ol-say{font:400 15px/1.5 var(--sans);color:var(--tx-2);text-wrap:pretty}
.sc-offer .ol-say b{font-weight:500;color:var(--tx)}
.sc-offer .ol-say span{white-space:nowrap}
.sc-offer .ol-acts{display:flex;flex-direction:column;gap:8px;margin-top:28px}
.sc-offer .ol-acts .sp-key{width:100%}
.sc-offer .ol-acts div{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sc-offer .ol-acts .sp-ghost{padding:0 12px 1px}
.sc-offer .ol-said{opacity:0;transform:translateY(8px);pointer-events:none}
.sc-offer .ol-side[data-said] .ol-ask{opacity:0;transform:translateY(-8px);pointer-events:none}
.sc-offer .ol-side[data-said] .ol-said{opacity:1;transform:none;pointer-events:auto;transition-delay:.16s}
.sc-offer .ol-said p{display:flex;align-items:flex-start;gap:12px;font:400 15px/1.5 var(--sans);color:var(--tx-2);text-wrap:pretty}
.sc-offer .ol-said p b{font-weight:500;color:var(--tx)}
.sc-offer .ol-said .mk{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--tx-2)}
.sc-offer .ol-said .mk svg{width:12px;height:12px}
.sc-offer .ol-said button{width:100%;margin-top:28px;padding-bottom:1px}

/* ================= 5 · hired ================= */
/* the one warm moment: a soft gold light comes up behind the panel once, and stays */
.sc-hired .hi-light{position:absolute;left:210px;top:10px;width:1180px;height:820px;border-radius:50%;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(closest-side,rgba(255,213,107,.34),rgba(255,213,107,.14) 48%,rgba(255,213,107,0) 100%);animation:lt-light 2.6s var(--out) .5s backwards}
@keyframes lt-light{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
.sc-hired .hi-panel{position:absolute;left:490px;top:150px;width:620px;padding:40px 12px 12px;display:flex;flex-direction:column;align-items:center;text-align:center}
.sc-hired .hi-panel h1{margin-top:22px}
.sc-hired .hi-role{margin-top:10px;font:400 15px/1.45 var(--sans);color:var(--tx-2)}

/* screens/loop.js */
/* ZERO skill path · the loop around one scenario.
   System 1, Scenarios, in story order:
     pick      two scenarios open, the learner picks one
     kickoff   the manager gives the brief, the learner takes the note
     pop       say it back: the learner answers by voice
     earn      the workspace: one chat with the manager, a stage graded, the coach after the fact
     present   the learner presents to the team and takes a question
     review    the scenario, graded: one result, then what it paid by skill
   System 2, the level up that crosses over:
     levelup   the level, the roles it opens, and what the next level holds
   Kept working from earlier rounds, outside the systems sites: applyask, whenback.
   Every number is read from SP_DATA. Each screen draws from api.state alone, and takes
   opts.instant to land on its final state with no motion. */
(function () {
  'use strict';

  var WORDS = ['No', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten'];
  function word(n) { return WORDS[n] || String(n); }
  function all(el, s) { return Array.prototype.slice.call(el.querySelectorAll(s)); }
  function plural(n, one, many) { return n === 1 ? one : many; }
  function list(a) { return a.length < 3 ? a.join(' and ') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]; }
  function uniq(a) { return a.filter(function (x, i) { return a.indexOf(x) === i; }); }

  /* a step or a screen that is not in this build is skipped quietly */
  function known(id) { return (window.SP.steps || []).some(function (s) { return s.id === id || s.screen === id; }); }
  function go(api, id) { if (known(id)) api.go(id); }
  function show(api, id) { if (known(id)) api.show(id); }

  /* a number that counts to its value. It stops by itself if the screen has gone. */
  function count(el, from, to, ms, fmt, pre) {
    var t0 = null;
    function f(t) {
      if (!el.isConnected) return;
      if (t0 === null) t0 = t;
      var k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3);
      el.textContent = (pre || '') + fmt(from + (to - from) * e);
      if (k < 1) requestAnimationFrame(f);

    requestAnimationFrame(f);
  }

  /* things marked data-in="ms" take their place in that order */
  function arrive(root, api, instant) {
    all(root, '[data-in]').forEach(function (el) {
      if (instant) { el.classList.add('is-in'); return; }
      api.later(140 + (+el.getAttribute('data-in') || 0), function () { el.classList.add('is-in'); });
    });
  }

     System 1 · Scenarios. One scenario, from the pick to the review.
     Calm on purpose: one serif title, labels and numbers, and the person in the middle.
     ================================================================ */
  /* The people of scenario 1. Navid is the manager, as in the first-run tour; two teammates from the cast. Stand-ins. */
  var MANAGER = { name: 'Navid', title: 'Your manager', photo: 'img/navid-face.jpg' };
  var TEAM = [{ name: 'Avery Kim', title: 'Sales lead', photo: 'img/cast-avery.jpg' }, { name: 'Jordan Lee', title: 'RevOps lead', photo: 'img/cast-jordan.jpg' }];

    note: '1,200 leads a month. 26 hours to reply. Get it under 2 minutes.' };

        }).join('') +
        '<div class="ko-brief" data-in="120">' +
          '<div class="ko-proj">' + api.logo(sc.co, 36) + '<span><b>' + esc(sc.title) + '</b><em>' + esc(D.CO[sc.co]) + '</em></span></div>' +
          '<h1 class="ko-nums">' + BRIEF.nums.map(function (n, i) { return '<span class="ko-num' + (i === 2 ? ' is-goal' : '') + '"><b>' + esc(n[0]) + '</b><em>' + esc(n[1]) + '</em></span>'; }).join('') + '</h1>' +

/* ZERO · System 3, Jobs. Four tabs, nothing else.

   Inbox         the recruiters write here. An interview invite is a card you answer in the thread.
