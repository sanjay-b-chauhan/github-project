<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Zero · levels · b4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,100..1000&display=swap">
<link rel="stylesheet" href="zero-level-system-assets-b4/journey.css">
</head>
<body>
<div class="app">

  <header class="bar">
    <img class="wm" src="zero-level-system-assets-b4/zero-wordmark.svg" alt="zero">
    <span class="tag">b4</span>
    <div class="cases" id="cases"></div>
    <div class="ctl">
      <button class="ib" id="play" aria-label="Play or pause"></button>
      <button class="ib" id="again" aria-label="Start over"></button>
      <button class="tb" id="speed" aria-label="Speed">1x</button>
      <span class="csw">Coach<button class="tog" id="coachSw" role="switch" aria-label="Coach on or off"></button></span>
      <button class="tb" id="tune" aria-expanded="false">Rules</button>
    </div>
  </header>

  <main class="stage" id="stage">

    <!-- what she is working on -->
    <section class="side in" id="inCard">
      <span class="sno" id="scNo"></span>
      <div class="sct"><span id="scLogo"></span><div><b id="scTitle"></b><span id="scCo"></span></div></div>
      <div class="bandrow"><span class="bm" id="bm"></span><b id="bandName"></b></div>
      <div class="gain"><b id="gain"></b><span id="gainNote"></span></div>
    </section>

    <!-- her -->
    <section class="me">
      <div class="coach" id="coach">
        <span class="cl0">Coach</span>
        <p id="coachLine"></p>
        <div class="cms" id="coachMeters"></div>
        <p class="tip" id="coachTip"></p>
      </div>
      <div class="ringwrap">
        <svg id="ring" viewBox="0 0 300 300" aria-hidden="true"></svg>
        <img src="zero-level-system-assets-b4/maya.jpg" alt="Maya Reyes">
      </div>
      <b class="lv" id="lvNow"></b>
      <span class="pt" id="ptNow"></span>
      <div class="motv"><span>Motivation</span><span class="mbar" id="motBar"></span><b id="motNow"></b></div>
    </section>

    <!-- what her level opens -->
    <section class="side out">
      <div class="oh"><b>Job portal</b><span id="jobCount"></span></div>
      <div id="tiles"></div>
    </section>
  </main>

  <footer class="time">
    <div class="sum" id="sum"></div>
    <div class="tl" id="tl">
      <div id="dots"></div>
      <span class="ml">Motivation</span>
      <svg id="moSvg" aria-hidden="true"></svg>
    </div>
  </footer>

  <div class="tune" id="tunePanel" hidden>
    <div class="th"><b>What a scenario pays</b><button class="tb" id="reset">Reset</button></div>
    <div id="payRows"></div>
    <div class="th"><b>Where jobs open</b></div>
    <div id="gateRows"></div>
    <div class="sw"><span>Weaker work stops at a gate</span><button class="tog" id="hold" role="switch" aria-label="Weaker work stops at a gate"></button></div>
    <div class="th"><b>The coach</b></div>
    <div id="coachRules"></div>
  </div>
</div>
<script src="zero-level-system-assets-b4/engine.js"></script>
<script src="zero-level-system-assets-b4/journey.js"></script>
</body>
</html>
