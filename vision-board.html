<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Vision Board</title>
<meta name="description" content="Say what you want. Watch it land on the mat." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.simpleicons.org">
<link rel="preconnect" href="https://upload.wikimedia.org">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f0e8; --panel:#ffffff;
  --ink:#16281d; --ink-2:rgba(22,40,29,.62); --ink-3:rgba(22,40,29,.34); --line:rgba(22,40,29,.13);
  --mat:#2f9268;
  --sun:#ffd84d; --lime:#c9f24f; --sky:#8ecdff; --lilac:#c9b8ff; --coral:#ff9e7d; --mint:#8fe3c0; --pink:#ffb3d1;
  --thread:#e0473a;
  --sh-rest:0 2px 3px rgba(5,20,11,.38), 0 10px 18px rgba(5,20,11,.22);
  --sh-lift:0 5px 8px rgba(5,20,11,.28), 0 26px 40px rgba(5,20,11,.30);
  --sh-ui:0 2px 3px rgba(5,20,11,.22), 0 8px 14px rgba(5,20,11,.14);
  --drop-rest:drop-shadow(0 2px 2px rgba(5,20,11,.38)) drop-shadow(0 9px 13px rgba(5,20,11,.24));
  --drop-lift:drop-shadow(0 4px 6px rgba(5,20,11,.26)) drop-shadow(0 22px 30px rgba(5,20,11,.3));
  --ease:cubic-bezier(.22,1,.36,1); --stroke:3px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font-family:Nunito,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
::selection{background:var(--sun)}
.shell{display:grid;grid-template-columns:420px 1fr;height:100vh;height:100dvh}

/* ══════════ left panel ══════════ */
.dock{position:relative;z-index:6;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);border-right:1.5px solid var(--line)}
.dock-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:26px 24px 16px;scrollbar-width:thin;scrollbar-color:rgba(22,40,29,.2) transparent}
.dock-scroll::-webkit-scrollbar{width:7px}
.dock-scroll::-webkit-scrollbar-thumb{background:rgba(22,40,29,.16);border-radius:99px}

.brand{display:flex;align-items:center;gap:11px;margin-bottom:20px}
.brand-mark{width:38px;height:38px;flex:none;border-radius:13px;background:var(--sun);border:3px solid #fff;display:grid;place-items:center;box-shadow:var(--sh-ui);transform:rotate(-5deg)}
.brand-mark svg{width:18px;height:18px}
.brand-name{font-family:Fredoka,sans-serif;font-weight:600;font-size:19px;line-height:1}
.brand-sub{font-size:11px;font-weight:700;color:var(--ink-3);margin-top:3px}

.roll{width:100%;position:relative;overflow:hidden;padding:14px 16px;border:3px solid #fff;border-radius:16px;cursor:pointer;
  font-family:Fredoka,sans-serif;font-weight:600;font-size:14.5px;background:var(--ink);color:#fff;box-shadow:var(--sh-ui);
  display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.roll:hover{transform:translateY(-3px);box-shadow:0 14px 22px rgba(5,20,11,.28)}
.roll:active{transform:translateY(0)}
.roll svg{width:21px;height:21px}
.bshine{position:absolute;top:-30%;bottom:-30%;width:42%;left:-70%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);pointer-events:none;transform:rotate(8deg)}

.nameask{margin:20px 0 6px;position:relative}
.nameask label{display:block;font-family:Fredoka,sans-serif;font-weight:500;font-size:12.5px;color:var(--ink-2);margin:0 0 6px 4px}
.nameask label b{font-weight:600;color:var(--ink)}
.nameask input{width:100%;padding:14px 44px 14px 16px;background:var(--panel);border:2.5px solid rgba(22,40,29,.14);border-radius:16px;
  color:var(--ink);font-family:Fredoka,sans-serif;font-weight:600;font-size:17px;outline:none;
  transition:border-color .25s var(--ease),box-shadow .25s var(--ease)}
.nameask input::placeholder{color:var(--ink-3);font-weight:400}
.nameask input:focus{border-color:var(--ink);box-shadow:var(--sh-ui)}
.nameask .tick{position:absolute;right:14px;bottom:15px;width:20px;height:20px;border-radius:50%;background:var(--ink);display:grid;place-items:center;opacity:0;transform:scale(.4)}
.nameask .tick svg{width:11px;height:11px}

.sechead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:24px 2px 11px}
.sechead.more{margin-top:26px;padding-top:20px;border-top:2px dashed var(--line)}
.sechead .lh{font-family:Fredoka,sans-serif;font-weight:600;font-size:15px;color:var(--ink)}
.sechead .lh i{font-style:normal;color:var(--ink-3);font-weight:500;margin-left:5px}
.sechead .sub{font-size:11.5px;font-weight:600;color:var(--ink-3);margin-top:2px}
/* a basic row wears its type as a fixed chip — no picker, nothing to decide */
.row .fixed{flex:none;display:inline-flex;align-items:center;gap:6px;width:112px;padding:8px 10px;border-radius:10px;
  background:rgba(22,40,29,.06);font-family:Fredoka,sans-serif;font-weight:600;font-size:12.5px;color:var(--ink)}
.row .more-btn{flex:none;width:28px;height:28px;border-radius:9px;border:0;background:rgba(22,40,29,.06);color:var(--ink-2);
  font-family:Nunito,sans-serif;font-weight:800;font-size:16px;line-height:1;cursor:pointer;display:grid;place-items:center;transition:.18s}
.row .more-btn:hover{background:var(--sun);color:var(--ink)}
/* always sits directly under the last field, so there is no scrolling back up */
.addrow{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:9px;
  padding:13px 16px;border-radius:14px;border:2px dashed rgba(22,40,29,.26);background:transparent;
  color:var(--ink-2);font-family:Fredoka,sans-serif;font-weight:600;font-size:13.5px;cursor:pointer;
  transition:border-color .2s var(--ease),color .2s var(--ease),background .2s var(--ease)}
.addrow:hover{border-color:var(--ink);color:var(--ink);background:rgba(255,216,77,.24)}
.addrow svg{width:15px;height:15px}

.rows{display:flex;flex-direction:column;gap:9px}
.row{display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid rgba(22,40,29,.12);
  border-left:6px solid var(--rowc,#ddd);border-radius:14px;padding:7px 8px 7px 10px;
  transition:border-color .2s var(--ease),box-shadow .2s var(--ease),transform .2s var(--ease)}
.row:focus-within{border-color:rgba(22,40,29,.34);border-left-color:var(--rowc,#ddd);box-shadow:var(--sh-ui)}
.row .sel{position:relative;flex:none}
.row select{appearance:none;-webkit-appearance:none;border:0;outline:none;cursor:pointer;
  background:rgba(22,40,29,.06);border-radius:10px;padding:8px 24px 8px 10px;
  font-family:Fredoka,sans-serif;font-weight:600;font-size:12.5px;color:var(--ink);width:112px}
.row select:hover{background:rgba(22,40,29,.11)}
.row .sel:after{content:'';position:absolute;right:9px;top:50%;margin-top:-2px;width:0;height:0;pointer-events:none;
  border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--ink-3)}
.row input{flex:1;min-width:0;border:0;outline:none;background:none;color:var(--ink);
  font-family:Fredoka,sans-serif;font-weight:500;font-size:14px;padding:8px 4px}
.row input::placeholder{color:var(--ink-3);font-weight:400}
.row input.lbl{flex:0 0 34%;font-weight:600}
.row .div{width:1.5px;height:20px;background:var(--line);flex:none}
.row .rx{flex:none;width:28px;height:28px;border-radius:9px;border:0;background:rgba(22,40,29,.06);color:var(--ink-2);
  font-family:Nunito,sans-serif;font-weight:800;font-size:15px;line-height:1;cursor:pointer;display:grid;place-items:center;transition:.18s}
.row .rx:hover{background:var(--thread);color:#fff}
.row .glyphs{display:flex;gap:5px;flex:1;flex-wrap:wrap}
.row .glyphs button{width:30px;height:30px;border-radius:9px;border:2px solid transparent;background:rgba(22,40,29,.06);
  font-size:15px;line-height:1;cursor:pointer;display:grid;place-items:center;transition:.18s}
.row .glyphs button:hover{background:rgba(22,40,29,.13)}
.row .glyphs button.on{background:var(--lilac);border-color:var(--ink)}

.emptyrow{padding:22px 16px;text-align:center;border:2px dashed var(--line);border-radius:14px;
  font-family:Fredoka,sans-serif;font-weight:500;font-size:13px;color:var(--ink-3);line-height:1.5}

.dock-foot{padding:14px 24px;border-top:1.5px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.count{font-size:12.5px;color:var(--ink-2);font-weight:700}
.count b{color:var(--ink);font-weight:800}
.wipe{background:none;border:0;color:var(--thread);font-family:Fredoka,sans-serif;font-weight:500;font-size:12.5px;cursor:pointer;padding:6px 10px;border-radius:10px;transition:.2s}
.wipe:hover{background:rgba(224,71,58,.1)}

/* ══════════ the mat ══════════ */
.board{position:relative;overflow:hidden;background:var(--bg);padding:22px}
.mat{position:absolute;inset:22px;border-radius:14px;overflow:hidden;background:var(--mat);box-shadow:0 10px 30px rgba(14,38,24,.16)}
#matSvg{position:absolute;inset:0;width:100%;height:100%;display:block}
.board-top{position:absolute;left:54px;right:54px;top:46px;z-index:7;display:flex;align-items:flex-start;justify-content:space-between;gap:22px;pointer-events:none}
.tw{display:inline-block;font-family:Fredoka,sans-serif;font-weight:600;line-height:1.05;border:3px solid #fff;border-radius:15px;
  padding:7px 14px 9px;box-shadow:var(--sh-rest);background:#fff;color:var(--ink);font-size:17px;transform:rotate(-1.3deg)}
.controls{display:flex;align-items:flex-start;gap:9px;pointer-events:auto}
.pillrow{display:flex;gap:9px;justify-content:flex-end;transition:opacity .3s var(--ease),transform .35s var(--ease)}
.pillrow.hidden{opacity:0;transform:translateY(-10px) scale(.96);pointer-events:none}
.ibtn{position:relative;flex:none;width:40px;height:40px;border-radius:50%;border:3px solid #fff;background:rgba(255,255,255,.16);
  color:#fff;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(6px);
  transition:transform .22s var(--ease),background .22s,box-shadow .22s var(--ease),color .22s}
.ibtn svg{width:19px;height:19px}
.ibtn:hover{transform:translateY(-2px);background:rgba(255,255,255,.34);box-shadow:var(--sh-ui)}
.ibtn.on,.ibtn.off{background:#fff;color:var(--ink);box-shadow:var(--sh-rest)}
.ibtn.spin svg{animation:eyespin .8s linear infinite}
@keyframes eyespin{to{transform:rotate(360deg)}}
.ibtn:after{content:attr(data-tip);position:absolute;top:48px;left:50%;transform:translateX(-50%) translateY(-4px);
  background:var(--ink);color:#fff;font-family:Fredoka,sans-serif;font-weight:500;font-size:11.5px;padding:5px 10px;border-radius:9px;
  white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s var(--ease),transform .2s var(--ease);box-shadow:var(--sh-ui)}
.ibtn:hover:after{opacity:1;transform:translateX(-50%) translateY(0)}

.stage{position:absolute;inset:22px;z-index:5;overflow:hidden;border-radius:14px}
.plane{position:absolute;inset:0}
#threads{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible}
#threads .rope{fill:none;stroke:var(--thread);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(2px 3px 0 rgba(5,20,11,.28));transition:opacity .3s var(--ease),stroke-width .3s var(--ease)}
#threads .rope.cold{opacity:.14}
#threads .rope.hot{stroke-width:4;opacity:1}
#threads .spark{fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;opacity:0;
  stroke-dasharray:18 260;pointer-events:none}
#threads .spark.on{opacity:.95;animation:travel 1.15s linear infinite}
@keyframes travel{from{stroke-dashoffset:278}to{stroke-dashoffset:0}}
#threads .knot{fill:var(--thread);stroke:#fff;stroke-width:2.6;filter:drop-shadow(2px 3px 0 rgba(5,20,11,.26));transition:opacity .3s var(--ease)}
#threads .knot.cold{opacity:.16}
.piece.faded{opacity:.34;filter:saturate(.5)}
.piece{transition:box-shadow .28s var(--ease),opacity .3s var(--ease),filter .3s var(--ease)}

/* ══════════ pieces ══════════ */
.piece{position:absolute;z-index:5;cursor:grab;user-select:none;will-change:transform;
  border:var(--stroke) solid #fff;border-radius:20px;box-shadow:var(--sh-rest);transition:box-shadow .28s var(--ease)}
.piece:hover,.piece.dragging{box-shadow:var(--sh-lift)}
.piece.dragging{cursor:grabbing;z-index:60}
.piece .sheen{position:absolute;inset:0;border-radius:17px;overflow:hidden;pointer-events:none}
.piece .sheen i{position:absolute;top:-60%;bottom:-60%;width:46%;left:-90%;display:block;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:rotate(9deg)}

.p-name{background:none;border:0;box-shadow:none;border-radius:0;padding:6px 10px;
  font-family:Fredoka,sans-serif;font-weight:700;font-size:clamp(38px,4.4vw,68px);line-height:.98;letter-spacing:-.02em;
  color:var(--ink);text-align:center;max-width:min(560px,42vw);
  text-shadow:-3px -3px 0 #fff,3px -3px 0 #fff,-3px 3px 0 #fff,3px 3px 0 #fff,-4px 0 0 #fff,4px 0 0 #fff,0 -4px 0 #fff,0 4px 0 #fff,6px 8px 0 rgba(5,20,11,.34)}
@supports (paint-order: stroke){
  .p-name{-webkit-text-stroke:8px #fff;paint-order:stroke fill;text-shadow:none;filter:var(--drop-rest)}
  .p-name:hover,.p-name.dragging{filter:var(--drop-lift)}
}
.p-name:hover,.p-name.dragging{box-shadow:none}

.p-role{background:var(--sun);padding:12px 22px 13px 17px;font-family:Fredoka,sans-serif;font-weight:600;font-size:21px;
  color:var(--ink);border-radius:99px;display:flex;align-items:center;gap:11px}
.p-role .sheen{border-radius:99px}
.p-role .bag{flex:none;width:32px;height:32px;border-radius:50%;background:rgba(22,40,29,.14);display:grid;place-items:center}
.p-role .bag svg{width:17px;height:17px;color:var(--ink)}
.p-tag{padding:10px 18px;border-radius:99px;font-family:Fredoka,sans-serif;font-weight:600;font-size:15px;color:var(--ink);background:var(--tone,var(--lime))}
.p-tag .sheen{border-radius:99px}

.p-co{background:#fff;padding:13px 17px 14px;display:flex;align-items:center;gap:12px}
.p-co .logo{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;background:#f4f2ec;overflow:hidden}
.p-co .logo svg{width:24px;height:24px;display:block}
.p-co .logo.mono{color:#fff;font-family:Fredoka,sans-serif;font-weight:600;font-size:16px}
.p-co .co-n{font-family:Fredoka,sans-serif;font-weight:600;font-size:18px;line-height:1.1;color:var(--ink);white-space:nowrap;max-width:170px;overflow:hidden;text-overflow:ellipsis}

.p-loc{background:#fff;padding:10px;width:224px}
.p-loc .mark{position:absolute;top:-19px;left:50%;margin-left:-17px;width:34px;height:38px;z-index:6;pointer-events:none}
.p-loc .mark svg{display:block;filter:drop-shadow(0 3px 3px rgba(5,20,11,.42))}
.p-loc .shot{position:relative;width:100%;height:134px;border-radius:13px;overflow:hidden;background:linear-gradient(150deg,#e2ebe5,#c9d9d0)}
.p-loc .shot img{width:100%;height:100%;object-fit:cover;display:block;opacity:0}
.p-loc .shot .fb{position:absolute;inset:0;display:grid;place-items:center;color:rgba(22,40,29,.28)}
.p-loc .shot .fb svg{width:36px;height:36px}
.p-loc .shot .shim{position:absolute;inset:0;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:translateX(-100%)}
.p-loc .cap{display:flex;align-items:center;padding:11px 4px 2px}
.p-loc .cap span{font-family:Fredoka,sans-serif;font-weight:600;font-size:16px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.p-vision{background:#fff;padding:19px 21px 21px;width:284px;font-family:Fredoka,sans-serif;font-weight:400;font-size:16.5px;line-height:1.42;color:var(--ink)}
.p-vision .q{display:block;font-size:36px;line-height:.5;color:var(--sun);margin-bottom:11px;font-weight:600}
.p-vision mark{background:linear-gradient(transparent 54%, var(--sun) 54%);color:inherit;padding:0 2px;border-radius:2px}

.p-cus{background:#fff;padding:14px 20px 16px;display:flex;flex-direction:column;gap:4px;min-width:132px;max-width:250px}
.p-cus .ck{font-family:Nunito,sans-serif;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.p-cus .cv{font-family:Fredoka,sans-serif;font-weight:600;font-size:22px;line-height:1.1;color:var(--ink);word-break:break-word}

.p-note{width:176px;min-height:148px;padding:16px 15px;border-radius:6px;font-family:Fredoka,sans-serif;font-weight:500;font-size:15px;line-height:1.34;color:#2a2410;word-break:break-word}
.p-note .sheen{border-radius:3px}
.p-note:after{content:'';position:absolute;right:-3px;bottom:-3px;width:30px;height:30px;background:linear-gradient(135deg,transparent 50%,rgba(0,0,0,.16) 50%);border-bottom-right-radius:6px}
.p-note.t0{background:var(--sun)} .p-note.t1{background:var(--mint)} .p-note.t2{background:var(--pink)} .p-note.t3{background:var(--sky)}

.p-stk{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:33px;background:#fff}
.p-stk .sheen{border-radius:50%}
.p-stk.s1{background:var(--sun)} .p-stk.s2{background:var(--mint)} .p-stk.s3{background:var(--lilac)} .p-stk.s4{background:var(--coral)}

.p-prop{border:0;box-shadow:none;background:none;border-radius:0}
.p-prop:hover{box-shadow:none}
.p-prop svg{display:block;filter:var(--drop-rest)}
.p-prop:hover svg{filter:var(--drop-lift)}

.kill{position:absolute;top:-11px;right:-11px;width:26px;height:26px;border-radius:50%;z-index:9;border:3px solid #fff;
  background:var(--ink);color:#fff;font-size:13px;line-height:1;cursor:pointer;opacity:0;transform:scale(.4);
  display:grid;place-items:center;font-family:Nunito,sans-serif;font-weight:800;box-shadow:var(--sh-ui);
  transition:opacity .22s,transform .22s var(--ease),background .2s}
.piece:hover .kill{opacity:1;transform:scale(1)}
.kill:hover{background:var(--thread)}
.p-name .kill{top:2px;right:-6px}
body.exporting .kill{display:none}
/* html2canvas throws box-shadow away, so for the shot we paint the shadow as a
   real offset layer sitting behind each piece. Hard edge, exactly as on screen. */
body.exporting .piece:not(.p-prop):not(.p-name){box-shadow:none !important}
body.exporting .piece:not(.p-prop):not(.p-name):before{
  content:'';position:absolute;left:0;top:0;width:100%;height:100%;
  border-radius:inherit;background:rgba(5,20,11,.34);
  transform:translate(5px,7px);z-index:-1}
body.exporting .p-tag:before,body.exporting .p-role:before{border-radius:99px}
body.exporting .p-stk:before{border-radius:50%}
body.exporting .tw{position:relative}
body.exporting .tw:before{
  content:'';position:absolute;left:0;top:0;width:100%;height:100%;
  border-radius:inherit;background:rgba(5,20,11,.34);transform:translate(4px,6px);z-index:-1}
/* the picture is always landscape: if the live board is portrait we lay the
   mat out in a wide frame just for the shot, then put everything back */
body.shooting .shell{visibility:hidden}
body.shooting .board{visibility:visible;position:fixed !important;left:0;top:0;
  width:1500px !important;height:1200px !important;padding:22px !important;z-index:9999}

@media (max-width:1080px){
  .shell{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .dock{max-height:52vh;border-right:0;border-bottom:1.5px solid var(--line)}
  .board{padding:12px}
  .mat,.stage{inset:12px}
  .board-top{left:24px;right:24px;top:24px}
  .p-name{font-size:clamp(28px,7vw,44px);max-width:70vw;-webkit-text-stroke-width:6px}
}
</style>
</head>
<body>

<div class="shell">
  <aside class="dock">
    <div class="dock-scroll">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="#16281d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2 15 9l7 .6-5.3 4.6L18.3 21 12 17.3 5.7 21l1.6-6.8L2 9.6 9 9z"/></svg>
        </div>
        <div>
          <div class="brand-name">Vision Board</div>
          <div class="brand-sub">Say it, and watch it land</div>
        </div>
      </div>

      <button class="roll" id="dice" type="button">
        <span class="bshine"></span>
        <svg id="dieIcon" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

/* ═══════════════════════════════════════════════════════════
   SOUND — every note is synthesised, so there is nothing to load.
   The context only wakes on the first real gesture, which is also
   the only time a browser will let it make a noise.
   ═══════════════════════════════════════════════════════════ */
const Snd = (()=>{
  let ctx = null, master = null, on = true, lastHover = 0;
  function wake(){
    if(ctx) { if(ctx.state === 'suspended') ctx.resume(); return ctx; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.28;
    master.connect(ctx.destination);
    return ctx;
  }
  ['pointerdown','keydown'].forEach(ev=> window.addEventListener(ev, ()=>wake(), {once:false, passive:true}));

  function tone({freq=440, to=null, dur=.14, type='sine', gain=.5, delay=0, curve='exp'}){
    if(!on) return;
    const c = wake(); if(!c) return;
    const t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if(to) o.frequency.exponentialRampToValueAtTime(Math.max(40,to), t0+dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0+0.008);
    if(curve==='exp') g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    else g.gain.linearRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0+dur+0.02);
  }
  /* no noise generator on purpose — every burst of it read as a thud.
     the whole set is pitched tones now. */
  return {
    get on(){ return on; },
    toggle(){ on = !on; if(on){ wake(); tone({freq:660,to:990,dur:.12,type:'triangle',gain:.4}); } return on; },
    set(v){ on = !!v; },
    /* a soft paper thock as a piece meets the mat */
    /* the low thuds on settling and on pressing read as dull, so they are gone.
       release keeps a faint, high tick in the same family as the click. */
    land(){},
    grab(){},
    drop(){ tone({freq:940,to:1160,dur:.05,type:'sine',gain:.14}); },
    hover(){
      const now = performance.now();
      if(now - lastHover < 90) return;
      lastHover = now;
      tone({freq:1180,dur:.045,type:'sine',gain:.075});
    },
    click(){ tone({freq:880,to:1240,dur:.06,type:'triangle',gain:.3}); },
    add(){ tone({freq:600,to:900,dur:.09,type:'triangle',gain:.32}); tone({freq:900,to:1350,dur:.09,type:'sine',gain:.2,delay:.06}); },
    remove(){ tone({freq:760,to:430,dur:.09,type:'triangle',gain:.22}); },

    roll(){
      [0,1,2,3,4].forEach(i=> tone({freq:520+i*130, dur:.05, type:'triangle', gain:.17, delay:i*0.055}));

    },
    shutter(){ tone({freq:1500,to:1900,dur:.04,type:'sine',gain:.22}); tone({freq:1150,to:820,dur:.07,type:'sine',gain:.16,delay:.07}); },
    sweep(){ tone({freq:240,to:880,dur:.3,type:'sine',gain:.24}); }
  };
})();

function gridPattern(id, size, stroke, opacity, kind, weight){
  const w = weight || 1;
  if(kind === 'dots')
    return `<pattern id="${id}" width="${size}" height="${size}" patternUnits="userSpaceOnUse">
      <circle cx="${(size/2).toFixed(1)}" cy="${(size/2).toFixed(1)}" r="${(w*1.15).toFixed(2)}" fill="${stroke}" fill-opacity="${opacity}"/></pattern>`;
  if(kind === 'iso'){
    const h = (size*0.866).toFixed(2);
    return `<pattern id="${id}" width="${size}" height="${h}" patternUnits="userSpaceOnUse">
      <path d="M0 ${h} L${(size/2).toFixed(1)} 0 L${size} ${h} M${(size/2).toFixed(1)} 0 V${h}" fill="none" stroke="${stroke}" stroke-width="${w}" stroke-opacity="${opacity}"/></pattern>`;
  }
  const rot = kind === 'diagonal' ? ' patternTransform="rotate(45)"' : '';
  return `<pattern id="${id}" width="${size}" height="${size}" patternUnits="userSpaceOnUse"${rot}>
    <path d="M${size} 0 L0 0 0 ${size}" fill="none" stroke="${stroke}" stroke-width="${w}" stroke-opacity="${opacity}"/></pattern>`;

function drawMat(){

  propPin:`<svg width="34" height="38" viewBox="0 0 34 38" fill="none"><ellipse cx="17" cy="35" rx="3.4" ry="2" fill="rgba(0,0,0,.3)"/>
      <path d="M17 20v16" stroke="#8e1810" stroke-width="2.6" stroke-linecap="round"/><circle cx="17" cy="12" r="11" fill="#e0473a"/>
      <circle cx="17" cy="12" r="11" stroke="#fff" stroke-width="2.6"/><circle cx="13" cy="8" r="3.4" fill="#ff9d92"/></svg>`
};
const slugify = s => s.toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'');
const MONO = ['#ff9e7d','#8ecdff','#c9b8ff','#c9f24f','#ffd84d','#8fe3c0'];
const markCache = new Map();
function brandMark(slug){
  if(!slug) return Promise.resolve(null);
  if(markCache.has(slug)) return markCache.get(slug);
  const p = fetch('https://cdn.simpleicons.org/'+slug)
    .then(r => r.ok ? r.text() : null)
    .then(t => (!t || !/^\s*<svg[\s>]/i.test(t) || /<script/i.test(t)) ? null : t.replace('<svg ','<svg width="24" height="24" '))
    .catch(()=>null);
  markCache.set(slug,p); return p;
}
const photoCache = new Map();
function cityPhoto(city){
  const key = city.trim().toLowerCase();
  if(photoCache.has(key)) return photoCache.get(key);
  const p = (async ()=>{
    try{
      const u = 'https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=pageimages&pithumbsize=760&redirects=1&titles='+encodeURIComponent(city.trim());
      const r = await fetch(u); if(!r.ok) return null;
      const d = await r.json();
      const pages = d && d.query && d.query.pages; if(!pages) return null;
      const pg = Object.values(pages)[0];
      return (pg && pg.thumbnail && pg.thumbnail.source) || null;
    }catch(e){ return null; }
  })();
  photoCache.set(key,p); return p;
}
function highlight(t){
  const w = esc(t).split(' ');
  if(w.length<5) return w.join(' ');
  const a = Math.max(1,Math.floor(w.length*.36));
  const b = Math.min(w.length, a+Math.max(2,Math.round(w.length*.3)));
  return w.slice(0,a).join(' ')+' <mark>'+w.slice(a,b).join(' ')+'</mark> '+w.slice(b).join(' ');
}
const initials = s => { const p=s.trim().split(/\s+/); return ((p[0]||'?')[0]||'?').toUpperCase()+(p[1]?p[1][0].toUpperCase():''); };
const SHEEN = '<div class="sheen"><i></i></div>';
const KILL  = '<button class="kill" title="Take it off">×</button>';

/* ═══════════ what is on the mat ═══════════ */
function manifest(){
  const out = [];
  if(S.name.trim()) out.push({id:'name', type:'name', rot:-1.2});
  let tagIdx = 0;
  S.entries.forEach(en=>{
    if(!String(en.value||'').trim() && en.type!=='field') return;
    if(en.type==='field' && !String(en.value||'').trim() && !String(en.label||'').trim()) return;
    const it = {id:'e'+en.id, type:en.type, data:en, rot:en.rot};
    if(en.type==='tag') it.tone = TAG_TONES[tagIdx++ % TAG_TONES.length];
    out.push(it);
  });
  if(S.props) PROPS.forEach((p,i)=> out.push({id:'prop:'+i, type:'prop', data:p, full:p.f, rot:p.rot}));
  return out;
}
function markup(it){
  const v = it.data ? String(it.data.value||'') : '';
  switch(it.type){
    case 'name':    return {cls:'p-name',  html:KILL+esc(S.name.trim())};
    /* a role wears a briefcase so it never reads as just another tag */
    case 'role':    return {cls:'p-role',  html:SHEEN+KILL+
      `<span class="bag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.5" y="7" width="19" height="13.5" rx="3"/><path d="M8.5 7V5.4A2.4 2.4 0 0 1 11 3h2a2.4 2.4 0 0 1 2.5 2.4V7"/><path d="M2.5 12.5h19"/></svg></span><span>${esc(v)}</span>`};
    case 'tag':     return {cls:'p-tag',   html:SHEEN+KILL+esc(v), style:`--tone:${it.tone}`};
    case 'line':    return {cls:'p-vision',html:SHEEN+KILL+'<span class="q">“</span>'+highlight(v)};
    case 'note':    return {cls:'p-note t'+(it.data.tone%4), html:SHEEN+KILL+esc(v)};
    case 'sticker': return {cls:'p-stk s'+(it.data.tone%4+1), html:SHEEN+KILL+esc(v||'★')};
    case 'field':   return {cls:'p-cus', html:SHEEN+KILL+
      `<span class="ck">${esc(it.data.label||'Note')}</span><span class="cv">${esc(v||it.data.label)}</span>`};
    case 'company':{
      const s = slugify(v), col = MONO[(s.charCodeAt(0)||0)%MONO.length];
      return {cls:'p-co', html:SHEEN+KILL+`<div class="logo"></div><div class="co-n">${esc(v)}</div>`,
        after: el=>{
          const box = el.querySelector('.logo');
          brandMark(s).then(svg=>{
            if(!box.isConnected) return;
            if(!svg){ box.classList.add('mono'); box.style.background=col; box.textContent=initials(v); return; }
            box.innerHTML = svg;
            const mark = box.firstElementChild;
            if(G && mark) G.fromTo(mark,{scale:.4,opacity:0},{scale:1,opacity:1,duration:.55,ease:'back.out(3)'});
          });
        }};
    }
    case 'place': return {cls:'p-loc', html:SHEEN+KILL+
      `<span class="mark">${ART.propPin}</span>
       <div class="shot"><div class="fb">${ART.map}</div><div class="shim"></div><img alt="" crossorigin="anonymous"/></div>
       <div class="cap"><span>${esc(v)}</span></div>`,
      after: el=>loadShot(el, v)};
    case 'prop':
      return {cls:'p-prop', html: it.data.k==='clip' ? ART.propClip : it.data.k==='pencil' ? ART.propPencil : ART.propPin};
  }
}
function loadShot(el, city){
  const shot = el.querySelector('.shot'), img = shot.querySelector('img'), shim = shot.querySelector('.shim');
  if(G) G.fromTo(shim,{x:'-100%'},{x:'110%',duration:1.1,ease:'power2.inOut',repeat:-1,repeatDelay:.25});
  const stop = ()=>{ if(G) G.killTweensOf(shim); shim.style.display='none'; };
  cityPhoto(city).then(src=>{
    if(!src || !el.isConnected) return stop();
    img.onload = ()=>{ stop(); shot.querySelector('.fb').style.display='none';
      if(G) G.to(img,{opacity:1,duration:.7,ease:'power2.out'}); else img.style.opacity=1; };
    img.onerror = stop;
    img.crossOrigin = 'anonymous';
    img.src = src;
  });
}

/* ═══════════ reconcile ═══════════ */
const pieceEl = id => plane.querySelector(`.piece[data-id="${CSS.escape(id)}"]`);
function sync(fromEl){
  const want = manifest(), wantIds = new Set(want.map(i=>i.id)), fresh = [];
  plane.querySelectorAll('.piece').forEach(el=>{ if(!wantIds.has(el.dataset.id)) removeEl(el); });
  want.forEach(it=>{
    let el = pieceEl(it.id);
    const m = markup(it);
    if(!m) return;
    if(!el){
      el = document.createElement('div');
      el.className = 'piece ' + m.cls;
      el.dataset.id = it.id; el.dataset.type = it.type; el.dataset.rot = it.rot||0;
      if(m.style) el.setAttribute('style', m.style);
      el.innerHTML = m.html;
      el.style.zIndex = it.type==='name' ? 40 : ++zTop;
      plane.appendChild(el);
      if(G) G.set(el,{x:0,y:0,rotation:it.rot||0,opacity:0});
      wire(el,it);
      if(m.after) m.after(el);
      fresh.push([el,it]);
    } else if(el.dataset.sig !== m.html){
      el.className = 'piece ' + m.cls;
      if(m.style) el.setAttribute('style', m.style);
      el.innerHTML = m.html;
      wire(el,it);
      if(m.after) m.after(el);
      if(G) G.fromTo(el,{scale:.94},{scale:1,duration:.45,ease:'back.out(2.4)'});
    }
    el.dataset.sig = m.html;
  });
  layout(want, fresh.map(f=>f[0]));
  fresh.forEach(([el,it])=> springIn(el,it,fromEl));
  drawThread(); updateCount();
}
function removeEl(el){
  const done = ()=>{ el.remove(); drawThread(); updateCount(); };
  if(!G) return done();
  G.killTweensOf(el);
  G.to(el,{scale:.6,opacity:0,y:'+=16',duration:.38,ease:'power2.in',onComplete:done});
}

/* ═══════════ layout: name in the middle, spiral pack around it ═══════════ */
function layout(want, skipAnim){
  const W = plane.clientWidth, H = plane.clientHeight;
  const cx = W/2, cy = H/2, PAD = 16;
  const nodes = [];
  want.forEach(it=>{
    const el = pieceEl(it.id); if(!el) return;
    const w = el.offsetWidth, h = el.offsetHeight;
    const pinned = !!POS[it.id];
    const p = POS[it.id] || {dx:0,dy:0};
    let bx, by;
    if(it.type==='prop'){ bx = W*it.full[0]; by = H*it.full[1]; }
    else { bx = cx - w/2; by = cy - h/2; }
    el.style.left = Math.round(bx)+'px'; el.style.top = Math.round(by)+'px';
    nodes.push({el,it,sx:bx,sy:by,pinned,x:bx+p.dx,y:by+p.dy,w,h,
                place: !pinned && it.type!=='prop' && it.type!=='name'});
  });
  const loose = S.spread === 'loose';
  const GAP = loose ? PAD + 34 : PAD;
  const occupied = nodes.filter(n=>!n.place && n.it.type!=='prop').map(n=>({x:n.x,y:n.y,w:n.w,h:n.h}));
  const free = (x,y,w,h,gap)=>{
    if(x < 8 || y < 8 || x+w > W-8 || y+h > H-8) return false;
    for(const o of occupied)
      if(x < o.x+o.w+gap && x+w+gap > o.x && y < o.y+o.h+gap && y+h+gap > o.y) return false;
    return true;
  };
  const hub = nodes.find(n=>n.it.type==='name');
  const r0 = (hub ? Math.hypot(hub.w, hub.h)/2 + 26 : 80) + (loose ? 60 : 0);
  nodes.filter(n=>n.place)
       .map((n,i)=>({n,i,area:n.w*n.h}))
       .sort((a,b)=> b.area-a.area)
       .forEach(({n,i})=>{
    const a0 = i * 2.399963, rMax = Math.hypot(W,H);
    let done = false;
    for(const gap of [GAP, Math.round(GAP/2), 8, 2]){
      for(let r = r0; r < rMax && !done; r += (loose ? 18 : 12)){
        for(let k = 0; k < 48 && !done; k++){
          const a = a0 + k*(Math.PI*2/48);
          const x = cx + Math.cos(a)*r - n.w/2;
          const y = cy + Math.sin(a)*r*(loose ? .92 : .84) - n.h/2;
          if(free(x,y,n.w,n.h,gap)){ n.x = x; n.y = y; done = true; }
        }
      }
      if(done) break;
    }
    if(!done){
      n.x = clamp(n.x, 8, Math.max(8, W-n.w-8));
      n.y = clamp(n.y, 8, Math.max(8, H-n.h-8));
    }
    occupied.push({x:n.x,y:n.y,w:n.w,h:n.h});
  });
  nodes.forEach(n=>{
    const dx = n.x-n.sx, dy = n.y-n.sy;
    if(!G){ n.el.style.transform = `translate(${dx}px,${dy}px)`; return; }
    if(n.pinned || (skipAnim && skipAnim.includes(n.el))) G.set(n.el,{x:dx,y:dy});
    else G.to(n.el,{x:dx,y:dy,duration:.6,ease:'power3.out',overwrite:'auto',onUpdate:drawThread});
  });
}
function springIn(el, it, fromEl){
  if(!G){ el.style.opacity=1; return; }
  const rot = +el.dataset.rot||0;
  const bx = +G.getProperty(el,'x')||0, by = +G.getProperty(el,'y')||0;
  let from = {x:bx, y:by-60, scale:.6, rotation:rot-8};
  if(fromEl){
    const a = fromEl.getBoundingClientRect(), b = el.getBoundingClientRect();
    from = {x: bx+(a.left+a.width/2)-(b.left+b.width/2),
            y: by+(a.top+a.height/2)-(b.top+b.height/2), scale:.45, rotation:-4};
  }
  G.set(el,{transformPerspective:900, opacity:0, ...from});
  const tl = G.timeline();
  tl.to(el,{opacity:1,duration:.16,ease:'none'},0)
    .to(el,{x:bx,y:by,scale:1,rotation:rot,duration:1.05,ease:'elastic.out(1, 0.55)',overwrite:'auto',onUpdate:drawThread,
            onComplete:()=>{ if(it.type!=='name') idle(el,rot); }},0);
  setTimeout(()=>{ if(tl.progress()<1) tl.progress(1); }, 3000);
}
function idle(el, rot){
  if(!G || REDUCED) return;
  G.to(el,{y:'+=3', rotation:rot+rnd(-.4,.4), duration:rnd(3.6,5.6), ease:'sine.inOut', yoyo:true, repeat:-1, delay:rnd(0,1.4)});
}

/* ═══════════ drag ═══════════ */
function wire(el, it){
  const rebind = ()=>{ const k = el.querySelector('.kill');
    if(k) k.addEventListener('click', ev=>{ ev.stopPropagation(); eraseFromBoard(it); }); };
  if(el.dataset.wired){ rebind(); return; }
  el.dataset.wired = '1'; rebind();
  let live=false,sx=0,sy=0,ox=0,oy=0,vx=0,vy=0,lx=0,ly=0,lt=0;
  el.addEventListener('pointerenter', ()=>{
    if(SPOKE_TYPES.includes(it.type)) setFocusType(it.type);
    Snd.hover();
    if(!G) return;
    const sh = el.querySelector('.sheen i');
    if(sh) G.fromTo(sh,{x:'-190%'},{x:'470%',duration:.95,ease:'power2.inOut'});
    if(!live) G.to(el,{scale:1.045,duration:.6,ease:'elastic.out(1,.75)',overwrite:'auto'});
  });
  el.addEventListener('pointerleave', ()=>{
    if(!live) setFocusType(null);
    if(G && !live) G.to(el,{scale:1,duration:.7,ease:'elastic.out(1,.6)',overwrite:'auto'});
  });
  el.addEventListener('pointerdown', e=>{
    if(e.target.closest('.kill')) return;
    live = true;
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
    el.classList.add('dragging'); if(it.type!=='name') el.style.zIndex = ++zTop;
    if(G) G.killTweensOf(el);
    sx=e.clientX; sy=e.clientY;
    ox = G ? (+G.getProperty(el,'x')||0) : 0;
    oy = G ? (+G.getProperty(el,'y')||0) : 0;
    lx=e.clientX; ly=e.clientY; lt=performance.now(); vx=vy=0;
    if(G) G.to(el,{scale:1.07,duration:.28,ease:'power3.out',overwrite:'auto'});
  });
  el.addEventListener('pointermove', e=>{
    if(!live) return;
    const now=performance.now(), dt=Math.max(1,now-lt);
    vx=(e.clientX-lx)/dt*16; vy=(e.clientY-ly)/dt*16; lx=e.clientX; ly=e.clientY; lt=now;
    const bx = parseFloat(el.style.left)||0, by = parseFloat(el.style.top)||0;
    const W = plane.clientWidth, H = plane.clientHeight;
    const nx = clamp(bx+ox+(e.clientX-sx), 6, Math.max(6,W-el.offsetWidth-6)) - bx;
    const ny = clamp(by+oy+(e.clientY-sy), 6, Math.max(6,H-el.offsetHeight-6)) - by;
    if(G) G.to(el,{x:nx,y:ny,rotation:(+el.dataset.rot||0)+clamp(vx*.7,-9,9),duration:.18,ease:'power2.out',overwrite:'auto'});
    else el.style.transform = `translate(${nx}px,${ny}px)`;
    drawThread();
  });
  const release = ()=>{
    if(!live) return;
    live=false; el.classList.remove('dragging');
    Snd.drop();
    const rot = +el.dataset.rot||0;
    if(G){
      const bx = parseFloat(el.style.left)||0, by = parseFloat(el.style.top)||0;
      const W = plane.clientWidth, H = plane.clientHeight;
      const nx = clamp(bx+(+G.getProperty(el,'x')||0)+vx*2.6, 6, Math.max(6,W-el.offsetWidth-6)) - bx;
      const ny = clamp(by+(+G.getProperty(el,'y')||0)+vy*1.2, 6, Math.max(6,H-el.offsetHeight-6)) - by;
      POS[el.dataset.id] = {dx:nx, dy:ny};
      G.to(el,{x:nx,y:ny,duration:.7,ease:'power3.out',overwrite:'auto',onUpdate:drawThread,
               onComplete:()=>{ if(it.type!=='name') idle(el,rot); }});
      G.to(el,{rotation:rot,scale:1,duration:1,ease:'elastic.out(1,.42)'});
    }
    save();
  };
  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);
}
/* taking a piece off the mat removes its row too — one list, one truth */
function eraseFromBoard(it){
  if(it.type==='name'){ S.name=''; $('#f-name').value=''; nameTick(false); }
  else if(it.data && it.data.id!=null){ S.entries = S.entries.filter(e=>e.id!==it.data.id); renderRows(); }
  delete POS[it.id];
  sync(); save();
}

/* ═══════════════════════════════════════════════════════════
   THE ROPES — real string, not a drawn curve.
   Each strand is a little verlet chain pinned at the name and at
   the piece. It hangs under gravity and swings when you drag
   something. Hovering a piece lights up every rope of that kind
   and sends a traveller running along it.
   ═══════════════════════════════════════════════════════════ */
function centreOf(el){
  return { x:(parseFloat(el.style.left)||0)+(G?(+G.getProperty(el,'x')||0):0)+el.offsetWidth/2,
           y:(parseFloat(el.style.top) ||0)+(G?(+G.getProperty(el,'y')||0):0)+el.offsetHeight/2 };
}
const SPOKE_TYPES = ['role','company','place','tag','note','field','line'];
const SEGMENTS = 14;
let ropes = [], ropeSig = '', focusType = null;

function ropeLayer(){ return threadSvg; }
function makeRope(el){
  const svgns = 'http://www.w3.org/2000/svg';
  const line = document.createElementNS(svgns,'path'); line.setAttribute('class','rope');
  const spark = document.createElementNS(svgns,'path'); spark.setAttribute('class','spark');
  const knot = document.createElementNS(svgns,'circle'); knot.setAttribute('class','knot'); knot.setAttribute('r','5');
  ropeLayer().appendChild(line); ropeLayer().appendChild(spark); ropeLayer().appendChild(knot);
  const a = centreOf(el);
  const pts = [];
  for(let i=0;i<=SEGMENTS;i++) pts.push({x:a.x, y:a.y, px:a.x, py:a.y});
  return {el, type:el.dataset.type, line, spark, knot, pts, born:false};
}
function clearRopes(){
  ropes.forEach(r=>{ r.line.remove(); r.spark.remove(); r.knot.remove(); });
  ropes = [];
}
/* called whenever the set of pieces may have changed */
function drawThread(){
  const hub = pieceEl('name');
  const spokes = [];
  SPOKE_TYPES.forEach(t=> plane.querySelectorAll(`.piece[data-type="${t}"]`).forEach(e=>spokes.push(e)));
  if(!S.thread || !hub || !S.name.trim() || !spokes.length){
    if(ropes.length) clearRopes();
    ropeSig = ''; return;
  }
  const sig = spokes.map(e=>e.dataset.id).join('>');
  if(sig !== ropeSig){
    ropeSig = sig;
    clearRopes();
    spokes.forEach(el=> ropes.push(makeRope(el)));
    stepRopes(28);                      // settle the new ropes before they are seen
    ropes.forEach((r,i)=>{
      if(!G || REDUCED) return;
      const L = r.line.getTotalLength()||300;
      G.fromTo(r.line,{strokeDasharray:L,strokeDashoffset:L},
        {strokeDashoffset:0,duration:.75,delay:i*.05,ease:'power2.inOut',
         onComplete:()=>{ r.line.style.strokeDasharray='none'; }});
      G.from(r.knot,{scale:0,transformOrigin:'50% 50%',duration:.5,delay:i*.05,ease:'back.out(3)'});
    });
  }
}
/* one physics tick — runs off the GSAP ticker */
function stepRopes(iterations){
  if(!ropes.length) return;
  const hub = pieceEl('name');
  if(!hub){ clearRopes(); ropeSig=''; return; }
  const h = centreOf(hub);
  const passes = iterations || 1;
  for(let pass=0; pass<passes; pass++){
    ropes.forEach(r=>{
      if(!r.el.isConnected) return;
      const p = centreOf(r.el);
      const pts = r.pts, last = pts.length-1;
      // integrate the middle links
      for(let i=1;i<last;i++){
        const pt = pts[i];
        const vx = (pt.x-pt.px)*0.94, vy = (pt.y-pt.py)*0.94;
        pt.px = pt.x; pt.py = pt.y;
        pt.x += vx; pt.y += vy + 0.9;                       // gravity
      }
      // pin both ends, then relax the chain toward its rest length
      const rest = (Math.hypot(p.x-h.x, p.y-h.y) * 1.07) / last;
      for(let k=0;k<5;k++){
        pts[0].x = h.x; pts[0].y = h.y;
        pts[last].x = p.x; pts[last].y = p.y;
        for(let i=0;i<last;i++){
          const a = pts[i], b = pts[i+1];
          const dx = b.x-a.x, dy = b.y-a.y;
          const d = Math.hypot(dx,dy) || 1;
          const diff = (d-rest)/d*0.5;
          const ox = dx*diff, oy = dy*diff;
          if(i !== 0){ a.x += ox; a.y += oy; }
          if(i+1 !== last){ b.x -= ox; b.y -= oy; }
        }
      }
    });
  }
  // paint
  ropes.forEach(r=>{
    const pts = r.pts;
    let d = `M${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
    for(let i=1;i<pts.length-1;i++){
      const a = pts[i], b = pts[i+1];
      d += ` Q${a.x.toFixed(1)} ${a.y.toFixed(1)} ${((a.x+b.x)/2).toFixed(1)} ${((a.y+b.y)/2).toFixed(1)}`;
    }
    const e = pts[pts.length-1];
    d += ` L${e.x.toFixed(1)} ${e.y.toFixed(1)}`;
    r.line.setAttribute('d', d);
    r.knot.setAttribute('cx', e.x.toFixed(1)); r.knot.setAttribute('cy', e.y.toFixed(1));
    const hot = focusType && r.type === focusType;
    const cold = focusType && r.type !== focusType;
    r.line.classList.toggle('hot', !!hot);
    r.line.classList.toggle('cold', !!cold);
    r.knot.classList.toggle('cold', !!cold);
    if(hot){ r.spark.setAttribute('d', d); r.spark.classList.add('on'); }
    else if(r.spark.classList.contains('on')){ r.spark.classList.remove('on'); r.spark.setAttribute('d',''); }
  });
}
function setFocusType(t){
  if(focusType === t) return;
  focusType = t;
  plane.querySelectorAll('.piece').forEach(el=>{
    const dim = t && SPOKE_TYPES.includes(el.dataset.type) && el.dataset.type !== t;
    el.classList.toggle('faded', !!dim);
  });
}

/* ═══════════════════════════════════════════════════════════
   THE PANEL — one row per thing, each row is
   [type ▾] [what it says] [×]
   ═══════════════════════════════════════════════════════════ */
const rowsBox = $('#rows'), basicBox = $('#basicRows');
const rowTimers = {};
const BASIC_TYPES = ['role','company','place','tag','note'];

/* the five basics always exist, in order, so the panel tells you
   exactly what there is to fill in and nothing more */
function ensureBasics(){
  BASIC_TYPES.forEach(t=>{
    if(!S.entries.some(e=>e.basic && e.type===t)){
      const en = newEntry(t); en.basic = true;
      S.entries.push(en);
    }
  });
}
function basicEntries(){
  const out = [];
  BASIC_TYPES.forEach(t=> S.entries.filter(e=>e.basic && e.type===t).forEach(e=>out.push(e)));
  return out;
}
function renderRows(){
  ensureBasics();
  basicBox.innerHTML = '';
  basicEntries().forEach(en => basicBox.appendChild(buildRow(en)));

  const more = S.entries.filter(e=>!e.basic);
  rowsBox.innerHTML = '';
  if(!more.length){
    const e = document.createElement('div');
    e.className = 'emptyrow';
    e.textContent = 'Optional. Hit Add for a field, a line, a sticker — or more of anything above.';
    rowsBox.appendChild(e);
  }
  more.forEach(en => rowsBox.appendChild(buildRow(en)));
  $('#rowCount').textContent = more.length ? '· ' + more.length : '';
}

function buildRow(en){
  const T = TYPES[en.type] || TYPES.tag;
  const row = document.createElement('div');
  row.className = 'row';
  row.dataset.id = en.id;
  row.style.setProperty('--rowc', T.accent);

  if(en.basic){
    const chip = document.createElement('span');
    chip.className = 'fixed';
    chip.textContent = T.icon + '  ' + T.label;
    row.appendChild(chip);
  } else {
    const sel = document.createElement('div');
    sel.className = 'sel';
    const select = document.createElement('select');
    select.setAttribute('aria-label','Type');
    TYPE_ORDER.forEach(k=>{
      const o = document.createElement('option');
      o.value = k; o.textContent = TYPES[k].icon + '  ' + TYPES[k].label;
      if(k===en.type) o.selected = true;
      select.appendChild(o);
    });
    select.addEventListener('change', ()=>{
      Snd.click();
      en.type = select.value;
      if(en.type==='sticker' && !STICKERS.includes(en.value)) en.value = '★';
      if(en.type!=='sticker' && STICKERS.includes(en.value)) en.value = '';
      renderRows(); sync(); save();
      const fresh = rowsBox.querySelector(`.row[data-id="${en.id}"] input, .row[data-id="${en.id}"] button`);
      if(fresh && fresh.focus) fresh.focus();
    });
    sel.appendChild(select);
    row.appendChild(sel);
  }

  if(en.type === 'sticker'){
    const g = document.createElement('div');
    g.className = 'glyphs';
    STICKERS.forEach(ch=>{
      const b = document.createElement('button');
      b.type='button'; b.textContent = ch;
      if(en.value === ch) b.classList.add('on');
      b.addEventListener('click', ()=>{ en.value = ch; renderRows(); sync(); save(); });
      g.appendChild(b);
    });
    row.appendChild(g);
  } else {
    if(en.type === 'field'){
      const l = document.createElement('input');
      l.className='lbl'; l.value = en.label||''; l.placeholder = T.ph2 || 'Label'; l.maxLength = 18;
      l.addEventListener('input', ()=>{ en.label = l.value; queueSync(en.id); });
      row.appendChild(l);
      const d = document.createElement('span'); d.className='div'; row.appendChild(d);
    }
    const inp = document.createElement('input');
    inp.value = en.value||''; inp.placeholder = T.ph; inp.maxLength = en.type==='line' ? 90 : en.type==='note' ? 90 : 30;
    if(en.type==='company') inp.setAttribute('list','colist');
    inp.addEventListener('input', ()=>{ en.value = inp.value; queueSync(en.id); });
    inp.addEventListener('keydown', e=>{
      if(e.key!=='Enter') return;
      e.preventDefault();
      const plus = row.querySelector('.more-btn');
      if(en.basic && plus) plus.click();          // Enter on a basic adds another of the same kind
      else addRow(en.type);
    });
    row.appendChild(inp);
  }

  // a basic row can spawn another of its own kind — a second company, a third tag
  if(en.basic){
    const plus = document.createElement('button');
    plus.className='more-btn'; plus.type='button'; plus.textContent='+';
    plus.title = 'Add another ' + T.label.toLowerCase();
    plus.addEventListener('click', ()=>{
      const twin = newEntry(en.type); twin.basic = true;
      const at = S.entries.lastIndexOf(S.entries.filter(e=>e.basic && e.type===en.type).slice(-1)[0]);
      S.entries.splice(at+1, 0, twin);
      Snd.add();
      renderRows(); sync(); save();
      const row2 = basicBox.querySelector(`.row[data-id="${twin.id}"]`);
      const f = row2 && row2.querySelector('input'); if(f) f.focus();
      if(G && row2) G.from(row2,{y:-8,opacity:0,duration:.45,ease:'back.out(2)'});
    });
    row.appendChild(plus);
  }

  const x = document.createElement('button');
  x.className='rx'; x.type='button'; x.textContent='×';
  const onlyOfKind = en.basic && S.entries.filter(e=>e.basic && e.type===en.type).length === 1;
  x.title = onlyOfKind ? 'Clear' : 'Remove';
  x.addEventListener('click', ()=>{
    Snd.remove();
    if(onlyOfKind){ en.value=''; en.label=''; }     // the five basics stay put, they just empty
    else { S.entries = S.entries.filter(e=>e.id!==en.id); }
    delete POS['e'+en.id];
    renderRows(); sync(); save();
  });
  row.appendChild(x);
  return row;
}

function queueSync(id){
  clearTimeout(rowTimers[id]);
  rowTimers[id] = setTimeout(()=>{ sync(); save(); }, 300);
}
function addRow(type){
  const en = newEntry(type || 'field');
  if(en.type==='sticker') en.value = '★';
  S.entries.push(en);
  Snd.add();
  renderRows(); sync(); save();
  const row = rowsBox.querySelector(`.row[data-id="${en.id}"]`);
  const f = row && row.querySelector('input');
  if(f) f.focus();
  if(G && row) G.from(row,{y:-8,opacity:0,duration:.45,ease:'back.out(2)'});
}
$('#addRow').addEventListener('click', ()=>addRow());

/* name */
const nameInput = $('#f-name');
let nameTimer;
function nameTick(on){
  const t = $('#nameTick');
  if(G) G.to(t,{opacity:on?1:0,scale:on?1:.4,duration:.35,ease:'back.out(3)'});
  else t.style.opacity = on?1:0;
}
nameInput.addEventListener('input', ()=>{
  S.name = nameInput.value;
  nameTick(!!nameInput.value.trim());
  clearTimeout(nameTimer);
  nameTimer = setTimeout(()=>{ sync(nameInput); save(); }, 220);
});

/* ═══════════ dice ═══════════ */
const shuffle = a => { const c=[...a]; for(let i=c.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [c[i],c[j]]=[c[j],c[i]]; } return c; };
$('#dice').addEventListener('click', ()=>{
  Snd.roll();
  S.name = pick(POOL.names);
  const E = [];
  E.push(newEntry('role', pick(POOL.roles)));
  shuffle(POOL.companies).slice(0, Math.floor(rnd(2,5))).forEach(c=>E.push(newEntry('company', c)));
  shuffle(POOL.places).slice(0, Math.random()<.45?2:1).forEach(p=>E.push(newEntry('place', p)));
  shuffle(POOL.tags).slice(0, Math.floor(rnd(3,6))).forEach(t=>E.push(newEntry('tag', t)));
  E.push(newEntry('line', pick(POOL.lines)));
  shuffle(POOL.notes).slice(0, Math.floor(rnd(1,3))).forEach(n=>E.push(newEntry('note', n)));
  shuffle(POOL.fields).slice(0, Math.floor(rnd(1,3))).forEach(f=>E.push(newEntry('field', f[1], f[0])));
  shuffle(STICKERS).slice(0, Math.floor(rnd(1,3))).forEach(g=>E.push(newEntry('sticker', g)));
  E.forEach(en=>{ if(BASIC_TYPES.includes(en.type)) en.basic = true; });   // the five live up top
  S.entries = E;
  POS = {};
  nameInput.value = S.name; nameTick(true);
  renderRows();
  plane.querySelectorAll('.piece:not(.p-prop)').forEach(e=>e.remove());
  ropeSig='';
  sync($('#dice')); save();
  if(G) G.fromTo('#dieIcon',{rotation:0},{rotation:360,duration:.7,ease:'back.out(2)',transformOrigin:'50% 50%'});
});
$('#wipe').addEventListener('click', ()=>{
  Snd.remove();
  S.name=''; S.entries=[]; POS={};
  nameInput.value=''; nameTick(false);
  renderRows();
  const els = [...plane.querySelectorAll('.piece:not(.p-prop)')];
  const finish = ()=>{ els.forEach(e=>e.remove()); ropeSig=''; sync(); };
  if(!G){ finish(); return save(); }
  G.to(els,{y:'+=60',opacity:0,scale:.85,duration:.42,ease:'power2.in',stagger:{each:.05,from:'end'},onComplete:finish});
  save();
});

/* ═══════════ board controls ═══════════ */
$('#tSound').addEventListener('click', e=>{
  S.sound = Snd.toggle();
  e.currentTarget.classList.toggle('on', S.sound);
  e.currentTarget.dataset.tip = S.sound ? 'Sound' : 'Muted';
  e.currentTarget.querySelectorAll('.w1,.w2').forEach(w=> w.style.opacity = S.sound ? 1 : 0);
  save();
});
$('#tMat').addEventListener('click', e=>{
  Snd.sweep();
  S.mat = randomMat(); drawMat(); save();
  const t = MAT_THEMES.find(x=>x.id===S.mat.theme);
  e.currentTarget.dataset.tip = t ? t.name+' mat' : 'New mat';
  if(G) G.fromTo('#matSvg',{opacity:.25},{opacity:1,duration:.55,ease:'power2.out'});
});
$('#tThread').addEventListener('click', e=>{ Snd.click(); S.thread=!S.thread; e.currentTarget.classList.toggle('on',S.thread); drawThread(); save(); });
$('#tProps').addEventListener('click',  e=>{ Snd.click(); S.props=!S.props;  e.currentTarget.classList.toggle('on',S.props);  sync(); save(); });
$('#tHide').addEventListener('click', e=>{
  Snd.click();
  S.chrome = !S.chrome;
  $('#pillrow').classList.toggle('hidden', !S.chrome);
  e.currentTarget.classList.toggle('off', !S.chrome);
  e.currentTarget.dataset.tip = S.chrome ? 'Hide' : 'Show';
  save();
});
$('#tSpread').addEventListener('click', e=>{
  Snd.sweep();
  S.spread = S.spread==='tidy' ? 'loose' : 'tidy';
  e.currentTarget.dataset.tip = S.spread==='tidy' ? 'Tidy' : 'Spread out';
  e.currentTarget.classList.toggle('on', S.spread==='loose');
  POS = {}; layout(manifest()); save();
});

/* ═══════════ download ═══════════ */
const SAVE_ICONS = {
  idle:`<path d="M12 3.5v11"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M4.5 19.5h15"/>`,
  busy:`<path d="M12 4a8 8 0 1 1-8 8" opacity=".9"/>`,
  done:`<path d="M4.5 12.5 10 18 19.5 6.5"/>`,
  fail:`<path d="M6 6l12 12M18 6 6 18"/>`
};
const setSaveIcon = (btn,k)=>{ const s=btn.querySelector('svg'); if(s) s.innerHTML=SAVE_ICONS[k]; btn.classList.toggle('spin',k==='busy'); };
$('#tSave').addEventListener('click', async e=>{
  const btn = e.currentTarget;
  if(btn.dataset.busy) return;
  btn.dataset.busy='1'; setSaveIcon(btn,'busy');
  const wasChrome = S.chrome;
  let reshaped = false, savedPOS = null;
  const unshape = ()=>{
    if(!reshaped) return;
    reshaped = false;
    document.body.classList.remove('shooting');
    if(savedPOS) POS = savedPOS;
    setTimeout(()=>{ drawMat(); layout(manifest()); }, 60);
  };
  try{
    if(!window.html2canvas) await new Promise((res,rej)=>{
      const sc = document.createElement('script');
      sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
      sc.onload = res; sc.onerror = rej; document.head.appendChild(sc);
    });
    $('#pillrow').classList.add('hidden');
    document.body.classList.add('exporting');
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    await new Promise(r=>setTimeout(r,240));

    const board = $('#board'), mat = $('.mat');
    // a portrait board would export as a tall mat floating in dark bands —
    // relay it into a wide frame first so the mat itself is landscape
    // always shoot from the same 5:4 frame, so the picture never depends on
    // how the window happened to be sized
    reshaped = true;
    if(reshaped){
      savedPOS = POS; POS = {};
      document.body.classList.add('shooting');
      void board.offsetHeight;                       // force the new frame to reflow
      await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
      drawMat();
      layout(manifest());                            // pack against the real wide plane
      await new Promise(r=>setTimeout(r,1000));
      layout(manifest());                            // and settle once more, sizes now final
      await new Promise(r=>setTimeout(r,700));
      stepRopes(30);
    }
    const br = board.getBoundingClientRect(), mr = mat.getBoundingClientRect();
    const s = Math.min(2, Math.max(1.5, window.devicePixelRatio||1));
    const shot = await html2canvas(board, {
      useCORS:true, allowTaint:false, backgroundColor:null, scale:s,
      ignoreElements: el => el.classList && (el.classList.contains('controls') || el.classList.contains('kill'))
    });
    const sx=(mr.left-br.left)*s, sy=(mr.top-br.top)*s, sw=mr.width*s, sh=mr.height*s;
    const pad=Math.round(52*s), foot=Math.round(88*s), radius=Math.round(18*s);
    // the canvas hugs the mat — no stretched-out side bands
    const outW = Math.round(sw+pad*2), outH = Math.round(sh+pad+foot);
    const out = document.createElement('canvas');
    out.width=outW; out.height=outH;
    const g2 = out.getContext('2d');
    g2.fillStyle='#12211a'; g2.fillRect(0,0,outW,outH);
    const dx=Math.round((outW-sw)/2), dy=pad;
    g2.save(); g2.beginPath();
    if(g2.roundRect) g2.roundRect(dx,dy,sw,sh,radius);
    else { g2.moveTo(dx+radius,dy); g2.arcTo(dx+sw,dy,dx+sw,dy+sh,radius); g2.arcTo(dx+sw,dy+sh,dx,dy+sh,radius);
           g2.arcTo(dx,dy+sh,dx,dy,radius); g2.arcTo(dx,dy,dx+sw,dy,radius); g2.closePath(); }
    g2.clip(); g2.drawImage(shot,sx,sy,sw,sh,dx,dy,sw,sh); g2.restore();
    const fs = Math.round(19*s);
    g2.font = `500 ${fs}px Fredoka, Nunito, sans-serif`;
    g2.textBaseline='middle'; g2.textAlign='left';
    const p1='made with ', p2='♥', p3=' by Sanjay';
    const w1=g2.measureText(p1).width, w2=g2.measureText(p2).width, w3=g2.measureText(p3).width;
    let tx=(outW-(w1+w2+w3))/2; const ty=dy+sh+foot/2-Math.round(6*s);
    g2.fillStyle='rgba(255,255,255,.92)'; g2.fillText(p1,tx,ty); tx+=w1;
    g2.fillStyle='#e0473a';               g2.fillText(p2,tx,ty); tx+=w2;
    g2.fillStyle='rgba(255,255,255,.92)'; g2.fillText(p3,tx,ty);
    const a = document.createElement('a');
    a.download = (S.name.trim() ? S.name.trim().toLowerCase().replace(/\s+/g,'-') : 'vision') + '-board.png';
    a.href = out.toDataURL('image/png');
    a.click();
    Snd.shutter();
    unshape();
  }catch(err){
    unshape();
    setSaveIcon(btn,'fail'); btn.dataset.tip="Couldn't save";
    setTimeout(()=>{ setSaveIcon(btn,'idle'); btn.dataset.tip='Download'; }, 1800);
    document.body.classList.remove('exporting');
    if(wasChrome) $('#pillrow').classList.remove('hidden');
    delete btn.dataset.busy; return;
  }
  document.body.classList.remove('exporting');
  if(wasChrome) $('#pillrow').classList.remove('hidden');
  setSaveIcon(btn,'done'); setTimeout(()=>setSaveIcon(btn,'idle'),1500);
  delete btn.dataset.busy;
});

function updateCount(){
  const c = $('#cnt');
  const n = [...plane.querySelectorAll('.piece')].filter(p=>p.dataset.type!=='prop').length;
  if(c.textContent===String(n)) return;
  c.textContent = n;
  if(G) G.fromTo(c,{scale:1.6},{scale:1,duration:.55,ease:'back.out(3)'});
}

/* ═══════════ persistence + boot ═══════════ */
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({S,POS,uid})); }catch(e){} }
function load(){
  try{
    const raw = localStorage.getItem(KEY); if(!raw) return false;
    const o = JSON.parse(raw); if(!o||!o.S) return false;
    S = Object.assign(S,o.S);
    if(!Array.isArray(S.entries)) S.entries = [];
    POS = o.POS||{}; uid = o.uid||1;
    return true;
  }catch(e){ return false; }
}
function boot(){
  load();
  $('#tThread').classList.toggle('on', S.thread);
  $('#tProps').classList.toggle('on', S.props);
  $('#tSpread').dataset.tip = S.spread==='tidy' ? 'Tidy' : 'Spread out';
  $('#tSpread').classList.toggle('on', S.spread==='loose');
  $('#pillrow').classList.toggle('hidden', !S.chrome);
  $('#tHide').classList.toggle('off', !S.chrome);
  const mt = MAT_THEMES.find(x=>x.id===S.mat.theme);
  if(mt) $('#tMat').dataset.tip = mt.name+' mat';
  Snd.set(S.sound !== false);
  $('#tSound').classList.toggle('on', S.sound !== false);
  $('#tSound').dataset.tip = S.sound !== false ? 'Sound' : 'Muted';
  $('#tSound').querySelectorAll('.w1,.w2').forEach(w=> w.style.opacity = S.sound !== false ? 1 : 0);

  $('#colist').innerHTML = COMPANIES.map(c=>`<option value="${esc(c)}"></option>`).join('');
  nameInput.value = S.name || '';
  nameTick(!!S.name);
  renderRows(); drawMat(); sync();
  if(!S.name.trim()) setTimeout(()=>nameInput.focus(), 700);

  if(G){
    G.ticker.add(()=>stepRopes(1));        // the ropes live on the ticker
    G.from('.dock-scroll > *',{x:-24,opacity:0,duration:.75,stagger:.05,ease:'power3.out',clearProps:'all'});
    G.from('.tw',{y:-22,opacity:0,duration:.8,ease:'back.out(2.2)',clearProps:'all'});
    G.from('.ibtn',{y:-14,opacity:0,duration:.6,stagger:.06,delay:.15,ease:'back.out(2)',clearProps:'all'});
    G.to('.bshine',{left:'140%',duration:1.15,ease:'power2.inOut',repeat:-1,repeatDelay:3.6,delay:1.6});
  }
  let rt;
  window.addEventListener('resize', ()=>{
    clearTimeout(rt);
    rt = setTimeout(()=>{ drawMat(); layout(manifest()); drawThread(); }, 200);
  });
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
})();
</script>
