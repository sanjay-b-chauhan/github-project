    dev.addEventListener('click', function (e) {
      var g = e.target.closest('[data-go]'), a = e.target.closest('[data-a]');
      if (g) { dev.classList.remove('open'); go(g.dataset.go); }
      else if (a) { if (a.dataset.a === 'menu') dev.classList.toggle('open'); else if (a.dataset.a === 'next') next(); else prev(); }
    });
    document.addEventListener('click', function (e) { if (!dev.contains(e.target)) dev.classList.remove('open'); });
    addEventListener('keydown', function (e) {
      if (/input|textarea/i.test((e.target.tagName || ''))) return;
      if (e.key === ']') next(); else if (e.key === '[') prev(); else if (e.key === 'Escape') dev.classList.remove('open');
    });
    var want = (location.hash || '').slice(1) || (new URLSearchParams(location.search).get('s') || '');
    go(steps.some(function (x) { return x.id === want; }) ? want : steps[0].id);
    window.SP.ready = true;
  }

  window.SP = { screen: screen, step: step, go: go, show: show, next: next, prev: prev, state: state, map: map, I: I, logo: logo, steps: steps, ready: false, setMoment: setMoment,
    get current() { return cur; }, get currentStep() { return curStep; } };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else setTimeout(boot, 0);
})();

/* screens/intro.js */
/* How Zero works, in ten seconds. One picture, built in three beats, before anything is asked.
   The top row is what you do (scenarios), the bottom row is what it opens (jobs), and the ring in the middle is you.
   It plays by itself like a short film, every beat can be replayed, and the button is live from the first frame.
   The "How it works" pill reopens it from anywhere (opts.back), with the learner's own job in the card. */
(function () {
  'use strict';

  SP.screen({
    id: 'intro', tone: 'world', chrome: {},
    mount: function (root, api, opts) {
      opts = opts || {};
      var D = api.data, st = api.state, SC = D.SCENARIOS, N = 10, X0 = 150, STEP = 78;
      var rg = D.rung(st.dream.rung), own = !!opts.back, cycle = D.DREAMS.slice();
      var BEATS = [
        { t: 'Pick the job you want.',           c: 'Any company, any level. It starts locked.' },
        { t: 'Do real work. Earn skill points.', c: 'Each scenario is a real problem at a real company. Good work earns points, and ' + D.fmt(D.PER_LEVEL) + ' points is a level.' },
        { t: 'Every level opens real jobs.',     c: 'Zero applies with you at each one. The last level opens yours.' }
      ];

      var scn = '', notch = '', jobs = '';
      for (var i = 0; i < N; i++) scn += '<span class="in-s" style="left:' + (X0 + STEP * i + STEP / 2) + 'px;--d:' + (i * .055).toFixed(2) + 's">' + api.logo(SC[i].co, 40, 'round') + '</span>';
      for (var k = 0; k <= N; k++) notch += '<i class="in-n" data-l="' + k + '" style="left:' + (X0 + STEP * k) + 'px"></i>';
      for (var L = 1; L < N; L++) {
        var rl = D.rolesAt(st.dream, L).filter(function (r) { return !r.dream; }).slice(0, 2);
        jobs += '<span class="in-j" data-l="' + L + '" style="left:' + (X0 + STEP * L) + 'px">' + rl.map(function (r) { return api.logo(r.co, 28, 'round'); }).join('') + '</span>';
      }
      root.innerHTML =
        '<div class="in-wrap">' +
          '<h1 class="sp-h1 in-title"></h1><p class="in-cap"></p>' +
          '<div class="in-stage">' +
            '<span class="in-lab l1">Scenarios</span><span class="in-lab l2">Your level</span><span class="in-lab l3">Jobs that open</span>' +
            '<div class="in-scn">' + scn + '</div>' +
            '<div class="in-track"><i class="in-fill"></i>' + notch + '</div>' +
            '<div class="in-me" style="left:' + X0 + 'px">' + api.ring(0, 0, 50) + '<em class="in-plus">' + api.star(13) + '+' + D.fmt(D.PACE) + '</em></div>' +
            '<div class="in-jobs">' + jobs + '</div>' +
            '<div class="in-goal"><span class="in-lg"></span><div class="tx"><b></b><em></em></div><i class="lk">' + api.I.lock + '</i></div>' +
          '</div>' +
          '<div class="in-foot"><div class="in-dots">' + BEATS.map(function (b, n) { return '<button type="button" data-b="' + n + '" aria-label="Part ' + (n + 1) + '"><i></i></button>'; }).join('') + '</div>' +
            '<button type="button" class="sp-key in-go">' + (own ? 'Got it' : 'Pick my job' + api.I.arrow) + '</button></div>' +
        '</div>';

      function q(s) { return root.querySelector(s); }
      var title = q('.in-title'), cap = q('.in-cap'), stage = q('.in-stage'), me = q('.in-me'), ringEl = me.querySelector('.sp-ring'), fill = q('.in-fill');
      var goal = q('.in-goal'), glg = q('.in-lg'), gb = goal.querySelector('b'), ge = goal.querySelector('em'), dots = root.querySelectorAll('.in-dots button');
      var jobsEl = root.querySelectorAll('.in-j'), timers = [], tick = 0, ci = 0;

      function wait(ms, fn) { timers.push(api.later(ms, fn)); }
      function stop() { timers.forEach(clearTimeout); timers = []; clearInterval(tick); }
      function say(n, quick) {
        Array.prototype.forEach.call(dots, function (d, k) { d.classList.toggle('on', k === n); d.classList.toggle('past', k < n); });
        if (quick) { title.textContent = BEATS[n].t; cap.textContent = BEATS[n].c; title.classList.remove('out'); cap.classList.remove('out'); return; }
        title.classList.add('out'); cap.classList.add('out');
        wait(240, function () { title.textContent = BEATS[n].t; cap.textContent = BEATS[n].c; title.classList.remove('out'); cap.classList.remove('out'); });
      }
      function card(co, open) {
        glg.innerHTML = api.logo(co, 46);
        gb.textContent = own ? rg.title : 'The job you want';
        ge.textContent = open ? 'Open to you' : own ? D.CO[co] + '. Locked' : 'Locked';
        goal.classList.toggle('open', !!open);
        goal.querySelector('.lk').innerHTML = open ? api.I.tick : api.I.lock;
      }
      function level(n, quiet) {
        me.style.left = (X0 + STEP * n) + 'px'; fill.style.width = (STEP * n) + 'px';
        ringEl.querySelector('b').textContent = n; ringEl.style.setProperty('--p', n ? 1 : 0);
        Array.prototype.forEach.call(root.querySelectorAll('.in-n'), function (x) { x.classList.toggle('on', +x.dataset.l <= n); });
        if (!quiet && n) { me.classList.remove('pay'); void me.offsetWidth; me.classList.add('pay'); }
      }
      function jobsTo(n) { Array.prototype.forEach.call(jobsEl, function (j) { j.classList.toggle('on', +j.dataset.l <= n); }); }

      /* play from a beat. Everything before it is set in place at once, so any beat can be replayed. */
      function play(from) {
        stop(); me.classList.remove('pay');
        stage.classList.toggle('b2', from >= 1); stage.classList.toggle('b3', from >= 2);
        level(from === 0 ? 0 : from === 1 ? 0 : 3, true); jobsTo(from >= 2 ? 0 : 0);
        card(own ? st.dream.co : cycle[ci % cycle.length], false);
        say(from, true);
        var t = 0;
        if (from <= 0) {
          if (!own) tick = setInterval(function () { ci++; glg.classList.add('swap'); setTimeout(function () { card(cycle[ci % cycle.length], false); glg.classList.remove('swap'); }, 150); }, 620);
          t += 2900;
          wait(t, function () { clearInterval(tick); card(own ? st.dream.co : 'apple', false); stage.classList.add('b2'); say(1); });
        }
        if (from <= 1) {
          wait(t + 1100, function () { level(1); }); wait(t + 2000, function () { level(2); }); wait(t + 2900, function () { level(3); });
          t += 4100;
          wait(t, function () { stage.classList.add('b3'); say(2); jobsTo(3); });
        } else { jobsTo(3); }
        for (var n = 4; n <= N; n++) (function (n) { wait(t + 900 + (n - 4) * 330, function () { level(n, n < N); jobsTo(n); }); })(n);
        wait(t + 900 + (N - 4) * 330 + 420, function () { card(own ? st.dream.co : 'apple', true); });
      }

      api.map.shade(0, 0, .66);
      api.map.draw({ road: false, stops: false, chips: 'none', dest: 'none', beam: false });
      api.map.view({ cx: 56, cy: 52, s: 1.5, fx: .5, fy: .5 }, 1600);
      root._stop = stop;
      root.addEventListener('click', function (e) {
        var d = e.target.closest('[data-b]');
        if (e.target.closest('.in-go')) { stop(); if (own) api.show(opts.back); else api.go('dream-co'); }
        else if (d) play(+d.dataset.b);
      });
      play(0);
    },
    leave: function (root) { if (root && root._stop) root._stop(); }
  });
})();

/* screens/dream.js */
/* The dream. Two questions on the city itself. The guided first look comes next, on the world.
   Left is where you answer, right is the city answering back: the camera flies to the building you pick,
   the job stands on it with its lock, and the road to it is drawn stop by stop. */
(function () {
  'use strict';

  /* ---------- 1 and 2: where, and which job ---------- */
  SP.screen({
    id: 'dream', tone: 'world', chrome: {},
    mount: function (root, api, opts) {
      var D = api.data, st = api.state, step = opts.step || 'co', back = opts.back;   // back = changing the job later: return there, keep the points
      root.innerHTML = '<div class="dr-panel sp-glass"><div class="dr-body"></div></div>';
      var body = root.querySelector('.dr-body');

      function look(co, close) {
        var h = D.HEART[co], rf = D.ROOF[co];
        api.map.view({ cx: h[0], cy: (h[1] + rf[1]) / 2 + (rf[2] === 'b' ? 1.5 : -1), s: close ? 2.5 : 2.15, fx: .665, fy: .5 }, 1500);
      }
      function stand(showCard) {
        api.map.draw({ road: false, stops: false, chips: 'none', dest: showCard ? 'locked' : 'none', beam: true, litDream: true, dream: st.dream });
      }

      function company() {
        step = 'co';
        body.innerHTML =
          '<h1 class="sp-h1 dr-h">Where do you want to work?</h1>' +
          '<p class="sp-p dr-sub">From your vision board. Pick one to aim at first. You can change it later.</p>' +
          '<div class="dr-grid">' + D.DREAMS.map(function (co) {
            return '<button type="button" class="dr-co' + (co === st.dream.co ? ' on' : '') + '" data-co="' + co + '">' + api.logo(co, 40) + '<span>' + D.CO[co] + '</span><i>' + api.I.tick + '</i></button>';
          }).join('') + '</div>' +
          '<div class="dr-foot"><button type="button" class="sp-key dr-go">Continue' + api.I.arrow + '</button></div>';
        api.map.shade(.72, 0, 0);
        stand(false); look(st.dream.co, false);
      }
      function role() {
        step = 'role';
        var name = D.CO[st.dream.co];
        body.innerHTML =
          '<button type="button" class="dr-back" aria-label="Back">' + api.I.left + '</button>' +
          '<h1 class="sp-h1 dr-h">Which job at ' + name + '?</h1>' +
          '<p class="sp-p dr-sub">' + (back ? 'Your ' + D.fmt(st.pts) + ' skill points come with you.' : 'A bigger job takes more scenarios.') + '</p>' +
          '<div class="dr-rungs">' + D.RUNGS.map(function (r) {
            var n = D.scenariosTo(r.level, st.pts);
            return '<button type="button" class="dr-rung' + (r.id === st.dream.rung ? ' on' : '') + '" data-rung="' + r.id + '">' +
              '<span class="lv"><b>' + n + '</b><em>' + (n === 1 ? 'scenario' : 'scenarios') + '</em></span>' +
              '<span class="tx"><b>' + r.title + '</b><em>' + r.pay + '</em></span><i>' + api.I.tick + '</i></button>';
          }).join('') + '</div>' +
          '<div class="dr-foot"><button type="button" class="sp-key dr-go">' + (back ? 'Change to this' : 'This is the one') + api.I.arrow + '</button></div>';
        api.map.shade(.72, 0, 0);
        stand(true); look(st.dream.co, true);
      }

      root.addEventListener('click', function (e) {
        var c = e.target.closest('[data-co]'), r = e.target.closest('[data-rung]');
        if (c) {
          st.dream.co = c.dataset.co;
          Array.prototype.forEach.call(root.querySelectorAll('.dr-co'), function (b) { b.classList.toggle('on', b === c); });
          stand(false); look(st.dream.co, false);
        } else if (r) {
          st.dream.rung = r.dataset.rung;
          Array.prototype.forEach.call(root.querySelectorAll('.dr-rung'), function (b) { b.classList.toggle('on', b === r); });
          stand(true);
        } else if (e.target.closest('.dr-back')) { swap(company); }
        else if (e.target.closest('.dr-go')) { if (step === 'co') swap(role); else if (back) api.show(back); else api.go('tour'); }
      });
      function swap(fn) { body.classList.add('out'); api.later(200, function () { fn(); body.classList.remove('out'); }); }

      if (step === 'role') role(); else company();
    }
  });

})();

/* screens/world.js */
/* The world: home in Learn mode. The road to the job you want runs through the city, the next scenario is
   lit, and its card says what it pays and which roles it opens. Also the summit: the day the job opens. */
(function () {
  'use strict';

  SP.screen({
    id: 'world', tone: 'world', chrome: { rail: 'learn', pill: true },
    mount: function (root, api, opts) {
      opts = opts || {};
      var D = api.data, st = api.state, SC = D.SCENARIOS, rg = D.rung(st.dream.rung), lv = D.level(st.pts);
      var need = D.need(st.dream), allDone = st.done >= need, open = lv >= rg.level, name = D.CO[st.dream.co];
      var sel = allDone ? 'd' : st.done, shown = null, tHover = 0;

      /* arriving with a scenario finished since the city was last seen: the marker walks there first */
      var from = (!opts.tour && st.seenDone != null && st.seenDone < st.done && !allDone) ? st.seenDone : null;
      st.seenDone = st.done;

      api.map.shade(.3, .62, 0);
      api.map.fit(api.map.points(st.dream), { x: 130, y: 104, w: 1010, h: 650 }, 1500);
      api.map.draw({ chips: from == null ? 'now' : 'none', done: from == null ? st.done : from, you: true, beam: 'soft', dest: open ? 'open' : 'locked' });

      root.innerHTML = '<div class="wd-card sp-glass"></div>';
      var card = root.querySelector('.wd-card');

      function rolesList(list, st2) {
        return '<ul>' + list.map(function (r) {
          var s = D.roleState(r, st2 || st);
          return '<li>' + api.logo(r.co, 30) + '<span class="tx"><b>' + r.title + '</b><em>' + D.CO[r.co] + '</em></span>' + (s === 'locked' ? api.lock(22) : api.tick(22)) + '</li>';
        }).join('') + '</ul>';
      }
      function html(key) {
        if (key === 'd') {
          var lv = D.level(st.pts), open = lv >= rg.level;   // read now, not at mount: the guided preview moves the level
          var n = D.scenariosTo(rg.level, st.pts), tg = D.target(st.dream);
          var doors = D.roles(st.dream).filter(function (r) { return r.dream && r.level < rg.level; });
          return '<div class="wd-hero"><img alt="" src="' + api.asset('img/b/' + st.dream.co + '.webp') + '"><span class="wd-tag">' + api.logo(st.dream.co, 22, 'round') + name + '</span><span class="wd-no">The job you want</span></div>' +
            '<div class="wd-body"><h2 class="sp-h2 wd-title">' + rg.title + '</h2>' +
            '<p class="sp-p wd-ask">' + tg.loc + '. ' + tg.pay + '.</p>' +
            (open
              ? '<p class="wd-state ok">' + api.tick(24) + '<span>Open to you now. Zero can apply with you.</span></p><button type="button" class="sp-key wd-apply">Apply with Zero' + api.I.arrow + '</button>'
              : '<p class="wd-state">' + api.lock(24) + '<span>Opens at <b>Level ' + rg.level + '</b>. You are Level ' + lv + '. About ' + n + (n === 1 ? ' scenario.' : ' scenarios.') + '</span></p>' +
                (doors.length ? '<div class="wd-opens"><p>Earlier doors at ' + name + '</p><ul>' + doors.map(function (r) {
                  var s = D.roleState(r, st);
                  return '<li><span class="wd-lv">' + r.level + '</span><span class="tx"><b>' + r.title + '</b><em>Level ' + r.level + '</em></span>' + (s === 'locked' ? api.lock(22) : api.tick(22)) + '</li>';
                }).join('') + '</ul></div>' : '') +
                '<button type="button" class="sp-ghost wd-path">See every level</button>') + '</div>';
        }
        var i = key, s = SC[i], state = i < st.done ? 'done' : i === st.done ? 'now' : 'ahead', body = '';
        var after = D.level(st.pts + D.PACE * (i - st.done + 1)), opens = D.rolesAt(st.dream, after);
        var meta = '<div class="wd-meta"><span>' + api.I.clock + s.mins + ' min</span><span>' + api.star(15) + 'Up to ' + D.fmt(D.SCENARIO_MAX) + '</span></div>';
        if (state === 'now') {
          body = meta + '<div class="wd-opens"><p>Gets you to <b>Level ' + after + '</b>, which opens</p>' + rolesList(opens) + '</div>' +
            '<button type="button" class="sp-key wd-start">' + api.I.play + (st.done === 0 ? 'Start scenario 1' : 'Start') + '</button>';
        } else if (state === 'done') {
          var got = i === 0 ? D.RESULT.earned : 900 + (i * 137) % 500, band = got >= 1300 ? 'Exceeding Expectations' : 'Meeting Expectations';
          body = '<div class="wd-meta"><span class="ok">' + api.I.tick + band + '</span><span>' + api.star(15) + '+' + D.fmt(got) + '</span></div>' +
            '<button type="button" class="sp-ghost wd-proof">See it in your portfolio</button>';
        } else {
          var gapN = i - st.done;
          body = meta + '<p class="wd-state">' + api.lock(24) + '<span>' + (gapN === 1 ? 'Opens after ' + D.CO[SC[st.done].co] + '.' : 'Opens after ' + gapN + ' more scenarios.') + '</span></p>' +
            '<div class="wd-opens far"><p>Takes you to <b>Level ' + after + '</b>, which opens</p>' + rolesList(opens) + '</div>';
        }
        return '<div class="wd-hero"><img alt="" src="' + api.asset('img/b/' + s.co + '.webp') + '"><span class="wd-tag">' + api.logo(s.co, 22, 'round') + D.CO[s.co] + '</span><span class="wd-no">Scenario ' + (i + 1) + '</span></div>' +
          '<div class="wd-body"><h2 class="sp-h2 wd-title">' + s.title + '</h2><p class="sp-p wd-ask">' + s.ask + '</p>' + body + '</div>';
      }
      function show(key, quick) {
        if (key === shown) return; shown = key;
        card.innerHTML = html(key);
        card.classList.remove('in', 'quick'); void card.offsetWidth; card.classList.add(quick ? 'quick' : 'in');
        card.classList.toggle('peek', key !== sel);
      }

      if (from == null) show(sel);
      else {
        card.classList.add('wait');
        api.later(1100, function () {
          api.map.walk(from, st.done, 1400 + Math.min(4, st.done - from) * 360).then(function () {
            api.map.draw({ chips: 'now', you: true, still: true, beam: 'soft', dest: open ? 'open' : 'locked' });
            card.classList.remove('wait'); show(sel);
          });
        });
      }

      /* ---------- the guided first look: four things lit one at a time, and one practice run ----------
         Nothing here is read off a slide. Each line points at the real thing on the real screen, the learner
         sets the pace, and in the middle they finish a practice scenario and watch the level and the jobs move. */
      function tour() {
        var T = 5, lay = api.map.layer(), first = D.rolesAt(st.dream, 1), fx = null, live = true;
        function reset() {
          api.setMoment('day0'); st.seenDone = 0; api.drawPill();
          api.map.draw({ chips: 'now', you: true, beam: 'soft', dest: 'locked' });
          if (fx) { fx.remove(); fx = null; }
          card.classList.remove('wait'); sel = 0; shown = null; show(0);
        }
        function end() { live = false; api.coachOff(); reset(); }
        function s1() {
          api.coach({ rect: api.union([api.rect(lay.querySelector('.mp-dream-card'), 12), api.rect(lay.querySelector('.mp-glow.dream'), 0)]), r: 30, n: [1, T], skip: end,
            title: 'This is the job you picked.', body: 'It is locked for now. It opens at <b>Level ' + rg.level + '</b>.', next: { fn: s2 } });
        }
        function s2() {
          var rs = Array.prototype.map.call(lay.querySelectorAll('.mp-stop'), function (x) { return api.rect(x, 30); });
          rs.push(api.rect(lay.querySelector('.mp-dream-card'), 12));
          api.coach({ rect: api.union(rs), r: 44, n: [2, T], skip: end, side: 'r',
            title: need + ' scenarios lead to it.', body: 'Each one is real work at a real company. A good one takes you up about one level.', next: { fn: s3 } });
        }
        function s3() {
          api.coach({ rect: api.rect(root.parentNode.parentNode.querySelector('.sp-pill'), 8), r: 36, n: [3, T], skip: end, side: 'b',
            title: 'This is your level.', body: 'Good work earns skill points. ' + D.fmt(D.PER_LEVEL) + ' points fill the ring, and a full ring is a level.',
            next: { label: 'Try it', fn: s4 } });
        }
        function s4() {
          api.coach({ rect: null, n: [4, T], skip: end, at: { x: 150, y: 560 },
            title: 'Finish a practice scenario.', body: 'Press the button and watch what moves.', next: { label: 'Finish ' + D.CO[SC[0].co], fn: run4 } });
        }
        function run4() {
          api.coach({ rect: null, n: [4, T], at: { x: 150, y: 560 }, title: D.CO[SC[0].co] + ', done.', body: 'Your manager reviewed it. Here come the points.', next: { label: 'Finish ' + D.CO[SC[0].co], fn: null }, busy: true });
          api.award(D.PACE, { from: lay.querySelector('.mp-you'), label: 'Meeting Expectations', hold: 1100 }).then(function () {
            if (!live) return; st.done = 1; st.seenDone = 1;

  function burst(cv, x, y, api) {

/* screens/loop.js */
/* ZERO skill path · the loop around one scenario.
   Five screens, in story order:
     earn      points land inside the workspace, with a reason, at a named moment
     review    the scenario, graded: one result, then what it paid by skill
     levelup   the level, and the roles it opens
     applyask  Zero asks before it applies
     whenback  the learner picks when the next scenario happens
   Every number is read from SP_DATA. Each screen draws from api.state alone, and takes
   opts.instant to land on its final state with no motion. */
(function () {
  'use strict';

  var WORDS = ['No', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten'];
  function word(n) { return WORDS[n] || String(n); }
  function all(el, s) { return Array.prototype.slice.call(el.querySelectorAll(s)); }
  function plural(n, one, many) { return n === 1 ? one : many; }
  function list(a) { return a.length < 3 ? a.join(' and ') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]; }
  function uniq(a) { return a.filter(function (x, i) { return a.indexOf(x) === i; }); }

  /* a step or a screen that is not in this build is skipped quietly */
  function known(id) { return (window.SP.steps || []).some(function (s) { return s.id === id || s.screen === id; }); }
  function go(api, id) { if (known(id)) api.go(id); }
  function show(api, id) { if (known(id)) api.show(id); }

  /* a number that counts to its value. It stops by itself if the screen has gone. */
  function count(el, from, to, ms, fmt, pre) {
    var t0 = null;
    function f(t) {
      if (!el.isConnected) return;
      if (t0 === null) t0 = t;
      var k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3);
      el.textContent = (pre || '') + fmt(from + (to - from) * e);
      if (k < 1) requestAnimationFrame(f);
    }
    requestAnimationFrame(f);
  }

  /* things marked data-in="ms" take their place in that order */
  function arrive(root, api, instant) {
    all(root, '[data-in]').forEach(function (el) {
      if (instant) { el.classList.add('is-in'); return; }
      api.later(140 + (+el.getAttribute('data-in') || 0), function () { el.classList.add('is-in'); });
    });
  }
  /* someone who has asked their system for less motion gets every screen at its final state */
  function quick(opts) { return !!(opts && opts.instant) || !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
  /* opts.instant: lay the final state out with motion off, then give motion back for what is clicked next */
  function still(root, api, instant) {
    if (!instant) return;
    root.classList.add('is-instant');
    api.later(80, function () { root.classList.remove('is-instant'); });
  }

  /* ================================================================
     1 · earn. Inside the workspace, at the moment a stage is graded.
     ================================================================ */
  /* the manager's words for this stage of scenario 1. Stand-ins, like the scenario itself. */
  var STAGE = {
    k: 'stage2', manager: 'Navid', role: 'Your manager at Airbnb',
    before: ['You found the cause: calendar conflicts.', 'Now design the fix. Send me the flow when it is ready.'],
    file: 'New cancel flow', meta: 'Figma, 5 screens',
    good: { t: 'Swap first is the right idea.', s: 'A host with a calendar conflict can move the date and keep the booking.' },
    fix: { t: 'Steps 2 and 4 have no way back.', s: 'A host who taps by mistake is stuck.' },

      var sc = D.scenario(D.RESULT.scenario), num = D.SCENARIOS.indexOf(sc) + 1;
      var now = 0; E.forEach(function (e, i) { if (e.k === STAGE.k) now = i; });
      var cur = E[now], miss = cur.max - cur.got, before = 0, max = 0;

          (i === now ? '<div class="en-why"><span class="en-why-a">' + esc(STAGE.manager) + ' is reading your flow.</span><span class="en-why-b">' + fmt(miss) + ' ' + esc(STAGE.rest) + '</span></div>' : '') + '</div>';

  function burst(root, x, y) {

    var g = c.getContext('2d'), P = [], COL = ['#FFFFFF', '#FFFFFF', '#FFFFFF', '#FFD56B', '#F0B94D'], i;

        r: Math.random() * 6.28, vr: (Math.random() - .5) * .3, ph: Math.random() * 6.28, c: COL[i % COL.length], life: 1000 + Math.random() * 700, dot: i % 5 === 0 });

/* screens/jobs.js */
/* ZERO skill path · Jobs mode: For you, Explore, Applications, and a no.
   One grammar on all four screens. A role is locked, open or applied. White is yours now, paper is ahead.
   A lock is never a wall: it says the level it needs, your level, how far, and the scenario that gets you there.
   Everything is drawn from api.state, so each screen is right at any moment of the story. */
(function () {
  'use strict';
  var D = window.SP_DATA;

  /* ---------- words and dates ---------- */
  var NUM = ['Zero', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve'];
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function Word(n) { return NUM[n] || String(n); }
  function word(n) { return Word(n).toLowerCase(); }
  function many(n, one) { return n === 1 ? one : one + 's'; }
  function day(n) { var d = new Date(); d.setDate(d.getDate() - n); return MON[d.getMonth()] + ' ' + d.getDate(); }
  function ago(n) { return n === 0 ? 'Today' : n === 1 ? 'Yesterday' : n + ' days ago'; }
  function thursday() { var d = new Date(); do { d.setDate(d.getDate() + 1); } while (d.getDay() !== 4); return 'Thursday, ' + MON[d.getMonth()] + ' ' + d.getDate(); }
  function list(a) { return a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]; }

  /* ---------- roles ---------- */
  function lvl(st) { return D.level(st.pts); }
  function roleById(st, id) { return D.roles(st.dream).filter(function (r) { return r.id === id; })[0]; }
  function place(r) { return r.loc === r.mode ? r.loc : r.loc + ' · ' + r.mode; }
  function posted(r) { var n = parseInt(r.posted, 10) || 1; return n === 1 ? 'Posted yesterday' : 'Posted ' + n + ' days ago'; }
  function reply(r) { return 2 + (r.id.charCodeAt(2) + r.id.charCodeAt(r.id.length - 1)) % 4; }      /* typical reply, in days */
  function bandOf(m) { return m >= 88 ? 'Strong' : m >= 80 ? 'Good' : 'Fair'; }
  function nextSc(st) { return D.SCENARIOS[st.done] || null; }
  function startLabel(st, lead) {
    var sc = nextSc(st);
    if (!sc) return 'Raise a grade';
    return (st.done ? lead : 'Start') + ': ' + D.CO[sc.co];
  }
  /* the four sentences every lock is made of */
  function opensAt(r) { return 'Opens at Level ' + r.level + '.'; }
  function youAre(st) { return 'You are Level ' + lvl(st) + '.'; }
  function toGo(r, st) { return D.fmt(Math.max(0, D.at(r.level) - st.pts)) + ' points to go.'; }
  function about(r, st) { var n = D.scenariosTo(r.level, st.pts); return 'About ' + n + ' ' + many(n, 'scenario') + '.'; }
  function byMatch(st) { return function (a, b) { return D.match(b, st) - D.match(a, st); }; }
  /* the lowest level above `lv` that has roles behind it */
  function levelAfter(st, lv) {
    var r = D.roles(st.dream).filter(function (x) { return x.level > lv && !x.target; })[0];
    return r ? r.level : 0;
  }
  function trains(sc) { return sc.skills.map(function (k) { return D.SKILLS[k].name.toLowerCase(); }); }
  function shows(st, k) { return D.SCENARIOS.slice(0, st.done).filter(function (s) { return s.skills.indexOf(k) >= 0; }).length; }
  function ofCases(k, n) { return n === 1 ? 'Your one case shows it.' : k === n ? 'All ' + word(n) + ' of your cases show it.' : Word(k) + ' of your ' + word(n) + ' cases show it.'; }

  /* ---------- what a job asks for, tied to the scenarios that prove it ----------
     For a role at level L the proof is scenarios 1 to L. Four moments spread across them each name the skill
     that scenario trains (deeper the further in), and the last line is the count of shipped cases.
     Every line carries the index of the first scenario that proves it: below state.done means proven. */
  var ASK1 = {
    research: 'User research on a live product',
    ix: 'A full flow, designed and defended',
    visual: 'Visual design that is clear at a glance',
    product: 'A design tied to a business number',
    story: 'A case presented, with questions answered'
  };
  function askText(k, depth) {
    if (depth < 2) return ASK1[k];
    if (k === 'story') return Word(depth) + ' cases presented, with questions answered';
    if (k === 'research') return 'User research on ' + word(depth) + ' live products';
    return D.SKILLS[k].name + ' across ' + word(depth) + ' products';
  }
  function asks(role, st) {
    var SC = D.SCENARIOS, n = Math.min(role.level, SC.length), out = [], used = {}, j, i, k;
    var slots = n === 1 ? [0, 0, 0] : [0, 1, 2, 3].map(function (q) { return Math.floor(q * n / 4); });
    function depth(key, at) { return SC.slice(0, at + 1).filter(function (s) { return s.skills.indexOf(key) >= 0; }).length; }
    for (j = 0; j < slots.length; j++) {
      i = slots[j];
      k = SC[i].skills.filter(function (x) { return !used[x]; })[0];
      if (!k) continue;
      used[k] = 1;
      out.push({ text: askText(k, depth(k, i)), at: i });
    }
    var grade = '';
    if (role.level > SC.length) {
      grade = D.PAYS.filter(function (p) { return p.pts * SC.length >= D.at(role.level); })[0];
      grade = (grade || D.PAYS[D.PAYS.length - 1]).band;
    }
    out.push({ text: Word(n) + ' shipped ' + many(n, 'case') + (grade ? ', graded ' + grade : ', reviewed by a manager'), at: n - 1, pts: !!grade });
    var first = D.scenario(D.RESULT.scenario) || SC[0];
    return out.map(function (a) {
      var sc = SC[a.at], ok = a.at < st.done && (!a.pts || st.pts >= D.at(role.level));
      return { text: a.text, ok: ok, tie: ok ? 'Proven in ' + D.CO[sc.co] + ', ' + sc.title
        : a.at < st.done ? 'Raise your grade in scenario ' + (SC.indexOf(first) + 1) + ', ' + D.CO[first.co]
        : 'You prove this in scenario ' + (a.at + 1) + ', ' + D.CO[sc.co] };
    });
  }
  /* the scenarios already done that back an open role: the ones at that company first, then the latest */
  function backing(role, st) {
    var done = D.SCENARIOS.slice(0, st.done).map(function (s, i) { return { s: s, i: i }; });
    done.sort(function (a, b) { return ((b.s.co === role.co) - (a.s.co === role.co)) || (b.i - a.i); });
    return done.slice(0, 3).map(function (x) { return x.s; });
  }
  /* one honest gap for an open role, and the scenario ahead that closes it */
  function missing(st) {
    var SC = D.SCENARIOS, best = null, i, j, k, c;
    for (i = st.done; i < SC.length; i++) {
      for (j = 0; j < SC[i].skills.length; j++) {
        k = SC[i].skills[j]; c = shows(st, k);
        if (!best || c < best.c) best = { k: k, c: c, i: i };
      }
    }
    if (!best) return null;
    var name = D.SKILLS[best.k].name;
    best.line = best.c === 0
      ? 'Nothing in your portfolio shows ' + name.toLowerCase() + ' yet.'
      : name + ' is your thinnest skill. ' + ofCases(best.c, st.done);
    return best;
  }

  /* ---------- what happened after applying. Honest words, and who has the next move. ---------- */
  var STORY = {
    'r-lin':    { rk: 0, st: 'Interview booked, Thursday 2:00pm', ic: 'cal', you: 'Your move: confirm Thursday',
                  ev: [['Sent, on your yes', 9], ['Viewed', 7], ['Liked you', 5], ['Interview booked', 1]], next: ['Interview', 'Thursday, 2:00pm'],
                  said: 'booked an interview', label: 'Your move', head: 'Confirm {thu}, 2:00pm.', body: '45 minutes on video with the design lead at {co}.' },
    'r-monzo':  { rk: 1, st: 'Liked you', ic: 'heart',
                  ev: [['Sent, on your yes', 11], ['Viewed', 8], ['Liked you', 2]], next: ['Their reply', 'Usually within {n} days'],
                  said: 'liked your portfolio', head: '{co} liked your portfolio.', body: 'They are choosing who to interview. Nothing for you to do yet.' },
    'r-notn':   { rk: 2, st: 'Interview done, waiting', ic: 'clock',
                  ev: [['Sent, on your yes', 24], ['Viewed', 22], ['Liked you', 20], ['Interview booked', 17], ['Interview done', 6]], next: ['Their answer', 'Usually within a week'],
                  said: 'finished your interview', head: 'The interview is done.', body: '{co} has had six days. They usually answer within a week.' },
    'd-intern': { rk: 3, st: 'Viewed', ic: 'eye',
                  ev: [['Sent, on your yes', 6], ['Viewed', 1]], next: ['Their reply', 'Usually within {n} days'],
                  said: 'viewed your application', head: '{co} opened your application yesterday.', body: 'No reply yet. {co} usually replies in about {n} days.' },
    'r-shop':   { rk: 5, st: 'Response unlikely', ic: 'clock', move: 'Waiting on them, two weeks quiet',
                  ev: [['Sent, on your yes', 31], ['Viewed', 16], ['Two weeks with no activity', 2]],
                  said: 'has gone quiet', head: 'A response is unlikely now.', body: '{co} viewed it once on {day:16}, then nothing for two weeks. There is nothing for you to do.' },
    'r-klar':   { rk: 6, st: 'Not selected', ic: 'close', move: 'Next: see what to practise', ended: true,
                  ev: [['Sent, on your yes', 19], ['Viewed', 16], ['Not selected', 3]],
                  said: 'passed', label: 'Closed', head: '{co} passed.', body: 'They went with someone who had more shipped visual work.', act: 'passed' },
    'r-duo':    { rk: 7, st: 'Closed, role filled', ic: 'filled', move: 'Nothing more to do', ended: true,
                  ev: [['Sent, on your yes', 31], ['Viewed', 29], ['Role filled, closed', 12]],
                  said: 'filled the role', label: 'Closed', head: '{co} filled the role.', body: 'It closed on {day:12}, before they replied to anyone at your stage.' }
  };
  function fill(s, co, n) {
    return String(s || '').replace(/\{co\}/g, co).replace(/\{n\}/g, n).replace(/\{thu\}/g, thursday()).replace(/\{day:(\d+)\}/g, function (m, k) { return day(+k); });
  }
  /* every application as things stand. Before the middle of the story everything has only just gone out,
     and anything applied to beyond what the moment starts with was sent a second ago, on this visit. */
  function appsOf(st) {
    var a = st.applied || [], base = (D.MOMENTS[st.moment] || {}).applied || [];
    return a.map(function (id, i) {
      var r = roleById(st, id); if (!r) return null;
      var fresh = base.indexOf(id) < 0, late = st.done >= 6 && !fresh;
      var co = D.CO[r.co], n = reply(r), s = late && STORY[id], d;
      if (!s) {
        d = late ? Math.max(1, (a.length - i) * 2 - 1) : 0;
        s = { rk: 4, st: 'Sent', ic: 'send', ev: [['Sent, on your yes', d]], next: ['Viewed by ' + co, 'Usually within ' + n + ' days'], said: '',
          head: fresh ? 'Sent just now, on your yes.' : late ? 'Sent ' + ago(d).toLowerCase() + ', on your yes.' : 'Sent today at 11:04, on your yes.',
          body: co + ' usually replies in about ' + n + ' days. You will see it here when they open it.' };
      }
      return { id: id, role: r, co: co, rk: s.rk, plain: s.rk === 4, st: s.st, ic: s.ic, mine: !!s.you, ended: !!s.ended, move: s.you || s.move || 'Waiting on them',
        ev: s.ev, last: s.ev[s.ev.length - 1][1], next: s.next ? [s.next[0], fill(s.next[1], co, n)] : null, said: s.said, late: late, fresh: fresh,
        label: s.label || (s.you ? 'Your move' : 'Waiting on them'), head: fill(s.head, co, n), body: fill(s.body, co, n), act: s.act || '' };
    }).filter(Boolean);
  }
  /* when something happened: as a distance for the feed, as a date for the timeline */
  function when(a, d) { return a.fresh ? 'Just now' : a.late ? ago(d) : 'Today, 11:04'; }
  function date(a, d) { return a.fresh ? 'Just now' : a.late ? day(d) : 'Today, 11:04'; }
  function sentLine(a) { return !a || (!a.fresh && !a.late) ? 'Applied today, 11:04' : a.fresh ? 'Applied just now' : 'Applied ' + day(a.ev[0][1]); }

  /* ---------- parts ---------- */
  var IC = {
    heart: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13.2S2.7 10.1 2.7 6.4A2.8 2.8 0 018 5.1a2.8 2.8 0 015.3 1.3c0 3.7-5.3 6.8-5.3 6.8z"/></svg>',
    filled: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="5.8"/><path d="M5.6 8h4.8"/></svg>',
    mark: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.4 2.6h7.2v10.9L8 10.9l-3.6 2.6z"/></svg>',
    markOn: '<svg viewBox="0 0 16 16" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.4 2.6h7.2v10.9L8 10.9l-3.6 2.6z"/></svg>'
  };
  /* the match ring, as the job portal draws it */
  function ring(pct, z) {
    var r = z / 2 - 3.5, c = 2 * Math.PI * r, h = z / 2;
    return '<span class="jb-ring" style="--z:' + z + 'px" title="' + pct + ' match"><svg viewBox="0 0 ' + z + ' ' + z + '"><circle class="tr" cx="' + h + '" cy="' + h + '" r="' + r + '"/>' +
      '<circle class="ar" cx="' + h + '" cy="' + h + '" r="' + r + '" stroke-dasharray="' + (c * pct / 100).toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 ' + h + ' ' + h + ')"/></svg><b>' + pct + '</b></span>';
  }
  function lockPill(api, lv) { return '<span class="jb-lv">' + api.I.lock + 'Level ' + lv + '</span>'; }
  /* the level bar: one segment a level, gold as far as the points go */
  function bar(st, top) {
    var h = '', i, f;
    for (i = 0; i < top; i++) {
      f = Math.max(0, Math.min(1, (st.pts - D.at(i)) / D.PER_LEVEL));
      h += '<i>' + (f > 0 ? '<u style="--f:' + (f * 100).toFixed(1) + '%;--d:' + (i * 45) + 'ms"></u>' : '') + '</i>';
    }
    return '<span class="jb-bar">' + h + '</span>';
  }
  /* a scenario as a way through: where the fix is, what it trains, what it pays */
  function scRow(api, i, opt) {
    var sc = D.SCENARIOS[i], o = opt || {};
    return '<' + (o.tag || 'button') + ' class="jb-sc' + (o.cls ? ' ' + o.cls : '') + '"' + (o.tag ? '' : ' type="button" data-go="world"') + '>' + api.logo(sc.co, 40) +
      '<span class="g"><b>Scenario ' + (i + 1) + ', ' + D.CO[sc.co] + '. ' + api.esc(sc.title) + '.</b>' +
      '<span>Trains ' + (o.skill ? D.SKILLS[o.skill].name.toLowerCase() : list(trains(sc))) + '. Up to ' + D.fmt(D.SCENARIO_MAX) + ' skill points.</span></span>' +
      (o.end || '<em>' + api.I.arrow + '</em>') + '</' + (o.tag || 'button') + '>';
  }
  /* a scroller fades where there is more, and only there */
  function fade(el) {
    if (!el) return;
    function set() {
      var more = el.scrollHeight - el.clientHeight - el.scrollTop;
      el.style.setProperty('--ft', el.scrollTop > 2 ? '20px' : '0px');
      el.style.setProperty('--fb', more > 2 ? '40px' : '0px');
    }
    el.addEventListener('scroll', set); set();
    return set;
  }
  /* one click handler a screen: data-go opens a screen, data-step a step of the story, data-role a role in Explore */
  function wire(root, api, more) {
    function act(e) {
      var t = e.target, a = t.closest('[data-a]'), g = t.closest('[data-go]'), s = t.closest('[data-step]'), r = t.closest('[data-role]');

      if (g) { api.show(g.dataset.go, g.dataset.id ? { id: g.dataset.id } : undefined); return; }

    });
  }

  /* =====================================================================================================
     1. For you. The job you want on top, what is open now, what opens next, and what Zero is doing.
     ===================================================================================================== */
  var SHORT = { intern: 'Intern', junior: 'Junior', mid: 'Designer', senior: 'Senior' };

  function hero(api, st) {
    var tg = D.target(st.dream), s = D.roleState(tg, st), L = tg.level, h;
    var rungs = D.roles(st.dream).filter(function (r) { return r.dream && r.level < L; });
    var marks = rungs.map(function (r) {
      var rs = D.roleState(r, st), key = r.id.replace('d-', ''), nm = SHORT[key] || D.rung(key).band;
      return '<button type="button" class="mk ' + rs + '" data-role="' + r.id + '" style="--k:' + r.level + '">' + (rs === 'locked' ? '<i></i>' : '<i>' + api.I.tick + '</i>') +
        '<span>' + nm + (rs === 'locked' ? ', Level ' + r.level : rs === 'open' ? ', open to you' : ', applied') + '</span></button>';
    }).join('');
    h = '<header>' + api.logo(tg.co, 56) + '<div class="tx"><h1>' + api.esc(tg.title) + '</h1><p>' + D.CO[tg.co] + ' · ' + place(tg) + ' · ' + tg.pay + '</p></div>' +
      (s === 'locked' ? '' : '<span class="jb-now">' + api.I.tick + (s === 'applied' ? 'Applied' : 'Open to you now') + '</span>') + '</header>' +
      '<div class="jb-track" style="--n:' + L + '">' + bar(st, L) + marks +
      '<span class="end ' + s + '">' + (s === 'locked' ? api.I.lock : api.I.tick) + '<span>Level ' + L + '</span></span></div>';
    if (s === 'locked') {
      h += '<footer><p><b>' + opensAt(tg) + '</b> ' + youAre(st) + ' ' + about(tg, st) + '</p>' +
        '<button type="button" class="sp-key dark" data-go="world">' + startLabel(st, 'Continue') + api.I.arrow + '</button></footer>';
    } else if (s === 'open') {

        '<button type="button" class="sp-key dark" data-step="dreamapply">Apply with Zero' + api.I.arrow + '</button></footer>';
    } else {
      h += '<footer><p><b>Applied, on your yes.</b> Every reply lands in your applications.</p>' +
        '<button type="button" class="sp-key dark" data-go="tracker" data-id="' + tg.id + '">See the application' + api.I.arrow + '</button></footer>';
    }
    return '<div class="jb-hero ' + s + '" role="button" tabindex="0" data-role="' + tg.id + '">' + h + '</div>';
  }

  function card(api, st, r, apps) {
    var s = D.roleState(r, st), a, w = '';
    if (s === 'applied') {
      a = (apps || []).filter(function (x) { return x.id === r.id; })[0];

        : '<span class="w ap">' + api.I.tick + sentLine(a) + '</span>';

      '<b>' + api.esc(r.title) + '</b><span class="m">' + D.CO[r.co] + ' · ' + r.loc + ' · ' + r.pay + '</span>' + w + '</button>';
  }

  /* the feed on the right: what Zero is doing, said plainly, for the moment the learner is in */
  function feed(api, st, apps, nOpen) {
    var total = D.roles(st.dream).length, rows = [], sc = D.SCENARIOS[Math.max(0, st.done - 1)];
    function it(mark, text, time) { rows.push('<div class="it">' + mark + '<div><p>' + text + '</p>' + (time ? '<span>' + time + '</span>' : '') + '</div></div>'); }

      it('<span class="ic">' + api.I.clock + '</span>', 'Waiting on your yes to apply');
      it(eye, 'Watching ' + (total - nOpen) + ' more roles on your path');
    } else {
      apps.slice().sort(function (a, b) { return a.last - b.last || a.rk - b.rk; }).slice(0, 3).forEach(function (a) {
        it(api.logo(a.role.co, 32), a.said ? a.co + ' ' + a.said : 'Applied to ' + a.co, when(a, a.last));
      });

    return '<div class="jb-feed">' + rows.join('') +
      (apps.length ? '<button type="button" class="lk" data-go="tracker"><span>All applications</span><em>' + apps.length + '</em>' + api.I.right + '</button>' : '') + '</div>';
  }

  SP.screen({
    id: 'jobs', tone: 'paper', chrome: { rail: 'jobs', pill: true, tabs: 'foryou' },
    mount: function (root, api) {
      var st = api.state, L = lvl(st), apps = appsOf(st), i = 0;
      var all = D.roles(st.dream).filter(function (r) { return !r.target; });
      var open = all.filter(function (r) { return D.roleState(r, st) === 'open'; }).sort(byMatch(st));
      /* applications that have closed live in the tracker, not under what is open */
      var closed = {}; apps.forEach(function (a) { if (a.ended) closed[a.id] = 1; });
      var mine = all.filter(function (r) { return D.roleState(r, st) === 'applied' && !closed[r.id]; }).sort(byMatch(st));
      var now = open.concat(mine), first = now.length ? L : levelAfter(st, L), nextLv = levelAfter(st, first), h = '';
      var firstRoles = now.length ? [] : all.filter(function (r) { return r.level === first; });
      var nextRoles = all.filter(function (r) { return r.level === nextLv; });
      function sec(inner) { return '<section class="jb-in" style="--i:' + (i++) + '">' + inner + '</section>'; }
      function grid(a) { return '<div class="jb-grid">' + a.map(function (r) { return card(api, st, r, apps); }).join('') + '</div>'; }

      h += sec('<h3 class="jb-h">The job you want</h3>' + hero(api, st));
      if (now.length) {
        h += sec('<h3 class="jb-h">Open to you now' + (now.length > 6 ? '<button type="button" data-go="explore">See all ' + now.length + api.I.right + '</button>' : '') + '</h3>' + grid(now.slice(0, 6)));
      } else if (firstRoles.length) {
        var n = D.scenariosTo(first, st.pts), k = firstRoles.length;
        h += sec('<h3 class="jb-h">Open to you now</h3><p class="jb-none">Nothing is open yet. ' +
          (n === 1 ? (st.done ? 'Your next scenario' : 'Your first scenario') : 'Level ' + first) + ' opens ' + (k === 1 ? 'this one' : 'these ' + word(k)) + '.</p>' + grid(firstRoles));
      }

  });

  /* =====================================================================================================
     2. Explore. Every role on the path: the list on the left, one role in full on the right.
     ===================================================================================================== */
  SP.screen({
    id: 'explore', tone: 'paper', chrome: { rail: 'jobs', pill: true, tabs: 'explore' },
    mount: function (root, api, opts) {
      var st = api.state, apps = appsOf(st), ui = { f: 'all', sel: opts && opts.id, ask: '', saved: {}, tell: {} };
      var all = D.roles(st.dream), g = { open: [], applied: [], locked: [] };
      all.forEach(function (r) { g[D.roleState(r, st)].push(r); });
      g.open.sort(byMatch(st)); g.applied.sort(byMatch(st));

      var order = g.open.concat(g.applied, g.locked), cos = {};
      all.forEach(function (r) { cos[r.co] = 1; });
      if (!ui.sel || !roleById(st, ui.sel)) ui.sel = order[0].id;

/* screens/later.js */
/* ZERO skill path · the later moments.
   recap       coming back: what moved on the job side, and the next step
   proof       the portfolio a recruiter opens: what a level and its skill points stand for
   dreamapply  the application to the job the whole path pointed at (and the day it has no opening)
   offer       the end of the path
   Every screen draws from api.state alone, so each one can be opened at any moment of the story. */
(function () {
  'use strict';

  /* ---------- stand-ins this file needs that data.js does not hold yet (listed in the build report) ---------- */
  /* what each later scenario paid. Scenario 1 comes from RESULT. The totals land on the mid and summit moments. */

  /* why a scenario is a strong case to lead with */
  var WHY = {
    s1: 'You found the real cause before you drew anything.',
    s2: 'You tied the price screen to whether riders trust it.',
    s3: 'Signup to first charge, in one sitting.',
    s4: 'You watched setup fail before you fixed it.',
    s5: 'You found why new listeners leave in week one.',
    s6: 'One tap, and the parent still feels in control.',
    s7: 'A screen that still works with no signal.',
    s8: 'You told spam apart from real invites.',
    s9: 'An in-car flow a driver can finish at a glance.',
    s10: 'A tracking screen built on a promise you can keep.'
  };
  /* how a posting words each skill */
  var ASKS = {
    ix: 'Interaction design for whole flows',
    research: 'Research that finds the real problem',
    visual: 'Clear, finished visual design',
    product: 'Product thinking tied to a number',
    story: 'Presenting work under questions'
  };
  var LEAD = ['ix', 'research', 'product'], WANTS = ['ix', 'research', 'product', 'story'];
  var OFFER = { intern: '$46 an hour', junior: '$118,000 a year', mid: '$164,000 a year', senior: '$212,000 a year' };
  var WORD = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];

  var LINK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.7 8.7a3.300 3.300 0 005 .3l2-2a3.300 3.300 0 00-4.700-4.700L7.900 3.400"/><path d="M9.300 7.300a3.300 3.300 0 00-5-.3l-2 2a3.300 3.300 0 004.700 4.700l1.100-1.100"/></svg>';

  /* ---------- small helpers ---------- */

  function qa(el, s) { return Array.prototype.slice.call(el.querySelectorAll(s)); }

  function list(a) { return a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]; }
  function many(n, one, more) { return n === 1 ? one : (more || one + 's'); }
  function earned(D, s) { return s.id === D.RESULT.scenario ? D.RESULT.earned : (EARNED[s.id] || D.PACE); }
  /* the performance band a scenario landed in: the one whose pay is nearest */
  function bandOf(D, pts) {
    var best = D.PAYS[0];

    return best.band;
  }
  /* how one scenario's points fall across its three skills */
  function split(D, s) {
    var o = {};
    if (s.id === D.RESULT.scenario) { D.RESULT.bySkill.forEach(function (b) { o[b.skill] = b.pts; }); return o; }
    var e = earned(D, s), a = Math.round(e * .4 / 10) * 10, b = Math.round(e * .34 / 10) * 10;
    o[s.skills[0]] = a; o[s.skills[1]] = b; o[s.skills[2]] = e - a - b;

    set.forEach(function (s) { var sp = split(D, s); s.skills.forEach(function (k) { t[k].pts += sp[k] || 0; t[k].by.push(s); }); });
    return t;

      if (best) { used[best.id] = 1; out.push({ s: best, skill: k }); }
    });
    done.slice().reverse().sort(function (a, b) { return earned(D, b) - earned(D, a); }).forEach(function (s) {

  /* a number that counts up to its value. The value is already in the markup, so a missed beat still reads right. */
  function countUp(api, el, to, ms, wait) {
    var n = Math.max(1, Math.round((ms || 800) / 32)), i = 0, step = to >= 400 ? 10 : 1;
    el.textContent = api.fmt(0);
    function tick() {
      i++;
      var e = 1 - Math.pow(1 - i / n, 3);
      el.textContent = api.fmt(i >= n ? to : Math.round(to * e / step) * step);
      if (i < n) api.later(32, tick);
    }
    api.later(wait || 0, tick);
  }
  /* centre a panel on the canvas, a touch above the middle, where the eye puts the centre */
  function centre(api, el, lift) { el.style.top = Math.round((api.H - el.offsetHeight) / 2 - (lift || 0)) + 'px'; }
  var ZONE = { x: 300, y: 100, w: 1000, h: 640 };

  /* ================= 1 · recap: what moved while you were away ================= */
  SP.screen({

      var byId = {};
      D.roles(st.dream).forEach(function (r) { byId[r.id] = r; });
      var mine = st.applied.map(function (id) { return byId[id]; }).filter(Boolean);
      var liked = mine.length > 1 ? mine[mine.length - 2] : mine[0], booked = mine.length > 1 ? mine[mine.length - 1] : null;
      var rows = [];
      if (liked) rows.push({ to: 'tracker', mark: api.logo(liked.co, 40, 'round'), html: '<b>' + esc(D.CO[liked.co]) + '</b> liked your portfolio. <em>Yesterday.</em>' });
      if (booked) rows.push({ to: 'tracker', mark: api.logo(booked.co, 40, 'round'), html: '<b>' + esc(D.CO[booked.co]) + '</b> booked you for Thursday, 2:00pm.' });
      if (!mine.length) {
        var open = D.roles(st.dream).filter(function (r) { return D.roleState(r, st) === 'open'; });
        if (open.length) rows.push({ to: 'jobs', mark: api.logo(open[open.length - 1].co, 40, 'round'), html: '<b>' + open.length + ' ' + many(open.length, 'role') + '</b> ' + many(open.length, 'is', 'are') + ' open to you. <em>Zero applies with you.</em>' });

      var opens = uniq(D.rolesAt(st.dream, lv + 1).map(function (r) { return D.CO[r.co]; }));
      rows.push({ to: 'path', mark: api.ring(lv, D.into(st.pts) / D.PER_LEVEL, 40),
        html: '<b>' + D.fmt(D.toNext(st.pts)) + ' skill points</b> to Level ' + (lv + 1) + '.' + (opens.length ? ' <em>It opens ' + esc(list(opens)) + '.</em>' : '') });

      root.innerHTML =

            '<button type="button" class="sp-ghost rc-apps">See applications</button>' +
          '</div>' +
        '</div>';

      centre(api, q(root, '.rc-panel'), 10);
      qa(root, '.rc-row').forEach(function (b) { b.addEventListener('click', function () { api.show(b.dataset.to); }); });
      q(root, '.rc-go').addEventListener('click', function () { api.show('world'); });
      q(root, '.rc-apps').addEventListener('click', function () { api.show('tracker'); });
    }
  });

  /* ================= 2 · proof: the portfolio a recruiter opens ================= */
  SP.screen({
    id: 'proof', tone: 'paper', chrome: { rail: 'jobs', pill: true, tabs: 'portfolio' },
    mount: function (root, api) {

      var done = D.SCENARIOS.slice(0, st.done), T = tally(D, done), all = tally(D, D.SCENARIOS), top = 0;
      Object.keys(all).forEach(function (k) { top = Math.max(top, all[k].pts); });
      var cap = Math.ceil(top / 500) * 500 || D.PER_LEVEL;       /* the bar is full where the strongest skill ends up */
      var band = lv >= 1 ? D.band(lv) : null;

      var skills = Object.keys(D.SKILLS).map(function (k) {

          '<p class="m">' + esc(D.CO[s.co]) + ' · <b>' + esc(bandOf(D, e)) + '</b></p>' +

      api.later(520, function () { qa(root, '.pf-sk .bar i').forEach(function (b) { b.style.width = b.dataset.w + '%'; }); });
      qa(root, '.pf-sk .pt b').forEach(function (b, i) { var n = +b.dataset.n; if (n) countUp(api, b, n, 900, 420 + i * 60); });

      var copy = q(root, '.pf-copy');
      copy.addEventListener('click', function () {
        if (copy.classList.contains('done')) return;
        copy.classList.add('done');
        api.later(2200, function () { copy.classList.remove('done'); });
      });
    }
  });

  /* ================= 3 · dreamapply: the application to the job the path pointed at ================= */
  SP.screen({
    id: 'dreamapply', tone: 'paper', chrome: { rail: 'jobs', pill: true, tabs: 'foryou' },
    mount: function (root, api, opts) {
      var D = api.data, st = api.state, esc = api.esc, role = D.target(st.dream), co = D.CO[role.co], lv = D.level(st.pts);
      var watch = !!(opts && opts.watch), was = D.roleState(role, st), locked = was === 'locked';
      var done = D.SCENARIOS.slice(0, st.done), picks = cases(D, done), prove = proofs(D, done, picks), m = D.match(role, st);

      function tag(kind) {
        if (kind === 'watch') return '<span class="da-st">No opening today</span>';
        if (kind === 'locked') return '<span class="da-st">' + api.I.lock + 'Opens at Level ' + role.level + '</span>';
        if (kind === 'applied') return '<span class="da-st">' + api.I.tick + 'Applied</span>';

      }
      var hero =

          (locked ? '' : '<div class="da-match">' + mring(m, 52) + '<span><em>Match</em><b>' + matchWord(m) + '</b></span></div>') +
        '</header>';

      /* ---- the day the company has no opening: say so, keep watching, and show what is open ---- */
      if (watch) {
        var near = D.roles(st.dream).filter(function (r) { return !r.dream && r.level <= role.level && r.level >= role.level - 1; })
          .sort(function (a, b) { return b.level - a.level; });

          '<div class="da-scroll"><div class="da-col">' +
            '<div class="da-card">' + hero +
              '<p class="da-say lt-in" style="--i:1">Nothing is missing on your side. I am watching their careers page and will ask you the day one appears.</p>' +
              '<footer class="da-foot lt-in" style="--i:2"><p class="da-quiet"><span class="q">Last checked today, 9:00am.</span></p>' +
                '<span class="da-watching">' + api.I.eye + 'Watching</span></footer>' +
            '</div>' +
            (near.length ? '<div class="da-sec lt-in" style="--i:3"><b>Open at your level today</b><span>Level ' + (role.level - 1) + ' to ' + role.level + '</span></div>' : '') +
            '<div class="da-near">' + near.map(function (r, i) {
              var s = D.roleState(r, st);
              return '<button type="button" class="da-role lt-in" style="--i:' + (4 + i) + '">' +
                '<span class="top">' + api.logo(r.co, 40) + mring(D.match(r, st), 40) + '</span>' +
                '<b>' + esc(r.title) + '</b><span class="m">' + esc(D.CO[r.co]) + ' · ' + esc(r.loc) + '</span><span class="m">' + esc(r.pay) + '</span>' +
                '<span class="s' + (s === 'applied' ? '' : ' open') + '">' + (s === 'applied' ? api.I.tick + 'Applied' : '<i></i>Open to you') + '</span>' +
              '</button>';
            }).join('') + '</div>' +
            '<div class="da-after lt-in" style="--i:' + (4 + near.length) + '"><button type="button" class="sp-key dark da-view">' + (near.length === 1 ? 'See this role' : near.length ? 'See these roles' : 'See open roles') + '</button></div>' +
          '</div></div>';
        qa(root, '.da-role, .da-view').forEach(function (b) { b.addEventListener('click', function () { api.show('explore'); }); });
        return;

      /* ---- the application ---- */
      var rest = done.filter(function (s) { return !picks.some(function (p) { return p.s === s; }); }).reverse();
      var titles = picks.map(function (p) { return p.s.title; });
      var caseRows = picks.map(function (p, i) {
        return '<li><span class="n">' + (i + 1) + '</span>' + api.logo(p.s.co, 36) +
          '<span class="tx"><b>' + esc(p.s.title) + '</b><span><em>' + esc(D.SKILLS[p.skill].name) + '.</em> ' + esc(WHY[p.s.id] || '') + '</span></span></li>';
      }).join('');
      var askRows = WANTS.map(function (k) {
        var s = prove[k];
        return '<li class="' + (s ? 'ok' : '') + '"><span class="ck">' + (s ? api.I.tick : '') + '</span>' +
          '<span class="tx"><b>' + esc(ASKS[k]) + '</b><span>' + (s ? esc(s.title) + ', ' + esc(D.CO[s.co]) : 'No scenario proves this yet') + '</span></span></li>';
      }).join('');
      var say = locked
        ? 'It opens at Level ' + role.level + '. You are Level ' + lv + ', about ' + D.scenariosTo(role.level, st.pts) + ' ' + many(D.scenariosTo(role.level, st.pts), 'scenario') + ' away. This is what I would send today.'
        : 'This is the one you picked on day one. <span class="tail">Here is what I would send.</span>';

      root.innerHTML =
        '<div class="da-scroll"><div class="da-col">' +
          '<div class="da-card">' + hero +
            '<p class="da-say lt-in" style="--i:1">' + say + '</p>' +
            '<div class="da-cols lt-in" style="--i:2">' +
              '<section class="da-tile da-cases"><h3>' + (picks.length === 3 ? 'Your three strongest cases first' : 'Your strongest cases first') + '</h3>' +
                (picks.length ? '<ol>' + caseRows + '</ol>' : '<p class="none">Your first scenario puts the first case here.</p>') +
                (rest.length ? '<div class="da-x"><div class="in"><h3>Then the other ' + (WORD[rest.length] || rest.length) + ', newest first</h3><div class="rest">' +
                  rest.map(function (s) { return api.logo(s.co, 30); }).join('') + '</div><p>Every case carries its review.</p></div></div>' : '') +
              '</section>' +
              '<section class="da-tile da-asks"><h3>What it asks for</h3><ul>' + askRows + '</ul>' +
                (picks.length ? '<div class="da-x"><div class="in"><h3>The note I would send</h3><p>My portfolio opens with ' +
                  (WORD[titles.length] || titles.length) + ' reviewed ' + many(titles.length, 'case') + ': ' + esc(list(titles)) + '. A manager graded each one.</p></div></div>' : '') +
              '</section>' +
            '</div>' +
            (locked ? '' : '<div class="da-top lt-in" style="--i:3" role="switch" aria-checked="true" tabindex="0"><span class="tx"><b>Top choice</b><span>One role a month can carry this. The recruiter sees it.</span></span><span class="da-sw"></span></div>') +
            '<footer class="da-foot lt-in" style="--i:4">' +
              '<p class="da-quiet"><span class="q">Nothing goes out without your yes.</span><span class="s">' + api.I.tick + 'Sent, 10:42. I will tell you the moment they open it.</span></p>' +
              (picks.length ? '<button type="button" class="sp-ghost da-read">Let me read it first</button>' : '') +
              '<button type="button" class="sp-key dark da-apply"><span>' + (locked ? 'See the path' : 'Apply with Zero') + '</span></button>' +
            '</footer>' +
          '</div>' +
        '</div></div>';

      var card = q(root, '.da-card'), scroll = q(root, '.da-scroll'), apply = q(root, '.da-apply'), read = q(root, '.da-read'), top = q(root, '.da-top');

      });

        if (card.classList.contains('sent')) { api.go('offer'); return; }
        card.classList.add('busy');

        q(apply, 'span').textContent = 'Sending';

          card.classList.remove('busy');
          sent();
          api.drawPill();
        });
      });
    }
  });

  /* ================= 4 · offer: the end of the path ================= */
  SP.screen({

        '<div class="of-panel sp-glass">' +

          '<h1 class="sp-h1 lt-in" style="--i:1">' + esc(co) + ' made you an offer.</h1>' +
          '<p class="of-role lt-in" style="--i:2">' + esc(role.title) + ', ' + esc(role.loc) + '. <b>' + esc(OFFER[st.dream.rung] || OFFER.mid) + '.</b></p>' +
          '<div class="of-path lt-in" style="--i:3">' + nums.map(function (n) { return '<div><b class="sp-num" data-n="' + n[0] + '">' + D.fmt(n[0]) + '</b><span>' + n[1] + '</span></div>'; }).join('') + '</div>' +
          '<div class="of-acts lt-in" style="--i:4">' +
            '<div class="of-ask"><button type="button" class="sp-key" data-say="yes">Accept</button>' +
              '<button type="button" class="sp-ghost" data-say="week">Ask for a week</button><button type="button" class="sp-ghost" data-say="no">Decline</button></div>' +
            '<div class="of-said"></div>' +
          '</div>' +
        '</div>';

      var panel = q(root, '.of-panel'), acts = q(root, '.of-acts'), ask = q(root, '.of-ask'), said = q(root, '.of-said');
      centre(api, panel, 6);
      acts.style.height = ask.offsetHeight + 'px';

      qa(root, '[data-say]').forEach(function (b) {

  });
})();
