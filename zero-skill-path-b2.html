/* screens/loop.css */
/* ZERO skill path · the loop around one scenario.
   earn (inside the workspace) · review · levelup · applyask · whenback.
   Paper values come from the job portal, the workspace layout from the app's own Stage workspace
   (rail, the manager in the middle), the world values from core.css. */

/* ---------- shared: things take their place by rising a little ---------- */
.sc-earn .en-new,.sc-review [data-in],.sc-levelup [data-in],.sc-levelup .lu-late,.sc-applyask [data-in],.sc-whenback [data-in]{
  opacity:0;transform:translateY(10px);transition:opacity .5s var(--ease),transform .7s var(--spring)}
.sc-earn .en-new.is-in,.sc-review [data-in].is-in,.sc-levelup [data-in].is-in,.sc-levelup .lu-late.is-in,.sc-applyask [data-in].is-in,.sc-whenback [data-in].is-in{opacity:1;transform:none}
.sc-earn.is-instant *,.sc-review.is-instant *,.sc-levelup.is-instant *,.sc-applyask.is-instant *,.sc-whenback.is-instant *,
.sc-earn.is-instant *::after,.sc-levelup.is-instant *::after{transition:none!important;animation:none!important}
@keyframes lp-spin{to{transform:rotate(360deg)}}
@keyframes lp-pop{0%{transform:scale(.5)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes lp-sweep{0%{background-position:170% 0}100%{background-position:-170% 0}}

/* ================================================================
   1 · earn. The workspace, in its light skin: warm paper, white cards.
   ================================================================ */
.sc-earn::before{content:'';position:absolute;inset:-900px;background:#F2F0ED}

/* ----- the rail: the scenario, and the moments that pay ----- */
.sc-earn .en-rail{position:absolute;left:30px;top:96px;width:320px}
.sc-earn .en-chip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 13px 0 5px;border-radius:99px;background:#fff;box-shadow:0 0 0 1px var(--line),var(--sh1)}
.sc-earn .en-chip>span:last-child{padding-bottom:1px;font:500 13px/1 var(--sans);color:var(--tx-2)}
.sc-earn .en-title{margin-top:14px}
.sc-earn .en-card{margin-top:22px;padding:8px;border-radius:22px;background:#fff;box-shadow:0 0 0 1px var(--line),var(--sh1)}
.sc-earn .en-h{padding:9px 12px 9px;font:400 13px/18px var(--sans);color:var(--tx-3)}
.sc-earn .en-row{display:grid;grid-template-columns:18px minmax(0,1fr) auto;align-items:center;column-gap:12px;padding:11px 12px;border-radius:14px}
.sc-earn .en-lb{font:400 15px/18px var(--sans);color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-earn .en-pt{font:400 13px/18px var(--sans);color:var(--tx-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.sc-earn .en-pt b{font-weight:500;color:var(--tx)}
.sc-earn .en-row.is-ahead .en-lb{color:var(--tx-3)}
.sc-earn .en-dot{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--tx-4)}
/* the one being graded */
.sc-earn .en-row.is-now{margin:2px 0;padding-top:13px;padding-bottom:13px;background:var(--field)}
.sc-earn .en-row.is-now .en-lb{font-weight:500}
.sc-earn .en-mk{position:relative;width:18px;height:18px}
.sc-earn .en-mk .sp-tick{position:absolute;inset:0;opacity:0;transform:scale(.5)}
.sc-earn .en-spin{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(26,25,23,.14);border-top-color:var(--tx-2);animation:lp-spin .8s linear infinite;transition:opacity .25s var(--ease)}
.sc-earn .en-row.is-graded .en-spin{opacity:0;animation:none}
.sc-earn .en-row.is-graded .en-mk .sp-tick{opacity:1;transform:none;animation:lp-pop .5s var(--spring)}
.sc-earn .en-why{grid-column:2 / 4;position:relative;height:19px;margin-top:4px;overflow:hidden;transition:height .5s var(--spring)}
.sc-earn .en-why span{position:absolute;left:0;right:0;top:0;font:400 13px/19px var(--sans);color:var(--tx-2);text-wrap:pretty;transition:opacity .35s var(--ease)}
.sc-earn .en-why-a{color:var(--tx-3)}
.sc-earn .en-why-b{opacity:0}
.sc-earn .en-row.is-graded .en-why-a{opacity:0}
.sc-earn .en-row.is-graded .en-why-b{opacity:1;transition-delay:.15s}
/* the running total */
.sc-earn .en-total{margin-top:8px;padding:16px 20px 20px;border-radius:22px;background:#fff;box-shadow:0 0 0 1px var(--line),var(--sh1)}
.sc-earn .en-total-r{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sc-earn .en-total-r>span:first-child{font:400 13px/18px var(--sans);color:var(--tx-2)}
.sc-earn .en-total-n{display:flex;align-items:center;gap:7px;font:400 15px/18px var(--sans);color:var(--tx-3);font-variant-numeric:tabular-nums}
.sc-earn .en-total-n b{font-weight:500;color:var(--tx)}
.sc-earn .en-bar{height:4px;margin-top:14px;border-radius:99px;background:var(--sunk);overflow:hidden}
.sc-earn .en-bar i{display:block;height:100%;border-radius:99px;background:#E3A62B;transition:width .9s var(--out)}

/* ----- the manager, in the middle ----- */
.sc-earn .en-main{position:absolute;left:656px;top:96px;width:640px;height:668px;display:flex;flex-direction:column}
.sc-earn .en-peer{flex:none;display:flex;align-items:center;gap:12px;height:40px}
.sc-earn .en-ava{flex:none;width:40px;height:40px;border-radius:50%;background:#DDD9D2 center/cover no-repeat;box-shadow:0 0 0 1px var(--line)}
.sc-earn .en-who b{display:block;font:500 15px/18px var(--sans);color:var(--tx)}
.sc-earn .en-who span{display:block;margin-top:2px;font:400 13px/16px var(--sans);color:var(--tx-3)}
.sc-earn .en-thread{flex:1;min-height:0;margin:4px -24px 0;padding:0 24px;overflow-y:auto;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%)}
.sc-earn .en-msgs{display:flex;flex-direction:column;gap:20px;padding:22px 0 24px}
.sc-earn .en-bub{align-self:flex-start;max-width:460px;padding:10px 16px 11px;border-radius:20px;background:#fff;box-shadow:0 0 0 1px var(--line-2);font:400 15px/1.45 var(--sans);color:var(--tx)}
.sc-earn .en-bub+.en-bub{margin-top:-12px}
/* the handed-in file */
.sc-earn .en-file{align-self:flex-end}
.sc-earn .en-att{position:relative;display:flex;align-items:center;gap:13px;padding:10px 20px 10px 10px;border-radius:18px;background:#fff;box-shadow:0 0 0 1px var(--line),var(--sh1);overflow:hidden}
.sc-earn .en-thumb{flex:none;display:flex;align-items:center;justify-content:center;gap:3px;width:62px;height:46px;border-radius:8px;background:var(--field)}
.sc-earn .en-thumb i{width:7px;height:20px;border-radius:2px;background:var(--tx-4)}
.sc-earn .en-fm b{display:block;font:500 15px/18px var(--sans);color:var(--tx);white-space:nowrap}
.sc-earn .en-fm span{display:block;margin-top:2px;font:400 13px/16px var(--sans);color:var(--tx-3);white-space:nowrap}
.sc-earn .en-cap{margin-top:6px;padding-right:4px;text-align:right;font:400 12px/16px var(--sans);color:var(--tx-3)}
.sc-earn .en-file.is-reading .en-att::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 32%,rgba(26,25,23,.07) 50%,transparent 68%);background-size:220% 100%;animation:lp-sweep 1.1s var(--ease) infinite}
/* "reading", then "reviewed" */
.sc-earn .en-synth{align-self:flex-start;display:flex;align-items:center;gap:9px;margin-top:-4px;padding-left:2px}
.sc-earn .en-synth i{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 0 0 1px var(--line);color:var(--tx-2)}
.sc-earn .en-synth i svg{width:13px;height:13px}
.sc-earn .en-synth span{font:400 13px/18px var(--sans);color:var(--tx-3);transition:color .4s var(--ease)}
.sc-earn .en-synth.is-done span{color:var(--tx-2)}
/* the review: what was good, what is left, and the points on each */
.sc-earn .en-review{align-self:flex-start;width:548px;margin-top:-8px;padding:8px;border-radius:22px;background:#fff;box-shadow:0 0 0 1px var(--line),var(--sh2)}
.sc-earn .en-note{display:grid;grid-template-columns:22px minmax(0,1fr) auto;column-gap:12px;align-items:center;padding:11px 12px 13px;
  opacity:0;transform:translateY(6px);transition:opacity .45s var(--ease) .12s,transform .6s var(--spring) .12s}
.sc-earn .en-note+.en-note{transition-delay:.26s}
.sc-earn .en-review.is-in .en-note{opacity:1;transform:none}
.sc-earn .en-note b{display:block;font:500 15px/22px var(--sans);color:var(--tx)}
.sc-earn .en-note p{grid-column:2 / 4;margin-top:1px;font:400 13px/19px var(--sans);color:var(--tx-2);text-wrap:pretty}
.sc-earn .en-ring{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--tx-4)}
.sc-earn .en-tag{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px 1px 9px;border-radius:99px;font:500 13px/1 var(--sans);white-space:nowrap;font-variant-numeric:tabular-nums;
  opacity:0;transform:scale(.8);transition:opacity .3s var(--ease),transform .55s var(--spring)}
.sc-earn .en-tag.is-in{opacity:1;transform:none}
.sc-earn .en-tag.is-good{background:var(--field);color:var(--tx)}
.sc-earn .en-tag.is-held{padding:0 11px 1px;color:var(--tx-3);box-shadow:inset 0 0 0 1px var(--line);transition-delay:.12s}
/* the one thing to do next */
.sc-earn .en-next{flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;height:72px;margin-top:4px;padding:0 12px 0 24px;border-radius:26px;background:#fff;box-shadow:0 0 0 1px var(--line),var(--sh2)}
.sc-earn .en-next p{font:400 15px/20px var(--sans);color:var(--tx-2)}

/* ================================================================
   2 · review. One result, then what it paid.
   ================================================================ */
.sc-review .rv-col{position:absolute;left:420px;top:0;width:760px;height:840px;padding:10px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sc-review .rv-chip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 13px 0 5px;border-radius:99px;background:#fff;box-shadow:0 0 0 1px var(--line),var(--sh1)}
.sc-review .rv-chip>span:last-child{padding-bottom:1px;font:500 13px/1 var(--sans);color:var(--tx-2)}
.sc-review .rv-title{margin-top:18px;text-align:center}
.sc-review .rv-pts{display:flex;align-items:center;gap:9px;margin-top:14px;height:34px}
.sc-review .rv-n{font:500 28px/34px var(--sans);letter-spacing:-.03em;color:var(--tx);font-variant-numeric:tabular-nums;white-space:nowrap}
.sc-review .rv-pts>span:last-child{margin-left:1px;padding-top:7px;font:400 15px/20px var(--sans);color:var(--tx-2)}
.sc-review .rv-card{align-self:stretch;margin-top:28px;padding:24px 28px 26px;border-radius:24px;background:#fff;box-shadow:0 0 0 1px var(--line),var(--sh1);display:flex;flex-direction:column;gap:22px}
.sc-review .rv-r1{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.sc-review .rv-name{font:500 15px/20px var(--sans);color:var(--tx)}
.sc-review .rv-of{font:400 15px/20px var(--sans);color:var(--tx-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.sc-review .rv-of b{font-weight:500;color:var(--tx)}
.sc-review .rv-bar{height:4px;margin-top:9px;border-radius:99px;background:var(--sunk);overflow:hidden}
.sc-review .rv-bar i{display:block;width:0;height:100%;border-radius:99px;background:#E3A62B;transition:width 1s var(--out)}
.sc-review .rv-why{margin-top:10px;font:400 13px/18px var(--sans);color:var(--tx-2)}
/* what was left, and the way to get some of it back */
.sc-review .rv-left{position:relative;align-self:stretch;display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:84px;margin-top:12px;padding:16px 20px 16px 28px;border-radius:24px;background:var(--sunk)}
.sc-review .rv-ask,.sc-review .rv-fix{transition:opacity .3s var(--ease)}
.sc-review .rv-ask p{font:400 13px/18px var(--sans);color:var(--tx-2)}
.sc-review .rv-ask b{display:block;margin-top:4px;font:500 15px/20px var(--sans);color:var(--tx)}
.sc-review .rv-fix{flex:none}
.sc-review .rv-fix:active{transform:translateY(1px)}
.sc-review .rv-fixed{position:absolute;left:28px;right:28px;top:0;bottom:0;display:flex;align-items:center;gap:12px;opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .4s var(--ease) .18s,transform .6s var(--spring) .18s}
.sc-review .rv-fixed b{font:500 15px/20px var(--sans);color:var(--tx)}
.sc-review .rv-left.is-fixed .rv-ask,.sc-review .rv-left.is-fixed .rv-fix{opacity:0;pointer-events:none}
.sc-review .rv-left.is-fixed .rv-fixed{opacity:1;transform:none}
.sc-review .rv-left.is-fixed .rv-fixed .sp-tick{animation:lp-pop .5s var(--spring) .18s backwards}
.sc-review .rv-go{margin-top:28px}
.sc-review .rv-go .sp-key{min-width:148px}

/* ================================================================
   3 · levelup. The level, and the roles it opens.
   ================================================================ */
.sc-levelup .lu-burst{position:absolute;left:0;top:0;width:1600px;height:840px;pointer-events:none}
.sc-levelup::before{content:'';position:absolute;left:200px;top:-80px;width:1200px;height:1000px;pointer-events:none;background:radial-gradient(closest-side,rgba(9,10,10,.62),rgba(9,10,10,.5) 45%,rgba(9,10,10,0))}
.sc-levelup .lu-col{position:absolute;inset:0;padding-bottom:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
/* the ring: the number is the level, the arc is how far into it */
.sc-levelup .lu-ring{position:relative;flex:none;width:132px;height:132px;border-radius:50%;display:grid;place-items:center;
  background:var(--glass);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px rgba(0,0,0,.35),0 30px 60px -26px rgba(0,0,0,.8)}
.sc-levelup .lu-ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.sc-levelup .lu-ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.sc-levelup .lu-ring .tr{stroke:rgba(244,244,243,.13)}
.sc-levelup .lu-ring .a1,.sc-levelup .lu-ring .a2{stroke:var(--gold);stroke-dasharray:100;transition:stroke-dashoffset .9s var(--out),opacity .45s var(--ease)}
.sc-levelup .lu-ring .a1{stroke-dashoffset:calc(100 - var(--p,0) * 100)}
.sc-levelup .lu-ring .a2{stroke-dashoffset:calc(100 - var(--q,0) * 100);opacity:0}
.sc-levelup .lu-ring.is-rolled .a1{opacity:0}
.sc-levelup .lu-ring.is-rolled .a2{opacity:1;transition:stroke-dashoffset 1s var(--out) .12s,opacity .2s var(--ease) .1s}
.sc-levelup .lu-ring.is-rolled{animation:lu-bump .8s var(--spring)}
@keyframes lu-bump{0%{transform:scale(1)}30%{transform:scale(1.07)}100%{transform:scale(1)}}
.sc-levelup .lu-num{position:relative;width:96px;height:64px;overflow:hidden}
.sc-levelup .lu-num b{position:absolute;inset:0;display:grid;place-items:center;font:600 54px/1 var(--sans);letter-spacing:-.03em;color:var(--tx);font-variant-numeric:tabular-nums;
  transition:transform .65s var(--spring),opacity .3s var(--ease)}
.sc-levelup .lu-num .n{transform:translateY(64%);opacity:0}
.sc-levelup .lu-ring.is-rolled .lu-num .o{transform:translateY(-64%);opacity:0}
.sc-levelup .lu-ring.is-rolled .lu-num .n{transform:none;opacity:1}
.sc-levelup .lu-title{margin-top:22px}
.sc-levelup .lu-line{margin-top:8px}
/* a role: locked, then open. The open face spreads from the lock. */
.sc-levelup .lu-roles{display:flex;gap:16px;margin-top:30px}
.sc-levelup .lu-role{position:relative;width:296px;border-radius:24px;text-align:left;box-shadow:0 24px 48px -30px rgba(0,0,0,.9)}
.sc-levelup .lu-face{display:flex;flex-direction:column;padding:20px 20px 19px;border-radius:24px}
.sc-levelup .lu-top{display:flex;align-items:flex-start;justify-content:space-between}
.sc-levelup .lu-t{margin-top:18px;font:500 15px/20px var(--sans);letter-spacing:-.014em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-levelup .lu-m{margin-top:2px;font:400 13px/18px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-levelup .lu-t+.lu-m{margin-top:3px}
.sc-levelup .lu-s{display:flex;align-items:center;gap:7px;margin-top:14px;font:500 13px/18px var(--sans)}
.sc-levelup .lu-lk{background:rgba(26,28,27,.88);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 0 0 1px rgba(255,255,255,.05),0 0 0 1px rgba(0,0,0,.45)}
.sc-levelup .lu-lk .sp-lg{filter:grayscale(1);opacity:.55}
.sc-levelup .lu-lk .lu-t{color:var(--tx-2)}
.sc-levelup .lu-lk .lu-m{color:var(--tx-3)}
.sc-levelup .lu-lk .lu-s{font-weight:400;color:var(--tx-3)}
.sc-levelup .lu-lk .sp-lock svg{overflow:visible}
.sc-levelup .lu-sh{transform-box:view-box;transform-origin:9.1px 6.3px;transition:transform .22s var(--spring)}
.sc-levelup .lu-role.is-click .lu-sh{transform:translateY(-1.5px) rotate(24deg)}
.sc-levelup .lu-op{position:absolute;inset:0;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.22);
  clip-path:circle(0px at calc(100% - 34px) 34px);transition:clip-path .75s cubic-bezier(.32,0,.12,1)}
.sc-levelup .lu-role.is-open .lu-op{clip-path:circle(420px at calc(100% - 34px) 34px)}
.sc-levelup .lu-op .lu-t{color:#141312}
.sc-levelup .lu-op .lu-m{color:#5D5A54}
.sc-levelup .lu-op .lu-s{color:var(--ok-deep)}
.sc-levelup .lu-op .lu-s::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--ok)}
.sc-levelup .lu-op .sp-tick path{stroke-dasharray:12;stroke-dashoffset:12;transition:stroke-dashoffset .4s var(--out) .22s}
.sc-levelup .lu-role.is-open .lu-op .sp-tick path{stroke-dashoffset:0}
.sc-levelup .lu-role.is-open .lu-op .sp-tick{animation:lp-pop .55s var(--spring)}
.sc-levelup .lu-role.is-open{animation:lu-lift .8s var(--spring)}
@keyframes lu-lift{0%{transform:scale(1)}32%{transform:scale(1.035)}100%{transform:scale(1)}}
/* the long goal, and what the next level holds */
.sc-levelup .lu-goal{display:flex;align-items:center;gap:10px;margin-top:30px}
.sc-levelup .lu-goal>span:last-child{font:400 15px/20px var(--sans);color:var(--tx-2)}
.sc-levelup .lu-goal b{font-weight:500;color:var(--tx)}
.sc-levelup .lu-next{display:flex;align-items:center;gap:8px;margin-top:12px}
.sc-levelup .lu-next>span{font:400 13px/18px var(--sans);color:var(--tx-2)}
.sc-levelup .lu-next>span:first-child{margin-right:2px}
.sc-levelup .lu-next>span:last-child{margin-left:2px}
.sc-levelup .lu-next>.lu-nchip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px 0 5px;border-radius:99px;background:rgba(26,28,27,.8);box-shadow:inset 0 0 0 1px var(--line);color:var(--tx-2)}
.sc-levelup .lu-nchip .sp-lg{filter:grayscale(1);opacity:.6}
.sc-levelup .lu-nchip b{padding-bottom:1px;font:500 13px/1 var(--sans)}
.sc-levelup .lu-nchip svg{width:12px;height:12px;color:var(--tx-3)}
.sc-levelup .lu-go{margin-top:28px}

/* ================================================================
   4 · applyask. Zero asks before it applies.
   ================================================================ */
.sc-applyask .aa-col{position:absolute;left:420px;top:84px;width:760px;height:728px;display:flex;flex-direction:column;justify-content:center}
.sc-applyask .aa-title{font-size:34px;line-height:1.14}
.sc-applyask .aa-title.is-swap{animation:aa-swap .6s var(--spring)}
@keyframes aa-swap{from{opacity:0;transform:translateY(8px)}}
.sc-applyask .aa-roles{display:flex;flex-direction:column;gap:4px;margin-top:26px;padding:8px;border-radius:24px;background:#fff;box-shadow:0 0 0 1px var(--line),var(--sh1)}
.sc-applyask .aa-row{display:grid;grid-template-columns:20px 44px minmax(0,1fr) auto;column-gap:14px;row-gap:10px;align-items:center;width:100%;padding:14px 16px 15px;border-radius:16px;text-align:left;transition:background .2s var(--ease),opacity .4s var(--ease)}
.sc-applyask .aa-row:hover{background:var(--wash)}
.sc-applyask .aa-row:active .aa-box{transform:scale(.9)}
.sc-applyask .aa-row.is-on{background:var(--field)}
.sc-applyask .aa-row.is-on:hover{background:var(--sunk)}
.sc-applyask .aa-row.is-sent,.sc-applyask .aa-row.is-off,.sc-applyask .aa-col.is-busy .aa-row{cursor:default}
.sc-applyask .aa-row.is-sent:hover,.sc-applyask .aa-row.is-off:hover{background:transparent}
.sc-applyask .aa-col.is-busy .aa-row.is-on:hover{background:var(--field)}
.sc-applyask .aa-row.is-off{opacity:.5}
.sc-applyask .aa-box{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:transparent;box-shadow:inset 0 0 0 1.5px var(--tx-4);transition:background .18s var(--ease),box-shadow .18s var(--ease),color .18s var(--ease),border-radius .3s var(--ease),transform .18s var(--out)}
.sc-applyask .aa-box svg{width:12px;height:12px}
.sc-applyask .aa-row.is-on .aa-box{background:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);color:#fff}
.sc-applyask .aa-row.is-sent .aa-box{border-radius:50%;background:var(--ok);box-shadow:inset 0 0 0 1.5px var(--ok);color:#fff;animation:lp-pop .5s var(--spring)}
.sc-applyask .aa-tx{display:block;min-width:0}
.sc-applyask .aa-tx b{display:block;font:500 15px/20px var(--sans);letter-spacing:-.014em;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-applyask .aa-m{display:block;margin-top:2px;font:400 13px/18px var(--sans);color:var(--tx-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-applyask .aa-why{grid-column:3 / 5;display:block;font:400 13px/19px var(--sans);color:var(--tx-2);text-wrap:pretty}
.sc-applyask .aa-end{display:flex;align-items:center;justify-content:flex-end;gap:12px}
.sc-applyask .aa-sent{font:500 13px/18px var(--sans);color:var(--tx-2);white-space:nowrap;font-variant-numeric:tabular-nums;opacity:0;transform:translateX(6px);transition:opacity .35s var(--ease) .1s,transform .5s var(--spring) .1s}
.sc-applyask .aa-row.is-sent .aa-sent{opacity:1;transform:none}
/* the match ring, as in the portal */
.sc-applyask .aa-ring{position:relative;flex:none;width:44px;height:44px;display:grid;place-items:center}
.sc-applyask .aa-ring svg{position:absolute;inset:0;width:100%;height:100%}
.sc-applyask .aa-ring circle{fill:none;stroke-width:3.5}
.sc-applyask .aa-ring .tr{stroke:var(--line)}
.sc-applyask .aa-ring .ar{stroke:var(--ok-deep);stroke-linecap:round;stroke-dasharray:0 var(--c);transition:stroke-dasharray 1s var(--out) .35s}
.sc-applyask .aa-roles.is-in .aa-ring .ar{stroke-dasharray:var(--v) var(--c)}
.sc-applyask .aa-ring b{position:relative;font:600 13px/1 var(--sans);letter-spacing:-.01em;color:var(--tx);font-variant-numeric:tabular-nums}
/* what goes out */
.sc-applyask .aa-send{display:flex;align-items:center;gap:20px;margin-top:12px;padding:12px 28px 12px 12px;border-radius:24px;background:var(--sunk)}
.sc-applyask .aa-pf{flex:none;position:relative;width:132px;height:84px;border-radius:12px;background:#F3EEE9;box-shadow:inset 0 0 0 1px var(--line-2);display:block}
.sc-applyask .aa-sl{position:absolute;left:14px;right:14px;top:10px;bottom:10px;padding:9px 10px 0;border-radius:7px;background:#fff;box-shadow:0 0 0 1px var(--line-2),0 4px 10px -6px rgba(26,25,23,.2);display:block}
.sc-applyask .aa-sl b{display:block;margin-top:6px;font:400 11px/1.14 var(--serif);letter-spacing:-.02em;color:var(--tx)}
.sc-applyask .aa-sl>i{display:block;width:16px;height:1.5px;margin-top:5px;border-radius:2px;background:var(--ink)}
.sc-applyask .aa-stx{display:block;min-width:0}
.sc-applyask .aa-lbl{display:block;font:400 13px/18px var(--sans);color:var(--tx-3)}
.sc-applyask .aa-stx b{display:block;margin-top:3px;font:500 15px/20px var(--sans);color:var(--tx)}
.sc-applyask .aa-sub{display:block;margin-top:2px;font:400 13px/18px var(--sans);color:var(--tx-2)}
.sc-applyask .aa-act{display:flex;align-items:center;gap:10px;margin-top:22px}
.sc-applyask .aa-quiet{flex:1;padding-left:4px;font:400 13px/18px var(--sans);color:var(--tx-3);transition:opacity .3s var(--ease)}
.sc-applyask .aa-col.is-done .aa-quiet{opacity:0}
.sc-applyask .aa-go{min-width:148px}
.sc-applyask .aa-look{transition:background .2s,opacity .3s var(--ease)}
.sc-applyask .aa-look:active{transform:translateY(1px)}
.sc-applyask .aa-col.is-busy .aa-look,.sc-applyask .aa-col.is-done .aa-look{opacity:0;pointer-events:none}

/* ================================================================
   5 · whenback. Choosing a time is what brings them back.
   ================================================================ */
.sc-whenback .wb-wrap{position:absolute;inset:0;padding-top:16px;display:grid;place-items:center}
.sc-whenback .wb-panel{width:560px;padding:36px 32px 32px}
.sc-whenback .wb-logo{display:block;width:48px;height:48px;border-radius:14px;box-shadow:0 0 0 1px rgba(255,255,255,.14)}
.sc-whenback .wb-title{margin-top:22px;font-size:34px;line-height:1.14}
.sc-whenback .wb-line{margin-top:12px}
.sc-whenback .wb-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:26px}
.sc-whenback .wb-opt{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;height:60px;padding:0 18px 1px 20px;border-radius:18px;text-align:left;color:var(--tx);
  background:var(--glass-2);box-shadow:inset 0 0 0 1px var(--line);transition:background .2s var(--ease),color .2s var(--ease),box-shadow .2s var(--ease),transform .18s var(--out)}
.sc-whenback .wb-opt:hover{background:var(--glass-3)}
.sc-whenback .wb-opt:active{transform:scale(.985)}
.sc-whenback .wb-opt b{font:500 15px/20px var(--sans);letter-spacing:-.014em}
.sc-whenback .wb-opt span{font:400 15px/20px var(--sans);color:var(--tx-2);font-variant-numeric:tabular-nums;transition:color .2s var(--ease),transform .45s var(--spring)}
.sc-whenback .wb-opt i{position:absolute;right:16px;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;display:grid;place-items:center;background:#141312;color:#fff;opacity:0;transform:scale(.5);transition:opacity .2s var(--ease),transform .45s var(--spring)}
.sc-whenback .wb-opt i svg{width:11px;height:11px}
.sc-whenback .wb-opt.is-on{background:#F4F4F3;color:#131315;box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(0,0,0,.3),0 12px 24px -14px rgba(0,0,0,.7)}
.sc-whenback .wb-opt.is-on span{color:#5D5A54;transform:translateX(-32px)}
.sc-whenback .wb-opt.is-on i{opacity:1;transform:none}
.sc-whenback .wb-note{position:relative;height:20px;margin-top:18px}
.sc-whenback .wb-note>span{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:9px;height:20px;font:400 13px/20px var(--sans);color:var(--tx-3);white-space:nowrap;transition:opacity .3s var(--ease),transform .5s var(--spring)}
.sc-whenback .wb-held{color:var(--tx-2)!important;opacity:0;transform:translateY(6px)}
.sc-whenback .wb-panel.is-set .wb-hint{opacity:0}
.sc-whenback .wb-panel.is-set .wb-held{opacity:1;transform:none;transition-delay:.1s}
.sc-whenback .wb-panel.is-later .wb-held .sp-tick{display:none}
.sc-whenback .wb-act{display:flex;align-items:center;justify-content:space-between;margin-top:26px}
.sc-whenback .wb-now{height:48px;margin-left:-14px;padding:0 14px 1px;border-radius:15px;font:500 15px/1 var(--sans);letter-spacing:-.014em;color:var(--tx-2);transition:color .2s var(--ease),background .2s var(--ease)}
.sc-whenback .wb-now:hover{color:var(--tx);background:var(--glass-2)}
.sc-whenback .wb-now:active{background:var(--glass-3)}
.sc-whenback .wb-done{min-width:132px}

/* screens/jobs.css */
/* ZERO skill path · Jobs mode: For you, Explore, Applications, and a no.
   Values are the job portal's own: warm paper, white cards, serif titles, calm density.
   One grammar: white is open to you, paper is ahead. Green means open or done, gold is the level, nothing else has colour.
   .sc-jb is on all four roots, so the shared parts are written once. Type: a serif title, then 15, 13 and 12. */
.sc-jb{--okd:#0C7E45;--okbg:#E9F6EE;--au:#E3A62B;color:var(--tx);font:400 15px/22px var(--sans);letter-spacing:-.012em}
.sc-jb .jb-page{position:absolute;left:180px;top:96px;width:1240px;bottom:0}
.sc-jb h1,.sc-jb h2,.sc-jb h3{font-weight:400}
.sc-jb ul,.sc-jb ol{list-style:none}

/* things arrive once, a few pixels up, one after another */
.sc-jb .jb-in{animation:jb-in .6s var(--spring) both;animation-delay:calc(var(--i,0) * 60ms + 140ms)}
@keyframes jb-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sc-jb .pane.swap{animation:jb-swap .32s var(--out) both}
@keyframes jb-swap{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* a scroller fades where there is more to see, and only there */
.sc-jb .jb-scroll{overflow-y:auto;overscroll-behavior:contain;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 var(--ft,0px),#000 calc(100% - var(--fb,0px)),transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0,#000 var(--ft,0px),#000 calc(100% - var(--fb,0px)),transparent 100%)}

/* ---------- shared parts ---------- */
.sc-jb .jb-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:0 0 12px;font:600 15px/20px var(--sans);letter-spacing:-.016em;color:var(--tx)}
.sc-jb .jb-h span{font:400 13px/20px var(--sans);letter-spacing:-.012em;color:var(--tx-3)}
.sc-jb .jb-h button{display:inline-flex;align-items:center;gap:3px;font:500 13px/20px var(--sans);color:var(--tx-2);transition:color .2s}
.sc-jb .jb-h button:hover{color:var(--tx)}
.sc-jb .jb-h button svg{width:13px;height:13px}
/* the match ring, as the job portal draws it */
.sc-jb .jb-ring{position:relative;flex:none;display:inline-grid;place-items:center;width:var(--z);height:var(--z)}
.sc-jb .jb-ring svg{position:absolute;inset:0;width:100%;height:100%}
.sc-jb .jb-ring circle{fill:none;stroke-width:3.5}
.sc-jb .jb-ring .tr{stroke:var(--line)}
.sc-jb .jb-ring .ar{stroke:var(--okd);stroke-linecap:round}
.sc-jb .jb-ring b{position:relative;font:700 12px/1 var(--sans);letter-spacing:-.01em;color:var(--tx);font-variant-numeric:tabular-nums}
/* where the ring would be, a locked role says the level it opens at */
.sc-jb .jb-lv{flex:none;display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px 0 8px;border-radius:99px;background:var(--sunk);color:var(--tx-2);font:500 12px/1 var(--sans);letter-spacing:-.006em;white-space:nowrap}
.sc-jb .jb-lv svg{width:12px;height:12px;margin-top:-1px}
.sc-jb .jb-tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:7px;background:var(--field);color:var(--tx-2);font:500 12px/1 var(--sans);letter-spacing:-.006em;white-space:nowrap}
.sc-jb .jb-tag svg{width:11px;height:11px;color:var(--okd)}
.sc-jb .jb-tag.dk{background:var(--ink);color:#fff}
/* the level bar: one segment a level, gold as far as the points go */
.sc-jb .jb-bar{flex:1;display:flex;gap:3px;height:8px}
.sc-jb .jb-bar>i{flex:1;position:relative;overflow:hidden;border-radius:99px;background:var(--sunk)}
.sc-jb .jb-bar u{position:absolute;left:0;top:0;bottom:0;width:var(--f);border-radius:99px;background:var(--au);animation:jb-fill .6s var(--out) both;animation-delay:calc(var(--d,0ms) + 520ms)}
@keyframes jb-fill{from{width:0}}
.sc-jb .pane.swap .jb-bar u{animation-delay:calc(var(--d,0ms) + 120ms)}
/* a scenario as the way through */
.sc-jb .jb-sc{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;border-radius:16px;background:var(--wash);box-shadow:inset 0 0 0 1px var(--line);transition:background .2s}
.sc-jb button.jb-sc:hover{background:var(--field)}
.sc-jb button.jb-sc:active{background:var(--sunk)}
.sc-jb .jb-sc .g{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sc-jb .jb-sc .g b{font:600 15px/20px var(--sans);letter-spacing:-.016em;color:var(--tx)}
.sc-jb .jb-sc .g span{font:400 13px/18px var(--sans);color:var(--tx-2)}
.sc-jb .jb-sc em{flex:none;width:32px;height:32px;margin-right:2px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh1);color:var(--tx)}
.sc-jb .jb-sc em svg{width:14px;height:14px}
/* a checklist: a tick is proven, an open circle is still ahead */
.sc-jb .jb-asks li{display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:center;column-gap:12px;min-height:36px}
.sc-jb .jb-asks i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--tx-4)}
.sc-jb .jb-asks i svg{width:11px;height:11px}
.sc-jb .jb-asks .ok i{background:var(--okd);box-shadow:none;color:#fff}
.sc-jb .jb-asks b{font:500 15px/20px var(--sans);letter-spacing:-.014em;color:var(--tx)}
.sc-jb .jb-asks span{font:400 13px/18px var(--sans);color:var(--tx-3);text-align:right}
.sc-jb .sp-ghost{padding-bottom:1px}
.sc-jb .sp-ghost svg{width:15px;height:15px;flex:none}
.sc-jb .sp-ghost.on svg{color:var(--okd)}

/* =====================================================================================================
   1. For you
   ===================================================================================================== */
.sc-jobs .jb-main{position:absolute;left:-4px;top:-4px;width:868px;bottom:0;padding:4px 4px 44px}
.sc-jobs .jb-main section+section{margin-top:28px}
.sc-jobs .jb-side{position:absolute;left:900px;top:0;width:340px}

/* the job you want */
.sc-jobs .jb-hero{padding:24px;border-radius:24px;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh1);cursor:pointer;outline:0;transition:transform .3s var(--out),box-shadow .3s}
.sc-jobs .jb-hero:hover,.sc-jobs .jb-hero:focus-visible{transform:translateY(-1px);box-shadow:0 0 0 1px var(--line),var(--sh2)}
.sc-jobs .jb-hero header{display:flex;align-items:center;gap:16px}
.sc-jobs .jb-hero .tx{flex:1;min-width:0}
.sc-jobs .jb-hero h1{font:400 32px/36px var(--serif);letter-spacing:-.028em;color:var(--tx)}
.sc-jobs .jb-hero header p{margin-top:2px;font:400 15px/20px var(--sans);color:var(--tx-2)}
.sc-jobs .jb-now{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px 0 10px;border-radius:99px;background:var(--okbg);color:var(--okd);font:600 13px/1 var(--sans);white-space:nowrap}
.sc-jobs .jb-now svg{width:13px;height:13px}
/* the climb to it: your points in gold, the other doors at this company marked on the way */
.sc-jobs .jb-track{position:relative;display:flex;align-items:center;gap:10px;height:24px;margin:24px 0 46px}
.sc-jobs .jb-track .mk{position:absolute;top:4px;left:calc((100% - 31px) * var(--k) / var(--n) - 9.5px);width:16px;height:16px}
.sc-jobs .jb-track .mk i{display:grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--tx-4),0 0 0 3px var(--card);color:#fff;transition:box-shadow .2s}
.sc-jobs .jb-track .mk i svg{width:9px;height:9px}
.sc-jobs .jb-track .mk.open i,.sc-jobs .jb-track .mk.applied i{background:var(--okd);box-shadow:0 0 0 3px var(--card)}
.sc-jobs .jb-track .mk span{position:absolute;top:24px;left:50%;transform:translateX(-50%);white-space:nowrap;font:400 12px/16px var(--sans);color:var(--tx-3);transition:color .2s}
.sc-jobs .jb-track .mk:hover span{color:var(--tx)}
.sc-jobs .jb-track .mk:hover i{box-shadow:inset 0 0 0 1.5px var(--tx-2),0 0 0 3px var(--card)}
.sc-jobs .jb-track .mk.open:hover i,.sc-jobs .jb-track .mk.applied:hover i{box-shadow:0 0 0 3px var(--card)}
.sc-jobs .jb-track .end{flex:none;position:relative;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--tx-2)}
.sc-jobs .jb-track .end svg{width:12px;height:12px}
.sc-jobs .jb-track .end.open,.sc-jobs .jb-track .end.applied{background:var(--okd);color:#fff}
.sc-jobs .jb-track .end span{position:absolute;top:28px;right:0;white-space:nowrap;font:500 12px/16px var(--sans);color:var(--tx-2)}
.sc-jobs .jb-hero footer{display:flex;align-items:center;justify-content:space-between;gap:24px}
.sc-jobs .jb-hero footer p{font:400 15px/22px var(--sans);color:var(--tx-2)}
.sc-jobs .jb-hero footer b{font-weight:600;color:var(--tx)}
/* the one glow in Jobs: the job you want, open */
.sc-jobs .jb-hero.open{box-shadow:0 0 0 1px rgba(227,166,43,.55),0 0 0 5px rgba(255,213,107,.26),0 22px 60px -22px rgba(227,166,43,.5)}
.sc-jobs .jb-hero.open:hover{box-shadow:0 0 0 1px rgba(227,166,43,.7),0 0 0 5px rgba(255,213,107,.32),0 26px 64px -22px rgba(227,166,43,.6)}

/* role cards, in the job portal's own shape: mark top left, the ring or the lock top right */
.sc-jobs .jb-none{margin:-4px 0 12px;font:400 15px/22px var(--sans);color:var(--tx-2)}
.sc-jobs .jb-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sc-jobs .jb-card{display:flex;flex-direction:column;align-items:stretch;min-width:0;text-align:left;padding:16px;border-radius:20px;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh1);transition:transform .3s var(--out),box-shadow .3s,background .2s}
.sc-jobs .jb-card:hover{transform:translateY(-2px);box-shadow:0 0 0 1px var(--line),var(--sh2)}
.sc-jobs .jb-card:active{transform:none;box-shadow:0 0 0 1px var(--line),var(--sh1)}
.sc-jobs .jb-card .top{display:flex;align-items:center;justify-content:space-between}
.sc-jobs .jb-card>b{margin-top:12px;font:600 15px/20px var(--sans);letter-spacing:-.016em;color:var(--tx);overflow-wrap:anywhere}
.sc-jobs .jb-card .m{margin-top:2px;font:400 13px/18px var(--sans);color:var(--tx-3)}
.sc-jobs .jb-card .w{display:flex;align-items:center;gap:6px;margin-top:10px;font:400 13px/18px var(--sans);color:var(--tx-2)}
.sc-jobs .jb-card .w svg{flex:none;width:14px;height:14px;color:var(--tx-3)}
.sc-jobs .jb-card .w.ap svg{width:13px;height:13px;color:var(--okd)}
.sc-jobs .jb-card.locked{background:transparent;box-shadow:0 0 0 1px var(--line)}
.sc-jobs .jb-card.locked:hover{background:rgba(255,255,255,.72);box-shadow:0 0 0 1px var(--line)}

/* what Zero is doing */
.sc-jobs .jb-feed{display:flex;flex-direction:column;gap:16px;padding:20px;border-radius:20px;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh1)}
.sc-jobs .jb-feed .it{display:flex;align-items:center;gap:12px}
.sc-jobs .jb-feed .it p{font:500 13px/18px var(--sans);color:var(--tx)}
.sc-jobs .jb-feed .it div span{display:block;margin-top:1px;font:400 12px/16px var(--sans);color:var(--tx-3)}
.sc-jobs .jb-feed .ic{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--field);color:var(--tx-2)}
.sc-jobs .jb-feed .ic svg{width:16px;height:16px}
.sc-jobs .jb-feed .dot{flex:none;align-self:flex-start;width:6px;height:6px;margin:8px 1px 0;border-radius:50%;background:var(--tx-4)}
.sc-jobs .jb-feed .dot+div p{font:400 15px/22px var(--sans);color:var(--tx);text-wrap:balance}
.sc-jobs .jb-feed .lk{display:flex;align-items:center;gap:8px;height:44px;margin:4px -8px -8px;padding:0 10px 1px 12px;border-radius:12px;background:var(--wash);box-shadow:inset 0 0 0 1px var(--line);font:500 13px/1 var(--sans);color:var(--tx);transition:background .2s}
.sc-jobs .jb-feed .lk:hover{background:var(--field)}
.sc-jobs .jb-feed .lk:active{background:var(--sunk)}
.sc-jobs .jb-feed .lk span{flex:1;text-align:left}
.sc-jobs .jb-feed .lk em{font-style:normal;font-weight:400;color:var(--tx-3);font-variant-numeric:tabular-nums}
.sc-jobs .jb-feed .lk svg{width:14px;height:14px;color:var(--tx-3)}

/* =====================================================================================================
   2. Explore
   ===================================================================================================== */
.sc-explore .jb-top{display:flex;align-items:center;justify-content:space-between;height:34px}
.sc-explore .jb-fil{display:flex;gap:6px}
.sc-explore .jb-fil button{height:34px;padding:0 14px 1px;border-radius:99px;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh1);color:var(--tx-2);font:500 13px/1 var(--sans);transition:background .18s,color .18s,box-shadow .18s}
.sc-explore .jb-fil button i{margin-left:6px;font-style:normal;font-weight:400;opacity:.6;font-variant-numeric:tabular-nums}
.sc-explore .jb-fil button:hover{color:var(--tx);box-shadow:0 0 0 1px rgba(26,25,23,.2),var(--sh1)}
.sc-explore .jb-fil button:active{background:var(--wash)}
.sc-explore .jb-fil button.on{background:var(--ink);color:#fff;box-shadow:0 0 0 1px var(--ink)}
.sc-explore .jb-fil button:disabled{opacity:.42;pointer-events:none}
.sc-explore .jb-note{font:400 13px/1 var(--sans);color:var(--tx-3)}
.sc-explore .jb-split{position:absolute;left:0;right:0;top:50px;bottom:28px}

.sc-explore .jb-list{position:absolute;left:-4px;top:-4px;bottom:-4px;width:478px;padding:4px;display:flex;flex-direction:column;gap:8px}
.sc-explore .jb-row{flex:none;display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border-radius:20px;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh1);transition:background .18s,box-shadow .18s}
.sc-explore .jb-row:hover{box-shadow:0 0 0 1px rgba(26,25,23,.22),var(--sh1)}
.sc-explore .jb-row:active{background:var(--wash)}
.sc-explore .jb-row .g{flex:1;min-width:0;display:flex;flex-direction:column}
.sc-explore .jb-row .g b{font:600 15px/20px var(--sans);letter-spacing:-.016em;color:var(--tx)}
.sc-explore .jb-row .m{margin-top:2px;font:400 13px/18px var(--sans);color:var(--tx-3)}
.sc-explore .jb-row .tg{display:flex;gap:6px;margin-top:8px}
.sc-explore .jb-row.locked{background:transparent;box-shadow:0 0 0 1px var(--line)}
.sc-explore .jb-row.locked:hover{background:rgba(255,255,255,.72);box-shadow:0 0 0 1px rgba(26,25,23,.22)}
.sc-explore .jb-row.on,.sc-explore .jb-row.on:hover{background:var(--card);box-shadow:0 0 0 1.5px var(--ink),var(--sh1)}

.sc-explore .jb-det{position:absolute;left:490px;right:0;top:0;bottom:0;overflow:hidden;border-radius:24px;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh1)}
.sc-explore .jb-det .in{position:absolute;inset:0;padding:28px 28px 36px}
.sc-explore .dh{display:flex;align-items:flex-start;gap:16px}
.sc-explore .dh h2{font:400 28px/32px var(--serif);letter-spacing:-.026em;color:var(--tx);text-wrap:balance}
.sc-explore .dh p{margin-top:4px;font:400 13px/18px var(--sans);color:var(--tx-3)}
.sc-explore .da{display:flex;align-items:center;gap:8px;margin-top:20px}
.sc-explore .jb-sent{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px 1px 12px;margin-right:4px;border-radius:13px;background:var(--okbg);color:var(--okd);font:500 13px/1 var(--sans);white-space:nowrap}
.sc-explore .jb-sent svg{width:14px;height:14px}
/* Zero only acts on a yes */
.sc-explore .jb-ask{margin-top:20px;padding:16px;border-radius:16px;background:var(--wash);box-shadow:inset 0 0 0 1px var(--line);animation:jb-swap .3s var(--out) both}
.sc-explore .jb-ask b{display:block;font:600 15px/20px var(--sans);letter-spacing:-.016em}
.sc-explore .jb-ask p{margin-top:2px;font:400 13px/19px var(--sans);color:var(--tx-2)}
.sc-explore .jb-ask div{display:flex;gap:8px;margin-top:14px}
/* three facts */
.sc-explore .jb-ins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
.sc-explore .jb-ins>div{display:flex;align-items:center;gap:12px;min-height:76px;padding:12px 14px;border-radius:14px;background:var(--wash)}
.sc-explore .jb-ins em{flex:none;min-width:52px;text-align:center;font:400 28px/1 var(--serif);letter-spacing:-.02em;font-style:normal;color:var(--tx)}
.sc-explore .jb-ins .jb-ring b{font-size:13px}
.sc-explore .jb-ins p span{display:block;font:400 12px/16px var(--sans);color:var(--tx-3)}
.sc-explore .jb-ins p b{display:block;margin-top:1px;font:600 13px/18px var(--sans);letter-spacing:-.014em;color:var(--tx)}
.sc-explore .jb-det section{margin-top:24px}
.sc-explore .jb-ev{display:flex;align-items:center;gap:12px;padding:6px 0}
.sc-explore .jb-ev div b{display:block;font:600 15px/20px var(--sans);letter-spacing:-.016em}
.sc-explore .jb-ev div span{display:block;margin-top:1px;font:400 13px/18px var(--sans);color:var(--tx-3)}
.sc-explore .jb-gap{margin:-2px 0 12px;font:400 15px/22px var(--sans);color:var(--tx-2)}
/* a locked role: the lock, how far, and the way in */
.sc-explore .jb-lock{margin-top:20px;padding:20px;border-radius:16px;background:var(--wash);box-shadow:inset 0 0 0 1px var(--line)}
.sc-explore .jb-lock .hd{display:flex;align-items:center;gap:14px}
.sc-explore .jb-lock .sp-lock{background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh1);color:var(--tx-2)}
.sc-explore .jb-lock .sp-lock svg{width:44%;height:44%}
.sc-explore .jb-lock .hd p b{display:block;font:600 15px/20px var(--sans);letter-spacing:-.016em}
.sc-explore .jb-lock .hd p span{display:block;margin-top:1px;font:400 13px/18px var(--sans);color:var(--tx-2)}
.sc-explore .jb-lock .jb-bar{height:6px;margin-top:18px}
.sc-explore .jb-lock .acts{display:flex;gap:8px;margin-top:20px}
.sc-explore .jb-why{margin-top:20px;padding:13px 16px 14px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);font:400 13px/19px var(--sans);color:var(--tx-2)}

/* =====================================================================================================
   3. Applications
   ===================================================================================================== */
.sc-tracker .tk-h{margin-top:2px;font:400 32px/36px var(--serif);letter-spacing:-.028em;color:var(--tx)}
.sc-tracker .tk-split{position:absolute;left:0;right:0;top:62px;bottom:28px}
.sc-tracker .tk-list{position:absolute;left:-4px;top:-4px;bottom:-4px;width:728px;padding:4px;display:flex;flex-direction:column;gap:8px}
.sc-tracker .tk-row{flex:none;display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border-radius:20px;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh1);transition:background .18s,box-shadow .18s}
.sc-tracker .tk-row:hover{box-shadow:0 0 0 1px rgba(26,25,23,.22),var(--sh1)}
.sc-tracker .tk-row:active{background:var(--wash)}
.sc-tracker .tk-row .g{flex:1;min-width:0;display:flex;flex-direction:column}
.sc-tracker .tk-row .g b{font:600 15px/20px var(--sans);letter-spacing:-.016em;color:var(--tx)}
.sc-tracker .tk-row .m{margin-top:2px;font:400 13px/18px var(--sans);color:var(--tx-3)}
.sc-tracker .tk-row .s{flex:none;width:316px;display:flex;align-items:center;gap:12px}
.sc-tracker .tk-row .s i{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--field);color:var(--tx-2)}
.sc-tracker .tk-row .s i svg{width:15px;height:15px}
.sc-tracker .tk-row .s b{display:block;font:500 15px/20px var(--sans);letter-spacing:-.014em;color:var(--tx)}
.sc-tracker .tk-row .mv{display:block;margin-top:2px;font:400 13px/18px var(--sans);color:var(--tx-3)}
.sc-tracker .tk-row.you .s i{background:var(--ink);color:#fff}
.sc-tracker .tk-row.you .mv{color:var(--tx);font-weight:600}
.sc-tracker .tk-row.ended{background:transparent;box-shadow:0 0 0 1px var(--line)}
.sc-tracker .tk-row.ended .s i{background:var(--sunk)}
.sc-tracker .tk-row.ended:hover{background:rgba(255,255,255,.72);box-shadow:0 0 0 1px rgba(26,25,23,.22)}
.sc-tracker .tk-row.on,.sc-tracker .tk-row.on:hover{background:var(--card);box-shadow:0 0 0 1.5px var(--ink),var(--sh1)}

.sc-tracker .tk-det{position:absolute;left:740px;top:0;width:500px;max-height:100%;overflow-y:auto;border-radius:24px;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh1)}
.sc-tracker .tk-det .pane{padding:24px}
.sc-tracker .tk-det header{display:flex;align-items:center;gap:12px}
.sc-tracker .tk-det header div b{display:block;font:600 15px/20px var(--sans);letter-spacing:-.016em}
.sc-tracker .tk-det header div span{display:block;margin-top:2px;font:400 13px/18px var(--sans);color:var(--tx-3)}
.sc-tracker .tk-move{margin-top:20px;padding:16px;border-radius:16px;background:var(--wash);box-shadow:inset 0 0 0 1px var(--line)}
.sc-tracker .tk-move>span{display:block;font:400 13px/18px var(--sans);color:var(--tx-3)}
.sc-tracker .tk-move>b{display:block;margin-top:4px;font:600 15px/21px var(--sans);letter-spacing:-.016em;text-wrap:balance}
.sc-tracker .tk-move>p{margin-top:3px;font:400 13px/19px var(--sans);color:var(--tx-2);text-wrap:pretty}
.sc-tracker .tk-move>div{display:flex;gap:8px;margin-top:16px}
.sc-tracker .tk-det .jb-h{margin:24px 0 6px}
/* the timeline: filled is done, the dark one is where it stands, the open one is next */
.sc-tracker .tk-tl li{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:12px;min-height:34px;padding-left:24px}
.sc-tracker .tk-tl li i{position:absolute;left:2px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:var(--tx-4)}
.sc-tracker .tk-tl li+li::before{content:'';position:absolute;left:6px;top:calc(-50% + 8px);width:1px;height:calc(100% - 16px);background:rgba(26,25,23,.16)}
.sc-tracker .tk-tl li b{font:400 15px/20px var(--sans);color:var(--tx-2)}
.sc-tracker .tk-tl li span{font:400 13px/18px var(--sans);color:var(--tx-3)}
.sc-tracker .tk-tl li.last i{background:var(--ink)}
.sc-tracker .tk-tl li.last b{font-weight:600;color:var(--tx)}
.sc-tracker .tk-tl li.next i{background:var(--card);box-shadow:inset 0 0 0 1.5px var(--tx-4)}
.sc-tracker .tk-tl li.next b{color:var(--tx-3)}
.sc-tracker .tk-det .pane>.sp-ghost{margin-top:18px}
/* nothing sent yet */
.sc-tracker .tk-none{position:absolute;left:310px;top:150px;width:620px;padding:36px;border-radius:24px;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh1)}
.sc-tracker .tk-none h1{font:400 32px/36px var(--serif);letter-spacing:-.028em}
.sc-tracker .tk-none p{margin:10px 0 24px;font:400 15px/22px var(--sans);color:var(--tx-2);text-wrap:pretty}

/* =====================================================================================================
   4. A no
   ===================================================================================================== */
.sc-passed{display:flex;align-items:center;justify-content:center;padding:96px 0 28px}
.sc-passed .ps-card{flex:none;display:flex;width:720px;max-height:100%;overflow:hidden;border-radius:24px;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh2)}
.sc-passed .ps-card>.jb-scroll{flex:1;padding:32px 36px}
.sc-passed header{display:flex;align-items:center;gap:14px}
.sc-passed header>span:last-child{font:400 13px/18px var(--sans);color:var(--tx-3)}
.sc-passed h1{margin-top:20px;font:400 36px/40px var(--serif);letter-spacing:-.028em;color:var(--tx)}
.sc-passed .why{margin-top:8px;font:400 15px/22px var(--sans);color:var(--tx-2)}
.sc-passed .cols{display:flex;flex-direction:column;gap:20px;margin:28px 0 24px}
.sc-passed .jb-h{margin-bottom:6px}
.sc-passed .jb-asks li{grid-template-columns:20px minmax(0,1fr);align-items:start;row-gap:1px;padding:7px 0;min-height:0}
.sc-passed .jb-asks span{grid-column:2;text-align:left;color:var(--tx-2)}
.sc-passed .jb-asks b{font-weight:600}
.sc-passed .jb-sc.fix{padding:16px}
.sc-passed footer{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:20px}
.sc-passed footer p{font:400 13px/18px var(--sans);color:var(--tx-3)}

/* screens/later.css */
/* ZERO skill path · the later moments: recap, proof, dreamapply, offer.
   World tone for the two panels that sit on the city, the job portal's paper for the two Jobs pages.
   Sizes on every screen: one serif title, 15 body, 13 secondary, 12 small. */

/* things take their place by rising a little. If the animation never runs, they are simply there. */
.sc-recap .lt-in,.sc-proof .lt-in,.sc-dreamapply .lt-in,.sc-offer .lt-in{animation:lt-rise .7s var(--spring) backwards;animation-delay:calc(var(--i,0) * 60ms + 140ms)}
@keyframes lt-rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* the quiet button sets down when pressed, like the key */
.sc-recap .sp-ghost,.sc-proof .sp-ghost,.sc-dreamapply .sp-ghost,.sc-offer .sp-ghost{transition:background .2s,transform .18s var(--out)}
.sc-recap .sp-ghost:active,.sc-proof .sp-ghost:active,.sc-dreamapply .sp-ghost:active,.sc-offer .sp-ghost:active{transform:translateY(1px)}

/* ================= 1 · recap ================= */
.sc-recap .rc-panel{position:absolute;left:500px;top:190px;width:600px;padding:32px 12px 12px}
.sc-recap .rc-panel h1{padding:0 12px}
.sc-recap .rc-rows{display:flex;flex-direction:column;gap:6px;margin-top:24px}
.sc-recap .rc-row{display:flex;align-items:center;gap:14px;width:100%;height:64px;padding:0 16px 0 12px;border-radius:18px;text-align:left;
  background:var(--glass-2);box-shadow:inset 0 0 0 1px var(--line-2);transition:background .2s var(--ease)}
.sc-recap .rc-row:hover{background:var(--glass-3)}
.sc-recap .rc-row:active{background:rgba(255,255,255,.13)}
.sc-recap .rc-row .tx{flex:1;min-width:0;font:400 15px/1.35 var(--sans);letter-spacing:-.012em;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-recap .rc-row .tx b{font-weight:500}
.sc-recap .rc-row .tx em{font-style:normal;color:var(--tx-2)}
.sc-recap .rc-row .go{flex:none;width:16px;height:16px;color:var(--tx-2);opacity:0;transform:translateX(-4px);transition:opacity .2s var(--ease),transform .3s var(--spring)}
.sc-recap .rc-row:hover .go{opacity:1;transform:none}
.sc-recap .rc-acts{display:flex;gap:8px;margin-top:12px}
.sc-recap .rc-acts .sp-key,.sc-recap .rc-acts .sp-ghost{height:52px;border-radius:18px}
.sc-recap .rc-acts .sp-key{flex:1;gap:10px}
.sc-recap .rc-acts .sp-ghost{padding:0 24px 2px}

/* ================= 2 · proof ================= */
.sc-proof .pf-scroll{position:absolute;left:256px;top:70px;width:1088px;height:770px;overflow-y:auto;overscroll-behavior:contain;padding:26px 24px 0;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 20px,#000 calc(100% - 80px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 20px,#000 calc(100% - 80px),transparent 100%)}
.sc-proof .pf-page{padding-bottom:120px}
.sc-proof .pf-card{background:var(--card);border-radius:24px;box-shadow:0 0 0 1px var(--line),var(--sh1)}

.sc-proof .pf-head{display:flex;align-items:center;gap:16px}
.sc-proof .pf-av{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(150deg,#EAE4D9,#CFC5B4);
  font:400 24px/1 var(--serif);color:rgba(26,25,23,.55)}
.sc-proof .pf-id{flex:1;min-width:0}
.sc-proof .pf-id h1{font:400 32px/1.1 var(--serif);letter-spacing:-.028em;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-proof .pf-id p{margin-top:3px;font:400 15px/1.3 var(--sans);color:var(--tx-2)}
.sc-proof .pf-copy{display:inline-grid;flex:none;padding:0 16px 1px 14px}
.sc-proof .pf-copy span{grid-area:1/1;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .2s var(--ease),transform .35s var(--spring)}
.sc-proof .pf-copy svg{width:15px;height:15px;flex:none}
.sc-proof .pf-copy .b{opacity:0;transform:translateY(5px)}
.sc-proof .pf-copy .b svg{color:var(--ok-deep)}
.sc-proof .pf-copy.done .a{opacity:0;transform:translateY(-5px)}
.sc-proof .pf-copy.done .b{opacity:1;transform:none}

.sc-proof .pf-level{display:flex;align-items:center;gap:24px;margin-top:24px;padding:24px 28px}
.sc-proof .pf-level .sp-ring circle{stroke-width:2.5}
.sc-proof .pf-level .sp-ring .tr{stroke:var(--sunk)}
.sc-proof .pf-level .tx{flex:1;min-width:0}
.sc-proof .pf-level .lv{display:flex;align-items:center;gap:10px}
.sc-proof .pf-level .lv b{font:600 15px/1 var(--sans);color:var(--tx)}
.sc-proof .pf-level .lv span{display:inline-flex;align-items:center;height:22px;padding:0 8px 1px;border-radius:7px;background:var(--field);font:500 12px/1 var(--sans);color:var(--tx-2)}
.sc-proof .pf-level h2{margin-top:9px;font:400 24px/1.2 var(--serif);letter-spacing:-.022em;color:var(--tx);text-wrap:balance}
.sc-proof .pf-level .rv{display:flex;align-items:center;gap:6px;margin-top:10px;font:400 13px/1 var(--sans);color:var(--tx-2)}
.sc-proof .pf-level .rv svg{width:14px;height:14px;flex:none;color:var(--ok-deep)}

.sc-proof .pf-skills{margin-top:12px;padding:8px}
.sc-proof .pf-sk-head,.sc-proof .pf-sk{display:grid;grid-template-columns:minmax(0,1fr) 300px 224px;column-gap:40px;align-items:center;padding:0 20px}
.sc-proof .pf-sk-head{height:36px;font:400 12px/1 var(--sans);color:var(--tx-3)}
.sc-proof .pf-sk{height:62px;border-radius:16px;transition:background .2s var(--ease)}
.sc-proof .pf-sk:hover{background:var(--wash)}
.sc-proof .pf-sk .nm{min-width:0}
.sc-proof .pf-sk .nm b{display:block;font:500 15px/1.2 var(--sans);color:var(--tx)}
.sc-proof .pf-sk .nm span{display:block;margin-top:4px;font:400 13px/1.2 var(--sans);color:var(--tx-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-proof .pf-sk .pt{display:flex;align-items:center;gap:16px}
.sc-proof .pf-sk .bar{flex:1;height:6px;border-radius:99px;background:var(--field);overflow:hidden}
.sc-proof .pf-sk .bar i{display:block;width:0;height:100%;border-radius:99px;background:#E3A62B;transition:width 1.1s var(--out)}
.sc-proof .pf-sk .pt b{flex:none;width:46px;text-align:right;font:500 15px/1 var(--sans);font-variant-numeric:tabular-nums;color:var(--tx)}
.sc-proof .pf-sk .by{display:flex;align-items:center;gap:4px}
.sc-proof .pf-sk .by em{font:400 13px/1 var(--sans);font-style:normal;color:var(--tx-4)}

.sc-proof .pf-sec{display:flex;align-items:baseline;justify-content:space-between;margin:32px 0 12px}
.sc-proof .pf-sec b{font:600 15px/1.3 var(--sans);color:var(--tx)}
.sc-proof .pf-sec span{font:400 13px/1.3 var(--sans);color:var(--tx-3)}
.sc-proof .pf-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sc-proof .pf-proj{display:flex;gap:16px;padding:20px;border-radius:20px}
.sc-proof .pf-proj .tx{flex:1;min-width:0}
.sc-proof .pf-proj .hd{display:flex;align-items:baseline;gap:12px}
.sc-proof .pf-proj h3{flex:1;min-width:0;font:400 22px/1.2 var(--serif);letter-spacing:-.022em;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-proof .pf-proj .pts{flex:none;display:flex;align-items:center;gap:5px;font:500 15px/1 var(--sans);font-variant-numeric:tabular-nums;color:var(--tx)}
.sc-proof .pf-proj .m{margin-top:4px;font:400 13px/1.3 var(--sans);color:var(--tx-3)}
.sc-proof .pf-proj .m b{font-weight:500;color:var(--tx-2)}
.sc-proof .pf-proj .sk{display:flex;gap:6px;margin-top:14px}
.sc-proof .pf-proj .sk span{display:inline-flex;align-items:center;height:24px;padding:0 9px 1px;border-radius:8px;background:var(--field);font:500 12px/1 var(--sans);color:var(--tx-2);white-space:nowrap}
.sc-proof .pf-empty{padding:22px 24px;border-radius:20px;background:var(--sunk);font:400 15px/1.45 var(--sans);color:var(--tx-2)}

/* ================= 3 · dreamapply ================= */
.sc-dreamapply .da-scroll{position:absolute;left:386px;top:70px;width:828px;height:770px;overflow-y:auto;overscroll-behavior:contain;padding:26px 24px 0;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 20px,#000 calc(100% - 20px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 20px,#000 calc(100% - 20px),transparent 100%)}
.sc-dreamapply .da-col{padding-bottom:32px}
.sc-dreamapply .da-card{padding:28px;border-radius:24px;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh2)}

/* the match ring, as the job portal draws it */
.sc-dreamapply .lt-match{position:relative;flex:none;display:grid;place-items:center}
.sc-dreamapply .lt-match svg{position:absolute;inset:0;width:100%;height:100%}
.sc-dreamapply .lt-match circle{fill:none;stroke-width:3.5}
.sc-dreamapply .lt-match .tr{stroke:var(--line)}
.sc-dreamapply .lt-match .ar{stroke:var(--ok-deep);stroke-linecap:round}
.sc-dreamapply .lt-match b{position:relative;font:600 13px/1 var(--sans);letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--tx)}

.sc-dreamapply .da-hero{display:flex;align-items:center;gap:16px}
.sc-dreamapply .da-id{flex:1;min-width:0}
.sc-dreamapply .da-t{display:flex;align-items:center;gap:12px}
.sc-dreamapply .da-t h1{min-width:0;font:400 32px/1.1 var(--serif);letter-spacing:-.028em;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-dreamapply .da-tag{flex:none;display:flex;margin-top:3px}
.sc-dreamapply .da-id p{margin-top:5px;font:400 13px/1.3 var(--sans);color:var(--tx-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-dreamapply .da-st,.sc-dreamapply .da-role .s{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px 1px;border-radius:8px;background:var(--field);
  font:500 12px/1 var(--sans);color:var(--tx-2);white-space:nowrap}
.sc-dreamapply .da-st svg,.sc-dreamapply .da-role .s svg{width:12px;height:12px;flex:none}
.sc-dreamapply .da-st.open,.sc-dreamapply .da-role .s.open{background:#E9F6EE;color:var(--ok-deep)}
.sc-dreamapply .da-st i,.sc-dreamapply .da-role .s i{width:6px;height:6px;border-radius:50%;background:var(--ok-deep)}
.sc-dreamapply .da-match{flex:none;display:flex;align-items:center;gap:12px}
.sc-dreamapply .da-match em{display:block;font:400 12px/1 var(--sans);font-style:normal;color:var(--tx-3)}
.sc-dreamapply .da-match span b{display:block;margin-top:5px;font:500 13px/1 var(--sans);color:var(--tx)}
.sc-dreamapply .da-say{margin-top:22px;font:400 15px/1.45 var(--sans);color:var(--tx)}

.sc-dreamapply .da-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.sc-dreamapply .da-tile{padding:16px 16px 18px;border-radius:16px;background:var(--wash);box-shadow:inset 0 0 0 1px var(--line-2)}
.sc-dreamapply .da-tile h3{font:500 13px/1.2 var(--sans);color:var(--tx-3)}
.sc-dreamapply .da-tile ol,.sc-dreamapply .da-tile ul{list-style:none;display:flex;flex-direction:column;gap:14px;margin-top:14px}
.sc-dreamapply .da-tile li{display:flex;align-items:flex-start;gap:12px}
.sc-dreamapply .da-tile li .tx{flex:1;min-width:0}
.sc-dreamapply .da-tile li .tx b{display:block;font:500 15px/1.25 var(--sans);color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-dreamapply .da-tile li .tx>span{display:block;margin-top:3px;font:400 13px/1.4 var(--sans);color:var(--tx-2);text-wrap:pretty}
.sc-dreamapply .da-tile li .tx em{font-style:normal;color:var(--tx)}
.sc-dreamapply .da-cases .n{flex:none;width:12px;font:500 13px/36px var(--sans);font-variant-numeric:tabular-nums;color:var(--tx-3);text-align:center}
.sc-dreamapply .da-asks .ck{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--field);color:transparent}
.sc-dreamapply .da-asks .ck svg{width:11px;height:11px}
.sc-dreamapply .da-asks li.ok .ck{background:#E9F6EE;color:var(--ok-deep)}
.sc-dreamapply .da-tile .none{margin-top:14px;font:400 13px/1.4 var(--sans);color:var(--tx-2)}
/* "Let me read it first": both tiles open downwards together, so they stay one height */
.sc-dreamapply .da-x{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s var(--spring)}
.sc-dreamapply .da-x .in{min-height:0;overflow:hidden;opacity:0;transition:opacity .25s var(--ease)}
.sc-dreamapply .da-card.reading .da-x{grid-template-rows:1fr}
.sc-dreamapply .da-card.reading .da-x .in{opacity:1;transition:opacity .4s var(--ease) .14s}
.sc-dreamapply .da-x h3{padding-top:22px}
.sc-dreamapply .da-x .rest{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.sc-dreamapply .da-x p{margin-top:8px;font:400 13px/1.5 var(--sans);color:var(--tx-2);text-wrap:pretty}

.sc-dreamapply .da-top{display:flex;align-items:center;gap:16px;margin-top:12px;padding:14px 16px;border-radius:16px;background:var(--wash);box-shadow:inset 0 0 0 1px var(--line-2);
  cursor:pointer;outline:none;transition:background .2s var(--ease)}
.sc-dreamapply .da-top:hover{background:var(--field)}
.sc-dreamapply .da-top:focus-visible{box-shadow:inset 0 0 0 1.5px var(--ink)}
.sc-dreamapply .da-top .tx{flex:1;min-width:0}
.sc-dreamapply .da-top .tx b{display:block;font:500 15px/1.2 var(--sans);color:var(--tx)}
.sc-dreamapply .da-top .tx span{display:block;margin-top:3px;font:400 13px/1.3 var(--sans);color:var(--tx-2)}
.sc-dreamapply .da-sw{flex:none;position:relative;width:40px;height:24px;border-radius:99px;background:var(--tx-4);transition:background .25s var(--ease)}
.sc-dreamapply .da-sw::after{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .35s var(--spring)}
.sc-dreamapply .da-top[aria-checked="true"] .da-sw{background:var(--ink)}
.sc-dreamapply .da-top[aria-checked="true"] .da-sw::after{transform:translateX(16px)}
.sc-dreamapply .da-card.sent .da-top,.sc-dreamapply .da-card.busy .da-top{pointer-events:none}
.sc-dreamapply .da-card.sent .da-sw{opacity:.45}

      tilt.style.transform = 'translate(' + (-nx * 9).toFixed(1) + 'px,' + (-ny * 6).toFixed(1) + 'px) skewX(' + (nx * .7).toFixed(3) + 'deg) scaleY(' + (1 + ny * .012).toFixed(4) + ')';
    });

    function wake(e, on) {

    }

    pill.addEventListener('click', function () { show('path', { from: cur && cur.id }); });
