<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Zero · the job you want</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,100..1000&display=swap">
<style>
/* core.css */
/* ZERO skill path · the shell and the shared parts.
   Three surfaces, all taken from Zero's own screens:
     world  = the city with dark glass on it (the app's home, the tutorial's world)
     paper  = the job portal's warm paper with white cards
   Type is STK Bureau Serif for titles and Google Sans Flex for everything else. Nothing else. */
@font-face{font-family:'STK Bureau Serif';src:url('zero-skill-path-assets-b2/fonts/STKBureau-SerifBook.otf') format('opentype');font-weight:400;font-display:swap}
@font-face{font-family:'STK Bureau Serif';src:url('zero-skill-path-assets-b2/fonts/STKBureau-SerifMedium.otf') format('opentype');font-weight:500;font-display:swap}

:root{
  --ease:cubic-bezier(.625,.05,0,1); --out:cubic-bezier(.16,1,.3,1); --spring:cubic-bezier(.22,1,.36,1);
  --serif:'STK Bureau Serif',Georgia,serif;
  --sans:'Google Sans Flex','Google Sans',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --gold:#FFD56B; --gold-2:#F0B94D; --gold-ink:#3A2A05;
  --ok:#49BA61; --ok-deep:#0C7E45;
  --key-light:linear-gradient(#FFFFFF,#EDEDEA);
  --key-light-sh:inset 0 1px 0 #fff,inset 0 -3px 0 rgba(0,0,0,.1),0 0 0 1px rgba(0,0,0,.18),0 14px 24px -14px rgba(0,0,0,.5);
  --key-dark:linear-gradient(#303432,#181A19);
  --key-dark-sh:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -3px 0 rgba(0,0,0,.5),0 0 0 1px #121413,0 14px 24px -14px rgba(18,20,19,.5);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#131514}
body{font-family:var(--sans);font-size:14px;letter-spacing:-.012em;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-synthesis:none;color:#F4F4F3}
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
svg{display:block}
*{scrollbar-width:none}::-webkit-scrollbar{width:0;height:0}
::selection{background:#FFE9A8;color:#111}

/* ---------- the stage: a 1600 x 840 canvas scaled to fit. The city bleeds past it to the window's edge. ---------- */
#sp-root{position:fixed;inset:0;overflow:hidden;background:#131514;transition:background .5s var(--ease)}
#sp-root[data-tone="paper"]{background:#F8F7F5}
#sp-stage{position:absolute;left:50%;top:50%;width:1600px;height:840px;transform-origin:0 0}

/* tone tokens */
#sp-root{
  --tx:#F4F4F3; --tx-2:rgba(244,244,243,.68); --tx-3:rgba(244,244,243,.44); --tx-4:rgba(244,244,243,.22);
  --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.06);
  --glass:rgba(17,18,19,.60); --glass-2:rgba(255,255,255,.06); --glass-3:rgba(255,255,255,.10);
  --ink:#F4F4F3; --on-ink:#131315;
}
#sp-root[data-tone="paper"]{
  --tx:#1A1917; --tx-2:#5D5A54; --tx-3:#747068; --tx-4:#A9A49B;
  --line:rgba(26,25,23,.09); --line-2:rgba(26,25,23,.05);
  --card:#FFFFFF; --field:#F1F0ED; --wash:#FAF9F7; --sunk:#EDEBE7;
  --ink:#141312; --on-ink:#FFFFFF;
  --sh1:0 1px 2px rgba(26,25,23,.035);
  --sh2:0 2px 8px rgba(26,25,23,.05),0 16px 40px -24px rgba(26,25,23,.24);
  --sh3:0 30px 80px rgba(26,25,23,.20);
  color:var(--tx);
}

/* ---------- the city ---------- */
#sp-map{position:absolute;left:-520px;top:-360px;width:2640px;height:1560px;overflow:hidden;background:#131514;opacity:0;visibility:hidden;transition:opacity .6s var(--ease),visibility 0s .6s}
#sp-root[data-map="1"] #sp-map{opacity:1;visibility:visible;transition:opacity .6s var(--ease)}
/* the city leans toward the pointer. It is a flat shear, not a 3D turn: a 3D turn makes the browser redraw the
   whole city at low resolution, and it goes soft on a sharp screen. */
.mp-tilt{position:absolute;inset:0;transform-origin:1320px 780px;transition:transform 1s var(--out)}
.mp-cam{position:absolute;left:520px;top:360px;width:1600px;height:900px;transform-origin:0 0;--s:1;will-change:transform;
  transition:transform var(--cam,1.4s) var(--ease)}
.mp-city{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
/* the city rests (its picture is the quiet one), so the buildings that are yours carry the colour */
.mp-glow{position:absolute;border-radius:50%;opacity:0;transform-origin:50% 78%;cursor:pointer;
  transition:opacity .9s var(--ease),transform .7s var(--spring)}
.mp-glow i{position:absolute;inset:0;background-image:var(--city);background-repeat:no-repeat;
  -webkit-mask-image:radial-gradient(closest-side,#000 58%,rgba(0,0,0,.6) 78%,transparent 100%);mask-image:radial-gradient(closest-side,#000 58%,rgba(0,0,0,.6) 78%,transparent 100%)}
.mp-on .mp-glow.lit{opacity:1}
.mp-on .mp-glow.hov{opacity:1;transform:scale(1.05) translateY(-.8%)}
.mp-on .mp-glow.dream:not(.lit):not(.hov){opacity:.38}
.mp-road{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.mp-road path{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.mp-road .case{stroke:rgba(10,12,11,.62);stroke-width:9}
.mp-road .ahead{stroke:rgba(255,255,255,.92);stroke-width:3;stroke-dasharray:.1 9}
.mp-road .walked{stroke:#fff;stroke-width:4}
.mp-road .last{stroke:var(--gold);stroke-width:3;stroke-dasharray:.1 9}
.mp-road .rev{stroke:#fff;stroke-width:14;stroke-dasharray:1;stroke-dashoffset:1}
.mp-road.drawn .rev{stroke-dashoffset:0;transition:stroke-dashoffset var(--draw,2.4s) cubic-bezier(.45,.05,.2,1)}
.mp-road.inst .rev{stroke-dashoffset:0;transition:none}
/* anything pinned to the map keeps its size while the camera moves */
.mp-pin{position:absolute;width:0;height:0;transform:scale(calc(1 / var(--s)));transform-origin:0 0;transition:transform var(--cam,1.4s) var(--ease)}
.mp-stop{position:absolute;left:-13px;top:-13px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  background:#1B1D1C;color:#fff;font:600 12px/1 var(--sans);letter-spacing:0;box-shadow:0 0 0 2px rgba(255,255,255,.9),0 4px 10px rgba(0,0,0,.4);
  opacity:0;transform:scale(.4);transition:opacity .3s var(--ease) var(--d,0s),transform .5s var(--spring) var(--d,0s)}
.mp-on .mp-stop{opacity:1;transform:none}
.mp-stop[data-i]{cursor:pointer}
.mp-on .mp-stop.hov{transform:scale(1.16);box-shadow:0 0 0 2px #fff,0 0 0 7px rgba(255,255,255,.22),0 4px 10px rgba(0,0,0,.4);transition:transform .35s var(--spring),box-shadow .3s}
.mp-on .mp-stop.under{opacity:0}
/* you: the marker that stands on the stop you are at, and walks the road when you finish one */
.mp-you-pin{z-index:3}
.mp-you{position:absolute;left:-17px;top:-17px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  background:#fff;color:#141312;font:600 11px/1 var(--sans);letter-spacing:-.01em;padding-bottom:1px;
  box-shadow:0 0 0 2px #141312,0 0 0 4px #fff,0 8px 18px rgba(0,0,0,.5);opacity:0;scale:.5;transition:opacity .3s var(--ease) .2s,scale .6s var(--spring) .2s}
.mp-on .mp-you{opacity:1;scale:1}
.mp-you::after{content:'';position:absolute;inset:-9px;border-radius:50%;border:2px solid rgba(255,255,255,.85);animation:mp-pulse 2.2s var(--out) infinite}
.mp-walking .mp-you::after{animation:none;opacity:0}
.mp-walking .mp-chip{opacity:0!important}
/* the roles a stop opens, as a small stack of marks beside it */
.mp-roles{position:absolute;left:0;top:0;display:flex;opacity:0;scale:.6;transition:opacity .4s var(--ease) var(--d,0s),scale .6s var(--spring) var(--d,0s)}
.mp-roles .sp-lg{box-shadow:0 0 0 2px #fff,0 4px 10px rgba(0,0,0,.45)}
.mp-roles .sp-lg+.sp-lg{margin-left:-7px}
.mp-roles.b,.mp-roles.l{transform:translate(18px,-12px)} .mp-roles.r,.mp-roles.t{transform:translate(calc(-100% - 18px),-12px)}
.mp-on.mp-show-roles .mp-roles{opacity:1;scale:1}
.mp-stop.done{background:#fff;color:#141312}
.mp-stop.done svg{width:12px;height:12px}
.mp-stop.now{background:#fff;color:#141312;box-shadow:0 0 0 2px #fff,0 0 0 7px rgba(255,255,255,.28),0 4px 10px rgba(0,0,0,.4)}
.mp-stop.now::after{content:'';position:absolute;inset:-7px;border-radius:50%;border:2px solid rgba(255,255,255,.8);animation:mp-pulse 2.2s var(--out) infinite}
@keyframes mp-pulse{0%{opacity:.9;transform:scale(.8)}100%{opacity:0;transform:scale(1.9)}}
.mp-chip{position:absolute;left:0;top:0;display:flex;align-items:center;gap:7px;height:30px;padding:0 11px 0 5px;border-radius:99px;white-space:nowrap;
  background:rgba(20,21,21,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font:500 13px/1 var(--sans);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 0 1px rgba(0,0,0,.4),0 8px 18px -8px rgba(0,0,0,.6);
  opacity:0;transition:opacity .35s var(--ease) var(--d,0s),translate .5s var(--spring) var(--d,0s);translate:0 6px}
.mp-on .mp-chip{opacity:1;translate:0 0}
.mp-chip.b{transform:translate(-50%,20px)} .mp-chip.t{transform:translate(-50%,-52px)} .mp-chip.r{transform:translate(22px,-15px)} .mp-chip.l{transform:translate(calc(-100% - 22px),-15px)}
.mp-chip.now{background:#fff;color:#141312;box-shadow:0 0 0 1px rgba(0,0,0,.2),0 10px 22px -8px rgba(0,0,0,.6)}
.mp-chip em{font-style:normal;color:var(--ok-deep);font-weight:500;display:flex;align-items:center;gap:5px;margin-left:2px}
.mp-chip em::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--ok)}
.mp-chip.far{opacity:0!important}
.mp-chip.dim{background:rgba(20,21,21,.6);color:rgba(255,255,255,.78)}
/* the job you want, standing on its building */
.mp-dream{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:0;
  opacity:0;translate:0 10px;transition:opacity .5s var(--ease) var(--d,0s),translate .7s var(--spring) var(--d,0s)}
.mp-on .mp-dream{opacity:1;translate:0 0}
.mp-dream-card{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px 0 7px;border-radius:99px;white-space:nowrap;
  background:rgba(20,21,21,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 0 1px rgba(0,0,0,.5),0 0 0 2px rgba(255,213,107,.0),0 14px 30px -10px rgba(0,0,0,.7);
  transition:box-shadow .6s var(--ease),background .6s var(--ease)}
.mp-dream.above{transform:translate(-50%,-100%) translateY(-4px)} .mp-dream.below{transform:translate(-50%,10px)}
.mp-dream-card .tx b{display:block;font:500 14px/1.2 var(--sans);color:#fff;letter-spacing:-.012em}
.mp-dream-card .tx span{display:block;font:400 12px/1.15 var(--sans);color:rgba(255,255,255,.6);margin-top:3px}
.mp-dream-card{cursor:pointer}
.mp-dream-card .tx .segs{display:flex;gap:2.5px;margin-top:7px}
.mp-dream-card .tx .segs i{width:9px;height:3px;border-radius:2px;background:rgba(255,255,255,.2)}
.mp-dream-card .tx .segs i.on{background:var(--gold)}
.mp-dream-card:has(.segs){height:58px}
.mp-dream-card .lk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);color:rgba(255,255,255,.8);margin-left:4px;flex:none}
.mp-dream-card .lk svg{width:13px;height:13px}
.mp-dream i.stem{width:2px;height:14px;background:linear-gradient(rgba(255,255,255,.8),rgba(255,255,255,.1))}
.mp-dream.below i.stem{background:linear-gradient(rgba(255,255,255,.1),rgba(255,255,255,.8))}
.mp-dream.open .mp-dream-card{background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.2),0 0 0 6px rgba(255,213,107,.5),0 0 60px 10px rgba(255,213,107,.55),0 14px 30px -10px rgba(0,0,0,.7)}
.mp-dream.open .mp-dream-card .tx b{color:#141312}.mp-dream.open .mp-dream-card .tx span{color:#5D5A54}
.mp-dream.open .lk{background:var(--ok);color:#fff}
.mp-beam{position:absolute;left:-90px;top:-420px;width:180px;height:440px;pointer-events:none;opacity:0;transition:opacity 1s var(--ease);
  background:radial-gradient(ellipse 50% 6% at 50% 97%,rgba(255,223,140,.9),rgba(255,223,140,0) 70%),linear-gradient(to top,rgba(255,223,140,.5),rgba(255,223,140,0) 85%);
  -webkit-mask-image:linear-gradient(to right,transparent,#000 35%,#000 65%,transparent);mask-image:linear-gradient(to right,transparent,#000 35%,#000 65%,transparent);mix-blend-mode:screen}
.mp-on .mp-beam.on{opacity:.9}
.mp-on .mp-beam.on.soft{opacity:.42}
.mp-shade{position:absolute;inset:0;pointer-events:none;transition:opacity .8s var(--ease),background .8s var(--ease);
  background:linear-gradient(to right,rgba(10,12,11,var(--shl,0)) 0,rgba(10,12,11,var(--shl,0)) 560px,rgba(10,12,11,0) 1290px),
  linear-gradient(to left,rgba(10,12,11,var(--shr,0)) 0,rgba(10,12,11,var(--shr,0)) 560px,rgba(10,12,11,0) 1180px),
  linear-gradient(to bottom,rgba(10,12,11,.5) 0,rgba(10,12,11,.5) 360px,rgba(10,12,11,0) 540px),linear-gradient(to top,rgba(10,12,11,.4) 0,rgba(10,12,11,.4) 360px,rgba(10,12,11,0) 520px)}
.mp-dimmer{position:absolute;inset:0;background:rgba(9,10,10,var(--dim,0));pointer-events:none;transition:background .7s var(--ease)}

/* ---------- screens ---------- */
#sp-screens{position:absolute;inset:0;pointer-events:none}
.sp-screen{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .28s var(--ease)}
.sp-screen.on{opacity:1;pointer-events:auto;transition:opacity .5s var(--ease) .12s}
.sp-screen.on.rise>*{animation:sp-rise .7s var(--spring) both}
@keyframes sp-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- chrome that stays put between screens ---------- */
.sp-wm{position:absolute;left:30px;top:26px;height:26px;z-index:40;color:var(--tx);transition:color .5s var(--ease),opacity .4s}
.sp-wm svg{height:100%;width:auto}
.sp-rail{position:absolute;left:22px;top:50%;z-index:40;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:22px;
  background:var(--glass);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px rgba(0,0,0,.35),0 20px 40px -20px rgba(0,0,0,.6);
  opacity:0;pointer-events:none;translate:-10px 0;transition:opacity .45s var(--ease),translate .6s var(--spring),background .5s,box-shadow .5s}
#sp-root[data-rail] .sp-rail{opacity:1;pointer-events:auto;translate:0 0}
#sp-root[data-tone="paper"] .sp-rail{background:#fff;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:0 0 0 1px var(--line),var(--sh2)}
.sp-rail button{width:58px;padding:11px 0 9px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--tx-3);
  font:500 10.5px/1 var(--sans);letter-spacing:0;transition:color .25s,background .25s}
.sp-rail button svg{width:19px;height:19px}
.sp-rail button:hover{color:var(--tx)}
.sp-rail button.on{color:var(--on-ink);background:var(--ink)}
.sp-rail button{position:relative}
.sp-rail button i.n{position:absolute;right:8px;top:5px;min-width:17px;height:17px;padding:0 4px 0;border-radius:99px;display:grid;place-items:center;
  background:var(--ink);color:var(--on-ink);font:600 10.5px/1 var(--sans);font-style:normal;letter-spacing:0;font-variant-numeric:tabular-nums;box-shadow:0 0 0 2px rgba(17,18,19,.6)}
#sp-root[data-tone="paper"] .sp-rail button i.n{box-shadow:0 0 0 2px #fff}
.sp-rail button.on i.n{display:none}
/* how it works: the plan again, any time */
.sp-help{position:absolute;left:22px;bottom:22px;z-index:40;height:38px;padding:0 15px 1px;border-radius:99px;white-space:nowrap;font:500 13px/1 var(--sans);letter-spacing:-.01em;color:var(--tx-2);
  background:var(--glass);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px rgba(0,0,0,.35),0 14px 30px -16px rgba(0,0,0,.6);
  opacity:0;pointer-events:none;translate:0 8px;transition:opacity .45s var(--ease),translate .6s var(--spring),color .2s,background .5s,box-shadow .5s}
#sp-root[data-rail] .sp-help{opacity:1;pointer-events:auto;translate:0 0}
.sp-help:hover{color:var(--tx)}
#sp-root[data-tone="paper"] .sp-help{background:#fff;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:0 0 0 1px var(--line),var(--sh1)}
/* the job portal's own tabs, as in its Figma shell */
.sp-tabs{position:absolute;left:50%;top:27px;z-index:40;transform:translateX(-50%);display:flex;gap:2px;opacity:0;pointer-events:none;transition:opacity .4s var(--ease)}
#sp-root[data-tabs] .sp-tabs{opacity:1;pointer-events:auto}
.sp-tabs button{height:40px;padding:0 17px;border-radius:99px;font:500 14.5px/1 var(--sans);letter-spacing:-.014em;color:var(--tx-3);white-space:nowrap;transition:background .2s,color .2s}
.sp-tabs button:hover{color:var(--tx)}
.sp-tabs button.on{color:var(--tx);background:var(--sunk,rgba(255,255,255,.1))}
/* the one number: level, and how far to the next */
.sp-pill{position:absolute;right:26px;top:20px;z-index:40;display:flex;align-items:center;gap:11px;height:54px;padding:0 8px 0 8px;border-radius:99px;text-align:left;
  background:var(--glass);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px rgba(0,0,0,.35),0 20px 40px -20px rgba(0,0,0,.6);
  opacity:0;pointer-events:none;translate:0 -8px;transition:opacity .45s var(--ease),translate .6s var(--spring),background .5s,box-shadow .5s}
#sp-root[data-pill] .sp-pill{opacity:1;pointer-events:auto;translate:0 0}
#sp-root[data-tone="paper"] .sp-pill{background:#fff;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:0 0 0 1px var(--line),var(--sh2)}
.sp-pill .t{display:flex;flex-direction:column;gap:4px;padding-right:4px;min-width:112px}
.sp-pill .t b{font:500 14.5px/1 var(--sans);color:var(--tx);letter-spacing:-.014em;white-space:nowrap}
.sp-pill .t b i{font-style:normal;font-weight:400;color:var(--tx-3)}
.sp-pill .t span{font:400 12.5px/1 var(--sans);color:var(--tx-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.sp-pill .t span.pd{display:flex;align-items:center;gap:5px;color:var(--tx)}
.sp-pill .goal{position:relative;display:block;margin:0 2px 0 4px}
.sp-pill .goal>i{position:absolute;right:-5px;bottom:-4px;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;background:#2A2C2B;color:rgba(255,255,255,.85);box-shadow:0 0 0 2px #1B1D1C}
.sp-pill .goal>i svg{width:9px;height:9px}
.sp-pill .goal.open>i{background:var(--ok);color:#fff}
#sp-root[data-tone="paper"] .sp-pill .goal>i{background:#EDEBE7;color:#5D5A54;box-shadow:0 0 0 2px #fff}
#sp-root[data-tone="paper"] .sp-pill .goal.open>i{background:var(--ok);color:#fff}
.sp-pill .goal span{font:400 12.5px/1 var(--sans);color:var(--tx-2);white-space:nowrap}
.sp-pill .goal b{font-weight:500;color:var(--tx)}
.sp-pill.bump{animation:sp-bump .6s var(--spring)}
@keyframes sp-bump{0%{scale:1}35%{scale:1.06}100%{scale:1}}

/* ---------- parts ---------- */
/* the level ring: the number is the level, the arc is how far into it you are */
.sp-ring{position:relative;flex:none;width:var(--z,38px);height:var(--z,38px);display:grid;place-items:center}
.sp-ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.sp-ring circle{fill:none;stroke-width:3;stroke-linecap:round}
.sp-ring .tr{stroke:var(--tx-4)}
.sp-ring .ar{stroke:var(--gold);stroke-dasharray:100;stroke-dashoffset:calc(100 - var(--p,0) * 100);transition:stroke-dashoffset 1s var(--out)}
#sp-root[data-tone="paper"] .sp-ring .ar{stroke:#E3A62B}
.sp-ring .pe{stroke:var(--gold);opacity:.4;stroke-dasharray:100;stroke-dashoffset:calc(100 - var(--pp,0) * 100);transition:stroke-dashoffset 1s var(--out)}
#sp-root[data-tone="paper"] .sp-ring .pe{stroke:#E3A62B}
.sp-ring b{position:relative;font:600 calc(var(--z,38px) * .40)/1 var(--sans);letter-spacing:-.02em;color:var(--tx);font-variant-numeric:tabular-nums}
/* the skill point star */
.sp-star{flex:none;width:var(--z,14px);height:var(--z,14px);color:var(--gold)}
#sp-root[data-tone="paper"] .sp-star{color:#E3A62B}
/* a company mark on its own colour */
.sp-lg{flex:none;position:relative;width:var(--z,32px);height:var(--z,32px);border-radius:calc(var(--z,32px) * .28);background:var(--c,#111);display:grid;place-items:center;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset 0 1px 0 rgba(255,255,255,.14)}
.sp-lg.round{border-radius:50%}
.sp-lg i{width:56%;height:56%;background:var(--m,#fff);-webkit-mask:var(--u) center/contain no-repeat;mask:var(--u) center/contain no-repeat}
.sp-lg.lightc{box-shadow:inset 0 0 0 1px rgba(0,0,0,.09)}
.sp-lg svg{width:54%;height:54%}
/* buttons: the key, as on the Zero site */
.sp-key{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:48px;padding:0 22px 2px;border-radius:15px;white-space:nowrap;
  background:var(--key-light);color:#131315;box-shadow:var(--key-light-sh);font:500 15px/1 var(--sans);letter-spacing:-.014em;
  transition:transform .18s var(--out),filter .2s,box-shadow .2s}
.sp-key:hover{filter:brightness(1.03)}
.sp-key:active{transform:translateY(1.5px);box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(0,0,0,.1),0 0 0 1px rgba(0,0,0,.18),0 6px 12px -8px rgba(0,0,0,.5)}
.sp-key.dark{background:var(--key-dark);color:#F4F4F3;box-shadow:var(--key-dark-sh)}
.sp-key.dark:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.5),0 0 0 1px #121413}
.sp-key.sm{height:40px;padding:0 16px 2px;border-radius:13px;font-size:14px}
.sp-key svg{width:16px;height:16px;flex:none}
.sp-key[disabled]{opacity:.45;pointer-events:none}
.sp-ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:15px;white-space:nowrap;
  color:var(--tx);font:500 15px/1 var(--sans);letter-spacing:-.014em;background:var(--glass-2);box-shadow:inset 0 0 0 1px var(--line);transition:background .2s}
.sp-ghost:hover{background:var(--glass-3)}
.sp-ghost.sm{height:40px;padding:0 15px;border-radius:13px;font-size:14px}
#sp-root[data-tone="paper"] .sp-ghost{background:#fff;box-shadow:0 0 0 1px var(--line),var(--sh1)}
#sp-root[data-tone="paper"] .sp-ghost:hover{background:var(--wash)}
/* glass panel on the city */
.sp-glass{background:var(--glass);backdrop-filter:blur(26px) saturate(1.3);-webkit-backdrop-filter:blur(26px) saturate(1.3);border-radius:30px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 0 0 1px rgba(255,255,255,.04),0 0 0 1px rgba(0,0,0,.4),0 40px 80px -40px rgba(0,0,0,.75)}
/* a lock, and a tick */
.sp-lock{flex:none;width:var(--z,26px);height:var(--z,26px);border-radius:50%;display:grid;place-items:center;background:var(--glass-3);color:var(--tx-2)}
.sp-lock svg{width:50%;height:50%}
#sp-root[data-tone="paper"] .sp-lock{background:var(--field);color:var(--tx-3)}
.sp-tick{flex:none;width:var(--z,26px);height:var(--z,26px);border-radius:50%;display:grid;place-items:center;background:var(--ok);color:#fff}
.sp-tick svg{width:50%;height:50%}
/* titles */
.sp-h1{font:400 40px/1.08 var(--serif);letter-spacing:-.028em;color:var(--tx);text-wrap:balance}
.sp-h2{font:400 28px/1.12 var(--serif);letter-spacing:-.024em;color:var(--tx);text-wrap:balance}
.sp-p{font:400 15px/1.45 var(--sans);letter-spacing:-.012em;color:var(--tx-2);text-wrap:pretty}
.sp-num{font-variant-numeric:tabular-nums}

/* ---------- the review key, bottom right. It is for stepping through the screens, not part of the product. ---------- */
#sp-dev{position:fixed;right:16px;bottom:16px;z-index:200;font:500 12.5px/1 var(--sans);letter-spacing:-.005em;color:#F4F4F3}
#sp-dev .bar{display:flex;align-items:center;gap:2px;height:40px;padding:0 5px;border-radius:14px;background:var(--key-dark);box-shadow:var(--key-dark-sh)}
#sp-dev .bar button{height:30px;min-width:30px;padding:0 8px;border-radius:9px;display:grid;place-items:center;color:rgba(244,244,243,.72);transition:background .2s,color .2s}
#sp-dev .bar button:hover{background:rgba(255,255,255,.08);color:#fff}
#sp-dev .bar button svg{width:15px;height:15px}
#sp-dev .name{padding:0 10px;min-width:150px;text-align:center;white-space:nowrap;color:#F4F4F3}
#sp-dev .name em{font-style:normal;color:rgba(244,244,243,.45);margin-right:7px;font-variant-numeric:tabular-nums}
#sp-dev .menu{position:absolute;right:0;bottom:50px;width:560px;max-height:calc(100vh - 90px);overflow:auto;padding:16px;border-radius:20px;background:#1B1D1C;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 0 1px #0c0d0d,0 30px 70px -20px rgba(0,0,0,.8);display:none}
#sp-dev.open .menu{display:block}
#sp-dev .menu h4{font:500 11.5px/1 var(--sans);color:rgba(244,244,243,.45);margin:14px 4px 8px}
#sp-dev .menu h4:first-child{margin-top:2px}
#sp-dev .grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
#sp-dev .grid button{display:flex;align-items:center;gap:9px;height:34px;padding:0 10px;border-radius:10px;text-align:left;color:rgba(244,244,243,.8);white-space:nowrap;overflow:hidden}
#sp-dev .grid button em{font-style:normal;color:rgba(244,244,243,.36);font-variant-numeric:tabular-nums;width:16px;flex:none}
#sp-dev .grid button:hover{background:rgba(255,255,255,.07);color:#fff}
#sp-dev .grid button.on{background:#F4F4F3;color:#131315}
#sp-dev .grid button.on em{color:rgba(19,19,21,.5)}
#sp-dev .foot{display:flex;gap:6px;margin-top:14px}
#sp-dev .foot a,#sp-dev .foot button{flex:1;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.07);color:#F4F4F3;text-decoration:none;font:500 12.5px/1 var(--sans)}
#sp-dev .foot a:hover,#sp-dev .foot button:hover{background:rgba(255,255,255,.12)}

/* ---------- the coach: one thing lit, one sentence, the learner's pace ---------- */
.sp-coach{position:absolute;inset:0;z-index:70;opacity:0;transition:opacity .35s var(--ease)}
.sp-coach.on{opacity:1}
.sp-coach.pass{pointer-events:none}
.sp-coach .hole{position:absolute;left:800px;top:420px;width:0;height:0;border-radius:24px;pointer-events:none;opacity:0;
  box-shadow:0 0 0 1.5px rgba(255,255,255,.92),0 0 0 3px rgba(0,0,0,.35),0 0 0 4000px rgba(7,8,8,.6);
  transition:left .55s var(--ease),top .55s var(--ease),width .55s var(--ease),height .55s var(--ease),border-radius .55s var(--ease),opacity .35s var(--ease)}
.sp-coach.lit .hole{opacity:1}
.sp-coach .card{position:absolute;width:348px;padding:20px 20px 16px;border-radius:22px;pointer-events:auto;
  background:var(--key-light);color:#141312;box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(0,0,0,.16),0 30px 60px -20px rgba(0,0,0,.6);
  transition:left .55s var(--ease),top .55s var(--ease)}
.sp-coach .card>b{display:block;font:500 18px/1.25 var(--sans);letter-spacing:-.018em;color:#141312;text-wrap:balance}
.sp-coach .card>p{margin-top:7px;font:400 14.5px/1.45 var(--sans);letter-spacing:-.012em;color:#5D5A54;text-wrap:pretty}
.sp-coach .card>p b{font-weight:500;color:#141312}
.sp-coach footer{display:flex;align-items:center;gap:6px;margin-top:16px}
.sp-coach .dots{display:flex;gap:5px;margin-right:auto;padding-left:2px}
.sp-coach .dots i{width:6px;height:6px;border-radius:9px;background:rgba(20,19,18,.16);transition:width .4s var(--ease),background .3s}
.sp-coach .dots i.past{background:rgba(20,19,18,.42)}
.sp-coach .dots i.on{width:18px;background:#141312}
.sp-coach .skip{height:40px;padding:0 12px;border-radius:13px;font:400 14px/1 var(--sans);color:#747068;transition:color .2s}
.sp-coach .skip:hover{color:#141312}
.sp-coach .roles{list-style:none;margin-top:12px;padding:6px;border-radius:16px;background:rgba(20,19,18,.05)}
.sp-coach .roles li{display:flex;align-items:center;gap:11px;height:48px;padding:0 8px}
.sp-coach .roles li>span.tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sp-coach .roles li b{font:500 14px/1.3 var(--sans);letter-spacing:-.012em;color:#141312;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-coach .roles li em{font:400 12.5px/1.25 var(--sans);font-style:normal;color:#747068}

/* screens/intro.css */
/* how Zero works, in ten seconds: one picture built in three beats */
.sc-intro .in-wrap{position:absolute;left:50%;top:50%;width:1240px;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center}
.sc-intro .in-title{font-size:52px;text-align:center;letter-spacing:-.032em;transition:opacity .24s var(--ease),transform .4s var(--spring)}
.sc-intro .in-cap{margin-top:16px;height:50px;max-width:640px;font:400 17px/1.45 var(--sans);letter-spacing:-.014em;color:var(--tx-2);text-align:center;text-wrap:balance;transition:opacity .24s var(--ease),transform .4s var(--spring)}
.sc-intro .in-title.out,.sc-intro .in-cap.out{opacity:0;transform:translateY(8px)}

.sc-intro .in-stage{position:relative;width:1240px;height:306px;margin-top:38px;border-radius:36px;background:rgba(17,18,19,.55);backdrop-filter:blur(26px) saturate(1.3);-webkit-backdrop-filter:blur(26px) saturate(1.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 0 0 1px rgba(255,255,255,.04),0 0 0 1px rgba(0,0,0,.4),0 40px 80px -40px rgba(0,0,0,.75)}
/* three rows, named once on the left: what you do, where you are, what it opens */
.sc-intro .in-lab{position:absolute;left:28px;width:104px;font:400 13px/1 var(--sans);color:var(--tx-3);white-space:nowrap;opacity:0;transition:opacity .5s var(--ease)}
.sc-intro .in-lab.l1{top:58px}.sc-intro .in-lab.l2{top:152px;opacity:1;color:var(--tx-2)}.sc-intro .in-lab.l3{top:232px}
.sc-intro .b2 .in-lab.l1,.sc-intro .b3 .in-lab.l3{opacity:1;color:var(--tx-2)}

/* the track and its ten notches */
.sc-intro .in-track{position:absolute;left:0;top:158px;width:100%;height:0}
.sc-intro .in-track::before{content:'';position:absolute;left:150px;top:-1.5px;width:780px;height:3px;border-radius:3px;background:rgba(255,255,255,.14)}
.sc-intro .in-fill{position:absolute;left:150px;top:-1.5px;width:0;height:3px;border-radius:3px;background:var(--gold);transition:width .6s var(--out)}
.sc-intro .in-n{position:absolute;top:-5px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#3A3C3B;box-shadow:0 0 0 3px rgba(17,18,19,.9);transition:background .4s var(--ease)}
.sc-intro .in-n.on{background:var(--gold)}
.sc-intro .in-n[data-l="0"]{opacity:0}

/* you: the ring that carries your level along the track */
.sc-intro .in-me{position:absolute;top:133px;width:50px;height:50px;margin-left:-25px;border-radius:50%;background:#1B1D1C;box-shadow:0 0 0 1px rgba(0,0,0,.5),0 10px 22px -8px rgba(0,0,0,.7);transition:left .62s var(--out);z-index:2}
.sc-intro .in-me .sp-ring circle{stroke-width:3}
.sc-intro .in-me .sp-ring .ar{transition:stroke-dashoffset .5s var(--out)}
.sc-intro .in-plus{position:absolute;left:50%;top:-34px;transform:translateX(-50%);display:flex;align-items:center;gap:5px;height:26px;padding:0 10px 0 8px;border-radius:99px;background:#fff;color:#141312;
  font:600 12.5px/1 var(--sans);font-style:normal;white-space:nowrap;opacity:0;pointer-events:none;box-shadow:0 8px 18px -6px rgba(0,0,0,.6)}
.sc-intro .in-plus .sp-star{color:#E3A62B}
.sc-intro .in-me.pay .in-plus{animation:in-pay 1s var(--out) both}
@keyframes in-pay{0%{opacity:0;translate:0 10px;scale:.8}22%{opacity:1;translate:0 0;scale:1}70%{opacity:1;translate:0 -4px}100%{opacity:0;translate:0 -12px}}

/* the scenarios: real companies, one per step */
.sc-intro .in-scn{position:absolute;left:0;top:0;width:100%}
.sc-intro .in-s{position:absolute;top:44px;margin-left:-20px;opacity:0;scale:.5;transition:opacity .35s var(--ease) var(--d,0s),scale .55s var(--spring) var(--d,0s)}
.sc-intro .in-s .sp-lg{box-shadow:0 0 0 2px rgba(255,255,255,.14),0 6px 14px -6px rgba(0,0,0,.6)}
.sc-intro .b2 .in-s{opacity:1;scale:1}

/* the jobs each level opens */
.sc-intro .in-jobs{position:absolute;left:0;top:0;width:100%}
.sc-intro .in-j{position:absolute;top:224px;display:flex;transform:translateX(-50%);opacity:0;scale:.5;transition:opacity .35s var(--ease),scale .55s var(--spring)}
.sc-intro .in-j .sp-lg{box-shadow:0 0 0 2px #fff,0 6px 14px -6px rgba(0,0,0,.6)}
.sc-intro .in-j .sp-lg+.sp-lg{margin-left:-9px}
.sc-intro .in-j.on{opacity:1;scale:1}

/* the job you want, at the end of the track */
.sc-intro .in-goal{position:absolute;left:954px;top:113px;width:266px;height:90px;padding:0 14px 0 14px;border-radius:24px;display:flex;align-items:center;gap:13px;
  background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),inset 0 1px 0 rgba(255,255,255,.08);transition:background .6s var(--ease),box-shadow .6s var(--ease)}
.sc-intro .in-goal::before{content:'';position:absolute;right:100%;top:50%;width:24px;height:3px;margin-top:-1.5px;border-radius:3px;background:rgba(255,255,255,.14)}
.sc-intro .in-lg{flex:none;display:block;transition:opacity .15s,scale .3s var(--spring)}
.sc-intro .in-lg.swap{opacity:0;scale:.86}
.sc-intro .in-goal .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.sc-intro .in-goal b{font:500 15px/1.2 var(--sans);letter-spacing:-.014em;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-intro .in-goal em{font:400 13px/1 var(--sans);font-style:normal;color:var(--tx-2);white-space:nowrap}
.sc-intro .in-goal .lk{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);color:rgba(255,255,255,.8);transition:background .4s,color .4s}
.sc-intro .in-goal .lk svg{width:14px;height:14px}
.sc-intro .in-goal.open{background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.2),0 0 0 6px rgba(255,213,107,.5),0 0 60px 10px rgba(255,213,107,.45)}
.sc-intro .in-goal.open::before{background:var(--gold)}
.sc-intro .in-goal.open b{color:#141312}.sc-intro .in-goal.open em{color:var(--ok-deep)}
.sc-intro .in-goal.open .lk{background:var(--ok);color:#fff}

.sc-intro .in-foot{display:flex;flex-direction:column;align-items:center;gap:22px;margin-top:34px}
.sc-intro .in-dots{display:flex;gap:6px}
.sc-intro .in-dots button{width:34px;height:22px;display:grid;place-items:center}
.sc-intro .in-dots i{display:block;width:7px;height:7px;border-radius:9px;background:rgba(255,255,255,.26);transition:width .4s var(--ease),background .3s}
.sc-intro .in-dots .past i{background:rgba(255,255,255,.6)}
.sc-intro .in-dots .on i{width:26px;background:#fff}
.sc-intro .in-dots button:hover i{background:#fff}
.sc-intro .in-go{height:52px;padding:0 26px 2px;border-radius:17px}
.sc-intro .in-go svg{margin-right:-4px}

/* beat one is only the job: it stands centre stage, then takes its place at the end of the track */
.sc-intro .in-goal{transition:background .6s var(--ease),box-shadow .6s var(--ease),transform 1s var(--spring)}
.sc-intro .in-stage:not(.b2) .in-goal{transform:translateX(-467px) scale(1.22)}
.sc-intro .in-stage:not(.b2) .in-goal::before{opacity:0}
.sc-intro .in-goal::before{transition:opacity .5s var(--ease) .5s}
.sc-intro .in-track,.sc-intro .in-me,.sc-intro .in-lab.l2{transition:opacity .6s var(--ease) .25s,left .62s var(--out)}
.sc-intro .in-stage:not(.b2) .in-track,.sc-intro .in-stage:not(.b2) .in-me,.sc-intro .in-stage:not(.b2) .in-lab.l2{opacity:0}

/* screens/dream.css */
/* the dream: where, which job, and the plan */
.sc-dream .dr-panel,.sc-plan .dr-panel{position:absolute;left:112px;top:50%;width:468px;transform:translateY(-50%);padding:36px 32px 32px;border-radius:34px}
.sc-dream .dr-body,.sc-plan .dr-body{transition:opacity .2s var(--ease),transform .3s var(--ease)}
.sc-dream .dr-body.out{opacity:0;transform:translateY(6px)}
.sc-dream .dr-h,.sc-plan .dr-h{font-size:38px}
.sc-dream .dr-sub{margin-top:12px;max-width:330px}
.sc-dream .dr-back{position:relative;width:38px;height:38px;margin:-6px 0 18px -6px;border-radius:50%;display:grid;place-items:center;color:var(--tx-2);background:var(--glass-2);box-shadow:inset 0 0 0 1px var(--line);transition:background .2s,color .2s}
.sc-dream .dr-back:hover{background:var(--glass-3);color:var(--tx)}
.sc-dream .dr-back svg{width:16px;height:16px}

/* the six companies */
.sc-dream .dr-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:26px}
.sc-dream .dr-co{position:relative;display:flex;align-items:center;gap:13px;height:68px;padding:0 14px;border-radius:20px;text-align:left;
  background:var(--glass-2);box-shadow:inset 0 0 0 1px var(--line-2);transition:background .25s var(--ease),box-shadow .25s var(--ease),transform .2s var(--out)}
.sc-dream .dr-co:hover{background:var(--glass-3)}
.sc-dream .dr-co:active{transform:scale(.985)}
.sc-dream .dr-co>span:not(.sp-lg){font:500 16px/1 var(--sans);letter-spacing:-.016em;color:var(--tx)}
.sc-dream .dr-co>i{margin-left:auto;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#141312;color:#fff;opacity:0;scale:.5;transition:opacity .2s,scale .35s var(--spring)}
.sc-dream .dr-co>i svg{width:11px;height:11px}
.sc-dream .dr-co.on{background:var(--key-light);box-shadow:var(--key-light-sh)}
.sc-dream .dr-co.on>span:not(.sp-lg){color:#141312}
.sc-dream .dr-co.on>i{opacity:1;scale:1}

/* the four rungs */
.sc-dream .dr-rungs{display:flex;flex-direction:column;gap:8px;margin-top:26px}
.sc-dream .dr-rung{position:relative;display:flex;align-items:center;gap:14px;height:72px;padding:0 16px 0 12px;border-radius:20px;text-align:left;
  background:var(--glass-2);box-shadow:inset 0 0 0 1px var(--line-2);transition:background .25s var(--ease),box-shadow .25s var(--ease),transform .2s var(--out)}
.sc-dream .dr-rung:hover{background:var(--glass-3)}
.sc-dream .dr-rung:active{transform:scale(.99)}
.sc-dream .dr-rung .lv{flex:none;width:66px;height:48px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:var(--glass-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.sc-dream .dr-rung .lv b{font:500 18px/1 var(--sans);letter-spacing:-.02em;color:var(--tx);font-variant-numeric:tabular-nums}
.sc-dream .dr-rung .lv em{font:400 10.5px/1 var(--sans);font-style:normal;color:var(--tx-3);letter-spacing:0}
.sc-dream .dr-rung .tx{display:flex;flex-direction:column;gap:6px;min-width:0}
.sc-dream .dr-rung .tx b{font:500 16px/1 var(--sans);letter-spacing:-.016em;color:var(--tx);white-space:nowrap}
.sc-dream .dr-rung .tx em{font:400 13px/1 var(--sans);font-style:normal;color:var(--tx-2);white-space:nowrap}
.sc-dream .dr-rung>i{margin-left:auto;flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#141312;color:#fff;opacity:0;scale:.5;transition:opacity .2s,scale .35s var(--spring)}
.sc-dream .dr-rung>i svg{width:11px;height:11px}
.sc-dream .dr-rung.on{background:var(--key-light);box-shadow:var(--key-light-sh)}
.sc-dream .dr-rung.on .lv{background:#141312;box-shadow:none}
.sc-dream .dr-rung.on .lv b{color:#fff}.sc-dream .dr-rung.on .lv em{color:rgba(255,255,255,.6)}
