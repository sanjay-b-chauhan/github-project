<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zero project brief</title>
<meta name="description" content="The project brief, opened from the world: everything at a glance, the detail one Read more away.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,300..800&display=swap">
<style>
/* b8 (22 Oct), Sanjay on b7: the one colour lost the hierarchy. Keep a hierarchy, but in light tones only: no stark
   white, no dark grey (title and values .88, body .66, labels .5). No bold anywhere, a super clean UI. Smaller type
   and a slightly smaller card ("on my screen this feels so big"), more space between sections, and scrolling is fine.
   The Cancel Crisis art sits in its own container, bigger. The stages are a vertical list: four, then View all. No
   dropdowns: the detail is a drill-down, Read the full brief and View all push their page into the left column and
   Back returns, so it stays clear what is open.
/* b7 (22 Oct), Sanjay on b6: the brief makes sense, show more of it. The stages are the opened list only, one line each
   (number, name, time), no bar and no description. One colour only for the text, not grey and white: the hierarchy
   comes from size and weight. A little scroll is fine; the majority shows in one go.
   b6 (22 Oct), Sanjay on b5: the stages are the scenario's own work (draft the proposal to present to the team), not
   the kickoff and workspace steps; body type about 13px; the art on the left and the title on its right; dividers
   between sections; a darker glass; more space, tighter tracking. On the map, the locked companies stay quiet: a lock
   only, its name on hover, and on click when it opens. Everything else as b5.
   The project brief, b5. Desktop only (Zero is a desktop app).
   Sanjay on b4 (22 Oct): back to the blur glass (the app's own, as in b3), not the solid black. At a glance, much of the
   data should show in one view. Company, project type and manager in three clear boxes. The brief, the stages and what
   you'll cover condensed, with Read more for the rest ("it feels like everything is important"). What you get moves to
   the right, one line with an icon each. The streak goes (we don't have it). No mono, as b4.
   So the left reads in one pass: title, the three boxes, the brief in two lines, the stages as one bar where each
   part is as long as its time, and what you'll cover in three short columns. The detail (the full brief, each stage
   in a line) opens under Read more. The right: Earn up to, time and difficulty, what you get, Start.
   The glass is the app's (rgba(18,18,18,.62), blur 16, saturate 1.1, radius 42, scrim .36). It opens as b4 did,
   but the grown shape is the glass itself: a window-sized glass layer clipped to the card's box grows to the brief's,
   420ms on a quick-out curve, while the content is revealed by the same edge. No layout while it moves, no fades. */
:root{--sans:'Google Sans Flex','Google Sans',-apple-system,system-ui,sans-serif;--ease:cubic-bezier(.32,.72,0,1);--green:#4ade80;
  --t1:rgba(255,255,255,.88);--t2:rgba(255,255,255,.66);--t3:rgba(255,255,255,.5);--tile:rgba(255,255,255,.055);--line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.16)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#101112;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;margin:0;padding:0;cursor:pointer;-webkit-appearance:none;appearance:none}
ul,ol{list-style:none;margin:0;padding:0}

/* ---------------- the world (cover) and the app's canvas (contain) ---------------- */
#world{position:fixed;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#app{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;font-family:var(--sans);color:#fff;pointer-events:none}
#app>*{pointer-events:auto}
.map{position:absolute;inset:0;overflow:hidden;background:#131514}
.cam{position:absolute;inset:0;transform-origin:56% 64%;transition:transform 1s var(--ease)}
.city{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;user-select:none}
body.picked .cam{transform:translate(-140px,-60px) scale(1.2)}
.mk{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;display:grid;place-items:center;
  background:rgba(18,20,26,.84);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.34),0 3px 10px rgba(0,0,0,.35);color:rgba(255,255,255,.78)}
.mk svg{width:15px;height:15px}
.mk.go{background:radial-gradient(circle,#1c1a18 0 4px,#fff 4.8px);box-shadow:0 0 0 3px rgba(255,255,255,.3),0 3px 10px rgba(0,0,0,.35)}
.mk.go::after{content:'';position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.85);animation:ring 2.2s cubic-bezier(0,0,.2,1) infinite}
@keyframes ring{0%{transform:scale(.9);opacity:0}18%{opacity:.85}100%{transform:scale(3.1);opacity:0}}
.chip{position:absolute;display:flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 11px;border-radius:999px;white-space:nowrap;font:600 15px/1 var(--sans);
  background:rgba(18,20,26,.78);color:rgba(255,255,255,.92);box-shadow:0 6px 20px rgba(0,0,0,.3),inset 0 0 0 1px rgba(255,255,255,.12)}
.chip img{width:17px;height:17px;display:block;filter:brightness(0) invert(1);opacity:.85}
.chip em{font:500 14px/1 var(--sans);font-style:normal;color:rgba(255,255,255,.6);margin-left:2px}
.chip.go{background:rgba(255,255,255,.96);color:#1c1a18;box-shadow:0 8px 22px rgba(0,0,0,.28);cursor:pointer}
.chip.go img{filter:none;opacity:1}
.chip.go em{display:inline-flex;align-items:center;gap:6px;color:#1f7a36;font-weight:600}
.chip.go em::before{content:'';width:7px;height:7px;border-radius:50%;background:#49BA61}
.chip.t{transform:translate(-50%,-100%)}.chip.b{transform:translate(-50%,0)}
.mk.lk{cursor:pointer;transition:transform .2s var(--ease),background-color .2s}
.mk.lk:hover,.mk.lk.open{z-index:6;background:rgba(18,20,26,.96);transform:scale(1.12)}
.tip{position:absolute;left:50%;bottom:calc(100% + 10px);display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:10px 14px 10px 12px;border-radius:14px;
  white-space:nowrap;text-align:left;background:rgba(18,20,26,.92);box-shadow:0 10px 24px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.12);
  transform-origin:50% 100%;transform:translate(-50%,0) scale(.6);visibility:hidden;transition:transform .18s var(--ease),visibility 0s linear .18s;pointer-events:none}
.mk.lk:hover .tip,.mk.lk.open .tip{transform:translate(-50%,0) scale(.893);visibility:visible;transition:transform .22s var(--ease),visibility 0s}
.tip b{display:flex;align-items:center;gap:8px;font:600 15px/1 var(--sans);color:#fff}
.tip b img{width:16px;height:16px;filter:brightness(0) invert(1)}
.tip em{display:none;align-items:center;gap:6px;font:500 13px/1 var(--sans);font-style:normal;color:rgba(255,255,255,.62)}
.tip em svg{width:12px;height:12px}
.mk.lk.open .tip em{display:flex}
.hit{position:absolute;left:52.3%;top:55.5%;width:7.6%;height:13.8%;border-radius:30px;cursor:pointer;transition:background .2s,box-shadow .2s}
.hit:hover{background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7)}
body.picked .hit,body.picked .chip.go{pointer-events:none}
.hint{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);display:flex;align-items:center;height:48px;padding:0 20px;border-radius:999px;
  background:rgba(18,20,26,.78);font:500 17px/1 var(--sans);color:rgba(255,255,255,.85);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);transition:transform .4s var(--ease),opacity .3s}
body.picked .hint{transform:translate(-50%,40px);opacity:0}

/* ---------------- the scenario card on the right (the app's ScenarioIntroV1, set in the one sans) ---------------- */
.card{position:absolute;right:40px;top:50%;width:470px;padding:20px;transform:translate(560px,-50%);visibility:hidden;
  transition:transform .6s var(--ease),visibility 0s linear .6s}
body.picked .card{transform:translate(0,-50%);visibility:visible;transition:transform .6s var(--ease) .1s,visibility 0s}
.c-body{position:relative;overflow:hidden;border-radius:42px;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(16px) saturate(1.1);backdrop-filter:blur(16px) saturate(1.1);box-shadow:0 44px 90px -24px rgba(0,0,0,.5)}
.c-in{display:flex;flex-direction:column;align-items:center;gap:34px;padding:20px}
.c-nav{display:flex;align-items:center;justify-content:space-between;width:100%}
.c-chev{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;color:rgba(255,255,255,.7)}
.c-chev svg{width:24px;height:24px}.c-chev.off{opacity:.2}
.c-count{display:flex;height:46px;align-items:center;gap:8px;border-radius:999px;background:rgba(255,255,255,.1);padding:0 20px;font:500 16px/1 var(--sans);font-variant-numeric:tabular-nums}
.c-count i{font-style:normal;color:rgba(255,255,255,.4)}.c-count em{font-style:normal;color:rgba(255,255,255,.6)}
.c-art{width:336px;height:210px;object-fit:contain;display:block}
.c-desc{margin:0;max-width:360px;padding:0 10px;font:500 24px/1.35 var(--sans);text-align:center}
.c-meta{display:flex;flex-direction:column;align-items:center;gap:26px;width:100%}
.c-rule{width:100%;height:1px;background:rgba(255,255,255,.12)}
.c-rows{display:flex;flex-direction:column;gap:20px;width:100%}
.c-row{display:flex;height:30px;align-items:center;justify-content:space-between;padding:0 20px}
.c-row>span:first-child{font:500 16px/1 var(--sans);color:rgba(255,255,255,.55)}
.c-row>b,.c-diff b{font:500 18px/1 var(--sans)}
.c-xp{display:inline-flex;align-items:center;gap:6px;border-radius:40px;padding:6px 10px;background:rgba(255,224,107,.12);box-shadow:0 0 0 1px rgba(255,225,127,.4)}
.c-xp img{width:18px;height:18px;display:block}.c-xp b{font:600 18px/1.2 var(--sans);font-variant-numeric:tabular-nums;color:#fff9d5}
.c-diff{display:flex;align-items:center;gap:20px}
.c-bars{display:inline-flex;gap:2px}.c-bars i{display:block;width:23px;height:10px;border-radius:30px;background:#fff}.c-bars i.dim{opacity:.1}
/* the app's StartButtonV1 */
.start{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:62px;padding:15px 40px;border-radius:100px;
  background-image:linear-gradient(90deg,rgba(255,255,255,.4),rgba(255,255,255,.4)),linear-gradient(180deg,rgba(229,229,229,.8),rgb(226,226,226));
  box-shadow:0 6px 0 #c8c8c8,0 12px 18px -6px rgba(0,0,0,.4),0 0 0 1.33px #e6e6e6,inset 0 1.33px 0 rgba(255,255,255,.75);transition:transform .1s cubic-bezier(.34,1.56,.64,1),box-shadow .1s}
.start:hover{transform:translateY(-1px)}
.start:active,.start.down{transform:translateY(5px);box-shadow:0 1px 0 #c8c8c8,0 3px 8px -4px rgba(0,0,0,.4),0 0 0 1.33px #e6e6e6,inset 0 1.33px 0 rgba(255,255,255,.75)}
.start svg{width:7.8px;height:9.9px;margin-right:3.5px;position:relative;z-index:2}
.start b{position:relative;z-index:2;font:600 23px/1.2 var(--sans);letter-spacing:-.48px;
  background:linear-gradient(100deg,#121212 0%,#121212 34%,#ff5ec0 42%,#8b7bff 50%,#37dcc4 58%,#121212 66%,#121212 100%);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:holo 3s ease-in-out infinite}
@keyframes holo{0%{background-position:130% 0}55%,100%{background-position:-30% 0}}

/* ---------------- the brief: the app's glass, grown from the card ---------------- */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.36);opacity:0;visibility:hidden;transition:opacity .32s var(--ease),visibility 0s linear .32s}
body.open .scrim{opacity:1;visibility:visible;transition:opacity .32s var(--ease),visibility 0s}
.glass{position:fixed;inset:0;z-index:21;visibility:hidden;background:rgba(10,10,11,.76);-webkit-backdrop-filter:blur(16px) saturate(1.1);backdrop-filter:blur(16px) saturate(1.1)}
.ov{position:fixed;z-index:22;overflow:hidden;border-radius:42px;visibility:hidden;display:flex;font-family:var(--sans);font-weight:400;color:var(--t1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
body.open .glass,body.open .ov{visibility:visible}
.ov-x{position:fixed;z-index:23;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);transform:scale(.6);opacity:0;visibility:hidden;transition:transform .2s var(--ease),opacity .2s,background-color .15s,visibility 0s linear .2s}
.ov-x:hover{background:rgba(255,255,255,.3)}
.ov-x svg{width:20px;height:20px}
body.shown .ov-x{transform:none;opacity:1;visibility:visible;transition:transform .3s var(--ease),opacity .2s,background-color .15s,visibility 0s}
.ov-x.inside{background:var(--tile)}
.scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.14) transparent}
.scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
.num,.tm,.xp,.val,.no{font-variant-numeric:tabular-nums}

/* the left: a main view and one drill-down view. Read the full brief and View all push the detail in; Back returns */
.story{position:relative;flex:1 1 auto;min-width:0;overflow:hidden}
.view{position:absolute;inset:0;padding:40px 52px 48px;visibility:visible;transition:transform .42s var(--ease),visibility 0s}
.view.sub{transform:translateX(100%);visibility:hidden;transition:transform .42s var(--ease),visibility 0s linear .42s}
.story.drilled .view.main{transform:translateX(-100%);visibility:hidden;transition:transform .42s var(--ease),visibility 0s linear .42s}
.story.drilled .view.sub{transform:none;visibility:visible;transition:transform .42s var(--ease),visibility 0s}
.col{max-width:700px;margin:0 auto}
/* the content scales with the card (1 at 1512, up to 1.2 on a big screen) so a big window shows the same view, larger */
.col,.rail-sc,.act{zoom:var(--z,1)}
.top{display:flex;align-items:center;gap:24px}
.art{flex:none;display:grid;place-items:center;width:172px;height:108px;border-radius:22px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.art img{display:block;width:146px;height:86px;object-fit:contain}
.st-title{margin:0;font:400 24px/1.2 var(--sans);letter-spacing:-.026em;color:var(--t1)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:24px}
.fact{display:flex;align-items:center;gap:12px;min-width:0;padding:11px 14px;border-radius:16px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.f-ic{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;color:var(--t1)}
.f-ic.lg{background:#fff}.f-ic.lg img{width:18px;height:18px;display:block}
.f-ic.ty{background:rgba(255,255,255,.08)}.f-ic.ty svg{width:16px;height:16px}
img.f-ic{object-fit:cover;object-position:top}
.fact>span:last-child{display:flex;flex-direction:column;gap:4px;min-width:0}
.fact i{font:400 12px/1.2 var(--sans);font-style:normal;color:var(--t3)}
.fact b{font:400 13px/1.25 var(--sans);letter-spacing:-.008em;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{margin-top:36px;padding-top:32px;border-top:1px solid rgba(255,255,255,.07)}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:0 0 14px}
.sh h3{margin:0;font:400 15px/1.3 var(--sans);letter-spacing:-.014em;color:var(--t1)}
.sh .n{font:400 12px/1 var(--sans);color:var(--t3)}
.body{margin:0;font:400 13px/1.7 var(--sans);letter-spacing:-.004em;color:var(--t2)}
.body p{margin:0 0 14px}
.body em{font-style:normal;color:var(--t1)}
/* the way into the detail: a quiet key, so what opens is clear */
.go-link,.back{display:inline-flex;align-items:center;gap:6px;height:32px;border-radius:99px;font:400 13px/1 var(--sans);color:var(--t1);
  background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);transition:background-color .2s,transform .16s var(--ease)}
.go-link{margin-top:16px;padding:0 10px 0 14px}.back{padding:0 14px 0 10px}
.go-link:hover,.back:hover{background:rgba(255,255,255,.1)}.go-link:active,.back:active{transform:scale(.97)}
.go-link svg,.back svg{width:14px;height:14px;color:var(--t2);transition:transform .2s var(--ease)}
.go-link:hover svg{transform:translateX(2px)}.back:hover svg{transform:translateX(-2px)}
/* the stages: a vertical list */
.stl li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:14px;align-items:center;padding:8px 0}
.stl .no{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);font:400 11px/1 var(--sans);color:var(--t2)}
.stl .nm{font:400 13px/1.3 var(--sans);letter-spacing:-.006em;color:var(--t1)}
.stl .tm{font:400 12px/1 var(--sans);color:var(--t3)}
/* what you'll cover */
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:22px}
.cl{display:block;margin-bottom:12px;font:400 12px/1.2 var(--sans);font-style:normal;color:var(--t3)}
.cols li{display:flex;align-items:center;gap:10px;min-height:22px;font:400 13px/1.3 var(--sans);letter-spacing:-.006em;color:var(--t2)}
.cols li+li{margin-top:8px}
.cols li img{width:20px;height:20px;flex:none;border-radius:6px;background:#fff;padding:2px;object-fit:contain}
.cols li .no{flex:none;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);font:400 10px/1 var(--sans);color:var(--t2)}
.cols li .dot{flex:none;width:4px;height:4px;margin:0 8px;border-radius:50%;background:var(--t3)}
/* a drill-down page */
.sub-h{margin:28px 0 0;font:400 22px/1.2 var(--sans);letter-spacing:-.022em;color:var(--t1)}
.sub-n{margin:8px 0 22px;font:400 13px/1.4 var(--sans);color:var(--t3)}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.num{padding:16px 18px;border-radius:16px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.num b{display:block;font:400 24px/1 var(--sans);letter-spacing:-.02em;color:var(--t1)}
.num span{display:block;margin-top:8px;font:400 12px/1.4 var(--sans);color:var(--t3)}
.sub .stl li{padding:12px 0;border-top:1px solid rgba(255,255,255,.06)}
.sub .stl li:first-child{border-top:0}

/* the right: what you earn, how long, how hard, what you get, Start */
.rail{flex:none;display:flex;flex-direction:column;min-height:0;border-left:1px solid rgba(255,255,255,.07)}
.rail-sc{flex:1 1 auto;min-height:0;padding:40px 26px 12px;display:flex;flex-direction:column;gap:12px;
  -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 20px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 20px),transparent)}
.blk{padding:18px 20px;border-radius:18px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.lbl{margin:0 0 14px;font:400 12px/1.2 var(--sans);color:var(--t3)}
.tiers{display:flex;flex-direction:column;gap:12px}
.tier{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tier span.x{display:flex;align-items:center;gap:9px;white-space:nowrap}
.tier img{width:18px;height:18px;display:block}
.tier .xp{font:400 18px/1 var(--sans);letter-spacing:-.012em;color:var(--t1)}
.tier:not(:first-child) .xp{color:var(--t2)}
.tier .nm{font:400 12px/1.2 var(--sans);color:var(--t2);text-align:right}
.lvlup{display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 8px;border-radius:30px;font:500 11px/1 var(--sans);color:var(--green);
  background:color-mix(in srgb,var(--green) 14%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--green) 36%,transparent)}
.lvlup svg{width:11px;height:11px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pair .lbl{margin-bottom:10px}
.val{display:block;font:400 15px/1.2 var(--sans);letter-spacing:-.012em;color:var(--t1)}
.val+i{display:block;margin-top:6px;font:400 12px/1.2 var(--sans);font-style:normal;color:var(--t3)}
.diffs{display:flex;gap:3px;margin-top:9px}
.diffs i{display:block;width:16px;height:6px;border-radius:30px;background:var(--t1)}.diffs i.dim{opacity:.22}
.get li{display:flex;align-items:center;gap:12px;font:400 13px/1.3 var(--sans);letter-spacing:-.006em;color:var(--t2)}
.get li+li{margin-top:14px}
.get svg{width:16px;height:16px;flex:none;color:var(--t2)}
.lgs{display:flex;align-items:center;margin-left:auto}
.lgs span{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(40,40,41,1)}
.lgs span+span{margin-left:-5px}
.lgs img{width:13px;height:13px;display:block;border-radius:3px}
.act{flex:none;padding:12px 26px 26px}
.rail .start{height:52px}
.rail .start b{font-size:19px;font-weight:500}

    '<div class="view main scroll"><div class="col">' +

      '</section>' +

          '<div><i class="cl">Workflows</i><ul><li><span class="no">1</span>Group the reasons with AI</li><li><span class="no">2</span>Price it in a sheet</li><li><span class="no">3</span>Pressure test the plan</li></ul></div>' +

          '<div><i class="cl">Tool stack</i><ul><li>' + logo('img/logo-claude.svg') + 'Claude</li><li>' + logo('img/logo-sheets.svg') + 'Google Sheets</li><li>' + logo('img/logo-chatgpt.svg') + 'ChatGPT</li></ul></div>' +
        '</div>' +
      '</section>' +

      '</div>' +
      '<section class="blk"><h3 class="lbl">What you get</h3><ul class="get">' +
        '<li>' + I.folder + 'A real project on your portfolio</li>' +
        '<li>' + I.video + 'A recording of you presenting it</li>' +
        '<li>' + I.bag + 'Rank 1 roles open<span class="lgs"><span>' + logo('img/jb-logo-ramp.png') + '</span><span>' + logo('img/jb-logo-perplexity.png') + '</span><span>' + logo('img/jb-logo-lyft.png') + '</span></span></li>' +
      '</ul></section>' +
    '</div>' +
    '<div class="act"><button class="start" type="button" data-go>' + I.play + '<b>Start</b></button></div></aside>';
  var B = document.body, glass = document.querySelector('.glass'), ov = document.querySelector('.ov'), ox = document.querySelector('.ov-x'), toast = document.querySelector('.toast');

  toast.innerHTML = '<i>' + I.check + '</i>Next, the kickoff meeting with Navid';
  var story = ov.querySelector('.story'), vMain = ov.querySelector('.view.main'), vSub = ov.querySelector('.view.sub'), subCol = vSub.firstChild;

  var world = document.getElementById('world'), card = app.querySelector('.c-body'), railEl = ov.querySelector('.rail'), R = null, busy = false;
  function layout() {

  }
  function place(el, r) { el.style.left = r.left + 'px'; el.style.top = r.top + 'px'; el.style.width = r.width + 'px'; el.style.height = r.height + 'px'; }

  function inset(r, rad) { return 'inset(' + [r.top, innerWidth - r.left - r.width, innerHeight - r.top - r.height, r.left].map(function (v) { return v.toFixed(1) + 'px'; }).join(' ') + ' round ' + rad.toFixed(1) + 'px)'; }
  function fit() {
    var S = Math.min(innerWidth / 1920, innerHeight / 1080), C = Math.max(innerWidth / 1920, innerHeight / 1080);

    world.style.transform = 'scale(' + C + ')'; world.style.left = Math.round((innerWidth - 1920 * C) / 2) + 'px'; world.style.top = Math.round((innerHeight - 1080 * C) / 2) + 'px';
    R = layout(); railEl.style.width = R.rail + 'px';

    var out = R.left + R.width + 16 + 44 <= innerWidth - 8;

  }

  /* ---- open and close: the glass grows from the card's box to the brief's, 420ms on a quick-out curve, and the
     content (already laid out at its size) is revealed by the same edge ---- */
  var DUR_IN = 420, DUR_OUT = 340, EASE = 'cubic-bezier(.32,.72,0,1)';
  function frames() {
    var c = card.getBoundingClientRect(), r0 = 42 * c.width / card.offsetWidth; R = layout();
    var ins = [Math.max(0, c.top - R.top), Math.max(0, R.left + R.width - c.right), Math.max(0, R.top + R.height - c.bottom), Math.max(0, c.left - R.left)];
    return {
      glass: [{ clipPath: inset({ left: c.left, top: c.top, width: c.width, height: c.height }, r0) }, { clipPath: inset(R, 42) }],

             { clipPath: 'inset(0px 0px 0px 0px round 42px)' }]

    }, 90);

    var b = ov.animate(k.clip.slice().reverse(), { duration: DUR_OUT, easing: EASE, fill: 'forwards' });
    b.onfinish = function () { card.style.visibility = ''; B.classList.remove('open'); a.cancel(); b.cancel(); busy = false; };
  }

    if (lk) { lk.classList.toggle('open'); return; }
