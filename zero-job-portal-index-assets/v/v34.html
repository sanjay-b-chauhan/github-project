/* ZERO Job Portal, the story build. Three sizes: 12, 14 and a 28 serif. One weight. */
:root{
  --canvas:#F3F3F5; --sheet:#FFFFFF; --well:#F6F6F8; --well2:#EDEDF0;
  --line:#E7E7EB; --line2:#D4D5DA;
  --ink:#131417; --ink2:#4E525C; --ink3:#6A6F7A; --ink4:#A6A9B2;
  --good:#12733F; --goodbg:#E7F6ED; --warn:#8A5306; --warnbg:#FCF1DC; --lime:#B7F06A;
  --f:'Google Sans Flex',-apple-system,system-ui,sans-serif; --serif:'STK Bureau Serif',Georgia,serif;
  --e:cubic-bezier(.2,0,0,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--canvas);color:var(--ink2);font:400 14px/20px var(--f);letter-spacing:-.011em;-webkit-font-smoothing:antialiased;font-synthesis:none;overflow:hidden}
button,input{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;outline:0}
button{cursor:pointer;text-align:left}
ul,ol{list-style:none}
h1,h2,h3{font-size:inherit;font-weight:400}
[hidden]{display:none!important}
svg{display:block;flex-shrink:0}
[data-lucide],svg.lucide{width:16px;height:16px;stroke-width:1.75}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
::selection{background:#D2F59B;color:#111}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
input{caret-color:var(--ink)}
input::placeholder{color:var(--ink3)}

/* type */
.h{font:400 28px/34px var(--serif);letter-spacing:-.025em;color:var(--ink);text-wrap:balance}
.i{color:var(--ink)}
.m{font-size:12px;line-height:16px;color:var(--ink3)}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:12px}
.hide{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* frame: a slim strip on the canvas (who you are, the date), the product in a sheet */
.app{display:flex;flex-direction:column;height:100dvh}
.strip{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px;flex-shrink:0;height:52px;padding:0 22px}
.strip-l{display:flex;align-items:center;gap:10px;min-width:0}
.strip-r{display:flex;justify-content:flex-end}
.modes{display:flex;padding:3px;border-radius:99px;background:var(--well2);box-shadow:inset 0 0 0 1px var(--line)}
.modes button{position:relative;display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 14px 0 5px;border-radius:99px;color:var(--ink2);white-space:nowrap;transition:background-color .12s var(--e),color .12s var(--e)}
.modes button .av{width:22px;height:22px}
.modes button.on{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line),0 8px 16px -12px rgba(19,20,23,.5)}
.dot{position:absolute;top:2px;right:4px;width:9px;height:9px;border-radius:99px;background:var(--lime);box-shadow:0 0 0 2px var(--canvas),inset 0 0 0 1px rgba(19,20,23,.3)}
.tabs .dot{top:4px;right:4px;box-shadow:0 0 0 2px #fff,inset 0 0 0 1px rgba(19,20,23,.3)}
.live{width:8px;height:8px;border-radius:99px;background:var(--ink4)}
.live.go{background:var(--good);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.stagewrap{flex:1;min-width:0;min-height:0;padding:0 14px 14px}
.sheet{position:relative;display:flex;flex-direction:column;height:100%;background:var(--sheet);border-radius:28px;box-shadow:0 0 0 1px rgba(19,20,23,.05),0 1px 2px rgba(19,20,23,.04),0 40px 70px -50px rgba(19,20,23,.35);overflow:hidden}
.top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:20px;flex-shrink:0;height:60px;padding:0 24px}
.top-l{display:flex;align-items:center;gap:12px;min-width:0}
.top-r{display:flex;align-items:center;justify-content:flex-end;min-width:0}
.whoami{display:flex;align-items:center;gap:10px;height:38px;padding:0 3px 0 12px;border-radius:99px;transition:background-color .12s var(--e),box-shadow .12s var(--e)}
.whoami:hover{background:var(--well)}
.whoami.on{background:var(--well2)}
.top .zlogo{width:52px;height:auto;display:block}
.top .zlogo path{fill:var(--ink)}
.tabs{display:flex;gap:2px;padding:3px;border-radius:99px;background:var(--well)}
.tabs button{position:relative;height:32px;padding:0 13px;border-radius:99px;color:var(--ink3);white-space:nowrap;transition:background-color .12s var(--e),color .12s var(--e)}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line),0 6px 12px -10px rgba(19,20,23,.5)}
.top .who{margin-left:auto}
.body{flex:1;min-height:0;overflow-y:auto;padding:8px 32px 112px}
.page{max-width:1040px;margin:0 auto}
.page.in{animation:in .28s var(--e) both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.flash{animation:flash 2s var(--e)}
@keyframes flash{0%,30%{outline:3px solid #B7F06A;outline-offset:3px}100%{outline:3px solid rgba(183,240,106,0);outline-offset:3px}}

/* buttons: the key is the site's key */
.k,.s{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:99px;white-space:nowrap;flex-shrink:0;transition:transform .12s var(--e),filter .12s var(--e),background-color .12s var(--e),box-shadow .12s var(--e)}
.k{color:#fff;background:linear-gradient(#313337,#17181B);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -2px 0 rgba(0,0,0,.45),0 0 0 1px #0F1012,0 12px 22px -14px rgba(19,20,23,.6)}
.k:hover{filter:brightness(1.14)}
.k:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 0 1px #0F1012}
.s{color:var(--ink);background:#fff;box-shadow:inset 0 0 0 1px var(--line2),inset 0 -2px 0 rgba(19,20,23,.04)}
.s:hover{background:var(--well)}
.s:active{transform:translateY(1px);box-shadow:inset 0 0 0 1px var(--line2)}
.x{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:99px;color:var(--ink2);white-space:nowrap;transition:background-color .12s var(--e),color .12s var(--e)}
.x:hover{background:var(--well);color:var(--ink)}
.k:disabled,.s:disabled{opacity:.4;pointer-events:none}
.k.sm,.s.sm{height:32px;padding:0 14px}
.acts{display:flex;align-items:center;flex-wrap:wrap;gap:8px}

/* atoms */
.lg{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:13px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);flex-shrink:0}
.lg img{width:24px;height:24px;object-fit:contain;border-radius:5px}
.lg.sm{width:32px;height:32px;border-radius:10px}
.lg.sm img{width:18px;height:18px}
.lg.xs{width:24px;height:24px;border-radius:8px}
.lg.xs img{width:14px;height:14px;border-radius:3px}
.av{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:99px;background:var(--well2);font-size:12px;line-height:16px;color:var(--ink);letter-spacing:0;flex-shrink:0}
.av.xs{width:24px;height:24px}
.av.lgx{width:44px;height:44px}
.av.tone-a{background:#E3EAFB}.av.tone-b{background:#FBE7E1}.av.tone-c{background:#E2F3E8}.av.tone-d{background:#F1E6FA}.av.tone-e{background:#FCEFD3}
.c{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:99px;background:var(--well2);font-size:12px;line-height:16px;color:var(--ink2);white-space:nowrap}
.c svg{width:13px;height:13px}
.c.g{background:var(--goodbg);color:var(--good)}
.c.w{background:var(--warnbg);color:var(--warn)}
.c.v{background:#EFEAFE;color:#4B2FC4}
.c.b{background:#E6F0FD;color:#1B55B0}
.card{background:#fff;border-radius:20px;box-shadow:inset 0 0 0 1px var(--line);padding:24px}
.lab{margin:0 0 12px;font-size:12px;line-height:16px;color:var(--ink3)}
/* Zero. A glass sphere with a fluid green interior and two white eyes. No mouth: every mood reads from the eyes and the body.
   data-m is the mood. --gx and --gy (-1 to 1) are where it looks: the face slides and tilts that way and the far eye gets smaller,
   so the whole character seems to turn. --d keeps looping motion in phase across redraws. */
.orb{--s:44px;--gx:0;--gy:0;--d:0ms;position:relative;display:inline-block;width:var(--s);height:var(--s);flex-shrink:0;isolation:isolate;vertical-align:middle}
.orb.sm{--s:26px}.orb.xs{--s:34px}.orb.orb-lg{--s:52px}.orb.orb-xl{--s:88px}.orb.orb-fab{--s:46px}
.orb-b{position:absolute;inset:0;border-radius:50%;overflow:hidden;transform:translateZ(0);
  background:radial-gradient(120% 120% at 26% 16%,#D2FA86 0,#7FE25C 26%,#27BE66 58%,#078A72 100%);
  box-shadow:0 0 0 1px rgba(8,100,70,.16),0 calc(var(--s)*.09) calc(var(--s)*.2) calc(var(--s)*-.09) rgba(10,130,84,.65);
  animation:orb-breathe 4.4s ease-in-out var(--d) infinite,orb-jelly 7s ease-in-out var(--d) infinite}
.orb-f{position:absolute;border-radius:50%;filter:blur(calc(var(--s)*.13))}
.orb-f.a{left:-24%;top:-28%;width:66%;height:66%;background:#E6FF8E;animation:orb-fa 9s ease-in-out var(--d) infinite}
.orb-f.b{right:-26%;bottom:-28%;width:86%;height:86%;background:#04857C;animation:orb-fb 11s ease-in-out var(--d) infinite}
.orb-f.c{left:10%;bottom:-36%;width:70%;height:70%;background:#17B868;animation:orb-fc 13s ease-in-out var(--d) infinite}
.orb-g{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(36% 22% at 30% 13%,rgba(255,255,255,.85) 0,rgba(255,255,255,0) 100%),radial-gradient(70% 34% at 50% 106%,rgba(200,255,232,.6) 0,rgba(200,255,232,0) 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.38),inset 0 calc(var(--s)*-.07) calc(var(--s)*.14) rgba(0,70,58,.45),inset 0 calc(var(--s)*.05) calc(var(--s)*.1) rgba(255,255,255,.42)}
.orb-e{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 .6px .8px rgba(0,66,44,.4))}
.orb-eg{transform-box:view-box;transform-origin:50% 44%;transform:translate(calc(var(--gx)*15px),calc(var(--gy)*10px)) rotate(calc(var(--gx)*9deg));transition:transform .45s cubic-bezier(.16,1,.3,1)}
.orb-e path{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center;transition:transform .45s cubic-bezier(.16,1,.3,1);animation:orb-blink 5.2s ease-in-out var(--d) infinite}
.orb-e .l{transform:scale(calc(1 - max(0,-1*var(--gx))*.26))}
.orb-e .r{transform:scale(calc(1 - max(0,var(--gx))*.26))}
.orb.sm .orb-e path,.orb.xs .orb-e path{stroke-width:13px}
.orb-s{position:absolute;left:18%;right:18%;bottom:-11%;height:15%;border-radius:50%;background:rgba(14,140,86,.5);filter:blur(calc(var(--s)*.07));z-index:-1;display:none}
.orb.orb-lg .orb-s,.orb.orb-xl .orb-s{display:block}
.orb-r{position:absolute;inset:-10%;border-radius:50%;opacity:0;z-index:-1;
  background:conic-gradient(from 0deg,rgba(183,240,106,0) 0 30%,#C9F77E 58%,#17C3A2 86%,rgba(23,195,162,0) 100%);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - max(2px,var(--s)*.055)),#000 calc(100% - max(1.5px,var(--s)*.045)));mask:radial-gradient(farthest-side,transparent calc(100% - max(2px,var(--s)*.055)),#000 calc(100% - max(1.5px,var(--s)*.045)))}

/* moods */
.orb[data-m=think] .orb-r,.orb[data-m=work] .orb-r{opacity:1;animation:orb-spin 1.5s linear var(--d) infinite}
.orb[data-m=think] .orb-f,.orb[data-m=work] .orb-f{animation-duration:2.6s}
.orb[data-m=think] .orb-b{animation:orb-ponder 3.2s ease-in-out var(--d) infinite}
.orb[data-m=think] .orb-eg{animation:orb-pondere 3.2s ease-in-out var(--d) infinite}
.orb[data-m=work] .orb-b{animation:orb-nod .75s ease-in-out var(--d) infinite}
.orb[data-m=work] .orb-eg{animation:orb-scan 1.5s ease-in-out var(--d) infinite}
.orb[data-m=work] .orb-e path,.orb[data-m=happy] .orb-e path,.orb[data-m=glad] .orb-e path,.orb[data-m=sleep] .orb-e path,.orb[data-m=poke] .orb-e path{animation:none}
.orb[data-m=talk] .orb-b{animation:orb-talk .62s ease-in-out var(--d) infinite}
.orb[data-m=happy] .orb-b,.orb[data-m=happy] .orb-e{animation:orb-hop 1.05s cubic-bezier(.3,0,.3,1) var(--d) infinite}
.orb[data-m=happy] .orb-s{animation:orb-hops 1.05s cubic-bezier(.3,0,.3,1) var(--d) infinite}
.orb[data-m=glad] .orb-b,.orb[data-m=glad] .orb-e{animation:orb-sway 3.2s ease-in-out var(--d) infinite}
.orb[data-m=alert] .orb-b,.orb[data-m=alert] .orb-e{animation:orb-nudge 2.2s ease-in-out var(--d) infinite}
.orb[data-m=alert]::before,.orb[data-m=alert]::after{content:'';position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 1.5px rgba(20,160,96,.6);animation:orb-ping 2.2s ease-out var(--d) infinite;z-index:-1}
.orb[data-m=alert]::after{animation-delay:calc(var(--d) + 1.1s)}
.orb[data-m=sad] .orb-b{filter:saturate(.55) brightness(.98);animation:orb-droop 4s ease-in-out var(--d) infinite}
.orb[data-m=sad] .orb-e{animation:orb-droop 4s ease-in-out var(--d) infinite}
.orb[data-m=sleep] .orb-b{filter:saturate(.7);animation:orb-doze 5.5s ease-in-out var(--d) infinite}
.orb[data-m=sleep] .orb-e{animation:orb-doze 5.5s ease-in-out var(--d) infinite}
.orb[data-m=sleep] .orb-f{animation-play-state:paused}
.orb[data-m=poke] .orb-b,.orb[data-m=poke] .orb-e{animation:orb-squish .6s cubic-bezier(.16,1,.3,1) both}
.orb.orb-still .orb-b,.orb.orb-still .orb-eg,.orb.orb-still .orb-e,.orb.orb-still .orb-e path{animation:none}
.orb.orb-still .orb-f{display:none}
.orb.orb-still .orb-b{background:radial-gradient(60% 60% at 18% 12%,#E6FF8E 0,rgba(230,255,142,0) 100%),radial-gradient(76% 76% at 88% 90%,#04857C 0,rgba(4,133,124,0) 100%),radial-gradient(120% 120% at 26% 16%,#D2FA86 0,#7FE25C 26%,#27BE66 58%,#078A72 100%)}
.orb.orb-pop{animation:orb-pop .5s cubic-bezier(.16,1,.3,1) both}

@keyframes orb-breathe{0%,100%{scale:1}50%{scale:1.035}}
@keyframes orb-jelly{0%,100%{border-radius:50%}33%{border-radius:53% 47% 50% 50%/48% 53% 47% 52%}66%{border-radius:47% 53% 52% 48%/53% 47% 52% 48%}}
@keyframes orb-fa{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(26%,16%) scale(1.18)}}
@keyframes orb-fb{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-30%,-20%) scale(.88)}}
@keyframes orb-fc{0%,100%{transform:translate(0,0)}50%{transform:translate(34%,-26%)}}
@keyframes orb-blink{0%,42%,46%,70%,74%,100%{scale:1 1}44%,72%{scale:1.1 .1}}
@keyframes orb-ponder{0%,100%{rotate:-7deg;translate:0 0}50%{rotate:6deg;translate:0 -3%}}
@keyframes orb-pondere{0%,100%{translate:6px -1px}50%{translate:-7px -2px}}
@keyframes orb-nod{0%,100%{translate:0 0;scale:1}50%{translate:0 3%;scale:1.02 .98}}
@keyframes orb-scan{0%{translate:-9px 0}78%{translate:9px 0}100%{translate:-9px 0}}
@keyframes orb-spin{to{rotate:360deg}}
@keyframes orb-talk{0%,100%{scale:1}50%{scale:1.05 .97}}
@keyframes orb-hop{0%,100%{translate:0 0;scale:1.08 .92;rotate:0deg}18%{scale:.96 1.05}45%{translate:0 -16%;scale:1;rotate:-6deg}60%{rotate:5deg}74%{scale:.96 1.05}}
@keyframes orb-hops{0%,100%{scale:1;opacity:1}45%{scale:.68;opacity:.5}}
@keyframes orb-sway{0%,100%{rotate:-5deg;translate:-2% 0}50%{rotate:5deg;translate:2% 0}}
@keyframes orb-nudge{0%{scale:1.16;translate:0 -8%}12%{scale:.97 1.03;translate:0 0}22%,58%,100%{scale:1;rotate:0deg;translate:0 0}66%{rotate:-8deg;translate:-3% 0}74%{rotate:8deg;translate:3% 0}82%{rotate:-4deg}90%{rotate:3deg}}
@keyframes orb-ping{0%{scale:1;opacity:.75}70%,100%{scale:1.75;opacity:0}}
@keyframes orb-droop{0%,100%{scale:1.04 .95;translate:0 4%;rotate:-3deg}50%{scale:1.05 .94;translate:0 5%;rotate:3deg}}
@keyframes orb-doze{0%,100%{scale:1.07 .9;translate:0 6%}50%{scale:1.04 .94;translate:0 4%}}
@keyframes orb-squish{0%{scale:1.22 .76;translate:0 10%}45%{scale:.95 1.07;translate:0 -4%}100%{scale:1;translate:0 0}}
@keyframes orb-pop{0%{scale:.8}55%{scale:1.07}100%{scale:1}}
/* a centred moment: ready, rules, search, matches, hired */
.mid{display:flex;flex-direction:column;align-items:center;padding:32px 0 0;text-align:center}
.mid .h{max-width:22ch;margin-top:24px}
.mid .sub{max-width:46ch;margin-top:10px}
.mid .acts{justify-content:center;margin-top:32px}

/* ready: the three case studies */
.fan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;width:100%;max-width:680px;margin-top:40px;text-align:left}
.cs{display:flex;flex-direction:column;gap:28px;padding:20px;border-radius:20px;background:var(--well);box-shadow:inset 0 0 0 1px var(--line)}

/* rules */
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;max-width:800px;margin-top:40px;text-align:left}
.rule{display:flex;flex-direction:column;gap:14px;min-height:118px;padding:18px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .12s var(--e),background-color .12s var(--e)}
button.rule:hover{box-shadow:inset 0 0 0 1px var(--line2);background:var(--well)}
.rule .ico{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:10px;background:var(--well2);color:var(--ink)}
.rule input{width:100%;height:24px;color:var(--ink);border-radius:4px;box-shadow:0 2px 0 var(--ink)}
.rule .edit{margin-left:auto;color:var(--ink3)}

/* search: six teams, one verdict each */
.teams{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;width:100%;max-width:880px;margin-top:40px}
.team{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 10px 16px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);transition:opacity .3s var(--e),background-color .3s var(--e)}
.team .res{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:54px;opacity:0;transform:translateY(4px);transition:opacity .3s var(--e),transform .3s var(--e)}
.team.done .res{opacity:1;transform:none}
.team.done.off{background:var(--well)}
.team.done.off .lg{opacity:.55}
.tally{margin-top:24px;min-height:24px}

/* matches */
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:100%;max-width:960px;margin-top:32px;text-align:left}
.pick{position:relative;display:flex;flex-direction:column;gap:14px;padding:22px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .12s var(--e),opacity .12s var(--e)}
.pick.on{box-shadow:inset 0 0 0 2px var(--ink)}
.pick:not(.on){opacity:.62}
.pick .tick{position:absolute;top:22px;right:20px;display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:99px;box-shadow:inset 0 0 0 1.5px var(--line2);color:transparent;transition:background-color .12s var(--e),color .12s var(--e)}
.pick .tick::before{content:'';position:absolute;inset:-8px}
.pick.on .tick{background:var(--ink);color:#fff;box-shadow:none}
.pick .tick svg{width:16px;height:16px;stroke-width:2.5}
.ev{display:flex;flex-direction:column;gap:8px}
.ev li{display:flex;align-items:flex-start;gap:10px}
.ev li svg{margin-top:3px;color:var(--ink3)}
.ev li.y svg{color:var(--good)}
.ev li.n{color:var(--ink3)}
.to{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:4px}

/* home: the line, the introductions, the log */
.hero{display:flex;align-items:center;gap:16px;padding:28px 0 36px}
.hero .sub{margin-top:6px;max-width:56ch}
.home{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:44px;align-items:start}
.lanes{display:flex;flex-direction:column;gap:12px}
.lane{padding:24px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.lane.need{box-shadow:inset 0 0 0 2px var(--ink)}
.lane.closed{background:var(--well)}
.lane .pay{text-align:right;flex-shrink:0}
.trk{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-top:24px}
.trk li{position:relative;display:flex;flex-direction:column;gap:10px;font-size:12px;line-height:16px;color:var(--ink3)}
.trk li::before{content:'';position:relative;z-index:1;width:14px;height:14px;border-radius:99px;background:#fff;box-shadow:inset 0 0 0 2px var(--line2)}
.trk li::after{content:'';position:absolute;top:6px;left:14px;right:0;height:2px;background:var(--line)}
.trk li:last-child::after{display:none}
.trk li.done{color:var(--ink)}
.trk li.done::before{background:var(--ink);box-shadow:none}
.trk li.done::after{background:var(--ink)}
.trk li.now{color:var(--ink)}
.trk li.now::before{background:var(--lime);box-shadow:inset 0 0 0 2px var(--ink),0 0 0 5px rgba(183,240,106,.4)}
.trk li.end{color:var(--ink3)}
.trk li.end::before{background:var(--ink4);box-shadow:none}
.stat{display:flex;align-items:center;gap:12px;margin-top:20px;padding:12px 16px 12px 12px;border-radius:14px;background:var(--well)}
.lane.closed .stat{background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.stat .m{text-align:right;flex-shrink:0}
.more{margin-top:16px}
.bars{display:flex;flex-direction:column;gap:12px}
.bars li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px}
.bars .bar{grid-column:1/-1;height:6px;border-radius:99px;background:var(--well2);overflow:hidden}
.bars .bar i{display:block;height:100%;border-radius:99px;background:var(--ink)}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slot{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1px var(--line2);transition:box-shadow .12s var(--e),background-color .12s var(--e)}
.slot:hover{background:var(--well)}
.slot.on{box-shadow:inset 0 0 0 2px var(--ink);background:#fff}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}
.kv{display:flex;flex-direction:column;gap:8px}
.kv li{display:flex;justify-content:space-between;gap:16px}
.kv li span:last-child{color:var(--ink3);flex-shrink:0;font-variant-numeric:tabular-nums}
.quote{padding:16px 20px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.quote blockquote{color:var(--ink)}
.quote figcaption{display:flex;align-items:center;gap:8px;margin-top:10px}
.fig{font:400 28px/34px var(--serif);letter-spacing:-.025em;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.log{display:flex;flex-direction:column;gap:16px}
.log li{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;align-items:center}
.badge{position:relative}
.badge b{position:absolute;right:-5px;bottom:-5px;display:flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:99px;background:var(--ink);color:#fff;box-shadow:0 0 0 2px #fff}
.badge b svg{width:10px;height:10px;stroke-width:2.5}
.side{position:sticky;top:0}

/* hired */
.path{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));width:100%;max-width:960px;margin-top:44px;text-align:left}
.path li{position:relative;display:flex;flex-direction:column;gap:10px;padding-right:12px}
.path li::after{content:'';position:absolute;top:17px;left:36px;right:0;height:2px;background:var(--ink)}
.path li:last-child::after{display:none}
.path .lg,.path .orb{position:relative;z-index:1}
.conf{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden}
.conf i{position:absolute;top:-12px;width:7px;height:12px;border-radius:2px;animation:fall 2.4s var(--e) forwards}
@keyframes fall{to{transform:translate3d(var(--dx),105vh,0) rotate(var(--r));opacity:.9}}

/* Priya's side */
.rc{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:16px;align-items:start}
.rc-list{display:flex;flex-direction:column;gap:2px;padding:8px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.rc-row{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:14px;transition:background-color .12s var(--e)}
.rc-row:hover{background:var(--well)}
.rc-row.on{background:var(--well2)}
.rc-row .grow>span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crit{display:flex;flex-direction:column;gap:16px}
.crit li{display:flex;align-items:flex-start;gap:12px}
.mk{position:relative;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:99px;flex-shrink:0;background:var(--well2);color:var(--ink3)}
.mk svg{width:14px;height:14px;stroke-width:2.25}
.mk.y{background:var(--goodbg);color:var(--good)}
.mk.p{background:var(--warnbg);color:var(--warn)}
.works{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.work{display:flex;flex-direction:column;gap:20px;padding:16px;border-radius:16px;background:var(--well);box-shadow:inset 0 0 0 1px var(--line)}
.sec{margin-top:40px}
.form{display:flex;flex-direction:column;gap:12px;margin-top:20px;padding:20px;border-radius:16px;background:var(--well)}
.field{display:flex;flex-direction:column;gap:6px}
.field input{height:40px;padding:0 14px;border-radius:12px;background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink3)}
.field input:focus{box-shadow:inset 0 0 0 2px var(--ink)}
.opt{height:30px;padding:0 12px;border-radius:99px;background:#fff;box-shadow:inset 0 0 0 1px var(--line2);font-size:12px;line-height:16px;color:var(--ink2);transition:box-shadow .12s var(--e)}
.opt.on{box-shadow:inset 0 0 0 2px var(--ink);color:var(--ink)}
.banner{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-top:20px;padding:14px 16px;border-radius:14px;background:var(--well)}
.seg{display:flex;padding:3px;border-radius:99px;background:var(--well2)}
.seg button{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:99px;font-size:12px;line-height:16px;color:var(--ink2);transition:background-color .12s var(--e),color .12s var(--e)}
.seg button svg{width:14px;height:14px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.tw{position:relative;padding:8px;overflow-x:auto;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.tb{width:100%;border-collapse:separate;border-spacing:0}
.tb th,.tb td{padding:12px;text-align:left;vertical-align:middle;white-space:nowrap;font-weight:400}
.tb thead th{font-size:12px;line-height:16px;color:var(--ink3)}
.tb tbody th{display:flex;align-items:center;gap:12px;min-width:230px}
.tb tbody tr{cursor:pointer}
.tb tbody tr:hover>*{background:var(--well)}
.tb tbody tr>*:first-child{border-radius:14px 0 0 14px}
.tb tbody tr>*:last-child{border-radius:0 14px 14px 0}

/* matches, portfolio, rules and role pages */
.title{padding:28px 0 28px}
.title .sub{margin-top:6px;max-width:56ch}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.item.soft{background:var(--well)}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pick .acts{margin-top:4px}
.sw{position:relative;width:38px;height:22px;border-radius:99px;background:var(--ink4);flex-shrink:0;transition:background-color .12s var(--e)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:99px;background:#fff;transition:transform .18s var(--e)}
.sw.on{background:var(--ink)}
.sw.on::after{transform:translateX(16px)}
.newm{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding:16px 20px;border-radius:20px;background:var(--well);box-shadow:inset 0 0 0 1px var(--line)}

/* v28: faces, tab counts, home sections, jobs and inbox as two panes, the real portfolio */
.av.face{overflow:hidden;padding:0}
.av.face img{width:100%;height:100%;object-fit:cover}
.modes .lg{width:22px;height:22px;border-radius:7px}
.modes .lg img{width:14px;height:14px}
.tabs .n{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;margin-left:6px;padding:0 5px;border-radius:99px;background:var(--ink);color:#fff;font-size:12px;line-height:16px;letter-spacing:0}
.rules.five{grid-template-columns:repeat(5,minmax(0,1fr));max-width:960px}
.teams.seven{grid-template-columns:repeat(7,minmax(0,1fr));max-width:920px}
.teams.seven .team{padding:16px 6px 12px;gap:8px}
.teams.seven .res{min-height:28px}
.narrow{max-width:720px}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:40px 0 12px}
.sechead .lab{margin:0}
.sechead>.x:first-child{margin-left:-10px;color:var(--ink)}
.x.sm{height:32px;padding:0 10px}
.rcard{display:flex;flex-direction:column;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .12s var(--e)}
.rcard:hover{box-shadow:inset 0 0 0 1px var(--line2),0 14px 24px -20px rgba(19,20,23,.5)}
.rcard .rhit{display:flex;flex-direction:column;gap:10px;flex:1;padding:20px 20px 14px;border-radius:20px 20px 0 0;text-align:left}
.rcard .rfoot{min-height:52px;padding:0 20px 20px}
.rcard.busy{box-shadow:inset 0 0 0 1px var(--line2)}
.rcard .row{width:100%}
.rcard .grow>span,.item .grow>span{display:block}
button.item{width:100%;transition:box-shadow .12s var(--e)}
button.item:hover{box-shadow:inset 0 0 0 1px var(--line2)}
.clip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{display:flex;gap:3px;flex-shrink:0}
.mini i{width:14px;height:4px;border-radius:99px;background:var(--well2)}
.mini i.done{background:var(--ink)}
.mini i.now{background:var(--lime);box-shadow:inset 0 0 0 1px rgba(19,20,23,.45)}
.mini i.end{background:var(--ink4)}
.c img{width:14px;height:14px;border-radius:3px}
.body.split{overflow:hidden;padding:4px 24px 24px}
.body.split .page{height:100%;max-width:1200px}
.jobs{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:16px;height:100%}
.jl{display:flex;flex-direction:column;min-height:0;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.jl-top{display:flex;flex-direction:column;gap:12px;padding:20px 20px 12px}
.search{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:12px;background:var(--well);color:var(--ink3)}
.search input{flex:1;min-width:0;color:var(--ink)}
.search:focus-within{box-shadow:inset 0 0 0 2px var(--ink)}
.jl-list{display:flex;flex-direction:column;gap:2px;flex:1;min-height:0;overflow-y:auto;padding:0 8px 8px}
.jr{display:flex;align-items:flex-start;gap:12px;width:100%;padding:12px;border-radius:14px;transition:background-color .12s var(--e)}
.jr:hover{background:var(--well)}
.jr.on{background:var(--well2)}
.jr .grow>span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jr-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.un{width:9px;height:9px;border-radius:99px;background:var(--ink)}
.jd-wrap{min-height:0;overflow-y:auto;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.jd{max-width:720px;padding:32px 36px}
.jd .form{margin-top:20px}
.jd-wrap.chat{display:flex;flex-direction:column;overflow:hidden}
.chat-h{display:flex;align-items:center;gap:12px;margin:8px;padding:12px;border-radius:14px;background:var(--well)}
.msgs{display:flex;flex-direction:column;gap:14px;flex:1;min-height:0;overflow-y:auto;padding:12px 20px 20px}
.msgs li{display:flex;gap:10px;max-width:min(520px,86%)}
.msgs li>div{display:flex;flex-direction:column;gap:4px}
.msgs li>div>p{padding:8px 12px;border-radius:14px;background:var(--well);color:var(--ink)}
.msgs li.me{align-self:flex-end}
.msgs li.me>div>p{background:var(--ink);color:#fff}
.msgs li.me .m{text-align:right}
.msgs li.sys{align-self:center;max-width:none}
.msgs li.sys span{padding:6px 12px;border-radius:99px;background:var(--well);font-size:12px;line-height:16px;color:var(--ink3);text-align:center}
.chat-f{padding:12px 20px 20px}
form.chat-f input{height:40px;padding:0 16px;border-radius:99px;background:var(--well);color:var(--ink)}
form.chat-f input:focus{box-shadow:inset 0 0 0 2px var(--ink)}
.body.flush{display:flex;flex-direction:column;padding:0;overflow:hidden}
.body.flush .page{display:flex;flex-direction:column;height:100%;max-width:none;margin:0}
.pfbar{display:flex;align-items:center;gap:16px;padding:4px 28px 16px}
.pfframe{flex:1;width:100%;border:0;background:#fff}

/* Zero is a small floater in the corner. Open, it is a compact card over the page, never a column. */
.smain{display:flex;flex-direction:column;flex:1;min-width:0;min-height:0}
.zlaunch{position:absolute;right:20px;bottom:20px;z-index:30;display:flex;align-items:center;gap:10px;pointer-events:none}
.zlaunch>*{pointer-events:auto}
.zfab{position:relative;display:flex;align-items:center;justify-content:center;width:58px;height:58px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px var(--line),0 18px 32px -16px rgba(19,20,23,.5);transition:transform .16s var(--e),box-shadow .16s var(--e)}
.zfab:hover{transform:translateY(-2px);box-shadow:0 0 0 1px var(--line2),0 22px 36px -16px rgba(19,20,23,.55)}
.zfab:active{transform:none}
.zfab .dot{top:2px;right:2px;width:11px;height:11px;box-shadow:0 0 0 2.5px #fff,inset 0 0 0 1px rgba(19,20,23,.3)}
.zsay{max-width:380px;padding:8px 14px;border-radius:16px 16px 4px 16px;background:var(--ink);color:#fff;font-size:12px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 14px 26px -14px rgba(19,20,23,.6);animation:zsay 4.2s var(--e) both}
@keyframes zsay{0%{opacity:0;transform:translateX(8px)}6%,88%{opacity:1;transform:none}100%{opacity:0;transform:translateX(4px)}}
.zcol{display:none;position:absolute;right:20px;bottom:20px;z-index:31;flex-direction:column;width:368px;height:min(540px,calc(100% - 92px));border-radius:24px;background:var(--well);box-shadow:0 0 0 1px var(--line2),0 30px 60px -22px rgba(19,20,23,.5);overflow:hidden}
.zcol.on{display:flex;animation:zin .22s var(--e) both;transform-origin:100% 100%}
@keyframes zin{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.zhead{display:flex;align-items:center;gap:10px;padding:14px 10px 10px 14px}
.zcol .msgs{padding:4px 12px 12px}
.zcol .msgs li{max-width:100%}
.zcol .msgs li>div>p{background:#fff}
.zcol .msgs li.me>div>p{background:var(--ink)}
.zcol .msgs li.sys span{background:var(--well2)}
/* pages keep their last controls clear of the floater */
.body.split .jd{padding-bottom:96px}
.jd-wrap.chat .chat-f{padding-right:92px}
.msgs li.act{align-items:center;gap:12px;max-width:100%;padding:2px 0;color:var(--ink2)}
.msgs li.act .badge .lg,.msgs li.act .badge .av{width:28px;height:28px;border-radius:9px}
.msgs li.act .badge .av{border-radius:99px}
.msgs li.act .badge .orb{--s:28px}
.msgs li.act .badge .lg img{width:16px;height:16px}
.msgs li.act .badge b{width:16px;height:16px;box-shadow:0 0 0 2px var(--well)}
.msgs li.act .badge b svg{width:9px;height:9px}
.zsug{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px}
.zform{display:flex;align-items:center;gap:8px;height:44px;margin:0 10px 10px;padding:0 5px 0 14px;border-radius:99px;background:#fff;box-shadow:inset 0 0 0 1px var(--line2)}
.zform:focus-within{box-shadow:inset 0 0 0 2px var(--ink)}
.zform input{flex:1;min-width:0;height:36px;color:var(--ink)}
.zgo{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:99px;color:#fff;background:linear-gradient(#313337,#17181B);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 0 0 1px #0F1012;flex-shrink:0;transition:filter .12s var(--e),transform .12s var(--e)}
.zgo:hover{filter:brightness(1.14)}
.zgo:active{transform:translateY(1px)}
.msgs li.them>div{min-width:0}
.zsteps{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:16px;background:var(--well)}
.zcol .zsteps{background:#fff}
.zsteps li{display:flex;align-items:center;gap:10px;max-width:none;color:var(--ink3)}
.zsteps li.done{color:var(--ink)}
.zsteps li.done svg{width:14px;height:14px;color:var(--good);stroke-width:2.5}
.zsteps li.now{color:var(--ink)}
.spin{width:14px;height:14px;border-radius:99px;box-shadow:inset 0 0 0 2px var(--line2);flex-shrink:0}
.now>.spin,.spin.go{box-shadow:none;border:2px solid var(--line2);border-top-color:var(--ink);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.zcard{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.zcard .item{flex-wrap:wrap;padding:12px}
.zcard .item .grow{flex-basis:160px}
.ring{--p:80;position:relative;display:inline-flex;align-items:center;justify-content:center;width:50px;height:50px;border-radius:99px;background:conic-gradient(var(--good) calc(var(--p)*1%),var(--well2) 0);flex-shrink:0}
.ring::before{content:'';position:absolute;inset:4px;border-radius:99px;background:#fff}
.ring b{position:relative;font-weight:400;color:var(--ink);letter-spacing:0}
.ring.v{background:conic-gradient(#5B3FD6 calc(var(--p)*1%),var(--well2) 0)}
.ring.b{background:conic-gradient(#2A6FD6 calc(var(--p)*1%),var(--well2) 0)}
.ring.q{background:conic-gradient(var(--ink4) calc(var(--p)*1%),var(--well2) 0)}
.ring.sm{width:32px;height:32px}
.ring.sm::before{inset:3px}
.ring.sm b{font-size:12px;line-height:16px}
.ai{padding:20px;border-radius:20px;background:linear-gradient(125deg,#EAF9D2 0%,#FBFDF6 38%,#FFFFFF 60%,#F1F0FB 100%);box-shadow:inset 0 0 0 1px var(--line)}
.ai .stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.ai .c{background:rgba(255,255,255,.8);box-shadow:inset 0 0 0 1px var(--line)}

.home.one{grid-template-columns:minmax(0,1fr)}
.body.col1 .page{max-width:800px}
.body.col1 .narrow{max-width:none}
.readbox{display:flex;flex-direction:column;align-items:center;gap:20px;width:100%;max-width:560px;margin-top:36px}
.readbox .zsteps{width:100%;max-width:420px;text-align:left}
.found{display:flex;flex-direction:column;align-items:center;gap:14px;min-height:150px}
.sees{display:flex;flex-direction:column;gap:20px;width:100%;max-width:520px;margin-top:36px;text-align:center}
.sees :where(.m){margin-bottom:10px}
.pf-fit .h{line-height:34px}
.pf-fit.v{background:linear-gradient(180deg,#F1ECFF 0,#fff 150px)}.pf-fit.v .h{color:#4B2FC4}
.pf-fit.g{background:linear-gradient(180deg,#E9F7EE 0,#fff 150px)}.pf-fit.g .h{color:var(--good)}
.pf-fit.b{background:linear-gradient(180deg,#E8F1FD 0,#fff 150px)}.pf-fit.b .h{color:#1B55B0}
/* the portfolio, native */
.pf{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:56px;align-items:start;padding-top:24px}
.pf-main{min-width:0;max-width:640px}
.pf-side{position:sticky;top:0}
.pf-head{display:flex;align-items:center;flex-wrap:wrap;gap:16px}
.pf-head .grow{flex-basis:220px}
.pf-about{margin-top:20px;color:var(--ink);max-width:58ch}
.pf-list{display:flex;flex-direction:column;gap:8px}
.pf-pr{display:flex;gap:16px;padding:16px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.pf-pr.off{background:var(--well)}
.pf-th{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;width:112px;height:84px;border-radius:14px;background:var(--well);box-shadow:inset 0 0 0 1px var(--line);flex-shrink:0}
.pf-sk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.pf-sk>div{display:flex;flex-direction:column;gap:6px}
.pf-rows{display:flex;flex-direction:column;gap:20px}
.pf-sug{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.pf-sug li{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:14px;background:var(--well)}
.pf-fit .h{font-size:28px}
.pf-val{display:inline-flex;align-items:center;gap:8px;color:var(--ink);text-align:right;border-radius:8px}
.pf-val svg{width:14px;height:14px;color:var(--ink3)}
.pf-val:hover{color:var(--ink2)}
.pf-in{width:170px;height:26px;padding:0 8px;border-radius:8px;color:var(--ink);text-align:right;box-shadow:inset 0 0 0 2px var(--ink)}
.field textarea{padding:12px 14px;border-radius:12px;background:#fff;color:var(--ink);font:inherit;letter-spacing:inherit;resize:vertical;border:0;outline:0;box-shadow:inset 0 0 0 1px var(--ink3)}
.field textarea:focus{box-shadow:inset 0 0 0 2px var(--ink)}

@media(max-width:1024px){
  body{overflow:auto}
  .app{height:auto;min-height:100dvh}
  .strip{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:'m m' 'l r';height:auto;padding:10px 12px 6px;gap:6px 8px}
  .modes{grid-area:m;justify-self:center}
  .strip-l{grid-area:l}
  .strip-r{grid-area:r}
  .stagewrap{padding:0 8px 8px}
  .sheet{height:auto;min-height:80dvh;border-radius:24px}
  .top{grid-template-columns:minmax(0,1fr) auto;height:auto;min-height:60px;padding:10px 16px;gap:8px 12px}
  .tabs{grid-column:1/-1;grid-row:2;justify-self:center;max-width:100%;overflow-x:auto}
  .zlaunch{position:fixed;right:14px;bottom:14px}
  .zcol{position:fixed;top:auto;right:8px;bottom:8px;left:8px;z-index:50;width:auto;height:min(560px,calc(100dvh - 16px))}
  .body{overflow:visible;padding:4px 16px 120px}
  .home,.rc,.pf{grid-template-columns:minmax(0,1fr);gap:32px}
  .pf-side{position:static}
  .pf-sk{grid-template-columns:minmax(0,1fr)}
  .side{position:static}
  .picks,.rules,.rules.five,.cols{grid-template-columns:minmax(0,1fr)}
  .teams.seven{grid-template-columns:repeat(4,minmax(0,1fr))}
  .body.split{overflow:visible;padding:4px 12px 96px}
  .body.split .page{height:auto}
  .jobs{grid-template-columns:minmax(0,1fr);height:auto}
  .jl-list{max-height:320px}
  .jd-wrap.chat{min-height:60dvh}
  .body.flush{min-height:80dvh}
  .pfframe{min-height:70dvh}
  .teams{grid-template-columns:repeat(3,minmax(0,1fr))}
  .path{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:24px}
}
@media(max-width:640px){
  .fan,.works,.slots,.two{grid-template-columns:minmax(0,1fr)}
  .teams{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lane,.card,.pick{padding:16px}
  .trk li{font-size:12px}
  .trk li span{display:none}
  .trk li.now span{display:block;white-space:nowrap}
  .hero,.title.row{flex-wrap:wrap}
  .hero>.grow,.title.row>.grow{flex-basis:100%}
  .lane>.row{flex-wrap:wrap}
  .lane .pay{flex-basis:100%;padding-left:60px;text-align:left}
  .stat{flex-wrap:wrap}
  .stat .m{flex-basis:100%;text-align:left;padding-left:48px}
  .path{grid-template-columns:repeat(2,minmax(0,1fr))}
  .path li::after{display:none}
  .k,.s,.x{height:44px}
}
@media(prefers-reduced-motion:reduce){
  .page.in,.conf i,.zcol.on,.spin,.zsay,.orb,.orb *,.orb::before,.orb::after{animation:none!important}
  .team .res,.k,.s,.x,.pick,.slot,.sw::after{transition:none}
  .flash,.live.go{animation:none}
}

/* ZERO Job Portal, the recruiter side. Same three sizes, same surfaces as app.css. New names start with r- or pl-. */

/* the frame: the person stays on the right while the tabs are hidden in onboarding (belongs in app.css, see the note to its owner) */
@media(min-width:1025px){.top>.top-r{grid-column:3}}
/* every recruiter page measures itself, not the window: Zero's column can take 400px from the side at any time */
.body.r-pg>.page{container:rpage/inline-size}

/* Zero at work: ticking steps, one line with a count, and skeletons shaped like what is coming */
.r-work{width:100%;max-width:420px;margin:20px auto 0;text-align:left}
.r-form .r-work,.r-new .r-work{margin:4px 0 0}
.r-work.r-wline{display:flex;align-items:center;gap:10px;max-width:none;min-height:24px;margin:0;color:var(--ink)}
.r-wline .m{flex-shrink:0;font-variant-numeric:tabular-nums}
.r-sk{display:block;height:10px;border-radius:99px;background:var(--well2);animation:r-pulse 1.2s ease-in-out infinite}
.r-sk+.r-sk{margin-top:10px}
.r-w40{width:40%}
.r-w70{width:70%}
.r-w90{width:90%}
.r-ska{width:36px;height:36px;flex-shrink:0}
.r-skc{width:76px;height:28px;flex-shrink:0}
.r-skm{width:24px;height:24px;flex-shrink:0}
.r-ska+.r-sk,.r-skm+.r-sk,.grow+.r-skc{margin-top:0}
.r-skrow{display:flex;align-items:center;gap:12px;padding:14px 16px}
.r-skcrit{margin-top:20px}
.r-skcrit .grow{padding-top:6px}
@keyframes r-pulse{50%{opacity:.45}}
@keyframes r-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* onboarding: Zero asks one thing per screen */
.r-ob{padding-top:8px}
.r-ob .r-dots{margin-top:18px}
.r-ob .h{margin-top:16px}
.r-hold{min-height:44px}
.r-quiet{margin-top:6px}
.r-gap{margin-top:14px}
.r-lab2{margin-top:28px}
.r-pad{padding:16px}
.r-top{align-items:flex-start}
.r-ask{display:block;width:100%;max-width:420px;margin-top:28px}
.r-ask .r-in{width:100%;height:56px;border-radius:16px;text-align:center}
.r-in:disabled,.r-ta:disabled,.field input:disabled{color:var(--ink3)}
.r-cocard{width:100%;max-width:520px;margin-top:28px;text-align:left}
.r-form{display:flex;flex-direction:column;gap:12px;width:100%;max-width:760px;margin-top:24px;text-align:left}
.r-form>.card{padding:16px 20px}
.r-form .r-crits{gap:10px}
.r-seg{align-self:center}
.r-pick{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.r-pick .m{margin-right:4px}
.r-pick .opt:disabled{opacity:.5;pointer-events:none}
.r-big{display:flex;flex-direction:column;gap:6px}
.r-ta{display:block;width:100%;min-height:96px;padding:14px 16px;border:0;outline:0;resize:none;border-radius:16px;background:var(--sheet);box-shadow:inset 0 0 0 1px var(--ink3);font:inherit;letter-spacing:inherit;color:var(--ink);caret-color:var(--ink)}
.r-ta:focus{box-shadow:inset 0 0 0 2px var(--ink)}
.r-ta::placeholder{color:var(--ink3)}
.r-fields{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.1fr) minmax(0,1.4fr);gap:12px}
.ai .r-fields{margin-top:16px}
.ai>.r-fields:first-child{margin-top:0}
.r-fields .field{min-width:0}
.r-fields input{width:100%;min-width:0}
.r-whys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:100%;max-width:960px;margin-top:24px;text-align:left}
.r-whys+.r-form{margin-top:20px}
.r-why{gap:10px;width:100%;min-height:0;padding:16px}
button.r-why.on,button.r-why.on:hover{background:var(--sheet);box-shadow:inset 0 0 0 2px var(--ink)}
.r-crits{display:flex;flex-direction:column;gap:14px}
.r-crits li{display:flex;align-items:center;gap:12px}
.r-in{height:44px;min-width:0;padding:0 14px;border-radius:12px;background:var(--sheet);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.r-in:focus{box-shadow:inset 0 0 0 2px var(--ink)}
.r-mn{width:84px;flex-shrink:0;text-align:right}
.r-err{color:var(--warn)}
.r-new{display:flex;flex-direction:column;gap:12px}
.r-new .r-seg{align-self:flex-start}
.r-new .r-lab2{margin-bottom:0}

/* reading the students: the one being read on top, everyone settling into a label below */
.r-reading{width:100%;max-width:760px;margin-top:24px;text-align:left}
.r-now{padding:16px 20px}
.r-prog{margin-top:14px}
.r-prog .m{flex-shrink:0;min-width:56px;text-align:right;font-variant-numeric:tabular-nums}
.r-bar{height:6px;border-radius:99px;background:var(--well2);overflow:hidden}
.r-bar i{display:block;width:100%;height:100%;border-radius:99px;background:var(--ink);transform-origin:left center;transform:scaleX(var(--p,0));transition:transform .35s var(--e)}
.r-reading>.r-result{justify-content:center;margin-top:4px}
.r-read{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.r-rd{display:flex;align-items:center;gap:12px;min-height:68px;padding:12px 14px;border-radius:16px;background:var(--sheet);box-shadow:inset 0 0 0 1px var(--line)}
.r-rd .grow>span{display:block}
.r-rd.r-pop{animation:r-drop .32s var(--e) both}
@keyframes r-drop{from{opacity:0;margin-top:-76px}to{opacity:1;margin-top:0}}

/* home: who needs you, one row each, with the action on the row */
.r-main>.sechead:first-child{margin-top:0}
.r-need{flex-wrap:wrap}
.r-need>.grow{flex-basis:160px}
.r-need.r-due{box-shadow:inset 0 0 0 2px var(--ink)}
.r-need>.acts{flex-shrink:0;gap:4px}
.r-need>.pl-why{flex-basis:100%;padding-left:48px}
.r-need>.pl-hold{flex-basis:100%;padding:14px;border-radius:14px;background:var(--well)}

/* roles: one card per role, with how many students sit at each stage */
.r-role{display:flex;flex-direction:column;gap:14px;width:100%;padding:18px 20px;border-radius:20px;background:var(--sheet);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .12s var(--e)}
.r-role:hover{box-shadow:inset 0 0 0 1px var(--line2)}
.r-role .row{width:100%;align-items:flex-start}
.r-role .grow>span{display:block}
.r-stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:10px 12px;border-radius:14px;background:var(--well)}
.r-stages>span{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap}
.r-stages.r-draft{display:block;padding:12px 16px}
.r-num{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 7px;border-radius:99px;color:var(--ink);font-variant-numeric:tabular-nums;flex-shrink:0}
.r-num.r-hot{background:var(--lime)}
.r-num.r-nil{color:var(--ink4)}

/* one role: its name, status, place and pay stay on top, with the way back and the switch between its three views */
.r-rh{flex-shrink:0;padding-bottom:16px}
.r-back{display:flex;align-items:center;gap:12px;min-height:40px;padding-top:4px}
.r-back .x{margin-left:-12px}
.r-work.r-rhw{width:auto;margin-left:auto}
.r-rh2{display:flex;align-items:flex-end;flex-wrap:wrap;gap:12px 20px}
.r-rh2>.grow{flex-basis:320px}
.r-rt{flex-wrap:wrap;gap:6px 12px}
.r-rh .sub{margin-top:4px}
.r-tabs{flex-shrink:0;max-width:100%;overflow-x:auto}
/* on a page that scrolls, the role stays in view above its job description and its ranked students */
@media(min-width:1025px){.page>.r-rh{position:sticky;top:0;z-index:3;background:var(--sheet);box-shadow:0 -4px 0 var(--sheet)}}

/* the job description: one sheet, every line a button until you click it */
.r-doc{max-width:780px}
.r-docnote,.r-private{display:flex;align-items:center;gap:8px}
.r-docnote{margin-bottom:12px}
.r-private{margin-top:12px}
.r-docnote svg,.r-private svg{width:14px;height:14px}
.r-sheet{display:flex;flex-direction:column;gap:24px;padding:28px}
.r-facts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 28px}
.r-sech{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px;margin-bottom:2px}
.r-sech .lab{margin:0}
.r-line{display:flex;align-items:center;gap:8px;width:calc(100% + 20px);min-height:36px;margin:0 -10px;padding:6px 10px;border-radius:10px;color:var(--ink);transition:background-color .12s var(--e)}
.r-line:hover,.r-line:focus-visible{background:var(--well)}
.r-line svg{width:14px;height:14px;color:var(--ink3);opacity:0}
.r-line:hover svg,.r-line:focus-visible svg{opacity:1}
.r-lines{display:flex;flex-direction:column;gap:2px}
.r-lines li{display:flex;align-items:center;gap:8px;min-width:0}
.r-lines li>.r-line,.r-lines li>.r-edit{flex:1;width:auto;min-width:0;margin:0}
.r-lines li>.r-line:first-child,.r-lines li>.r-edit:first-child{margin-left:-10px}
.r-n{width:16px;flex-shrink:0;text-align:right;font-variant-numeric:tabular-nums}
.r-ord{display:flex;flex-shrink:0;margin-left:-8px}
.r-ord .x{justify-content:center;width:28px;height:32px;padding:0}
.r-ord .x:disabled{opacity:.3;pointer-events:none}
.r-edit{display:flex;flex-direction:column;gap:4px;min-width:0}
.r-edit .r-in{width:100%}
.r-edit .r-ta{min-height:0}
.r-rwbar,.r-work.r-rww{margin-top:8px;padding:8px 8px 8px 14px;border-radius:14px;background:var(--well)}
.r-work.r-rww{min-height:52px;padding-right:14px}

/* students ranked: one row per student against the five criteria, the proof behind each mark one click away */
.r-ranked{display:flex;flex-direction:column;gap:8px}
.r-row{display:grid;grid-template-columns:minmax(200px,1fr) repeat(5,76px) 140px 152px;align-items:center;column-gap:8px;padding-right:16px}
.r-rowh{min-height:24px;padding-left:16px}
.r-rowh>.m{min-width:0;text-align:center}
.r-rowh>.m:first-child{text-align:left}
.r-rowh .i{color:var(--ink)}
.r-stu{border-radius:16px;background:var(--sheet);box-shadow:inset 0 0 0 1px var(--line)}
.r-stu.on{box-shadow:inset 0 0 0 1px var(--line2)}
.r-stu-h{display:flex;align-items:center;gap:12px;min-width:0;padding:14px 8px 14px 16px;border-radius:16px;transition:background-color .12s var(--e)}
.r-stu:not(.on) .r-stu-h:hover{background:var(--well)}
.r-stu-h .grow>span{display:block}
.r-cell{display:flex;justify-content:center}
.r-fitc{display:flex;min-width:0}
.r-do{display:flex;justify-content:flex-end;min-width:0}
.r-stu-b{display:flex;flex-direction:column;gap:16px;padding:4px 16px 16px 64px}
.r-stu-b>.pl-hold{max-width:520px;padding:14px;border-radius:14px;background:var(--well)}
.r-foot{justify-content:space-between;margin-top:16px}
.r-key{flex-wrap:wrap;gap:8px 10px}

/* one student opened inside a role, and find talent: the portfolio, and how this student fits, each in its own pane */
.body.r-wide .page{max-width:1440px}
.body.flush.r-pg>.page{width:100%;max-width:1520px;margin:0 auto}
.r-rolewrap{display:flex;flex-direction:column;height:100%}
.r-rolewrap>.r-rh{padding:4px 8px 16px}
.r-one{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,1fr);gap:12px}
.jobs.r-find{grid-template-columns:minmax(280px,1fr) minmax(0,2fr) minmax(288px,1fr)}
.r-filters{display:flex;gap:8px}
.r-sel{position:relative;display:flex;align-items:center;flex:1;min-width:0}
.r-sel select{-webkit-appearance:none;appearance:none;width:100%;height:36px;padding:0 32px 0 14px;border:0;outline:0;border-radius:99px;background:var(--sheet);box-shadow:inset 0 0 0 1px var(--line2);font:inherit;font-size:12px;line-height:16px;letter-spacing:inherit;color:var(--ink2);text-overflow:ellipsis;cursor:pointer}
.r-sel select:focus-visible{box-shadow:inset 0 0 0 2px var(--ink)}
.r-sel svg{position:absolute;right:12px;width:14px;height:14px;color:var(--ink3);pointer-events:none}
.r-filters .opt{flex-shrink:0;white-space:nowrap}
.r-none{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:16px 12px}
.r-prof{max-width:820px;padding:28px}
.r-prof .pf-head>.grow{flex-basis:220px}
.r-side{display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto;border-radius:20px}
.r-side>.card{flex-shrink:0}
.r-fith{flex-wrap:wrap;gap:6px 10px;min-height:28px}
.r-fitc2{margin-top:20px;gap:12px}
.r-fit>.r-work{margin:2px 0 0}
.r-fit>.acts{margin-top:16px}
.jr .grow>.r-jrf{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;margin-top:6px}
.r-state{display:flex;flex-direction:column;align-items:flex-start;gap:10px;flex:1 1 100%;padding:14px 16px;border-radius:14px;background:var(--well)}
.r-note,.r-fit>.acts>.pl-why{flex-basis:100%}
.r-side .r-fit>.acts>.k{flex:1 1 auto}
.r-fit>.acts>.pl-hold{flex:1 1 100%;min-width:0;padding:14px;border-radius:14px;background:var(--well)}

/* the pipeline: one column per stage. Cards move when you drag them, when you use their buttons, and on their own. Passed stays in reach on the right. */
.pl-top{flex-shrink:0;width:100%;padding:4px 28px 0}
.pl-board{flex:1;min-height:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);grid-template-rows:minmax(0,1fr);gap:8px;margin:0 28px 20px;overflow-x:auto;overscroll-behavior-x:contain}
.pl-col{display:flex;flex-direction:column;min-height:0;border-radius:20px;background:var(--well);transition:opacity .12s var(--e),background-color .12s var(--e),box-shadow .12s var(--e)}
.pl-h{display:flex;align-items:center;gap:8px;min-height:46px;padding:14px 12px 8px 14px}
.pl-hint{display:none;color:var(--ink)}
.pl-list{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0;overflow-y:auto;padding:6px}
.pl-col.pl-quiet{position:sticky;right:0;z-index:2;background:var(--sheet);box-shadow:inset 0 0 0 1px var(--line)}
/* when the board scrolls, Passed covers what slides under it: a white edge around its corners, a fade on its left */
.pl-more .pl-quiet{box-shadow:inset 0 0 0 1px var(--line),0 0 0 10px var(--sheet)}
.pl-more .pl-quiet::before{content:'';position:absolute;top:0;bottom:0;right:100%;width:36px;background:linear-gradient(90deg,transparent,var(--sheet) 70%);pointer-events:none}
.pl-card{display:flex;flex-direction:column;gap:10px;flex-shrink:0;padding:12px;border-radius:14px;background:var(--sheet);box-shadow:inset 0 0 0 1px var(--line);cursor:grab;transition:box-shadow .12s var(--e),opacity .12s var(--e)}
.pl-card:hover{box-shadow:inset 0 0 0 1px var(--line2)}
.pl-card.pl-need,.pl-card.pl-held,.pl-card.pl-need:hover,.pl-card.pl-held:hover{box-shadow:inset 0 0 0 2px var(--ink)}
.pl-card.pl-lift{opacity:.35}
.pl-who{display:flex;align-items:center;gap:10px;min-width:0}
.pl-name{display:block;max-width:100%;border-radius:6px;cursor:pointer}
.pl-acts .pl-ic{justify-content:center;width:36px;height:36px;padding:0;flex-shrink:0}
.pl-meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px}
.pl-acts{display:flex;align-items:center;gap:4px;cursor:auto}
.pl-acts .k,.pl-acts .s{flex:1;min-width:0;padding:0 12px}
.pl-acts .x{padding:0 10px}
.pl-why{color:var(--warn)}
.pl-back{animation:pl-back .36s var(--e)}
@keyframes pl-back{25%{transform:translateX(-6px)}60%{transform:translateX(4px)}}
.pl-hold{display:flex;flex-direction:column;gap:8px;min-width:0;cursor:auto}
.pl-hold .chips,.pl-hold .acts{gap:4px}
.pl-hold .field input{width:100%;min-width:0}
.pl-line{min-height:0;padding:10px 12px;border-radius:12px;field-sizing:content}
.pl-card .pl-line{font-size:12px;line-height:16px}
.pl-card .pl-hold .chips{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.pl-card .pl-hold .opt{height:32px;padding:0 6px;text-align:center}
.pl-card .pl-hold .k{width:100%;min-width:0;padding:0 12px}
.pl-hh{gap:8px;min-height:28px}
.pl-hh .x{height:28px;margin-right:-8px;padding:0 8px}
.pl-quiet .pl-card:not(.pl-held){background:var(--well);box-shadow:none}
.pl-quiet .pl-card:not(.pl-held) .i{color:var(--ink2)}
.pl-skc{flex-shrink:0;padding:14px 12px;border-radius:14px;background:var(--sheet);box-shadow:inset 0 0 0 1px var(--line)}
.pl-skc .r-skc{display:none}
/* a card in the air: columns that take it light up and say what the drop does, the rest go quiet */
.pl-drag .pl-col:not(.pl-ok){opacity:.5}
.pl-drag .pl-ok{box-shadow:inset 0 0 0 2px var(--lime)}
.pl-drag .pl-ok.pl-over{background:var(--well2);box-shadow:inset 0 0 0 2px var(--ink)}
.pl-drag.pl-more .pl-quiet.pl-ok{box-shadow:inset 0 0 0 2px var(--lime),0 0 0 10px var(--sheet)}
.pl-drag.pl-more .pl-quiet.pl-ok.pl-over{box-shadow:inset 0 0 0 2px var(--ink),0 0 0 10px var(--sheet)}
.pl-drag .pl-ok .pl-t{display:none}
.pl-drag .pl-ok .pl-hint{display:block}

/* inbox: Zero writing a reply */
.r-replying{padding:0 20px}

/* account */
.r-acct{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.r-col{display:flex;flex-direction:column;gap:12px}
.r-team,.r-perm{display:flex;flex-direction:column;gap:16px}
.r-team{margin-top:4px}
.r-selw{flex:0 0 176px}
.r-invite{margin-top:16px}
.r-sub{margin:24px 0 12px}
.r-fee{margin-top:20px}

/* Zero's answers: small rows that go somewhere */
.r-zc{gap:6px}
.r-zrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:2px 12px;width:100%;padding:10px 12px;border-radius:14px;background:var(--sheet);box-shadow:inset 0 0 0 1px var(--line);text-align:left;transition:box-shadow .12s var(--e)}
button.r-zrow:hover{box-shadow:inset 0 0 0 1px var(--line2)}
.r-zrow>.av,.r-zrow>.lg{grid-row:1/3;align-self:start}
.r-zrow>svg{width:16px;height:16px;color:var(--ink3)}
.r-zl{grid-column:2/-1}
.r-zev{display:flex;align-items:flex-start;gap:10px;padding:4px 2px}
.r-zev>.grow>span{display:block}
.r-zacts{display:flex;flex-wrap:wrap;gap:6px;padding-top:2px}

/* when the page itself is narrow, whatever the window is */
@container rpage (max-width:900px){
  .r-home,.r-acct{grid-template-columns:minmax(0,1fr)}
  .r-home{gap:28px}
  .r-home>.side{position:static}
  .r-row{grid-template-columns:minmax(0,1fr) auto auto}
  .r-cell,.r-rowh>.m:not(:first-child),.r-rowh>span:not(.m){display:none}
  .jobs.r-find{grid-template-columns:minmax(240px,2fr) minmax(0,3fr);grid-template-rows:minmax(0,2fr) minmax(0,3fr)}
  .r-find>.jl{grid-row:1/3}
  .r-find>.r-side{grid-column:2;grid-row:1}
  .r-find>.r-pane{grid-column:2;grid-row:2}
  .r-one{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,2fr) minmax(0,3fr)}
  .r-one>.r-side{grid-row:1}
  .r-one>.r-pane{grid-row:2}
  .r-stages{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@container rpage (max-width:560px){
  .r-row{grid-template-columns:minmax(0,1fr) auto;row-gap:0}
  .r-do{grid-column:1/-1;justify-content:flex-start;padding:0 0 14px 16px}
  .r-stu-b{padding-left:16px}
  .r-facts{grid-template-columns:minmax(0,1fr)}
  .r-sheet{padding:16px}
  .r-lines .r-mn{display:none}
  .r-foot .r-key{display:none}
}
@media(max-width:1024px){
  .r-acct{grid-template-columns:minmax(0,1fr)}
  .jobs.r-find,.r-one{grid-template-columns:minmax(0,1fr);grid-template-rows:none}

  .r-prof{padding:20px 16px}
  .r-whys{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pl-top{padding:0 16px}
  .pl-board{flex:none;grid-auto-columns:240px;grid-template-rows:none;margin:0 0 24px;padding:0 16px;scroll-snap-type:x proximity;scroll-padding-left:16px}

}
@media(max-width:640px){
  .r-fields,.r-whys{grid-template-columns:minmax(0,1fr)}
  .r-rd .clip{white-space:normal}
  .r-rd.r-pop{animation-name:r-in}
  .r-mn{display:none}
  .r-filters{flex-wrap:wrap}
  .r-team .row{flex-wrap:wrap}
  .r-selw{flex:1 1 100%}
  .chat-f .s{padding:0 12px}
  .r-need>.acts{flex-basis:100%;padding-left:48px}
}
@media(hover:none){.r-line svg{opacity:1}}
@media(prefers-reduced-motion:reduce){
  .r-role,.r-stu-h,.pl-card,.pl-col,.r-zrow,.r-bar i,.r-line{transition:none}
  .r-sk,.r-rd.r-pop,.pl-back{animation:none}
}

/* ZERO Job Portal, v32: home numbers, what Zero noticed, the feed, the conversation card, the mail list. Same three sizes, same surfaces. */

/* recruiter home: four numbers in one quiet row */
.tls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:28px}
.tl{display:flex;flex-direction:column;gap:2px;min-width:0;padding:16px 18px;border-radius:20px;background:var(--well);text-align:left;transition:background-color .12s var(--e)}
.tl:hover{background:var(--well2)}
.tl-n{font:400 28px/34px var(--serif);letter-spacing:-.025em;color:var(--ink)}
.tl.nil .tl-n{color:var(--ink4)}
.tl .m{min-height:16px}
.rh{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
.rh.one{grid-template-columns:minmax(0,1fr)}
.rh-more{margin:8px 0 0}
.rh-z{padding:18px;border-radius:20px;background:linear-gradient(150deg,#EEF9DC 0%,#FBFDF6 46%,#FFFFFF 100%);box-shadow:inset 0 0 0 1px var(--line)}
.rh-zh{gap:10px;margin-bottom:14px}
.rh-z ul{display:flex;flex-direction:column;gap:16px}
.rh-z li{display:flex;flex-direction:column;align-items:flex-start;gap:10px;color:var(--ink)}
.ps .ps-hit,.rr .rr-hit{display:flex;flex-direction:column;text-align:left;border-radius:8px}
.ps .ps-hit>span,.rr .rr-hit>span{display:block}
.rr.busy{background:var(--well)}
.rr-w{gap:8px}

/* explore: the feed */
.ex-top{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:16px 0 20px}
.ex-role{width:230px}
.ex-feed{display:flex;flex-direction:column;gap:14px}
.fd{display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.fd>header .grow>*{display:block}
.fd-work{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border-radius:16px;background:var(--well);text-align:left;transition:background-color .12s var(--e)}
.fd-work:hover{background:var(--well2)}
.fd-work .grow>span{display:block}
.fd-sum{margin-top:6px;color:var(--ink2);display:-webkit-box!important;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fd>footer{gap:8px;flex-wrap:wrap}
.fd-like,.fd-fo{gap:6px;color:var(--ink2)}
.fd-like svg,.fd-fo svg{width:15px;height:15px}
.fd-like.on{color:#C2264B}
.fd-like.on svg{fill:#C2264B;stroke:#C2264B}
.fd-fo.on{color:var(--good)}
.fd-inv{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.fd>.pl-why{margin:0}
.r-find .jl-top>.seg{align-self:flex-start}

/* the conversation on a student's page */
.cv{display:flex;flex-direction:column;gap:12px;margin-top:12px;padding:18px}
.r-fitlist{margin-top:12px}
.r-fitlist .r-fitc2{margin-top:0}
.cv-list{display:flex;flex-direction:column;gap:10px}
.cv-list li,.cv-draft{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:14px;background:var(--well)}
.cv-list li.me{background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.cv-t{color:var(--ink)}
.cv-subj{display:flex;align-items:center;gap:6px;min-width:0;color:var(--ink2)}
.cv-subj svg{width:13px;height:13px;flex-shrink:0}
.cv-draft{background:var(--warnbg)}
.cv-draft .acts{margin-top:6px}
.cv-f{gap:8px}
.cv-f input{height:32px;min-width:0;padding:0 12px;border-radius:99px;background:var(--well);color:var(--ink)}
.cv-f input:focus{box-shadow:inset 0 0 0 2px var(--ink)}
.msgs .cv-subj{margin:0 2px 2px}

/* account: the emails Zero sends */
.ml-list{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.ml-row.off>.row .i,.ml-row.off>.row .m{color:var(--ink4)}
.ml-mode{flex:0 0 150px}
.ml-mode select{height:32px}
.ml-ed{display:flex;flex-direction:column;gap:10px;margin-top:12px;padding:14px;border-radius:14px;background:var(--well)}

@media(max-width:1024px){
  .rh{grid-template-columns:minmax(0,1fr)}
  .tls{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ex-role{width:100%}
}
@media(max-width:640px){
  .rr,.ps{flex-wrap:wrap}
  .ml-row>.row{flex-wrap:wrap}
  .ml-row>.row>.grow{flex-basis:100%}
  .ml-mode{flex:1 1 150px}
}

/* ZERO Job Portal, v33: the box both sides start from, the students table, the three choices. Same three sizes, same surfaces. */

/* the box */
.fl-start{padding-top:56px}
.pb{display:flex;flex-direction:column;gap:10px;width:100%;max-width:620px;margin-top:28px;padding:16px 16px 12px;border-radius:24px;background:#fff;box-shadow:inset 0 0 0 1px var(--line2),0 24px 40px -32px rgba(19,20,23,.45);text-align:left}
.pb:focus-within{box-shadow:inset 0 0 0 2px var(--ink),0 24px 40px -32px rgba(19,20,23,.45)}
.pb textarea{width:100%;min-height:64px;border:0;outline:0;resize:none;background:none;font:inherit;letter-spacing:inherit;color:var(--ink)}
.pb textarea::placeholder{color:var(--ink3)}
.pb-f{display:flex;align-items:flex-end;gap:10px}
.pb-f .chips{flex:1}
.pb.busy{opacity:.6}
.c.off{background:none;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink4)}
.fl-found{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:28px}
.fl-found .chips{justify-content:center}
.fl-bad{margin-top:12px}
.fl-reading{justify-content:center;min-height:18px;margin-top:24px}
.fl-start .r-work{margin-top:24px}

/* the three choices */
.ymn{display:inline-flex;gap:4px;flex-shrink:0}
.ymn .s.sm{padding:0 12px}
.ymn .s.y{color:#fff;background:linear-gradient(#313337,#17181B);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 0 0 1px #0F1012}
.ymn .s.y:hover{filter:brightness(1.14)}
.ymn .s.on{box-shadow:inset 0 0 0 2px var(--ink)}
kbd{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;margin:0 2px;padding:0 4px;border-radius:5px;background:var(--well2);font:inherit;font-size:12px;line-height:16px;color:var(--ink2)}

/* students of a role: a row each, a column per criterion */
.tbw{display:flex;flex-direction:column;gap:14px;padding-bottom:24px}
.tb-wrap{padding-bottom:8px}
.tb-ov{font-size:12px;line-height:16px}
.tb-top{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.tb-say{gap:10px}
.tb-bar{flex-wrap:wrap;gap:10px}
.tb-n{margin-left:6px;color:var(--ink3)}
.seg button.on .tb-n{color:var(--ink2)}
.tb-need{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:0 6px 0 12px;border-radius:99px;background:var(--warnbg);color:var(--warn);font-size:12px;line-height:16px}
.tb-need:not(.on){padding-right:12px}
.tb-need svg{width:14px;height:14px}
.tb-need.on{background:var(--goodbg);color:var(--good)}
.tb.tbl tbody th{display:table-cell;min-width:220px}
.tb.tbl tbody tr{cursor:default}
.tb.tbl td,.tb.tbl th{padding:10px 12px}
.tb.tbl thead th .m{margin-left:4px}
.tb-ov{white-space:normal!important;min-width:200px;max-width:260px;color:var(--ink2)}
.tb.tbl tr.cur>*{background:var(--well)}
.tb.tbl tr.cur>th{box-shadow:inset 3px 0 0 var(--ink)}
.tb-act{position:sticky;right:0;text-align:right;background:#fff;box-shadow:-12px 0 12px -8px rgba(255,255,255,.9)}
.tb.tbl tr.cur>.tb-act{background:var(--well)}
.tb.tbl tbody tr:hover>.tb-act{background:var(--well)}
.tb-act .acts{justify-content:flex-end;flex-wrap:nowrap}
.tb-m{display:none}
.tb-x td{white-space:normal!important;padding:0 12px 14px!important}
.tb-x .pl-hold{max-width:560px;padding:14px;border-radius:14px;background:var(--well)}
.tb.tbl tbody tr.tb-x:hover>*{background:none}
.jl-seg{flex-wrap:wrap;border-radius:16px}
.jl-seg button{padding:0 10px}

/* recruiter home: what is left to set up */
.rh{grid-template-rows:auto 1fr}
.rh>section{grid-row:1/span 2}
.rh-z,.rh-todo{grid-column:2}
.rh-todo{padding:18px;border-radius:20px;box-shadow:inset 0 0 0 1px var(--line)}
.rh-todo ul{display:flex;flex-direction:column;gap:16px;margin-top:14px}
.rh-todo li{display:flex;align-items:flex-start;gap:12px}
.rh-todo li>svg{margin-top:2px;color:var(--ink3)}
.rh-todo .acts{margin-top:8px;gap:4px}

/* account: what Zero knows */
.kn-list{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.kn-list li{display:flex;flex-direction:column;gap:4px}
.kn-list .m{gap:8px;min-height:24px}
.kn-list textarea{padding:10px 12px;border:0;outline:0;border-radius:12px;background:var(--well);font:inherit;letter-spacing:inherit;color:var(--ink);resize:vertical}
.kn-list textarea:focus{box-shadow:inset 0 0 0 2px var(--ink)}
.ml-pv{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}

@media(max-width:1024px){
  .tb-m{display:flex;margin-top:10px}
  .tb-act{display:none}
  .rh>section{grid-row:auto}
  .rh-z,.rh-todo{grid-column:auto}
  .fl-start{padding-top:24px}
}
@media(max-width:640px){
  .rr .ymn{flex-basis:100%;justify-content:flex-end}
  .tb-key kbd{display:none}
}

/* ZERO Job Portal, v33: interview notes. Same three sizes, same surfaces. Every class here starts with nt-. */

/* the recruiter's card, in the side column */
.nt-card{display:flex;flex-direction:column;gap:16px;min-width:0;padding:18px}
.nt-h{flex-wrap:wrap;gap:8px 10px;min-height:34px}
.nt-h h2{flex:1 0 auto;white-space:nowrap}                      /* in a narrow column the switch drops under the title, the title never breaks */
.nt-h .seg{flex-shrink:0}
.nt-card .r-work.r-wline{margin:0}
.nt-rows{display:flex;flex-direction:column;gap:16px}
.nt-rows li{display:flex;flex-direction:column;gap:5px;min-width:0}
.nt-rows .i .m{white-space:nowrap}
.nt-sk{gap:22px}
.nt-sk li{gap:0}
.nt-l{display:flex;align-items:flex-start;gap:8px;min-width:0;overflow-wrap:anywhere}
.nt-l svg,.nt-l [data-lucide]{width:13px;height:13px;margin-top:1.5px;color:var(--ink4)}
.nt-l span{min-width:0}
.nt-yours{container:ntyours/inline-size;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:14px;background:var(--well)}
.nt-rate{display:flex;gap:6px}
.nt-rate .opt{flex:1 1 auto;padding:0 10px;text-align:center;white-space:nowrap}
@container ntyours (max-width:262px){.nt-rate{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}}      /* four in a row, or two and two: never three and one */
.nt-sum{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:14px;background:var(--well);color:var(--ink);overflow-wrap:anywhere}
.nt-qs{display:flex;flex-direction:column;gap:16px}
.nt-qs>li{min-width:0;overflow-wrap:anywhere}
.nt-qs ul{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.nt-qs ul li{position:relative;padding-left:14px}
.nt-qs ul li::before{content:'';position:absolute;top:6px;left:3px;width:4px;height:4px;border-radius:99px;background:var(--ink4)}
.nt-foot{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.nt-share{display:flex;align-items:center;max-width:100%;min-height:32px}       /* the button and the chip that replaces it take the same room, so nothing moves */
.nt-share .s{max-width:100%}
/* the side column spaces its cards 24px apart: its own 12px gap, and 12px on each card after the first */
.r-side>.nt-card{margin-top:12px}

/* the student's block, inside an application */
.nt-stu{margin-top:16px;min-width:0}
.more>.nt-stu:first-child{margin-top:0}
.nt-body{display:flex;flex-direction:column;gap:28px;margin-top:20px}
.nt-body .lab{margin-bottom:10px}
.nt-body .ev{gap:10px}
.nt-body .ev li{overflow-wrap:anywhere}
.nt-b{display:block}
.nt-b+.nt-b{margin-top:2px}

@media(max-width:640px){
  .nt-card{padding:16px}
  .nt-share{min-height:44px}
  .nt-stu>.s{max-width:100%}
}

/* ZERO Job Portal, v34: matches tables with a fit score, the review window, the reason box, the agent. Same three sizes, same surfaces. */

/* a verdict in a cell, and the fit score */
.j-vc{display:inline-flex;align-items:center;justify-content:center;width:44px;height:24px;border-radius:8px;background:var(--well2);color:var(--ink4)}
.j-vc svg{width:13px;height:13px}
.j-vc.y{background:var(--goodbg);color:var(--good)}
.j-vc.p{background:var(--warnbg);color:var(--warn)}
.j-pct{display:inline-block;min-width:38px;color:var(--ink);font-variant-numeric:tabular-nums}
.j-pct.lo{color:var(--ink3)}
.c.r{background:#FCEBEA;color:#A6281F}

/* matches tables */
.j-mt .tb-bar{margin-top:20px}
.j-jobs .tb-bar{margin-top:12px}
.j-tbl tbody tr[data-a]{cursor:pointer}
.j-tbl th.j-vt,.j-tbl td.j-vt{width:72px;padding-left:6px;padding-right:6px;text-align:center}
.j-tbl thead th.j-vt{max-width:84px;overflow:hidden;text-overflow:ellipsis}
.j-tbl .acts{gap:6px}
.j-sv{padding:0 8px}
.j-sv svg{width:15px;height:15px}
.j-sv.on{color:var(--good)}
.j-agb{border-radius:99px}
.j-agc{gap:7px}
.j-agc .live{width:7px;height:7px}
.j-q{width:220px;height:32px}
.j-w{gap:8px}

/* the review window: the profile beside the criteria analysis */
#ov.on::before{content:'';position:absolute;inset:0;z-index:39;background:rgba(19,20,23,.3)}
.j-rv{position:absolute;top:16px;bottom:16px;left:max(16px,calc(50% - 720px));right:max(16px,calc(50% - 720px));z-index:40;display:flex;flex-direction:column;border-radius:24px;background:#fff;box-shadow:0 0 0 1px var(--line2),0 40px 80px -30px rgba(19,20,23,.6);overflow:hidden;animation:in .2s var(--e) both}
.j-rvh{display:flex;align-items:center;gap:10px;flex-shrink:0;height:60px;padding:0 16px 0 24px;box-shadow:0 1px 0 var(--line)}
.j-rvh .x.sm{padding:0 8px}
.j-rvh .x:disabled{opacity:.35;pointer-events:none}
.j-rvn{min-width:44px;text-align:center}
.j-rvb{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(360px,.8fr);flex:1;min-height:0}
.j-rvl{min-width:0;overflow-y:auto;padding:28px 32px 40px}
.j-rvl>*{max-width:680px}
.j-rvr{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--well)}
.j-rvs{flex:1;min-height:0;overflow-y:auto;padding:24px 24px 28px}
.j-rvt{gap:8px}
.j-rvt>svg{color:var(--ink3)}
.j-rvg{margin-top:24px}
.j-rvc{display:flex;flex-direction:column;gap:22px;margin-top:20px}
.j-rvg+.j-rvc{margin-top:12px}
.j-rvc li{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.j-rvc .c{background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.j-rvc .c.g{background:var(--goodbg);box-shadow:none}
.j-rvc .c.w{background:var(--warnbg);box-shadow:none}
.j-ev{color:var(--ink3)}
.j-src{height:22px;margin-left:4px;vertical-align:middle}
.j-rvf{display:flex;align-items:center;gap:8px;flex-shrink:0;min-height:72px;padding:14px 20px;background:#fff;box-shadow:0 -1px 0 var(--line)}
.j-role .h{font-size:28px}

/* the reason box */
.j-fb{position:absolute;right:20px;bottom:92px;z-index:45;display:flex;flex-direction:column;align-items:center;gap:12px;width:372px;max-width:calc(100% - 40px);padding:20px;border-radius:20px;background:#fff;box-shadow:0 0 0 1px var(--line2),0 30px 60px -22px rgba(19,20,23,.55);animation:in .16s var(--e) both}
.j-fb.in{right:calc(max(16px,50% - 720px) + 20px);bottom:100px}
.j-fbq{text-align:center}
.j-fbt{justify-content:center}
.j-fb textarea{width:100%;padding:12px 14px;border:0;outline:0;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1px var(--line2);font:inherit;letter-spacing:inherit;color:var(--ink);resize:none}
.j-fb textarea:focus{box-shadow:inset 0 0 0 2px var(--ink)}
.j-fb>.m{text-align:center}
.j-fba{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}

/* the agent of a role */
.j-ag{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:32px;align-items:start;padding:20px 0 40px}
.j-agm{display:flex;flex-direction:column;gap:20px;min-width:0}
.j-me{align-self:flex-end;max-width:560px;padding:12px 16px;border-radius:18px 18px 4px 18px;background:var(--well);color:var(--ink)}
.j-plan{display:flex;flex-direction:column;gap:22px}
.j-plan>li{display:flex;align-items:flex-start;gap:12px;color:var(--ink3)}
.j-plan>li>.grow{display:flex;flex-direction:column;gap:10px}
.j-plan>li:not(.done):not(.now) .i{color:var(--ink3)}
.j-dot{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line2);flex-shrink:0}
.j-plan>li.done .j-dot{background:var(--goodbg);box-shadow:none;color:var(--good)}
.j-plan>li.now .j-dot{box-shadow:none}
.j-dot svg{width:13px;height:13px;stroke-width:2.5}
.j-smps{gap:6px}
.j-smp{padding:10px 14px}
.j-smp .grow>span{display:block}
.j-opts{display:flex;flex-direction:column;gap:8px}
.j-opt{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);text-align:left;transition:box-shadow .12s var(--e),background-color .12s var(--e)}
.j-opt:hover{box-shadow:inset 0 0 0 1px var(--line2)}
.j-opt.on{background:var(--well);box-shadow:inset 0 0 0 2px var(--ink)}
.j-act{gap:14px;padding-top:4px}
.j-ags{display:flex;flex-direction:column;gap:20px;padding:20px}
.j-agk{display:flex;flex-direction:column;gap:8px}
.j-agk .seg{align-self:flex-start}
.j-agq{display:flex;align-items:center;gap:8px;width:calc(100% + 16px);margin:-6px -8px;padding:8px;border-radius:12px;transition:background-color .12s var(--e)}
.j-agq:hover{background:var(--well)}
.j-agq svg{width:14px;height:14px;color:var(--ink3)}
.j-note{color:var(--ink)}

/* recruiter home: decisions, then roles */
.j-need{margin-bottom:8px}
.j-need button.item .grow>span,.j-hrh>span{display:block}
.j-need button.item>svg{color:var(--ink3)}
.j-hr{flex-wrap:wrap;gap:8px 14px;padding:14px 16px}
.j-hrh{flex-basis:260px;text-align:left;border-radius:8px}
.j-hrn{flex-shrink:0}

/* student home: the agent strip above today's roles */
.body.j-shome .page{max-width:920px}
.j-sa{display:flex;flex-direction:column;gap:12px;margin-top:8px;padding:14px 16px;border-radius:16px;background:var(--well)}
.j-sa .row{flex-wrap:wrap;gap:10px 12px}
.j-sa .seg{background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.j-sa .seg button.on{background:var(--ink);color:#fff;box-shadow:none}
.j-lrn .c{background:#fff;box-shadow:inset 0 0 0 1px var(--line);padding-right:4px}
.j-lrn .c.g{background:var(--goodbg);box-shadow:none}
.j-lrn .c button{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;color:inherit}
.j-lrn .c button:hover{background:rgba(19,20,23,.08)}
.j-lrn .c button svg{width:11px;height:11px}
.sechead>.acts{gap:4px}

@media(max-width:1024px){
  #ov.on::before{position:fixed}
  .j-rv{position:fixed;top:0;right:0;bottom:0;left:0;border-radius:0}
  .j-rvb{display:block;overflow-y:auto}
  .j-rvl{overflow:visible;padding:20px 16px 24px}
  .j-rvr{min-height:0}
  .j-rvs{overflow:visible;padding:20px 16px 24px}
  .j-rvf{position:sticky;bottom:0}
  .j-rvh{padding:0 8px 0 16px}
  .j-rvh>.m.clip{display:none}
  .j-fb,.j-fb.in{position:fixed;right:12px;left:12px;bottom:84px;width:auto;max-width:none}
  .j-ag{grid-template-columns:minmax(0,1fr)}
  .j-q{width:100%}
  .j-tbl th.j-vt,.j-tbl td.j-vt{width:56px}
}
@media(prefers-reduced-motion:reduce){.j-rv,.j-fb{animation:none}}

/* ═══ Zero at work. A wait is state in S.rc.work, so any render draws it, and a timer that outlives its state stops itself.

function rcWork(key,steps,done,ms=420){const W=S.rc.work,w=W[key]={steps,at:0};if(rcCalm()){delete W[key];if(done)done();return null}

const bizGap=(a,b)=>{let n=0;const d=new Date(a),e=new Date(b);d.setHours(0,0,0,0);e.setHours(0,0,0,0);while(d<e){d.setDate(d.getDate()+1);if(d.getDay()%6)n++}return n};

 if(S.rv&&(S.rv.side!==side||S.onb[S.mode]!=='done'))S.rv=null;if(S.fb&&S.fb.side!==side)S.fb=null;

 if(S.fb){if(k==='Escape'){S.fb=null;return done()}if(k==='Enter'&&(e.metaKey||e.ctrlKey)){A.fbsend();return done()}if(typing)return;return}
 if(typing||e.metaKey||e.ctrlKey||e.altKey)return;const st=S.mode==='student',lk=k.toLowerCase();

 if(lk==='j'||lk==='k'||k==='ArrowDown'||k==='ArrowUp'){set(L[Math.min(L.length-1,Math.max(0,i+(lk==='j'||k==='ArrowDown'?1:-1)))]);return done()}
 if(k==='Enter'){S.fb=null;S.rv=st?{side:'st',ids:[...L],i}:{side:'rc',rid:S.rc.open,ids:[...L],i};return done()}
 if(lk==='y'||lk==='n'){const ok=st?sCan(ROLE(cur)):rcCan(rcRole(S.rc.open),rcStu(cur));if(ok){fbOpen(st?'st':'rc',lk==='y'?'yes':'no',cur,st?'':S.rc.open);return done()}}
 if(lk==='m'){if(st)A.save(cur);else A.rmaybe(cur,{dataset:{role:S.rc.open}});return done()}},true);
