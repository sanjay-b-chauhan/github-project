:root{
  --page:#F5F3EF; --card:#FFF; --field:#EBE8E2; --wash:#FAF9F6; --sunk:#E3DFD7;
  --line:rgba(31,29,26,.11); --line2:rgba(31,29,26,.06);
  --tx:#171614; --tx2:#5C5952; --tx3:#918D84; --tx4:#BCB7AC;
  --ink:#171614; --onink:#fff;
  --ok:#118A4E; --okbg:#E8F6ED; --okline:rgba(17,138,78,.22);
  --amb:#8A6D00; --ambbg:#FBF4DF;
  --pur:#6D4AC7; --purbg:#F1ECFC;
  --lime:#BCF280;
  --f:'Google Sans Flex','Google Sans',-apple-system,system-ui,sans-serif;
  --serif:'STK Bureau Serif',Georgia,serif;
  --r6:8px; --r10:12px; --r14:18px; --r20:24px; --r28:32px; --pill:999px;
  --eio:cubic-bezier(.625,.05,0,1); --lift:cubic-bezier(.2,.8,.3,1);
  --sh1:0 1px 2px rgba(31,29,26,.05); --sh2:0 2px 8px rgba(31,29,26,.06),0 18px 40px -22px rgba(31,29,26,.22);
  --sh3:0 20px 60px rgba(0,0,0,.14);
  --hdr:76px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--page);color:var(--tx);font-family:var(--f);font-size:14px;letter-spacing:-.016em;-webkit-font-smoothing:antialiased;font-synthesis:none;overflow:hidden;transition:background-color .5s ease,color .5s ease}
body.zdark{--page:#0D0D0F;--card:#171719;--field:#1F1F22;--wash:#161618;--line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.06);--tx:#F4F4F3;--tx2:#A3A3A9;--tx3:#75757C;--tx4:#4A4A51;--ink:#F4F4F3;--onink:#111113}
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:none;outline:none}
input::placeholder{color:var(--tx3)}
svg{display:block}svg.lucide,[data-lucide]{width:16px;height:16px;stroke-width:1.75}
*{scrollbar-width:none}::-webkit-scrollbar{width:0;height:0}
::selection{background:var(--lime);color:#0a0a0a}
.zhide{display:none!important}
.zserif{font-family:var(--serif);font-weight:400;letter-spacing:-.025em}

/* ══ header ══ */
.zhdr{position:fixed;top:0;left:0;right:0;height:var(--hdr);z-index:60;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:color-mix(in srgb,var(--page) 86%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid transparent;transition:border-color .3s,background .5s}
body.zapp .zhdr{border-bottom-color:var(--line2)}
.zlogo{font-weight:800;font-size:19px;letter-spacing:-.07em}
.znav{position:absolute;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:2px;padding:4px;background:var(--field);border-radius:var(--pill)}
body.zapp .znav{display:flex}
.znav button{height:36px;padding:0 18px;border-radius:var(--pill);font-size:14px;font-weight:500;color:var(--tx2);position:relative;white-space:nowrap;transition:background .2s,color .2s}
.znav button:hover{color:var(--tx)}
.znav button.on{background:var(--card);color:var(--tx);font-weight:600;box-shadow:var(--sh1)}
.znav .zdot{position:absolute;top:6px;right:8px;width:6px;height:6px;border-radius:99px;background:var(--amb)}
.zhr{display:flex;align-items:center;gap:8px}
.ziconbtn{width:38px;height:38px;border-radius:var(--pill);background:var(--field);color:var(--tx2);display:flex;align-items:center;justify-content:center;transition:color .2s,background .2s}
.ziconbtn:hover{color:var(--tx);background:var(--sunk)}
.zav{width:38px;height:38px;border-radius:var(--pill);background:var(--ink);color:var(--onink);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.zbeats{height:38px;padding:0 16px;border-radius:var(--pill);background:var(--field);display:flex;align-items:center;gap:7px}
.zbeats i{width:5px;height:4px;border-radius:2px;background:var(--tx);opacity:.3;transition:width .5s var(--eio),opacity .5s}
.zbeats i.on{width:18px;opacity:1}.zbeats i.past{opacity:.5}

/* ══ screens ══ */
.zscr{position:fixed;inset:0;display:none}
.zscr.on{display:block}
.zscroll{position:absolute;inset:var(--hdr) 0 0;overflow-y:auto}
.zpage{max-width:1180px;margin:0 auto;padding:56px 32px 110px}
.zpage.narrow{max-width:760px}
.zcenter{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:var(--hdr) 24px 140px}

/* ══ type ══ */
.zq{font-family:var(--serif);font-weight:400;font-size:clamp(26px,2.1vw,38px);letter-spacing:-.03em;line-height:1.15;text-align:center;text-wrap:balance;max-width:26ch;margin:0 auto}
.zq .w{display:inline-block;opacity:0;transform:translateY(24px);filter:blur(9px);transition:opacity .7s cubic-bezier(.2,.6,.3,1),transform .7s cubic-bezier(.2,.6,.3,1),filter .7s cubic-bezier(.2,.6,.3,1)}
.zq .w.in{opacity:1;transform:none;filter:none}
.zsub{font-size:15px;color:var(--tx3);text-align:center;margin-top:14px;line-height:1.5;max-width:52ch;margin-left:auto;margin-right:auto}
.zh1{font-family:var(--serif);font-weight:400;font-size:clamp(32px,3vw,44px);letter-spacing:-.032em;line-height:1.1}
.zh2{font-size:15px;font-weight:600;letter-spacing:-.02em}
.zlbl{font-size:12px;font-weight:500;color:var(--tx3);letter-spacing:0}
.zmeta{font-size:13px;color:var(--tx2);line-height:1.5}

/* ══ controls ══ */
.zbtn{height:40px;padding:0 18px;border-radius:var(--r10);font-size:14px;font-weight:600;letter-spacing:-.015em;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;flex-shrink:0;transition:background .18s,color .18s,border-color .18s,transform .18s var(--lift),opacity .18s}
.zbtn:active{transform:scale(.98)}
.zbtn.dark{background:var(--ink);color:var(--onink)}.zbtn.dark:hover{opacity:.88}
.zbtn.line{background:var(--card);border:1px solid var(--line);color:var(--tx)}.zbtn.line:hover{background:var(--wash);border-color:var(--tx4)}
.zbtn.ghost{color:var(--tx2)}.zbtn.ghost:hover{background:var(--field);color:var(--tx)}
.zbtn.lg{height:52px;padding:0 26px;font-size:15.5px;border-radius:var(--r14)}
.zbtn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.zbtn:disabled{opacity:.4;pointer-events:none}
.zbtn svg{width:15px;height:15px}
.zopt{height:50px;padding:0 22px;border-radius:var(--pill);background:var(--card);border:1px solid var(--line);font-size:15px;font-weight:500;display:inline-flex;align-items:center;gap:10px;transition:transform .28s var(--lift),box-shadow .28s,background .2s,color .2s,border-color .2s}
.zopt:hover{transform:translateY(-4px);box-shadow:var(--sh2);border-color:var(--tx4)}
.zopt.on{background:var(--ink);color:var(--onink);border-color:transparent}
.zopt svg{width:16px;height:16px}
.zopts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:680px;margin:40px auto 0;opacity:0;transform:translateY(14px);filter:blur(7px);transition:all .55s cubic-bezier(.2,.6,.3,1);pointer-events:none}
.zopts.in{opacity:1;transform:none;filter:none;pointer-events:auto}
.ztag{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:var(--r6);font-size:12px;font-weight:500;background:var(--field);color:var(--tx2);white-space:nowrap;flex-shrink:0;line-height:1}
.ztag svg{width:12px;height:12px;stroke-width:2}
.ztag.ok{background:var(--okbg);color:var(--ok);font-weight:600}
.ztag.amb{background:var(--ambbg);color:var(--amb);font-weight:600}
.ztag.pur{background:var(--purbg);color:var(--pur);font-weight:600}
.ztag.dk{background:var(--ink);color:var(--onink);font-weight:600}
.ztag.out{background:transparent;border:1px solid var(--line);color:var(--tx2)}
.ztag.dsh{background:transparent;border:1px dashed var(--tx4);color:var(--tx3)}
.zsw{width:38px;height:22px;border-radius:99px;background:var(--tx4);position:relative;transition:background .2s;flex-shrink:0}
.zsw::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:99px;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.zsw.on{background:var(--ok)}.zsw.on::after{transform:translateX(16px)}
.zcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r20);box-shadow:var(--sh1)}
.zlogo2{border-radius:var(--r10);background:var(--card);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;color:var(--tx3)}
.zlogo2 img{object-fit:contain}
.zlogo2.s40{width:40px;height:40px}.zlogo2.s40 img{width:22px;height:22px}
.zlogo2.s48{width:48px;height:48px;border-radius:var(--r14)}.zlogo2.s48 img{width:26px;height:26px}
.zlogo2.s32{width:32px;height:32px;border-radius:8px}.zlogo2.s32 img{width:17px;height:17px}
.zdivide{height:1px;background:var(--line2)}

/* ══ welcome ══ */
.zveil{position:fixed;inset:0;z-index:70;background:#F5F3EF;opacity:0;pointer-events:none;transition:opacity .6s}
.zveil.on{opacity:1;transition:opacity .38s}
.zdock{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;padding:0 24px 32px;pointer-events:none}
.zdock>*{pointer-events:auto}
.zfield{display:flex;align-items:center;gap:10px;height:58px;padding:0 8px 0 24px;background:var(--field);border-radius:var(--pill);width:min(500px,46vw)}
.zfield input{flex:1;font-size:16px;min-width:0}
.zsend{width:42px;height:42px;border-radius:var(--pill);background:var(--ink);color:var(--onink);display:flex;align-items:center;justify-content:center;opacity:.3;flex-shrink:0;transition:opacity .2s}
.zsend.on{opacity:1}
.zmic{width:58px;height:58px;border-radius:var(--pill);background:var(--ink);color:var(--onink);display:flex;align-items:center;justify-content:center;transition:transform .2s var(--lift)}
.zmic:hover{transform:scale(1.05)}.zmic svg{width:22px;height:22px}

/* ══ build split ══ */
.zsplit{position:absolute;inset:var(--hdr) 0 0;display:flex;gap:16px;padding:16px}
.zsplit .zleft{flex:1;min-width:0;overflow-y:auto;padding:40px 8px 40px 24px;display:flex;flex-direction:column;justify-content:flex-end}
.zsplit .zright{width:52%;flex-shrink:0;background:var(--wash);border-radius:var(--r28);border:1px solid var(--line2);display:flex;flex-direction:column;overflow:hidden}
.zrcap{display:flex;align-items:center;gap:8px;padding:20px 26px 14px;font-size:12.5px;color:var(--tx3);flex-shrink:0}
.zrcap .live{width:6px;height:6px;border-radius:99px;background:var(--ok);animation:zpulse 1.6s infinite}
@keyframes zpulse{0%,100%{opacity:1}50%{opacity:.25}}
.zrbody{flex:1;overflow-y:auto;padding:0 26px 26px}
.zmsg{display:flex;gap:12px;margin-top:18px;opacity:0;transform:translateY(16px);filter:blur(8px);transition:all .55s cubic-bezier(.2,.6,.3,1);max-width:600px}
.zmsg.in{opacity:1;transform:none;filter:none}
.zmsg .zab{width:30px;height:30px;border-radius:9px;background:var(--ink);color:var(--onink);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.zmsg .zbub{font-size:15px;line-height:1.6;padding-top:4px}
.zmsg.me{justify-content:flex-end;margin-left:auto}
.zmsg.me .zbub{background:var(--field);padding:11px 16px;border-radius:18px 18px 4px 18px}
.zthink{display:inline-flex;gap:4px;padding:10px 0}
.zthink i{width:6px;height:6px;border-radius:99px;background:var(--tx3);animation:zt 1.2s infinite}
.zthink i:nth-child(2){animation-delay:.16s}.zthink i:nth-child(3){animation-delay:.32s}
@keyframes zt{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.zqr{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0 42px;max-width:600px}
.zshimmer{color:var(--tx3);font-size:14.5px;position:relative;display:inline-block}
.zshimmer::after{content:attr(data-t);position:absolute;inset:0;background:linear-gradient(100deg,transparent 34%,#8be3a6 47%,#e9ffd4 53%,transparent 66%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:zsw 1.6s linear infinite}
@keyframes zsw{from{background-position:130% 0}to{background-position:-130% 0}}

/* ══ jobs board ══ */
.zboard{position:absolute;inset:var(--hdr) 0 0;display:flex;flex-direction:column}
.zfilters{flex-shrink:0;padding:18px 28px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line2);overflow-x:auto}
.zsearch{display:flex;align-items:center;gap:9px;height:40px;padding:0 16px;background:var(--field);border-radius:var(--r10);min-width:280px;flex-shrink:0}
.zsearch input{flex:1;font-size:14px;min-width:0}
.zsearch svg{width:16px;height:16px;color:var(--tx3);flex-shrink:0}
.zfil{height:40px;padding:0 14px;border-radius:var(--r10);border:1px solid var(--line);background:var(--card);font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;flex-shrink:0;transition:border-color .2s,background .2s}
.zfil:hover{border-color:var(--tx4)}
.zfil.on{background:var(--ink);color:var(--onink);border-color:transparent}
.zfil svg{width:14px;height:14px;color:currentColor;opacity:.6}
.zcols{flex:1;display:flex;min-height:0}
.zlist{width:436px;flex-shrink:0;overflow-y:auto;border-right:1px solid var(--line2);padding:14px}
.zlisthd{display:flex;align-items:baseline;justify-content:space-between;padding:8px 10px 12px}
.zjc{position:relative;padding:18px;border-radius:var(--r14);border:1px solid transparent;cursor:pointer;transition:background .18s,border-color .18s}
.zjc:hover{background:var(--wash)}
.zjc.on{background:var(--card);border-color:var(--tx);box-shadow:var(--sh1)}
.zjc+.zjc{margin-top:4px}
.zjc .top{display:flex;gap:12px;align-items:flex-start}
.zjc .co{font-size:12.5px;color:var(--tx2);display:flex;align-items:center;gap:6px}
.zjc .co .live{width:6px;height:6px;border-radius:99px;background:var(--ok)}
.zjc .ti{font-size:15.5px;font-weight:600;letter-spacing:-.02em;line-height:1.3;margin-top:3px}
.zjc .lo{font-size:12.5px;color:var(--tx3);margin-top:4px}
.zjc .pay{font-size:13px;font-weight:500;margin-top:8px}
.zjc .tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.zjc .age{position:absolute;right:16px;bottom:16px;font-size:11.5px;color:var(--tx4)}
.zsave{position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--tx4);transition:color .2s,background .2s}
.zsave:hover{background:var(--field);color:var(--tx)}
.zsave.on{color:var(--tx)}
.zdetail{flex:1;overflow-y:auto;min-width:0}
.zdin{max-width:740px;padding:36px 48px 90px}
.zdhd{display:flex;gap:16px;align-items:flex-start}
.zdt{font-family:var(--serif);font-size:30px;letter-spacing:-.03em;line-height:1.15;font-weight:400}
.zdco{font-size:14px;color:var(--tx2);margin-top:6px}
.zdchips{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.zdacts{display:flex;gap:10px;margin-top:20px;align-items:center}
.zwhy{margin-top:28px;background:var(--okbg);border:1px solid var(--okline);border-radius:var(--r14);padding:22px 24px}
.zwhy.pur{background:var(--purbg);border-color:rgba(109,74,199,.18)}
.zwhy .wt{font-size:13px;font-weight:600;color:var(--ok);display:flex;align-items:center;gap:7px;margin-bottom:8px}
.zwhy.pur .wt{color:var(--pur)}
.zwhy p{font-size:15px;line-height:1.65;color:var(--tx)}
.zwhy p b{font-weight:600}
.zwhy .src{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.zsec{margin-top:38px}
.zsec .st{font-size:15px;font-weight:600;letter-spacing:-.02em;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.zq2{display:grid;grid-template-columns:1fr 1fr;gap:2px 20px}
.zqi{display:flex;gap:9px;align-items:flex-start;padding:7px 0;font-size:13.5px;line-height:1.45}
.zqi svg{width:15px;height:15px;flex-shrink:0;margin-top:1px}
.zqi.y svg{color:var(--ok)}.zqi.p svg{color:var(--amb)}.zqi.n svg{color:var(--tx4)}
.zqi.n{color:var(--tx3)}
.zqi .ev{display:block;font-size:11.5px;color:var(--tx3);margin-top:2px}
.zsteps{border:1px solid var(--line);border-radius:var(--r14);overflow:hidden}
.zsteps .hd{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;background:var(--wash);border-bottom:1px solid var(--line2)}
.zbar{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:8px}
.zbar i{display:block;height:100%;background:var(--ok);border-radius:4px;transition:width .6s var(--eio)}
.zstep{display:flex;align-items:center;gap:12px;padding:13px 18px;font-size:13.5px}
.zstep+.zstep{border-top:1px solid var(--line2)}
.zstep .mk{width:20px;height:20px;border-radius:99px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--line);color:transparent}
.zstep.done .mk{background:var(--ok);border-color:var(--ok);color:#fff}
.zstep.done .mk svg{width:11px;height:11px;stroke-width:3}
.zstep.todo .mk{border-style:dashed;border-color:var(--amb)}
.zstep .sl{flex:1}.zstep .sn{font-weight:500}
.zstep .ss{font-size:12px;color:var(--tx3);margin-top:2px}
.zbody{font-size:14.5px;line-height:1.7;color:var(--tx2)}
.zbody li{margin-left:18px;margin-bottom:6px}
.zempty{padding:80px 24px;text-align:center;color:var(--tx3)}

/* ══ home ══ */
.zgrid{display:grid;grid-template-columns:1fr 348px;gap:28px;align-items:start;margin-top:34px}
.zsum{padding:32px 34px}
.zsum .big{font-family:var(--serif);font-size:clamp(22px,1.8vw,27px);line-height:1.38;letter-spacing:-.025em}
.zsum .sm{font-size:14.5px;line-height:1.6;color:var(--tx2);margin-top:12px}
.zsum .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.zrow{display:flex;align-items:center;gap:16px;padding:20px 24px}
.zrow+.zrow{border-top:1px solid var(--line2)}
.zrow .t{font-size:14.5px;font-weight:600;letter-spacing:-.015em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.zrow .s{font-size:13px;color:var(--tx3);margin-top:3px}
.zrow .grow{flex:1;min-width:0}

.ztabs{display:inline-flex;gap:2px;padding:3px;background:var(--field);border-radius:var(--pill);margin-bottom:4px}
.ztabs button{height:28px;padding:0 12px;border-radius:var(--pill);font-size:12.5px;font-weight:500;color:var(--tx2);transition:background .2s,color .2s}
.ztabs button.on{background:var(--card);color:var(--tx);font-weight:600;box-shadow:var(--sh1)}
.zwork{display:flex;gap:11px;padding:12px 0;align-items:flex-start}
.zwork+.zwork{border-top:1px solid var(--line2)}
.zwork .d{width:7px;height:7px;border-radius:99px;flex-shrink:0;margin-top:6px;background:var(--tx4)}
.zwork .d.live{background:var(--ok);animation:zpulse 1.6s infinite}
.zwork .d.done{background:var(--ok)}
.zwork .d.wait{background:var(--amb)}
.zwork .tx{font-size:13.5px;line-height:1.5;flex:1;min-width:0}
.zwork .tm{font-size:11.5px;color:var(--tx3);margin-top:2px}
.zstatus{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:var(--r6);font-size:12px;font-weight:600;background:var(--okbg);color:var(--ok);cursor:default;flex-shrink:0}
.zstatus.amb{background:var(--ambbg);color:var(--amb)}
.zstatus.out{background:var(--field);color:var(--tx2)}
.zstatus i{width:6px;height:6px;border-radius:99px;background:currentColor;display:block}
.zview{display:flex;align-items:center;gap:11px;padding:11px 0}
.zview+.zview{border-top:1px solid var(--line2)}
.zview .n{font-size:13.5px;font-weight:500}
.zview .s{font-size:12px;color:var(--tx3);margin-top:1px}
.zlivedot{width:7px;height:7px;border-radius:99px;background:var(--ok);margin-left:auto;flex-shrink:0}
.zlivedot.off{background:var(--tx4)}
.zstat{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.zstat .b{padding:18px 20px;text-align:left}
.zstat .v{font-family:var(--serif);font-size:26px;letter-spacing:-.02em}
.zstat .l{font-size:12px;color:var(--tx3);margin-top:4px}

/* ══ applications ══ */
.zapps .grp{margin-top:26px}
.zapps .gh{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--tx2);margin-bottom:10px}
.zarow{display:flex;align-items:center;gap:14px;padding:15px 20px;cursor:pointer;transition:background .18s}
.zarow:hover{background:var(--wash)}
.zarow+.zarow{border-top:1px solid var(--line2)}

/* ══ panel ══ */
.zovl{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.42);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s}
.zovl.on{opacity:1;pointer-events:auto}
.zpanel{position:fixed;top:12px;right:12px;bottom:12px;width:min(94vw,520px);z-index:81;background:var(--card);border-radius:var(--r28);display:flex;flex-direction:column;overflow:hidden;transform:translateX(108%);transition:transform .3s cubic-bezier(.32,.72,0,1);box-shadow:var(--sh3)}
.zpanel.on{transform:none}
.zpanel .ph{padding:26px 28px 16px;display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-shrink:0}
.zpanel .pb{padding:0 28px 24px;overflow-y:auto;flex:1}
.zpanel .pf{padding:16px 28px 24px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line2);flex-shrink:0}
.zx{width:34px;height:34px;border-radius:99px;background:var(--field);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.zx:hover{background:var(--sunk)}
.zdlg{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.42);backdrop-filter:blur(4px)}
.zdlg.on{display:flex}
.zdlg .box{width:min(92vw,500px);background:var(--card);border-radius:var(--r28);padding:32px 34px 28px;box-shadow:var(--sh3)}
.ztl{position:relative;padding-left:20px}
.ztl::before{content:'';position:absolute;left:4px;top:8px;bottom:10px;width:1px;background:var(--line)}
.ztl .it{position:relative;padding:2px 0 14px;font-size:13.5px;line-height:1.5;color:var(--tx2)}

async function runTalk(){
 S.page='talk';$('#dstep').textContent='2 · Your terms';document.body.classList.add('zdark');document.body.classList.remove('zapp');show('talk');$('#tdock').innerHTML='';
 await clearLine();let i=0;
 while(i<ASK.length){const a=ASK[i];beats(i,ASK.length);let ack='';
  const r=await new Promise(res=>{line($('#tq'),a.q);
   pills(a.o,(idx,t)=>{if(idx===-1){res('back');return}
    if(a.k==='confirm'){if(idx===1)ack='Tell me what changed and I will fix it in your brief.';res('ok');return}
    const v=a.v?a.v[idx]:t;ack=a.ack?a.ack[idx]:'';

    S.answers[a.k]={value:v,src:'You told me, today'};res('ok')},i>0)});
  await clearLine();
  if(r==='back'){i=Math.max(0,i-1);continue}
  if(ack){await new Promise(r2=>line($('#tq'),ack,()=>setTimeout(r2,900)));await clearLine()}
  i++}

  if(/Strategy & Operations · Ramp/.test(n.textContent))n.textContent=e.role.split(', ')[1]?e.role.split(', ')[1]+' · '+e.co:e.co;
  else if(n.textContent.trim()==='Business Analyst')n.textContent=e.role.split(',')[0];
  else if(n.textContent.trim()==='Exceptional Fit')n.textContent=e.st==='conf'?'Exceptional Fit':'Strong Fit'}});
 const img=rail.querySelector('img');if(img)img.src='https://www.google.com/s2/favicons?sz=64&domain='+e.dom}
function renderPortfolio(){
 const emps=employersWhoSaw();
 if(window.emp&&!window.empCo&&emps.length)window.empCo=emps[0];
 const sh=mountSnap($('#pfmount'),window.emp?'rec':'stu',{zoom:1});
 if(window.emp)applyEmployer(sh,window.empCo);
 $('#pfbar').classList.toggle('zhide',!window.emp);
 $('#pfprev').innerHTML=window.emp?ic('pencil'):ic('eye');
 if(window.emp){
  $('#pfbartxt').textContent=emps.length?'What '+window.empCo.co+' sees':'Nobody has opened it yet';
  $('#pfemps').innerHTML=emps.map(e=>`<button class="ztag ${window.empCo&&window.empCo.id===e.id?'dk':'out'}" data-emp="${e.id}" style="height:30px;padding:0 12px;font-size:12.5px;cursor:pointer">${e.co}</button>`).join('');
  $$('#pfemps [data-emp]').forEach(b=>b.onclick=()=>{window.empCo=emps.find(e=>e.id===b.dataset.emp);renderPortfolio()})}
 icons()}
$('#pfprev').onclick=()=>{window.emp=!window.emp;if(!window.emp)window.empCo=null;renderPortfolio()};
$('#pfexit').onclick=()=>{window.emp=false;window.empCo=null;renderPortfolio()};
$('#pfshare').onclick=function(){this.innerHTML=ic('check');icons();toast('Link copied. It shows only the sections you kept on.');setTimeout(()=>{this.innerHTML=ic('link');icons()},2000)};


/* ═══ first-run tour ═══ */
const TOUR=[
 {sel:'#znav',t:'Jobs is where you browse. Applications is what I already sent.',pos:'below'},
 {sel:'#hsum',t:'My report. It is different every time you open this.',pos:'below'},
 {sel:'#hneeds',t:'I stop here when a form asks something only you can answer.',pos:'below'},
 {sel:'#hagentcard',t:'One agent. Three tabs: what it is doing, what it did, what it will do next.',pos:'left'},
 {sel:'#hbriefcard',t:'Switch me off here. Pause stops everything, including anything mid-flight.',pos:'left'},
];
let tourI=-1;
function tourAt(i){
 tourI=i;const st=TOUR[i];const el2=$(st.sel);const ring=$('#ztring'),card=$('#ztcard');
 if(!el2){endTour();return}
 el2.scrollIntoView({behavior:'smooth',block:'center'});
 setTimeout(()=>{
  const r=el2.getBoundingClientRect();const pad=8;
  ring.style.left=(r.left-pad)+'px';ring.style.top=(r.top-pad)+'px';ring.style.width=(r.width+pad*2)+'px';ring.style.height=(r.height+pad*2)+'px';ring.classList.add('on');
  card.innerHTML=`<div class="tl">${st.t}</div><div class="ft"><div class="dots">${TOUR.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div>${i>0?'<button class="zbtn ghost sm" id="tb">Back</button>':'<button class="zbtn ghost sm" id="tskip">Skip</button>'}<button class="zbtn dark sm" id="tn">${i===TOUR.length-1?'Open the job board':'Next'}</button></div>`;
  const cw=328,ch=card.offsetHeight||120;
  let L,T;
  if(st.pos==='left'){L=r.left-cw-16;T=Math.min(r.top,innerHeight-ch-20)}
  else{L=Math.min(Math.max(16,r.left),innerWidth-cw-16);T=r.bottom+14;if(T+ch>innerHeight-16)T=Math.max(16,r.top-ch-14)}
  card.style.left=Math.max(16,L)+'px';card.style.top=Math.max(16,T)+'px';card.classList.add('on');icons();
  const n=$('#tn');if(n)n.onclick=()=>{if(i===TOUR.length-1){endTour();nav('jobs')}else tourAt(i+1)};
  const b=$('#tb');if(b)b.onclick=()=>tourAt(i-1);
  const sk=$('#tskip');if(sk)sk.onclick=endTour;
 },320)}
function startTour(){if(S.page!=='home')nav('home');S.toured=true;setTimeout(()=>tourAt(0),500)}
function endTour(){tourI=-1;$('#ztring').classList.remove('on');$('#ztcard').classList.remove('on')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&tourI>=0)endTour()});
window.addEventListener('resize',()=>{if(tourI>=0)tourAt(tourI)});

/* ═══ demo menu ═══ */
$('#dmenu').onclick=()=>{const m=$('#zmenu');m.classList.toggle('on');
 if(m.classList.contains('on')){m.innerHTML=`<div class="h">Visit</div>`+
  [['first','First time here'],['returning','Coming back'],['regular','Been here a while']].map(v=>`<button class="${S.visit===v[0]?'on':''}" data-v="${v[0]}">${v[1]}</button>`).join('')+
  `<div class="h">Run</div><button data-r="tour">Replay the tour</button><button data-r="flow">Start from the welcome</button>`;
  $$('#zmenu [data-v]').forEach(b=>b.onclick=()=>{S.visit=b.dataset.v;S.toured=S.visit!=='first';m.classList.remove('on');nav('home');if(S.visit==='first')startTour();else endTour()});
  $$('#zmenu [data-r]').forEach(b=>b.onclick=()=>{m.classList.remove('on');if(b.dataset.r==='tour'){nav('home');startTour()}else{endTour();document.body.classList.add('zdark');document.body.classList.remove('zapp');$('#zbeats').classList.remove('zhide');$('#znotif').classList.add('zhide');$('#zme').classList.add('zhide');lineTok=0;runWelcome()}})}};
document.addEventListener('click',e=>{if(!e.target.closest('.zdbg'))$('#zmenu').classList.remove('on')});

/* ═══ nav ═══ */
const PAGES={home:'5 · Home',jobs:'6 · Jobs',apps:'7 · Applications',portfolio:'8 · Portfolio'};
const FLOW=['welcome','talk','build','auto','home','jobs','apps','portfolio'];
function show(id){$$('.zscr').forEach(s=>s.classList.toggle('on',s.id==='s-'+id))}
function nav(p){S.page=p;$$('.znav button').forEach(b=>b.classList.toggle('on',b.dataset.nav===p));show(p);$('#dstep').textContent=PAGES[p]||p;
 if(p==='home')renderHome();if(p==='jobs')renderJobs();if(p==='apps')renderApps();if(p==='portfolio')renderPortfolio();
 const sc=$('#s-'+p);const sr=$('.zscroll',sc);if(sr)sr.scrollTop=0;arrive(sc);location.hash='#/'+p;icons()}
$$('.znav button').forEach(b=>b.onclick=()=>nav(b.dataset.nav));
function goStep(d){const i=FLOW.indexOf(S.page==='talk'?(lineTok>0?'talk':'welcome'):S.page);const n=FLOW[Math.max(0,Math.min(FLOW.length-1,i+d))];
 if(n==='welcome'){lineTok=0;runWelcome()}else if(n==='talk'){document.body.classList.remove('zapp');runTalk()}else if(n==='build'){document.body.classList.remove('zapp');runBuild()}else if(n==='auto'){document.body.classList.remove('zdark');document.body.classList.remove('zapp');runAuto()}else{if(document.body.classList.contains('zdark'))enterApp(n);else{document.body.classList.add('zapp');$('#zbeats').classList.add('zhide');$('#znotif').classList.remove('zhide');$('#zme').classList.remove('zhide');nav(n)}}}
$('#dprev').onclick=()=>goStep(-1);$('#dnext').onclick=()=>goStep(1);
$('#dstep').onclick=()=>{const p=prompt('Jump to: '+FLOW.join(', '),S.page);if(p&&FLOW.includes(p)){const i=FLOW.indexOf(p);S.page=FLOW[Math.max(0,i-1)];goStep(1)}};
$('#znotif').onclick=()=>{openPanel('Notifications','What changed while you were away.',
 VIEWS.map(v=>`<div class="zview"><div class="zlogo2 s32">${fav(v[0])}</div><div><div class="n">${v[1]}</div><div class="s">${v[2]}</div><div class="s" style="color:var(--tx4)">${v[3]}</div></div></div>`).join('')
 +APPS.filter(a=>a.st==='conf').map(a=>`<div class="zview"><div class="zlogo2 s32">${fav(a.dom)}</div><div><div class="n">${a.co} acknowledged your application</div><div class="s">${a.up}</div></div></div>`).join(''),'')};

/* ═══ boot ═══ */
icons();
const h=location.hash.replace('#/','');
if(['home','jobs','apps','portfolio'].includes(h)){document.body.classList.remove('zdark');document.body.classList.add('zapp');$('#zbeats').classList.add('zhide');$('#znotif').classList.remove('zhide');$('#zme').classList.remove('zhide');nav(h)}
else runWelcome();
</script>
</body>
</html>
