/* ZERO Job Portal, the story build. Three sizes: 13, 16 and a 32 serif. One weight. */
:root{
  --canvas:#F3F3F5; --sheet:#FFFFFF; --well:#F6F6F8; --well2:#EDEDF0;
  --line:#E7E7EB; --line2:#D4D5DA;
  --ink:#131417; --ink2:#4E525C; --ink3:#6A6F7A; --ink4:#A6A9B2;
  --good:#12733F; --goodbg:#E7F6ED; --warn:#8A5306; --warnbg:#FCF1DC; --lime:#B7F06A;
  --f:'Google Sans Flex',-apple-system,system-ui,sans-serif; --serif:'STK Bureau Serif',Georgia,serif;
  --e:cubic-bezier(.2,0,0,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--canvas);color:var(--ink2);font:400 16px/24px var(--f);letter-spacing:-.011em;-webkit-font-smoothing:antialiased;font-synthesis:none;overflow:hidden}
button,input{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;outline:0}
button{cursor:pointer;text-align:left}
ul,ol{list-style:none}
h1,h2,h3{font-size:inherit;font-weight:400}
svg{display:block;flex-shrink:0}
[data-lucide],svg.lucide{width:18px;height:18px;stroke-width:1.75}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
::selection{background:#D2F59B;color:#111}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
input{caret-color:var(--ink)}
input::placeholder{color:var(--ink3)}

/* type */
.h{font:400 32px/38px var(--serif);letter-spacing:-.025em;color:var(--ink);text-wrap:balance}
.i{color:var(--ink)}
.m{font-size:13px;line-height:18px;color:var(--ink3)}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:12px}
.hide{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* frame: the guide on the canvas, the product in a sheet */
.app{display:grid;grid-template-columns:332px minmax(0,1fr);height:100dvh}
.guide{display:flex;flex-direction:column;min-height:0;padding:26px 14px 18px 26px;overflow-y:auto}
.stagewrap{min-width:0;min-height:0;padding:14px 14px 14px 4px}
.sheet{position:relative;display:flex;flex-direction:column;height:100%;background:var(--sheet);border-radius:28px;box-shadow:0 0 0 1px rgba(19,20,23,.05),0 1px 2px rgba(19,20,23,.04),0 40px 70px -50px rgba(19,20,23,.35);overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-shrink:0;height:68px;padding:0 28px}
.top .zlogo{width:58px;height:auto;display:block}
.top .zlogo path{fill:var(--ink)}
.body{flex:1;min-height:0;overflow-y:auto;padding:4px 28px 56px}
.page{max-width:1080px;margin:0 auto}
.page.in{animation:in .32s var(--e) both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* the guide */
.g-head{display:flex;align-items:center;gap:12px;padding:0 12px}
.steps{display:flex;flex-direction:column;gap:2px;margin-top:22px}
.st{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;padding:8px 12px;border-radius:14px;transition:background-color .12s var(--e)}
.st:hover{background:rgba(19,20,23,.04)}
.st .n{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:99px;background:var(--well2);font-size:13px;line-height:18px;color:var(--ink3);letter-spacing:0;box-shadow:inset 0 0 0 1px var(--line)}
.st .n svg{width:14px;height:14px;stroke-width:2.25}
.st .t{color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.done .n{background:var(--ink);color:#fff;box-shadow:none}
.st.done .t{color:var(--ink2)}
.st.on{background:#fff;box-shadow:0 0 0 1px var(--line),0 8px 18px -14px rgba(19,20,23,.3)}
.st.on .n{background:var(--lime);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(19,20,23,.12)}
.st.on .t{color:var(--ink)}
.g-now{padding:10px 12px 18px 48px}
.g-now .try{display:flex;align-items:flex-start;gap:8px;margin-top:12px;color:var(--ink)}
.g-now .try svg{margin-top:3px}
.g-now .next{margin-top:16px}
.g-foot{margin-top:auto;padding:18px 12px 0}
.g-bar{display:none}

/* buttons: the key is the site's key */
.k,.s{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:99px;white-space:nowrap;flex-shrink:0;transition:transform .12s var(--e),filter .12s var(--e),background-color .12s var(--e),box-shadow .12s var(--e)}
.k{color:#fff;background:linear-gradient(#313337,#17181B);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -2px 0 rgba(0,0,0,.45),0 0 0 1px #0F1012,0 12px 22px -14px rgba(19,20,23,.6)}
.k:hover{filter:brightness(1.14)}
.k:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 0 1px #0F1012}
.s{color:var(--ink);background:#fff;box-shadow:inset 0 0 0 1px var(--line2),inset 0 -2px 0 rgba(19,20,23,.04)}
.s:hover{background:var(--well)}
.s:active{transform:translateY(1px);box-shadow:inset 0 0 0 1px var(--line2)}
.x{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 12px;border-radius:99px;color:var(--ink2);white-space:nowrap;transition:background-color .12s var(--e),color .12s var(--e)}
.x:hover{background:var(--well);color:var(--ink)}
.k:disabled,.s:disabled{opacity:.4;pointer-events:none}
.k.sm,.s.sm{height:36px;padding:0 16px}
.acts{display:flex;align-items:center;flex-wrap:wrap;gap:8px}

/* atoms */
.lg{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);flex-shrink:0}
.lg img{width:26px;height:26px;object-fit:contain;border-radius:5px}
.lg.sm{width:36px;height:36px;border-radius:11px}
.lg.sm img{width:20px;height:20px}
.lg.xs{width:24px;height:24px;border-radius:8px}
.lg.xs img{width:14px;height:14px;border-radius:3px}
.av{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:99px;background:var(--well2);font-size:13px;line-height:18px;color:var(--ink);letter-spacing:0;flex-shrink:0}
.av.xs{width:24px;height:24px}
.av.lgx{width:48px;height:48px}
.av.tone-a{background:#E3EAFB}.av.tone-b{background:#FBE7E1}.av.tone-c{background:#E2F3E8}.av.tone-d{background:#F1E6FA}.av.tone-e{background:#FCEFD3}
.c{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:99px;background:var(--well2);font-size:13px;line-height:18px;color:var(--ink2);white-space:nowrap}
.c svg{width:14px;height:14px}
.c.g{background:var(--goodbg);color:var(--good)}
.c.w{background:var(--warnbg);color:var(--warn)}
.card{background:#fff;border-radius:20px;box-shadow:inset 0 0 0 1px var(--line);padding:24px}
.lab{margin:0 0 12px;font-size:13px;line-height:18px;color:var(--ink3)}
.orb{--s:44px;position:relative;display:inline-block;width:var(--s);height:var(--s);border-radius:50%;flex-shrink:0;
 background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.95) 0 7%,rgba(255,255,255,0) 20%),radial-gradient(circle at 72% 80%,rgba(255,255,255,.4) 0 6%,rgba(255,255,255,0) 22%),radial-gradient(circle at 50% 58%,#D6FF7A 0%,#A6EC3F 52%,#6CC81E 100%);
 box-shadow:inset 0 -4px 9px rgba(50,120,8,.38),inset 0 3px 6px rgba(255,255,255,.65),0 6px 16px -8px rgba(90,170,30,.7)}
.orb i{position:absolute;background:#1A2A0A}
.orb .l,.orb .r{top:38%;width:calc(var(--s)*.1);height:calc(var(--s)*.16);border-radius:99px;animation:blink 5s infinite}
.orb .l{left:32%}.orb .r{right:32%}
.orb .mo{left:50%;top:60%;width:calc(var(--s)*.26);height:calc(var(--s)*.12);transform:translateX(-50%);border-radius:0 0 99px 99px}
.orb.sm{--s:28px}.orb.xs{--s:36px}
@keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.12)}}

/* a centred moment: ready, rules, search, matches, hired */
.mid{display:flex;flex-direction:column;align-items:center;padding:24px 0 0;text-align:center}
.mid .h{max-width:20ch;margin-top:20px}
.mid .sub{max-width:52ch;margin-top:10px}
.mid .acts{justify-content:center;margin-top:28px}

/* ready: the three case studies */
.fan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;width:100%;max-width:760px;margin-top:36px;text-align:left}
.cs{display:flex;flex-direction:column;gap:28px;padding:20px;border-radius:20px;background:var(--well);box-shadow:inset 0 0 0 1px var(--line)}

/* rules */
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;max-width:880px;margin-top:36px;text-align:left}
.rule{display:flex;flex-direction:column;gap:14px;min-height:132px;padding:20px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .12s var(--e),background-color .12s var(--e)}
button.rule:hover{box-shadow:inset 0 0 0 1px var(--line2);background:var(--well)}
.rule .ico{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:11px;background:var(--well2);color:var(--ink)}
.rule input{width:100%;height:24px;color:var(--ink);border-radius:4px;box-shadow:0 2px 0 var(--ink)}
.rule .edit{margin-left:auto;color:var(--ink3)}

/* search: six teams, one verdict each */
.teams{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;width:100%;max-width:960px;margin-top:36px}
.team{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 10px 16px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);transition:opacity .3s var(--e),background-color .3s var(--e)}
.team .res{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:54px;opacity:0;transform:translateY(4px);transition:opacity .3s var(--e),transform .3s var(--e)}
.team.done .res{opacity:1;transform:none}
.team.done.off{background:var(--well)}
.team.done.off .lg{opacity:.55}
.tally{margin-top:24px;min-height:24px}

/* matches */
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;margin-top:36px;text-align:left}
.pick{position:relative;display:flex;flex-direction:column;gap:16px;padding:24px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .12s var(--e),opacity .12s var(--e)}
.pick.on{box-shadow:inset 0 0 0 2px var(--ink)}
.pick:not(.on){opacity:.62}
.pick .tick{position:absolute;top:20px;right:20px;display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:99px;box-shadow:inset 0 0 0 1.5px var(--line2);color:transparent;transition:background-color .12s var(--e),color .12s var(--e)}
.pick .tick::before{content:'';position:absolute;inset:-8px}
.pick.on .tick{background:var(--ink);color:#fff;box-shadow:none}
.pick .tick svg{width:16px;height:16px;stroke-width:2.5}
.ev{display:flex;flex-direction:column;gap:8px}
.ev li{display:flex;align-items:flex-start;gap:10px}
.ev li svg{margin-top:3px;color:var(--ink3)}
.ev li.y svg{color:var(--good)}
.ev li.n{color:var(--ink3)}
.to{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:4px}

/* home: the line, the introductions, the log */
.hero{display:flex;align-items:flex-start;gap:16px;padding:12px 0 28px}
.hero .sub{margin-top:6px}
.home{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:44px;align-items:start}
.lanes{display:flex;flex-direction:column;gap:12px}
.lane{padding:24px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.lane.need{box-shadow:inset 0 0 0 2px var(--ink)}
.lane.closed{background:var(--well)}
.lane .pay{text-align:right;flex-shrink:0}
.trk{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-top:24px}
.trk li{position:relative;display:flex;flex-direction:column;gap:10px;font-size:13px;line-height:18px;color:var(--ink3)}
.trk li::before{content:'';position:relative;z-index:1;width:14px;height:14px;border-radius:99px;background:#fff;box-shadow:inset 0 0 0 2px var(--line2)}
.trk li::after{content:'';position:absolute;top:6px;left:14px;right:0;height:2px;background:var(--line)}
.trk li:last-child::after{display:none}
.trk li.done{color:var(--ink)}
.trk li.done::before{background:var(--ink);box-shadow:none}
.trk li.done::after{background:var(--ink)}
.trk li.now{color:var(--ink)}
.trk li.now::before{background:var(--lime);box-shadow:inset 0 0 0 2px var(--ink),0 0 0 5px rgba(183,240,106,.4)}
.trk li.end{color:var(--ink3)}
.trk li.end::before{background:var(--ink4);box-shadow:none}
.stat{display:flex;align-items:center;gap:12px;margin-top:20px;padding:12px 16px 12px 12px;border-radius:14px;background:var(--well)}
.lane.closed .stat{background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.stat .m{text-align:right;flex-shrink:0}
.more{margin-top:16px}
.bars{display:flex;flex-direction:column;gap:12px}
.bars li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px}
.bars .bar{grid-column:1/-1;height:6px;border-radius:99px;background:var(--well2);overflow:hidden}
.bars .bar i{display:block;height:100%;border-radius:99px;background:var(--ink)}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slot{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1px var(--line2);transition:box-shadow .12s var(--e),background-color .12s var(--e)}
.slot:hover{background:var(--well)}
.slot.on{box-shadow:inset 0 0 0 2px var(--ink);background:#fff}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}
.kv{display:flex;flex-direction:column;gap:8px}
.kv li{display:flex;justify-content:space-between;gap:16px}
.kv li span:last-child{color:var(--ink3);flex-shrink:0;font-variant-numeric:tabular-nums}
.quote{padding:16px 20px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.quote blockquote{color:var(--ink)}
.quote figcaption{display:flex;align-items:center;gap:8px;margin-top:10px}
.fig{font:400 32px/38px var(--serif);letter-spacing:-.025em;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.log{display:flex;flex-direction:column;gap:16px}
.log li{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;align-items:center}
.badge{position:relative}
.badge b{position:absolute;right:-5px;bottom:-5px;display:flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:99px;background:var(--ink);color:#fff;box-shadow:0 0 0 2px #fff}
.badge b svg{width:10px;height:10px;stroke-width:2.5}
.side{position:sticky;top:0}

/* hired */
.path{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));width:100%;max-width:960px;margin-top:44px;text-align:left}
.path li{position:relative;display:flex;flex-direction:column;gap:10px;padding-right:12px}
.path li::after{content:'';position:absolute;top:17px;left:36px;right:0;height:2px;background:var(--ink)}
.path li:last-child::after{display:none}
.path .lg,.path .orb{position:relative;z-index:1}
.conf{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden}
.conf i{position:absolute;top:-12px;width:7px;height:12px;border-radius:2px;animation:fall 2.4s var(--e) forwards}
@keyframes fall{to{transform:translate3d(var(--dx),105vh,0) rotate(var(--r));opacity:.9}}

/* Priya's side */
.rc{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:16px;align-items:start}
.rc-list{display:flex;flex-direction:column;gap:2px;padding:8px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.rc-row{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:14px;transition:background-color .12s var(--e)}
.rc-row:hover{background:var(--well)}
.rc-row.on{background:var(--well2)}
.rc-row .grow>span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crit{display:flex;flex-direction:column;gap:16px}
.crit li{display:flex;align-items:flex-start;gap:12px}
.mk{position:relative;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:99px;flex-shrink:0;background:var(--well2);color:var(--ink3)}
.mk svg{width:14px;height:14px;stroke-width:2.25}
.mk.y{background:var(--goodbg);color:var(--good)}
.mk.p{background:var(--warnbg);color:var(--warn)}
.works{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.work{display:flex;flex-direction:column;gap:20px;padding:16px;border-radius:16px;background:var(--well);box-shadow:inset 0 0 0 1px var(--line)}
.sec{margin-top:32px}
.form{display:flex;flex-direction:column;gap:12px;margin-top:20px;padding:20px;border-radius:16px;background:var(--well)}
.field{display:flex;flex-direction:column;gap:6px}
.field input{height:44px;padding:0 14px;border-radius:12px;background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink3)}
.field input:focus{box-shadow:inset 0 0 0 2px var(--ink)}
.opt{height:36px;padding:0 14px;border-radius:99px;background:#fff;box-shadow:inset 0 0 0 1px var(--line2);font-size:13px;line-height:18px;color:var(--ink2);transition:box-shadow .12s var(--e)}
.opt.on{box-shadow:inset 0 0 0 2px var(--ink);color:var(--ink)}
.banner{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-top:20px;padding:14px 16px;border-radius:14px;background:var(--well)}
.seg{display:flex;padding:3px;border-radius:99px;background:var(--well2)}
.seg button{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:99px;font-size:13px;line-height:18px;color:var(--ink2);transition:background-color .12s var(--e),color .12s var(--e)}
.seg button svg{width:14px;height:14px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.tw{position:relative;padding:8px;overflow-x:auto;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.tb{width:100%;border-collapse:separate;border-spacing:0}
.tb th,.tb td{padding:12px;text-align:left;vertical-align:middle;white-space:nowrap;font-weight:400}
.tb thead th{font-size:13px;line-height:18px;color:var(--ink3)}
.tb tbody th{display:flex;align-items:center;gap:12px;min-width:230px}
.tb tbody tr{cursor:pointer}
.tb tbody tr:hover>*{background:var(--well)}
.tb tbody tr>*:first-child{border-radius:14px 0 0 14px}
.tb tbody tr>*:last-child{border-radius:0 14px 14px 0}

/* the pointer: try this */
.ptr{position:fixed;z-index:50;left:0;top:0;display:none;align-items:center;gap:6px;height:30px;padding:0 10px 0 12px;border-radius:99px;background:var(--ink);color:#fff;font-size:13px;line-height:18px;white-space:nowrap;pointer-events:none;box-shadow:0 10px 20px -10px rgba(19,20,23,.6)}
.ptr.on{display:flex;animation:bob 1s ease-in-out infinite alternate}
.ptr svg{width:14px;height:14px;stroke-width:2.25}
@keyframes bob{from{translate:0 0}to{translate:6px 0}}
.ptr.up.on{animation-name:bobv}
@keyframes bobv{from{translate:0 0}to{translate:0 6px}}
.ptr.rt{padding:0 12px 0 10px}
.ptr.rt.on{animation-name:bobr}
@keyframes bobr{from{translate:6px 0}to{translate:0 0}}

@media(max-width:1024px){
  body{overflow:auto}
  .app{display:block;height:auto}
  .guide{position:sticky;top:0;z-index:40;padding:10px 12px;background:var(--canvas);overflow:visible}
  .g-head,.steps,.g-foot{display:none}
  .g-bar{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:20px;background:#fff;box-shadow:0 0 0 1px var(--line),0 12px 24px -18px rgba(19,20,23,.4)}
  .stagewrap{padding:0 8px 8px}
  .sheet{height:auto;min-height:80dvh;border-radius:24px}
  .body{overflow:visible;padding:4px 16px 48px}
  .top{padding:0 16px}
  .home,.rc{grid-template-columns:minmax(0,1fr);gap:32px}
  .side{position:static}
  .picks,.rules{grid-template-columns:minmax(0,1fr)}
  .teams{grid-template-columns:repeat(3,minmax(0,1fr))}
  .path{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:24px}
}
@media(max-width:640px){
  .h,.fig{font-size:32px}
  .fan,.works,.slots,.two{grid-template-columns:minmax(0,1fr)}
  .teams{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lane,.card,.pick{padding:16px}
  .trk li{font-size:13px}
  .trk li span{display:none}
  .trk li.now span{display:block;white-space:nowrap}
  .hero{flex-wrap:wrap}
  .lane>.row{flex-wrap:wrap}
  .lane .pay{flex-basis:100%;padding-left:60px;text-align:left}
  .stat{flex-wrap:wrap}
  .stat .m{flex-basis:100%;text-align:left;padding-left:48px}
  .path{grid-template-columns:repeat(2,minmax(0,1fr))}
  .path li::after{display:none}
  .k,.s,.x{height:48px}
}
@media(prefers-reduced-motion:reduce){
  .page.in,.ptr.on,.conf i,.orb .l,.orb .r{animation:none}
  .team .res,.k,.s,.x,.st,.pick,.slot{transition:none}
}

</style>
</head>
<body>
<div class="app">
  <aside class="guide" id="guide" aria-label="Walkthrough"></aside>
  <div class="stagewrap">
    <div class="sheet">
      <header class="top" id="top"></header>
      <main class="body" id="body"></main>
    </div>
  </div>
</div>

<script>
/* ZERO Job Portal, the story build: one student, from portfolio ready to hired. */
const $=(q,e=document)=>e.querySelector(q),$$=(q,e=document)=>[...e.querySelectorAll(q)];
const fav=d=>`<img src="https://www.google.com/s2/favicons?sz=128&domain=${d}" alt="">`;
const ic=n=>`<i data-lucide="${n}"></i>`;
const icons=()=>{if(window.lucide)lucide.createIcons()};
const lg=(d,k='')=>`<span class="lg ${k}">${fav(d)}</span>`;
const av=(ini,tone='',k='')=>`<span class="av ${tone?'tone-'+tone:''} ${k}">${ini}</span>`;
const orb=(k='')=>`<span class="orb ${k}" role="img" aria-label="Zero"><i class="l"></i><i class="r"></i><i class="mo"></i></span>`;
const chip=(t,k='')=>`<span class="c ${k}">${t}</span>`;
const btn=(t,k,a,id='',x='')=>`<button class="${k}" type="button" data-a="${a}" data-id="${id}" ${x}>${t}</button>`;

const R={
 notion:{id:'notion',co:'Notion',dom:'notion.so',role:'Growth Analyst, Self-serve',place:'Remote, Canada',pay:'CA$72,000 to 84,000',who:'Priya Raman',first:'Priya',job:'Growth lead',ini:'PR',tone:'a',she:'she',her:'her',
  ev:[['y','You solved their exact funnel problem'],['y','You check significance before shipping'],['n','No Amplitude in your work yet']]},
 figma:{id:'figma',co:'Figma',dom:'figma.com',role:'Analyst, Go-to-market Operations',place:'Remote, North America',pay:'CA$74,000 to 88,000',who:'Dan Whitfield',first:'Dan',job:'GTM operations lead',ini:'DW',tone:'c',she:'he',her:'his',
  ev:[['y','You size an opportunity end to end'],['y','You always write the recommendation'],['n','No forecast pack in your work yet']]},
 klarna:{id:'klarna',co:'Klarna',dom:'klarna.com',role:'Business Analyst, Payments Operations',place:'Toronto, hybrid 2 days',pay:'CA$68,000 to 76,000',who:'Maya Chen',first:'Maya',job:'Recruiter',ini:'MC',tone:'b',she:'she',her:'her',
  ev:[['y','You priced a process like theirs'],['y','You found the biggest drop-off'],['n','No graded SQL yet']]},
};
const WORK=[['Signup Funnel Diagnosis','Notion','notion.so','Exceeds expectations'],['Support-Ticket Cost','Shopify','shopify.com','Meets expectations'],['Early-Churn Analysis','Spotify','spotify.com','Meets expectations']];
const TEAMS=[['notion.so','Notion',9,'g','1 fits',''],['figma.com','Figma',7,'g','1 fits',''],['klarna.com','Klarna',6,'g','1 fits',''],['spotify.com','Spotify',8,'w','Held','No salary posted'],['wealthsimple.com','Wealthsimple',5,'','Skipped','Hidden by you'],['intercom.com','Intercom',6,'','None fit','Outside your role']];
const SLOTS={notion:[['Thu 22 Oct','2:00 pm'],['Fri 23 Oct','10:30 am'],['Mon 26 Oct','9:00 am']],figma:[['Thu 29 Oct','11:00 am'],['Fri 30 Oct','3:00 pm'],['Mon 2 Nov','9:30 am']]};
const TR=['Sent','Opened','Asked to meet','Interview','Offer'];
const fresh=()=>({ch:0,edit:'',searched:false,pick:{notion:true,figma:true,klarna:true},pinned:false,sent:false,open:'',
 rules:{role:'Business analyst',where:'Toronto, or remote in Canada',office:'2 days at most',pay:'CA$60,000',start:'4 January',hide:'Wealthsimple'},
 n:{intro:'',slot:0,booked:false},f:{intro:'',slot:0,booked:false},fix:false,offer:'',ask:'',log:{},
 rc:{sel:'ron',view:'list',st:{},mode:'',why:{},line:{}}});
let S=fresh();

/* ═══ the story: eleven steps, each with one thing to try ═══ */
const CH=[
 {k:'ready',t:'Portfolio ready',d:'Mon 12 Oct',g:'You are Ron. You just finished your last scenario, so your portfolio is ready and Zero can introduce you to hiring teams.',try:'Press Start my search.',target:'[data-a="start"]'},
 {k:'rules',t:'Your rules',d:'Mon 12 Oct',g:'Zero only brings you roles that pass every rule. They came from your onboarding, so you check them once.',try:'Tap a rule to change it, then press These are right.',target:'[data-a="rulesok"]'},
 {k:'search',t:'Zero reads the roles',d:'Mon 12 Oct',g:'Zero reads every open role at the six teams hiring on ZERO and checks each one against your rules. You do nothing here.',try:'Watch, then press See my matches.',target:'[data-a="tomatches"]'},
 {k:'matches',t:'Three matches',d:'Mon 12 Oct',g:'Three roles passed. Each card says why it fits, using your graded work. Nothing is sent until you press the button.',try:'Press Send my work to 3 teams.',target:'[data-a="send"]',done:()=>S.sent,after:'Sent. Your work is with three people, and each row shows where it stands.',next:'Two days later'},
 {k:'opened',t:'Teams open it',d:'Wed 14 Oct',g:'Two days on. You can see who opened your work and when to expect a reply. Nothing needs you.',try:'Press See what Priya looked at.',target:'[data-a="open"][data-id="notion"]',done:()=>S.open==='notion',after:'That is what Priya read, and for how long. Now see the same moment from her side.',next:'See Notion’s side'},
 {k:'priya',t:'Priya at Notion',d:'Mon 19 Oct',g:'Now you are Priya, growth lead at Notion. Every Monday she gets a short batch of students, each judged against her brief.',try:'Read Ron’s evidence, then press Ask to meet Ron.',target:'[data-r="ask"]',up:true,done:()=>S.rc.st.ron==='asked',after:'Request sent. Ron’s full name stays hidden until he says yes.',next:'Back to Ron'},
 {k:'invite',t:'Notion wants to meet',d:'Mon 19 Oct',g:'Priya’s request arrives. Saying yes shares your name and email with her. Then you pick a time.',try:'Press Accept introduction, pick a time, then Confirm.',target:()=>S.n.intro==='accepted'?'[data-a="book"]':'[data-a="accept"]',done:()=>S.n.booked||S.n.intro==='declined',after:'Booked. It is in your calendar and Priya has been told.',next:'Interview week'},
 {k:'interview',t:'Interview day',d:'Wed 21 Oct',g:'The day before, Zero gives you what Priya is likely to ask. It comes from the rubric Notion scores this role on.',try:'Read the three questions.',target:null,done:()=>true,next:'After the interview'},
 {k:'result',t:'A no, then a yes',d:'Tue 27 Oct',g:'Notion said no, and Priya gave a reason. Zero turns it into one scenario that closes the gap. The same day, Dan at Figma asks to meet you.',try:'Accept Figma and pick a time. Then add the Amplitude scenario.',target:()=>!S.f.intro?'[data-a="accept"]':!S.f.booked?'[data-a="book"]':'[data-a="fix"]',done:()=>S.f.booked&&S.fix,after:'Booked with Dan. Two interviews follow over the next two weeks.',next:'Two weeks later'},
 {k:'offer',t:'The offer',d:'Mon 9 Nov',g:'Figma makes an offer. Zero shows how it compares, and never answers for you.',try:'Press Accept offer, then confirm.',target:()=>S.offer==='confirm'?'[data-a="acceptyes"]':'[data-a="acceptoffer"]',up:()=>S.offer==='confirm'},
 {k:'hired',t:'Hired',d:'Tue 10 Nov',g:'That is the whole path. 29 days from portfolio to offer, and nothing went out without your yes.',try:'Press Start over to run it again.',target:'.mid [data-g="restart"]'},
];
const cur=()=>CH[S.ch];
const isDone=c=>c.done?c.done():false;
const idx=k=>CH.findIndex(c=>c.k===k);
function ensure(n){if(n>2)S.searched=true;if(n>3)S.sent=true;if(n>5&&!S.rc.st.ron)S.rc.st.ron='asked';if(n>6&&!S.n.booked){S.n.intro='accepted';S.n.booked=true}if(n>8){S.fix=true;S.f.intro='accepted';S.f.booked=true}}
function go(n){n=Math.max(0,Math.min(CH.length-1,n));clearTimeout(S.timer);S.ch=n;ensure(n);S.open='';S.edit='';if(CH[n].k==='priya'&&S.rc.st.ron!=='asked')S.rc.sel='ron';render(true)}
function note(t,dom,icon){const k=cur().k;(S.log[k]=S.log[k]||[]).unshift([dom,icon,t,'Just now'])}

/* ═══ the guide ═══ */
function guideHTML(){const c=cur(),done=isDone(c);
 const body=done&&c.after?c.after:c.g;const tryText=done&&c.next?`Press ${c.next}.`:c.try;
 const next=c.next?`<button class="${done?'k':'s'} sm next" id="gnext" type="button" data-g="next">${c.next}${ic('arrow-right')}</button>`:'';
 return`<div class="g-head"><div><p class="i">How Ron gets a job</p><p class="m">One story, start to end. ${CH.length} steps.</p></div></div>
  <ol class="steps">${CH.map((x,i)=>`<li><button class="st ${i<S.ch?'done':i===S.ch?'on':''}" type="button" data-g="${i}" ${i===S.ch?'aria-current="step"':''}><span class="n">${i<S.ch?ic('check'):i+1}</span><span class="t">${x.t}</span><span class="m">${x.d.slice(4)}</span></button>${i===S.ch?`<div class="g-now"><p>${body}</p><p class="try">${ic('mouse-pointer-click')}<span>${tryText}</span></p>${S.pinned&&c.k==='matches'&&!S.sent?'<p class="m" style="margin-top:8px">This story follows Notion and Figma, so those two stay in.</p>':''}${next}</div>`:''}</li>`).join('')}</ol>
  <div class="g-foot">${S.ch?`<button class="x" type="button" data-g="restart">${ic('rotate-ccw')}Start over</button>`:''}</div>
  <div class="g-bar"><div class="row"><span class="c">Step ${S.ch+1} of ${CH.length}</span><p class="i grow">${c.t}</p></div><p>${body}</p><p class="row i">${ic('mouse-pointer-click')}<span>${tryText}</span></p><div class="acts">${S.ch?`<button class="s sm" type="button" data-g="prev">Back</button>`:''}${c.next?`<button class="${done?'k':'s'} sm" type="button" data-g="next">${c.next}</button>`:''}</div></div>`}
function topHTML(){const c=cur();const mark=$('#wordmark').innerHTML;
 return c.k==='priya'?`<div class="row">${mark}<span class="m">for hiring teams</span></div><div class="row">${lg('notion.so','xs')}<span class="i">Notion</span>${av('PR','a')}</div>`
  :`${mark}<div class="row"><span class="m">${c.d}</span>${av('RR','e')}</div>`}

/* ═══ first run: ready, rules, search, matches ═══ */
function readyHTML(){return`<div class="mid">${orb()}<h1 class="h">Your portfolio is ready.</h1><p class="sub">Three graded case studies. Zero can now introduce you to hiring teams, and nothing goes out without your yes.</p>
  <div class="fan">${WORK.map(w=>`<div class="cs"><div class="row">${lg(w[2],'sm')}<span class="m">ZERO scenario for ${w[1]}</span></div><div><p class="i">${w[0]}</p><p class="m">${w[3]}</p></div></div>`).join('')}</div>
  <div class="acts">${btn('Start my search','k','start')}</div></div>`}
const RULES=[['role','briefcase-business','Role',''],['where','map-pin','Where',''],['office','building-2','Days in the office',''],['pay','banknote','Salary floor','Private. Teams never see it.'],['start','calendar','Earliest start',''],['hide','eye-off','Hidden from','Where you interned.']];
function rulesHTML(){return`<div class="mid">${orb()}<h1 class="h">These are your rules.</h1><p class="sub">Zero only brings you roles that pass all six.</p>
  <div class="rules">${RULES.map(r=>{const on=S.edit===r[0];return`<${on?'div':'button type="button" data-a="rule" data-id="'+r[0]+'"'} class="rule"><div class="row"><span class="ico">${ic(r[1])}</span><span class="m">${r[2]}</span>${on?'':`<span class="edit">${ic('pencil')}</span>`}</div><div>${on?`<label class="hide" for="ruleIn">${r[2]}</label><input id="ruleIn" data-id="${r[0]}" value="${S.rules[r[0]]}" autocomplete="off">`:`<p class="i">${S.rules[r[0]]}</p>`}${r[3]?`<p class="m">${r[3]}</p>`:''}</div></${on?'div':'button'}>`}).join('')}</div>
  <div class="acts">${btn('These are right','k','rulesok')}</div></div>`}
function searchHTML(){const d=S.searched;return`<div class="mid">${orb()}<h1 class="h">${d?'Three roles pass every rule.':'Reading every open role.'}</h1><p class="sub" id="tally">${d?'41 roles read at 6 hiring teams.':'Six teams are hiring on ZERO this week.'}</p>
  <div class="teams">${TEAMS.map(t=>`<div class="team ${d?'done':''} ${t[3]==='g'?'':'off'}">${lg(t[0])}<div><p class="i">${t[1]}</p><p class="m">${t[2]} open roles</p></div><div class="res">${chip((t[3]==='g'?ic('check'):'')+t[4],t[3])}<span class="m">${t[5]||'Passes all six'}</span></div></div>`).join('')}</div>
  <div class="acts" id="searchgo" ${d?'':'hidden'}>${btn('See my matches','k','tomatches')}</div></div>`}
function runSearch(){if(S.searched)return;const tiles=$$('.team');let i=0;const step=()=>{if(cur().k!=='search')return;if(i<tiles.length){tiles[i++].classList.add('done');S.timer=setTimeout(step,430)}else{S.searched=true;$('.mid .h').textContent='Three roles pass every rule.';$('#tally').textContent='41 roles read at 6 hiring teams.';$('#searchgo').hidden=false;point()}};S.timer=setTimeout(step,700)}
function matchesHTML(){const n=Object.values(S.pick).filter(Boolean).length;
 return`<div class="mid">${orb()}<h1 class="h">Three teams fit your work.</h1><p class="sub">They see your work first. Your name stays hidden until you both say yes.</p>
  <div class="picks">${Object.values(R).map(r=>`<div class="pick ${S.pick[r.id]?'on':''}"><button class="tick" type="button" role="checkbox" aria-checked="${S.pick[r.id]}" aria-label="Send to ${r.co}" data-a="pick" data-id="${r.id}">${ic('check')}</button>
   ${lg(r.dom)}<div><h2 class="i">${r.role}</h2><p class="m">${r.co} · ${r.place}</p></div><p class="i">${r.pay}</p>
   <ul class="ev">${r.ev.map(e=>`<li class="${e[0]}">${ic(e[0]==='y'?'check':'circle-dashed')}<span>${e[1]}</span></li>`).join('')}</ul>
   <div class="to">${av(r.ini,r.tone)}<div><p class="i">${r.who}</p><p class="m">${r.job}. Gets your work.</p></div></div></div>`).join('')}</div>
  <div class="acts">${btn(`Send my work to ${n} team${n===1?'':'s'}`,'k','send','',n?'':'disabled')}</div></div>`}

/* ═══ home: one line, the introductions, the log ═══ */
function lanes(){const k=cur().k,L=[];const P=id=>S.pick[id];
 const add=(id,at,stat,when,o={})=>{if(P(id))L.push({id,at,stat,when,...o})};
 if(k==='matches')Object.values(R).forEach(r=>add(r.id,0,`Sent just now. ${r.first} usually opens new work within 2 days.`,'Reply by Mon 19 Oct'));
 if(k==='opened'){add('notion',1,'Priya opened it yesterday. Six minutes on your funnel work.','Reply by Mon 19 Oct',{body:laneOpen('notion')});add('klarna',1,'Maya opened it this morning.','Reply by Tue 20 Oct');add('figma',0,'Not opened yet. Zero asks Dan on Friday.','Sent 2 days ago')}
 if(k==='invite'){const n=S.n,sl=SLOTS.notion[n.slot];
  if(n.intro==='declined')add('notion',2,'You declined. Priya has been told, with thanks.','',{end:'Declined'});
  else if(n.booked)add('notion',3,`First round with Priya. ${sl[0]}, ${sl[1]}.`,'45 minutes on Google Meet');
  else add('notion',2,n.intro==='accepted'?'Priya has your name. Pick a time below.':'Priya read your funnel work twice and wants to talk.','Asked today',{need:true,body:n.intro==='accepted'?slotsHTML('notion'):introHTML('notion')});
  add('figma',1,'Dan opened it on Friday, after Zero asked.','Reply by Thu 22 Oct');add('klarna',1,'Opened 5 days ago. No reply yet.','Zero asks Maya again on Wed')}
 if(k==='interview'){add('notion',3,'First round with Priya. Tomorrow, 2:00 pm.','45 minutes on Google Meet',{need:true,body:prepHTML()});add('figma',1,'Dan replied. He is reading your cost model this week.','Reply by Mon 26 Oct');add('klarna',1,'No reply in 9 days. Zero has asked twice.','Zero stops waiting on Mon 26 Oct')}
 if(k==='result'){const f=S.f,sl=SLOTS.figma[f.slot];
  if(f.intro==='declined')add('figma',2,'You declined. Dan has been told, with thanks.','',{end:'Declined'});
  else if(f.booked)add('figma',3,`Take-home review with Dan. ${sl[0]}, ${sl[1]}.`,'30 minutes on Zoom');
  else add('figma',2,f.intro==='accepted'?'Dan has your name. Pick a time below.':'Dan read your cost model end to end and wants to talk.','Asked today',{need:true,body:f.intro==='accepted'?slotsHTML('figma'):introHTML('figma')});
  add('notion',3,'Notion passed after your interview.','Told you Mon 26 Oct',{end:'Passed',body:reasonHTML()});add('klarna',1,'No reply after 14 days. Zero asked twice, then stopped.','',{end:'No reply'})}
 if(k==='offer'){if(S.offer==='declined')add('figma',4,'You declined the offer. Dan has been told, with thanks.','',{end:'Declined'});else add('figma',4,S.offer==='asked'?`You asked for ${S.ask}. Dan has until Friday.`:'Dan sent an offer this morning.',S.offer==='asked'?'Waiting on Dan':'Answer by Fri 13 Nov',{need:true,body:offerHTML()});
  add('notion',3,'Passed after your interview. Priya gave a reason.','',{end:'Passed'});add('klarna',1,'No reply after 14 days.','',{end:'No reply'})}
 return L}
function heroLine(){const k=cur().k,n=S.n,f=S.f;const count=Object.values(S.pick).filter(Boolean).length;
 if(k==='matches')return[`Your work is with ${['no','one','two','three'][count]} team${count===1?'':'s'}.`,'Nothing needs you now. Zero checks on them every morning.'];
 if(k==='opened')return['Nothing needs you today.','Notion and Klarna opened your work. Figma has not yet.'];
 if(k==='invite')return n.intro==='declined'?['You declined Notion.','Figma and Klarna still have your work.']:n.booked?[`You meet Priya on ${SLOTS.notion[n.slot][0]} at ${SLOTS.notion[n.slot][1]}.`,'The day before, Zero sends what she is likely to ask.']:n.intro==='accepted'?['Priya has your name now.','Pick a time that works.']:['Notion wants to meet you.','Say yes and Priya gets your name. Then you pick a time.'];
 if(k==='interview')return['You meet Priya tomorrow at 2:00 pm.','Here is what she is likely to ask.'];
 if(k==='result')return f.intro==='declined'?['You declined Figma.','Notion said no and told you why.']:f.booked?[`You meet Dan on ${SLOTS.figma[f.slot][0]} at ${SLOTS.figma[f.slot][1]}.`,S.fix?'The Amplitude scenario is on your pathway.':'Notion said no and told you why.']:f.intro==='accepted'?['Dan has your name now.','Pick a time that works.']:['Notion said no, and told you why.','Figma wants to meet you.'];
 return S.offer==='declined'?['You declined Figma’s offer.','Zero is watching the other teams again.']:S.offer==='asked'?[`You asked Figma for ${S.ask}.`,'Dan has until Friday. The offer stays open.']:['Figma made you an offer.','It runs until Fri 13 Nov. Nothing is answered without you.']}
