:root{
  --bg:#F8F7F5; --sheet:#F8F7F5; --card:#FFFFFF; --field:#F1F0ED; --wash:#FAF9F7; --sunk:#EDEBE7;
  --line:rgba(26,25,23,.09); --line2:rgba(26,25,23,.05);
  --tx:#1A1917; --tx2:#5D5A54; --tx3:#928E86; --tx4:#BDB8AF;
  --ink:#141312; --onink:#fff;
  --ok:#0E8A4C; --okbg:#E9F6EE; --amb:#8A6A0E; --ambbg:#FBF3DE; --pur:#6A48C4; --purbg:#F1ECFB;
  --f:'Google Sans Flex','Google Sans',-apple-system,system-ui,sans-serif;
  --serif:'STK Bureau Serif',Georgia,serif;
  --pill:999px;
  --sh1:0 1px 2px rgba(26,25,23,.035);
  --sh2:0 2px 8px rgba(26,25,23,.05),0 16px 40px -24px rgba(26,25,23,.24);
  --sh3:0 30px 80px rgba(26,25,23,.20);
  --rail:0px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--f);font-size:14px;letter-spacing:-.016em;-webkit-font-smoothing:antialiased;font-synthesis:none;overflow:hidden}
body.zdark{background:#0D0D0F;color:#F4F4F3}
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:none;outline:none}
input::placeholder{color:var(--tx3)}
svg{display:block}svg.lucide,[data-lucide]{width:16px;height:16px;stroke-width:1.75}
*{scrollbar-width:none}::-webkit-scrollbar{width:0;height:0}
::selection{background:#BCF280;color:#0a0a0a}
.zhide{display:none!important}

/* ══ product chrome: rail + sheet + aside ══ */
.zrail{position:fixed;left:0;top:0;bottom:0;width:var(--rail);display:none;flex-direction:column;align-items:center;padding:22px 0 20px;z-index:20}
body.zapp .zrail{display:none}
.zrail .mark{font-weight:800;font-size:17px;letter-spacing:-.07em;margin-bottom:44px}
.zrail nav{display:flex;flex-direction:column;gap:4px;width:100%;align-items:center}
.zrail a{width:60px;padding:11px 0 9px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--tx3);font-size:9.5px;font-weight:600;letter-spacing:.02em;transition:color .2s,background .2s;cursor:pointer}
.zrail a:hover{color:var(--tx2)}
.zrail a.on{color:var(--tx)}
.zrail a svg{width:17px;height:17px}
.zrail .foot{margin-top:auto}

.zstage{position:fixed;inset:0;display:none}
body.zapp .zstage{display:block}
.zsheet{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.zaside{display:none}

/* sheet header */
.zshead{flex-shrink:0;height:74px;display:flex;align-items:center;padding:0 28px;gap:14px}
.zback{width:36px;height:36px;border-radius:99px;background:var(--card);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;color:var(--tx2);flex-shrink:0;transition:background .2s}
.zback:hover{background:var(--field)}
.zseg{margin:0 auto;display:flex;gap:2px;padding:0}
.zseg button{height:34px;padding:0 15px;border-radius:var(--pill);font-size:14px;font-weight:500;color:var(--tx3);position:relative;white-space:nowrap;transition:background .2s,color .2s}
.zseg button:hover{color:var(--tx)}
.zseg button.on{background:var(--field);color:var(--tx);font-weight:600}
.zseg .zdot{position:absolute;top:4px;right:7px;width:5px;height:5px;border-radius:99px;background:var(--amb)}
.zlevel{display:flex;align-items:center;gap:9px;flex-shrink:0}
.zring{width:34px;height:34px;border-radius:99px;background:conic-gradient(#E8B93C 0turn 0.66turn,var(--field) 0.66turn 1turn);display:flex;align-items:center;justify-content:center}
.zring::after{content:'';width:26px;height:26px;border-radius:99px;background:var(--bg)}
.zring span{position:absolute;font-size:11px;font-weight:700}
.zlevel .lv{line-height:1.1}
.zlevel .lv b{display:block;font-size:12.5px;font-weight:700}
.zlevel .lv i{display:block;font-size:9.5px;font-style:normal;color:var(--tx3);font-weight:600;letter-spacing:.04em}
.zsbody{flex:1;overflow-y:auto;padding:0 24px 90px}
.zin{width:100%;max-width:800px;min-width:0;margin:0 auto}
.zin.wide{max-width:800px}

/* ══ type ══ */
.zserif{font-family:var(--serif);font-weight:400;letter-spacing:-.028em}
.ztitle{font-family:var(--serif);font-weight:400;font-size:32px;letter-spacing:-.03em;line-height:1.14;text-align:left}
.zsecl{font-size:15px;font-weight:600;color:var(--tx);display:flex;align-items:center;justify-content:space-between;margin:0 0 14px;letter-spacing:-.018em}
.zminl{font-size:10.5px;font-weight:700;color:var(--tx3);letter-spacing:.08em}
.zmuted{color:var(--tx3)}

/* ══ atoms ══ */
.zbtn{height:38px;padding:0 18px;border-radius:var(--pill);font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;flex-shrink:0;transition:background .18s,color .18s,border-color .18s,opacity .18s,transform .15s}
.zbtn:active{transform:scale(.98)}
.zbtn.dark{background:var(--ink);color:var(--onink)}.zbtn.dark:hover{opacity:.87}
.zbtn.line{background:var(--card);border:1px solid var(--line);color:var(--tx)}.zbtn.line:hover{background:var(--field)}
.zbtn.ghost{color:var(--tx2)}.zbtn.ghost:hover{background:var(--field);color:var(--tx)}
.zbtn.sm{height:32px;padding:0 13px;font-size:12.5px}
.zbtn.lg{height:50px;padding:0 26px;font-size:15.5px}
.zbtn:disabled{opacity:.4;pointer-events:none}
.zbtn svg{width:15px;height:15px}
.zic{width:34px;height:34px;border-radius:99px;background:var(--card);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;color:var(--tx2);flex-shrink:0;transition:background .2s,color .2s}
.zic:hover{background:var(--field);color:var(--tx)}
.ztag{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:8px;font-size:11.5px;font-weight:500;background:var(--field);color:var(--tx2);white-space:nowrap;flex-shrink:0;line-height:1}
.ztag svg{width:11px;height:11px;stroke-width:2.2}
.ztag.ok{background:var(--okbg);color:var(--ok);font-weight:600}
.ztag.amb{background:var(--ambbg);color:var(--amb);font-weight:600}
.ztag.pur{background:var(--purbg);color:var(--pur);font-weight:600}
.ztag.dk{background:var(--ink);color:var(--onink);font-weight:600}
.ztag.out{background:transparent;border:1px solid var(--line);color:var(--tx2)}
.ztag.dsh{background:transparent;border:1px dashed var(--tx4);color:var(--tx3)}
.zsw{width:36px;height:21px;border-radius:99px;background:var(--tx4);position:relative;transition:background .2s;flex-shrink:0}
.zsw::after{content:'';position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:99px;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.zsw.on{background:var(--ok)}.zsw.on::after{transform:translateX(15px)}
.zcard{background:var(--card);border:1px solid var(--line2);border-radius:18px}
.zlogo2{border-radius:11px;background:var(--card);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;color:var(--tx3)}
.zlogo2 img{object-fit:contain}
.zlogo2.s40{width:40px;height:40px}.zlogo2.s40 img{width:21px;height:21px}
.zlogo2.s34{width:34px;height:34px;border-radius:10px}.zlogo2.s34 img{width:18px;height:18px}
.zlogo2.s46{width:46px;height:46px;border-radius:14px}.zlogo2.s46 img{width:24px;height:24px}
.zqi{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.45;padding:6px 0}
.zqi svg{width:15px;height:15px;flex-shrink:0;margin-top:1px}
.zqi.y svg{color:var(--ok)}.zqi.p svg{color:var(--amb)}.zqi.n svg{color:var(--tx4)}.zqi.n{color:var(--tx3)}
.zqi .ev{display:block;font-size:11.5px;color:var(--tx3);margin-top:2px}
.zarr{opacity:0;transform:translateY(14px);filter:blur(7px);transition:all .55s cubic-bezier(.2,.6,.3,1)}
.zarr.in{opacity:1;transform:none;filter:none}

/* ══ company row ══ */
.zcos{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
.zco{width:158px;height:112px;border-radius:18px;flex-shrink:0;position:relative;overflow:hidden;cursor:pointer;transition:transform .22s cubic-bezier(.2,.8,.3,1)}
.zco:hover{transform:translateY(-3px)}
.zco .pl{position:absolute;left:10px;bottom:10px;height:28px;padding:0 12px 0 8px;border-radius:99px;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600}
.zco .pl img{width:15px;height:15px;border-radius:4px}
.zco .n{position:absolute;right:10px;top:10px;height:22px;padding:0 8px;border-radius:99px;background:rgba(20,19,18,.72);color:#fff;font-size:10.5px;font-weight:600;display:flex;align-items:center}

/* ══ jobs: list + floating detail ══ */
.zjcols{display:block}
.zjlist{width:100%;display:flex;flex-direction:column;gap:10px}
.zjc{background:var(--card);border-radius:18px;padding:20px 22px;cursor:pointer;border:1px solid var(--line2);transition:border-color .18s,transform .18s}
.zjc:hover{border-color:var(--line);transform:translateY(-1px)}
.zjc.on{border-color:var(--line2)}
.zjc .top{display:flex;gap:11px;align-items:flex-start}
.zjc .co{font-size:13px;color:var(--tx3);display:flex;align-items:center;gap:6px}
.zjc .co i{width:5px;height:5px;border-radius:99px;background:var(--ok);display:block}
.zjc .ti{font-size:16.5px;font-weight:600;letter-spacing:-.022em;line-height:1.3;margin-top:3px}
.zjc .lo{font-size:13.5px;color:var(--tx2);margin-top:7px;display:flex;align-items:center;gap:6px}
.zjc .lo svg{width:11px;height:11px}
.zjc .tags{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.zjsave{margin-left:auto;color:var(--tx4);flex-shrink:0}
.zjsave:hover{color:var(--tx)}
.zjsave.on{color:var(--tx)}
.zjd{width:100%}
.zjd .hd{display:flex;gap:18px;align-items:flex-start}
.zjd .t{font-family:var(--serif);font-size:30px;letter-spacing:-.03em;line-height:1.14}
.zjd .pay{font-family:var(--serif);font-size:22px;letter-spacing:-.02em;white-space:nowrap;margin-left:auto;padding-top:2px}
.zjd .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--tx3);margin-top:7px;align-items:center}
.zjd .meta span{display:inline-flex;align-items:center;gap:5px}
.zjd .meta svg{width:12px;height:12px}
.zjd .acts{display:flex;gap:9px;align-items:center;margin-top:20px;flex-wrap:wrap}
.zjd .why{margin-top:24px;background:var(--okbg);border-radius:18px;padding:20px 22px}
.zjd .why.pur{background:var(--purbg)}
.zjd .why .wt{font-size:12.5px;font-weight:600;color:var(--ok);display:flex;align-items:center;gap:7px;margin-bottom:7px}
.zjd .why.pur .wt{color:var(--pur)}
.zjd .why p{font-size:14px;line-height:1.6}
.zjd .why .src{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.zjd .sec{margin-top:26px}
.zjd .sec .h{font-size:14px;font-weight:600;letter-spacing:-.02em;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.zjd .g2{display:grid;grid-template-columns:1fr 1fr;gap:2px 24px}
.zjd ul{font-size:13.5px;line-height:1.7;color:var(--tx2)}
.zjd li{margin-left:17px;margin-bottom:5px}
.zsteps{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:6px 18px}
.zstep{display:flex;align-items:center;gap:11px;padding:11px 0;font-size:13px}
.zstep+.zstep{box-shadow:0 -1px 0 var(--line2)}
.zstep .mk{width:19px;height:19px;border-radius:99px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--tx4);color:transparent}
.zstep.done .mk{background:var(--ok);border-color:var(--ok);color:#fff}
.zstep.done .mk svg{width:10px;height:10px;stroke-width:3.2}
.zstep.todo .mk{border-style:dashed;border-color:var(--amb)}
.zstep .sl{flex:1}.zstep .sn{font-weight:500}
.zstep .ss{font-size:11.5px;color:var(--tx3);margin-top:1px}
.zbar{height:3px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:7px}
.zbar i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .6s cubic-bezier(.625,.05,0,1)}

/* ══ aside ══ */
.zaside .grp{margin-bottom:22px}
.zaside .gh{display:flex;align-items:center;justify-content:space-between;padding:0 10px 9px}
.zupd{display:flex;gap:11px;padding:9px 10px;border-radius:14px;cursor:pointer;transition:background .18s}
.zupd:hover{background:rgba(255,255,255,.6)}
.zupd .th{width:42px;height:42px;border-radius:11px;flex-shrink:0;background:var(--sunk);overflow:hidden;display:flex;align-items:center;justify-content:center}
.zupd .th img{width:20px;height:20px}
.zupd .tx{font-size:12.5px;line-height:1.4}
.zupd .tx b{font-weight:600}
.zupd .tm{font-size:10.5px;color:var(--tx3);margin-top:3px}
.zdotlive{width:6px;height:6px;border-radius:99px;background:var(--ok);flex-shrink:0;align-self:center}

/* ══ home / applications rows ══ */
.zrows{display:flex;flex-direction:column;gap:8px}
.zrow{display:flex;align-items:center;gap:14px;padding:18px 20px;background:var(--card);border:1px solid var(--line2);border-radius:16px;transition:border-color .18s,transform .18s}
.zrow[data-open]:hover,.zrow[data-app]:hover{border-color:var(--line);transform:translateY(-1px)}
.zrow .t{font-size:14px;font-weight:600;letter-spacing:-.015em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.zrow .s{font-size:12.5px;color:var(--tx3);margin-top:3px}
.zrow .grow{flex:1;min-width:0}
.zdate{width:54px;flex-shrink:0;text-align:center;background:var(--field);border-radius:12px;padding:8px 0}
.zdate b{display:block;font-size:18px;font-weight:600;letter-spacing:-.02em;line-height:1}
.zdate i{display:block;font-style:normal;font-size:10px;color:var(--tx3);font-weight:600;margin-bottom:2px}
.ztabs{display:inline-flex;gap:4px}
.ztabs button{padding:7px 13px;border-radius:99px;font-size:13px;font-weight:500;color:var(--tx3);transition:background .2s,color .2s}
.ztabs button:hover{color:var(--tx2)}
.ztabs button.on{color:var(--tx);font-weight:600;background:var(--field)}
.ztabs button sup{font-size:10px;font-weight:600;margin-left:3px;opacity:.6}
.zsum{background:var(--card);border:1px solid var(--line2);border-radius:20px;padding:28px 30px}
.zsum .big{font-family:var(--serif);font-size:23px;line-height:1.4;letter-spacing:-.025em}
.zsum .sm{font-size:14px;line-height:1.6;color:var(--tx2);margin-top:12px}
.zwork{display:flex;gap:10px;padding:11px 0;align-items:flex-start}
.zwork+.zwork{box-shadow:0 -1px 0 var(--line2)}
.zwork .d{width:6px;height:6px;border-radius:99px;flex-shrink:0;margin-top:6px;background:var(--tx4)}
.zwork .d.live{background:var(--ok);animation:zp 1.6s infinite}
.zwork .d.done{background:var(--ok)}.zwork .d.wait{background:var(--amb)}
@keyframes zp{0%,100%{opacity:1}50%{opacity:.25}}
.zwork .tx{font-size:12.5px;line-height:1.5;flex:1}
.zwork .tm{font-size:10.5px;color:var(--tx3);margin-top:2px}

/* ══ flow screens (welcome / talk / build / auto) ══ */
.zscr{position:fixed;inset:0;display:none;z-index:10}
.zscr.on{display:block}
.zmid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:80px 24px 150px}
.zq{font-family:var(--serif);font-weight:400;font-size:clamp(26px,2.1vw,38px);letter-spacing:-.03em;line-height:1.16;text-align:center;text-wrap:balance;max-width:24ch;margin:0 auto}
.zq .w{display:inline-block;opacity:0;transform:translateY(24px);filter:blur(9px);transition:opacity .7s cubic-bezier(.2,.6,.3,1),transform .7s cubic-bezier(.2,.6,.3,1),filter .7s cubic-bezier(.2,.6,.3,1)}
.zq .w.in{opacity:1;transform:none;filter:none}
.zopts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:660px;margin:40px auto 0;opacity:0;transform:translateY(12px);filter:blur(6px);transition:all .5s cubic-bezier(.2,.6,.3,1);pointer-events:none}
.zopts.in{opacity:1;transform:none;filter:none;pointer-events:auto}
.zopt{height:48px;padding:0 22px;border-radius:var(--pill);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#F4F4F3;font-size:15px;font-weight:500;display:inline-flex;align-items:center;gap:9px;transition:transform .26s cubic-bezier(.2,.8,.3,1),background .2s,color .2s}
.zopt:hover{transform:translateY(-3px);background:rgba(255,255,255,.12)}
.zopt.on{background:#F4F4F3;color:#141312;border-color:transparent}
body:not(.zdark) .zopt{background:var(--card);border-color:var(--line);color:var(--tx)}
body:not(.zdark) .zopt:hover{background:var(--card)}
body:not(.zdark) .zopt.on{background:var(--ink);color:#fff}
.zopt svg{width:16px;height:16px}
.zflowhd{position:fixed;top:0;left:0;right:0;height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;z-index:12}
.zbeats{display:flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:99px;background:rgba(255,255,255,.08)}
body:not(.zdark) .zbeats{background:var(--field)}
.zbeats i{width:5px;height:4px;border-radius:2px;background:currentColor;opacity:.3;transition:width .5s cubic-bezier(.625,.05,0,1),opacity .5s}
.zbeats i.on{width:17px;opacity:1}.zbeats i.past{opacity:.5}
.zdock{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 24px 30px;z-index:12;pointer-events:none}
.zdock>*{pointer-events:auto}
.zveil{position:fixed;inset:0;z-index:60;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .55s}
.zveil.on{opacity:1;transition:opacity .35s}

/* talk dock: mic, keyboard, live transcript */
.zdock .din{display:flex;align-items:center;gap:12px}
.zmic{width:64px;height:64px;border-radius:99px;background:#F4F4F3;color:#141312;display:flex;align-items:center;justify-content:center;position:relative;transition:transform .2s cubic-bezier(.2,.8,.3,1)}
body:not(.zdark) .zmic{background:var(--ink);color:var(--onink)}
.zmic:hover{transform:scale(1.05)}
.zmic svg{width:24px;height:24px}
.zmic.rec::after{content:'';position:absolute;inset:-7px;border-radius:99px;border:2px solid currentColor;opacity:.5;animation:zring 1.15s ease-out infinite}
@keyframes zring{from{transform:scale(.88);opacity:.55}to{transform:scale(1.42);opacity:0}}
.zghost{width:48px;height:48px;border-radius:99px;background:rgba(255,255,255,.08);color:rgba(244,244,243,.55);display:flex;align-items:center;justify-content:center;transition:color .2s,background .2s}
body:not(.zdark) .zghost{background:var(--field);color:var(--tx3)}
.zghost:hover{color:#fff}
body:not(.zdark) .zghost:hover{color:var(--tx)}
.zghost svg{width:19px;height:19px}
.ztf{display:flex;align-items:center;gap:10px;height:64px;padding:0 9px 0 26px;background:rgba(255,255,255,.08);border-radius:99px;width:min(440px,46vw)}
body:not(.zdark) .ztf{background:var(--field)}
.ztf input{flex:1;font-size:16.5px;min-width:0}
.ztfs{width:46px;height:46px;border-radius:99px;background:#F4F4F3;color:#141312;display:flex;align-items:center;justify-content:center;opacity:.28;flex-shrink:0;transition:opacity .2s}
body:not(.zdark) .ztfs{background:var(--ink);color:var(--onink)}
.ztfs.on{opacity:1}
.ztfs svg{width:17px;height:17px}
.zrec{display:flex;align-items:center;gap:14px;height:64px;padding:0 24px;background:rgba(255,255,255,.08);border-radius:99px}
body:not(.zdark) .zrec{background:var(--field)}
.zwave{display:flex;align-items:center;gap:3px;height:30px;width:min(240px,26vw)}
.zwave span{flex:1;height:5px;border-radius:2px;background:currentColor;opacity:.45;transition:height .12s ease}
.ztime{font-size:13.5px;opacity:.6;font-variant-numeric:tabular-nums;min-width:34px}
.ztr{position:fixed;left:0;right:0;bottom:124px;display:flex;justify-content:center;padding:0 24px;pointer-events:none;z-index:11}
.ztr .in{max-width:min(540px,46vw);font-size:16px;line-height:1.5;text-align:center;color:rgba(244,244,243,.42)}
body:not(.zdark) .ztr .in{color:var(--tx3)}
.ztr .in b{font-weight:500;color:#F4F4F3}
body:not(.zdark) .ztr .in b{color:var(--tx)}
.zbackq{position:fixed;left:28px;bottom:40px;z-index:12;display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:99px;font-size:13.5px;color:rgba(244,244,243,.42);transition:color .2s,background .2s}
body:not(.zdark) .zbackq{color:var(--tx3)}
.zbackq:hover{color:#F4F4F3;background:rgba(255,255,255,.07)}
body:not(.zdark) .zbackq:hover{color:var(--tx);background:var(--field)}
.zbackq svg{width:14px;height:14px}
/* portfolio: native + editor + right rail */
.pfbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:8px 0 22px}
.pfemps{display:flex;align-items:center;gap:7px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:11px 14px;margin-bottom:16px}
.pfhero{display:flex;gap:20px;align-items:flex-start;background:var(--card);border:1px solid var(--line2);border-radius:20px;padding:26px 28px;position:relative}
.pfav{width:62px;height:62px;border-radius:99px;background:linear-gradient(150deg,#EAE4D9,#CFC5B4);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:22px;color:rgba(26,25,23,.5);flex-shrink:0}
.pfname{font-family:var(--serif);font-weight:400;font-size:26px;letter-spacing:-.028em;line-height:1.1}
.pfheadline{font-family:var(--serif);font-size:19px;line-height:1.35;letter-spacing:-.02em;margin-top:12px}
.pfabout{font-size:14.5px;line-height:1.65;color:var(--tx2);margin-top:10px;max-width:60ch}
.pfsec{margin-top:30px}
.pfhd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.pfhd h2{font-size:15px;font-weight:600;letter-spacing:-.018em}
.pfacts{display:flex;align-items:center;gap:8px}
.pfshare{width:30px;height:30px;border-radius:99px;border:1px solid var(--line2);background:var(--card);color:var(--tx3);display:flex;align-items:center;justify-content:center}
.pfshare.on{color:var(--ok);border-color:rgba(14,138,76,.25)}
.pfitem{position:relative;background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:18px 20px}
.pfitem+.pfitem{margin-top:10px}
.pfedit{position:absolute;top:12px;right:12px}

/* ══ the story ══ */
/* Zero: a candy-lime jelly circle with a face. Blinks when idle, looks around when thinking, talks when replying. */
.orb{--s:30px;position:relative;display:inline-block;width:var(--s);height:var(--s);border-radius:50%;flex-shrink:0;
 background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.95) 0 7%,rgba(255,255,255,0) 20%),radial-gradient(circle at 72% 80%,rgba(255,255,255,.4) 0 6%,rgba(255,255,255,0) 22%),radial-gradient(circle at 50% 58%,#D6FF7A 0%,#A6EC3F 52%,#6CC81E 100%);
 box-shadow:inset 0 -4px 9px rgba(50,120,8,.38),inset 0 3px 6px rgba(255,255,255,.65),0 6px 16px -8px rgba(90,170,30,.7);animation:orbJelly 4.2s ease-in-out infinite}
.orb.sm{--s:22px}.orb.md{--s:38px}.orb.big{--s:96px}
.orb .eye{position:absolute;top:38%;width:calc(var(--s)*.1);height:calc(var(--s)*.16);border-radius:99px;background:#1A2A0A;animation:orbBlink 5s infinite}
.orb .eye.l{left:32%}.orb .eye.r{right:32%}
.orb .mouth{position:absolute;left:50%;top:60%;width:calc(var(--s)*.26);height:calc(var(--s)*.12);transform:translateX(-50%);border-radius:0 0 99px 99px;background:#1A2A0A;transform-origin:50% 0}
.orb.think{animation:orbJelly 1.1s ease-in-out infinite}
.orb.think .eye{animation:orbLook 1.6s ease-in-out infinite}
.orb.talk .mouth{animation:orbTalk .26s ease-in-out infinite alternate}
.orb.wait .eye{height:calc(var(--s)*.18)}
@keyframes orbJelly{0%,100%{transform:scale(1,1)}30%{transform:scale(1.05,.95)}60%{transform:scale(.97,1.03)}}
@keyframes orbBlink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.12)}}
@keyframes orbLook{0%,100%{transform:translateX(0)}30%{transform:translateX(calc(var(--s)*-.05))}70%{transform:translateX(calc(var(--s)*.05))}}
@keyframes orbTalk{from{transform:translateX(-50%) scaleY(.35)}to{transform:translateX(-50%) scaleY(1.1)}}

.shim{position:relative;color:var(--tx3)}
.shim::after{content:attr(data-t);position:absolute;inset:0;color:transparent;background:linear-gradient(100deg,transparent 30%,var(--tx) 50%,transparent 70%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;animation:zsw 1.5s linear infinite}
.clk{margin-left:8px;color:var(--tx4);font-variant-numeric:tabular-nums;font-size:13px}

/* thinking trace and tool calls, collapsible */
.think,.tools{font-size:14px}
.thd{display:inline-flex;align-items:center;gap:6px;height:28px;color:var(--tx3);font-size:14px;border-radius:8px;padding:0 6px 0 0;transition:color .2s}
.thd:hover{color:var(--tx)}
.thd svg{width:15px;height:15px}.thd svg:last-child{width:14px;height:14px;transition:transform .25s}
.think.open .thd svg:last-child,.tools.open .thd svg:last-child{transform:rotate(180deg)}
.spk{display:inline-flex;color:var(--tx3)}
.tsteps,.trows{display:none;margin:6px 0 2px 7px;padding-left:16px;box-shadow:inset 1px 0 0 var(--line)}
.think.open .tsteps,.tools.open .trows{display:block}
.tst,.trow{display:flex;align-items:center;gap:9px;padding:5px 0;color:var(--tx3);font-size:13.5px;opacity:0;transform:translateY(4px);transition:all .3s}
.tst.on,.trow.on,.think.done .tst,.tools.done .trow{opacity:1;transform:none}
.tst.ok,.trow.ok{color:var(--tx2)}
.tmk{width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ok)}
.tmk svg{width:13px;height:13px;stroke-width:2.6}
.spin{width:11px;height:11px;border-radius:99px;border:1.6px solid var(--tx4);border-top-color:transparent;animation:bspin .7s linear infinite;display:block}
.trow>svg{width:14px;height:14px;color:var(--tx3)}
.trow b{font-weight:600;color:var(--tx)}
.tchip{background:var(--field);border-radius:7px;padding:2px 8px;font-size:12.5px;color:var(--tx2)}

/* the answer, streaming */
.say{font-size:15.5px;line-height:1.65;color:var(--tx)}
.say b{font-weight:600}
.caret{display:inline-block;width:7px;height:15px;margin-left:2px;vertical-align:-2px;border-radius:2px;background:var(--tx);animation:zp .9s infinite}
.srcchip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:7px;background:var(--field);font-size:12px;color:var(--tx2);vertical-align:1px}
.srcchip img{width:12px;height:12px;border-radius:3px}
.sayft{display:flex;align-items:center;gap:2px;margin-top:8px}
.ib{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--tx3);transition:background .2s,color .2s}
.ib:hover{background:var(--field);color:var(--tx)}.ib svg{width:15px;height:15px}
.srcs{display:inline-flex;align-items:center;gap:7px;margin-left:8px;font-size:12.5px;color:var(--tx3)}
.stack{display:inline-flex}.stack img{width:18px;height:18px;border-radius:99px;background:#fff;border:2px solid var(--bg);margin-left:-5px}.stack img:first-child{margin-left:0}
.fups{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.fup{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px 0 4px;border-radius:9px;font-size:14px;color:var(--tx2);transition:background .2s,color .2s}
.fup:hover{background:var(--field);color:var(--tx)}.fup svg{width:14px;height:14px;color:var(--tx4)}

/* the approval card */
.zask{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 16px 12px;box-shadow:0 1px 2px rgba(26,25,23,.04),0 12px 32px -20px rgba(26,25,23,.28);overflow:hidden}
.aq{display:flex;align-items:flex-start;gap:10px;font-size:15.5px;font-weight:600;letter-spacing:-.018em;line-height:1.35;padding:0 2px}
.aq span{flex:1}.ax{margin:-5px -6px 0 0}
.asub{font-size:13px;color:var(--tx3);margin:3px 2px 0}
.aopts{display:flex;flex-direction:column;gap:2px;margin-top:12px}
.aopt,.aoth{display:flex;align-items:center;gap:11px;min-height:44px;padding:8px 10px;border-radius:12px;text-align:left;font-size:14.5px;color:var(--tx);transition:background .15s}
.aopt:hover,.aoth:hover{background:var(--wash)}
.aopt.on{background:var(--field)}
.rad{width:18px;height:18px;border-radius:99px;border:1.5px solid var(--tx4);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:transparent;transition:all .15s}
.rad.box{border-radius:5px}
.rad svg{width:11px;height:11px;stroke-width:3.2}
.aopt.on .rad,.aoth.on .rad,.spi.on .rad{background:var(--ink);border-color:var(--ink);color:#fff}
.alg{width:26px;height:26px;border-radius:8px;background:var(--wash);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.alg img{width:15px;height:15px}
.al{flex:1;min-width:0;display:flex;flex-direction:column}
.as{font-size:12.5px;color:var(--tx3);margin-top:1px}
.aopt kbd{font:inherit;font-size:11px;color:var(--tx4);width:20px;height:20px;border-radius:6px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.aoth input{flex:1;font-size:14.5px}
.aft{display:flex;align-items:center;gap:6px;margin-top:10px;padding-top:10px;box-shadow:0 -1px 0 var(--line2)}
.apg{font-size:12.5px;color:var(--tx3)}

/* time passing, and notifications */
.tpill{display:flex;width:max-content;margin:6px auto 26px;align-items:center;gap:7px;height:30px;padding:0 13px;border-radius:99px;background:var(--field);font-size:12.5px;font-weight:500;color:var(--tx3)}
.tpill.go{background:var(--ink);color:#fff;cursor:pointer;animation:goPulse 2s infinite}
.tpill svg{width:13px;height:13px}
@keyframes goPulse{0%,100%{box-shadow:0 0 0 0 rgba(26,25,23,.25)}50%{box-shadow:0 0 0 7px rgba(26,25,23,0)}}
.note{display:flex;align-items:center;gap:10px;margin:0 0 20px;padding:10px 14px;border-radius:14px;background:var(--okbg);font-size:13.5px;color:var(--tx2)}
.note img{width:18px;height:18px;border-radius:5px}.note b{color:var(--tx);font-weight:600}
.znote{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:96;display:flex;align-items:center;gap:12px;min-width:360px;max-width:92vw;padding:12px 10px 12px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line2);box-shadow:var(--sh3)}
.znote .nl{width:34px;height:34px;border-radius:10px;background:var(--wash);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.znote .nl img{width:19px;height:19px}
.znote .nt{font-size:14px;font-weight:600;letter-spacing:-.015em}.znote .ns{font-size:12.5px;color:var(--tx3);margin-top:1px}
.znote>div:nth-child(3){flex:1}

/* matches */
.recs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mrec{background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:14px;text-align:left;transition:border-color .2s,transform .2s}
.mrec:hover{border-color:var(--line);transform:translateY(-2px)}
.rtop{display:flex;align-items:center;justify-content:space-between}
.rt{font-size:14px;font-weight:600;letter-spacing:-.018em;line-height:1.3;margin-top:12px}
.rm{font-size:12px;color:var(--tx3);margin-top:3px}
.rw{font-size:12.5px;color:var(--tx2);margin-top:8px;line-height:1.45}
.mring{position:relative;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.mring svg{position:absolute;inset:0;width:100%;height:100%}
.mring b{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
@media(max-width:760px){.recs{grid-template-columns:1fr}}

/* tailoring */
.tailor{background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:14px}
.tseg{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:var(--field)}
.tseg button{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:9px;font-size:13px;font-weight:500;color:var(--tx3)}
.tseg button img{width:14px;height:14px;border-radius:3px}
.tseg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(26,25,23,.12)}
.thead{display:flex;gap:10px;align-items:baseline;margin:14px 4px 10px}
.thead .tl{font-size:12px;color:var(--tx3);flex-shrink:0}.thead .tv{font-family:var(--serif);font-size:17px;letter-spacing:-.02em;line-height:1.3}
.tlist{display:flex;flex-direction:column;gap:4px}
.tp{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:12px;background:var(--wash)}
.tp:first-child{background:var(--okbg)}
.tn{width:18px;font-size:12.5px;font-weight:600;color:var(--tx3);text-align:center;font-variant-numeric:tabular-nums}
.tpt{flex:1;min-width:0;font-size:14px;font-weight:600;letter-spacing:-.015em;display:flex;flex-direction:column}
.tps{font-size:12px;font-weight:400;color:var(--tx3)}
.tmv{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--tx4)}
.tmv.up{color:var(--ok);font-weight:600}.tmv svg{width:12px;height:12px;stroke-width:2.6}
.twhy{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--tx2);margin:10px 4px 2px}
.twhy svg{width:13px;height:13px;color:var(--ok)}

.sending{background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:6px 14px}
.srow{display:flex;align-items:center;gap:11px;padding:10px 0;font-size:14px}
.srow+.srow{box-shadow:0 -1px 0 var(--line2)}
.srow>img{width:22px;height:22px;border-radius:6px}
.sgl{flex:1;min-width:0;display:flex;flex-direction:column;font-weight:600;letter-spacing:-.015em}.sgs{font-size:12px;font-weight:400;color:var(--tx3)}
.srow .st{font-size:12.5px;color:var(--tx3)}.srow.ok .st{color:var(--ok);font-weight:600}

/* who looked */
.looked{background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:14px 16px}
.lh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.av{width:34px;height:34px;border-radius:99px;background:linear-gradient(150deg,#E8E2F8,#C9BDF0);color:#4B3A8C;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.av.xs{width:20px;height:20px;font-size:8.5px}
.ln{font-size:14px;font-weight:600;letter-spacing:-.015em}.lr{font-size:12px;color:var(--tx3)}
.lt{margin-left:auto;font-size:12px;color:var(--tx3)}
.lrow{display:grid;grid-template-columns:170px 1fr 100px;align-items:center;gap:12px;padding:6px 0;font-size:13.5px}
.lbar{height:6px;border-radius:99px;background:var(--field);overflow:hidden}.lbar i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.lval{font-size:12.5px;color:var(--tx3);text-align:right;font-variant-numeric:tabular-nums}

/* schedule */
.sched{position:relative;display:flex;gap:16px;background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:16px}
.sdate{width:58px;flex-shrink:0;height:66px;border-radius:14px;background:var(--wash);border:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center}
.sdate .sd{font-size:11.5px;font-weight:600;color:#D14B3B}.sdate .sn{font-family:var(--serif);font-size:26px;line-height:1;margin-top:2px}
.sbody{flex:1;min-width:0}
.sr{font-size:12.5px;font-weight:600;color:var(--ok)}
.stt{font-size:15px;font-weight:600;letter-spacing:-.018em;margin-top:2px;padding-right:130px}
.smeta{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--tx2);margin-top:6px}
.smeta svg{width:13px;height:13px;color:var(--tx3)}.smeta .dot{width:3px;height:3px;border-radius:99px;background:var(--tx4);margin:0 3px}
.scal{position:absolute;top:14px;right:14px}
.sag{margin-top:14px;display:flex;flex-direction:column;gap:2px}
.sai{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13.5px}
.si{width:20px;height:20px;border-radius:99px;background:var(--field);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.sdur{margin-left:auto;font-size:12.5px;color:var(--tx3)}
.sprep{margin-top:12px;background:var(--wash);border-radius:12px;padding:8px 10px}
.sph{font-size:12px;font-weight:600;color:var(--tx3);padding:2px 2px 4px}
.spi{display:flex;align-items:center;gap:10px;width:100%;padding:6px 2px;font-size:13.5px;text-align:left}

/* the interview, live */
.lvcard{background:#151513;border-radius:18px;padding:12px;color:#F4F4F3}
.lvtop{display:flex;align-items:center;gap:10px;font-size:12.5px;margin-bottom:10px;padding:0 4px}
.lrec{display:inline-flex;align-items:center;gap:6px;font-weight:600}.lrec i{width:7px;height:7px;border-radius:99px;background:#FF4D4D;animation:zp 1.2s infinite}
.lvcard.done .lrec i{background:#7EDC9A;animation:none}
.lvc{font-variant-numeric:tabular-nums;color:rgba(244,244,243,.6)}
.lvw{display:inline-flex;align-items:center;gap:6px;color:rgba(244,244,243,.5)}.lvw svg{width:13px;height:13px}
.lvtiles{display:grid;grid-template-columns:1fr 1.5fr;gap:8px}
.lvt{position:relative;border-radius:12px;background:#24241F;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:box-shadow .3s}
.lvt.talk{box-shadow:0 0 0 2px #7EDC9A}
.bigav{width:64px;height:64px;border-radius:99px;background:linear-gradient(150deg,#E8E2F8,#C9BDF0);color:#4B3A8C;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center}
.lvt .pres{width:100%;height:100%;border:none;border-radius:0}
.lvn{position:absolute;left:8px;bottom:8px;font-size:11.5px;padding:3px 8px;border-radius:7px;background:rgba(0,0,0,.55);color:#fff}
.lvag{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding:0 2px}
.lva{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:99px;background:rgba(255,255,255,.07);font-size:12px;color:rgba(244,244,243,.5)}
.lva i{width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.25)}
.lva.on{color:#fff}.lva.on i{background:#FFB23E;animation:zp 1s infinite}.lva.ok{color:rgba(244,244,243,.8)}.lva.ok i{background:#7EDC9A}
.lvcap{min-height:22px;margin-top:10px;padding:0 4px;font-size:13.5px;color:rgba(244,244,243,.85);display:flex;align-items:center;gap:8px}
.lvcap b{font-weight:600;color:#fff}.lvcap svg{width:14px;height:14px;color:#7EDC9A}

/* the no */
.rej{background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:18px}
.rq{font-family:var(--serif);font-size:19px;line-height:1.4;letter-spacing:-.02em}
.rby{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--tx3);margin-top:10px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.rg{display:flex;gap:9px;padding:11px 12px;border-radius:12px;font-size:13.5px;line-height:1.45}
.rg svg{width:16px;height:16px;flex-shrink:0;margin-top:1px}
.rg.ok{background:var(--okbg)}.rg.ok svg{color:var(--ok)}.rg.amb{background:var(--ambbg)}.rg.amb svg{color:var(--amb)}
.rk{font-size:12px;font-weight:600;color:var(--tx3);margin-bottom:1px}
.racts{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}

/* the offer */
.offer{background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:18px}
.oh{display:flex;gap:12px;align-items:center}
.ok2{font-size:12px;font-weight:600;color:var(--ok)}.ot{font-size:15px;font-weight:600;letter-spacing:-.018em}.om{font-size:12.5px;color:var(--tx3)}
.oamt{font-family:var(--serif);font-size:40px;letter-spacing:-.03em;line-height:1;margin-top:18px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.oamt span{font-family:var(--f);font-size:13.5px;font-weight:600;color:var(--ok);letter-spacing:0}
.obar{position:relative;height:8px;border-radius:99px;background:var(--field);margin:30px 0 34px}
.obar .band{position:absolute;top:0;bottom:0;border-radius:99px;background:#CDEBD8}
.obar .mk{position:absolute;top:-4px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-size:11.5px;color:var(--tx3);white-space:nowrap}
.obar .mk i{width:2px;height:16px;border-radius:2px;background:var(--tx4);margin-bottom:4px}
.obar .mk.you{color:var(--tx);font-weight:600}.obar .mk.you i{width:4px;background:var(--ink)}
.obar .mk.med{top:-22px;flex-direction:column-reverse}.obar .mk.med i{margin:4px 0 0}
.oex{display:flex;gap:6px;flex-wrap:wrap}

/* right pane */
.agst2{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line2)}
.al2{font-size:13.5px;font-weight:600}.at2{font-size:12.5px;color:var(--tx3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.agst2.wait .al2{color:var(--amb)}.agst2.think .al2,.agst2.work .al2{color:var(--ok)}
.ivrow{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:13px}
.ivrow+.ivrow{box-shadow:0 -1px 0 var(--line2)}
.ivd{width:40px;height:44px;border-radius:11px;background:var(--card);border:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;color:#D14B3B;font-weight:600;flex-shrink:0}
.ivd b{font-family:var(--serif);font-size:17px;color:var(--tx);font-weight:400;line-height:1;order:2;margin-top:1px}
.ivx{flex:1;min-width:0;display:flex;flex-direction:column}.ivt2{font-size:12px;color:var(--tx3)}
.ivrow.passed{opacity:.6}
.hver{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12.5px;font-weight:600;color:var(--tx2)}
.hver img{width:14px;height:14px;border-radius:3px}.hver svg{width:14px;height:14px}
.hcin .orb{margin-right:4px}
#hmic.rec{color:var(--ok)}

/* the moment it lands */
.hired{position:fixed;inset:0;z-index:97;background:rgba(248,247,245,.94);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center}
.hin2{text-align:center;display:flex;flex-direction:column;align-items:center;gap:20px}
.hl1{font-family:var(--serif);font-size:clamp(40px,4vw,64px);letter-spacing:-.035em;line-height:1}
.hco{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:12px 18px;text-align:left}
.hco .ht{font-size:15px;font-weight:600;letter-spacing:-.018em}.hco .hm{font-size:13px;color:var(--tx3)}

/* cinematic: the three names under their bubbles */
.cmatch{display:block;font-size:11px;color:var(--ok);font-weight:600;margin-top:1px}
#csub2{opacity:0;font-family:var(--serif);font-size:clamp(20px,1.6vw,28px);color:var(--tx3);letter-spacing:-.02em;margin-top:8px}

/* explore insights */
.xins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.xi{display:flex;align-items:center;gap:12px;background:var(--wash);border-radius:14px;padding:12px}
.xbig{font-family:var(--serif);font-size:24px;letter-spacing:-.02em;min-width:52px;text-align:center}
.xk{font-size:12px;color:var(--tx3)}.xv{font-size:13.5px;font-weight:600;letter-spacing:-.015em;margin-top:1px}
.xsec{margin-top:22px}
.xh{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:600;margin-bottom:8px}
.xh span{font-size:13px;font-weight:400;color:var(--tx3)}
.xev{display:flex;gap:11px;align-items:center;padding:8px 0}
.xet{font-size:14px;font-weight:600;letter-spacing:-.015em}.xes{font-size:12.5px;color:var(--tx3);margin-top:1px}
.xgap{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--ambbg);font-size:13.5px;line-height:1.45;margin-bottom:6px}
.xgap svg{width:15px;height:15px;color:var(--amb);flex-shrink:0;margin-top:1px}
.xpay{position:relative;height:8px;border-radius:99px;background:var(--field);margin:14px 0 30px}

function snd(kind){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const t=AC.currentTime;
 const tone=(f,dur,vol,type)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.02)};
 if(kind==='tick'){tone(1320,.09,.05);tone(1980,.07,.025)}
 else if(kind==='land'){tone(660,.16,.06);tone(990,.2,.03)}
 else if(kind==='whoosh'){const n=AC.createBufferSource();const len=AC.sampleRate*.5;const buf=AC.createBuffer(1,len,AC.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);n.buffer=buf;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.setValueAtTime(600,t);f.frequency.exponentialRampToValueAtTime(2600,t+.4);const g=AC.createGain();g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+.5);n.connect(f).connect(g).connect(AC.destination);n.start(t)}
 else if(kind==='rise'){[523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.3,.045),i*70))}
 else if(kind==='chime'){[784,988,1175,1568].forEach((f,i)=>setTimeout(()=>tone(f,.5,.04),i*90))}
}catch(e){}}
$('#zsnd').onclick=()=>{S.sound=!S.sound;$('#zsnd').classList.toggle('off',!S.sound);$('#zsnd').innerHTML=ic(S.sound?'volume-2':'volume-x');icons();if(S.sound)snd('tick')};

async function playThink(host,b,fast){setStatus('think',(b.steps&&b.steps[0])||b.label);
 const n=el(thinkHTML(b,false));host.appendChild(n);icons();const clk=$('.clk',n);const t0=performance.now();
 const tick=setInterval(()=>{clk.textContent=((performance.now()-t0)/1000*2.1).toFixed(1)+'s'},90);
 await wait(fast?120:900);

function playAsk(host,b){setStatus('wait',b.q);
 return new Promise(res=>{const n=el(askHTML(b));host.appendChild(n);icons();gsap.from(n,{opacity:0,y:10,duration:.4,ease:'power2.out'});follow();
  const go=$('[data-go]',n),inp=$('.aoth input',n);

  const upd=()=>{go.disabled=(b.opts||[]).length>0&&!sel().length&&!(inp&&inp.value.trim())};
  $$('.aopt',n).forEach(o=>o.onclick=()=>{if(!b.multi)$$('.aopt',n).forEach(x=>x.classList.remove('on'));o.classList.toggle('on',b.multi?!o.classList.contains('on'):true);if(inp){inp.value='';$('.aoth',n).classList.remove('on')}snd('tick');upd()});
  if(inp)inp.oninput=()=>{if(inp.value.trim()&&!b.multi)$$('.aopt',n).forEach(x=>x.classList.remove('on'));$('.aoth',n).classList.toggle('on',!!inp.value.trim());upd()};
  const key=e=>{if(!document.body.contains(n)){document.removeEventListener('keydown',key);return}if(e.target.tagName==='INPUT')return;const k=+e.key;const os=$$('.aopt',n);if(k>=1&&k<=os.length){os[k-1].click();e.preventDefault()}if(e.key==='Enter'&&!go.disabled){go.click();e.preventDefault()}};
  document.addEventListener('keydown',key);
  const finish=v=>{document.removeEventListener('keydown',key);gsap.to(n,{opacity:0,height:0,marginTop:0,paddingTop:0,paddingBottom:0,duration:.35,ease:'power2.in',onComplete:()=>{n.remove();res(v)}})};
  go.onclick=()=>{const other=inp&&inp.value.trim();snd('tick');finish(other?{other}:{v:b.multi?sel():sel()[0]})};
  const sk=$('[data-skip]',n);if(sk)sk.onclick=()=>{if(b.onSkip)b.onSkip()};

 $$('.tp',card).forEach(r=>{const dy=(before[r.dataset.pid]||0)-r.getBoundingClientRect().top;if(dy)gsap.fromTo(r,{y:dy},{y:0,duration:.7,ease:'power3.inOut'});if($('.tmv.up',r))gsap.fromTo($('.tmv.up',r),{opacity:0,x:-6},{opacity:1,x:0,duration:.4,delay:.55})});
 gsap.fromTo($('.tv',card),{opacity:0},{opacity:1,duration:.4,delay:.2});bindTailor(card)}
function bindTailor(card){$$('[data-tk]',card).forEach(b=>b.onclick=()=>{if(b.dataset.tk!==card.dataset.cur){snd('tick');flipTo(card,b.dataset.tk)}})}

function sendingHTML(keys,done){return`<div class="sending">${keys.map(k=>`<div class="srow ${done?'ok':''}" data-s="${k}"><span class="tmk">${done?ic('check'):''}</span>${fav(CO[k].dom)}<span class="sgl">${CO[k].co}<span class="sgs">${TAILOR[k].label} · ${CO[k].role}</span></span><span class="st">${done?'Sent':'Queued'}</span></div>`).join('')}</div>`}

function lookedHTML(c){return`<div class="looked"><div class="lh"><span class="av">${c.ini}</span><div><div class="ln">${c.who}</div><div class="lr">${c.whoRole}, ${c.co}</div></div><span class="lt">What ${c.first} opened</span></div>

function playBars(n){$$('.lbar i',n).forEach((b,i)=>gsap.from(b,{width:0,duration:.9,ease:'power3.out',delay:.15+i*.12}))}

function schedHTML(c,slot,compact){return`<div class="sched">
  <div class="sdate"><span class="sd">${slot[0].slice(0,3)}</span><span class="sn">${slot[2]}</span></div>
  <div class="sbody"><div class="sr">${c.round} · ${c.len} min</div><div class="stt">${c.co}, ${c.role}</div>
   <div class="smeta">${ic('clock')}${slot[1]}<span class="dot"></span>${ic('video')}${c.where}<span class="dot"></span><span class="av xs">${c.ini}</span>${c.who}</div>
   ${compact?'':`<div class="sag">${c.agenda.map((a,i)=>`<div class="sai"><span class="si">${i+1}</span>${a[0]}<span class="sdur">${a[1]}</span></div>`).join('')}</div>
   <div class="sprep"><div class="sph">Before ${slot[0]}</div>${c.prep.map((p,i)=>`<button class="spi ${i===0?'on':''}" type="button"><span class="rad box">${ic('check')}</span>${p}</button>`).join('')}</div>`}

function liveHTML(c,done){return`<div class="lvcard ${done?'done':''}">
  <div class="lvtop"><span class="lrec"><i></i>${done?'Finished':'Live'}</span><span class="lvc">${done?c.len-1+' min':'00:00'}</span><span style="flex:1"></span><span class="lvw">${ic('video')}${c.where}</span></div>

   <div class="lvt you">${presVisual(PF.projects.find(p=>p.id===TAILOR[c.id].order[0]),false)}<span class="lvn">You · sharing your portfolio</span></div></div>
  <div class="lvag">${c.agenda.map((a,i)=>`<span class="lva ${done?'ok':''}"><i></i>${a[0]}</span>`).join('')}</div>

async function playLive(n,c,fast){const clk=$('.lvc',n),cap=$('.lvcap',n),ag=$$('.lva',n);const total=(c.len-1)*60;const dur=fast?400:6800;const t0=performance.now();
 setStatus('work','In the interview with '+c.first);
 const tick=setInterval(()=>{const s=Math.min(total,Math.round((performance.now()-t0)/dur*total));clk.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  const k=Math.min(ag.length-1,Math.floor((performance.now()-t0)/dur*ag.length));ag.forEach((a,i)=>{a.classList.toggle('ok',i<k);a.classList.toggle('on',i===k)})},80);
 for(const l of c.live){cap.innerHTML=`<b>${l[0]}</b>${l[1]}`;$('.them',n).classList.toggle('talk',l[0]!=='You');$('.you',n).classList.toggle('talk',l[0]==='You');gsap.fromTo(cap,{opacity:0,y:4},{opacity:1,y:0,duration:.3});await wait(dur/c.live.length)}
 clearInterval(tick);const d=el(liveHTML(c,true));n.replaceWith(d);icons();snd('land');return d}

function rejectHTML(c,done){return`<div class="rej"><div class="rq">“${c.reject.quote}”</div><div class="rby"><span class="av xs">${c.ini}</span>${c.who}, ${c.whoRole}</div>
  <div class="rgrid"><div class="rg ok">${ic('circle-check')}<div><div class="rk">What worked</div>${c.reject.worked}</div></div><div class="rg amb">${ic('circle-alert')}<div><div class="rk">What cost it</div>${c.reject.cost}</div></div></div>
  <div class="racts">${done||S.fixed?`<span class="ztag ok" style="height:34px;padding:0 12px">${ic('check')}Added to your pathway</span>`:`<button class="zbtn line sm" data-fix2>${c.reject.fix}</button>`}<button class="zbtn ghost sm" data-fb>Ask ${c.first} for feedback</button></div></div>`}
function bindReject(n){const f=$('[data-fix2]',n);if(f)f.onclick=()=>{S.fixed=true;snd('tick');f.outerHTML=`<span class="ztag ok" style="height:34px;padding:0 12px">${ic('check')}Added to your pathway</span>`;icons();toast('Added. Finish it and your next application carries it as evidence.')};
 const b=$('[data-fb]',n);if(b)b.onclick=()=>{b.textContent='Asked';b.disabled=true;toast('Sent a short note asking for detailed feedback.')}}

function offerHTML(c,amt){const o=c.offer;const lo=Math.min(60000,o.range[0])-4000,hi=o.range[1]+6000;const pos=v=>((v-lo)/(hi-lo)*100).toFixed(1);
 return`<div class="offer"><div class="oh"><span class="zlogo2 s46">${fav(c.dom)}</span><div><div class="ok2">Offer</div><div class="ot">${c.role}</div><div class="om">${c.co} · starts ${o.start}</div></div></div>
  <div class="oamt">${fmtK(amt)}<span>${fmtK(amt-60000)} above your floor</span></div>
  <div class="obar"><span class="band" style="left:${pos(o.range[0])}%;width:${(pos(o.range[1])-pos(o.range[0])).toFixed(1)}%"></span><span class="mk floor" style="left:${pos(60000)}%"><i></i>Your floor</span><span class="mk med" style="left:${pos(o.median)}%"><i></i>Median</span><span class="mk you" style="left:${pos(amt)}%"><i></i>Offer</span></div>
  <div class="oex">${o.extras.map(x=>`<span class="ztag">${x}</span>`).join('')}</div></div>`}

/* ═══ story state ═══ */
S.story={beat:0,ans:{},flags:{},picked:['notion','figma','klarna'],tok:0,played:{},chat:[]};
const DEF={match:{v:['notion','figma','klarna']},send:{v:'all'},slot1:{v:'0'},join1:{v:'join'},next:{v:'next'},slot2:{v:'0'},join2:{v:'join'},offer:{v:'accept'},offer2:{v:'accept'}};
const ANS=k=>S.story.ans[k]||DEF[k];
const RANK=['notion','figma','klarna'];
const c1=()=>CO[S.story.picked[0]||'notion'];
const k2=()=>S.story.picked[1]||RANK.find(k=>k!==S.story.picked[0]);
const c2=()=>CO[k2()];
const inbound=()=>!S.story.picked[1];
const slotOf=(c,k)=>{const a=ANS(k);return c.slots[a&&a.v!=null?+a.v:0]};
const topP=k=>PF.projects.find(p=>p.id===TAILOR[k].order[0]);

/* each beat is a list of blocks; a function block is built when it is reached, so it can read earlier answers */
function beatDefs(i){const K=BEATS[i][0];
 if(K==='match')return[
  {t:'think',label:'Reading postings',secs:7,steps:['Read 412 postings on Greenhouse, LinkedIn and Lever','Dropped 391 outside your brief','Matched 21 against your five scenarios','Ranked them by evidence, not keywords']},
  {t:'text',html:'<b>These three companies are waiting for you.</b> Notion is the strongest. You already solved their funnel in a ZERO scenario.',sources:[['notion.so'],['figma.com'],['klarna.com']]},
  {t:'card',kind:'recs'},
  {t:'ask',id:'match',q:'Which should I apply to?',multi:true,go:'Apply',opts:RANK.map(k=>({v:k,l:CO[k].co+' · '+CO[k].role,s:CO[k].match+'% match',logo:CO[k].dom,on:true})),
   me:a=>a.other?a.other:'Apply to '+nameList(a.v.map(k=>CO[k].co)),after:a=>{if(a.v&&a.v.length)S.story.picked=RANK.filter(k=>a.v.includes(k))}}];
 if(K==='apply')return[
  ()=>{const n=S.story.picked.length;return{t:'tools',rows:[['file-search','Read',n+' job description'+(n===1?'':'s')],['list-checks','Matched','14 requirements to your evidence'],['arrow-up-down','Reordered','your projects for '+nameList(S.story.picked.map(k=>CO[k].co))],['pen-line','Rewrote',n+' headline'+(n===1?'':'s')],['paperclip','Attached','the files each one asked for']]}},
  ()=>{const c=c1(),p=topP(c.id),pos=masterPos(p.id),n=S.story.picked.length;return{t:'text',html:`Same work, ${n===1?'one tailored version':n+' tailored versions'}. ${pos>1?`Your <b>${p.short}</b> was project ${pos} in your master portfolio. For ${c.co} it goes to the top.`:`For ${c.co} your <b>${p.short}</b> already leads.`}`}},
  {t:'card',kind:'tailor'},
  ()=>{const n=S.story.picked.length,names=nameList(S.story.picked.map(k=>CO[k].co));return{t:'ask',id:'send',q:`Send ${n===1?'it':'these'} to ${names}?`,go:'Send',
   opts:[{v:'all',l:n===1?'Send it':'Send all '+n,s:'Each company gets its own version',on:true},{v:'look',l:'Let me look at each one first',s:'Opens your portfolio'}],
   me:a=>a.v==='look'?'Let me look first':'Send them',leave:a=>a.v==='look'?()=>{S.pfFor=S.story.picked[0];nav('portfolio')}:null}},
  {t:'card',kind:'sending',flag:'sent'},
  {t:'wait',label:'Two days later'}];
 if(K==='liked')return[
  ()=>({t:'note',dom:c1().dom,title:`${c1().co} liked your portfolio`,sub:`${c1().who} spent ${c1().looked[0][1]} on it`,flag:'liked1'}),
  ()=>({t:'text',html:c1().likedLine,sources:[[c1().dom]]}),
  ()=>({t:'card',kind:'looked',c:c1()}),
  ()=>{const c=c1();return{t:'ask',id:'slot1',q:`Accept the interview with ${c.first}?`,sub:`${c.round} · ${c.len} min · ${c.where}`,go:'Accept',
   opts:c.slots.map((s,j)=>({v:String(j),l:`${s[0]}, ${s[1]}`,on:j===0})),other:'Suggest another time',
   me:a=>a.other?`Could we do ${a.other}?`:`${c.slots[+a.v][0]} at ${c.slots[+a.v][1]} works`,flag:'slot1'}}];
 if(K==='lined')return[
  ()=>{const c=c1(),s=slotOf(c,'slot1'),a=ANS('slot1');return{t:'text',html:a.other?`I asked ${c.first} for ${a.other}. ${s[0]} at ${s[1]} was the closest she had, so I held it for you.`:`Booked for <b>${s[0]} at ${s[1]}</b>. ${c.first} has been told, and it is in your calendar.`}},
  ()=>({t:'card',kind:'sched',c:c1(),slot:slotOf(c1(),'slot1')}),
  ()=>({t:'follow',items:[`What will ${c1().first} ask?`,'Which project should I lead with?']}),
  ()=>{const c=c1(),s=slotOf(c,'slot1');return{t:'ask',id:'join1',q:`${s[0]}, ${s[1]}. Ready when you are.`,go:'Join the interview',skip:'Practice first',onSkip:()=>openPrep(c),me:()=>'Join the interview'}}];
 if(K==='result')return[
  ()=>{const s=slotOf(c1(),'slot1');return{t:'time',text:`${s[0]} · ${s[1]}`}},
  ()=>({t:'card',kind:'live',c:c1(),flag:'int1'}),
  {t:'wait',label:'Four days later'},
  ()=>({t:'note',dom:c1().dom,title:`${c1().co} replied`,sub:'Not this time',flag:'rej1'}),
  ()=>({t:'text',html:`${c1().co} said no. It stings, and it is useful. Here is exactly why, in ${c1().first}’s words.`}),
  ()=>({t:'card',kind:'reject',c:c1()}),
  {t:'ask',id:'next',q:'Keep going?',go:'Yes, what is next',me:()=>'What is next?'}];
 if(K==='next')return[
  ()=>{const s=c2();return{t:'think',label:'Checking who opened your portfolio',secs:4,steps:[`${s.co} opened it twice this week`,`${s.first} read your ${s.looked[0][0]} end to end`,`Your ${s.co} version still holds after ${c1().co}’s feedback`]}},
  ()=>({t:'note',dom:c2().dom,title:`${c2().co} liked your portfolio`,sub:`${c2().who} wants to talk`,flag:'liked2'}),
  ()=>({t:'text',html:`${inbound()?`${c2().co} reached out on its own after seeing your work. `:''}${c2().likedLine}`,sources:[[c2().dom]]}),
  ()=>({t:'card',kind:'looked',c:c2()}),
  ()=>{const c=c2();return{t:'ask',id:'slot2',q:`Accept the ${c.round.toLowerCase()} with ${c.first}?`,sub:`${c.len} min · ${c.where}`,go:'Accept',
   opts:c.slots.map((s,j)=>({v:String(j),l:`${s[0]}, ${s[1]}`,on:j===0})),other:'Suggest another time',
   me:a=>a.other?`Could we do ${a.other}?`:`${c.slots[+a.v][0]} at ${c.slots[+a.v][1]} works`,flag:'slot2'}}];
 if(K==='offer')return[
  ()=>{const c=c2(),s=slotOf(c,'slot2');return{t:'text',html:`Booked for <b>${s[0]} at ${s[1]}</b>. Your ${topP(c.id).short} leads the ${c.co} version.`}},
  ()=>({t:'card',kind:'sched',c:c2(),slot:slotOf(c2(),'slot2'),compact:true}),
  ()=>({t:'ask',id:'join2',q:'Ready when you are.',go:'Join the interview',skip:'Practice first',onSkip:()=>openPrep(c2()),me:()=>'Join the interview'}),
  ()=>{const s=slotOf(c2(),'slot2');return{t:'time',text:`${s[0]} · ${s[1]}`}},
  ()=>({t:'card',kind:'live',c:c2(),flag:'int2'}),
  {t:'wait',label:'Two days later'},
  ()=>({t:'note',dom:c2().dom,title:`${c2().co} sent you an offer`,sub:fmtK(c2().offer.n),flag:'offer'}),
  ()=>{const c=c2(),o=c.offer;return{t:'text',html:`<b>You got it.</b> ${c.co} wants you as their ${c.role}. The median for this role is ${fmtK(o.median)}, so this is a fair offer. Asking for ${fmtK(o.counter)} is reasonable, and I would.`,sources:[[c.dom]]}},
  ()=>({t:'card',kind:'offer',c:c2(),amt:c2().offer.n}),
  ()=>{const c=c2(),o=c.offer;return{t:'ask',id:'offer',q:`What should I tell ${c.first}?`,go:'Send',
   opts:[{v:'accept',l:`Accept ${fmtK(o.n)}`,on:true},{v:'counter',l:`Ask for ${fmtK(o.counter)}`,s:'I write the note'},{v:'week',l:'Ask for a week to decide'}],
   me:a=>a.v==='accept'?`Accept it`:a.v==='counter'?`Ask for ${fmtK(o.counter)}`:'Ask for a week'}},
  ()=>{const c=c2(),o=c.offer,a=ANS('offer');if(a.v==='accept')return{t:'hired',amt:o.n};
   const amt=a.v==='counter'?o.counter-2000:o.n;
   return{t:'dyn',blocks:[
    {t:'think',label:'Waiting on '+c.first,secs:3,steps:[a.v==='counter'?`Sent your note asking for ${fmtK(o.counter)}`:'Asked for a week, with the reason',c.first+' replied']},
    {t:'text',html:a.v==='counter'?`${c.first} came back within the hour: <b>${fmtK(amt)}</b>. That is ${fmtK(amt-o.n)} more for one short note.`:`${c.first} said yes. You have until next Friday, and the offer holds at ${fmtK(amt)}.`},
    {t:'card',kind:'offer',c,amt},
    {t:'ask',id:'offer2',q:'Accept?',go:'Accept the offer',me:()=>`Accept ${fmtK(amt)}`},
    {t:'hired',amt}]}}];
 return[]}

/* ═══ engine ═══ */
const AGENT_T=['think','tools','text','card','ask','follow','dyn','hired'];
function thread(){return $('#hthread .hin')}
function turnHost(live){const w=thread();const last=w.lastElementChild;
 if(last&&last.classList.contains('turn')){if(live){$$('.turn.act',w).forEach(t=>t.classList.remove('act'));last.classList.add('act')}return $('.tb',last)}
 $$('.turn.act',w).forEach(t=>t.classList.remove('act'));
 const t=el(`<div class="turn ${live?'act':''}"><span class="tg">${orbHTML()}</span><div class="tb"></div></div>`);w.appendChild(t);return $('.tb',t)}
let userUp=false;
function follow(){const th=$('#hthread');if(!th||userUp)return;th.scrollTo({top:th.scrollHeight,behavior:'smooth'})}
function meBubble(text){thread().appendChild(el(`<div class="hmsg me"><div class="bd"><div class="tx">${text}</div></div></div>`))}
function cardHTML(b,done){const P=S.story.picked;
 if(b.kind==='recs')return recsHTML();
 if(b.kind==='tailor')return tailorHTML(P,P[0]);
 if(b.kind==='sending')return sendingHTML(P,done);
 if(b.kind==='looked')return lookedHTML(b.c);
 if(b.kind==='sched')return schedHTML(b.c,b.slot,b.compact);
 if(b.kind==='live')return liveHTML(b.c,done);
 if(b.kind==='reject')return rejectHTML(b.c,false);
 if(b.kind==='offer')return offerHTML(b.c,b.amt);return''}
function bindCard(n,b){
 $$('[data-look]',n).forEach(x=>x.onclick=()=>openJobSheet(x.dataset.look));
 if(b.kind==='tailor')bindTailor($('.tailor',n)||n);
 if(b.kind==='sched')bindSched(n);
 if(b.kind==='reject')bindReject(n)}
function staticBlock(b){if(typeof b==='function')b=b();if(b.flag)S.story.flags[b.flag]=true;
 if(b.t==='time'||b.t==='wait'){thread().appendChild(el(`<div class="tpill">${b.text||b.label}</div>`));return}
 if(b.t==='note'){thread().appendChild(el(noteRow(b)));return}
 if(b.t==='dyn'){b.blocks.forEach(staticBlock);return}
 if(b.t==='hired'){S.story.flags.hired=true;const h=turnHost(false);h.appendChild(el(`<div class="blk"><div class="say"><b>Done. You start ${c2().offer.start}.</b> I told ${c2().first} yes and withdrew your other applications with a short note.</div></div>`));return}
 if(b.t==='ask'){const a=ANS(b.id);if(b.after)b.after(a);if(b.flag)S.story.flags[b.flag]=true;meBubble(b.me?b.me(a):'Continue');return}
 if(b.t==='follow')return;
 const h=turnHost(false);
 if(b.t==='think'){const n=el(thinkHTML(b,true));h.appendChild(n);bindThink(n)}
 else if(b.t==='tools'){const n=el(toolsHTML(b,true));h.appendChild(n);bindThink(n)}
 else if(b.t==='text')h.appendChild(el(`<div class="blk">${textHTML(b)}</div>`));
 else if(b.t==='card'){const n=el(`<div class="blk cardw">${cardHTML(b,true)}</div>`);h.appendChild(n);bindCard(n,b)}}
async function playBlock(b,fast,tok){if(typeof b==='function')b=b();const alive=()=>tok===S.story.tok;
 if(b.t==='time'){thread().appendChild(el(`<div class="tpill">${b.text}</div>`));follow();return}
 if(b.t==='wait'){setStatus('wait','Waiting for time to pass');const n=el(`<button class="tpill go" type="button">${ic('fast-forward')}${b.label}</button>`);thread().appendChild(n);icons();follow();
  await new Promise(r=>n.onclick=()=>{snd('whoosh');n.classList.remove('go');n.innerHTML=b.label;r()});return}
 if(b.t==='note'){if(b.flag)S.story.flags[b.flag]=true;syncStory();renderPanes();if(!fast)notify(b);thread().appendChild(el(noteRow(b)));follow();await wait(fast?0:700);return}
 if(b.t==='dyn'){for(const x of b.blocks){if(!alive())return;await playBlock(x,fast,tok)}return}
 if(b.t==='hired'){S.story.flags.hired=true;syncStory();renderPanes();const h=turnHost(true);h.appendChild(el(`<div class="blk"><div class="say"><b>Done. You start ${c2().offer.start}.</b> I told ${c2().first} yes and withdrew your other applications with a short note.</div></div>`));follow();celebrate(b.amt);setStatus('idle','You got the job');return}
 if(b.t==='ask'){const h=turnHost(true);const a=await playAsk(h,b);if(!alive())return;
  S.story.ans[b.id]=a;if(b.after)b.after(a);if(b.flag)S.story.flags[b.flag]=true;meBubble(b.me?b.me(a):'Continue');syncStory();renderPanes();follow();
  const leave=b.leave&&b.leave(a);if(leave){delete S.story.ans[b.id];S.story.tok++;leave();throw 'leave'}return}
 if(b.t==='follow'){const h=turnHost(true);const n=el(`<div class="fups">${b.items.map(x=>`<button class="fup" type="button">${ic('corner-down-right')}${x}</button>`).join('')}</div>`);h.appendChild(n);icons();$$('.fup',n).forEach(f=>f.onclick=()=>askAgent(f.textContent.trim()));follow();return}
 const h=turnHost(true);
 if(b.t==='think')await playThink(h,b,fast);
 else if(b.t==='tools')await playTools(h,b,fast);
 else if(b.t==='text')await playText(h,b,fast);
 else if(b.t==='card'){const n=el(`<div class="blk cardw">${b.kind==='tailor'?tailorHTML(S.story.picked,'master'):cardHTML(b,false)}</div>`);h.appendChild(n);icons();gsap.from(n,{opacity:0,y:12,duration:.45,ease:'power2.out'});follow();
  if(b.kind==='tailor'){await wait(fast?50:900);flipTo($('.tailor',n),S.story.picked[0]);await wait(fast?0:900)}
  if(b.kind==='looked'&&!fast)playBars(n);
  if(b.kind==='sending')await playSending(n,fast);
  if(b.kind==='live'){const d=await playLive($('.lvcard',n),b.c,fast);d&&icons()}
  bindCard(n,b);if(b.flag){S.story.flags[b.flag]=true;syncStory();renderPanes()}await wait(fast?0:350)}

async function playStory(){S.story.tok++;const w=thread();if(!w)return;w.innerHTML='';userUp=false;S.story.flags={};
