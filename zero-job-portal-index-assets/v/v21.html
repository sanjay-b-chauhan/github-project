 if(!list.find(j=>j.id===S.sel))S.sel=list[0]?list[0].id:'';
 const last=S.visit==='first'?S.lastFound:null;const sc=$('#zsbody').scrollTop;
 $('#zsbody').innerHTML=`<div class="zin wide" style="max-width:1180px">
  <div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:8px 0 18px"><h1 class="ztitle" style="margin:0">Explore</h1><span style="font-size:13px;color:var(--tx3)">${found.length} role${found.length===1?'':'s'} at ${cos.length} compan${cos.length===1?'y':'ies'}${dayOneLive()?', and counting':''}</span></div>
  <div class="xcos">${cos.map(c=>`<div class="xco ${S.co===c.dom?'on':''}" data-co="${c.dom}"><div class="lg">${fav(c.dom)}</div><span class="ct">${c.n} role${c.n===1?'':'s'}</span><div class="nm">${c.co}</div>${c.live?'<span class="live"></span>':''}</div>`).join('')}
   ${dayOneLive()?`<div class="xco" style="cursor:default;border-style:dashed"><div class="nm" style="left:38px;right:16px;bottom:auto;top:18px;font-weight:500;color:var(--tx3);font-size:12.5px;line-height:1.45">Reading ${296-S.log.length*18} more</div><span class="live" style="bottom:auto;top:20px;right:auto;left:16px"></span></div>`:''}</div>
  <div style="display:flex;align-items:center;gap:10px;margin:14px 0 18px;flex-wrap:wrap">
   <div class="xfil">${[['all','All'],['fits','Aligned'],['explore','Around'],['saved','Saved']].map(f=>`<button class="${S.filter===f[0]?'on':''}" data-f="${f[0]}" ${counts[f[0]]===0&&f[0]!=='all'?'disabled':''}>${f[1]}<sup>${counts[f[0]]}</sup></button>`).join('')}</div>
   <div style="display:flex;align-items:center;gap:9px;height:36px;padding:0 14px;background:var(--card);border:1px solid var(--line2);border-radius:99px;flex:1;min-width:180px;margin-left:auto;max-width:300px">${ic('search')}<input id="jq" placeholder="Search roles or companies" value="${S.q||''}" style="flex:1;font-size:13.5px"></div>
   <div class="xview"><button class="${S.xview!=='grid'?'on':''}" data-xv="list" title="List">${ic('list')}</button><button class="${S.xview==='grid'?'on':''}" data-xv="grid" title="Grid">${ic('layout-grid')}</button></div></div>
  ${S.xview==='grid'
   ?`<div class="xgrid">${list.length?list.map(j=>jobCard(j,j.id===last)).join(''):`<div class="zempty" style="grid-column:1/-1;text-align:center;padding:40px"><b>Nothing matches that.</b>Clear the search and I will look again.</div>`}</div>`
   :`<div class="xsplit"><div class="xlist2">${list.length?list.map(j=>jobRow(j,j.id===last)).join(''):`<div class="zempty" style="text-align:center;padding:40px"><b>Nothing matches that.</b>Clear the search and I will look again.</div>`}</div><div class="xdetail" id="xdetail"></div></div>`}
  </div>`;
 $('#zsbody').scrollTop=sc;
 $('#jq').addEventListener('input',e=>{S.q=e.target.value;renderJobs();$('#jq').focus();$('#jq').setSelectionRange(99,99)});
 $$('#zsbody [data-f]').forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;snd('tick');renderJobs()});
 $$('#zsbody [data-xv]').forEach(b=>b.onclick=()=>{S.xview=b.dataset.xv;snd('tick');renderJobs()});
 $$('#zsbody [data-co]').forEach(b=>b.onclick=()=>{S.co=S.co===b.dataset.co?'':b.dataset.co;snd('tick');renderJobs()});
 $$('#zsbody [data-save]').forEach(b=>b.onclick=e=>{e.stopPropagation();SAVED[b.dataset.save]=!SAVED[b.dataset.save];renderJobs();toast(SAVED[b.dataset.save]?'Saved.':'Removed from saved.')});
 $$('#zsbody .xr').forEach(r=>r.onclick=()=>{S.sel=r.dataset.j;snd('tick');renderDetail();$('#xdetail').scrollTop=0});
 $$('#zsbody .xc [data-a]').forEach(b=>b.onclick=e=>{e.stopPropagation();const j=JOBS.find(x=>x.id===b.closest('[data-j]').dataset.j);jobAction(b.dataset.a,j)});
 renderDetail();icons()}
function jobAction(k,j){
 if(k==='view')return openJobSheet(j.id);
 if(k==='answer')return askStart(APPS.find(a=>a.id===j.id)||{id:j.id,co:j.co,t:j.t,ev:[],st:'needs'});
 if(k==='apply'){if(j.fit==='explore')return openConsent(j);if(j.fit==='held')return openOverride(j);if(j.held)return openHold(j);const st=stepsFor(j).find(s=>!s.done);if(st)return askStart(APPS.find(a=>a.id===j.id)||{id:j.id,co:j.co,t:j.t,ev:[],st:'needs'});return openSend(j)}
 if(k==='consent')return openConsent(j);if(k==='override')return openOverride(j);if(k==='hold')return openHold(j);
 if(k==='not'){toast('Noted. One dismissal never rewrites your brief, but a pattern will.');JOBS.splice(JOBS.indexOf(j),1);rerender()}}
function selectJob(id){S.sel=id;if(S.page!=='jobs')nav('jobs');openJobSheet(id)}
function openJobSheet(id){
 const j=JOBS.find(x=>x.id===id);if(!j)return;
 const steps=stepsFor(j);const done=steps.filter(s=>s.done).length;const blocked=steps.find(s=>!s.done);
 const app2=APPS.find(a=>a.id===j.id);
 openPanel(j.t,`${j.co} · ${j.loc} · ${j.mode}`,
  `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <span style="font-family:var(--serif);font-size:20px;letter-spacing:-.02em">${j.pay==='Not listed'?'<span style="font-size:14px;color:var(--tx3);font-family:var(--f)">No salary listed</span>':j.pay}</span>
    ${app2?`<span class="ztag ${ST[app2.st][1]}">${ST[app2.st][0]}</span>`:fitTag(j)}</div>
   <div class="why ${j.fit==='explore'?'pur':''}" style="margin-top:20px;background:${j.fit==='explore'?'var(--purbg)':'var(--okbg)'};border-radius:16px;padding:18px 20px">
    <div class="wt" style="font-size:12.5px;font-weight:600;color:${j.fit==='explore'?'var(--pur)':'var(--ok)'};display:flex;align-items:center;gap:7px;margin-bottom:7px">${ic(j.fit==='explore'?'compass':'check')}${j.fit==='explore'?'Why I am showing you something near your pathway':'Why I put this in front of you'}</div>
    <p style="font-size:14.5px;line-height:1.6">${j.why}</p>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px">${j.src.map(s=>`<span class="ztag" style="background:#fff">${ic('file-text')}${s}</span>`).join('')}</div></div>
   ${j.held?`<div style="margin-top:10px;background:var(--ambbg);border-radius:16px;padding:18px 20px"><div style="font-size:12.5px;font-weight:600;color:var(--amb);display:flex;align-items:center;gap:7px;margin-bottom:7px">${ic('circle-pause')}What is holding it</div><p style="font-size:14.5px;line-height:1.6">${j.held}</p></div>`:''}
   <div style="font-size:14px;font-weight:600;margin:26px 0 10px">What this role needs</div>
   ${j.req.map(r=>`<div class="zqi ${r[0]}">${ic(r[0]==='y'?'circle-check':r[0]==='p'?'circle-alert':'circle-dashed')}<div><div>${r[1]}</div><span class="ev">${r[2]}</span></div></div>`).join('')}
   ${j.req.some(r=>r[0]==='n')?'<div style="font-size:12px;color:var(--tx3);margin-top:10px">Missing means not demonstrated at ZERO. I never write it as cannot.</div>':''}
   <div style="font-size:14px;font-weight:600;margin:26px 0 8px;display:flex;justify-content:space-between">Your application<span style="font-size:12.5px;color:var(--tx3);font-weight:400">${done} of ${steps.length} ready</span></div>
   <div style="font-size:13.5px;font-weight:500;margin-bottom:6px">${blocked?'Blocked on one thing: '+blocked.n.toLowerCase():'Everything this form asks for is answered'}</div>
   <div class="zbar" style="margin-bottom:12px"><i style="width:${Math.round(done/steps.length*100)}%"></i></div>
   <div class="zsteps">${steps.map(s=>`<div class="zstep ${s.done?'done':'todo'}"><span class="mk">${ic('check')}</span><div class="sl"><div class="sn">${s.n}</div><div class="ss">${s.done?s.val:'Not answered. I will not guess it.'}</div></div>${s.done?'<span style="font-size:11.5px;color:var(--tx3)">Reused</span>':'<button class="zbtn line sm" data-a="answer">Answer</button>'}</div>`).join('')}</div>
   <div style="font-size:14px;font-weight:600;margin:26px 0 10px">About the role</div>
   <ul style="font-size:14px;line-height:1.7;color:var(--tx2)">${j.about.map(a=>`<li style="margin-left:17px;margin-bottom:5px">${a}</li>`).join('')}</ul>`,
  `<button class="zbtn line" data-a="save">${ic(SAVED[j.id]?'bookmark-check':'bookmark')}${SAVED[j.id]?'Saved':'Save'}</button>${primaryAct(j)}`);
 $$('#zpanel [data-a]').forEach(b=>b.onclick=()=>{const k=b.dataset.a;
  if(k==='save'){SAVED[j.id]=!SAVED[j.id];rerender();openJobSheet(id);return}
  closePanel();jobAction(k,j)});
 icons()}

/* ═══ APPLICATIONS: a panel off For you ═══ */
const STAGE=[
 ['need','Needs you',a=>['needs','ask','ready'].includes(a.st)],
 ['flight','In flight',a=>['subm','sent'].includes(a.st)],
 ['reply','Replied',a=>['conf','offer','accepted'].includes(a.st)],
 ['held','Closed',a=>['held','closed','withdrawn','rej'].includes(a.st)],
];
const STAGE_EMPTY={need:'Nothing is waiting on you. I stop here the first time a form asks what I do not know.',flight:'Nothing is in flight. Say yes to a role and it lands here while it sends.',reply:'No employer has replied yet. Portfolios are usually opened within two days, and I will tell you the moment one is.',held:'Nothing closed. A role lands here when it breaks one of your rules, hides an essential, or the employer says no.'};
function openApps(fromClick){S.panel='apps';
 const groups={};STAGE.forEach(s=>groups[s[0]]=APPS.filter(s[2]));
 if(!fromClick&&(!groups[S.appTab]||!groups[S.appTab].length)){const first=STAGE.find(s=>groups[s[0]].length);if(first)S.appTab=first[0]}
 const cur=groups[S.appTab]||[];const iv=ROUNDS.length;
 openPanel('Your applications',`${APPS.length?APPS.length+' live':'Nothing live yet'}${iv?' · '+iv+' interview'+(iv===1?'':'s'):''}`,
  `<div class="pipe" style="margin-top:0">${STAGE.map(s=>{const n=groups[s[0]].length;return`<button class="pipestep ${S.appTab===s[0]?'on':''} ${n?'':'empty'}" data-at="${s[0]}"><span class="pn">${n}</span><span class="pl">${s[1]}</span><span class="pbar"></span></button>`}).join('')}</div>
    <div class="zrows" style="margin-top:18px">${cur.length?cur.map(a=>{const j=JOBS.find(x=>x.id===a.id);
    return`<div class="zrow" data-app="${a.id}" style="cursor:pointer"><div class="zlogo2 s40">${fav(a.dom)}</div><div class="grow"><div class="t">${a.t}${a.out?`<span class="ztag ${a.out.src?'ok':'out'}">${a.out.t}</span>`:''}</div><div class="s">${a.co}${j?' · '+j.loc:''}</div><div class="anext">${ic('corner-down-right')}${a.nx}</div></div><div style="text-align:right;flex-shrink:0"><span class="ztag ${ST[a.st][1]}">${ST[a.st][0]}</span><div class="atime">${a.up}</div></div></div>`}).join('')
    :`<div class="zempty" style="text-align:center;padding:36px 24px"><b>Nothing in ${STAGE.find(s=>s[0]===S.appTab)[1].toLowerCase()}.</b>${STAGE_EMPTY[S.appTab]}</div>`}</div>`,
  `<button class="zbtn dark" onclick="closePanel()">Done</button>`);
 $$('#pbody [data-at]').forEach(b=>b.onclick=()=>{S.appTab=b.dataset.at;openApps(true)});
 $$('#pbody [data-app]').forEach(r=>r.onclick=()=>openApp(APPS.find(a=>a.id===r.dataset.app)));
 $$('#pbody [data-acc]').forEach(b=>b.onclick=()=>{const r=ROUNDS.find(x=>x.id===b.dataset.acc);r.state='accepted';openApps(true);rerender();toast('Accepted. '+r.co+' has been told and it is in your calendar.')});
 $$('#pbody [data-later]').forEach(b=>b.onclick=()=>{const r=ROUNDS.find(x=>x.id===b.dataset.later);r.state='later';openApps(true);rerender()});
 $$('#pbody [data-dec]').forEach(b=>b.onclick=()=>{const r=ROUNDS.find(x=>x.id===b.dataset.dec);ROUNDS.splice(ROUNDS.indexOf(r),1);openApps(true);rerender();toast('Declined and the note is sent.')});
 icons()}
function renderApps(){if($('#zpanel.on')&&S.panel==='apps')openApps(true)}
const _closePanel=closePanel;closePanel=function(){S.panel='';_closePanel()};

/* ═══ PORTFOLIO helpers ═══ */
function employersWhoSaw(){return APPS.filter(a=>['sent','conf','subm'].includes(a.st)).map(a=>({id:a.id,co:a.co,dom:a.dom,role:a.t,st:a.st}))}

/* ═══ tour ═══ */
const TOUR=[
 {sel:'.hthread',t:'I never apply on my own. Every role comes here as a question, and nothing moves until you answer.',pos:'left'},
 {sel:'.hr',t:'What I am doing right now. When it says waiting on you, something in the thread needs a yes or no.',pos:'left'},
 {sel:'.hcomp',t:'Tell me what to change, in your words. The sliders hold pause and your terms.',pos:'above'},
 {sel:'#zseg',t:'Explore is every role I have found, by company. Portfolio is what employers see.',pos:'below'},
];
let tourI=-1;
function tourAt(i){tourI=i;const st=TOUR[i];const t=$(st.sel);const ring=$('#ztring'),card=$('#ztcard');
 if(!t||getComputedStyle(t).display==='none'){if(i<TOUR.length-1)return tourAt(i+1);endTour();return}
 setTimeout(()=>{const r=t.getBoundingClientRect();const p=8;
  ring.style.left=(r.left-p)+'px';ring.style.top=(r.top-p)+'px';ring.style.width=(r.width+p*2)+'px';ring.style.height=(r.height+p*2)+'px';ring.classList.add('on');
  card.innerHTML=`<div class="tl">${st.t}</div><div class="ft"><div class="dots">${TOUR.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div>${i>0?'<button class="zbtn ghost sm" id="tb">Back</button>':'<button class="zbtn ghost sm" id="tskip">Skip</button>'}<button class="zbtn dark sm" id="tn">${i===TOUR.length-1?'Got it':'Next'}</button></div>`;
  const cw=314,ch=card.offsetHeight||110;let L,T;
  if(st.pos==='left'){L=r.left-cw-16;if(L<16)L=r.right+16;T=Math.min(Math.max(16,r.top+60),innerHeight-ch-20)}
  else if(st.pos==='above'){L=Math.min(Math.max(16,r.left+r.width/2-cw/2),innerWidth-cw-16);T=Math.max(16,r.top-ch-14)}
  else{L=Math.min(Math.max(16,r.left+r.width/2-cw/2),innerWidth-cw-16);T=r.bottom+12}
  card.style.left=Math.max(16,L)+'px';card.style.top=Math.max(16,T)+'px';card.classList.add('on');icons();
  const n=$('#tn');if(n)n.onclick=()=>{if(i===TOUR.length-1)endTour();else tourAt(i+1)};
  const b=$('#tb');if(b)b.onclick=()=>tourAt(i-1);
  const sk=$('#tskip');if(sk)sk.onclick=endTour},250)}
function startTour(){S.toured=true;if(S.page!=='home')nav('home');setTimeout(()=>tourAt(0),420)}
function endTour(){tourI=-1;$('#ztring').classList.remove('on');$('#ztcard').classList.remove('on')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(tourI>=0)endTour();closePanel();closeDlg()}});
window.addEventListener('resize',()=>{if(tourI>=0)tourAt(tourI)});

/* ═══ demo menu and the bottom journey ═══ */
function startFlow(){endTour();closePanel();closeDlg();seedVisit();lineTok=0;runUnlock()}
function inApp(){return document.body.classList.contains('zapp')}
function journeyIndex(){if(!inApp()){const i=JOURNEY.findIndex(j=>j[0]===S.page);return i<0?0:i}return 3+S.story.beat}
function syncNav(){const i=journeyIndex();const d=$('#zjd');if(d)d.innerHTML=JOURNEY.map((_,k)=>`<i class="${k<i?'past':k===i?'on':''}"></i>`).join('');
 $('#dstep').textContent=inApp()&&S.page!=='home'?PAGE_TITLE[S.page]:JOURNEY[i][1];$('#dprev').disabled=i===0;$('#dnext').disabled=i===JOURNEY.length-1}
function goBeat(b){S.story.tok++;lineTok++;clearTimeout(beatT);endTour();closePanel();closeDlg();$$('.znote,.hired').forEach(x=>x.remove());
 S.story.beat=Math.max(0,Math.min(BEATS.length-1,b));
 for(let i=0;i<S.story.beat;i++)S.story.played[i]=true;
 if(!inApp()){S.toured=true;enterApp('home');return}
 if(S.page!=='home'){nav('home');return}
 const hin=$('#hthread .hin');if(hin)hin.innerHTML='';renderHome();syncNav()}
function goStep(d){const i=journeyIndex()+d;if(i<0||i>=JOURNEY.length)return;const k=JOURNEY[i][0];
 if(i<3){S.story.tok++;lineTok++;clearTimeout(beatT);$$('.znote,.hired').forEach(x=>x.remove());seedVisit();if(k==='unlock')runUnlock();else if(k==='intro')runIntro();else runCine();syncNav();return}
 goBeat(i-3)}
$('#dprev').onclick=()=>goStep(-1);$('#dnext').onclick=()=>goStep(1);
$('#dstep').onclick=()=>$('#dmenu').click();
$('#dmenu').onclick=()=>{const m=$('#zmenu');m.classList.toggle('on');
 if(m.classList.contains('on')){m.innerHTML='<div class="h">JUMP TO</div>'+JOURNEY.map((j,i)=>`<button class="${journeyIndex()===i?'on':''}" data-j="${i}">${j[1]}</button>`).join('')+'<div class="h">RUN</div><button data-r="flow">Start from the unlock</button><button data-r="tour">Show the tour</button>';
  $$('#zmenu [data-j]').forEach(b=>b.onclick=()=>{m.classList.remove('on');const i=+b.dataset.j;goStep(i-journeyIndex())});
  $$('#zmenu [data-r]').forEach(b=>b.onclick=()=>{m.classList.remove('on');if(b.dataset.r==='tour'){if(!inApp())goBeat(S.story.beat);setTimeout(startTour,900)}else startFlow()})}};
document.addEventListener('click',e=>{if(!e.target.closest('.zdbg'))$('#zmenu').classList.remove('on')});

/* ═══ boot ═══ */
icons();seedVisit();
const h=location.hash.replace('#/','');
if(['home','jobs','portfolio'].includes(h)){document.body.classList.remove('zdark');document.body.classList.add('zapp');$('#zflowhd').classList.add('zhide');$$('.zscr').forEach(s=>s.classList.remove('on'));nav(h)}
else runUnlock();

</script>
