  --page:#FAFAF9; --shell:#F1F1EF; --card:#FFF; --field:#F0F0EE; --wash:#F7F7F5; --bubble:#f2f2f3;
  --line:rgba(13,13,13,.08); --line-2:rgba(13,13,13,.045);
  --tx:#111113; --tx-2:#63636a; --tx-3:#9a9aa0; --tx-4:#c4c4ca;
  --ink:#111113; --on-ink:#fff; --ok:#3fb968; --commit:#4ade80; --gold:#8a6d00;
  --f:'Google Sans Flex','Google Sans',-apple-system,system-ui,sans-serif;
  --serif:'STK Bureau Serif',Georgia,serif;
  --r-sm:8px; --r-md:12px; --r:16px; --r-lg:20px; --r-xl:26px; --pill:999px;
}
*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ height:100%; }
body{ background:var(--page); color:var(--tx); font-family:var(--f); font-size:14px;
  letter-spacing:-.018em; overflow:hidden; -webkit-font-smoothing:antialiased; }
button{ font:inherit; letter-spacing:inherit; color:inherit; background:none; border:none; cursor:pointer; }
input{ font:inherit; letter-spacing:inherit; color:var(--tx); background:none; border:none; outline:none; }
input::placeholder{ color:var(--tx-4); }
button:focus-visible{ outline:2px solid var(--ink); outline-offset:3px; }
input:focus,input:focus-visible{ outline:none; }
.row .box:focus-within{ box-shadow:0 0 0 1.5px var(--ink); }
svg{ display:block; }

/* ---------------- chrome ---------------- */
.top{ position:fixed; inset:0 0 auto 0; height:84px; z-index:50; display:flex; align-items:center;
  justify-content:space-between; padding:0 22px; pointer-events:none; }
.top > *{ pointer-events:auto; }
.logo{ height:46px; padding:0 21px; display:flex; align-items:center; background:var(--field); border-radius:var(--pill); }
.logo svg{ height:16px; width:auto; color:var(--ink); }
.tr{ display:flex; align-items:center; gap:9px; }
.steps{ height:46px; padding:0 20px; display:flex; align-items:center; gap:8px; background:var(--field); border-radius:var(--pill); }
.steps i{ width:4px; height:4px; border-radius:var(--pill); background:var(--tx-4); }
.steps .sl{ font-size:12px; color:var(--tx-3); margin-right:4px; white-space:nowrap; }
.snd{ width:46px; height:46px; border-radius:var(--pill); background:var(--field); display:flex; align-items:center; justify-content:center; color:var(--tx-2); }
.snd svg{ width:17px; height:17px; }
.snd.off{ color:var(--tx-4); }

/* ---------------- layout ---------------- */
.wrap{ display:flex; gap:16px; padding:16px; height:100dvh; }
.mid{ flex:1; min-width:0; display:flex; align-items:center; justify-content:center; padding:84px 24px 24px; }
.col{ width:100%; max-width:640px; }
.right{ width:0; min-width:0; opacity:0; overflow:hidden; }

/* ---------------- draw to start ---------------- */
.draw{ position:fixed; inset:0; z-index:90; background:var(--page); display:flex; align-items:center; justify-content:center; }
.draw canvas{ position:absolute; inset:0; cursor:crosshair; touch-action:none; }
.dcenter{ text-align:center; pointer-events:none; position:relative; }
.dghost{ width:190px; margin:0 auto 34px; color:var(--tx); opacity:.06; }
.dghost svg{ width:100%; height:auto; }
.dh{ font-family:var(--serif); font-size:clamp(28px,2.3vw,42px); letter-spacing:-.03em; line-height:1.15; }
.ds{ margin-top:13px; font-size:14px; color:var(--tx-3); }
.dhint{ margin-top:30px; font-size:12.5px; color:var(--tx-4); opacity:0; }

/* ---------------- conversation ---------------- */
.said{ min-height:24px; margin-bottom:18px; font-size:15px; color:var(--tx-2); text-align:center; text-wrap:balance; position:relative; }
.said .hl{ color:var(--tx); font-weight:600; }
.react{ position:absolute; top:-8px; right:8%; font-size:19px; opacity:0; }
.q{ font-family:var(--serif); font-weight:400; font-size:clamp(25px,2.05vw,38px); line-height:1.16;
  letter-spacing:-.03em; text-align:center; text-wrap:balance; }
.q .w{ display:inline-block; }
.qs{ margin-top:12px; font-size:14px; color:var(--tx-3); text-align:center; text-wrap:balance; }
.opts{ margin-top:42px; }

/* voice composer */
.voice{ display:flex; flex-direction:column; align-items:center; gap:18px; }
.interim{ min-height:22px; max-width:480px; font-size:14.5px; color:var(--tx-2); text-align:center; }
.micwrap{ position:relative; width:84px; height:84px; }
.ring{ position:absolute; inset:0; border-radius:var(--pill); border:1.5px solid var(--tx-4); opacity:0; }
.mic{ position:absolute; inset:0; border-radius:var(--pill); background:var(--ink); color:#fff;
  display:flex; align-items:center; justify-content:center;
  transition:transform .22s cubic-bezier(.2,.8,.3,1); }
.mic svg{ width:26px; height:26px; }
.mic:hover{ transform:scale(1.05); }
.mic.live{ background:var(--ink); }
.mic.live::after{ content:''; position:absolute; inset:6px; border-radius:var(--pill); border:1.5px solid rgba(255,255,255,.35); }
.vhint{ font-size:12.5px; color:var(--tx-4); }
.vrow{ display:flex; align-items:center; gap:26px; }
.mini{ width:48px; height:48px; border-radius:var(--pill); background:var(--field); color:var(--tx-2);
  display:flex; align-items:center; justify-content:center; }
.mini svg{ width:17px; height:17px; }
.mini:hover{ color:var(--tx); }

/* type composer */
.row{ display:flex; gap:10px; justify-content:center; }
.row .box{ width:420px; height:58px; background:var(--field); border-radius:var(--pill); display:flex; align-items:center; padding:0 26px; }
.row .box input{ width:100%; font-size:16px; }
.row .go{ width:58px; height:58px; flex-shrink:0; border-radius:var(--pill); background:var(--ink); color:var(--on-ink);
  display:flex; align-items:center; justify-content:center; opacity:.25; }
.row .go svg{ width:17px; height:17px; }

.chips{ margin-top:20px; display:flex; flex-wrap:wrap; gap:9px; justify-content:center; }
.chip2{ height:42px; padding:0 18px; border-radius:var(--pill); background:var(--card); border:1px solid var(--line);
  font-size:13.5px; color:var(--tx-2); display:flex; align-items:center;
  transition:transform .2s cubic-bezier(.2,.8,.3,1), box-shadow .2s ease, color .2s ease; }
.chip2:hover{ transform:translateY(-2px); box-shadow:0 6px 16px rgba(0,0,0,.07); color:var(--tx); }

/* choice rows */
.rows{ display:flex; flex-direction:column; gap:10px; }
.orow{ display:flex; align-items:center; gap:18px; text-align:left; background:var(--card);
  border:1px solid var(--line); border-radius:var(--r-lg); padding:18px 22px;
  transition:transform .22s cubic-bezier(.2,.8,.3,1), box-shadow .22s ease, background .2s ease, border-color .2s ease; }
.orow .oi{ width:46px; height:46px; flex-shrink:0; border-radius:var(--r-md); background:var(--t,var(--wash));
  display:flex; align-items:center; justify-content:center; color:#43434b; }
.orow .oi svg{ width:20px; height:20px; }
.orow .on2{ flex:1; min-width:0; display:block; }
.orow .ot{ display:block; font-size:15.5px; font-weight:600; letter-spacing:-.025em; }
.orow .od{ display:block; margin-top:5px; font-size:12.5px; color:var(--tx-3); line-height:1.45; }
.orow:hover{ transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,0,0,.07); }
.orow.on{ background:var(--ink); border-color:transparent; color:var(--on-ink); }
.orow.on .od{ color:rgba(255,255,255,.6); }
.orow.on .oi{ background:rgba(255,255,255,.14); color:#fff; }

.next{ margin-top:28px; display:flex; justify-content:center; gap:10px; opacity:0; pointer-events:none; }
.next.show{ pointer-events:auto; }
.btn{ height:52px; padding:0 30px; border-radius:var(--pill); background:var(--ink); color:var(--on-ink);
  font-size:15px; font-weight:600; display:inline-flex; align-items:center; gap:9px;
  transition:transform .22s cubic-bezier(.2,.8,.3,1); }
.btn:hover{ transform:translateY(-2px); }
.btn.quiet{ background:var(--field); color:var(--tx); font-weight:400; }
.acct{ margin-top:30px; display:flex; flex-direction:column; align-items:center; gap:12px; }
.acct .note{ font-size:12.5px; color:var(--tx-4); }

/* ---------------- right panel ---------------- */
.shell{ height:100%; background:var(--shell); border-radius:var(--r-xl); display:flex; flex-direction:column;
  align-items:center; padding:22px 0 0; overflow:hidden; }
.cap{ font-size:12px; color:var(--tx-3); margin-bottom:14px; flex-shrink:0; display:flex; align-items:center; gap:7px; height:15px; }
.cap .live{ width:5px; height:5px; border-radius:var(--pill); background:var(--ok); }
.cap .live.pulse{ animation:capPulse 1.6s ease-in-out infinite; }
@keyframes capPulse{ 0%,100%{opacity:1} 50%{opacity:.3} }
.paper{ width:min(660px,90%); flex:1; min-height:0; background:var(--card); border-radius:var(--r-lg);
  position:relative; box-shadow:0 1px 3px rgba(0,0,0,.04); overflow:hidden; }
.paper::after{ content:''; position:absolute; left:0; right:0; bottom:0; height:64px;
  background:linear-gradient(to bottom,rgba(255,255,255,0),#fff); pointer-events:none; z-index:2; }
.scroll{ height:100%; overflow:hidden; padding:30px 30px 50px; }

/* live profile slots */
.slots{ display:flex; flex-direction:column; }
.slot{ display:flex; align-items:center; gap:13px; padding:12px 2px; position:relative; }
.slot + .slot::before{ content:''; position:absolute; top:0; left:0; right:0; height:1px; background:var(--line-2); }
.slot .si{ width:30px; height:30px; flex-shrink:0; border-radius:var(--r-sm); background:var(--wash);
  display:flex; align-items:center; justify-content:center; color:var(--tx-3); }
.slot .si svg{ width:14px; height:14px; }
.slot .sk{ flex:1; font-size:13px; color:var(--tx-3); }
.slot .sv{ font-size:13.5px; font-weight:600; text-align:right; max-width:58%; color:var(--tx-4); font-weight:400; }
.slot.f .sv{ color:var(--tx); font-weight:600; }
.slot.f .si{ background:var(--ink); color:#fff; }

.dots{ position:absolute; inset:34px 34px 44px; z-index:3; pointer-events:none; }
.dots span{ position:absolute; width:3px; height:3px; margin:-1.5px 0 0 -1.5px; border-radius:var(--pill); background:var(--tx-4); }

.artifact{ background:var(--card); box-shadow:0 1px 3px rgba(0,0,0,.05); border:1px solid var(--line);
  border-left:3px solid rgba(74,222,128,.8); border-radius:var(--r-md); padding:17px 19px; }
.artifact .ah{ display:flex; align-items:center; gap:9px; margin-bottom:12px; font-size:12.5px; color:var(--tx-3); }
.artifact .ah .d{ width:6px; height:6px; border-radius:var(--pill); background:var(--commit); }
.artifact ul{ list-style:none; }
.artifact li{ padding:10px 0; font-size:14px; position:relative; display:flex; justify-content:space-between; gap:16px; }
.artifact li + li::before{ content:''; position:absolute; top:0; left:0; right:0; height:1px; background:var(--line-2); }
.artifact li .k{ color:var(--tx-3); flex-shrink:0; }
.artifact li .v{ font-weight:600; text-align:right; }

.ph{ display:flex; align-items:flex-start; gap:15px; }
.pav{ width:58px; height:58px; flex-shrink:0; border-radius:var(--r-md); background:var(--ink); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:19px; font-weight:600; }
.pid{ flex:1; min-width:0; padding-top:4px; }
.pname{ font-size:19px; font-weight:600; line-height:1.2; letter-spacing:-.03em; }
.pmeta{ display:flex; align-items:center; gap:9px; margin-top:7px; font-size:12.5px; color:var(--tx-2); flex-wrap:wrap; }
.pmeta .m{ display:flex; align-items:center; gap:6px; }
.pmeta .m svg{ width:12px; height:12px; color:var(--tx-3); }
.pmeta .sep{ width:2px; height:2px; border-radius:var(--pill); background:var(--tx-4); }
.pbadge{ flex-shrink:0; height:32px; padding:0 15px; border-radius:var(--pill); background:var(--wash);
  display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600; }
.pbadge svg{ width:12px; height:12px; }
.pbio{ margin-top:16px; font-size:13px; line-height:1.62; color:var(--tx-2); }
.psec{ margin-top:24px; margin-bottom:11px; font-size:13px; color:var(--tx-3); display:flex; align-items:center; justify-content:space-between; }
.psec .cnt{ font-size:12px; color:var(--tx-4); }

.rcard{ display:flex; align-items:center; gap:16px; padding:16px 18px; border-radius:var(--r-md); background:var(--wash); }
.rcard + .rcard{ margin-top:10px; }
.rcard .rk{ width:44px; height:44px; flex-shrink:0; border-radius:var(--r-sm); background:var(--card);
  display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; }
.rcard .rn{ flex:1; min-width:0; }
.rcard .rt{ font-size:14.5px; font-weight:600; letter-spacing:-.025em; }
.rcard .rd{ margin-top:3px; font-size:12px; color:var(--tx-3); }
.rcard .rp{ font-size:13px; font-weight:600; white-space:nowrap; }
.cos{ margin-top:12px; display:flex; flex-wrap:wrap; gap:7px; }
.co{ display:inline-flex; align-items:center; gap:7px; height:30px; padding:0 13px; border-radius:var(--pill);
  background:var(--card); border:1px solid var(--line); font-size:12.5px; }
.co svg{ width:13px; height:13px; }

.prow{ display:flex; gap:15px; padding:11px; border-radius:var(--r-md); background:var(--wash); }
.prow + .prow{ margin-top:10px; }
.pthumb{ width:162px; height:134px; flex-shrink:0; border-radius:var(--r-sm); background:var(--tint,#EFEFED);
  padding:14px; position:relative; overflow:hidden; display:flex; flex-direction:column; }
.ptb{ display:flex; align-items:center; gap:6px; font-size:10.5px; font-weight:600; color:var(--tx-2); }
.ptb svg{ width:11px; height:11px; }
.ptt{ margin-top:10px; font-size:13px; font-weight:600; line-height:1.25; letter-spacing:-.025em; }
.ptr{ width:21px; height:2px; background:var(--tx-4); margin-top:9px; border-radius:var(--pill); }
.ptf{ margin-top:auto; font-size:8.5px; color:var(--tx-3); letter-spacing:.06em; text-transform:uppercase; }
.ptface{ position:absolute; right:10px; bottom:10px; width:42px; height:42px; border-radius:9px; background:rgba(13,13,13,.08); }
.pb{ flex:1; min-width:0; padding-top:3px; }
.pt{ font-size:14px; font-weight:600; line-height:1.3; letter-spacing:-.025em; }
.pd{ margin-top:7px; font-size:12.5px; line-height:1.5; color:var(--tx-2); }
.pc{ margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; }
.chip{ display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 11px; border-radius:var(--r-sm);
  background:var(--card); font-size:11.5px; color:var(--tx-2); }
.chip svg{ width:10px; height:10px; color:var(--tx-3); }
.chip.rev .dot{ width:5px; height:5px; border-radius:var(--pill); background:var(--ok); }

.skills{ display:flex; gap:28px; }
.skcol{ flex:1; min-width:0; }
.skh{ font-size:12.5px; font-weight:600; margin-bottom:9px; }
.skr{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 0; }
.skr + .skr{ border-top:1px solid var(--line-2); }
.skn{ font-size:12.5px; color:var(--tx-2); }
.skl{ height:23px; padding:0 11px; border-radius:var(--r-sm); background:var(--wash); font-size:11.5px; display:flex; align-items:center; }
.ska{ font-size:10.5px; color:var(--tx-4); margin-top:2px; text-align:right; }

.todo{ display:flex; align-items:center; gap:14px; padding:13px 16px; border-radius:var(--r-md); background:var(--wash); }
.todo + .todo{ margin-top:9px; }
.todo .tn{ flex:1; min-width:0; }
.todo .tt{ font-size:13px; font-weight:600; color:var(--tx-2); }
.todo .td{ margin-top:3px; font-size:12px; color:var(--tx-3); }
.todo .tg{ flex-shrink:0; height:23px; padding:0 11px; border-radius:var(--r-sm); background:var(--card); font-size:11.5px; color:var(--tx-3); display:flex; align-items:center; }

.blk{ border-radius:var(--r-md); background:var(--wash); padding:16px; }
.blk + .blk{ margin-top:11px; }
.blkh{ display:flex; align-items:center; gap:12px; }
.blkn{ width:26px; height:26px; flex-shrink:0; border-radius:var(--pill); background:var(--ink); color:#fff;
  font-size:12px; font-weight:600; display:flex; align-items:center; justify-content:center; }
.blkt{ flex:1; min-width:0; font-size:14px; font-weight:600; letter-spacing:-.025em; }
.blkw{ font-size:11.5px; color:var(--tx-3); white-space:nowrap; }
.stp{ display:flex; align-items:center; gap:10px; padding:8px 0 8px 38px; font-size:12.5px; color:var(--tx-2); position:relative; }
.stp + .stp::before{ content:''; position:absolute; top:0; left:38px; right:0; height:1px; background:var(--line-2); }
.stp .sq{ width:5px; height:5px; border-radius:2px; background:var(--tx-4); flex-shrink:0; }
.blkf{ margin-top:10px; margin-left:38px; display:flex; flex-wrap:wrap; gap:6px; }

.loop{ display:flex; flex-direction:column; }
.lrow{ display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:var(--r-md); background:var(--wash); }
.lrow .li{ width:32px; height:32px; flex-shrink:0; border-radius:var(--r-sm); background:var(--card);
  display:flex; align-items:center; justify-content:center; color:var(--tx-2); }
.lrow .li svg{ width:15px; height:15px; }
.lrow .lt{ font-size:13.5px; font-weight:600; letter-spacing:-.025em; }
.lrow .ld{ margin-top:3px; font-size:12px; color:var(--tx-3); }
.lcon{ height:14px; margin-left:32px; border-left:1px solid var(--line); }

.rew{ text-align:center; padding:16px 0 4px; }
.rewn{ font-size:46px; font-weight:600; letter-spacing:-.045em; font-variant-numeric:tabular-nums; line-height:1; }
.rewl{ margin-top:9px; font-size:13px; color:var(--gold); font-weight:600; }
.rewsub{ margin-top:12px; font-size:12.5px; color:var(--tx-2); line-height:1.6; max-width:380px; margin-left:auto; margin-right:auto; }
.rewgrid{ margin-top:22px; display:flex; flex-direction:column; gap:9px; }
.rewrow{ display:flex; align-items:center; justify-content:space-between; padding:13px 16px; border-radius:var(--r-md); background:var(--wash); font-size:13px; }
.rewrow .k{ color:var(--tx-2); }
.rewrow .v{ font-weight:600; display:flex; align-items:center; gap:7px; }
.rewrow .v svg{ width:13px; height:13px; color:var(--ok); }
.dl{ margin-top:20px; border-radius:var(--r-md); background:var(--ink); padding:16px; display:flex; align-items:center; gap:14px; }
.dl .dz{ width:40px; height:40px; border-radius:var(--r-sm); background:rgba(255,255,255,.12); display:flex; align-items:center; justify-content:center; }
.dl .dz svg{ height:10px; width:auto; color:#fff; }
.dl .dn{ flex:1; min-width:0; color:#fff; }
.dl .dt{ font-size:13.5px; font-weight:600; letter-spacing:-.025em; }
.dl .dd{ margin-top:3px; font-size:12px; color:rgba(255,255,255,.55); }
.dl .db{ height:34px; padding:0 16px; border-radius:var(--pill); background:#fff; color:var(--ink);
  font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:7px; }
.dl .db svg{ width:12px; height:12px; }

.ghost{ box-shadow:0 16px 36px rgba(0,0,0,.16); }
@media (max-width:1180px){ .right{ display:none!important; } }
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{ animation-duration:.01ms!important; transition-duration:.01ms!important; } }
</style>
</head>
<body>

<div class="top">

function grab(text,map){ const t=' '+text.toLowerCase()+' ';
  for(const [val,words] of Object.entries(map)) if(words.some(w=>t.includes(w))) return val; return null; }
function grabFields(text){ const t=text.toLowerCase(); const out=[];
  for(const [k,words] of Object.entries(KW.fields)) if(words.some(w=>t.includes(w))) out.push(k);
  return out.slice(0,2); }
function grabCity(text){ const t=text.toLowerCase();
  for(const c of CITIES) if(t.includes(c.toLowerCase())) return c==='NYC'?'New York':(c==='Bengaluru'?'Bangalore':c); return null; }
function grabName(text){
  const m=text.match(/(?:i'?m|i am|my name is|call me|this is)\s+([A-Za-z]{2,15})/i);
  if(!m) return null;
  const bad=['looking','trying','currently','from','based','working','studying','interested','going','still','just','really','not','more','about','done','ready','excited','good','fine','open'];
  const n=m[1].toLowerCase();
  if(bad.includes(n)) return null;
  return m[1].charAt(0).toUpperCase()+m[1].slice(1).toLowerCase();
}
function grabTimeline(text){ const t=text.toLowerCase();
  const m=t.match(/(\d+)\s*(month|week|year)/); if(m) return m[1]+' '+m[2]+(+m[1]>1?'s':'');
  if(t.includes('asap')||t.includes('as soon')) return 'As soon as possible';
  if(t.includes('this year')) return 'This year';
  if(t.includes('intern')) return 'Internship first';
  if(t.includes('no rush')||t.includes('no timeline')) return 'No rush';
  return null; }
function quoteOf(text){ let q=text.trim().replace(/\s+/g,' ');
  if(q.length>64) q=q.slice(0,61).replace(/\s\S*$/,'')+'…';
  return q.charAt(0).toUpperCase()+q.slice(1); }

(function(){
  $('dGhost').innerHTML=ZSVG;
  const cv=$('drawCanvas'), ctx=cv.getContext('2d');
  let pts=[], down=false, len=0;
  function size(){ cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio;
    ctx.scale(devicePixelRatio,devicePixelRatio); ctx.lineCap='round'; ctx.lineJoin='round'; }
  size(); addEventListener('resize',size);
  function paint(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    if(pts.length<2) return;
    ctx.strokeStyle='#111113'; ctx.lineWidth=5;
    ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
    ctx.stroke();
  }
  cv.addEventListener('pointerdown',e=>{ down=true; pts=[{x:e.clientX,y:e.clientY}]; len=0; });
  cv.addEventListener('pointermove',e=>{ if(!down) return;
    const p={x:e.clientX,y:e.clientY}, q=pts[pts.length-1];
    len+=Math.hypot(p.x-q.x,p.y-q.y); pts.push(p); paint(); });
  const finish=()=>{ if(!down) return; down=false;
    if(len>220) accept(); else { sfx('tick');
      gsap.to(cv,{opacity:0,duration:.4,onComplete:()=>{pts=[];paint();gsap.set(cv,{opacity:1});}}); } };
  cv.addEventListener('pointerup',finish); cv.addEventListener('pointercancel',finish);
  cv.addEventListener('dblclick',()=>accept());
  addEventListener('keydown',e=>{ if(e.key==='Enter'&&$('drawScreen').style.display!=='none') accept(); });
  setTimeout(()=>gsap.to('#dHint',{opacity:1,duration:.6}),5200);
  let accepted=false;
  window.__acceptDraw=accept;
  function accept(){
    if(accepted) return; accepted=true;
    sfx('bloom');
    safeTL(gsap.timeline()
      .to(cv,{opacity:0,duration:.5},0)
      .to('#dGhost',{opacity:.9,scale:1.04,duration:.7,ease:EIO},0)
      .to('.dh, .ds, #dHint',{opacity:0,y:-10,duration:.4},0)
      .to('#dGhost',{opacity:0,scale:.92,duration:.5},'+=.35')
      .to('#drawScreen',{opacity:0,duration:.5},'-=.2'),3200);
    setTimeout(()=>{ $('drawScreen').style.display='none'; intro(); },2200);
  }
})();

let rec=null, listening=false;
function stopRec(){ try{ if(rec) rec.stop(); }catch(e){} listening=false; }
function buildComposer(box){
  busy=false;
  if(mode==='talk'){
    const v=mk('div','voice');
    const interim=mk('div','interim'); interim.id='interim';
    const row=mk('div','vrow');
    const kb=mk('button','mini',I.kbd); kb.setAttribute('aria-label','Type instead');
    const wrapM=mk('div','micwrap');
    const ring1=mk('span','ring'), ring2=mk('span','ring');
    const mic=mk('button','mic',I.micro); mic.setAttribute('aria-label','Talk to Zero');
    wrapM.appendChild(ring1); wrapM.appendChild(ring2); wrapM.appendChild(mic);
    const spacer=mk('div','mini'); spacer.style.visibility='hidden';
    row.appendChild(kb); row.appendChild(wrapM); row.appendChild(spacer);
    const hint=mk('div','vhint','Tap and talk. Zero is listening.');
    v.appendChild(interim); v.appendChild(row); v.appendChild(hint);
    box.appendChild(v);
    let pulse=null;
    const startPulse=()=>{ pulse=gsap.timeline({repeat:-1});
      pulse.fromTo([ring1,ring2],{opacity:.5,scale:1},{opacity:0,scale:1.65,duration:1.4,stagger:.45,ease:'power1.out'}); };
    const stopPulse=()=>{ if(pulse){pulse.kill();pulse=null;} gsap.set([ring1,ring2],{opacity:0,scale:1}); };
    mic.onclick=()=>{
      if(busy) return;
      if(listening){ stopRec(); stopPulse(); mic.innerHTML=I.micro; mic.classList.remove('live'); hint.textContent='Tap and talk. Zero is listening.'; sfx('release'); return; }
      const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
      if(!SR){ mode='type'; sfx('error');
        const t=$('turn'); const b=t.querySelector('.opts');
        b.innerHTML=''; buildComposer(b);
        const note=mk('div','vhint','No microphone here, so we will type.'); note.style.textAlign='center'; note.style.marginTop='12px';
        b.appendChild(note); return; }
      try{
        rec=new SR(); rec.lang='en-US'; rec.interimResults=true; rec.continuous=false;
        let final='';
        rec.onresult=e=>{ let it='';
          for(let i=e.resultIndex;i<e.results.length;i++){
            if(e.results[i].isFinal) final+=e.results[i][0].transcript; else it+=e.results[i][0].transcript; }
          interim.textContent=final||it; };
        rec.onerror=()=>{ stopPulse(); listening=false; mic.innerHTML=I.micro; mic.classList.remove('live');
          hint.textContent='Could not hear that. Tap to try again, or type instead.'; };
        rec.onend=()=>{ stopPulse(); listening=false; mic.innerHTML=I.micro; mic.classList.remove('live');
          if(final.trim()){ sfx('release'); submit(final.trim()); }
          else hint.textContent='Tap and talk. Zero is listening.'; };
        rec.start(); listening=true; mic.innerHTML=I.stop; mic.classList.add('live');
        hint.textContent='Listening. Tap again when you are done.';
        startPulse(); sfx('press');
      }catch(e){ listening=false; }
    };
    kb.onclick=()=>{ stopRec(); mode='type'; sfx('tick');
      const t=$('turn'); const b=t.querySelector('.opts');
      const chips=b.querySelector('.chips');
      b.innerHTML=''; buildComposer(b); if(chips) b.appendChild(chips); };
  } else {
    const r=mk('div','row');
    const f=mk('div','box'); const inp=document.createElement('input');
    inp.placeholder='Say it any way you like'; inp.setAttribute('aria-label','Your answer');
    const go=mk('button','go',I.arrow); go.setAttribute('aria-label','Send');
    const fire=()=>{ const v=inp.value.trim(); if(!v||busy) return; sfx('droplet'); submit(v); };
    inp.oninput=()=>gsap.to(go,{opacity:inp.value.trim()?1:.25,duration:.2});
    inp.onkeydown=e=>{ if(e.key==='Enter') fire(); };
    go.onclick=fire;
    f.appendChild(inp); r.appendChild(f);
    const mic=mk('button','mini',I.micro); mic.setAttribute('aria-label','Talk instead');
    mic.style.width='58px'; mic.style.height='58px';
    mic.onclick=()=>{ mode='talk'; sfx('tick');
      const t=$('turn'); const b=t.querySelector('.opts');
      const chips=b.querySelector('.chips');
      b.innerHTML=''; buildComposer(b); if(chips) b.appendChild(chips); };
    r.appendChild(mic); r.appendChild(go);
    box.appendChild(r);
    setTimeout(()=>inp.focus(),450);
  }
}

    chips:["I'm a design student in my final year","I work in sales and I want out","Honestly, I'm still figuring it out"],
    probe:{ slot:'fields', q:'And the work itself. What kind pulls you in?', sub:'Design, data, building products, selling, writing, running operations. Any words you like.' } },
  { k:'dream', q:'Now the dream. Role, company, anywhere on earth.', sub:'Say it out loud. That is what this is for.',
    chips:['Product designer at a startup in Dubai','PM at big tech, fully remote','A data role in London'],
    react:'🔥',
    probe:{ slot:'location', q:'And where in the world do you want to be?', sub:'A city, a country, or just remote.' } },
  { k:'industry', q:'Which industry, and what problems do you want to solve?', sub:'The work changes shape depending on where it happens.',
    chips:['AI products people actually use','Health, something that matters','Climate. The hard stuff'] },
  { k:'start', q:'Where are you starting from, and how fast do you want this?', sub:'Studying, working, switching. Months or years. Honest answers make better plans.',
    chips:['Final year student, 6 months','Working now, switching this year','No timeline, doing it right'] },
  { k:'hard', q:'Last one. What is non-negotiable for you?', sub:'The thing you will not trade. Zero plans around it, not against it.',
    react:'❤️',
    chips:['Remote, always','It has to pay well','A team I actually learn from'] },
];

function extract(text){
  const found=[];
  const n=grabName(text); if(n&&!P.name){ P.name=n; found.push('name'); }
  const f=grabFields(text); if(f.length){ P.fields=[...new Set([...P.fields,...f])].slice(0,2); found.push('fields'); }
  const r=grab(text,ROLEWORDS); if(r&&!P.role){ P.role=r; found.push('role'); }
  const c=grabCity(text); if(c){ P.location=c; found.push('location'); }
  const co=grab(text,KW.company); if(co){ P.company=co; found.push('company'); }
  const ind=grab(text,KW.industry); if(ind){ P.industry=ind; found.push('industry'); }
  const lv=grab(text,KW.level); if(lv&&!P.level){ P.level=lv; found.push('level'); }
  const tl=grabTimeline(text); if(tl){ P.timeline=tl; found.push('timeline'); }
  return found;
}
function ackFor(found,text,turn){
  const bits=[];
  if(found.includes('name')) bits.push('Good to meet you, <span class="hl">'+P.name+'</span>.');
  if(found.includes('location')) bits.push('<span class="hl">'+P.location+'</span>. Noted. That changes which teams we look at.');
  else if(found.includes('role')) bits.push('<span class="hl">'+P.role+'</span>. That is buildable.');
  else if(found.includes('fields')) bits.push('<span class="hl">'+P.fields.map(f=>DISC[f].label).join(' and ')+'</span>. Heard.');
  else if(found.includes('industry')) bits.push('<span class="hl">'+P.industry+'</span>. Good choice of battlefield.');
  else if(found.includes('timeline')) bits.push('<span class="hl">'+P.timeline+'</span>. Workable.');
  else if(found.includes('company')) bits.push('<span class="hl">'+P.company+'</span>. Fits what you said before.');
  if(!bits.length){
    if(turn&&turn.k==='hard') bits.push('Written down. That one shapes everything.');
    else bits.push('Got it. That is going on the board.');
  }
  return bits.slice(0,2).join(' ');
}

let probed=false;
async function submit(text){
  if(busy) return; busy=true;
  stopRec();
  const turn=TURNS[turnIdx];
  const found=extract(text);
  /* free-text slots that keep the user's own words */
  if(turn){
    if(turn.k==='industry'&&!found.includes('industry')&&!P.problems){ P.problems=quoteOf(text); fillSlot('problems'); }
    if(turn.k==='industry'&&found.includes('industry')&&text.length>24&&!P.problems){ P.problems=quoteOf(text); fillSlot('problems'); }
    if(turn.k==='hard'){ P.hard=quoteOf(text); fillSlot('hard'); }
  }
  found.forEach(fillSlot);
  await wait(650);

  /* one gentle follow-up if the key slot for this turn is still empty */
  if(turn&&turn.probe&&!probed&&!slotVal(turn.probe.slot)){
    probed=true; busy=false;
    ask({ said: ackFor(found,text,turn), saidHTML: ackFor(found,text,turn), q: turn.probe.q, sub: turn.probe.sub, chips: turn.chips });
    return;
  }
  probed=false;
  nextTurn(ackFor(found,text,turn), turn?turn.react&&Math.random()<.9?turn.react:null:null);
}
function nextTurn(ackHTML,react){
  turnIdx++;
  if(turnIdx<TURNS.length){
    const t=TURNS[turnIdx];
    ask({ saidHTML:ackHTML, q:t.q, sub:t.sub, chips:t.chips, react:react });
  } else {
    calibrate(ackHTML);
  }
}

  h.innerHTML='<div class="pav">'+(P.name||'Y').charAt(0).toUpperCase()+'</div><div class="pid"><div class="pname">'+
    (P.name||'You')+'</div><div class="pmeta"><span class="m">'+I.box+'<span>'+(picked||d.role)+'</span></span>'+
    '<span class="sep"></span><span class="m">'+I.pin+'<span>'+(P.location||'Anywhere')+'</span></span></div></div>'+
    '<div class="pbadge"><span>'+(LEVELMAP[P.level]||'Proficient')+'</span>'+I.spark+'</div>';
  s.appendChild(h);
  s.appendChild(mk('p','pbio',d.bio));
  const body=mk('div'); body.id='pBody'; s.appendChild(body);
}
function addProject(i){ const d=primary();
  if(i===0) landIn(section('Projects','pCount'),true);
  landIn(projectRow(d.projects[i],i));
  const c=$('pCount'); if(c) c.textContent=(i+1)+' shipped'; }
function addSkills(){ const d=primary(); landIn(section('Skills'),true);
  const sk=mk('div','skills'); sk.appendChild(skillCol('Hard skills',d.skills.slice(0,3)));
  sk.appendChild(skillCol('Soft skills',d.soft.slice(0,3))); landIn(sk); }
function addTodo(){ const d=primary(); landIn(section('Still ahead'),true);
  const box=mk('div');
  d.todo.forEach(([t,dd])=>{ const n=mk('div','todo'); const w=mk('div','tn');
    w.appendChild(mk('div','tt',t)); w.appendChild(mk('div','td',dd));
    n.appendChild(w); n.appendChild(mk('span','tg','Yet to do')); box.appendChild(n); });
  landIn(box); }
async function outcomeStage(){
  setPhase(3);
  const t=$('turn'); if(t) gsap.to(t,{opacity:0,y:-16,duration:.3,ease:'power2.in',onComplete:()=>t.remove()});
  await wait(380);
  line('Four months of that, and this is yours.');
  await wait(1300);
  await swapPanel('Your portfolio, at the end of the plan',buildPortfolioShell,false);
  await wait(500);
  await beat('You would start here.',()=>addProject(0),1700);
  await beat('Then this one.',()=>addProject(1),1650);
  await beat('And this is the one they ask about in interviews.',()=>addProject(2),1800);
  await beat('They build these skills, and Zero verifies them.',()=>addSkills(),1750);
  await beat('This is what is still ahead. That gap is the point.',()=>addTodo(),1700);
  line('I cannot hand you the job. I can get you the portfolio that wins it.','Work someone can read. Not a certificate.');
  await wait(1600);
  cta('Who runs all this?',zeroStage);
}

/* ============================ launch · zero, credits, app ============================ */
function buildLoop(s){
  const rows=[['Scenario','A real brief with a deadline and a reviewer','folder'],
    ['Deliverable','The work you actually hand in','doc'],
    ['Manager feedback','A manager reads it and tells you the truth','users'],
    ['Portfolio','Reviewed work becomes proof','target'],
    ['Hired','Partners browse verified portfolios','spark']];
  const head=mk('div'); head.style.cssText='display:flex;align-items:center;gap:14px;margin-bottom:6px';
  const z=mk('div'); z.style.cssText='width:58px;height:58px;border-radius:12px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;padding:0 12px';
  z.innerHTML=ZSVG; z.querySelector('svg').style.cssText='height:15px;width:auto';
  const zt=mk('div'); zt.innerHTML='<div class="pname">Zero</div><div class="pmeta"><span class="m">The system that runs the loop</span></div>';
  head.appendChild(z); head.appendChild(zt); s.appendChild(head);
  s.appendChild(mk('p','pbio','You do not study first and apply later. You do the job, a manager reviews it, and the proof accumulates. Every finished scenario adds XP. XP unlocks harder scenarios, the job portal, and your performance calibration.'));
  const loop=mk('div','loop'); loop.style.marginTop='18px';
  rows.forEach(([t,dd,ic],i)=>{ const r=mk('div','lrow'); r.appendChild(mk('div','li',I[ic]));
    const n=mk('div'); n.appendChild(mk('div','lt',t)); n.appendChild(mk('div','ld',dd)); r.appendChild(n);
    loop.appendChild(r); if(i<rows.length-1) loop.appendChild(mk('div','lcon')); });
  s.appendChild(loop);
}
async function zeroStage(){
  setPhase(4);
  const t=$('turn'); if(t) gsap.to(t,{opacity:0,y:-16,duration:.3,ease:'power2.in',onComplete:()=>t.remove()});
  await wait(380);
  line('Fair question.');
  await wait(1200);
  await swapPanel('How Zero works',buildLoop,false);
  await wait(650);
  line('Zero runs it.','Real briefs, a manager who reviews your work, XP that unlocks the next tier. That is the whole product.');
  await wait(2300);
  cta('What do I get to start?',rewardStage);
}
function buildReward(s){
  const box=mk('div','rew');
  const n=mk('div','rewn','0'); n.id='rewN'; box.appendChild(n);
  box.appendChild(mk('div','rewl','credits, yours to start'));
  box.appendChild(mk('div','rewsub','Credits are what scenarios and reviews cost inside Zero. Ten thousand covers your first weeks in full, so starting costs you nothing. XP earned from finished work unlocks the tiers after that.'));
  s.appendChild(box);
  const d=primary();
  const scen=d.projects.reduce((a,p)=>a+p.steps.length,0);
  const g=mk('div','rewgrid');
  [['Aiming at',picked||d.role],['Scenarios ready',String(scen)],['Credits','10,000'],['Cost to start','Nothing']]
    .forEach(([k,v])=>{ const r=mk('div','rewrow'); r.appendChild(mk('span','k',k));
      r.appendChild(mk('span','v',I.check+'<span>'+v+'</span>')); g.appendChild(r); });
  s.appendChild(g);
  const dl=mk('div','dl'); dl.id='dlCard'; dl.style.display='none';
  const z=mk('div','dz',ZSVG);
  const nn=mk('div','dn','<div class="dt">Zero for desktop</div><div class="dd">macOS and Windows · your credits are already on it</div>');
  const b=mk('button','db',I.dl+'<span>Download</span>'); b.onclick=()=>sfx('success');
  dl.appendChild(z); dl.appendChild(nn); dl.appendChild(b); s.appendChild(dl);
}
async function rewardStage(){
  const t=$('turn'); if(t) gsap.to(t,{opacity:0,y:-16,duration:.3,ease:'power2.in',onComplete:()=>t.remove()});
  await wait(380);
  line('One more thing. You already earned something.');
  await wait(1400);
  await swapPanel('What you start with',buildReward,false);
  await wait(420);
  const c={v:0};
  safeTL(gsap.timeline().to(c,{v:10000,duration:1.5,ease:EIO,
    onUpdate:()=>{const e=$('rewN'); if(e) e.textContent=fmt(Math.round(c.v));}}),1900);
  setTimeout(()=>{const e=$('rewN'); if(e) e.textContent=fmt(10000);},1950);
  sfx('sparkle'); await wait(1700); sfx('chime');
  line('Ten thousand credits, for finishing this conversation.','Credits pay for scenarios and reviews. Put an email on them and the whole plan is waiting in the app.');
  await wait(1900);
  const t2=$('turn'); const acct=mk('div','acct');
  const row=mk('div','row'); const bx=mk('div','box'); bx.style.width='360px';
  const inp=document.createElement('input'); inp.placeholder='you@email.com'; inp.type='email'; inp.setAttribute('aria-label','Your email');
  const go=mk('button','go',I.arrow); go.setAttribute('aria-label','Create account');
  const ok=v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  const fire=()=>{const v=inp.value.trim();
    if(!ok(v)){ sfx('error'); gsap.fromTo(bx,{x:0},{x:7,duration:.07,yoyo:true,repeat:5}); return; }
    sfx('success'); finish(v); };
  inp.oninput=()=>gsap.to(go,{opacity:ok(inp.value.trim())?1:.25,duration:.2});
  inp.onkeydown=e=>{if(e.key==='Enter')fire();}; go.onclick=fire;
  bx.appendChild(inp); row.appendChild(bx); row.appendChild(go);
  acct.appendChild(row); acct.appendChild(mk('div','note','No card. Nothing to cancel.'));
  t2.appendChild(acct);
  safeTL(gsap.timeline().fromTo(acct,{opacity:0,y:12},{opacity:1,y:0,duration:.45}),900);
  setTimeout(()=>inp.focus(),500);
}
async function finish(email){
  const t=$('turn'); if(t) gsap.to(t,{opacity:0,y:-16,duration:.3,ease:'power2.in',onComplete:()=>t.remove()});
  const dl=$('dlCard');
  if(dl){ dl.style.display='flex';
    safeTL(gsap.timeline().fromTo(dl,{opacity:0,y:16},{opacity:1,y:0,duration:.6}),1000);
    const s=$('scroll'); setTimeout(()=>{s.scrollTop=Math.max(0,s.scrollHeight-s.clientHeight);},300); }
  setCap('Ready when you are',false); await wait(520);
  line(`That is it, ${P.name||'you'}.`,`Your account is on ${email}. Open Zero and your first scenario is already briefed.`);
  await wait(1900);
  const t2=$('turn'); const n=mk('div','next show');
  const again=mk('button','btn quiet','Run it again'); again.onclick=()=>location.reload();
  n.appendChild(again); t2.appendChild(n);
  safeTL(gsap.timeline().fromTo(n,{opacity:0,y:12},{opacity:1,y:0,duration:.45}),900);
  sfx('ready');
}

/* ============================ boot ============================ */
gsap.set(['#logoPill','.tr'],{opacity:0,y:-9});
setPhase(0);
</script>
