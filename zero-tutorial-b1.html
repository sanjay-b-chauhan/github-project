<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>How Zero works</title>
<link rel="icon" href="zero-tutorial-assets-b1/img/zero-mark.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,100..1000&display=swap">
<style>
/* core.css */
/* ZERO overview tour · core. Everything the tour itself draws is prefixed zt-.
   Chapter screens live under .zt-ch.ch-<id> and must scope their own rules there. */
@font-face{font-family:'STK Bureau Serif';src:url('zero-tutorial-assets-b1/fonts/STKBureau-SerifBook.otf') format('opentype');font-weight:400;font-display:swap}
@font-face{font-family:'STK Bureau Serif';src:url('zero-tutorial-assets-b1/fonts/STKBureau-SerifMedium.otf') format('opentype');font-weight:500;font-display:swap}
@font-face{font-family:'PP Supply Mono';src:url('zero-tutorial-assets-b1/fonts/PPSupplyMono-Regular.otf') format('opentype');font-weight:400;font-display:swap}

:root{
  --zt-ease:cubic-bezier(.625,.05,0,1);
  --zt-green:#49BA61; --zt-green-deep:#2E9A48; --zt-green-ink:#06210f;
  --f-serif:'STK Bureau Serif',Georgia,serif;
  --f-sans:'Google Sans Flex','Google Sans',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-mono:'PP Supply Mono','SFMono-Regular',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#141414}
body{font-family:var(--f-sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;transition:background .6s var(--zt-ease)}
button{font-family:inherit}

/* One fixed design canvas, scaled to fit. Chapters draw in 1600 x 840 px. */
#zt-root{position:fixed;left:0;top:0;width:1600px;height:840px;transform-origin:0 0;
  --zt-ink:#f2f1ee; --zt-ink-2:rgba(242,241,238,.6); --zt-ink-3:rgba(242,241,238,.34);
  --zt-chip:rgba(255,255,255,.08); --zt-chip-h:rgba(255,255,255,.14)}
#zt-root[data-tone="light"]{--zt-ink:#1f1d1e; --zt-ink-2:rgba(31,29,30,.62); --zt-ink-3:rgba(31,29,30,.34);
  --zt-chip:rgba(31,29,30,.06); --zt-chip-h:rgba(31,29,30,.11)}
#zt-stage{position:absolute;inset:0;overflow:hidden}

/* chapter screens: a blur morph, never a hard cut */
.zt-ch{position:absolute;inset:0;overflow:hidden;opacity:0;transform:scale(1.012);filter:blur(12px);
  transition:opacity .5s var(--zt-ease),transform .72s var(--zt-ease),filter .5s var(--zt-ease)}
.zt-ch.zt-in{opacity:1;transform:none;filter:none}
.zt-ch.zt-exit{opacity:0;transform:scale(.988);filter:blur(12px);pointer-events:none}

/* ---------- the guide: one face that changes seat ---------- */
.zt-guide{position:absolute;z-index:60;left:28px;top:778px;width:48px;height:48px;border-radius:50%;pointer-events:none;
  transition:left .76s var(--zt-ease),top .76s var(--zt-ease),width .76s var(--zt-ease),height .76s var(--zt-ease),border-radius .76s var(--zt-ease),opacity .4s var(--zt-ease)}
.zt-guide.zt-instant{transition:none}
.zt-guide.zt-hidden{opacity:0}
.zt-g-photo{position:absolute;inset:0;border-radius:inherit;overflow:hidden;background:#2b2b2b}
.zt-g-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:opacity .5s var(--zt-ease)}
.zt-g-photo .zt-wide{opacity:0;object-position:68% 20%}
.zt-guide[data-shape="tile"] .zt-wide{opacity:1}
.zt-guide[data-shape="tile"] .zt-face{opacity:0}
.zt-g-ring{position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 0 rgba(73,186,97,0);transition:box-shadow .16s linear}
.zt-guide.zt-speaking .zt-g-ring{box-shadow:0 0 0 calc(2px + var(--amp,0) * 4px) rgba(73,186,97,calc(.62 + var(--amp,0) * .38))}
.zt-g-tag{position:absolute;white-space:nowrap;display:flex;flex-direction:column;gap:3px;color:var(--zt-ink);
  letter-spacing:-.01em;transition:opacity .35s var(--zt-ease)}
.zt-g-tag b{font:600 14px/1.1 var(--f-sans)}
.zt-g-tag span{font:400 12.5px/1.1 var(--f-sans);color:var(--zt-ink-2);display:inline-block;transition:opacity .25s,filter .25s,transform .35s var(--zt-ease)}
.zt-g-tag span.zt-swap{opacity:0;filter:blur(5px);transform:translateY(4px)}
.zt-guide[data-tag="right"] .zt-g-tag{left:calc(100% + 12px);top:50%;transform:translateY(-50%)}
.zt-guide[data-tag="below"] .zt-g-tag{top:calc(100% + 14px);left:50%;transform:translateX(-50%);align-items:center;text-align:center}
.zt-guide[data-tag="below"] .zt-g-tag b{font-size:17px}
.zt-guide[data-tag="below"] .zt-g-tag span{font-size:14px}
.zt-guide[data-tag="inside"] .zt-g-tag{left:16px;bottom:14px;flex-direction:row;align-items:baseline;gap:8px;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.55)}
.zt-guide[data-tag="inside"] .zt-g-tag span{color:rgba(255,255,255,.78)}
.zt-guide[data-tag="none"] .zt-g-tag{opacity:0}
.zt-guide.zt-flying .zt-g-tag{opacity:0;transition-duration:.12s}

/* ---------- Navid's pointer ---------- */
.zt-cursor{position:absolute;z-index:72;left:0;top:0;--x:60px;--y:790px;transform:translate(var(--x),var(--y));opacity:0;pointer-events:none;
  transition:transform .72s var(--zt-ease),opacity .28s var(--zt-ease)}
.zt-cursor.zt-on{opacity:1}
.zt-cursor svg{display:block;width:24px;height:24px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
.zt-cursor em{position:absolute;left:17px;top:20px;font:600 11.5px/1 var(--f-sans);font-style:normal;letter-spacing:-.005em;
  background:var(--zt-green);color:var(--zt-green-ink);padding:5px 8px 5px;border-radius:3px 10px 10px 10px;white-space:nowrap}
.zt-cursor.zt-tap svg{animation:zt-tap .36s var(--zt-ease)}
@keyframes zt-tap{40%{transform:scale(.8)}100%{transform:none}}
.zt-ink{position:absolute;inset:0;z-index:66;pointer-events:none;overflow:visible}
.zt-ink rect{fill:none;stroke:var(--zt-green);stroke-width:2.25;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;
  transition:stroke-dashoffset .62s var(--zt-ease),opacity .35s}
.zt-ink rect.zt-drawn{stroke-dashoffset:0}
.zt-ink rect.zt-pulse{animation:zt-pulse 1.5s ease-in-out .7s infinite}
.zt-ink rect.zt-gone{opacity:0}
@keyframes zt-pulse{50%{opacity:.38}}
.zt-ripple{position:absolute;z-index:71;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:2px solid var(--zt-green);pointer-events:none;animation:zt-ripple .55s var(--zt-ease) forwards}
@keyframes zt-ripple{to{transform:scale(4.4);opacity:0}}

/* ---------- the tour's own controls: one quiet row along the bottom ---------- */
.zt-dock{position:absolute;left:0;right:0;bottom:0;height:76px;z-index:80;pointer-events:none}
.zt-home{position:absolute;left:28px;bottom:14px;width:48px;height:48px;border-radius:50%}
.zt-center{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:820px;height:56px;display:grid;place-items:end center}
.zt-center>*{grid-area:1/1}
.zt-cc{max-width:760px;font:400 15.5px/1.38 var(--f-sans);letter-spacing:-.01em;color:#fff;text-align:center;text-wrap:balance;
  background:rgba(16,16,16,.8);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:9px 16px 10px;border-radius:14px;
  opacity:0;transform:translateY(6px);transition:opacity .22s var(--zt-ease),transform .36s var(--zt-ease)}
.zt-cc.zt-on{opacity:1;transform:none}
#zt-root.zt-nocc .zt-cc{display:none}
.zt-turn{pointer-events:auto;display:flex;align-items:center;gap:11px;background:#fff;color:#161616;border-radius:999px;padding:7px 18px 7px 7px;
  font:500 14.5px/1.2 var(--f-sans);letter-spacing:-.01em;box-shadow:0 14px 44px rgba(0,0,0,.3),0 0 0 1px rgba(0,0,0,.06);
  opacity:0;transform:translateY(12px) scale(.96);transition:opacity .28s var(--zt-ease),transform .5s var(--zt-ease);white-space:nowrap}
.zt-turn.zt-on{opacity:1;transform:none}
.zt-turn .zt-badge{display:inline-flex;align-items:center;gap:6px;background:#161616;color:#fff;font:600 12.5px/1 var(--f-sans);padding:9px 12px;border-radius:999px;transition:background .3s}
.zt-turn .zt-badge svg{width:13px;height:13px;display:none}
.zt-turn.zt-ok .zt-badge{background:var(--zt-green);color:var(--zt-green-ink)}
.zt-turn.zt-ok .zt-badge svg{display:block}
.zt-turn kbd{font:500 12px/1 var(--f-sans);color:#333;border:1px solid rgba(0,0,0,.16);border-bottom-width:2px;border-radius:7px;padding:5px 8px;background:#f5f5f4;margin:0 1px}
.zt-turn .zt-showme{appearance:none;border:0;background:none;color:#6b6b6b;font:500 13px/1 var(--f-sans);padding:6px 0 6px 12px;margin-left:2px;cursor:pointer;
  border-left:1px solid rgba(0,0,0,.1);display:none}
.zt-turn .zt-showme:hover{color:#161616}
.zt-turn.zt-nudge .zt-showme{display:block}
.zt-right{position:absolute;right:28px;bottom:22px;display:flex;align-items:center;gap:12px;color:var(--zt-ink-2);font:500 12.5px/1 var(--f-sans);letter-spacing:-.005em;pointer-events:auto;transition:opacity .4s}
.zt-step{color:var(--zt-ink)}
.zt-dots{display:flex;align-items:center;gap:5px}
.zt-dots i{width:6px;height:6px;border-radius:99px;background:var(--zt-ink-3);transition:width .5s var(--zt-ease),background .4s}
.zt-dots i.zt-done{background:var(--zt-ink-2)}
.zt-dots i.zt-now{width:20px;background:var(--zt-ink)}
.zt-ib{appearance:none;border:0;width:32px;height:32px;border-radius:10px;background:var(--zt-chip);color:var(--zt-ink);display:grid;place-items:center;cursor:pointer;transition:background .2s}
.zt-ib:hover{background:var(--zt-chip-h)}
.zt-ib svg{width:16px;height:16px}
.zt-ib.zt-off{color:var(--zt-ink-3)}
.zt-skip{appearance:none;border:0;background:var(--zt-chip);color:var(--zt-ink);font:500 12.5px/1 var(--f-sans);height:32px;padding:0 12px;border-radius:10px;cursor:pointer;transition:background .2s}
.zt-skip:hover{background:var(--zt-chip-h)}
#zt-root.zt-bare .zt-right,#zt-root.zt-bare .zt-center{opacity:0;pointer-events:none}

/* build stamp, so every screenshot names its build */
.zt-build{position:absolute;right:28px;bottom:6px;z-index:81;font:400 10px/1 var(--f-sans);color:var(--zt-ink-3);pointer-events:none}

@media (prefers-reduced-motion:reduce){
  .zt-ch,.zt-guide,.zt-cursor,.zt-turn,.zt-cc{transition-duration:.01s!important}
  .zt-ink rect.zt-pulse{animation:none}
}

/* ch/01-welcome.css */
/* 1 · welcome. Navid, full size, says what Zero is in fifteen seconds. */
.ch-welcome{background:#151515;color:#f2f1ee;font-family:var(--f-sans);letter-spacing:-.01em}
.ch-welcome .wl-mark{position:absolute;left:28px;top:24px;display:flex;align-items:center;gap:9px;font:500 16px/1 var(--f-sans);color:#f2f1ee}
.ch-welcome .wl-mark img{width:24px;height:24px;display:block}
.ch-welcome .wl-slot{position:absolute;left:732px;top:150px;width:136px;height:136px;border-radius:50%;background:#222}
.ch-welcome .wl-intro{position:absolute;left:0;right:0;top:372px;display:flex;flex-direction:column;align-items:center;text-align:center;
  transition:opacity .45s var(--zt-ease),transform .6s var(--zt-ease),filter .45s var(--zt-ease)}
.ch-welcome .wl-h{font:400 50px/1.08 var(--f-serif);letter-spacing:-.02em;margin:0;color:#f6f5f2}
.ch-welcome .wl-p{font:400 17px/1.5 var(--f-sans);color:rgba(242,241,238,.62);margin:16px 0 0;max-width:470px;text-wrap:balance}
.ch-welcome .wl-go{appearance:none;border:0;cursor:pointer;margin-top:34px;height:54px;padding:0 30px;border-radius:999px;
  font:600 16px/1 var(--f-sans);letter-spacing:-.01em;color:#06210f;
  background:linear-gradient(180deg,#5FD079 0%,#49BA61 55%,#3aa853 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 10px 30px rgba(73,186,97,.22);
  transition:transform .3s var(--zt-ease),box-shadow .3s}
.ch-welcome .wl-go:hover{transform:translateY(-1px);box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 14px 36px rgba(73,186,97,.3)}
.ch-welcome .wl-go:active{transform:scale(.98)}
.ch-welcome .wl-later{appearance:none;border:0;background:none;cursor:pointer;margin-top:16px;font:500 14px/1 var(--f-sans);color:rgba(242,241,238,.5);padding:8px 10px}
.ch-welcome .wl-later:hover{color:#f2f1ee}
.ch-welcome .wl-note{position:absolute;left:0;right:0;bottom:36px;display:flex;justify-content:center;align-items:center;gap:9px;
  font:400 13.5px/1 var(--f-sans);color:rgba(242,241,238,.46);transition:opacity .4s}
.ch-welcome .wl-note svg{width:15px;height:15px}
.ch-welcome.wl-playing .wl-intro{opacity:0;transform:translateY(-10px);filter:blur(8px);pointer-events:none}
.ch-welcome.wl-playing .wl-note{opacity:0}

/* the whole idea, as three things in a row */
.ch-welcome .wl-loop{position:absolute;left:0;right:0;top:418px;display:flex;justify-content:center;align-items:flex-start;gap:0}
.ch-welcome .wl-item{width:232px;display:flex;flex-direction:column;align-items:center;text-align:center;
  opacity:0;transform:translateY(14px) scale(.96);filter:blur(6px);transition:opacity .5s var(--zt-ease),transform .7s var(--zt-ease),filter .5s var(--zt-ease)}
.ch-welcome .wl-item.wl-on{opacity:1;transform:none;filter:none}
.ch-welcome .wl-ic{width:64px;height:64px;border-radius:22px;background:#222;display:grid;place-items:center;color:#f2f1ee;box-shadow:0 0 0 1px rgba(255,255,255,.07) inset}
.ch-welcome .wl-ic svg{width:27px;height:27px}
.ch-welcome .wl-item b{font:500 16px/1.3 var(--f-sans);margin-top:16px;color:#f2f1ee}
.ch-welcome .wl-item span{font:400 13.5px/1.4 var(--f-sans);color:rgba(242,241,238,.55);margin-top:5px;max-width:190px}
.ch-welcome .wl-link{width:58px;height:64px;display:grid;place-items:center;color:rgba(242,241,238,.3);opacity:0;transition:opacity .5s .15s}
.ch-welcome .wl-link.wl-on{opacity:1}
.ch-welcome .wl-link svg{width:22px;height:22px}
.ch-welcome .wl-loop.wl-out .wl-item,.ch-welcome .wl-loop.wl-out .wl-link{opacity:0;transform:translateY(-8px);filter:blur(6px)}

/* the nine steps ahead */
.ch-welcome .wl-path{position:absolute;left:0;right:0;top:452px;display:flex;justify-content:center;gap:8px;flex-wrap:nowrap}
.ch-welcome .wl-path i{font:500 13.5px/1 var(--f-sans);font-style:normal;color:rgba(242,241,238,.3);background:rgba(255,255,255,.045);padding:10px 13px;border-radius:999px;white-space:nowrap;
  opacity:0;transform:translateY(8px);transition:opacity .4s var(--zt-ease),transform .5s var(--zt-ease),color .35s,background .35s}
.ch-welcome .wl-path.wl-on i{opacity:1;transform:none}
.ch-welcome .wl-path i.wl-lit{color:#f2f1ee;background:rgba(255,255,255,.1)}

/* ch/02-scenario.css */
/* 2 · pick your project. The Campaign Landing, small: the city of companies, one building is ready.
   The map lives in .sc-cam (1840 x 1034.5, the city at 115%). Everything on the map is placed in
   percent of that box, so it rides the camera: wide (drift) -> sc-zoom (on Airbnb) -> sc-go (into it). */
.ch-scenario{background:#131514;color:#f2f1ee;font-family:var(--f-sans);letter-spacing:-.01em}

/* ---------- the camera ----------
   .sc-map holds the map one pixel inside the screen. While the camera moves the map is its own layer,
   and at a fractional window scale that layer can overshoot the screen edge by a pixel: this keeps
   that pixel dark instead of a bright seam beside the letterbox. */
.ch-scenario .sc-map{position:absolute;left:1px;top:1px;right:1px;bottom:1px;overflow:hidden}
.ch-scenario .sc-cam{position:absolute;left:-1px;top:-1px;width:1840px;height:1034.5px;transform-origin:0 0;
  transform:translate(-160px,-70px)}
.ch-scenario.sc-drift .sc-cam{transform:translate(-186px,-82px);transition:transform 40s linear}
.ch-scenario.sc-zoom .sc-cam{transform:translate(-1793.6px,-1015.2px) scale(2.3);transition:transform .95s var(--zt-ease)}
.ch-scenario.sc-go .sc-cam{transform:translate(-3120.6px,-1839.3px) scale(3.6);transition:transform .85s var(--zt-ease)}
.ch-scenario .sc-city{position:absolute;left:0;top:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
/* a sharper cut of the Airbnb neighbourhood (same map, 4096 wide), feathered in for the close-up */
.ch-scenario .sc-detail{position:absolute;left:39.0625%;top:40.7986%;width:41.5039%;height:39.0625%;display:block;opacity:0;
  user-select:none;-webkit-user-drag:none;transition:opacity .5s var(--zt-ease) .4s;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent),linear-gradient(180deg,transparent,#000 8%,#000 92%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent),linear-gradient(180deg,transparent,#000 8%,#000 92%,transparent);
  -webkit-mask-composite:source-in;mask-composite:intersect}
.ch-scenario.sc-zoom .sc-detail{opacity:1}

/* ---------- the Airbnb building: the one that is ready ---------- */
.ch-scenario .sc-hit{position:absolute;left:52.55%;top:55.5%;width:7.25%;height:9.7%;z-index:3;appearance:none;border:0;padding:0;margin:0;
  border-radius:30px;background:rgba(255,255,255,0);cursor:pointer;transition:background .2s var(--zt-ease),box-shadow .2s var(--zt-ease)}
.ch-scenario .sc-hit:hover{background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7)}
.ch-scenario .sc-hit:focus-visible{outline:2px solid #fff;outline-offset:3px}
.ch-scenario.sc-zoom .sc-hit{pointer-events:none;background:rgba(255,255,255,0);box-shadow:none}

/* the product's light column over the active company. Kept short so it never reaches the next building. */
.ch-scenario .sc-beam{position:absolute;left:55.7%;top:63.4%;width:70px;height:236px;margin:-236px 0 0 -35px;z-index:2;pointer-events:none;
  opacity:0;transform-origin:50% 100%;transform:scaleY(.55);
  background:linear-gradient(90deg,transparent 38%,rgba(245,255,249,.46) 50%,transparent 62%),
    linear-gradient(90deg,transparent 26%,rgba(222,255,232,.28) 50%,transparent 74%),
    linear-gradient(90deg,transparent 4%,rgba(178,255,196,.18) 24%,rgba(178,255,196,.42) 50%,rgba(178,255,196,.18) 76%,transparent 96%);
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 46%,#000 93%,transparent 100%);
  mask-image:linear-gradient(180deg,transparent 0,#000 46%,#000 93%,transparent 100%);
  transition:opacity .6s var(--zt-ease),transform .9s var(--zt-ease)}
.ch-scenario.sc-ready .sc-beam{opacity:1;transform:none}

/* map dots: the same glass disc the landing uses */
.ch-scenario .sc-dot{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;z-index:4;pointer-events:none}
.ch-scenario .sc-dot-go{left:55.7%;top:63.4%;
  background:radial-gradient(circle at 38% 30%,rgba(255,255,255,.6),rgba(255,255,255,.28) 70%);
  box-shadow:inset 0 1px 1.5px rgba(255,255,255,.6),inset 0 0 8px 1px rgba(255,255,255,.28),0 2px 8px rgba(0,0,0,.2)}
.ch-scenario .sc-dot-go::after{content:'';position:absolute;left:22%;top:22%;width:56%;height:56%;border-radius:50%;background:#fff;box-shadow:0 0 6px rgba(255,255,255,.7)}
.ch-scenario .sc-dot-go::before{content:'';position:absolute;left:0;top:0;width:100%;height:100%;border-radius:50%;
  box-shadow:inset 0 0 6px 2px rgba(255,255,255,.75);opacity:0;animation:sc-ripple 1.9s cubic-bezier(0,0,.2,1) infinite}
@keyframes sc-ripple{0%{transform:scale(.7);opacity:0}30%{opacity:.75}100%{transform:scale(2.4);opacity:0}}
.ch-scenario .sc-lock{display:grid;place-items:center;background:rgba(18,20,26,.66);color:#fff;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.24),0 2px 8px rgba(0,0,0,.28);transition:opacity .25s var(--zt-ease)}
.ch-scenario .sc-lock svg{width:12px;height:12px;display:block}

/* name chips above the buildings */
.ch-scenario .sc-chip{position:absolute;z-index:5;transform:translate(-50%,-100%);pointer-events:none;white-space:nowrap;
  transition:opacity .25s var(--zt-ease),transform .45s var(--zt-ease)}
.ch-scenario .sc-chip-go{left:56.15%;top:54.6%;display:flex;align-items:center;gap:7px;height:30px;padding:0 12px 0 9px;border-radius:999px;
  background:rgba(255,255,255,.96);color:#1c1a18;font:600 13.5px/1 var(--f-sans);box-shadow:0 8px 22px rgba(0,0,0,.28)}
.ch-scenario .sc-chip-go img{width:16px;height:16px;display:block}
.ch-scenario .sc-ready-tag{display:inline-flex;align-items:center;gap:5px;max-width:0;margin-left:0;overflow:hidden;opacity:0;
  font:600 12px/1 var(--f-sans);font-style:normal;color:#1f7a36;

.ch-scenario.sc-ready .sc-ready-tag{max-width:64px;margin-left:3px;opacity:1}
.ch-scenario.sc-picked .sc-chip-go{transform:translate(-50%,-100%) scale(1.06)}
.ch-scenario .sc-chip-lock{display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:8px 12px 9px;border-radius:13px;

.ch-scenario .sc-chip-lock b{display:flex;align-items:center;gap:7px;font:600 13px/1 var(--f-sans);color:rgba(255,255,255,.92)}
.ch-scenario .sc-chip-lock b img{width:14px;height:14px;display:block;filter:brightness(0) invert(1);opacity:.82}
.ch-scenario .sc-chip-lock span{font:400 11.5px/1.2 var(--f-sans);color:rgba(255,255,255,.64)}
.ch-scenario .sc-dd.sc-dot{left:54.6%;top:32.7%}
.ch-scenario .sc-dd.sc-chip{left:54.6%;top:27.7%}
.ch-scenario .sc-nf.sc-dot{left:61.8%;top:40.3%}
.ch-scenario .sc-nf.sc-chip{left:64.3%;top:35.8%}
.ch-scenario.sc-zoom .sc-chip,.ch-scenario.sc-zoom .sc-lock{opacity:0}

/* ---------- edge shade: the landing's left scrim, plus room for the tour's own dock ---------- */
.ch-scenario .sc-shade{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;
  background:linear-gradient(90deg,rgba(19,21,20,.76) 0,rgba(19,21,20,.42) 110px,rgba(19,21,20,0) 250px),
    linear-gradient(270deg,rgba(19,21,20,.62) 0,rgba(19,21,20,0) 84px),
    linear-gradient(0deg,rgba(19,21,20,.88) 0,rgba(19,21,20,.56) 76px,rgba(19,21,20,0) 196px),
    linear-gradient(180deg,rgba(19,21,20,.5) 0,rgba(19,21,20,0) 112px)}

/* ---------- app chrome, kept light ---------- */
.ch-scenario .sc-mark{position:absolute;left:28px;top:24px;display:flex;align-items:center;gap:9px;font:500 16px/1 var(--f-sans);color:#f2f1ee}
.ch-scenario .sc-mark img{width:24px;height:24px;display:block}
.ch-scenario .sc-nav{position:absolute;left:28px;top:306px;width:52px;padding:10px 8px;border-radius:999px;background:rgba(31,29,30,.8);
  display:flex;flex-direction:column;align-items:center;gap:12px}
.ch-scenario .sc-nav i{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:rgba(255,255,255,.7)}
.ch-scenario .sc-nav i.sc-on{background:#fff;color:#1f1d1e}
.ch-scenario .sc-nav i.sc-off{color:rgba(255,255,255,.34)}
.ch-scenario .sc-nav svg{width:20px;height:20px;display:block}
.ch-scenario .sc-level{position:absolute;right:28px;top:26px;display:flex;align-items:center;gap:10px;padding:4px 16px 4px 4px;border-radius:999px;
  background:linear-gradient(180deg,rgba(40,39,41,.92),rgba(26,25,26,.92));box-shadow:0 6px 20px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.08);color:rgb(244,242,239)}
.ch-scenario .sc-level svg{width:34px;height:34px;display:block;flex:none}
.ch-scenario .sc-level b{display:block;font:600 13px/1.2 var(--f-sans)}
.ch-scenario .sc-level i{display:block;margin-top:1px;font:400 11px/1.2 var(--f-sans);font-style:normal;color:rgba(244,242,239,.55);font-variant-numeric:tabular-nums}
.ch-scenario .sc-mark,.ch-scenario .sc-nav,.ch-scenario .sc-level{transition:opacity .4s var(--zt-ease)}

/* ---------- dot to card: the landing's leader line ---------- */
.ch-scenario .sc-lead{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.ch-scenario .sc-lead path{fill:none;stroke:rgba(255,255,255,.92);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .7s var(--zt-ease) .85s,opacity .25s var(--zt-ease)}
.ch-scenario.sc-zoom .sc-lead path{stroke-dashoffset:0}

/* ---------- the welcome card ---------- */
.ch-scenario .sc-side{position:absolute;right:28px;top:0;width:432px;height:764px;display:flex;align-items:center;pointer-events:none}
.ch-scenario .sc-card{width:432px;border-radius:32px;padding:20px 20px 25px;display:flex;flex-direction:column;align-items:center;text-align:center;
  background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(16px) saturate(1.1);backdrop-filter:blur(16px) saturate(1.1);box-shadow:0 44px 90px -24px rgba(0,0,0,.5);
  opacity:0;transform:translateX(44px);transition:opacity .45s var(--zt-ease),transform .7s var(--zt-ease)}
.ch-scenario.sc-zoom .sc-card{opacity:1;transform:none;pointer-events:auto;transition-delay:.4s}
.ch-scenario .sc-card>*{opacity:0;transform:translateY(14px);filter:blur(8px);
  transition:opacity .5s var(--zt-ease),transform .6s var(--zt-ease),filter .5s var(--zt-ease)}
.ch-scenario.sc-zoom .sc-card>*{opacity:1;transform:none;filter:none}
.ch-scenario.sc-zoom .sc-card>:nth-child(1){transition-delay:.58s}
.ch-scenario.sc-zoom .sc-card>:nth-child(2){transition-delay:.65s}
.ch-scenario.sc-zoom .sc-card>:nth-child(3){transition-delay:.72s}
.ch-scenario.sc-zoom .sc-card>:nth-child(4){transition-delay:.79s}
.ch-scenario.sc-zoom .sc-card>:nth-child(5){transition-delay:.86s}
.ch-scenario .sc-co{display:flex;align-items:center;gap:8px;height:32px;padding:0 14px 0 11px;border-radius:999px;background:rgba(255,255,255,.94);
  color:#1c1a18;font:500 13.5px/1 var(--f-sans)}
.ch-scenario .sc-co img{width:17px;height:17px;display:block}
.ch-scenario .sc-hello{margin-top:18px}
.ch-scenario .sc-hello h2{margin:0;font:400 30px/1.05 var(--f-serif);letter-spacing:-.02em;color:#fff}
.ch-scenario .sc-hello p{margin:8px 0 0;font:400 13.5px/1.3 var(--f-sans);color:rgba(255,255,255,.7)}
.ch-scenario .sc-art{display:block;margin-top:18px;width:296px;height:115px;object-fit:contain}
.ch-scenario .sc-title{margin:18px 0 0;max-width:372px;font:500 19px/1.3 var(--f-sans);letter-spacing:-.015em;color:#fff;text-wrap:balance}
.ch-scenario .sc-sum{margin:8px 0 0;max-width:372px;font:400 13.5px/1.5 var(--f-sans);color:rgba(255,255,255,.7);text-wrap:pretty}
/* the one green button. Same tactile press as the landing's Start pill. */
.ch-scenario .sc-enter{appearance:none;border:0;cursor:pointer;margin-top:20px;width:100%;height:50px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;gap:9px;font:600 16.5px/1 var(--f-sans);letter-spacing:-.01em;color:#06210f;
  background:linear-gradient(180deg,#5FD079 0%,#49BA61 55%,#3aa853 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 5px 0 #2E9A48,0 14px 20px -8px rgba(0,0,0,.45)}
.ch-scenario .sc-enter svg{width:14px;height:14px;display:block}
/* arrives last with the card's stagger, but the press itself answers at once */
.ch-scenario.sc-zoom .sc-card>.sc-enter{transition:opacity .5s var(--zt-ease) .93s,filter .5s var(--zt-ease) .93s,
  transform .12s cubic-bezier(.34,1.56,.64,1) 0s,box-shadow .12s linear 0s}
.ch-scenario.sc-zoom .sc-card>.sc-enter:hover{transform:translateY(-1px)}
.ch-scenario.sc-zoom .sc-card>.sc-enter:active,.ch-scenario.sc-pressed .sc-card>.sc-enter,.ch-scenario.sc-pressed .sc-card>.sc-enter:hover{transform:translateY(4px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 1px 0 #2E9A48,0 4px 8px -4px rgba(0,0,0,.45)}
.ch-scenario .sc-enter:focus-visible{outline:2px solid #fff;outline-offset:3px}

/* ---------- going in ---------- */
.ch-scenario .sc-veil{position:absolute;left:0;top:0;width:100%;height:100%;background:#1E1E1E;opacity:0;pointer-events:none;
  transition:opacity .6s var(--zt-ease) .12s}
.ch-scenario.sc-go .sc-veil{opacity:1}
.ch-scenario.sc-go .sc-card{opacity:0;transform:scale(.96);pointer-events:none;transition:opacity .32s var(--zt-ease),transform .5s var(--zt-ease);transition-delay:0s}
.ch-scenario.sc-go .sc-lead path{opacity:0}
.ch-scenario.sc-go .sc-mark,.ch-scenario.sc-go .sc-nav,.ch-scenario.sc-go .sc-level{opacity:0}

@media (prefers-reduced-motion:reduce){
  .ch-scenario .sc-dot-go::before{animation:none}
  .ch-scenario.sc-drift .sc-cam{transform:translate(-160px,-70px);transition:none}
}

/* ch/03-kickoff.css */
/* 3 · kickoff. The meeting room. Navid leaves the guide's seat and takes the presenter's tile.
   One fixed layout: presenter (832 x 520, 16:10) + two teammates, the meeting strip under them,
   the notes panel on the right. Surfaces are the six variables below, so the palette is one edit. */
.ch-kickoff{background:#1E1E1E;color:#f2f1ee;font-family:var(--f-sans);letter-spacing:-.01em;
  --ko-card:#262626;--ko-well:#303030;--ko-line:rgba(255,255,255,.075);--ko-t1:#f2f1ee;--ko-t2:#a5a29b;--ko-t3:#6d6a63}

/* ---------- top bar: the way out and the level pill, as the kickoff has them ---------- */
.ch-kickoff .ko-back{position:absolute;left:32px;top:22px;width:44px;height:44px;border-radius:50%;background:var(--ko-card);
  display:grid;place-items:center;color:var(--ko-t1)}
.ch-kickoff .ko-back svg{width:18px;height:18px;display:block}
.ch-kickoff .ko-level{position:absolute;right:32px;top:23px;display:flex;align-items:center;gap:10px;padding:4px 16px 4px 4px;border-radius:999px;
  background:linear-gradient(180deg,rgba(44,43,45,.96),rgba(34,33,34,.96));box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);color:rgb(244,242,239)}
.ch-kickoff .ko-level svg{width:34px;height:34px;display:block;flex:none}
.ch-kickoff .ko-level b{display:block;font:600 13px/1.2 var(--f-sans)}
.ch-kickoff .ko-level i{display:block;margin-top:1px;font:400 11px/1.2 var(--f-sans);font-style:normal;color:rgba(244,242,239,.55);font-variant-numeric:tabular-nums}

/* ---------- the presenter's seat. .ko-slot stays empty: the guide takes its box and its radius ---------- */
.ch-kickoff .ko-slot,.ch-kickoff .ko-seat{position:absolute;left:32px;top:84px;width:832px;height:520px;border-radius:24px}
.ch-kickoff .ko-slot{background:var(--ko-card)}
.ch-kickoff .ko-seat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;pointer-events:none;
  transition:opacity .3s var(--zt-ease)}
.ch-kickoff .ko-seat i{width:76px;height:76px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.2)}
.ch-kickoff .ko-seat span{font:400 14px/1 var(--f-sans);color:var(--ko-t2)}
.ch-kickoff.ko-live .ko-seat{opacity:0}

/* ---------- teammates ---------- */
.ch-kickoff .ko-mate{position:absolute;left:876px;width:248px;height:254px;border-radius:24px;overflow:hidden;background:var(--ko-card)}
.ch-kickoff .ko-m1{top:84px}
.ch-kickoff .ko-m2{top:350px}
.ch-kickoff .ko-mate img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:block}
.ch-kickoff .ko-mate::after{content:'';position:absolute;left:0;right:0;bottom:0;height:40%;pointer-events:none;
  background:linear-gradient(0deg,rgba(0,0,0,.52),rgba(0,0,0,0))}
.ch-kickoff .ko-mate b{position:absolute;left:16px;bottom:14px;z-index:1;font:600 13px/1.1 var(--f-sans);color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.55)}
.ch-kickoff .ko-mate i{position:absolute;right:11px;bottom:9px;z-index:1;width:26px;height:26px;border-radius:50%;background:rgba(16,16,16,.6);
  display:grid;place-items:center;color:#fff}
.ch-kickoff .ko-mate i svg{width:14px;height:14px;display:block}

/* ---------- the meeting strip: what this call is, and the numbers as he says them ---------- */
.ch-kickoff .ko-band{position:absolute;left:32px;top:616px;width:1092px;height:132px;border-radius:24px;background:var(--ko-card);
  display:flex;align-items:center;padding:0 36px 0 26px}
.ch-kickoff .ko-logo{flex:none;width:46px;height:46px;border-radius:14px;background:#fff;display:grid;place-items:center}
.ch-kickoff .ko-logo img{width:26px;height:26px;display:block}
.ch-kickoff .ko-ttl{margin-left:16px;margin-right:24px;min-width:0}
.ch-kickoff .ko-ttl span{display:block;font:400 12.5px/1 var(--f-sans);color:var(--ko-t2)}
.ch-kickoff .ko-ttl h1{margin:8px 0 0;font:500 19px/1.2 var(--f-sans);letter-spacing:-.015em;color:var(--ko-t1);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-kickoff .ko-stat{margin-left:auto;flex:none;display:flex;align-items:flex-start;gap:26px}
.ch-kickoff .ko-num{display:flex;flex-direction:column;gap:9px;opacity:0;transform:translateY(12px);filter:blur(8px);
  transition:opacity .5s var(--zt-ease),transform .6s var(--zt-ease),filter .5s var(--zt-ease)}
.ch-kickoff .ko-num b{display:block;font:400 60px/.82 var(--f-serif);letter-spacing:-.03em;color:var(--ko-t1);font-variant-numeric:lining-nums}
.ch-kickoff .ko-num span{display:block;font:400 12.5px/1 var(--f-sans);color:var(--ko-t2);white-space:nowrap}
.ch-kickoff .ko-goal b{color:#49BA61}
.ch-kickoff .ko-arrow{flex:none;width:46px;height:16px;margin-top:17px;display:block;color:var(--ko-t2);opacity:0;transform:translateX(-10px);
  transition:opacity .4s var(--zt-ease),transform .55s var(--zt-ease)}
.ch-kickoff .ko-num.ko-on{opacity:1;transform:none;filter:none}
.ch-kickoff .ko-arrow.ko-on{opacity:1;transform:none}

/* ---------- notes: the panel the kickoff keeps on the right ---------- */
.ch-kickoff .ko-notes{position:absolute;left:1148px;top:84px;width:420px;height:664px;border-radius:24px;background:var(--ko-card);
  overflow:hidden;display:flex;flex-direction:column}
.ch-kickoff .ko-n-head{flex:none;height:52px;padding:0 24px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);
  font:500 14px/1 var(--f-sans);color:rgba(242,241,238,.88)}
.ch-kickoff .ko-n-head svg{width:18px;height:18px;display:block;flex:none;color:#e7b90a}
.ch-kickoff .ko-n-body{flex:1;min-height:0;display:flex;flex-direction:column;padding:24px 24px 20px}
.ch-kickoff .ko-n-body h3{flex:none;margin:0 0 16px;font:600 15.5px/1.2 var(--f-sans);color:var(--ko-t1)}
.ch-kickoff .ko-list{flex:0 1 auto;min-height:0;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;
  overflow-y:auto;scrollbar-width:none}
.ch-kickoff .ko-list::-webkit-scrollbar{display:none}
.ch-kickoff .ko-list:not(:empty){margin-bottom:16px}
.ch-kickoff .ko-note{flex:none;display:flex;align-items:flex-start;gap:11px;animation:ko-rise .45s var(--zt-ease) both}
.ch-kickoff .ko-note svg{flex:none;width:20px;height:20px;margin-top:1px;display:block;animation:ko-pop .3s cubic-bezier(.34,1.56,.64,1) both}
.ch-kickoff .ko-note svg path{stroke-dasharray:20;animation:ko-draw .38s ease-out .12s both}
.ch-kickoff .ko-note div{min-width:0}
.ch-kickoff .ko-note p{margin:0;font:400 14px/1.5 var(--f-sans);color:rgba(242,241,238,.92);overflow-wrap:anywhere}
.ch-kickoff .ko-note span{display:block;margin-top:3px;font:400 12.5px/1.35 var(--f-sans);color:var(--ko-t2)}
.ch-kickoff .ko-note.ko-full span{color:#3fb968}
@keyframes ko-rise{from{opacity:0;transform:translateY(8px)}}
@keyframes ko-pop{from{transform:scale(.35)}}
@keyframes ko-draw{from{stroke-dashoffset:20}}

/* the next line of the notes: where the learner writes */
.ch-kickoff .ko-field{position:relative;flex:none}
.ch-kickoff .ko-in{appearance:none;display:block;width:100%;height:46px;margin:0;border:0;outline:0;border-radius:14px;padding:0 76px 0 36px;
  background:var(--ko-well);box-shadow:inset 0 0 0 1px var(--ko-line);color:var(--ko-t1);font:400 14px/1 var(--f-sans);letter-spacing:-.01em;
  caret-color:#49BA61;transition:box-shadow .2s var(--zt-ease)}
.ch-kickoff .ko-in::placeholder{color:rgba(242,241,238,.36)}
.ch-kickoff .ko-in:focus{box-shadow:inset 0 0 0 1.5px rgba(242,241,238,.34)}
.ch-kickoff .ko-field i{position:absolute;left:16px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:rgba(242,241,238,.5);pointer-events:none}
.ch-kickoff .ko-field kbd{position:absolute;right:11px;top:50%;transform:translateY(-50%);font:500 11.5px/1 var(--f-sans);color:rgba(242,241,238,.6);
  border:1px solid rgba(255,255,255,.14);border-bottom-width:2px;border-radius:7px;padding:4px 7px 5px;background:rgba(255,255,255,.04);pointer-events:none}
.ch-kickoff .ko-help{position:relative;flex:none;height:38px;margin-top:10px}
.ch-kickoff .ko-hint,.ch-kickoff .ko-nudge{position:absolute;left:6px;right:6px;top:0;margin:0;padding:0;text-align:left;
  font:400 12.5px/1.4 var(--f-sans);letter-spacing:-.01em;color:var(--ko-t2);opacity:0;transform:translateY(4px);pointer-events:none;
  transition:opacity .35s var(--zt-ease),transform .45s var(--zt-ease),color .2s}
.ch-kickoff .ko-hint{appearance:none;border:0;background:none;cursor:pointer}
.ch-kickoff .ko-hint b{font-weight:500;color:rgba(242,241,238,.82);transition:color .2s}
.ch-kickoff .ko-hint:hover b{color:#fff}
.ch-kickoff.ko-hinting .ko-hint{opacity:1;transform:none;pointer-events:auto}
.ch-kickoff.ko-short .ko-nudge{opacity:1;transform:none}
.ch-kickoff.ko-short .ko-hint{opacity:0;pointer-events:none}

/* ---------- paper: the same room in the palette the kickoff ships in today (warm paper, white notes card).
   Off by default. One flag at the top of 03-kickoff.js turns it on. ---------- */
.ch-kickoff.ko-paper{background:#F2F0ED;color:#1f1d1e;
  --ko-card:#fff;--ko-well:#f5f4f2;--ko-line:rgba(31,29,30,.1);--ko-t1:#1f1d1e;--ko-t2:#6b6862;--ko-t3:#9a9792}
.ch-kickoff.ko-paper .ko-back,.ch-kickoff.ko-paper .ko-slot{background:#E8E4DF}
.ch-kickoff.ko-paper .ko-seat i{border-color:rgba(31,29,30,.24)}
.ch-kickoff.ko-paper .ko-level{background:linear-gradient(180deg,#fff,rgb(245,247,246));box-shadow:0 4px 16px rgba(0,0,0,.07),inset 0 0 0 1px rgba(31,29,30,.07);color:#1f1d1e}
.ch-kickoff.ko-paper .ko-level i{color:rgba(31,29,30,.55)}
.ch-kickoff.ko-paper .ko-logo{box-shadow:inset 0 0 0 1px rgba(31,29,30,.09)}
.ch-kickoff.ko-paper .ko-goal b{color:#2E9A48}
.ch-kickoff.ko-paper .ko-n-head{background:#f1f0ee;color:#2a2118}
.ch-kickoff.ko-paper .ko-n-head svg{color:#b98a00}
.ch-kickoff.ko-paper .ko-note p{color:#2a2118}
.ch-kickoff.ko-paper .ko-note.ko-full span{color:#2E9A48}
.ch-kickoff.ko-paper .ko-in::placeholder{color:rgba(31,29,30,.38)}
.ch-kickoff.ko-paper .ko-in:focus{box-shadow:inset 0 0 0 1.5px rgba(31,29,30,.42)}
.ch-kickoff.ko-paper .ko-field i{background:rgba(31,29,30,.5)}
.ch-kickoff.ko-paper .ko-field kbd{color:rgba(31,29,30,.62);border-color:rgba(31,29,30,.16);background:#fff}
.ch-kickoff.ko-paper .ko-hint b{color:rgba(31,29,30,.86)}
.ch-kickoff.ko-paper .ko-hint:hover b{color:#000}

/* ch/04-pou.css */
/* 4 · proof of understanding. The workspace's voice check, rebuilt small:
   the white understanding pill, the voice-note card, one mic. Dark tokens from the app. */
.ch-pou{background:#1E1E1E;color:#f2f1ee;font-family:var(--f-sans);letter-spacing:-.01em;
  --pu-card:#262626;--pu-soft:#282828;--pu-bubble:#333333;--pu-line:rgba(255,255,255,.075);--pu-line2:rgba(255,255,255,.04);
  --pu-tx:#f2f1ee;--pu-tx2:#a5a29b;--pu-tx3:#6d6a63;--pu-tx4:#4a4844;--pu-ok:#3fb968}

/* ---------- the understanding pill: white, three checks, the brain greens when full ---------- */
.ch-pou .pu-top{position:absolute;left:0;right:0;top:26px;display:flex;justify-content:center}
.ch-pou .pu-pill{display:inline-flex;align-items:center;gap:12px;height:40px;padding:0 13px 0 17px;border-radius:999px;background:#fff;color:#1f1d1e;white-space:nowrap;
  box-shadow:0 16px 30px -8px rgba(0,0,0,.42),0 3px 10px rgba(0,0,0,.22)}
.ch-pou .pu-pill-l{font:600 13.5px/1 var(--f-sans);letter-spacing:-.01em}
.ch-pou .pu-meter{display:inline-flex;gap:5px}
.ch-pou .pu-meter i{width:30px;height:6px;border-radius:99px;background:rgba(31,29,30,.13);
  transition:background .5s var(--zt-ease),transform .45s cubic-bezier(.34,1.56,.64,1)}
.ch-pou .pu-meter i.pu-on{background:linear-gradient(90deg,#49ba61,#aff4be)}
.ch-pou .pu-meter i.pu-pop{transform:scaleY(1.7)}
.ch-pou .pu-brain{display:block;width:21px;height:21px;color:#9a9896;transition:color .48s var(--zt-ease)}
.ch-pou .pu-pill.pu-full .pu-brain{color:#49ba61}
.ch-pou .pu-pill.pu-full{animation:pou-full .9s var(--zt-ease) 1}
@keyframes pou-full{0%{transform:scale(1)}38%{transform:scale(1.045)}100%{transform:scale(1)}}

/* ---------- the thread: one 600px column, voice notes only ---------- */
.ch-pou .pu-thread{position:absolute;left:500px;top:84px;width:600px;height:452px;padding:0 28px;display:flex;flex-direction:column;gap:20px;
  overflow-y:auto;scrollbar-width:none}
.ch-pou .pu-thread::-webkit-scrollbar{display:none}
.ch-pou .pu-thread>*{flex:0 0 auto}
.ch-pou .pu-who{display:flex;align-items:baseline;gap:8px;height:16px;margin:0 0 -10px 51px;white-space:nowrap;
  opacity:0;transform:translateY(4px);transition:opacity .4s var(--zt-ease),transform .5s var(--zt-ease)}
.ch-pou.pu-seated .pu-who{opacity:1;transform:none}
.ch-pou .pu-who b{font:600 13px/16px var(--f-sans);color:var(--pu-tx)}
.ch-pou .pu-who span{font:400 12.5px/16px var(--f-sans);color:var(--pu-tx3)}

.ch-pou .pu-note{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.ch-pou .pu-note.pu-me{align-items:flex-end;transition:opacity .3s var(--zt-ease)}
.ch-pou .pu-note.pu-me.pu-miss{opacity:.5}
.ch-pou .pu-row{display:flex;align-items:center;gap:11px}
/* Navid's seat. The slot never animates, so the engine can always measure it. */
.ch-pou .pu-avw{position:relative;width:40px;height:40px;flex:0 0 40px}
.ch-pou .pu-slot{position:absolute;inset:0;border-radius:50%;background:var(--pu-card);box-shadow:inset 0 0 0 1px var(--pu-line)}
.ch-pou .pu-slot::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none}
.ch-pou.pu-seated .pu-slot::after{animation:pou-land .8s var(--zt-ease) 1}
@keyframes pou-land{from{box-shadow:0 0 0 0 rgba(73,186,97,.6)}to{box-shadow:0 0 0 13px rgba(73,186,97,0)}}

.ch-pou .pu-card,.ch-pou .pu-tr{opacity:0;transform:translateY(8px);filter:blur(10px);
  transition:opacity .5s var(--zt-ease),transform .6s var(--zt-ease),filter .5s var(--zt-ease)}
.ch-pou .pu-note.pu-on .pu-card,.ch-pou .pu-note.pu-on .pu-tr{opacity:1;transform:none;filter:none}
.ch-pou .pu-card{display:flex;align-items:center;gap:13px;height:54px;padding:0 16px 0 7px;border-radius:26px;background:var(--pu-soft);box-shadow:inset 0 0 0 1px var(--pu-line2)}
.ch-pou .pu-me .pu-card{background:var(--pu-bubble);box-shadow:none}
.ch-pou.pu-seated .pu-note:first-of-type .pu-card{animation:pou-wake .55s var(--zt-ease) 1}
@keyframes pou-wake{40%{transform:scale(1.035)}100%{transform:none}}
.ch-pou .pu-play{width:40px;height:40px;flex:0 0 40px;border-radius:99px;background:var(--pu-card);box-shadow:inset 0 0 0 1px var(--pu-line);display:grid;place-items:center;color:var(--pu-tx)}
.ch-pou .pu-play svg{display:block;width:16px;height:16px}
.ch-pou .pu-play .pu-i-pause{display:none}
.ch-pou .pu-note.pu-playing .pu-play .pu-i-play{display:none}
.ch-pou .pu-note.pu-playing .pu-play .pu-i-pause{display:block}
.ch-pou .pu-wave{display:flex;align-items:center;gap:2.5px;height:26px}
.ch-pou .pu-wave i{width:2.5px;border-radius:9px;background:var(--pu-tx4);flex:0 0 auto;transition:background .12s linear}
.ch-pou .pu-wave i.pu-lit{background:var(--pu-tx)}
.ch-pou .pu-me .pu-wave i{background:rgba(255,255,255,.2);transition:background .3s linear,height .14s linear}
.ch-pou .pu-me .pu-wave i.pu-lit{background:rgba(255,255,255,.38)}
.ch-pou .pu-me.pu-rec .pu-wave i.pu-lit{background:var(--pu-tx)}
.ch-pou .pu-note.pu-playing .pu-wave i{animation:pou-wave 1s ease-in-out infinite alternate}
@keyframes pou-wave{from{transform:scaleY(.42)}to{transform:scaleY(1)}}
.ch-pou .pu-dur{flex:0 0 auto;min-width:27px;font:400 11px/1 var(--f-mono);color:var(--pu-tx3);font-variant-numeric:tabular-nums}
/* while the learner is recording, the play button is a record light */
.ch-pou .pu-me.pu-rec .pu-play svg{display:none}
.ch-pou .pu-me.pu-rec .pu-play::after{content:"";width:10px;height:10px;border-radius:50%;background:#ff6a4d;animation:pou-blink 1s ease-in-out infinite alternate}
@keyframes pou-blink{from{opacity:.35}to{opacity:1}}

/* the transcript: real voice-note chrome, closed until asked for */
.ch-pou .pu-tr{appearance:none;border:0;background:none;display:inline-flex;align-items:center;gap:6px;margin-left:51px;padding:2px 4px;border-radius:6px;cursor:pointer;
  font:700 10px/12px var(--f-mono);letter-spacing:1.5px;text-transform:uppercase;color:var(--pu-tx3)}
.ch-pou .pu-tr:hover{color:var(--pu-tx2)}
.ch-pou .pu-tr svg{width:13px;height:13px;transition:transform .24s var(--zt-ease)}
.ch-pou .pu-note.pu-open .pu-tr svg{transform:rotate(180deg)}
.ch-pou .pu-trb{display:none;margin-left:55px;max-width:440px;font:400 13px/1.6 var(--f-sans);color:var(--pu-tx2)}
.ch-pou .pu-note.pu-open .pu-trb{display:block;animation:pou-in .4s var(--zt-ease) 1}
@keyframes pou-in{from{opacity:0;transform:translateY(6px);filter:blur(6px)}}

/* the learner's own words, live, under their note. Two lines, newest kept in view. */
.ch-pou .pu-said{display:none;flex-direction:column;justify-content:flex-end;max-width:440px;max-height:42px;overflow:hidden;padding:0 4px;text-align:right;
  font:400 13.5px/21px var(--f-sans);color:var(--pu-tx2)}
.ch-pou .pu-me.pu-has .pu-said{display:flex}
.ch-pou .pu-said b,.ch-pou .pu-bubble b{font-weight:600;color:var(--pu-tx)}
.ch-pou .pu-bubble{display:none;max-width:82%;padding:10px 15px;border-radius:20px;background:var(--pu-bubble);font:400 14px/1.5 var(--f-sans);color:var(--pu-tx2);overflow-wrap:break-word}
.ch-pou .pu-me.pu-typed .pu-row,.ch-pou .pu-me.pu-typed .pu-said{display:none}
.ch-pou .pu-me.pu-typed .pu-bubble{display:block;animation:pou-in .45s var(--zt-ease) 1}

/* ---------- what to say, and the one mic ---------- */
.ch-pou .pu-bottom{position:absolute;left:500px;top:552px;width:600px;height:204px}
.ch-pou .pu-chipsw{position:absolute;left:0;right:0;top:0;height:36px;display:flex;justify-content:center}
.ch-pou .pu-chips{display:inline-flex;align-items:center;gap:8px;height:36px;border-radius:999px}
.ch-pou .pu-chips-l{font:400 13.5px/1 var(--f-sans);color:var(--pu-tx3);margin-right:2px}
.ch-pou .pu-chips-l,.ch-pou .pu-chip{opacity:0;transform:translateY(8px);
  transition:opacity .4s var(--zt-ease),transform .5s var(--zt-ease),background .35s var(--zt-ease),color .35s var(--zt-ease),box-shadow .35s var(--zt-ease)}
.ch-pou.pu-ask .pu-chips-l,.ch-pou.pu-ask .pu-chip{opacity:1;transform:none}
.ch-pou.pu-ask .pu-chip:nth-child(2){transition-delay:.06s,.06s,0s,0s,0s}
.ch-pou.pu-ask .pu-chip:nth-child(3){transition-delay:.14s,.14s,0s,0s,0s}
.ch-pou.pu-ask .pu-chip:nth-child(4){transition-delay:.22s,.22s,0s,0s,0s}
.ch-pou .pu-chip{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 15px 0 10px;border-radius:999px;white-space:nowrap;
  font:500 14px/1 var(--f-sans);color:var(--pu-tx2);background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px var(--pu-line)}
.ch-pou .pu-chip i{width:18px;height:18px;flex:0 0 18px;border-radius:50%;display:grid;place-items:center;color:transparent;box-shadow:inset 0 0 0 1.5px var(--pu-tx4);
  transition:background .3s var(--zt-ease),box-shadow .3s var(--zt-ease),color .2s,transform .45s cubic-bezier(.34,1.56,.64,1)}
.ch-pou .pu-chip i svg{display:block;width:12px;height:12px}
.ch-pou .pu-chip.pu-hit{color:var(--pu-tx);background:rgba(63,185,104,.15);box-shadow:inset 0 0 0 1px rgba(63,185,104,.42)}
.ch-pou .pu-chip.pu-hit i{background:var(--pu-ok);box-shadow:none;color:#06210f;transform:scale(1.08)}
.ch-pou.pu-recap .pu-chip{animation:pou-ping .55s var(--zt-ease) 1}
.ch-pou.pu-recap .pu-chip:nth-child(3){animation-delay:.8s}
.ch-pou.pu-recap .pu-chip:nth-child(4){animation-delay:1.7s}
@keyframes pou-ping{40%{transform:scale(1.06)}100%{transform:none}}

/* every mic state gets one short line, right above the mic */
.ch-pou .pu-line{position:absolute;left:0;right:0;top:50px;height:20px;text-align:center;white-space:nowrap;font:400 13.5px/20px var(--f-sans);color:var(--pu-tx2);
  opacity:0;transform:translateY(4px);transition:opacity .24s var(--zt-ease),transform .36s var(--zt-ease)}
.ch-pou .pu-line.pu-show{opacity:1;transform:none}
.ch-pou .pu-line b{font-weight:600;color:var(--pu-tx)}

.ch-pou .pu-ctl{position:absolute;left:0;right:0;top:78px;height:58px;display:flex;justify-content:center}
.ch-pou .pu-mic{appearance:none;border:0;margin:0;padding:0;position:relative;display:inline-flex;align-items:center;height:58px;min-width:58px;border-radius:999px;cursor:pointer;
  background:var(--pu-card);color:var(--pu-tx);box-shadow:inset 0 0 0 1px var(--pu-line),0 1px 3px rgba(0,0,0,.4);touch-action:none;-webkit-user-select:none;user-select:none;
  opacity:.38;filter:grayscale(1);pointer-events:none;
  transition:opacity .4s var(--zt-ease),filter .4s var(--zt-ease),background .3s var(--zt-ease),color .3s var(--zt-ease),box-shadow .3s var(--zt-ease),padding .45s var(--zt-ease),transform .3s var(--zt-ease)}
.ch-pou.pu-ready .pu-mic{opacity:1;filter:none;pointer-events:auto}
.ch-pou.pu-ready .pu-mic:hover{background:#2d2d2d}
.ch-pou .pu-mic-ic{width:58px;height:58px;flex:0 0 58px;display:grid;place-items:center}
.ch-pou .pu-mic-ic>*{grid-area:1/1}
.ch-pou .pu-mic-d{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;transition:background .3s var(--zt-ease),color .3s var(--zt-ease)}
.ch-pou .pu-mic-d svg{display:block;width:23px;height:23px}
.ch-pou .pu-mic-d .pu-i-tick,.ch-pou .pu-spin{display:none}
.ch-pou .pu-spin{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.16);border-top-color:var(--pu-tx);animation:pou-spin .8s linear infinite}
@keyframes pou-spin{to{transform:rotate(360deg)}}
.ch-pou .pu-live{display:flex;align-items:center;gap:2.5px;height:24px;width:0;overflow:hidden;opacity:0;transition:width .45s var(--zt-ease),opacity .3s var(--zt-ease)}
.ch-pou .pu-live i{width:2.5px;height:3px;border-radius:9px;background:var(--pu-tx);flex:0 0 auto;transition:height .07s linear}
.ch-pou .pu-time{width:0;overflow:hidden;opacity:0;text-align:right;font:400 11px/1 var(--f-mono);color:var(--pu-tx2);font-variant-numeric:tabular-nums;
  transition:width .45s var(--zt-ease),opacity .3s var(--zt-ease),margin .45s var(--zt-ease)}
/* listening: the mic opens into a live bar */
.ch-pou[data-mic="listening"] .pu-mic{padding-right:20px;background:#2c2c2c;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),0 1px 3px rgba(0,0,0,.4)}
.ch-pou[data-mic="listening"] .pu-mic-d{background:#fff;color:#0d0d0d}
.ch-pou[data-mic="listening"] .pu-live{width:128px;opacity:1}
.ch-pou[data-mic="listening"] .pu-time{width:30px;margin-left:12px;opacity:1}
/* checking: a short wait */
.ch-pou[data-mic="checking"] .pu-mic{pointer-events:none}
.ch-pou[data-mic="checking"] .pu-i-mic{display:none}
.ch-pou[data-mic="checking"] .pu-spin{display:block}
/* no mic: it steps back, the field takes over */
.ch-pou[data-mic="denied"] .pu-mic{opacity:.38;filter:grayscale(1)}
/* passed */
.ch-pou.pu-passed .pu-mic{background:var(--pu-ok);color:#06210f;box-shadow:none;pointer-events:none;opacity:1;filter:none;animation:pou-wake .55s var(--zt-ease) 1}
.ch-pou.pu-passed .pu-mic-d .pu-i-mic,.ch-pou.pu-passed .pu-spin{display:none}
.ch-pou.pu-passed .pu-mic-d .pu-i-tick{display:block}
.ch-pou.pu-passed .pu-mic-d{background:none;color:inherit}

/* the product's own label under the mic */
.ch-pou .pu-hint{position:absolute;left:0;right:0;top:148px;text-align:center;font:700 10px/12px var(--f-mono);letter-spacing:1.6px;text-transform:uppercase;color:var(--pu-tx3);
  opacity:.45;transition:opacity .3s var(--zt-ease),color .3s var(--zt-ease)}
.ch-pou .pu-hint b{font-weight:700;color:var(--pu-tx2)}
.ch-pou.pu-ready .pu-hint{opacity:1}
.ch-pou[data-mic="listening"] .pu-hint,.ch-pou[data-mic="checking"] .pu-hint{opacity:0}
.ch-pou.pu-passed .pu-hint{opacity:1;color:#6fd189}
.ch-pou .pu-alt{appearance:none;border:0;background:none;position:absolute;left:50%;top:168px;transform:translateX(-50%);padding:5px 9px;border-radius:8px;cursor:pointer;white-space:nowrap;
  font:500 12.5px/16px var(--f-sans);letter-spacing:-.01em;color:var(--pu-tx3);opacity:.45;pointer-events:none;transition:opacity .3s var(--zt-ease),color .2s}
.ch-pou.pu-ready .pu-alt{opacity:1;pointer-events:auto}
.ch-pou .pu-alt:hover{color:var(--pu-tx)}
.ch-pou[data-mic="listening"] .pu-alt,.ch-pou[data-mic="checking"] .pu-alt{opacity:0;pointer-events:none}

/* the typed way through: the app's answer box */
.ch-pou .pu-field{position:absolute;left:28px;right:28px;top:146px;height:46px;display:none;align-items:center;gap:8px;padding:0 6px 0 18px;border-radius:26px;
  background:var(--pu-card);box-shadow:inset 0 0 0 1px var(--pu-line);transition:box-shadow .2s}
.ch-pou .pu-field:focus-within{box-shadow:inset 0 0 0 1px rgba(255,255,255,.24)}
.ch-pou.pu-typing .pu-field{display:flex;animation:pou-in .4s var(--zt-ease) 1}
.ch-pou.pu-typing .pu-hint,.ch-pou.pu-typing .pu-alt{display:none}
.ch-pou .pu-in{flex:1;min-width:0;height:34px;border:0;outline:0;background:none;color:var(--pu-tx);font:400 14px/1 var(--f-sans);letter-spacing:-.01em}
.ch-pou .pu-in::placeholder{color:var(--pu-tx3)}
.ch-pou .pu-send{appearance:none;border:0;padding:0;width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:#fff;color:#0d0d0d;display:grid;place-items:center;cursor:pointer;
  transition:opacity .2s,transform .24s var(--zt-ease)}
.ch-pou .pu-send svg{display:block;width:17px;height:17px}
.ch-pou .pu-send:disabled{opacity:.3;cursor:default}
.ch-pou .pu-send:not(:disabled):hover{transform:scale(1.06)}
.ch-pou.pu-passed .pu-alt,.ch-pou.pu-passed .pu-field,.ch-pou.pu-passed .pu-line{display:none}
.ch-pou.pu-passed .pu-hint{display:block}

@media (prefers-reduced-motion:reduce){
  .ch-pou .pu-note.pu-playing .pu-wave i,.ch-pou .pu-spin,.ch-pou .pu-me.pu-rec .pu-play::after{animation:none}
}

/* ch/05-workspace.css */
/* 5 · workspace, then coach. A small rebuild of the dark Stage workspace by hand:
   top bar, rail, chat with the peer header and the composer pill, right panel, coach.
   Measurements and tokens follow the real screen (rail 312, chat column 600, panel 376,
   body 13 to 14.5px, mono caps only where the real rail and panel carry them).
   Columns are separated by space and surface, never by a rule. */
.ch-workspace{
  --ws-bg:#1E1E1E;--ws-card:#262626;--ws-bubble:#333333;--ws-soft:#282828;--ws-hover:rgba(255,255,255,.06);
  --ws-line:rgba(255,255,255,.075);--ws-line-2:rgba(255,255,255,.04);
  --ws-tx:#f2f1ee;--ws-tx-2:#a5a29b;--ws-tx-3:#6d6a63;--ws-tx-4:#4a4844;
  --ws-ok:#3fb968;--ws-fix:#ff6a4d;--ws-meets:#e7b90a;--ws-exceeds:#4ade80;
  --ws-shift:.76s; /* a panel opening rides the same clock as Navid's flight, so he and his seat move as one */
  background:var(--ws-bg);color:var(--ws-tx);font-family:var(--f-sans);font-size:14px;line-height:1.55;letter-spacing:-.01em}
.ch-workspace svg{display:block}
.ch-workspace .ws-lbl{display:block;font-family:var(--f-mono);font-size:10px;font-weight:700;line-height:1.6;letter-spacing:1.4px;text-transform:uppercase;color:var(--ws-tx-2)}

/* ---------- top bar ---------- */
.ch-workspace .ws-top{position:absolute;left:0;right:0;top:0;height:52px;display:flex;align-items:center;padding:0 16px}
.ch-workspace .ws-back{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--ws-tx-2)}
.ch-workspace .ws-back svg{width:20px;height:20px}
.ch-workspace .ws-xp{margin-left:auto;margin-right:0;display:flex;align-items:center;gap:5px;line-height:1;white-space:nowrap;
  background:var(--ws-soft);border:1px solid var(--ws-line-2);padding:6px 12px;border-radius:99px}
.ch-workspace .ws-xp img{width:16px;height:16px;display:block}
.ch-workspace .ws-xp b{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.ch-workspace .ws-xp i{font-style:normal;font-size:11px;font-weight:600;letter-spacing:.4px;color:var(--ws-tx-3)}

/* ---------- the three columns. Everything ends above the tour's own dock ---------- */
.ch-workspace .ws-work{position:absolute;left:0;right:0;top:52px;height:712px;display:flex}

/* ---------- rail ---------- */
.ch-workspace .ws-rail{flex:0 0 312px;min-width:0;display:flex;flex-direction:column}
.ch-workspace .ws-brand{flex:0 0 54px;display:flex;align-items:center;gap:11px;padding:0 20px}
.ch-workspace .ws-logo{flex:0 0 auto;width:38px;height:38px;border-radius:99px;background:var(--ws-card);border:1px solid var(--ws-line);display:grid;place-items:center}
.ch-workspace .ws-logo img{width:19px;height:21px;display:block}
.ch-workspace .ws-brand-t{font-size:14.5px;font-weight:600;line-height:1.28}
.ch-workspace .ws-rail-body{flex:1;min-height:0;padding:16px 16px 0}
.ch-workspace .ws-active{border:1px solid var(--ws-line);border-radius:16px;padding:16px 16px 9px;margin-bottom:14px}
.ch-workspace .ws-stage-t{font-size:19px;font-weight:700;line-height:1.24;letter-spacing:-.02em;margin-bottom:18px}
.ch-workspace .ws-reqs{margin-top:6px}
.ch-workspace .ws-req{display:flex;align-items:flex-start;gap:10px;padding:10px;margin:0 -8px 2px;border-radius:10px}
.ch-workspace .ws-req-b{flex:1;min-width:0}
.ch-workspace .ws-req-t{font-size:13.5px;font-weight:600;line-height:1.4}
.ch-workspace .ws-req-tag{display:grid;grid-template-rows:0fr;transition:grid-template-rows .48s var(--zt-ease)}
.ch-workspace .ws-req-tag span{overflow:hidden;min-height:0;font-size:11.5px;font-weight:600;line-height:1.5;color:var(--ws-fix);opacity:0;transition:opacity .4s var(--zt-ease)}
.ch-workspace .ws-req.ws-miss .ws-req-tag{grid-template-rows:1fr}
.ch-workspace .ws-req.ws-miss .ws-req-tag span{opacity:1}
/* the status mark. At rest it is the rail's own quiet dot. A review turns it into a tick or a "needs work" */
.ch-workspace .ws-mark{position:relative;flex:0 0 auto;width:18px;height:18px;margin-top:.5px;border-radius:99px;display:grid;place-items:center;
  border:1.5px solid transparent;color:#fff;transition:background .35s var(--zt-ease),border-color .35s var(--zt-ease),color .35s var(--zt-ease)}
.ch-workspace .ws-mark::before{content:"";width:7px;height:7px;border-radius:99px;background:var(--ws-tx-4);transition:opacity .25s var(--zt-ease),transform .3s var(--zt-ease)}
.ch-workspace .ws-mark i{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transform:scale(.4);transition:opacity .25s var(--zt-ease),transform .4s var(--zt-ease)}
.ch-workspace .ws-mark svg{width:11px;height:11px}
.ch-workspace .ws-checking .ws-mark::after,.ch-workspace .ws-checking .ws-fmark::after{content:"";position:absolute;inset:-4px;border-radius:99px;border:1.5px solid transparent;border-top-color:var(--ws-tx-2);animation:ws-spin .7s linear infinite}
.ch-workspace .ws-req.ws-hit .ws-mark{background:var(--ws-ok);border-color:var(--ws-ok)}
.ch-workspace .ws-req.ws-hit.ws-pop .ws-mark{animation:ws-pop .55s cubic-bezier(.34,1.56,.64,1)}
.ch-workspace .ws-req.ws-miss .ws-mark{border-color:rgba(255,106,77,.6);color:var(--ws-fix)}
.ch-workspace .ws-req.ws-hit .ws-mark::before,.ch-workspace .ws-req.ws-miss .ws-mark::before{opacity:0;transform:scale(.3)}
.ch-workspace .ws-req.ws-hit .ws-i-tick,.ch-workspace .ws-req.ws-miss .ws-i-bang{opacity:1;transform:none}
.ch-workspace .ws-lbl-res{margin:14px 0 4px}
.ch-workspace .ws-res{display:flex;align-items:center;gap:9px;padding:7px 4px;margin:0 -4px;border-radius:9px;transition:background .5s var(--zt-ease)}
.ch-workspace .ws-res.ws-flash{background:var(--ws-hover)}
.ch-workspace .ws-res-ic{flex:0 0 auto;width:18px;height:18px;display:grid;place-items:center;color:var(--ws-tx-3)}
.ch-workspace .ws-res-ic svg{width:16px;height:16px}
.ch-workspace .ws-res-n{flex:1;min-width:0;font-size:12.5px;font-weight:500;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-workspace .ws-group-h{display:flex;align-items:center;gap:9px;padding:12px 2px 8px;color:var(--ws-tx-3)}
.ch-workspace .ws-group-h svg{width:16px;height:16px;flex:0 0 auto;transform:rotate(180deg)}
.ch-workspace .ws-group-h .ws-lbl{flex:1;color:inherit}
.ch-workspace .ws-cnt{font-size:11px;font-weight:700;line-height:1}
.ch-workspace .ws-gstep{display:flex;align-items:flex-start;gap:12px;padding:9px 2px;color:var(--ws-tx-3)}
.ch-workspace .ws-gstep svg{flex:0 0 auto;width:18px;height:18px;margin-top:1px;color:var(--ws-tx-4)}
.ch-workspace .ws-gstep span{flex:1;font-size:13px;line-height:1.35;padding-top:1px}

/* ---------- centre: the manager ---------- */
.ch-workspace .ws-center{flex:1 1 0;min-width:0;margin-left:5px;display:flex;flex-direction:column}
.ch-workspace .ws-col{width:min(600px,100%);margin-left:auto;margin-right:auto}
.ch-workspace .ws-ctop{flex:0 0 54px;padding:0 24px;display:flex;align-items:center}
.ch-workspace .ws-peer{padding:0 28px;display:flex;align-items:center}
.ch-workspace .ws-peer-id{display:inline-flex;align-items:center;gap:11px;border-radius:26px}
/* a seat. The engine draws Navid over the empty .ws-slot. The initial underneath is what stays when he leaves */
.ch-workspace .ws-seat{position:relative;flex:0 0 auto}
.ch-workspace .ws-seat b{position:absolute;inset:0;border-radius:50%;background:var(--ws-card);box-shadow:inset 0 0 0 1px var(--ws-line);display:grid;place-items:center;font-size:13px;font-weight:600;line-height:1;color:var(--ws-tx-3)}
.ch-workspace .ws-slot{position:absolute;inset:0;border-radius:50%;display:block}
.ch-workspace .ws-pava{width:36px;height:36px}
.ch-workspace .ws-pmeta{transition:opacity .6s var(--zt-ease)}
.ch-workspace .ws-pname{font-size:14px;font-weight:600;line-height:1.2}
.ch-workspace .ws-psub{font-size:11.5px;line-height:1.2;color:var(--ws-tx-3);margin-top:3px}
.ch-workspace .ws-peer.ws-vacant .ws-pmeta{opacity:.5}

.ch-workspace .ws-thread{flex:1 1 0;min-height:0;padding:0 24px;overflow-y:auto;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 20px);mask-image:linear-gradient(to bottom,transparent 0,#000 20px)}
.ch-workspace .ws-thread::-webkit-scrollbar{display:none}
.ch-workspace .ws-thread.ws-scrolled{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 46px);mask-image:linear-gradient(to bottom,transparent 0,#000 46px)}
.ch-workspace .ws-msgs{padding:26px 28px 14px;display:flex;flex-direction:column;gap:26px}
.ch-workspace .ws-msgs>.ws-new{animation:ws-rise .48s var(--zt-ease)}
.ch-workspace .ws-m{align-self:flex-start;max-width:420px}
.ch-workspace .ws-m+.ws-m{margin-top:-16px}
.ch-workspace .ws-bub{width:fit-content;max-width:100%;background:var(--ws-soft);border:1px solid var(--ws-line-2);border-radius:20px;padding:10px 15px;font-size:14px;line-height:1.5;overflow-wrap:break-word}
.ch-workspace .ws-u{align-self:flex-end;width:fit-content;max-width:400px;background:var(--ws-bubble);border-radius:20px;padding:10px 15px;font-size:14px;line-height:1.5;overflow-wrap:break-word}
.ch-workspace .ws-typing{align-self:flex-start;display:flex;align-items:center;gap:6px;padding:8px 2px;margin-top:-8px}
.ch-workspace .ws-typing i{width:7px;height:7px;border-radius:99px;background:var(--ws-tx-3);animation:ws-bob 1.2s infinite}
.ch-workspace .ws-typing i:nth-child(2){animation-delay:.16s}
.ch-workspace .ws-typing i:nth-child(3){animation-delay:.32s}
/* a handed-in file */
.ch-workspace .ws-subm{align-self:flex-end;width:252px}
.ch-workspace .ws-att{position:relative;display:flex;align-items:center;gap:12px;padding:9px 14px 9px 9px;border:1px solid var(--ws-line);border-radius:14px;background:var(--ws-card);overflow:hidden;transition:box-shadow .4s var(--zt-ease)}
.ch-workspace .ws-thumb{flex:0 0 auto;width:34px;height:44px;border-radius:5px;background:#f6f5f3;padding:7px 6px 0;display:flex;flex-direction:column;gap:3.5px}
.ch-workspace .ws-thumb i{height:2.5px;border-radius:9px;background:rgba(31,29,30,.2)}
.ch-workspace .ws-thumb i:first-child{width:70%;height:3.5px;background:rgba(31,29,30,.55);margin-bottom:1.5px}
.ch-workspace .ws-thumb i:last-child{width:55%}
.ch-workspace .ws-fmeta{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ch-workspace .ws-fmeta b{font-size:12.5px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-workspace .ws-fmeta i{font-style:normal;font-family:var(--f-mono);font-size:8.5px;font-weight:700;line-height:1.3;letter-spacing:.8px;text-transform:uppercase;color:var(--ws-tx-3);white-space:nowrap}
.ch-workspace .ws-subm .ws-fmeta b{font-size:13px}
.ch-workspace .ws-subm .ws-fmeta i{font-size:9.5px}
.ch-workspace .ws-cap{text-align:right;font-family:var(--f-mono);font-size:9.5px;font-weight:700;line-height:1.4;letter-spacing:.8px;text-transform:uppercase;color:var(--ws-tx-3);margin-top:6px}
.ch-workspace .ws-subm.ws-analyzing .ws-att{box-shadow:0 0 0 1.5px rgba(63,185,104,.45)}
.ch-workspace .ws-subm.ws-analyzing .ws-att::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 32%,rgba(63,185,104,.22) 50%,transparent 68%);background-size:220% 100%;animation:ws-sweep 1.5s var(--zt-ease) infinite}
/* "reading", then "reviewed" */
.ch-workspace .ws-synth{align-self:flex-start;display:flex;align-items:center;gap:9px;padding:0 3px;margin-top:-10px;min-width:0}
.ch-workspace .ws-sy-ic{flex:0 0 auto;width:23px;height:23px;border-radius:99px;background:var(--ws-bubble);border:1px solid var(--ws-line);display:grid;place-items:center;color:var(--ws-tx-2)}
.ch-workspace .ws-sy-ic svg{width:12px;height:12px}
.ch-workspace .ws-sy-t{font-size:13px;line-height:1.4;color:var(--ws-tx-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .4s var(--zt-ease)}
.ch-workspace .ws-synth.ws-live .ws-sy-ic{animation:ws-pulse 1.5s var(--zt-ease) infinite}
.ch-workspace .ws-synth.ws-done .ws-sy-t{color:var(--ws-tx-2);font-weight:500}
.ch-workspace .ws-time{align-self:center;font-size:11.5px;font-weight:500;line-height:1;color:var(--ws-tx-2);background:var(--ws-soft);border:1px solid var(--ws-line-2);padding:7px 12px;border-radius:99px}

/* ---------- composer. Its block never changes height: the pill grows upward over the chip row,
   so the thread above it never resizes ---------- */
.ch-workspace .ws-composer{flex:0 0 151px;position:relative;padding:0 24px;transition:opacity .5s var(--zt-ease)}
.ch-workspace .ws-floor{position:absolute;left:24px;right:24px;bottom:14px}
.ch-workspace .ws-chips{height:46px;padding:0 6px}
.ch-workspace .ws-chiprow{display:inline-flex;gap:9px;border-radius:999px;opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .4s var(--zt-ease),transform .5s var(--zt-ease)}
.ch-workspace .ws-chiprow.ws-on{opacity:1;transform:none;pointer-events:auto}
.ch-workspace .ws-chip{appearance:none;cursor:pointer;font-size:13px;font-weight:600;line-height:1;letter-spacing:-.01em;white-space:nowrap;padding:10px 15px;border-radius:99px;
  border:1px solid var(--ws-line);background:var(--ws-card);color:var(--ws-tx);transition:background .24s var(--zt-ease),transform .24s var(--zt-ease)}
.ch-workspace .ws-chip:hover{background:var(--ws-bubble);transform:translateY(-1px)}
.ch-workspace .ws-composer-in{position:relative}
.ch-workspace .ws-pill{display:flex;flex-direction:column;min-height:91px;background:var(--ws-soft);border:1px solid var(--ws-line);border-radius:26px;transition:border-color .24s var(--zt-ease)}
.ch-workspace .ws-pill:focus-within{border-color:var(--ws-tx-4)}
.ch-workspace .ws-attrow{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--zt-ease)}
.ch-workspace .ws-attrow>div{overflow:hidden;min-height:0}
.ch-workspace .ws-pill.ws-has-att .ws-attrow{grid-template-rows:1fr}
.ch-workspace .ws-file{display:inline-flex;align-items:center;gap:9px;max-width:300px;margin:10px 10px 0;padding:6px;border:1px solid var(--ws-line);border-radius:12px;background:var(--ws-card)}
.ch-workspace .ws-ftile{flex:0 0 auto;width:30px;height:30px;border-radius:8px;background:var(--ws-hover);display:grid;place-items:center;color:var(--ws-tx-2)}
.ch-workspace .ws-ftile svg{width:17px;height:17px}
.ch-workspace .ws-file-x{appearance:none;border:0;background:none;cursor:pointer;flex:0 0 auto;width:24px;height:24px;border-radius:99px;display:grid;place-items:center;color:var(--ws-tx-3);transition:background .24s,color .24s}
.ch-workspace .ws-file-x:hover{background:var(--ws-hover);color:var(--ws-tx)}
.ch-workspace .ws-file-x svg{width:13px;height:13px}
.ch-workspace .ws-input{appearance:none;display:block;width:100%;min-width:0;background:none;border:0;outline:0;color:var(--ws-tx);font:inherit;font-size:15px;line-height:1.5;letter-spacing:-.01em;padding:13px 18px 4px}
.ch-workspace .ws-input::placeholder{color:var(--ws-tx-3)}
.ch-workspace .ws-ctrl{display:flex;align-items:center;gap:4px;padding:4px 8px 8px;margin-top:auto}
.ch-workspace .ws-plus,.ch-workspace .ws-send{appearance:none;border:0;cursor:pointer;flex:0 0 auto;width:38px;height:38px;border-radius:99px;display:grid;place-items:center;
  background:none;color:var(--ws-tx-2);transition:background .24s var(--zt-ease),color .24s var(--zt-ease),transform .24s var(--zt-ease)}
.ch-workspace .ws-plus svg,.ch-workspace .ws-send svg{width:20px;height:20px}
.ch-workspace .ws-plus:hover,.ch-workspace .ws-plus.ws-open{background:var(--ws-hover);color:var(--ws-tx)}
.ch-workspace .ws-plus.ws-open svg{transform:rotate(45deg)}
.ch-workspace .ws-plus svg{transition:transform .3s var(--zt-ease)}
.ch-workspace .ws-send{background:var(--ws-hover);color:var(--ws-tx-4)}
.ch-workspace .ws-send.ws-hot{background:#fff;color:#111}
.ch-workspace .ws-send.ws-hot:hover{transform:scale(1.06)}
.ch-workspace .ws-hint{flex:1;min-width:0;text-align:right;padding:0 8px;font-size:12.5px;line-height:1.2;color:var(--ws-tx-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .24s var(--zt-ease)}
.ch-workspace .ws-hint.ws-on{opacity:1}
.ch-workspace .ws-composer.ws-quiet{opacity:.55}
.ch-workspace .ws-composer.ws-quiet .ws-plus,.ch-workspace .ws-composer.ws-quiet .ws-send,.ch-workspace .ws-composer.ws-quiet .ws-input{cursor:default}
.ch-workspace .ws-composer.ws-quiet .ws-plus:hover{background:none;color:var(--ws-tx-2)}
/* the attach menu: the learner's ready draft */
.ch-workspace .ws-menu{position:absolute;left:8px;bottom:calc(100% + 8px);z-index:5;width:272px;padding:6px;border-radius:16px;background:var(--ws-card);border:1px solid var(--ws-line);
  box-shadow:0 1px 3px rgba(0,0,0,.4),0 18px 44px rgba(0,0,0,.34);opacity:0;transform:translateY(8px) scale(.96);transform-origin:bottom left;pointer-events:none;
  transition:opacity .24s var(--zt-ease),transform .24s var(--zt-ease)}
.ch-workspace .ws-menu.ws-on{opacity:1;transform:none;pointer-events:auto}
.ch-workspace .ws-menu-l{font-size:11.5px;line-height:1;color:var(--ws-tx-3);padding:8px 10px 8px}
.ch-workspace .ws-draft{appearance:none;border:0;cursor:pointer;display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:8px 10px;border-radius:10px;background:none;color:var(--ws-tx);letter-spacing:-.01em;transition:background .24s var(--zt-ease)}
.ch-workspace .ws-draft:hover{background:var(--ws-hover)}
.ch-workspace .ws-draft .ws-fmeta b{font-size:13.5px;font-weight:500}

/* ---------- right panel and coach: two inset cards ----------
   A column makes room by growing from zero, and the chat glides over. The card itself never
   slides: it is held against the right edge of its column, so it is already where it will end
   up, and it arrives by un-blurring a little. Nothing is ever cut by the edge of the canvas. */
.ch-workspace .ws-right,.ch-workspace .ws-coach{flex:0 0 0;min-width:0;display:flex;justify-content:flex-end;padding:54px 0 12px;transition:flex-basis var(--ws-shift) var(--zt-ease)}
.ch-workspace.ws-right-open .ws-right{flex-basis:376px}
.ch-workspace.ws-coach-open .ws-coach{flex-basis:344px}
.ch-workspace .ws-card{flex:0 0 auto;margin-right:12px;display:flex;flex-direction:column;overflow:hidden;background:var(--ws-bg);border:1px solid var(--ws-line);border-radius:18px;box-shadow:0 1px 3px rgba(0,0,0,.4);
  opacity:0;visibility:hidden;pointer-events:none;transform:translateX(16px) scale(.985);filter:blur(8px);
  transition:opacity .5s var(--zt-ease) .16s,transform .7s var(--zt-ease) .16s,filter .5s var(--zt-ease) .16s}
.ch-workspace .ws-rcard{width:364px}
.ch-workspace .ws-ccard{width:332px;transition-delay:.3s}
.ch-workspace.ws-right-open .ws-rcard,.ch-workspace.ws-coach-open .ws-ccard{opacity:1;visibility:visible;pointer-events:auto;transform:none;filter:none}
.ch-workspace .ws-rhead{flex:0 0 54px;display:flex;align-items:center;gap:8px;padding:0 12px 0 22px}
.ch-workspace .ws-rname{flex:1;min-width:0;font-family:var(--f-mono);font-size:12px;line-height:1;letter-spacing:1.4px;text-transform:uppercase;color:var(--ws-tx-2)}
.ch-workspace .ws-rtog{width:30px;height:30px;display:grid;place-items:center;color:var(--ws-tx-3)}
.ch-workspace .ws-rtog svg{width:19px;height:19px}
.ch-workspace .ws-rbody{flex:1;min-height:0;position:relative;padding:0 12px 18px}

/* the draft, being read */
.ch-workspace .ws-doc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:10px;transition:opacity .4s var(--zt-ease),filter .4s var(--zt-ease),transform .5s var(--zt-ease)}
.ch-workspace.ws-fb-on .ws-doc{opacity:0;filter:blur(8px);transform:scale(.98);pointer-events:none}
.ch-workspace .ws-page{position:relative;width:316px;border-radius:12px;background:#f6f5f3;color:#1f1d1e;padding:26px 14px 14px;overflow:hidden}
.ch-workspace .ws-pg-t{font-size:18px;font-weight:700;line-height:1.25;letter-spacing:-.02em;padding:0 12px}
.ch-workspace .ws-pg-by{font-size:11.5px;line-height:1.3;color:rgba(31,29,30,.5);margin-top:4px;padding:0 12px}
.ch-workspace .ws-sec{position:relative;margin-top:12px;padding:12px 42px 14px 12px;border-radius:9px;transition:background .45s var(--zt-ease)}
.ch-workspace .ws-sec-h{font-size:11px;font-weight:600;line-height:1.2;color:rgba(31,29,30,.5);margin-bottom:8px}
.ch-workspace .ws-sec-b{font-size:14px;font-weight:600;line-height:1.3;margin-bottom:10px}
.ch-workspace .ws-ln{display:block;height:6px;border-radius:9px;background:rgba(31,29,30,.11)}
.ch-workspace .ws-ln+.ws-ln{margin-top:7px}
.ch-workspace .ws-bars{display:flex;flex-direction:column;gap:6px}
.ch-workspace .ws-bars span{display:flex;align-items:center;justify-content:flex-end;height:8px;border-radius:9px;background:rgba(31,29,30,.13)}
.ch-workspace .ws-bars span:first-child{height:19px;border-radius:6px;background:#1f1d1e}
.ch-workspace .ws-bars b{font-size:10.5px;font-weight:700;line-height:1;color:#f6f5f3;padding-right:7px}
.ch-workspace .ws-gap{height:28px;margin-top:10px;border-radius:7px;border:1.5px dashed rgba(31,29,30,.2);display:grid;place-items:center;transition:border-color .4s var(--zt-ease)}
.ch-workspace .ws-gap span{font-size:10.5px;font-weight:700;line-height:1;color:var(--ws-fix);opacity:0;transition:opacity .4s var(--zt-ease)}
.ch-workspace .ws-sec-mk{position:absolute;right:12px;top:10px;width:18px;height:18px;border-radius:99px;display:grid;place-items:center;color:#fff;border:1.5px solid transparent;opacity:0;transform:scale(.4);
  transition:opacity .25s var(--zt-ease),transform .45s cubic-bezier(.34,1.56,.64,1)}
.ch-workspace .ws-sec-mk i{position:absolute;inset:0;display:none;place-items:center}
.ch-workspace .ws-sec-mk svg{width:10px;height:10px}
.ch-workspace .ws-sec.ws-ok{background:rgba(63,185,104,.12)}
.ch-workspace .ws-sec.ws-ok .ws-sec-mk{opacity:1;transform:none;background:var(--ws-ok);border-color:var(--ws-ok)}
.ch-workspace .ws-sec.ws-ok .ws-i-tick{display:grid}
.ch-workspace .ws-sec.ws-bad{background:rgba(255,106,77,.11)}
.ch-workspace .ws-sec.ws-bad .ws-sec-mk{opacity:1;transform:none;border-color:var(--ws-fix);color:var(--ws-fix)}
.ch-workspace .ws-sec.ws-bad .ws-i-bang{display:grid}
.ch-workspace .ws-sec.ws-bad .ws-gap{border-color:var(--ws-fix)}
.ch-workspace .ws-sec.ws-bad .ws-gap span{opacity:1}
.ch-workspace .ws-scanline{position:absolute;left:0;right:0;top:0;height:64px;margin-top:-64px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,rgba(73,186,97,0),rgba(73,186,97,.2));border-bottom:2px solid var(--zt-green);transition:opacity .3s var(--zt-ease)}
.ch-workspace .ws-page.ws-scanning .ws-scanline{opacity:1;animation:ws-scan var(--ws-scan,3s) linear forwards}
.ch-workspace .ws-scan-note{margin-top:16px;font-size:12.5px;line-height:1.3;color:var(--ws-tx-2);font-variant-numeric:tabular-nums}

/* the feedback */
.ch-workspace .ws-fb{position:relative;padding:4px 10px 0;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .45s var(--zt-ease) .14s,transform .6s var(--zt-ease) .14s}
.ch-workspace.ws-fb-on .ws-fb{opacity:1;transform:none;pointer-events:auto}
.ch-workspace .ws-band-l{font-size:19px;font-weight:700;line-height:1.24;letter-spacing:-.02em}
.ch-workspace .ws-band-l.ws-swap{animation:ws-swap .6s var(--zt-ease)}
.ch-workspace .ws-track{display:flex;gap:5px;margin-top:13px}
.ch-workspace .ws-track i{flex:1;height:3px;border-radius:99px;background:var(--ws-hover);transition:background .6s var(--zt-ease)}
.ch-workspace .ws-track i.ws-lit{background:var(--ws-meets)}
.ch-workspace .ws-band.ws-up .ws-track i.ws-lit{background:var(--ws-exceeds)}
.ch-workspace .ws-grades{display:flex;gap:5px;margin-top:8px}
.ch-workspace .ws-grades span{flex:1;min-width:0;font-family:var(--f-mono);font-size:9.5px;font-weight:700;line-height:1.4;letter-spacing:.7px;text-transform:uppercase;color:var(--ws-tx-3);transition:color .5s var(--zt-ease)}

.ch-workspace .ws-cask:focus-within{border-color:var(--ws-tx-4)}

.ch-workspace .ws-csend{appearance:none;border:0;cursor:pointer;flex:0 0 auto;width:30px;height:30px;border-radius:99px;background:var(--ws-tx);color:var(--ws-bg);display:grid;place-items:center;opacity:.35;transition:opacity .24s var(--zt-ease),transform .24s var(--zt-ease)}
.ch-workspace .ws-csend svg{width:14px;height:14px}
