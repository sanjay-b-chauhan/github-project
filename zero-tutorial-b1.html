/* ---------- motion helpers ---------- */
/* laid out in one go: no entrance while the screen is being built, or while a final box is being measured */
.ch-workspace.ws-instant *,.ch-workspace.ws-instant *::before,.ch-workspace.ws-instant *::after{animation:none!important;transition:none!important}
.ch-workspace.ws-still,.ch-workspace.ws-still *{transition:none!important}
@keyframes ws-rise{from{opacity:0;transform:translateY(10px)}}
@keyframes ws-bob{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
@keyframes ws-spin{to{transform:rotate(360deg)}}
@keyframes ws-pop{0%{transform:scale(1)}45%{transform:scale(1.24)}100%{transform:scale(1)}}
@keyframes ws-pulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.1);opacity:1}}
@keyframes ws-sweep{0%{background-position:170% 0}100%{background-position:-170% 0}}
@keyframes ws-scan{from{top:0}to{top:calc(100% + 64px)}}
@keyframes ws-swap{from{opacity:0;filter:blur(6px);transform:translateY(5px)}}
@media (prefers-reduced-motion:reduce){
  .ch-workspace .ws-right,.ch-workspace .ws-coach{transition-duration:.01s}
  .ch-workspace .ws-card{transition-duration:.01s;transition-delay:0s}
  .ch-workspace .ws-msgs>.ws-new,.ch-workspace .ws-cthread>.ws-new,.ch-workspace .ws-band-l.ws-swap{animation:none}
}

/* ch/07-present.css */
/* 7 · presentation. The live room, rebuilt small: Meet-grammar tiles, the top strip, one white
   pill for the learner's action, the shared deck, then the report. Colours are the room's own. */
.ch-present{background:#202124;color:#e8eaed;font-family:var(--f-sans);letter-spacing:-.01em;
  --pr-card:#262626;--pr-line:rgba(255,255,255,.075);--pr-tx:#f2f1ee;--pr-tx2:#a5a29b;--pr-tx3:#6d6a63;--pr-ok:#3fb968}
.ch-present .pr-bg{position:absolute;inset:0;background:#202124;transition:background .6s var(--zt-ease)}
.ch-present.pr-sharing .pr-bg{background:#1E1E1E}

/* ---------- top strip ---------- */
.ch-present .pr-top{position:absolute;left:20px;right:20px;top:20px;height:60px;z-index:5;border-radius:14px;background:#242528;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 18px}
.ch-present .pr-tl,.ch-present .pr-tr{display:flex;align-items:center}
.ch-present .pr-title{font:500 14px/1 var(--f-sans);color:#e8eaed;white-space:nowrap}
.ch-present .pr-ck{display:inline-flex;align-items:center;gap:6px;height:34px;border-radius:10px;background:#3c4043;color:#e8eaed;white-space:nowrap;overflow:hidden;
  max-width:0;padding:0;margin-right:0;opacity:0;transition:max-width .5s var(--zt-ease),padding .5s var(--zt-ease),margin .5s var(--zt-ease),opacity .4s var(--zt-ease)}
.ch-present .pr-ck svg{width:14px;height:14px;display:block;flex:0 0 auto}
.ch-present .pr-ck b{font:700 13px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.ch-present.pr-sharing .pr-ck{max-width:96px;padding:0 12px;margin-right:14px;opacity:1}
.ch-present .pr-live{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 13px;margin-right:10px;border-radius:999px;background:rgba(255,255,255,.07);color:rgba(232,234,237,.82);white-space:nowrap;
  font:500 12.5px/1 var(--f-sans);opacity:0;transform:translateY(-4px);transition:opacity .4s var(--zt-ease),transform .5s var(--zt-ease)}
.ch-present .pr-live svg{width:15px;height:15px;display:block}
.ch-present.pr-sharing .pr-live{opacity:1;transform:none}
.ch-present .pr-leave{width:44px;height:44px;border-radius:12px;background:#ea4335;color:#fff;display:grid;place-items:center}
.ch-present .pr-leave svg{width:20px;height:20px;display:block}
.ch-present.pr-over .pr-ck,.ch-present.pr-over .pr-live{max-width:0;padding:0;margin-right:0;opacity:0}

/* ---------- the people: three panel tiles and the learner's own seat ---------- */
.ch-present .pr-tile{position:absolute;z-index:2;overflow:hidden;border-radius:12px;background:#3c4043;top:150px;width:490px;height:360px;
  transition:left .76s var(--zt-ease),top .76s var(--zt-ease),width .76s var(--zt-ease),height .76s var(--zt-ease),box-shadow .5s var(--zt-ease)}
/* Navid's seat is an empty tile. It never animates, so the engine can always measure it. */
.ch-present .pr-navid{left:41px;transition:none}
.ch-present .pr-avery{left:555px}
.ch-present .pr-jordan{left:1069px}
.ch-present .pr-tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block}
.ch-present .pr-avery::after,.ch-present .pr-jordan::after{content:"";position:absolute;left:0;right:0;bottom:0;height:44%;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.52),rgba(0,0,0,0))}
.ch-present .pr-nm{position:absolute;z-index:1;left:16px;bottom:14px;display:flex;align-items:baseline;gap:8px;white-space:nowrap;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.55)}
.ch-present .pr-nm b{font:600 14px/1.1 var(--f-sans)}
.ch-present .pr-nm span{font:400 12.5px/1.1 var(--f-sans);color:rgba(255,255,255,.78)}

.ch-present .pr-zav i.pr-two{transform:scale(calc(1 + var(--lvl) * 1.05));opacity:calc(var(--lvl) * .18)}
/* sharing: the people move to a strip on the right, the deck takes the stage */
.ch-present.pr-sharing .pr-tile{left:1300px;width:280px;height:154px}
.ch-present.pr-sharing .pr-navid{top:96px}
.ch-present.pr-sharing .pr-avery{top:262px}
.ch-present.pr-sharing .pr-jordan{top:428px}
.ch-present.pr-sharing .pr-you{top:594px;box-shadow:inset 0 0 0 1px var(--pr-line),0 0 0 rgba(0,0,0,0)}

/* ---------- the room's controls ---------- */
.ch-present .pr-dock{position:absolute;left:0;right:0;top:692px;height:48px;z-index:4;display:flex;justify-content:center;align-items:center;gap:8px;
  transition:transform .76s var(--zt-ease),opacity .35s var(--zt-ease)}

.ch-present .pr-gmc{appearance:none;border:0;margin:0;height:48px;width:56px;padding:0;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  background:#fff;color:#202124;font:600 14.5px/1 var(--f-sans);letter-spacing:-.01em;white-space:nowrap;-webkit-user-select:none;user-select:none;touch-action:none;
  transition:width .5s var(--zt-ease),padding .5s var(--zt-ease),background .2s var(--zt-ease),color .2s var(--zt-ease),box-shadow .2s var(--zt-ease),transform .2s var(--zt-ease),opacity .3s var(--zt-ease)}
.ch-present .pr-gmc svg{width:20px;height:20px;display:block;flex:0 0 auto}

.ch-present .pr-shr{width:auto;padding:0 22px 0 18px;cursor:pointer;box-shadow:0 12px 34px rgba(0,0,0,.42)}

.ch-present .pr-mic{pointer-events:none}
.ch-present.pr-sharing .pr-shr{padding:0 18px;box-shadow:none;pointer-events:none}
.ch-present.pr-sharing .pr-shr .pr-lbl{max-width:0;margin-left:0;opacity:0}
.ch-present.pr-sharing .pr-cam{order:-1}

.ch-present.pr-sharing .pr-mic{width:236px;box-shadow:0 12px 34px rgba(0,0,0,.42)}
.ch-present.pr-sharing .pr-mic .pr-lbl{max-width:150px;margin-left:10px;opacity:1}
.ch-present.pr-ready .pr-mic{pointer-events:auto;cursor:pointer}
.ch-present.pr-ready .pr-mic:hover{background:#eceae6}
.ch-present .pr-lv{display:inline-flex;align-items:center;gap:2.5px;height:22px;max-width:0;margin-left:0;opacity:0;overflow:hidden;transition:max-width .3s var(--zt-ease),margin .3s var(--zt-ease),opacity .2s}
.ch-present .pr-lv i{width:2.5px;height:3px;border-radius:9px;background:currentColor;flex:0 0 auto;transition:height .07s linear}

  opacity:0;transform:translateY(16px) scale(.97);filter:blur(10px);pointer-events:none;

.ch-present .pr-th span::before,.ch-present .pr-th span::after{content:"";height:2px;border-radius:2px;background:#cfcac0;width:70%}

.ch-present .pr-s-t{margin:10px 0 0;font:500 27px/1.12 var(--f-sans);letter-spacing:-.02em}
.ch-present .pr-s-body{flex:1;min-height:0;display:flex;align-items:center;gap:44px}
.ch-present .pr-s-fact{flex:0 0 auto}
.ch-present .pr-s-fact b{display:block;font:500 84px/1 var(--f-sans);letter-spacing:-.04em}
.ch-present .pr-s-fact span{display:block;margin-top:8px;font:400 15px/1.35 var(--f-sans);color:#55534e}
.ch-present .pr-s-bars{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.ch-present .pr-s-bar{display:grid;grid-template-columns:128px 1fr 34px;align-items:center;gap:12px}
.ch-present .pr-s-bar span{font:400 12.5px/1.2 var(--f-sans);color:#3c3b37;white-space:nowrap}
.ch-present .pr-s-bar i{display:block;height:12px;border-radius:99px;background:#e8e4da;overflow:hidden}

.ch-present .pr-s-bar em{font:400 11.5px/1 var(--f-mono);font-style:normal;text-align:right;color:#1a1a1a}

/* ---------- under the deck: an example, the learner's live words, or the typed way through ---------- */
.ch-present .pr-cap{position:absolute;left:244px;top:570px;width:808px;height:72px;z-index:3;opacity:0;pointer-events:none;transition:opacity .4s var(--zt-ease) .3s}

.ch-present .pr-says{position:absolute;left:0;right:0;top:0;display:flex;justify-content:center;gap:12px;opacity:0;transform:translateY(8px);transition:opacity .3s var(--zt-ease),transform .4s var(--zt-ease)}
.ch-present.pr-has-words .pr-says{opacity:1;transform:none}
.ch-present .pr-says-av{width:34px;height:34px;flex:0 0 34px;margin-top:3px;border-radius:50%;background:#6f7f9c;color:#fff;display:grid;place-items:center;font:600 13px/1 var(--f-sans)}
.ch-present .pr-says-col{width:600px;display:flex;flex-direction:column;gap:1px}
.ch-present .pr-says-who{font:500 13px/16px var(--f-sans);color:rgba(255,255,255,.66)}
.ch-present .pr-capt{display:flex;flex-direction:column;justify-content:flex-end;max-height:54px;overflow:hidden;font:400 20px/27px var(--f-sans);color:#fff}
.ch-present .pr-field{position:absolute;left:144px;top:28px;width:520px;height:44px;display:none;align-items:center;gap:8px;padding:0 5px 0 18px;border-radius:26px;background:var(--pr-card);box-shadow:inset 0 0 0 1px var(--pr-line);transition:box-shadow .2s}

.ch-present.pr-typing .pr-eg{opacity:1}
@keyframes present-in{from{opacity:0;transform:translateY(6px);filter:blur(6px)}}
.ch-present .pr-in{flex:1;min-width:0;height:34px;border:0;outline:0;background:none;color:var(--pr-tx);font:400 14px/1 var(--f-sans);letter-spacing:-.01em}
.ch-present .pr-in::placeholder{color:var(--pr-tx3)}
.ch-present .pr-send{appearance:none;border:0;padding:0;width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:#fff;color:#0d0d0d;display:grid;place-items:center;cursor:pointer;transition:opacity .2s,transform .24s var(--zt-ease)}
.ch-present .pr-send svg{display:block;width:17px;height:17px}
.ch-present .pr-send:disabled{opacity:.3;cursor:default}
.ch-present .pr-send:not(:disabled):hover{transform:scale(1.06)}
/* every mic state gets one short line; when there is nothing to say, the quiet way out sits there */
.ch-present .pr-line{position:absolute;left:244px;top:650px;width:808px;height:20px;z-index:3;text-align:center;white-space:nowrap;font:400 13.5px/20px var(--f-sans);color:rgba(232,234,237,.74);
  opacity:0;transform:translateY(4px);transition:opacity .24s var(--zt-ease),transform .36s var(--zt-ease)}
.ch-present .pr-line.pr-show{opacity:1;transform:none}
.ch-present .pr-alt{appearance:none;border:0;background:none;position:absolute;left:648px;top:647px;z-index:3;transform:translateX(-50%);padding:5px 9px;border-radius:8px;cursor:pointer;white-space:nowrap;
  font:500 12.5px/16px var(--f-sans);letter-spacing:-.01em;color:rgba(232,234,237,.46);opacity:0;pointer-events:none;transition:opacity .3s var(--zt-ease),color .2s}

.ch-present.pr-ready.pr-has-line .pr-alt,.ch-present.pr-ready.pr-typing .pr-alt,.ch-present.pr-ready[data-mic="listening"] .pr-alt,.ch-present.pr-ready[data-mic="checking"] .pr-alt,.ch-present.pr-ready[data-mic="passed"] .pr-alt{opacity:0;pointer-events:none}

/* ---------- scoring, then the report ---------- */
.ch-present.pr-over .pr-share{opacity:0;transform:scale(.97);filter:blur(10px);transition-delay:0s}
.ch-present.pr-over .pr-cap,.ch-present.pr-over .pr-line,.ch-present.pr-over .pr-alt{opacity:0;pointer-events:none;transition-delay:0s}
.ch-present.pr-over .pr-dock{opacity:0;pointer-events:none}
.ch-present .pr-score,.ch-present .pr-report{position:absolute;left:244px;top:96px;width:808px;height:580px;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transform:scale(.98);filter:blur(8px);transition:opacity .4s var(--zt-ease),transform .6s var(--zt-ease),filter .4s var(--zt-ease)}
.ch-present.pr-scoring .pr-score{opacity:1;transform:none;filter:none;transition-delay:.25s}
.ch-present .pr-orb{position:relative;width:72px;height:72px}
.ch-present .pr-orb span{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;border-top-color:#3fb968;animation:present-spin 1.1s linear infinite}
.ch-present .pr-orb span:nth-child(2){inset:10px;border-top-color:#7c6f9c;animation-duration:1.5s}
.ch-present .pr-orb span:nth-child(3){inset:20px;border-top-color:#c0553f;animation-duration:1.9s}

.ch-present .pr-score-h{margin-top:22px;font:500 26px/1.2 var(--f-serif);color:#f2f1ee}
.ch-present .pr-srows{margin-top:22px;display:flex;flex-direction:column;gap:10px;width:300px}
.ch-present .pr-srow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:11px 14px 11px 16px;border-radius:12px;background:var(--pr-card);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
  opacity:.35;transition:opacity .4s var(--zt-ease)}
.ch-present .pr-srow span{font:500 14px/1.2 var(--f-sans);color:#e7e5e9}
.ch-present .pr-srow i{width:22px;height:22px;flex:0 0 22px;border-radius:50%;background:rgba(255,255,255,.1);color:transparent;display:grid;place-items:center;transition:background .3s var(--zt-ease),color .3s var(--zt-ease)}
.ch-present .pr-srow i svg{width:13px;height:13px;display:block}
.ch-present .pr-srow.pr-on{opacity:1}
.ch-present .pr-srow.pr-on i{background:var(--pr-ok);color:#0b0b0d}

.ch-present.pr-reported .pr-report{opacity:1;transform:none;filter:none;pointer-events:auto}
.ch-present .pr-report{align-items:stretch;padding:0 94px}
.ch-present .pr-report>*{opacity:0;transform:translateY(10px);transition:opacity .5s var(--zt-ease),transform .6s var(--zt-ease)}
.ch-present.pr-reported .pr-report>*{opacity:1;transform:none}
.ch-present.pr-reported .pr-report>*:nth-child(2){transition-delay:.08s}
.ch-present.pr-reported .pr-report>*:nth-child(3){transition-delay:.16s}
.ch-present.pr-reported .pr-report>*:nth-child(4){transition-delay:.26s}
.ch-present.pr-reported .pr-report>*:nth-child(5){transition-delay:.36s}
.ch-present .pr-r-eye{font:400 12px/1 var(--f-mono);letter-spacing:1.4px;text-transform:uppercase;color:var(--pr-tx2)}
.ch-present .pr-r-quote{margin:14px 0 0;font:400 17px/1.5 var(--f-sans);color:var(--pr-tx);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ch-present .pr-r-quote:empty{display:none}
.ch-present .pr-report [data-b="below"]{--ab:#969ba6;--abg:rgba(150,155,166,.16)}
.ch-present .pr-report [data-b="meets"]{--ab:#e7b90a;--abg:rgba(231,185,10,.14)}
.ch-present .pr-report [data-b="exceeds"]{--ab:#5d87ff;--abg:rgba(93,135,255,.17)}
.ch-present .pr-report [data-b="exceptional"]{--ab:#a778ff;--abg:rgba(167,120,255,.17)}
.ch-present .pr-acard{margin-top:20px;border-radius:16px;background:var(--pr-card);padding:16px 18px 15px}
.ch-present .pr-ac-top{display:flex;align-items:center;gap:9px}
.ch-present .pr-ac-top svg{width:17px;height:17px;display:block;color:var(--pr-tx2);flex:0 0 auto}
.ch-present .pr-ac-l{font:400 14.5px/1 var(--f-sans);color:var(--pr-tx2);white-space:nowrap}

.ch-present .pr-ac-track i{flex:1;height:4px;border-radius:99px;background:rgba(255,255,255,.06);transition:background .5s var(--zt-ease)}
.ch-present.pr-reported .pr-ac-track i.pr-on{background:var(--ab)}
.ch-present.pr-reported .pr-ac-track i:nth-child(1){transition-delay:.5s}
.ch-present.pr-reported .pr-ac-track i:nth-child(2){transition-delay:.62s}
.ch-present.pr-reported .pr-ac-track i:nth-child(3){transition-delay:.74s}
.ch-present .pr-rows{margin-top:12px;border-radius:16px;background:var(--pr-card);padding:6px 12px 6px 18px;display:flex;flex-direction:column}
.ch-present .pr-row{display:flex;align-items:center;gap:7px;height:50px}
.ch-present .pr-row b{font:600 14.5px/1 var(--f-sans);color:var(--pr-tx)}
.ch-present .pr-row span{font:400 14px/1 var(--f-sans);color:var(--pr-tx2)}
.ch-present .pr-band{margin-left:auto;font:600 12.5px/1 var(--f-sans);font-style:normal;white-space:nowrap;padding:8px 12px;border-radius:999px;color:var(--ab);background:var(--abg)}

  .ch-present .pr-orb span,.ch-present .pr-cd-n.pr-pop{animation:none}
}

/* ch/08-portfolio.css */
/* 8 · portfolio, 9 · jobs, the ending. The light paper surface: the learner's portfolio page,
   the finished project coming together in front of it, then the months ahead. */
.ch-portfolio{background:rgb(246,245,243);color:rgb(31,29,30);font-family:var(--f-sans);letter-spacing:-.01em;
  --pf-ink:rgb(31,29,30);--pf-ink2:rgba(31,29,30,.7);--pf-ink3:rgba(31,29,30,.46);--pf-ink4:rgba(31,29,30,.3);
  --pf-line:rgba(31,29,30,.12);--pf-line2:rgba(31,29,30,.06);--pf-sunk:rgba(31,29,30,.035);
  --pf-ok:#2a6e48;--pf-okbg:rgba(73,186,97,.15)}

/* ---------- the page ---------- */
.ch-portfolio .pf-page{position:absolute;inset:0;transform-origin:50% 44%;
  transition:opacity .6s var(--zt-ease),filter .6s var(--zt-ease),transform .8s var(--zt-ease)}

/* top band: who you are, who noticed, what it led to. Three zones on the four card columns. */
.ch-portfolio .pf-band{position:absolute;left:96px;top:44px;width:1408px;height:150px;display:grid;
  grid-template-columns:692px 334px 334px;column-gap:24px;align-items:center}
.ch-portfolio .pf-hero{display:flex;align-items:center;gap:22px;min-width:0}
.ch-portfolio .pf-ava{flex:none;width:84px;height:84px;border-radius:50%;background:#f2d57b;display:grid;place-items:center;
  font:500 30px/1 var(--f-sans);color:#1f1d1e}
.ch-portfolio .pf-id{min-width:0}
.ch-portfolio .pf-name{font:500 36px/1.05 var(--f-serif);letter-spacing:-.02em;margin:0;color:var(--pf-ink)}
.ch-portfolio .pf-role{display:flex;align-items:center;gap:7px;margin-top:10px;font:400 15px/1.2 var(--f-sans);color:var(--pf-ink2)}
.ch-portfolio .pf-role svg{width:15px;height:15px;color:var(--pf-ink3);flex:none}
.ch-portfolio .pf-score{flex:none;margin-left:16px;display:inline-flex;align-items:center;gap:11px;height:46px;padding:0 18px;border-radius:999px;
  border:1px solid var(--pf-line);color:var(--pf-ink);
  opacity:0;transform:translateY(8px) scale(.94);filter:blur(5px);
  transition:opacity .45s var(--zt-ease),transform .6s var(--zt-ease),filter .45s var(--zt-ease)}
.ch-portfolio .pf-score.pf-in{opacity:1;transform:none;filter:none}
.ch-portfolio .pf-score b{display:inline-block;min-width:32px;text-align:center;font:500 21px/1 var(--f-serif);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ch-portfolio .pf-leaf{display:block;width:12px;height:25px;flex:none}
.ch-portfolio .pf-leaf-l{transform:scaleX(-1)}

/* companies noticing, in the job portal's manner: a mark, what happened, the detail */
.ch-portfolio .pf-rail{min-width:0}
.ch-portfolio .pf-rail-h{font:600 12px/1 var(--f-sans);color:var(--pf-ink3);height:12px;margin-bottom:10px;opacity:0;transition:opacity .4s var(--zt-ease)}
.ch-portfolio .pf-rail-h.pf-in{opacity:1}
.ch-portfolio .pf-ev{display:flex;align-items:center;gap:11px;height:36px;
  opacity:0;transform:translateY(10px);filter:blur(5px);
  transition:opacity .45s var(--zt-ease),transform .6s var(--zt-ease),filter .45s var(--zt-ease)}
.ch-portfolio .pf-ev + .pf-ev{margin-top:10px}
.ch-portfolio .pf-ev.pf-in{opacity:1;transform:none;filter:none}
.ch-portfolio .pf-tile{flex:none;width:36px;height:36px;border-radius:11px;background:#fff;border:1px solid var(--pf-line2);display:grid;place-items:center}
.ch-portfolio .pf-tile img{display:block;width:18px;height:18px;object-fit:contain}
.ch-portfolio .pf-ex{min-width:0;display:block}
.ch-portfolio .pf-ex b{display:block;font:600 13.5px/1.25 var(--f-sans);color:var(--pf-ink);white-space:nowrap}
.ch-portfolio .pf-ex span{display:block;margin-top:2px;font:400 12.5px/1.25 var(--f-sans);color:var(--pf-ink3);white-space:nowrap}
.ch-portfolio .pf-date{display:flex;flex-direction:column;align-items:center;gap:1px}
.ch-portfolio .pf-date small{font:500 8.5px/1 var(--f-sans);color:var(--pf-ink3)}
.ch-portfolio .pf-date b{font:500 14px/1 var(--f-serif);color:var(--pf-ink)}

/* the offer */
.ch-portfolio .pf-offer{height:146px;border-radius:26px;background:#fff;border:1px solid var(--pf-line2);padding:18px 20px 19px;
  display:flex;flex-direction:column;justify-content:space-between;
  opacity:0;transform:translateY(12px) scale(.955);filter:blur(7px);
  transition:opacity .5s var(--zt-ease),transform .72s var(--zt-ease),filter .5s var(--zt-ease)}
.ch-portfolio .pf-offer.pf-in{opacity:1;transform:none;filter:none}
.ch-portfolio .pf-offer-top{display:flex;align-items:center;justify-content:space-between}
.ch-portfolio .pf-offer .pf-tile{width:44px;height:44px;border-radius:13px;background:rgb(250,249,247)}
.ch-portfolio .pf-offer .pf-tile img{width:24px;height:24px}
.ch-portfolio .pf-chip{display:inline-flex;align-items:center;gap:5px;height:27px;padding:0 11px 0 8px;border-radius:999px;
  background:var(--pf-okbg);color:var(--pf-ok);font:600 12.5px/1 var(--f-sans)}
.ch-portfolio .pf-chip svg{width:13px;height:13px}
.ch-portfolio .pf-offer h3{font:500 21px/1.15 var(--f-serif);letter-spacing:-.02em;margin:0;color:var(--pf-ink)}
.ch-portfolio .pf-offer p{font:400 13.5px/1.2 var(--f-sans);color:var(--pf-ink2);margin:5px 0 0}

/* projects */
.ch-portfolio .pf-ph{position:absolute;left:96px;top:222px;height:30px;display:flex;align-items:center;gap:11px;transition:opacity .5s var(--zt-ease)}
.ch-portfolio .pf-ph h2{font:500 23px/30px var(--f-serif);letter-spacing:-.02em;margin:0;color:var(--pf-ink)}
.ch-portfolio .pf-count{display:inline-block;font:400 15px/30px var(--f-sans);color:var(--pf-ink3);font-variant-numeric:tabular-nums;padding-top:3px}
.ch-portfolio .pf-when{margin-left:6px;display:inline-flex;align-items:center;gap:6px;height:27px;padding:0 12px 0 9px;border-radius:999px;background:var(--pf-sunk);
  font:500 12.5px/1 var(--f-sans);color:var(--pf-ink2);opacity:0;transform:translateY(5px);transition:opacity .4s var(--zt-ease),transform .5s var(--zt-ease)}
.ch-portfolio .pf-when.pf-in{opacity:1;transform:none}
.ch-portfolio .pf-when svg{width:14px;height:14px;color:var(--pf-ink3)}
.ch-portfolio .pf-when i{display:inline-block;font-style:normal}

.ch-portfolio .pf-row{position:absolute;left:96px;top:268px;width:1408px;height:424px;display:grid;grid-template-columns:repeat(4,334px);column-gap:24px;
  transition:opacity .5s var(--zt-ease)}
.ch-portfolio .pf-slot{position:relative;border-radius:30px}
.ch-portfolio .pf-slot::before{content:"";position:absolute;inset:0;border-radius:30px;border:1.5px dashed rgba(31,29,30,.18);
  transition:opacity .4s var(--zt-ease) .2s}
.ch-portfolio .pf-slot.pf-full::before{opacity:0}

.ch-portfolio .pf-card{position:absolute;inset:0;border-radius:30px;background:#fff;border:1px solid var(--pf-line2);display:flex;flex-direction:column;overflow:hidden;
  opacity:0;transform:translateY(16px) scale(.965);filter:blur(7px);
  transition:opacity .5s var(--zt-ease),transform .72s var(--zt-ease),filter .5s var(--zt-ease)}
.ch-portfolio .pf-card.pf-in{opacity:1;transform:none;filter:none}

      var seat = null;

        if (/your coach/i.test(t)) toCoach();

      await api.turn({
        text: 'Ask your coach how to fix it', target: C.asked ? null : w.cchip, pad: 5,
        until: function (done) { w.onCoachAsked = done; if (C.asked) done(); },
        auto: function () { if (!C.asked) return api.click(w.cchip); }
      });
      rest();

      await api.say('C2', { onSeg: function (i, t) {

          '<div class="pf-body">' +
            '<div class="pf-top"><span class="pf-co">' + logo(p.logo) + '<span>' + esc(p.co) + '</span></span>' +
              '<span class="pf-sc">' + I.gauge + '<b>' + SCORES[k] + '</b></span></div>' +
            '<h3>' + esc(p.title) + '</h3>' +
            '<p class="pf-desc">' + esc(p.desc) + '</p>' +
            '<div class="pf-meta"><span class="pf-pill">' + I.play + p.dur + '</span><span class="pf-pill">' + I.doc + p.files + '</span></div>' +
          '</div></article></div>';
      }
      function part(tile, label, value) {
        return '<div class="pf-part"><span class="pf-pt">' + tile + '</span>' +
          '<span class="pf-px"><small>' + label + '</small><b>' + esc(value) + '</b></span>' +
          '<span class="pf-mk">' + I.check + '</span></div>';
      }
      function ev(tile, title, sub) {
        return '<div class="pf-ev' + on(noticed) + '"><span class="pf-tile">' + tile + '</span>' +
          '<span class="pf-ex"><b>' + esc(title) + '</b><span>' + esc(sub) + '</span></span></div>';
      }

      root.innerHTML =
        '<div class="pf-page">' +
          '<div class="pf-band">' +
            '<div class="pf-hero">' +
              '<div class="pf-ava">' + initial + '</div>' +
              '<div class="pf-id"><h1 class="pf-name">' + name + '</h1><div class="pf-role">' + I.bag + '<span>' + role + '</span></div></div>' +
              '<div class="pf-score' + on(filled) + '">' + laurel(false) + '<b>' + OVERALL[Math.max(0, filled - 1)] + '</b>' + laurel(true) + '</div>' +
            '</div>' +
            '<div class="pf-rail">' +
              '<div class="pf-rail-h' + on(noticed) + '">Job portal</div>' +
              ev(logo('notion'), 'Notion viewed your portfolio', '6 minutes on your ' + d.company + ' project') +
              ev(logo('figma'), 'Figma shortlisted you', 'For their ' + d.learner.role + ' role') +
              ev('<span class="pf-date"><small>Thu</small><b>18</b></span>', 'Interview booked', 'Figma, Thursday at 2:00 pm') +
            '</div>' +
            '<div class="pf-offer' + on(noticed) + '">' +
              '<div class="pf-offer-top"><span class="pf-tile">' + logo('figma') + '</span><span class="pf-chip">' + I.check + 'Offer</span></div>' +
              '<div><h3>' + role + '</h3><p>Figma</p></div>' +
            '</div>' +
          '</div>' +
          '<div class="pf-ph"><h2>Projects</h2><span class="pf-count">' + filled + '</span>' +
            '<span class="pf-when' + on(filled) + '">' + I.clock + '<i>' + P[Math.max(0, filled - 1)].when + '</i></span></div>' +
          '<div class="pf-row">' + P.map(card).join('') + '</div>' +
        '</div>' +

        /* the project the learner just finished, coming together in front of the page */
        '<div class="pf-build">' +
          '<div class="pf-b-co">' + logo('airbnb') + '<span>' + esc(d.company) + '</span></div>' +
          '<h2 class="pf-b-t">' + esc(d.title) + '</h2>' +
          '<div class="pf-parts">' +
            part(I.doc, 'Your work', d.stage.draft) +
            part(I.chat, 'Feedback', 'Exceeds expectations') +
            part('<span class="pf-mini"><span class="pf-mini-s"><i></i><i></i></span><span class="pf-mini-p"></span></span>', 'Presentation', 'Recording, 0:42') +
          '</div>' +
        '</div>' +
        '<div class="pf-cta"><span class="pf-pad"><button class="pf-add" type="button" disabled>Add to my portfolio</button></span></div>' +

        /* the close */
        '<div class="pf-end">' +
          '<h2 class="pf-e-h">That\'s Zero.</h2>' +
          '<div class="pf-e-go"><button class="pf-go" type="button">Start my first project</button>' +
            '<p class="pf-open" role="status"></p></div>' +
          '<button class="pf-replay" type="button">' + I.again + '<span>Replay the tour</span></button>' +
        '</div>';

      if (filled) { root.classList.add('pf-flown'); root.querySelector('.pf-build').setAttribute('aria-hidden', 'true'); }
      if (at === 'jobs-end') { root.classList.add('pf-s-end'); api.bare(true); }

      /* this is a tour, so the last button is honest about where it leads */
      var go = root.querySelector('.pf-go');
      go.addEventListener('click', function () {
        go.disabled = true;
        root.querySelector('.pf-open').textContent = 'This is where your first real project opens.';
        root.classList.add('pf-started'); api.sfx('good');
      });
      root.querySelector('.pf-replay').addEventListener('click', function () { api.restart(); });
    },

    run: async function (api) {
      var root = api.root, P = projects(api.data);
      function $(s) { return root.querySelector(s); }
      function $$(s) { return [].slice.call(root.querySelectorAll(s)); }
      var cards = $$('.pf-card'), slots = $$('.pf-slot'), parts = $$('.pf-part'), evs = $$('.pf-ev');
      var add = $('.pf-add'), build = $('.pf-build'), count = $('.pf-count'), score = $('.pf-score'), scoreN = $('.pf-score b'), when = $('.pf-when'), whenT = $('.pf-when i');

      /* swap a small value and let it tick. The text is the state, the tick is decoration. */
      function bump(el, text) {
        if (el.textContent === String(text)) return;
        el.textContent = text; el.classList.remove('pf-tick'); void el.offsetWidth; el.classList.add('pf-tick');
      }
      /* project k takes its place in the row, then everything that counts projects moves with it */
      var counted = cards.map(function (c) { return c.classList.contains('pf-in'); });
      function place(k) { cards[k].classList.add('pf-in'); slots[k].classList.add('pf-full'); }
      function tally(k, quiet) {
        if (counted[k]) return; counted[k] = true;
        bump(count, k + 1); bump(scoreN, OVERALL[k]); bump(whenT, P[k].when);
        score.classList.add('pf-in'); when.classList.add('pf-in');
        if (!quiet) api.sfx(k ? 'soft' : 'pop');
      }
      function land(k, quiet) { place(k); tally(k, quiet); }
      function show(el, sound) { if (el.classList.contains('pf-in')) return; el.classList.add('pf-in'); if (sound) api.sfx(sound); }
      function ending() { root.classList.add('pf-s-end'); api.clearRings(); api.cursor.hide(); api.bare(true); }

      if (api.startAt === 'jobs-end') {          // skipped the tour: the ending, already whole, no voice
        api.guide.home({ role: ROLE });
        await new Promise(function () {});
      }

      await api.guide.home({ role: ROLE });

      if (api.startAt !== 'jobs') {
        /* ---------- portfolio ---------- */
        await api.wait(500);
        await api.say('F1', { onSeg: function (i) {
          if (i === 0) api.cursor.to(build, { ax: .86, ay: .1 });
          if (i === 1) parts.forEach(function (p, k) {           // "The work, the feedback, the presentation."
            api.later(k * 700, function () { api.cursor.to(p.querySelector('.pf-mk'), { ax: .7, ay: .7 }); });
            api.later(k * 700 + 420, function () { if (!p.classList.contains('pf-on')) { p.classList.add('pf-on'); api.sfx('tick'); } });
          });
          if (i === 2) api.cursor.hide();
        } });
        parts.forEach(function (p) { p.classList.add('pf-on'); });
        api.cursor.hide();
        await api.wait(220);

        add.disabled = false;
        await api.turn({
          text: 'Add it to your portfolio', target: add, pad: 7,
          until: function (done) {
            add.addEventListener('click', function () {
              add.disabled = true; build.setAttribute('aria-hidden', 'true');
              build.style.setProperty('--pf-bh', build.offsetHeight + 'px'); void build.offsetWidth;   // pin the sheet's height, so it can grow into the slot's shape
              root.classList.add('pf-flown');                      // the card travels to the first slot
              place(0);                                            // and resolves there as a real project (the delay is in the CSS)
              api.later(960, function () { tally(0); });           // then the hero gets its first score
              done();
            }, { once: true });
          },
          auto: function () { return api.click(add); }
        });
        api.clearRings(); api.cursor.hide();
        await api.wait(1200);
        land(0, true);
        api.progress('jobs');
      }

      /* ---------- jobs ---------- */
      await api.wait(500);
      await api.say('J1', { onSeg: function (i) {
        if (i === 0) [1, 2, 3].forEach(function (k, n) {            // "Every project adds to it."
          api.later(140 + n * 400, function () { land(k); });
        });
        if (i === 1) {                                              // "As it grows, companies start to notice."
          show($('.pf-rail-h'));
          evs.forEach(function (e, n) { api.later(220 + n * 700, function () { show(e, 'soft'); }); });
        }
        if (i === 2) {                                              // "That's how people get hired here."
          api.later(160, function () { show($('.pf-offer'), 'good'); });
          api.later(260, function () { api.cursor.to($('.pf-offer'), { ax: .93, ay: .9 }); });   // Navid points at the offer
        }
        if (i === 4) {                                              // "With proof." The proof is the row.
          api.cursor.hide();
          cards.forEach(function (c, n) {
            api.later(n * 120, function () { c.classList.remove('pf-nod'); void c.offsetWidth; c.classList.add('pf-nod'); });
          });
        }
      } });
      api.cursor.hide();
      [1, 2, 3].forEach(function (k) { land(k, true); });           // whatever the clock did, the page is whole
      show($('.pf-rail-h')); evs.forEach(function (e) { show(e); }); show($('.pf-offer'));
      await api.wait(2200);                                         // let the whole page be read

      await api.say('J2');
      await api.wait(320);

      /* ---------- the ending ---------- */
      ending();
      api.sfx('soft');
      await new Promise(function () {});
    }
  });
})();

</script>
</body>
</html>
