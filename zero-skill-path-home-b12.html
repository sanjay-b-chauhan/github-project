<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Zero home, level and coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,100..1000&display=swap">
<link rel="stylesheet" href="zero-skill-path-home-assets-b12/home.css">
<link rel="stylesheet" href="zero-skill-path-home-assets-b12/journey.css">
</head>
<body>
<!-- prototype controls, outside the app: run a case, pick the coach version -->
<div id="dev">
  <a class="dv-home" href="zero-skill-path-index.html">Zero skill path</a>
  <div class="dv-mid">
    <div class="dv-seg" id="cases"></div>
    <div class="dv-run" id="run"></div>
  </div>
  <div class="dv-r"><div class="dv-seg sm" id="variant"></div><span class="dv-b">b12</span></div>
</div>

<div id="stage">
  <div id="app">
    <div class="titlebar"><i></i><i></i><i></i><span class="tb-r"><span class="tb-theme"></span></span></div>
    <div class="screen" id="screen">
      <div class="world" id="world"><img id="city" alt=""><div class="pin" id="pin"></div></div>
      <img class="wm" alt="zero">
      <nav class="rail" id="rail"></nav>
      <!-- the two chips are the tabs: the level opens Level, Navid opens the coach -->
      <div class="hud" id="hud">
        <button class="chip-lv" id="chipLv" type="button" aria-label="Your level"><span class="st">✦</span><b id="lvNum">L0</b><span class="bar"><i id="lvBar"></i></span></button>
        <button class="chip-me" id="chipMe" type="button" aria-label="Your coach, Navid"><img alt=""><span class="dot" id="meDot"></span></button>
        <span class="gain" id="gain"></span>
      </div>
      <div class="panel" id="panel" role="dialog" aria-label="Your level and your coach">
        <div class="pn-scroll" id="pnScroll">
          <section class="pn-page" data-page="level" id="pgLevel"></section>
          <section class="pn-page" data-page="coach" id="pgCoach"></section>
        </div>
        <div class="pop" id="pop" hidden></div>
        <div class="sheet" id="sheet" hidden></div>
      </div>
      <div class="scene" id="scene" hidden></div>
      <div class="lvup" id="lvup" hidden></div>
      <div class="sum" id="sum" hidden></div>
      <div class="toasts" id="toasts" aria-live="polite"></div>
      <div class="live" id="live" hidden></div>
      <aside class="card" id="card"></aside>
      <div class="capsule" id="capsule"></div>
    </div>
  </div>
</div>
<script src="zero-skill-path-home-assets-b12/data.js"></script>
<script src="zero-skill-path-home-assets-b12/home.js"></script>
<script src="zero-skill-path-home-assets-b12/journey.js"></script>
</body>
</html>
