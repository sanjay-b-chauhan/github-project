.ch-portfolio .pf-sl .pf-hid{display:none!important}

/* the featured slot: the case study tile lands on it, then turns over into the recording.
   pf-flat: the turn is done and the recording stands on its own, with no 3D layer left on it */
.ch-portfolio .pf-sl .pf-fslot{position:relative;width:100%;aspect-ratio:96/60;perspective:1100px}
.ch-portfolio .pf-sl .pf-flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s var(--zt-ease)}
.ch-portfolio .pf-sl .pf-face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.ch-portfolio .pf-sl .pf-back{transform:rotateY(180deg)}
.ch-portfolio .pf-sl .pf-front .pf-tile{position:absolute;left:0;top:0;width:386.4px;height:241.5px;transform:scale(.833333);transform-origin:0 0}
.ch-portfolio.pf-flip-on .pf-sl .pf-flip{transform:rotateY(180deg)}
.ch-portfolio.pf-flat .pf-sl .pf-flip,.ch-portfolio.pf-flat .pf-sl .pf-back{transform:none;transition:none}
.ch-portfolio.pf-flat .pf-sl .pf-front{display:none}

/* the list: each project lands on top and pushes the others down. The source's 26px gap becomes each row's own
   space below it, so a row can open from nothing */
.ch-portfolio .pf-sl .p9-sz-cards{gap:0}
.ch-portfolio .pf-sl .pf-rw{height:0;overflow:hidden;transition:height .42s var(--zt-ease),padding .42s var(--zt-ease)}
.ch-portfolio .pf-sl .pf-rw.pf-on{padding-bottom:26px}
.ch-portfolio .pf-sl .pf-rw.pf-on:last-child{padding-bottom:0}
.ch-portfolio .pf-sl .pf-rw>.p9-sz-card{transform:translateY(22px);transition:transform .45s var(--zt-ease)}
.ch-portfolio .pf-sl .pf-rw.pf-on>.p9-sz-card{transform:none}

/* ---------- b11's project done moment (unchanged) on the app's 1920 canvas ----------
   pf-inst: nothing moves. pf-hoo-on: the veil is up. pf-hoo-in: the tile is there. pf-hoo-done: the tick, the words,
   the paper. pf-hoo-go: the veil lifts and the tile flies to the featured slot (b14: taking the slot's shape on the way).
   pf-hoo-gone: the slot's own copy has taken over. */
.ch-portfolio .pf-fx{position:absolute;z-index:1;left:0;top:0;width:1920px;height:1008px;transform:scale(.833333);transform-origin:0 0;font-size:16px;line-height:1.5;color:#1F1D1E;pointer-events:none}
.ch-portfolio .pf-fx svg,.ch-portfolio .pf-tile svg{display:block}
.ch-portfolio.pf-inst *{transition:none!important}
@media (prefers-reduced-motion:reduce){
  .ch-portfolio *{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}
}
/* the case study tile (PortfolioProjectCardV2): the company's colour as a frame (150deg, 22% to 40%), a white panel inside it */
.ch-portfolio .pf-tile{flex:none;position:relative;width:288px;height:216px;border-radius:16px;overflow:hidden;background:linear-gradient(150deg,#FF5A5F38,#FF5A5F66);font-size:16px;line-height:1.5;letter-spacing:0;color:#1F1D1E;font-family:var(--f-sans)}
.ch-portfolio .pf-tile-in{position:absolute;inset:24px;border-radius:12px;background:#fff;padding:16px;display:flex;flex-direction:column;justify-content:space-between}
.ch-portfolio .pf-tile-co{display:flex;align-items:center;gap:8px}
.ch-portfolio .pf-tile-co img{display:block;width:20px;height:20px;object-fit:contain;border-radius:5px}
.ch-portfolio .pf-tile-co span{font-size:13px;font-weight:500;color:rgba(31,29,30,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-portfolio .pf-tile-t{min-width:0}
.ch-portfolio .pf-tile-t b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:20px;font-weight:600;line-height:1.15;color:#1F1D1E}
.ch-portfolio .pf-tile-t i{display:block;width:28px;height:3px;border-radius:999px;background:rgba(31,29,30,.25);margin-top:8px}
.ch-portfolio .pf-tile-l{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.12em;color:rgba(31,29,30,.4)}
.ch-portfolio .pf-corner{position:absolute;right:8px;bottom:8px;z-index:1;width:56px;height:56px;border-radius:12px;overflow:hidden;border:2px solid #fff;background:#fff;display:flex;align-items:center;justify-content:center}
.ch-portfolio .pf-corner i{position:absolute;inset:0;background:#FF5A5F66}
.ch-portfolio .pf-corner em{position:relative;width:24px;height:24px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:#1F1D1E}
.ch-portfolio .pf-corner em svg{width:10px;height:10px}

.ch-portfolio .pf-hoo{position:absolute;left:0;top:0;width:1920px;height:1008px;pointer-events:none}
.ch-portfolio .pf-hoo-v{position:absolute;left:0;top:0;width:100%;height:100%;background:rgb(246,245,243);opacity:1;transition:opacity .45s var(--zt-ease)}
.ch-portfolio .pf-hoo-t{position:absolute;left:816px;top:300px;width:288px;height:216px;opacity:0;transform:scale(1.62);
  transition:transform .5s var(--zt-ease),opacity .3s var(--zt-ease)}
.ch-portfolio .pf-hoo-t .pf-tile{width:100%;height:100%;box-shadow:0 26px 44px -26px rgba(31,29,30,.38),0 0 0 1px rgba(31,29,30,.06)}
.ch-portfolio.pf-hoo-in .pf-hoo-t{opacity:1;transform:scale(1.75)}
.ch-portfolio .pf-hoo-k{position:absolute;right:-12px;top:-12px;width:34px;height:34px;border-radius:50%;background:#1FA95C;color:#fff;display:grid;place-items:center;
  box-shadow:0 0 0 3px rgb(246,245,243);transform:scale(0);transition:transform .5s cubic-bezier(.2,.9,.3,1),opacity .25s var(--zt-ease)}
.ch-portfolio .pf-hoo-k svg{width:20px;height:20px;display:block}
.ch-portfolio .pf-hoo-k path{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .4s var(--zt-ease) .2s}
.ch-portfolio.pf-hoo-done .pf-hoo-k{transform:none}
.ch-portfolio.pf-hoo-done .pf-hoo-k path{stroke-dashoffset:0}
.ch-portfolio .pf-hoo-h{position:absolute;left:0;right:0;top:640px;margin:0;text-align:center;font:400 44px/1 var(--f-serif);letter-spacing:-.03em;color:#1F1D1E;opacity:0;transform:translateY(12px);
  transition:opacity .35s var(--zt-ease),transform .45s var(--zt-ease)}
.ch-portfolio.pf-hoo-done .pf-hoo-h{opacity:1;transform:none}
.ch-portfolio .pf-hoo-b{position:absolute;left:960px;top:408px;width:0;height:0}
.ch-portfolio .pf-hoo-b i{position:absolute;left:-7px;top:-3px;width:15px;height:7px;border-radius:2px;background:#FF5A5F;opacity:0}
.ch-portfolio .pf-hoo-b .pf-p1{background:#F2C94C}
.ch-portfolio .pf-hoo-b .pf-p2{background:#1F1D1E}
.ch-portfolio .pf-hoo-b .pf-p3{width:9px;height:9px;left:-4px;top:-4px;border-radius:50%;background:#FFB3B5}
.ch-portfolio.pf-hoo-done .pf-hoo-b i{animation:pf-hoo-pop 1.1s cubic-bezier(.16,.8,.3,1) var(--d) both}
@keyframes pf-hoo-pop{
  0%{transform:translate(0,0) rotate(0deg) scale(.3);opacity:0}
  9%{opacity:1}
  56%{transform:translate(calc(var(--x)*.92),calc(var(--y)*.96)) rotate(calc(var(--r)*.7)) scale(1);opacity:1}
  100%{transform:translate(var(--x),calc(var(--y) + 74px)) rotate(var(--r)) scale(.9);opacity:0}}
/* into its place: the veil lifts, the words and the tick go, the tile takes the slot's place and shape, and the slot's
   own copy waits unseen until it arrives */
.ch-portfolio.pf-hoo-on .pf-front{visibility:hidden}
.ch-portfolio.pf-hoo-go .pf-hoo-v{opacity:0}
.ch-portfolio.pf-hoo-go .pf-hoo-h{opacity:0;transform:translateY(-10px);transition-duration:.25s}
.ch-portfolio.pf-hoo-go .pf-hoo-k{opacity:0}
.ch-portfolio.pf-hoo-go .pf-hoo-t{transition:transform .6s var(--zt-ease),opacity .3s var(--zt-ease),left .6s var(--zt-ease),top .6s var(--zt-ease),width .6s var(--zt-ease),height .6s var(--zt-ease)}
.ch-portfolio.pf-hoo-go .pf-hoo-t .pf-tile{box-shadow:0 0 0 0 rgba(31,29,30,0);transition:box-shadow .45s var(--zt-ease)}
.ch-portfolio.pf-hoo-gone .pf-front{visibility:visible}
.ch-portfolio.pf-hoo-gone .pf-hoo{display:none}

/* ch/09-jobs.css */
/* 8b · the job portal step (b18). The designer's job portal, v82 (job-portal/handover/zero-job-portal-handover-v82),
   rebuilt at its real scale from its own computed CSS: the grey canvas with the white sheet, the top bar, the Jobs
   table with its select all bar, the Inbox with one thread per role. b18: her portfolio sits at the centre and goes
   out to every company around it; more roles join the foot of the list; Apply to all lands Applied on every row at
   once; Ramp writes back in the Inbox; the offer is a celebration in the portal's own light skin.
   Every class is jb- and every rule sits under .ch-jobs. Inter is the portal's own face (assets/fonts, loaded in JS). */
.ch-jobs{--jb-canvas:#F3F3F5;--jb-well:#F6F6F8;--jb-well2:#EDEDF0;--jb-line:#E7E7EB;--jb-line2:#D4D5DA;--jb-ink:#131417;--jb-ink2:#4E525C;--jb-ink3:#6A6F7A;--jb-ink4:#A6A9B2;
  --jb-e:cubic-bezier(.2,0,0,1);--jb-f:'JB Inter','Inter',-apple-system,'SF Pro Text','Helvetica Neue',system-ui,sans-serif;--jb-h:786px;
  background:var(--jb-canvas);color:var(--jb-ink2);font:400 14px/20px var(--jb-f);letter-spacing:-.006em;font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased;overflow:hidden}
.ch-jobs.jb-full{--jb-h:840px}
.ch-jobs *{box-sizing:border-box}
.ch-jobs button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;outline:0;margin:0;padding:0;cursor:pointer;text-align:left;-webkit-appearance:none;appearance:none}
.ch-jobs p,.ch-jobs h1,.ch-jobs h2,.ch-jobs h3{margin:0}
.ch-jobs svg{display:block;flex-shrink:0}
.ch-jobs .jb-ic{width:16px;height:16px}
.ch-jobs .jb-clip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-jobs .jb-grow{flex:1 1 0%;min-width:0}

/* the sheet: white, 28 radius, on the grey canvas */
.ch-jobs .jb-sheet{position:absolute;left:14px;top:14px;width:1572px;height:calc(var(--jb-h) - 28px);border-radius:28px;background:#fff;overflow:hidden;
  box-shadow:0 0 0 1px rgba(19,20,23,.05),0 1px 2px rgba(19,20,23,.04),0 40px 70px -50px rgba(19,20,23,.35)}

/* ---------- the top bar ---------- */
.ch-jobs .jb-top{position:relative;z-index:6;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:20px;height:60px;padding:0 24px}
.ch-jobs .jb-top-l{display:flex;align-items:center;gap:12px;min-width:0}
.ch-jobs .jb-logo{width:52px;height:auto;display:block;color:var(--jb-ink)}
.ch-jobs .jb-seg{display:flex;margin-left:8px;padding:3px;border-radius:99px;background:var(--jb-well2)}
.ch-jobs .jb-seg button{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:99px;font-size:12px;line-height:16px;color:var(--jb-ink2);transition:background-color .12s var(--jb-e),color .12s var(--jb-e)}
.ch-jobs .jb-seg button.jb-on{background:#fff;color:var(--jb-ink);box-shadow:0 0 0 1px var(--jb-line)}
.ch-jobs .jb-tabs{display:flex;gap:2px;padding:3px;border-radius:99px;background:var(--jb-well)}
.ch-jobs .jb-tabs button{position:relative;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:99px;color:var(--jb-ink3);white-space:nowrap;transition:background-color .12s var(--jb-e),color .12s var(--jb-e),box-shadow .12s var(--jb-e)}
.ch-jobs .jb-tabs button:hover{color:var(--jb-ink)}
.ch-jobs .jb-tabs button.jb-on{background:#fff;color:var(--jb-ink);box-shadow:0 0 0 1px var(--jb-line),0 6px 12px -10px rgba(19,20,23,.5)}
.ch-jobs .jb-dot{position:absolute;top:4px;right:4px;width:9px;height:9px;border-radius:99px;background:#B7F06A;box-shadow:0 0 0 2px #fff,inset 0 0 0 1px rgba(19,20,23,.25);transform:scale(0);transition:transform .3s cubic-bezier(.16,1,.3,1)}
.ch-jobs.jb-mail .jb-dot{transform:none}
.ch-jobs .jb-top-r{position:relative;grid-column:3;display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0}
.ch-jobs .jb-snd{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:99px;color:var(--jb-ink3)}
.ch-jobs .jb-snd svg{width:16px;height:16px}

.ch-jobs .jb-who-i{color:var(--jb-ink)}
.ch-jobs .jb-av{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:99px;background:var(--jb-well2);overflow:hidden;flex-shrink:0}
.ch-jobs .jb-av img{width:100%;height:100%;object-fit:cover;display:block}


/* ---------- pages ---------- */
.ch-jobs .jb-pg{position:absolute;left:0;right:0;top:60px;bottom:0;padding:8px 32px 0;visibility:hidden}
/* b17: nothing fades in or out; a page swaps at once and rises into place */
.ch-jobs .jb-pg.jb-on{visibility:visible;animation:jb-rise .32s var(--jb-e) both}

          if (pick) { pick.remove(); pick = null; }
          var d = RAMP.slot[0].split(' ');
          msg('<p class="jb-lbl">' + ic('calendar') + 'Interview booked</p><div class="jb-cal"><span class="jb-dt"><span class="jb-m">' + d[0] + '</span><b>' + d[1] + '</b><span class="jb-m">' + d[2] + '</span></span>' +
            '<span class="jb-grow"><span class="jb-ti">Interview with ' + RAMP.mgrFull + '</span><span class="jb-m">' + RAMP.slot[1] + ' · 45 minutes · Google Meet</span></span>' +
            '<span class="jb-bs">' + ic('calendar') + 'Add to calendar</span></div>', 'jb-bkd');
          S.chatSt.textContent = 'Ramp · Interview booked'; S.ramp.textContent = 'Interview booked for ' + RAMP.slot[0];
        });
      }
      /* "you take it": the call happens */
      function met() { if (did.mt) return; did.mt = 1; booked(); msg('<span>' + ic('video') + 'Call with ' + RAMP.mgr + ' · 45 minutes · done</span>', 'jb-sys jb-done'); S.chatSt.textContent = 'Ramp · Deciding'; }
      /* "and you get the offer": the offer letter arrives in the thread */
      function offered() {
        if (did.of) return; did.of = 1; met();
        msg(co + '<div><p>We would love to have you on the team, ' + who + '. The offer is ' + RAMP.amount + ' a year, starting ' + RAMP.start + '.</p>' +
          '<div class="jb-file"><span class="jb-fi">' + ic('file-text') + '</span><span class="jb-grow"><span class="jb-ti">Offer letter</span><span class="jb-m">PDF · 2 pages</span></span>' +
          '<span class="jb-fb">' + ic('eye') + '</span><span class="jb-fb">' + ic('download') + '</span></div></div>', 'jb-them');
        api.sfx('good');
        S.chatSt.textContent = 'Ramp · Offer'; S.ramp.textContent = 'I attached the offer letter';
      }
      /* "And you're hired": the offer itself, one confetti burst */
      function hired() { if (did.hd) return; did.hd = 1; offered(); page('offer'); api.sfx('good'); api.later(140, confetti); }
      S.all.addEventListener('click', function () {
        if (applied || !did.sel) return;
        applied = true; api.cursor.hide(); if (ring) { ring.clear(); ring = null; }
        applyAll();
        if (onApply) onApply();
      });
      await api.say('H2', { onSeg: function (i, text) { if (i === 0) api.later(250, selectAll); } });
      selectAll();
      api.cursor.hide();
      if (!applied) ring = api.ring(S.all, { pulse: true, pad: 5, radius: 12 });
      await api.turn({ badge: 'Try this', text: 'Click <b>Apply to all</b>', tip: 'Click <b>Apply to all</b>', target: S.tipAt, pad: 0, settle: 560,
        until: function (done) { if (applied) done(); else onApply = done; },
        autoDelay: 300, auto: function () { return api.click(S.all, { ms: 420 }); } });
      api.clearRings(); api.cursor.hide();

      /* ---------- H3B · each sentence on its own step, each step on the word that names it ---------- */
      /* "We send your application." plays over the Applied list, which landed with the click */
      /* when each phrase starts in the take (ms, read off its pauses): [sentence, ms, step] */
      var cues = [[1, 1350, inbox], [1, 1760, wrote], [1, 2330, replied], [1, 3370, asked],
                  [2, 4560, booked], [2, 5700, met], [2, 6280, offered], [3, 7360, hired]];
      var segT = api.plan('H3B').segs.map(function (g) { return g.t * 1000; });
      await api.say('H3B', { onSeg: function (i) {
        cues.forEach(function (c) { if (c[0] === i) api.later(Math.max(0, c[1] - segT[i] - 60), c[2]); });
      } });
      hired();

      /* ---------- E1 · on the offer ---------- */
      await api.say('E1');
    }
  });
})();

</script>
