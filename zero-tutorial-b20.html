/* ================= the landing (KickoffMeeting/index.tsx, LandingBackdrop, JoinCtaButton) ================= */
.ch-kickoff .ko-landing{position:absolute;left:0;top:0;width:1600px;height:786px;z-index:40;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .25s ease-out}
.ch-kickoff.ko-l-on .ko-landing{opacity:1}
/* the ground: the scenario's picture, blurred 42px and scaled past the frame, under a warm wash */
.ch-kickoff .ko-l-bd{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;background:#1B1815}
.ch-kickoff .ko-l-bd img{position:absolute;left:0;top:0;width:100%;height:100%;display:block;object-fit:cover;transform:scale(1.1);filter:blur(42px);user-select:none;-webkit-user-drag:none}
.ch-kickoff .ko-l-bd i{position:absolute;left:0;top:0;width:100%;height:100%;background:radial-gradient(120% 90% at 50% 30%,rgba(27,24,21,.32),rgba(15,13,11,.72) 100%)}
.ch-kickoff .ko-l-back{position:absolute;left:24px;top:24px;z-index:20;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.1);
  border:1px solid transparent;box-shadow:0 2px 8px rgba(0,0,0,.04);display:flex;align-items:center;justify-content:center;color:#fff}
.ch-kickoff .ko-l-back svg{width:24px;height:24px}
/* the app's card (KickoffLandingCard.tsx): 760 wide, radius 32. b17: it holds the whole brief, centred. 64 of air above it
   and 92 under Join Now, which leaves room for the white key below the button */
.ch-kickoff .ko-l-card{position:relative;z-index:10;width:760px;border-radius:32px;background:#fff;padding:64px 64px 92px;box-shadow:0 40px 100px -24px rgba(0,0,0,.5);
  opacity:0;transform:translateY(10px) scale(.96);transition:opacity .5s var(--ko-apple),transform .5s var(--ko-apple)}
.ch-kickoff.ko-l-on .ko-l-card{opacity:1;transform:none}
.ch-kickoff .ko-l-in{display:flex;flex-direction:column;align-items:center;transition:opacity .08s ease-out}
/* each line rises 14px, 80ms after the one above (landingRise) */
.ch-kickoff .ko-rise{opacity:0;transform:translateY(14px);transition:opacity .5s var(--ko-apple) var(--d,0s),transform .5s var(--ko-apple) var(--d,0s)}
.ch-kickoff.ko-l-on .ko-rise{opacity:1;transform:none}
/* this scenario: the company as one small line, directly above its title */
.ch-kickoff .ko-l-pair{display:flex;flex-direction:column;align-items:center;gap:10px}
.ch-kickoff .ko-l-co{margin:0;display:flex;align-items:center;gap:7px;font:500 15px/18.2px var(--ko-sys);color:#2A2118}
.ch-kickoff .ko-l-co img{display:block;width:17px;height:17px}
.ch-kickoff .ko-l-h{margin:0;font:400 40px/1.18 var(--f-serif);letter-spacing:-.01em;color:#2A2118;text-align:center;white-space:nowrap}
/* the brief's meta: the app's Clock and Gauge at 14, the duration in the mono it is set in, the level in the sans */
.ch-kickoff .ko-l-meta{margin-top:16px;display:flex;align-items:center;gap:18px}
.ch-kickoff .ko-l-meta span{display:flex;align-items:center;gap:6px;font:500 13px/1 var(--ko-sys);color:rgba(31,29,30,.55)}
.ch-kickoff .ko-l-meta span.ko-l-dur{font:400 13px/1 var(--f-mono)}
.ch-kickoff .ko-l-meta svg{width:14px;height:14px;color:rgba(31,29,30,.38)}
/* the description: the card's one paragraph, under the title like a lede */
.ch-kickoff .ko-l-desc{margin:18px 0 0;max-width:500px;font:400 14px/1.6 var(--ko-sys);color:rgba(31,29,30,.6);text-align:center;text-wrap:balance}
/* the tools, then the skills: one centred row each, as wide as its chips, so a ring round a row hugs it */
.ch-kickoff .ko-l-chips{display:flex;align-items:center;justify-content:center;gap:7px}
.ch-kickoff .ko-l-tools{margin-top:28px}
.ch-kickoff .ko-l-skills{margin-top:12px}
/* the dock card's own chip (Chips.tsx), drawn on white: the time pill's ink tints, 13px, 6 by 11, the tool's real logo at 16 */
.ch-kickoff .ko-l-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;background:rgba(31,29,30,.035);box-shadow:inset 0 0 0 1px rgba(31,29,30,.09);
  font:400 13px/1.25 var(--ko-sys);color:rgba(31,29,30,.78);white-space:nowrap}
.ch-kickoff .ko-l-tool{padding-left:7px}
.ch-kickoff .ko-l-chip img{flex:none;display:block;width:16px;height:16px;border-radius:4px;object-fit:contain}
/* the manager: the card's own face (the faint concentric ring, the warm inner light) at 40, the name over the role */
.ch-kickoff .ko-l-who{margin-top:28px;display:flex;align-items:center;gap:12px;padding-right:4px}
.ch-kickoff .ko-l-av{position:relative;flex:none;width:40px;height:40px}
.ch-kickoff .ko-l-av span{position:absolute;left:-4px;top:-4px;width:48px;height:48px;box-sizing:border-box;border-radius:50%;border:1px solid rgba(0,0,0,.06)}
.ch-kickoff .ko-l-av img{position:relative;display:block;width:40px;height:40px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px rgba(0,0,0,.05)}
.ch-kickoff .ko-l-av i{position:absolute;left:0;top:0;width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 7px rgba(232,228,223,.6),0 0 1px 2px rgba(232,228,223,.5);pointer-events:none}
.ch-kickoff .ko-l-nm{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.ch-kickoff .ko-l-nm b{font:500 15px/1.2 var(--ko-sys);color:#2A2118}
.ch-kickoff .ko-l-nm i{font:400 13px/1.2 var(--ko-sys);font-style:normal;color:rgba(31,29,30,.45)}
.ch-kickoff .ko-l-cta{margin-top:36px;display:flex;flex-direction:column;align-items:center}
.ch-kickoff .ko-l-btn{position:relative;display:flex;align-items:center;justify-content:center}
/* the one place the app lets green glow: a breathing light behind the commit button */
.ch-kickoff .ko-glow{position:absolute;left:-12px;top:-12px;right:-12px;bottom:-12px;border-radius:9999px;pointer-events:none;filter:blur(16px);
  background:radial-gradient(closest-side,rgba(126,215,145,.55),rgba(126,215,145,.18) 62%,rgba(126,215,145,0) 100%);animation:ko-glow 2.8s var(--ko-apple) infinite}
@keyframes ko-glow{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.18);opacity:.9}}
/* the app's ink pill. b15: the learner presses it, so it is a real button: it lifts on hover, sets down on the press, and shows
   a ring on keyboard focus. the card's 92 of air under it leave room for the white key below it */
.ch-kickoff .ko-join{appearance:none;border:0;margin:0;position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:19px 48px;border-radius:999px;background:#1F1D1E;
  box-shadow:0 10px 28px -8px rgba(31,29,30,.5),0 3px 8px -3px rgba(31,29,30,.35);cursor:pointer;transition:transform .16s ease-out,background-color .16s ease-out}
.ch-kickoff .ko-join i{position:absolute;left:0;top:0;width:100%;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0))}
.ch-kickoff .ko-join span{position:relative;z-index:1;font:500 16px/1 var(--ko-sys);letter-spacing:-.01em;color:#fff}
.ch-kickoff .ko-join:hover{background:#2E2B2C;transform:translateY(-1px)}
.ch-kickoff .ko-join:active,.ch-kickoff .ko-join.ko-down{transform:scale(.95)}
.ch-kickoff .ko-join:focus-visible{outline:2px solid rgba(31,29,30,.55);outline-offset:3px}


/* Join (b18): no white screen, and the card's words are never seen over the slide's. The meeting is drawn under the landing
   from the press; the card lifts away whole (up and out in 340ms, gathering speed, like a curtain going up) while the
   blurred ground gives way in 260ms, so the meeting is there the moment the card leaves */
.ch-kickoff.ko-joining .ko-l-back{display:none}
.ch-kickoff.ko-joining .ko-l-card{transform:translateY(-820px);transition:transform .34s cubic-bezier(.5,0,.75,0)}
.ch-kickoff .ko-l-bd{transition:opacity .26s ease-out}
.ch-kickoff.ko-reveal .ko-l-bd{opacity:0}
.ch-kickoff.ko-reveal .ko-landing{pointer-events:none}
.ch-kickoff.ko-met .ko-landing{visibility:hidden}
/* Navid flies into his tile in 450ms (the tour's seat change is 760ms), so he is in it as the meeting comes up */
#zt-root:has(.ch-kickoff.ko-joining:not(.ko-met)) .zt-guide{transition-duration:.45s}
/* the moment Join Now is pressed, the turn's white key and its ring are gone at once, so they never hang over the growing card */
#zt-root:has(.ch-kickoff.ko-joining:not(.ko-met)) .zt-tip,#zt-root:has(.ch-kickoff.ko-joining:not(.ko-met)) #zt-ink{opacity:0;transition:none}

/* ================= the meeting (b16). The slide fills the stage, 30 from every edge of the window: the deck is the left column
   (1045.38 x 726 at 30, 30) and the notes the right one (464.62 x 726 at 1105.38, 30). One radius, 24 ================= */
.ch-kickoff .ko-meet{position:absolute;left:0;top:0;width:1600px;height:786px;background:#F2F0ED;visibility:hidden}
/* it is drawn from the press of Join Now, under the landing, so it is whole when the landing gives way (never seen half made) */
.ch-kickoff.ko-joining .ko-meet{visibility:visible}

/* ---- the deck: the manager shares his screen ---- */
.ch-kickoff .ko-player{position:absolute;left:30px;top:30px;width:1045.38px;height:726px;border-radius:24px;overflow:hidden;background:#222;
  box-shadow:0 1px 3px 0 rgba(0,0,0,.1),0 1px 2px -1px rgba(0,0,0,.1)}
/* the deck. The template's own tokens for this scenario: ground #222, ink #fff, label #B3B3B3, tile #333, brand #FF385C, at the
   deck's own sizes, weights and tracking (-.04em / -.05em). b15: set in the tour's own sans, so the chapter asks for no font.
   The stage is the template's 1280 wide reference, as tall as the column now that the top bar is gone */
.ch-kickoff .ko-stage{position:absolute;left:0;top:0;width:1280px;height:888.93px;transform:scale(.816703);transform-origin:0 0;overflow:hidden;background:#222;color:#fff;
  font-family:var(--f-sans);--q:6.68px;--qw:10.4538px;--qh:6.68px}
/* b17: a slide changes with a cut, as a shared deck does, so two slides are never seen through each other; the new slide's
   lines rise in on their own */
.ch-kickoff .ko-panel{position:absolute;left:0;top:0;width:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:clamp(40px,calc(7*var(--q)),84px);gap:clamp(14px,calc(2.4*var(--q)),30px);overflow:hidden;opacity:0}
.ch-kickoff .ko-panel.ko-act{opacity:1}
.ch-kickoff .ko-panel>*{max-width:100%;overflow-wrap:anywhere}
.ch-kickoff .ko-panel.ko-hero{background:linear-gradient(135deg,#FF385C 0%,#BF2A45 100%)}
/* the brand's mark, top left of every slide */
.ch-kickoff .ko-wm{position:absolute;top:clamp(26px,calc(5*var(--q)),48px);left:clamp(30px,calc(5*var(--q)),58px);display:inline-flex;align-items:center;gap:7px;height:clamp(30px,calc(4.5*var(--q)),56px);line-height:1;white-space:nowrap}
.ch-kickoff .ko-wm img{display:block;height:100%;width:auto;filter:brightness(0) invert(1)}
.ch-kickoff .ko-wm b{font:800 21px/1 var(--f-sans);letter-spacing:-.04em;color:#fff}
.ch-kickoff .ko-hero .ko-wm{height:clamp(38px,calc(5.5*var(--q)),68px)}
.ch-kickoff .ko-hero .ko-wm b{font-size:27px}
/* lines rise 22px, 85ms apart. A number lands from 1.22 with a little overshoot. (the deck's setPanel) */
.ch-kickoff .ko-u{opacity:0;transform:translateY(22px);transition:opacity 0s .22s,transform 0s .22s}
.ch-kickoff .ko-num.ko-u{transform:translateY(14px) scale(1.22)}
.ch-kickoff .ko-act .ko-u{opacity:1;transform:none;transition:opacity .58s cubic-bezier(.165,.84,.44,1) calc(.06s + var(--i,0)*.085s),transform .58s cubic-bezier(.165,.84,.44,1) calc(.06s + var(--i,0)*.085s)}
.ch-kickoff .ko-act .ko-num.ko-u{transition:opacity .68s cubic-bezier(.34,1.5,.64,1) .1s,transform .68s cubic-bezier(.34,1.5,.64,1) .1s}
.ch-kickoff .ko-st{font-weight:800;font-size:clamp(30px,min(calc(6.4*var(--qw)),calc(11.4*var(--qh))),88px);letter-spacing:-.04em;line-height:1.06;max-width:min(1120px,94%);color:#fff}
.ch-kickoff .ko-st.ko-st-s{font-size:clamp(20px,calc(4*var(--q)),40px)}
.ch-kickoff .ko-num{font-weight:800;font-size:clamp(56px,min(calc(15.6*var(--qw)),calc(27.8*var(--qh))),230px);letter-spacing:-.05em;line-height:.84;font-variant-numeric:tabular-nums;color:#fff}
.ch-kickoff .ko-cover{max-width:min(1140px,94%);display:flex;flex-direction:column;align-items:center;gap:clamp(14px,calc(2.6*var(--q)),28px)}
.ch-kickoff .ko-big{font-weight:800;font-size:clamp(40px,min(calc(9*var(--qw)),calc(16*var(--qh))),128px);letter-spacing:-.035em;line-height:.96;color:#fff}
.ch-kickoff .ko-sub{font-size:clamp(16px,calc(4*var(--q)),34px);font-weight:600;color:rgba(255,255,255,.85)}
.ch-kickoff .ko-flow{display:flex;align-items:center;gap:clamp(18px,calc(4.5*var(--q)),48px);flex-wrap:wrap;justify-content:center}
.ch-kickoff .ko-fnum{font-weight:800;font-size:clamp(44px,min(calc(11.7*var(--qw)),calc(20.8*var(--qh))),170px);letter-spacing:-.04em;line-height:.85;font-variant-numeric:tabular-nums}
.ch-kickoff .ko-fnum.ko-good{color:#FF385C}
.ch-kickoff .ko-fop{display:flex;flex-direction:column;align-items:center;gap:.3em;font-size:16px}
.ch-kickoff .ko-pill{background:#333;border:1px solid rgba(255,255,255,.15);color:#fff;font-weight:800;font-size:clamp(13px,calc(2.4*var(--q)),23px);padding:.35em .9em;border-radius:999px}
.ch-kickoff .ko-ar{font-size:clamp(22px,calc(5*var(--q)),46px);color:#B3B3B3;line-height:1.2}
/* the idle progress strip: one bar per chapter of the meeting, flush with the bottom of the deck (PlayerBar) */
.ch-kickoff .ko-strip{position:absolute;z-index:2;left:45px;right:45px;bottom:0;height:6px;display:flex;align-items:center;gap:3px;pointer-events:none}
.ch-kickoff .ko-strip i{position:relative;height:6px;min-width:0;border-radius:52px;overflow:hidden;background:rgba(255,255,255,.25)}
.ch-kickoff .ko-strip b{position:absolute;left:0;top:0;height:100%;width:0;border-radius:52px;background:#fff}
.ch-kickoff .ko-strip i:first-child b{width:100%}
.ch-kickoff.ko-reveal .ko-strip i:nth-child(2) b{width:62%;transition:width 40s linear}

/* ---- the presenter: his face in a small round bubble at the bottom left of the slide, as a screen share shows it.
   132 across, 24 in from the slide's edges. The guide takes the seat; the seat's shadow lifts it off the slide ---- */
.ch-kickoff .ko-slot{position:absolute;left:54px;top:600px;width:132px;height:132px;border-radius:50%;box-shadow:0 10px 28px -6px rgba(0,0,0,0);transition:box-shadow .25s ease-out}
/* the seat is empty until he lands in it (no dark disc waiting), and its shadow comes with him */
.ch-kickoff.ko-live .ko-slot{box-shadow:0 10px 28px -6px rgba(0,0,0,.55)}

/* ---- Notes: b4's panel (a quiet band with its glyph, the section, the field with its Enter key, the example card),
   with his words: "Notes", "Problem", "Take a note". Its band is the meeting's own paper, so a hairline drawn over the panel's
   edge keeps the band and the white one panel ---- */
.ch-kickoff .ko-notes{position:absolute;left:1105.38px;top:30px;width:464.62px;height:726px;border-radius:24px;background:var(--ko-card);
  overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 3px 0 rgba(0,0,0,.06);
  outline:1px solid rgba(31,29,30,.07);outline-offset:-1px}
.ch-kickoff .ko-n-head{flex:none;height:54px;padding:0 24px;display:flex;align-items:center;gap:10px;background:#f1f0ee;
  font:500 15px/1 var(--f-sans);color:#2a2118}
/* b17: the glyph is grey ("make the meeting notes icon also gray"); the yellow stays where it was, on the points */
.ch-kickoff .ko-n-head svg{width:18px;height:18px;display:block;flex:none;color:rgba(31,29,30,.5)}
.ch-kickoff .ko-n-body{flex:1;min-height:0;display:flex;flex-direction:column;padding:24px 24px 20px}
.ch-kickoff .ko-n-body h3{flex:none;margin:0 0 16px;font:600 16.5px/1.2 var(--f-sans);color:var(--ko-t1)}
.ch-kickoff .ko-list{flex:0 1 auto;min-height:0;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;overflow-y:auto;scrollbar-width:none}
.ch-kickoff .ko-list::-webkit-scrollbar{display:none}
.ch-kickoff .ko-list:not(:empty){margin-bottom:16px}
/* a saved note: its tick, its words. Green only when the notes really carry the numbers */
.ch-kickoff .ko-note{position:relative;flex:none;display:flex;align-items:flex-start;gap:11px;animation:ko-up .32s var(--ko-apple) both}
.ch-kickoff .ko-note svg{flex:none;width:21px;height:21px;margin-top:1px;display:block;color:rgba(31,29,30,.38);animation:ko-pop .3s cubic-bezier(.34,1.56,.64,1) both}
.ch-kickoff .ko-note svg path{stroke-dasharray:20;animation:ko-draw .38s ease-out .1s both}
.ch-kickoff .ko-note div{min-width:0}
.ch-kickoff .ko-note p{margin:0;font:400 15.5px/1.5 var(--f-sans);color:#2a2118;overflow-wrap:anywhere}
.ch-kickoff .ko-note.ko-good svg{color:#49BA61}
/* what the notes earned, said once under them */
.ch-kickoff .ko-got{flex:none;margin:-4px 0 0 32px;font:400 13.5px/1.38 var(--f-sans);color:var(--ko-t2);animation:ko-up .32s var(--ko-apple) .1s both}
.ch-kickoff .ko-got.ko-good{color:var(--ko-ok)}
@keyframes ko-up{from{transform:translateY(6px)}}
@keyframes ko-pop{from{transform:scale(.35)}}
@keyframes ko-draw{from{stroke-dashoffset:20}}
/* the next line of the notes: where the learner writes. Two lines tall, and it grows (220ms) to hold Navid's three */
.ch-kickoff .ko-field{position:relative;flex:none}
.ch-kickoff .ko-in{appearance:none;display:block;width:100%;height:72px;min-height:72px;margin:0;border:0;outline:0;resize:none;overflow:hidden;border-radius:16px;padding:13px 78px 13px 38px;
  background:var(--ko-well);box-shadow:inset 0 0 0 1px var(--ko-line);color:var(--ko-t1);font:400 16px/23px var(--f-sans);letter-spacing:-.01em;
  caret-color:#49BA61;transition:box-shadow .2s var(--ko-apple),height .22s var(--ko-apple)}
.ch-kickoff .ko-in::placeholder{color:rgba(31,29,30,.4)}
.ch-kickoff .ko-in:focus{box-shadow:inset 0 0 0 1.5px rgba(31,29,30,.44)}
.ch-kickoff .ko-field i{position:absolute;left:18px;top:21px;width:7px;height:7px;border-radius:50%;background:rgba(31,29,30,.5);pointer-events:none}
.ch-kickoff .ko-field kbd{position:absolute;right:12px;top:14px;font:500 12px/1 var(--f-sans);color:rgba(31,29,30,.62);
  border:1px solid rgba(31,29,30,.16);border-bottom-width:2px;border-radius:7px;padding:5px 8px 6px;background:#fff;pointer-events:none;
  transition:background-color .2s var(--ko-apple),color .2s var(--ko-apple),border-color .2s var(--ko-apple)}
/* the notes are in: the Enter key is the one thing left to press, so it turns to ink */
.ch-kickoff.ko-filled .ko-field kbd{background:#1f1d1e;border-color:#1f1d1e;color:#fff}
/* the example to take. It is there from the first moment of the turn, and one click fills it in */
.ch-kickoff .ko-help{position:relative;flex:none;margin-top:12px}
.ch-kickoff .ko-hint{appearance:none;display:block;width:100%;margin:0;border:0;cursor:pointer;text-align:left;padding:14px 16px 15px;border-radius:16px;
  background:var(--ko-well);box-shadow:inset 0 0 0 1px var(--ko-line);opacity:0;transform:translateY(8px);pointer-events:none;
  transition:opacity .3s var(--ko-apple),transform .4s var(--ko-apple),box-shadow .2s var(--ko-apple)}
.ch-kickoff .ko-hint>span{display:inline-block;height:24px;padding:0 10px;border-radius:999px;background:#1f1d1e;color:#fff;font:600 12.5px/24px var(--f-sans);letter-spacing:-.005em}
.ch-kickoff .ko-hint ul{list-style:none;margin:11px 0 0;padding:0;display:flex;flex-direction:column;gap:3px}
.ch-kickoff .ko-hint li{font:500 15px/1.42 var(--f-sans);letter-spacing:-.012em;color:var(--ko-t1)}
.ch-kickoff .ko-hint i{display:block;margin-top:9px;font:400 13px/1.4 var(--f-sans);font-style:normal;letter-spacing:-.005em;color:var(--ko-t2);transition:color .2s}
.ch-kickoff .ko-hint:hover{box-shadow:inset 0 0 0 1.5px rgba(31,29,30,.4)}
.ch-kickoff.ko-hinting .ko-hint{opacity:1;transform:none;pointer-events:auto}
.ch-kickoff.ko-short .ko-hint i{color:#8a5a08}
/* the notes are saved: the field and the example step aside, the notes stand alone */
.ch-kickoff.ko-saved .ko-field,.ch-kickoff.ko-saved .ko-help{display:none}

/* once the learner has pressed Join Now, the turn's pill steps aside at once, so his next line comes in clean */
#zt-root:has(.ch-kickoff.ko-pilloff) .zt-turn{opacity:0;transition:opacity .15s ease-out}

/* the pop-up opens with the card already in it (b18: no empty dark window first). The tour's screens wait 160ms and then
   fade in; this one is set in place at once, inside the window as the window itself opens. Its exit stays the tour's */
.ch-kickoff.zt-ch:not(.zt-exit){transition:none}

/* ch/04-pou.css */
/* 4 · the conversation with your manager. b15 is b4's screen again, the one Navid picked: the white understanding pill
   with four segments, his voice notes in one centred thread, one "Try saying this" card, one mic. No meeting notes.
   Dark tokens from the app. Drawn inside the pop-up at 90%, so the sentence to read is set large.
   Added since: the mic's X and send key (b15); one transcript only, Skip in place of typing, no rank chip (b16);
   the card as a real transcript, word by word, and the plain no voice state (b17). */
.ch-pou{background:#1E1E1E;color:#f2f1ee;font-family:var(--f-sans);letter-spacing:-.01em;
  --pu-card:#262626;--pu-soft:#282828;--pu-bubble:#333333;--pu-line:rgba(255,255,255,.075);--pu-line2:rgba(255,255,255,.04);
  --pu-tx:#f2f1ee;--pu-tx2:#a5a29b;--pu-tx3:#6d6a63;--pu-tx4:#4a4844;--pu-ok:#3fb968}

/* ---------- the understanding pill: white, three checks, the brain greens when full ---------- */
.ch-pou .pu-top{position:absolute;left:0;right:0;top:26px;display:flex;justify-content:center}
.ch-pou .pu-pill{display:inline-flex;align-items:center;gap:12px;height:40px;padding:0 13px 0 17px;border-radius:999px;background:#fff;color:#1f1d1e;white-space:nowrap;
  box-shadow:0 16px 30px -8px rgba(0,0,0,.42),0 3px 10px rgba(0,0,0,.22)}
.ch-pou .pu-pill-l{font:600 13.5px/1 var(--f-sans);letter-spacing:-.01em}
.ch-pou .pu-meter{display:inline-flex;gap:5px}
.ch-pou .pu-meter i{width:26px;height:6px;border-radius:99px;background:rgba(31,29,30,.13);
  transition:background .5s var(--zt-ease),transform .45s cubic-bezier(.34,1.56,.64,1)}
.ch-pou .pu-meter i.pu-on{background:linear-gradient(90deg,#49ba61,#aff4be)}
.ch-pou .pu-meter i.pu-pop{transform:scaleY(1.7)}
.ch-pou .pu-brain{display:block;width:21px;height:21px;color:#9a9896;transition:color .48s var(--zt-ease)}
.ch-pou .pu-pill.pu-full .pu-brain{color:#49ba61}
.ch-pou .pu-pill.pu-full{animation:pou-full .9s var(--zt-ease) 1}
@keyframes pou-full{0%{transform:scale(1)}38%{transform:scale(1.045)}100%{transform:scale(1)}}

/* ---------- the thread: one 600px column, voice notes only ---------- */
.ch-pou .pu-thread{position:absolute;left:500px;top:84px;width:600px;height:452px;padding:0 28px;display:flex;flex-direction:column;gap:20px;
  overflow-y:auto;scrollbar-width:none}
.ch-pou .pu-thread::-webkit-scrollbar{display:none}
.ch-pou .pu-thread>*{flex:0 0 auto}
.ch-pou.pu-told .pu-thread{height:516px}
.ch-pou .pu-who{display:flex;align-items:baseline;gap:8px;height:16px;margin:0 0 -10px 51px;white-space:nowrap;
  opacity:0;transform:translateY(4px);transition:opacity .4s var(--zt-ease),transform .5s var(--zt-ease)}
.ch-pou.pu-seated .pu-who{opacity:1;transform:none}
.ch-pou .pu-who b{font:600 13px/16px var(--f-sans);color:var(--pu-tx)}
.ch-pou .pu-who span{font:400 12.5px/16px var(--f-sans);color:var(--pu-tx3)}

.ch-pou .pu-note{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.ch-pou .pu-note.pu-me{align-items:flex-end;transition:opacity .3s var(--zt-ease)}
.ch-pou .pu-note.pu-me.pu-miss{opacity:.5}
.ch-pou .pu-row{display:flex;align-items:center;gap:11px}
/* Navid's seat. The slot never animates, so the engine can always measure it. */
.ch-pou .pu-avw{position:relative;width:40px;height:40px;flex:0 0 40px}
.ch-pou .pu-slot{position:absolute;inset:0;border-radius:50%;background:var(--pu-card);box-shadow:inset 0 0 0 1px var(--pu-line)}
.ch-pou .pu-slot::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none}
.ch-pou.pu-seated .pu-slot::after{animation:pou-land .8s var(--zt-ease) 1}
@keyframes pou-land{from{box-shadow:0 0 0 0 rgba(73,186,97,.6)}to{box-shadow:0 0 0 13px rgba(73,186,97,0)}}

.ch-pou .pu-card,.ch-pou .pu-tr{opacity:0;transform:translateY(8px);filter:blur(10px);
  transition:opacity .5s var(--zt-ease),transform .6s var(--zt-ease),filter .5s var(--zt-ease)}
.ch-pou .pu-note.pu-on .pu-card,.ch-pou .pu-note.pu-on .pu-tr{opacity:1;transform:none;filter:none}
.ch-pou .pu-card{display:flex;align-items:center;gap:13px;height:54px;padding:0 16px 0 7px;border-radius:26px;background:var(--pu-soft);box-shadow:inset 0 0 0 1px var(--pu-line2)}
.ch-pou .pu-me .pu-card{background:var(--pu-bubble);box-shadow:none}
.ch-pou.pu-seated .pu-note:first-of-type .pu-card{animation:pou-wake .55s var(--zt-ease) 1}
@keyframes pou-wake{40%{transform:scale(1.035)}100%{transform:none}}
.ch-pou .pu-play{width:40px;height:40px;flex:0 0 40px;border-radius:99px;background:var(--pu-card);box-shadow:inset 0 0 0 1px var(--pu-line);display:grid;place-items:center;color:var(--pu-tx)}
.ch-pou .pu-play svg{display:block;width:16px;height:16px}
.ch-pou .pu-play .pu-i-pause{display:none}
.ch-pou .pu-note.pu-playing .pu-play .pu-i-play{display:none}
.ch-pou .pu-note.pu-playing .pu-play .pu-i-pause{display:block}
.ch-pou .pu-wave{display:flex;align-items:center;gap:2.5px;height:26px}
.ch-pou .pu-wave i{width:2.5px;border-radius:9px;background:var(--pu-tx4);flex:0 0 auto;transition:background .12s linear}
.ch-pou .pu-wave i.pu-lit{background:var(--pu-tx)}
.ch-pou .pu-me .pu-wave i{background:rgba(255,255,255,.2);transition:background .3s linear,height .14s linear}
.ch-pou .pu-me .pu-wave i.pu-lit{background:rgba(255,255,255,.38)}
.ch-pou .pu-me.pu-rec .pu-wave i.pu-lit{background:var(--pu-tx)}
.ch-pou .pu-note.pu-playing .pu-wave i{animation:pou-wave 1s ease-in-out infinite alternate}
@keyframes pou-wave{from{transform:scaleY(.42)}to{transform:scaleY(1)}}
.ch-pou .pu-dur{flex:0 0 auto;min-width:27px;font:400 11px/1 var(--f-mono);color:var(--pu-tx3);font-variant-numeric:tabular-nums}
/* while the learner is recording, the play button is a record light */
.ch-pou .pu-me.pu-rec .pu-play svg{display:none}
.ch-pou .pu-me.pu-rec .pu-play::after{content:"";width:10px;height:10px;border-radius:50%;background:#ff6a4d;animation:pou-blink 1s ease-in-out infinite alternate}
@keyframes pou-blink{from{opacity:.35}to{opacity:1}}

/* the transcript: real voice-note chrome, closed until asked for */
.ch-pou .pu-tr{appearance:none;border:0;background:none;display:inline-flex;align-items:center;gap:6px;margin-left:51px;padding:2px 4px;border-radius:6px;cursor:pointer;
  font:700 10px/12px var(--f-mono);letter-spacing:1.5px;text-transform:uppercase;color:var(--pu-tx3)}
.ch-pou .pu-tr:hover{color:var(--pu-tx2)}
.ch-pou .pu-tr svg{width:13px;height:13px;transition:transform .24s var(--zt-ease)}
.ch-pou .pu-note.pu-open .pu-tr svg{transform:rotate(180deg)}
.ch-pou .pu-trb{display:none;margin-left:55px;max-width:440px;font:400 13px/1.6 var(--f-sans);color:var(--pu-tx2)}
.ch-pou .pu-note.pu-open .pu-trb{display:block;animation:pou-in .4s var(--zt-ease) 1}
@keyframes pou-in{from{opacity:0;transform:translateY(6px);filter:blur(6px)}}

/* ---------- what to say, and the one mic ---------- */
.ch-pou .pu-bottom{position:absolute;left:380px;top:476px;width:840px;height:280px}
/* "Try saying this": the sentence, big enough to read aloud. Its four facts light as they are heard.
   Anchored by its bottom edge, so a longer sentence grows upward and never pushes the mic. */
.ch-pou .pu-try{position:absolute;left:0;right:0;bottom:164px;padding:16px 26px 19px;border-radius:24px;background:var(--pu-card);box-shadow:inset 0 0 0 1px var(--pu-line);
  opacity:0;transform:translateY(12px);filter:blur(8px);pointer-events:none;
  transition:opacity .45s var(--zt-ease),transform .6s var(--zt-ease),filter .45s var(--zt-ease)}
.ch-pou.pu-ask .pu-try{opacity:1;transform:none;filter:none}
.ch-pou.pu-told .pu-try{opacity:0;transform:translateY(8px) scale(.985);filter:blur(8px);transition-duration:.3s,.4s,.3s}
.ch-pou .pu-try-l{display:inline-block;height:26px;padding:0 11px;border-radius:999px;background:#f4f3f1;color:#161616;font:600 13px/26px var(--f-sans);letter-spacing:-.005em}
.ch-pou .pu-try-t{margin:9px 0 0;font:500 24px/34px var(--f-sans);letter-spacing:-.015em;color:var(--pu-tx);text-wrap:balance}
.ch-pou .pu-f{display:inline-block;padding:0 7px;margin:0 -4px;border-radius:9px;background:rgba(255,255,255,.085);
  transition:background .35s var(--zt-ease),box-shadow .35s var(--zt-ease),color .35s var(--zt-ease)}
.ch-pou .pu-f.pu-hit{background:rgba(63,185,104,.24);box-shadow:inset 0 0 0 1px rgba(63,185,104,.55);color:#fff;animation:pou-ping .5s var(--zt-ease) 1}
@keyframes pou-ping{40%{transform:scale(1.06)}100%{transform:none}}

/* b17: the card is the transcript. While the learner talks, the words not said yet step back and each lights as the
   speech engine hears it; a key phrase that is heard lights green, stronger */
.ch-pou .pu-cw{transition:color .22s var(--zt-ease)}
.ch-pou .pu-try.pu-reading .pu-cw{color:rgba(242,241,238,.4)}
.ch-pou .pu-try.pu-reading .pu-cw.pu-said,.ch-pou .pu-try .pu-f.pu-hit .pu-cw{color:#fff}

/* every mic state gets one short line, right above the mic */
.ch-pou .pu-line{position:absolute;left:0;right:0;top:132px;height:20px;text-align:center;white-space:nowrap;font:400 13.5px/20px var(--f-sans);color:var(--pu-tx2);
  opacity:0;transform:translateY(4px);transition:opacity .24s var(--zt-ease),transform .36s var(--zt-ease)}
.ch-pou .pu-line.pu-show{opacity:1;transform:none}
.ch-pou .pu-line b{font-weight:600;color:var(--pu-tx)}

.ch-pou .pu-ctl{position:absolute;left:0;right:0;top:158px;height:58px;display:flex;justify-content:center}
.ch-pou .pu-mic{appearance:none;border:0;margin:0;padding:0;position:relative;display:inline-flex;align-items:center;height:58px;min-width:58px;border-radius:999px;cursor:pointer;
  background:var(--pu-card);color:var(--pu-tx);box-shadow:inset 0 0 0 1px var(--pu-line),0 1px 3px rgba(0,0,0,.4);touch-action:none;-webkit-user-select:none;user-select:none;
  opacity:.38;filter:grayscale(1);pointer-events:none;
  transition:opacity .4s var(--zt-ease),filter .4s var(--zt-ease),background .3s var(--zt-ease),color .3s var(--zt-ease),box-shadow .3s var(--zt-ease),padding .45s var(--zt-ease),transform .3s var(--zt-ease)}
.ch-pou.pu-ready .pu-mic{opacity:1;filter:none;pointer-events:auto}
.ch-pou.pu-ready .pu-mic:hover{background:#2d2d2d}
.ch-pou .pu-mic-ic{width:58px;height:58px;flex:0 0 58px;display:grid;place-items:center}
.ch-pou .pu-mic-ic>*{grid-area:1/1}
.ch-pou .pu-mic-d{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;transition:background .3s var(--zt-ease),color .3s var(--zt-ease),transform .14s var(--zt-ease)}
.ch-pou .pu-mic-d svg{display:block;width:23px;height:23px}
.ch-pou .pu-mic-d .pu-i-tick,.ch-pou .pu-mic-d .pu-i-up,.ch-pou .pu-spin{display:none}
.ch-pou .pu-spin{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.16);border-top-color:var(--pu-tx);animation:pou-spin .8s linear infinite}
@keyframes pou-spin{to{transform:rotate(360deg)}}
.ch-pou .pu-live{display:flex;align-items:center;gap:2.5px;height:24px;width:0;overflow:hidden;opacity:0;transition:width .45s var(--zt-ease),opacity .3s var(--zt-ease)}
.ch-pou .pu-live i{width:2.5px;height:3px;border-radius:9px;background:var(--pu-tx);flex:0 0 auto;transition:height .07s linear}
.ch-pou .pu-time{width:0;overflow:hidden;opacity:0;text-align:right;font:400 11px/1 var(--f-mono);color:var(--pu-tx2);font-variant-numeric:tabular-nums;
  transition:width .45s var(--zt-ease),opacity .3s var(--zt-ease),margin .45s var(--zt-ease)}
/* listening: the mic opens into a live bar */
.ch-pou[data-mic="listening"] .pu-mic{padding-right:12px;background:#2c2c2c;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),0 1px 3px rgba(0,0,0,.4)}
.ch-pou[data-mic="listening"] .pu-mic-d{background:#fff;color:#0d0d0d}
.ch-pou[data-mic="listening"] .pu-live{width:128px;opacity:1}
.ch-pou[data-mic="listening"] .pu-time{width:30px;margin-left:12px;opacity:1}
/* checking: a short wait */
.ch-pou[data-mic="checking"] .pu-mic{pointer-events:none}
.ch-pou[data-mic="checking"] .pu-i-mic{display:none}
.ch-pou[data-mic="checking"] .pu-spin{display:block}
/* no mic: it steps back, the field takes over */
.ch-pou[data-mic="denied"] .pu-mic{opacity:.38;filter:grayscale(1)}
/* passed */
.ch-pou.pu-passed .pu-mic{background:var(--pu-ok);color:#06210f;box-shadow:none;pointer-events:none;opacity:1;filter:none;animation:pou-wake .55s var(--zt-ease) 1}
.ch-pou.pu-passed .pu-mic-d .pu-i-mic,.ch-pou.pu-passed .pu-spin{display:none}
.ch-pou.pu-passed .pu-mic-d .pu-i-tick{display:block}
.ch-pou.pu-passed .pu-mic-d{background:none;color:inherit}

/* the product's own label under the mic */
.ch-pou .pu-hint{position:absolute;left:0;right:0;top:226px;text-align:center;font:700 10px/12px var(--f-mono);letter-spacing:1.6px;text-transform:uppercase;color:var(--pu-tx3);
  opacity:.45;transition:opacity .3s var(--zt-ease),color .3s var(--zt-ease)}
.ch-pou .pu-hint b{font-weight:700;color:var(--pu-tx2)}
.ch-pou.pu-ready .pu-hint{opacity:1}
.ch-pou[data-mic="listening"] .pu-hint,.ch-pou[data-mic="checking"] .pu-hint{opacity:0}
.ch-pou.pu-passed .pu-hint{opacity:1;color:#6fd189}
.ch-pou .pu-skip{appearance:none;border:0;background:none;position:absolute;left:50%;top:244px;transform:translateX(-50%);padding:5px 9px;border-radius:8px;cursor:pointer;white-space:nowrap;
  font:500 12.5px/16px var(--f-sans);letter-spacing:-.01em;color:var(--pu-tx3);opacity:.45;pointer-events:none;transition:opacity .3s var(--zt-ease),color .2s}
.ch-pou.pu-ready .pu-skip{opacity:1;pointer-events:auto}
.ch-pou .pu-skip:hover{color:var(--pu-tx)}
.ch-pou[data-mic="listening"] .pu-skip,.ch-pou[data-mic="checking"] .pu-skip{opacity:0;pointer-events:none}

.ch-pou.pu-passed .pu-skip,.ch-pou.pu-passed .pu-line{display:none}
.ch-pou.pu-passed .pu-hint{display:block}

/* ---------- b15: the open mic. Its X throws the take away; after a click its dot is the send key ---------- */
.ch-pou .pu-mic:focus{outline:0}
.ch-pou .pu-mic:focus-visible{box-shadow:inset 0 0 0 1px var(--pu-line),0 0 0 2px rgba(255,255,255,.4)}
.ch-pou .pu-x{appearance:none;border:0;margin:0;padding:0;display:grid;place-items:center;flex:0 0 auto;width:0;height:34px;border-radius:50%;overflow:hidden;opacity:0;
  background:rgba(255,255,255,.07);color:var(--pu-tx2);cursor:pointer;pointer-events:none;
  transition:width .45s var(--zt-ease),margin .45s var(--zt-ease),opacity .3s var(--zt-ease),background .2s,color .2s,transform .12s var(--zt-ease)}
.ch-pou .pu-x svg{display:block;flex:none;width:15px;height:15px}
.ch-pou[data-mic="listening"] .pu-x{width:34px;margin-left:14px;opacity:1;pointer-events:auto}
.ch-pou[data-mic="listening"] .pu-x:hover{background:rgba(255,255,255,.14);color:var(--pu-tx)}
.ch-pou[data-mic="listening"] .pu-x:active{transform:scale(.9)}
.ch-pou.pu-latched[data-mic="listening"] .pu-mic-d .pu-i-mic{display:none}
.ch-pou.pu-latched[data-mic="listening"] .pu-mic-d .pu-i-up{display:block}
.ch-pou[data-mic="listening"] .pu-mic:active:not(:has(.pu-x:active)) .pu-mic-d,.ch-pou.pu-press .pu-mic-d{transform:scale(.88)}

/* b17: no voice here. The mic and its label step back, the line says so plainly, and Skip is the way on */
.ch-pou.pu-voiceless .pu-mic{opacity:.38;filter:grayscale(1);pointer-events:none}
.ch-pou.pu-voiceless .pu-hint{opacity:0}
.ch-pou.pu-voiceless .pu-skip{color:var(--pu-tx)}

/* a thrown away take sinks out */
.ch-pou .pu-note.pu-me.pu-gone{opacity:0;transform:translateY(5px);filter:blur(4px);transition:opacity .2s ease,transform .24s var(--zt-ease),filter .24s var(--zt-ease)}

/* the white key steps aside while the mic is open and once the learner's own note is in the thread (it would sit on it),
   and a ring that moves (card to send key and back) goes at once */
#zt-root:has(.ch-pou[data-mic="listening"],.ch-pou[data-mic="checking"],.ch-pou .pu-note.pu-me) #zt-tip{opacity:0;transform:translateY(4px);pointer-events:none}
#zt-root:has(.ch-pou[data-mic]:not([data-mic="passed"])) #zt-ink g.zt-gone{display:none}

@media (prefers-reduced-motion:reduce){
  .ch-pou .pu-note.pu-playing .pu-wave i,.ch-pou .pu-spin,.ch-pou .pu-me.pu-rec .pu-play::after{animation:none}
}

/* ch/05-workspace.css */
/* 5 · workspace, feedback, coach. b4's build of the dark Stage workspace (rail, chat with the peer header and the
   composer pill, the right panel where the draft is read and the feedback lands) with the real app's top bar on it:
   the level pill and the coach's HUD, and the coach panel beside the work (features/coach on origin/dev).
   The frame is drawn twice: the dark Do surface, and Learn mode's light one, revealed from the bottom centre.
   Proportions and tokens follow the real screen (rail 312, chat column 600, panel 376).
   It is shown inside the pop-up at 90%, so the type sits one notch above the app's own
   scale: on screen it lands back at app size. Mono caps only where the real rail and
   panel carry them. Columns are separated by space and surface, never by a rule. */
.ch-workspace,.ch-workspace .ws-app{
  --ws-bg:#1E1E1E;--ws-card:#262626;--ws-bubble:#333333;--ws-soft:#282828;--ws-hover:rgba(255,255,255,.06);
  --ws-line:rgba(255,255,255,.075);--ws-line-2:rgba(255,255,255,.04);
  --ws-tx:#f2f1ee;--ws-tx-2:#a5a29b;--ws-tx-3:#6d6a63;--ws-tx-4:#4a4844;
  --ws-ok:#3fb968;--ws-fix:#ff6a4d;--ws-meets:#e7b90a;--ws-exceeds:#4ade80;--ws-guided:#f5b73d;
  --ws-acc:#ffffff;--ws-onacc:#0d0d0d;
  --ws-shift:.76s; /* a panel opening rides the same clock as Navid's flight, so he and his seat move as one */
  background:var(--ws-bg);color:var(--ws-tx);font-family:var(--f-sans);font-size:14.5px;line-height:1.55;letter-spacing:-.01em}
.ch-workspace .ws-app[data-theme="light"]{
  --ws-bg:#fefefe;--ws-card:#ffffff;--ws-bubble:#f2f2f3;--ws-soft:#f6f6f7;--ws-hover:#f0f0f1;
  --ws-line:rgba(13,13,13,.055);--ws-line-2:rgba(13,13,13,.03);
  --ws-tx:#111113;--ws-tx-2:#63636a;--ws-tx-3:#9a9aa0;--ws-tx-4:#c4c4ca;--ws-acc:#111113;--ws-onacc:#ffffff}
.ch-workspace .ws-app{position:absolute;inset:0;overflow:hidden}
.ch-workspace svg{display:block}
.ch-workspace .ws-lbl{display:block;font-family:var(--f-mono);font-size:11px;font-weight:700;line-height:1.5;letter-spacing:1.4px;text-transform:uppercase;color:var(--ws-tx-2)}

/* ---------- top bar ---------- */
.ch-workspace .ws-top{position:absolute;left:0;right:0;top:0;height:52px;display:flex;align-items:center;gap:9px;padding:0 16px}
.ch-workspace .ws-spacer{flex:1}
/* the HUD level pill (LegacyXpLevelPill): the star and L{n}, drawn for a 50px design height and zoomed to the bar's 33 */
.ch-workspace .ws-lvl{flex:0 0 auto;zoom:.66;display:flex;flex-direction:column;align-items:flex-start;padding:10px 20px;border-radius:30px;
  background:rgba(0,0,0,.2);border:2px solid rgba(255,255,255,.1);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.ch-workspace .ws-lvl>span{display:flex;align-items:center;gap:8px;width:100%}
.ch-workspace .ws-lvl img{display:block;width:25.4px;height:26px;object-fit:cover}
.ch-workspace .ws-lvl i{font-style:normal;font-family:var(--f-mono);font-weight:400;font-size:22px;letter-spacing:-1.1px;line-height:16px;color:#fff;white-space:nowrap;
  text-box-trim:trim-both;text-box-edge:cap alphabetic;font-feature-settings:'lnum' 1,'tnum' 1}
.ch-workspace .ws-app[data-theme="light"] .ws-lvl{background:rgba(255,255,255,.7);border-color:rgba(13,13,13,.08)}
.ch-workspace .ws-app[data-theme="light"] .ws-lvl i{color:#111113}
/* the coach's HUD (CoachHud + MeasurePill): four instruments in one glass case, and the coach caps its right end */
.ch-workspace .ws-hud{position:relative;flex:0 0 auto;display:flex;align-items:center}
.ch-workspace .ws-hpill{display:flex;align-items:center;height:34px;padding-left:5px;border-radius:99px;background:rgba(255,255,255,.045);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.05)}
.ch-workspace .ws-hinsts{display:flex;align-items:center;gap:6px}
.ch-workspace .ws-hinst{position:relative;flex:0 0 auto;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#343434;box-shadow:inset 0 0 6px rgba(255,255,255,.45);color:#f2f1ee}
.ch-workspace .ws-hinst>span{display:grid;place-items:center;line-height:0;opacity:.78;transition:opacity .15s}
.ch-workspace .ws-hinst.ws-read>span{opacity:1}
.ch-workspace .ws-gl{fill:currentColor}
.ch-workspace .ws-hinst .ws-gl{width:13px;height:13px}
.ch-workspace .ws-ring{position:absolute;pointer-events:none;transform:rotate(-90deg);opacity:0}
.ch-workspace .ws-ring circle{fill:none;stroke-linecap:round;stroke-dasharray:119.381;stroke-dashoffset:119.381;transition:stroke-dashoffset .5s cubic-bezier(.2,0,0,1)}
.ch-workspace .ws-read .ws-ring{opacity:1}
.ch-workspace .ws-hinst .ws-ring{inset:-2px;width:28px;height:28px}
.ch-workspace .ws-hinst .ws-ring circle{stroke-width:2.4}
.ch-workspace .ws-hseat{position:relative;flex:0 0 auto;margin-left:7px;width:34px;height:34px;border-radius:50%}
/* b20: the coach comes after the evaluation. Until then the HUD takes no room; the seat opens empty, Navid lands in it,
   and the case with the four measures forms to his left */
.ch-workspace .ws-hpill{transition:padding .5s var(--zt-ease),background .45s var(--zt-ease),box-shadow .45s var(--zt-ease)}
.ch-workspace:not(.ws-hud-case) .ws-hpill{padding-left:0;background:transparent;box-shadow:none}
.ch-workspace .ws-hseat{background:#2a2a2a;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);transition:width .55s var(--zt-ease),margin .55s var(--zt-ease),transform .6s cubic-bezier(.34,1.4,.64,1)}
.ch-workspace:not(.ws-hud-seat) .ws-hseat{width:0;margin-left:0;transform:scale(.2)}
.ch-workspace:not(.ws-hud-case) .ws-hseat{margin-left:0}
.ch-workspace .ws-hinsts{max-width:0;transition:max-width .3s var(--zt-ease)}
/* one face: while Navid flies up to the coach's seat, the chat header's photo is not there; it grows back in after he lands */
.ch-workspace .ws-pava .ws-face{transition:transform .5s var(--zt-ease)}
.ch-workspace.ws-peer-away .ws-pava .ws-face{transform:scale(0);transition:none}
.ch-workspace .ws-hinst{transform:scale(0);transition:transform .46s cubic-bezier(.34,1.56,.64,1)}
.ch-workspace .ws-hinst.ws-in{transform:none}
.ch-workspace:not(.ws-hud-seat) .ws-hdot{display:none}
.ch-workspace .ws-hdot{position:absolute;top:-1px;right:-1px;width:9px;height:9px;border-radius:50%;background:#FF6A4D;box-shadow:0 0 0 3.5px rgba(255,106,77,.28);opacity:0;transform:scale(.4);transition:opacity .25s,transform .35s cubic-bezier(.34,1.4,.64,1);pointer-events:none}
.ch-workspace.ws-pushed .ws-hdot{opacity:1;transform:none}
.ch-workspace .ws-app[data-theme="light"] .ws-hpill{background:rgba(13,13,13,.04);box-shadow:inset 0 1px 2px rgba(0,0,0,.08),inset 0 0 0 1px rgba(13,13,13,.05)}
.ch-workspace .ws-app[data-theme="light"] .ws-hinst{background:#fff;box-shadow:0 0 0 1px rgba(13,13,13,.08);color:#3a3a3d}
.ch-workspace .ws-back{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--ws-tx-2)}
.ch-workspace .ws-back svg{width:20px;height:20px}

/* ---------- the columns. Everything ends above y = 760: the pop-up crops just below it ---------- */
.ch-workspace .ws-work{position:absolute;left:0;right:0;top:52px;height:712px;display:flex}

/* ---------- rail ---------- */
.ch-workspace .ws-rail{flex:0 0 312px;min-width:0;display:flex;flex-direction:column}
.ch-workspace .ws-brand{flex:0 0 54px;display:flex;align-items:center;gap:11px;padding:0 20px}
.ch-workspace .ws-logo{flex:0 0 auto;width:38px;height:38px;border-radius:99px;background:var(--ws-card);border:1px solid var(--ws-line);display:grid;place-items:center}
.ch-workspace .ws-logo img{width:19px;height:21px;display:block}
.ch-workspace .ws-brand-t{font-size:15px;font-weight:600;line-height:1.26}
.ch-workspace .ws-rail-body{flex:1;min-height:0;padding:16px 16px 0}
.ch-workspace .ws-stages{border-radius:16px}
.ch-workspace .ws-active{position:relative;border:1px solid var(--ws-line);border-radius:16px;padding:16px 16px 9px;margin-bottom:12px}
.ch-workspace .ws-stage-t{font-size:20px;font-weight:700;line-height:1.22;letter-spacing:-.02em;margin-bottom:17px}
.ch-workspace .ws-reqs{margin-top:5px}
.ch-workspace .ws-req{display:flex;align-items:flex-start;gap:10px;padding:9px 10px;margin:0 -8px 2px;border-radius:10px}
.ch-workspace .ws-req-b{flex:1;min-width:0}
.ch-workspace .ws-req-t{font-size:14px;font-weight:600;line-height:1.38;text-wrap:pretty}
.ch-workspace .ws-req-tag{display:grid;grid-template-rows:0fr;transition:grid-template-rows .48s var(--zt-ease)}
.ch-workspace .ws-req-tag span{overflow:hidden;min-height:0;font-size:12px;font-weight:600;line-height:1.5;color:var(--ws-fix);opacity:0;transition:opacity .4s var(--zt-ease)}
.ch-workspace .ws-req.ws-miss .ws-req-tag{grid-template-rows:1fr}
.ch-workspace .ws-req.ws-miss .ws-req-tag span{opacity:1}
/* the status mark. At rest it is the rail's own quiet dot. A review turns it into a tick or a "needs work" */
.ch-workspace .ws-mark{position:relative;flex:0 0 auto;width:18px;height:18px;margin-top:1px;border-radius:99px;display:grid;place-items:center;
  border:1.5px solid transparent;color:#fff;transition:background .35s var(--zt-ease),border-color .35s var(--zt-ease),color .35s var(--zt-ease)}
.ch-workspace .ws-mark::before{content:"";width:7px;height:7px;border-radius:99px;background:var(--ws-tx-4);transition:opacity .25s var(--zt-ease),transform .3s var(--zt-ease)}
.ch-workspace .ws-mark i{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transform:scale(.4);transition:opacity .25s var(--zt-ease),transform .4s var(--zt-ease)}
.ch-workspace .ws-mark svg{width:11px;height:11px}
.ch-workspace .ws-checking .ws-mark::after,.ch-workspace .ws-checking .ws-fmark::after{content:"";position:absolute;inset:-4px;border-radius:99px;border:1.5px solid transparent;border-top-color:var(--ws-tx-2);animation:ws-spin .7s linear infinite}
.ch-workspace .ws-req.ws-hit .ws-mark{background:var(--ws-ok);border-color:var(--ws-ok)}
.ch-workspace .ws-req.ws-hit.ws-pop .ws-mark{animation:ws-pop .55s cubic-bezier(.34,1.56,.64,1)}
.ch-workspace .ws-req.ws-miss .ws-mark{border-color:rgba(255,106,77,.6);color:var(--ws-fix)}
.ch-workspace .ws-req.ws-hit .ws-mark::before,.ch-workspace .ws-req.ws-miss .ws-mark::before{opacity:0;transform:scale(.3)}
.ch-workspace .ws-req.ws-hit .ws-i-tick,.ch-workspace .ws-req.ws-miss .ws-i-bang{opacity:1;transform:none}
.ch-workspace .ws-reswrap{margin:10px -6px 0;padding:4px 6px 0;border-radius:12px}
.ch-workspace .ws-res{display:flex;align-items:center;gap:9px;padding:7px 4px;margin:2px -4px 0;border-radius:9px}
.ch-workspace .ws-res-ic{flex:0 0 auto;width:18px;height:18px;display:grid;place-items:center;color:var(--ws-tx-3)}
.ch-workspace .ws-res-ic svg{width:16px;height:16px}
.ch-workspace .ws-res-n{flex:1;min-width:0;font-size:13px;font-weight:500;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-workspace .ws-group{padding:0 0 6px}
.ch-workspace .ws-group-h{display:flex;align-items:center;gap:9px;padding:10px 2px 7px;color:var(--ws-tx-3)}
.ch-workspace .ws-group-h svg{width:16px;height:16px;flex:0 0 auto;transform:rotate(180deg)}
.ch-workspace .ws-group-h .ws-lbl{flex:1;color:inherit}
.ch-workspace .ws-cnt{font-size:12px;font-weight:700;line-height:1}
.ch-workspace .ws-gstep{display:flex;align-items:flex-start;gap:12px;padding:8px 2px;color:var(--ws-tx-3)}
.ch-workspace .ws-gstep svg{flex:0 0 auto;width:18px;height:18px;margin-top:1px;color:var(--ws-tx-4)}
.ch-workspace .ws-gstep span{flex:1;font-size:13.5px;line-height:1.35;padding-top:1px}

/* ---------- centre: the manager ---------- */
.ch-workspace .ws-center{flex:1 1 0;min-width:0;margin-left:5px;display:flex;flex-direction:column}
.ch-workspace .ws-col{width:min(600px,100%);margin-left:auto;margin-right:auto}
.ch-workspace .ws-ctop{flex:0 0 54px;padding:0 24px;display:flex;align-items:center}
.ch-workspace .ws-peer{padding:0 28px;display:flex;align-items:center}
.ch-workspace .ws-peer-id{display:inline-flex;align-items:center;gap:11px;border-radius:26px}
/* a seat. The engine draws Navid over the empty .ws-slot. The initial underneath is what stays when he leaves */
.ch-workspace .ws-seat{position:relative;flex:0 0 auto}
.ch-workspace .ws-seat b{position:absolute;inset:0;border-radius:50%;background:var(--ws-card);box-shadow:inset 0 0 0 1px var(--ws-line);display:grid;place-items:center;font-size:13px;font-weight:600;line-height:1;color:var(--ws-tx-3)}
.ch-workspace .ws-slot{position:absolute;inset:0;border-radius:50%;display:block}
.ch-workspace .ws-pava{width:36px;height:36px}
.ch-workspace .ws-seat .ws-face{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.ch-workspace .ws-pmeta{transition:opacity .6s var(--zt-ease)}
.ch-workspace .ws-pname{font-size:14.5px;font-weight:600;line-height:1.2}
.ch-workspace .ws-psub{font-size:12px;line-height:1.2;color:var(--ws-tx-3);margin-top:3px}

.ch-workspace .ws-thread{flex:1 1 0;min-height:0;padding:0 24px;overflow-y:auto;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 20px);mask-image:linear-gradient(to bottom,transparent 0,#000 20px)}
.ch-workspace .ws-thread::-webkit-scrollbar{display:none}
.ch-workspace .ws-thread.ws-scrolled{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 46px);mask-image:linear-gradient(to bottom,transparent 0,#000 46px)}
.ch-workspace .ws-msgs{padding:24px 28px 14px;display:flex;flex-direction:column;gap:24px}
.ch-workspace .ws-msgs>.ws-new{animation:ws-rise .48s var(--zt-ease)}
.ch-workspace .ws-m{align-self:flex-start;max-width:430px}
.ch-workspace .ws-m+.ws-m{margin-top:-14px}
.ch-workspace .ws-bub{width:fit-content;max-width:100%;background:var(--ws-soft);border:1px solid var(--ws-line-2);border-radius:20px;padding:10px 15px;font-size:14.5px;line-height:1.5;overflow-wrap:break-word}
.ch-workspace .ws-u{align-self:flex-end;width:fit-content;max-width:400px;background:var(--ws-bubble);border-radius:20px;padding:10px 15px;font-size:14.5px;line-height:1.5;overflow-wrap:break-word}
/* a handed-in file */
.ch-workspace .ws-subm{align-self:flex-end;width:220px}
.ch-workspace .ws-att{position:relative;display:flex;flex-direction:column;border:1px solid var(--ws-line);border-radius:14px;background:var(--ws-card);overflow:hidden;transition:box-shadow .4s var(--zt-ease)}
.ch-workspace .ws-att .ws-pv{height:118px;--pvs:.46}
.ch-workspace .ws-att .ws-fmeta{padding:9px 13px 11px}
.ch-workspace .ws-thumb{flex:0 0 auto;width:34px;height:44px;border-radius:5px;background:#f6f5f3;padding:7px 6px 0;display:flex;flex-direction:column;gap:3.5px}
.ch-workspace .ws-thumb i{height:2.5px;border-radius:9px;background:rgba(31,29,30,.2)}
.ch-workspace .ws-thumb i:first-child{width:70%;height:3.5px;background:rgba(31,29,30,.55);margin-bottom:1.5px}
.ch-workspace .ws-thumb i:last-child{width:55%}
.ch-workspace .ws-fmeta{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ch-workspace .ws-pv{position:relative;display:block;flex:0 0 auto;overflow:hidden;background:#e8e6e1}
.ch-workspace .ws-pv-pg{position:absolute;left:50%;top:9px;width:316px;transform-origin:50% 0;transform:translateX(-50%) scale(var(--pvs,.4))}
.ch-workspace .ws-page.ws-pg-mini{box-shadow:0 2px 10px rgba(0,0,0,.16)}
.ch-workspace .ws-fmeta b{font-size:13.5px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-workspace .ws-fmeta i{font-style:normal;font-family:var(--f-mono);font-size:11px;font-weight:700;line-height:1.3;letter-spacing:.8px;text-transform:uppercase;color:var(--ws-tx-3);white-space:nowrap}
.ch-workspace .ws-cap{text-align:right;font-family:var(--f-mono);font-size:11px;font-weight:700;line-height:1.4;letter-spacing:.8px;text-transform:uppercase;color:var(--ws-tx-3);margin-top:6px}
.ch-workspace .ws-subm.ws-analyzing .ws-att{box-shadow:0 0 0 1.5px rgba(63,185,104,.45)}
.ch-workspace .ws-subm.ws-analyzing .ws-att::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 32%,rgba(63,185,104,.22) 50%,transparent 68%);background-size:220% 100%;animation:ws-sweep 1.5s var(--zt-ease) infinite}
/* "reading", then "reviewed" */
.ch-workspace .ws-synth{align-self:flex-start;display:flex;align-items:center;gap:9px;padding:0 3px;margin-top:-9px;min-width:0}
.ch-workspace .ws-sy-ic{flex:0 0 auto;width:23px;height:23px;border-radius:99px;background:var(--ws-bubble);border:1px solid var(--ws-line);display:grid;place-items:center;color:var(--ws-tx-2)}
.ch-workspace .ws-sy-ic svg{width:12px;height:12px}
.ch-workspace .ws-sy-t{font-size:13.5px;line-height:1.4;color:var(--ws-tx-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .4s var(--zt-ease)}
.ch-workspace .ws-synth.ws-live .ws-sy-ic{animation:ws-pulse 1.5s var(--zt-ease) infinite}
.ch-workspace .ws-synth.ws-done .ws-sy-t{color:var(--ws-tx-2);font-weight:500}
.ch-workspace .ws-time{align-self:center;font-size:12px;font-weight:500;line-height:1;color:var(--ws-tx-2);background:var(--ws-soft);border:1px solid var(--ws-line-2);padding:7px 12px;border-radius:99px}

/* ---------- composer. Its block never changes height: the pill grows upward over the chip row,
   so the thread above it never resizes. Only Submit is the learner's: the chips, the plus, the
   field and the guided switch are worked by Navid's pointer, so they do not take a click ---------- */
.ch-workspace .ws-composer{flex:0 0 auto;position:relative;padding:10px 24px 14px;transition:opacity .5s var(--zt-ease)}
.ch-workspace .ws-pill{display:flex;flex-direction:column;min-height:91px;background:var(--ws-soft);border:1px solid var(--ws-line);border-radius:26px}
.ch-workspace .ws-attrow{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--zt-ease)}
.ch-workspace .ws-attrow>div{overflow:hidden;min-height:0}
.ch-workspace .ws-pill.ws-has-att .ws-attrow{grid-template-rows:1fr}
.ch-workspace .ws-attin{display:flex;padding:10px 10px 0}
/* a file in the composer: its first page in a band, its name, and while it uploads a bar under the band fills */
.ch-workspace .ws-ac{position:relative;flex:0 0 auto;width:172px;border:1px solid var(--ws-line);border-radius:12px;overflow:hidden;background:var(--ws-card);animation:ws-rise .48s var(--zt-ease) both}
.ch-workspace .ws-ac .ws-pv{height:84px;--pvs:.34}
.ch-workspace .ws-ac-m{display:flex;flex-direction:column;gap:2px;padding:7px 10px 8px;min-width:0}
.ch-workspace .ws-ac-m b{font-size:12px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-workspace .ws-ac-m i{font-style:normal;font-family:var(--f-mono);font-size:9.5px;font-weight:700;line-height:1.3;letter-spacing:.8px;text-transform:uppercase;color:var(--ws-tx-3);white-space:nowrap}
.ch-workspace .ws-input{appearance:none;display:block;width:100%;min-width:0;pointer-events:none;background:none;border:0;outline:0;color:var(--ws-tx);font:inherit;font-size:15px;line-height:1.5;letter-spacing:-.01em;padding:13px 18px 4px}
.ch-workspace .ws-input::placeholder{color:var(--ws-tx-3)}
.ch-workspace .ws-ctrl{display:flex;align-items:center;gap:4px;padding:4px 8px 8px;margin-top:auto}
.ch-workspace .ws-grow{flex:1}
.ch-workspace .ws-plus{appearance:none;border:0;pointer-events:none;flex:0 0 auto;width:38px;height:38px;border-radius:99px;display:grid;place-items:center;background:none;color:var(--ws-tx-2)}
.ch-workspace .ws-plus svg{width:20px;height:20px}
/* guided mode: the composer's own switch */
.ch-workspace .ws-guided{appearance:none;border:0;pointer-events:none;flex:0 0 auto;display:flex;align-items:center;gap:8px;height:30px;padding:0 12px 0 4px;border-radius:99px;background:none;color:var(--ws-tx-2);letter-spacing:-.01em}
.ch-workspace .ws-g-track{position:relative;flex:0 0 auto;width:36px;height:20px;border-radius:99px;background:var(--ws-line);transition:background .48s var(--zt-ease)}
.ch-workspace .ws-g-k{position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:99px;background:var(--ws-tx-2);transition:transform .48s var(--zt-ease),background .48s var(--zt-ease)}
.ch-workspace .ws-g-l{font-size:13px;font-weight:600;line-height:1;transition:color .4s var(--zt-ease)}
.ch-workspace .ws-guided.ws-on .ws-g-track{background:var(--ws-guided)}
.ch-workspace .ws-guided.ws-on .ws-g-k{transform:translateX(16px);background:#fff}
.ch-workspace .ws-g-k svg{position:absolute;left:0;top:0;width:16px;height:16px;color:#b77a0e}
.ch-workspace .ws-g-k svg path{stroke-dasharray:12;stroke-dashoffset:12;transition:stroke-dashoffset .2s var(--zt-ease)}
.ch-workspace .ws-guided.ws-on .ws-g-k svg path{stroke-dashoffset:0;transition:stroke-dashoffset .32s var(--zt-ease) .26s}
.ch-workspace .ws-guided.ws-on .ws-g-l{color:var(--ws-tx)}
/* send. With the draft in the composer it reads Submit, and it is the one control that takes a click */
.ch-workspace .ws-send{appearance:none;border:0;pointer-events:none;flex:0 0 auto;height:38px;min-width:38px;padding:0 9px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--ws-hover);color:var(--ws-tx-4);font-size:14px;font-weight:600;line-height:1;letter-spacing:-.01em;transition:background .3s var(--zt-ease),color .3s var(--zt-ease),transform .24s var(--zt-ease)}
.ch-workspace .ws-send svg{width:20px;height:20px;flex:0 0 auto}
.ch-workspace .ws-send-t{display:none}
.ch-workspace .ws-pill.ws-has-att .ws-send{pointer-events:auto;cursor:pointer;padding:0 11px 0 17px;background:#fff;color:#111}
.ch-workspace .ws-pill.ws-has-att .ws-send-t{display:inline}
.ch-workspace .ws-pill.ws-has-text .ws-send{background:#fff;color:#111}
.ch-workspace .ws-pill.ws-has-att .ws-send svg{width:18px;height:18px}
.ch-workspace .ws-pill.ws-has-att .ws-send:hover{transform:scale(1.04)}
.ch-workspace .ws-pill.ws-has-att .ws-send:active{transform:scale(.98)}
.ch-workspace .ws-composer.ws-quiet{opacity:.55}

/* ---------- right panel: an inset card ----------
   A column makes room by growing from zero, and the chat glides over. The card itself never
   slides: it is held against the right edge of its column, so it is already where it will end
   up, and it arrives by un-blurring a little. Nothing is ever cut by the edge of the canvas. */
.ch-workspace .ws-right,.ch-workspace .ws-coach{flex:0 0 0;min-width:0;display:flex;justify-content:flex-end;padding:54px 0 14px;transition:flex-basis var(--ws-shift) var(--zt-ease)}
.ch-workspace.ws-right-open .ws-right,.ch-workspace.ws-coach-open .ws-coach{flex-basis:376px}
.ch-workspace .ws-card{flex:0 0 auto;margin-right:12px;display:flex;flex-direction:column;overflow:hidden;background:var(--ws-bg);border:1px solid var(--ws-line);border-radius:18px;box-shadow:0 1px 3px rgba(0,0,0,.4);
  opacity:0;visibility:hidden;pointer-events:none;transform:translateX(16px) scale(.985);filter:blur(8px);
  transition:opacity .5s var(--zt-ease) .16s,transform .7s var(--zt-ease) .16s,filter .5s var(--zt-ease) .16s}
.ch-workspace .ws-rcard,.ch-workspace .ws-ccard{width:364px}
.ch-workspace.ws-coach-open .ws-ccard,.ch-workspace.ws-right-open .ws-rcard{opacity:1;visibility:visible;pointer-events:auto;transform:none;filter:none}
.ch-workspace .ws-rhead{flex:0 0 54px;display:flex;align-items:center;gap:8px;padding:0 12px 0 22px}
.ch-workspace .ws-rname{flex:1;min-width:0;font-family:var(--f-mono);font-size:12.5px;line-height:1;letter-spacing:1.4px;text-transform:uppercase;color:var(--ws-tx-2)}
.ch-workspace .ws-rtog{width:30px;height:30px;display:grid;place-items:center;color:var(--ws-tx-3)}
.ch-workspace .ws-rtog svg{width:19px;height:19px}
.ch-workspace .ws-rbody{flex:1;min-height:0;position:relative;padding:0 12px 18px}

/* the draft, being read */

.ch-workspace .ws-scanline{position:absolute;left:0;right:0;top:0;height:64px;margin-top:-64px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,rgba(73,186,97,0),rgba(73,186,97,.2));border-bottom:2px solid var(--zt-green);transition:opacity .3s var(--zt-ease)}
.ch-workspace .ws-page.ws-scanning .ws-scanline{opacity:1;animation:ws-scan var(--ws-scan,1.4s) linear forwards}

/* the feedback */

.ch-workspace.ws-fb-on .ws-fb{opacity:1;transform:none;pointer-events:auto;transition:opacity .45s var(--zt-ease) .14s,transform .6s var(--zt-ease) .14s}

.ch-workspace .ws-track{display:flex;gap:5px;margin-top:13px}

.ch-workspace .ws-gate{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:7px 12px 7px 10px;border-radius:99px;font-family:var(--f-mono);font-size:11px;font-weight:700;line-height:1;letter-spacing:1.1px;text-transform:uppercase;white-space:nowrap;
  color:var(--ws-fix);background:rgba(255,106,77,.09);border:1px solid rgba(255,106,77,.3);transition:color .5s var(--zt-ease),background .5s var(--zt-ease),border-color .5s var(--zt-ease)}

.ch-workspace .ws-fi{display:flex;gap:13px;padding:11px 11px;margin:0 -9px;border-radius:14px;transition:background .5s var(--zt-ease),box-shadow .5s var(--zt-ease)}

.ch-workspace .ws-fmark{position:relative;flex:0 0 auto;width:23px;height:23px;border-radius:99px;display:grid;place-items:center;border:1.5px solid var(--ws-line);color:var(--ws-tx-3);

.ch-workspace .ws-fixrow .ws-fmark{border-color:rgba(255,106,77,.55);color:var(--ws-fix)}
.ch-workspace .ws-fixrow .ws-i-bang{opacity:1;transform:none}

.ch-workspace .ws-ft{font-size:14px;font-weight:600;line-height:1.38}
.ch-workspace .ws-fnote{font-size:13px;line-height:1.5;color:var(--ws-tx-2);margin-top:2px;transition:color .45s var(--zt-ease)}
.ch-workspace .ws-fchips{display:flex;gap:6px;margin-top:9px}
.ch-workspace .ws-fchip{font-family:var(--f-mono);font-size:11px;font-weight:700;line-height:1;letter-spacing:.9px;text-transform:uppercase;padding:5px 8px 4px;border-radius:6px;white-space:nowrap;
  color:var(--ws-fix);background:rgba(255,106,77,.13);transition:color .45s var(--zt-ease),background .45s var(--zt-ease)}
.ch-workspace .ws-why{margin-top:12px}
.ch-workspace .ws-why .ws-fnote{margin-top:3px}
/* the fix, cleared */
.ch-workspace.ws-fixed .ws-gate{color:var(--ws-ok);background:rgba(63,185,104,.09);border-color:rgba(63,185,104,.3)}
.ch-workspace.ws-fixed .ws-fixrow .ws-fmark{background:var(--ws-ok);border-color:var(--ws-ok);color:#fff;box-shadow:inset 0 2px 5px rgba(255,255,255,.4),inset 0 -3px 8px rgba(0,0,0,.12)}
.ch-workspace .ws-fixrow.ws-pop .ws-fmark{animation:ws-pop .55s cubic-bezier(.34,1.56,.64,1)}
.ch-workspace.ws-fixed .ws-fixrow .ws-i-bang{opacity:0;transform:scale(.35) rotate(90deg)}
.ch-workspace.ws-fixed .ws-fixrow .ws-i-tick{opacity:1;transform:none}
.ch-workspace.ws-fixed .ws-fchip{color:var(--ws-ok);background:rgba(63,185,104,.13)}
.ch-workspace.ws-fixed .ws-why .ws-lbl{display:none}
.ch-workspace.ws-fixed .ws-why .ws-fnote{color:var(--ws-ok)}

/* ---------- the stage ends: "Stage complete" over its card, then Completed takes it and the next stage unlocks ---------- */
.ch-workspace .ws-rx{position:absolute;inset:0;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;padding:16px;opacity:0;transform:scale(.94);
  transition:opacity .42s var(--zt-ease),transform .6s cubic-bezier(.34,1.56,.64,1);z-index:6;
  background:linear-gradient(160deg,rgba(163,230,53,.22),rgba(34,197,94,.2) 55%,rgba(20,184,166,.16)),var(--ws-bg);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.ch-workspace .ws-rx.ws-show{opacity:1;transform:none}
.ch-workspace .ws-rx-wrap{position:relative;width:58px;height:58px}
.ch-workspace .ws-rx-burst{width:58px;height:58px;border-radius:99px;background:linear-gradient(140deg,#4ade80,#a3e635 55%,#facc15);display:grid;place-items:center;color:#0e2a12;box-shadow:0 10px 34px rgba(74,222,128,.5),0 0 0 8px rgba(163,230,53,.12);animation:ws-rxspin .9s var(--zt-ease) both}
.ch-workspace .ws-rx-burst svg{width:29px;height:29px}
.ch-workspace .ws-rx-ring{position:absolute;inset:0;pointer-events:none}
.ch-workspace .ws-rx-ring i{position:absolute;left:50%;top:50%;width:var(--os,5px);height:var(--os,5px);margin:calc(var(--os,5px)/-2);border-radius:99px;background:var(--oc,#a3e635);box-shadow:0 0 9px var(--oc,#a3e635);opacity:0;animation:ws-orbit 2.6s linear infinite var(--od,0s),ws-orbin .5s ease .25s forwards}
.ch-workspace .ws-rx-sparks{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.ch-workspace .ws-rx-sparks i{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:2px;background:var(--c);opacity:0;transform:rotate(var(--a)) translateX(12px) scale(.6)}
.ch-workspace .ws-rx.ws-show .ws-rx-sparks i{animation:ws-spark .95s cubic-bezier(.2,.7,.3,1) .1s forwards}
.ch-workspace .ws-rx-sub{font-size:13px;color:var(--ws-tx-2);margin-top:6px}
.ch-workspace .ws-gstep.ws-gdone svg{color:var(--ws-ok)}
.ch-workspace .ws-gstep.ws-gdone span{color:var(--ws-tx-2)}
.ch-workspace .ws-gstep.ws-slide-in{animation:ws-stepIn .6s cubic-bezier(.62,.01,.14,1) both}
.ch-workspace .ws-group.ws-opening{overflow:hidden;transition:height .42s var(--zt-ease)}
.ch-workspace .ws-gstep.ws-going{overflow:hidden;padding-top:0;padding-bottom:0;opacity:0;transform:translateY(-6px);transition:height .4s var(--zt-ease),padding .4s var(--zt-ease),opacity .22s var(--zt-ease),transform .4s var(--zt-ease)}
.ch-workspace .ws-active.ws-folding{animation:ws-fold .38s cubic-bezier(.5,0,.75,0) forwards}
.ch-workspace .ws-active.ws-resizing{overflow:hidden;transition:height .5s var(--zt-ease)}
.ch-workspace .ws-rname.ws-swap{animation:ws-swap .45s var(--zt-ease)}
.ch-workspace .ws-active.ws-just-active{animation:ws-activeReveal .9s cubic-bezier(.5,0,.15,1) both,ws-unlockGlow 1.25s ease .2s both}
.ch-workspace .ws-active.ws-just-active>*{animation:ws-innerReveal .66s cubic-bezier(.5,0,.15,1) both}
.ch-workspace .ws-active.ws-just-active>.ws-stage-t{animation-delay:.2s}
.ch-workspace .ws-active.ws-just-active>.ws-lbl{animation-delay:.3s}
.ch-workspace .ws-active.ws-just-active>.ws-reqs{animation-delay:.38s}
.ch-workspace .ws-active.ws-just-active>.ws-reswrap{animation-delay:.5s}
/* the thread: the next stage opens under its own heading */
.ch-workspace .ws-stagediv{align-self:stretch;display:flex;align-items:center;gap:14px;margin:4px 0}
.ch-workspace .ws-sd-line{flex:1;height:1px;background:var(--ws-line)}
.ch-workspace .ws-sd-txt{font-family:var(--f-mono);font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--ws-tx-3);white-space:nowrap}

/* ---------- the coach panel (CoachPanel, MidStagePanel): COACH and close, the tabs, what the coach has to say, the four measures ---------- */
.ch-workspace .ws-ccard{background:#1E1E1E}
.ch-workspace .ws-chead{flex:0 0 auto;display:flex;align-items:center;gap:8px;height:54px;padding:0 12px 0 22px}
.ch-workspace .ws-chead>span{flex:1;min-width:0;font-family:var(--f-mono);font-size:12px;line-height:1.5;letter-spacing:1.4px;text-transform:uppercase;color:#a5a29b}
.ch-workspace .ws-chead>span i{display:inline-block;vertical-align:middle;width:7px;height:7px;margin-left:7px;border-radius:50%;background:#FF6A4D;box-shadow:0 0 0 3px rgba(255,106,77,.26);opacity:0;transition:opacity .25s}
.ch-workspace.ws-pushed .ws-chead>span i{opacity:1}
.ch-workspace .ws-cclose{flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#a5a29b}
.ch-workspace .ws-cclose svg{width:16px;height:16px}
.ch-workspace .ws-ctabs{flex:0 0 auto;display:flex;align-items:center;gap:2px;padding:0 12px 8px}
.ch-workspace .ws-ctab{position:relative;padding:6px 8px;font-family:var(--f-mono);font-size:10px;font-weight:400;line-height:13px;letter-spacing:1.2px;text-transform:uppercase;color:#9a958c}
.ch-workspace .ws-ctab.ws-on{color:#f2f1ee}
.ch-workspace .ws-ctab.ws-on::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:1px;border-radius:999px;background:#f2f1ee}
.ch-workspace .ws-cbody{flex:1;min-height:0;overflow:hidden;padding:0 12px 30px;-webkit-mask-image:linear-gradient(to bottom,#000 0,#000 calc(100% - 26px),transparent);mask-image:linear-gradient(to bottom,#000 0,#000 calc(100% - 26px),transparent)}
.ch-workspace .ws-cin{display:flex;flex-direction:column;padding:0 8px}
.ch-workspace .ws-insight{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--zt-ease)}
.ch-workspace .ws-insight>div{overflow:hidden;min-height:0}
.ch-workspace .ws-insight p{margin:2px 2px 0;font-size:15px;line-height:24px;color:#f2f1ee;opacity:0;transform:translateY(8px);filter:blur(5px);transition:opacity .45s var(--zt-ease),transform .55s var(--zt-ease),filter .45s var(--zt-ease)}
.ch-workspace .ws-insight p+p{margin-top:12px}
.ch-workspace .ws-insight p:last-child{padding-bottom:18px}
.ch-workspace.ws-pushed .ws-insight{grid-template-rows:1fr}
.ch-workspace .ws-insight p.ws-on{opacity:1;transform:none;filter:none}
.ch-workspace .ws-mrows{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;border-top:1px solid transparent;transition:border-color .4s var(--zt-ease),padding-top .5s var(--zt-ease)}
.ch-workspace.ws-pushed .ws-mrows{margin-top:0;padding-top:12px;border-top-color:rgba(255,255,255,.075)}
.ch-workspace .ws-mrow{position:relative;display:flex;align-items:flex-start;gap:11px;margin:0 -9px;padding:10px;border-radius:14px}
.ch-workspace .ws-mrow+.ws-mrow::before{content:"";position:absolute;left:11px;right:11px;top:0;height:1px;background:rgba(255,255,255,.04)}
.ch-workspace .ws-mdisc{position:relative;flex:0 0 auto;display:grid;place-items:center;width:34px;height:34px;margin-top:2px;border-radius:50%;background:#343434;box-shadow:inset 0 0 8.5px rgba(255,255,255,.45);color:#f2f1ee}
.ch-workspace .ws-mdisc .ws-gl{width:16px;height:16px}
.ch-workspace .ws-mdisc .ws-ring{inset:-3px;width:40px;height:40px}
.ch-workspace .ws-mdisc .ws-ring circle{stroke-width:2.1}
.ch-workspace .ws-mtext{flex:1;min-width:0}
.ch-workspace .ws-mhead{display:flex;align-items:center;gap:8px;padding-top:4px}
.ch-workspace .ws-mname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--f-mono);font-size:10px;font-weight:400;line-height:13px;letter-spacing:1.2px;text-transform:uppercase;color:#f2f1ee}
.ch-workspace .ws-meter{margin-left:auto;display:inline-flex;flex:0 0 auto;gap:2px}
.ch-workspace .ws-meter i{width:5px;height:13px;border-radius:2px;background:rgba(255,255,255,.075);transition:background .35s var(--zt-ease)}
.ch-workspace .ws-mchev{flex:0 0 auto;width:16px;height:16px;color:#9a958c}
.ch-workspace .ws-mchev svg{width:16px;height:16px}
.ch-workspace .ws-mread{display:block;margin-top:4px;font-size:13px;line-height:19px;color:#a5a29b}
.ch-workspace .ws-mread.ws-swap{animation:ws-swap .5s var(--zt-ease)}

/* ---------- motion helpers ---------- */
/* laid out in one go: no entrance while the screen is being built, or while a final box is being measured */
.ch-workspace.ws-instant *,.ch-workspace.ws-instant *::before,.ch-workspace.ws-instant *::after{animation:none!important;transition:none!important}
.ch-workspace.ws-still,.ch-workspace.ws-still *{transition:none!important}
@keyframes ws-rise{from{opacity:0;transform:translateY(10px)}}
@keyframes ws-fold{to{opacity:0;filter:blur(10px);transform:translateY(-8px) scale(.96)}}
@keyframes ws-stepIn{from{opacity:0;filter:blur(7px);transform:translateY(-12px)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes ws-activeReveal{0%{opacity:0;filter:blur(24px);transform:translateY(22px) scale(.93)}45%{opacity:1}62%{filter:blur(5px)}100%{opacity:1;filter:blur(0);transform:none}}
@keyframes ws-unlockGlow{0%{box-shadow:0 0 0 0 rgba(163,230,53,0)}32%{box-shadow:0 0 0 2px rgba(163,230,53,.4),0 0 34px rgba(74,222,128,.34)}100%{box-shadow:0 0 0 0 rgba(163,230,53,0)}}
@keyframes ws-innerReveal{from{opacity:0;filter:blur(10px);transform:translateY(11px)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes ws-rxspin{0%{transform:rotate(-50deg) scale(.4);opacity:0}70%{transform:rotate(6deg) scale(1.09)}100%{transform:none;opacity:1}}
@keyframes ws-orbit{from{transform:rotate(0deg) translateX(var(--or,44px))}to{transform:rotate(360deg) translateX(var(--or,44px))}}
@keyframes ws-orbin{to{opacity:.95}}
@keyframes ws-spark{0%{opacity:1;transform:rotate(var(--a)) translateX(12px) scale(1)}70%{opacity:1}100%{opacity:0;transform:rotate(var(--a)) translateX(var(--d)) scale(.5)}}
@keyframes ws-bob{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
@keyframes ws-spin{to{transform:rotate(360deg)}}
@keyframes ws-pop{0%{transform:scale(1)}45%{transform:scale(1.24)}100%{transform:scale(1)}}
@keyframes ws-pulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.1);opacity:1}}
@keyframes ws-sweep{0%{background-position:170% 0}100%{background-position:-170% 0}}
@keyframes ws-scan{from{top:0}to{top:calc(100% + 64px)}}
@keyframes ws-swap{from{opacity:0;filter:blur(6px);transform:translateY(5px)}}
@media (prefers-reduced-motion:reduce){
  .ch-workspace .ws-right,.ch-workspace .ws-coach{transition-duration:.01s}
  .ch-workspace .ws-card{transition-duration:.01s;transition-delay:0s}
  .ch-workspace .ws-msgs>.ws-new,.ch-workspace .ws-band-l.ws-swap{animation:none}
}

/* ch/07-present.css */
/* 7 · presentation (b16: b4's room, ported from v4/src/ch/07-present.css, values unchanged). The live room, rebuilt
   small, playing by itself: Meet-grammar tiles, the top strip, the shared deck, one question from the team.
   Colours are the room's own. Drawn inside the pop-up at 90%, so the deck is as large as the room allows.
   b16 adds one thing: the learner's seat shows her photo in the same 62px disc b4 used for the initial. */
.ch-present{background:#202124;color:#e8eaed;font-family:var(--f-sans);letter-spacing:-.01em;
  --pr-card:#262626;--pr-line:rgba(255,255,255,.075)}
.ch-present .pr-bg{position:absolute;inset:0;background:#202124;transition:background .6s var(--zt-ease)}

/* 8 · portfolio (b14). Two layers.

   one canvas pixel is one CSS pixel of the page, so on a laptop it shows at about the 0.8 the page itself uses.
   Every class is the source's name with a p9- prefix and every rule is scoped under .ch-portfolio .pf-sl.
   Left out: the intro reel, the project popup, the one column layouts (the window is always 1600 wide, so the
   viewport media queries must not reach in), the page load rise, and the screens no visible project uses.
   .pf-fx: b11's project done moment on the app's 1920 canvas, scaled to the picture, unchanged. */

  --green:#00a656;--ease:cubic-bezier(.32,.72,0,1);--w:255,255,255;--night:#1a1a1c;

/* ---------- b14 additions, in the page's own terms ---------- */
/* the Airbnb deck's numbers wear Airbnb's colour, as the Canva deck's wear Canva's */
