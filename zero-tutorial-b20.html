<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>How Zero works</title>
<link rel="icon" href="zero-tutorial-assets-b20/img/zero-mark.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,100..1000&display=swap">
<style>
/* core.css */
/* ZERO overview tour · core. Everything the tour itself draws is prefixed zt-.
   Chapter screens live under .zt-ch.ch-<id> and must scope their own rules there. */
@font-face{font-family:'STK Bureau Serif';src:url('zero-tutorial-assets-b20/fonts/STKBureau-SerifBook.otf') format('opentype');font-weight:400;font-display:swap}
@font-face{font-family:'STK Bureau Serif';src:url('zero-tutorial-assets-b20/fonts/STKBureau-SerifMedium.otf') format('opentype');font-weight:500;font-display:swap}
@font-face{font-family:'PP Supply Mono';src:url('zero-tutorial-assets-b20/fonts/PPSupplyMono-Regular.otf') format('opentype');font-weight:400;font-display:swap}

:root{
  --zt-ease:cubic-bezier(.625,.05,0,1);
  --zt-green:#49BA61; --zt-green-deep:#2E9A48; --zt-green-ink:#06210f;
  --f-serif:'STK Bureau Serif',Georgia,serif;
  --f-sans:'Google Sans Flex','Google Sans',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-mono:'PP Supply Mono','SFMono-Regular',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0E0E10}
body{font-family:var(--f-sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;transition:background .6s var(--zt-ease)}
button{font-family:inherit}

/* One fixed design canvas, scaled to fit. Chapters draw in 1600 x 840 px.
   The tour's own chrome takes its values from the onboarding people do before they download the
   app (the same dark page, field, text steps and pills) and its made buttons from the Zero site
   (the key: a gradient face, a light top edge, a dark bottom edge, a hairline). */
#zt-root{position:fixed;left:0;top:0;width:1600px;height:840px;transform-origin:0 0;
  --page:#0E0E10; --shell:#17171A; --card:#1C1C1F; --field:#222226; --wash:#1A1A1D;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.05);
  --tx:#F4F4F3; --tx-2:#A6A6AC; --tx-3:#77777E; --tx-4:#4A4A51; --ink:#F4F4F3; --on-ink:#131315;
  --key-dark:linear-gradient(#303432,#181A19);
  --key-dark-sh:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -3px 0 rgba(0,0,0,.5),0 0 0 1px #121413,0 14px 24px -14px rgba(18,20,19,.5);
  --key-light:linear-gradient(#FFFFFF,#EDEDEA);
  --key-light-sh:inset 0 1px 0 #fff,inset 0 -3px 0 rgba(0,0,0,.1),0 0 0 1px rgba(0,0,0,.18),0 14px 24px -14px rgba(0,0,0,.5);
  /* older names, still read by the chapters */
  --zt-ink:#F4F4F3; --zt-ink-2:#A6A6AC; --zt-ink-3:#77777E; --zt-chip:#222226; --zt-chip-h:#2C2C31; --zt-ink-inv:#131315}
#zt-root[data-tone="light"]{--zt-ink:#111113; --zt-ink-2:#63636a; --zt-ink-3:#9a9aa0; --zt-chip:#F0F0EE; --zt-chip-h:#E6E6E3; --zt-ink-inv:#fff}

/* Two layers. #zt-full holds the full-screen screens (first run, the world).
   The player sits on top of the world: 16:9, a glass frame with its hairlines, the picture, and one bar. */
#zt-full{position:absolute;inset:0;overflow:visible}   /* a chapter still clips itself; one that fills the window opts out and runs to --zt-bx / --zt-by */
#zt-playerbg{position:absolute;z-index:9;left:88px;top:16px;width:1424px;height:808px;border-radius:30px;
  background:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(24px) saturate(1.3);backdrop-filter:blur(24px) saturate(1.3);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.13),inset 0 1px 0 rgba(255,255,255,.28),0 0 0 1px rgba(0,0,0,.55),0 50px 130px -30px rgba(0,0,0,.85),0 14px 36px -10px rgba(0,0,0,.5);
  opacity:0;transform:translateY(18px) scale(.955);pointer-events:none;transition:opacity .42s var(--zt-ease),transform .7s var(--zt-ease)}
#zt-playerbg::after{content:'';position:absolute;inset:8px;border-radius:22px;background:var(--page);box-shadow:0 0 0 1px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.07)}
#zt-root.zt-windowed #zt-playerbg{opacity:1;transform:none}
#zt-win{position:absolute;z-index:10;left:96px;top:24px;width:1408px;height:692px;border-radius:22px 22px 0 0;overflow:hidden;background:#1E1E1E;
  opacity:0;transform:translateY(18px) scale(.955);transform-origin:50% 396px;pointer-events:none;
  transition:opacity .42s var(--zt-ease),transform .7s var(--zt-ease)}   /* b17: the background changes at once, under the old screen, so no grey half colour shows between chapters */
#zt-root.zt-windowed #zt-win{opacity:1;transform:none;pointer-events:auto}
#zt-stage{position:absolute;left:0;top:0;width:1600px;height:840px;transform:scale(.88);transform-origin:0 0;overflow:hidden}
#zt-full .zt-ch{transition:opacity .3s var(--zt-ease) .16s,transform .52s var(--zt-ease) .16s,filter .6s var(--zt-ease)}
#zt-full .zt-ch.zt-exit{transition:opacity .15s ease-out}
#zt-full .zt-ch.zt-behind{filter:blur(7px) brightness(.5) saturate(.85);transform:scale(1.035);pointer-events:none}
/* (the world behind the player used to fade out at its sides to hide the bars; it fills the window now) */
/* compare mode (?full=1): the same screens fill the canvas and nothing sits behind them */
#zt-root.zt-fullmode #zt-win{left:0;top:0;width:1600px;height:840px;border-radius:0;box-shadow:none}
#zt-root.zt-fullmode #zt-playerbg,#zt-root.zt-fullmode #zt-veil{display:none!important}
#zt-root.zt-fullmode #zt-stage{transform:none}
#zt-root.zt-fullmode #zt-full .zt-ch.zt-behind{visibility:hidden}

/* ---------- the header of a full-screen screen: the wordmark, as in the onboarding ---------- */
.zt-logo{position:absolute;z-index:82;left:22px;top:22px;height:40px;padding:0 17px;display:flex;align-items:center;border-radius:999px;background:var(--field);color:var(--tx);
  opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .45s var(--zt-ease),transform .55s var(--zt-ease),background .4s,color .4s}
.zt-logo svg{height:13px;width:auto;display:block}
#zt-root.zt-hdr:not(.zt-windowed):not(.zt-bare) .zt-logo{opacity:1;transform:none}
/* on the world the wordmark stands on the map, white, as it does in the app */
#zt-root.zt-onmap .zt-logo{left:32px;top:28px;height:auto;padding:0;background:none;color:#fff;filter:drop-shadow(0 2px 10px rgba(0,0,0,.4))}
#zt-root.zt-onmap .zt-logo svg{height:24px}

/* ---------- skill points ---------- */
.zt-pts{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px 0 13px;border-radius:999px;background:var(--field);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
  font:400 13px/1 var(--f-sans);letter-spacing:-.01em;color:var(--tx);white-space:nowrap}
.zt-pts svg{width:15px;height:15px;color:#F2C94C;flex:none}
.zt-pts .zt-xp{width:19px;height:19px;flex:none;display:block;object-fit:contain;margin:0 -1px 0 -2px}   /* the app's own skill points star */
.zt-pts b{font:600 14.5px/1 var(--f-sans);font-variant-numeric:tabular-nums;min-width:1ch;text-align:right}
.zt-pts em{font-style:normal;color:var(--tx-3)}
.zt-pts.zt-bump{animation:zt-bump .5s var(--zt-ease)}
@keyframes zt-bump{35%{transform:scale(1.08);background:rgba(242,201,76,.26)}100%{transform:none}}
.zt-fly{position:absolute;z-index:90;display:flex;align-items:baseline;gap:7px;padding:9px 14px;border-radius:999px;background:#F2C94C;color:#2a2105;white-space:nowrap;pointer-events:none;
  font:400 13px/1 var(--f-sans);letter-spacing:-.01em;box-shadow:0 10px 30px rgba(0,0,0,.35);
  opacity:0;transform:translate(-50%,-50%) translateY(10px) scale(.7);
  transition:opacity .25s var(--zt-ease),transform .45s var(--zt-ease),left .7s var(--zt-ease),top .7s var(--zt-ease)}
.zt-fly b{font-weight:700;font-size:15px}
.zt-fly.zt-on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.zt-fly.zt-go{opacity:.9;transform:translate(-50%,-50%) scale(.62)}


/* chapter screens (b17): the old screen leaves first and quickly, then the new one rises in. Never both on screen at
   once: the old 0.5s blur cross dissolve showed two screens on top of each other and read as a glitch */
.zt-ch{position:absolute;inset:0;overflow:hidden;opacity:0;transform:translateY(8px);
  transition:opacity .3s var(--zt-ease) .16s,transform .52s var(--zt-ease) .16s}
.zt-ch.zt-in{opacity:1;transform:none}
.zt-ch.zt-exit{opacity:0;transform:none;pointer-events:none;transition:opacity .15s ease-out}

/* ---------- the guide: one face that changes seat ---------- */
.zt-guide{position:absolute;z-index:60;left:28px;top:778px;width:48px;height:48px;border-radius:50%;pointer-events:none;
  transition:left .76s var(--zt-ease),top .76s var(--zt-ease),width .76s var(--zt-ease),height .76s var(--zt-ease),border-radius .76s var(--zt-ease),opacity .4s var(--zt-ease)}
.zt-guide.zt-instant{transition:none}
.zt-guide.zt-hidden{opacity:0}
.zt-g-photo{position:absolute;inset:0;border-radius:inherit;overflow:hidden;background:#2b2b2b}
.zt-g-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:opacity .5s var(--zt-ease)}
.zt-g-photo .zt-wide{opacity:0;object-position:68% 20%}
.zt-guide[data-shape="tile"] .zt-wide{opacity:1}
.zt-guide[data-shape="tile"] .zt-face{opacity:0}
.zt-g-ring{position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 0 rgba(255,255,255,0);transition:box-shadow .16s linear}
.zt-guide.zt-speaking .zt-g-ring{box-shadow:0 0 0 calc(2px + var(--amp,0) * 4px) rgba(255,255,255,calc(.7 + var(--amp,0) * .3))}
.zt-g-tag{position:absolute;white-space:nowrap;display:flex;flex-direction:column;gap:3px;color:var(--zt-ink);
  letter-spacing:-.01em;transition:opacity .35s var(--zt-ease)}
.zt-g-tag b{font:600 14px/1.1 var(--f-sans)}
.zt-g-tag span{font:400 12.5px/1.1 var(--f-sans);color:var(--zt-ink-2);display:inline-block;transition:opacity .25s,filter .25s,transform .35s var(--zt-ease)}
.zt-g-tag span.zt-swap{opacity:0;filter:blur(5px);transform:translateY(4px)}
.zt-guide[data-tag="right"] .zt-g-tag{left:calc(100% + 12px);top:50%;transform:translateY(-50%)}
.zt-guide[data-tag="below"] .zt-g-tag{top:calc(100% + 14px);left:50%;transform:translateX(-50%);align-items:center;text-align:center}
.zt-guide[data-tag="below"] .zt-g-tag b{font-size:17px}
.zt-guide[data-tag="below"] .zt-g-tag span{font-size:14px}
.zt-guide[data-tag="inside"] .zt-g-tag{left:16px;bottom:14px;flex-direction:row;align-items:baseline;gap:8px;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.55)}
.zt-guide[data-tag="inside"] .zt-g-tag span{color:rgba(255,255,255,.78)}
.zt-guide[data-tag="none"] .zt-g-tag{opacity:0}
.zt-guide.zt-flying .zt-g-tag{opacity:0;transition-duration:.12s}


/* ---------- Navid's pointer: white, with a hairline, so it reads on paper and on the dark ---------- */
.zt-cursor{position:absolute;z-index:72;left:0;top:0;--x:60px;--y:790px;transform:translate(var(--x),var(--y));opacity:0;pointer-events:none;
  transition:transform .72s var(--zt-ease),opacity .28s var(--zt-ease)}
.zt-cursor.zt-on{opacity:1}
.zt-cursor svg{display:block;width:24px;height:24px;filter:drop-shadow(0 3px 7px rgba(0,0,0,.45))}
.zt-cursor em{position:absolute;left:17px;top:20px;font:600 11.5px/1 var(--f-sans);font-style:normal;letter-spacing:-.005em;white-space:nowrap;
  background:var(--key-light);color:#131315;padding:6px 9px 6px;border-radius:4px 11px 11px 11px;box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(0,0,0,.2),0 6px 14px -4px rgba(0,0,0,.45)}
.zt-cursor.zt-tap svg{animation:zt-tap .36s var(--zt-ease)}
@keyframes zt-tap{40%{transform:scale(.8)}100%{transform:none}}
/* the ring: a white line over a dark one, so one ring works on every screen */
.zt-ink{position:absolute;inset:0;z-index:66;pointer-events:none;overflow:visible}
.zt-ink g{transition:opacity .35s}
.zt-ink rect{fill:none;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .62s var(--zt-ease)}
.zt-ink rect.zt-r-under{stroke:rgba(0,0,0,.42);stroke-width:5}
.zt-ink rect.zt-r-over{stroke:#fff;stroke-width:2.25}
.zt-ink g.zt-drawn rect{stroke-dashoffset:0}
#zt-root[data-ptone="light"] .zt-ink rect.zt-r-over{stroke:#111113}
#zt-root[data-ptone="light"] .zt-ink rect.zt-r-under{stroke:rgba(255,255,255,.75)}
.zt-ink g.zt-pulse{animation:zt-pulse 1.5s ease-in-out .7s infinite}
.zt-ink g.zt-gone{opacity:0}
@keyframes zt-pulse{50%{opacity:.4}}
.zt-ripple{position:absolute;z-index:71;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.3);pointer-events:none;animation:zt-ripple .55s var(--zt-ease) forwards}
@keyframes zt-ripple{to{transform:scale(4.4);opacity:0}}

/* ---------- the prompt beside the thing to act on: a white key ---------- */
.zt-tip{position:absolute;z-index:71;left:0;top:0;display:flex;align-items:center;height:38px;padding:0 14px;border-radius:12px;white-space:nowrap;
  background:var(--key-light);color:#131315;box-shadow:var(--key-light-sh);font:500 14px/1 var(--f-sans);letter-spacing:-.01em;
  opacity:0;transform:translateY(6px) scale(.96);pointer-events:none;transition:opacity .28s var(--zt-ease),transform .5s var(--zt-ease)}
.zt-tip.zt-on{opacity:1;transform:none}
/* a tip that can be clicked does the thing for the learner. It is a key: it lifts, and it sets down when pressed */
.zt-tip.zt-can{pointer-events:auto;cursor:pointer}
.zt-tip.zt-can.zt-on:hover{transform:translateY(-2px)}
.zt-tip.zt-can.zt-on:active,.zt-tip.zt-went.zt-on{transform:translateY(1px)}
.zt-tip.zt-went{pointer-events:none;opacity:.55}
.zt-tip>b{font:400 14px/1 var(--f-sans);color:#77777E;padding-right:10px;margin-right:10px;box-shadow:1px 0 0 rgba(0,0,0,.12)}
.zt-tip span b{font-weight:600}
.zt-tip kbd{font:500 12px/1 var(--f-sans);border:1px solid rgba(0,0,0,.18);border-bottom-width:2px;border-radius:6px;padding:3px 6px 4px;margin:0 2px;background:#fff}
.zt-tip i{position:absolute;left:var(--ax,50%);width:11px;height:11px;margin-left:-5.5px;background:#F1F1EE;transform:rotate(45deg);border-radius:2px;box-shadow:1px 1px 0 rgba(0,0,0,.2)}
.zt-tip[data-side=top] i{bottom:-5px}
.zt-tip[data-side=bottom] i{top:-5px;background:#fff;box-shadow:-1px -1px 0 rgba(0,0,0,.16)}

/* ---------- the tour's own controls ----------
   On a full-screen screen they float: Navid bottom left, what he says bottom centre, sound in a corner.
   In the player they are its bar. */
.zt-dock{position:absolute;inset:0;z-index:80;pointer-events:none}
.zt-home{position:absolute;left:28px;bottom:24px;width:48px;height:48px;border-radius:50%}
.zt-center{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:820px;min-height:48px;display:grid;place-items:end center}
.zt-center>*{grid-area:1/1}
.zt-cc{max-width:760px;font:400 16px/1.4 var(--f-sans);letter-spacing:-.012em;color:var(--tx);text-align:center;text-wrap:balance;
  background:rgba(14,14,16,.74);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);padding:11px 18px 12px;border-radius:16px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset 0 1px 0 rgba(255,255,255,.08),0 14px 34px -12px rgba(0,0,0,.6);
  opacity:0;transform:translateY(6px);transition:opacity .22s var(--zt-ease),transform .36s var(--zt-ease)}
.zt-cc.zt-on{opacity:1;transform:none}
#zt-root.zt-nocc .zt-cc{display:none}
.zt-right{position:absolute;right:22px;bottom:50px;display:flex;align-items:center;gap:8px;pointer-events:auto;transition:opacity .4s}


/* a round control, 44px, as in the onboarding's header */
.zt-ib{appearance:none;border:0;flex:none;width:44px;height:44px;border-radius:999px;background:var(--field);color:var(--tx-2);display:grid;place-items:center;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);font:600 13px/1 var(--f-sans);font-variant-numeric:tabular-nums;letter-spacing:0;
  transition:background .2s,color .2s,transform .22s cubic-bezier(.2,.8,.3,1)}
.zt-ib:hover{background:#2C2C31;color:var(--tx)}
.zt-ib:active{transform:scale(.94)}
.zt-ib svg{width:17px;height:17px;display:block;grid-area:1/1}
.zt-ib.zt-off{color:var(--tx-4)}
.zt-spd.zt-on{background:var(--ink);color:var(--on-ink)}
#zt-root.zt-onmap:not(.zt-windowed) .zt-ib{background:rgba(14,14,16,.6);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.zt-play .zt-i-play{display:none}
#zt-root.zt-paused .zt-play .zt-i-play{display:block}
#zt-root.zt-paused .zt-play .zt-i-pause{display:none}

/* where you are: the step's name, and a dot for each step. The one you are in is a dash that fills as it plays */
.zt-steps{display:inline-flex;align-items:center;gap:12px;height:44px;padding:0 18px;border-radius:999px;background:var(--field);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);white-space:nowrap}
.zt-step{font:400 13px/1 var(--f-sans);letter-spacing:-.01em;color:var(--tx)}
.zt-dots{display:flex;align-items:center;gap:6px}
.zt-dots i{position:relative;width:4px;height:4px;border-radius:99px;background:var(--tx-4);overflow:hidden;transition:width .5s var(--zt-ease),background .4s}
.zt-dots i.zt-done{background:var(--tx-2)}
.zt-dots i.zt-now{width:22px}
.zt-dots i.zt-now::after{content:'';position:absolute;inset:0;background:var(--tx);transform-origin:0 50%;transform:scaleX(var(--p,0));transition:transform .12s linear}

/* only the player has steps, speed, play and a way out. A full-screen screen has sound, nothing more */
#zt-root:not(.zt-windowed) .zt-steps,#zt-root:not(.zt-windowed) .zt-pts,#zt-root:not(.zt-windowed) .zt-spd,#zt-root:not(.zt-windowed) .zt-skip,
#zt-root.zt-nostep .zt-steps{display:none}
#zt-root.zt-bare .zt-center{opacity:0;pointer-events:none}
/* b16: pause and sound stay at the bottom on every full-screen page, the first run included ("add a pause icon so I can
   just actually pause the whole experience right on the bottom") */
#zt-root.zt-bare .zt-right .zt-replay{display:none}
#zt-root.zt-fullmode .zt-pts,#zt-root.zt-fullmode .zt-steps,#zt-root.zt-fullmode .zt-play,#zt-root.zt-fullmode .zt-spd,#zt-root.zt-fullmode .zt-skip{display:inline-flex}
#zt-root.zt-fullmode .zt-ib{display:grid}

/* ---------- the player's bar ---------- */
#zt-root.zt-windowed:not(.zt-fullmode) .zt-dock{inset:auto;left:96px;top:716px;width:1408px;height:100px}
#zt-root.zt-windowed:not(.zt-fullmode) .zt-dock::before{content:'';position:absolute;left:0;right:0;top:0;height:1px;background:rgba(255,255,255,.07)}
#zt-root.zt-windowed:not(.zt-fullmode) .zt-home{left:26px;top:26px;bottom:auto}
#zt-root.zt-windowed:not(.zt-fullmode) .zt-guide[data-tag="right"] .zt-g-tag{opacity:0}
#zt-root.zt-windowed:not(.zt-fullmode) .zt-center{left:92px;top:0;bottom:auto;transform:none;width:640px;height:100px;min-height:0;place-items:center start}
#zt-root.zt-windowed:not(.zt-fullmode) .zt-cc{background:none;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none;padding:0;border-radius:0;text-align:left;max-width:640px;text-wrap:pretty}
#zt-root.zt-windowed:not(.zt-fullmode) .zt-right{right:26px;top:28px;bottom:auto}

/* ---------- what to do now. In the bar it is a plain line: a waiting dot, the ask, how. No box. ---------- */
.zt-turn{pointer-events:auto;display:flex;align-items:center;gap:12px;white-space:nowrap;font:400 16px/1.2 var(--f-sans);letter-spacing:-.012em;color:var(--tx-2);
  opacity:0;transform:translateY(8px);transition:opacity .28s var(--zt-ease),transform .5s var(--zt-ease)}
.zt-turn.zt-on{opacity:1;transform:none}
#zt-root:not(.zt-windowed):not(.zt-fullmode) .zt-turn{display:none}
.zt-turn .zt-badge{display:inline-flex;align-items:center;gap:10px;color:var(--tx);font-weight:500}
.zt-turn .zt-badge i{width:8px;height:8px;border-radius:50%;background:var(--tx);flex:none;animation:zt-wait 1.4s ease-in-out infinite}
@keyframes zt-wait{50%{opacity:.25;transform:scale(.7)}}
.zt-turn .zt-badge svg{width:15px;height:15px;display:none;color:var(--zt-green)}
.zt-turn.zt-ok .zt-badge i{display:none}
.zt-turn.zt-ok .zt-badge svg{display:block}
.zt-turn .zt-text b{font-weight:500;color:var(--tx)}
.zt-turn kbd{font:500 12px/1 var(--f-sans);color:var(--tx);background:var(--key-dark);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -2px 0 rgba(0,0,0,.5),0 0 0 1px #121413;border-radius:7px;padding:6px 8px 7px;margin:0 2px}
.zt-turn .zt-showme{appearance:none;border:0;cursor:pointer;height:34px;padding:0 13px;border-radius:10px;background:var(--field);color:var(--tx);font:500 13px/1 var(--f-sans);letter-spacing:-.005em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);display:none;transition:background .2s}
.zt-turn .zt-showme:hover{background:#2C2C31}
.zt-turn.zt-nudge .zt-showme{display:block}
#zt-root.zt-fullmode .zt-turn{background:rgba(14,14,16,.78);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);padding:12px 18px;border-radius:16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}

/* ---------- leaving, and the way back ---------- */
.zt-replay{display:none}
#zt-root.zt-exited .zt-replay{position:relative;display:inline-flex;align-items:center;gap:9px;appearance:none;border:0;cursor:pointer;height:44px;padding:0 18px 0 15px;border-radius:14px;
  background:var(--key-light);color:#131315;box-shadow:var(--key-light-sh);font:500 14px/1 var(--f-sans);letter-spacing:-.01em;transition:transform .22s cubic-bezier(.2,.8,.3,1)}
#zt-root.zt-exited .zt-replay svg{width:12px;height:12px;display:block}
#zt-root.zt-exited .zt-replay:hover{transform:translateY(-2px)}
#zt-root.zt-exited .zt-replay:active{transform:translateY(1px)}
.zt-replay i{display:none}

/* paused: a veil over the picture, one click carries on */
#zt-veil{display:none}
#zt-root.zt-windowed.zt-paused:not(.zt-fullmode) #zt-veil{display:grid;place-items:center;position:absolute;z-index:76;left:96px;top:24px;width:1408px;height:692px;

#zt-veil i{width:84px;height:84px;border-radius:50%;background:var(--key-light);color:#131315;display:grid;place-items:center;box-shadow:var(--key-light-sh);transition:transform .22s cubic-bezier(.2,.8,.3,1)}
#zt-veil:hover i{transform:scale(1.05)}
#zt-veil svg{width:30px;height:30px;margin-left:4px}
#zt-veil span{display:none}

/* ---------- the dev control: for reviewing, never part of the product ----------
   A small key in the corner. It opens a stepper and a list of every screen, as the onboarding's does. */
.zt-dev{position:absolute;z-index:95;right:12px;bottom:10px;font-family:var(--f-sans);letter-spacing:-.01em}
.zt-dev-key{appearance:none;border:0;cursor:pointer;height:28px;padding:0 11px;border-radius:999px;background:rgba(28,28,31,.82);color:var(--tx-3);font:400 11.5px/1 var(--f-sans);

.zt-dev-key:hover{color:var(--tx);background:rgba(44,44,49,.9)}
.zt-dev-panel{display:none;position:absolute;right:0;bottom:38px;width:296px;padding:8px;border-radius:18px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line),0 18px 44px rgba(0,0,0,.55)}
.zt-dev.zt-open .zt-dev-panel{display:block}
.zt-dev-bar{display:flex;align-items:center;gap:4px;padding:4px;border-radius:999px;background:var(--wash)}
.zt-dev-nav{appearance:none;border:0;cursor:pointer;width:32px;height:32px;border-radius:999px;background:none;color:var(--tx-3);display:grid;place-items:center;transition:background .2s,color .2s}
.zt-dev-nav:hover{background:var(--field);color:var(--tx)}
.zt-dev-nav svg{width:15px;height:15px}
.zt-dev-nav.zt-flip svg{transform:rotate(180deg)}
.zt-dev-now{flex:1;text-align:center;font:400 12px/1 var(--f-sans);color:var(--tx-2);white-space:nowrap}

.zt-dev-grid button,.zt-dev-row button{appearance:none;border:0;cursor:pointer;height:34px;padding:0 11px;border-radius:10px;background:var(--wash);color:var(--tx-2);font:400 12px/1 var(--f-sans);text-align:left;white-space:nowrap;transition:background .2s,color .2s}
.zt-dev-grid button:hover,.zt-dev-row button:hover{background:var(--field);color:var(--tx)}

/* ch/00-signin.css */
/* 0 · first run of the desktop app: sign in, welcome back with three keys, draw zero.
   One city lies under all three screens (.si-world, drawn live). It is grey on the login, asleep in the dark after
   it, and only takes its colours when the zero opens it. Type and controls are the onboarding's; the keys are the
   made button of the Zero site. */
.ch-signin{background:#0E0E10;color:#F4F4F3;font-family:var(--f-sans);letter-spacing:-.01em;transition:background 1s var(--zt-ease)}
.ch-signin.si-pale{background:#F1F0EC}
.ch-signin.si-through{background:none;transition:none}
.ch-signin.zt-ch{overflow:visible}   /* the city runs out to the window's edge */

/* the city. It holds the picture exactly where the world's camera holds it, so the opening happens in place */
.ch-signin .si-world{position:absolute;left:0;top:0;width:1600px;height:840px;display:block;opacity:0;transition:opacity .7s var(--zt-ease)}
.ch-signin .si-world.si-on{opacity:1}
.ch-signin .si-world.si-out{opacity:0;transition:opacity .42s var(--zt-ease)}
/* no WebGL: a plain grey picture on the login, a plain dark page after it */
.ch-signin .si-fb{position:absolute;left:-236px;top:-192px;width:2080px;height:1169.4px;display:none;filter:grayscale(1) contrast(.45) brightness(1.5);opacity:.3;transition:opacity .9s var(--zt-ease)}
.ch-signin.si-flat .si-fb{display:block}
.ch-signin.si-flat .si-world{display:none}
.ch-signin.si-flat.si-dark .si-fb{opacity:0}

/* one screen at a time */
.ch-signin .si-login,.ch-signin .si-wel,.ch-signin .si-draw{position:absolute;inset:0;opacity:0;pointer-events:none;
  transition:opacity .6s var(--zt-ease),transform .8s var(--zt-ease)}
.ch-signin .si-on{opacity:1;pointer-events:auto}

/* ---------- 1 · the login: the wordmark in the centre, sign in at the bottom ---------- */
.ch-signin .si-login{color:#111113}
.ch-signin.si-dark .si-login{opacity:1;pointer-events:none}
.ch-signin .si-mark{position:absolute;left:0;right:0;top:368px;display:flex;justify-content:center;color:#111113;transform-origin:50% 50%;
  transition:transform 1s var(--zt-ease),color .8s var(--zt-ease),opacity .25s var(--zt-ease)}
.ch-signin .si-mark svg{height:64px;width:auto;display:block}
.ch-signin.si-dark .si-mark{color:#F4F4F3}
.ch-signin .si-mark.si-gone{opacity:0}
.ch-signin .si-foot{position:absolute;left:0;right:0;bottom:66px;display:flex;flex-direction:column;align-items:center;gap:18px;
  transition:opacity .4s var(--zt-ease),transform .6s var(--zt-ease)}
.ch-signin.si-dark .si-foot{opacity:0;transform:translateY(14px);pointer-events:none}
/* the key: a face, a light top edge, a darker bottom edge, a hairline */
.ch-signin .si-google{appearance:none;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;width:330px;height:58px;border-radius:19px;color:#131315;
  font:500 16px/1 var(--f-sans);letter-spacing:-.012em;background:linear-gradient(#FFFFFF,#F1F1EE);
  box-shadow:inset 0 1px 0 #fff,inset 0 -3px 0 rgba(0,0,0,.07),0 0 0 1px rgba(17,17,19,.13),0 18px 30px -16px rgba(17,17,19,.34);
  transition:transform .2s cubic-bezier(.2,.8,.3,1),box-shadow .2s}
.ch-signin .si-google:hover{transform:translateY(-2px)}
.ch-signin .si-google:active{transform:translateY(1px);box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(0,0,0,.07),0 0 0 1px rgba(17,17,19,.13),0 8px 14px -10px rgba(17,17,19,.34)}
.ch-signin .si-g{display:grid}
.ch-signin .si-g svg{width:20px;height:20px;display:block}
.ch-signin .si-spin{display:none;width:20px;height:20px;border-radius:50%;border:2px solid rgba(20,17,15,.16);border-top-color:#14110f;animation:si-spin .9s linear infinite}
@keyframes si-spin{to{transform:rotate(360deg)}}
.ch-signin .si-google.si-busy{pointer-events:none}
.ch-signin .si-google.si-busy .si-g{display:none}
.ch-signin .si-google.si-busy .si-spin{display:block}
.ch-signin .si-legal{margin:0;font:400 12.5px/1.4 var(--f-sans);letter-spacing:-.005em;color:rgba(17,17,19,.5)}
.ch-signin .si-legal u{text-underline-offset:2px;text-decoration-color:rgba(17,17,19,.25)}

/* ---------- 2 · welcome back: the line he is saying, and three keys ---------- */
.ch-signin .si-wel{display:flex;flex-direction:column;align-items:center;transform:translateY(10px)}
.ch-signin .si-wel.si-on{transform:none}
.ch-signin .si-slot{flex:none;margin-top:238px;width:64px;height:64px;border-radius:50%}
.ch-signin .si-q{margin:30px 0 0;min-height:78px;max-width:660px;font:400 34px/1.14 var(--f-serif);letter-spacing:-.03em;text-align:center;text-wrap:balance;color:#F4F4F3}
.ch-signin .si-q span{display:inline-block;opacity:0;transform:translateY(12px);filter:blur(6px);transition:opacity .5s var(--zt-ease),transform .6s var(--zt-ease),filter .5s var(--zt-ease)}
.ch-signin .si-q.si-in span{opacity:1;transform:none;filter:none}
.ch-signin .si-q:not(.si-in) span{transition-delay:0s!important;transition-duration:.25s}

.ch-signin .si-perms{display:flex;gap:44px;margin-top:46px}
.ch-signin .si-perm{appearance:none;border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:14px;color:#77777E;
  opacity:0;transform:translateY(16px) scale(.92);transition:opacity .45s var(--zt-ease),transform .62s var(--zt-ease)}
.ch-signin .si-perms.si-in .si-perm{opacity:1;transform:none}
.ch-signin .si-perms.si-in .si-perm:nth-child(2){transition-delay:.08s}
.ch-signin .si-perms.si-in .si-perm:nth-child(3){transition-delay:.16s}
.ch-signin .si-perms.si-away .si-perm{opacity:0;transform:translateY(-10px) scale(.96);transition-delay:0s;pointer-events:none}
/* the key: a face, a light top edge, a dark bottom edge, a hairline. Pressing it sets it down */
.ch-signin .si-key{position:relative;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;color:#F4F4F3;
  background:linear-gradient(#2B2B2F,#1B1B1E);box-shadow:inset 0 1px 0 rgba(255,255,255,.13),inset 0 -3px 0 rgba(0,0,0,.45),0 0 0 1px #08080A,0 16px 26px -14px rgba(0,0,0,.7);
  transition:transform .2s cubic-bezier(.2,.8,.3,1),background .3s,color .3s,box-shadow .3s}
.ch-signin .si-key>svg{width:27px;height:27px;display:block}
.ch-signin .si-perm:hover .si-key{transform:translateY(-2px)}
.ch-signin .si-perm:active .si-key{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 -1px 0 rgba(0,0,0,.45),0 0 0 1px #08080A,0 6px 12px -8px rgba(0,0,0,.7)}
.ch-signin .si-perm b{font:400 12.5px/1 var(--f-sans);letter-spacing:-.005em;transition:color .3s}
/* asking: a thin arc turns round the key */
.ch-signin .si-key::after{content:'';position:absolute;inset:-7px;border-radius:50%;border:1.5px solid transparent;border-top-color:#F4F4F3;opacity:0;transition:opacity .2s}
.ch-signin .si-wait .si-key::after{opacity:.8;animation:si-spin .8s linear infinite}
.ch-signin .si-wait{pointer-events:none}
/* on: the key turns to light, and a small tick sits on its shoulder. A key can be switched off again, and asked again */
.ch-signin .si-ok .si-key{background:linear-gradient(#FFFFFF,#EDEDEA);color:#131315;box-shadow:inset 0 1px 0 #fff,inset 0 -3px 0 rgba(0,0,0,.1),0 0 0 1px rgba(0,0,0,.5),0 16px 26px -14px rgba(0,0,0,.7)}
.ch-signin .si-ok b{color:#F4F4F3}
.ch-signin .si-key i{position:absolute;right:-3px;top:-3px;width:24px;height:24px;border-radius:50%;background:#131315;color:#F4F4F3;display:grid;place-items:center;
  box-shadow:0 0 0 2px #0E0E10;transform:scale(0);transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.ch-signin .si-key i svg{width:12px;height:12px}
.ch-signin .si-ok .si-key i{transform:none}
.ch-signin .si-no .si-key{color:#77777E}
/* b14: not allowed yet. The key rests a step back (no lift, a quieter face), its icon is grey and slashed, its name is grey.
   Allowed: the slash draws out as the key turns to light. Off for now: the slash draws back in */
.ch-signin .si-perm:not(.si-ok) .si-key{color:#8E8E95;background:linear-gradient(#242427,#19191C);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),inset 0 -2px 0 rgba(0,0,0,.4),0 0 0 1px #08080A,0 10px 18px -12px rgba(0,0,0,.6)}
.ch-signin .si-perm:not(.si-ok):hover .si-key{color:#C9C9CE}
.ch-signin .si-key .si-cut,.ch-signin .si-key .si-slash{fill:none;stroke-linecap:round;stroke-dasharray:23;stroke-dashoffset:0;transition:stroke-dashoffset .38s cubic-bezier(.2,.8,.3,1)}
.ch-signin .si-key .si-cut{stroke:#1F1F22;stroke-width:4.4}
.ch-signin .si-key .si-slash{stroke:currentColor;stroke-width:1.7}
.ch-signin .si-ok .si-key .si-cut,.ch-signin .si-ok .si-key .si-slash{stroke-dashoffset:23}
.ch-signin .si-ok .si-key .si-cut{stroke:#F6F6F4}

/* ---------- the launch: the app's loader, before the sign in ---------- */
/* while it plays, the wordmark and the key wait below their places, and rise when the city has settled */
.ch-signin.si-pre .si-mark,.ch-signin.si-pre .si-foot{opacity:0;transform:translateY(14px)}
/* the blueprint on the loader's own green, from the first paint until the reveal layer draws (MapRevealLoader) */
.ch-signin .si-boot{position:absolute;left:calc(-1*var(--zt-bx,0px));top:calc(-1*var(--zt-by,0px));width:calc(100% + 2*var(--zt-bx,0px));height:calc(100% + 2*var(--zt-by,0px));
  background:#0a3d33;overflow:hidden;display:none;pointer-events:none}
.ch-signin.si-pre .si-boot{display:block}
.ch-signin .si-boot.si-gone{display:none}
.ch-signin .si-boot img{position:absolute;left:calc(var(--zt-bx,0px) - 236px);top:calc(var(--zt-by,0px) - 192px);width:2080px;height:1169.4px;display:block}

/* ---------- 3 · draw zero (NewFtuxFlow styles/draw.css, its dark palette) ---------- */
.ch-signin .si-page{position:absolute;left:calc(-1*var(--zt-bx,0px));top:calc(-1*var(--zt-by,0px));width:calc(100% + 2*var(--zt-bx,0px));height:calc(100% + 2*var(--zt-by,0px));background:#0E0E10;display:none}
.ch-signin.si-flat .si-page{display:block}
.ch-signin.si-through .si-page{display:none}
.ch-signin.si-through .si-draw{pointer-events:none}
/* the drawing layer: the ink, the guide, the hint */
.ch-signin .si-dl{position:absolute;left:0;top:0;width:1600px;height:840px;transition:opacity .3s ease}
.ch-signin .si-dl.si-gone{opacity:0}
.ch-signin .si-ink{position:absolute;left:0;top:0;width:1600px;height:840px;display:block;touch-action:none}
.ch-signin .si-hint{position:absolute;left:0;right:0;top:387px;text-align:center;font:500 18px/1.4 var(--f-sans);letter-spacing:-.01em;color:#A6A6AC;pointer-events:none;
  transition:opacity .28s ease,transform .28s ease}
.ch-signin .si-hint.si-gone{opacity:0;transform:translateY(-10px)}
/* the guide: the comet, drawn every frame (its trail fades in behind a bright ball) */
.ch-signin .si-comet{position:absolute;left:0;top:0;width:1600px;height:840px;display:block;pointer-events:none;opacity:0;transition:opacity .45s ease}
.ch-signin .si-comet.si-show{opacity:1}
/* the reveal layer and its plain stand-in, over everything (sized and placed from JS) */
.ch-signin .si-rv{position:absolute;left:0;top:0;width:1600px;height:840px;display:block;opacity:0;pointer-events:none}
.ch-signin .si-rvf{position:absolute;left:-236px;top:-192px;width:2080px;height:1169.4px;display:none;opacity:0;pointer-events:none}
.ch-signin .si-rvf img{position:absolute;left:0;top:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}

@media (prefers-reduced-motion:reduce){.ch-signin .si-mark{transition-duration:.01s}.ch-signin .si-comet{transition:none}}

/* ch/02-world.css */
/* The world. One screen, mounted once and kept: the learner's home, the backdrop behind the
   pop-up, and the place the first scenario is started from. Two chapters run on it (world, start).
   The map lives in .wd-cam (2080 x 1169.4, the city at 130%). Everything on the map is placed in
   percent of that box, so it rides the camera: wide (drift) -> wd-zoom (on Airbnb) -> wd-go (into it).
   What is showing is a set of classes on the root: wd-on-roles, wd-on-road, wd-on-meter, wd-on-link,
   wd-on-apply. The class is the state, the motion is decoration. */
.ch-world{background:#131514;color:#f2f1ee;font-family:var(--f-sans);letter-spacing:-.01em}
/* a state that is set, not played: the backdrop behind the pop-up, and the way back in */
.ch-world.wd-still *,.ch-world.wd-still *::before,.ch-world.wd-still *::after{transition:none!important}

/* ---------- the camera ----------
   .wd-map holds the map one pixel inside the screen. While the camera moves the map is its own layer,

   that pixel dark instead of a bright seam beside the letterbox. */
.ch-world.zt-ch{overflow:visible}
.ch-world .wd-map{position:absolute;left:calc(1px - var(--zt-bx,0px));top:calc(1px - var(--zt-by,0px));right:calc(1px - var(--zt-bx,0px));bottom:calc(1px - var(--zt-by,0px));overflow:hidden}

  transform:translate(-236px,-192px)}

.ch-world .wd-city{position:absolute;left:0;top:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}

.ch-world .wd-detail{position:absolute;left:39.0625%;top:40.7986%;width:41.5039%;height:39.0625%;display:block;opacity:0;
  user-select:none;-webkit-user-drag:none;transition:opacity .5s var(--zt-ease) .4s;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent),linear-gradient(180deg,transparent,#000 8%,#000 92%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent),linear-gradient(180deg,transparent,#000 8%,#000 92%,transparent);
  -webkit-mask-composite:source-in;mask-composite:intersect}

/* ---------- the scenarios, as a road through the city ----------

   and each stop lands as the line reaches it (the delays come from the path, see the module). */

/* which side of its point a name hangs on, so it covers the least of the city and never the road */

/* ---------- the Airbnb building: the one to start. The box takes in its stop and its name ---------- */
.ch-world .wd-hit{position:absolute;left:52.3%;top:55.5%;width:7.6%;height:13.8%;z-index:3;appearance:none;border:0;padding:0;margin:0;
  border-radius:30px;background:rgba(255,255,255,0);cursor:pointer;pointer-events:none;transition:background .2s var(--zt-ease),box-shadow .2s var(--zt-ease)}

.ch-world .wd-beam{position:absolute;left:var(--wd-gx);top:var(--wd-gy);width:80px;height:266px;margin:-266px 0 0 -40px;z-index:2;pointer-events:none;
  opacity:0;transform-origin:50% 100%;transform:scaleY(.55);
  background:linear-gradient(90deg,transparent 38%,rgba(245,255,249,.46) 50%,transparent 62%),
    linear-gradient(90deg,transparent 26%,rgba(255,255,255,.26) 50%,transparent 74%),
    linear-gradient(90deg,transparent 4%,rgba(255,255,255,.12) 24%,rgba(255,255,255,.3) 50%,rgba(255,255,255,.12) 76%,transparent 96%);

  transition:opacity .6s var(--zt-ease),transform .9s var(--zt-ease)}

/* flashing: the first stop beats until it is clicked */

.ch-world.wd-flash .wd-stop-go::before,.ch-world.wd-flash .wd-stop-go::after{content:'';position:absolute;left:0;top:0;width:100%;height:100%;border-radius:50%;

/* the close-up uses the landing's own glass dot instead of the numbered stop */
.ch-world .wd-pin{position:absolute;left:var(--wd-gx);top:var(--wd-gy);width:19.7px;height:19.7px;margin:-9.85px 0 0 -9.85px;border-radius:50%;z-index:4;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 38% 30%,rgba(255,255,255,.6),rgba(255,255,255,.28) 70%);

    linear-gradient(0deg,rgba(19,21,20,.88) 0,rgba(19,21,20,.56) 76px,rgba(19,21,20,0) 196px),

.ch-world .wd-roles{position:absolute;right:28px;top:110px;width:372px;border-radius:28px;padding:20px 20px 18px;

  opacity:0;transform:translateY(5px);transition:opacity .4s var(--zt-ease) .1s,transform .5s var(--zt-ease) .1s}

/* b14: the app's own skill points star, in the meter and beside each role's number. A role that is not near yet shows it grey */

  color:rgb(244,242,239);font:500 12px/1 var(--f-sans);white-space:nowrap;opacity:0;transform:translateY(-50%) scale(.9);transition:opacity .35s var(--zt-ease),transform .45s var(--zt-ease)}

/* 3 · kickoff, inside the pop-up (b16). The canvas is the app window: 1600 x 786 is on screen.
   The landing: the kickoff's white card on the blurred ground, the whole brief centred with no labels: the company, the title,
   the time and level, the description, the tools, the skills, the manager, Join Now.
   The meeting: the slide fills the stage (30 from every edge), the presenter's face is a small round bubble at its bottom left,
   as a screen share shows it, and b4's notes panel stands on the right. Text with no font class inherits Google Sans Flex. */
.ch-kickoff{background:#1B1815;color:#000;letter-spacing:0;
