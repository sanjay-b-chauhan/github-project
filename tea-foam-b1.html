<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tea® Foam</title>
<style>
:root{--cream:#EAE4D4;--red:#EA2201;--deep:#3C0D00;--rust:#7B1500;--dim:#8A7F6B}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--cream);font-family:ui-monospace,"SF Mono",Menlo,monospace;
     -webkit-user-select:none;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;display:block}
.hud{position:fixed;z-index:5;pointer-events:none}
.brand{top:28px;left:32px}
.brand h1{font-family:Georgia,"Times New Roman",serif;font-weight:600;
  font-size:44px;line-height:1;color:var(--red);letter-spacing:-.01em}
.brand h1 sup{font-size:.42em;vertical-align:.62em;font-weight:400}
.brand p{margin-top:8px;font-size:10px;letter-spacing:.14em;color:var(--dim)}
.tag{bottom:30px;right:32px;font-size:10px;letter-spacing:.14em;color:var(--deep)}
.hint{bottom:96px;left:50%;transform:translateX(-50%);font-size:10px;
  letter-spacing:.14em;color:var(--dim);transition:opacity .8s}
.ctl{position:fixed;z-index:6;bottom:24px;left:32px;display:flex;align-items:center;gap:14px}
.ctl label{font-size:10px;letter-spacing:.14em;color:var(--red)}
.ctl output{font-size:10px;letter-spacing:.14em;color:var(--deep);min-width:118px}
.ctl output b{color:var(--red);font-weight:400}
input[type=range]{-webkit-appearance:none;appearance:none;width:min(240px,34vw);height:22px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--deep);opacity:.9}
input[type=range]::-moz-range-track{height:2px;background:var(--deep)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:var(--red);margin-top:-7px;border:none}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--red);border:none}
@media (max-width:640px){.brand h1{font-size:34px}.tag{display:none}.ctl{left:20px;bottom:20px}.brand{top:20px;left:20px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud brand"><h1>Tea<sup>&#174;</sup></h1><p>FOAM &#183; ONE VARIABLE, WHOLE SURFACE</p></div>
<div class="hud tag">BOILED. NOT BREWED.</div>
<div class="hud hint" id="hint">TAP TO POP &#183; DRAG TO STIR</div>
<div class="ctl">
  <label for="heat">HEAT</label>
  <input id="heat" type="range" min="100" max="108" step="0.1" value="102">
  <output id="read"></output>
</div>
<script>
(()=>{
"use strict";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const heatEl=document.getElementById('heat'),readEl=document.getElementById('read'),hintEl=document.getElementById('hint');
let W=0,H=0,DPR=1,CX=0,CY=0,R=0;
const TAU=Math.PI*2,rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);

function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CX=W/2;CY=H/2+8;R=Math.min(W,H)*0.345;
}
addEventListener('resize',resize);resize();

// ---------- state ----------
let heat=parseFloat(heatEl.value);           // 100..108
const heatT=()=>(heat-100)/8;                // 0..1
const VERBS=[[100,'CUT'],[102,'BOILED'],[104,'BLED'],[106,'BROKEN'],[108,'CRACKED']];
function verb(){let v=VERBS[0][1];for(const[t,n]of VERBS)if(heat>=t-0.05)v=n;return v}
function readout(){readEl.innerHTML=heat.toFixed(1).replace(/\.0$/,'')+'&#176; &#183; <b>'+verb()+'</b>'}
heatEl.addEventListener('input',()=>{heat=parseFloat(heatEl.value);readout()});
readout();

const bubbles=[],ripples=[],flecks=[],stirs=[];
let flow={x:0,y:0},milkA=0,skew={x:0,y:0},spawnAcc=0,interacted=false,t0=performance.now(),steamSeed=rnd(1000);

function spawnBubble(edgeBias){
  if(bubbles.length>320)return;
  const a=rnd(TAU);
  const edge=edgeBias!==undefined?edgeBias:(Math.random()<0.55);
  const d=edge?R*rnd(0.80,0.94):R*Math.sqrt(Math.random())*0.82;
  bubbles.push({
    x:CX+Math.cos(a)*d, y:CY+Math.sin(a)*d,
    vx:0, vy:0,
    r:rnd(1.5,3), tr:rnd(3.5,edge?10:22),        // target radius
    z:1,                                          // depth: 1 = deep, 0 = surfaced
    zr:rnd(0.5,1.4),                              // rise speed
    age:0, wob:rnd(TAU)
  });
}
for(let i=0;i<120;i++){spawnBubble();const b=bubbles[bubbles.length-1];b.z=Math.random()*0.4;b.r=b.tr*rnd(0.5,1)}

function pop(b,big){
  const n=big?10:6;
  for(let i=0;i<n;i++){const a=rnd(TAU),s=rnd(0.4,1);
    flecks.push({x:b.x+Math.cos(a)*b.r*0.6,y:b.y+Math.sin(a)*b.r*0.6,
      vx:Math.cos(a)*60*s,vy:Math.sin(a)*60*s,r:rnd(0.8,2.2),life:rnd(0.35,0.7)});}
  ripples.push({x:b.x,y:b.y,r:b.r*0.8,life:0.9,max:b.r*3.2+18});
  // neighbours flinch away, then foam re-closes on its own
  for(const o of bubbles){if(o===b)continue;
    const dx=o.x-b.x,dy=o.y-b.y,d=Math.hypot(dx,dy);
    if(d<b.r+o.r+30&&d>0.01){const f=90*(1-d/(b.r+o.r+30));o.vx+=dx/d*f;o.vy+=dy/d*f}}
  const i=bubbles.indexOf(b);if(i>=0)bubbles.splice(i,1);
}

// ---------- input ----------
const ptr={down:false,x:0,y:0,px:0,py:0,dx:0,dy:0,dT:0,moved:0};
function toXY(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener('pointerdown',e=>{
  const p=toXY(e);ptr.down=true;ptr.moved=0;ptr.dT=performance.now();
  ptr.x=ptr.px=ptr.dx=p.x;ptr.y=ptr.py=ptr.dy=p.y;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',e=>{
  if(!ptr.down)return;
  const p=toXY(e);
  const mx=p.x-ptr.x,my=p.y-ptr.y;
  ptr.moved+=Math.hypot(mx,my);
  ptr.px=ptr.x;ptr.py=ptr.y;ptr.x=p.x;ptr.y=p.y;
  stirs.push({x:p.x,y:p.y,vx:mx*22,vy:my*22,life:0.5});
  flow.x+=mx*0.35;flow.y+=my*0.35;
  if(!interacted){interacted=true;hintEl.style.opacity=0}
});
cv.addEventListener('pointerup',e=>{
  if(!ptr.down)return;ptr.down=false;
  const dur=performance.now()-ptr.dT;
  if(ptr.moved<7&&dur<350){                       // a tap: pop the bubble under it
    let hit=null;
    for(const b of bubbles){if(b.z>0.35)continue;
      const d=Math.hypot(b.x-ptr.x,b.y-ptr.y);
      if(d<Math.max(b.r+6,14)&&(!hit||b.r>hit.r))hit=b}
    if(hit)pop(hit,hit.r>12);
    else ripples.push({x:ptr.x,y:ptr.y,r:4,life:0.6,max:26});
    if(!interacted){interacted=true;hintEl.style.opacity=0}
  }
});

// ---------- simulation ----------
function step(dt){
  const h=heatT();
  // nucleation
  spawnAcc+=dt*(2.5+h*22);
  while(spawnAcc>1){spawnAcc-=1;spawnBubble(h>0.55?Math.random()<0.35:undefined)}
  // slosh spring
  flow.x*=Math.exp(-2.6*dt);flow.y*=Math.exp(-2.6*dt);
  skew.x+=( -flow.x*0.16 - skew.x)*Math.min(1,dt*5);
  skew.y+=( -flow.y*0.16 - skew.y)*Math.min(1,dt*5);
  milkA+=dt*(0.05+h*0.25)+ (Math.abs(flow.x)+Math.abs(flow.y))*dt*0.004;
  for(let i=stirs.length-1;i>=0;i--){stirs[i].life-=dt;if(stirs[i].life<=0)stirs.splice(i,1)}

  const jit=6+h*46;
  for(const b of bubbles){
    b.age+=dt;b.wob+=dt*rnd(1.5,3);
    // rise from depth
    if(b.z>0){b.z-=dt*b.zr*(0.5+h*1.2);if(b.z<=0){b.z=0;
      ripples.push({x:b.x,y:b.y,r:b.r*0.6,life:0.35,max:b.r*1.6+6})}}
    // grow toward target
    if(b.r<b.tr)b.r+=dt*(1.5+h*4);
    // simmer jitter
    b.vx+=(Math.random()-0.5)*jit*dt*2;
    b.vy+=(Math.random()-0.5)*jit*dt*2;
    // global slosh advection
    b.vx+=flow.x*dt*2.4;b.vy+=flow.y*dt*2.4;
    // stirs
    for(const s of stirs){
      const dx=b.x-s.x,dy=b.y-s.y,d2=dx*dx+dy*dy,rad=130;
      if(d2<rad*rad){const f=(1-Math.sqrt(d2)/rad)*s.life*2;
        b.vx+=s.vx*f*dt*6;b.vy+=s.vy*f*dt*6}}
  }
  // pairwise cohesion + separation (surface tension)
  for(let i=0;i<bubbles.length;i++){const a=bubbles[i];if(a.z>0.5||a.dead)continue;
    for(let j=i+1;j<bubbles.length;j++){const c=bubbles[j];if(c.z>0.5||c.dead)continue;
      const dx=c.x-a.x,dy=c.y-a.y,sum=a.r+c.r;
      if(Math.abs(dx)>sum+22||Math.abs(dy)>sum+22)continue;
      const d=Math.hypot(dx,dy)||0.01,nx=dx/d,ny=dy/d;
      if(d<sum*0.97){                    // separate
        const f=(sum*0.97-d)*14;
        a.vx-=nx*f*dt;a.vy-=ny*f*dt;c.vx+=nx*f*dt;c.vy+=ny*f*dt;
        // merge: big absorbs small on deep overlap (flag now, sweep after)
        if(d<sum*0.5&&Math.min(a.r,c.r)<7&&Math.max(a.r,c.r)>10){
          const big=a.r>c.r?a:c,small=a.r>c.r?c:a;
          if(!big.dead&&!small.dead){
            big.tr=Math.min(26,Math.hypot(big.r,small.r));
            small.dead=true}}
      }else if(d<sum+20){                // cohere into rafts
        const f=(1-(d-sum)/20)*10;
        a.vx+=nx*f*dt;a.vy+=ny*f*dt;c.vx-=nx*f*dt;c.vy-=ny*f*dt}
    }}
  // sweep merged bubbles, then integrate, damp, contain
  for(let i=bubbles.length-1;i>=0;i--)if(bubbles[i].dead)bubbles.splice(i,1);
  for(let i=bubbles.length-1;i>=0;i--){const b=bubbles[i];
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    b.vx*=Math.exp(-2.4*dt);b.vy*=Math.exp(-2.4*dt);
    const dx=b.x-CX,dy=b.y-CY,d=Math.hypot(dx,dy),lim=R*0.955-b.r;
    if(d>lim){const f=(d-lim);b.x-=dx/d*f;b.y-=dy/d*f;
      b.vx-=dx/d*f*3*dt;b.vy-=dy/d*f*3*dt}
    // spontaneous pops at a boil
    if(b.z===0&&b.r>17&&Math.random()<h*0.25*dt)pop(b,true);
    else if(b.z===0&&b.age>rnd(24,40)&&Math.random()<0.2*dt)pop(b,false);
  }
  for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];
    r.life-=dt;r.r+=(r.max-r.r)*dt*5;if(r.life<=0)ripples.splice(i,1)}
  for(let i=flecks.length-1;i>=0;i--){const f=flecks[i];
    f.life-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=0.92;f.vy*=0.92;
    if(f.life<=0)flecks.splice(i,1)}
}

// ---------- render ----------
function draw(now){
  const h=heatT();
  ctx.fillStyle='#EAE4D4';ctx.fillRect(0,0,W,H);
  // warm shadow under the cup (burnt umber, never neutral)
  ctx.save();ctx.translate(CX+16,CY+22);
  ctx.fillStyle='rgba(60,13,0,0.16)';
  ctx.beginPath();ctx.ellipse(0,0,R*1.10,R*1.06,0,0,TAU);ctx.fill();ctx.restore();
  // vermillion rim
  ctx.fillStyle='#EA2201';
  ctx.beginPath();ctx.arc(CX,CY,R*1.09,0,TAU);ctx.fill();
  ctx.fillStyle='#C4300A';
  ctx.beginPath();ctx.arc(CX,CY,R*1.015,0,TAU);ctx.fill();

  // ----- liquid, clipped -----
  ctx.save();
  ctx.beginPath();ctx.arc(CX,CY,R,0,TAU);ctx.clip();
  const lx=CX+skew.x,ly=CY+skew.y;
  const dark=0.0+h*0.5;
  const g=ctx.createRadialGradient(lx-R*0.25,ly-R*0.3,R*0.1,CX,CY,R*1.05);
  g.addColorStop(0,`rgb(${196-dark*26},${129-dark*22},${74-dark*16})`);
  g.addColorStop(0.62,`rgb(${162-dark*24},${100-dark*18},${52-dark*12})`);
  g.addColorStop(1,'#6E3E1B');
  ctx.fillStyle=g;ctx.fillRect(CX-R,CY-R,R*2,R*2);
  // milk veins, advected by the stir
  ctx.save();ctx.translate(CX+skew.x*1.6,CY+skew.y*1.6);ctx.rotate(milkA);
  ctx.filter='blur(7px)';ctx.strokeStyle='rgba(240,224,196,0.20)';ctx.lineCap='round';
  for(let i=0;i<3;i++){ctx.lineWidth=R*(0.08+i*0.02);
    ctx.beginPath();
    ctx.arc(0,0,R*(0.30+i*0.20),i*2.1+milkA*0.2,i*2.1+milkA*0.2+2.2-i*0.4);
    ctx.stroke()}
  ctx.filter='none';ctx.restore();
  // slosh highlight
  ctx.save();ctx.filter='blur(14px)';
  ctx.fillStyle='rgba(246,233,210,0.10)';
  ctx.beginPath();ctx.ellipse(lx-R*0.28,ly-R*0.34,R*0.42,R*0.30,-0.5,0,TAU);ctx.fill();
  ctx.restore();

  // deep bubbles first (still rising)
  for(const b of bubbles)if(b.z>0)drawBubble(b);
  for(const b of bubbles)if(b.z===0)drawBubble(b);

  // ripples
  for(const r of ripples){
    ctx.strokeStyle=`rgba(246,233,210,${0.5*r.life})`;
    ctx.lineWidth=1.4;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,TAU);ctx.stroke()}
  // flecks
  for(const f of flecks){
    ctx.fillStyle=`rgba(246,233,210,${Math.min(0.8,f.life*1.4)})`;
    ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,TAU);ctx.fill()}
  ctx.restore();

  // rim lip highlight
  ctx.strokeStyle='rgba(246,233,210,0.35)';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(CX,CY,R*1.075,-2.4,-0.6);ctx.stroke();

  // steam
  const sA=0.03+h*0.13;
  ctx.save();ctx.filter='blur(6px)';ctx.lineCap='round';
  for(let i=0;i<3;i++){
    const ph=now*0.0004*(1+i*0.3)+steamSeed+i*2.4;
    const bx=CX+(i-1)*R*0.34;
    ctx.strokeStyle=`rgba(240,228,206,${sA*(1-i*0.2)})`;
    ctx.lineWidth=16+i*8;
    ctx.beginPath();
    for(let k=0;k<=12;k++){const s=k/12;
      const y=CY-R*0.5-s*(H*0.4),x=bx+Math.sin(ph+s*5)*R*0.12*(0.4+s);
      k===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}
    ctx.stroke()}
  ctx.restore();
}
function drawBubble(b){
  const surf=b.z===0,sc=surf?1:(1-b.z*0.55),al=surf?1:(1-b.z)*0.65+0.05,r=b.r*sc;
  if(r<0.6)return;
  const wob=surf?Math.sin(b.wob)*0.06:0;
  ctx.save();ctx.globalAlpha=al;
  const g=ctx.createRadialGradient(b.x-r*0.35,b.y-r*0.4,r*0.1,b.x,b.y,r*(1+wob));
  g.addColorStop(0,'rgba(216,164,108,0.95)');
  g.addColorStop(0.7,'rgba(150,92,46,0.95)');
  g.addColorStop(1,'rgba(96,54,24,0.98)');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(b.x,b.y,r*(1+wob),0,TAU);ctx.fill();
  ctx.strokeStyle='rgba(60,13,0,0.30)';ctx.lineWidth=Math.min(1.4,r*0.14);
  ctx.stroke();
  if(surf&&r>3){
    ctx.fillStyle='rgba(253,246,231,0.55)';
    ctx.beginPath();ctx.arc(b.x-r*0.34,b.y-r*0.4,Math.max(0.7,r*0.16),0,TAU);ctx.fill()}
  ctx.restore();
}

// ---------- loop ----------
let last=performance.now();
function frame(now){
  const dt=Math.min(0.033,(now-last)/1000);last=now;
  step(dt);draw(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
